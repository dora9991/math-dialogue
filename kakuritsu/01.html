          TX(D, Q.cx, y, '赤玉が出る確率 [5/12]', { col: C.chalk, size: sz, maxW: Q.w });
          if (t > .05) TX(D, Q.cx, y + lh, '赤玉　24×[5/12]＝10（個）', { col: C.pink, a: sm(.05, .2, t), size: sz, maxW: Q.w });
          if (t > .36) {
            var tot = 24 + x, a2 = sm(.36, .45, t);
            TX(D, Q.cx, y + lh * 2, '白玉を ' + x + '個 入れる', { col: C.yel, a: a2, size: sz, maxW: Q.w });
            TX(D, Q.cx, y + lh * 3, '[10/' + tot + ']' + (x === 6 ? '＝[1/3]' : ''), { col: x === 6 ? C.yel : C.chalk, a: a2, size: sz * 1.15 });
          }
          if (t > .85) TX(D, Q.cx, y + lh * 4.2, '白玉を 6個 → 全体 30個', { col: C.orange, a: sm(.85, 1, t), size: sz, maxW: Q.w });
        } }
    ])
  });
})();
</script>
