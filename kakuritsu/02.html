/* 確率 第2時：起こりうる場合を数えて、確率を求めよう（ikkan の lesson_kakuritsu_02 と同じ流れ）。

   ことばは、あてはまる目の数 a が 0 から 6 までふえると、確率の点が 0 から 1 まで動く（0≦p≦1）。例題は ア 6以下・イ 7・ウ 5 の目を数直線に。

   チャレンジは 20枚のカードで、n＝5・6・7 の倍数を順に光らせる。
   データはすべて自作（シミュレーションは CH.rng。はじめの10個は捨てる）。答えは、起こりうる場合を全部数え上げて、ページの中で確かめている（CH.check）。 */
(function () {

    CH.card(D, x, y, s, s, '', { col: col, fill: o.fill || 'rgba(242,240,230,.12)', sw: Math.max(1.4, s * .05), a: o.a });

    CH.circle(D, x, y, r, { fill: ha(col, .22), stroke: col, sw: Math.max(1.4, r * .09), a: o.a });
    CH.circle(D, x, y, r * .76, { stroke: ha(col, .55), sw: 1, a: o.a });
