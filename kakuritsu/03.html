<script>
/* 確率 第3時：樹形図を使って、落ちや重なりなく数えよう（ikkan の lesson_kakuritsu_03 と同じ流れ）。
   今日の問いは、A・B・C の3人が 左・中・右の席で、ならび方を次々に入れかえる。答えでは、左はし → まん中 → 右はしの順に、樹形図の枝が1本ずつのびて 6通り。
   ことばは、段ごとに 3通り・2通り・1通り（3×2×1＝6）。例題は 3枚の硬貨（8通り、2枚が表の 3通りが光る）と、1〜4 のカードの 2けたの整数（4の倍数 3通り）。
   考えようは、4人から 2人の係を選ぶ樹形図（1人目・2人目の順）で、道すじを1本ずつ選んで、係になる 2人を見る（何通りかは出さない）。
   チャレンジは 3人のじゃんけん：A の手ごとに B×C の表を3つ並べ、あいこ（3人とも同じ・3人ともちがう）が光る。
   データはすべて自作。答えは、起こりうる場合を全部書き出して数え、ページの中で確かめている（CH.check）。 */
(function () {
  /* ---- 道具（確率の黒板 第1〜8時で共通。どのページにも同じものを入れてある） ---- */
  var C = CH.C, OUT = 'rgba(20,40,30,.9)', DIM = 'rgba(242,240,230,.6)', GRAY = '#7d8a84', AC = C.blue, BC = C.pink;

  var NUMF = '"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';
  var sm = CH.smooth, clamp = CH.clamp, lerp = CH.lerp;
  function ha(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  /* 数える道具：起こりうる場合を、全部書き出して数える */

  /* 問い・答え・板書（HTML）の [1/2] を、たての分数に */

  function TX(D, x, y, s, o) {
    o = o || {}; var size = o.size || CH.fs(D);
    if (o.maxW) size = Math.min(size, size * o.maxW / Math.max(1, TW(D, s, size)));
    var fz = size * .72, w = TW(D, s, size), x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, oo = { col: o.col, a: o.a, outline: o.outline };
    parse(s).forEach(function (p) {
      var pw = segW(D, p, size);

  /* いくつかの行を、四角の中に（行の配列。分数つきでもよい） */
  function lines(D, x, y, arr, o) { o = o || {}; var size = o.size || CH.fs(D), lh = size * (o.lh || 1.9); arr.forEach(function (t, i) { if (t == null) return; var c = Array.isArray(t) ? t : [t, o.col]; TX(D, x, y + i * lh, c[0], ext(ext({}, o), { col: c[1] || o.col, size: size })); }); return lh * arr.length; }

  /* さいころ（目 n）・硬貨（表・裏）・玉・くじ・人 */
  var PIP = { 1: [[.5, .5]], 2: [[.27, .27], [.73, .73]], 3: [[.27, .27], [.5, .5], [.73, .73]], 4: [[.27, .27], [.73, .27], [.27, .73], [.73, .73]], 5: [[.27, .27], [.73, .27], [.5, .5], [.27, .73], [.73, .73]], 6: [[.27, .22], [.73, .22], [.27, .5], [.73, .5], [.27, .78], [.73, .78]] };
  function die(D, x, y, s, n, o) {
    o = o || {}; var col = o.col || C.chalk;
    if (o.glow) CH.card(D, x, y, s * 1.2, s * 1.2, '', { col: o.glow, fill: ha(o.glow, .3), sw: 3, a: o.a });
    CH.card(D, x, y, s, s, '', { col: col, fill: o.fill || 'rgba(242,240,230,.12)', sw: Math.max(1.4, s * .05), a: o.a });
    (PIP[n] || []).forEach(function (p) { CH.circle(D, x + (p[0] - .5) * s, y + (p[1] - .5) * s, s * .085, { fill: n === 1 ? C.pink : col, a: o.a }); });
  }
  function coin(D, x, y, r, f, o) {
    o = o || {}; var col = f === '表' ? C.yel : C.lav;
    if (o.glow) CH.circle(D, x, y, r * 1.3, { fill: ha(o.glow, .3), stroke: o.glow, sw: 2.4, a: o.a });
    CH.circle(D, x, y, r, { fill: ha(col, .22), stroke: col, sw: Math.max(1.4, r * .09), a: o.a });
    CH.circle(D, x, y, r * .76, { stroke: ha(col, .55), sw: 1, a: o.a });

  }
  /* くるくる回る硬貨（k：回る角度） */
  function coinSpin(D, x, y, r, k, o) {
    var c = Math.cos(k), g = D.ctx; g.save(); g.translate(x, y); g.scale(Math.max(.06, Math.abs(c)), 1); coin(D, 0, 0, r, c >= 0 ? '表' : '裏', o); g.restore();
  }
  function ball(D, x, y, r, col, lab, o) {
    o = o || {};
    if (o.glow) CH.circle(D, x, y, r * 1.32, { fill: ha(o.glow, .3), stroke: o.glow, sw: 2.4, a: o.a });
    CH.circle(D, x, y, r, { fill: ha(col, col === C.chalk ? .9 : .78), stroke: col, sw: 1.6, a: o.a });
    if (lab) CH.text(D, x, y + 1, lab, { size: CH.fitSize(D, lab, r * 1.6, r * .85, { num: true, w: 700 }), col: '#1f3a2c', a: o.a, num: true, w: 700 });
  }
  /* くじ（(x, y) は下のはし。あたりは下の先が赤） */
  function stick(D, x, y, w, h, hit, o) {
    o = o || {};
    if (o.glow) CH.fillRect(D, x - w * 1.3, y - h - w * .6, x + w * 1.3, y + w * .6, { fill: ha(o.glow, .3), stroke: o.glow, sw: 2, a: o.a });
    CH.fillRect(D, x - w / 2, y - h, x + w / 2, y, { fill: 'rgba(242,240,230,.8)', a: o.a });
    if (hit) CH.fillRect(D, x - w / 2, y - h * .26, x + w / 2, y, { fill: C.pink, a: o.a });
    if (o.lab) CH.text(D, x, y + w * 1.5 + 4, o.lab, { size: o.size || w * 1.6, col: hit ? C.pink : DIM, a: o.a });
  }
  function who(D, x, y, r, lab, col, o) {
    o = o || {};
    CH.circle(D, x, y, r, { fill: ha(col, .28), stroke: col, sw: 2, a: o.a });
    CH.text(D, x, y + 1, lab, { size: r * 1.05, col: col, a: o.a, num: true, w: 700 });
  }

  /* 樹形図（左から右へ）。spec＝[[字, [子…]], …]

    var tw = 0; if (o.tail) leaves.forEach(function (n) { tw = Math.max(tw, TW(D, String(o.tail(n.path)), fs)); });
    var gap = fs * .9, dx = Dm ? Math.min(o.dxMax || fs * 7, (R0.w - 2 * hw - (tw ? tw + gap * 1.6 : 0)) / Dm) : 0;
    var W = Dm * dx + 2 * hw + (tw ? tw + gap * 1.6 : 0), xl = R0.cx - W / 2 + hw, X = function (d) { return xl + d * dx; };
    var y0 = R0.y0 + top + (H - dy * L) / 2 + dy / 2;
    leaves.forEach(function (n, k) { n.y = y0 + k * dy; });
    function setY(n) { if (n.ch.length) { n.ch.forEach(setY); n.y = (n.ch[0].y + n.ch[n.ch.length - 1].y) / 2; } }
    roots.forEach(setY);

    if (o.heads) o.heads.forEach(function (h, d) { CH.text(D, X(d), R0.y0 + hs * .7, h, { size: hs, col: DIM }); });
    function draw(n) {

  /* ます目の表。rl・cl（行・列の見出し）。o：corner（['大', '小']：左上に ななめの線）、cell(i, j)→字、show(i, j)→字の濃さ、
     fill(i, j)→色、fa(i, j)→ぬる濃さ、size、max（ますの大きさの上限）、hw（見出しの列の幅。ます何こ分か）、hcol（見出しの色）。返すもの：{ X(j), Y(i), cs, x0, y0, x1, y1 } */

  function pline(D, R0, o) {
