/* 確率 第8時：「確率」で学んだことを、整理して確かめよう（ikkan の lesson_kakuritsu_08 と同じ流れ）。

          if (!D.ph) say(D, L[1], L[2], [['ますに 2けたの整数', DIM], ['（十の位 a・一の位 b）', DIM]]);
          else say(D, L[1], L[2], [['a ごとに数える', C.chalk, sm(0, .1, t)], ['2＋1＋2＋1＋2＋1＝9', C.orange, sm(.72, .82, t)], ['[9/36]＝[1/4]', C.orange, sm(.85, .95, t)]]);
        } }
    ])
