/* 確率 第5時：「少なくとも1回」の確率を、かんたんに求めよう（ikkan の lesson_kakuritsu_05 と同じ流れ）。

   例題は 3枚の硬貨の樹形図（裏裏裏 の 1通り → 残りの 7通りに反転）と、2つのさいころの「少なくとも一方は偶数」（両方とも奇数 9通り → 27通り）。
   考えようは、硬貨の枚数をスライダーで変えると、全部の場合のますと「1枚も表が出ない」1このますが見える（確率は出さない）。
   チャレンジは 3つのさいころ：大の目ごとに 6×6 の表を6つならべ、6 が出ない 125通りを光らせてから反転（91通り）。
   データはすべて自作。答えは、場合を全部書き出して数え、ページの中で確かめている（CH.check）。 */
(function () {

    CH.card(D, x, y, s, s, '', { col: col, fill: o.fill || 'rgba(242,240,230,.12)', sw: Math.max(1.4, s * .05), a: o.a });

    CH.circle(D, x, y, r, { fill: ha(col, .22), stroke: col, sw: Math.max(1.4, r * .09), a: o.a });
