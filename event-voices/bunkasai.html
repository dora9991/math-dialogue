<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>文化発表会 感想ひろば</title>
<style>
  :root{
    color-scheme: light;
    --floor:#cda876;
    --ink:#3a2f22;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; touch-action:manipulation; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
    background:#f2e6cc;
  }
  #stage{ position:relative; width:100%; }
  #scene{ width:100%; height:auto; display:block; }
  #scene .char{ cursor:pointer; }
  #scene .char:focus{ outline:none; }
  #scene text{ font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif; }

  header{
    padding:10px 14px 8px; background:#f2e6cc;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    text-align:center;
  }
  header h1{
    margin:0; font-size:15px; font-weight:700; color:var(--ink);
    background:rgba(255,255,255,.82); padding:5px 14px; border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  header p{
    margin:0; font-size:11.5px; color:#4a3a28;
    background:rgba(255,255,255,.66); padding:2px 10px; border-radius:999px;
  }

  /* ---- speech bubble ---- */
  #bubble{
    position:absolute; z-index:10; max-width:min(78vw, 300px);
    background:#fff; border-radius:16px; padding:12px 30px 12px 14px;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
    font-size:14px; line-height:1.55; color:#2b2b2b;
    transition:opacity .12s ease, transform .12s ease;
  }
  #bubble[hidden]{ display:none; }
  #bubble .txt{ max-height:34vh; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  #bubble::after{
    content:""; position:absolute; width:14px; height:14px; background:#fff;
    transform:rotate(45deg); left:var(--tailX, 22px);
  }
  #bubble.below::after{ top:-6px; box-shadow:-2px -2px 3px rgba(0,0,0,.05); }
  #bubble.above::after{ bottom:-6px; box-shadow:2px 2px 3px rgba(0,0,0,.05); }
  #bubbleClose{
    position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    border:none; background:#eee; color:#666; font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #bubbleClose:active{ background:#ddd; }

  /* ---- character animations ---- */
  .cheer .pose{ transform-box:fill-box; transform-origin:50% 100%; animation:cheerBounce .9s ease-in-out infinite; }
  @keyframes cheerBounce{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(-4deg); }
  }
  .idle .pose{ transform-box:fill-box; transform-origin:50% 100%; animation:idleSway 2.6s ease-in-out infinite; }
  @keyframes idleSway{
    0%,100%{ transform:scaleY(1); }
    50%{ transform:scaleY(0.985); }
  }
  .run{
    offset-rotate:0deg;
    animation-name:runLoop; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes runLoop{ from{ offset-distance:0%; } to{ offset-distance:100%; } }
  @supports not (offset-path: path("M0 0")){
    .run{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <h1>🎭 文化発表会 感想ひろば（サンプル）</h1>
  <p>準備中のみんなの様子／気になる子をタップすると感想が出てくるよ</p>
</header>

<div id="stage">
  <svg id="scene" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 応援・盛り上げポーズ：腕を上げてぴょんぴょん（ステージ・演技練習用） -->
      <symbol id="figure-cheer" viewBox="0 0 20 32">
        <g class="pose">
          <line x1="5" y1="12" x2="0" y2="4"  stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="15" y1="12" x2="20" y2="4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="10" cy="6" r="4.2" fill="currentColor"/>
          <rect x="5.5" y="10" width="9" height="12" rx="4" fill="currentColor"/>
          <line x1="7.5" y1="22" x2="6"  y2="31" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="12.5" y1="22" x2="14" y2="31" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </symbol>

      <!-- 活動ポーズ：足を開いて歩く（廊下を運ぶ用） -->
      <symbol id="figure-run" viewBox="0 0 20 32">
        <g class="pose">
          <line x1="6" y1="13" x2="1"  y2="10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="14" y1="13" x2="19" y2="17" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="10" cy="6" r="4.2" fill="currentColor"/>
          <rect x="5.5" y="10" width="9" height="11" rx="4" fill="currentColor" transform="rotate(8 10 15)"/>
          <line x1="8" y1="21" x2="3"  y2="30" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="12" y1="21" x2="16" y2="28" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </symbol>

      <!-- のんびりポーズ：たったまま（合唱・デザイン作成用） -->
      <symbol id="figure-idle" viewBox="0 0 20 32">
        <g class="pose">
          <line x1="5.5" y1="13" x2="3" y2="20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="14.5" y1="13" x2="17" y2="20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="10" cy="6" r="4.2" fill="currentColor"/>
          <rect x="5.5" y="10" width="9" height="13" rx="4" fill="currentColor"/>
          <line x1="7.5" y1="23" x2="7"  y2="31" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="12.5" y1="23" x2="13" y2="31" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </symbol>
    </defs>

    <!-- 壁・天井（見出しバナー） -->
    <rect x="0" y="0" width="1000" height="140" fill="#f2e6cc"/>
    <g id="bunting"></g>
    <g transform="translate(500,86)">
      <rect x="-128" y="-19" width="256" height="36" rx="9" fill="#e8654a"/>
      <polygon points="-128,-19 -143,-1 -128,17" fill="#e8654a"/>
      <polygon points="128,-19 143,-1 128,17" fill="#e8654a"/>
      <text x="0" y="7" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">文化発表会 準備中</text>
    </g>

    <!-- 校舎フロア -->
    <rect x="0" y="140" width="1000" height="620" fill="var(--floor)"/>

    <!-- 廊下（小道具・材料を運ぶ動線） -->
    <path id="hallPath" d="" fill="none" stroke="#a97c4a" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 15" opacity="0.85"/>

    <!-- 部屋（JSで描画） -->
    <g id="roomHall"></g>
    <g id="roomChoir"></g>
    <g id="roomActing"></g>
    <g id="roomDesign"></g>

    <!-- 人々（JSで生成） -->
    <g id="crowd"></g>
  </svg>

  <div id="bubble" hidden>
    <button id="bubbleClose" aria-label="閉じる">×</button>
    <div class="txt" id="bubbleText"></div>
  </div>
</div>

<script src="bunkasai-data.js"></script>
<script>
(function(){
  "use strict";

  var DATA = (window.EVENT_DATA || []).slice();
  var SVGNS = "http://www.w3.org/2000/svg";
  var XLINKNS = "http://www.w3.org/1999/xlink";

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20260824);

  var PALETTE = ["#e8654a","#f2a53c","#f2c14e","#4fa876","#3f9bd6","#7c6fd6","#e06aa0","#5aab8f","#c97a3d","#4f8fbb"];

  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function useOf(id, color){
    var u = el("use", { width:"20", height:"32" });
    u.setAttributeNS(XLINKNS, "href", id);
    if (color) u.setAttribute("color", color);
    return u;
  }
  function personEl(dataIndex, cls, symbolId, x, y, scale, color, delay){
    var g = el("g", { class:"char " + cls, tabindex:"0", role:"button",
                       "aria-label":"感想を見る", "data-i": String(dataIndex) });
    g.setAttribute("transform", "translate(" + x + "," + y + ") scale(" + scale + ")");
    g.style.color = color;
    g.style.animationDelay = delay;
    g.appendChild(useOf("#" + symbolId));
    return g;
  }
  function roundedRectPath(x, y, w, h, r){
    return "M " + (x+r) + "," + y +
      " H " + (x+w-r) + " Q " + (x+w) + "," + y + " " + (x+w) + "," + (y+r) +
      " V " + (y+h-r) + " Q " + (x+w) + "," + (y+h) + " " + (x+w-r) + "," + (y+h) +
      " H " + (x+r) + " Q " + x + "," + (y+h) + " " + x + "," + (y+h-r) +
      " V " + (y+r) + " Q " + x + "," + y + " " + (x+r) + "," + y + " Z";
  }
  function panel(parent, x, y, w, h, fill, stroke){
    parent.appendChild(el("rect", { x:x, y:y, width:w, height:h, rx:16, fill:fill,
                                     stroke:stroke || "none", "stroke-width":"3" }));
  }
  function labelChip(parent, x, y, text){
    var g = el("g", { transform: "translate(" + x + "," + y + ")" });
    var t = el("text", { x:10, y:14, "font-size":"17", "font-weight":"700", fill:"#2c3e2f" });
    t.textContent = text;
    var w = 20 + text.length * 15;
    g.appendChild(el("rect", { x:0, y:-6, width:w, height:26, rx:13, fill:"rgba(255,255,255,.88)" }));
    g.appendChild(t);
    parent.appendChild(g);
  }

  // ---- バンティング（三角の飾り旗） ----
  var bunting = document.getElementById("bunting");
  var buntingColors = ["#e8654a","#f2c14e","#4fa876","#3f9bd6","#7c6fd6","#e06aa0"];
  for (var bx = 20; bx <= 980; bx += 34){
    var sag = Math.sin((bx / 1000) * Math.PI) * 13;
    var by = 20 + sag;
    bunting.appendChild(el("polygon", {
      points: (bx-11) + "," + by + " " + (bx+11) + "," + by + " " + bx + "," + (by+20),
      fill: buntingColors[Math.floor(bx / 34) % buntingColors.length]
    }));
  }

  // ---- 廊下（周回コース） ----
  var HALL = { x:30, y:150, w:940, h:590, r:50 };
  var hallD = roundedRectPath(HALL.x, HALL.y, HALL.w, HALL.h, HALL.r);
  document.getElementById("hallPath").setAttribute("d", hallD);

  // ---- 部屋の位置 ----
  var ROOM_HALL   = { x:100, y:210, w:380, h:230 }; // 講堂／体育館（ステージ発表準備）
  var ROOM_CHOIR  = { x:540, y:210, w:390, h:230 }; // 教室：合唱練習
  var ROOM_ACT    = { x:100, y:480, w:380, h:230 }; // 教室：演技練習（係）
  var ROOM_DESIGN = { x:540, y:480, w:390, h:230 }; // 教室：デザイン作成（係）

  // 講堂／体育館：ステージ発表準備
  (function(){
    var g = document.getElementById("roomHall");
    panel(g, ROOM_HALL.x, ROOM_HALL.y, ROOM_HALL.w, ROOM_HALL.h, "#e0bd8a", "#b8955f");
    // ミニステージ
    g.appendChild(el("rect", { x:ROOM_HALL.x+40, y:ROOM_HALL.y+14, width:ROOM_HALL.w-80, height:70,
                                fill:"#caa06a", stroke:"#a97c4a", "stroke-width":"1.5" }));
    // 緞帳（左右）
    g.appendChild(el("path", { d:"M " + (ROOM_HALL.x+30) + "," + (ROOM_HALL.y+8) +
                                " Q " + (ROOM_HALL.x+56) + "," + (ROOM_HALL.y+50) + " " + (ROOM_HALL.x+30) + "," + (ROOM_HALL.y+92) +
                                " L " + (ROOM_HALL.x+16) + "," + (ROOM_HALL.y+92) +
                                " Q " + (ROOM_HALL.x+38) + "," + (ROOM_HALL.y+50) + " " + (ROOM_HALL.x+16) + "," + (ROOM_HALL.y+8) + " Z",
                                fill:"#c0392b" }));
    g.appendChild(el("path", { d:"M " + (ROOM_HALL.x+ROOM_HALL.w-30) + "," + (ROOM_HALL.y+8) +
                                " Q " + (ROOM_HALL.x+ROOM_HALL.w-56) + "," + (ROOM_HALL.y+50) + " " + (ROOM_HALL.x+ROOM_HALL.w-30) + "," + (ROOM_HALL.y+92) +
                                " L " + (ROOM_HALL.x+ROOM_HALL.w-16) + "," + (ROOM_HALL.y+92) +
                                " Q " + (ROOM_HALL.x+ROOM_HALL.w-38) + "," + (ROOM_HALL.y+50) + " " + (ROOM_HALL.x+ROOM_HALL.w-16) + "," + (ROOM_HALL.y+8) + " Z",
                                fill:"#c0392b" }));
    labelChip(g, ROOM_HALL.x+10, ROOM_HALL.y-4, "🎤 講堂（ステージ発表準備）");
  })();

  // 教室：合唱練習（ひな壇）
  (function(){
    var g = document.getElementById("roomChoir");
    panel(g, ROOM_CHOIR.x, ROOM_CHOIR.y, ROOM_CHOIR.w, ROOM_CHOIR.h, "#dfe7ea", "#aebac0");
    [0,1,2].forEach(function(i){
      g.appendChild(el("rect", {
        x: ROOM_CHOIR.x + 24, y: ROOM_CHOIR.y + 24 + i*10, width: ROOM_CHOIR.w-48 - i*36, height: 10,
        fill: "#c7d2d6"
      }));
    });
    // ピアノ（簡略）
    g.appendChild(el("rect", { x:ROOM_CHOIR.x+20, y:ROOM_CHOIR.y+ROOM_CHOIR.h-42, width:46, height:26, rx:3, fill:"#5c4632" }));
    g.appendChild(el("rect", { x:ROOM_CHOIR.x+22, y:ROOM_CHOIR.y+ROOM_CHOIR.h-30, width:42, height:6, fill:"#f0ece2" }));
    labelChip(g, ROOM_CHOIR.x+10, ROOM_CHOIR.y-4, "🎵 教室（合唱練習）");
  })();

  // 教室：演技練習（係）
  (function(){
    var g = document.getElementById("roomActing");
    panel(g, ROOM_ACT.x, ROOM_ACT.y, ROOM_ACT.w, ROOM_ACT.h, "#f0ddc8", "#cbab84");
    // 端に寄せた机
    [0,1,2].forEach(function(i){
      g.appendChild(el("rect", { x:ROOM_ACT.x+16, y:ROOM_ACT.y+22+i*26, width:50, height:18, rx:3,
                                  fill:"#c9a06a", stroke:"#a97c4a", "stroke-width":"1" }));
    });
    // 小道具（台本・マスク風のアイコン）
    g.appendChild(el("rect", { x:ROOM_ACT.x+ROOM_ACT.w-70, y:ROOM_ACT.y+20, width:26, height:32, rx:2,
                                fill:"#fff", stroke:"#c7b89a", "stroke-width":"1.5" }));
    g.appendChild(el("line", { x1:ROOM_ACT.x+ROOM_ACT.w-66, y1:ROOM_ACT.y+28, x2:ROOM_ACT.x+ROOM_ACT.w-48, y2:ROOM_ACT.y+28, stroke:"#c7b89a", "stroke-width":"1.5" }));
    g.appendChild(el("line", { x1:ROOM_ACT.x+ROOM_ACT.w-66, y1:ROOM_ACT.y+34, x2:ROOM_ACT.x+ROOM_ACT.w-48, y2:ROOM_ACT.y+34, stroke:"#c7b89a", "stroke-width":"1.5" }));
    labelChip(g, ROOM_ACT.x+10, ROOM_ACT.y-4, "🎬 教室（演技練習・係）");
  })();

  // 教室：デザイン作成（係）
  (function(){
    var g = document.getElementById("roomDesign");
    panel(g, ROOM_DESIGN.x, ROOM_DESIGN.y, ROOM_DESIGN.w, ROOM_DESIGN.h, "#e8dcc5", "#c2ac82");
    [[ROOM_DESIGN.x+40, ROOM_DESIGN.y+24], [ROOM_DESIGN.x+ROOM_DESIGN.w-90, ROOM_DESIGN.y+24],
     [ROOM_DESIGN.x+40, ROOM_DESIGN.y+ROOM_DESIGN.h-52], [ROOM_DESIGN.x+ROOM_DESIGN.w-90, ROOM_DESIGN.y+ROOM_DESIGN.h-52]]
      .forEach(function(p, i){
        var t = el("g", { transform:"translate(" + p[0] + "," + p[1] + ")" });
        t.appendChild(el("rect", { x:0, y:0, width:70, height:36, rx:4, fill:"#8a6a45" }));
        t.appendChild(el("rect", { x:6, y:-8, width:16, height:11, fill: PALETTE[i % PALETTE.length] }));
        t.appendChild(el("rect", { x:24, y:-8, width:16, height:11, fill: PALETTE[(i+2) % PALETTE.length] }));
        t.appendChild(el("circle", { cx:56, cy:-3, r:6, fill:"#dbe6ea" }));
        g.appendChild(t);
      });
    labelChip(g, ROOM_DESIGN.x+10, ROOM_DESIGN.y-4, "🎨 教室（デザイン作成・係）");
  })();

  // ---- 人の配置 ----
  var ORDER = ["hall","choir","acting","design","carry"];
  var counts = { hall:0, choir:0, acting:0, design:0, carry:0 };
  DATA.forEach(function(_, i){ counts[ORDER[i % 5]]++; });

  var crowd = document.getElementById("crowd");
  var seatIdx = { hall:0, choir:0, acting:0, design:0, carry:0 };

  var CHOIR_COLS = 7;

  DATA.forEach(function(text, i){
    var type = ORDER[i % 5];
    var scale = 1.5 + rnd() * 0.5;
    var n = seatIdx[type]++;
    var color = PALETTE[n % PALETTE.length];
    var g;

    if (type === "hall"){
      var hx = ROOM_HALL.x + 30 + rnd() * (ROOM_HALL.w-60);
      var hy = ROOM_HALL.y + 110 + rnd() * (ROOM_HALL.h-130);
      g = personEl(i, "cheer", "figure-cheer", hx, hy, scale*0.85, color, (-rnd()*1).toFixed(2)+"s");
    } else if (type === "choir"){
      var cols = CHOIR_COLS;
      var rows = Math.ceil(counts.choir / cols);
      var col = n % cols, row = Math.floor(n / cols);
      var cx2 = ROOM_CHOIR.x + 38 + col * ((ROOM_CHOIR.w-76) / (cols-1||1));
      var cy2 = ROOM_CHOIR.y + 70 + row * (110 / (rows||1));
      g = personEl(i, "idle", "figure-idle", cx2, cy2, 1.3, color, (-rnd()*2.6).toFixed(2)+"s");
    } else if (type === "acting"){
      var ax = ROOM_ACT.x + 90 + rnd() * (ROOM_ACT.w-140);
      var ay = ROOM_ACT.y + 40 + rnd() * (ROOM_ACT.h-80);
      g = personEl(i, "cheer", "figure-cheer", ax, ay, scale*0.85, color, (-rnd()*1).toFixed(2)+"s");
    } else if (type === "design"){
      var dx = ROOM_DESIGN.x + 40 + rnd() * (ROOM_DESIGN.w-80);
      var dy = ROOM_DESIGN.y + 40 + rnd() * (ROOM_DESIGN.h-80);
      g = personEl(i, "idle", "figure-idle", dx, dy, scale, color, (-rnd()*2.6).toFixed(2)+"s");
    } else {
      g = el("g", { class:"char run", tabindex:"0", role:"button",
                     "aria-label":"感想を見る", "data-i": String(i) });
      g.style.color = color;
      g.style.offsetPath = "path('" + hallD + "')";
      var dur = 44 + rnd() * 16;
      var total = counts.carry || 1;
      g.style.animationDuration = dur.toFixed(1) + "s";
      g.style.animationDelay = (-(n/total) * dur).toFixed(1) + "s";
      var wrap = el("g", { transform: "translate(-10,-16) scale(" + (scale*0.9) + ")" });
      wrap.appendChild(useOf("#figure-run"));
      g.appendChild(wrap);
    }

    crowd.appendChild(g);
  });

  // ---- ふきだし ----
  var stageEl = document.getElementById("stage");
  var bubble = document.getElementById("bubble");
  var bubbleText = document.getElementById("bubbleText");
  var openChar = null;

  function closeBubble(){
    bubble.hidden = true;
    if (openChar) openChar.classList.remove("active");
    openChar = null;
  }

  function showBubble(target, text){
    if (openChar === target){ closeBubble(); return; }
    openChar = target;
    bubbleText.textContent = text;
    bubble.hidden = false;

    var stageRect = stageEl.getBoundingClientRect();
    var r = target.getBoundingClientRect();
    var relX = r.left + r.width/2 - stageRect.left;
    var relY = r.top - stageRect.top;

    bubble.style.left = "0px"; bubble.style.top = "0px";
    var bw = bubble.offsetWidth, bh = bubble.offsetHeight;

    var left = relX - 30;
    left = Math.max(8, Math.min(left, stageRect.width - bw - 8));

    var above = relY - bh - 14;
    var placeAbove = above > 8;
    var top = placeAbove ? above : (r.bottom - stageRect.top + 14);
    top = Math.max(8, Math.min(top, stageRect.height - bh - 8));

    bubble.classList.toggle("above", placeAbove);
    bubble.classList.toggle("below", !placeAbove);

    var tailX = Math.max(14, Math.min(relX - left - 7, bw - 28));
    bubble.style.setProperty("--tailX", tailX + "px");
    bubble.style.left = left + "px";
    bubble.style.top = top + "px";
  }

  document.getElementById("scene").addEventListener("click", function(e){
    var g = e.target.closest("[data-i]");
    if (g){
      var i = parseInt(g.getAttribute("data-i"), 10);
      showBubble(g, DATA[i]);
    } else {
      closeBubble();
    }
  });
  document.getElementById("scene").addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var g = e.target.closest("[data-i]");
    if (!g) return;
    e.preventDefault();
    var i = parseInt(g.getAttribute("data-i"), 10);
    showBubble(g, DATA[i]);
  });
  document.getElementById("bubbleClose").addEventListener("click", closeBubble);
})();
</script>
</body>
</html>
