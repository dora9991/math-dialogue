      { tag: '今日の問い', bh: '落ちる物（y＝5x²）', q: '物を落とすと、落ち始めてから x 秒間に落ちるきょり y m は、およそ y＝5x² になる。落ちる速さは、ずっと同じだろうか。表の数から速さを求めて、調べよう。', dur: 4,
