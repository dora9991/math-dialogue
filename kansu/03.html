            if (t > .64) par(D, Pl, 1, { col: C.yel, w: 3, glow: true, x0: 0, t: CH.smooth(.64, .92, t) });
          }
          CH.pt(D, Pl, 1, 1, { col: C.chalk, r: CH.fs(D, .3), lab: '(1, 1)', dir: 'se' });
          CH.pt(D, Pl, 2, 4, { col: C.chalk, r: CH.fs(D, .3), lab: '(2, 4)', dir: 'se' });
          var lx = Pl.X(.1), ly = Pl.Y(4.6);
          CH.text(D, lx, ly, '直線なら　x＝1.5 で y＝2.5', { size: fz, col: C.pink, align: 'left', outline: OUT, a: a2 });
          CH.text(D, lx, ly + fz * 1.6, 'グラフは　1.5²＝2.25', { size: fz, col: C.yel, align: 'left', outline: OUT, a: a3 });
          CH.text(D, lx, ly + fz * 3.2, '→ 直線より下にある', { size: fz, col: C.green, align: 'left', outline: OUT, a: D.ph ? CH.smooth(.64, .78, t) : 0 });
        } },
      { tag: '考えよう', q: 'y＝x² のグラフは、原点のところで、とがっているだろうか。x＝0.5、0.3、0.2、0.1 のときの y の値を求めて、調べよう。',
        notes: ['求めた y の値から、気づいたことを書こう。', '原点のところは、とがっているといえるか。理由も書こう。', 'スライダーで、原点のまわりを拡大できます。'],
        sliders: [{ key: 'z', label: '拡大', min: 0, max: 4, step: 1, val: 0, fmt: function (x) { return [1, 2, 4, 8, 16][x] + '倍'; } }],
        draw: function (D) {
          var R = CH.box(D, { l: .1, r: .1, t: .02, b: .02 }), z = [1, 2, 4, 8, 16][D.V.z], w = 4 / z, s = CH.fs(D);
          var Pl = PL(D, R, { x: [-w, w], y: [-w / 4, w * 1.75], xs: w / 4, ys: w / 4, xl: w / 2, yl: w / 2 });
          par(D, Pl, 1, { col: C.yel, w: 3.2 });
          [0.5, 0.3, 0.2, 0.1].forEach(function (x) { if (x <= w && x * x <= w * 1.75) CH.pt(D, Pl, x, x * x, { col: C.pink, r: CH.fs(D, .24) }); });
          CH.text(D, Pl.R.x0 + s * .3, Pl.R.y0 + s * .5, z + '倍', { size: s * 1.1, col: C.blue, align: 'left', outline: OUT });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '放物線 y＝x² の上に、x 座標が −3 の点 A と、x 座標が 1 の点 B がある。直線 AB の式を求めよう。', a: 'y＝−2x＋3',
        sub: 'A(−3, 9)、B(1, 1)。傾き [1−9/1−(−3)]＝[−8/4]＝−2。y＝−2x＋b に B を代入して 1＝−2＋b、b＝3', dur: 7,
        b: { t: 'A(−3, 9)、B(1, 1)　傾き [−8/4]＝−2 → <b>y＝−2x＋3</b>', col: C.orange },
        draw: function (D) {
          var R = CH.box(D, { l: .1, r: .1, t: .02, b: .02 }), t = D.ph ? D.t : 0, s = CH.fs(D), Pl = PL(D, R, { x: [-4, 4], y: [-1, 10] });
          par(D, Pl, 1, { col: C.yel, w: 2.8 });
          var ka = D.ph ? CH.ease(CH.smooth(.02, .2, t)) : 0, kb = D.ph ? CH.ease(CH.smooth(.1, .28, t)) : 0;
          CH.pseg(D, Pl, [-3, 0], [-3, 9 * ka], { col: C.blue, w: 1.6, dash: [4, 5], a: D.ph ? 1 : 0 });
          CH.pseg(D, Pl, [1, 0], [1, kb], { col: C.blue, w: 1.6, dash: [4, 5], a: D.ph ? 1 : 0 });
          CH.pt(D, Pl, -3, 9 * ka, { col: C.blue, r: CH.fs(D, .3), lab: ka > .99 ? 'A(−3, 9)' : 'A', dir: 'nw' });
          CH.pt(D, Pl, 1, kb, { col: C.blue, r: CH.fs(D, .3), lab: kb > .99 ? 'B(1, 1)' : 'B', dir: 'se' });
          if (!D.ph) return;
          if (t > .32) CH.lin(D, Pl, -2, 3, { col: C.orange, w: 3, t: CH.smooth(.32, .5, t), x0: -3.5, x1: 2 });
          if (t > .52) CH.slopeTri(D, Pl, -2, 3, -3, 4, { col: C.pink, a: CH.smooth(.52, .66, t), lx: '＋4', ly: '−8' });
          if (t > .72) { var a = CH.smooth(.72, .86, t); CH.pt(D, Pl, 0, 3, { col: C.green, r: CH.fs(D, .3), a: a }); lab(D, Pl, 0, 3, '(0, 3)', C.green, { dx: s * .5, dy: -s * .5, a: a, size: s * .8 }); lab(D, Pl, 1.3, 6, 'y＝−2x＋3', C.orange, { a: CH.smooth(.85, 1, t) }); }
        } }
    ])
  });
})();
