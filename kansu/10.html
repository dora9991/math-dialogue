(function () {

  /* ---- 数（ikkan と同じ）と検算 ---- */
  var A = 8 / (40 * 40), F = function (x) { return A * x * x; }, K = 10 / 40, Q = function (x) { return K * x; }, TOT = function (x) { return K * x + A * x * x; }, SP = [20, 40, 60, 80, 100];
  CH.check(CH.near(A, 1 / 200) && SP.map(function (x) { return Math.round(F(x) * 1e6) / 1e6; }).join() === '2,8,18,32,50', '例題の表（a＝1/200）');
  CH.check(CH.near(F(80), 4 * 8) && !CH.near(F(80), 2 * 8) && CH.near(F(80), 32), '今日の問い（80km で 32m、4倍）');
