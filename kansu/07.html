  CH.check(RG(sq(1), -2, 3) === '0,9' && RG(sq(1), 1, 3) === '1,9' && [(-2) * (-2), 3 * 3].join() === '4,9', '今日の問い（0≦y≦9、1≦y≦9。両はしだけなら 4 と 9）');
  var EX = [[1, 3, '2,18'], [-1, 2, '0,8'], [-3, 1, '0,18']];
  CH.check(EX.every(function (e) { return RG(sq(2), e[0], e[1]) === e[2]; }), '例題（y＝2x²）');
  CH.check(RG(sq(-2), -1, 3) === '-18,0', '例題（y＝−2x²）');
  CH.check([-5, -4, -3, -2, -1, -.5, .5, 1, 2, 3, 4, 5].filter(function (a) { return RG(sq(a), -3, 2) === '0,27'; }).join() === '3' && RG(sq(3), -2, 3) === '0,27', '考えよう（ここで確かめるだけ）');
