<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>証明パターン集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
<style>
/* 一覧：★の数ごとに、型の見出しをつけて並べる */
html,body{height:auto}
.app{height:auto;min-height:100%}
.menu{padding:.4rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:1rem}
.menu p.lead{margin:0;font-family:var(--f-chalk);font-weight:600;color:var(--chalk-2);font-size:1.05rem;line-height:1.6}
.menu h2{margin:.4rem 0 0;font-family:var(--f-chalk);font-size:1.3rem;color:var(--yel,#ffe27a)}
.menu h2 small{font-size:.9rem;color:var(--chalk-2);margin-left:.6rem}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr));gap:.6rem}
.list li{display:flex;flex-direction:column;gap:.3rem;padding:.65rem .9rem;border:2px solid var(--chalk-3);border-radius:12px;background:rgba(242,240,230,.05);min-width:0}
.list .no{font-family:var(--f-chalk);font-weight:600;font-size:.85rem;color:var(--chalk-2)}
.list .ttl{font-family:var(--f-chalk);font-weight:600;font-size:1.08rem;line-height:1.45}
.list .hg{font-size:.85rem;color:var(--chalk-2);line-height:1.5}
.list .go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.15rem}
</style>
</head>
<body>
<div class="app" lang="ja">
  <div class="board">
    <header class="bar"><h1><small>中2</small>証明パターン集（一覧）</h1></header>
    <div class="track" aria-hidden="true"></div>
    <main class="menu" id="menu">
      <p class="lead">図を見ながら、1行ずつ証明を組み立てる。★ 根拠を答える → ★★ 等しい組を見つける → ★★★ 性質を使う・2段の証明 → ★★★★ 回転・補助線。</p>
    </main>
  </div>
</div>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script>
(function () {
  var all = window.SHOMEI || [], H = { 1: ['★', '根拠を答える（基本の合同）'], 2: ['★★', '等しい組を自分で見つける'], 3: ['★★★', '図形の性質を使う・2段の証明'], 4: ['★★★★', '回転・補助線・発展'] };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  var html = '';
  [1, 2, 3, 4].forEach(function (lv) {
    var ds = all.filter(function (d) { return d.lv === lv; }); if (!ds.length) return;
    html += '<h2>' + H[lv][0] + '<small>' + H[lv][1] + '（' + ds.length + '題）</small></h2><ul class="list">';
    ds.forEach(function (d, k) {
      html += '<li><span class="no">' + H[lv][0] + ' ' + (k + 1) + '　' + esc(d.kind || '') + '</span><span class="ttl">' + esc(d.ttl) + '</span>' +
        '<span class="hg">' + (d.hyp ? '仮定　' + esc(d.hyp) + '<br>' : '') + (d.goal ? '結論　' + esc(d.goal) : '') + '</span>' +
        '<span class="go"><a class="btn primary" href="p.html?id=' + encodeURIComponent(d.id) + '">ひらく ▶</a></span></li>';
    });
    html += '</ul>';
  });
  document.getElementById('menu').insertAdjacentHTML('beforeend', html);
})();
</script>
</body>
</html>
