<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>証明パターン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script src="../heikou/js/geo.js"></script>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script>
/* 証明パターンを1つ、黒板で再生する。p.html?id=○○（id は data1.js・data2.js の証明の id）。 */
(function () {
  var all = (window.SHOMEI || []).slice().sort(function (a, b) { return (a.lv - b.lv) || 0; });
  var m = /[?&]id=([^&#]+)/.exec(location.search), id = m ? decodeURIComponent(m[1]) : (all[0] && all[0].id), i = 0;
  all.forEach(function (d, k) { if (d.id === id) i = k; });
  var d = all[i], pv = all[i - 1], nx = all[i + 1], stars = '★★★★'.slice(0, d.lv || 1);
  var links = [{ href: 'index.html', label: '一覧' }];
  if (pv) links.push({ href: 'p.html?id=' + encodeURIComponent(pv.id), label: '◀ 前' });
  if (nx) links.push({ href: 'p.html?id=' + encodeURIComponent(nx.id), label: '次 ▶' });
  document.title = d.ttl + '（証明 ' + stars + '）';
  K3.run({ no: stars + ' ' + (d.kind || ''), title: d.ttl, flat: true, hint: '', alt: '証明の図', links: links, steps: GE.proof(d) });
})();
</script>
</body>
</html>
