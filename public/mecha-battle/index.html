/* 青空の下で遊ぶ小さなゲーム機。ページ全体を明るい空色にして、ボタンはゲーム内の赤・青・黄色を使う。 */
:root {
  color-scheme: light;
  --bg: #d6ecff;
  --panel: #ffffff;
  --line: #8cb8e8;
  --fg: #14325a;
  --dim: #46688f;
  --accent: #fcb800;
  --hot: #fc5c3c;
  --pad: #eef7ff;
  --font-ui: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
}
html, body { height: 100%; }
html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, #b8dcff 0%, var(--bg) 40%, #eaf6ff 100%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
/* スマホ：ページを「ゲーム機の画面」のように固定する。
   ピンチ／ダブルタップの拡大、ドラッグでのスクロール、ゴムのような跳ね返り、引っぱって更新を、すべて止める。
   （.has-touch は input.js が、タッチできる端末でだけ付ける。パソコンは今までどおり） */
html.has-touch, body.has-touch { touch-action: none; }
html.has-touch { padding: 0; overflow: hidden; }   /* ノッチ分の余白を html に足すと、ページが画面より長くなって動いてしまう */
body.has-touch {
  position: fixed; left: 0; right: 0; width: 100%; height: auto; overflow: hidden;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);   /* ノッチやホームバーにかぶらない */
}
#app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 1100px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 12px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#stage { position: relative; width: 100%; display: flex; justify-content: center; }
#screen {
  display: block;
  image-rendering: pixelated;
  background: #000;
  border: 2px solid var(--line);
  box-shadow: 0 0 0 2px #14325a, 0 10px 30px rgba(20, 50, 90, 0.35);
  touch-action: none;
  outline: none;
  max-width: 100%;
}
#hint {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 14px;
  margin: 0;
  color: var(--dim);
  font-size: 13px;
  text-align: center;
}
#hint b { color: var(--hot); font-weight: normal; }
body.has-touch #hint .keys { display: none; }
#btnSound, #btnPause {
  font: inherit;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 10px;
  cursor: pointer;
}
#btnSound:focus-visible, #btnPause:focus-visible, .pad:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#btnPause { display: none; position: absolute; bottom: 6px; right: 6px; z-index: 2; padding: 4px 12px; background: rgba(255, 255, 255, 0.85); letter-spacing: 2px; }
body.has-touch #btnPause { display: block; }

/* オンライン：ルームコードの入力 */
#lobby { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#roomInputRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
#roomInputRow label { color: var(--fg); }
#roomCode {
  width: 5.2em; font: inherit; font-size: 26px; letter-spacing: 0.25em; text-align: center; text-transform: uppercase;
  padding: 4px 8px; color: var(--fg); background: #fff; border: 3px solid #14325a; border-radius: 6px;
}
#roomCode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#roomGo, #roomCopy {
  font: inherit; font-size: 16px; color: #fff; background: var(--hot); border: 3px solid #14325a; border-radius: 6px;
  padding: 6px 16px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
}
#roomCopy { background: #3c78fc; max-width: 100%; overflow-wrap: anywhere; }
#roomGo:focus-visible, #roomCopy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* スマホ用の操作ボタン */
#touch {
  width: 100%;
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#dpad {
  position: relative;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #ffffff 0%, var(--pad) 70%);
  border: 2px solid var(--line);
  touch-action: none;
}
#dpad::before, #dpad::after { content: ""; position: absolute; background: #b4d4f4; border-radius: 6px; }
#dpad::before { left: 50%; top: 9%; width: 30%; height: 82%; transform: translateX(-50%); }
#dpad::after { top: 50%; left: 9%; height: 30%; width: 82%; transform: translateY(-50%); }
#knob {
  position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; margin: -18% 0 0 -18%;
  border-radius: 50%; background: var(--accent); border: 2px solid #14325a; z-index: 1;
  transition: transform 40ms linear;
}
#btns { display: flex; gap: 14px; align-items: flex-end; }
.pad {
  width: 78px; height: 78px; border-radius: 50%;
  font: inherit; font-size: 26px; line-height: 1; color: #fff;
  background: var(--hot); border: 3px solid #14325a; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.22);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  touch-action: none; cursor: pointer; padding: 0;
}
.pad small { font-size: 11px; opacity: 0.9; }
#btnB { background: #3c78fc; margin-bottom: 30px; }
.pad.on { transform: translateY(2px); filter: brightness(1.25); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.28); }
@media (orientation: landscape) and (max-height: 520px) {
  #btnPause { bottom: auto; top: 6px; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  #touch > * { pointer-events: auto; opacity: 0.82; }
  #hint { display: none; }
}
</style>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="512" height="448" aria-label="ゲーム画面"></canvas>
    <button id="btnPause" type="button" aria-label="ポーズ">||</button>
  </div>
  <div id="lobby" hidden>
    <div id="roomInputRow" hidden>
      <label for="roomCode">ルームコード</label>
      <input id="roomCode" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" inputmode="text">
      <button id="roomGo" type="button">つなぐ</button>
    </div>
    <button id="roomCopy" type="button" hidden>しょうたいリンクを コピー</button>
  </div>
  <p id="hint">
    <span class="keys"><b>うごき</b> WASD / やじるし</span>
    <span class="keys"><b>パンチ</b> Z</span>
    <span class="keys"><b>キック</b> X</span>
    <span class="keys"><b>ポーズ</b> Enter</span>
    <span class="keys">はじめに 画面を クリック</span>
    <button id="btnSound" type="button">おと ON</button>
  </p>
  <div id="touch" hidden>
    <div id="dpad" aria-label="十字キー"><div id="knob"></div></div>
    <div id="btns">
      <button id="btnB" class="pad" type="button" aria-label="キック">B<small>キック</small></button>
      <button id="btnA" class="pad" type="button" aria-label="パンチ">A<small>パンチ</small></button>
    </div>
  </div>

<script>
'use strict';
/* ============================================================
   core.js — 定数と小さな道具
   シミュレーション側は「整数（サブピクセル）だけ」で計算する。
   → 2台のブラウザで同じ入力を流せば同じ結果になる（オンライン対戦の前提）。
   ============================================================ */
const SP = 256;                       // 1px = 256 サブピクセル
const SCREEN_W = 256, SCREEN_H = 224; // ファミコンっぽい解像度
const FLOOR_Y = 190;                  // 床（足が付く画面Y）
const WALL_L = 28, WALL_R = SCREEN_W - 28; // 戦える範囲（中心X）。パーツが画面外に出ない余白
const FPS = 60;

// 入力ビット
const IN = { UP: 1, DOWN: 2, LEFT: 4, RIGHT: 8, A: 16, B: 32 };

const S = (n) => Math.round(n * SP);
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const sgn = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const absI = (v) => (v < 0 ? -v : v);

// 決定論的な乱数（xorshift32）。Math.random は対戦ロジックでは使わない。
function rngNext(r) {
  let x = r.s | 0;
  if (x === 0) x = 0x2545f491;
  x ^= x << 13;
  x ^= x >>> 17;
  x ^= x << 5;
  r.s = x | 0;
  return x >>> 0;
}
function rngInt(r, n) { return rngNext(r) % n; }

'use strict';
/* ============================================================
   chars.js — 8体のロボと、その技データ
   技は「フェーズ（区間）の並び」で書く。
     PH(フレーム数, ポーズ名, {hit, spawn, vx, vy, inv, ...})
   座標の単位は px / フレーム。x は「向いている方向」が +、y は「足元から上」が +。
   最後の compileChar() で整数（サブピクセル）に変換する。
   ============================================================ */
const PH = (dur, pose, o) => Object.assign({ dur, pose }, o || {});
const HIT = (box, dmg, o) => Object.assign({ box, dmg, hs: 13, bs: 8, kb: 1.8, hstop: 5 }, o || {});
const SPW = (o) => Object.assign({ type: 'orb', x: 20, y: 30, vx: 4, vy: 0, grav: 0, w: 14, h: 14,
  dmg: 6, hs: 14, bs: 8, kb: 1.8, hstop: 5, life: 80, delay: 0 }, o || {});

/* ---------- 共通の通常技（キャラごとに数値だけ変える） ---------- */
function mkJab(o) {
  o = Object.assign({ su: 4, ac: 3, rc: 8, reach: 38, y: 38, h: 14, dmg: 4, hs: 12, bs: 7, kb: 1.4 }, o);
  return {
    name: 'パンチ', cmd: 'A', ai: { r: [0, o.reach + 14], w: 4, k: 'poke' },
    phases: [
      PH(o.su, 'jabWind'),
      PH(o.ac, 'jab', { hit: HIT([6, o.y, o.reach - 6, o.h], o.dmg, { hs: o.hs, bs: o.bs, kb: o.kb, hstop: 4 }), snd: 'swing' }),
      PH(o.rc, 'jabRec'),
    ],
  };
}
function mkKick(o) {
  o = Object.assign({ su: 7, ac: 4, rc: 12, reach: 48, y: 6, h: 24, dmg: 6, hs: 15, bs: 9, kb: 2.2 }, o);
  return {
    name: 'キック', cmd: 'B', ai: { r: [0, o.reach + 14], w: 4, k: 'poke' },
    phases: [
      PH(o.su, 'kickWind'),
      PH(o.ac, 'kick', { hit: HIT([6, o.y, o.reach - 6, o.h], o.dmg, { hs: o.hs, bs: o.bs, kb: o.kb, hstop: 5 }), snd: 'swing' }),
      PH(o.rc, 'kickRec'),
    ],
  };
}
function mkAirP(o) {
  o = Object.assign({ su: 3, ac: 10, dmg: 4, reach: 36, hs: 12, bs: 7, kb: 1.4 }, o);
  return {
    name: 'ジャンプパンチ', cmd: '空中A', air: true, ai: { r: [0, 50], w: 3, k: 'air' },
    phases: [
      PH(o.su, 'ajab'),
      PH(o.ac, 'ajab', { hit: HIT([4, 12, o.reach - 4, 26], o.dmg, { hs: o.hs, bs: o.bs, kb: o.kb, hstop: 4 }) }),
      PH(90, 'fall', { land: true }),
    ],
  };
}
function mkAirK(o) {
  o = Object.assign({ su: 4, ac: 12, dmg: 6, reach: 40, hs: 14, bs: 8, kb: 1.8 }, o);
  return {
    name: 'ジャンプキック', cmd: '空中B', air: true, ai: { r: [0, 56], w: 3, k: 'air' },
    phases: [
      PH(o.su, 'akick'),
      PH(o.ac, 'akick', { hit: HIT([2, -6, o.reach - 2, 26], o.dmg, { hs: o.hs, bs: o.bs, kb: o.kb, hstop: 5 }) }),
      PH(90, 'fall', { land: true }),
    ],
  };
}
/* 飛び道具を撃つ共通パターン */
function mkCast(name, cmd, spawn, o) {
  o = Object.assign({ su: 11, rc: 18, ai: { r: [70, 240], w: 5, k: 'proj' }, limit: spawn.type || 'orb' }, o);
  return {
    name, cmd, ai: o.ai, limit: o.limit,
    phases: [PH(o.su, 'cast1'), PH(3, 'cast2', { spawn, snd: o.snd || 'shoot' }), PH(o.rc, 'castRec')],
  };
}

function text5W(str, s) { return str.length * 6 * (s || 1) - (s || 1); }
/* x,y は左上。align: 'l' | 'c' | 'r' */
function text5(c, str, x, y, col, s, o) {
  s = s || 1; o = o || {};
  str = String(str).toUpperCase();
  const w = text5W(str, s);
  if (o.align === 'c') x = Math.round(x - w / 2); else if (o.align === 'r') x = Math.round(x - w);
  const pass = (ox, oy, color) => {
    c.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const g = FONT5_ROWS[str[i]] || FONT5_ROWS['?'];
      for (let gy = 0; gy < 7; gy++) for (let gx = 0; gx < 5; gx++) {
        if (g[gy][gx] === '#') c.fillRect(x + ox + (i * 6 + gx) * s, y + oy + gy * s, s, s);
      }
    }
  };
  if (o.outline !== false) { const k = o.ocol || '#000000'; pass(-s, 0, k); pass(s, 0, k); pass(0, -s, k); pass(0, s, k); pass(s, s, k); }
  pass(0, 0, col);
}

const DEBRIS = [];

  for (const p of DEBRIS) {

    p.vy += 0.32; p.x += p.vx; p.y += p.vy;

    }

/* 静止部分を1回だけ描いてキャッシュ */
const STAGE_CACHE = {};
function stageCanvas(id) {
  if (STAGE_CACHE[id]) return STAGE_CACHE[id];
  const cv = document.createElement('canvas');
  cv.width = SCREEN_W * 2; cv.height = SCREEN_H * 2;
  const c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.setTransform(2, 0, 0, 2, 0, 0);
  STAGES[id].draw(c);
  STAGE_CACHE[id] = cv;
  return cv;
}
function drawStage(c, id, fr) {
  c.drawImage(stageCanvas(id), 0, 0, SCREEN_W, SCREEN_H);
  if (STAGES[id].anim) STAGES[id].anim(c, fr);
}

'use strict';
/* ============================================================
   input.js — キーボード / ゲームパッド / 画面タッチ → 入力ビット
   ============================================================ */
const KEYS_SOLO = {
  KeyW: IN.UP, ArrowUp: IN.UP, KeyS: IN.DOWN, ArrowDown: IN.DOWN, KeyA: IN.LEFT, ArrowLeft: IN.LEFT, KeyD: IN.RIGHT, ArrowRight: IN.RIGHT,
  KeyZ: IN.A, KeyF: IN.A, KeyJ: IN.A, KeyX: IN.B, KeyG: IN.B, KeyK: IN.B,
};
const KEYS_P1 = { KeyW: IN.UP, KeyS: IN.DOWN, KeyA: IN.LEFT, KeyD: IN.RIGHT, KeyF: IN.A, KeyG: IN.B };
const KEYS_P2 = { ArrowUp: IN.UP, ArrowDown: IN.DOWN, ArrowLeft: IN.LEFT, ArrowRight: IN.RIGHT, Comma: IN.A, KeyK: IN.A, Period: IN.B, KeyL: IN.B };

const Input = {
  mode: 'solo',                 // 'solo'（P1だけ人間）| 'versus'（2人）
  held: new Set(),              // いま押されているキー
  hit: new Set(),               // このtickで押されたキー（エッジ）
  tapped: new Set(),            // 前回のpollから今までに押されたキー（一瞬の連打も取りこぼさない）
  masks: [0, 0], prev: [0, 0],
  touch: 0,                     // 画面タッチの入力（P1）
  tap: null,                    // このtickでのタップ位置（論理座標）
  any: false,                   // このtickで何かが押された
  padOn: false,

  keyMask(map) {
    let m = 0;
    for (const k of this.held) if (map[k]) m |= map[k];
    for (const k of this.tapped) if (map[k]) m |= map[k];
    return m;
  },

  padMask(i) {
    let m = 0;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const p = pads[i];
      if (!p) return 0;
      this.padOn = true;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      if (ax < -0.5 || (p.buttons[14] && p.buttons[14].pressed)) m |= IN.LEFT;
      if (ax > 0.5 || (p.buttons[15] && p.buttons[15].pressed)) m |= IN.RIGHT;
      if (ay < -0.5 || (p.buttons[12] && p.buttons[12].pressed)) m |= IN.UP;
      if (ay > 0.5 || (p.buttons[13] && p.buttons[13].pressed)) m |= IN.DOWN;
      if ((p.buttons[0] && p.buttons[0].pressed) || (p.buttons[2] && p.buttons[2].pressed)) m |= IN.A;
      if ((p.buttons[1] && p.buttons[1].pressed) || (p.buttons[3] && p.buttons[3].pressed)) m |= IN.B;
    } catch (e) { /* ゲームパッドが使えない環境 */ }
    return m;
  },

  /* 毎tickの最初に呼ぶ */
  poll() {
    this.prev[0] = this.masks[0]; this.prev[1] = this.masks[1];
    if (this.override) { this.masks[0] = this.override[0]; this.masks[1] = this.override[1]; this.tapped.clear(); return; }   // テスト用
    if (this.mode === 'versus') {
      this.masks[0] = this.keyMask(KEYS_P1) | this.padMask(0) | this.touch;
      this.masks[1] = this.keyMask(KEYS_P2) | this.padMask(1);
    } else {
      this.masks[0] = this.keyMask(KEYS_SOLO) | this.padMask(0) | this.padMask(1) | this.touch;
      this.masks[1] = 0;
    }
    this.tapped.clear();
  },
  /* 毎tickの最後に呼ぶ */
  endTick() { this.hit.clear(); this.tap = null; this.any = false; },

  edge(p, bit) { return (this.masks[p] & bit) !== 0 && (this.prev[p] & bit) === 0; },
  key(code) { return this.hit.has(code); },
  /* メニュー用の「決定」「戻る」 */
  confirm() { return this.edge(0, IN.A) || this.edge(1, IN.A) || this.key('Enter') || this.key('Space'); },
  cancel() { return this.edge(0, IN.B) || this.key('Escape') || this.key('Backspace'); },
  pause() { return this.key('Enter') || this.key('Escape') || this.key('KeyP'); },
  nav() { // -1,0,+1 の十字キー入力（P1/P2どちらでも）
    const e = (b) => this.edge(0, b) || (this.mode === 'versus' && this.edge(1, b));
    return { x: (e(IN.RIGHT) ? 1 : 0) - (e(IN.LEFT) ? 1 : 0), y: (e(IN.DOWN) ? 1 : 0) - (e(IN.UP) ? 1 : 0) };
  },
};

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;      // ルームコード入力中は、ゲームのキーとして扱わない
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { Input.hit.add(e.code); Input.tapped.add(e.code); Input.any = true; }
  Input.held.add(e.code);
  if (typeof Sound !== 'undefined') Sound.unlock();
});
window.addEventListener('keyup', (e) => { Input.held.delete(e.code); });
window.addEventListener('blur', () => { Input.held.clear(); Input.touch = 0; });

/* ---------- 画面タッチ（スマホ） ---------- */
function setupTouch() {
  const root = document.getElementById('touch');
  if (!root) return;
  let locked = false;
  const show = () => {
    root.hidden = false;
    document.documentElement.classList.add('has-touch'); document.body.classList.add('has-touch');
    if (!locked) { locked = true; lockPageGestures(); }
    if (window.fitScreen) window.fitScreen();
  };
  if ('ontouchstart' in window || (navigator.maxTouchPoints | 0) > 0) show();
  window.addEventListener('touchstart', show, { once: true, passive: true });

  const dpad = document.getElementById('dpad'), knob = document.getElementById('knob');
  let dirPtr = null;
  const setDir = (e) => {
    const r = dpad.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = e.clientX - cx, dy = e.clientY - cy, th = r.width * 0.16;
    let m = 0;

  dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dirPtr) setDir(e); });
  const endDir = (e) => { if (e.pointerId === dirPtr) { dirPtr = null; Input.touch &= ~15; knob.style.transform = ''; } };
  dpad.addEventListener('pointerup', endDir); dpad.addEventListener('pointercancel', endDir);

  [['btnA', IN.A], ['btnB', IN.B]].forEach(([id, bit]) => {
    const el = document.getElementById(id);
    let ptr = null;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); ptr = e.pointerId; el.setPointerCapture(e.pointerId); Input.touch |= bit; el.classList.add('on'); Input.any = true; if (typeof Sound !== 'undefined') Sound.unlock(); });
    const up = (e) => { if (e.pointerId === ptr) { ptr = null; Input.touch &= ~bit; el.classList.remove('on'); } };

}

/* スマホで画面が勝手に動かないようにする（拡大・スクロール・跳ね返り）。
   CSS（page.html の .has-touch）と viewport の指定でも止めているが、iPhone の Safari はそれを無視することがあるので、ここでも止める。 */
function lockPageGestures() {
  const opt = { passive: false };
  const inField = (t) => !!(t && t.closest && t.closest('input, textarea'));     // 文字入力欄は除く（指でカーソルを動かせるように）
  // iPhone のピンチ拡大
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault(), opt));
  // 画面上のドラッグ：ページのスクロール／ゴムのような跳ね返り／2本指の拡大／引っぱって更新
  document.addEventListener('touchmove', (e) => { if (e.cancelable && !inField(e.target)) e.preventDefault(); }, opt);
  // ダブルタップ拡大：すばやい2回目のタップを止める（ボタンはクリックが要るので除く）
  let lastEnd = 0;
  document.addEventListener('touchend', (e) => {
    const isButton = !!(e.target && e.target.closest && e.target.closest('#lobby, #btnSound'));
    if (e.cancelable && !isButton && e.timeStamp - lastEnd < 350) e.preventDefault();
    lastEnd = e.timeStamp;
  }, opt);
}

/* キャンバスのタップ（メニュー選択用）：論理座標(256x224)へ変換して渡す */
function setupCanvasTap(cv) {
  cv.addEventListener('pointerdown', (e) => {
    const r = cv.getBoundingClientRect();
    Input.tap = { x: (e.clientX - r.left) / r.width * SCREEN_W, y: (e.clientY - r.top) / r.height * SCREEN_H };
    Input.any = true;
    if (typeof Sound !== 'undefined') Sound.unlock();
  });
}

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

  const m = /^([A-G])(#|b)?(-?\d)$/.exec(tok);

  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;

      if (t === '.') { if (cur) cur.n++; return; }
      if (t === '-') { cur = null; return; }
      cur = { s: step, f: noteFreq(t), n: 1 };
      out.push(cur);
    });
  });

}

'use strict';
/* ============================================================
   rollback.js — ロールバック同期（通信・画面に依存しない純粋なロジック）

   考え方
   ・毎フレーム「自分の入力」だけを相手に送る（直近の入力をまとめて送るので、1つ落ちても平気）
   ・相手の入力がまだ届いていないフレームは「さっきと同じ入力」と予想して先に進む
   ・本物の入力が届いて予想が外れていたら、そのフレームまで状態を巻き戻して、やり直す
   ・シミュレーションは整数だけで決定論なので、両者のやり直し結果は必ず一致する
   ・60フレームごとに状態のハッシュを交換して、ズレ（desync）が起きていないか確かめる
   ============================================================ */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

class RollbackSession {
  /* cfg: createMatch に渡す設定  me: 自分の番号(0=ホスト/左, 1=ゲスト/右) */
  constructor(cfg, me, o) {
    o = o || {};
    this.me = me;
    this.D = o.delay === undefined ? 2 : o.delay;      // 入力を何フレーム遅らせるか（予想はずれを減らす）
    this.maxPred = o.maxPred || 10;                    // 予想だけで先に進める最大フレーム数
    this.seed = cfg.seed;                              // 試合ID（再戦のとき、前の試合のパケットを見分ける）
    this.m = createMatch(cfg);
    this.frame = 0;
    this.localIn = []; this.remoteIn = []; this.used = [];
    this.snaps = new Map();
    for (let f = 0; f < this.D; f++) { this.localIn[f] = 0; this.remoteIn[f] = 0; }   // 開始直後は両者ニュートラル
    this.remoteKnown = this.D - 1;                     // 連続して分かっている相手入力の最後のフレーム
    this.remoteAck = this.D - 1;                       // 相手が受け取ったと伝えてきた、自分の入力の最後のフレーム
    this.verified = 0;                                 // ここより前は「予想なし」で確定済み
    this.evSig = new Map();
    this.stats = { rollbacks: 0, maxDepth: 0, stalls: 0, frames: 0 };
    this.myHash = new Map(); this.theirHash = new Map(); this.nextHash = 60; this.outSums = []; this.desync = -1;
  }

  /* 相手へ送るパケット（まだ確認されていない入力をまとめて） */
  packet() {
    const to = this.localIn.length - 1;
    const start = Math.max(this.remoteAck + 1, to - 30);
    const d = [];
    for (let f = start; f <= to; f++) d.push(this.localIn[f]);
    return { t: 'in', s: this.seed, f: start, d, a: this.remoteKnown };
  }
  takeSums() { const s = this.outSums; this.outSums = []; return s; }

  receive(p) {
    for (let i = 0; i < p.d.length; i++) {
      const fr = p.f + i;
      if (this.remoteIn[fr] === undefined) this.remoteIn[fr] = p.d[i];
    }
    while (this.remoteIn[this.remoteKnown + 1] !== undefined) this.remoteKnown++;
    if (p.a > this.remoteAck) this.remoteAck = p.a;
  }
  receiveSum(f, h) { this.theirHash.set(f, h); this._compare(f); }
  _compare(f) {
    if (this.myHash.has(f) && this.theirHash.has(f) && this.myHash.get(f) !== this.theirHash.get(f) && this.desync < 0) this.desync = f;
  }

  _predict() { return this.remoteKnown >= 0 ? this.remoteIn[this.remoteKnown] : 0; }

  /* 1フレームぶんシミュレーションする（collect に画面向けイベントを積む） */
  _sim(collect) {
    const f = this.frame;
    const mine = this.localIn[f];
    let theirs = this.remoteIn[f];
    if (theirs === undefined) theirs = this._predict();
    const in0 = this.me === 0 ? mine : theirs, in1 = this.me === 0 ? theirs : mine;
    const m = this.m;
    m.events.length = 0;
    this.snaps.set(f, JSON.stringify(m));
    this.used[f] = [in0, in1];
    stepMatch(m, in0, in1);
    // やり直しで同じ出来事を2回鳴らさない（種類＋場所で見分ける）
    let sigs = this.evSig.get(f);
    if (!sigs) { sigs = new Set(); this.evSig.set(f, sigs); }
    for (const e of m.events) {
      const sg = e.t + '|' + (e.n !== undefined ? e.n : e.i !== undefined ? e.i : '') + '|' + ((e.x || 0) >> 11);
      if (!sigs.has(sg)) { sigs.add(sg); collect.push(e); }
    }
    m.events.length = 0;
    this.frame = m.frame;
  }

  /* 毎tick（60Hz）に1回呼ぶ。mask = 今の自分の入力。 */
  tick(mask) {
    const out = { events: [], stalled: false, rolled: 0 };
    const other = this.me === 0 ? 1 : 0;
    // 1) 答え合わせ。予想が外れていたら、その時点まで巻き戻してやり直す
    let mis = -1;
    while (this.verified < this.frame && this.remoteIn[this.verified] !== undefined) {
      if (this.used[this.verified][other] !== this.remoteIn[this.verified]) { mis = this.verified; break; }
      this.verified++;
    }
    if (mis >= 0) {
      const target = this.frame;
      this.m = JSON.parse(this.snaps.get(mis));
      this.frame = mis;
      while (this.frame < target) this._sim(out.events);
      this.stats.rollbacks++;
      out.rolled = target - mis;
      if (out.rolled > this.stats.maxDepth) this.stats.maxDepth = out.rolled;
      while (this.verified < this.frame && this.remoteIn[this.verified] !== undefined) this.verified++;
    }
    // 2) ハッシュ交換（確定したフレームの状態が一致しているか）
    while (this.nextHash <= this.verified && this.snaps.has(this.nextHash)) {
      const h = hashStr(this.snaps.get(this.nextHash));
      this.myHash.set(this.nextHash, h);
      this.outSums.push({ t: 'sum', s: this.seed, f: this.nextHash, h });
      this._compare(this.nextHash);
      this.nextHash += 60;
    }
    // 3) 予想だけで先に進みすぎないよう、相手を待つ
    if (this.frame > this.remoteKnown + this.maxPred) { out.stalled = true; this.stats.stalls++; this._prune(); return out; }
    // 4) 自分の入力を D フレーム先のぶんとして予約し、1フレーム進める
    const lf = this.frame + this.D;
    if (this.localIn[lf] === undefined) this.localIn[lf] = mask;
    this._sim(out.events);
    this.stats.frames++;
    this._prune();
    return out;
  }

  _prune() {
    const keep = Math.min(this.verified - 1, this.nextHash - 1);
    for (const k of this.snaps.keys()) { if (k < keep) this.snaps.delete(k); else break; }
    for (const k of this.evSig.keys()) { if (k < this.frame - 90) this.evSig.delete(k); else break; }
  }
}

'use strict';
/* ============================================================
   net.js — 部屋コードでつなぐ（PeerJS = WebRTCのP2P）。
   ・ホストが4文字のコードを作り、ゲストがそれを入れるとつながる
   ・つながったあとは、ふたりのブラウザが直接やりとりする（入力だけを送る）
   ・コードの受け渡しにだけ、PeerJSの無料の仲介サーバーを使う
   ============================================================ */
const NET_PREFIX = 'kmbt1-';
const NET_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 見まちがえやすい I O 0 1 は使わない
const NET_PROTOCOL = 1;

const Net = {
  peer: null, conn: null, role: null, code: '', status: 'idle', rtt: 0, session: null,
  early: [], pending: [], listener: null, cb: null, lastRecv: 0, timers: [],

  /* テストや将来の自前サーバー用に、?peerhost=... などで仲介サーバーを差し替えられる */
  opts() {
    const q = new URLSearchParams(location.search), base = window.MECHA_NET || {};
    const host = q.get('peerhost') || base.host;
    const o = { debug: 0 };
    if (host) {
      o.host = host; o.port = +(q.get('peerport') || base.port || 9000); o.path = q.get('peerpath') || base.path || '/';
      o.secure = (q.get('peersecure') || (base.secure ? '1' : '0')) === '1';
    }
    if ((q.get('ice') || '') === 'none') o.config = { iceServers: [] };
    return o;
  },
  makeCode() { let s = ''; for (let i = 0; i < 4; i++) s += NET_CHARS[(Math.random() * NET_CHARS.length) | 0]; return s; },
  validCode(c) { return /^[A-HJ-NP-Z2-9]{4}$/.test(c); },
  inviteLink(code) { return location.href.split('#')[0] + '#' + code; },

  reset() {
    this.timers.forEach(clearTimeout); this.timers = [];
    try { if (this.conn) this.conn.close(); } catch (e) { /* 無視 */ }
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* 無視 */ }
    this.peer = null; this.conn = null; this.role = null; this.code = ''; this.status = 'idle'; this.rtt = 0;
    this.session = null; this.early = []; this.pending = []; this.cb = null;
    if (this.pingT) { clearInterval(this.pingT); this.pingT = null; }
  },
  close() { const l = this.listener; this.reset(); this.listener = l; },

  errText(e) {
    const t = e && e.type ? e.type : e;
    switch (t) {
      case 'peer-unavailable': return 'そのコードの へやが みつかりません';
      case 'unavailable-id': return 'コードが つかえませんでした。もういちど';
      case 'network': case 'socket-error': case 'socket-closed': case 'server-error': return 'サーバーに つながりません（ネットを かくにん）';
      case 'webrtc': return 'つうしんの じゅんびに しっぱいしました';
      case 'timeout': return 'じかんぎれ（つうしんが ブロックされているかも）';
      case 'nopeer': return 'このページでは オンラインが つかえません';
      case 'version': return 'あいてと バージョンが ちがいます';
      default: return 'つながりませんでした' + (e && e.message ? '（' + String(e.message).slice(0, 24) + '）' : '');
    }
  },
  fail(e) {
    const cb = this.cb;
    this.status = 'error';
    try { if (this.peer) this.peer.destroy(); } catch (x) { /* 無視 */ }
    if (cb && cb.onError) cb.onError(this.errText(e));
  },

  /* ホスト：コードを作って待つ */
  host(cb) {
    this.reset(); this.cb = cb; this.role = 'host'; this.status = 'opening';
    if (typeof Peer === 'undefined') { this.fail('nopeer'); return; }
    const open = (n) => {
      const code = this.makeCode();
      let peer;
      try { peer = this.peer = new Peer(NET_PREFIX + code, this.opts()); } catch (e) { this.fail(e); return; }
      peer.on('open', () => { this.code = code; this.status = 'waiting'; if (cb.onCode) cb.onCode(code); });
      peer.on('connection', (conn) => { if (this.conn) { try { conn.close(); } catch (e) { /* 無視 */ } return; } this.attach(conn); });
      peer.on('error', (e) => {
        if (e && e.type === 'unavailable-id' && n < 6) { try { peer.destroy(); } catch (x) { /* 無視 */ } open(n + 1); return; }
        this.fail(e);
      });
    };
    open(0);
    this.timers.push(setTimeout(() => { if (this.status === 'opening') this.fail('timeout'); }, 12000));
  },

  /* ゲスト：コードの部屋に入る */
  join(code, cb) {
    this.reset(); this.cb = cb; this.role = 'guest'; this.status = 'connecting'; this.code = code;
    if (typeof Peer === 'undefined') { this.fail('nopeer'); return; }
    let peer;
    try { peer = this.peer = new Peer(this.opts()); } catch (e) { this.fail(e); return; }
    peer.on('open', () => {
      const conn = peer.connect(NET_PREFIX + code, { reliable: true, serialization: 'json' });
      this.attach(conn);
    });
    peer.on('error', (e) => this.fail(e));
    this.timers.push(setTimeout(() => { if (this.status !== 'connected') this.fail('timeout'); }, 20000));
  },

  attach(conn) {
    this.conn = conn;
    conn.on('open', () => {
      this.status = 'connected'; this.lastRecv = performance.now();
      this.send({ t: 'hello', v: NET_PROTOCOL });
      this.pingT = setInterval(() => this.send({ t: 'ping', ts: performance.now() }), 1000);
      if (this.cb && this.cb.onConnect) this.cb.onConnect();
    });
    conn.on('data', (d) => this.onData(d));
    conn.on('close', () => this.lost());
    conn.on('error', () => this.lost());
  },
  send(o) { try { if (this.conn && this.conn.open) this.conn.send(o); } catch (e) { /* 送れなかった */ } },

  onData(d) {
    if (!d || typeof d !== 'object') return;
    this.lastRecv = performance.now();
    switch (d.t) {
      case 'in':
        if (this.session) { if (d.s === this.session.seed) this.session.receive(d); }
        else { this.early.push(d); if (this.early.length > 400) this.early.shift(); }
        return;
      case 'sum': if (this.session && d.s === this.session.seed) this.session.receiveSum(d.f, d.h); return;
      case 'ping': this.send({ t: 'pong', ts: d.ts }); return;
      case 'pong': { const r = performance.now() - d.ts; this.rtt = this.rtt ? this.rtt * 0.7 + r * 0.3 : r; return; }
      default: break;
    }
    if (this.listener) this.listener(d); else this.pending.push(d);
  },
  setListener(fn) { this.listener = fn; if (fn) { const p = this.pending; this.pending = []; p.forEach((m) => fn(m)); } },

  lost() {
    if (this.status === 'lost' || this.status === 'idle') return;
    this.status = 'lost';
    if (this.pingT) { clearInterval(this.pingT); this.pingT = null; }
    if (this.listener) this.listener({ t: '_lost' });
  },
  /* 毎tick：しばらく何も届かなければ切断とみなす */
  watchdog() { if (this.status === 'connected' && performance.now() - this.lastRecv > 6000) this.lost(); },

  /* 試合をはじめる（ホスト・ゲスト共通。cfg は同じ内容） */
  begin(cfg, me) {
    this.session = new RollbackSession(cfg, me, { delay: 2, maxPred: 10 });
    const e = this.early; this.early = [];
    e.forEach((p) => { if (p.s === cfg.seed) this.session.receive(p); });
    return this.session;
  },
  /* 1tickぶんの通信（自分の入力と、ハッシュ） */
  pump() {
    const s = this.session; if (!s) return;
    this.send(s.packet());
    for (const x of s.takeSums()) this.send(x);
  },
};

/* ============================================================

const SceneTitle = {

    this.pair = [0, 1]; this.pairT = 0; this.act = [null, null];

    return [
      { k: 'arcade', label: 'アーケード', sub: 'ひとりで 7にんぬき' },
      { k: 'vs', label: 'VS CPU', sub: 'すきな あいてと たいせん' },

      { k: 'online', label: 'オンライン', sub: 'ともだち・きょうだいと ネットで たいせん' },

/* ============================================================
   キャラ選択
   ============================================================ */
const CELL = { x0: 8, y0: 16, w: 59, h: 60, gap: 2 };
const SceneSelect = {
  enter(p) {
    this.p = p; this.t = 0; this.cur = [Game.last[0], Game.last[1]]; this.step = 0; this.pick = [-1, -1]; this.go = 0;
    Input.mode = p.mode === 'versus' ? 'versus' : 'solo';
    Sound.bgm('title');
    if (p.mode === 'online') {
      this.me = Net.role === 'host' ? 0 : 1; this.started = false; this.lost = false;
      this.cur[this.me] = Game.last[0]; this.cur[1 - this.me] = this.me === 0 ? 3 : 0;
      Net.setListener((m) => this.onNet(m)); this.sendPick();
    }
  },
  /* ---- オンライン ---- */
  sendPick() { Net.send({ t: 'pick', ch: this.cur[this.me], ok: this.pick[this.me] >= 0 }); },
  onNet(m) {
    const o = 1 - this.me;
    if (m.t === 'pick') { this.cur[o] = clamp(m.ch | 0, 0, 7); this.pick[o] = m.ok ? this.cur[o] : -1; }
    else if (m.t === 'start' && this.me === 1 && !this.started) {
      this.started = true;
      const cfg = sanitizeCfg(m.cfg);
      Net.begin(cfg, 1); Game.last = [cfg.ch[1], cfg.ch[0]];
      Game.go('fight', { online: true, me: 1, chars: cfg.ch, cfg, mode: 'online', versus: true });
    } else if (m.t === 'bye' || m.t === '_lost') { this.lost = true; Sound.sfx('cancel'); }
  },
  startMatch() {
    this.started = true;
    const cfg = { ch: [this.pick[0], this.pick[1]], seed: ((Math.random() * 1e9) | 0) + 1, rounds: 2, time: 60 };
    Net.begin(cfg, 0); Net.send({ t: 'start', cfg }); Game.last = [cfg.ch[0], cfg.ch[1]];
    Game.go('fight', { online: true, me: 0, chars: cfg.ch, cfg, mode: 'online', versus: true });
  },
  updateOnline() {
    if (this.lost) { if (Input.any || Input.tap) { Net.reset(); Game.skipPress = true; Game.go('title'); } return; }
    Net.watchdog();
    const me = this.me;
    if (Input.key('Escape')) { Net.send({ t: 'bye' }); Net.reset(); Game.skipPress = true; Game.go('title'); return; }
    if (this.pick[me] >= 0) {
      if (Input.edge(0, IN.B)) { this.pick[me] = -1; Sound.sfx('cancel'); this.sendPick(); }
    } else {
      const n = Input.nav();
      if (n.x || n.y) { this.move(me, n); Sound.sfx('select'); this.sendPick(); }
      let ok = Input.confirm();
      if (Input.tap) {
        const t = Input.tap;
        for (let i = 0; i < 8; i++) { const q = this.cellPos(i); if (t.x >= q.x && t.x < q.x + CELL.w && t.y >= q.y && t.y < q.y + CELL.h) { if (this.cur[me] === i) ok = true; else { this.cur[me] = i; Sound.sfx('select'); this.sendPick(); } } }
      }
      if (ok) { this.pick[me] = this.cur[me]; Sound.sfx('confirm'); this.sendPick(); }
    }
    if (!this.started && this.me === 0 && this.pick[0] >= 0 && this.pick[1] >= 0) this.startMatch();
  },
  cellPos(i) { return { x: CELL.x0 + (i % 4) * (CELL.w + CELL.gap), y: CELL.y0 + ((i / 4) | 0) * (CELL.h + CELL.gap) }; },
  move(k, n) {
    let i = this.cur[k], col = i % 4, row = (i / 4) | 0;
    if (n.x) col = (col + n.x + 4) % 4;
    if (n.y) row = 1 - row;
    this.cur[k] = row * 4 + col;
  },
  start(a, b, lvl, extra) {
    Game.last = [a, b];
    Game.go('fight', Object.assign({ chars: [a, b], versus: this.p.mode === 'versus', lvl, mode: this.p.mode }, extra || {}));
  },
  update() {
    this.t++;
    const mode = this.p.mode;
    if (mode === 'online') { this.updateOnline(); return; }
    if (Input.cancel() && mode !== 'versus' || (mode === 'versus' && Input.key('Escape'))) {
      if (this.step === 1 && mode === 'vs') { this.step = 0; Sound.sfx('cancel'); return; }
      Sound.sfx('cancel'); Game.skipPress = true; Game.go('title'); return;
    }
    if (this.go > 0) { this.go--; if (this.go === 0) this.launch(); return; }
    if (mode === 'versus') {
      for (let k = 0; k < 2; k++) {
        if (this.pick[k] >= 0) { if (Input.edge(k, IN.B)) { this.pick[k] = -1; Sound.sfx('cancel'); } continue; }
        const e = (b) => Input.edge(k, b);
        const n = { x: (e(IN.RIGHT) ? 1 : 0) - (e(IN.LEFT) ? 1 : 0), y: (e(IN.DOWN) ? 1 : 0) - (e(IN.UP) ? 1 : 0) };
        if (n.x || n.y) { this.move(k, n); Sound.sfx('select'); }
        if (e(IN.A) || (k === 0 && Input.key('Enter'))) { this.pick[k] = this.cur[k]; Sound.sfx('confirm'); }
      }
      if (this.pick[0] >= 0 && this.pick[1] >= 0) this.go = 40;
      return;
    }
    const k = this.step;               // 0: 自分  1: 相手（VS CPU）
    const n = Input.nav();
    if (n.x || n.y) { this.move(k, n); Sound.sfx('select'); }
    if (Input.tap) {
      const t = Input.tap;
      for (let i = 0; i < 8; i++) { const p = this.cellPos(i); if (t.x >= p.x && t.x < p.x + CELL.w && t.y >= p.y && t.y < p.y + CELL.h) { if (this.cur[k] === i) this.decide(); else { this.cur[k] = i; Sound.sfx('select'); } } }
    }
    if (Input.confirm()) this.decide();
  },
  decide() {
    Sound.sfx('confirm');
    if (this.p.mode === 'vs' && this.step === 0) { this.step = 1; return; }
    this.pick[0] = this.cur[0]; this.pick[1] = this.cur[1]; this.go = 30;
  },
  launch() {
    const mode = this.p.mode;
    if (mode === 'arcade') {
      const me = this.cur[0], others = [0, 1, 2, 3, 4, 5, 6, 7].filter((i) => i !== me);
      for (let i = others.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = others[i]; others[i] = others[j]; others[j] = t; }
      const ladder = others.map((ch, i) => ({ ch, lvl: [0, 0, 1, 1, 2, 2, 3][i] }));
      Game.arcade = { me, ladder, idx: 0 };
      Game.last = [me, ladder[0].ch];
      Game.go('fight', { chars: [me, ladder[0].ch], lvl: ladder[0].lvl, mode: 'arcade', versus: false, stageNo: 1 });
    } else if (mode === 'vs') this.start(this.pick[0], this.pick[1], Game.level);
    else this.start(this.pick[0], this.pick[1], 0, { versus: true });
  },
  drawCell(c, i) {
    const p = this.cellPos(i), C = CHARS[i], fr = this.t;
    const stCol = { factory: '#ffc888', castle: '#9cd0fc', aso: '#a8e090', balloon: '#8cc4fc', mathlab: '#b8e8d0', ariake: '#fce0a0', storm: '#c8e0fc', live: '#fcd0e0' }[C.stage];

      this.ai = [p.cpu0 ? newAI(p.lvl, (Math.random() * 1e6) | 0) : null, p.versus ? null : newAI(p.lvl, (Math.random() * 1e6) | 0)];

      if (p.versus) this.stage = CHARS[p.chars[(Math.random() * 2) | 0]].stage;

  },
  handle(evs) {
    const m = this.m;
    for (const e of evs) {
      const x = (e.x || 0) / SP, y = FLOOR_Y - (e.y || 0) / SP;
      switch (e.t) {
        case 'snd': Sound.sfx(e.n); break;
        case 'hit':
          Sound.sfx('hit' + e.p); fxAdd('hit', x, y, { p: e.p, life: 11 });
          this.shake = Math.max(this.shake, e.p === 2 ? 5 : e.p === 1 ? 3 : 1);
          if (m.f[e.n].comboN >= 2) this.combo = { n: m.f[e.n].comboN, t: 70, side: 1 - e.n };
          break;
        case 'block': Sound.sfx('block'); fxAdd('block', x, y, { life: 8 }); break;
        case 'counter': Sound.sfx('counter'); fxAdd('counter', x, y, { life: 26 }); this.shake = 5; this.flash = 4; break;
        case 'land': fxAdd('dust', x, FLOOR_Y, { life: 10 }); Sound.sfx('land'); break;
        case 'down': fxAdd('dust', x, FLOOR_Y, { life: 12 }); Sound.sfx('down'); break;
        case 'puff': fxAdd('puff', x, FLOOR_Y, { life: 14 }); break;
        case 'burst': fxAdd('burst', x, y, { life: 10 }); Sound.sfx('burst'); this.shake = Math.max(this.shake, 2); break;
        case 'pop': fxAdd('pop', x, y, { life: 8 }); Sound.sfx('pop'); break;
        case 'clash': fxAdd('clash', x, y, { life: 9 }); Sound.sfx('clash'); break;

  },
  openPause() { this.pause = { sel: 0, view: 'menu' }; Sound.sfx('pause'); },
  updatePause() {
    const ps = this.pause, items = ['つづける', 'わざひょう', 'キャラせんたくへ', 'タイトルへ'];
    if (ps.view === 'moves') { if (Input.confirm() || Input.cancel() || Input.tap) { ps.view = 'menu'; Sound.sfx('cancel'); } return; }
    const n = Input.nav();
    if (n.y) { ps.sel = (ps.sel + n.y + items.length) % items.length; Sound.sfx('select'); }
    if (Input.tap) { const t = Input.tap; items.forEach((s, i) => { const y = 84 + i * 18; if (t.y >= y - 3 && t.y < y + 15 && t.x > 56 && t.x < 200) { ps.sel = i; Input.hit.add('Enter'); } }); }
    if (Input.cancel() || Input.key('KeyP') || (Input.key('Enter') && ps.sel === 0)) { this.pause = null; Sound.sfx('pause'); return; }

    this.final = this.arcade && this.win && A && A.idx >= A.ladder.length - 1;
    if (this.arcade) {
      if (this.win) this.items = this.final ? [] : ['つぎの あいてへ'];
      else this.items = ['コンティニュー', 'あきらめる'];
    } else this.items = this.online ? ['もういちど', 'キャラせんたく', 'やめる'] : ['もういちど', 'キャラせんたく', 'タイトルへ'];
    if (this.final) { Game.go('ending', {}); return; }
    Input.mode = p.p.versus && !this.online ? 'versus' : 'solo';
    Sound.bgm(null);
    if (this.online) Net.setListener((m) => this.onNet(m));
  },
  onNet(m) {
    if (m.t === 'rematch') { this.themR = true; this.tryRematch(); }
    else if (m.t === 'toSelect') { Game.go('select', { mode: 'online' }); }
    else if (m.t === 'start' && Net.role === 'guest') {
      const cfg = sanitizeCfg(m.cfg);
      Net.begin(cfg, 1);
      Game.go('fight', { online: true, me: 1, chars: cfg.ch, cfg, mode: 'online', versus: true });
    } else if (m.t === 'bye' || m.t === '_lost') { this.lost = true; Sound.sfx('cancel'); }
  },
  tryRematch() {
    if (!(this.meR && this.themR) || Net.role !== 'host') return;
    const cfg = { ch: this.p.p.chars.slice(), seed: ((Math.random() * 1e9) | 0) + 1, rounds: 2, time: 60 };
    Net.begin(cfg, 0); Net.send({ t: 'start', cfg });
    Game.go('fight', { online: true, me: 0, chars: cfg.ch, cfg, mode: 'online', versus: true });
  },
  update() {
    this.t++;
    if (this.online) Net.watchdog();
    if (this.lost) { if (this.t >= 30 && (Input.confirm() || Input.tap)) { Net.reset(); Game.skipPress = true; Game.go('title'); } return; }
    if (this.t < 30) return;
    const n = Input.nav();
    if (n.y) { this.sel = (this.sel + n.y + this.items.length) % this.items.length; Sound.sfx('select'); }
    if (Input.tap) { const t = Input.tap; this.items.forEach((s, i) => { const y = 104 + i * 18; if (t.y >= y - 3 && t.y < y + 15 && t.x > 118) { this.sel = i; Input.hit.add('Enter'); } }); }
    if (Input.confirm()) this.choose(this.items[this.sel]);
  },
  choose(label) {
    Sound.sfx('confirm');
    const A = Game.arcade, p = this.p.p;
    if (this.online) {
      if (label === 'もういちど') { if (!this.meR) { this.meR = true; Net.send({ t: 'rematch' }); this.tryRematch(); } }
      else if (label === 'キャラせんたく') { Net.send({ t: 'toSelect' }); Game.go('select', { mode: 'online' }); }
      else { Net.send({ t: 'bye' }); Net.reset(); Game.skipPress = true; Game.go('title'); }
      return;
    }
    if (label === 'つぎの あいてへ') {
      A.idx++; const o = A.ladder[A.idx];
      Game.go('fight', { chars: [A.me, o.ch], lvl: o.lvl, mode: 'arcade', versus: false, stageNo: A.idx + 1 });
    } else if (label === 'コンティニュー') {
      const o = A.ladder[A.idx];
      Game.go('fight', { chars: [A.me, o.ch], lvl: o.lvl, mode: 'arcade', versus: false, stageNo: A.idx + 1 });
    } else if (label === 'もういちど') Game.go('fight', p);
    else if (label === 'キャラせんたく') Game.go('select', { mode: p.mode });
    else { Game.skipPress = true; Game.go('title'); }
  },
  render(c) {
    const p = this.p, m = p.p, w = p.winner;
    const fr = this.t;
    starBg(c, fr);
    grassStrip(c, FLOOR_Y);
    const wc = m.chars[w];
    const f = viewFighter(wc, 62, 1, 'win', null, 0, fr); f.i = 0;
    drawFighter(c, f, { phase: 'view', projs: [] }, fr);
    let head;
    if (this.arcade) head = this.win ? 'YOU WIN!' : 'YOU LOSE...';
    else if (this.online) head = this.win ? 'YOU WIN!' : 'YOU LOSE...';
    else head = m.versus ? (w === 0 ? '1P WIN!' : '2P WIN!') : (w === 0 ? 'YOU WIN!' : 'YOU LOSE...');
    text5(c, head, 128, 20, this.win ? '#fcd838' : '#fc7460', 3, { align: 'c' });
    jpO(c, CHARS[wc].name + ' の かち！', 128, 50, '#ffffff', { align: 'c' });
    if (this.arcade && this.win) { const A = Game.arcade; jpO(c, 'つぎは ' + CHARS[A.ladder[A.idx + 1].ch].name + ' だ！（のこり ' + (A.ladder.length - A.idx - 1) + 'にん）', 128, 66, '#fff2a8', { align: 'c' }); }
    if (this.arcade && !this.win) jpO(c, 'あきらめずに もういちど！', 128, 66, '#fff2a8', { align: 'c' });
    if (this.t >= 30) {
      const px = 118, ph = 14 + this.items.length * 18;
      panel(c, px, 96, 128, ph, '#101040');
      this.items.forEach((s, i) => { const y = 104 + i * 18; if (i === this.sel) cursorMark(c, px + 8, y + 2, fr); jp(c, s, px + 22, y, i === this.sel ? '#fcd838' : '#fcfcfc'); });
      if (this.online) {
        const msg = this.meR && !this.themR ? 'あいての へんじを まっています…' : this.themR && !this.meR ? 'あいては もういちど したいって！' : '';
        if (msg) jpO(c, msg, 128, 170, '#fff2a8', { align: 'c' });
        text5(c, 'PING ' + (Math.round(Net.rtt) || '--') + 'MS', 6, 214, '#ffffff', 1, { ocol: NAVY });
      }
      if (this.lost) { R(c, 0, 0, SCREEN_W, SCREEN_H, 'rgba(0,0,30,0.6)'); panel(c, 24, 80, 208, 54, '#101040'); jp(c, 'あいてが いなくなりました', 128, 92, '#fc7460', { align: 'c' }); jp(c, 'なにかキーで タイトルへ', 128, 112, '#a4e4fc', { align: 'c' }); }
    }
  },
};
const SceneEnding = {
  enter() { this.t = 0; Sound.bgm('title'); Input.mode = 'solo'; this.me = Game.arcade ? Game.arcade.me : 0; },
  update() { this.t++; if (this.t > 120 && (Input.confirm() || Input.tap)) { Sound.sfx('confirm'); Game.skipPress = true; Game.go('title'); } },
  render(c) {
    const fr = this.t;
    starBg(c, fr, '#0c0c2c', '#18184c');
    text5(c, 'ALL CLEAR!', 128, 14, '#fcd838', 3, { align: 'c' });
    jpO(c, 'ぜんいん たおした！おめでとう！', 128, 42, '#ffffff', { align: 'c' });
    jpO(c, CHARS[this.me].name + ' は さいきょうの ロボだ', 128, 58, '#fff2a8', { align: 'c' });
    ['きょうだいで また あそぼう！', 'こんどは オンラインで…'].forEach((s, i) => jpO(c, s, 128, 80 + i * 14, '#ffffff', { align: 'c' }));
    // 後列4体と前列4体
    grassStrip(c, FLOOR_Y + 6);
    for (let row = 0; row < 2; row++) {
      for (let k = 0; k < 4; k++) {
        const i = row * 4 + k, x = (row === 0 ? 30 : 58) + k * 56;
        const f = viewFighter(i, x, 1, 'win', null, 0, fr + i * 5);
        c.save(); c.translate(0, row === 0 ? -14 : 6); drawFighter(c, f, { phase: 'view', projs: [] }, fr + i * 7); c.restore();
      }
    }
    if (this.t > 120 && (fr >> 5) & 1) jpO(c, 'A:タイトルへ', 128, 210, '#ffffff', { align: 'c' });
  },
};

/* 相手から届いた設定を、安全な範囲に直す（ふつうは変わらない） */
function sanitizeCfg(c) {
  c = c || {};
  const ch = Array.isArray(c.ch) ? c.ch : [0, 1];
  return { ch: [clamp(ch[0] | 0, 0, CHARS.length - 1), clamp(ch[1] | 0, 0, CHARS.length - 1)], seed: (c.seed | 0) || 1, rounds: 2, time: 60 };
}
const SCENES = { title: SceneTitle, help: SceneHelp, online: SceneOnline, select: SceneSelect, fight: SceneFight, result: SceneResult, ending: SceneEnding };

'use strict';
/* ============================================================
   main.js — 起動・固定60Hzのループ・画面サイズ合わせ
   ============================================================ */
(function boot() {
  const cv = document.getElementById('screen');
  const c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  Game.c = c; Game.cv = cv;
  buildAllSprites();
  Sound.init();
  setupTouch();
  setupCanvasTap(cv);

  /* 画面サイズ：画面以外（ヒント・ロビー・スマホのボタン）と余白を引いて、収まる最大の大きさに（大きい時は整数倍でドットをそろえる）。
     スマホではページを固定している（スクロールできない）ので、1pxもはみ出さないよう、実際の余白・すき間から数える。 */
  function fit() {
    const stage = document.getElementById('stage');
    const cs = getComputedStyle(document.getElementById('app'));
    const gap = parseFloat(cs.rowGap) || 0;
    let others = 0;                                   // 画面の下に並ぶものの高さ（すき間込み）
    for (const id of ['lobby', 'hint', 'touch']) {
      const el = document.getElementById(id);
      if (!el || el.hidden) continue;
      const st = getComputedStyle(el);
      if (st.display === 'none' || st.position === 'fixed') continue;   // 横向きのスマホでは、ボタンは画面に重ねるので場所をとらない
      others += el.offsetHeight + gap;
    }
    const frame = 4;                                  // 画面のふち（上下2pxずつ）
    const availW = stage.clientWidth;
    const baseH = document.body.classList.contains('has-touch') ? document.body.clientHeight : window.innerHeight;   // スマホは、ノッチ等を除いた高さ
    const availH = baseH - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0) - others - frame;
    let s = Math.min(availW / SCREEN_W, availH / SCREEN_H);
    if (s >= 2) s = Math.floor(s);
    s = Math.max(0.5, s);
    cv.style.width = Math.floor(SCREEN_W * s) + 'px';
    cv.style.height = Math.floor(SCREEN_H * s) + 'px';
  }
  window.fitScreen = fit;
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 200));
  fit();

  const sb = document.getElementById('btnSound');
  const syncSound = () => { if (sb) sb.textContent = 'おと ' + (Sound.on ? 'ON' : 'OFF'); };
  if (sb) sb.addEventListener('click', () => { Sound.toggle(); syncSound(); });
  syncSound();

  // オンライン：ルームコード入力欄
  const rc = document.getElementById('roomCode'), rg = document.getElementById('roomGo'), rcp = document.getElementById('roomCopy');
  if (rc) {
    rc.addEventListener('input', () => { rc.value = rc.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
    // スマホ：キーボードを閉じたあと、ページがずれたままにならないよう戻す
    rc.addEventListener('blur', () => { if (document.body.classList.contains('has-touch')) setTimeout(() => window.scrollTo(0, 0), 60); });
    rc.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); SceneOnline.submit(); }
      else if (e.key === 'Escape') { SceneOnline.back(); rc.blur(); }
    });
  }
  if (rg) rg.addEventListener('click', () => SceneOnline.submit());
  if (rcp) rcp.addEventListener('click', () => SceneOnline.copyLink());
  // 招待リンク（…#ABCD）で開かれたら、スタート後に自動でその部屋へ入る
  const hashCode = (location.hash || '').slice(1).toUpperCase();
  if (Net.validCode(hashCode)) Game.pendingJoin = hashCode;

  Game.go('title');

  // タブを離れたら対戦を自動でポーズ
  document.addEventListener('visibilitychange', () => {
    const sc = Game.scene;
    if (document.hidden && Game.sceneName === 'fight' && sc && !sc.pause && sc.m.phase === 'fight') sc.openPause();
  });

  function tick() {
    Input.poll();
    if (Input.key('KeyM')) { Sound.toggle(); syncSound(); }
    Game.fr++;
    Game.scene.update();
    Input.endTick();
  }
  function draw() {
    c.setTransform(2, 0, 0, 2, 0, 0);
    c.imageSmoothingEnabled = false;
    Game.scene.render(c);
  }

  const STEP = 1000 / FPS;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(100, now - last) * (Game.speed || 1);   // Game.speed はテスト用の倍速
    last = now;
    if (!Game.hold) {                                          // Game.hold はテスト用の一時停止
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 12) { acc -= STEP; n++; tick(); }
      if (n >= 12) acc = 0;
    }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 動作確認用（ブラウザのテストから呼ぶ）
  window.__mecha = { Game, Input, SCENES, tick, draw, CHARS, stepMatch, fit, Net, SceneOnline };
})();

</script>
