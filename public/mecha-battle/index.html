/* 青空の下で遊ぶ小さなゲーム機。ページ全体を明るい空色にして、ボタンはゲーム内の赤・青・黄色を使う。 */
:root {
  color-scheme: light;
  --bg: #d6ecff;
  --panel: #ffffff;
  --line: #8cb8e8;
  --fg: #14325a;
  --dim: #46688f;
  --accent: #fcb800;
  --hot: #fc5c3c;
  --pad: #eef7ff;
  --font-ui: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
}
html, body { height: 100%; }
html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, #b8dcff 0%, var(--bg) 40%, #eaf6ff 100%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
/* スマホ：ページを「ゲーム機の画面」のように固定する。
   ピンチ／ダブルタップの拡大、ドラッグでのスクロール、ゴムのような跳ね返り、引っぱって更新を、すべて止める。
   （.has-touch は input.js が、タッチできる端末でだけ付ける。パソコンは今までどおり） */
html.has-touch, body.has-touch { touch-action: none; }
html.has-touch { padding: 0; overflow: hidden; }   /* ノッチ分の余白を html に足すと、ページが画面より長くなって動いてしまう */
body.has-touch {
  position: fixed; left: 0; right: 0; width: 100%; height: auto; overflow: hidden;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);   /* ノッチやホームバーにかぶらない */
}
#app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 1100px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 12px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#stage { position: relative; width: 100%; display: flex; justify-content: center; }
#screen {
  display: block;
  image-rendering: pixelated;
  background: #000;
  border: 2px solid var(--line);
  box-shadow: 0 0 0 2px #14325a, 0 10px 30px rgba(20, 50, 90, 0.35);
  touch-action: none;
  outline: none;
  max-width: 100%;
}
#hint {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 14px;
  margin: 0;
  color: var(--dim);
  font-size: 13px;
  text-align: center;
}
#hint b { color: var(--hot); font-weight: normal; }
body.has-touch #hint .keys { display: none; }
#btnSound, #btnPause {
  font: inherit;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 10px;
  cursor: pointer;
}
#btnSound:focus-visible, #btnPause:focus-visible, .pad:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#btnPause { display: none; position: absolute; bottom: 6px; right: 6px; z-index: 2; padding: 4px 12px; background: rgba(255, 255, 255, 0.85); letter-spacing: 2px; }
body.has-touch #btnPause { display: block; }

/* オンライン：ルームコードの入力 */
#lobby { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#roomInputRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
#roomInputRow label { color: var(--fg); }
#roomCode {
  width: 5.2em; font: inherit; font-size: 26px; letter-spacing: 0.25em; text-align: center; text-transform: uppercase;
  padding: 4px 8px; color: var(--fg); background: #fff; border: 3px solid #14325a; border-radius: 6px;
}
#roomCode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#roomGo, #roomCopy {
  font: inherit; font-size: 16px; color: #fff; background: var(--hot); border: 3px solid #14325a; border-radius: 6px;
  padding: 6px 16px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
}
#roomCopy { background: #3c78fc; max-width: 100%; overflow-wrap: anywhere; }
#roomGo:focus-visible, #roomCopy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* スマホ用の操作ボタン */
#touch {
  width: 100%;
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#dpad {
  position: relative;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #ffffff 0%, var(--pad) 70%);
  border: 2px solid var(--line);
  touch-action: none;
}
#dpad::before, #dpad::after { content: ""; position: absolute; background: #b4d4f4; border-radius: 6px; }
#dpad::before { left: 50%; top: 9%; width: 30%; height: 82%; transform: translateX(-50%); }
#dpad::after { top: 50%; left: 9%; height: 30%; width: 82%; transform: translateY(-50%); }
#knob {
  position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; margin: -18% 0 0 -18%;
  border-radius: 50%; background: var(--accent); border: 2px solid #14325a; z-index: 1;
  transition: transform 40ms linear;
}
#btns { display: flex; gap: 14px; align-items: flex-end; }
.pad {
  width: 78px; height: 78px; border-radius: 50%;
  font: inherit; font-size: 26px; line-height: 1; color: #fff;
  background: var(--hot); border: 3px solid #14325a; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.22);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  touch-action: none; cursor: pointer; padding: 0;
}
.pad small { font-size: 11px; opacity: 0.9; }
#btnB { background: #3c78fc; margin-bottom: 30px; }
.pad.on { transform: translateY(2px); filter: brightness(1.25); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.28); }
@media (orientation: landscape) and (max-height: 520px) {
  #btnPause { bottom: auto; top: 6px; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  #touch > * { pointer-events: auto; opacity: 0.82; }
  #hint { display: none; }
}
</style>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="512" height="448" aria-label="ゲーム画面"></canvas>
    <button id="btnPause" type="button" aria-label="ポーズ">||</button>
  </div>
  <div id="lobby" hidden>
    <div id="roomInputRow" hidden>
      <label for="roomCode">ルームコード</label>
      <input id="roomCode" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" inputmode="text">
      <button id="roomGo" type="button">つなぐ</button>
    </div>
    <button id="roomCopy" type="button" hidden>しょうたいリンクを コピー</button>
  </div>
  <p id="hint">
    <span class="keys"><b>うごき</b> WASD / やじるし</span>
    <span class="keys"><b>パンチ</b> Z</span>
    <span class="keys"><b>キック</b> X</span>
    <span class="keys"><b>ポーズ</b> Enter</span>
    <span class="keys">はじめに 画面を クリック</span>
    <button id="btnSound" type="button">おと ON</button>
  </p>
  <div id="touch" hidden>
    <div id="dpad" aria-label="十字キー"><div id="knob"></div></div>
    <div id="btns">
      <button id="btnB" class="pad" type="button" aria-label="キック">B<small>キック</small></button>
      <button id="btnA" class="pad" type="button" aria-label="パンチ">A<small>パンチ</small></button>
    </div>
  </div>
</div>

const SP = 256;                       // 1px = 256 サブピクセル
const SCREEN_W = 256, SCREEN_H = 224; // ファミコンっぽい解像度
const FLOOR_Y = 190;                  // 床（足が付く画面Y）

const FPS = 60;
// ジャンプの高さの倍率（1 = 最初の高さ）。初速と重力をどちらも同じ倍率にするので、滞空時間は変わらず、高さだけが変わる。
const JUMP_MUL = 2;

// 入力ビット
const IN = { UP: 1, DOWN: 2, LEFT: 4, RIGHT: 8, A: 16, B: 32 };

const S = (n) => Math.round(n * SP);
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const sgn = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const absI = (v) => (v < 0 ? -v : v);

// 決定論的な乱数（xorshift32）。Math.random は対戦ロジックでは使わない。
function rngNext(r) {
  let x = r.s | 0;
  if (x === 0) x = 0x2545f491;
  x ^= x << 13;
  x ^= x >>> 17;
  x ^= x << 5;
  r.s = x | 0;
  return x >>> 0;
}
function rngInt(r, n) { return rngNext(r) % n; }

  // 技の中のジャンプ（アッパーなど）や、吹っ飛びの重力は、これまでの grav のまま。
  st.jumpG = st.grav * JUMP_MUL;

  else if (inp & back) { f.st = 'walk'; f.vx = -f.face * C.stats.back; }

}

function tickAir(m, f, o, C, live) {
  if (live && !f.airAtk && (f.bufA > 0 || f.bufB > 0)) {

    f.y = 0; f.vy = 0; f.vx = 0; f.st = 'idle'; f.t = 0; f.airAtk = false;
    if (f.x !== o.x) f.face = o.x > f.x ? 1 : -1;
    ev(m, 'land', { x: f.x });

}

function tickAtk(m, f, C) {
  const mv = C.moves[f.mv], p = mv.phases[f.ph];

    f.vy -= f.jmp ? C.stats.jumpG : C.stats.grav; f.y += f.vy;   // ジャンプ中の空中技は、ジャンプの続き（同じ放物線）
    if (f.y <= 0) { f.y = 0; f.vy = 0; landed = true; }
  }
  f.x += f.vx; clampX(f);
  f.pt++;
  if (landed) {
    ev(m, 'land', { x: f.x });
    if (p.land) { advance(m, f); return; }
    if (mv.landPh !== undefined && f.ph < mv.landPh) { enterPhase(m, f, mv.landPh); return; }
    if (mv.air) { f.airAtk = false; endMove(f); return; }

/* ---------- 当たり判定 ---------- */

    const p = fPhase(a);
    if (!p.hit) continue;
    const last = a.hd[a.ph];
    if (last !== undefined && !(p.hit.mh && a.pt - last >= p.hit.mh)) continue;
    if (!hittable(d)) continue;

/* ---------- 飛び道具 ---------- */

function stepProjs(m) {

  for (const pr of m.projs) {
    if (pr.dead) continue;
    pr.age++;
    if (pr.delay > 0) {
      pr.delay--;
      if (pr.delay === 0 && (pr.type === 'bolt' || pr.type === 'pillar')) ev(m, 'snd', { n: pr.type, i: pr.own });
      continue;
    }
    if (--pr.life < 0) { pr.dead = true; continue; }
    pr.vy -= pr.grav; pr.x += pr.vx; pr.y += pr.vy;
    const hh = pr.h >> 1, hw = pr.w >> 1;

    }
    if (pr.x < -S(30) || pr.x > S(SCREEN_W + 30)) { pr.dead = true; continue; }
    if (!live) continue;
    const pb = [pr.x - hw, pr.y - hh, pr.x + hw, pr.y + hh];
    const d = m.f[1 - pr.own];
    // 反射（ルートのリフレクト）
    if (d.st === 'atk') {
      const ep = fPhase(d);
      if (ep.reflect && ov(pb, fbox(d, ep.reflect.box))) {
        pr.own = d.i; pr.vx = -pr.vx; pr.dir = -pr.dir; pr.hits = {}; pr.life = Math.max(pr.life, 40);
        ev(m, 'reflect', { x: pr.x, y: pr.y });

      }
    }
    if (hittable(d)) {
      const ub = hurtBox(d);
      const last = pr.hits[d.i];
      if (ov(pb, ub) && (last === undefined || (pr.mh && pr.age - last >= pr.mh))) {
        pr.hits[d.i] = pr.age;

/* ---------- からだの押し合い ---------- */
function resolvePush(m) {
  const a = m.f[0], b = m.f[1];
  const solid = (f) => f.st !== 'down' && f.st !== 'wake' && f.st !== 'ko' && !(f.st === 'atk' && fPhase(f).hide);
  if (!solid(a) || !solid(b)) return;
  if (absI(a.y - b.y) >= S(28)) return;
  const pw = (CHARS[a.ch].stats.push + CHARS[b.ch].stats.push) >> 1;
  const dx = b.x - a.x, ad = absI(dx);
  if (ad >= pw) return;
  const dir = dx > 0 ? 1 : dx < 0 ? -1 : (a.face > 0 ? 1 : -1);
  const over = pw - ad, h1 = over >> 1, h2 = over - h1;
  a.x -= dir * h1; b.x += dir * h2;
  const ax = a.x, bx = b.x;
  clampX(a); clampX(b);

  if (lostA !== 0) { b.x += dir * absI(lostA); clampX(b); }
  if (lostB !== 0) { a.x -= dir * absI(lostB); clampX(a); }
}

/* ---------- 1フレーム進める ---------- */
function stepMatch(m, in0, in1) {
  m.frame++;
  bufferInput(m.f[0], in0);
  bufferInput(m.f[1], in1);
  if (m.freeze > 0) { m.freeze--; return; }
  switch (m.phase) {
    case 'intro':
      m.pt++;
      m.f.forEach((f) => tickFighter(m, f));
      if (m.pt >= INTRO_FRAMES) {
        m.phase = 'fight'; m.pt = 0;
        m.f.forEach((f) => { f.bufA = 0; f.bufB = 0; });
        ev(m, 'fight');
      }
      break;
    case 'fight': stepFight(m); break;
    case 'end':
      m.pt++;
      m.f.forEach((f) => tickFighter(m, f));
      stepProjs(m);
      resolvePush(m);
      if (m.pt >= (m.endWhy === 'ko' ? END_KO_FRAMES : END_TIME_FRAMES)) finishRound(m);
      break;
    default: // over：勝負がつかなければ、少し見せてから次のラウンドへ（決定論のためシミュレーション側で進める）
      m.pt++;
      if (m.matchWinner < 0 && m.pt >= OVER_ROUND_FRAMES) nextRound(m);
      break;
  }
}

function stepFight(m) {
  const a = m.f[0], b = m.f[1];
  m.timer--;
  tickFighter(m, a);
  tickFighter(m, b);
  stepProjs(m);
  resolveHits(m);
  resolvePush(m);
  if (a.st === 'ko' || b.st === 'ko') endRound(m, 'ko');
  else if (m.timer <= 0) endRound(m, 'time');
}

function endRound(m, why) {
  const a = m.f[0], b = m.f[1];
  let w;
  if (why === 'ko') {
    const ka = a.st === 'ko', kb = b.st === 'ko';
    w = ka && kb ? rngInt(m.rng, 2) : ka ? 1 : 0;
  } else {
    const ra = a.hp * CHARS[b.ch].stats.hp, rb = b.hp * CHARS[a.ch].stats.hp; // HP割合の比較（整数の掛け算で）
    w = ra > rb ? 0 : rb > ra ? 1 : -1;
  }
  m.roundWinner = w; m.phase = 'end'; m.pt = 0; m.endWhy = why;
  ev(m, 'end', { why, w });
}

  const w = m.roundWinner;
  if (w >= 0) {
    m.wins[w]++;
    const wf = m.f[w];
    wf.st = 'win'; wf.t = 0; wf.vx = 0; wf.vy = 0; wf.y = 0; wf.mv = null;
    if (m.wins[w] >= m.cfg.rounds) m.matchWinner = w;
  } else m.draws++;
  m.phase = 'over'; m.pt = 0;
}

/* ============================================================
   ai.js — CPUの思考
   人間と同じ「入力ビット」を毎フレーム返すだけ。シミュレーションは区別しない。
   ============================================================ */
const AI_LEVELS = [
  { react: 0.10, dMin: 16, dMax: 26, spec: 0.55, aggr: 0.34, aa: 0.15, think: [20, 38] },
  { react: 0.28, dMin: 11, dMax: 19, spec: 0.85, aggr: 0.48, aa: 0.40, think: [14, 28] },
  { react: 0.48, dMin: 8, dMax: 14, spec: 1.0, aggr: 0.62, aa: 0.65, think: [10, 22] },
  { react: 0.68, dMin: 6, dMax: 10, spec: 1.2, aggr: 0.78, aa: 0.85, think: [7, 16] },
];

function newAI(level, seed) {
  return { lvl: clamp(level | 0, 0, AI_LEVELS.length - 1), rng: { s: (seed | 0) || 7 }, t: 0, cool: 0, plan: null, pulse: null, react: null };
}
const aiPct = (ai, p) => (rngNext(ai.rng) % 1000) < p * 1000;
const aiRange = (ai, lo, hi) => lo + (rngNext(ai.rng) % (hi - lo + 1));

function cmdParts(key, fwd) {
  switch (key) {
    case 's1': return [fwd, IN.A];
    case 's2': return [fwd, IN.B];
    case 's3': return [IN.DOWN, IN.A];
    case 's4': return [IN.DOWN, IN.B];
    case 'jab': case 'jA': return [0, IN.A];
    default: return [0, IN.B];
  }
}
function makePulse(key, fwd) {
  const [d, b] = cmdParts(key, fwd);
  return { f: [d, d, d | b, d], i: 0 };
}

/* 相手の攻撃が「あと何フレームで」「どこまで」届くか */
function aiThreat(op, dist) {
  if (op.st !== 'atk') return null;
  const mv = CHARS[op.ch].moves[op.mv];
  let frames = 0, travel = 0, reach = -1;
  for (let i = op.ph; i < mv.phases.length; i++) {
    const p = mv.phases[i];
    const rem = i === op.ph ? p.dur - op.pt : p.dur;
    if (p.vx) travel += Math.abs(p.vx) / SP * rem;
    if (p.hit) { reach = (p.hit.box[0] + p.hit.box[2]) / SP; if (p.hit.box[0] < 0) reach = Math.max(reach, -p.hit.box[0] / SP); break; }
    if (p.counter !== undefined) return null;
    frames += rem;
  }
  if (reach < 0) return null;
  return { frames, inRange: dist <= reach + 14 + travel };
}
function aiProjThreat(m, me) {
  for (const pr of m.projs) {
    if (pr.own === me.i || pr.dead || pr.vx === 0) continue;
    const dx = (me.x - pr.x) / SP;
    if (sgn(dx) !== sgn(pr.vx)) continue;
    if (Math.abs(dx) < 112 && Math.abs(dx) > 6 && pr.y < S(70)) return pr;
  }
  return null;
}

function aiChoose(ai, m, me, op, dist, fwd, back, L) {
  const C = CHARS[me.ch];
  const projT = aiProjThreat(m, me);
  const opAir = op.y > S(14);
  const cands = [];
  for (const key of MOVE_KEYS) {
    if (key === 'jA' || key === 'jB') continue;
    const mv = C.moves[key], a = mv.ai;
    if (!a || dist < a.r[0] || dist > a.r[1] || !canStart(m, me, key)) continue;
    let w = a.w;
    const special = key[0] === 's';
    if (a.k === 'aa') w = opAir ? w * 5 : w * 0.3;
    else if (a.k === 'reflect') w = projT ? 10 : 0;
    else if (a.k === 'counter') w = 1;
    else if (a.k === 'proj' && dist < 55) w *= 0.3;
    else if (a.k === 'escape') w = dist < 40 ? w * 1.5 : 0;
    if (special) w *= L.spec;
    if (w > 0) cands.push([key, w]);

  const downOp = op.st === 'down' || op.st === 'wake';
  const pAtk = cands.length === 0 ? 0 : Math.min(0.95, L.aggr * (downOp ? 1.3 : 1) * (dist >= C.pref[0] - 8 && dist <= C.pref[1] + 20 ? 1.15 : 0.9));
  const until = ai.t + aiRange(ai, L.think[0], L.think[1]);

  if (cands.length && aiPct(ai, pAtk)) {
    let tot = 0;
    for (const c of cands) tot += c[1];
    let r = (rngNext(ai.rng) % 10000) / 10000 * tot;
    let key = cands[0][0];
    for (const c of cands) { if (r < c[1]) { key = c[0]; break; } r -= c[1]; }
    ai.pulse = makePulse(key, fwd);
    return { type: 'idle', until: ai.t + 6 };
  }
  // 空中戦が得意なキャラは、中距離から飛び込む
  if (C.airy && dist > 36 && dist < 120 && aiPct(ai, C.airy * L.aggr)) {
    ai.pulse = { f: [IN.UP | fwd, 0], i: 0 };
    return { type: 'idle', until: ai.t + 40 };
  }
  // 位置取り
  const nearWall = me.x < S(WALL_L + 14) || me.x > S(WALL_R - 14);
  if (nearWall && dist < 50 && L.aggr > 0.4 && aiPct(ai, 0.35)) {
    ai.pulse = { f: [IN.UP | fwd, 0], i: 0 };   // 壁際から飛び越える
    return { type: 'idle', until: ai.t + 40 };
  }
  if (dist > C.pref[1]) {
    if (dist > 110 && ai.lvl >= 1 && aiPct(ai, 0.12)) { ai.pulse = { f: [IN.UP | fwd, 0], i: 0 }; return { type: 'idle', until: ai.t + 36 }; }

  }
  if (dist < C.pref[0]) {
    return aiPct(ai, 0.55) ? { type: 'walk', rel: 'b', until } : { type: 'idle', until };
  }
  const r = rngNext(ai.rng) % 100;
  if (r < 40) return { type: 'idle', until };
  if (r < 50) return { type: 'guard', until };
  return { type: 'walk', rel: r < 78 ? 'f' : 'b', until: ai.t + aiRange(ai, 6, 14) };
}

/* 毎フレーム呼ぶ。入力ビットを返す。 */
function aiInput(ai, m, idx) {
  const me = m.f[idx], op = m.f[1 - idx];

  if (m.phase !== 'fight') { ai.pulse = null; ai.plan = null; ai.react = null; return 0; }
  const L = AI_LEVELS[ai.lvl];
  const dxs = op.x - me.x;
  const dist = Math.abs(dxs) / SP;
  const fwd = dxs >= 0 ? IN.RIGHT : IN.LEFT, back = dxs >= 0 ? IN.LEFT : IN.RIGHT;

  if (ai.pulse) {
    const mask = ai.pulse.f[ai.pulse.i++];
    if (ai.pulse.i >= ai.pulse.f.length) ai.pulse = null;
    return mask;
  }
  if (me.st === 'air') {
    if (!me.airAtk && dist < 66 && aiPct(ai, (0.06 + L.aa * 0.1) * (CHARS[me.ch].airy ? 3 : 1))) ai.pulse = { f: [aiPct(ai, 0.5) ? IN.A : IN.B], i: 0 };
    return 0;
  }
  if (me.st === 'block') return back;
  if (me.st !== 'idle' && me.st !== 'walk' && me.st !== 'crouch') return 0;

  const C = CHARS[me.ch];
  // --- 防御の反応 ---
  const thr = aiThreat(op, dist);
  const pr = aiProjThreat(m, me);
  if (!ai.react && ai.cool === 0 && (thr && thr.inRange || pr)) {
    ai.cool = 18;
    if (aiPct(ai, L.react)) {
      const counterKey = C.moves.s3.ai.k === 'counter' ? 's3' : null;
      if (thr && counterKey && thr.frames >= 6 && thr.frames <= 22 && aiPct(ai, 0.3)) {
        ai.pulse = makePulse('s3', fwd);
      } else if (thr && ai.lvl >= 2 && C.moves.s4.ai.k === 'warp' && aiPct(ai, 0.12)) {
        ai.pulse = makePulse('s4', fwd);
      } else if (pr && !thr && ai.lvl >= 1 && aiPct(ai, 0.35)) {
        ai.pulse = { f: [IN.UP | (aiPct(ai, 0.5) ? fwd : 0), 0], i: 0 };
      } else {
        const at = ai.t + aiRange(ai, L.dMin, L.dMax);
        ai.react = { at, until: at + 10 + (thr ? Math.min(thr.frames, 30) : 12) };
      }
      if (ai.pulse) { ai.plan = null; return 0; }
    }
  }
  if (ai.react) {
    if (ai.t >= ai.react.until) ai.react = null;
    else if (ai.t >= ai.react.at) return back;
  }
  // --- 攻め・位置取り ---
  if (!ai.plan || ai.t >= ai.plan.until) ai.plan = aiChoose(ai, m, me, op, dist, fwd, back, L);
  const p = ai.plan;
  if (p.type === 'walk') return p.rel === 'f' ? fwd : back;
  if (p.type === 'guard') return back;
  return 0;
}

/* ---------- 共通色（ファミコンっぽい少数色） ---------- */
const COL = {
  K: '#000000', W: '#fcfcfc', G: '#bcbcbc', g: '#7c7c7c', d: '#383838',
  Y: '#fcd838', y: '#c89800', R: '#d82800', r: '#a81000', O: '#fc9838', o: '#e45c10',
  L: '#80d010', l: '#388800', U: '#3cbcfc', u: '#0058f8', N: '#886400', n: '#503000',
  P: '#f878f8', p: '#a800a0', T: '#a4e4fc',
};

/* ---------- 描画ヘルパー（論理座標のfillRectだけで描く） ---------- */
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function E(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let y = Math.ceil(cy - ry); y < Math.ceil(cy + ry); y++) {
    const dy = (y + 0.5 - cy) / ry;
    const w = Math.sqrt(Math.max(0, 1 - dy * dy)) * rx;
    const x0 = Math.round(cx - w), x1 = Math.round(cx + w);
    if (x1 > x0) c.fillRect(x0, y, x1 - x0, 1);
  }
}
function Tri(c, x0, y0, x1, y1, x2, y2, col) {
  c.fillStyle = col;
  const minY = Math.floor(Math.min(y0, y1, y2)), maxY = Math.ceil(Math.max(y0, y1, y2));
  const minX = Math.floor(Math.min(x0, x1, x2)), maxX = Math.ceil(Math.max(x0, x1, x2));
  for (let y = minY; y < maxY; y++) for (let x = minX; x < maxX; x++) {
    if (inTri(x + 0.5, y + 0.5, x0, y0, x1, y1, x2, y2)) c.fillRect(x, y, 1, 1);
  }
}
function inTri(px, py, x0, y0, x1, y1, x2, y2) {
  const d1 = (px - x1) * (y0 - y1) - (x0 - x1) * (py - y1);
  const d2 = (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
  const d3 = (px - x0) * (y2 - y0) - (x2 - x0) * (py - y0);
  const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(neg && pos);
}
function Line(c, x0, y0, x1, y1, col) {
  c.fillStyle = col;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    c.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
/* 市松（ディザ）塗り */
function Dither(c, x, y, w, h, col, phase) {
  c.fillStyle = col;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (((i + j + (phase | 0)) & 1) === 0) c.fillRect(x + i, y + j, 1, 1);
}

/* ---------- スプライトの元になる「文字グリッド」 ---------- */
const mkGrid = (w, h) => Array.from({ length: h }, () => new Array(w).fill(null));
const GOP = {
  e(g, cx, cy, rx, ry, k) {
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[y][x] = k;
    }
  },
  r(g, x, y, w, h, k) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (j >= 0 && j < g.length && i >= 0 && i < g[0].length) g[j][i] = k;
  },
  p(g, x, y, k) { if (y >= 0 && y < g.length && x >= 0 && x < g[0].length) g[y][x] = k; },
  pp(g, pts, k) { for (const q of pts) GOP.p(g, q[0], q[1], k); },
  l(g, x0, y0, x1, y1, k) {
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      GOP.p(g, x0, y0, k);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
  t(g, x0, y0, x1, y1, x2, y2, k) {
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) if (inTri(x + 0.5, y + 0.5, x0, y0, x1, y1, x2, y2)) g[y][x] = k;
  },
  // 範囲内で from の色だけを to に塗り替える（形はそのまま）
  q(g, x, y, w, h, from, to) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && g[j][i] === from) g[j][i] = to;
  },
  qe(g, cx, cy, rx, ry, from, to) {
    for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1 && g[y][x] === from) g[y][x] = to;
    }
  },
  // 台形（上幅 tw、下幅 bw、高さ h、中心 cx）
  z(g, cx, y, tw, bw, h, k) {
    for (let j = 0; j < h; j++) {
      const w = tw + (bw - tw) * (j / Math.max(1, h - 1));
      GOP.r(g, Math.round(cx - w / 2), y + j, Math.round(w), 1, k);
    }
  },
  // レンガの目地：すでに塗ってある所だけ上書き
  m(g, x, y, w, h, rh, cw, k) {
    for (let r = 0; r * rh < h; r++) {
      const yy = y + r * rh;
      for (let xx = x; xx < x + w; xx++) if (g[yy] && g[yy][xx]) g[yy][xx] = k;
      const off = (r % 2) * (cw >> 1);
      for (let xx = x + off; xx < x + w; xx += cw) for (let j = 1; j < rh; j++) if (g[yy + j] && g[yy + j][xx]) g[yy + j][xx] = k;
    }
  },
};
const SHADED = { B: 1, C: 1, D: 1 };

/* グリッド → キャンバス（縁取り＋ハイライト/影を自動で付ける） */
function buildSprite(w, h, ops, pal) {
  const g = mkGrid(w, h);
  for (const op of ops) GOP[op[0]](g, ...op.slice(1));
  const sh = g.map((r) => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = g[y][x];
    if (!k || !SHADED[k]) continue;
    const up = y > 0 ? g[y - 1][x] : null, dn = y < h - 1 ? g[y + 1][x] : null;
    const lf = x > 0 ? g[y][x - 1] : null, rt = x < w - 1 ? g[y][x + 1] : null;
    const hl = !up || !lf, sd = !dn || !rt;
    if (hl && !sd) sh[y][x] = k + 'H';
    else if (sd && !hl) sh[y][x] = k + 'S';
  }
  const cv = document.createElement('canvas');
  cv.width = w + 2; cv.height = h + 2;
  const c = cv.getContext('2d');
  const colorOf = (k) => pal[k] || COL[k] || '#ff00ff';
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    const k = y >= 0 && y < h && x >= 0 && x < w ? sh[y][x] : null;
    if (k) { c.fillStyle = colorOf(k); c.fillRect(x + 1, y + 1, 1, 1); continue; }
    // 縁取り：上下左右のどれかに絵があれば黒
    const n = (xx, yy) => (yy >= 0 && yy < h && xx >= 0 && xx < w ? g[yy][xx] : null);
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) { c.fillStyle = COL.K; c.fillRect(x + 1, y + 1, 1, 1); }
  }
  return cv;
}
function mirrorCanvas(src) {
  const cv = document.createElement('canvas');
  cv.width = src.width; cv.height = src.height;
  const c = cv.getContext('2d');
  c.translate(src.width, 0); c.scale(-1, 1); c.drawImage(src, 0, 0);
  return cv;
}
function tintCanvas(src, fill, comp) {
  const cv = document.createElement('canvas');
  cv.width = src.width; cv.height = src.height;
  const c = cv.getContext('2d');
  c.drawImage(src, 0, 0);
  c.globalCompositeOperation = comp || 'source-atop';
  c.fillStyle = fill; c.fillRect(0, 0, cv.width, cv.height);
  return cv;
}
/* 1パーツ分の見た目セット：n=通常 f=反転 b=奥側(暗) bf=奥側反転 w=白フラッシュ wf=反転 */
function partSet(w, h, ops, pal) {
  const n = buildSprite(w, h, ops, pal);
  const f = mirrorCanvas(n);
  return { n, f, b: tintCanvas(n, 'rgba(0,0,30,0.34)'), bf: tintCanvas(f, 'rgba(0,0,30,0.34)'),
    w: tintCanvas(n, '#ffffff'), wf: tintCanvas(f, '#ffffff'), cw: n.width, ch: n.height };
}

/* ---------- キャッシュ ---------- */
const SPR = { parts: {}, props: {} };
function buildAllSprites() {
  CHARS.forEach((c) => {
    const a = ART[c.key];
    SPR.parts[c.key] = {};
    ['head', 'torso', 'hand', 'foot'].forEach((p) => {
      SPR.parts[c.key][p] = partSet(a.size[p][0], a.size[p][1], a[p], a.pal);
    });
  });
  ['gtrFwd', 'gtrUp', 'gtrDown'].forEach((k) => { SPR.props[k] = partSet(28, 28, PROP_ART[k], PROP_ART.pal); });
}
/* パーツの静止位置（足元を原点、yは上向き、中心座標） */
function rigGeom(key) {
  const s = ART[key].size;
  const fh = s.foot[1] + 2, th = s.torso[1] + 2, hh = s.head[1] + 2, tw = s.torso[0] + 2;
  const footY = fh / 2;
  const torsoY = fh + 2 + th / 2;
  const headY = fh + 2 + th + 1 + hh / 2;
  return { footX: 8, footY, torsoY, headY, handX: tw / 2 + 6, handY: torsoY + 1, top: fh + 2 + th + 1 + hh };
}

function text5W(str, s) { return str.length * 6 * (s || 1) - (s || 1); }
/* x,y は左上。align: 'l' | 'c' | 'r' */
function text5(c, str, x, y, col, s, o) {
  s = s || 1; o = o || {};
  str = String(str).toUpperCase();
  const w = text5W(str, s);
  if (o.align === 'c') x = Math.round(x - w / 2); else if (o.align === 'r') x = Math.round(x - w);
  const pass = (ox, oy, color) => {
    c.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const g = FONT5_ROWS[str[i]] || FONT5_ROWS['?'];
      for (let gy = 0; gy < 7; gy++) for (let gx = 0; gx < 5; gx++) {
        if (g[gy][gx] === '#') c.fillRect(x + ox + (i * 6 + gx) * s, y + oy + gy * s, s, s);
      }
    }
  };
  if (o.outline !== false) { const k = o.ocol || '#000000'; pass(-s, 0, k); pass(s, 0, k); pass(0, -s, k); pass(0, s, k); pass(s, s, k); }
  pass(0, 0, col);
}

/* ---------- 日本語ドット文字（DotGothic16、実ピクセル16px = 論理8px） ---------- */
const JPFONT = '"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
function jp(c, str, x, y, col, o) {
  o = o || {};
  const px = (o.size || 8) * 2;
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.font = px + 'px ' + JPFONT;
  c.textBaseline = 'top';
  let tx = Math.round(x * 2);
  const ty = Math.round(y * 2);
  if (o.align === 'c') tx -= Math.round(c.measureText(str).width / 2);
  else if (o.align === 'r') tx -= Math.round(c.measureText(str).width);
  if (o.outline) {
    c.fillStyle = o.ocol || '#000';
    for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [2, 2], [-2, 2], [2, -2], [-2, -2]]) c.fillText(str, tx + dx, ty + dy);
  } else if (o.shadow !== false) {
    c.fillStyle = o.scol || '#000';
    c.fillText(str, tx + 2, ty + 2);
  }
  c.fillStyle = col;
  c.fillText(str, tx, ty);
  c.restore();
}
function jpW(c, str, size) {
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  c.font = (size || 8) * 2 + 'px ' + JPFONT;
  const w = c.measureText(str).width / 2;
  c.restore();
  return w;
}

const RIG = {};
const rigOf = (key) => RIG[key] || (RIG[key] = rigGeom(key));

function poseName(f, m) {
  switch (f.st) {
    case 'idle': return m.phase === 'intro' ? 'intro' : 'idle';
    case 'walk': return (f.vx * f.face < 0 ? 'back' : 'walk') + ((((f.t / 6) | 0) & 1) + 1);
    case 'crouch': return f.in & (f.face > 0 ? IN.LEFT : IN.RIGHT) ? 'crouchGuard' : 'crouch';
    case 'air': return f.vy > 0 ? 'jump' : 'fall';
    case 'atk': {
      const p = fPhase(f);
      if (p.alt) return p.alt[((f.pt / (p.altN || 3)) | 0) % p.alt.length];
      return p.pose;
    }
    case 'hit': return f.stun > 5 ? 'hitHi' : 'hitLo';
    case 'block': return f.crouchG ? 'crouchGuard' : 'guard';
    case 'knock': case 'ko': return 'flyback';
    case 'down': return 'down';
    case 'wake': return 'wake';
    case 'win': return (((f.t / 14) | 0) & 1) ? 'win2' : 'win1';
    default: return 'idle';
  }
}
/* パーツの画面位置を計算（デブリ生成にも使う） */
function rigLayout(f, m, fr) {
  const C = CHARS[f.ch], key = C.key, g = rigOf(key), sz = ART[key].size;
  const name = poseName(f, m);
  const pd = typeof POSES[name] === 'function' ? POSES[name](g, sz) : (POSES[name] || POSES.idle);
  let bobH = 0, bobHand = 0;
  if (name === 'idle' || name === 'intro' || name === 'guard') {
    const ph = (((fr + f.i * 9) / 9) | 0) & 3;
    bobH = ph === 1 || ph === 2 ? 1 : 0;
    bobHand = ph === 0 || ph === 1 ? 0 : 1;
  }
  const base = { hb: [-g.handX + 3, g.handY], fb: [-g.footX, g.footY], t: [0, g.torsoY], h: [1, g.headY], ff: [g.footX + 1, g.footY], hf: [g.handX, g.handY] };
  const fx = f.x / SP, fy = FLOOR_Y - f.y / SP;
  const out = {};
  for (const k of ['hb', 'fb', 't', 'h', 'ff', 'hf']) {
    const d = pd[k] || [0, 0];
    let dy = d[1];
    if (k === 'h') dy += bobH; if (k === 'hf' || k === 'hb') dy += bobHand;
    out[k] = { x: fx + f.face * (base[k][0] + d[0]), y: fy - (base[k][1] + dy) };
  }
  return { pts: out, name, fx, fy };
}

   input.js — キーボード / ゲームパッド / 画面タッチ → 入力ビット

const KEYS_SOLO = {
  KeyW: IN.UP, ArrowUp: IN.UP, KeyS: IN.DOWN, ArrowDown: IN.DOWN, KeyA: IN.LEFT, ArrowLeft: IN.LEFT, KeyD: IN.RIGHT, ArrowRight: IN.RIGHT,
  KeyZ: IN.A, KeyF: IN.A, KeyJ: IN.A, KeyX: IN.B, KeyG: IN.B, KeyK: IN.B,
};
const KEYS_P1 = { KeyW: IN.UP, KeyS: IN.DOWN, KeyA: IN.LEFT, KeyD: IN.RIGHT, KeyF: IN.A, KeyG: IN.B };
const KEYS_P2 = { ArrowUp: IN.UP, ArrowDown: IN.DOWN, ArrowLeft: IN.LEFT, ArrowRight: IN.RIGHT, Comma: IN.A, KeyK: IN.A, Period: IN.B, KeyL: IN.B };

const Input = {
  mode: 'solo',                 // 'solo'（P1だけ人間）| 'versus'（2人）
  held: new Set(),              // いま押されているキー
  hit: new Set(),               // このtickで押されたキー（エッジ）
  tapped: new Set(),            // 前回のpollから今までに押されたキー（一瞬の連打も取りこぼさない）
  masks: [0, 0], prev: [0, 0],
  touch: 0,                     // 画面タッチの入力（P1）
  tap: null,                    // このtickでのタップ位置（論理座標）
  any: false,                   // このtickで何かが押された
  padOn: false,

  keyMask(map) {
    let m = 0;
    for (const k of this.held) if (map[k]) m |= map[k];
    for (const k of this.tapped) if (map[k]) m |= map[k];
    return m;
  },

  padMask(i) {
    let m = 0;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const p = pads[i];
      if (!p) return 0;
      this.padOn = true;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      if (ax < -0.5 || (p.buttons[14] && p.buttons[14].pressed)) m |= IN.LEFT;
      if (ax > 0.5 || (p.buttons[15] && p.buttons[15].pressed)) m |= IN.RIGHT;
      if (ay < -0.5 || (p.buttons[12] && p.buttons[12].pressed)) m |= IN.UP;
      if (ay > 0.5 || (p.buttons[13] && p.buttons[13].pressed)) m |= IN.DOWN;
      if ((p.buttons[0] && p.buttons[0].pressed) || (p.buttons[2] && p.buttons[2].pressed)) m |= IN.A;
      if ((p.buttons[1] && p.buttons[1].pressed) || (p.buttons[3] && p.buttons[3].pressed)) m |= IN.B;
    } catch (e) { /* ゲームパッドが使えない環境 */ }
    return m;
  },

  /* 毎tickの最初に呼ぶ */
  poll() {
    this.prev[0] = this.masks[0]; this.prev[1] = this.masks[1];
    if (this.override) { this.masks[0] = this.override[0]; this.masks[1] = this.override[1]; this.tapped.clear(); return; }   // テスト用
    if (this.mode === 'versus') {
      this.masks[0] = this.keyMask(KEYS_P1) | this.padMask(0) | this.touch;
      this.masks[1] = this.keyMask(KEYS_P2) | this.padMask(1);
    } else {
      this.masks[0] = this.keyMask(KEYS_SOLO) | this.padMask(0) | this.padMask(1) | this.touch;
      this.masks[1] = 0;
    }
    this.tapped.clear();
  },
  /* 毎tickの最後に呼ぶ */
  endTick() { this.hit.clear(); this.tap = null; this.any = false; },

  edge(p, bit) { return (this.masks[p] & bit) !== 0 && (this.prev[p] & bit) === 0; },
  key(code) { return this.hit.has(code); },
  /* メニュー用の「決定」「戻る」 */
  confirm() { return this.edge(0, IN.A) || this.edge(1, IN.A) || this.key('Enter') || this.key('Space'); },
  cancel() { return this.edge(0, IN.B) || this.key('Escape') || this.key('Backspace'); },
  pause() { return this.key('Enter') || this.key('Escape') || this.key('KeyP'); },
  nav() { // -1,0,+1 の十字キー入力（P1/P2どちらでも）
    const e = (b) => this.edge(0, b) || (this.mode === 'versus' && this.edge(1, b));
    return { x: (e(IN.RIGHT) ? 1 : 0) - (e(IN.LEFT) ? 1 : 0), y: (e(IN.DOWN) ? 1 : 0) - (e(IN.UP) ? 1 : 0) };
  },
};

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;      // ルームコード入力中は、ゲームのキーとして扱わない
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { Input.hit.add(e.code); Input.tapped.add(e.code); Input.any = true; }
  Input.held.add(e.code);
  if (typeof Sound !== 'undefined') Sound.unlock();
});
window.addEventListener('keyup', (e) => { Input.held.delete(e.code); });
window.addEventListener('blur', () => { Input.held.clear(); Input.touch = 0; });

/* ---------- 画面タッチ（スマホ） ---------- */
function setupTouch() {
  const root = document.getElementById('touch');
  if (!root) return;
  let locked = false;
  const show = () => {
    root.hidden = false;
    document.documentElement.classList.add('has-touch'); document.body.classList.add('has-touch');
    if (!locked) { locked = true; lockPageGestures(); }
    if (window.fitScreen) window.fitScreen();
  };
  if ('ontouchstart' in window || (navigator.maxTouchPoints | 0) > 0) show();
  window.addEventListener('touchstart', show, { once: true, passive: true });

  const dpad = document.getElementById('dpad'), knob = document.getElementById('knob');
  let dirPtr = null;
  const setDir = (e) => {
    const r = dpad.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = e.clientX - cx, dy = e.clientY - cy, th = r.width * 0.16;
    let m = 0;
    if (dx < -th) m |= IN.LEFT; if (dx > th) m |= IN.RIGHT; if (dy < -th) m |= IN.UP; if (dy > th) m |= IN.DOWN;
    Input.touch = (Input.touch & ~15) | m;
    const kx = Math.max(-1, Math.min(1, dx / (r.width / 2))) * r.width * 0.28, ky = Math.max(-1, Math.min(1, dy / (r.height / 2))) * r.height * 0.28;
    knob.style.transform = `translate(${kx}px, ${ky}px)`;
  };
  dpad.addEventListener('pointerdown', (e) => { e.preventDefault(); dirPtr = e.pointerId; dpad.setPointerCapture(e.pointerId); setDir(e); Input.any = true; if (typeof Sound !== 'undefined') Sound.unlock(); });
  dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dirPtr) setDir(e); });
  const endDir = (e) => { if (e.pointerId === dirPtr) { dirPtr = null; Input.touch &= ~15; knob.style.transform = ''; } };
  dpad.addEventListener('pointerup', endDir); dpad.addEventListener('pointercancel', endDir);

  [['btnA', IN.A], ['btnB', IN.B]].forEach(([id, bit]) => {
    const el = document.getElementById(id);
    let ptr = null;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); ptr = e.pointerId; el.setPointerCapture(e.pointerId); Input.touch |= bit; el.classList.add('on'); Input.any = true; if (typeof Sound !== 'undefined') Sound.unlock(); });
    const up = (e) => { if (e.pointerId === ptr) { ptr = null; Input.touch &= ~bit; el.classList.remove('on'); } };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  const pb = document.getElementById('btnPause');
  if (pb) pb.addEventListener('pointerdown', (e) => { e.preventDefault(); Input.hit.add('Enter'); Input.any = true; if (typeof Sound !== 'undefined') Sound.unlock(); });
  root.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* スマホで画面が勝手に動かないようにする（拡大・スクロール・跳ね返り）。
   CSS（page.html の .has-touch）と viewport の指定でも止めているが、iPhone の Safari はそれを無視することがあるので、ここでも止める。 */
function lockPageGestures() {
  const opt = { passive: false };
  const inField = (t) => !!(t && t.closest && t.closest('input, textarea'));     // 文字入力欄は除く（指でカーソルを動かせるように）
  // iPhone のピンチ拡大
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault(), opt));
  // 画面上のドラッグ：ページのスクロール／ゴムのような跳ね返り／2本指の拡大／引っぱって更新
  document.addEventListener('touchmove', (e) => { if (e.cancelable && !inField(e.target)) e.preventDefault(); }, opt);
  // ダブルタップ拡大：すばやい2回目のタップを止める（ボタンはクリックが要るので除く）
  let lastEnd = 0;
  document.addEventListener('touchend', (e) => {
    const isButton = !!(e.target && e.target.closest && e.target.closest('#lobby, #btnSound'));
    if (e.cancelable && !isButton && e.timeStamp - lastEnd < 350) e.preventDefault();
    lastEnd = e.timeStamp;
  }, opt);
}

/* キャンバスのタップ（メニュー選択用）：論理座標(256x224)へ変換して渡す */
function setupCanvasTap(cv) {
  cv.addEventListener('pointerdown', (e) => {
    const r = cv.getBoundingClientRect();
    Input.tap = { x: (e.clientX - r.left) / r.width * SCREEN_W, y: (e.clientY - r.top) / r.height * SCREEN_H };
    Input.any = true;
    if (typeof Sound !== 'undefined') Sound.unlock();
  });
}

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(tok) {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(tok);
  if (!m) return 0;
  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);

/* "E5 . . G5" のような文字列 → [{s:開始ステップ, f:周波数, n:長さ(ステップ)}] */
function parseTrack(bars) {

  bars.forEach((bar, bi) => {
    const toks = bar.trim().split(/\s+/);
    let cur = null;
    toks.forEach((t, i) => {
      const step = bi * 16 + i;
      if (t === '.') { if (cur) cur.n++; return; }
      if (t === '-') { cur = null; return; }
      cur = { s: step, f: noteFreq(t), n: 1 };
      out.push(cur);
    });
  });
  return out;
}

  Dmaj: ['D4', 'F#4', 'A4'], Amaj: ['A3', 'C#4', 'E4'], Bm: ['B3', 'D4', 'F#4'], Gmaj: ['G3', 'B3', 'D4'],

    for (let i = 0; i < 16; i++) toks.push(i % every === 0 ? t[pat[((i / every) | 0) % 4]] : '.');

    osc.frequency.setValueAtTime(f, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t0 + dur);
    const g = c.createGain(), v = o.vol === undefined ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.003);
    if (o.hold) g.gain.setValueAtTime(v, t0 + dur * o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(o.bus || this.sfxBus);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  },
  noise(dur, o) {
    const c = this.ctx; if (!c || !this.on) return;
    o = o || {};
    const t0 = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const fl = c.createBiquadFilter(); fl.type = o.type || 'lowpass';
    fl.frequency.setValueAtTime(o.f || 3000, t0); if (o.slide) fl.frequency.exponentialRampToValueAtTime(Math.max(40, o.slide), t0 + dur);
    fl.Q.value = o.q || 0.7;
    const g = c.createGain(), v = o.vol === undefined ? 0.2 : o.vol;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(g); g.connect(o.bus || this.sfxBus);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.03);
  },

  /* ---- 効果音 ---- */
  sfx(name) {
    if (!this.ctx || !this.on) return;
    const f = SFX[name];
    if (f) f(this);
  },

  /* ---- BGM ---- */
  bgm(name) {
    if (this.bgmName === name) return;
    this.stopBgm();
    this.bgmName = name;
    if (!this.ctx || !name) return;
    const tr = BGM_DATA[name]; if (!tr) return;
    this.track = tr; this.step = 0; this.nextT = this.ctx.currentTime + 0.08;
    this.bgmBus.gain.cancelScheduledValues(this.ctx.currentTime); this.bgmBus.gain.setValueAtTime(0.4, this.ctx.currentTime);
    this.timer = setInterval(() => this.pump(), 25);
  },
  stopBgm() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.bgmName = this.ctx ? null : this.bgmName;
    if (this.ctx && this.bgmBus) { try { const t = this.ctx.currentTime; this.bgmBus.gain.cancelScheduledValues(t); this.bgmBus.gain.setValueAtTime(this.bgmBus.gain.value, t); this.bgmBus.gain.linearRampToValueAtTime(0.0001, t + 0.15); } catch (e) { /* 無視 */ } }
  },
  pump() {
    const c = this.ctx, tr = this.track;
    if (!c || !tr) return;
    const spb = 60 / tr.bpm / 4, total = tr.bars * 16;
    while (this.nextT < c.currentTime + 0.14) {
      const s = this.step % total, t = this.nextT - c.currentTime;
      const hit = (arr, fn) => { for (const n of arr) if (n.s === s) fn(n); };
      hit(tr.lead, (n) => this.tone(n.f, Math.max(0.06, n.n * spb * 0.92), { duty: tr.leadDuty, vol: 0.16, delay: t, bus: this.bgmBus, hold: 0.7 }));
      hit(tr.arp, (n) => this.tone(n.f, n.n * spb * 0.8, { duty: tr.arpDuty, vol: 0.07, delay: t, bus: this.bgmBus }));
      hit(tr.bass, (n) => this.tone(n.f, Math.max(0.08, n.n * spb * 0.95), { wave: 'tri', vol: 0.34, delay: t, bus: this.bgmBus, hold: 0.8 }));
      const bs = s % 16, bar = (s / 16) | 0, fill = tr.fill && tr.fill[bar];
      const inFill = fill && bs >= fill[0];
      if (tr.crash && bs === 0 && bar === 0) this.noise(0.5, { type: 'highpass', f: 5000, vol: 0.12, delay: t, bus: this.bgmBus });
      if (tr.kick.includes(bs) && !inFill) this.tone(150, 0.1, { wave: 'tri', slide: 45, vol: 0.42, delay: t, bus: this.bgmBus });
      if (tr.snare.includes(bs) && !inFill) this.noise(0.1, { type: 'highpass', f: 1800, vol: 0.2, delay: t, bus: this.bgmBus });
      if (fill && fill.includes(bs)) this.noise(0.07, { type: 'highpass', f: 1800 + (bs - fill[0]) * 250, vol: 0.14 + (bs - fill[0]) * 0.01, delay: t, bus: this.bgmBus });
      if (tr.hat.includes(bs)) this.noise(0.03, { type: 'highpass', f: 7000, vol: 0.07, delay: t, bus: this.bgmBus });
      if (tr.open.includes(bs)) this.noise(0.09, { type: 'highpass', f: 6000, vol: 0.06, delay: t, bus: this.bgmBus });
      if (tr.hat16.includes(bs)) this.noise(0.02, { type: 'highpass', f: 8000, vol: 0.03, delay: t, bus: this.bgmBus });
      this.nextT += spb; this.step++;
    }
  },
  jingle(notes, o) {
    if (!this.ctx || !this.on) return;
    o = o || {};
    notes.forEach((n, i) => this.tone(noteFreq(n), o.len || 0.14, { duty: 0.25, vol: 0.2, delay: i * (o.gap || 0.11) }));
  },
};

'use strict';
/* ============================================================
   rollback.js — ロールバック同期（通信・画面に依存しない純粋なロジック）

   考え方
   ・毎フレーム「自分の入力」だけを相手に送る（直近の入力をまとめて送るので、1つ落ちても平気）
   ・相手の入力がまだ届いていないフレームは「さっきと同じ入力」と予想して先に進む
   ・本物の入力が届いて予想が外れていたら、そのフレームまで状態を巻き戻して、やり直す
   ・シミュレーションは整数だけで決定論なので、両者のやり直し結果は必ず一致する
   ・60フレームごとに状態のハッシュを交換して、ズレ（desync）が起きていないか確かめる
   ============================================================ */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

class RollbackSession {
  /* cfg: createMatch に渡す設定  me: 自分の番号(0=ホスト/左, 1=ゲスト/右) */
  constructor(cfg, me, o) {
    o = o || {};
    this.me = me;
    this.D = o.delay === undefined ? 2 : o.delay;      // 入力を何フレーム遅らせるか（予想はずれを減らす）
    this.maxPred = o.maxPred || 10;                    // 予想だけで先に進める最大フレーム数
    this.seed = cfg.seed;                              // 試合ID（再戦のとき、前の試合のパケットを見分ける）
    this.m = createMatch(cfg);
    this.frame = 0;
    this.localIn = []; this.remoteIn = []; this.used = [];
    this.snaps = new Map();
    for (let f = 0; f < this.D; f++) { this.localIn[f] = 0; this.remoteIn[f] = 0; }   // 開始直後は両者ニュートラル
    this.remoteKnown = this.D - 1;                     // 連続して分かっている相手入力の最後のフレーム
    this.remoteAck = this.D - 1;                       // 相手が受け取ったと伝えてきた、自分の入力の最後のフレーム
    this.verified = 0;                                 // ここより前は「予想なし」で確定済み
    this.evSig = new Map();
    this.stats = { rollbacks: 0, maxDepth: 0, stalls: 0, frames: 0 };
    this.myHash = new Map(); this.theirHash = new Map(); this.nextHash = 60; this.outSums = []; this.desync = -1;
  }

  /* 相手へ送るパケット（まだ確認されていない入力をまとめて） */
  packet() {
    const to = this.localIn.length - 1;
    const start = Math.max(this.remoteAck + 1, to - 30);
    const d = [];
    for (let f = start; f <= to; f++) d.push(this.localIn[f]);
    return { t: 'in', s: this.seed, f: start, d, a: this.remoteKnown };
  }
  takeSums() { const s = this.outSums; this.outSums = []; return s; }

  receive(p) {
    for (let i = 0; i < p.d.length; i++) {
      const fr = p.f + i;
      if (this.remoteIn[fr] === undefined) this.remoteIn[fr] = p.d[i];
    }
    while (this.remoteIn[this.remoteKnown + 1] !== undefined) this.remoteKnown++;
    if (p.a > this.remoteAck) this.remoteAck = p.a;
  }
  receiveSum(f, h) { this.theirHash.set(f, h); this._compare(f); }
  _compare(f) {
    if (this.myHash.has(f) && this.theirHash.has(f) && this.myHash.get(f) !== this.theirHash.get(f) && this.desync < 0) this.desync = f;
  }

  _predict() { return this.remoteKnown >= 0 ? this.remoteIn[this.remoteKnown] : 0; }

  /* 1フレームぶんシミュレーションする（collect に画面向けイベントを積む） */
  _sim(collect) {
    const f = this.frame;
    const mine = this.localIn[f];
    let theirs = this.remoteIn[f];
    if (theirs === undefined) theirs = this._predict();
    const in0 = this.me === 0 ? mine : theirs, in1 = this.me === 0 ? theirs : mine;
    const m = this.m;
    m.events.length = 0;
    this.snaps.set(f, JSON.stringify(m));
    this.used[f] = [in0, in1];
    stepMatch(m, in0, in1);
    // やり直しで同じ出来事を2回鳴らさない（種類＋場所で見分ける）
    let sigs = this.evSig.get(f);
    if (!sigs) { sigs = new Set(); this.evSig.set(f, sigs); }
    for (const e of m.events) {
      const sg = e.t + '|' + (e.n !== undefined ? e.n : e.i !== undefined ? e.i : '') + '|' + ((e.x || 0) >> 11);
      if (!sigs.has(sg)) { sigs.add(sg); collect.push(e); }
    }
    m.events.length = 0;
    this.frame = m.frame;
  }

  /* 毎tick（60Hz）に1回呼ぶ。mask = 今の自分の入力。 */
  tick(mask) {
    const out = { events: [], stalled: false, rolled: 0 };
    const other = this.me === 0 ? 1 : 0;
    // 1) 答え合わせ。予想が外れていたら、その時点まで巻き戻してやり直す
    let mis = -1;
    while (this.verified < this.frame && this.remoteIn[this.verified] !== undefined) {
      if (this.used[this.verified][other] !== this.remoteIn[this.verified]) { mis = this.verified; break; }
      this.verified++;
    }
    if (mis >= 0) {
      const target = this.frame;
      this.m = JSON.parse(this.snaps.get(mis));
      this.frame = mis;
      while (this.frame < target) this._sim(out.events);
      this.stats.rollbacks++;
      out.rolled = target - mis;
      if (out.rolled > this.stats.maxDepth) this.stats.maxDepth = out.rolled;
      while (this.verified < this.frame && this.remoteIn[this.verified] !== undefined) this.verified++;
    }
    // 2) ハッシュ交換（確定したフレームの状態が一致しているか）
    while (this.nextHash <= this.verified && this.snaps.has(this.nextHash)) {
      const h = hashStr(this.snaps.get(this.nextHash));
      this.myHash.set(this.nextHash, h);
      this.outSums.push({ t: 'sum', s: this.seed, f: this.nextHash, h });
      this._compare(this.nextHash);
      this.nextHash += 60;
    }
    // 3) 予想だけで先に進みすぎないよう、相手を待つ
    if (this.frame > this.remoteKnown + this.maxPred) { out.stalled = true; this.stats.stalls++; this._prune(); return out; }
    // 4) 自分の入力を D フレーム先のぶんとして予約し、1フレーム進める
    const lf = this.frame + this.D;
    if (this.localIn[lf] === undefined) this.localIn[lf] = mask;
    this._sim(out.events);
    this.stats.frames++;
    this._prune();
    return out;
  }

  _prune() {
    const keep = Math.min(this.verified - 1, this.nextHash - 1);
    for (const k of this.snaps.keys()) { if (k < keep) this.snaps.delete(k); else break; }
    for (const k of this.evSig.keys()) { if (k < this.frame - 90) this.evSig.delete(k); else break; }
  }
}

'use strict';
/* ============================================================
   net.js — 部屋コードでつなぐ（PeerJS = WebRTCのP2P）。
   ・ホストが4文字のコードを作り、ゲストがそれを入れるとつながる
   ・つながったあとは、ふたりのブラウザが直接やりとりする（入力だけを送る）
   ・コードの受け渡しにだけ、PeerJSの無料の仲介サーバーを使う
   ============================================================ */
const NET_PREFIX = 'kmbt1-';
const NET_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 見まちがえやすい I O 0 1 は使わない
const NET_PROTOCOL = 2;   // 対戦の動き（物理など）を変えたら +1 する。ちがうバージョンどうしは、つなぐ前にはじく（ズレたまま遊ばないように）

const Net = {
  peer: null, conn: null, role: null, code: '', status: 'idle', rtt: 0, session: null,
  early: [], pending: [], listener: null, cb: null, lastRecv: 0, timers: [],

  /* テストや将来の自前サーバー用に、?peerhost=... などで仲介サーバーを差し替えられる */
  opts() {
    const q = new URLSearchParams(location.search), base = window.MECHA_NET || {};
    const host = q.get('peerhost') || base.host;
    const o = { debug: 0 };
    if (host) {
      o.host = host; o.port = +(q.get('peerport') || base.port || 9000); o.path = q.get('peerpath') || base.path || '/';
      o.secure = (q.get('peersecure') || (base.secure ? '1' : '0')) === '1';
    }
    if ((q.get('ice') || '') === 'none') o.config = { iceServers: [] };
    return o;
  },
  makeCode() { let s = ''; for (let i = 0; i < 4; i++) s += NET_CHARS[(Math.random() * NET_CHARS.length) | 0]; return s; },
  validCode(c) { return /^[A-HJ-NP-Z2-9]{4}$/.test(c); },
  inviteLink(code) { return location.href.split('#')[0] + '#' + code; },

  reset() {
    this.timers.forEach(clearTimeout); this.timers = [];
    try { if (this.conn) this.conn.close(); } catch (e) { /* 無視 */ }
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* 無視 */ }
    this.peer = null; this.conn = null; this.role = null; this.code = ''; this.status = 'idle'; this.rtt = 0;
    this.session = null; this.early = []; this.pending = []; this.cb = null;
    if (this.pingT) { clearInterval(this.pingT); this.pingT = null; }
  },
  close() { const l = this.listener; this.reset(); this.listener = l; },

  errText(e) {
    const t = e && e.type ? e.type : e;
    switch (t) {
      case 'peer-unavailable': return 'そのコードの へやが みつかりません';
      case 'unavailable-id': return 'コードが つかえませんでした。もういちど';
      case 'network': case 'socket-error': case 'socket-closed': case 'server-error': return 'サーバーに つながりません（ネットを かくにん）';
      case 'webrtc': return 'つうしんの じゅんびに しっぱいしました';
      case 'timeout': return 'じかんぎれ（つうしんが ブロックされているかも）';
      case 'nopeer': return 'このページでは オンラインが つかえません';
      case 'version': return 'あいてと バージョンが ちがいます\nページを さいよみこみ してね';
      default: return 'つながりませんでした' + (e && e.message ? '（' + String(e.message).slice(0, 24) + '）' : '');
    }
  },
  fail(e) {
    const cb = this.cb;
    this.status = 'error';
    try { if (this.peer) this.peer.destroy(); } catch (x) { /* 無視 */ }
    if (cb && cb.onError) cb.onError(this.errText(e));
  },

  /* ホスト：コードを作って待つ */
  host(cb) {
    this.reset(); this.cb = cb; this.role = 'host'; this.status = 'opening';
    if (typeof Peer === 'undefined') { this.fail('nopeer'); return; }
    const open = (n) => {
      const code = this.makeCode();
      let peer;
      try { peer = this.peer = new Peer(NET_PREFIX + code, this.opts()); } catch (e) { this.fail(e); return; }
      peer.on('open', () => { this.code = code; this.status = 'waiting'; if (cb.onCode) cb.onCode(code); });
      peer.on('connection', (conn) => { if (this.conn) { try { conn.close(); } catch (e) { /* 無視 */ } return; } this.attach(conn); });
      peer.on('error', (e) => {
        if (e && e.type === 'unavailable-id' && n < 6) { try { peer.destroy(); } catch (x) { /* 無視 */ } open(n + 1); return; }
        this.fail(e);
      });
    };
    open(0);
    this.timers.push(setTimeout(() => { if (this.status === 'opening') this.fail('timeout'); }, 12000));
  },

  /* ゲスト：コードの部屋に入る */
  join(code, cb) {
    this.reset(); this.cb = cb; this.role = 'guest'; this.status = 'connecting'; this.code = code;
    if (typeof Peer === 'undefined') { this.fail('nopeer'); return; }
    let peer;
    try { peer = this.peer = new Peer(this.opts()); } catch (e) { this.fail(e); return; }
    peer.on('open', () => {
      const conn = peer.connect(NET_PREFIX + code, { reliable: true, serialization: 'json' });
      this.attach(conn);
    });
    peer.on('error', (e) => this.fail(e));
    this.timers.push(setTimeout(() => { if (this.status !== 'connected') this.fail('timeout'); }, 20000));
  },

  attach(conn) {
    this.conn = conn;
    conn.on('open', () => {
      this.status = 'connected'; this.lastRecv = performance.now();
      this.send({ t: 'hello', v: NET_PROTOCOL });
      this.pingT = setInterval(() => this.send({ t: 'ping', ts: performance.now() }), 1000);
      if (this.cb && this.cb.onConnect) this.cb.onConnect();
    });
    conn.on('data', (d) => this.onData(d));
    conn.on('close', () => this.lost());
    conn.on('error', () => this.lost());
  },
  send(o) { try { if (this.conn && this.conn.open) this.conn.send(o); } catch (e) { /* 送れなかった */ } },

  onData(d) {
    if (!d || typeof d !== 'object') return;
    this.lastRecv = performance.now();
    switch (d.t) {
      case 'in':
        if (this.session) { if (d.s === this.session.seed) this.session.receive(d); }
        else { this.early.push(d); if (this.early.length > 400) this.early.shift(); }
        return;
      case 'sum': if (this.session && d.s === this.session.seed) this.session.receiveSum(d.f, d.h); return;
      case 'ping': this.send({ t: 'pong', ts: d.ts }); return;
      case 'pong': { const r = performance.now() - d.ts; this.rtt = this.rtt ? this.rtt * 0.7 + r * 0.3 : r; return; }
      default: break;
    }
    if (this.listener) this.listener(d); else this.pending.push(d);
  },
  setListener(fn) { this.listener = fn; if (fn) { const p = this.pending; this.pending = []; p.forEach((m) => fn(m)); } },

  lost() {
    if (this.status === 'lost' || this.status === 'idle') return;
    this.status = 'lost';
    if (this.pingT) { clearInterval(this.pingT); this.pingT = null; }
    if (this.listener) this.listener({ t: '_lost' });
  },
  /* 毎tick：しばらく何も届かなければ切断とみなす */
  watchdog() { if (this.status === 'connected' && performance.now() - this.lastRecv > 6000) this.lost(); },

  /* 試合をはじめる（ホスト・ゲスト共通。cfg は同じ内容） */
  begin(cfg, me) {
    this.session = new RollbackSession(cfg, me, { delay: 2, maxPred: 10 });
    const e = this.early; this.early = [];
    e.forEach((p) => { if (p.s === cfg.seed) this.session.receive(p); });
    return this.session;
  },
  /* 1tickぶんの通信（自分の入力と、ハッシュ） */
  pump() {
    const s = this.session; if (!s) return;
    this.send(s.packet());
    for (const x of s.takeSums()) this.send(x);
  },
};

/* 小さなロボ表示（タイトルやキャラ選択のための仮の対戦状態） */

const CELL = { x0: 8, y0: 16, w: 59, h: 60, gap: 2 };
const SceneSelect = {
  enter(p) {

  },
  /* ---- オンライン ---- */
  sendPick() { Net.send({ t: 'pick', ch: this.cur[this.me], ok: this.pick[this.me] >= 0 }); },
  onNet(m) {
    const o = 1 - this.me;
    if (m.t === 'pick') { this.cur[o] = clamp(m.ch | 0, 0, 7); this.pick[o] = m.ok ? this.cur[o] : -1; }

  },
  startMatch() {
    this.started = true;

    Net.begin(cfg, 0); Net.send({ t: 'start', cfg }); Game.last = [cfg.ch[0], cfg.ch[1]];
    Game.go('fight', { online: true, me: 0, chars: cfg.ch, cfg, mode: 'online', versus: true });
  },
  updateOnline() {
    if (this.lost) { if (Input.any || Input.tap) { Net.reset(); Game.skipPress = true; Game.go('title'); } return; }
    Net.watchdog();
    const me = this.me;
    if (Input.key('Escape')) { Net.send({ t: 'bye' }); Net.reset(); Game.skipPress = true; Game.go('title'); return; }
    if (this.pick[me] >= 0) {
      if (Input.edge(0, IN.B)) { this.pick[me] = -1; Sound.sfx('cancel'); this.sendPick(); }
    } else {
      const n = Input.nav();
      if (n.x || n.y) { this.move(me, n); Sound.sfx('select'); this.sendPick(); }
      let ok = Input.confirm();
      if (Input.tap) {
        const t = Input.tap;
        for (let i = 0; i < 8; i++) { const q = this.cellPos(i); if (t.x >= q.x && t.x < q.x + CELL.w && t.y >= q.y && t.y < q.y + CELL.h) { if (this.cur[me] === i) ok = true; else { this.cur[me] = i; Sound.sfx('select'); this.sendPick(); } } }
      }

  },
  cellPos(i) { return { x: CELL.x0 + (i % 4) * (CELL.w + CELL.gap), y: CELL.y0 + ((i / 4) | 0) * (CELL.h + CELL.gap) }; },
  move(k, n) {

  },
  start(a, b, lvl, extra) {

  },
  update() {
