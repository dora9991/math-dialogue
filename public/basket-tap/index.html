<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バスケ タップ記録</title>
<meta name="description" content="バスケの試合を見ながら、だれがシュートを入れたか・リバウンド・パスミスなどをタップで記録。時刻つきなので、あとで試合の動画から場面を切り出せます（記録はどこにも送りません）">
<meta name="theme-color" content="#0a0e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タップ記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
/* バスケ タップ記録 */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel2: #f2f4f8;
  --line: #d6dce6;
  --line2: #b9c3d2;
  --text: #0f172a;
  --muted: #566276;
  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.12);
  --good: #15803d;
  --warn: #b45309;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --bad: #dc2626;
  /* プレーのボタンの色（2P 緑・3P 紫・FT 茶・リバ 青。となりどうしで見分けやすく） */
  --k-fg2: #15803d;
  --k-fg3: #7c3aed;
  --k-ft: #b45309;
  --k-rb: #1d4ed8;
  --k-made: #15803d;
  --k-reb: #1d4ed8;
  --k-good: #0f766e;
  --k-bad: #c2410c;
  --k-foul: #a16207;
  --k-mark: #facc15;
  --k-mark-ink: #3b2a00;
  --k-miss-bg: #ffffff;
  --k-miss-line: #8b97aa;
  --k-miss-ink: #0f172a;
  --k-miss-x: #b91c1c;
  --ask: #f59e0b;
  --radius: 14px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
    --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
    --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
    --k-fg2: #16a34a; --k-fg3: #8b5cf6; --k-ft: #c26a0e; --k-rb: #2563eb;
    --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
  --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
  --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
  --k-fg2: #16a34a; --k-fg3: #8b5cf6; --k-ft: #c26a0e; --k-rb: #2563eb;
  --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
a { color: var(--accent); }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 14px; font-size: 14px; line-height: 1.3; text-decoration: none; color: var(--text); transition: background 0.12s, border-color 0.12s, transform 0.06s; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.btn.small { min-height: 34px; padding: 4px 11px; font-size: 13px; border-radius: 9px; }
.btn.huge { width: 100%; min-height: 58px; font-size: 18px; font-weight: 800; border-radius: 14px; }
.btn.icon { width: 40px; padding: 0; font-weight: 800; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.btn[disabled] { opacity: 0.45; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; font-size: 13px; }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.7); vertical-align: -2px; flex: none; }
.chip.neutral { background: var(--line2); }
.note { color: var(--muted); font-size: 13px; }
.note.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.center { justify-content: center; }
.spacer { flex: 1; }

/* ---------- 試合の一覧・準備（ふつうのページ） ---------- */
.hbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo { font-size: 28px; }
.brand b { display: block; font-size: 17px; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.htitle { font-size: 16px; }
.home, .setup { max-width: 920px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.going { border: 2px solid var(--bad); }
.going-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.games { display: flex; flex-direction: column; gap: 8px; }
.grow { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.gopen { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: none; border: 0; padding: 4px; }
.gline { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gline .when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gline .vs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.gline .vs b { font-size: 17px; font-variant-numeric: tabular-nums; }
.gline .gtitle { font-size: 12.5px; color: var(--muted); }
.tools .row { margin-top: 8px; }
.steps3 ol { margin: 4px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps3 li b { display: block; font-size: 15px; }
.steps3 li span { color: var(--muted); font-size: 13px; }
.lead { color: var(--muted); margin: 0; font-size: 14px; }

.teams2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 820px) { .teams2 { grid-template-columns: 1fr 1fr; } }
.teamcard { display: flex; flex-direction: column; gap: 10px; border-top: 8px solid var(--tc); box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.08); }
.tc-head { display: flex; align-items: center; gap: 10px; }
.tc-head b { font-size: 17px; }
.tc-band { background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.savedrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chipbtn small { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input[type="text"], .nostext { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; font-size: 16px; width: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(128, 128, 128, 0.55); padding: 0; position: relative; }
.sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.swc { width: 42px; height: 36px; padding: 0 2px; border: 1px dashed var(--line2); border-radius: 9px; background: var(--panel2); }
.presets .btn { font-weight: 700; }
.nogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.nb { min-height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nb.on { background: var(--tc); color: var(--tink); border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.names summary { cursor: pointer; color: var(--accent); font-size: 14px; padding: 4px 0; }
.namelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 6px; }
.nm { display: flex; align-items: center; gap: 6px; }
.nm b { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.nm input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; font-size: 15px; }
.gobar { position: sticky; bottom: 0; padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* ---------- 記録の画面 ---------- */
body[data-view="live"] { overflow: hidden; }
/* 上の帯（bar）・2つのチーム（stage）・下の帯（gbar）。撮影中の大きなワイプ（wipe）は、dk-side・dk-col・dk-top で場所を足す（js の layoutWipe） */
.live { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "stage" "gbar";
  background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.live button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* 上の帯：時計・ピリオド・得点・メニュー */
.lbar { grid-area: bar; display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex: none; min-width: 0; }
.clock { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 0 10px; height: clamp(46px, 7.4vmin, 64px); min-width: clamp(104px, 21vmin, 170px); flex: none; }
.tval { font-size: clamp(30px, 6.2vmin, 50px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; line-height: 1; }
.tval.long { font-size: clamp(22px, 4.6vmin, 40px); }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); flex: none; animation: rec 1.6s ease-in-out infinite; }
.clock.ended .recdot { animation: none; background: var(--line2); }
.clock.ended .tval { color: var(--muted); }
@keyframes rec { 50% { opacity: 0.25; } }
.startbtn { height: clamp(46px, 7.4vmin, 64px); border: 0; border-radius: 12px; background: var(--good); color: #fff; font-size: clamp(17px, 3.4vmin, 26px); font-weight: 900; padding: 0 14px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); flex: none; white-space: nowrap; }
.period { height: clamp(46px, 7.4vmin, 64px); min-width: 48px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); font-size: clamp(18px, 3.8vmin, 26px); font-weight: 800; padding: 0 8px; flex: none; }
.score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.sc { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: clamp(46px, 7.4vmin, 64px); padding: 0 7px; border-radius: 12px; background: var(--tc); color: var(--tink); border: 2px solid rgba(128, 128, 128, 0.55); font-size: clamp(28px, 6vmin, 46px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.sc { flex: none; }
.score.big3 .sc { font-size: clamp(20px, 4.4vmin, 36px); padding: 0 4px; }
/* 幅の狭いスマホ：上の帯を詰める */
@media (max-width: 400px) {
  .lbar { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .period { min-width: 42px; padding: 0 5px; }
  .menubtn { min-width: 44px; }
  .lbar:has(.tval.long) .menubtn small, .lbar:has(.big3) .menubtn small { display: none; }
  .score { gap: 3px; }
  .tval.long ~ .recdot, .clock:has(.tval.long) .recdot { width: 8px; height: 8px; }
  .clock:has(.tval.long) { padding: 0 7px; gap: 5px; }
}
.dash { font-size: 22px; color: var(--muted); font-weight: 800; }
.menubtn { height: clamp(46px, 7.4vmin, 64px); min-width: 50px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0 6px; flex: none; }
.menubtn span { font-size: 24px; font-weight: 800; }
.menubtn small { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* 撮影中：上の帯の小さな映像（押すと撮影の画面）。録画中は赤いふちと点 */
.cambtn { position: relative; flex: none; height: clamp(46px, 7.4vmin, 64px); aspect-ratio: var(--ar, 1.7778); max-width: 120px; padding: 0; border: 2px solid var(--line2); border-radius: 10px; background: #000; overflow: hidden; }
.camthumb { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.cambtn .camdot { position: absolute; top: 4px; left: 4px; width: 9px; height: 9px; border-radius: 50%; background: #9aa3af; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45); }
.cambtn.rec { border-color: var(--bad); box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.35); }
.cambtn.rec .camdot { background: #ef4444; animation: rec 1.6s ease-in-out infinite; }
.short .cambtn { height: 40px; }
/* 幅の狭いスマホで撮影中：上の帯を詰めて、カメラの映像の場所を空ける */
@media (max-width: 430px) {
  .cambtn { max-width: 34px; }
  .lbar:has(.cambtn:not([hidden])) { gap: 4px; padding-left: 4px; padding-right: 4px; }
  .lbar:has(.cambtn:not([hidden])) .menubtn { min-width: 38px; padding: 0 4px; }
  .lbar:has(.cambtn:not([hidden])) .menubtn small { display: none; }
  .lbar:has(.cambtn:not([hidden])) .clock { min-width: 0; padding: 0 7px; gap: 5px; }
  .lbar:has(.cambtn:not([hidden])) .clock .recdot { width: 8px; height: 8px; }
  .lbar:has(.cambtn:not([hidden])) .period { min-width: 36px; padding: 0 4px; }
  .lbar:has(.cambtn:not([hidden])) .score { gap: 3px; }
}
/* 撮影の画面：大きな映像（録れる動画の向きに回して映す。大きさは js の fitPreview） */
.cambtn .camthumb { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; }
.cambtn.warn { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.45); }
.campvw { position: relative; margin: 0 auto; width: 100%; height: 200px; background: #000; border-radius: 12px; overflow: hidden; }
.campvw .campv { position: absolute; left: 50%; top: 50%; display: block; background: #000; }
.camorient { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.camorient .row b { font-size: 14px; }
.orientbox { border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel2); }
.orientbox p { margin: 0 0 6px; }
.orientbox.warn { border-color: #f59e0b; background: var(--warn-soft); }
.orientbox.ok { border-color: var(--accent); background: var(--accent-soft); }
.turnrow { gap: 6px; }
/* 録画と記録を同時にスタート */
.camacts { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 4px; }
.btn.startboth { width: 100%; min-height: 58px; font-size: 19px; font-weight: 900; border-radius: 14px; background: var(--good); border-color: var(--good); color: #fff; }
.btn.startboth.rec { background: #dc2626; border-color: #dc2626; }
.bothnote { margin: 0; }
.rdot { display: inline-block; width: 0.62em; height: 0.62em; border-radius: 50%; background: #fff; margin-right: 0.35em; vertical-align: 0.05em; box-shadow: 0 0 0 0.12em rgba(255, 255, 255, 0.35); }
.startbig.recstart { background: #dc2626; font-size: 28px; }
.startbtn.rec { background: #dc2626; font-size: clamp(15px, 3vmin, 22px); }
.btn.camon { font-weight: 700; border-color: var(--accent); color: var(--accent); }
.camstat { margin-top: 10px; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.camstat.rec { color: var(--bad); }
.camacts { margin: 10px 0 4px; }
.btn.recbtn { background: #dc2626; border-color: #dc2626; color: #fff; font-weight: 800; }
.camnotes { margin: 10px 0 0; padding-left: 18px; }
.camnotes li { margin: 3px 0; }
/* アプリごと横向き（画面の向きのロックをしたまま、横に倒して使う）：記録の画面だけ、body を 90° 回す。
   --rvw・--rvh は端末の画面の幅・高さ（js の applyRot）。回した body の中では、fixed の部品も body が基準になる */
html[data-rot="90"] body[data-view="live"], html[data-rot="270"] body[data-view="live"] { position: fixed; top: 0; left: 0; width: var(--rvh, 100vh); height: var(--rvw, 100vw); overflow: hidden; transform-origin: 0 0; }
html[data-rot="90"] body[data-view="live"] { transform: translateX(var(--rvw, 100vw)) rotate(90deg); }
html[data-rot="270"] body[data-view="live"] { transform: translateY(var(--rvh, 100vh)) rotate(-90deg); }
/* 切り欠き・ホームバーの余白も、回した向きに合わせる（上下左右の入れかえ） */
html[data-rot="90"] .live { padding: env(safe-area-inset-right) env(safe-area-inset-bottom) 0 env(safe-area-inset-top); }
html[data-rot="270"] .live { padding: env(safe-area-inset-left) env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
html[data-rot="90"] .gbar { height: calc(60px + env(safe-area-inset-left)); padding-bottom: calc(6px + env(safe-area-inset-left)); }
html[data-rot="270"] .gbar { height: calc(60px + env(safe-area-inset-right)); padding-bottom: calc(6px + env(safe-area-inset-right)); }
html[data-rot="90"] .short .gbar { height: calc(50px + env(safe-area-inset-left)); padding-bottom: calc(4px + env(safe-area-inset-left)); }
html[data-rot="270"] .short .gbar { height: calc(50px + env(safe-area-inset-right)); padding-bottom: calc(4px + env(safe-area-inset-right)); }
html[data-rot] .sheet-card { max-height: calc(var(--rvw, 100vw) * 0.92); }

/* スタート前の札の中の撮影 */
.covercam { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; font-weight: 700; }
.covercam.rec span { color: var(--bad); }
.covercam.warn { border-color: #f59e0b; background: var(--warn-soft); }
/* 撮影した動画の一覧 */
.vlist { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.vitem { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; text-align: left; }
.vitem .vt { display: flex; flex-direction: column; min-width: 0; }
.vitem .vt small { color: var(--muted); font-size: 12px; }
.vhead { margin: 10px 0 2px; font-size: 14px; }

/* 2つのチーム：左右に並べる（lay-side）か、上下に重ねる（lay-stack）。どちらにするかは js の BT.planLayout が決める
   （すきま・ふちの数字は、core.js の BT.LAYOUT と合わせる） */
.stagewrap { grid-area: stage; position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; }
.panels { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: row; gap: 6px; padding: 0 4px; }
.lay-stack .panels { flex-direction: column; }
.team { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--tc); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.35); }
.lay-stack .team { flex: var(--r, 1) 1 var(--base, 40px); }
/* チームの帯：名前・得点・「＋番号」 */
.thead { display: flex; align-items: center; gap: 6px; background: var(--tc); color: var(--tink); padding: 0 3px 0 8px; height: 22px; flex: none; border-bottom: 1px solid rgba(128, 128, 128, 0.45); }
.thead .tname { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
.tsc { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.tadd { flex: none; height: 18px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 0 6px; line-height: 1; opacity: 0.8; }
/* 選手の行：列の中は上から背番号の小さい順（grid-auto-flow: column）。行の高さは 28〜76px（入りきらなければ縦にすべらせる） */
.roster { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-template-columns: repeat(var(--c, 1), minmax(0, 1fr)); grid-template-rows: repeat(var(--r, 1), minmax(28px, 76px));
  gap: 3px 8px; padding: 4px; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; align-content: start; }
.team.scroll .roster { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), rgba(0, 0, 0, 0.35)); mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), rgba(0, 0, 0, 0.35)); }
.prow { display: grid; grid-template-columns: var(--nw, 36px) repeat(4, minmax(0, 1fr)); gap: 3px; min-height: 0; min-width: 0; }
.pno { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; overflow: hidden; border-radius: 8px; background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.55); }
.pno b { font-size: var(--nf, 20px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.pno small { display: none; font-size: 10px; line-height: 1.15; max-width: 100%; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
.team.roomy .pno small { display: block; }
.prow.unk .pno { background: var(--panel2); color: var(--muted); border: 1px dashed var(--line2); }
.prow.teamonly .pno b { font-size: 12px; letter-spacing: 0; }
.pb { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 0 2px; border: 0; border-radius: 8px; color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); transition: transform 0.06s, filter 0.06s; }
.pb b { font-size: var(--bf, 16px); font-weight: 900; line-height: 1; white-space: nowrap; overflow: hidden; letter-spacing: -0.01em; }
.pb:active { transform: scale(0.94); filter: brightness(1.18); box-shadow: none; }
.pb.k-fg2 { background: var(--k-fg2); }
.pb.k-fg3 { background: var(--k-fg3); }
.pb.k-ft { background: var(--k-ft); }
.pb.k-reb { background: var(--k-rb); }
/* 回数（ボタンの右上） */
.cnt { position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: rgba(0, 0, 0, 0.42); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 800; line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.prow.unk:not(.teamonly) .pb { opacity: 0.88; }
/* 幅の狭いボタン：回数は文字の下に（右上だと文字に重なるため） */
.team.narrowb .pb { flex-direction: column; gap: 1px; }
.team.narrowb .pb .cnt { position: static; height: 12px; min-width: 14px; padding: 0 3px; border-radius: 6px; font-size: 9.5px; line-height: 12px; }

.k-made { background: var(--k-made); }
.k-reb { background: var(--k-reb); }
.k-good { background: var(--k-good); }
.k-bad { background: var(--k-bad); }
.k-foul { background: var(--k-foul); }
.k-mark { background: var(--k-mark); color: var(--k-mark-ink); }
/* 押せたしるし（光る輪） */
.hit { animation: hit 0.32s ease-out; }
@keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.95), 0 0 0 0 var(--accent); filter: brightness(1.35); } 100% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0), 0 0 0 14px rgba(37, 99, 235, 0); filter: none; } }
.sc.hit, .tsc.hit { animation: bump 0.4s ease-out; }
@keyframes bump { 30% { transform: scale(1.25); } }

/* スタートの前・試合のあと：パネルの上に大きなボタン */
.cover { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 14, 21, 0.38); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); }
.cover-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cover-card p { margin: 0; }
.startbig { width: 100%; min-height: 84px; border: 0; border-radius: 16px; background: var(--good); color: #fff; font-size: 32px; font-weight: 900; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25); }
.startbig:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
.endtitle { font-size: 22px; }
.endscore { display: flex; align-items: center; gap: 12px; font-size: 16px; }
.endscore b { font-size: 34px; font-variant-numeric: tabular-nums; }

/* 画面の下：パスミス・★（いつでも押せる）・いま記録したもの・取り消す */
.gbar { grid-area: gbar; flex: none; display: flex; align-items: stretch; gap: 6px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); height: calc(60px + env(safe-area-inset-bottom)); min-width: 0; }
.gb { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 76px; padding: 0 10px; border: 0; border-radius: 12px; color: #fff; line-height: 1.1; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); transition: transform 0.06s, filter 0.06s, opacity 0.2s; }
.gb b { font-size: 17px; font-weight: 900; white-space: nowrap; }
.gb small { font-size: 11px; font-weight: 800; white-space: nowrap; }
.gb.k-mark b { font-size: 19px; line-height: 1; }
.gb:active { transform: scale(0.95); filter: brightness(1.15); box-shadow: none; }
.gb .cnt { top: 3px; right: 3px; }
.gbar.off .gb { opacity: 0.45; }
.lastbar { flex: 1; min-width: 0; display: flex; align-items: stretch; gap: 6px; }
.lastev { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--tc, var(--line2)); border-radius: 10px; padding: 3px 8px; overflow: hidden; line-height: 1.25; }
.lastev .l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.lastev .lt { font-variant-numeric: tabular-nums; font-size: 15px; flex: none; }
.lastev .ll { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lastev .lw { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lastev .mt { font-size: 12.5px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lastev.hint { border-left-color: var(--line2); }
.lastev.hint .mt { color: var(--muted); font-weight: 400; }
.lastev.msg { border-left-color: #64748b; }
.lastev.msg.ok { border-left-color: #22c55e; }
.lastev.msg.warn { border-left-color: #f59e0b; }
.lastev.msg.err { border-left-color: #ef4444; }
.btn.undo { flex: none; flex-direction: column; gap: 0; min-height: 0; padding: 0 10px; font-weight: 800; line-height: 1.1; }
.btn.undo b { font-size: 20px; line-height: 1; }
.btn.undo small { font-size: 10.5px; }
.btn.undo.act { font-size: 13px; padding: 0 8px; white-space: nowrap; }
/* タブレット：下のボタンを大きく */
@media (min-width: 700px) and (min-height: 600px) {
  .gbar { height: calc(70px + env(safe-area-inset-bottom)); gap: 8px; padding-left: 8px; padding-right: 8px; }
  .gb { min-width: 150px; padding: 0 18px; }
  .gb b { font-size: 22px; }
  .gb.k-mark b { font-size: 24px; }
  .gb small { font-size: 13px; }
  .lastev .lt { font-size: 18px; }
  .lastev .ll { font-size: 17px; }
  .lastev .lw, .lastev .mt { font-size: 14px; }
  .btn.undo { padding: 0 16px; }
  .thead { height: 26px; }
  .thead .tname { font-size: 15px; }
  .tsc { font-size: 17px; }
}
/* 幅の狭いスマホ：下の帯を詰める */
@media (max-width: 400px) {
  .gbar { gap: 4px; padding-left: 4px; padding-right: 4px; }
  .gb { min-width: 0; padding: 0 8px; }
  .gb b { font-size: 15px; }
  .btn.undo { padding: 0 7px; }
  .lastev { padding: 3px 6px; border-left-width: 5px; }
  .lastev .lt { font-size: 13.5px; }
  .lastev .ll { font-size: 13px; }
  .lastev .lw, .lastev .mt { font-size: 11.5px; }
}
/* 高さの低い画面（横向きのスマホ）：上と下の帯を薄く */
.short .lbar { padding: 3px 8px; }
.short .clock, .short .startbtn, .short .period, .short .sc, .short .menubtn { height: 40px; }
.short .tval { font-size: 28px; }
.short .sc { font-size: 26px; }
.short .menubtn small { display: none; }
.short .gbar { height: calc(50px + env(safe-area-inset-bottom)); padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
.short .gb small { display: none; }
.short .gb.k-mark b::after { content: ' あとで見る'; font-size: 13px; }

/* ---------- 撮影中の大きなワイプ（中・大） ----------
   横長の画面（dk-side）：右側の列に映像。下の帯（パスミス・★・いま記録したもの）も、その下へ
   縦長の画面：上の帯の下（dk-top）か、縦長の動画なら右側の列（dk-col）。映像の大きさは js の layoutWipe */
/* （右側の列の幅は min-content＝ワイプの幅。auto だと、下の帯の文の長さまで広がってしまう） */
.live.dk-side { grid-template-columns: minmax(0, 1fr) min-content; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "stage wipe" "stage gbar"; }
.live.dk-col { grid-template-columns: minmax(0, 1fr) min-content; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar bar" "stage wipe" "gbar gbar"; }
.live.dk-top { grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "bar" "wipe" "stage" "gbar"; }
.wipe { grid-area: wipe; display: flex; align-items: flex-start; justify-content: center; min-width: 0; min-height: 0; padding: 0 6px 6px 0; }
.dk-top .wipe { padding: 0 4px 6px; }
.wipebox { position: relative; flex: none; background: #000; border: 2px solid var(--line2); border-radius: 12px; overflow: hidden; }
.wipebox.rec { border-color: var(--bad); box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.35); }
.wipebox.warn { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.45); }
.wipeopen { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; display: block; }
.wipev { position: absolute; left: 50%; top: 50%; display: block; pointer-events: none; }
.wipetag { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); padding: 3px 8px; border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 12.5px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; pointer-events: none; }
.wipetag.rec { background: rgba(220, 38, 38, 0.88); }
.wipectl { position: absolute; right: 6px; top: 6px; display: flex; gap: 6px; }
.wipesz { width: 36px; height: 36px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 50%; background: rgba(0, 0, 0, 0.5); color: #fff; font-size: 21px; font-weight: 900; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.wipesz:active { background: rgba(0, 0, 0, 0.75); }
.wipesz:disabled { opacity: 0.3; }
.wipebox.tiny .wipectl { right: 4px; top: 4px; gap: 4px; }
.wipebox.tiny .wipesz { width: 28px; height: 28px; font-size: 17px; }
.wipebox.tiny .wipetag { left: 4px; bottom: 4px; padding: 2px 6px; font-size: 11.5px; }
/* 横長の画面：下の帯を、映像の下の列に（いま記録したもの・その下にパスミスと★）。高さは決まった数（js が残りの高さを測る） */
html .live.dk-side .gbar { height: auto; flex-wrap: wrap; align-content: flex-end; gap: 6px; padding-top: 0; padding-left: 0; padding-right: 6px; }
html .live.dk-side .lastbar { order: -1; flex: 1 1 100%; height: 50px; }
html .live.dk-side .gb { flex: 1 1 0; min-width: 0; height: 56px; padding: 0 6px; }
@media (min-width: 700px) and (min-height: 600px) {
  html .live.dk-side .lastbar { height: 62px; }
  html .live.dk-side .gb { height: 70px; }
}
html .live.dk-side.short .lastbar { height: 44px; }
html .live.dk-side.short .gb { height: 46px; }
/* （列が狭いので、★ の「あとで見る」は ★ の下に小さく） */
html .live.dk-side .gb.k-mark b::after { content: none; }
html .live.dk-side .gb small { display: block; }
/* 撮影の画面：ワイプの大きさ */
.wiperow { gap: 6px; margin-top: 8px; align-items: center; }
.wiperow b { font-size: 14px; }
.wiperow .note { flex-basis: 100%; margin: 0; }

/* ---------- 下から出る小窓 ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { background: var(--panel); width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3); animation: up 0.18s ease-out; -webkit-user-select: text; user-select: text; }
.sheet-card.wide { max-width: 860px; }
@keyframes up { from { transform: translateY(30px); opacity: 0.4; } }
@media (min-width: 700px) and (min-height: 560px) {
  .sheet { align-items: center; padding: 20px; }
  .sheet-card { border-radius: 18px; max-height: 86vh; }
}
.sheet-card header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-card header b { font-size: 16px; }
.sheet-card header .x { background: none; border: 0; font-size: 28px; line-height: 1; color: var(--muted); padding: 0 6px; min-width: 40px; min-height: 40px; }
.sheet-body { padding: 12px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex-wrap: wrap; }
.confirm-text { margin: 4px 0 8px; }

.menu { display: flex; flex-direction: column; gap: 6px; }
.mitem { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 56px; }
.mitem .mi { font-size: 22px; width: 30px; text-align: center; flex: none; }
.mitem .mt { display: flex; flex-direction: column; min-width: 0; }
.mitem .mt b { font-size: 15.5px; }
.mitem .mt small { color: var(--muted); font-size: 12.5px; }
.periodbox { display: flex; flex-direction: column; gap: 10px; }
.pgrid .btn { min-width: 84px; }

.keypad .kdisp { font-size: 40px; font-weight: 900; text-align: center; padding: 4px 0 10px; font-variant-numeric: tabular-nums; }
.keypad .kdisp.empty { font-size: 18px; color: var(--muted); font-weight: 700; padding: 18px 0 18px; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { min-height: 58px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel2); font-size: 24px; font-weight: 800; }
.key:active { transform: scale(0.96); background: var(--accent-soft); }

.tabsrow { margin-bottom: 4px; }
.loglist { display: flex; flex-direction: column; gap: 4px; }
.lrow { display: grid; grid-template-columns: 60px 16px 48px 1fr auto; align-items: center; gap: 8px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 46px; }
.lrow.per { grid-template-columns: 60px 1fr; background: transparent; border-style: dashed; }
.lrow .lt { font-variant-numeric: tabular-nums; }
.lrow .lno { font-weight: 800; font-variant-numeric: tabular-nums; }
.lrow .lp { color: var(--muted); font-weight: 700; }
.lrow .lname { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.llabel { font-weight: 700; background: none !important; }
.llabel.k-made { color: var(--k-made); }
.llabel.k-miss { color: var(--muted); }
.llabel.k-reb { color: var(--k-reb); }
.llabel.k-bad { color: var(--k-bad); }
.llabel.k-good { color: var(--k-good); }
.llabel.k-foul { color: var(--k-foul); }
.llabel.k-mark { color: var(--warn); }
.edit { display: flex; flex-direction: column; gap: 14px; }
.typepick .btn, .nopick .btn { min-width: 52px; }
.typepick .btn.k-made, .typepick .btn.k-reb, .typepick .btn.k-good, .typepick .btn.k-bad, .typepick .btn.k-foul, .typepick .btn.k-mark, .typepick .btn.k-miss { background: var(--panel2); color: var(--text); }
.typepick .btn.on { background: var(--accent-soft); }

.stats h3 { font-size: 15px; margin: 16px 0 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stats h3 small { color: var(--muted); font-weight: 400; }
.boxwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.box, .per { min-width: 100%; }
.box th, .box td, .per th, .per td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: center; white-space: nowrap; }
.box th, .per thead th { font-size: 12px; color: var(--muted); font-weight: 700; }
.box td.no { font-weight: 800; }
.box .nm { text-align: left; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.box tr.tot td { font-weight: 800; border-top: 2px solid var(--line2); }
.box tr.unk td { color: var(--muted); }
.per tbody th { text-align: left; font-weight: 700; }
.per td.sum { font-weight: 900; }

.export { display: flex; flex-direction: column; gap: 8px; }
.xitem { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.xitem b { font-size: 15.5px; }
.xitem small { color: var(--muted); font-size: 12.5px; }
.settings { display: flex; flex-direction: column; gap: 16px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 34px; }
.chk input { width: 20px; height: 20px; }
.help ol, .help ul { padding-left: 20px; margin: 6px 0; }
.help li { margin: 4px 0; }
.help h4 { margin: 14px 0 4px; }

/* ---------- お知らせ ---------- */
.toasts { position: fixed; left: 50%; bottom: calc(66px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 80; width: min(560px, calc(100% - 24px)); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; background: #1f2937; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); border-left: 5px solid #64748b; pointer-events: auto; }
.toast span { flex: 1; }
.toast.ok { border-left-color: #22c55e; }
.toast.warn { border-left-color: #f59e0b; }
.toast.err { border-left-color: #ef4444; }
.tbtn { background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; border-radius: 8px; padding: 5px 12px; font-weight: 700; min-height: 36px; }

}

<body>
<div id="view"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* js/core.js */
/* バスケ タップ記録 — 画面を持たない部分（データの形・時刻・集計・CSV・読み込み）
   DOM に依存しないので、node のテストからも、バスケ得点クリップの確かめからも読み込める。

   ■ 記録のデータ（1試合＝1つ。書き出す JSON もこの形。バスケ得点クリップが読み込む）
   {
     format: 'basket-tap', version: 1,
     id, title（なくてよい）, date: 'YYYY-MM-DD',
     startedAt: スタートを押した時刻（エポックミリ秒。押す前は null）, endedAt: 終えた時刻 | null,
     tz: 記録した端末の時差（分。日本は 540）,
     teams: [ 自分, 相手 ]  … { name, color, colorName, players: [{ no: '7', name: '' }] }
     events: [ { id, t, type, team, no } ]  … 追加した順
     videos: [ { vid, n, startedAt, endedAt, duration, name, mime, w, h, bytes } ]（この端末のカメラで撮影しながら記録したとき。なくてよい）
       startedAt：録画を始めた時刻（エポックミリ秒。記録の startedAt と同じ時計）→ 記録の t 秒 ＝ 動画の t ＋（startedAt(記録) − startedAt(動画)）/1000 秒
       動画の中身は、この端末のブラウザ（IndexedDB 'btap-media'。vstore.js）にだけある。書き出す JSON には、ファイル名・時刻・長さだけが入る
       t   : スタートからの秒（0.1 秒まで）。ストップウォッチと同じで、止まらずに進む
       type: 下の TYPES の id。'period' はピリオドの始まり（period: 番号。team・no はなし）
       team: 0 = 自分・1 = 相手・null = チームなし（画面の下の「パスミス」「★ あとで見る」。だれのかは決めない）
       no  : 背番号（文字列。'0' と '00' は別）| null（だれか分からない・チームなし）
   }
   得点のプレー（2P・3P・FT）には、かならずチームが付く。
   ピリオドは、イベントには持たせず「その時刻より前の、いちばん新しい 'period'」で決める（periodAt）。
   ピリオドを進め忘れても、あとで 'period' の時刻を直すだけで、全部の記録のピリオドが正しくなる。 */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};
  BT.APP = 'バスケ タップ記録';
  BT.FORMAT = 'basket-tap';
  BT.VERSION = 1;

  BT.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。tenths で 0.1 秒まで */
  BT.fmtTime = function (sec, tenths) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    if (tenths) sec = Math.round(sec * 10) / 10;
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (tenths) out += '.' + Math.round((sec * 10) % 10) % 10;
    return out;
  };

  /* ---------- プレーの種類 ----------
     label：記録の一覧・書き出しでの呼び名 / short：狭い所での呼び名（なければ label） / btn：記録の画面のボタンの文字
     kind：色分け（made 成功・miss 失敗・reb リバウンド・good よいプレー・bad ミス・foul・mark）
     記録の画面にボタンがあるのは、選手ごとの ROW_TYPES と、画面の下の GLOBAL_TYPES だけ。
     ほかの種類（失敗・アシストなど）は、前の版で記録したファイルを開くため・一覧で直すために残している */
  BT.TYPES = [
    { id: 'fg2', btn: '2P', label: '2P成功', pts: 2, made: true, shot: 'fg2', kind: 'made' },
    { id: 'fg3', btn: '3P', label: '3P成功', pts: 3, made: true, shot: 'fg3', kind: 'made' },
    { id: 'ft', btn: 'FT', short: 'FT成功', label: 'フリースロー成功', pts: 1, made: true, shot: 'ft', kind: 'made' },
    { id: 'fg2x', label: '2P失敗', pts: 0, made: false, shot: 'fg2', kind: 'miss' },
    { id: 'fg3x', label: '3P失敗', pts: 0, made: false, shot: 'fg3', kind: 'miss' },
    { id: 'ftx', short: 'FT失敗', label: 'フリースロー失敗', pts: 0, made: false, shot: 'ft', kind: 'miss' },
    { id: 'reb', btn: 'リバ', label: 'リバウンド', pts: 0, kind: 'reb' },
    { id: 'ast', label: 'アシスト', pts: 0, kind: 'good' },
    { id: 'stl', label: 'スティール', pts: 0, kind: 'good' },
    { id: 'blk', label: 'ブロック', pts: 0, kind: 'good' },
    { id: 'pass', btn: 'パスミス', label: 'パスミス', pts: 0, kind: 'bad' },
    { id: 'tov', label: 'ミス（その他）', pts: 0, kind: 'bad' },
    { id: 'foul', label: 'ファウル', pts: 0, kind: 'foul' },
    { id: 'mark', btn: '★ あとで見る', label: '★ あとで見る', pts: 0, kind: 'mark' }
  ];
  BT.TYPE = {};
  BT.TYPES.forEach((d) => { BT.TYPE[d.id] = d; });
  BT.TYPE.period = { id: 'period', label: 'ピリオド開始', pts: 0, kind: 'period' };

  /* 記録の画面のボタン
       ROW_TYPES   ：選手（背番号）の行ごとに並ぶボタン。押せば、その選手のプレーとして1回で記録する
       GLOBAL_TYPES：画面の下に1つずつ。チーム・選手は決めずに、時刻だけを残す */
  BT.ROW_TYPES = ['fg2', 'fg3', 'ft', 'reb'];
  BT.GLOBAL_TYPES = ['pass', 'mark'];
  /* 一覧で直すときに選べる種類（いまの画面のボタン＋その記録の種類） */
  BT.editTypes = function (cur) {
    const ids = BT.ROW_TYPES.concat(BT.GLOBAL_TYPES);
    if (cur && BT.TYPE[cur] && !ids.includes(cur)) ids.push(cur);
    return ids;
  };

  /* ユニフォームの色（よくある色） */
  BT.COLORS = [
    { name: '白', hex: '#f4f4f4' }, { name: '黒', hex: '#222222' }, { name: '赤', hex: '#d93636' }, { name: '青', hex: '#2f6fed' },
    { name: '紺', hex: '#1f2f6e' }, { name: '水色', hex: '#45b0e6' }, { name: '緑', hex: '#2e9e5b' }, { name: '黄', hex: '#f2c230' },
    { name: 'オレンジ', hex: '#f08a24' }, { name: '紫', hex: '#7d4cc9' }, { name: 'ピンク', hex: '#e86aa6' }, { name: 'グレー', hex: '#8a8f98' }
  ];
  function hexRGB(hex) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128]; }
  BT.hexRGB = hexRGB;
  /* その色の上に載せる文字の色（黒か白の、読みやすいほう） */
  BT.inkOn = function (hex) {
    const [r, g, b] = hexRGB(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return L > 0.36 ? '#111111' : '#ffffff';
  };
  /* 自由に選んだ色の呼び名：いちばん近い見本の色の名前 */
  BT.nearestColorName = function (hex) {
    const [r, g, b] = hexRGB(hex);
    let best = null;
    BT.COLORS.forEach((c) => { const [r2, g2, b2] = hexRGB(c.hex); const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2; if (!best || d < best.d) best = { d, name: c.name }; });
    return best.name;
  };

  /* ---------- 背番号 ---------- */
  /* 全角の数字・記号を半角に */
  function toHalf(s) {
    return String(s || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[〜～~－ー−‐―]/g, '-').replace(/[、，,・／/\s]+/g, ' ');
  }
  /* 背番号として使えるか（0〜99 と 00。前に 0 が付いたもの '07' は 7 にそろえる） */
  BT.normNo = function (v) {
    const s = toHalf(v).trim();
    if (s === '00') return '00';
    if (!/^\d{1,2}$/.test(s)) return null;
    return String(Number(s));
  };
  /* 並べる順：数の小さい順（'0' の次に '00'） */
  BT.cmpNo = (a, b) => (Number(a) - Number(b)) || (String(a).length - String(b).length);
  BT.sortNos = (list) => list.slice().sort(BT.cmpNo);
  /* 「4-15, 23 33」「４〜１５」などを、背番号の並びにする（重なりは1つに。範囲は 0〜99） */
  BT.parseNumbers = function (text) {
    const out = new Set();
    toHalf(text).split(' ').forEach((tok) => {
      if (!tok) return;
      const m = /^(\d{1,2})-(\d{1,2})$/.exec(tok);
      if (m) {
        let a = Number(m[1]), b = Number(m[2]);
        if (a > b) [a, b] = [b, a];
        for (let i = a; i <= b && i <= 99; i++) out.add(String(i));
        return;
      }
      const n = BT.normNo(tok);
      if (n != null) out.add(n);
    });
    return BT.sortNos(Array.from(out));
  };
  /* 背番号の並びを、短い文字にする（4,5,6,7,9 → 「4-7, 9」） */
  BT.formatNumbers = function (nos) {
    const list = BT.sortNos(nos || []);
    const out = [];
    let i = 0;
    while (i < list.length) {
      if (list[i] === '00') { out.push('00'); i++; continue; }
      let j = i;
      while (j + 1 < list.length && list[j + 1] !== '00' && Number(list[j + 1]) === Number(list[j]) + 1) j++;
      out.push(j - i >= 2 ? `${list[i]}-${list[j]}` : list.slice(i, j + 1).join(', '));
      i = j + 1;
    }
    return out.join(', ');
  };

  /* ---------- 試合 ---------- */
  BT.uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function pad2(n) { return String(n).padStart(2, '0'); }
  /* エポックミリ秒 → その時差での「YYYY-MM-DD」「HH:MM:SS」（端末の時差に頼らない） */
  BT.ymdAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
  BT.hmsAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`; };
  BT.tzText = function (tz) { const s = tz < 0 ? '-' : '+', a = Math.abs(tz || 0); return s + pad2(Math.floor(a / 60)) + ':' + pad2(a % 60); };
  BT.localTz = () => -new Date().getTimezoneOffset();

  function blankTeam(i) { return { name: '', color: i ? '#2f6fed' : '#f4f4f4', colorName: i ? '青' : '白', players: [] }; }
  BT.blankTeam = blankTeam;

  BT.newGame = function (opts) {
    opts = opts || {};
    const now = opts.now || Date.now();
    const tz = opts.tz != null ? opts.tz : BT.localTz();
    const teams = [0, 1].map((i) => Object.assign(blankTeam(i), clone((opts.teams || [])[i] || {})));
    teams.forEach((t) => { t.players = cleanPlayers(t.players); });
    return { format: BT.FORMAT, version: BT.VERSION, id: opts.id || BT.uid('g'), title: opts.title || '', date: BT.ymdAt(now, tz), createdAt: now, startedAt: null, endedAt: null, tz, teams, events: [], seq: 0 };
  };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function cleanPlayers(list) {
    const seen = new Set(), out = [];
    (list || []).forEach((p) => {
      const no = BT.normNo(p && p.no != null ? p.no : p);
      if (no == null || seen.has(no)) return;
      seen.add(no);
      out.push({ no, name: String((p && p.name) || '').trim().slice(0, 12) });
    });
    return out.sort((a, b) => BT.cmpNo(a.no, b.no));
  }
  BT.cleanPlayers = cleanPlayers;
  /* 背番号の並びを、名簿にする（名前は、前の名簿に同じ番号があれば引き継ぐ） */
  BT.playersFromNos = function (nos, old) {
    const names = {};
    (old || []).forEach((p) => { names[p.no] = p.name; });
    return cleanPlayers(nos.map((no) => ({ no, name: names[no] || '' })));
  };

  /* スタートからの秒（0.1 秒まで） */
  BT.elapsed = function (game, now) {
    if (!game || !game.startedAt) return 0;
    const end = game.endedAt || now || Date.now();
    return Math.max(0, Math.round((end - game.startedAt) / 100) / 10);
  };

  /* 時刻の順（同じ時刻なら追加した順） */
  BT.sorted = function (game) {
    return (game.events || []).map((e, i) => ({ e, i })).sort((a, b) => (a.e.t - b.e.t) || (a.i - b.i)).map((x) => x.e);
  };
  /* その時刻のピリオド（1〜）。'period' が無ければ 1 */
  BT.periodAt = function (game, t) {
    let p = 1, best = -Infinity;
    (game.events || []).forEach((e) => { if (e.type === 'period' && e.t <= t + 1e-9 && e.t >= best) { best = e.t; p = e.period; } });
    return p;
  };
  BT.currentPeriod = (game, now) => BT.periodAt(game, BT.elapsed(game, now));
  BT.periodLabel = (p) => (p <= 4 ? p + 'Q' : 'OT' + (p - 4));

  /* イベントを足す（時刻 t は呼び出し側が決める）。戻り値：足したイベント
     team が 0・1 でなければ「チームなし」（null）。ただし得点のプレーは、チームなしにできないので 0（自分）にする */
  BT.addEvent = function (game, ev) {
    game.seq = (game.seq || 0) + 1;
    const e = { id: 'e' + game.seq, t: Math.round((ev.t || 0) * 10) / 10, type: ev.type };
    if (ev.type === 'period') e.period = ev.period;
    else {
      const d = BT.TYPE[ev.type];
      e.team = ev.team === 0 || ev.team === 1 ? ev.team : d && d.pts ? 0 : null;
      e.no = e.team != null && ev.no != null ? String(ev.no) : null;
    }
    game.events.push(e);
    return e;
  };
  BT.findEvent = (game, id) => (game.events || []).find((e) => e.id === id) || null;
  BT.removeEvent = function (game, id) {
    const i = (game.events || []).findIndex((e) => e.id === id);
    if (i < 0) return null;
    return game.events.splice(i, 1)[0];
  };

  /* ---------- 記録の画面の並べ方 ----------
     選手1人＝1行（背番号＋「2P」「3P」「FT」「リバ」）。画面の大きさと人数から、
       arr：2チームを左右に並べる（side）か、上下に重ねる（stack）か
       c  ：チームの中を何列にするか（列の中は、上から背番号の小さい順）
     を決める。ボタンの「幅」と「高さ」の小さいほうが、いちばん大きくなるもの（同じくらいなら、列が少なく、左右に並べるもの）。
     相手の背番号を入れないとき（相手は1行だけ）は、自分のチームを画面の幅いっぱいに使えるよう、上下に重ねることが多い。
     ボタンの幅が MIN_BW より狭くなる並べ方は選ばない（高さが足りないときは、行を縦にすべらせる）。
     数字は css/app.css の記録の画面と合わせている（すきま・ふち） */
  BT.LAYOUT = { pad: 4, gap: 6, border: 2, rpad: 4, rgap: 3, cgap: 8, bgap: 3, rmin: 28, rmax: 76, minBw: 27 };
  BT.planLayout = function (W, H, n, headH) {
    const K = BT.LAYOUT;
    const fixed = 2 * K.border + headH + 2 * K.rpad;         // チームの枠の中で、行でない高さ（帯・ふち・すきま）
    const cand = [];
    ['side', 'stack'].forEach((arr) => {
      for (let c0 = 1; c0 <= 3; c0++) {
        for (let c1 = 1; c1 <= 3; c1++) {
          const c = [c0, c1];
          if (c0 > n[0] || c1 > n[1]) continue;
          const r = [Math.ceil(n[0] / c0), Math.ceil(n[1] / c1)];
          let teamW, rowH;
          if (arr === 'side') {
            teamW = (W - 2 * K.pad - K.gap) / 2;
            rowH = r.map((ri) => (H - fixed - (ri - 1) * K.rgap) / ri);
          } else {
            teamW = W - 2 * K.pad;
            const one = (H - K.gap - 2 * fixed - (r[0] - 1 + r[1] - 1) * K.rgap) / (r[0] + r[1]);
            rowH = [one, one];
          }
          const teams = [0, 1].map((i) => {
            const cellW = (teamW - 2 * K.border - 2 * K.rpad - (c[i] - 1) * K.cgap) / c[i];
            const nw = Math.round(BT.clamp(cellW * 0.2, 32, 64));
            const bw = (cellW - nw - 4 * K.bgap) / 4;
            return { c: c[i], r: r[i], cellW, nw, bw, rowH: Math.min(rowH[i], K.rmax), base: fixed + (r[i] - 1) * K.rgap };
          });
          // ボタンの押しやすさ：幅と高さの小さいほう（大きいほうが広いぶんも、少しだけ足す）
          const ease = (x) => Math.min(x.bw, x.rowH) + 0.15 * Math.min(Math.abs(x.bw - x.rowH), 30);
          const size = Math.min(...teams.map(ease));
          const wide = Math.min(...teams.map((x) => x.bw));
          // 列を増やすのは、ボタンが十分に大きくなるときだけ（押しやすい大きさなら、1列のほうが見やすい）
          const colCost = (size >= 34 ? 5 : 1) * (c0 - 1 + c1 - 1);
          const score = Math.min(size, 44) + 0.1 * Math.max(0, Math.min(size, 64) - 44) - colCost - (arr === 'stack' ? 1.5 : 0);
          cand.push({ arr, teams, size, wide, score, scroll: teams.some((x) => x.rowH < K.rmin) });
        }
      }
    });
    const okW = cand.filter((x) => x.wide >= K.minBw);
    const pool = okW.length ? okW : [cand.slice().sort((a, b) => b.wide - a.wide)[0]];
    return pool.sort((a, b) => b.score - a.score)[0];
  };

  /* ---------- 集計 ---------- */
  BT.score = function (game, until) {
    const s = [0, 0];
    (game.events || []).forEach((e) => {
      const d = BT.TYPE[e.type];
      if (d && d.pts && e.team != null && (until == null || e.t <= until)) s[e.team] += d.pts;
    });
    return s;
  };
  /* ボタンに出す数：「チーム:背番号:種類」→ 回数（チームなしは「-」、番号なしは空）。「*:種類」は、その種類の全部の数 */
  BT.tally = function (game) {
    const m = {};
    (game.events || []).forEach((e) => {
      if (e.type === 'period') return;
      const k = (e.team == null ? '-' : e.team) + ':' + (e.no == null ? '' : e.no) + ':' + e.type;
      m[k] = (m[k] || 0) + 1;
      m['*:' + e.type] = (m['*:' + e.type] || 0) + 1;
    });
    return m;
  };
  /* ピリオドごとの得点 [{ period, label, pts: [自分, 相手] }]（記録のあるピリオドと、始めたピリオド） */
  BT.periodScores = function (game) {
    const map = new Map();
    const get = (p) => { if (!map.has(p)) map.set(p, { period: p, label: BT.periodLabel(p), pts: [0, 0] }); return map.get(p); };
    (game.events || []).forEach((e) => {
      if (e.type === 'period') { get(e.period); return; }
      const d = BT.TYPE[e.type];
      const row = get(BT.periodAt(game, e.t));
      if (d && d.pts && e.team != null) row.pts[e.team] += d.pts;
    });
    if (!map.size) get(1);
    return Array.from(map.values()).sort((a, b) => a.period - b.period);
  };
  /* オフェンスリバウンドか：その少し前（10 秒以内・間にリバウンドがない）の外れたシュートが、同じチームのもの */
  BT.offensiveRebounds = function (game) {
    const set = new Set();
    let lastMiss = null;
    BT.sorted(game).forEach((e) => {
      const d = BT.TYPE[e.type];
      if (!d || e.type === 'period') return;
      if (d.shot && !d.made) { lastMiss = e; return; }
      if (e.type === 'reb') {
        if (lastMiss && e.t - lastMiss.t <= 10 && lastMiss.team === e.team) set.add(e.id);
        lastMiss = null;
        return;
      }
      if (d.shot && d.made) lastMiss = null;
    });
    return set;
  };
  const STAT_KEYS = ['pts', 'fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta', 'reb', 'oreb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'];
  BT.STAT_KEYS = STAT_KEYS;
  function zero() { const o = {}; STAT_KEYS.forEach((k) => { o[k] = 0; }); return o; }
  /* 選手ごとの集計：[{ team, rows: [{ no, name, s }], unknown: s（番号なし）, total: s }]（rows は名簿の番号＋記録にある番号） */
  BT.stats = function (game) {
    const oreb = BT.offensiveRebounds(game);
    return [0, 1].map((tm) => {
      const team = game.teams[tm] || blankTeam(tm);
      const byNo = new Map();
      team.players.forEach((p) => byNo.set(p.no, { no: p.no, name: p.name, s: zero() }));
      const unknown = zero(), total = zero();
      (game.events || []).forEach((e) => {
        if (e.type === 'period' || e.team !== tm) return;
        let s = unknown;
        if (e.no != null) {
          if (!byNo.has(e.no)) byNo.set(e.no, { no: e.no, name: '', s: zero(), extra: true });
          s = byNo.get(e.no).s;
        }
        [s, total].forEach((x) => add(x, e, oreb));
      });
      const rows = Array.from(byNo.values()).sort((a, b) => BT.cmpNo(a.no, b.no));
      return { team: tm, rows, unknown, total };
    });
  };
  /* チームなしの記録（画面の下の「パスミス」「★」）の集計 */
  BT.teamlessStats = function (game) {
    const oreb = BT.offensiveRebounds(game);
    const s = zero();
    (game.events || []).forEach((e) => { if (e.type !== 'period' && e.team == null) add(s, e, oreb); });
    return s;
  };
  function add(s, e, oreb) {
    const d = BT.TYPE[e.type];
    if (!d) return;
    s.pts += d.pts || 0;
    if (d.shot === 'fg2') { s.fg2a++; if (d.made) s.fg2m++; }
    else if (d.shot === 'fg3') { s.fg3a++; if (d.made) s.fg3m++; }
    else if (d.shot === 'ft') { s.fta++; if (d.made) s.ftm++; }
    else if (e.type === 'reb') { s.reb++; if (oreb.has(e.id)) s.oreb++; }
    else if (s[e.type] != null) s[e.type]++;
  }
  BT.pct = (m, a) => (a ? Math.round(100 * m / a) + '%' : '—');
  /* 外れたシュート（前の版の「失敗」のボタン）の記録があるか。なければ、成功率は出さない（入れた本数だけ） */
  BT.hasMisses = (game) => (game.events || []).some((e) => { const d = BT.TYPE[e.type]; return d && d.shot && !d.made; });
  BT.isEmpty = (s) => STAT_KEYS.every((k) => !s[k]);

  /* ---------- 名前 ---------- */
  /* チームの呼び名（名前がなければ「自分」「相手」。チームなし（null）は空） */
  BT.teamName = (game, tm) => { if (tm !== 0 && tm !== 1) return ''; const t = game.teams[tm] || {}; return (t.name || '').trim() || (tm ? '相手' : '自分'); };
  BT.playerName = function (game, tm, no) {
    const p = ((game.teams[tm] || {}).players || []).find((x) => x.no === no);
    return p ? p.name : '';
  };
  /* 一覧・書き出しの呼び名：「#7 たけし 2P成功」「1Q 開始」 */
  BT.eventText = function (game, e, withTeam) {
    if (e.type === 'period') return `${BT.periodLabel(e.period)} 開始`;
    const d = BT.TYPE[e.type] || { label: e.type };
    const who = e.team != null && e.no != null ? `#${e.no}${BT.playerName(game, e.team, e.no) ? ' ' + BT.playerName(game, e.team, e.no) : ''}` : '';
    return [withTeam ? BT.teamName(game, e.team) : '', who, d.label].filter(Boolean).join(' ');
  };

  /* ---------- 書き出し ---------- */
  /* JSON（ほかのアプリが読めるよう、ピリオドと種類の呼び名も付ける） */
  BT.exportData = function (game) {
    const g = clone(game);
    g.format = BT.FORMAT; g.version = BT.VERSION;
    g.events = BT.sorted(game).map((e) => {
      const o = Object.assign({}, e);
      if (e.type !== 'period') o.period = BT.periodAt(game, e.t);
      return o;
    });
    g.startedAtText = game.startedAt ? `${BT.ymdAt(game.startedAt, game.tz)} ${BT.hmsAt(game.startedAt, game.tz)} (UTC${BT.tzText(game.tz)})` : null;
    g.score = BT.score(game);
    g.types = {};
    BT.TYPES.forEach((d) => { g.types[d.id] = { label: d.label, pts: d.pts }; });
    g.app = BT.APP;
    delete g.seq;
    return g;
  };
  /* ファイル名に使える文字だけに */
  BT.safeName = (s) => String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
  BT.fileBase = function (game) {
    const hm = game.startedAt ? BT.hmsAt(game.startedAt, game.tz).slice(0, 5).replace(':', '') : '';
    return ['バスケ記録', game.date, hm, BT.safeName(BT.teamName(game, 0)) + 'vs' + BT.safeName(BT.teamName(game, 1))].filter(Boolean).join('_');
  };
  function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function csv(rows) { return rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
  /* 記録の一覧（CSV）。Excel で文字化けしないよう、先頭の BOM は呼び出し側で付ける */
  BT.eventsCSV = function (game) {
    const rows = [['No', '時刻', 'スタートからの秒', 'ピリオド', 'チーム', '背番号', '名前', 'プレー', '得点', `${BT.teamName(game, 0)}の得点`, `${BT.teamName(game, 1)}の得点`]];
    const s = [0, 0];
    let n = 0;
    BT.sorted(game).forEach((e) => {
      if (e.type === 'period') { rows.push(['', BT.fmtTime(e.t), e.t, BT.periodLabel(e.period), '', '', '', `${BT.periodLabel(e.period)} 開始`, '', s[0], s[1]]); return; }
      const d = BT.TYPE[e.type] || { label: e.type, pts: 0 };
      if (e.team != null) s[e.team] += d.pts || 0;
      rows.push([++n, BT.fmtTime(e.t), e.t, BT.periodLabel(BT.periodAt(game, e.t)), BT.teamName(game, e.team), e.no != null ? e.no : '', e.no != null ? BT.playerName(game, e.team, e.no) : '', d.label, d.pts || '', s[0], s[1]]);
    });
    return csv(rows);
  };
  /* 選手ごとの集計（CSV） */
  BT.boxCSV = function (game) {
    const head = ['チーム', '背番号', '名前', '得点', '2P成功', '2P試投', '3P成功', '3P試投', 'FT成功', 'FT試投', 'リバウンド', 'うちオフェンス', 'アシスト', 'スティール', 'ブロック', 'パスミス', 'ミス（その他）', 'ファウル', '★'];
    const keys = ['pts', 'fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta', 'reb', 'oreb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'];
    const rows = [head];
    BT.stats(game).forEach((st) => {
      const name = BT.teamName(game, st.team);
      st.rows.forEach((r) => rows.push([name, r.no, r.name, ...keys.map((k) => r.s[k])]));
      if (!BT.isEmpty(st.unknown)) rows.push([name, '番号なし', '', ...keys.map((k) => st.unknown[k])]);
      rows.push([name, '合計', '', ...keys.map((k) => st.total[k])]);
    });
    const free = BT.teamlessStats(game);
    if (!BT.isEmpty(free)) rows.push(['チームなし', '', '', ...keys.map((k) => free[k])]);
    return csv(rows);
  };

  /* ---------- 読み込み（書き出した JSON を開き直す） ----------
     形が合わないものは、分かる言葉の Error にする */
  BT.importData = function (obj) {
    if (typeof obj === 'string') { try { obj = JSON.parse(obj); } catch (e) { throw new Error('JSON として読めませんでした'); } }
    if (!obj || typeof obj !== 'object') throw new Error('記録のファイルではないようです');
    if (obj.format !== BT.FORMAT) throw new Error('「バスケ タップ記録」で書き出したファイルではないようです');
    if (!Array.isArray(obj.events) || !Array.isArray(obj.teams)) throw new Error('記録の中身（events・teams）がありません');
    const g = BT.newGame({ id: typeof obj.id === 'string' ? obj.id.slice(0, 40) : undefined, title: String(obj.title || '').slice(0, 40), now: obj.createdAt || obj.startedAt || Date.now(), tz: isFinite(obj.tz) ? obj.tz : 540, teams: obj.teams.slice(0, 2).map(cleanTeam) });
    g.date = /^\d{4}-\d{2}-\d{2}$/.test(obj.date || '') ? obj.date : g.date;
    g.startedAt = isFinite(obj.startedAt) && obj.startedAt > 0 ? obj.startedAt : null;
    g.endedAt = isFinite(obj.endedAt) && obj.endedAt > 0 ? obj.endedAt : null;
    const vids = BT.cleanVideos(obj.videos);
    if (vids.length) g.videos = vids;
    // 記録の id は、そのまま使えるもの（e＋数・重ならない）は残し、そうでないものに新しい番号を付ける
    const okId = (id) => typeof id === 'string' && /^e\d{1,7}$/.test(id);
    g.seq = obj.events.reduce((m, e) => Math.max(m, e && okId(e.id) ? Number(e.id.slice(1)) : 0), 0);
    const used = new Set();
    obj.events.forEach((e) => {
      if (!e || !isFinite(e.t) || e.t < 0) return;
      let ev = null;
      if (e.type === 'period') { if (isFinite(e.period) && e.period >= 1) ev = BT.addEvent(g, { t: e.t, type: 'period', period: Math.min(20, Math.round(e.period)) }); }
      else if (BT.TYPE[e.type]) ev = BT.addEvent(g, { t: e.t, type: e.type, team: e.team, no: e.no != null ? BT.normNo(e.no) : null });
      if (!ev) return;
      if (okId(e.id) && !used.has(e.id)) { g.seq--; ev.id = e.id; }      // addEvent が進めた番号を戻す
      while (used.has(ev.id)) ev.id = 'e' + (++g.seq);
      used.add(ev.id);
    });
    g.seq = g.events.reduce((m, e) => Math.max(m, Number(e.id.slice(1)) || 0), g.seq);
    return g;
  };
  /* 読み込んだチームの形をそろえる（名前・色・名簿） */
  function cleanTeam(t, i) {
    const b = blankTeam(i);
    if (!t || typeof t !== 'object') return b;
    const color = /^#[0-9a-f]{6}$/i.test(t.color || '') ? t.color : b.color;
    return { name: String(t.name || '').trim().slice(0, 20), color, colorName: String(t.colorName || BT.nearestColorName(color)).slice(0, 8), players: cleanPlayers(t.players) };
  }
  BT.cleanTeam = cleanTeam;

  /* 試合の一覧に出す短い情報 */
  BT.summary = function (game) {
    return { id: game.id, title: game.title || '', date: game.date, startedAt: game.startedAt, endedAt: game.endedAt, names: [BT.teamName(game, 0), BT.teamName(game, 1)], colors: [game.teams[0].color, game.teams[1].color], score: BT.score(game), n: (game.events || []).filter((e) => e.type !== 'period').length, videos: (game.videos || []).filter((v) => !v.gone).length, at: Date.now() };
  };
  /* 動画の情報をそろえる（読み込んだファイル用。形の合わないものは捨てる） */
  BT.cleanVideos = function (list) {
    return (Array.isArray(list) ? list : []).filter((v) => v && isFinite(v.startedAt) && v.startedAt > 0).slice(0, 50).map((v, i) => ({
      vid: String(v.vid || 'v' + i).slice(0, 40), n: isFinite(v.n) ? Math.round(v.n) : i + 1, startedAt: +v.startedAt,
      endedAt: isFinite(v.endedAt) ? +v.endedAt : null, duration: isFinite(v.duration) ? +v.duration : null,
      name: String(v.name || '').slice(0, 120), mime: String(v.mime || '').slice(0, 60), w: +v.w || null, h: +v.h || null, bytes: +v.bytes || null,
      status: 'done', gone: true        // 読み込んだ記録の動画は、この端末にはない（ファイル名・時刻だけ）
    }));
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/store.js */
/* バスケ タップ記録 — 保存（このブラウザの中だけ。どこにも送らない）
   ・試合：1つ記録するたびに、すぐ保存する（途中で画面を閉じても、開き直せば続きから）
   ・チーム：名前・色・名簿を覚えておき、次の試合で選べる（自分のチームは毎回同じことが多いので）
   ・設定：名前の表示・「？」の行・音・画面の明るさ
   キーは「btap:」で始まる。バスケ得点クリップ（同じサイトの別のページ）からも、この試合を読み込める。 */
(function (root) {
  'use strict';
  const BT = root.BT;
  const K = { games: 'btap:games', game: 'btap:game:', current: 'btap:current', teams: 'btap:teams', prefs: 'btap:prefs' };
  const KEEP = 60;          // 覚えておく試合の数（古いものから消す。書き出したファイルは残る）

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return false; try { s.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function remove(k) { const s = ls(); if (s) { try { s.removeItem(k); } catch (e) { /* 無視 */ } } }

  /* ---------- 試合 ---------- */
  function games() { return (readJSON(K.games) || []).filter((g) => g && g.id).sort((a, b) => (b.startedAt || b.at || 0) - (a.startedAt || a.at || 0)); }
  function loadGame(id) {
    const g = readJSON(K.game + id);
    if (!g || g.format !== BT.FORMAT || !Array.isArray(g.events)) return null;
    if (!g.seq) g.seq = g.events.reduce((m, e) => Math.max(m, Number(String(e.id).slice(1)) || 0), 0);
    return g;
  }
  /* 保存できたら true（入りきらないときは、古い試合を消してもう一度） */
  function saveGame(game) {
    if (!game || !game.id) return false;
    const list = games().filter((x) => x.id !== game.id);
    list.unshift(BT.summary(game));
    let ok = writeJSON(K.game + game.id, game);
    if (!ok || list.length > KEEP) {
      const old = list.slice().sort((a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0)).filter((x) => x.id !== game.id);
      const n = ok ? list.length - KEEP : Math.max(5, list.length - KEEP);
      old.slice(0, n).forEach((x) => { remove(K.game + x.id); const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list.splice(i, 1); });
      if (!ok) ok = writeJSON(K.game + game.id, game);
    }
    writeJSON(K.games, list);
    return ok;
  }
  function deleteGame(id) {
    remove(K.game + id);
    writeJSON(K.games, games().filter((x) => x.id !== id));
    if (current() === id) setCurrent(null);
  }
  function current() { const s = ls(); try { return s ? s.getItem(K.current) : null; } catch (e) { return null; } }
  function setCurrent(id) { const s = ls(); if (!s) return; try { if (id) s.setItem(K.current, id); else s.removeItem(K.current); } catch (e) { /* 無視 */ } }

  /* ---------- チーム（名簿） ---------- */
  function teams() { return (readJSON(K.teams) || []).filter((t) => t && t.id).sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)); }
  /* 同じ名前のチームは上書き。名前のないチームは保存しない */
  function saveTeam(team, mine) {
    const name = (team.name || '').trim();
    if (!name) return null;
    const list = teams();
    let t = list.find((x) => x.name === name);
    if (!t) { t = { id: BT.uid('t') }; list.push(t); }
    Object.assign(t, { name, color: team.color, colorName: team.colorName, players: BT.cleanPlayers(team.players), usedAt: Date.now() });
    if (mine) { list.forEach((x) => { delete x.mine; }); t.mine = true; }
    writeJSON(K.teams, list.slice(0, 40));
    return t;
  }
  function deleteTeam(id) { writeJSON(K.teams, teams().filter((t) => t.id !== id)); }
  function myTeam() { return teams().find((t) => t.mine) || null; }

  /* ---------- 設定 ---------- */
  /* names：選手の名前も出す / unknown：「？」（だれか分からないとき）の行を出す / sound：タップ音 / theme：画面の色
     camQuality：撮影の画質（'720' | '1080'）/ camAudio：録画に音も入れる / camOrient：撮る向き（'land' 横 | 'port' 縦）
     uiRot：アプリごと横向きにする（90・270。画面の向きのロックをしたまま、横に倒して使う）/ camRot・camRotF：映像の向きの手直し（ふつう・アプリごと横向きのとき）
     camWipe：記録の画面に映すカメラの映像（ワイプ）の大きさ（'s' 小：上の帯の中 | 'm' 中 | 'l' 大） */
  function prefs() {
    const p = Object.assign({ sound: false, theme: 'auto', names: true, unknown: true, camQuality: '720', camAudio: true, camOrient: 'land', uiRot: 0, camRot: 0, camRotF: null, camWipe: 'm' }, readJSON(K.prefs) || {});
    delete p.actions;        // 前の版の「ボタンの組み合わせ」（いまは、選手ごとのボタンに決まっている）
    return p;
  }
  function savePrefs(p) { return writeJSON(K.prefs, p); }

  /* 消されにくくする（Safari などは、しばらく開かないサイトの保存を消すことがある。できる環境だけ） */
  function persist() {
    try { if (root.navigator && navigator.storage && navigator.storage.persist) return navigator.storage.persist().catch(() => false); } catch (e) { /* 無視 */ }
    return Promise.resolve(false);
  }

  BT.store = { games, loadGame, saveGame, deleteGame, current, setCurrent, teams, saveTeam, deleteTeam, myTeam, prefs, savePrefs, persist, KEYS: K };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui.js */
/* バスケ タップ記録 — 画面の部品（要素づくり・お知らせ・下から出る小窓・振動と音・保存と共有） */
(function (root) {
  'use strict';
  const BT = root.BT;

  /* h('div', { class: 'x', onclick: fn }, 子要素…) */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) el.style.setProperty(p, v[p]); else el.style[p] = v[p]; } }
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (sel, rootEl) => (rootEl || document).querySelector(sel);
  const $$ = (sel, rootEl) => Array.from((rootEl || document).querySelectorAll(sel));

  /* お知らせ（画面の下に数秒）。action：{ label, onClick } でボタンを1つ付けられる */
  function toast(text, kind, ms, action) {
    const box = $('#toasts');
    if (!box) return null;
    const el = h('div', { class: 'toast ' + (kind || ''), role: 'status' }, h('span', null, text));
    if (action) el.appendChild(h('button', { class: 'tbtn', onclick: () => { el.remove(); action.onClick(); } }, action.label));
    box.appendChild(el);
    while (box.children.length > 2) box.firstChild.remove();
    setTimeout(() => el.remove(), ms || 2600);
    return el;
  }

  /* 下から出る小窓（タブレットでは真ん中）。同時に1つだけ。
     opts: { title, body（要素）, foot（要素の配列）, onClose, wide, cls } → { close, body, el } */
  let current = null;
  function sheet(opts) {
    closeSheet(true);
    const wrap = $('#sheet');
    const card = h('div', { class: 'sheet-card' + (opts.wide ? ' wide' : '') + (opts.cls ? ' ' + opts.cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '' });
    const close = () => { if (current && current.card === card) closeSheet(); };
    card.appendChild(h('header', null, h('b', null, opts.title || ''), h('button', { class: 'x', 'aria-label': '閉じる', onclick: close }, '×')));
    const body = h('div', { class: 'sheet-body' });
    if (opts.body) body.appendChild(opts.body);
    card.appendChild(body);
    if (opts.foot && opts.foot.length) card.appendChild(h('div', { class: 'sheet-foot' }, opts.foot));
    wrap.innerHTML = '';
    wrap.appendChild(card);
    wrap.hidden = false;
    wrap.onclick = (e) => { if (e.target === wrap) close(); };
    current = { card, onClose: opts.onClose };
    return { close, body, el: card };
  }
  function closeSheet(silent) {
    const wrap = $('#sheet');
    if (!current || !wrap) return;
    const c = current;
    current = null;
    wrap.hidden = true; wrap.innerHTML = '';
    if (!silent && c.onClose) c.onClose();
    else if (silent && c.onClose) c.onClose(true);
  }
  const sheetOpen = () => !!current;

  /* 確かめる小窓：ok を押したら onOk */
  function confirm(title, text, okLabel, onOk, danger) {
    const s = sheet({
      title, body: h('p', { class: 'confirm-text' }, text),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn ' + (danger ? 'danger-fill' : 'primary'), onclick: () => { s.close(); onOk(); } }, okLabel)]
    });
    return s;

                    T.ctos.forEach((o) => { const l = ctts[ctts.length - 1]; if (l && l[1] === o) l[0]++; else ctts.push([1, o]); });
                    w.full('ctts', T.negCto ? 1 : 0, 0, () => { w.u32(ctts.length); ctts.forEach(([c, o]) => { w.u32(c); w.i32(o); }); });

                  if (!T.allSync) {

                    T.sync.forEach((s, i) => { if (s) idx.push(i + 1); });

                  w.full('stsz', 0, 0, () => { w.u32(0); w.u32(T.sizes.length); T.sizes.forEach((s) => w.u32(s)); });

                  T.chunks.forEach((c, i) => { const l = stsc[stsc.length - 1]; if (!l || l[1] !== c.n || l[2] !== c.sdi) stsc.push([i + 1, c.n, c.sdi]); });

<script>
/* js/vstore.js */
/* バスケ タップ記録 — 撮影した動画の保存（このブラウザの IndexedDB。どこにも送らない）
   録画は数秒ごとの切れはし（chunk）で届くので、届くたびに保存する（途中でページが閉じても、そこまでは残る）。
   録画を止めたら、細切れの MP4 をふつうの MP4 に組み直す「組み立て図」（fmp4.flatten の header と ranges）も保存する。
   動画の中身は、切れはしのまま1回だけ保存する（組み直した動画を、もう1つ保存しない。容量を2倍にしないため）。

   ■ データの形（バスケ得点クリップ basket-clips/js/tapvideo.js も、同じ形で読む）
   DB 'btap-media'（版 1）
     videos：{ vid, gameId, n（その試合の何本目か）, startedAt（録画を始めた時刻・エポックミリ秒）, endedAt,
               mime, ext, w, h, bytes, chunks（切れはしの数）, status（'recording' | 'done'）,
               plan（{ header: Uint8Array, ranges: [[始め, 終わり)…], duration, truncated } | null）, duration（秒）, name（保存するときのファイル名） }
     chunks：{ vid, i, blob }（キー [vid, i]。i の順につなぐと、録画した動画そのもの） */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};
  const DB = 'btap-media', VER = 1;
  let dbp = null;

  const supported = () => { try { return !!root.indexedDB; } catch (e) { return false; } };
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      let req;
      try { req = root.indexedDB.open(DB, VER); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'vid' }).createIndex('gameId', 'gameId');
        if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks', { keyPath: ['vid', 'i'] });
      };
      req.onsuccess = () => { const db = req.result; db.onversionchange = () => { db.close(); dbp = null; }; resolve(db); };
      req.onerror = () => reject(req.error || new Error('IndexedDB を開けませんでした'));
      req.onblocked = () => reject(new Error('IndexedDB がほかのタブで使われています'));
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  /* 1回のやりとり。fn(stores) の戻り値（IDBRequest なら、その結果）を返す */
  async function tx(names, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(names, mode);
      const stores = {};
      [].concat(names).forEach((n) => { stores[n] = t.objectStore(n); });
      let out;
      try { out = fn(stores); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(out && typeof out === 'object' && 'result' in out && 'readyState' in out ? out.result : out);
      t.onerror = () => reject(t.error || new Error('保存できませんでした'));
      t.onabort = () => reject(t.error || new Error('保存できませんでした（空きが足りない など）'));
    });
  }
  const range = (vid) => IDBKeyRange.bound([vid, 0], [vid, Infinity]);

  const putChunk = (vid, i, blob) => tx('chunks', 'readwrite', (s) => { s.chunks.put({ vid, i, blob }); });
  const putVideo = (v) => tx('videos', 'readwrite', (s) => { s.videos.put(v); });
  const getVideo = (vid) => tx('videos', 'readonly', (s) => s.videos.get(vid));
  const videosOf = (gameId) => tx('videos', 'readonly', (s) => s.videos.index('gameId').getAll(gameId)).then((list) => (list || []).sort((a, b) => a.startedAt - b.startedAt));
  const allVideos = () => tx('videos', 'readonly', (s) => s.videos.getAll()).then((list) => list || []);
  const chunks = (vid) => tx('chunks', 'readonly', (s) => s.chunks.getAll(range(vid))).then((list) => (list || []).sort((a, b) => a.i - b.i).map((c) => c.blob));
  /* 録画した動画そのもの（切れはしをつないだもの） */
  async function raw(vid, mime) { return new Blob(await chunks(vid), { type: mime || 'video/mp4' }); }
  /* 保存・再生に使う動画（組み直した MP4。組み立て図がなければ、録画したまま） */
  async function file(vid) {
    const v = await getVideo(vid);
    if (!v) return null;
    const blob = await raw(vid, v.mime);
    const out = v.plan && BT.fmp4 ? BT.fmp4.compose(blob, Object.assign({ flat: true }, v.plan), 'video/mp4') : blob;
    try { return new File([out], v.name || ('video.' + (v.ext || 'mp4')), { type: v.plan ? 'video/mp4' : (v.mime || 'video/mp4'), lastModified: v.startedAt }); } catch (e) { return out; }
  }
  const remove = (vid) => tx(['videos', 'chunks'], 'readwrite', (s) => { s.videos.delete(vid); s.chunks.delete(range(vid)); });
  async function removeGame(gameId) { const list = await videosOf(gameId); for (const v of list) await remove(v.vid); return list.length; }
  async function estimate() {
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); return { usage: e.usage || 0, quota: e.quota || 0 }; } } catch (e) { /* 分からない */ }
    return null;
  }

  BT.vstore = { supported, open, putChunk, putVideo, getVideo, videosOf, allVideos, chunks, raw, file, remove, removeGame, estimate, DB };
})(typeof window !== 'undefined' ? window : globalThis);
