<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バスケ タップ記録</title>
<meta name="description" content="バスケの試合を見ながら、だれがシュートを入れたか・リバウンド・パスミスなどをタップで記録。時刻つきなので、あとで試合の動画から場面を切り出せます（記録はどこにも送りません）">
<meta name="theme-color" content="#0a0e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タップ記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
/* バスケ タップ記録 */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel2: #f2f4f8;
  --line: #d6dce6;
  --line2: #b9c3d2;
  --text: #0f172a;
  --muted: #566276;
  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.12);
  --good: #15803d;
  --warn: #b45309;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --bad: #dc2626;
  /* プレーのボタンの色 */
  --k-made: #15803d;
  --k-reb: #1d4ed8;
  --k-good: #0f766e;
  --k-bad: #c2410c;
  --k-foul: #a16207;
  --k-mark: #facc15;
  --k-mark-ink: #3b2a00;
  --k-miss-bg: #ffffff;
  --k-miss-line: #8b97aa;
  --k-miss-ink: #0f172a;
  --k-miss-x: #b91c1c;
  --ask: #f59e0b;
  --radius: 14px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
    --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
    --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
    --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
  --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
  --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
  --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
a { color: var(--accent); }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 14px; font-size: 14px; line-height: 1.3; text-decoration: none; color: var(--text); transition: background 0.12s, border-color 0.12s, transform 0.06s; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.btn.small { min-height: 34px; padding: 4px 11px; font-size: 13px; border-radius: 9px; }
.btn.huge { width: 100%; min-height: 58px; font-size: 18px; font-weight: 800; border-radius: 14px; }
.btn.icon { width: 40px; padding: 0; font-weight: 800; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.btn[disabled] { opacity: 0.45; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; font-size: 13px; }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.7); vertical-align: -2px; flex: none; }
.chip.neutral { background: var(--line2); }
.note { color: var(--muted); font-size: 13px; }
.note.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.center { justify-content: center; }
.spacer { flex: 1; }

/* ---------- 試合の一覧・準備（ふつうのページ） ---------- */
.hbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo { font-size: 28px; }
.brand b { display: block; font-size: 17px; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.htitle { font-size: 16px; }
.home, .setup { max-width: 920px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.going { border: 2px solid var(--bad); }
.going-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.games { display: flex; flex-direction: column; gap: 8px; }
.grow { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.gopen { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: none; border: 0; padding: 4px; }
.gline { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gline .when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gline .vs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.gline .vs b { font-size: 17px; font-variant-numeric: tabular-nums; }
.gline .gtitle { font-size: 12.5px; color: var(--muted); }
.tools .row { margin-top: 8px; }
.steps3 ol { margin: 4px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps3 li b { display: block; font-size: 15px; }
.steps3 li span { color: var(--muted); font-size: 13px; }
.lead { color: var(--muted); margin: 0; font-size: 14px; }

.teams2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 820px) { .teams2 { grid-template-columns: 1fr 1fr; } }
.teamcard { display: flex; flex-direction: column; gap: 10px; border-top: 8px solid var(--tc); box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.08); }
.tc-head { display: flex; align-items: center; gap: 10px; }
.tc-head b { font-size: 17px; }
.tc-band { background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.savedrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chipbtn small { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input[type="text"], .nostext { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; font-size: 16px; width: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(128, 128, 128, 0.55); padding: 0; position: relative; }
.sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.swc { width: 42px; height: 36px; padding: 0 2px; border: 1px dashed var(--line2); border-radius: 9px; background: var(--panel2); }
.presets .btn { font-weight: 700; }
.nogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.nb { min-height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nb.on { background: var(--tc); color: var(--tink); border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.names summary { cursor: pointer; color: var(--accent); font-size: 14px; padding: 4px 0; }
.namelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 6px; }
.nm { display: flex; align-items: center; gap: 6px; }
.nm b { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.nm input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; font-size: 15px; }
.gobar { position: sticky; bottom: 0; padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* ---------- 記録の画面 ---------- */
body[data-view="live"] { overflow: hidden; }
.live { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.live button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* 上の帯：時計・ピリオド・得点・メニュー */
.lbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex: none; }
.clock { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 0 10px; height: clamp(46px, 7.4vmin, 64px); min-width: clamp(104px, 21vmin, 170px); flex: none; }
.tval { font-size: clamp(30px, 6.2vmin, 50px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; line-height: 1; }
.tval.long { font-size: clamp(22px, 4.6vmin, 40px); }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); flex: none; animation: rec 1.6s ease-in-out infinite; }
.clock.ended .recdot { animation: none; background: var(--line2); }
.clock.ended .tval { color: var(--muted); }
@keyframes rec { 50% { opacity: 0.25; } }
.startbtn { height: clamp(46px, 7.4vmin, 64px); border: 0; border-radius: 12px; background: var(--good); color: #fff; font-size: clamp(17px, 3.4vmin, 26px); font-weight: 900; padding: 0 14px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); flex: none; white-space: nowrap; }
.period { height: clamp(46px, 7.4vmin, 64px); min-width: 48px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); font-size: clamp(18px, 3.8vmin, 26px); font-weight: 800; padding: 0 8px; flex: none; }
.score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.sc { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: clamp(46px, 7.4vmin, 64px); padding: 0 7px; border-radius: 12px; background: var(--tc); color: var(--tink); border: 2px solid rgba(128, 128, 128, 0.55); font-size: clamp(28px, 6vmin, 46px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.sc { flex: none; }
.score.big3 .sc { font-size: clamp(20px, 4.4vmin, 36px); padding: 0 4px; }
/* 幅の狭いスマホ：上の帯を詰める */
@media (max-width: 400px) {
  .lbar { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .period { min-width: 42px; padding: 0 5px; }
  .menubtn { min-width: 44px; }
  .lbar:has(.tval.long) .menubtn small, .lbar:has(.big3) .menubtn small { display: none; }
  .score { gap: 3px; }
  .tval.long ~ .recdot, .clock:has(.tval.long) .recdot { width: 8px; height: 8px; }
  .clock:has(.tval.long) { padding: 0 7px; gap: 5px; }
}
.dash { font-size: 22px; color: var(--muted); font-weight: 800; }
.menubtn { height: clamp(46px, 7.4vmin, 64px); min-width: 50px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0 6px; flex: none; }
.menubtn span { font-size: 24px; font-weight: 800; }
.menubtn small { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* 2つのチーム：縦に重ねる（横長の画面では左右に並べる） */
.stagewrap { position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; }
.panels { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.team { flex: var(--rows, 3) 1 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 3px solid var(--tc); border-radius: var(--radius); overflow: hidden; box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.35); }
@media (orientation: landscape) and (min-width: 600px) {
  .panels { flex-direction: row; }
  .team { flex: 1 1 0; min-width: 0; }
}
.thead { position: relative; display: flex; align-items: center; gap: 8px; background: var(--tc); color: var(--tink); padding: 3px 10px; min-height: 34px; flex: none; border-bottom: 1px solid rgba(128, 128, 128, 0.45); }
.tname { font-size: clamp(14px, 2.6vmin, 19px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tsc { font-size: clamp(16px, 3vmin, 22px); font-weight: 900; font-variant-numeric: tabular-nums; opacity: 0.85; }
.ask { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; align-self: stretch; margin: -3px -10px -3px 0; padding: 0 6px 0 10px; background: var(--ask); color: #1a1200; font-weight: 800; font-size: clamp(13px, 2.4vmin, 17px); border-left: 1px solid rgba(0, 0, 0, 0.25); }
.team.asking .tsc { display: none; }
.asktxt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.askx { flex: none; border: 1px solid rgba(0, 0, 0, 0.35); background: rgba(255, 255, 255, 0.6); border-radius: 8px; padding: 2px 10px; min-height: 28px; font-weight: 700; font-size: 13px; color: #1a1200; }
.askbar { position: absolute; left: 0; bottom: -1px; height: 4px; width: 100%; background: var(--ask); transform-origin: left; z-index: 1; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* 背番号 */
.nos { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(44px, 9vmin, 64px), 1fr)); gap: 5px; padding: 6px; flex: none; min-width: 0; }
.no { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: clamp(42px, 7vmin, 60px); border: 2px solid var(--line2); border-radius: 10px; background: var(--panel2); padding: 0 2px; overflow: hidden; }
.no b { font-size: clamp(19px, 4vmin, 30px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.no small { font-size: 10.5px; color: var(--muted); line-height: 1.1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.no.add { border-style: dashed; color: var(--muted); font-size: 22px; font-weight: 700; }
.no:active { transform: scale(0.95); }
.no.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.no.sel small { color: rgba(255, 255, 255, 0.85); }
.no.sel::after { content: ''; position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: rgba(255, 255, 255, 0.75); transform-origin: left; animation: shrink 12s linear forwards; }
.team.asking .no:not(.add) { animation: askpulse 0.9s ease-in-out infinite; border-color: var(--ask); }
@keyframes askpulse { 50% { box-shadow: 0 0 0 3px var(--ask); } }

/* プレー */
.acts { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); grid-auto-rows: minmax(var(--acth, 48px), 1fr); gap: 6px; padding: 0 6px 6px; }

/* 背番号の並べ方（layoutLive が、画面の大きさで選ぶ） */
/* strip：番号を横1列に（入りきらない分は横にすべらせる） */
.lay-strip .nos { display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-padding: 0 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.lay-strip .nos::-webkit-scrollbar, .lay-strip2 .nos::-webkit-scrollbar { display: none; }
.lay-strip .no { flex: 0 0 auto; width: clamp(44px, 12.5vmin, 58px); scroll-snap-align: start; }
/* strip2：番号を2段で横に（左から順に並べ、入りきらない分は横にすべらせる） */
.lay-strip2 .nos { grid-template-columns: repeat(var(--nocols, 8), var(--now, 50px)); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-padding: 0 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.lay-strip2 .no { scroll-snap-align: start; }
.lay-strip .nos.more, .lay-strip2 .nos.more { -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
/* 高さの低い画面（横向きのスマホ）：上と下の帯を薄く */
.short .lbar { padding: 4px 8px; }
.short .clock, .short .startbtn, .short .period, .short .sc, .short .menubtn { height: 44px; }
.short .tval { font-size: 30px; }
.short .sc { font-size: 28px; }
.short .menubtn small { display: none; }
.short .thead { min-height: 30px; }
.short .lastbar { min-height: 44px; padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
.short .lastev, .short .btn.undo { min-height: 38px; padding-top: 3px; padding-bottom: 3px; }
.lay-col .act b { white-space: normal; word-break: break-all; }
.lay-col .act.long b { font-size: 13px; line-height: 1.15; }
/* col：番号をプレーのボタンの左に（横長の画面で、高さが足りないとき） */
.lay-col .team { display: grid; grid-template-columns: minmax(0, calc(var(--nocols, 3) * 48px + 10px)) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.lay-col .thead { grid-column: 1 / -1; }
.lay-col .nos { grid-template-columns: repeat(var(--nocols, 3), minmax(0, 1fr)); grid-auto-rows: 44px; align-content: start; overflow-y: auto; padding-right: 0; min-height: 0; }
.lay-col .no { min-height: 0; }
.lay-col .acts { padding-top: 6px; }
.act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 12px; border: 0; color: #fff; padding: 2px 4px; min-width: 0; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); transition: transform 0.06s, filter 0.06s; }
.act.rs { grid-column-start: 1; }
.act b { font-size: clamp(17px, 3.6vmin, 30px); font-weight: 900; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.act.long b { font-size: clamp(14px, 2.9vmin, 26px); letter-spacing: -0.02em; }
.act small { font-size: clamp(11px, 2vmin, 15px); font-weight: 700; opacity: 0.95; line-height: 1.1; white-space: nowrap; }
.act:active { transform: scale(0.96); filter: brightness(1.15); box-shadow: none; }
.k-made { background: var(--k-made); }
.k-reb { background: var(--k-reb); }
.k-good { background: var(--k-good); }
.k-bad { background: var(--k-bad); }
.k-foul { background: var(--k-foul); }
.k-mark { background: var(--k-mark); color: var(--k-mark-ink); }
.act.k-miss { background: var(--k-miss-bg); color: var(--k-miss-ink); border: 2px solid var(--k-miss-line); box-shadow: none; }
.act.k-miss small { color: var(--k-miss-x); }
/* 押せたしるし（光る輪） */
.hit { animation: hit 0.32s ease-out; }

<body>
<div id="view"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* js/core.js */
/* バスケ タップ記録 — 画面を持たない部分（データの形・時刻・集計・CSV・読み込み）
   DOM に依存しないので、node のテストからも、バスケ得点クリップの確かめからも読み込める。

   ■ 記録のデータ（1試合＝1つ。書き出す JSON もこの形。バスケ得点クリップが読み込む）
   {
     format: 'basket-tap', version: 1,
     id, title（なくてよい）, date: 'YYYY-MM-DD',
     startedAt: スタートを押した時刻（エポックミリ秒。押す前は null）, endedAt: 終えた時刻 | null,
     tz: 記録した端末の時差（分。日本は 540）,
     teams: [ 自分, 相手 ]  … { name, color, colorName, players: [{ no: '7', name: '' }] }
     events: [ { id, t, type, team, no } ]  … 追加した順
       t   : スタートからの秒（0.1 秒まで）。ストップウォッチと同じで、止まらずに進む
       type: 下の TYPES の id。'period' はピリオドの始まり（period: 番号。team・no はなし）
       team: 0 = 自分・1 = 相手 / no: 背番号（文字列。'0' と '00' は別）| null（だれか分からない）
   }
   ピリオドは、イベントには持たせず「その時刻より前の、いちばん新しい 'period'」で決める（periodAt）。
   ピリオドを進め忘れても、あとで 'period' の時刻を直すだけで、全部の記録のピリオドが正しくなる。 */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};
  BT.APP = 'バスケ タップ記録';
  BT.FORMAT = 'basket-tap';
  BT.VERSION = 1;

  BT.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。tenths で 0.1 秒まで */
  BT.fmtTime = function (sec, tenths) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    if (tenths) sec = Math.round(sec * 10) / 10;
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (tenths) out += '.' + Math.round((sec * 10) % 10) % 10;
    return out;
  };

  /* ---------- プレーの種類 ----------
     key：ボタンの大きな文字 / sub：小さな文字 / label：記録の一覧・書き出しでの呼び名
     kind：ボタンの色分け（made 成功・miss 失敗・reb リバウンド・good よいプレー・bad ミス・foul・mark） */
  BT.TYPES = [
    { id: 'fg2', key: '2P', sub: '○ 成功', label: '2P成功', pts: 2, made: true, shot: 'fg2', kind: 'made', row: 'made' },
    { id: 'fg3', key: '3P', sub: '○ 成功', label: '3P成功', pts: 3, made: true, shot: 'fg3', kind: 'made', row: 'made' },
    { id: 'ft', key: 'FT', sub: '○ 成功', label: 'フリースロー成功', pts: 1, made: true, shot: 'ft', kind: 'made', row: 'made' },
    { id: 'fg2x', key: '2P', sub: '× 失敗', label: '2P失敗', pts: 0, made: false, shot: 'fg2', kind: 'miss', row: 'miss' },
    { id: 'fg3x', key: '3P', sub: '× 失敗', label: '3P失敗', pts: 0, made: false, shot: 'fg3', kind: 'miss', row: 'miss' },
    { id: 'ftx', key: 'FT', sub: '× 失敗', label: 'フリースロー失敗', pts: 0, made: false, shot: 'ft', kind: 'miss', row: 'miss' },
    { id: 'reb', key: 'リバウンド', sub: '', label: 'リバウンド', pts: 0, kind: 'reb', row: 'other' },
    { id: 'ast', key: 'アシスト', sub: '', label: 'アシスト', pts: 0, kind: 'good', row: 'other' },
    { id: 'stl', key: 'スティール', sub: '', label: 'スティール', pts: 0, kind: 'good', row: 'other' },
    { id: 'blk', key: 'ブロック', sub: '', label: 'ブロック', pts: 0, kind: 'good', row: 'other' },
    { id: 'pass', key: 'パスミス', sub: '', label: 'パスミス', pts: 0, kind: 'bad', row: 'other' },
    { id: 'tov', key: 'ミス', sub: 'その他', label: 'ミス（その他）', pts: 0, kind: 'bad', row: 'other' },
    { id: 'foul', key: 'ファウル', sub: '', label: 'ファウル', pts: 0, kind: 'foul', row: 'other' },
    { id: 'mark', key: '★', sub: 'あとで見る', label: '★ あとで見る', pts: 0, kind: 'mark', row: 'other' }
  ];
  BT.TYPE = {};
  BT.TYPES.forEach((d) => { BT.TYPE[d.id] = d; });
  BT.TYPE.period = { id: 'period', key: '', sub: '', label: 'ピリオド開始', pts: 0, kind: 'period', row: null };

  /* ボタンの組み合わせ（設定で、チームごとに選べる。自由に選ぶこともできる） */
  BT.PRESETS = {
    std: { name: 'ふつう', ids: ['fg2', 'fg3', 'ft', 'fg2x', 'fg3x', 'ftx', 'reb', 'pass', 'mark'] },
    full: { name: 'くわしく', ids: ['fg2', 'fg3', 'ft', 'fg2x', 'fg3x', 'ftx', 'reb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'] },
    score: { name: '得点だけ', ids: ['fg2', 'fg3', 'ft', 'mark'] }
  };
  /* ids をボタンの並び（成功の段・失敗の段・そのほか）に分ける。並びは TYPES の順 */
  BT.actionRows = function (ids) {
    const on = new Set(ids || []);
    const rows = { made: [], miss: [], other: [] };
    BT.TYPES.forEach((d) => { if (on.has(d.id)) rows[d.row].push(d.id); });
    return [rows.made, rows.miss, rows.other].filter((r) => r.length);
  };
  BT.presetOf = function (ids) {
    const key = (ids || []).slice().sort().join(',');
    return Object.keys(BT.PRESETS).find((k) => BT.PRESETS[k].ids.slice().sort().join(',') === key) || null;
  };

  /* ユニフォームの色（よくある色） */
  BT.COLORS = [
    { name: '白', hex: '#f4f4f4' }, { name: '黒', hex: '#222222' }, { name: '赤', hex: '#d93636' }, { name: '青', hex: '#2f6fed' },
    { name: '紺', hex: '#1f2f6e' }, { name: '水色', hex: '#45b0e6' }, { name: '緑', hex: '#2e9e5b' }, { name: '黄', hex: '#f2c230' },
    { name: 'オレンジ', hex: '#f08a24' }, { name: '紫', hex: '#7d4cc9' }, { name: 'ピンク', hex: '#e86aa6' }, { name: 'グレー', hex: '#8a8f98' }
  ];
  function hexRGB(hex) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128]; }
  BT.hexRGB = hexRGB;
  /* その色の上に載せる文字の色（黒か白の、読みやすいほう） */
  BT.inkOn = function (hex) {
    const [r, g, b] = hexRGB(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return L > 0.36 ? '#111111' : '#ffffff';
  };
  /* 自由に選んだ色の呼び名：いちばん近い見本の色の名前 */
  BT.nearestColorName = function (hex) {
    const [r, g, b] = hexRGB(hex);
    let best = null;
    BT.COLORS.forEach((c) => { const [r2, g2, b2] = hexRGB(c.hex); const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2; if (!best || d < best.d) best = { d, name: c.name }; });
    return best.name;
  };

  /* ---------- 背番号 ---------- */
  /* 全角の数字・記号を半角に */
  function toHalf(s) {
    return String(s || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[〜～~－ー−‐―]/g, '-').replace(/[、，,・／/\s]+/g, ' ');
  }
  /* 背番号として使えるか（0〜99 と 00。前に 0 が付いたもの '07' は 7 にそろえる） */
  BT.normNo = function (v) {
    const s = toHalf(v).trim();
    if (s === '00') return '00';
    if (!/^\d{1,2}$/.test(s)) return null;
    return String(Number(s));
  };
  /* 並べる順：数の小さい順（'0' の次に '00'） */
  BT.cmpNo = (a, b) => (Number(a) - Number(b)) || (String(a).length - String(b).length);
  BT.sortNos = (list) => list.slice().sort(BT.cmpNo);
  /* 「4-15, 23 33」「４〜１５」などを、背番号の並びにする（重なりは1つに。範囲は 0〜99） */
  BT.parseNumbers = function (text) {
    const out = new Set();
    toHalf(text).split(' ').forEach((tok) => {
      if (!tok) return;
      const m = /^(\d{1,2})-(\d{1,2})$/.exec(tok);
      if (m) {
        let a = Number(m[1]), b = Number(m[2]);
        if (a > b) [a, b] = [b, a];
        for (let i = a; i <= b && i <= 99; i++) out.add(String(i));
        return;
      }
      const n = BT.normNo(tok);
      if (n != null) out.add(n);
    });
    return BT.sortNos(Array.from(out));
  };
  /* 背番号の並びを、短い文字にする（4,5,6,7,9 → 「4-7, 9」） */
  BT.formatNumbers = function (nos) {
    const list = BT.sortNos(nos || []);
    const out = [];
    let i = 0;
    while (i < list.length) {
      if (list[i] === '00') { out.push('00'); i++; continue; }
      let j = i;
      while (j + 1 < list.length && list[j + 1] !== '00' && Number(list[j + 1]) === Number(list[j]) + 1) j++;
      out.push(j - i >= 2 ? `${list[i]}-${list[j]}` : list.slice(i, j + 1).join(', '));
      i = j + 1;
    }
    return out.join(', ');
  };

  /* ---------- 試合 ---------- */
  BT.uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function pad2(n) { return String(n).padStart(2, '0'); }
  /* エポックミリ秒 → その時差での「YYYY-MM-DD」「HH:MM:SS」（端末の時差に頼らない） */
  BT.ymdAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
  BT.hmsAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`; };
  BT.tzText = function (tz) { const s = tz < 0 ? '-' : '+', a = Math.abs(tz || 0); return s + pad2(Math.floor(a / 60)) + ':' + pad2(a % 60); };
  BT.localTz = () => -new Date().getTimezoneOffset();

  function blankTeam(i) { return { name: '', color: i ? '#2f6fed' : '#f4f4f4', colorName: i ? '青' : '白', players: [] }; }
  BT.blankTeam = blankTeam;

  BT.newGame = function (opts) {
    opts = opts || {};
    const now = opts.now || Date.now();
    const tz = opts.tz != null ? opts.tz : BT.localTz();
    const teams = [0, 1].map((i) => Object.assign(blankTeam(i), clone((opts.teams || [])[i] || {})));
    teams.forEach((t) => { t.players = cleanPlayers(t.players); });
    return { format: BT.FORMAT, version: BT.VERSION, id: opts.id || BT.uid('g'), title: opts.title || '', date: BT.ymdAt(now, tz), createdAt: now, startedAt: null, endedAt: null, tz, teams, events: [], seq: 0 };
  };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function cleanPlayers(list) {
    const seen = new Set(), out = [];
    (list || []).forEach((p) => {
      const no = BT.normNo(p && p.no != null ? p.no : p);
      if (no == null || seen.has(no)) return;
      seen.add(no);
      out.push({ no, name: String((p && p.name) || '').trim().slice(0, 12) });
    });
    return out.sort((a, b) => BT.cmpNo(a.no, b.no));
  }
  BT.cleanPlayers = cleanPlayers;
  /* 背番号の並びを、名簿にする（名前は、前の名簿に同じ番号があれば引き継ぐ） */
  BT.playersFromNos = function (nos, old) {
    const names = {};
    (old || []).forEach((p) => { names[p.no] = p.name; });
    return cleanPlayers(nos.map((no) => ({ no, name: names[no] || '' })));
  };

  /* スタートからの秒（0.1 秒まで） */
  BT.elapsed = function (game, now) {
    if (!game || !game.startedAt) return 0;
    const end = game.endedAt || now || Date.now();
    return Math.max(0, Math.round((end - game.startedAt) / 100) / 10);
  };

  /* 時刻の順（同じ時刻なら追加した順） */
  BT.sorted = function (game) {
    return (game.events || []).map((e, i) => ({ e, i })).sort((a, b) => (a.e.t - b.e.t) || (a.i - b.i)).map((x) => x.e);
  };
  /* その時刻のピリオド（1〜）。'period' が無ければ 1 */
  BT.periodAt = function (game, t) {
    let p = 1, best = -Infinity;
    (game.events || []).forEach((e) => { if (e.type === 'period' && e.t <= t + 1e-9 && e.t >= best) { best = e.t; p = e.period; } });
    return p;
  };
  BT.currentPeriod = (game, now) => BT.periodAt(game, BT.elapsed(game, now));
  BT.periodLabel = (p) => (p <= 4 ? p + 'Q' : 'OT' + (p - 4));

  /* イベントを足す（時刻 t は呼び出し側が決める）。戻り値：足したイベント */
  BT.addEvent = function (game, ev) {
    game.seq = (game.seq || 0) + 1;
    const e = { id: 'e' + game.seq, t: Math.round((ev.t || 0) * 10) / 10, type: ev.type };
    if (ev.type === 'period') e.period = ev.period;
    else { e.team = ev.team === 1 ? 1 : 0; e.no = ev.no != null ? String(ev.no) : null; }
    game.events.push(e);
    return e;
  };
  BT.findEvent = (game, id) => (game.events || []).find((e) => e.id === id) || null;
  BT.removeEvent = function (game, id) {
    const i = (game.events || []).findIndex((e) => e.id === id);
    if (i < 0) return null;
    return game.events.splice(i, 1)[0];
  };

  /* ---------- 「だれが」と「何を」のタップ ----------
     どちらの順でも記録できる：
       ・番号 → プレー：番号を選んでおいて、プレーを押した瞬間に記録（選んだ番号はそこで外れる）
       ・プレー → 番号：プレーを押した瞬間に記録（番号なし）。そのあと WAIT 秒以内に番号を押すと、その記録の番号になる
       ・プレーだけ  ：番号なしで記録（チームの記録になる。あとで一覧から番号を付けられる）
     記録の時刻は、いつも「プレーを押した瞬間」。選んだ番号は SEL 秒たつと外れる（選んだまま忘れて、別の人の記録に付かないように） */
  BT.WAIT = 7;
  BT.SEL = 12;
  BT.tapper = function (game) {
    const T = {
      sel: [null, null], selAt: [0, 0],          // 選んでいる番号（チームごと）と、選んだ時刻（ミリ秒）
      wait: [null, null], waitAt: [0, 0],        // 番号を待っている記録の id と、その記録の時刻（ミリ秒）
      game,
      expire(now) {
        let changed = false;
        [0, 1].forEach((tm) => {
          if (T.sel[tm] != null && now - T.selAt[tm] > BT.SEL * 1000) { T.sel[tm] = null; changed = true; }
          if (T.wait[tm] != null && (now - T.waitAt[tm] > BT.WAIT * 1000 || !BT.findEvent(T.game, T.wait[tm]))) { T.wait[tm] = null; changed = true; }
        });
        return changed;
      },
      /* 番号を押した。戻り値 { kind: 'assign'（待っていた記録に付けた）| 'select' | 'deselect', ev } */
      number(team, no, now) {
        T.expire(now);
        const wid = T.wait[team];
        if (wid != null) {
          const ev = BT.findEvent(T.game, wid);
          T.wait[team] = null;
          if (ev) { ev.no = String(no); T.sel[team] = null; return { kind: 'assign', ev }; }
        }
        if (T.sel[team] === String(no)) { T.sel[team] = null; return { kind: 'deselect' }; }
        T.sel[team] = String(no); T.selAt[team] = now;
        return { kind: 'select' };
      },
      /* プレーを押した。t：スタートからの秒。戻り値 { kind: 'record', ev, waiting（番号を待つか） } */
      action(team, type, t, now) {
        T.expire(now);
        const no = T.sel[team];
        const ev = BT.addEvent(T.game, { t, type, team, no });
        T.sel[team] = null;
        if (no == null) { T.wait[team] = ev.id; T.waitAt[team] = now; } else T.wait[team] = null;
        return { kind: 'record', ev, waiting: no == null };
      },
      clearWait(team) { T.wait[team] = null; },
      clearSel(team) { T.sel[team] = null; },
      reset() { T.sel = [null, null]; T.wait = [null, null]; }
    };
    return T;
  };

  /* ---------- 集計 ---------- */
  BT.score = function (game, until) {
    const s = [0, 0];
    (game.events || []).forEach((e) => {
      const d = BT.TYPE[e.type];
      if (d && d.pts && (until == null || e.t <= until)) s[e.team] += d.pts;
    });
    return s;
  };
  /* ピリオドごとの得点 [{ period, label, pts: [自分, 相手] }]（記録のあるピリオドと、始めたピリオド） */
  BT.periodScores = function (game) {
    const map = new Map();
    const get = (p) => { if (!map.has(p)) map.set(p, { period: p, label: BT.periodLabel(p), pts: [0, 0] }); return map.get(p); };
    (game.events || []).forEach((e) => {
      if (e.type === 'period') { get(e.period); return; }
      const d = BT.TYPE[e.type];
      const row = get(BT.periodAt(game, e.t));
      if (d && d.pts) row.pts[e.team] += d.pts;
    });
    if (!map.size) get(1);
    return Array.from(map.values()).sort((a, b) => a.period - b.period);
  };
  /* オフェンスリバウンドか：その少し前（10 秒以内・間にリバウンドがない）の外れたシュートが、同じチームのもの */
  BT.offensiveRebounds = function (game) {
    const set = new Set();
    let lastMiss = null;
    BT.sorted(game).forEach((e) => {
      const d = BT.TYPE[e.type];
      if (!d || e.type === 'period') return;
      if (d.shot && !d.made) { lastMiss = e; return; }
      if (e.type === 'reb') {
        if (lastMiss && e.t - lastMiss.t <= 10 && lastMiss.team === e.team) set.add(e.id);
        lastMiss = null;
        return;
      }
      if (d.shot && d.made) lastMiss = null;
    });
    return set;
  };
  const STAT_KEYS = ['pts', 'fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta', 'reb', 'oreb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'];
  BT.STAT_KEYS = STAT_KEYS;
  function zero() { const o = {}; STAT_KEYS.forEach((k) => { o[k] = 0; }); return o; }
  /* 選手ごとの集計：[{ team, rows: [{ no, name, s }], unknown: s（番号なし）, total: s }]（rows は名簿の番号＋記録にある番号） */
  BT.stats = function (game) {
    const oreb = BT.offensiveRebounds(game);
    return [0, 1].map((tm) => {
      const team = game.teams[tm] || blankTeam(tm);
      const byNo = new Map();
      team.players.forEach((p) => byNo.set(p.no, { no: p.no, name: p.name, s: zero() }));
      const unknown = zero(), total = zero();
      (game.events || []).forEach((e) => {
        if (e.type === 'period' || e.team !== tm) return;
        let s = unknown;
        if (e.no != null) {
          if (!byNo.has(e.no)) byNo.set(e.no, { no: e.no, name: '', s: zero(), extra: true });
          s = byNo.get(e.no).s;
        }
        [s, total].forEach((x) => add(x, e, oreb));
      });
      const rows = Array.from(byNo.values()).sort((a, b) => BT.cmpNo(a.no, b.no));
      return { team: tm, rows, unknown, total };
    });
  };
  function add(s, e, oreb) {
    const d = BT.TYPE[e.type];
    if (!d) return;
    s.pts += d.pts || 0;
    if (d.shot === 'fg2') { s.fg2a++; if (d.made) s.fg2m++; }
    else if (d.shot === 'fg3') { s.fg3a++; if (d.made) s.fg3m++; }
    else if (d.shot === 'ft') { s.fta++; if (d.made) s.ftm++; }
    else if (e.type === 'reb') { s.reb++; if (oreb.has(e.id)) s.oreb++; }
    else if (s[e.type] != null) s[e.type]++;
  }
  BT.pct = (m, a) => (a ? Math.round(100 * m / a) + '%' : '—');
  BT.isEmpty = (s) => STAT_KEYS.every((k) => !s[k]);

  /* ---------- 名前 ---------- */
  BT.teamName = (game, tm) => { const t = game.teams[tm] || {}; return (t.name || '').trim() || (tm ? '相手' : '自分'); };
  BT.playerName = function (game, tm, no) {
    const p = ((game.teams[tm] || {}).players || []).find((x) => x.no === no);
    return p ? p.name : '';
  };
  /* 一覧・書き出しの呼び名：「#7 たけし 2P成功」「1Q 開始」 */
  BT.eventText = function (game, e, withTeam) {
    if (e.type === 'period') return `${BT.periodLabel(e.period)} 開始`;
    const d = BT.TYPE[e.type] || { label: e.type };
    const who = e.no != null ? `#${e.no}${BT.playerName(game, e.team, e.no) ? ' ' + BT.playerName(game, e.team, e.no) : ''}` : '';
    return [withTeam ? BT.teamName(game, e.team) : '', who, d.label].filter(Boolean).join(' ');
  };

  /* ---------- 書き出し ---------- */
  /* JSON（ほかのアプリが読めるよう、ピリオドと種類の呼び名も付ける） */
  BT.exportData = function (game) {
    const g = clone(game);
    g.format = BT.FORMAT; g.version = BT.VERSION;
    g.events = BT.sorted(game).map((e) => {
      const o = Object.assign({}, e);
      if (e.type !== 'period') o.period = BT.periodAt(game, e.t);
      return o;
    });
    g.startedAtText = game.startedAt ? `${BT.ymdAt(game.startedAt, game.tz)} ${BT.hmsAt(game.startedAt, game.tz)} (UTC${BT.tzText(game.tz)})` : null;
    g.score = BT.score(game);
    g.types = {};
    BT.TYPES.forEach((d) => { g.types[d.id] = { label: d.label, pts: d.pts }; });
    g.app = BT.APP;
    delete g.seq;
    return g;
  };
  /* ファイル名に使える文字だけに */
  BT.safeName = (s) => String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
  BT.fileBase = function (game) {
    const hm = game.startedAt ? BT.hmsAt(game.startedAt, game.tz).slice(0, 5).replace(':', '') : '';
    return ['バスケ記録', game.date, hm, BT.safeName(BT.teamName(game, 0)) + 'vs' + BT.safeName(BT.teamName(game, 1))].filter(Boolean).join('_');
  };
  function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function csv(rows) { return rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
  /* 記録の一覧（CSV）。Excel で文字化けしないよう、先頭の BOM は呼び出し側で付ける */
  BT.eventsCSV = function (game) {
    const rows = [['No', '時刻', 'スタートからの秒', 'ピリオド', 'チーム', '背番号', '名前', 'プレー', '得点', `${BT.teamName(game, 0)}の得点`, `${BT.teamName(game, 1)}の得点`]];
    const s = [0, 0];
    let n = 0;
    BT.sorted(game).forEach((e) => {
      if (e.type === 'period') { rows.push(['', BT.fmtTime(e.t), e.t, BT.periodLabel(e.period), '', '', '', `${BT.periodLabel(e.period)} 開始`, '', s[0], s[1]]); return; }
      const d = BT.TYPE[e.type] || { label: e.type, pts: 0 };
      s[e.team] += d.pts || 0;
      rows.push([++n, BT.fmtTime(e.t), e.t, BT.periodLabel(BT.periodAt(game, e.t)), BT.teamName(game, e.team), e.no != null ? e.no : '', e.no != null ? BT.playerName(game, e.team, e.no) : '', d.label, d.pts || '', s[0], s[1]]);
    });
    return csv(rows);
  };
  /* 選手ごとの集計（CSV） */
  BT.boxCSV = function (game) {
    const head = ['チーム', '背番号', '名前', '得点', '2P成功', '2P試投', '3P成功', '3P試投', 'FT成功', 'FT試投', 'リバウンド', 'うちオフェンス', 'アシスト', 'スティール', 'ブロック', 'パスミス', 'ミス（その他）', 'ファウル', '★'];
    const keys = ['pts', 'fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta', 'reb', 'oreb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'];
    const rows = [head];
    BT.stats(game).forEach((st) => {
      const name = BT.teamName(game, st.team);
      st.rows.forEach((r) => rows.push([name, r.no, r.name, ...keys.map((k) => r.s[k])]));
      if (!BT.isEmpty(st.unknown)) rows.push([name, '番号なし', '', ...keys.map((k) => st.unknown[k])]);
      rows.push([name, '合計', '', ...keys.map((k) => st.total[k])]);
    });
    return csv(rows);
  };

  /* ---------- 読み込み（書き出した JSON を開き直す） ----------
     形が合わないものは、分かる言葉の Error にする */
  BT.importData = function (obj) {
    if (typeof obj === 'string') { try { obj = JSON.parse(obj); } catch (e) { throw new Error('JSON として読めませんでした'); } }
    if (!obj || typeof obj !== 'object') throw new Error('記録のファイルではないようです');
    if (obj.format !== BT.FORMAT) throw new Error('「バスケ タップ記録」で書き出したファイルではないようです');
    if (!Array.isArray(obj.events) || !Array.isArray(obj.teams)) throw new Error('記録の中身（events・teams）がありません');
    const g = BT.newGame({ id: typeof obj.id === 'string' ? obj.id.slice(0, 40) : undefined, title: String(obj.title || '').slice(0, 40), now: obj.createdAt || obj.startedAt || Date.now(), tz: isFinite(obj.tz) ? obj.tz : 540, teams: obj.teams.slice(0, 2).map(cleanTeam) });
    g.date = /^\d{4}-\d{2}-\d{2}$/.test(obj.date || '') ? obj.date : g.date;
    g.startedAt = isFinite(obj.startedAt) && obj.startedAt > 0 ? obj.startedAt : null;
    g.endedAt = isFinite(obj.endedAt) && obj.endedAt > 0 ? obj.endedAt : null;
    // 記録の id は、そのまま使えるもの（e＋数・重ならない）は残し、そうでないものに新しい番号を付ける
    const okId = (id) => typeof id === 'string' && /^e\d{1,7}$/.test(id);
    g.seq = obj.events.reduce((m, e) => Math.max(m, e && okId(e.id) ? Number(e.id.slice(1)) : 0), 0);
    const used = new Set();
    obj.events.forEach((e) => {
      if (!e || !isFinite(e.t) || e.t < 0) return;
      let ev = null;
      if (e.type === 'period') { if (isFinite(e.period) && e.period >= 1) ev = BT.addEvent(g, { t: e.t, type: 'period', period: Math.min(20, Math.round(e.period)) }); }
      else if (BT.TYPE[e.type]) ev = BT.addEvent(g, { t: e.t, type: e.type, team: e.team, no: e.no != null ? BT.normNo(e.no) : null });
      if (!ev) return;
      if (okId(e.id) && !used.has(e.id)) { g.seq--; ev.id = e.id; }      // addEvent が進めた番号を戻す
      while (used.has(ev.id)) ev.id = 'e' + (++g.seq);
      used.add(ev.id);
    });
    g.seq = g.events.reduce((m, e) => Math.max(m, Number(e.id.slice(1)) || 0), g.seq);
    return g;
  };
  /* 読み込んだチームの形をそろえる（名前・色・名簿） */
  function cleanTeam(t, i) {
    const b = blankTeam(i);
    if (!t || typeof t !== 'object') return b;
    const color = /^#[0-9a-f]{6}$/i.test(t.color || '') ? t.color : b.color;
    return { name: String(t.name || '').trim().slice(0, 20), color, colorName: String(t.colorName || BT.nearestColorName(color)).slice(0, 8), players: cleanPlayers(t.players) };
  }
  BT.cleanTeam = cleanTeam;

  /* 試合の一覧に出す短い情報 */
  BT.summary = function (game) {
    return { id: game.id, title: game.title || '', date: game.date, startedAt: game.startedAt, endedAt: game.endedAt, names: [BT.teamName(game, 0), BT.teamName(game, 1)], colors: [game.teams[0].color, game.teams[1].color], score: BT.score(game), n: (game.events || []).filter((e) => e.type !== 'period').length, at: Date.now() };
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/store.js */
/* バスケ タップ記録 — 保存（このブラウザの中だけ。どこにも送らない）
   ・試合：1つ記録するたびに、すぐ保存する（途中で画面を閉じても、開き直せば続きから）
   ・チーム：名前・色・名簿を覚えておき、次の試合で選べる（自分のチームは毎回同じことが多いので）
   ・設定：ボタンの組み合わせ・音・画面の明るさ
   キーは「btap:」で始まる。バスケ得点クリップ（同じサイトの別のページ）からも、この試合を読み込める。 */
(function (root) {
  'use strict';
  const BT = root.BT;
  const K = { games: 'btap:games', game: 'btap:game:', current: 'btap:current', teams: 'btap:teams', prefs: 'btap:prefs' };
  const KEEP = 60;          // 覚えておく試合の数（古いものから消す。書き出したファイルは残る）

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return false; try { s.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function remove(k) { const s = ls(); if (s) { try { s.removeItem(k); } catch (e) { /* 無視 */ } } }

  /* ---------- 試合 ---------- */
  function games() { return (readJSON(K.games) || []).filter((g) => g && g.id).sort((a, b) => (b.startedAt || b.at || 0) - (a.startedAt || a.at || 0)); }
  function loadGame(id) {
    const g = readJSON(K.game + id);
    if (!g || g.format !== BT.FORMAT || !Array.isArray(g.events)) return null;
    if (!g.seq) g.seq = g.events.reduce((m, e) => Math.max(m, Number(String(e.id).slice(1)) || 0), 0);
    return g;
  }
  /* 保存できたら true（入りきらないときは、古い試合を消してもう一度） */
  function saveGame(game) {
    if (!game || !game.id) return false;
    const list = games().filter((x) => x.id !== game.id);
    list.unshift(BT.summary(game));
    let ok = writeJSON(K.game + game.id, game);
    if (!ok || list.length > KEEP) {
      const old = list.slice().sort((a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0)).filter((x) => x.id !== game.id);
      const n = ok ? list.length - KEEP : Math.max(5, list.length - KEEP);
      old.slice(0, n).forEach((x) => { remove(K.game + x.id); const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list.splice(i, 1); });
      if (!ok) ok = writeJSON(K.game + game.id, game);
    }
    writeJSON(K.games, list);
    return ok;
  }
  function deleteGame(id) {
    remove(K.game + id);
    writeJSON(K.games, games().filter((x) => x.id !== id));
    if (current() === id) setCurrent(null);
  }
  function current() { const s = ls(); try { return s ? s.getItem(K.current) : null; } catch (e) { return null; } }
  function setCurrent(id) { const s = ls(); if (!s) return; try { if (id) s.setItem(K.current, id); else s.removeItem(K.current); } catch (e) { /* 無視 */ } }

  /* ---------- チーム（名簿） ---------- */
  function teams() { return (readJSON(K.teams) || []).filter((t) => t && t.id).sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)); }
  /* 同じ名前のチームは上書き。名前のないチームは保存しない */
  function saveTeam(team, mine) {
    const name = (team.name || '').trim();
    if (!name) return null;
    const list = teams();
    let t = list.find((x) => x.name === name);
    if (!t) { t = { id: BT.uid('t') }; list.push(t); }
    Object.assign(t, { name, color: team.color, colorName: team.colorName, players: BT.cleanPlayers(team.players), usedAt: Date.now() });
    if (mine) { list.forEach((x) => { delete x.mine; }); t.mine = true; }
    writeJSON(K.teams, list.slice(0, 40));
    return t;
  }

<script>
/* js/ui.js */
/* バスケ タップ記録 — 画面の部品（要素づくり・お知らせ・下から出る小窓・振動と音・保存と共有） */
(function (root) {
  'use strict';
  const BT = root.BT;

  /* h('div', { class: 'x', onclick: fn }, 子要素…) */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) el.style.setProperty(p, v[p]); else el.style[p] = v[p]; } }
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (sel, rootEl) => (rootEl || document).querySelector(sel);
  const $$ = (sel, rootEl) => Array.from((rootEl || document).querySelectorAll(sel));

  /* お知らせ（画面の下に数秒）。action：{ label, onClick } でボタンを1つ付けられる */
  function toast(text, kind, ms, action) {
    const box = $('#toasts');
    if (!box) return null;
    const el = h('div', { class: 'toast ' + (kind || ''), role: 'status' }, h('span', null, text));
    if (action) el.appendChild(h('button', { class: 'tbtn', onclick: () => { el.remove(); action.onClick(); } }, action.label));
    box.appendChild(el);
    while (box.children.length > 2) box.firstChild.remove();
    setTimeout(() => el.remove(), ms || 2600);
    return el;
  }

  /* 下から出る小窓（タブレットでは真ん中）。同時に1つだけ。
     opts: { title, body（要素）, foot（要素の配列）, onClose, wide, cls } → { close, body, el } */
  let current = null;
  function sheet(opts) {
    closeSheet(true);
    const wrap = $('#sheet');
    const card = h('div', { class: 'sheet-card' + (opts.wide ? ' wide' : '') + (opts.cls ? ' ' + opts.cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '' });
    const close = () => { if (current && current.card === card) closeSheet(); };
    card.appendChild(h('header', null, h('b', null, opts.title || ''), h('button', { class: 'x', 'aria-label': '閉じる', onclick: close }, '×')));
    const body = h('div', { class: 'sheet-body' });
    if (opts.body) body.appendChild(opts.body);
    card.appendChild(body);
    if (opts.foot && opts.foot.length) card.appendChild(h('div', { class: 'sheet-foot' }, opts.foot));
    wrap.innerHTML = '';
    wrap.appendChild(card);
    wrap.hidden = false;
    wrap.onclick = (e) => { if (e.target === wrap) close(); };
    current = { card, onClose: opts.onClose };
    return { close, body, el: card };
  }
  function closeSheet(silent) {
    const wrap = $('#sheet');
    if (!current || !wrap) return;
    const c = current;
    current = null;
    wrap.hidden = true; wrap.innerHTML = '';
    if (!silent && c.onClose) c.onClose();
    else if (silent && c.onClose) c.onClose(true);
  }
  const sheetOpen = () => !!current;

  /* 確かめる小窓：ok を押したら onOk */
  function confirm(title, text, okLabel, onOk, danger) {
    const s = sheet({
      title, body: h('p', { class: 'confirm-text' }, text),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn ' + (danger ? 'danger-fill' : 'primary'), onclick: () => { s.close(); onOk(); } }, okLabel)]
    });
    return s;
  }

  /* ---------- 手ごたえ（振動・音） ---------- */
  /* 振動：Android は vibrate。iPhone（iOS 18 から）は、スイッチ（<input type="checkbox" switch>）を押したときの軽い振動を使う */
  let coarse = null;
  function haptic() {
    try { if (root.navigator && typeof navigator.vibrate === 'function') { navigator.vibrate(12); return; } } catch (e) { /* 次へ */ }
    try {
      if (coarse == null) coarse = !!(root.matchMedia && matchMedia('(pointer: coarse)').matches);
      if (!coarse) return;

      lab.setAttribute('aria-hidden', 'true');
      lab.style.display = 'none';
      const inp = document.createElement('input');

      lab.appendChild(inp);
      document.head.appendChild(lab);
      lab.click();
      lab.remove();
    } catch (e) { /* 振動がなくても使える */ }
  }
  let actx = null;
  function beep(freq, ms) {
    try {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq || 880;
      const t = actx.currentTime, d = (ms || 60) / 1000;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) { /* 音がなくても使える */ }
  }

  /* ---------- 画面を消さない（記録の途中で、自動ロックで画面が消えないように） ---------- */
  let lock = null, want = false;
  const wakeSupported = () => !!(root.navigator && navigator.wakeLock && navigator.wakeLock.request);
  async function keepAwake(on) {
    want = !!on;
    if (!wakeSupported()) return false;
    if (on && !lock && !document.hidden) {
      try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) { lock = null; }
    } else if (!on && lock) { try { await lock.release(); } catch (e) { /* 無視 */ } lock = null; }
    return !!lock;
  }
  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { if (!document.hidden && want && !lock) keepAwake(true); });
  const awake = () => !!lock;

  /* ---------- 保存（ダウンロード）・共有 ---------- */
  function download(name, blob) {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }
  /* スマホでは「共有」（AirDrop・ファイルに保存・LINE など）、できなければダウンロード。戻り値 'shared' | 'downloaded' | 'cancelled' */
  async function shareOrDownload(name, blob, preferShare) {
    try {
      if (preferShare && root.navigator && navigator.canShare && typeof File !== 'undefined') {
        const file = new File([blob], name, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          return 'shared';
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
      /* 共有できないときはダウンロードへ */
    }
    download(name, blob);
    return 'downloaded';
  }
  const canShareFiles = () => { try { return !!(root.navigator && navigator.canShare && typeof File !== 'undefined' && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } };
  /* ファイルを1つ選んでもらって、文字として読む */
  function pickText(accept) {
    return new Promise((resolve) => {
      const inp = h('input', { type: 'file', accept: accept || '.json,application/json', style: { display: 'none' } });
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        inp.remove();
        if (!f) { resolve(null); return; }
        const r = new FileReader();
        r.onload = () => resolve({ name: f.name, text: String(r.result || '') });
        r.onerror = () => resolve(null);
        r.readAsText(f);
      });
      document.body.appendChild(inp);
      inp.click();
    });
  }

  BT.ui = { h, $, $$, toast, sheet, closeSheet, sheetOpen, confirm, haptic, beep, keepAwake, awake, wakeSupported, download, shareOrDownload, canShareFiles, pickText };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/app.js */
/* バスケ タップ記録 — 画面
   試合の一覧（home）→ 試合の準備（setup：チーム名・色・背番号）→ 記録（live）。
   記録の画面は、いちど作ったら作り直さず、表示（数字・色・選んでいる番号）だけを書き換える
   （押している間にボタンが入れ替わると、Safari ではタップにならないため）。 */
(function (root) {
  'use strict';
  const BT = root.BT;
  const { h, $, $$ } = BT.ui;
  const CLIPS_URL = '../basket-clips/';

  const S = {
    view: 'home',

    prefs: BT.store.prefs(),

  function save() {
    if (!S.game) return;
    if (!BT.store.saveGame(S.game)) BT.ui.toast('保存できませんでした（このブラウザの保存の空きが足りません）。「書き出す」でファイルに残してください', 'err', 7000);
  }
  function applyTheme() {
    const t = S.prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#0b0f17');
  }
  function savePrefs() { BT.store.savePrefs(S.prefs); }

    BT.ui.haptic();
    if (S.prefs.sound) BT.ui.beep(kind === 'made' ? 1046 : kind === 'undo' ? 440 : 784, 55);
  }
  /* ボタンを光らせる（押せたことが目で分かるように） */
  function flash(el) {
    if (!el) return;
    el.classList.remove('hit');
    void el.offsetWidth;
    el.classList.add('hit');
  }

  /* ---------- 画面の切り替え ---------- */
  function go(view) {
    S.view = view;
    BT.ui.closeSheet(true);
    if (view === 'home') renderHome();
    else if (view === 'setup') renderSetup();
    else if (view === 'live') buildLive();
    root.scrollTo(0, 0);
  }
  function openGame(game) {
    S.game = game;
    S.tap = BT.tapper(game);
    S.redo = [];
    BT.store.setCurrent(game.id);
    go('live');
    if (game.startedAt && !game.endedAt) { BT.ui.keepAwake(true); guard(); }
  }

  /* ========== 試合の一覧 ========== */
  function renderHome() {
    S.L = null;
    document.body.dataset.view = 'home';
    BT.ui.keepAwake(false);
    const V = $('#view');
    V.innerHTML = '';
    const list = BT.store.games();
    const curId = BT.store.current();
    const cur = curId ? list.find((g) => g.id === curId) : null;
    const going = cur && cur.startedAt && !cur.endedAt ? cur : null;
    V.append(
      h('header', { class: 'hbar' },
        h('div', { class: 'brand' }, h('span', { class: 'logo', 'aria-hidden': 'true' }, '🏀'), h('div', null, h('b', null, BT.APP), h('small', null, '試合を見ながらタップで記録 → 動画の切り出しにも'))),
        h('button', { class: 'btn icon', id: 'btnHelp', 'aria-label': '使い方', onclick: help }, '？')),
      h('main', { class: 'home' },
        going ? h('section', { class: 'card going' },

          gameLine(going),

        h('button', { class: 'btn ' + (going ? '' : 'primary ') + 'huge', id: 'btnNew', onclick: newGame }, '＋ 新しい試合を記録する'),
        list.length ? h('section', { class: 'card' }, h('h2', null, 'これまでの試合'), h('div', { class: 'games' }, list.map(gameRow))) : h('section', { class: 'card steps3' },
          h('h2', null, 'つかいかた'),
          h('ol', null,
            h('li', null, h('b', null, 'チームと背番号を選ぶ'), h('span', null, '「4〜15」ボタンでまとめて。自分のチームは次から自動で入ります')),
            h('li', null, h('b', null, 'ティップオフで ▶ スタート'), h('span', null, '左上の時計が動き出します')),
            h('li', null, h('b', null, 'プレーをタップ'), h('span', null, '「7」→「2P 成功」でも、「2P 成功」→「7」でも。押した瞬間の時刻で残ります')))),
        h('section', { class: 'card tools' },
          h('h2', null, '動画から場面を切り出す'),
          h('p', null, '記録した試合のファイル（書き出す → 記録のファイル）を「バスケ得点クリップ」で試合の動画と一緒に開くと、記録した場面（シュート・リバウンド・パスミスなど）を動画から切り出して、続けて見たり、1本の動画にしたりできます。'),
          h('div', { class: 'row' },
            h('a', { class: 'btn', href: CLIPS_URL, target: '_blank', rel: 'noopener' }, '🎬 バスケ得点クリップを開く'),
            h('button', { class: 'btn', onclick: importFile }, '📂 記録のファイルを開く'))),
        h('p', { class: 'note' }, '🔒 記録はこの端末のブラウザの中だけに保存します（どこにも送りません）。大事な試合は「書き出す」でファイルにも残してください（iPhone などは、長く開かないサイトの保存を消すことがあります）。')));

  function gameLine(g) {

      h('span', { class: 'vs' }, h('i', { class: 'chip', style: { background: g.colors[0] } }), g.names[0], h('b', null, ` ${g.score[0]} − ${g.score[1]} `), g.names[1], h('i', { class: 'chip', style: { background: g.colors[1] } })),

      BT.store.saveGame(g);
      openGame(g);

  }

  /* ========== 試合の準備（チーム名・色・背番号） ========== */
  function newGame() {
    const mine = BT.store.myTeam();
    S.draft = { title: '', teams: [mine ? { name: mine.name, color: mine.color, colorName: mine.colorName, players: BT.cleanPlayers(mine.players) } : BT.blankTeam(0), BT.blankTeam(1)] };
    if (S.draft.teams[0].color === S.draft.teams[1].color) Object.assign(S.draft.teams[1], S.draft.teams[0].color === '#2f6fed' ? { color: '#d93636', colorName: '赤' } : {});

      h('header', { class: 'hbar' },
        h('button', { class: 'btn', onclick: () => (edit ? go('live') : go('home')) }, edit ? '← 記録へ戻る' : '← 戻る'),

    if (saved.length) {
      card.append(h('div', { class: 'savedrow' }, h('span', { class: 'note' }, '前のチームから：'),
        saved.slice(0, 8).map((x) => h('button', { class: 'btn small chipbtn', onclick: () => { Object.assign(t, { name: x.name, color: x.color, colorName: x.colorName, players: BT.cleanPlayers(x.players) }); setupChanged(); redraw(); } },
          h('i', { class: 'chip', style: { background: x.color } }), x.name, h('small', null, ` ${x.players.length}人`)))));
    }
    // 名前
    card.append(h('label', { class: 'field' }, h('span', null, 'チーム名'),
      h('input', { type: 'text', class: 'tname', maxlength: 20, placeholder: i ? '例：○○中（なくてもOK）' : '例：致遠館（なくてもOK）', value: t.name || '',
        onchange: (e) => { t.name = e.target.value.trim(); setupChanged(); headName.textContent = label(); } })));
    // 色
    const sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'ユニフォームの色' });

    });
    sw.append(h('input', { type: 'color', class: 'swc', title: 'ほかの色', value: t.color, onchange: (e) => { t.color = e.target.value; t.colorName = BT.nearestColorName(e.target.value); setupChanged(); redraw(); } }));
    card.append(h('div', { class: 'field' }, h('span', null, `ユニフォームの色：${t.colorName}`), sw));
    if (T[0].color.toLowerCase() === T[1].color.toLowerCase()) card.append(h('p', { class: 'note warn' }, '⚠ 自分と相手が同じ色です。見分けやすいように、どちらかを変えてください。'));
    // 背番号
    const count = h('span', null, '');
    const noText = h('input', { type: 'text', class: 'nostext', inputmode: 'numeric', placeholder: '直接入れる（例：4-15, 23）', onchange: (e) => setNos(BT.parseNumbers(e.target.value)) });
    const presets = [['4〜15', '4-15'], ['4〜18', '4-18'], ['1〜15', '1-15'], ['0〜20', '0-20']];
    card.append(h('div', { class: 'field' }, count,
      h('div', { class: 'row presets' },
        presets.map(([lab, txt]) => h('button', { class: 'btn small', dataset: { preset: txt }, onclick: () => setNos(BT.parseNumbers(txt)) }, lab)),
        h('button', { class: 'btn small', onclick: () => setNos([]) }, '全部はずす')),
      noText));
    const grid = h('div', { class: 'nogrid', role: 'group', 'aria-label': '背番号を選ぶ' });
    const moreBtn = h('button', { class: 'linkbtn', onclick: () => { S.more[i] = !S.more[i]; fillGrid(); } }, '');
    const names = h('div', { class: 'namesbox' });
    card.append(grid, moreBtn, names);
    // マスを並べる（0・00・1〜30。「31〜99 も出す」で 99 まで。31 以上を選んでいれば、その番号も）
    function fillGrid() {
      const on = new Set(t.players.map((p) => p.no));
      const shown = ['0', '00'].concat(Array.from({ length: S.more[i] ? 99 : 30 }, (_, k) => String(k + 1)));
      t.players.forEach((p) => { if (!shown.includes(p.no)) shown.push(p.no); });
      grid.innerHTML = '';
      BT.sortNos(shown).forEach((no) => grid.append(h('button', { class: 'nb' + (on.has(no) ? ' on' : ''), dataset: { no }, 'aria-pressed': on.has(no) ? 'true' : 'false',
        onclick: () => { const cur = new Set(t.players.map((p) => p.no)); if (cur.has(no)) cur.delete(no); else cur.add(no); setNos(Array.from(cur)); } }, no)));
      moreBtn.textContent = S.more[i] ? '31〜99 をかくす' : '31〜99 も出す';
    }
    // 名前（任意）
    function fillNames() {
      names.innerHTML = '';
      if (!t.players.length) return;
      const det = h('details', { class: 'names' }, h('summary', null, `選手の名前を入れる（なくてもOK）${t.players.some((p) => p.name) ? '・' + t.players.filter((p) => p.name).length + '人入力ずみ' : ''}`),
        h('div', { class: 'namelist' }, t.players.map((p) => h('label', { class: 'nm' }, h('b', null, '#' + p.no),
          h('input', { type: 'text', maxlength: 12, placeholder: '名前・ニックネーム', value: p.name || '', onchange: (e) => { p.name = e.target.value.trim().slice(0, 12); setupChanged(); } })))));
      det.open = !!S.namesOpen && S.namesOpen[i];
      det.addEventListener('toggle', () => { S.namesOpen = S.namesOpen || [false, false]; S.namesOpen[i] = det.open; });
      names.append(det);
    }
    /* 背番号を変えた：マスの印・人数・文字の欄・名前の欄を、その場で書き換える */
    function setNos(list) {
      const before = t.players.map((p) => p.no).join(',');
      t.players = BT.playersFromNos(list, t.players);
      setupChanged();
      const on = new Set(t.players.map((p) => p.no));
      if (t.players.some((p) => !grid.querySelector(`.nb[data-no="${p.no}"]`))) fillGrid();
      else grid.querySelectorAll('.nb').forEach((b) => { const v = on.has(b.dataset.no); b.classList.toggle('on', v); b.setAttribute('aria-pressed', v ? 'true' : 'false'); });
      count.textContent = `背番号：${t.players.length ? t.players.length + '人' : 'まだ選んでいません'}`;
      if (document.activeElement !== noText) noText.value = BT.formatNumbers(t.players.map((p) => p.no));
      if (before !== t.players.map((p) => p.no).join(',')) fillNames();
    }
    fillGrid();
    fillNames();
    count.textContent = `背番号：${t.players.length ? t.players.length + '人' : 'まだ選んでいません'}`;
    noText.value = BT.formatNumbers(t.players.map((p) => p.no));
    return card;
  }

  /* ========== 記録の画面 ========== */
  function buildLive() {
    const g = S.game;
    document.body.dataset.view = 'live';
    const V = $('#view');
    V.innerHTML = '';
    const L = S.L = { panels: [], waitShown: [null, null] };
    L.clock = h('button', { class: 'clock', id: 'clock', title: 'スタートからの時間', onclick: openMenu }, h('span', { class: 'recdot' }), h('span', { class: 'tval', id: 'tval' }, '0:00'));
    L.start = h('button', { class: 'startbtn', id: 'btnStart', onclick: start }, '▶ スタート');
    L.period = h('button', { class: 'period', id: 'btnPeriod', 'aria-label': 'ピリオド', onclick: openPeriod }, '1Q');
    L.score = [0, 1].map((tm) => h('span', { class: 'sc', id: 'score' + tm, style: { '--tc': g.teams[tm].color, '--tink': BT.inkOn(g.teams[tm].color) } }, '0'));
    const bar = h('header', { class: 'lbar' }, L.clock, L.start, L.period,
      h('div', { class: 'score', 'aria-label': '得点' }, L.score[0], h('span', { class: 'dash' }, '−'), L.score[1]),
      h('button', { class: 'menubtn', id: 'btnMenu', 'aria-label': 'メニュー', onclick: openMenu }, h('span', null, '≡'), h('small', null, 'メニュー')));
    const P = L.panelsEl = h('main', { class: 'panels' }, [0, 1].map(buildPanel));
    P.addEventListener('click', onPanelClick);
    L.cover = h('div', { class: 'cover', id: 'cover', hidden: true });
    L.last = h('footer', { class: 'lastbar', id: 'lastbar' });
    L.root = h('div', { class: 'live' }, bar, h('div', { class: 'stagewrap' }, P, L.cover), L.last);
    V.append(L.root);
    updateLive();
    layoutLive();
  }

  /* 画面の大きさに合わせて、背番号の並べ方を選ぶ（ボタンが小さくなりすぎない、いちばんゆったりした並べ方）
       wrap  ：番号を上に（折り返して何段でも）。いちばん見やすい
       col   ：番号をプレーのボタンの左に（横長で、高さが足りないとき）
       strip ：番号を上に横1列（はみ出す分は横にすべらせる。縦長で、高さが足りないとき）
     実際に並べてみて、プレーのボタンがはみ出さないものを選ぶ */
  function layoutLive() {
    const L = S.L;
    if (!L || !L.root || !L.root.isConnected) return;
    const live = L.root, P = L.panelsEl;
    live.classList.toggle('short', root.innerHeight < 430);
    const land = P.clientWidth > P.clientHeight * 1.1 && P.clientWidth >= 560;
    const modes = land
      ? [['wrap', 52], ['strip2', 50], ['wrap', 44], ['strip2', 44], ['strip', 44], ['col', 44], ['strip', 36], ['col', 36], ['strip', 30]]
      : [['wrap', 52], ['strip2', 50], ['wrap', 44], ['strip2', 44], ['strip', 46], ['strip', 40], ['strip', 34]];
    live.classList.toggle('land', land);
    for (const [mode, acth] of modes) {
      live.classList.remove('lay-wrap', 'lay-col', 'lay-strip', 'lay-strip2');
      live.classList.add('lay-' + mode);
      live.style.setProperty('--acth', acth + 'px');
      if (mode === 'strip2') {
        // 2段で横にすべらせる（左から 4 5 6 … と並ぶように、1段の数を決める）。1段に入りきるなら1段
        L.panels.forEach((pn, tm) => {
          const n = S.game.teams[tm].players.length + 1;
          const avail = pn.nos.clientWidth - 12, GAP = 5;
          const per = Math.max(1, Math.floor((avail + GAP) / (44 + GAP)));
          const cols = n > per ? Math.ceil(n / 2) : per;
          const w = BT.clamp(Math.floor((avail - (cols - 1) * GAP) / cols), 44, 60);
          pn.sec.style.setProperty('--nocols', cols);
          pn.sec.style.setProperty('--now', w + 'px');
        });
      }
      if (mode === 'col') {
        // 左の列の幅：番号が縦に入りきる列の数（2〜4列）
        L.panels.forEach((pn, tm) => {
          const n = S.game.teams[tm].players.length + 1;
          const noH = 44, avail = Math.max(noH, pn.sec.clientHeight - pn.head.offsetHeight - 12);
          const perCol = Math.max(1, Math.floor((avail + 5) / (noH + 5)));
          pn.sec.style.setProperty('--nocols', BT.clamp(Math.ceil(n / perCol), 2, 3));
        });
      }
      const over = L.panels.some((pn) => pn.acts.scrollHeight > pn.acts.clientHeight + 2 || pn.sec.scrollHeight > pn.sec.clientHeight + 2);
      if (!over) break;
    }
    L.panels.forEach((pn) => pn.nos.classList.toggle('more', pn.nos.scrollWidth > pn.nos.clientWidth + 2));
  }
  function buildPanel(tm) {
    const g = S.game, t = g.teams[tm];
    const rows = BT.actionRows(S.prefs.actions[tm]);
    const cols = Math.max(3, ...rows.slice(0, 2).map((r) => r.length));
    const askTxt = h('span', { class: 'asktxt' });
    const askBar = h('i', { class: 'askbar' });
    const ask = h('div', { class: 'ask', hidden: true }, askTxt, h('button', { class: 'askx', dataset: { cancel: '1' }, 'aria-label': '番号を付けない' }, '番号なし'));
    const tsc = h('span', { class: 'tsc' }, '0');
    const head = h('div', { class: 'thead' }, h('b', { class: 'tname' }, BT.teamName(g, tm)), tsc, ask, askBar);
    const nos = h('div', { class: 'nos' }, t.players.map((p) => noBtn(tm, p)), h('button', { class: 'no add', dataset: { add: '1' }, 'aria-label': '番号を足す' }, '＋'));
    const acts = h('div', { class: 'acts', style: { '--cols': cols } });
    rows.forEach((r) => r.forEach((id, k) => acts.append(actBtn(tm, id, k === 0))));
    const nRows = rows.reduce((s, r) => s + Math.ceil(r.length / cols), 0);
    const sec = h('section', { class: 'team', id: 'panel' + tm, dataset: { team: tm }, style: { '--tc': t.color, '--tink': BT.inkOn(t.color), '--rows': nRows } }, head, nos, acts);
    S.L.panels[tm] = { sec, head, ask, askTxt, askBar, tsc, nos, acts };
    return sec;
  }
  function noBtn(tm, p) {
    return h('button', { class: 'no', dataset: { no: p.no }, 'aria-label': `${BT.teamName(S.game, tm)} ${p.no}番${p.name ? ' ' + p.name : ''}` },
      h('b', null, p.no), S.prefs.names && p.name ? h('small', null, p.name) : null);
  }
  function actBtn(tm, id, rowStart) {
    const d = BT.TYPE[id];
    return h('button', { class: `act k-${d.kind}${rowStart ? ' rs' : ''}${d.key.length >= 4 ? ' long' : ''}`, dataset: { type: id }, 'aria-label': `${BT.teamName(S.game, tm)} ${d.label}` },
      h('b', null, d.key), d.sub ? h('small', null, d.sub) : null);
  }

  function onPanelClick(e) {
    const b = e.target.closest('button');
    if (!b) return;
    const sec = b.closest('.team');
    if (!sec) return;
    const tm = Number(sec.dataset.team);
    if (b.dataset.type) onAction(tm, b.dataset.type, b);
    else if (b.dataset.add) openKeypad(tm);
    else if (b.dataset.cancel) { S.tap.clearWait(tm); updateLive(); }
    else if (b.dataset.no != null) onNumber(tm, b.dataset.no, b);
  }
  function canRecord() {
    if (!S.game.startedAt) { say('先に「▶ スタート」を押してください', 'warn'); return false; }
    if (S.game.endedAt) { say('試合は終わっています。続けるときは「続きを記録する」', 'warn'); return false; }
    return true;
  }
  function onAction(tm, type, btn) {
    if (!canRecord()) return;
    const t0 = now();
    const key = tm + ':' + type;
    if (S.lastTap.key === key && t0 - S.lastTap.at < 450) return;        // 二度押し（同じボタンを 0.45 秒以内）は1回に
    S.lastTap = { key, at: t0 };
    const r = S.tap.action(tm, type, elapsed(), t0);
    S.redo = [];
    save();
    flash(btn);
    feel(BT.TYPE[type].kind);
    updateLive(BT.TYPE[type].pts ? tm : null);
  }
  function onNumber(tm, no, btn) {
    if (!canRecord()) return;
    const r = S.tap.number(tm, no, now());
    if (r.kind === 'assign') { save(); feel('no'); }
    flash(btn);
    updateLive();
  }

  /* 表示を書き換える（bump：得点が動いたチーム） */
  function updateLive(bump) {
    const g = S.game, L = S.L;
    if (!L) return;
    const started = !!g.startedAt, ended = !!g.endedAt;
    L.start.hidden = started;
    L.clock.hidden = !started;
    L.clock.classList.toggle('ended', ended);
    tickClock(true);
    L.period.textContent = BT.periodLabel(started ? BT.currentPeriod(g, now()) : (g.startPeriod || 1));
    const sc = BT.score(g);
    L.score[0].parentNode.classList.toggle('big3', Math.max(sc[0], sc[1]) >= 100);
    [0, 1].forEach((tm) => {
      const P = L.panels[tm];
      L.score[tm].textContent = sc[tm];
      P.tsc.textContent = sc[tm];
      if (bump === tm) { flash(L.score[tm]); flash(P.tsc); }
      const sel = S.tap.sel[tm], wait = S.tap.wait[tm];
      $$('.no[data-no]', P.nos).forEach((b) => b.classList.toggle('sel', b.dataset.no === sel));
      P.sec.classList.toggle('asking', wait != null);
      P.ask.hidden = wait == null;
      P.askBar.hidden = wait == null;
      if (wait != null && L.waitShown[tm] !== wait) {
        const ev = BT.findEvent(g, wait);
        P.askTxt.textContent = `だれの「${ev ? BT.TYPE[ev.type].label : ''}」？`;
        const left = Math.max(0.2, BT.WAIT - (now() - S.tap.waitAt[tm]) / 1000);
        P.askBar.style.animation = 'none';
        void P.askBar.offsetWidth;
        P.askBar.style.animation = `shrink ${left}s linear forwards`;
      }
      L.waitShown[tm] = wait;
    });
    // スタートの前・試合が終わったあとは、パネルの上に大きなボタンを出す
    L.cover.innerHTML = '';
    if (!started) {
      L.cover.append(h('div', { class: 'cover-card' },
        h('button', { class: 'startbig', id: 'btnStartBig', onclick: start }, '▶ スタート'),
        h('p', null, h('b', null, 'ティップオフ（試合開始のジャンプボール）の瞬間'), 'に押してください。'),
        h('p', { class: 'note' }, '時計が動き出し、そこからの時間でプレーを記録します。あとで動画と合わせるときの目印にもなります。'),
        h('button', { class: 'btn small', onclick: openPeriod }, `${BT.periodLabel(g.startPeriod || 1)} から始める（変える）`)));
    } else if (ended) {
      L.cover.append(h('div', { class: 'cover-card' },
        h('b', { class: 'endtitle' }, '試合終了'),
        h('div', { class: 'endscore' }, h('span', null, BT.teamName(g, 0)), h('b', null, `${sc[0]} − ${sc[1]}`), h('span', null, BT.teamName(g, 1))),
        h('div', { class: 'row center' },
          h('button', { class: 'btn primary', onclick: openStats }, '📊 集計を見る'),
          h('button', { class: 'btn primary', onclick: () => openExport(g) }, '💾 書き出す')),
        h('button', { class: 'btn small', onclick: reopen }, '続きを記録する（まちがえて終えたとき）')));
    }
    L.cover.hidden = started && !ended;
    renderLast();
  }
  let lastClock = '';
  function tickClock(force) {
    const L = S.L;
    if (!L || !S.game || !S.game.startedAt) return;
    const s = BT.fmtTime(elapsed());
    if (force || s !== lastClock) { lastClock = s; const el = $('#tval'); el.textContent = s; el.classList.toggle('long', s.length > 5); }
  }
  function tick() {
    if (S.view !== 'live' || !S.game || !S.L) return;
    tickClock();
    if (S.tap.expire(now())) updateLive();
  }

  /* 記録の画面のお知らせ：パネルのボタンを隠さないよう、画面の下の帯に出す（ほかの画面・小窓の上では、ふつうのお知らせ） */
  function say(text, kind, ms, action) {
    if (S.view !== 'live' || !S.L || BT.ui.sheetOpen()) return BT.ui.toast(text, kind, ms, action);
    clearTimeout(S.msgTimer);
    S.msg = { text, kind: kind || '', action };
    S.msgTimer = setTimeout(() => { S.msg = null; if (S.L) renderLast(); }, ms || 2800);
    renderLast();
    return null;
  }

  /* 画面の下：いちばん新しい記録と「取り消す」 */
  function renderLast() {
    const g = S.game, el = S.L.last;
    el.innerHTML = '';
    if (S.msg) {
      const m = S.msg;
      el.append(h('div', { class: 'lastev msg ' + m.kind, role: 'status', 'aria-live': 'polite' }, h('span', { class: 'll' }, m.text)),
        m.action ? h('button', { class: 'btn undo', id: 'btnMsgAct', onclick: () => { S.msg = null; clearTimeout(S.msgTimer); m.action.onClick(); if (S.L) renderLast(); } }, m.action.label)
          : (g.events.length ? h('button', { class: 'btn undo', id: 'btnUndo', onclick: undo }, '↶ 取り消す') : null));
      return;
    }
    if (!g.startedAt) { el.append(h('span', { class: 'hint' }, '左上の「▶ スタート」でも始められます')); return; }
    const ev = g.events[g.events.length - 1];
    if (!ev) { el.append(h('span', { class: 'hint' }, 'まだ記録はありません')); return; }
    const waiting = ev.type !== 'period' && S.tap.wait[ev.team] === ev.id;
    const d = BT.TYPE[ev.type];
    el.append(
      h('div', { class: 'lastev', role: 'status', 'aria-live': 'polite', style: { '--tc': ev.type === 'period' ? 'var(--line2)' : teamColor(ev.team) } },
        ev.type === 'period' ? h('i', { class: 'chip neutral' }) : h('i', { class: 'chip', style: { background: teamColor(ev.team) } }),
        h('b', { class: 'lt' }, BT.fmtTime(ev.t)),
        h('span', { class: 'lw' }, ev.type === 'period' ? `${BT.periodLabel(ev.period)} 開始` : `${BT.teamName(g, ev.team)} ${ev.no != null ? '#' + ev.no : waiting ? '番号は？' : '番号なし'}`),
        ev.type === 'period' ? null : h('span', { class: 'll' }, d.label + (d.pts ? ` +${d.pts}` : ''))),
      h('button', { class: 'btn undo', id: 'btnUndo', onclick: undo }, '↶ 取り消す'));
  }
  function undo() {
    const g = S.game;
    const ev = g.events[g.events.length - 1];
    if (!ev) return;
    if (g.events.length === 1 && ev.type === 'period') { say('スタートは取り消せません（メニューの「スタートを取り消す」）', 'warn', 4000); return; }
    g.events.pop();
    S.redo.push(ev);
    S.tap.expire(now());
    save();
    feel('undo');
    updateLive();
    say(`取り消しました：${BT.fmtTime(ev.t)} ${BT.eventText(g, ev, true)}`, 'warn', 4500, { label: '↷ やり直す', onClick: redo });
  }
  function redo() {
    const ev = S.redo.pop();
    if (!ev || !S.game) return;
    S.game.events.push(ev);
    S.game.seq = Math.max(S.game.seq || 0, Number(String(ev.id).slice(1)) || 0);
    save();
    updateLive();
    say('やり直しました', 'ok');
  }

  /* ---------- スタート・終了 ---------- */
  function start() {
    const g = S.game;
    if (!g || g.startedAt) return;
    const t0 = now();
    g.startedAt = t0;
    g.date = BT.ymdAt(t0, g.tz);
    BT.addEvent(g, { t: 0, type: 'period', period: g.startPeriod || 1 });
    delete g.startPeriod;
    save();
    feel('made');
    BT.store.persist();
    BT.ui.keepAwake(true).then((ok) => {
      if (!ok && !S.warnedWake) { S.warnedWake = true; say('この端末は画面の自動ロックを止められません（設定で長めに）', 'warn', 6000); }
    });
    guard();
    updateLive();
  }
  function cancelStart() {
    const g = S.game;
    g.startedAt = null; g.endedAt = null; g.events = []; g.seq = 0;
    S.tap.reset(); S.redo = [];
    BT.ui.keepAwake(false);
    save();
    updateLive();
    say('スタートを取り消しました', 'ok');
  }
  function endGame() {
    const g = S.game;
    g.endedAt = now();
    S.tap.reset();
    BT.ui.keepAwake(false);
    save();

  function reopen() {
