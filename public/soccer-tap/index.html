<script>
/* js/review.js */
/* スポーツ タップ記録 — 動画で場面を見返す（このアプリの中だけで。ほかのアプリはいらない）
   記録した場面（シュート・あとでチェック・フリーキック など）を、試合の動画から「前◯秒〜後◯秒」で切り出して再生する。

   ■ 動画
     ・この端末のカメラで撮影しながら記録した動画（livecam.js。IndexedDB にある）：録画を始めた時刻が分かるので、時刻あわせはいらない
         動画の時刻 ＝ 記録の t ＋（記録のスタート − 録画の始まり）秒
     ・あとで選んだ試合の動画のファイル：1か所だけ合わせる（動画の中で、記録のどれか（ふつうはキックオフ）の瞬間で止めて「ここ」）。
         合わせたずれは、ファイルの名前と大きさで覚えておく（game.syncs）。ファイルそのものは保存しない（開くたびに選ぶ）
   ■ 場面の長さ（前・後の秒数）：まとまりごとに選べる（種目の win。サッカーは シュート・ゴール 30 秒前〜5 秒後、あとでチェック 10 秒前〜10 秒後）
       shot：シュート・得点 / mark：あとでチェック（★） / other：そのほか（フリーキック・コーナーキック など）
     設定は種目ごとに S.prefs.sp[種目].win、再生の速さは S.prefs.rvSpeed */
(function (root) {
  'use strict';
  const ST = root.ST;
  const { h } = ST.ui;
  const SPEEDS = [0.5, 1, 1.5, 2, 4];
  const BEFORE = [5, 10, 15, 20, 30, 45, 60];
  const AFTER = [3, 5, 10, 15, 20, 30];
  const DEF_WIN = { shot: [10, 3], mark: [10, 10], other: [8, 3] };
  const GROUP_LABEL = { shot: 'シュート・得点', mark: 'あとでチェック（★）', other: 'そのほか' };

  function create(api) {
    const S = api.S;
    const R = { game: null, src: null, url: '', offset: null, filter: { types: null, teams: [true, true, true], players: [] }, playing: null, reel: null, ri: 0, raf: 0, el: null, winOpen: null };
    const narrow = () => !!(root.matchMedia && root.matchMedia('(max-width: 899px)').matches);

    const sport = () => ST.sportOf(R.game);
    const winOf = () => { const sp = sport(), pr = api.sprefs(sp.id); return Object.assign({}, DEF_WIN, sp.win || {}, pr.win || {}); };
    const groupOf = (d) => (d.kind === 'mark' ? 'mark' : d.shot || d.pts || d.so ? 'shot' : 'other');
    const groupLabel = (k) => (k === 'shot' && sport().id === 'soccer' ? 'シュート・ゴール' : GROUP_LABEL[k]);
    const speed = () => (SPEEDS.includes(S.prefs.rvSpeed) ? S.prefs.rvSpeed : 1);
    const camVideos = () => (R.game.videos || []).filter((v) => !v.gone && v.status !== 'recording');
    const fileKey = (f) => `${f.name}|${f.size}`;
    const isCard = (e, d) => d.kind === 'card' || e.card === 'y' || e.card === 'r';

    /* 場面の一覧（いまの動画・絞り込み・長さで）。[{ e, d, grp, v（動画の時刻）, t0, t1, label, when }] */
    function scenes(all) {
      if (R.offset == null) return [];
      const sp = sport(), W = winOf();
      const dur = R.el && R.el.video.duration > 0 ? R.el.video.duration : Infinity;
      const f = R.filter;
      const out = [];
      ST.sorted(R.game).forEach((e) => {
        const d = sp.TYPE[e.type];
        if (!d || d.meta || d.kind === 'adj') return;
        const v = e.t + R.offset;
        if (v < 0 || v > dur) return;
        if (!all) {
          if (f.types && !f.types.includes(e.type) && !(f.types.includes('*card') && isCard(e, d))) return;
          const tk = e.team === 0 || e.team === 1 ? e.team : 2;
          if (f.teams[tk] === false) return;
          if (f.players.length && !(e.team != null && e.no != null && f.players.includes(e.team + ':' + e.no))) return;
        }
        const grp = groupOf(d), w = W[grp] || W.other;
        out.push({ e, d, grp, v, t0: Math.max(0, v - w[0]), t1: Math.min(dur, v + w[1]), label: ST.eventText(R.game, e, true), when: api.timeText(e) });
      });
      return out;
    }
    /* 続けて再生の区間：重なる場面は1つにつなぐ（同じところを2回見せない） */
    function reelOf(list) {
      const out = [];
      list.slice().sort((a, b) => a.t0 - b.t0).forEach((c) => {
        const prev = out[out.length - 1];
        if (prev && c.t0 <= prev.t1 + 0.3) { prev.t1 = Math.max(prev.t1, c.t1); prev.items.push(c); return; }
        out.push({ t0: c.t0, t1: c.t1, items: [c] });
      });
      return out;
    }

    /* ---------- 動画 ---------- */
    async function useCam(v) {
      stop();
      let f = null;
      try { f = await ST.vstore.file(v.vid); } catch (e) { f = null; }
      if (!f) { ST.ui.toast('この動画は、この端末にはもうありません', 'err', 5000); return; }
      setSrc({ kind: 'cam', vid: v.vid, n: v.n, name: v.name }, f, (R.game.startedAt - v.startedAt) / 1000);
    }
    function useFile(f) {
      stop();
      const key = fileKey(f);
      const off = R.game.syncs && isFinite(R.game.syncs[key]) ? R.game.syncs[key] : null;
      setSrc({ kind: 'file', key, name: f.name }, f, off);
    }
    function setSrc(src, blob, offset) {
      if (R.url) URL.revokeObjectURL(R.url);
      R.url = URL.createObjectURL(blob);
      R.src = src;
      R.offset = offset;
      R.el.video.src = R.url;
      R.el.video.playbackRate = speed();
      R.el.video.addEventListener('loadedmetadata', () => { R.el.video.playbackRate = speed(); draw(); }, { once: true });
      draw();
    }
    function pickFile() {
      const inp = h('input', { type: 'file', accept: 'video/*,.mp4,.mov,.m4v,.webm', style: { display: 'none' } });
      inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) useFile(f); });
      document.body.appendChild(inp);
      inp.click();
    }
    /* いまの映像の位置を、記録 e の瞬間にする（あとで選んだ動画の時刻あわせ） */
    function syncAt(e) {
      const v = R.el.video.currentTime || 0;
      R.offset = Math.round((v - e.t) * 100) / 100;
      if (R.src && R.src.kind === 'file') { R.game.syncs = R.game.syncs || {}; R.game.syncs[R.src.key] = R.offset; api.save(); }
      ST.ui.toast(`合わせました：記録の ${ST.fmtTime(e.t)}（${ST.eventText(R.game, e, true)}）＝ 動画の ${ST.fmtTime(v, 1)}`, 'ok', 4000);
      draw();
    }
    function nudge(d) {
      if (R.offset == null) return;
      R.offset = Math.round((R.offset + d) * 100) / 100;
      if (R.src && R.src.kind === 'file') { R.game.syncs = R.game.syncs || {}; R.game.syncs[R.src.key] = R.offset; api.save(); }
      draw();
    }

    /* ---------- 再生 ---------- */
    function stop() {
      cancelAnimationFrame(R.raf);
      R.playing = null; R.reel = null;
      if (R.el && R.el.video && !R.el.video.paused) R.el.video.pause();
    }
    function watch() {
      cancelAnimationFrame(R.raf);
      const loop = () => {
        const vd = R.el && R.el.video;
        if (!vd || !R.playing) return;
        if (vd.currentTime >= R.playing.t1 - 0.02 || vd.ended) {
          if (R.reel && R.ri + 1 < R.reel.length) { R.ri++; go(R.reel[R.ri]); return; }
          vd.pause();
          R.playing = null; R.reel = null;
          drawNow();
          return;
        }
        drawNow();
        R.raf = requestAnimationFrame(loop);
      };
      R.raf = requestAnimationFrame(loop);
    }
    function go(seg) {
      const vd = R.el.video;
      R.playing = seg;
      vd.currentTime = seg.t0;
      vd.playbackRate = speed();
      const p = vd.play();
      if (p && p.catch) p.catch(() => {});
      watch();
      draw();
      // スマホ縦：一覧を下に見ていたら、映像が見えるところまで戻す
      const r = vd.getBoundingClientRect(), top = (document.querySelector('.hbar') || { offsetHeight: 0 }).offsetHeight;
      if (r.top < top || r.bottom > root.innerHeight) root.scrollTo({ top: Math.max(0, root.scrollY + r.top - top - 8), behavior: 'smooth' });
    }
    function playOne(c) { R.reel = null; go({ t0: c.t0, t1: c.t1, items: [c] }); }
    function playAll() {
      const list = reelOf(scenes());
      if (!list.length) { ST.ui.toast('場面がありません（絞り込み・動画を確かめてください）', 'warn'); return; }
      R.reel = list; R.ri = 0;
      go(list[0]);
    }
    function step(d) {
      if (R.reel) { const i = ST.clamp(R.ri + d, 0, R.reel.length - 1); if (i !== R.ri) { R.ri = i; go(R.reel[i]); } return; }
      const list = scenes();
      if (!list.length) return;
      const cur = R.playing ? R.playing.items[0] : null;
      let i = cur ? list.findIndex((c) => c.e.id === cur.e.id) : -1;
      i = ST.clamp(i + d, 0, list.length - 1);
      playOne(list[i]);
    }
    function setSpeed(x) { S.prefs.rvSpeed = x; api.savePrefs(); if (R.el) R.el.video.playbackRate = x; draw(); }
    function setWin(grp, k, v) { const sp = sport(), pr = api.sprefs(sp.id); const W = winOf(); pr.win = Object.assign({}, pr.win || {}, { [grp]: k === 0 ? [v, W[grp][1]] : [W[grp][0], v] }); api.savePrefs(); draw(); }

    /* ---------- 画面 ---------- */
    function render(game, vid) {
      R.game = game;
      R.src = null; R.offset = null;
      R.filter = { types: null, teams: [true, true, true], players: [] };
      R.winOpen = null;
      document.body.dataset.view = 'review';
      const V = document.querySelector('#view');
      V.innerHTML = '';
      const video = h('video', { class: 'rv-video', playsinline: true, preload: 'auto', controls: true });
      video.playsInline = true;
      const label = h('div', { class: 'rv-label', id: 'rvLabel' });
      const ctl = h('div', { class: 'rv-ctl', id: 'rvCtl' });
      const srcBox = h('div', { class: 'rv-src', id: 'rvSrc' });
      const side = h('div', { class: 'rv-side', id: 'rvSide' });
      const back = h('button', { class: 'btn', id: 'btnRvBack', onclick: () => { close(); api.back(); } }, '← 記録へ戻る');
      V.append(
        h('header', { class: 'hbar' }, back, h('b', { class: 'htitle' }, `${sport().icon} 場面を見返す`), h('span', { class: 'spacer' })),
        h('main', { class: 'rv' },
          h('section', { class: 'rv-player' }, h('div', { class: 'rv-vwrap' }, video, label), ctl, srcBox),
          side));
      R.el = { video, label, ctl, srcBox, side };
      video.addEventListener('pause', () => drawNow());
      video.addEventListener('play', () => drawNow());
      video.addEventListener('ratechange', () => { if (Math.abs(video.playbackRate - speed()) > 0.01 && R.playing) video.playbackRate = speed(); });
      const cams = camVideos();
      const first = vid ? cams.find((v) => v.vid === vid) : cams[0];
      if (first) useCam(first); else draw();
    }
    function close() { stop(); if (R.url) { URL.revokeObjectURL(R.url); R.url = ''; } if (R.el) { R.el.video.removeAttribute('src'); R.el.video.load(); } R.el = null; }
    /* 再生中に変わるところだけ（場面の名前・ボタンの印） */
    function drawNow() {
      if (!R.el) return;
      const p = R.playing;
      const it = p ? p.items[0] : null;
      R.el.label.hidden = !it;
      if (it) {
        const n = R.reel ? `${R.ri + 1}/${R.reel.length}` : '';
        const t = p.items.length > 1 ? `${it.label} ほか${p.items.length - 1}` : it.label;
        const s = `${n ? '▶ ' + n + '　' : '▶ '}${t}（${it.when}）`;
        if (R.el.label.textContent !== s) R.el.label.textContent = s;
      }
      const pb = R.el.ctl.querySelector('#btnRvPlay');
      if (pb) pb.textContent = R.el.video.paused ? '▶' : '⏸';
      R.el.side.querySelectorAll('.rvrow').forEach((row) => row.classList.toggle('playing', !!(p && p.items.some((c) => c.e.id === row.dataset.id))));
    }
    function draw() {
      if (!R.el) return;
      const g = R.game, sp = sport(), E = R.el;
      // 操作
      const seek = (d) => { const vd = E.video; vd.currentTime = Math.max(0, (vd.currentTime || 0) + d); };
      E.ctl.innerHTML = '';
      E.ctl.append(
        h('div', { class: 'row rvbtns' },
          h('button', { class: 'btn', id: 'btnRvPrev', title: '前の場面', onclick: () => step(-1) }, '⏮'),
          h('button', { class: 'btn', onclick: () => seek(-10) }, '−10秒'),
          h('button', { class: 'btn', onclick: () => seek(-5) }, '−5秒'),
          h('button', { class: 'btn primary rvplay', id: 'btnRvPlay', onclick: () => { const vd = E.video; if (vd.paused) { vd.playbackRate = speed(); vd.play().catch(() => {}); } else { vd.pause(); stop(); } } }, '▶'),
          h('button', { class: 'btn', onclick: () => seek(5) }, '+5秒'),
          h('button', { class: 'btn', onclick: () => seek(10) }, '+10秒'),
          h('button', { class: 'btn', id: 'btnRvNext', title: '次の場面', onclick: () => step(1) }, '⏭')),
        h('div', { class: 'row rvspeed', id: 'rvSpeed' }, h('b', null, '速さ'),
          SPEEDS.map((x) => h('button', { class: 'btn small' + (speed() === x ? ' on' : ''), dataset: { speed: String(x) }, 'aria-pressed': String(speed() === x), onclick: () => setSpeed(x) }, x + '倍'))));
      // 動画
      const cams = camVideos();
      E.srcBox.innerHTML = '';
      E.srcBox.append(h('div', { class: 'row' }, h('b', null, '動画'),
        cams.map((v) => h('button', { class: 'btn small' + (R.src && R.src.vid === v.vid ? ' on' : ''), dataset: { rvvid: v.vid }, onclick: () => useCam(v) }, `📹 動画${v.n}（${ST.fmtTime(v.duration || 0)}）`)),
        h('button', { class: 'btn small' + (R.src && R.src.kind === 'file' ? ' on' : ''), id: 'btnRvFile', onclick: pickFile }, R.src && R.src.kind === 'file' ? `📂 ${R.src.name}` : '📂 試合の動画を選ぶ')));
      if (!R.src) E.srcBox.append(h('p', { class: 'note' }, cams.length ? '' : 'この試合は撮影しながら記録していません。スマホ・ビデオカメラで撮った試合の動画を選ぶと、1か所だけ時刻を合わせて見返せます。'));
      else if (R.src.kind === 'cam') E.srcBox.append(h('p', { class: 'note ok', id: 'rvSyncOk' }, `✓ 撮影しながら記録した動画なので、時刻はぴったり合っています（記録の 0:00 ＝ 動画の ${ST.fmtTime(Math.max(0, R.offset), 1)}）`));
      else if (R.offset != null) E.srcBox.append(h('div', { class: 'rv-sync ok', id: 'rvSyncOk' }, h('p', { class: 'note' }, `✓ 時刻を合わせています（記録の 0:00 ＝ 動画の ${ST.fmtTime(Math.max(0, R.offset), 1)}）。ずれていたら：`),
        h('div', { class: 'row' }, [-1, -0.5, 0.5, 1].map((d) => h('button', { class: 'btn small', dataset: { nudge: String(d) }, onclick: () => nudge(d) }, (d > 0 ? '+' : '−') + Math.abs(d) + '秒')),
          h('button', { class: 'btn small', onclick: () => { R.offset = null; draw(); } }, '合わせ直す'))));
      else E.srcBox.append(syncCard());
      // 右側：絞り込み・長さ・一覧
      E.side.innerHTML = '';
      if (R.offset == null) { E.side.append(h('p', { class: 'note' }, R.src ? '時刻を合わせると、記録した場面が並びます。' : '動画を選ぶと、記録した場面が並びます。')); drawNow(); return; }
      const all = scenes(true);
      const list = scenes();
      E.side.append(filters(all), winBox(), h('button', { class: 'btn primary huge', id: 'btnRvAll', disabled: !list.length, onclick: playAll }, `▶ 続けて再生（${list.length}場面）`));
      E.side.append(list.length ? h('div', { class: 'rvlist' }, list.map((c, i) => h('button', { class: 'rvrow', dataset: { id: c.e.id }, style: { '--tc': c.e.team === 0 || c.e.team === 1 ? g.teams[c.e.team].color : 'var(--line2)' }, onclick: () => playOne(c) },
        h('span', { class: 'ix' }, String(i + 1)), h('span', { class: 'rvt' }, h('b', null, c.label), h('small', null, `${c.when}・動画 ${ST.fmtTime(c.v)}（${ST.fmtTime(c.t0)}〜${ST.fmtTime(c.t1)}）`)), h('i', { class: 'rvgo' }, '▶'))))
        : h('p', { class: 'note' }, all.length ? 'この絞り込みの場面はありません。' : 'この動画の中に、記録した場面がありません（動画と記録の時刻を確かめてください）。'));
      drawNow();
    }
    /* あとで選んだ動画の時刻あわせ */
    function syncCard() {
      const g = R.game;
      const cand = ST.sorted(g).filter((e) => { const d = ST.typeOf(g, e.type) || {}; return d.kind !== 'adj'; });
      const startEv = cand.find((e) => e.t === 0) || cand[0];
      const sel = h('select', { class: 'rvsel', id: 'rvSyncSel' }, cand.slice(0, 300).map((e) => h('option', { value: e.id, selected: e === startEv }, `${ST.fmtTime(e.t)}　${ST.eventText(g, e, true)}${e.t === 0 ? '（スタート）' : ''}`)));
      return h('div', { class: 'rv-sync', id: 'rvSync' },
        h('b', null, '時刻を合わせる（1か所だけ）'),
        h('p', { class: 'note' }, `動画を、記録のどれかの瞬間（ふつうは${sport().start || 'スタート'}）で止めてから、その記録を選んで「ここに合わせる」。ほかの場面は全部、同じだけずらして並べます。`),
        h('div', { class: 'row' }, sel, h('button', { class: 'btn primary', id: 'btnRvSync', onclick: () => { const e = ST.findEvent(g, sel.value); if (e) syncAt(e); } }, 'いまの位置に合わせる')));
    }
    function filters(all) {
      const g = R.game, sp = sport(), f = R.filter;
      const count = (fn) => all.filter(fn).length;
      const types = [];
      all.forEach((c) => { if (!types.includes(c.e.type)) types.push(c.e.type); });
      const anyCard = all.some((c) => isCard(c.e, c.d));
      const tchip = (id, lab, n) => h('button', { class: 'fchip' + ((f.types == null ? id === 'all' : f.types.includes(id)) ? ' on' : ''), dataset: { rvtype: id }, onclick: () => {
        if (id === 'all') f.types = null;
        else { const cur = f.types || []; f.types = cur.includes(id) ? cur.filter((x) => x !== id) : cur.concat([id]); if (!f.types.length) f.types = null; }
        stop(); draw();
      } }, lab, n != null ? h('small', null, String(n)) : null);
      const box = h('div', { class: 'rv-filter' });
      box.append(h('div', { class: 'frow' }, h('span', { class: 'flab' }, '場面'),
        tchip('all', 'すべて', all.length),
        types.map((t) => { const d = sp.TYPE[t]; return tchip(t, d.short || d.label.replace(/（.*$/, ''), count((c) => c.e.type === t)); }),
        anyCard ? tchip('*card', 'カード', count((c) => isCard(c.e, c.d))) : null));
      if (sp.hasTeams) {
        box.append(h('div', { class: 'frow' }, h('span', { class: 'flab' }, 'チーム'),
          [0, 1].map((tm) => h('button', { class: 'fchip' + (f.teams[tm] !== false ? ' on' : ''), dataset: { rvteam: String(tm) }, onclick: () => { f.teams[tm] = f.teams[tm] === false; stop(); draw(); } }, h('i', { class: 'chip', style: { background: g.teams[tm].color } }), ST.teamName(g, tm))),
          all.some((c) => c.e.team == null) ? h('button', { class: 'fchip' + (f.teams[2] !== false ? ' on' : ''), dataset: { rvteam: '2' }, onclick: () => { f.teams[2] = f.teams[2] === false; stop(); draw(); } }, 'チームなし') : null));
        const ps = [];
        all.forEach((c) => { if (c.e.team != null && c.e.no != null) { const k = c.e.team + ':' + c.e.no; if (!ps.includes(k)) ps.push(k); } });
        ps.sort((a, b) => (Number(a.split(':')[0]) - Number(b.split(':')[0])) || ST.cmpNo(a.split(':')[1], b.split(':')[1]));
        if (ps.length) box.append(h('div', { class: 'frow' }, h('span', { class: 'flab' }, '選手'),
          h('button', { class: 'fchip' + (!f.players.length ? ' on' : ''), dataset: { rvplayer: 'all' }, onclick: () => { f.players = []; stop(); draw(); } }, '全員'),
          ps.map((k) => { const [tm, no] = k.split(':'); const nm = ST.playerName(g, Number(tm), no); return h('button', { class: 'fchip' + (f.players.includes(k) ? ' on' : ''), dataset: { rvplayer: k }, onclick: () => { f.players = f.players.includes(k) ? f.players.filter((x) => x !== k) : f.players.concat([k]); stop(); draw(); } },
            h('i', { class: 'chip', style: { background: g.teams[Number(tm)].color } }), '#' + no + (nm ? ' ' + nm : ''), h('small', null, String(count((c) => c.e.team === Number(tm) && c.e.no === no)))); })));
      }
      return box;
    }
    /* 場面の長さ（前・後の秒数） */
    function winBox() {
      const W = winOf();
      const groups = ['shot', 'mark', 'other'].filter((k) => scenes(true).some((c) => c.grp === k));
      // スマホ縦では、はじめはたたむ（いまの秒数は見出しに出す）。開け閉めは、選び直しても覚えておく
      if (R.winOpen == null) R.winOpen = !narrow();
      const now = groups.map((k) => `${groupLabel(k).replace(/（.*$/, '')} ${W[k][0]}秒前〜${W[k][1]}秒後`).join('・');
      const box = h('details', { class: 'rv-win', id: 'rvWin', open: R.winOpen }, h('summary', null, h('b', null, '場面の長さ（前と後の秒数）'), h('small', { class: 'winnow' }, now)));
      box.addEventListener('toggle', () => { R.winOpen = box.open; });
      groups.forEach((k) => {
        box.append(h('div', { class: 'winrow', dataset: { grp: k } }, h('b', null, groupLabel(k)),
          h('div', { class: 'row' }, h('span', { class: 'note' }, '前'), BEFORE.map((x) => h('button', { class: 'btn small' + (W[k][0] === x ? ' on' : ''), dataset: { wb: k + ':' + x }, onclick: () => setWin(k, 0, x) }, x + '秒'))),
          h('div', { class: 'row' }, h('span', { class: 'note' }, '後'), AFTER.map((x) => h('button', { class: 'btn small' + (W[k][1] === x ? ' on' : ''), dataset: { wa: k + ':' + x }, onclick: () => setWin(k, 1, x) }, x + '秒')))));
      });
      return box;
    }

    return { render, close, scenes, reelOf, winOf, setSpeed, setWin, playAll, playOne, syncAt, nudge, useFile, R };
  }

  ST.review = { create, SPEEDS, DEF_WIN };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sp/team.js */
/* スポーツ タップ記録 — チームの行で記録する種目（サッカー・フットサル・ハンドボール・ラグビー）。画面を持たない部分
   記録の画面は、バスケ タップ記録と同じ「選手1人＝1行」。行のボタンを1回押せば、その選手のプレーとして時刻つきで残る。
   種目ごとに違うのは、ボタン（得点の種類・ミス・カード）と、試合の進み方（前半・後半・延長・PK戦）・一時退場・累積ファウル。

   ■ この種目たちの記録（core.js の形に足すもの）
     type 'period'：ピリオド（前半・後半…）の始まり { period }。'pend'：その終わり { period }（ハーフタイムの間は時計を止めて見せる）
     ピリオドの番号：1 前半・2 後半・3 延長前半・4 延長後半・9 PK戦（7mTC）
     その時刻のピリオドは「その時刻より前の、いちばん新しい 'period'」（periodAt）。始めた時刻を直せば、それより後の記録は全部そのピリオドになる。
   ■ 時計
     画面の時計は「いまのピリオドが始まってからの時間」（サッカーの「前半 23 分」と同じ）。前半の長さ（opts.len 分）を過ぎると「40+1:23」。
     記録の t は、どれも「スタートからの秒」（止まらない。動画と合わせられる）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const SO = 9;                // PK戦・7mTC のピリオドの番号

  /* ---------- ボタンの色（どの種目も同じ考え：得点は緑系・ミスは白地にふち・カードは黄と赤） ---------- */
  const C = { goal: '#15803d', shot: '#0f766e', ast: '#1d4ed8', foul: '#a16207', yc: '#eab308', rc: '#dc2626', save: '#7c3aed', tf: '#c2410c', set: '#475569', try: '#15803d', con: '#0e7490', pg: '#7c3aed', dg: '#b45309', tackle: '#1d4ed8', pen: '#a16207', so: '#15803d' };

  /* 共通の記録 */
  const COMMON = [
    { id: 'period', label: 'ピリオド開始', meta: true, noTeam: true, kind: 'meta' },
    { id: 'pend', label: 'ピリオド終了', meta: true, noTeam: true, kind: 'meta' },
    { id: 'mark', btn: '★ あとで見る', label: '★ あとで見る', kind: 'mark', global: true },
    { id: 'sog', btn: '成功', label: '成功', kind: 'made', col: C.so, so: true },
    { id: 'sox', btn: '×', label: '失敗', kind: 'miss', col: C.so, so: true, of: 'sog' }
  ];

  /* ピリオドの名前 */
  function periodName(sp, p) {
    if (p === SO) return sp.shootout || 'PK戦';
    return sp.periodNames[p - 1] || `第${p}ピリオド`;
  }
  /* ピリオドの長さ（秒）。1・2 は opts.len 分、3・4（延長）は opts.elen 分。PK戦は時計なし */
  function periodLen(sp, game, p) {
    if (p === SO) return 0;
    const o = game.opts || {};
    return (p <= 2 ? o.len : o.elen || 0) * 60;
  }

  /* ---------- ピリオド（記録から計算する） ---------- */
  /* ピリオドの並び：[{ p, start, end（終わっていなければ null） }]（始まった順） */
  function periods(game) {
    const list = [];
    ST.sorted(game).forEach((e) => {
      if (e.type === 'period') list.push({ p: e.period, start: e.t, end: null, id: e.id });
      else if (e.type === 'pend') { const cur = list[list.length - 1]; if (cur && cur.end == null && e.t >= cur.start) cur.end = e.t; }
    });
    return list;
  }
  /* 記録ごとのピリオド（Map：記録の id → ピリオド）。時刻の順に見ていくので、同じ時刻のときは「足した順」で決まる
     （前半の最後のファウルと、後半の始まりが同じ秒でも、ファウルは前半） */
  function periodMap(game) {
    const m = new Map();
    let p = 1;
    ST.sorted(game).forEach((e) => { if (e.type === 'period') p = e.period; m.set(e.id, p); });
    return m;
  }
  function periodAt(game, t) {
    let p = 1, best = -Infinity;
    (game.events || []).forEach((e) => { if (e.type === 'period' && e.t <= t + 1e-9 && e.t >= best) { best = e.t; p = e.period; } });
    return p;
  }
  /* いまの時計：{ p, name, sec（ピリオドが始まってからの秒）, len, over（長さを過ぎた秒）, ended（ピリオドが終わっている）} */
  function clockAt(sp, game, t) {
    const ps = periods(game).filter((x) => x.start <= t + 1e-9);
    const cur = ps[ps.length - 1];
    if (!cur) return { p: game.startPeriod || 1, name: periodName(sp, game.startPeriod || 1), sec: 0, len: periodLen(sp, game, 1), over: 0, ended: false, before: true };
    const ended = cur.end != null && cur.end <= t + 1e-9;
    const sec = Math.max(0, (ended ? cur.end : t) - cur.start);
    const len = periodLen(sp, game, cur.p);
    return { p: cur.p, name: periodName(sp, cur.p), sec, len, over: len && sec > len ? sec - len : 0, ended };
  }
  /* 試合が進んでいた時間（ピリオドの間だけ。ハーフタイムは数えない）。一時退場の残り時間に使う */
  function playTime(game, t) {
    let s = 0;
    periods(game).forEach((x) => { if (x.p === SO) return; const a = x.start, b = x.end == null ? t : Math.min(x.end, t); if (b > a) s += b - a; });
    return s;
  }

  /* ---------- フリーキックのカード ----------
     フリーキック（type に detail: 'fk'）には、直接・間接（fk: 'd' | 'i'）と、反則した側へのカード（card: 'n' なし | 'y' イエロー | 'r' レッド、cno: 背番号）を持てる。
     フリーキックを蹴るのは e.team、カードをもらうのは相手（1 − e.team）。退場の数え方・集計では、カードを1つの記録として足して数える */
  function withCards(sp, game) {
    const out = [];
    ST.sorted(game).forEach((e) => {
      out.push(e);
      const d = sp.TYPE[e.type];
      if (d && d.detail === 'fk' && (e.card === 'y' || e.card === 'r') && (e.team === 0 || e.team === 1) && sp.TYPE[e.card === 'y' ? 'yc' : 'rc']) {
        out.push({ id: e.id + 'c', t: e.t, type: e.card === 'y' ? 'yc' : 'rc', team: 1 - e.team, no: e.cno != null ? String(e.cno) : null, fromFk: e.id });
      }
    });
    return out;
  }
  function fkText(sp, e) {
    const kind = e.fk === 'i' ? '間接' : e.fk === 'd' ? '直接' : '';
    const card = e.card === 'y' ? 'イエロー' : e.card === 'r' ? 'レッド' : '';
    return `フリーキック${kind ? '（' + kind + '）' : ''}${card ? `・${card}${e.cno != null ? ' #' + e.cno : ''}` : ''}`;
  }

  /* ---------- 一時退場・退場 ---------- */
  /* t の時点で：outs（もう出られない選手 'チーム:番号'）, susp（一時退場中 [{ team, no, rem, label }]）, short（チームごとの人数の少なさ） */
  function penalties(sp, game, t) {
    const now = playTime(game, t);
    const outs = new Set(), susp = [];
    const cnt = {};
    withCards(sp, game).forEach((e) => {
      if (e.t > t + 1e-9 || e.team == null) return;
      const d = sp.TYPE[e.type];
      if (!d || !(d.susp || d.suspOpt || d.out || d.teamSusp || d.yellow)) return;
      const key = e.team + ':' + (e.no == null ? '' : e.no);
      cnt[key] = cnt[key] || { yc: 0, susp: 0 };
      if (d.yellow) cnt[key].yc++;
      const dsusp = d.susp || (d.suspOpt ? ((game.opts || {})[d.suspOpt] || 0) * 60 : 0);    // ラグビーのシンビン：試合の形式の長さ
      if (dsusp) cnt[key].susp++;
      let out = !!d.out;
      if (sp.twoYellowOut && d.yellow && cnt[key].yc >= 2) out = true;           // サッカー：警告 2 回で退場
      if (sp.suspOut && dsusp && cnt[key].susp >= sp.suspOut) out = true;        // ハンドボール：3 回目の 2 分間退場で失格
      if (out && e.no != null) outs.add(key);
      const dur = dsusp || d.teamSusp || (out && sp.outTeamSusp) || 0;
      if (dur) {
        const rem = dur - (now - playTime(game, e.t));
        if (rem > 0) susp.push({ team: e.team, no: e.no, rem, label: d.short || d.label, id: e.id });
      }
    });
    const short = [0, 0];
    susp.forEach((x) => { short[x.team]++; });
    // 退場（ずっと出られない）で、チームの人数が試合の終わりまで減る種目（サッカー・ラグビーのレッド）
    if (sp.redShort) outs.forEach((k) => { const tm = Number(k.split(':')[0]); if (!susp.some((x) => x.team === tm && k === tm + ':' + x.no)) short[tm]++; });
    return { outs, susp, short };
  }

  /* ---------- 累積ファウル（フットサル） ---------- */
  /* ピリオドごとのチームファウル Map(ピリオド → [自分, 相手])。carry：後半の数を延長にも続ける */
  function teamFouls(sp, game) {
    const tf = sp.teamFoul;
    const map = new Map();
    if (!tf) return map;
    const pm = periodMap(game);
    (game.events || []).forEach((e) => {
      if (e.type !== tf.type || (e.team !== 0 && e.team !== 1)) return;
      let p = pm.get(e.id);
      if (p === SO) return;
      if (tf.carry && p > 2) p = 2;
      if (!map.has(p)) map.set(p, [0, 0]);
      map.get(p)[e.team]++;
    });
    return map;
  }
  function foulsNow(sp, game, t) {
    const tf = sp.teamFoul;
    if (!tf) return null;
    let p = periodAt(game, t);
    if (tf.carry && p > 2) p = 2;
    return (teamFouls(sp, game).get(p) || [0, 0]).slice();
  }

  /* ---------- 得点 ---------- */
  function score(game) {
    const sp = ST.sportOf(game);
    const s = [0, 0];
    (game.events || []).forEach((e) => { const d = sp.TYPE[e.type]; if (d && d.pts && (e.team === 0 || e.team === 1)) s[e.team] += d.pts; });
    return s;
  }
  function shootout(game) {
    const s = [0, 0], a = [0, 0];
    (game.events || []).forEach((e) => { if ((e.type === 'sog' || e.type === 'sox') && (e.team === 0 || e.team === 1)) { a[e.team]++; if (e.type === 'sog') s[e.team]++; } });
    return a[0] + a[1] ? s : null;
  }
  function scoreText(game) {
    const sp = ST.sportOf(game);
    const s = score(game), so = shootout(game);
    return `${s[0]} − ${s[1]}` + (so ? `（${sp.shootoutShort || 'PK'} ${so[0]}−${so[1]}）` : '');
  }

  /* ---------- 行のボタン ---------- */
  /* 選手の行に並ぶ種類（いつもある base ＋ 設定で選んだもの。並びは rowOrder）。PK戦の間は「成功」「×」だけ */
  function rowTypes(sp, sprefs, p) {
    if (p === SO) return ['sog', 'sox'];
    const on = new Set(sp.base);
    (sp.toggles || []).forEach((tg) => { if (!tg.row && isOn(sprefs, tg)) (tg.types || []).forEach((x) => on.add(x)); });
    return sp.rowOrder.filter((x) => on.has(x));
  }
  /* 設定で選ぶ種類（row：'team' チームの行・'global' 画面の下）：その種類を入れた設定がどれも「使わない」なら出さない。設定に入っていない種類はいつも出す */
  function chosen(sp, sprefs, list, row) {
    const tgs = (sp.toggles || []).filter((x) => x.row === row);
    return (list || []).filter((type) => { const mine = tgs.filter((x) => (x.types || []).includes(type)); return !mine.length || mine.some((x) => isOn(sprefs, x)); });
  }
  /* チームの行（チームとしての記録：CK・FK・タイムアウト…）。設定で消せる。PK戦の間はなし */
  function teamTypes(sp, sprefs, p) {
    if (p === SO || !sp.teamTypes || !sp.teamTypes.length) return [];
    return chosen(sp, sprefs, sp.teamTypes, 'team');
  }
  /* 画面の下の、いつでも押せるボタン（★ あとで見る など） */
  function globalTypes(sp, sprefs) { return chosen(sp, sprefs, sp.globalTypes || [], 'global'); }
  function isOn(sprefs, tg) { const r = (sprefs && sprefs.rows) || {}; return r[tg.key] != null ? !!r[tg.key] : !!tg.def; }
  const WEIGHT = (sp, id) => ((sp.TYPE[id] || {}).kind === 'miss' ? 0.75 : 1);
  /* 一覧で直すときに選べる種類 */
  function editTypes(sp, game, e, sprefs) {
    const d = sp.TYPE[e.type] || {};
    if (d.so) return ['sog', 'sox'];
    const ids = [];
    const add = (x) => { if (!ids.includes(x) && sp.TYPE[x]) ids.push(x); };
    rowTypes(sp, sprefs, 1).forEach(add);
    teamTypes(sp, sprefs, 1).forEach(add);
    (sp.globalTypes || []).forEach(add);
    if (!ids.includes(e.type)) add(e.type);
    return ids;
  }

  /* ---------- 集計 ---------- */
  /* 選手ごと：[{ team, rows: [{ no, name, c（種類 → 回数）, pts }], unknown: { c, pts }, teamRow: { c }, total: { c, pts } }] */
  function stats(game) {
    const sp = ST.sportOf(game);
    return [0, 1].map((tm) => {
      const team = game.teams[tm] || ST.blankTeam(tm);
      const byNo = new Map();
      const blank = () => ({ c: {}, pts: 0 });
      team.players.forEach((p) => byNo.set(p.no, Object.assign({ no: p.no, name: p.name }, blank())));
      const unknown = blank(), total = blank();
      withCards(sp, game).forEach((e) => {
        const d = sp.TYPE[e.type];
        if (!d || d.meta || e.team !== tm) return;
        let s = unknown;
        if (e.no != null) {
          if (!byNo.has(e.no)) byNo.set(e.no, Object.assign({ no: e.no, name: '', extra: true }, blank()));
          s = byNo.get(e.no);
        }
        [s, total].forEach((x) => {
          x.c[e.type] = (x.c[e.type] || 0) + 1;
          x.pts += d.pts || 0;
          if (d.detail === 'fk' && e.fk) { const k = e.fk === 'i' ? 'fki' : 'fkd'; x.c[k] = (x.c[k] || 0) + 1; }      // 直接・間接の数
        });
      });
      const rows = Array.from(byNo.values()).sort((a, b) => ST.cmpNo(a.no, b.no));
      return { team: tm, rows, unknown, total };
    });
  }
  /* 集計の表の列：{ key, label, n（数える種類）, a（打った数に入れる種類。あれば「成功/打った数」）, pts（得点） }。記録のある列だけ出す */
  function colValue(col, s) {
    if (col.pts) return s.pts ? String(s.pts) : '';
    if (col.f) { const v = col.f(s); return v ? String(v) : ''; }
    const n = (col.n || []).reduce((m, t) => m + (s.c[t] || 0), 0);
    if (col.a) { const a = col.a.reduce((m, t) => m + (s.c[t] || 0), 0); return a ? `${n}/${a}` : ''; }
    return n ? String(n) : '';
  }
  function usedCols(sp, st) {
    return sp.cols.filter((col) => col.pts || st.some((x) => colValue(col, x.total) !== ''));
  }
  const isEmpty = (s) => !Object.keys(s.c).length;
  /* ピリオドごとの得点 [{ p, label, pts: [自分, 相手] }]（PK戦は入れない） */
  function periodScores(game) {
    const sp = ST.sportOf(game);
    const map = new Map();
    const get = (p) => { if (!map.has(p)) map.set(p, { p, label: periodName(sp, p), pts: [0, 0] }); return map.get(p); };
    const pm = periodMap(game);
    (game.events || []).forEach((e) => {
      if (e.type === 'period') { if (e.period !== SO) get(e.period); return; }
      const d = sp.TYPE[e.type];
      if (!d || d.meta || d.so) return;
      const p = pm.get(e.id);
      if (p === SO) return;
      const row = get(p);
      if (d.pts && e.team != null) row.pts[e.team] += d.pts;
    });
    if (!map.size) get(1);
    return Array.from(map.values()).sort((a, b) => a.p - b.p);
  }

  /* ---------- 名前・CSV ---------- */
  function eventText(game, e, withTeam) {
    const sp = ST.sportOf(game);
    if (e.type === 'period') return `${periodName(sp, e.period)} 開始`;
    if (e.type === 'pend') return `${periodName(sp, e.period)} 終了`;
    return null;
  }
  function typeLabel(game, e) {
    const sp = ST.sportOf(game);
    const d = sp.TYPE[e.type];
    if (!d) return e.type;
    if (d.so) return `${sp.shootout || 'PK戦'} ${d.label}`;
    if (d.detail === 'fk') return fkText(sp, e);
    return d.label;
  }
  /* ピリオドの時間の呼び名：「前半 23:41」「後半 40+1:05」 */
  function clockText(sp, game, t) {
    const c = clockAt(sp, game, t);
    if (c.p === SO) return c.name;
    return `${c.name} ${c.over ? Math.round(c.len / 60) + '+' + ST.fmtTime(c.over) : ST.fmtTime(c.sec)}`;
  }
  function csvEvents(game) {
    const sp = ST.sportOf(game);
    const rows = [['No', '時刻', 'スタートからの秒', 'ピリオド', 'ピリオドの時間', 'チーム', '背番号', '名前', '記録', '得点', `${ST.teamName(game, 0)}の得点`, `${ST.teamName(game, 1)}の得点`]];
    const s = [0, 0];
    let n = 0;
    const pm = periodMap(game);
    ST.sorted(game).forEach((e) => {
      const d = sp.TYPE[e.type] || { label: e.type };
      if (d.meta) { rows.push(['', ST.fmtTime(e.t), e.t, periodName(sp, e.period), '', '', '', '', eventText(game, e), '', s[0], s[1]]); return; }
      if (e.team != null && d.pts) s[e.team] += d.pts;
      const c = clockAt(sp, game, e.t);
      const ct = c.p === SO ? '' : c.over ? Math.round(c.len / 60) + '+' + ST.fmtTime(c.over) : ST.fmtTime(c.sec);
      rows.push([++n, ST.fmtTime(e.t), e.t, periodName(sp, pm.get(e.id)), ct, ST.teamName(game, e.team), e.no != null ? e.no : '', e.no != null ? ST.playerName(game, e.team, e.no) : '', typeLabel(game, e), d.pts || '', s[0], s[1]]);
    });
    return rows;
  }
  function csvBox(game) {
    const sp = ST.sportOf(game);
    const st = stats(game);
    const cols = sp.cols.concat(sp.shootout ? [{ key: 'so', label: sp.shootout, n: ['sog'], a: ['sog', 'sox'] }] : []);
    const rows = [['チーム', '背番号', '名前'].concat(cols.map((c) => c.label))];
    st.forEach((x) => {
      const name = ST.teamName(game, x.team);
      x.rows.forEach((r) => rows.push([name, r.no, r.name].concat(cols.map((c) => colValue(c, r)))));
      if (!isEmpty(x.unknown)) rows.push([name, '番号なし・チーム', ''].concat(cols.map((c) => colValue(c, x.unknown))));
      rows.push([name, '合計', ''].concat(cols.map((c) => colValue(c, x.total))));
    });
    return rows;
  }

  /* ---------- 種目をつくる ---------- */
  function teamSport(def) {
    const sp = Object.assign({
      family: 'team', prec: 10, hasTeams: true, periodNames: ['前半', '後半', '延長前半', '延長後半'], SO,
      globalTypes: ['mark']
    }, def);
    sp.TYPES = COMMON.filter((c) => !def.TYPES.some((d) => d.id === c.id)).concat(def.TYPES);      // 種目の側で同じ id を書けば、そちらを使う
    sp.TYPE = {};
    sp.TYPES.forEach((d) => { sp.TYPE[d.id] = d; });
    sp.defaultOpts = () => Object.assign({ len: def.lenDefault, elen: def.elenDefault }, def.moreOpts ? def.moreOpts() : {});
    sp.optFields = [
      { key: 'len', label: `${sp.periodNames[0]}・${sp.periodNames[1]}の長さ`, choices: def.lenChoices.map((m) => [m, `${m}分`]), note: def.lenNote },
      { key: 'elen', label: '延長の長さ（1本）', choices: def.elenChoices.map((m) => [m, `${m}分`]) }
    ].concat(def.moreFields || []);
    sp.onStart = (game) => { ST.addEvent(game, { t: 0, type: 'period', period: game.startPeriod || 1 }); delete game.startPeriod; };
    sp.periodName = (p) => periodName(sp, p);
    sp.periodLen = (game, p) => periodLen(sp, game, p);
    sp.periods = periods; sp.periodAt = periodAt; sp.periodMap = periodMap;
    sp.clockAt = (game, t) => clockAt(sp, game, t);
    sp.clockText = (game, t) => clockText(sp, game, t);
    sp.playTime = playTime;
    sp.penalties = (game, t) => penalties(sp, game, t);
    sp.teamFouls = (game) => teamFouls(sp, game);
    sp.foulsNow = (game, t) => foulsNow(sp, game, t);
    sp.score = score; sp.soScore = shootout; sp.scoreText = scoreText;
    sp.rowTypes = (sprefs, p) => rowTypes(sp, sprefs, p);
    sp.teamTypesOf = (sprefs, p) => teamTypes(sp, sprefs, p);
    sp.globalTypesOf = (sprefs) => globalTypes(sp, sprefs);
    sp.withCards = (game) => withCards(sp, game);
    sp.fkText = (e) => fkText(sp, e);
    sp.isOn = (sprefs, key) => { const tg = (sp.toggles || []).find((x) => x.key === key); return tg ? isOn(sprefs, tg) : false; };
    sp.weight = (id) => WEIGHT(sp, id);
    sp.editTypes = (game, e, sprefs) => editTypes(sp, game, e, sprefs);
    sp.stats = stats; sp.colValue = colValue; sp.usedCols = (st) => usedCols(sp, st); sp.isEmpty = isEmpty;
    sp.periodScores = periodScores;
    sp.eventText = eventText; sp.typeLabel = typeLabel;
    sp.csvEvents = csvEvents; sp.csvBox = csvBox;
    sp.cleanEvent = (e) => {
      if (e.type === 'period' || e.type === 'pend') return isFinite(e.period) && e.period >= 1 ? { period: Math.min(SO, Math.round(e.period)) } : null;
      if ((sp.TYPE[e.type] || {}).detail === 'fk') {
        const o = {};
        if (e.fk === 'd' || e.fk === 'i') o.fk = e.fk;
        if (e.card === 'y' || e.card === 'r' || e.card === 'n') o.card = e.card;
        const cno = e.cno != null ? ST.normNo(e.cno) : null;
        if (cno != null) o.cno = cno;
        return o;
      }
      return {};
    };
    sp.keepFirst = true;               // スタートの記録（前半の始まり）は、取り消し・消すができない（時刻は直せる）
    sp.startHint = `${def.start || 'キックオフ'}（試合開始）の瞬間`;
    sp.timeText = (game, e) => ((sp.TYPE[e.type] || {}).meta ? ST.fmtTime(e.t) : clockText(sp, game, e.t));
    sp.whoText = (game, e) => {
      if (e.team == null) return 'チームなし';
      const nm = e.no != null ? ST.playerName(game, e.team, e.no) : '';
      return `${ST.teamName(game, e.team)} ${e.no != null ? '#' + e.no + (nm ? ' ' + nm : '') : (sp.teamTypes || []).includes(e.type) ? '（チーム）' : '番号なし'}`;
    };
    const first = (sp.TYPE[sp.base[0]] || {}).btn || '';
    sp.steps = def.steps || [
      ['チームと背番号を選ぶ', '「' + sp.presets[0][0] + '」などのボタンでまとめて。自分のチームは次から自動で入ります。相手の背番号は入れなくても大丈夫です（チームの1行になります）'],
      [`${def.start || 'キックオフ'}で ▶ スタート`, '時計（前半が始まってからの時間）が動き出します'],
      ['選手の行のボタンを1回タップ', `「10」の行の「${first}」を押すだけ。押した瞬間の時刻で残ります`],
      ['前半が終わったら「前半」→「前半を終える」', '後半の始まりで「後半を始める」。延長' + (sp.shootout ? `・${sp.shootout}` : '') + 'も同じところから']
    ];
    sp.help = [['記録の画面', [
      '選手の行：背番号の小さい順に上から並びます。行のボタンを押すと、その選手の記録になります（ボタンの右上の小さな数は、その選手の回数）',
      '「？」の行：だれか分からないとき。チームの記録になります（あとで一覧から番号を付けられます）',
      sp.teamTypes && sp.teamTypes.length ? `「チーム」の行：${sp.teamTypes.map((x) => sp.TYPE[x].label).join('・')}など、チームとしての記録` : null,
      '画面の下の「★ あとで見る」：だれのかは決めずに、時刻だけを残します。あとで動画で見返すときの目印に',
      `ボタンを足す：「≡ メニュー」→「設定」で、${(sp.toggles || []).filter((x) => x.row !== 'team').map((x) => x.label.replace(/（.*$/, '')).join('・')}のボタンを出せます`,
      '名簿にない背番号は、チームの帯の「＋番号」で足せます'
    ].filter(Boolean)], ['時計とピリオド', [
      `時計は「いまのピリオドが始まってからの時間」です。${sp.periodNames[0]}の長さを過ぎると「40+1:23」のように、過ぎた時間が出ます`,
      `時計の右の「${sp.periodNames[0]}」を押して「${sp.periodNames[0]}を終える」「${sp.periodNames[1]}を始める」。押し忘れても、あとで一覧で時刻を直せます`,
      sp.shootout ? `${sp.shootout}：「${sp.periodNames[1]}」または「延長後半」から「${sp.shootout}を始める」。選手の行のボタンが「成功」「×」に変わり、得点の横に結果が出ます` : null,
      'ハーフタイムの間も、記録の時刻（スタートからの時間）は止まらずに進みます（動画と同じ時間の流れ）'
    ].filter(Boolean)]].concat(def.moreHelp || []);
    sp.exportExtra = (game, g) => {
      g.periodNames = {};
      [1, 2, 3, 4, SO].forEach((p) => { g.periodNames[p] = periodName(sp, p); });
      const pm = periodMap(game);
      g.events.forEach((e) => { if (e.type !== 'period' && e.type !== 'pend') e.period = pm.get(e.id); });
      const so = shootout(game);
      if (so) g.shootout = so;
    };
    return ST.addSport(sp);
  }
  ST.teamSport = teamSport;

  /* ========== サッカー ==========
     ボタンは、使うものを設定で1つずつ選べる（記録用・分析用）。はじめは：
       記録用：ゴール（選手の行）・ゴールキック・フリーキック（直接・間接／カードと背番号）・コーナーキック（チームの行）
       分析用：シュート（何番が打ったか。選手の行）・あとでチェック（画面の下）
     動画で見返すとき（review.js）の場面の長さ：シュート・ゴールは 30 秒前〜5 秒後、あとでチェックは 10 秒前〜10 秒後（設定で変えられる） */
  teamSport({
    id: 'soccer', name: 'サッカー', icon: '⚽', desc: 'ゴールキック・フリーキック（直接・間接・カード）・コーナーキック・シュート・あとでチェック。前半・後半・PK戦。撮影して場面を見返す',
    lenChoices: [45, 40, 35, 30, 25, 20, 15, 12, 10], lenDefault: 40, lenNote: '高校 40 分・中学 30〜35 分・一般 45 分・8人制（小学生）15〜20 分',
    elenChoices: [15, 10, 5], elenDefault: 10,
    shootout: 'PK戦', shootoutShort: 'PK', twoYellowOut: true, redShort: true,
    presets: [['1〜11', '1-11'], ['1〜18', '1-18'], ['1〜20', '1-20'], ['1〜25', '1-25']],
    start: 'キックオフ', camWide: 'ピッチ全体',
    win: { shot: [30, 5], mark: [10, 10], other: [10, 10] },
    TYPES: [
      { id: 'goal', btn: 'ゴール', label: 'ゴール', pts: 1, kind: 'made', col: C.goal, shot: true },
      { id: 'shot', btn: 'シュート', btnShort: 'シュ', label: 'シュート（外れ・止められた）', short: 'シュート', kind: 'miss', col: C.goal, shot: true, of: 'goal' },
      { id: 'ast', btn: 'アシスト', btnShort: 'A', label: 'アシスト', kind: 'good', col: C.ast },
      { id: 'save', btn: 'セーブ', label: 'セーブ（GK）', kind: 'good', col: C.save },
      { id: 'foul', btn: 'ファウル', btnShort: 'F', label: 'ファウル', kind: 'foul', col: C.foul },
      { id: 'yc', btn: '警告', label: 'イエローカード', short: 'イエロー', kind: 'card', col: C.yc, yellow: true },
      { id: 'rc', btn: '退場', label: 'レッドカード', short: 'レッド', kind: 'card', col: C.rc, out: true },
      { id: 'gk', btn: 'ゴールキック', btnShort: 'GK', label: 'ゴールキック', kind: 'set', col: '#0f766e' },
      { id: 'fk', btn: 'フリーキック', btnShort: 'FK', label: 'フリーキック', kind: 'set', col: '#6d28d9', detail: 'fk' },
      { id: 'ck', btn: 'コーナーキック', btnShort: 'CK', label: 'コーナーキック', kind: 'set', col: '#1d4ed8' },
      { id: 'off', btn: 'オフサイド', btnShort: 'OS', label: 'オフサイド', kind: 'set', col: C.set },
      { id: 'mark', btn: '★ あとでチェック', label: '★ あとでチェック', short: 'あとでチェック', kind: 'mark', global: true }
    ],
    base: [],
    rowOrder: ['goal', 'shot', 'ast', 'save', 'foul', 'yc', 'rc'],
    teamTypes: ['gk', 'fk', 'ck', 'off'],
    togglesTitle: 'ボタン（使うものを選ぶ）',
    togglesNote: 'チェックを外したボタンは、記録の画面に出しません（それまでの記録は残ります）。ボタンが少ないほど、1つずつが大きくなります。',
    toggleSecs: [['rec', '記録用（公式の記録・数を数える）'], ['ana', '分析用（自分たちのふり返り・動画で見返す）']],
    toggles: [
      { key: 'goal', sec: 'rec', label: 'ゴール（得点。だれが決めたか）', types: ['goal'], def: true },
      { key: 'gk', sec: 'rec', label: 'ゴールキック', types: ['gk'], row: 'team', def: true },

<script>
/* js/v/team.js */
/* スポーツ タップ記録 — チームの行で記録する種目の画面（サッカー・フットサル・ハンドボール・ラグビー）
   上の帯：時計（いまのピリオドが始まってからの時間）・ピリオド・得点・メニュー
   2つのチーム：選手1人＝1行（背番号＋ボタン）。いちばん下に「？」（だれか分からない）と「チーム」の行（CK・FK・タイムアウトなど）
   下の帯：★ あとで見る（チーム・選手は決めない）・いま記録したもの・取り消す
   並べ方は ST.planLayout（バスケ タップ記録と同じ：画面の大きさと人数から、ボタンがいちばん押しやすいもの）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const { h } = ST.ui;

  function build(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const L = { panels: [], btns: [], gb: {}, rowKey: '' };
    const clock = ctx.ui.clockBtn();
    const startB = ctx.ui.startBtn();
    L.period = h('button', { class: 'period', id: 'btnPeriod', 'aria-label': 'ピリオド', onclick: () => openPeriod(ctx) }, '');
    L.score = [0, 1].map((tm) => h('span', { class: 'sc', id: 'score' + tm, style: { '--tc': g.teams[tm].color, '--tink': ST.inkOn(g.teams[tm].color) } }, '0'));
    L.so = h('span', { class: 'sosc', id: 'soScore', hidden: true });
    const bar = h('header', { class: 'lbar' }, clock.el, startB.el, L.period,
      h('div', { class: 'score', 'aria-label': '得点' }, L.score[0], h('span', { class: 'dash' }, '−'), L.score[1], L.so),
      ctx.ui.menuBtn());
    const P = L.panelsEl = h('main', { class: 'panels' }, [0, 1].map((tm) => buildPanel(tm)));
    const globals = sp.globalTypesOf ? sp.globalTypesOf(ctx.sprefs) : (sp.globalTypes || []);
    L.globals = globals;
    const gl = globals.map((type) => {
      const d = sp.TYPE[type];
      const cnt = h('i', { class: 'cnt', hidden: true });
      const parts = String(d.btn).split(' ');
      const el = h('button', { class: 'gb k-' + d.kind, id: 'btn_' + type, dataset: { gtype: type }, 'aria-label': `${d.label}（チーム・選手は決めない）`, onclick: (e) => ctx.record({ type, team: null, no: null }, e.currentTarget) },
        h('b', null, parts[0]), parts[1] ? h('small', null, parts.slice(1).join(' ')) : null, cnt);
      L.gb[type] = { el, cnt };
      return el;
    });
    const rootEl = h('div', { class: 'live fam-team' }, bar, h('div', { class: 'stagewrap' }, P, ctx.ui.cover()), ctx.ui.footer(gl));
    rootEl.addEventListener('click', (e) => onClick(ctx, L, e));
    L.root = rootEl;

    function buildPanel(tm) {
      const t = g.teams[tm];
      const tsc = h('span', { class: 'tsc' }, '0');
      const fouls = h('span', { class: 'tfoul', hidden: true });
      const short = h('span', { class: 'tshort', hidden: true });
      const head = h('div', { class: 'thead' }, h('b', { class: 'tname' }, ST.teamName(g, tm)), short, fouls, tsc,
        h('button', { class: 'tadd', dataset: { add: '1' }, title: '名簿にない背番号を足す', 'aria-label': `${ST.teamName(g, tm)} の背番号を足す` }, '＋番号'));
      const roster = h('div', { class: 'roster', role: 'group', 'aria-label': `${ST.teamName(g, tm)} の選手` });
      const sec = h('section', { class: 'team', id: 'panel' + tm, dataset: { team: tm }, style: { '--tc': t.color, '--tink': ST.inkOn(t.color) } }, head, roster);
      L.panels[tm] = { sec, head, tsc, fouls, short, roster, n: 0, rows: new Map() };
      return sec;
    }
    const period = () => (g.startedAt ? sp.clockAt(g, ctx.elapsed()).p : (g.startPeriod || 1));
    function rowKey() { return sp.rowTypes(ctx.sprefs, period()).join(',') + '|' + sp.teamTypesOf(ctx.sprefs, period()).join(',') + '|' + g.teams.map((t) => t.players.map((p) => p.no).join('.')).join('/'); }
    function fillAll() {
      L.btns = [];
      [0, 1].forEach((tm) => fillRoster(tm));
      L.rowKey = rowKey();
    }
    /* 選手の行を並べる（名簿・ボタンの組み合わせ・PK戦に入ったときにも呼ぶ） */
    function fillRoster(tm) {
      const Pn = L.panels[tm], pr = ctx.sprefs, p = period();
      Pn.roster.innerHTML = '';
      Pn.rows = new Map();
      L.btns = L.btns.filter((b) => b.team !== tm);
      const types = sp.rowTypes(pr, p), ttypes = sp.teamTypesOf(pr, p);
      // 選手の行のボタンを全部「使わない」にしたときは、選手の行は出さない（チームの行だけ）
      const rows = types.length ? g.teams[tm].players.map((x) => ({ no: x.no, name: x.name })) : [];
      const teamOnly = !g.teams[tm].players.length;
      if (types.length && (pr.unknown !== false || teamOnly)) rows.push({ no: null, name: '' });
      if (ttypes.length) rows.push({ team: true });
      if (!rows.length) rows.push({ none: true });
      Pn.n = rows.length;
      rows.forEach((r) => {
        if (r.none) { Pn.roster.append(h('p', { class: 'note norows' }, '使うボタンがありません（≡ メニュー → 設定）')); return; }
        if (r.team) {
          const row = h('div', { class: 'prow trow', style: { '--tk': ttypes.length } }, h('div', { class: 'pno' }, h('b', null, 'チーム')));
          ttypes.forEach((type) => row.append(btn(tm, null, type, `${ST.teamName(g, tm)} チームの ${sp.TYPE[type].label}`, true)));
          Pn.roster.append(row);
          return;
        }
        const no = r.no == null ? '' : r.no;
        const who = r.no != null ? `${r.no}番${r.name ? ' ' + r.name : ''}` : teamOnly ? 'チーム' : 'だれか（番号なし）';
        const nameEl = r.no != null ? h('small', { class: 'pnm' }, pr.names && r.name ? r.name : '') : teamOnly ? null : h('small', null, 'だれか');
        const row = h('div', { class: 'prow' + (r.no == null ? ' unk' : '') + (teamOnly ? ' teamonly' : ''), dataset: { no } },
          h('div', { class: 'pno' }, h('b', null, r.no != null ? r.no : teamOnly ? 'チーム' : '？'), nameEl, r.no != null ? h('small', { class: 'ptag' }) : null));
        types.forEach((type) => row.append(btn(tm, r.no, type, `${ST.teamName(g, tm)} ${who} ${sp.TYPE[type].label}`)));
        if (r.no != null) Pn.rows.set(r.no, { row, name: r.name, tag: row.querySelector('.ptag'), nm: nameEl });
        Pn.roster.append(row);
      });
    }
    function btn(tm, no, type, aria, teamRow) {
      const d = sp.TYPE[type];
      const cnt = h('i', { class: 'cnt', hidden: true });
      const lab = d.btnShort ? [h('b', { class: 'bl' }, d.btn), h('b', { class: 'bs' }, d.btnShort)] : h('b', null, d.btn);
      const col = d.col || '#475569';
      const el = h('button', { class: 'pb k-' + d.kind + (d.kind === 'miss' ? ' miss' : '') + (d.btn === '×' ? ' x1' : ''), dataset: { type, no: no == null ? '' : no }, style: { '--bc': col, '--bink': ST.inkOn(col) }, 'aria-label': aria }, lab, cnt);
      L.btns.push({ team: tm, type, key: tm + ':' + (no == null ? '' : no) + ':' + type, el, cnt, teamRow: !!teamRow });
      return el;
    }

    /* 画面の大きさに合わせて並べ方を決める */
    function layout() {
      if (!rootEl.isConnected) return;
      rootEl.classList.toggle('short', (rootEl.clientHeight || root.innerHeight) < 430);
      const types = sp.rowTypes(ctx.sprefs, period());
      const weights = types.map((x) => sp.weight(x));
      const spec = ST.rowSpec(weights);
      const n = [L.panels[0].n, L.panels[1].n], headH = L.panels[0].head.offsetHeight || 24;
      const plan = ST.planLayout(P.clientWidth, P.clientHeight, n, headH, spec);
      const cols = weights.map((w) => `minmax(0, ${w}fr)`).join(' ');
      rootEl.classList.toggle('lay-side', plan.arr !== 'stack');
      rootEl.classList.toggle('lay-stack', plan.arr === 'stack');
      L.plan = plan;
      // 上下に重ねるとき：行の少ないチーム（相手の「チーム」の行だけ など）は、その行が楽に押せる高さに決め、残りを多いほうに
      const small = plan.arr === 'stack' ? plan.teams.map((T) => T.r <= 3 && plan.teams.some((o) => o.r > T.r * 2)) : [false, false];
      plan.teams.forEach((T, tm) => {
        const sec = L.panels[tm].sec;
        sec.style.flex = small[tm] ? `0 0 ${Math.ceil(T.base + T.r * Math.min(ST.LAYOUT.rmax, Math.max(T.rowH, 44)))}px` : '';
        const unit = Math.max(ST.LAYOUT.rmin, Math.min(T.bw, T.rowH));
        sec.style.setProperty('--cols', cols);
        sec.style.setProperty('--c', T.c);
        sec.style.setProperty('--r', T.r);
        sec.style.setProperty('--nw', T.nw + 'px');
        sec.style.setProperty('--base', Math.ceil(T.base) + 'px');
        const bf = Math.round(ST.clamp(unit * 0.42, 13, 24));
        sec.style.setProperty('--bf', bf + 'px');
        sec.style.setProperty('--nf', Math.round(ST.clamp(Math.min(Math.max(T.rowH, ST.LAYOUT.rmin) * 0.56, T.nw * 0.5), 14, 30)) + 'px');
        sec.classList.toggle('roomy', T.rowH >= 40 && T.nw >= 46);
        sec.classList.toggle('narrowb', (T.bwMin || T.bw) < 48);
        sec.classList.toggle('scroll', T.rowH < ST.LAYOUT.rmin);
        // ボタンごとの文字の大きさ：その幅に、呼び名（「ゴール」「タイムアウト」）が入る大きさ。小さくなりすぎるときは短い呼び名（btnShort）
        const ttypes = sp.teamTypesOf(ctx.sprefs, period());
        const teamBw = ttypes.length ? (T.cellW - T.nw - ttypes.length * ST.LAYOUT.bgap) / ttypes.length : 0;
        L.btns.filter((b) => b.team === tm).forEach((b) => {
          const d = sp.TYPE[b.type];
          const w = (b.teamRow ? teamBw : T.bw * sp.weight(b.type)) - (d.kind === 'miss' ? 10 : 6);
          let fz = Math.min(bf, Math.floor(w / textEm(d.btn)));
          const useShort = !!d.btnShort && fz < 12;
          if (useShort) fz = Math.min(bf, Math.floor(w / textEm(d.btnShort)));
          b.el.classList.toggle('useshort', useShort);
          b.el.style.setProperty('--fz', Math.max(9, fz) + 'px');
        });
      });
    }

    let lastClock = '', lastPen = '';
    function clockText() {
      if (!g.startedAt) return '0:00';
      const c = sp.clockAt(g, ctx.elapsed());
      if (c.p === sp.SO) return ST.fmtTime(c.sec);
      return c.over ? `${Math.round(c.len / 60)}+${ST.fmtTime(c.over)}` : ST.fmtTime(c.sec);
    }
    function periodText() {
      if (!g.startedAt) return sp.periodName(g.startPeriod || 1);
      const c = sp.clockAt(g, ctx.elapsed());
      if (c.ended) return c.p === 1 ? 'HT' : `${c.name}終了`;
      return c.name;
    }
    /* 退場・一時退場の表示（1 秒ごと） */
    function penaltyView() {
      const t = ctx.elapsed();
      const pen = sp.penalties(g, t);
      const key = JSON.stringify([Array.from(pen.outs), pen.susp.map((x) => [x.team, x.no, Math.ceil(x.rem)]), pen.short]);
      if (key === lastPen) return;
      lastPen = key;
      [0, 1].forEach((tm) => {
        const Pn = L.panels[tm];
        Pn.rows.forEach((r, no) => {
          const s = pen.susp.find((x) => x.team === tm && x.no === no);
          const out = pen.outs.has(tm + ':' + no);
          r.row.classList.toggle('out', out && !s);
          r.row.classList.toggle('susp', !!s);
          r.tag.textContent = s ? ST.fmtTime(s.rem) : out ? '退場' : '';
          if (r.nm) r.nm.hidden = !!(s || out);
        });
        const mine = pen.susp.filter((x) => x.team === tm);
        const n = pen.short[tm];
        Pn.short.hidden = !n;
        if (n) Pn.short.textContent = `−${n}` + (mine.length ? ' ' + ST.fmtTime(Math.min(...mine.map((x) => x.rem))) : '');
      });
    }
    function tick() {
      const s = clockText();
      if (s !== lastClock) { lastClock = s; clock.set(s); const c = g.startedAt ? sp.clockAt(g, ctx.elapsed()) : null; clock.el.classList.toggle('over', !!(c && c.over)); clock.el.classList.toggle('paused', !!(c && c.ended)); }
      const pt = periodText();
      if (L.period.textContent !== pt) { L.period.textContent = pt; L.period.classList.toggle('brk', pt.length > 3); }
      if (g.startedAt) penaltyView();
    }
    function update(bump) {
      if (rowKey() !== L.rowKey) { fillAll(); layout(); }
      startB.update();
      lastClock = ''; lastPen = '';
      tick();
      const sc = sp.score(g), so = sp.soScore(g);
      L.score[0].parentNode.classList.toggle('big3', Math.max(sc[0], sc[1]) >= 100);
      [0, 1].forEach((tm) => {
        L.score[tm].textContent = sc[tm];
        L.panels[tm].tsc.textContent = sc[tm];
        if (bump === tm) { ctx.flash(L.score[tm]); ctx.flash(L.panels[tm].tsc); }
      });
      L.so.hidden = !so;
      if (so) L.so.textContent = `${sp.shootoutShort} ${so[0]}−${so[1]}`;
      const tl = ST.tally(g);
      L.btns.forEach((b) => { const c = tl[b.key] || 0; setCnt(b.cnt, c); });
      L.globals.forEach((type) => setCnt(L.gb[type].cnt, tl['*:' + type] || 0));
      // 累積ファウル（フットサル）：5つで黄・6つ目から赤（第2PK）
      const f = g.startedAt ? sp.foulsNow(g, ctx.elapsed()) : null;
      [0, 1].forEach((tm) => {
        const el = L.panels[tm].fouls;
        el.hidden = !sp.teamFoul;
        if (!sp.teamFoul) return;
        const n = f ? f[tm] : 0;
        el.textContent = `累積${n}`;
        el.classList.toggle('w', n >= sp.teamFoul.warn && n < sp.teamFoul.limit);
        el.classList.toggle('x', n >= sp.teamFoul.limit);
      });
    }
    fillAll();
    L.update = update;
    L.layout = layout;
    L.tick = tick;
    L.refresh = () => { fillAll(); layout(); };
    L.fillRoster = (tm) => { fillRoster(tm); L.rowKey = rowKey(); layout(); update(); };
    return L;
  }
  /* 文字の幅（全角 1・半角 0.62。文字の大きさの何倍か） */
  function textEm(s) { let w = 0; for (const ch of String(s || '')) w += /[\x20-\x7e]/.test(ch) ? 0.62 : 1; return Math.max(1.2, w); }
  function setCnt(el, n) {
    const s = n ? String(n) : '';
    if (el.textContent !== s) el.textContent = s;
    el.hidden = !n;
  }
  function onClick(ctx, L, e) {
    const b = e.target.closest('button');
    if (!b) return;
    const sec = b.closest('.team');
    if (!sec) return;
    const tm = Number(sec.dataset.team);
    if (b.dataset.type) {
      const sp = ctx.sport, d = sp.TYPE[b.dataset.type] || {};
      const ev = { type: b.dataset.type, team: tm, no: b.dataset.no === '' ? null : b.dataset.no };
      // フリーキック：押した瞬間の時刻で残し、そのあとに直接・間接とカードを選ぶ（選ばずに閉じても、そのまま残る）
      if (d.detail === 'fk') { if (sp.isOn(ctx.sprefs, 'fkKind')) ev.fk = 'd'; if (sp.isOn(ctx.sprefs, 'fkCard')) ev.card = 'n'; }
      const e2 = ctx.record(ev, b);
      if (e2 && d.detail === 'fk' && (ev.fk || ev.card)) openFk(ctx, e2.id);
    } else if (b.dataset.add) openKeypad(ctx, L, tm);
  }

  /* ---------- フリーキックのくわしい記録（直接・間接・カード・背番号） ---------- */
  function fkBody(ctx, e, changed, opts) {
    const g = ctx.game, sp = ctx.sport, pr = ctx.sprefs;
    const box = h('div', { class: 'fkbox' });
    const other = e.team === 0 || e.team === 1 ? 1 - e.team : null;
    const pick = (label, cur, list, set) => h('div', { class: 'field' }, h('span', null, label), h('div', { class: 'row fkrow' },
      list.map(([v, lab, cls]) => h('button', { class: 'btn fkbtn' + (cls ? ' ' + cls : '') + (cur === v ? ' on' : ''), dataset: { fkv: String(v) }, 'aria-pressed': String(cur === v), onclick: () => set(v) }, lab))));
    if (opts.all || sp.isOn(pr, 'fkKind') || e.fk) box.append(pick('直接・間接', e.fk || null, [['d', '直接'], ['i', '間接']], (v) => { e.fk = v; changed(); }));
    if (opts.all || sp.isOn(pr, 'fkCard') || (e.card && e.card !== 'n')) {
      box.append(pick(`カード（${other != null ? ST.teamName(g, other) : '相手'}の反則）`, e.card || 'n', [['n', 'なし'], ['y', '🟨 イエロー', 'yc'], ['r', '🟥 レッド', 'rc']], (v) => { e.card = v; if (v === 'n') delete e.cno; changed(v); }));
      if (e.card === 'y' || e.card === 'r') {
        const nos = other != null ? g.teams[other].players.map((p) => p.no) : [];
        if (e.cno != null && !nos.includes(e.cno)) nos.push(e.cno);
        box.append(h('div', { class: 'field' }, h('span', null, `カードをもらった選手（${other != null ? ST.teamName(g, other) : '相手'}）`), h('div', { class: 'row nopick' },
          h('button', { class: 'btn small' + (e.cno == null ? ' on' : ''), dataset: { cno: '' }, onclick: () => { delete e.cno; changed(); } }, '番号なし'),
          ST.sortNos(nos).map((no) => h('button', { class: 'btn small nobtn' + (e.cno === no ? ' on' : ''), dataset: { cno: no }, onclick: () => { e.cno = no; changed(); } }, '#' + no)))));
      }
    }
    return box;
  }
  function openFk(ctx, id) {
    const g = ctx.game;
    const e = ST.findEvent(g, id);
    if (!e) return;
    let s = null;
    const redraw = () => { const nb = fkBody(ctx, e, changed, {}); s.body.innerHTML = ''; s.body.append(nb, h('p', { class: 'note' }, '時刻は押した瞬間のままです。選ばずに閉じても、フリーキックとして残ります（あとで「記録の一覧」で直せます）。')); };
    const changed = (v) => { ctx.save(); ctx.update(); redraw(); };
    s = ST.ui.sheet({
      title: `フリーキック（${ST.teamName(g, e.team)}）・${ctx.timeText(e)}`, cls: 'fksheet',
      body: h('div'),
      foot: [h('button', { class: 'btn primary', id: 'btnFkOk', onclick: () => s.close() }, 'OK')]
    });
    redraw();
  }
  /* 一覧で直す：フリーキックなら、くわしい記録も直せる */
  function editExtra(ctx, e, body, changed) {
    const d = ctx.sport.TYPE[e.type] || {};
    if (d.detail !== 'fk') return;
    body.append(fkBody(ctx, e, changed, { all: true }));
  }

  /* ---------- ピリオド（前半を終える・後半を始める・延長・PK戦） ---------- */
  function openPeriod(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const started = !!g.startedAt;
    const SO = sp.SO;
    const all = [1, 2, 3, 4].concat(sp.shootout ? [SO] : []);
    const startP = (p) => {
      s.close();
      if (!started) { g.startPeriod = p; ctx.save(); ctx.update(); return; }
      const ev = ST.addEvent(g, { t: ctx.elapsed(), type: 'period', period: p });
      ctx.S.redo = [];
      ctx.save(); ctx.feel('made'); ctx.update();
      ctx.say(`${sp.periodName(p)}を始めました（${ST.fmtTime(ev.t)}）`, 'ok');
    };
    const endP = (p) => {
      s.close();
      const ev = ST.addEvent(g, { t: ctx.elapsed(), type: 'pend', period: p });
      ctx.S.redo = [];
      ctx.save(); ctx.feel('made'); ctx.update();
      ctx.say(`${sp.periodName(p)}を終えました（${ST.fmtTime(ev.t)}）`, 'ok');
    };
    let body;
    if (!started) {
      body = h('div', { class: 'periodbox' },
        h('div', { class: 'row pgrid' }, all.map((p) => h('button', { class: 'btn' + (p === (g.startPeriod || 1) ? ' on' : ''), onclick: () => startP(p) }, sp.periodName(p)))),
        h('p', { class: 'note' }, 'スタートを押したときのピリオドです（途中から記録するときに）。'));
    } else {
      const c = sp.clockAt(g, ctx.elapsed());
      const next = c.p === SO ? null : c.p >= 4 ? (sp.shootout ? SO : null) : c.p + 1;
      const mains = [];
      if (!c.ended && c.p !== SO) mains.push(h('button', { class: 'btn primary huge', id: 'btnEndPeriod', onclick: () => endP(c.p) }, `${c.name}を終える`));
      if (next) mains.push(h('button', { class: 'btn huge' + (c.ended ? ' primary' : ''), id: 'btnNextPeriod', onclick: () => startP(next) }, `${sp.periodName(next)}を始める`));
      if (c.p === 2 && sp.shootout) mains.push(h('button', { class: 'btn huge', id: 'btnShootout', onclick: () => startP(SO) }, `${sp.shootout}を始める`));
      body = h('div', { class: 'periodbox' }, mains,
        h('div', { class: 'row pgrid' }, all.filter((p) => p !== c.p && p !== next && !(c.p === 2 && p === SO)).map((p) => h('button', { class: 'btn', onclick: () => startP(p) }, `${sp.periodName(p)}にする`))),
        h('p', { class: 'note' }, `ピリオドが始まる瞬間・終わる瞬間（笛）に押します。時計は「いまのピリオドが始まってからの時間」で、${sp.periodName(1)}の長さ（${g.opts.len}分）を過ぎると「${g.opts.len}+0:30」のように出ます。押し忘れても、あとで「記録の一覧」で時刻を直せます（それより後の記録は、自動でそのピリオドになります）。`));
    }
    const s = ST.ui.sheet({ title: started ? `ピリオド（いまは ${sp.clockAt(g, ctx.elapsed()).name}）` : '始めるピリオド', body });
  }

  /* ---------- 番号を足す（記録の途中で、名簿にない番号が出たとき） ---------- */
  function openKeypad(ctx, L, tm) {
    const g = ctx.game;
    let val = '';
    const disp = h('div', { class: 'kdisp', id: 'kdisp' }, '　');
    const show = () => { disp.textContent = val ? '#' + val : '番号を入れる'; disp.classList.toggle('empty', !val); };
    const press = (k) => {
      if (k === '⌫') val = val.slice(0, -1);
      else if (k === '00') val = '00';
      else if (val === '00' || val.length >= 2) val = k;
      else val = val === '0' ? k : val + k;
      show();
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'];
    const s = ST.ui.sheet({
      title: `${ST.teamName(g, tm)} の背番号を足す`, cls: 'keypad',
      body: h('div', null, disp, h('div', { class: 'keys' }, keys.map((k) => h('button', { class: 'key', dataset: { key: k }, onclick: () => press(k) }, k))),
        h('p', { class: 'note' }, '足した番号の行が、番号の順のところに入ります。')),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn primary', id: 'btnKeyOk', onclick: () => {
        const no = ST.normNo(val);
        if (no == null) { ST.ui.toast('0〜99 の番号を入れてください', 'warn'); return; }
        const t = g.teams[tm];
        const had = t.players.some((p) => p.no === no);
        if (!had) t.players = ST.cleanPlayers(t.players.concat([{ no, name: '' }]));
        ctx.save();
        s.close();
        L.fillRoster(tm);
        ctx.say(had ? `#${no} はもう並んでいます` : `#${no} を足しました`, had ? 'warn' : 'ok');
      } }, '足す')]
    });
    show();
  }

  /* ---------- 集計 ---------- */
  function stats(ctx, g) {
    const sp = ST.sportOf(g);
    const st = sp.stats(g);
    const per = sp.periodScores(g);
    const cols = sp.usedCols(st);
    const so = sp.soScore(g);
    const chip = (tm) => h('i', { class: 'chip', style: { background: g.teams[tm].color } });
    const table = (x) => {
      const rows = x.rows.filter((r) => !sp.isEmpty(r));
      const idle = x.rows.filter((r) => sp.isEmpty(r));
      return h('div', { class: 'boxwrap' }, h('table', { class: 'box' },
        h('thead', null, h('tr', null, h('th', null, '#'), h('th', { class: 'nm' }, '名前'), cols.map((c) => h('th', null, c.label)))),
        h('tbody', null,
          rows.map((r) => h('tr', null, h('td', { class: 'no' }, r.no), h('td', { class: 'nm' }, r.name || ''), cols.map((c) => h('td', null, sp.colValue(c, r))))),
          !sp.isEmpty(x.unknown) ? h('tr', { class: 'unk' }, h('td', { class: 'no' }, '—'), h('td', { class: 'nm' }, '番号なし・チーム'), cols.map((c) => h('td', null, sp.colValue(c, x.unknown)))) : null,
          h('tr', { class: 'tot' }, h('td', { class: 'no' }), h('td', { class: 'nm' }, '合計'), cols.map((c) => h('td', null, sp.colValue(c, x.total)))))),
        idle.length ? h('p', { class: 'note' }, `記録なし：${idle.map((r) => '#' + r.no).join(' ')}`) : null);
    };
    const pf = sp.teamFouls(g);
    const foulTable = sp.teamFoul && pf.size ? h('div', { class: 'boxwrap' }, h('table', { class: 'per fouls', id: 'teamFouls' },
      h('thead', null, h('tr', null, h('th', null, sp.teamFoul.label), Array.from(pf.keys()).sort().map((p) => h('th', null, p === 2 && sp.teamFoul.carry ? `${sp.periodName(2)}（延長も）` : sp.periodName(p))))),
      h('tbody', null, [0, 1].map((tm) => h('tr', null, h('th', null, chip(tm), ST.teamName(g, tm)),
        Array.from(pf.keys()).sort().map((p) => { const f = pf.get(p)[tm]; return h('td', { class: f >= sp.teamFoul.limit ? 'bonus' : null }, String(f)); })))))) : null;
    // シュートの決定率（シュートを数える種目）
    const shotLine = (tm) => {
      const t = st[tm].total.c;
      const made = (sp.TYPES || []).filter((d) => d.shot && d.kind === 'made').reduce((m, d) => m + (t[d.id] || 0), 0);
      const all = (sp.TYPES || []).filter((d) => d.shot).reduce((m, d) => m + (t[d.id] || 0), 0);
      return all ? `・シュート ${all}本（決定率 ${ST.pct(made, all)}）` : '';
    };
    /* チームの記録の数（ゴールキック・フリーキック（直接・間接）・コーナーキック…）とカード */
    const setLine = (tm) => {
      const c = st[tm].total.c;
      const parts = (sp.teamTypes || []).filter((x) => c[x]).map((x) => {
        const d = sp.TYPE[x];
        const nm = d.btnShort && d.btnShort.length <= 3 ? d.btnShort : (d.short || d.label);
        return d.detail === 'fk' && (c.fkd || c.fki) ? `${nm} ${c[x]}（直接 ${c.fkd || 0}・間接 ${c.fki || 0}）` : `${nm} ${c[x]}`;
      });
      if (c.yc) parts.push(`イエロー ${c.yc}`);
      if (c.rc) parts.push(`レッド ${c.rc}`);
      return parts.length ? '・' + parts.join('・') : '';
    };

    if (sp.checkDraft) { const msg = sp.checkDraft(D); if (msg) { ST.ui.toast(msg, 'warn', 5000); return; } }
    saveTeams();
    const pr = sprefs(sp.id);
    pr.opts = Object.assign({}, D.opts);
    savePrefs();
    const g = ST.newGame({ sport: sp.id, teams: D.teams, title: (D.title || '').trim(), opts: D.opts });
    if (sp.fromDraft) sp.fromDraft(g, D);
    S.draft = null;
    ST.store.saveGame(g);
    openGame(g);
  }

  /* チームのカード（名前・色・背番号・名前）。文字の欄を変えたときは、カードを作り直さずに、その場で書き換える */

        onchange: (e) => { t.name = e.target.value.trim(); setupChanged(); headName.textContent = label(); } })));
    const sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'ユニフォームの色' });
    ST.COLORS.forEach((c) => {
