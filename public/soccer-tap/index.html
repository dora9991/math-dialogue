<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サッカー タップ記録</title>
<meta name="description" content="サッカーの試合を見ながらタップで記録。ゴールキック・フリーキック（直接・間接・カード）・コーナーキック・シュート・あとでチェック。撮影しながら記録して、場面を前後の秒数を決めて見返す（記録も動画もどこにも送りません）">
<meta name="theme-color" content="#0a0e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サッカー記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
/* スポーツ タップ記録（見た目は「バスケ タップ記録」と同じ。撮影まわりを外し、種目の一覧・種目ごとの表示を足した） */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel2: #f2f4f8;
  --line: #d6dce6;
  --line2: #b9c3d2;
  --text: #0f172a;
  --muted: #566276;
  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.12);
  --good: #15803d;
  --warn: #b45309;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --bad: #dc2626;
  /* プレーのボタンの色（2P 緑・3P 紫・FT 茶・リバ 青。となりどうしで見分けやすく） */
  --k-fg2: #15803d;
  --k-fg3: #7c3aed;
  --k-ft: #b45309;
  --k-rb: #1d4ed8;
  --k-made: #15803d;
  --k-reb: #1d4ed8;
  --k-good: #0f766e;
  --k-bad: #c2410c;
  --k-foul: #a16207;
  --k-mark: #facc15;
  --k-mark-ink: #3b2a00;
  --k-miss-bg: #ffffff;
  --k-miss-line: #8b97aa;
  --k-miss-ink: #0f172a;
  --k-miss-x: #b91c1c;
  --ask: #f59e0b;
  --radius: 14px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
    --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
    --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
    --k-fg2: #16a34a; --k-fg3: #8b5cf6; --k-ft: #c26a0e; --k-rb: #2563eb;
    --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
  --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
  --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
  --k-fg2: #16a34a; --k-fg3: #8b5cf6; --k-ft: #c26a0e; --k-rb: #2563eb;
  --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
a { color: var(--accent); }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 14px; font-size: 14px; line-height: 1.3; text-decoration: none; color: var(--text); transition: background 0.12s, border-color 0.12s, transform 0.06s; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.btn.small { min-height: 34px; padding: 4px 11px; font-size: 13px; border-radius: 9px; }
.btn.huge { width: 100%; min-height: 58px; font-size: 18px; font-weight: 800; border-radius: 14px; }
.btn.icon { width: 40px; padding: 0; font-weight: 800; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.btn[disabled] { opacity: 0.45; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; font-size: 13px; }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.7); vertical-align: -2px; flex: none; }
.chip.neutral { background: var(--line2); }
.note { color: var(--muted); font-size: 13px; }
.note.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.center { justify-content: center; }
.spacer { flex: 1; }

/* ---------- 試合の一覧・準備（ふつうのページ） ---------- */
.hbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo { font-size: 28px; }
.brand b { display: block; font-size: 17px; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.htitle { font-size: 16px; }
.home, .setup { max-width: 920px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.going { border: 2px solid var(--bad); }
.going-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.games { display: flex; flex-direction: column; gap: 8px; }
.grow { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.gopen { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: none; border: 0; padding: 4px; }
.gline { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gline .when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gline .vs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.gline .vs b { font-size: 17px; font-variant-numeric: tabular-nums; }
.gline .gtitle { font-size: 12.5px; color: var(--muted); }
.tools .row { margin-top: 8px; }
.steps3 ol { margin: 4px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps3 li b { display: block; font-size: 15px; }
.steps3 li span { color: var(--muted); font-size: 13px; }
.lead { color: var(--muted); margin: 0; font-size: 14px; }

.teams2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 820px) { .teams2 { grid-template-columns: 1fr 1fr; } }
.teamcard { display: flex; flex-direction: column; gap: 10px; border-top: 8px solid var(--tc); box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.08); }
.tc-head { display: flex; align-items: center; gap: 10px; }
.tc-head b { font-size: 17px; }
.tc-band { background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.savedrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chipbtn small { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input[type="text"], .nostext { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; font-size: 16px; width: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(128, 128, 128, 0.55); padding: 0; position: relative; }
.sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.swc { width: 42px; height: 36px; padding: 0 2px; border: 1px dashed var(--line2); border-radius: 9px; background: var(--panel2); }
.presets .btn { font-weight: 700; }
.nogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.nb { min-height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nb.on { background: var(--tc); color: var(--tink); border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.names summary { cursor: pointer; color: var(--accent); font-size: 14px; padding: 4px 0; }
.namelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 6px; }
.namelist .nm { display: flex; align-items: center; gap: 6px; }
.namelist .nm b { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.namelist .nm input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; font-size: 15px; }
.gobar { position: sticky; bottom: 0; padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* ---------- 記録の画面 ---------- */
body[data-view="live"] { overflow: hidden; }
/* 上の帯（bar）・記録のボタン（stage）・下の帯（gbar） */
.live { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "stage" "gbar";
  background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.live button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* 上の帯：時計・ピリオド・得点・メニュー */
.lbar { grid-area: bar; display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex: none; min-width: 0; }
.clock { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 0 10px; height: clamp(46px, 7.4vmin, 64px); min-width: clamp(104px, 21vmin, 170px); flex: none; }
.tval { font-size: clamp(30px, 6.2vmin, 50px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; line-height: 1; }
.tval.long { font-size: clamp(22px, 4.6vmin, 40px); }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); flex: none; animation: rec 1.6s ease-in-out infinite; }
.clock.ended .recdot { animation: none; background: var(--line2); }
.clock.ended .tval { color: var(--muted); }
@keyframes rec { 50% { opacity: 0.25; } }
.startbtn { height: clamp(46px, 7.4vmin, 64px); border: 0; border-radius: 12px; background: var(--good); color: #fff; font-size: clamp(17px, 3.4vmin, 26px); font-weight: 900; padding: 0 14px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); flex: none; white-space: nowrap; }
.period { height: clamp(46px, 7.4vmin, 64px); min-width: 48px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); font-size: clamp(18px, 3.8vmin, 26px); font-weight: 800; padding: 0 8px; flex: none; }
.score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.sc { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: clamp(46px, 7.4vmin, 64px); padding: 0 7px; border-radius: 12px; background: var(--tc); color: var(--tink); border: 2px solid rgba(128, 128, 128, 0.55); font-size: clamp(28px, 6vmin, 46px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.sc { flex: none; }
.score.big3 .sc { font-size: clamp(20px, 4.4vmin, 36px); padding: 0 4px; }
/* 幅の狭いスマホ：上の帯を詰める */
@media (max-width: 400px) {
  .lbar { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .period { min-width: 42px; padding: 0 5px; }
  .menubtn { min-width: 44px; }
  .lbar:has(.tval.long) .menubtn small, .lbar:has(.big3) .menubtn small { display: none; }
  .score { gap: 3px; }
  .tval.long ~ .recdot, .clock:has(.tval.long) .recdot { width: 8px; height: 8px; }
  .clock:has(.tval.long) { padding: 0 7px; gap: 5px; }
}
.dash { font-size: 22px; color: var(--muted); font-weight: 800; }
.menubtn { height: clamp(46px, 7.4vmin, 64px); min-width: 50px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0 6px; flex: none; }
.menubtn span { font-size: 24px; font-weight: 800; }
.menubtn small { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* 2つのチーム：左右に並べる（lay-side）か、上下に重ねる（lay-stack）。どちらにするかは js の BT.planLayout が決める
   （すきま・ふちの数字は、core.js の BT.LAYOUT と合わせる） */
.stagewrap { grid-area: stage; position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; }
.panels { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: row; gap: 6px; padding: 0 4px; }
.lay-stack .panels { flex-direction: column; }
.team { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--tc); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.35); }
.lay-stack .team { flex: var(--r, 1) 1 var(--base, 40px); }
/* チームの帯：名前・得点・「＋番号」 */
.thead { display: flex; align-items: center; gap: 6px; background: var(--tc); color: var(--tink); padding: 0 3px 0 8px; height: 22px; flex: none; border-bottom: 1px solid rgba(128, 128, 128, 0.45); }
.thead .tname { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
.tsc { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.tadd { flex: none; height: 18px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 0 6px; line-height: 1; opacity: 0.8; }
/* 選手の行：列の中は上から背番号の小さい順（grid-auto-flow: column）。行の高さは 28〜76px（入りきらなければ縦にすべらせる） */
.roster { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-template-columns: repeat(var(--c, 1), minmax(0, 1fr)); grid-template-rows: repeat(var(--r, 1), minmax(28px, 76px));
  gap: 3px 8px; padding: 4px; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; align-content: start; }
.team.scroll .roster { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), rgba(0, 0, 0, 0.35)); mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), rgba(0, 0, 0, 0.35)); }
.prow { display: grid; grid-template-columns: var(--nw, 36px) var(--cols, repeat(4, minmax(0, 1fr))); gap: 3px; min-height: 0; min-width: 0; }
.pno { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; overflow: hidden; border-radius: 8px; background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.55); }
.pno b { font-size: var(--nf, 20px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.pno small { display: none; font-size: 10px; line-height: 1.15; max-width: 100%; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
.team.roomy .pno small { display: block; }
.prow.unk .pno { background: var(--panel2); color: var(--muted); border: 1px dashed var(--line2); }
.prow.teamonly .pno b { font-size: 12px; letter-spacing: 0; }
.pb { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 0 2px; border: 0; border-radius: 8px; color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); transition: transform 0.06s, filter 0.06s; }
.pb b { font-weight: 900; line-height: 1; white-space: nowrap; overflow: hidden; letter-spacing: -0.01em; }
.pb:active { transform: scale(0.94); filter: brightness(1.18); box-shadow: none; }
/* ボタンの色：種目の記録ごとに --bc（得点は緑系・ミスは白地にふち・カードは黄と赤。sp/*.js の col） */
.prow .pb { background: var(--bc, #475569); color: var(--bink, #fff); }
.pb b { font-size: var(--fz, var(--bf, 16px)); }
.pb .bs { display: none; }
.pb.useshort .bl { display: none; }
.pb.useshort .bs { display: inline; }
/* 失敗の「×」など：白地に、その記録の色のふち（成功のとなり） */
.prow .pb.miss { background: var(--k-miss-bg); color: var(--bc); box-shadow: inset 0 0 0 2px var(--bc), 0 2px 0 rgba(0, 0, 0, 0.12); }
.prow .pb.miss.x1 b { font-size: calc(var(--fz, var(--bf, 16px)) * 1.15); }
.pb.miss .cnt { background: var(--bc); }
/* 回数（ボタンの右上） */
.cnt { position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: rgba(0, 0, 0, 0.42); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 800; line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.prow.unk:not(.teamonly) .pb { opacity: 0.88; }
/* 幅の狭いボタン：回数は文字の下に（右上だと文字に重なるため） */
.team.narrowb .pb { flex-direction: column; gap: 1px; }
.team.narrowb .pb .cnt { position: static; height: 12px; min-width: 14px; padding: 0 3px; border-radius: 6px; font-size: 9.5px; line-height: 12px; }

.k-made { background: var(--k-made); }
.k-reb { background: var(--k-reb); }
.k-good { background: var(--k-good); }
.k-bad { background: var(--k-bad); }
.k-foul { background: var(--k-foul); }
.k-mark { background: var(--k-mark); color: var(--k-mark-ink); }
/* 押せたしるし（光る輪） */
.hit { animation: hit 0.32s ease-out; }
@keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.95), 0 0 0 0 var(--accent); filter: brightness(1.35); } 100% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0), 0 0 0 14px rgba(37, 99, 235, 0); filter: none; } }
.sc.hit, .tsc.hit { animation: bump 0.4s ease-out; }
@keyframes bump { 30% { transform: scale(1.25); } }

/* スタートの前・試合のあと：パネルの上に大きなボタン */
.cover { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 14, 21, 0.38); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); }
.cover-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cover-card p { margin: 0; }

/* ---------- 下から出る小窓 ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.45); display: flex; align-items: flex-end; justify-content: center; }

.menu { display: flex; flex-direction: column; gap: 6px; }

.export { display: flex; flex-direction: column; gap: 8px; }

/* ---------- お知らせ ---------- */
.toasts { position: fixed; left: 50%; bottom: calc(66px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 80; width: min(560px, calc(100% - 24px)); pointer-events: none; }

/* お知らせは、下にあるボタンへのタップを通す（ボタンの付いたお知らせのボタンだけ押せる） */

}

/* ========== スポーツ タップ記録で足したもの ========== */

/* チームの種目：上の帯 */

/* チームの行（CK・FK・タイムアウト…） */
.prow.trow { grid-template-columns: var(--nw, 36px) repeat(var(--tk, 3), minmax(0, 1fr)); }

/* ========== 撮影しながら記録する（バスケ タップ記録と同じ見た目） ========== */
/* 撮影中：上の帯の小さな映像（押すと撮影の画面）。録画中は赤いふちと点 */
.cambtn { position: relative; flex: none; height: clamp(46px, 7.4vmin, 64px); aspect-ratio: var(--ar, 1.7778); max-width: 120px; padding: 0; border: 2px solid var(--line2); border-radius: 10px; background: #000; overflow: hidden; }

.btn.camon { font-weight: 700; border-color: var(--accent); color: var(--accent); }

<body>
<div id="view"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- サッカー タップ記録：スポーツ タップ記録と同じエンジンで、サッカーだけのアプリ。保存（記録・撮影した動画）は、スポーツ タップ記録とは別 -->
<script>window.ST = { CONFIG: { app: 'サッカー タップ記録', only: 'soccer', key: 'ssoc', db: 'ssoc-media' } };</script>
<script>
/* js/core.js */
/* スポーツ タップ記録 — 画面を持たない共通の部分（時刻・記録・名簿・集計の道具・CSV・書き出しと読み込み・種目の登録）
   「バスケ タップ記録」（basket-tap）の核を、どの種目でも使えるように切り出したもの。DOM に依存しないので node のテストからも読める。

   ■ 記録のデータ（1試合＝1つ。書き出す JSON もこの形）
   {
     format: 'sports-tap', version: 1, sport: 'soccer' など（種目の id）,
     id, title（なくてよい）, date: 'YYYY-MM-DD', createdAt,
     startedAt: スタートを押した時刻（エポックミリ秒。押す前は null）, endedAt: 終えた時刻 | null,
     tz: 記録した端末の時差（分。日本は 540）, prec: 時刻の細かさ（10 ＝ 0.1 秒・100 ＝ 0.01 秒（水泳））,
     opts: 種目ごとの試合の形式（前半の長さ・セット数・距離 など。種目の defaultOpts）,
     teams: [ 自分, 相手 ]  … { name, color, colorName, players: [{ no: '7', name: '' }] }（水泳はレーン。種目が決める）
     events: [ { id, t, type, team, no, …種目ごとの項目 } ]  … 追加した順
     videos: [ { vid, n, startedAt, endedAt, duration, name, mime, w, h, bytes } ]（この端末のカメラで撮影しながら記録したとき。なくてよい。livecam.js）
       startedAt：録画を始めた時刻（エポックミリ秒。記録の startedAt と同じ時計）→ 記録の t 秒 ＝ 動画の t ＋（startedAt(記録) − startedAt(動画)）/1000 秒
       動画の中身は、この端末のブラウザ（IndexedDB 'stap-media'。vstore.js）にだけある。書き出す JSON には、ファイル名・時刻・長さだけが入る
   }
   書き出す JSON には、記録ごとに text（呼び名）と when（場面の呼び名「前半 23:41」など）、types に scene（場面として切り出すか）も付ける。
     t   : スタートからの秒（prec の細かさ）。ストップウォッチと同じで、止まらずに進む（あとで動画と合わせられる）
     type: 種目の TYPES の id
     team: 0 = 自分・1 = 相手・null = チームなし（「★ あとで見る」など）
     no  : 背番号（文字列。'0' と '00' は別）| null（だれか分からない・チームの記録）
   ピリオド・セット・イニングなどは、記録から計算して決める（記録を直す・取り消すと、自動で正しくなる）。 */
(function (root) {
  'use strict';
  const ST = root.ST = root.ST || {};
  /* 1つの種目だけのアプリ（サッカー タップ記録 など）は、index.html で先に ST.CONFIG を置く：
     { app: 'サッカー タップ記録', only: 'soccer', key: 'ssoc'（保存のキーの頭）, db: 'ssoc-media'（撮影した動画の保存場所） } */
  ST.CONFIG = Object.assign({ app: 'スポーツ タップ記録', only: null, key: 'stap', db: 'stap-media' }, ST.CONFIG || {});
  ST.APP = ST.CONFIG.app;
  ST.FORMAT = 'sports-tap';
  ST.VERSION = 1;

  ST.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const clone = ST.clone = (o) => JSON.parse(JSON.stringify(o));

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。digits：小数の桁（1 ＝ 0.1 秒・2 ＝ 0.01 秒） */
  ST.fmtTime = function (sec, digits) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const d = digits === true ? 1 : digits || 0;
    const f = Math.pow(10, d);
    if (d) sec = Math.round(sec * f) / f;
    const whole = Math.floor(sec + 1e-9);
    const h = Math.floor(whole / 3600), m = Math.floor((whole % 3600) / 60), s = whole % 60;
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (d) out += '.' + String(Math.round((sec - whole) * f)).padStart(d, '0').slice(0, d);
    return out;
  };
  /* 水泳などの記録：1:02.35（1分未満は 35.12） */
  ST.fmtRace = function (sec) {
    if (!isFinite(sec) || sec < 0) return '—';
    const c = Math.round(sec * 100);
    const m = Math.floor(c / 6000), s = Math.floor((c % 6000) / 100), cs = c % 100;
    return (m ? m + ':' + String(s).padStart(2, '0') : String(s)) + '.' + String(cs).padStart(2, '0');
  };

  /* ---------- 種目の登録 ----------
     sp/*.js が ST.addSport({ id, name, icon, family, … }) で登録し、v/*.js が ST.addView(family, { build, stats, … }) で画面を足す */
  ST.SPORTS = {};
  ST.SPORT_ORDER = [];
  const PREFERRED = ['soccer', 'volley', 'futsal', 'handball', 'tennis', 'baseball', 'rugby', 'swim'];     // 種目を選ぶ画面の並び
  const order = (id) => { const i = PREFERRED.indexOf(id); return i < 0 ? 99 : i; };
  ST.addSport = function (def) {
    if (!def || !def.id) throw new Error('種目の id がありません');
    if (!ST.SPORTS[def.id]) ST.SPORT_ORDER.push(def.id);
    ST.SPORT_ORDER.sort((a, b) => order(a) - order(b));
    def.TYPE = def.TYPE || {};
    (def.TYPES || []).forEach((d) => { def.TYPE[d.id] = d; });
    ST.SPORTS[def.id] = def;
    return def;
  };
  ST.VIEWS = {};
  ST.addView = function (family, view) { ST.VIEWS[family] = Object.assign(ST.VIEWS[family] || {}, view); return ST.VIEWS[family]; };
  ST.sportOf = (game) => ST.SPORTS[game && game.sport] || null;
  ST.typeOf = (game, type) => { const sp = ST.sportOf(game); return (sp && sp.TYPE[type]) || null; };
  /* 種目の試合の形式：そろえる（知らない値は、はじめの値に） */
  ST.cleanOpts = function (sp, o) {
    const base = sp.defaultOpts ? sp.defaultOpts() : {};
    const out = Object.assign({}, base);
    if (o && typeof o === 'object') {
      Object.keys(base).forEach((k) => {
        const v = o[k];
        if (v == null) return;
        const f = (sp.optFields || []).find((x) => x.key === k);
        if (f && f.choices && !f.choices.some(([cv]) => String(cv) === String(v))) return;
        out[k] = typeof base[k] === 'number' ? Number(v) : typeof base[k] === 'boolean' ? !!v : v;
      });
    }
    return out;
  };

  /* ユニフォームの色（よくある色） */
  ST.COLORS = [
    { name: '白', hex: '#f4f4f4' }, { name: '黒', hex: '#222222' }, { name: '赤', hex: '#d93636' }, { name: '青', hex: '#2f6fed' },
    { name: '紺', hex: '#1f2f6e' }, { name: '水色', hex: '#45b0e6' }, { name: '緑', hex: '#2e9e5b' }, { name: '黄', hex: '#f2c230' },
    { name: 'オレンジ', hex: '#f08a24' }, { name: '紫', hex: '#7d4cc9' }, { name: 'ピンク', hex: '#e86aa6' }, { name: 'グレー', hex: '#8a8f98' }
  ];
  function hexRGB(hex) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128]; }
  ST.hexRGB = hexRGB;
  /* その色の上に載せる文字の色（黒か白の、読みやすいほう） */
  ST.inkOn = function (hex) {
    const [r, g, b] = hexRGB(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return L > 0.36 ? '#111111' : '#ffffff';
  };
  ST.nearestColorName = function (hex) {
    const [r, g, b] = hexRGB(hex);
    let best = null;
    ST.COLORS.forEach((c) => { const [r2, g2, b2] = hexRGB(c.hex); const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2; if (!best || d < best.d) best = { d, name: c.name }; });
    return best.name;
  };

  /* ---------- 背番号 ---------- */
  function toHalf(s) {
    return String(s || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[〜～~－ー−‐―]/g, '-').replace(/[、，,・／/\s]+/g, ' ');
  }
  ST.toHalf = toHalf;
  /* 背番号として使えるか（0〜99 と 00。'07' は 7 にそろえる） */
  ST.normNo = function (v) {
    const s = toHalf(v).trim();
    if (s === '00') return '00';
    if (!/^\d{1,2}$/.test(s)) return null;
    return String(Number(s));
  };
  ST.cmpNo = (a, b) => (Number(a) - Number(b)) || (String(a).length - String(b).length);
  ST.sortNos = (list) => list.slice().sort(ST.cmpNo);
  /* 「4-15, 23 33」「４〜１５」などを、背番号の並びにする（重なりは1つに。範囲は 0〜99） */
  ST.parseNumbers = function (text) {
    const out = new Set();
    toHalf(text).split(' ').forEach((tok) => {
      if (!tok) return;
      const m = /^(\d{1,2})-(\d{1,2})$/.exec(tok);
      if (m) {
        let a = Number(m[1]), b = Number(m[2]);
        if (a > b) [a, b] = [b, a];
        for (let i = a; i <= b && i <= 99; i++) out.add(String(i));
        return;
      }
      const n = ST.normNo(tok);
      if (n != null) out.add(n);
    });
    return ST.sortNos(Array.from(out));
  };
  /* 背番号の並びを、短い文字にする（4,5,6,7,9 → 「4-7, 9」） */
  ST.formatNumbers = function (nos) {
    const list = ST.sortNos(nos || []);
    const out = [];
    let i = 0;
    while (i < list.length) {
      if (list[i] === '00') { out.push('00'); i++; continue; }
      let j = i;
      while (j + 1 < list.length && list[j + 1] !== '00' && Number(list[j + 1]) === Number(list[j]) + 1) j++;
      out.push(j - i >= 2 ? `${list[i]}-${list[j]}` : list.slice(i, j + 1).join(', '));
      i = j + 1;
    }
    return out.join(', ');
  };
  /* 名簿をそろえる（番号の重なりは1つに・番号の順。keepOrder：並びを変えない（野球の打順など）） */
  function cleanPlayers(list, keepOrder) {
    const seen = new Set(), out = [];
    (list || []).forEach((p) => {
      const no = ST.normNo(p && p.no != null ? p.no : p);
      if (no == null || seen.has(no)) return;
      seen.add(no);
      const o = { no, name: String((p && p.name) || '').trim().slice(0, 12) };
      if (p && p.pos) o.pos = String(p.pos).slice(0, 6);
      out.push(o);
    });
    return keepOrder ? out : out.sort((a, b) => ST.cmpNo(a.no, b.no));
  }
  ST.cleanPlayers = cleanPlayers;
  ST.playersFromNos = function (nos, old) {
    const names = {};
    (old || []).forEach((p) => { names[p.no] = p.name; });
    return cleanPlayers(nos.map((no) => ({ no, name: names[no] || '' })));
  };

  /* ---------- 時刻 ---------- */
  ST.uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function pad2(n) { return String(n).padStart(2, '0'); }
  ST.ymdAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
  ST.hmsAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`; };
  ST.tzText = function (tz) { const s = tz < 0 ? '-' : '+', a = Math.abs(tz || 0); return s + pad2(Math.floor(a / 60)) + ':' + pad2(a % 60); };
  ST.localTz = () => -new Date().getTimezoneOffset();

  /* ---------- 試合 ---------- */
  function blankTeam(i) { return { name: '', color: i ? '#2f6fed' : '#f4f4f4', colorName: i ? '青' : '白', players: [] }; }
  ST.blankTeam = blankTeam;
  ST.newGame = function (opts) {
    opts = opts || {};
    const sp = ST.SPORTS[opts.sport];
    if (!sp) throw new Error('種目が分かりません：' + opts.sport);
    const now = opts.now || Date.now();
    const tz = opts.tz != null ? opts.tz : ST.localTz();
    const keep = !!sp.orderedRoster;
    const teams = [0, 1].map((i) => Object.assign(blankTeam(i), clone((opts.teams || [])[i] || {})));
    teams.forEach((t) => { t.players = cleanPlayers(t.players, keep); });
    const g = { format: ST.FORMAT, version: ST.VERSION, sport: sp.id, id: opts.id || ST.uid('g'), title: opts.title || '', date: ST.ymdAt(now, tz), createdAt: now, startedAt: null, endedAt: null, tz, prec: sp.prec || 10, opts: ST.cleanOpts(sp, opts.opts), teams, events: [], seq: 0 };

<script>
/* js/store.js */
/* スポーツ タップ記録 — 保存（このブラウザの中だけ。どこにも送らない）
   ・試合：1つ記録するたびに、すぐ保存する（途中で画面を閉じても、開き直せば続きから）
   ・チーム：種目ごとに、名前・色・名簿を覚えておき、次の試合で選べる
   ・設定：音・画面の色・最後に使った種目・種目ごとの設定（ボタンの組み合わせ・前の試合の形式）
   キーは「stap:」で始まる（バスケ タップ記録の「btap:」とは別）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const P = (ST.CONFIG && ST.CONFIG.key) || 'stap';        // 保存のキーの頭（サッカー タップ記録は 'ssoc'。アプリごとに別の保存）
  const K = { games: P + ':games', game: P + ':game:', current: P + ':current', teams: P + ':teams', prefs: P + ':prefs' };
  const KEEP = 80;          // 覚えておく試合の数（古いものから消す。書き出したファイルは残る）

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return false; try { s.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function remove(k) { const s = ls(); if (s) { try { s.removeItem(k); } catch (e) { /* 無視 */ } } }

  /* ---------- 試合 ---------- */
  function games(sport) { return (readJSON(K.games) || []).filter((g) => g && g.id && (!sport || g.sport === sport)).sort((a, b) => (b.startedAt || b.at || 0) - (a.startedAt || a.at || 0)); }
  function loadGame(id) {
    const g = readJSON(K.game + id);
    if (!g || g.format !== ST.FORMAT || !Array.isArray(g.events) || !ST.SPORTS[g.sport]) return null;
    if (!g.seq) g.seq = g.events.reduce((m, e) => Math.max(m, Number(String(e.id).slice(1)) || 0), 0);
    g.opts = ST.cleanOpts(ST.SPORTS[g.sport], g.opts);
    return g;
  }
  function saveGame(game) {
    if (!game || !game.id) return false;
    const list = games().filter((x) => x.id !== game.id);
    list.unshift(ST.summary(game));
    let ok = writeJSON(K.game + game.id, game);
    if (!ok || list.length > KEEP) {
      const old = list.slice().sort((a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0)).filter((x) => x.id !== game.id);
      const n = ok ? list.length - KEEP : Math.max(5, list.length - KEEP);
      old.slice(0, n).forEach((x) => { remove(K.game + x.id); const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list.splice(i, 1); });
      if (!ok) ok = writeJSON(K.game + game.id, game);
    }
    writeJSON(K.games, list);
    return ok;
  }
  function deleteGame(id) {
    remove(K.game + id);
    writeJSON(K.games, games().filter((x) => x.id !== id));
    if (current() === id) setCurrent(null);
  }
  function current() { const s = ls(); try { return s ? s.getItem(K.current) : null; } catch (e) { return null; } }
  function setCurrent(id) { const s = ls(); if (!s) return; try { if (id) s.setItem(K.current, id); else s.removeItem(K.current); } catch (e) { /* 無視 */ } }

  /* ---------- チーム（名簿。種目ごと） ---------- */
  function teams(sport) { return (readJSON(K.teams) || []).filter((t) => t && t.id && (!sport || t.sport === sport)).sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)); }
  /* 同じ種目・同じ名前のチームは上書き。名前のないチームは保存しない */
  function saveTeam(sport, team, mine) {
    const name = (team.name || '').trim();
    if (!name) return null;
    const all = teams();
    let t = all.find((x) => x.sport === sport && x.name === name);
    if (!t) { t = { id: ST.uid('t'), sport }; all.push(t); }
    const keep = !!(ST.SPORTS[sport] && ST.SPORTS[sport].orderedRoster);
    Object.assign(t, { name, color: team.color, colorName: team.colorName, players: ST.cleanPlayers(team.players, keep), usedAt: Date.now() });
    if (mine) { all.forEach((x) => { if (x.sport === sport) delete x.mine; }); t.mine = true; }
    const keepList = all.sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)).slice(0, 120);
    writeJSON(K.teams, keepList);
    return t;
  }
  function deleteTeam(id) { writeJSON(K.teams, teams().filter((t) => t.id !== id)); }
  function myTeam(sport) { return teams(sport).find((t) => t.mine) || null; }

  /* ---------- 設定 ----------
     sound：タップ音 / theme：画面の色 / last：最後に使った種目
     sp[種目]：{ opts（前の試合の形式）, rows（行のボタンの組み合わせ）, names, unknown, … 種目の設定 } */
  function prefs() {
    const p = Object.assign({ sound: false, theme: 'auto', last: '', sp: {} }, readJSON(K.prefs) || {});
    if (!p.sp || typeof p.sp !== 'object') p.sp = {};
    return p;
  }
  function savePrefs(p) { return writeJSON(K.prefs, p); }
  /* 種目の設定（なければ、その種目のはじめの値で作る） */
  function sportPrefs(p, sport) {
    const sp = ST.SPORTS[sport];
    const base = Object.assign({ names: true, unknown: true, opts: null, rows: {} }, sp && sp.defaultPrefs ? sp.defaultPrefs() : {});
    // いまある物に、足りない値だけを足す（作り直さない：先に受け取った物を書きかえても、保存される）
    if (!p.sp[sport] || typeof p.sp[sport] !== 'object') p.sp[sport] = {};
    const cur = p.sp[sport];
    Object.keys(base).forEach((k) => { if (cur[k] === undefined) cur[k] = base[k]; });
    if (!cur.rows || typeof cur.rows !== 'object') cur.rows = {};
    return cur;

            bytes += size; count++;

          if (count) { const chunk = { n: count, sdi }; T.chunks.push(chunk); runs.push({ T, off: start, bytes, chunk }); }
          pos = start + bytes;
        }
        prevEnd = pos;
      }
    }
    const used = tracks.filter((T) => T.sizes.length);
    if (!used.length) throw new Error('動画の中身がありません');

    // 中身の並べ方：元の場所の順に、すき間なくつなぐ（となり合う所は1つの範囲にまとめる）
    runs.sort((a, b) => a.off - b.off);
    let payload = 0;
    const ranges = [];
    runs.forEach((x) => {
      x.chunk.rel = payload;
      const last = ranges[ranges.length - 1];
      if (last && last[1] === x.off) last[1] += x.bytes; else ranges.push([x.off, x.off + x.bytes]);
      payload += x.bytes;
    });

    // 長さ
    used.forEach((T) => {
      T.mediaDur = T.durs.reduce((s, d) => s + d, 0);
      T.lead = T.first > 0 ? Math.round(T.first / T.ts * movieTs) : 0;          // 最初のサンプルまでの空き（movie の時間の単位）
      T.movieDur = Math.round(T.mediaDur / T.ts * movieTs) + T.lead;      // （B フレームのずれは下で足す）
      // いちばん早く映るサンプルの時刻（B フレームがあると 0 より後）。空きを入れるときは、そこから映す（編集リスト）
      T.minCT = 0; T.maxEnd = T.mediaDur;
      if (T.anyCto && !T.negCto) {
        let dts = 0, m = Infinity, e = 0;
        for (let i = 0; i < T.durs.length; i++) { m = Math.min(m, dts + T.ctos[i]); e = Math.max(e, dts + T.ctos[i] + T.durs[i]); dts += T.durs[i]; }
        T.minCT = isFinite(m) ? m : 0; T.maxEnd = Math.max(e, T.mediaDur);
      }
      if (T.lead > 0) T.movieDur = T.lead + Math.round(T.maxEnd / T.ts * movieTs);
    });
    const movieDur = Math.max(...used.map((T) => T.movieDur));
    const ftyp = ftypBox ? new Uint8Array(await blob.slice(ftypBox.start, ftypBox.start + ftypBox.size).arrayBuffer())
      : (() => { const w = writer(); w.box('ftyp', () => { w.str('isom'); w.u32(512); ['isom', 'iso2', 'mp41'].forEach((s) => w.str(s)); }); return w.out(); })();

    const buildMoov = (base, co64) => {
      const w = writer();
      w.box('moov', () => {
        if (mvhd) w.bytes(withDuration(mdv, mvhd, 'mvhd', movieDur));
        used.forEach((T) => {
          const B = T.box;
          w.box('trak', () => {
            const tk = withDuration(mdv, B.tkhd, 'tkhd', T.movieDur);
            w.bytes(T.handler === 'vide' && rotate ? withMatrix(tk, rotate) : tk);
            if (B.edts) w.bytes(copy(mdv, B.edts));
            else if (T.lead > 0) {
              // 最初のサンプルまでの空き（映像と音の始まりのずれを保つ）。B フレームがあるときは、いちばん早く映るサンプルの時刻（minCT）から映す
              const empty = T.lead + Math.round(T.minCT / T.ts * movieTs);
              const shown = Math.round((T.maxEnd - T.minCT) / T.ts * movieTs);      // 映る長さ（最後のサンプルが映り終わるまで）
              w.box('edts', () => w.full('elst', 0, 0, () => {
                w.u32(2);
                w.u32(empty); w.i32(-1); w.u16(1); w.u16(0);
                w.u32(shown); w.i32(T.minCT); w.u16(1); w.u16(0);
              }));
            }
            w.box('mdia', () => {
              w.bytes(withDuration(mdv, B.mdhd, 'mdhd', T.mediaDur));
              w.bytes(copy(mdv, B.hdlr));
              w.box('minf', () => {
                boxes(mdv, B.minf.body, B.minf.end).forEach((b) => { if (b.type !== 'stbl') w.bytes(copy(mdv, b)); });
                w.box('stbl', () => {
                  w.bytes(copy(mdv, B.stsd));
                  // stts：サンプルの長さ（同じ長さが続く所はまとめる）
                  const stts = [];
                  T.durs.forEach((d) => { const l = stts[stts.length - 1]; if (l && l[1] === d) l[0]++; else stts.push([1, d]); });
                  w.full('stts', 0, 0, () => { w.u32(stts.length); stts.forEach(([c, d]) => { w.u32(c); w.u32(d); }); });
                  if (T.anyCto) {
                    const ctts = [];
                    T.ctos.forEach((o) => { const l = ctts[ctts.length - 1]; if (l && l[1] === o) l[0]++; else ctts.push([1, o]); });
                    w.full('ctts', T.negCto ? 1 : 0, 0, () => { w.u32(ctts.length); ctts.forEach(([c, o]) => { w.u32(c); w.i32(o); }); });
                  }
                  if (!T.allSync) {
                    const idx = [];
                    T.sync.forEach((s, i) => { if (s) idx.push(i + 1); });
                    w.full('stss', 0, 0, () => { w.u32(idx.length); idx.forEach((i) => w.u32(i)); });
                  }
                  w.full('stsz', 0, 0, () => { w.u32(0); w.u32(T.sizes.length); T.sizes.forEach((s) => w.u32(s)); });
                  const stsc = [];
                  T.chunks.forEach((c, i) => { const l = stsc[stsc.length - 1]; if (!l || l[1] !== c.n || l[2] !== c.sdi) stsc.push([i + 1, c.n, c.sdi]); });
                  w.full('stsc', 0, 0, () => { w.u32(stsc.length); stsc.forEach(([f, n, s]) => { w.u32(f); w.u32(n); w.u32(s); }); });
                  if (co64) w.full('co64', 0, 0, () => { w.u32(T.chunks.length); T.chunks.forEach((c) => w.u64(base + c.rel)); });
                  else w.full('stco', 0, 0, () => { w.u32(T.chunks.length); T.chunks.forEach((c) => w.u32(base + c.rel)); });
                });
              });
            });
          });
        });
        mk.filter((b) => b.type === 'udta').forEach((b) => w.bytes(copy(mdv, b)));
      });
      return w.out();
    };
    const big = payload + 8 > 0xffffffff;
    const mdatHead = big ? 16 : 8;
    let co64 = false;
    let moovBytes = buildMoov(0, false);
    let base = ftyp.length + moovBytes.length + mdatHead;
    if (base + payload > 0xffffffff) { co64 = true; moovBytes = buildMoov(0, true); base = ftyp.length + moovBytes.length + mdatHead; }
    moovBytes = buildMoov(base, co64);
    const w = writer();
    w.bytes(ftyp);
    w.bytes(moovBytes);
    if (big) { w.u32(1); w.str('mdat'); w.u64(payload + 16); } else { w.u32(payload + 8); w.str('mdat'); }
    return {
      flat: true, header: w.out(), ranges, truncated, rotate,
      duration: movieDur / movieTs,
      tracks: used.map((T) => ({ handler: T.handler, samples: T.sizes.length, duration: T.mediaDur / T.ts + T.lead / movieTs }))
    };
  }

  /* 組み立てた MP4 の Blob（header と、元の Blob の範囲をつなぐだけ。中身は写さない） */
  function compose(blob, plan, type) {
    if (!plan || !plan.flat) return blob;
    return new Blob([plan.header].concat(plan.ranges.map(([s, e]) => blob.slice(s, e))), { type: type || 'video/mp4' });
  }

  ST.fmp4 = { scan, flatten, compose, boxes };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/vstore.js */
/* スポーツ タップ記録 — （バスケ タップ記録と同じしくみ）撮影した動画の保存（このブラウザの IndexedDB。どこにも送らない）
   録画は数秒ごとの切れはし（chunk）で届くので、届くたびに保存する（途中でページが閉じても、そこまでは残る）。
   録画を止めたら、細切れの MP4 をふつうの MP4 に組み直す「組み立て図」（fmp4.flatten の header と ranges）も保存する。
   動画の中身は、切れはしのまま1回だけ保存する（組み直した動画を、もう1つ保存しない。容量を2倍にしないため）。

   ■ データの形（バスケ タップ記録の vstore.js と同じ形。DB の名前だけ違う）
   DB 'stap-media'（版 1。バスケ タップ記録の 'btap-media' とは別）
     videos：{ vid, gameId, n（その試合の何本目か）, startedAt（録画を始めた時刻・エポックミリ秒）, endedAt,
               mime, ext, w, h, bytes, chunks（切れはしの数）, status（'recording' | 'done'）,
               plan（{ header: Uint8Array, ranges: [[始め, 終わり)…], duration, truncated } | null）, duration（秒）, name（保存するときのファイル名） }
     chunks：{ vid, i, blob }（キー [vid, i]。i の順につなぐと、録画した動画そのもの） */
(function (root) {
  'use strict';
  const ST = root.ST = root.ST || {};
  const DB = (ST.CONFIG && ST.CONFIG.db) || 'stap-media', VER = 1;      // （バスケ タップ記録の 'btap-media' とは別。サッカー タップ記録は 'ssoc-media'）
  let dbp = null;

  const supported = () => { try { return !!root.indexedDB; } catch (e) { return false; } };
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      let req;
      try { req = root.indexedDB.open(DB, VER); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'vid' }).createIndex('gameId', 'gameId');
        if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks', { keyPath: ['vid', 'i'] });
      };
      req.onsuccess = () => { const db = req.result; db.onversionchange = () => { db.close(); dbp = null; }; resolve(db); };
      req.onerror = () => reject(req.error || new Error('IndexedDB を開けませんでした'));
      req.onblocked = () => reject(new Error('IndexedDB がほかのタブで使われています'));
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  /* 1回のやりとり。fn(stores) の戻り値（IDBRequest なら、その結果）を返す */
  async function tx(names, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(names, mode);
      const stores = {};
      [].concat(names).forEach((n) => { stores[n] = t.objectStore(n); });
      let out;
      try { out = fn(stores); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(out && typeof out === 'object' && 'result' in out && 'readyState' in out ? out.result : out);
      t.onerror = () => reject(t.error || new Error('保存できませんでした'));
      t.onabort = () => reject(t.error || new Error('保存できませんでした（空きが足りない など）'));
    });
  }
  const range = (vid) => IDBKeyRange.bound([vid, 0], [vid, Infinity]);

  const putChunk = (vid, i, blob) => tx('chunks', 'readwrite', (s) => { s.chunks.put({ vid, i, blob }); });
  const putVideo = (v) => tx('videos', 'readwrite', (s) => { s.videos.put(v); });
  const getVideo = (vid) => tx('videos', 'readonly', (s) => s.videos.get(vid));
  const videosOf = (gameId) => tx('videos', 'readonly', (s) => s.videos.index('gameId').getAll(gameId)).then((list) => (list || []).sort((a, b) => a.startedAt - b.startedAt));
  const allVideos = () => tx('videos', 'readonly', (s) => s.videos.getAll()).then((list) => list || []);
  const chunks = (vid) => tx('chunks', 'readonly', (s) => s.chunks.getAll(range(vid))).then((list) => (list || []).sort((a, b) => a.i - b.i).map((c) => c.blob));
  /* 録画した動画そのもの（切れはしをつないだもの） */
  async function raw(vid, mime) { return new Blob(await chunks(vid), { type: mime || 'video/mp4' }); }
  /* 保存・再生に使う動画（組み直した MP4。組み立て図がなければ、録画したまま） */
  async function file(vid) {
    const v = await getVideo(vid);
    if (!v) return null;
    const blob = await raw(vid, v.mime);
    const out = v.plan && ST.fmp4 ? ST.fmp4.compose(blob, Object.assign({ flat: true }, v.plan), 'video/mp4') : blob;
    try { return new File([out], v.name || ('video.' + (v.ext || 'mp4')), { type: v.plan ? 'video/mp4' : (v.mime || 'video/mp4'), lastModified: v.startedAt }); } catch (e) { return out; }
  }
  const remove = (vid) => tx(['videos', 'chunks'], 'readwrite', (s) => { s.videos.delete(vid); s.chunks.delete(range(vid)); });
  async function removeGame(gameId) { const list = await videosOf(gameId); for (const v of list) await remove(v.vid); return list.length; }
  async function estimate() {
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); return { usage: e.usage || 0, quota: e.quota || 0 }; } } catch (e) { /* 分からない */ }
    return null;
  }

  ST.vstore = { supported, open, putChunk, putVideo, getVideo, videosOf, allVideos, chunks, raw, file, remove, removeGame, estimate, DB };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/camera.js */
/* スポーツ タップ記録 — （バスケ タップ記録と同じしくみ）この端末のカメラで撮影しながら記録する
   カメラ（getUserMedia）の映像を、ブラウザの録画（MediaRecorder）で録る。
   録画を始めた時刻（startedAt）を記録と同じ時計（Date.now）で持つので、あとで動画と記録の時刻を合わせる必要がない
   （記録の t 秒 ＝ 動画の t ＋（記録のスタート − 録画の始まり）秒）。
   録画は数秒ごとに IndexedDB へ保存し（vstore）、止めたら、ふつうの MP4 に組み直す図を作る（fmp4.flatten）。
   1回の録画（録画を始めてから止めるまで）＝ 動画1本。途中で止めて、また始めると、別の動画になる（それぞれに始まりの時刻がある）。 */
(function (root) {
  'use strict';
  const ST = root.ST = root.ST || {};

  const QUALITY = {
    '720': { w: 1280, h: 720, bps: 3000000, label: '720p（ふつう）', perHour: 1.4 },
    '1080': { w: 1920, h: 1080, bps: 6000000, label: '1080p（きれい・容量 2 倍）', perHour: 2.8 }
  };
  const SLICE = 1000;          // 何ミリ秒ごとに受け取って保存するか
  // （Chrome は、キーフレームで区切った「ひとまとまり」がそろってから渡すので、区切りも 1 秒ごとにする。
  //   途中でページが閉じたとき失うのは、最後の数秒）

  function supported() {
    try { return !!(root.navigator && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && root.MediaRecorder); } catch (e) { return false; }
  }
  /* 録画の形式：MP4 を優先（iPhone・iPad の Safari は H.264、Chrome は H.264 か VP9）。だめなら WebM */
  function pickMime(audio) {
    const list = audio
      ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4;codecs=vp9,opus', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
      : ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4;codecs=vp9', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { /* 次 */ } }
    return '';
  }
  const extOf = (mime) => (/webm/.test(mime || '') ? 'webm' : 'mp4');

  function create() {
    const bus = {};
    const emit = (ev, a) => (bus[ev] || []).forEach((fn) => { try { fn(a); } catch (e) { /* 表示の失敗で止めない */ } });
    const C = {
      stream: null, rec: null, seg: null, state: 'off', opts: null, error: null,
      on(ev, fn) { (bus[ev] = bus[ev] || []).push(fn); },
      /* カメラを開く。opts: { quality: '720' | '1080', audio: true | false } */
      async open(opts) {
        C.opts = Object.assign({ quality: '720', audio: true }, opts || {});
        if (C.stream && C.stream.getVideoTracks().some((t) => t.readyState === 'live')) return C.stream;
        const q = QUALITY[C.opts.quality] || QUALITY['720'];
        const video = { facingMode: { ideal: 'environment' }, width: { ideal: q.w }, height: { ideal: q.h }, frameRate: { ideal: 30, max: 30 } };
        const audio = C.opts.audio ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false } : false;
        let st;
        try { st = await navigator.mediaDevices.getUserMedia({ video, audio }); } catch (e) {
          // 音（マイク）を断られたときは、映像だけで
          if (audio && e && (e.name === 'NotAllowedError' || e.name === 'NotFoundError')) { st = await navigator.mediaDevices.getUserMedia({ video, audio: false }); C.opts.audio = false; emit('notice', 'マイクが使えないので、音なしで撮ります'); } else throw e;
        }
        C.stream = st;
        st.getVideoTracks().forEach((t) => t.addEventListener('ended', () => emit('trackended')));
        C.setState(C.rec ? C.state : 'ready');
        return st;
      },
      setState(s) { C.state = s; emit('state', s); },
      settings() { const t = C.stream && C.stream.getVideoTracks()[0]; return t && t.getSettings ? t.getSettings() : {}; },
      live() { return !!(C.stream && C.stream.getVideoTracks().some((t) => t.readyState === 'live')); },
      /* 録画を始める。meta: { gameId, n, base（ファイル名のもと）, rotate（映す向き：時計回りの角度） }。戻り値：動画の情報（vstore の videos の形） */
      async start(meta) {
        if (C.rec) return C.seg;
        if (!C.live()) await C.open(C.opts);
        const q = QUALITY[C.opts.quality] || QUALITY['720'];
        const mime = pickMime(C.opts.audio && C.stream.getAudioTracks().length > 0);
        const ro = { videoBitsPerSecond: q.bps, audioBitsPerSecond: 96000, videoKeyFrameIntervalDuration: 1000 };      // （知らない設定は、ブラウザが無視する）
        if (mime) ro.mimeType = mime;
        let rec;
        try { rec = new MediaRecorder(C.stream, ro); } catch (e) { delete ro.videoKeyFrameIntervalDuration; rec = new MediaRecorder(C.stream, ro); }
        const s = C.stream.getVideoTracks()[0].getSettings ? C.stream.getVideoTracks()[0].getSettings() : {};
        const vid = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        const rotate = [90, 180, 270].includes(meta.rotate) ? meta.rotate : 0;
        const rw = s.width || q.w, rh = s.height || q.h;
        const seg = C.seg = {
          vid, gameId: meta.gameId, n: meta.n || 1, startedAt: null, endedAt: null, mime: rec.mimeType || mime || 'video/webm', ext: '',
          w: rotate % 180 ? rh : rw, h: rotate % 180 ? rw : rh, rotate,            // w・h は映すときの大きさ（回したあと）
          bytes: 0, chunks: 0, status: 'recording', plan: null, duration: null, name: ''
        };
        seg.ext = extOf(seg.mime);
        seg.name = `${meta.base || 'スポーツ動画'}_動画${seg.n}.${seg.ext}`;
        let chain = Promise.resolve();
        let i = 0;
        const stopped = new Promise((resolve) => { rec.addEventListener('stop', () => resolve()); });
        rec.addEventListener('dataavailable', (e) => {
          if (!e.data || !e.data.size) return;
          const k = i++, blob = e.data;
          seg.bytes += blob.size; seg.chunks = i;
          // 保存は届いた順に1つずつ（順番が入れかわらないように）
          chain = chain.then(() => ST.vstore.putChunk(vid, k, blob)).then(() => ST.vstore.putVideo(Object.assign({}, seg, { plan: null }))).catch((err) => { C.error = err; emit('error', err); });
          emit('progress', seg);
        });
        rec.addEventListener('error', (e) => { C.error = (e && e.error) || new Error('録画でエラーが起きました'); emit('error', C.error); });
        const started = new Promise((resolve) => { rec.addEventListener('start', () => { seg.startEvt = Date.now(); resolve(); }); });
        C.rec = rec;
        C.flush = () => chain;
        C.stopped = stopped;
        // 録画を始めた時刻は「start() を呼ぶ直前」。録画が始まった知らせ（start）は、実際の始まりより 0.05〜0.1 秒おそい
        // （Chromium で、映像に映した時刻と比べて確かめた。直前の時刻なら、ずれは 0.03 秒以内）
        seg.startCall = Date.now();
        seg.startedAt = seg.startCall;
        rec.start(SLICE);
        await Promise.race([started, new Promise((r) => setTimeout(r, 1500))]);
        await ST.vstore.putVideo(Object.assign({}, seg));
        C.setState('recording');
        emit('start', seg);
        return seg;
      },
      elapsed() { return C.seg && C.seg.startedAt && C.rec ? (Date.now() - C.seg.startedAt) / 1000 : 0; },
      /* 録画を止めて、仕上げる（ふつうの MP4 に組み直す図を作る）。戻り値：動画の情報 */
      async stop() {
        const rec = C.rec, seg = C.seg;
        if (!rec || !seg) return null;
        C.setState('finishing');
        try { if (rec.state !== 'inactive') rec.stop(); } catch (e) { /* もう止まっている */ }
        await Promise.race([C.stopped, new Promise((r) => setTimeout(r, 4000))]);
        await C.flush();
        seg.endedAt = Date.now();
        C.rec = null; C.seg = null;
        const done = await finish(seg);
        C.setState(C.live() ? 'ready' : 'off');
        emit('done', done);
        return done;
      },
      /* カメラを閉じる（録画中なら、止めて仕上げてから） */
      async close() {
        let done = null;
        if (C.rec) done = await C.stop();
        if (C.stream) C.stream.getTracks().forEach((t) => { try { t.stop(); } catch (e) { /* 無視 */ } });
        C.stream = null;
        C.setState('off');
        return done;
      }
    };
    return C;
  }

  /* 録画を仕上げる：切れはしをつないで、MP4 なら組み直す図を作り、長さを決めて保存する。

    /* 撮影した動画の一覧（試合のあと・書き出す） */

    }
    async function saveVideo(v) {
      ST.ui.toast('動画を用意しています…', '', 3000);

      const r = await ST.ui.shareOrDownload(f.name || v.name, f, true);

      ST.ui.confirm(`動画${v.n}をこの端末から消しますか？`, `${ST.fmtTime(v.duration || 0)}・${mb(v.bytes)}。消すと元に戻せません（保存した動画・記録は残ります）。`, '消す', async () => {
        try { await ST.vstore.remove(v.vid); } catch (e) { /* もうない */ }

        api.save();
        api.update();
        ST.ui.toast('消しました', 'ok');

        api.update();

    /* 画面を離れた・戻った */
    function onVisibility(hidden) {

    function settingsPart(reopen) {

        h('label', { class: 'chk' }, h('input', { type: 'checkbox', dataset: { pref: 'camAudio' }, checked: p.audio !== false, onchange: (e) => { p.audio = e.target.checked; api.savePrefs(); } }), '録画に音も入れる（笛・声援）'),
        h('p', { class: 'note' }, `1時間あたり、720p で約 ${ST.camera.QUALITY['720'].perHour}GB・1080p で約 ${ST.camera.QUALITY['1080'].perHour}GB。次にカメラを開いたときから変わります。`));
    }
    const menuItem = () => (supported() ? { icon: '📹', label: rec() ? '撮影（録画中）' : '撮影しながら記録', sub: rec() ? '録画を止める・ワイプの大きさ・空き容量' : 'この端末のカメラで録画（時刻は自動で合う）', fn: openSheet } : null);
    const detach = () => { if (M.el) { M.el.thumb.srcObject = null; M.el.wv.srcObject = null; } M.el = null; };

  }
