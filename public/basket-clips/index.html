<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バスケ得点クリップ</title>
<meta name="description" content="バスケの試合動画から、点を入れた場面・入れられた場面を5秒ずつ切り出して、続けて見たり1本の動画にしたりするブラウザアプリ（動画はどこにも送りません）">
<style>
/* バスケ得点クリップ */
:root {
  --bg: #f4f6fa;
  --panel: #ffffff;
  --panel2: #f1f4f9;
  --line: #dde3ec;
  --line2: #c9d2df;
  --text: #182031;
  --muted: #5d6b82;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.10);
  --good: #16a34a;
  --warn: #b45309;
  --warn-soft: rgba(245, 158, 11, 0.14);
  --bad: #dc2626;
  --radius: 12px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d121c;
    --panel: #151c2a;
    --panel2: #1c2536;
    --line: #273248;
    --line2: #34425e;
    --text: #e8eef8;
    --muted: #9aa8c0;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.16);
    --good: #22c55e;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.14);
    --bad: #f87171;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand .logo { font-size: 26px; }
.brand b { display: block; font-size: 16px; letter-spacing: 0.02em; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: -2px; }
.actions { display: flex; gap: 6px; align-items: center; }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; font-size: 13px; line-height: 1.3; white-space: nowrap; transition: background 0.12s, border-color 0.12s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn .ico { pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 12.5px; border-radius: 7px; }
.btn.big { padding: 10px 18px; font-size: 15px; font-weight: 700; border-radius: 10px; }
.btn.icon { padding: 6px 9px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
a.btn { text-decoration: none; }

/* ---------- レイアウト ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); gap: 14px; padding: 14px; align-items: start; max-width: 1500px; margin: 0 auto; }
.stage { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 64px; min-width: 0; }
.panel { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; padding: 10px 16px; }
  .stage { position: static; }
}

/* ---------- 映像 ---------- */
.viewer { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; }
.media-slot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.media-el { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.empty-media { color: #9aa8c0; text-align: center; padding: 20px; }
.empty-media b { color: #e8eef8; font-size: 16px; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
.ov-badge { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; background: rgba(8, 12, 20, 0.78); color: #fff; border-left: 6px solid var(--team, #3b82f6); border-radius: 8px; padding: 5px 12px 6px; pointer-events: none; }
.ov-badge b { font-size: 15px; }
.ov-badge span { font-size: 12px; color: #c9d4e6; }
.ov-drop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(37, 99, 235, 0.55); color: #fff; font-size: 20px; font-weight: 700; border: 3px dashed #fff; border-radius: var(--radius); pointer-events: none; }
.transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.transport .btn.play { min-width: 44px; font-size: 15px; }
.transport select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 6px; font-size: 13px; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-left: 4px; }
.spacer { flex: 1; }
.reelbar { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 2px 6px; font-size: 12.5px; }
#timeline { width: 100%; height: 40px; border-radius: 8px; cursor: pointer; display: block; touch-action: none; }

/* ---------- カード ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.step-h b { font-size: 15.5px; }
.step-h small { color: var(--muted); font-size: 12px; }
.step-h .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
.step-h .num.done { background: var(--good); }
.card p { margin: 6px 0; }
.note { color: var(--muted); font-size: 12.5px; }
.note.warn, .warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fname { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.switch { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; margin: 8px 0 2px; cursor: pointer; }
.switch input { margin-top: 3px; }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.6); vertical-align: -2px; flex: none; }

/* チームの色 */
.teamrow { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.teamrow:first-of-type { border-top: 0; }
.tlabel { display: flex; align-items: center; gap: 8px; }
.tlabel b { font-size: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(128, 128, 128, 0.55); padding: 0; position: relative; }
.sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.swc { width: 34px; height: 30px; padding: 0 2px; border: 1px dashed var(--line2); border-radius: 8px; background: var(--panel2); cursor: pointer; }
.tname { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; max-width: 280px; }

/* ゴール */
.howto { margin: 4px 0 10px; }
.howto summary, .half summary, .setupfold summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.howfig { color: var(--muted); max-width: 360px; margin: 8px 0; }
.howfig svg { width: 100%; height: auto; display: block; }
.howto ol { margin: 6px 0; padding-left: 20px; font-size: 13px; }
.markcard { border: 2px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.goal { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: flex; flex-direction: column; gap: 8px; }
.goal.done { border-color: rgba(22, 163, 74, 0.5); }
.goal-h { display: flex; align-items: center; gap: 6px; }
.goal-h .note { margin-left: 6px; }
.thumbrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hoopthumb { border-radius: 6px; background: #000; }
.attack { display: flex; flex-direction: column; gap: 4px; }
.teambtn .chip { width: 12px; height: 12px; }
.half { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.half p { font-size: 12.5px; }
.progress { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 8px 0; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.setupfold { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.setupfold[open] { display: flex; flex-direction: column; gap: 12px; }
.setupfold .card { border: 0; padding: 4px 0 0; border-top: 1px solid var(--line); border-radius: 0; }

/* ---------- 結果 ---------- */
.results { display: flex; flex-direction: column; gap: 10px; }
.tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab2 { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items: center; gap: 2px 8px; text-align: left; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; position: relative; overflow: hidden; }
.tab2::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--team); border-right: 1px solid rgba(128, 128, 128, 0.4); }
.tab2 .big { font-size: 16px; font-weight: 800; padding-left: 4px; }
.tab2 .cnt { grid-row: span 2; font-size: 13px; }
.tab2 .cnt b { font-size: 28px; line-height: 1; margin-right: 2px; }
.tab2 small { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; padding-left: 4px; }
.tab2.on { border-color: var(--accent); background: var(--accent-soft); }
.tab2 .big, .tab2 small { white-space: nowrap; }
@media (max-width: 520px) {
  .tab2 { grid-template-columns: 1fr; padding: 8px 10px; }
  .tab2 .big { font-size: 15px; }
  .tab2 .cnt { grid-row: auto; padding-left: 4px; }
  .tab2 .cnt b { font-size: 24px; }
  .winrow input { width: 52px; }
}
.winrow { font-size: 13px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.winrow input { width: 64px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 6px; }
.cliplist { display: flex; flex-direction: column; gap: 6px; max-height: 470px; overflow-y: auto; padding-right: 2px; }
.cliplist .empty { padding: 10px; }
.clip { display: grid; grid-template-columns: auto auto 112px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-left: 5px solid var(--team); border-radius: 10px; background: var(--panel); cursor: pointer; }
.clip:hover { border-color: var(--accent); border-left-color: var(--team); }
.clip.off { opacity: 0.5; }
.clip.playing { background: var(--accent-soft); border-color: var(--accent); border-left-color: var(--team); }
.clip .ix { font-weight: 800; color: var(--muted); min-width: 18px; text-align: right; }
.clip .thumb { width: 112px; height: 63px; object-fit: cover; border-radius: 6px; background: #0b1020; display: block; }
.clip .ct { display: flex; flex-direction: column; min-width: 0; }
.clip .ct b { font-size: 15px; font-variant-numeric: tabular-nums; }
.clip .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line2); color: var(--muted); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.clip .cops { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 520px) {
  .clip { grid-template-columns: auto 88px 1fr; }
  .clip .ix { display: none; }
  .clip .thumb { width: 88px; height: 50px; }
  .clip .cops { grid-column: 1 / -1; justify-content: flex-start; }
}
.maybes { border: 1px dashed var(--line2); border-radius: 10px; padding: 8px 12px; }
.maybes summary { cursor: pointer; font-size: 13px; font-weight: 700; }
.maybes p { margin: 6px 0; }
.mblist { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
.mb { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; background: var(--panel2); }
.mb b { font-variant-numeric: tabular-nums; }
.acts { margin-top: 2px; }
.exportbox { border: 1px dashed var(--line2); border-radius: 10px; padding: 8px 12px; }
.exportbox .outvideo { width: 100%; max-height: 260px; background: #000; border-radius: 8px; margin: 6px 0; display: block; }
.tools { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.tool { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.tool.hint { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 10px; }

/* ---------- 小窓・お知らせ ---------- */
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(640px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); }
.modal-card header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-card header .x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); }
.modal-body { padding: 12px 18px; overflow-y: auto; font-size: 13.5px; }
.modal-body h4 { margin: 14px 0 4px; }
.modal-body ol, .modal-body ul { padding-left: 20px; margin: 6px 0; }
.modal-body li { margin: 3px 0; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 120; width: min(560px, calc(100% - 32px)); pointer-events: none; }
.toast { background: #1f2937; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); border-left: 5px solid #64748b; }
.toast.ok { border-left-color: #22c55e; }
.toast.warn { border-left-color: #f59e0b; }
.toast.err { border-left-color: #ef4444; }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🏀</span><div><b>バスケ得点クリップ</b><small>点を入れた・入れられた場面を5秒ずつ</small></div></div>
    <div class="actions">
      <button id="btnOpen" class="btn primary">🎬 動画を選ぶ</button>
      <button id="btnHelp" class="btn icon" title="使い方" aria-label="使い方">❓</button>
    </div>
    <input type="file" id="fileVideo" accept="video/*,.mp4,.mov,.m4v,.webm" hidden>
  </header>

  <main class="main">
    <section class="stage" aria-label="映像">
      <div class="viewer" id="viewer">
        <div class="media-slot" id="mediaSlot">
          <div class="empty-media"><b>試合の動画を選んでください</b><br>「🎬 動画を選ぶ」か、ここに動画ファイルをドロップ</div>
        </div>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div class="ov-badge" id="ovBadge" hidden></div>
        <div class="ov-drop" id="ovDrop" hidden>ここに動画ファイルをドロップ</div>
      </div>
      <div class="transport" id="transport">
        <button class="btn play" id="btnPlay" title="再生 / 一時停止（スペース）"><span class="ico">▶</span></button>
        <button class="btn" id="btnBack" title="5秒戻る（← で2秒）">−5秒</button>
        <button class="btn" id="btnFwd" title="5秒進む（→ で2秒）">+5秒</button>
        <button class="btn small" id="btnPrevF" title="1コマ戻る（,）">◂</button>
        <button class="btn small" id="btnNextF" title="1コマ進む（.）">▸</button>
        <select id="speedSel" title="再生の速さ" aria-label="再生の速さ"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option></select>
        <span class="time" id="timeText">0:00 / 0:00</span>
        <span class="spacer"></span>
        <span class="reelbar" id="reelBar" hidden>
          <span id="reelLabel"></span>
          <button class="btn small" id="reelPrev" title="前の場面">⏮</button>
          <button class="btn small" id="reelStop" title="続けて再生をやめる">⏹</button>
          <button class="btn small" id="reelNext" title="次の場面">⏭</button>
        </span>
      </div>
      <canvas id="timeline" title="クリック・ドラッグで移動（上の段＝入れた、下の段＝入れられた）"></canvas>
    </section>

    <section class="panel" id="panel" aria-label="操作"></section>
  </main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* js/core.js */
/* バスケ得点クリップ — 共通の小さな道具（名前空間・数値・時刻の書式・イベント）
   DOM に依存しないので node のテストからも読み込める。
   名前空間は「バスケ分析スタジオ」と同じ BS（解析エンジンのファイルを、そのまま共有するため）。 */
(function (root) {
  'use strict';
  const BS = root.BS = root.BS || {};
  BS.APP = 'バスケ得点クリップ';

  BS.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。withTenths で 0.1 秒まで */
  BS.fmtTime = function (sec, withTenths) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (withTenths) out += '.' + Math.floor((sec * 10) % 10);
    return out;
  };

  /* 小さなイベントの仕組み（on で登録、emit で通知） */
  BS.emitter = function () {
    const map = new Map();
    return {
      on(name, fn) { if (!map.has(name)) map.set(name, new Set()); map.get(name).add(fn); return () => map.get(name).delete(fn); },
      off(name, fn) { if (map.has(name)) map.get(name).delete(fn); },
      emit(name, payload) {
        if (!map.has(name)) return;
        for (const fn of Array.from(map.get(name))) {
          try { fn(payload); } catch (err) { if (typeof console !== 'undefined') console.error('[BS] handler error', name, err); }
        }
      }
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/vision.js */
/* バスケ分析スタジオ — 画像処理の部品（DOM 非依存・node でも動く）
   グレースケール化、縮小、テンプレート照合（NCC）、全体の動き推定、連結成分、パッチ切り出し。 */
(function (root) {
  function mod(root) {
    'use strict';
    const BS = root.BS = root.BS || {};

    /* RGBA / BGRA → グレースケール（Uint8） */
    function toGray(src, w, h, order, out) {
      const n = w * h;
      const g = out || new Uint8Array(n);
      const ri = order === 'bgra' ? 2 : 0, bi = order === 'bgra' ? 0 : 2;
      for (let i = 0, p = 0; i < n; i++, p += 4) {
        g[i] = (src[p + ri] * 77 + src[p + 1] * 150 + src[p + bi] * 29) >> 8;
      }
      return g;
    }

    /* グレースケールを整数倍で縮小（平均） */
    function shrinkGray(src, w, h, k) {
      const dw = Math.floor(w / k), dh = Math.floor(h / k);
      const out = new Uint8Array(dw * dh);
      const kk = k * k;
      for (let y = 0; y < dh; y++) {
        for (let x = 0; x < dw; x++) {
          let s = 0;
          for (let j = 0; j < k; j++) {
            const row = (y * k + j) * w + x * k;
            for (let i = 0; i < k; i++) s += src[row + i];
          }
          out[y * dw + x] = (s / kk) | 0;
        }
      }
      return { data: out, w: dw, h: dh };
    }

    /* カラー画像（RGBA/BGRA）を整数倍で縮小してグレースケールにする（速い） */
    function grayShrink(src, w, h, k, order) {
      const dw = Math.floor(w / k), dh = Math.floor(h / k);
      const out = new Uint8Array(dw * dh);

        }
        // (b) 画面全体から探す（1/4 の解像度で粗く → 候補だけ解析幅で詰める）。1コマにつき倍率を1つ。
        //     偶数コマ：決まった倍率を順番に。奇数コマ：最後に見えていたときの倍率（同じ大きさで戻ってくることが多い。画面の端で一部だけ映っていてもよい）
        const turn = (st.frame + (phase || 0)) % 2 === 0;
        if (turn || st.everSeen) {
          const sc = turn ? GLOBAL_SCALES[(st.frame >> 1) % GLOBAL_SCALES.length] : st.scale;
          const cands = globalSearch(quarter, sc, !turn);
          let bestB = null;
          for (const g of cands) {
            // まず同じ倍率で詰め、見込みがあるときだけ前後の倍率も試す
            let b = tryScales(gray, w, h, g.cx * 4, g.cy * 4, [sc], 8, 2);
            if (b.score >= TH_ACQ - 0.12) {
              const b2 = tryScales(gray, w, h, b.x + b.T.tw / 2, b.y + b.T.th / 2, [sc * 1.08, sc / 1.08], 4, 2);
              if (b2.score > b.score) b = b2;
            }
            if (!bestB || b.score > bestB.score) bestB = b;
          }
          if (bestB && bestB.score >= TH_ACQ) { accept(bestB); subpixel(gray, w, h); return status(); }
        }
        return status();
      }
      /* 推定位置 (cx,cy)（解析幅の画素）のまわり ±R を、1/4 の解像度で粗く探してから解析幅で詰める */
      function nearSearch(gray, w, h, q, sc, cx, cy, R) {
        const T = quarterTemplate(sc);
        const r = Math.ceil(R / 4);
        const x0 = Math.round(cx / 4 - T.tw / 2), y0 = Math.round(cy / 4 - T.th / 2);
        let best = -2, bx = 0, by = 0;
        const xMax = q.w - T.tw, yMax = q.h - T.th;
        for (let y = y0 - r; y <= y0 + r; y++) {
          for (let x = x0 - r; x <= x0 + r; x++) {
            const sco = (x >= 0 && y >= 0 && x <= xMax && y <= yMax) ? V.nccFast(q.data, q.w, T, x, y) : V.nccAt(q.data, q.w, q.h, T, x, y);
            if (sco > best) { best = sco; bx = x; by = y; }
          }
        }
        if (best < TH_COARSE) return null;
        return tryScales(gray, w, h, (bx + T.tw / 2) * 4, (by + T.th / 2) * 4, [sc], 6, 2);
      }
      /* 1/4 の解像度で、ある倍率のテンプレートを全体に当てて、上位の候補を返す。partial: 画面の端からはみ出した位置（4割まで）も調べる */
      function globalSearch(q, sc, partial) {
        const T = quarterTemplate(sc);
        const top = [];
        const xMax = q.w - T.tw, yMax = q.h - T.th;
        const data = q.data, qw = q.w;
        const mx = partial ? Math.floor(T.tw * 0.4) : 0, my = partial ? Math.floor(T.th * 0.4) : 0;
        for (let y = -my; y <= yMax + my; y++) {
          for (let x = -mx; x <= xMax + mx; x++) {
            const inside = x >= 0 && y >= 0 && x <= xMax && y <= yMax;
            if (!inside && ((x & 1) || (y & 1))) continue;      // はみ出した位置は1つおき（遅い計算なので）
            if (inside && V.nccFast(data, qw, T.sparse, x, y) < TH_COARSE - 0.1) continue;   // 下見
            const sco = inside ? V.nccFast(data, qw, T, x, y) : V.nccAt(data, qw, q.h, T, x, y);
            if (sco < TH_COARSE + 0.03) continue;
            const cx = x + T.tw / 2, cy = y + T.th / 2;
            let merged = false;
            for (const c of top) {
              if (Math.abs(c.cx - cx) < T.tw * 0.6 && Math.abs(c.cy - cy) < T.th * 0.6) { if (sco > c.score) { c.score = sco; c.cx = cx; c.cy = cy; } merged = true; break; }
            }
            if (!merged) top.push({ score: sco, cx, cy });
          }
        }
        top.sort((p, r) => r.score - p.score);
        return top.slice(0, 2);
      }
      /* いまのコマで「捉えた」のを取り消して、見失った状態に戻す */
      function revert() {
        const p = st.snap;
        if (!p) return;
        st.scale = p.scale; st.T = p.T; st.fine = p.fine;
        st.tracked = false; st.lost = p.lost + 1; st.drift = p.drift; st.score = 0;
        st.x = p.px; st.y = p.py;
      }
      /* 追跡をやめる（別のものに張り付いていると分かったとき）。場所の手がかりも捨てる */
      function drop() { st.tracked = false; st.lost = PRIOR_FRAMES; st.score = 0; }
      function status() {
        // 見かけの倍率（端数込み）と、1画素より細かい位置で、リングの位置と幅を出す
        const es = st.scale * Math.pow(SC_STEP, st.tracked ? st.fine : 0);
        const fx = st.tracked ? st.fx : 0, fy = st.tracked ? st.fy : 0;
        const ccx = st.x + fx + st.T.tw / 2, ccy = st.y + fy + st.T.th / 2;
        const rimCx = (ccx + (st.rimOff.x - st.bw / 2) * es) * k, rimCy = (ccy + (st.rimOff.y - st.bh / 2) * es) * k;
        return {
          id: st.id, tracked: st.tracked, acquired: st.tracked && !!st.snap && !st.snap.tracked, score: st.score, scale: es,
          box: { x: (ccx - st.bw * es / 2) * k, y: (ccy - st.bh * es / 2) * k, w: st.bw * es * k, h: st.bh * es * k },
          rim: { cx: rimCx, cy: rimCy, w: st.rimW0 * es * k },
          inFrame: rimCx > 0 && rimCx < srcW && rimCy > 0 && rimCy < srcH
        };
      }
      return { init, update, status, revert, drop, state: st };
    }

    /* ---------- 固定カメラ用のゴール ----------
       360°カメラ・広角カメラなど、コート全体が映りっぱなしでカメラが動かない映像では、ゴールは動かない。
       追いかけずに、指定した場所をそのまま見張る（バックボードの模様が小さくて追跡が不安定になることもない）。
       リングの色での確認（verifyRim）は、そのまま使う。リングが選手に隠れたコマは、そのコマだけ使わない。 */
    function createFixedTracker(mark, srcW, srcH) {
      const st = { id: mark.id, frame: 0, tracked: true, score: 1, lost: 0, everSeen: true, fixed: true };
      let first = true;
      function status() {
        const rim = { cx: mark.rim.cx, cy: mark.rim.cy, w: mark.rim.w };
        return {
          id: mark.id, tracked: true, acquired: first, score: 1, scale: 1, fixed: true,
          box: { x: mark.box.x, y: mark.box.y, w: mark.box.w, h: mark.box.h }, rim,
          inFrame: rim.cx > 0 && rim.cx < srcW && rim.cy > 0 && rim.cy < srcH
        };
      }
      function update() { st.frame++; const s = status(); first = false; return s; }
      return { init() {}, update, status, revert() {}, drop() {}, state: st };
    }

    /* ---------- リングの色での確認と、位置の微調整 ----------
       バックボードの模様（白黒）だけでは、床の反射などに誤って張り付くことがある。
       リングは赤〜オレンジの輪なので、「リングのまわりの赤みの模様」を、指定したときのものと照合する。
       本物なら 0.7 以上、床などの偽物なら 0.3 以下になる（実動画で確認）。合った位置のずれは、リング位置の微調整に使う。 */
    const RV = 64;                  // リングを中心に、リング幅の2倍の範囲を RV×RV に切り出す（リング幅 = WC 画素）
    const RCW = 48, RCH = 28;       // 照合に使う中心部分（横 ±0.75w・縦 ±0.44w）
    const RSH = 5;                  // ずれを探す範囲（画素）
    const TH_RIM_ACQ = 0.45;        // 捉えた瞬間、これ未満なら取り消す
    const TH_RIM_OK = 0.6;          // これ以上なら位置の微調整に使う
    const TH_RIM_LOW = 0.25, RIM_LOW_FRAMES = 15;   // これ未満が約1秒続いたら、別のものに張り付いているとみなして追跡をやめる
    // （バスケ得点クリップで足したもの）リングが「隠れているだけ」とみなす条件：直前にリングを確かめられてから OCCL_MAX 秒以内で、
    // バックボードの模様はよく合っている（OCCL_NCC 以上）。ボールがリングの上で弾む・転がる間は、オレンジのボールが輪に重なって
    // 赤みの模様が崩れるため、そのコマを捨てると、ネットから出てくるボールを見逃す（背景の学び直しで数コマ何も見えなくなる）
    const OCCL_MAX = 1.5, OCCL_NCC = 0.7;
    function redness(rgb, out) {
      const n = RV * RV, raw = new Float32Array(n);
      for (let i = 0, p = 0; i < n; i++, p += 3) raw[i] = rgb[p] / (rgb[p] + rgb[p + 1] + rgb[p + 2] + 1);
      const o = out || new Float32Array(n);
      for (let y = 0; y < RV; y++) {
        const y0 = y > 0 ? y - 1 : 0, y1 = y < RV - 1 ? y + 1 : RV - 1;
        for (let x = 0; x < RV; x++) {
          const x0 = x > 0 ? x - 1 : 0, x1 = x < RV - 1 ? x + 1 : RV - 1;
          o[y * RV + x] = (raw[y0 * RV + x0] + raw[y0 * RV + x] + raw[y0 * RV + x1] + raw[y * RV + x0] + raw[y * RV + x] + raw[y * RV + x1] + raw[y1 * RV + x0] + raw[y1 * RV + x] + raw[y1 * RV + x1]) / 9;
        }
      }
      return o;
    }
    function createRimChecker() {
      let ref = null, usable = false;
      const cur = new Float32Array(RV * RV);
      const cx0 = (RV - RCW) / 2, cy0 = (RV - RCH) / 2;
      /* 指定したコマのリング周辺（RGB, RV×RV）を見本にする */
      function init(rgb) {
        ref = redness(rgb);
        let s = 0, s2 = 0;
        for (let y = 0; y < RCH; y++) for (let x = 0; x < RCW; x++) { const v = ref[(cy0 + y) * RV + cx0 + x]; s += v; s2 += v * v; }
        const n = RCW * RCH;
        usable = s2 / n - (s / n) * (s / n) > 1e-4;      // 赤みの模様がほとんど無いリング（色あせ・白黒映像）では確認しない
      }
      /* (dx,dy) だけずらしたときの照合。valid: 画面内にある範囲（切り出し上の座標） */
      function nccShift(dx, dy, v) {
        let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0, n = 0;
        for (let y = 0; y < RCH; y++) {
          const yy = cy0 + y + dy;
          if (yy < v.y0 || yy > v.y1) continue;
          const ra = (cy0 + y) * RV + cx0, rb = yy * RV + cx0 + dx;
          for (let x = 0; x < RCW; x++) {
            const xx = cx0 + x + dx;
            if (xx < v.x0 || xx > v.x1) continue;
            const a = ref[ra + x], b = cur[rb + x];
            sa += a; sb += b; saa += a * a; sbb += b * b; sab += a * b; n++;
          }
        }
        if (n < RCW * RCH * 0.4) return null;
        const va = saa / n - (sa / n) * (sa / n), vb = sbb / n - (sb / n) * (sb / n);
        if (va < 1e-7 || vb < 1e-7) return 0;
        return (sab / n - (sa / n) * (sb / n)) / Math.sqrt(va * vb);
      }
      /* いまのコマのリング周辺と見本を照合。戻り値: { score（確認できないときは null）, dx, dy（切り出し上の画素。1画素より細かい） } */
      function check(rgb, valid) {
        if (!usable) return { score: null, dx: 0, dy: 0 };
        redness(rgb, cur);
        let best = -2, bx = 0, by = 0;
        for (let dy = -RSH; dy <= RSH; dy++) for (let dx = -RSH; dx <= RSH; dx++) {
          const sc = nccShift(dx, dy, valid);
          if (sc != null && sc > best) { best = sc; bx = dx; by = dy; }
        }
        if (best < -1) return { score: null, dx: 0, dy: 0 };
        const peak = (a, b) => { if (a == null || b == null) return 0; const den = a - 2 * best + b; return den < -1e-6 ? clampN(0.5 * (a - b) / den, -0.5, 0.5) : 0; };
        const fx = Math.abs(bx) < RSH ? peak(nccShift(bx - 1, by, valid), nccShift(bx + 1, by, valid)) : 0;
        const fy = Math.abs(by) < RSH ? peak(nccShift(bx, by - 1, valid), nccShift(bx, by + 1, valid)) : 0;
        return { score: best, dx: bx + fx, dy: by + fy };
      }
      return { init, check };
    }

    /* ---------- ゴール周辺の監視（ボール候補を見つける） ----------
       ゴール（リング）を中心に、リング幅が WC 画素になるよう拡大縮小した正方形（パッチ）を切り出す。
       カメラが動いてもパッチの中ではゴールが動かないので、背景との差分で「動いているもの」だけが残る。 */
    const WC = 32;                 // パッチ上でのリング幅（画素）
    const PS = 208;                // パッチの1辺（= 6.5 × リング幅）
    const PCY = 0.25;              // パッチ中心はリング中心より 0.25w 下（リングの下も広く見る）
    const STILL_DIFF = 30;         // 1コマ前との差（RGB の合計）がこれ未満なら「変わっていない」
    const STILL_FRAMES = 5;        // これだけ続けて変わっていない画素は「止まっている」
    const GHOST_FRAMES = 10;       // 前景のままこれだけ止まっていたら、背景に取り込み始める
    const BALL_D = 0.53 * WC;      // ボールの直径（リング幅の 0.53 倍）
    const BALL_A = Math.PI * (BALL_D / 2) * (BALL_D / 2);

    function createHoopWatcher(id) {
      const n = PS * PS;
      const bg = new Float32Array(n * 3);
      const mask = new Uint8Array(n);
      const patch = new Uint8Array(n * 3);
      const prev = new Uint8Array(n * 3);      // 1コマ前の画像
      const still = new Uint8Array(n);         // その画素が何コマ続けて変わっていないか
      const st = { id, warm: 0, valid: false, lastT: -1 };
      function reset() { st.warm = 0; st.valid = false; still.fill(0); }

      /* 1コマ処理。戻り値: ボール候補の配列（リング基準の座標、単位 = リング幅） */
      /* patchIn: ゴール中心で切り出した RGB（PS×PS）。省略時は src から切り出す */
      function step(src, srcW, srcH, order, rim, t, patchIn) {
        if (st.lastT >= 0 && t - st.lastT > 0.5) reset();
        st.lastT = t;
        if (patchIn) patch.set(patchIn);
        else V.extractPatch(src, srcW, srcH, rim.cx, rim.cy + PCY * rim.w, PS / WC * rim.w, PS, order, patch);
        if (!st.valid) {
          for (let i = 0; i < n * 3; i++) bg[i] = patch[i];
          prev.set(patch);
          st.valid = true; st.warm = 1;
          return { cands: [], fg: 0, netFg: 0, netOnly: 0, patch, mask };
        }
        st.warm++;
        // 背景との差（上下左右1画素のずれは許す）
        const TH = 54;
        let fgCount = 0;
        for (let y = 1; y < PS - 1; y++) {
          for (let x = 1; x < PS - 1; x++) {
            const i = y * PS + x, p = i * 3;
            const r = patch[p], g = patch[p + 1], b = patch[p + 2];
            let d = Math.abs(r - bg[p]) + Math.abs(g - bg[p + 1]) + Math.abs(b - bg[p + 2]);
            if (d > TH) {
              // 近傍の背景とも比べて、最小の差をとる（位置合わせの誤差に強くする）
              for (let k = 0; k < 4 && d > TH; k++) {
                const q = p + (k === 0 ? -3 : k === 1 ? 3 : k === 2 ? -PS * 3 : PS * 3);
                const d2 = Math.abs(r - bg[q]) + Math.abs(g - bg[q + 1]) + Math.abs(b - bg[q + 2]);
                if (d2 < d) d = d2;
              }
            }
            const f = d > TH ? 1 : 0;
            mask[i] = f; fgCount += f;
          }
        }
        // 背景の更新（動いていない所は速く、動いている所はゆっくり）。
        // 「前景なのにずっと変わらない」画素は、立ち去った人の跡（床が前景に見える）なので、早めに背景に取り込む
        const aB = st.warm < 5 ? 0.5 : 0.07, aF = st.warm < 5 ? 0.5 : 0.012;
        for (let i = 0, p = 0; i < n; i++, p += 3) {
          const dp = Math.abs(patch[p] - prev[p]) + Math.abs(patch[p + 1] - prev[p + 1]) + Math.abs(patch[p + 2] - prev[p + 2]);
          still[i] = dp < STILL_DIFF ? (still[i] < 250 ? still[i] + 1 : 250) : 0;
          const a = mask[i] ? (still[i] >= GHOST_FRAMES ? 0.2 : aF) : aB;
          bg[p] += (patch[p] - bg[p]) * a; bg[p + 1] += (patch[p + 1] - bg[p + 1]) * a; bg[p + 2] += (patch[p + 2] - bg[p + 2]) * a;
        }
        prev.set(patch);
        if (st.warm < 5) return { cands: [], fg: fgCount / n, netFg: 0, netOnly: 0, patch, mask };
        const cc = V.components(mask, PS, PS, 30);
        const cands = [];
        const isCand = new Uint8Array(cc.count + 1);     // ボールらしい形のかたまり（ネットの動きから除くため）
        const ox = PS / 2, oy = PS / 2 - PCY * WC;   // パッチ上のリング中心
        for (const b of cc.blobs) {
          const bw = b.x1 - b.x0 + 1, bh = b.y1 - b.y0 + 1;
          if (b.area < BALL_A * 0.32 || b.area > BALL_A * 2.3) continue;
          const asp = bw / bh;
          if (asp < 0.55 || asp > 1.8) continue;
          const fill = b.area / (bw * bh);
          if (fill < 0.5) continue;
          if (Math.max(bw, bh) > BALL_D * 1.9) continue;
          // 色（ボールらしさ）：成分の平均色
          let sr = 0, sg = 0, sb = 0, cnt = 0, nStill = 0;
          for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) {
            const i = y * PS + x;
            if (cc.label[i] !== b.id) continue;
            sr += patch[i * 3]; sg += patch[i * 3 + 1]; sb += patch[i * 3 + 2]; cnt++;
            if (still[i] >= STILL_FRAMES) nStill++;
          }
          const r = sr / cnt, g = sg / cnt, bl = sb / cnt;
          cands.push({ x: (b.cx - ox) / WC, y: (b.cy - oy) / WC, area: b.area / BALL_A, asp, fill, r, g, b: bl, still: nStill / cnt, px: b.cx, py: b.cy });
          isCand[b.id] = 1;
        }
        // ネット付近（リングの真下）の動き。netFg: 動いている画素の割合／netOnly: そのうち、ボールらしい形のかたまりを除いた分
        // （ボールがネットの「手前」を素通りしただけなら netOnly はほぼ 0。ネットを通ると、ネットそのものが動くので大きくなる）
        let netFg = 0, netOnly = 0, netN = 0;
        const nx0 = Math.round(ox - 0.5 * WC), nx1 = Math.round(ox + 0.5 * WC), ny0 = Math.round(oy + 0.12 * WC), ny1 = Math.round(oy + 1.05 * WC);
        for (let y = ny0; y <= ny1; y++) for (let x = nx0; x <= nx1; x++) {
          const i = y * PS + x;
          netN++;
          if (!mask[i]) continue;
          netFg++;
          if (!isCand[cc.label[i]]) netOnly++;
        }
        return { cands, fg: fgCount / n, netFg: netFg / netN, netOnly: netOnly / netN, patch, mask };
      }
      return { step, reset, state: st };
    }

    /* ---------- シュートの判定（ゴールごと） ----------
       座標はリング中心が原点、単位はリング幅（w）、下が＋。
       成功：ネットが大きく動いた直後に、ボールがリングの真下（|x|≤0.5w）へゆっくり出てくる。
       失敗：ボールがリングの高さ・近く（|x|≤0.95w, y≤0.25w）まで来たのに、成功の形にならない。 */
    function ballLike(c, maxBright) {
      if (c.area < 0.4 || c.area > 2.0 || c.fill < 0.48) return false;
      if (c.still > 0.7) return false;                 // 止まっているもの（立ち去った人の跡など）
      const mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b);
      if (mx > (maxBright || 235)) return false;       // 白っぽいもの（白い服・床の照り返し）。明るいオレンジのボールは通す
      if (c.b > c.r + 6) return false;                 // 青っぽい（ビブスなど）
      if (mx - mn < 10 && mx > 70) return false;       // 灰色
      return true;
    }
    const BORN_SPEED_MIN = 2.8;  // ネットの中から現れたボールの、落ちる速さの下限（実測 4.5〜6.0。歩く人の頭は 1〜2）
    const NET_SPEED_MAX = 7.6;   // ネットを通るときの落下の速さの上限（リング幅/秒）。素通りは 8 以上になる
    const NET_HIDE_MAX = 0.65;   // ボールがネットの中に隠れていられる最長の時間（秒）。リングの上で転がって入るときは 0.5 秒ほど見えなくなる
    function createShotDetector(id, opts) {
      // opts は検証・調整用（しきい値の上書き）。ふだんは省略
      // bornYMax・bornGap はバスケ得点クリップで広げたもの（もとは 1.7・0.14）：リングの上で弾んでから入ったボールは、
      // 揺れるネットや下の選手に重なって、ネットを出てすぐには見えないことがある（少し下で初めて見える・1コマ見えない）。
      // ネットの手前を落ちただけのボールは、その高さでは速すぎる（リングの高さからの自由落下で 9 前後）ので、速さの上限で外れる。
      // 2つ目の点は 2.7 より上でないといけないので、最初の点は 2.0 まで
      const P = Object.assign({ colorGate: 100, areaGate: 2.6, bornSpeedMin: BORN_SPEED_MIN, netSpeedMax: NET_SPEED_MAX, xinMax: 0.45, freeFallMin: 6.2, bornYMax: 2.0, bornGap: 0.21 }, opts || {});
      let tracks = [];       // 動くもの（ボール候補）の軌跡
      const nets = [];       // ネットの動き {t,v}
      const seen = [];       // リングの口〜ネットの下に、ボール候補が見えた時刻
      let netBase = null;
      let pending = null;    // リングに近づいた（まだ成功/失敗を決めていない）{ t0: 気づいた時刻, t: 最も近づいた時刻, d: そのときの距離 }
      let held = null;       // 「失敗」と決めたが、まだ出していないもの（直後に成功と分かったら取り消す）{ t, conf, at: 出す時刻, below }
      let cool = -1;         // 成功の直後：この時刻までは新しい出来事を出さない（ネットの下で弾むボールを数えない）
      let lastMiss = -10;    // 直前に記録した失敗の時刻
      let lastBelow = false; // その失敗のボールが、リングの下まで落ちたのを見届けたか
      const out = [];
      function netPeak(t0, t1) { let m = 0; for (const n of nets) if (n.t >= t0 && n.t <= t1 && n.v > m) m = n.v; return m; }
      function netOnlyPeak(t0, t1) { let m = 0; for (const n of nets) if (n.t >= t0 && n.t <= t1 && n.o > m) m = n.o; return m; }
      /* t0〜t1 の間、ネットが動き続けていたコマの割合 */
      function netBusy(t0, t1) { let n = 0, k = 0; for (const e of nets) if (e.t > t0 && e.t < t1) { n++; if (e.v >= netBase + 0.07) k++; } return n ? k / n : 0; }
      function isStatic(tr) {
        if (tr.pts.length < 5) return false;
        let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
        for (const p of tr.pts) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
        return (x1 - x0) + (y1 - y0) < 0.4;
      }
      /* リングの口（ここで見えなくなったら、ネットの中にいるかもしれない） */
      const atMouth = (p) => Math.abs(p.x) <= 0.7 && p.y >= -0.4 && p.y <= 0.9;
      /* リングの口へ向かっているか：口にいる、または、すぐ上（リング幅 1.3 個ぶんまで）から口の内側へ落ちてくる途中 */
      function mouthBound(p, prev) {
        if (atMouth(p)) return true;
        if (!prev || p.t - prev.t > 0.2 || p.y < -1.3 || p.y >= -0.4 || Math.abs(p.x) > 0.9) return false;
        const vy = (p.y - prev.y) / (p.t - prev.t), vx = (p.x - prev.x) / (p.t - prev.t);
        if (vy < 2) return false;
        return Math.abs(p.x + vx * (-p.y / vy)) <= 0.6;       // このまま進むと、リングの高さでどこを通るか
      }
      /* 2点の間が空いていてもよいか：ふつうは 0.34 秒まで。リングの口で消えてネットの下に現れたときだけ NET_HIDE_MAX まで */
      const gapOK = (a, b) => b.t - a.t <= 0.34 || (b.t - a.t <= NET_HIDE_MAX && a.m && b.y >= 0.8);
      /* 成功かどうか：軌跡の最後が「リングの内側を、ゆっくり、下へ抜けた」形か */
      function checkMade(tr) {
        const pts = tr.pts, n = pts.length;
        if (n < 2) return null;
        const b = pts[n - 1];
        if (b.y < 1.1 || b.y > 2.7 || Math.abs(b.x) > 0.62) return null;
        // 最後から遡って、リングの内側（|x|≤0.62）を下向きに動いている区間
        let i = n - 1;
        // （リングの少し上から斜めに落ちてくる途中の点は、内側でなくても「リングの口へ向かっている」なら続きとみなす）
        while (i > 0 && (Math.abs(pts[i - 1].x) <= 0.62 || pts[i - 1].m) && pts[i - 1].y <= pts[i].y + 0.08 && gapOK(pts[i - 1], pts[i])) i--;
        const first = pts[i];
        if (i === n - 1) return null;
        let p0 = null, p1 = null;
        for (let k = i; k < n; k++) { if (pts[k].y <= 0.6) p0 = pts[k]; if (!p1 && pts[k].y >= 1.0) p1 = pts[k]; }
        let speed, tRef, born = false;
        if (p0 && p1 && p1.t > p0.t) {
          speed = (p1.y - p0.y) / (p1.t - p0.t); tRef = p0.t;
          // リングの上（p0）からネットの下（p1）まで、途中が見えなかった場合：
          // その間ネットが動き続けていたこと（半分以上のコマで）を求める。リングの横をかすめて落ちたボールは、ネットが一瞬しか動かない。
          // 長く見えなかったときは、遅すぎないことも求める（外れた後、たまたま下に別の物が現れただけ、を成功にしない）
          if (p1.t - p0.t > 0.18 && netBusy(p0.t, p1.t) < 0.5) return null;
          if (p1.t - p0.t > 0.34 && speed < 1.5) return null;
        } else if (!p0 && i === 0 && first.y >= 0.6 && first.y <= P.bornYMax) {
          // ネットの中から現れた（カメラが遅れて向いた・ネットに隠れていた）。
          // ネットの向こうを歩く人の頭などと区別するため、「続けて2コマ・落ちる速さが十分」を求める
          const q = pts[i + 1];
          if (q.t - first.t > P.bornGap) return null;
          speed = (q.y - first.y) / Math.max(0.03, q.t - first.t); tRef = first.t - 0.15; born = true;
          if (b.y < first.y + 0.25 || speed < P.bornSpeedMin) return null;
        } else return null;
        // ネットを通る速さの上限。ネットから現れた場合は、抜けたあと（また加速している所）を測っているので少し速くてよい
        if (speed > (born ? P.netSpeedMax + 1.4 : P.netSpeedMax) || speed <= 0) return null;
        const peak = netPeak(tRef - (born ? 0.4 : 0.1), b.t);
        const need = Math.max(born ? 0.15 : 0.13, netBase + (born ? 0.1 : 0.07));
        if (peak < need) return null;
        // ネットそのものが動いた証拠（ボールの形を除いた動き）があるか。ボールがずっと丸く見えたまま落ちたときは、
        // 「ネットの中を通った」のか「リングの手前を落ちただけ」なのか映像からは区別しにくいので、自信を下げて「要確認」にする
        const only = netOnlyPeak(tRef - (born ? 0.4 : 0.1), b.t);
        const sure = only >= Math.max(0.1, netBase + 0.07);
        let conf = Math.min(0.99, 0.5 + (peak - netBase) * 1.1 + (P.netSpeedMax - speed) * 0.04 + (born ? -0.08 : 0.08));
        if (!sure) conf = Math.min(conf, 0.6);
        // リングの高さ〜ネットの上半分で、リングの中心にいちばん近づいたときの横ずれ。
        // ボールが輪の中を通るには、中心がリング幅の 0.24 倍以内に入らないといけない。ずっと離れたまま落ちたのなら輪の外（リングの横を落ちた）。
        // ・最大ではなく最小で見る（ネットと重なって形がくずれた1コマに引きずられないため）
        // ・ネットを抜けたあと（下半分）は横に流れるので見ない。その高さで一度も見えなかった（ネットに隠れていた）ときは調べない
        let xin = Infinity;
        for (let k = i; k < n; k++) if (pts[k].y >= -0.1 && pts[k].y <= 0.7 && Math.abs(pts[k].x) < xin) xin = Math.abs(pts[k].x);
        if (xin === Infinity) xin = 0;
        if (xin > P.xinMax) return null;
        // ネットが動いた証拠がなく、落ちる速さが「何にも当たらず落ちた」ときと同じ（リングの高さから落ちても 6.5 以上になる）なら、
        // リングの手前を落ちただけ。ネットを通ったボールは減速する（実測 1.9〜6.1）
        if (!sure && !born && speed > P.freeFallMin) return null;
        return { t: tRef, made: true, conf: +Math.max(0.5, conf).toFixed(2), speed: +speed.toFixed(1), net: +peak.toFixed(2), netOnly: +only.toFixed(2), sure, born, xin: +xin.toFixed(2) };
      }
      /* netOnly: ネットの動きのうち、ボールらしい形のかたまりを除いた分（省略時は netFg と同じ扱い） */
      function push(t, cands, netFg, netOnly) {
        while (nets.length && t - nets[0].t > 2.5) nets.shift();
        nets.push({ t, v: netFg, o: netOnly == null ? netFg : netOnly });
        const balls = cands.filter((c) => ballLike(c, P.maxBright) && Math.abs(c.x) <= 3.05 && c.y <= 3.0 && c.y >= -3.0);
        // 既存の軌跡に割り当て（予測位置に最も近い候補）。リングの口で消えた軌跡は、ネットを抜けてくるのを少し長く待つ
        tracks = tracks.filter((tr) => { const L = tr.pts[tr.pts.length - 1], dt = t - L.t; return dt <= 0.34 || (dt <= NET_HIDE_MAX && L.m); });
        const used = new Set();
        const updated = [];
        // すべての（軌跡, 候補）の組を距離の近い順に割り当てる（近い軌跡が優先）
        const pairs = [];
        tracks.forEach((tr, ti) => {
          const n = tr.pts.length, last = tr.pts[n - 1];
          const dt = t - last.t;
          const waiting = dt > 0.34;      // ネットの中に隠れているかもしれない
          let px = last.x, py = last.y;
          if (!waiting && n >= 2 && last.t - tr.pts[n - 2].t <= 0.2) {
            const pv = tr.pts[n - 2], d0 = last.t - pv.t;
            px += (last.x - pv.x) / d0 * dt; py += (last.y - pv.y) / d0 * dt;
          }
          const gate = (n >= 2 ? 0.7 : 1.4) + 6 * dt;
          for (let k = 0; k < balls.length; k++) {
            const c = balls[k];
            let d;
            if (waiting) {
              // ネットの真下（リングの内側）に出てきたものだけをつなぐ
              if (Math.abs(c.x) > 0.62 || c.y < 0.8 || c.y > 2.4) continue;
              d = Math.abs(c.x) + 0.5;
            } else {
              // 予測した位置（速さを延長）か、直前の位置の近く。リングに当たると向きが変わるので、予測だけでは見失う
              d = Math.min(Math.hypot(c.x - px, c.y - py), Math.hypot(c.x - last.x, c.y - last.y) + 0.15);
              if (d >= gate) continue;
            }
            // 見た目（色・大きさ）が大きく違うものは、同じボールではない（別の物どうしをつないで「動いた」と誤解しない）
            if (Math.abs(c.r - last.r) + Math.abs(c.g - last.g) + Math.abs(c.b - last.b) > P.colorGate) continue;
            if (c.area > last.a * P.areaGate || last.a > c.area * P.areaGate) continue;
            pairs.push({ ti, k, d });
          }
        });
        pairs.sort((p, q) => p.d - q.d);
        const usedTr = new Set();
        for (const pr of pairs) {
          if (usedTr.has(pr.ti) || used.has(pr.k)) continue;
          usedTr.add(pr.ti); used.add(pr.k);
          const tr = tracks[pr.ti], c = balls[pr.k];
          const pt = { t, x: c.x, y: c.y, r: c.r, g: c.g, b: c.b, a: c.area };
          pt.m = mouthBound(pt, tr.pts[tr.pts.length - 1]);
          tr.pts.push(pt);
          if (tr.pts.length > 60) tr.pts.shift();
          updated.push(tr);
        }
        for (let k = 0; k < balls.length; k++) if (!used.has(k)) { const c = balls[k]; const pt = { t, x: c.x, y: c.y, r: c.r, g: c.g, b: c.b, a: c.area }; pt.m = mouthBound(pt, null); tracks.push({ pts: [pt] }); }
        // ネットの動きの基準値（ボールがネット付近にないときにゆっくり更新）
        const nearNet = balls.some((c) => Math.abs(c.x) < 1.2 && c.y > -0.6 && c.y < 1.6);
        if (netBase == null) netBase = Math.min(netFg, 0.08);
        else if (!nearNet && netFg < netBase + 0.06) netBase += (netFg - netBase) * 0.05;
        while (seen.length && t - seen[0] > 1) seen.shift();
        if (balls.some((c) => Math.abs(c.x) <= 0.75 && c.y >= -0.4 && c.y <= 2.4)) seen.push(t);
        if (t < cool) { pending = null; return; }
        // --- 成功 ---
        for (const tr of updated) {
          if (isStatic(tr)) continue;
          const m = checkMade(tr);
          if (m) {
            // 直前に「失敗かも」と見ていたものがあれば、同じシュート（リングの上で弾んでから入った）か、
            // 別のシュート（外れ → リバウンド → すぐ打ち直して成功）かを見分ける
            const prior = held || (pending ? { t: pending.t, conf: +(0.5 + Math.max(0, 0.9 - pending.d) * 0.4).toFixed(2) } : null);
            if (prior && !sameShot(tr, prior.t, m.t)) pushMiss(prior.t, prior.conf, prior.below);
            held = null; pending = null;
            out.push({ t: m.t, hoop: id, made: true, conf: m.conf, speed: m.speed, net: m.net, netOnly: m.netOnly, sure: m.sure, born: m.born, xin: m.xin });
            cool = t + 1.6;
            return;
          }
        }
        // --- リングに近づいた（失敗の候補） ---
        for (const tr of updated) {
          if (isStatic(tr)) continue;
          const n = tr.pts.length, p = tr.pts[n - 1];
          // この 0.35 秒の間に、リングの近く（|x|≤0.95w, −1.1w≤y≤0.25w）を通ったか。いちばん近づいた所を覚える
          let dmin = Infinity, tNear = 0;
          for (let i = n - 1; i >= 0 && t - tr.pts[i].t <= 0.35; i--) {
            const q = tr.pts[i];
            if (Math.abs(q.x) > 0.95 || q.y > 0.25 || q.y < -1.1) continue;
            // 勢いよく上がっていく途中（打ち上げたボールがリングの前を通るだけ）は数えない。前の点（なければ次の点）との差で見る
            const o = i > 0 && q.t - tr.pts[i - 1].t <= 0.2 ? tr.pts[i - 1] : (i < n - 1 && tr.pts[i + 1].t - q.t <= 0.2 ? tr.pts[i + 1] : null);
            if (o && (q.y - o.y) / (q.t - o.t) < -2.5) continue;
            const d = Math.hypot(q.x, q.y);
            if (d < dmin) { dmin = d; tNear = q.t; }
          }
          if (dmin === Infinity) continue;
          // その前後で十分に動いているか（その場に留まっているものは数えない）
          let moved = false;
          for (let i = n - 2; i >= 0 && t - tr.pts[i].t <= 0.6; i--) {
            if (Math.hypot(tr.pts[i].x - p.x, tr.pts[i].y - p.y) >= 0.7) { moved = true; break; }
          }
          if (!moved) continue;
          if (!pending) pending = { t0: t, t: tNear, d: dmin, tr };
          else if (dmin < pending.d) { pending.t = tNear; pending.d = dmin; pending.tr = tr; }
        }
        if (pending) {
          // 「失敗」と決めるのは、(a) そのボールがリングのそばを離れた（下に落ちた・遠くへ弾んだ）とき、または
          // (b) 近づいてから 1.1 秒たっても成功にならないとき。ただし (b) は、まだリングの口〜ネットにボールがいる間
          // （ネットが動いている・ボール候補が見えている）は待つ。最長 2.6 秒
          const L = updated.indexOf(pending.tr) >= 0 ? pending.tr.pts[pending.tr.pts.length - 1] : null;
          const below = !!L && L.y > 1.1;       // リングの下まで落ちた（もう一度リングに来るには、誰かが打ち直すしかない）
          const left = L && (Math.hypot(L.x, L.y) > 1.5 || below);
          const busy = (seen.length && t - seen[seen.length - 1] <= 0.25) || netPeak(t - 0.25, t) >= netBase + 0.07;
          if (left || (t - pending.t0 > 1.1 && (!busy || t - pending.t0 > 2.6))) {
            hold(pending.t, +(0.5 + Math.max(0, 0.9 - pending.d) * 0.4).toFixed(2), t, below);
            pending = null;
          }
        }
        if (held && t >= held.at) { pushMiss(held.t, held.conf, held.below); held = null; }
      }
      /* 「失敗」と決めたものを、少しの間だけ手元に置く（直後に入ったら取り消すため）。
         リングの上で何度か弾むと続けて来るので、2秒以内なら1本にまとめ、いちばんリングに近づいた瞬間を採る。
         ただし、前のボールがリングの下まで落ちたのを見届けていたら、次に来たのは打ち直し（タップ・リバウンドシュート）なので別の1本 */
      function hold(tm, conf, t, below) {
        if (held) {
          if (tm - held.t < 2.0 && !held.below) { if (conf > held.conf) { held.t = tm; held.conf = conf; } held.at = t + 1.3; held.below = below; return; }
          pushMiss(held.t, held.conf, held.below);
        }
        held = { t: tm, conf, at: t + 1.3, below };
      }
      /* tA（リングに最も近づいた時刻）から tB（ネットに入り始めた時刻）まで、ボールがリングのそばに居続けたか。
         居続けた＝同じシュートがリングの上で弾んでいただけ。いったん離れた（下に落ちた・遠くへ行った）＝別のシュート */
      function sameShot(tr, tA, tB) {
        const pts = tr.pts.filter((p) => p.t >= tA - 0.01 && p.t <= tB + 0.01);
        if (!pts.length || pts[0].t > tA + 0.15) return tB - tA < 0.9;      // 軌跡が途切れている：間が短ければ同じシュート
        return pts.every((p) => Math.hypot(p.x, p.y) <= 1.4 && p.y <= 1.0);
      }
      /* 失敗を記録。リングの上で弾んでいる間に2回数えないよう、直前の失敗から2秒以内は同じシュートとみなす
         （直前のボールがリングの下まで落ちたのを見届けていた場合を除く。1秒以内は、その場合でも同じとみなす） */
      function pushMiss(tm, conf, below) {
        if (tm - lastMiss < (lastBelow ? 1.0 : 2.0)) return;
        lastMiss = tm; lastBelow = !!below;
        out.push({ t: tm, hoop: id, made: false, conf });
      }
      function flush() {
        if (held) { pushMiss(held.t, held.conf, held.below); held = null; }
        if (pending) { pushMiss(pending.t, 0.5, false); pending = null; }
        tracks = [];
      }
      function take() { return out.splice(0, out.length); }
      return { push, flush, take, events: out };
    }

    /* ---------- 1コマぶんの前処理（解析幅・半分・1/4 のグレースケール） ---------- */
    function prepFrame(src, srcW, srcH, order) {
      const k = srcW / AW;
      const ki = Math.round(k);
      let g;
      if (Math.abs(k - ki) < 1e-6 && ki >= 1) g = ki === 1 ? { data: V.toGray(src, srcW, srcH, order), w: srcW, h: srcH } : V.grayShrink(src, srcW, srcH, ki, order);
      else {
        const full = V.toGray(src, srcW, srcH, order);
        const h = Math.round(srcH / k);
        g = { data: V.sampleGray(full, srcW, srcH, 0, 0, srcW, srcH, AW, h), w: AW, h };
      }
      const half = V.shrinkGray(g.data, g.w, g.h, 2);
      const quarter = V.shrinkGray(half.data, half.w, half.h, 2);
      return { gray: g, half, quarter };
    }

    /* ---------- 解析のまとめ役 ----------
       使い方：
         const an = createAnalyzer({ srcW, srcH, hoops: [{ id, box, rim }] });
         an.initHoop(i, gray640)                      // ゴールを指定したコマで呼ぶ（テンプレートを作る）
         const live = an.process({ t, gray, quarter, getPatch(cx, cy, size) → RGB(PS×PS) })
         const result = an.finish()
       フレームの作り方は環境ごとに違う（node: 全画面から切り出し／ブラウザ: 小さな canvas に描いて読む）ので、ここでは受け取るだけ。 */
    function createAnalyzer(cfg) {
      const fixed = !!cfg.fixed;       // true: カメラが動かない（全景カメラ）。ゴールを追わず、指定した場所を見張る
      const trackers = cfg.hoops.map((m, i) => (fixed ? createFixedTracker(m, cfg.srcW, cfg.srcH) : createHoopTracker(m, cfg.srcW, cfg.srcH, i)));
      const rims = cfg.hoops.map(() => createRimChecker());
      const rimState = cfg.hoops.map(() => ({ dx: 0, dy: 0, low: 0, score: null, okT: null }));

/* js/clips.js */
/* バスケ得点クリップ — 見つけた得点を「入れた（自分）／入れられた（相手）」に分けて、5秒の区間（クリップ）にする

   どちらのチームの得点かは「どちらのゴールに入ったか」で決める。
   バスケは、前半・後半それぞれで、チームが攻めるゴールが決まっている（ハーフタイムで入れ替わる。延長は後半と同じ向き）。

     リングに当たって弾んでから入った得点は、ここに入っていることがある。使う人が ▶ で確かめて「入っていた」にできる。
     チームは「そのゴールを攻めていたチーム」（＝打ったチーム）。すでに得点がある場面（同じゴールで 2.5 秒以内）は出さない */
  function maybes(result, setup, edits, list) {
    const E = edits || emptyEdits();
    const made = list || items(result, setup, E);
    const out = [];
    ((result && result.shots) || []).forEach((s) => {
      if (s.made) return;
      const id = shotId(s);
      if (E.promote && E.promote[id]) return;
      if (made.some((it) => (it.hoop === s.hoop || it.hoop == null) && Math.abs(it.t - s.t) < 2.5)) return;
      const fixed = E.fix && (E.fix[id] === 0 || E.fix[id] === 1);

    });

  /* 続けて再生・書き出しするときの区間。外したものは入れない。
     となりの区間と重なるときは、同じところを2回見せないように、重なった分を後ろの区間から削る（ほとんど重なるなら1つにまとめる） */
  function reel(clips) {
    const out = [];
    clips.filter((c) => c.on !== false).slice().sort((a, b) => a.t0 - b.t0).forEach((c) => {
      const seg = Object.assign({}, c, { ids: [c.id] });
      const prev = out[out.length - 1];
      if (prev && seg.t0 < prev.t1) {
        if (seg.t1 - prev.t1 < 0.5) { prev.t1 = Math.max(prev.t1, seg.t1); prev.ids.push(c.id); return; }
        seg.t0 = prev.t1;

     解析で見つけたシュート（成功も失敗も）の間の、いちばん長いすき間が 4 分以上で、動画の真ん中あたり（15〜85%）にあり、

  const HALF_GAP = 240;
  function suggestHalf(result, duration) {
    const ts = ((result && result.shots) || []).map((s) => s.t).sort((a, b) => a - b);
    if (ts.length < 6) return null;
    let best = null;
    for (let i = 1; i < ts.length; i++) {
      const gap = ts[i] - ts[i - 1];
      if (!best || gap > best.gap) best = { gap, from: ts[i - 1], to: ts[i], i };
    }
    if (!best || best.gap < HALF_GAP) return null;
    const mid = (best.from + best.to) / 2;
    if (duration > 0 && (mid < duration * 0.15 || mid > duration * 0.85)) return null;
    if (best.i < 3 || ts.length - best.i < 3) return null;
    return { from: best.from, to: best.to, at: Math.round(Math.max(best.from + 1, best.to - 10) * 10) / 10 };
  }

  /* 解析をやり直したとき、前の結果に付けた手直し（チーム・外す・入っていた）を、新しい結果の「同じシュート」（同じゴールで、時刻の差が 1.5 秒以内）へ移す。
     「入っていた」にした外れが、やり直しで得点と判定されたときは、そのまま得点になる（印は残っても害はない） */
  function carryEdits(oldResult, newResult, edits) {
    const E = edits || emptyEdits();
    const next = { fix: {}, off: {}, added: (E.added || []).slice(), promote: {} };
    const oldShots = (oldResult && oldResult.shots) || [];
    const newShots = (newResult && newResult.shots) || [];
    const map = {};
    oldShots.forEach((o) => {
      let best = null;
      newShots.forEach((n) => {
        const d = Math.abs(n.t - o.t) + (n.made === o.made ? 0 : 0.01);      // 同じくらい近ければ、成否が同じものを選ぶ
        if (n.hoop === o.hoop && Math.abs(n.t - o.t) < 1.5 && (!best || d < best.d)) best = { d, id: shotId(n) };
      });
      if (best) map[shotId(o)] = best.id;
    });
    const manual = new Set(next.added.map((a) => a.id));
    Object.keys(E.fix || {}).forEach((id) => { if (map[id]) next.fix[map[id]] = E.fix[id]; });
    Object.keys(E.off || {}).forEach((id) => { if (map[id]) next.off[map[id]] = true; else if (manual.has(id)) next.off[id] = true; });
    Object.keys(E.promote || {}).forEach((id) => { if (map[id]) next.promote[map[id]] = true; });

  }

  /* ゴールが映っていた（調べられた）時間の割合。spans: [[開始, 終了, ビット（ゴール i が映っていれば 1<<i）], ...] */
  function coverage(result, duration, nHoops) {

    for (let i = 0; i < (nHoops || 2); i++) {
      let sec = 0;
      spans.forEach((sp) => { if (sp[2] & (1 << i)) sec += sp[1] - sp[0] + 1 / 15; });

<script>
/* js/store.js */
/* バスケ得点クリップ — 保存（このブラウザの中だけ。動画そのものは保存しない）
   動画ごとに「チームの色・ゴールの指定・解析の結果・手直し」を覚えておき、同じ動画を開き直すと続きから使える。
   動画の見分けは「ファイル名・大きさ・更新日時」。 */
(function (root) {
  'use strict';
  const BS = root.BS;
  const PREFIX = 'bclip:v1:';
  const INDEX = 'bclip:index';
  const PREFS = 'bclip:prefs';
  const KEEP = 30;          // 覚えておく動画の数（古いものから消す）

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return false; try { s.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  function videoKey(file) {
    if (!file) return null;
    if (typeof file === 'string') return 'url:' + file;
    return [file.name, file.size, file.lastModified || 0].join('|');
  }

  /* 前回のチームの色・クリップの長さ（次の動画でも同じにする） */
  function prefs() {
    return Object.assign({
      teams: [{ color: '#f4f4f4', colorName: '白', name: '' }, { color: '#2f6fed', colorName: '青', name: '' }],
      win: { lead: BS.clips.WIN.lead, lag: BS.clips.WIN.lag }, captions: true
    }, readJSON(PREFS) || {});
  }
  function savePrefs(st) { writeJSON(PREFS, { teams: st.teams, win: st.win, captions: st.captions }); }

  function fresh() {
    const p = prefs();
    return {
      v: 1, teams: JSON.parse(JSON.stringify(p.teams)), hoops: [null, null], hoopTeam: [0, 1], fixed: false,
      halfT: null, halfNo: null, result: null, edits: BS.clips.emptyEdits(), win: Object.assign({}, p.win), captions: p.captions !== false
    };
  }

  function load(key) {
    if (!key) return null;
    const st = readJSON(PREFIX + key);
    if (!st || st.v !== 1) return null;
    const base = fresh();
    const out = Object.assign(base, st);
    out.edits = Object.assign(BS.clips.emptyEdits(), st.edits || {});
    return out;
  }

  function save(key, st) {
    if (!key || !st) return false;
    st.savedAt = Date.now();
    const idx = readJSON(INDEX) || {};
    idx[key] = st.savedAt;
    // 古いものを消す（数が多すぎる・入りきらないとき）
    const prune = (n) => {
      const keys = Object.keys(idx).filter((k) => k !== key).sort((a, b) => idx[a] - idx[b]);
      for (let i = 0; i < n && i < keys.length; i++) { try { ls().removeItem(PREFIX + keys[i]); } catch (e) { /* 無視 */ } delete idx[keys[i]]; }
    };
    if (Object.keys(idx).length > KEEP) prune(Object.keys(idx).length - KEEP);
    let ok = writeJSON(PREFIX + key, st);
    if (!ok) { prune(10); ok = writeJSON(PREFIX + key, st); }
    writeJSON(INDEX, idx);
    savePrefs(st);
    return ok;
  }

  BS.store = { videoKey, prefs, fresh, load, save };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/media.js */
/* バスケ得点クリップ — 動画ファイル（<video>）の操作
   「バスケ分析スタジオ」の media.js から、実動画の部分だけを持ってきたもの（Safari で見つかった癖への対策もそのまま）。 */

  'use strict';
  const BS = root.BS;

  function createVideoMedia(file) {
    const video = document.createElement('video');
    video.className = 'media-el';
    video.playsInline = true;
    video.preload = 'auto';
    // file は File（通常）か、URL 文字列（開発時の確認用）
    const isUrl = typeof file === 'string';
    const url = isUrl ? file : URL.createObjectURL(file);
    video.src = url;
    const bus = BS.emitter();
    let raf = 0;
    function loop() {
      bus.emit('time', video.currentTime);
      if (!video.paused && !video.ended) raf = requestAnimationFrame(loop);
    }
    // （play / pause の通知は、届いた時点の実際の状態と合うものだけを伝える）
    let kick = false;          // 止めた後、まだ1回もシークしていない（次のシークは2回に分ける）
    let wantPlay = false;      // 再生を頼んだ（まだ止めていない）
    video.addEventListener('play', () => { if (video.paused) return; bus.emit('play'); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); });
    video.addEventListener('pause', () => { kick = true; if (!video.paused) return; cancelAnimationFrame(raf); bus.emit('pause'); bus.emit('time', video.currentTime); });
    video.addEventListener('seeked', () => { bus.emit('time', video.currentTime); bus.emit('seeked', video.currentTime); });
    video.addEventListener('timeupdate', () => { if (video.paused) bus.emit('time', video.currentTime); });

    video.addEventListener('loadeddata', () => bus.emit('time', video.currentTime));
    video.addEventListener('ended', () => { wantPlay = false; bus.emit('ended'); });
    video.addEventListener('error', () => bus.emit('error', video.error));
    /* 自動再生の制限への対応。Safari などは「操作（クリック・キー）の直後」でないと、音つきの動画をプログラムから再生させない。
       ただし、操作（ファイル選択・ドロップ）の処理の中で作った <video> には、この制限がそもそもかからないので、ふつうの使い方では困らない。
       万一断られたときだけ、音を消して再生し、次の操作で音を戻す。
       （「最初の操作で play() → すぐ pause()」で一律に解除する方法は使わない。下の Safari の癖を自分で踏むことになる）

       Safari（WebKit）の癖：再生が実際に始まる前に pause() すると（すばやい再生→停止）、
         ・その次のシークで、絵が変わらない（時刻だけ進む）。もう一度シークすると直る
         ・その直後の play() が効かないことがある
       → 止めた後の最初のシークは「わずかにずらして2回」行い、play() は少し後に本当に再生が始まったかを確かめて、だめならやり直す。 */
    let mutedByPolicy = false;

      if (e && e.isTrusted === false) return;
      if (mutedByPolicy) { mutedByPolicy = false; video.muted = false; }
    };
    const GESTURES = ['pointerdown', 'keydown'];
    GESTURES.forEach((ty) => document.addEventListener(ty, onGesture, true));
    const api = {
      kind: 'video', el: video, file, url,
      get duration() { return isFinite(video.duration) ? video.duration : 0; },
      get time() { return video.currentTime; },
      get paused() { return video.paused; },
      get rate() { return video.playbackRate; },
      set rate(r) { video.playbackRate = r; bus.emit('rate', r); },
      get width() { return video.videoWidth || 1280; },
      get height() { return video.videoHeight || 720; },
      get ready() { return video.readyState >= 1 && video.videoWidth > 0; },
      seek(x) {
        return new Promise((resolve) => {
          const target = BS.clamp(x, 0, api.duration || x);
          // 1回ぶんのシーク：seeked を待つ（来なければ 3 秒であきらめる）
          const go = (t, then) => {
            let fired = false;
            const done = () => { if (fired) return; fired = true; video.removeEventListener('seeked', done); then(); };
            video.addEventListener('seeked', done);
            video.currentTime = t;
            setTimeout(done, 3000);
          };
          if (kick && video.paused) {
            // 止めた後の最初のシーク：いったん「わずかにずらした時刻」へ行ってから、目的の時刻へ（Safari で絵が変わらないことへの対策）
            kick = false;
            const near = target + 0.01 <= (api.duration || target + 1) ? target + 0.01 : Math.max(0, target - 0.01);      // 1コマ（1/30〜1/60 秒）より小さいずれ
            go(near, () => go(target, resolve));
            return;
          }
          if (Math.abs(video.currentTime - target) < 0.01) { bus.emit('time', target); resolve(); return; }
          go(target, resolve);
        });
      },
      play() {
        wantPlay = true;
        let p = null;
        try { p = video.play(); } catch (err) { p = null; }
        // 少し後に、本当に再生が始まったかを確かめる（すばやい 再生→停止→再生 の3つ目が、Safari では効かないことがある）
        setTimeout(() => { if (wantPlay && video.paused && !video.ended && !video.error) { const q = video.play(); if (q && q.catch) q.catch(() => {}); } }, 350);
        if (!p || !p.then) return Promise.resolve();
        return p.catch((err) => {
          if (!err || err.name !== 'NotAllowedError' || video.muted) return undefined;
          video.muted = true; mutedByPolicy = true;
          bus.emit('notice', 'ブラウザの制限で、音を消して再生しています（画面をクリックすると音が出ます）');
          return video.play().catch(() => {});
        });
      },
      pause() { if (!video.paused || wantPlay) kick = true; wantPlay = false; video.pause(); },
      frameTo(ctx, w, h) { try { ctx.drawImage(video, 0, 0, w, h); } catch (e) { /* 未読み込み */ } },
      on: bus.on,
      destroy() { wantPlay = false; GESTURES.forEach((ty) => document.removeEventListener(ty, onGesture, true)); video.pause(); cancelAnimationFrame(raf); if (!isUrl) URL.revokeObjectURL(url); video.removeAttribute('src'); video.load(); }
    };
    return api;
  }

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/export.js */
/* バスケ得点クリップ — 動画の書き出し
   区間（クリップ）を順に再生しながら Canvas に描き、MediaRecorder で録画して1本の動画にする。
   実時間で録るので、書き出しにかかる時間 ≒ できる動画の長さ（5秒 × 本数 ＋ 最初と最後の数秒）。
   「バスケ分析スタジオ」の export.js をもとに、表示を小さくしたもの（音声の扱い・再生が始まらないときの失敗の出し方は同じ）。 */
(function (root) {
  'use strict';
  const BS = root.BS;

  function pickMime() {
    if (typeof MediaRecorder === 'undefined') return null;
    const list = [
      ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'mp4'],
      ['video/mp4;codecs=avc1', 'mp4'],
      ['video/mp4', 'mp4'],
      ['video/webm;codecs=vp9,opus', 'webm'],
      ['video/webm;codecs=vp8,opus', 'webm'],
      ['video/webm', 'webm']

  }

  function sizeFor(media) {
    let w = media.width || 1280, h = media.height || 720;

    return { w: w - (w % 2), h: h - (h % 2) };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

  function drawCaption(ctx, W, H, clip, opts) {
    const s = W / 1280;

    ctx.font = `bold ${26 * s}px ${FONT}`;
    const w1 = ctx.measureText(title).width;
    ctx.font = `${19 * s}px ${FONT}`;
    const w2 = ctx.measureText(sub).width;

    ctx.fillStyle = 'rgba(8,12,20,0.74)';

    ctx.fillStyle = clip.color || opts.accent || '#3b82f6';
    ctx.fillRect(bx, by, 9 * s, bh);

    ctx.font = `bold ${26 * s}px ${FONT}`;

      ctx.font = `${i === 0 ? 'bold ' : ''}${(i === 0 ? 54 : 30) * s}px ${FONT}`;
      ctx.fillText(ln, W / 2, H / 2 - 50 * s + i * 60 * s);

  /* media: BS.createVideoMedia、clips: [{ t0, t1, label, sub, color }]

    if (!clips.length) throw new Error('書き出す場面がありません');

    let done = 0;
    const frame = () => new Promise((res) => requestAnimationFrame(res));
    const aborted = () => signal && signal.aborted;
    const report = (label) => onProgress && onProgress(Math.min(1, done / Math.max(0.1, total)), label);

    media.pause();
    rec.start(250);
    try {
      let t0 = performance.now();
      if (cards) {
        while (performance.now() - t0 < TITLE * 1000 && !aborted()) {
          drawCard(ctx, W, H, opts.title || ['得点シーン'], opts);
          await frame();
          done = (performance.now() - t0) / 1000; report('はじめの画面');
        }
      }
      let acc = 0;
      for (let i = 0; i < clips.length && !aborted(); i++) {
        const c = clips[i];
        const len = c.t1 - c.t0;
        // 暗転中にシーク
        drawFade(ctx, W, H, 1);
        await media.seek(c.t0);
        await media.play();
        t0 = performance.now();
        while (!aborted()) {
          const el = (performance.now() - t0) / 1000;
          const vt = media.time;
          if (vt >= c.t1 || el > len + 3 || media.el.ended) break;
          // 再生が始まらない（ブラウザに止められた等）まま録ると、止まった絵の動画になってしまう → はっきり失敗にする
          if (el > 2.5 && vt - c.t0 < 0.05) throw new Error('動画の再生が始まりませんでした。映像の ▶ で再生できることを確かめてから、もう一度書き出してください');
          ctx.drawImage(media.el, 0, 0, W, H);
          const k = vt - c.t0, left = c.t1 - vt;
          if (k < 0.25) drawFade(ctx, W, H, 1 - k / 0.25);
          if (left < 0.25) drawFade(ctx, W, H, 1 - left / 0.25);
          if (opts.captions !== false) drawCaption(ctx, W, H, c, opts);
          done = TITLE + acc + Math.min(Math.max(0, k), len);
          report(`${i + 1} / ${clips.length}`);
          await frame();
        }
        media.pause();
        acc += len;
      }
      if (cards) {
        t0 = performance.now();
        while (performance.now() - t0 < END * 1000 && !aborted()) {
          drawCard(ctx, W, H, opts.end || ['おわり'], opts);
          await frame();
          done = TITLE + acc + (performance.now() - t0) / 1000; report('おわりの画面');
        }
      }
    } finally {
      rec.stop();
      await stopped;
      stream.getTracks().forEach((tr) => tr.stop());
      if (audioDest && media._src) { try { media._src.disconnect(audioDest); } catch (e) { /* 無視 */ } }
    }
    if (aborted()) return null;
    const blob = new Blob(chunks, { type: fmt.mime.split(';')[0] });
    return { blob, url: URL.createObjectURL(blob), mime: fmt.mime, ext: fmt.ext, seconds: total, audio: !!audioDest };
  }

  BS.exportReel = exportReel;
  BS.exportSupport = pickMime;

<script>
/* js/ui.js */
/* バスケ得点クリップ — 画面の部品（要素づくり・お知らせ・小窓・ダウンロード） */
(function (root) {
  'use strict';
  const BS = root.BS;

  /* h('div', { class: 'x', onclick: fn }, 子要素…) */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (sel, rootEl) => (rootEl || document).querySelector(sel);

  function toast(text, kind, ms) {
    const box = $('#toasts');
    if (!box) return;
    const el = h('div', { class: 'toast ' + (kind || '') }, text);
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => el.remove(), ms || 3200);
  }

  let modalClose = null;
  function modal(opts) {
    const m = $('#modal');
    m.innerHTML = '';
    const card = h('div', { class: 'modal-card', role: 'dialog', 'aria-modal': 'true' });
    const close = () => { m.hidden = true; m.innerHTML = ''; modalClose = null; if (opts.onClose) opts.onClose(); };
    card.appendChild(h('header', null, h('b', null, opts.title || ''), h('button', { class: 'x', 'aria-label': '閉じる', onclick: close }, '×')));
    const body = h('div', { class: 'modal-body' });
    if (typeof opts.body === 'string') body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
    card.appendChild(body);
    if (opts.buttons && opts.buttons.length) {
      const foot = h('div', { class: 'modal-foot' });
      opts.buttons.forEach((b) => foot.appendChild(h('button', { class: 'btn ' + (b.cls || ''), onclick: () => { const r = b.onClick ? b.onClick(body) : true; if (r !== false) close(); } }, b.label)));
      card.appendChild(foot);
    }
    m.appendChild(card);
    m.hidden = false;
    m.onclick = (e) => { if (e.target === m) close(); };
    modalClose = close;
    return { close, body };
  }
  function closeModal() { if (modalClose) modalClose(); }
  function modalOpen() { const m = $('#modal'); return !!m && !m.hidden; }

  function download(name, blobOrUrl) {
    const url = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    const a = h('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { if (typeof blobOrUrl !== 'string') URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  BS.ui = { h, $, toast, modal, closeModal, modalOpen, download };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/app.js */
/* バスケ得点クリップ — 画面（動画を選ぶ → チームの色 → ゴールを教える → 解析 → 入れた／入れられたを見る・動画にする）
   ゴールの指定と解析の実行は「バスケ分析スタジオ」の ui-auto.js から持ってきたもの（解析エンジンは同じファイル）。 */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;
  const C = BS.clips;

  /* ユニフォームの色（よくある色）。白・黒も選べるように、見本には枠を付ける */
  const COLORS = [
    { name: '白', hex: '#f4f4f4' }, { name: '黒', hex: '#222222' }, { name: '赤', hex: '#d93636' }, { name: '青', hex: '#2f6fed' },
    { name: '紺', hex: '#1f2f6e' }, { name: '水色', hex: '#45b0e6' }, { name: '緑', hex: '#2e9e5b' }, { name: '黄', hex: '#f2c230' },
    { name: 'オレンジ', hex: '#f08a24' }, { name: '紫', hex: '#7d4cc9' }, { name: 'ピンク', hex: '#e86aa6' }, { name: 'グレー', hex: '#8a8f98' }
  ];
  const HOOP = ['ゴールA', 'ゴールB'];
  const HOOP_COL = ['#22c55e', '#e879f9'];
  const ICON = ['🏀', '🛡'];
  const WHAT = ['入れた', '入れられた'];

  const S = {
    media: null, key: null, st: BS.store.fresh(),
    marking: null, running: null, live: null,
    tab: 0, openSetup: false, openHow: null, openMaybe: false,
    reel: { active: false, list: [], i: -1, label: '', team: 0 },
    exporting: null, out: [null, null],
    thumbs: {}, thumbJob: null, saveTimer: 0, debug: false, lastLog: null
  };

  /* ---------- 小さな道具 ---------- */
  const duration = () => (S.media ? S.media.duration : 0) || 0;
  const now = () => (S.media ? S.media.time : 0);
  const teamName = (i) => { const t = S.st.teams[i] || {}; return (t.name || '').trim() || t.colorName || (i ? '相手' : '自分'); };
  const teamTag = (i) => `${teamName(i)}（${i ? '相手' : '自分'}）`;
  const teamColor = (i) => (S.st.teams[i] && S.st.teams[i].color) || (i ? '#2f6fed' : '#f4f4f4');
  const setupOf = () => ({ hoopTeam: S.st.hoopTeam, halfT: S.st.halfT });
  const list = () => C.items(S.st.result, setupOf(), S.st.edits);
  const clipsFor = (team) => C.clipsOf(list(), team, S.st.win, duration());
  const marksKey = () => JSON.stringify(S.st.hoops.map((m) => (m ? [m.t, m.box, m.rim] : null))) + (S.st.fixed ? '|fixed' : '');
  const stale = () => !!(S.st.result && S.st.result.marks !== marksKey());
  const halfLabel = (it) => (it.half === 2 ? '後半' : it.half === 1 ? '前半' : '');
  function save() {
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(() => { if (S.key) BS.store.save(S.key, S.st); }, 150);
  }
  function hexRGB(hex) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128]; }
  /* 自由に選んだ色の呼び名：いちばん近い見本の色の名前 */
  function nearestName(hex) {
    const [r, g, b] = hexRGB(hex);
    let best = null;
    COLORS.forEach((c) => { const [r2, g2, b2] = hexRGB(c.hex); const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2; if (!best || d < best.d) best = { d, name: c.name }; });
    return best.name;
  }

  /* ---------- 動画を開く ---------- */
  function openFile(file) {
    if (!file) return;
    const okType = /^video\//.test(file.type || '') || /\.(mp4|mov|m4v|webm|mkv)$/i.test(file.name || '');
    if (!okType) { BS.ui.toast('動画ファイル（MP4・MOV など）を選んでください', 'err'); return; }
    if (S.running) { BS.ui.toast('解析中です。中止してから開いてください', 'warn'); return; }
    if (S.exporting) { BS.ui.toast('書き出し中です。終わってから開いてください', 'warn'); return; }
    stopReel(true);
    cancelMarking();
    if (S.thumbJob) S.thumbJob.cancel = true;
    if (S.media) S.media.destroy();
    const m = BS.createVideoMedia(file);
    S.media = m;
    S.key = BS.store.videoKey(file);
    const saved = BS.store.load(S.key);
    S.st = saved || BS.store.fresh();
    S.thumbs = {}; S.out = [null, null]; S.tab = 0; S.openSetup = false; S.openHow = null; S.live = null;
    const slot = $('#mediaSlot');
    slot.innerHTML = '';
    slot.appendChild(m.el);
    m.on('time', onTime);
    m.on('play', updatePlayBtn);
    m.on('pause', updatePlayBtn);
    m.on('ready', () => { render(); drawTimeline(); drawOverlay(); if (S.st.result) makeThumbs(); });
    m.on('error', () => BS.ui.toast('この動画は、このブラウザでは再生できないようです（MP4・MOV をお試しください）', 'err', 7000));
    m.on('notice', (t) => BS.ui.toast(t, 'warn', 6000));
    document.body.classList.add('has-video');
    if (saved && saved.result) BS.ui.toast('前に解析した結果を開きました（同じ動画です）', 'ok', 4000);
    render(); drawTimeline(); updatePlayBtn();
  }
  function pickFile() { const inp = $('#fileVideo'); inp.value = ''; inp.click(); }

  /* ---------- 再生 ---------- */
  function play() { if (S.media) S.media.play(); }
  function pause() { if (S.media) S.media.pause(); }
  // （書き出し中は、映像を書き出しの処理が動かしているので、ボタンやキーでは動かさない）
  function toggle() { if (!S.media || S.exporting) return; if (S.media.paused) play(); else pause(); }
  function seek(t, fromReel) {
    if (!S.media || S.exporting) return Promise.resolve();
    if (!fromReel && S.reel.active) stopReel(true);
    return S.media.seek(BS.clamp(t, 0, duration() || t));
  }
  let lastTimeText = '';
  function onTime(t) {
    const tt = $('#timeText');
    const s = `${BS.fmtTime(t)} / ${BS.fmtTime(duration())}`;
    if (tt && s !== lastTimeText) { lastTimeText = s; tt.textContent = s; }
    reelTick(t);
    if (S.marking) markingTimeCheck(t);
    drawTimeline();
    if (!S.running) drawOverlay();
  }
  function updatePlayBtn() {
    // 記号は span に入れ、変わったときだけ書き換える（押している間に中身が入れ替わると、Safari ではクリックにならない）
    const ico = $('#btnPlay .ico'), mark = !S.media || S.media.paused ? '▶' : '⏸';
    if (ico && ico.textContent !== mark) ico.textContent = mark;
  }

  /* ---------- 画面（右のパネル） ---------- */
  function render() {
    const P = $('#panel');
    if (!P) return;
    const keepScroll = P.scrollTop;
    P.innerHTML = '';
    const hasRes = !!(S.st.result && S.media);
    if (hasRes && !S.running) {
      P.append(resultsCard());
      const d = h('details', { class: 'setupfold' }, h('summary', null, '設定を変える（動画・チームの色・ゴール・後半）'),
        stepVideo(), stepTeams(), stepGoals(), stepRun());
      d.open = !!S.openSetup || !!S.marking;
      d.querySelector('summary').addEventListener('click', () => { S.openSetup = !d.open; });
      P.append(d);
    } else {
      P.append(stepVideo(), stepTeams(), stepGoals(), stepRun());
    }
    P.scrollTop = keepScroll;
  }
  function stepHead(n, title, sub, done) {
    return h('div', { class: 'step-h' }, h('span', { class: 'num' + (done ? ' done' : '') }, done ? '✓' : String(n)), h('b', null, title), sub ? h('small', null, sub) : null);
  }

  /* ① 動画 */
  function stepVideo() {
    const m = S.media;
    const card = h('section', { class: 'card step', id: 'stepVideo' }, stepHead(1, '試合の動画を選ぶ', null, !!m));
    if (!m) {
      card.append(
        h('p', null, 'スマホやビデオカメラで撮った試合の動画（MP4・MOV）を選びます。'),
        h('div', { class: 'row' }, h('button', { class: 'btn primary big', onclick: pickFile }, '🎬 動画を選ぶ'), h('span', { class: 'note' }, 'ここへドラッグ＆ドロップでも開けます')),
        h('p', { class: 'note' }, '🔒 動画はこの端末の中だけで扱います。インターネットには送りません。'));
    } else {
      const f = m.file;
      card.append(h('div', { class: 'row' },
        h('span', { class: 'fname', title: f.name || '' }, f.name || String(f)),
        h('span', { class: 'note' }, duration() ? `長さ ${BS.fmtTime(duration())}` : '読み込み中…'),
        h('button', { class: 'btn small', onclick: pickFile }, '別の動画を選ぶ')));
    }
    return card;
  }

  /* ② チームの色 */
  function stepTeams() {
    const card = h('section', { class: 'card step', id: 'stepTeams' }, stepHead(2, 'どっちの色が自分のチーム？', 'ユニフォームの色', !!S.media));
    [0, 1].forEach((i) => {
      const T = S.st.teams[i];
      const sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': i ? '相手のチームの色' : '自分のチームの色' });
      COLORS.forEach((c) => {
        const on = T.color.toLowerCase() === c.hex.toLowerCase();
        sw.append(h('button', {
          class: 'sw' + (on ? ' on' : ''), style: { background: c.hex }, title: c.name, 'aria-label': c.name, role: 'radio', 'aria-checked': on ? 'true' : 'false', dataset: { team: i, color: c.name },
          onclick: () => setTeamColor(i, c.hex, c.name)
        }));

      sw.append(custom);
      const name = h('input', { type: 'text', class: 'tname', placeholder: 'チーム名（なくてもOK）', value: T.name || '', maxlength: 20,
        onchange: (e) => { T.name = e.target.value.trim(); save(); render(); drawTimeline(); } });
      card.append(h('div', { class: 'teamrow' },
        h('div', { class: 'tlabel' }, h('span', { class: 'chip', style: { background: T.color } }), h('b', null, i ? '相手' : '自分'), h('span', { class: 'note' }, `${T.colorName}${T.name ? '・' + T.name : ''}`)),

    card.append(h('p', { class: 'note' }, 'どちらのチームの得点かは、ボールが入った「ゴール」で決めます（前半・後半で攻めるゴールは決まっているため）。色は、画面と書き出す動画の表示に使います。'));
    return card;
  }
  function setTeamColor(i, hex, name) {

  }

  /* ③ ゴール */
  const FIG = '<svg viewBox="0 0 330 122" role="img" aria-label="ゴールの指定のしかた：バックボードを囲み、次にリングの左端から右端までなぞる">' +
    '<defs><clipPath id="figClip2"><rect x="0" y="0" width="155" height="96" rx="8"/></clipPath></defs>' +
