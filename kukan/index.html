<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空間図形の黒板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="css/board.css">
<style>
/* 目次：黒板に、15時間を縦に並べる。図を動かせる時間だけ、押せる */
html,body{height:auto}
.app{height:auto;min-height:100%}
.menu{padding:.4rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.menu p.lead{margin:0;font-family:var(--f-chalk);font-weight:600;color:var(--chalk-2);font-size:1.05rem;line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:.6rem}
.list li{display:flex;flex-direction:column;gap:.3rem;padding:.65rem .9rem;border:2px solid var(--chalk-4);border-radius:12px;min-width:0}
.list li.on{border-color:var(--chalk-3);background:rgba(242,240,230,.05)}
.list .no{font-family:var(--f-chalk);font-weight:600;font-size:.9rem;color:var(--chalk-2)}
.list .ttl{font-family:var(--f-chalk);font-weight:600;font-size:1.1rem;line-height:1.45}
.list li:not(.on) .ttl{color:var(--chalk-2)}
.list .go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.15rem}
.list .soon{font-size:.85rem;color:var(--chalk-3)}
</style>
</head>
<body>
<div class="app" lang="ja">
  <div class="board">
    <header class="bar"><h1><small>中1</small>空間図形の黒板（目次）</h1></header>
    <div class="track" aria-hidden="true"></div>
    <main class="menu">
      <p class="lead">電子黒板に映して、図を動かしながら考える授業のページ。15時間ぶん、どの時間からでも開けます。</p>
      <ul class="list" id="list"></ul>
    </main>
  </div>
</div>
<script>
(function () {
  /* 時間ごとの題名は、ikkan の空間図形（新しい形）と同じ */
  var L = [
    ['第1時', '立体を仲間分けして、特徴をとらえよう', [['01.html', 'ひらく ▶']]],
    ['第2時', '正多面体をつくって、頂点・辺・面の数を調べよう', [['../seitamentai/index.html', 'なぜ5種類？ ▶'], ['../seitamentai/kazoekata.html', '辺・頂点の数え方 ▶']]],
    ['第3時', '空間にある2つの直線は、どんな位置関係になるだろう', [['03.html', 'ひらく ▶']]],
    ['第4時', '直線と平面、平面と平面の位置関係を調べよう', [['04.html', 'ひらく ▶']]],
    ['第5時', '線や面を動かして、立体をつくろう', [['05.html', 'ひらく ▶']]],
    ['第6時', '立体を、正面と真上から見た図で表そう', [['06.html', 'ひらく ▶']]],
    ['第7時', '立体を切り開いて、平面の上で考えよう', [['07.html', 'ひらく ▶']]],
    ['第8時', 'ヒントを組み合わせて、立体を当てよう', [['08.html', 'ひらく ▶']]],
    ['第9時', '角柱と円柱の表面積を、展開図を使って求めよう', [['09.html', 'ひらく ▶']]],
    ['第10時', '角錐と円錐の表面積を、展開図を使って求めよう', [['10.html', 'ひらく ▶']]],
    ['第11時', '角錐や円錐の体積は、角柱や円柱の何分のいくつか', [['11.html', 'ひらく ▶']]],
    ['第12時', '球の表面積と体積を求めよう', [['12.html', 'ひらく ▶']]],
    ['第13時', '表面積と体積を、たしかに求められるようになろう', [['13.html', 'ひらく ▶']]],
    ['第14時', '身のまわりのものを立体とみなして、量を見積もろう', [['14.html', 'ひらく ▶']]],
    ['第15時', '空間図形で学んだことを、整理して確かめよう', [['15.html', 'ひらく ▶']]]
  ];
  document.getElementById('list').innerHTML = L.map(function (x) {
    var on = !!x[2];
    return '<li' + (on ? ' class="on"' : '') + '><span class="no">' + x[0] + '</span><span class="ttl">' + x[1] + '</span>' +
      (on ? '<span class="go">' + x[2].map(function (l) { return '<a class="btn primary" href="' + l[0] + '">' + l[1] + '</a>'; }).join('') + '</span>' : '<span class="soon">準備中</span>') + '</li>';
  }).join('');
})();
</script>
</body>
</html>
