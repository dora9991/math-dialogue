<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヒントで立体当て</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<script src="js/k3.js"></script>
<script>
/* 空間図形 第8時：ヒントを組み合わせて、立体を当てよう（ikkan の lesson_kukan_new_08 と同じ流れ）。
   ヒントを出すたびに、あてはまらない立体がうすくなる。 */
(function () {
  var C = K3.COL, v = K3.v, K = K3;
  var SH = {
    a: { m: K.cylinder(1.2, 2.6), col: C.blue, name: 'ア 円柱', faces: 3, sideTri: false, top: '円', front: '長方形' },
    i: { m: K.cone(1.3, 2.8), col: C.pink, name: 'イ 円錐', faces: 2, sideTri: false, top: '円', front: '三角形' },
    u: { m: K.prism(K.regPoly(3, 1.5), 2.6), col: C.orange, name: 'ウ 三角柱', faces: 5, sideTri: false, top: '三角形', front: '長方形' },
    e: { m: K.pyramid(K.regPoly(4, 1.5), [0, 0, 2.8]), col: C.lav, name: 'エ 四角錐', faces: 5, sideTri: true, top: '正方形', front: '三角形' },
    o: { m: K.sphere(1.4), col: C.yel, name: 'オ 球', faces: 1, sideTri: false, top: '円', front: '円', at: [0, 0, 1.4] },
    k: { m: K.prism([[-1.2, -1.2], [1.2, -1.2], [1.2, 1.2], [-1.2, 1.2]], 2.4), col: C.green, name: 'カ 立方体', faces: 6, sideTri: false, top: '正方形', front: '正方形' }
  };
  var ORDER = ['a', 'i', 'u', 'e', 'o', 'k'], FR = K.frame([0, 0, 1.3], 2.2);
  function gallery(D, ok, o) {
    o = o || {}; var g = D.grid(6, { cols: [6, 3, 2] });
    ORDER.forEach(function (k, i) {
      var s = SH[k], p = g.pos[i], S = D.sub(p.cx, p.cy, g.size / 2, FR, o.th != null ? o : null), al = ok(k) ? 1 : .18;
      S.mesh(s.m, { col: s.col, a: al, at: s.at });
      D.text(p.cx, p.ly, s.name, { size: .85, a: Math.max(.3, al) });
    });
  }
  function rev(D, keys) { return function (k) { return !D.ph || D.t < .3 ? true : keys.indexOf(k) >= 0; }; }

  K.run({
    no: '第8時', title: 'ヒントを組み合わせて、立体を当てよう',
    model: FR, view: { th: -62, ps: 22 },
    links: [{ href: 'index.html', label: '目次' }, { href: '07.html', label: '◀ 第7時' }, { href: '09.html', label: '第9時 ▶' }],
    steps: [
      { tag: '今日の問い', bh: '立体当てクイズ', q: 'ヒント1「面が 5つある」、ヒント2「側面は、すべて三角形である」。この 2つにあてはまる立体を、ア〜カから 1つ選ぼう。', spin: true,
        notes: ['① 自分の考え（3分）　ヒントごとに、あてはまる立体を。', '② ペアで、立体を 1つ決めて ヒントを 2つ考え、出し合おう。'],
        draw: function (D) { gallery(D, function () { return true; }); } },
      { tag: '今日の問い', q: 'ヒント1「面が 5つある」だけだと？', a: 'ウ 三角柱、エ 四角錐', sub: '三角柱 3＋2、四角錐 4＋1。まだ 1つに決まらない', dur: 1.5, spin: true,
        b: { t: 'ヒント1 面が 5つ … ウ 三角柱・エ 四角錐', col: C.yel },
        draw: function (D) { gallery(D, rev(D, ['u', 'e'])); } },
      { tag: '今日の問い', q: 'ヒント2「側面は、すべて三角形」もあわせると？', a: 'エ 四角錐', sub: '側面が三角形なのは、角錐だから', dur: 1.5, spin: true,
        b: { t: 'ヒント2 もあわせると … <b>エ 四角錐</b>', col: C.yel },
        draw: function (D) { gallery(D, function (k) { return D.ph && D.t > .3 ? k === 'e' : k === 'u' || k === 'e'; }); } },
      { tag: 'ことば', bh: 'ことば', q: '立体を表す図・見方には、どんなものがあった？', a: '見取図・展開図・投影図・回転体', sub: '見えるように表した図、切り開いた図、立面図と平面図、軸のまわりに 1回転した立体', spin: true,
        b: { t: '<b>見取図</b>・<b>展開図</b>・<b>投影図</b>（立面図＋平面図）・<b>回転体</b>', col: C.green },
        draw: function (D) { gallery(D, function () { return true; }); } },
      { tag: '例題', bh: '例題　ヒントで しぼりこむ', q: '「平面図は、円である」にあてはまる立体は？', a: 'ア 円柱、イ 円錐、オ 球', dur: 1.5,
        b: { t: '平面図が 円 … 円柱・円錐・球', col: C.blue },
        draw: function (D) { gallery(D, rev(D, ['a', 'i', 'o']), { th: -Math.PI / 2, ps: 1.5, fov: .12 }); } },
      { tag: '例題', q: 'もう1つ「展開図に、おうぎ形がある」を足すと？', a: 'イ 円錐', sub: '円錐の側面は おうぎ形。2つのヒントで、1つに決まった', dur: 1.5,
        b: { t: '＋ 展開図に おうぎ形 … <b>イ 円錐</b>', col: C.blue },
        draw: function (D) { gallery(D, function (k) { return D.ph && D.t > .3 ? k === 'i' : 'aio'.indexOf(k) >= 0; }); } },
      { tag: '考えよう', q: '「立面図は、長方形である」だけでは、立体は 1つに決まらない。あてはまる立体を、できるだけたくさん あげよう。もう1つ、どんなヒントがあれば 1つに決まるだろう。',
        notes: ['あてはまる立体を、たくさん', '1つに決まる、もう1つのヒント', '【自分たちの問題】答えの立体と、ヒントを 3つ書いて、友達に出そう。'],
        draw: function (D) { gallery(D, function () { return true; }, { th: -Math.PI / 2, ps: 0, fov: .12 }); D.text(D.W / 2, D.info.top + 26, '正面から見ると…', { size: .95 }); } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '次の特徴の立体は？　A 面が 12、すべて合同な正五角形で、どの頂点にも 3つの面　B 展開図は 円 2つと長方形 1つ　C 頂点 6、辺 10 で、側面は三角形　D 立面図も平面図も正方形で、面は 6つ',
        a: 'A 正十二面体　B 円柱　C 五角錐　D 立方体', sub: 'C … 面は 2 − 6 ＋ 10 ＝ 6（底面 1 ＋ 側面 5）', dur: 1, spin: true,
        b: { t: 'A 正十二面体　B 円柱　C 五角錐（面 2−6+10＝6）　D 立方体', col: C.orange },
        draw: function (D) {
          if (!D.ph) { D.text(D.W / 2, D.H / 2, '？', { size: 4, plain: true, col: 'rgba(242,240,230,.4)' }); return; }
          var p = (1 + Math.sqrt(5)) / 2, ip = 1 / p, V = [];
          [-1, 1].forEach(function (x) { [-1, 1].forEach(function (y) { [-1, 1].forEach(function (z) { V.push([x, y, z]); }); }); });
          [-1, 1].forEach(function (s) { [-1, 1].forEach(function (t) { V.push([0, s * ip, t * p], [s * ip, t * p, 0], [t * p, 0, s * ip]); }); });
          var dod = hullPoly(V);
          var list = [['A 正十二面体', dod, C.lav, [0, 0, 0]], ['B 円柱', K.cylinder(1.2, 2.6), C.blue, [0, 0, -1.3]], ['C 五角錐', K.pyramid(K.regPoly(5, 1.4), [0, 0, 2.6]), C.orange, [0, 0, -1.3]], ['D 立方体', K.prism([[-1.2, -1.2], [1.2, -1.2], [1.2, 1.2], [-1.2, 1.2]], 2.4), C.green, [0, 0, -1.2]]];
          var g = D.grid(4, { cols: [4, 2] });
          list.forEach(function (x, i) { var q = g.pos[i], S = D.sub(q.cx, q.cy, g.size / 2, K.frame([0, 0, 0], 2)); S.mesh(x[1], { col: x[2], at: x[3] }); D.text(q.cx, q.ly, x[0], { size: .9 }); });
        } }
    ]
  });
  /* 凸包で、正十二面体の面をつくる */
  function hullPoly(V) {
    var F = [], seen = {}, N = V.length;
    for (var a = 0; a < N; a++) for (var b = a + 1; b < N; b++) for (var c = b + 1; c < N; c++) {
      var n = v.cross(v.sub(V[b], V[a]), v.sub(V[c], V[a])); if (v.len(n) < 1e-9) continue; n = v.nrm(n);
      var pos = 0, neg = 0, on = [];
      for (var q = 0; q < N; q++) { var d = v.dot(v.sub(V[q], V[a]), n); if (d > 1e-6) pos++; else if (d < -1e-6) neg++; else on.push(q); }
      if (pos && neg) continue; var key = on.slice().sort().join(); if (seen[key]) continue; seen[key] = 1;
      var cc = v.centroid(on.map(function (i) { return V[i]; })), out = pos ? v.mul(n, -1) : n, e1 = v.nrm(v.sub(V[on[0]], cc)), e2 = v.cross(out, e1);
      on.sort(function (i, j) { var ri = v.sub(V[i], cc), rj = v.sub(V[j], cc); return Math.atan2(v.dot(ri, e2), v.dot(ri, e1)) - Math.atan2(v.dot(rj, e2), v.dot(rj, e1)); });
      F.push(on);
    }
    return K.polyhedron(V, F);
  }
})();
</script>
</body>
</html>
