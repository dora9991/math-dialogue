<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空間図形のまとめ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<script src="js/k3.js"></script>
<script>
/* 空間図形 第15時：空間図形で学んだことを、整理して確かめよう（ikkan の lesson_kukan_new_15 と同じ流れ）。
   円錐（半径 3・高さ 4・母線 5）を、4つの見方（動かす・方向を決めて見る・切り開く・面で分ける）で見る。 */
(function () {
  var C = K3.COL, v = K3.v, DEG = v.DEG, K = K3, PI = Math.PI;
  var R = 3, H = 4, L = 5, FR = K.frame([0, 0, 1.8], 4.2), CONE = K.cone(R, H);
  function camOf(m) { var w = v.mul(m, -1); return { th: Math.atan2(w[1], w[0]) / DEG, ps: Math.asin(w[2]) / DEG }; }
  var FIN = K.coneNet(R, H, 1, 1), CV = { th: camOf(FIN.m).th, ps: camOf(FIN.m).ps, fov: 6, R: L * 1.25, target: v.lerp3([0, 0, H], v.centroid(FIN.side.V.concat(FIN.base.V)), .8) };
  var TRI = [[0, 0], [R, 0], [0, H]];

  K.run({
    no: '第15時', title: '空間図形で学んだことを、整理して確かめよう',
    model: FR, view: { th: -60, ps: 16 },
    links: [{ href: 'index.html', label: '目次' }, { href: '14.html', label: '◀ 第14時' }],
    steps: [
      { tag: '今日の問い', bh: '円錐（半径 3cm・高さ 4cm・母線 5cm）を 4つの見方で', q: '円錐を、「動かす」「方向を決めて見る」「切り開く」「面で分ける」の 4つの見方でとらえると、何がわかるだろう。',
        notes: ['① 自分の考え（3分）　見方を選んで、わかることを。', '② ペアの考え（3分）'], spin: true,
        draw: function (D) { D.mesh(CONE, { col: C.pink }); D.label([0, -R / 2, 0], '3', { dy: .9 }); D.label([0, 0, H / 2], '4', { dx: 1 }); } },
      { tag: '今日の問い', q: '「動かす」見方では？', a: '直角三角形を、高さの辺を軸に 1回転', dur: 3,
        b: { t: '動かす … 直角三角形を 1回転（回転体）', col: C.yel },
        draw: function (D) {
          var deg = D.ph ? 360 * v.ease(D.t) : 0, a0 = 30 * DEG - deg * DEG;
          D.seg([0, 0, -.6], [0, 0, H + .8], { col: C.chalk, dash: true });
          if (deg > .5) D.mesh(K.revolve(TRI, { from: a0, sweep: Math.min(deg * DEG, v.TAU), seg: 64 }), { col: C.pink, a: .85 });
          var fade = 1 - v.smooth(330, 360, deg); if (fade > .01) D.poly(D.flat(TRI, a0), { col: C.yel, a: .5 * fade, stroke: C.yel, sa: fade, sw: D.lw * 1.6 });
        } },
      { tag: '今日の問い', q: '「方向を決めて見る」見方では？', a: '立面図は 二等辺三角形、平面図は 円', dur: 3,
        view: function (s) { return !s.ph ? { th: -60, ps: 16 } : s.t < .5 ? { th: -90, ps: 0, fov: 5 } : { th: -90, ps: 89.5, fov: 5 }; },
        banner: function (s) { return s.ph ? (s.t < .5 ? '正面から' : '真上から') : ''; },
        b: { t: '方向を決めて見る … 立面図 二等辺三角形・平面図 円', col: C.blue },
        draw: function (D) { D.mesh(CONE, { col: C.pink }); if (D.ph && D.t > .5) D.dot([0, 0, H], { col: C.yel, r: 1.6 }); } },
      { tag: '今日の問い', q: '「切り開く」見方では？', a: '側面は おうぎ形（弧 6π cm、中心角 216°）', sub: '弧 ＝ 底面の円周 2π × 3 ＝ 6π。半径 5 の円周 10π の 6π/10π → 360° × 3/5 ＝ 216°', dur: 4,
        model: K.frame([0, 0, 2], 6), view: function (s) { return s.ph && s.t > .15 ? CV : { th: -60, ps: 16, R: 4.2, target: [0, 0, 1.8] }; },
        b: { t: '切り開く … 側面は おうぎ形（弧 6π、中心角 216°）', col: C.pink },
        draw: function (D) {
          var t = D.ph ? D.t : 0, n = K.coneNet(R, H, v.ease(v.clamp((t - .15) / .6, 0, 1)), v.ease(v.clamp((t - .15) / .6, 0, 1)));
          D.mesh(n.side, { col: C.pink, two: true }); D.mesh(n.base, { col: C.blue, two: true });
        } },
      { tag: '今日の問い', q: '「面で分ける」見方では？', a: '底面に平行に切ると、切り口は 円', sub: '軸をふくむ平面で切ると、切り口は 二等辺三角形', dur: 3.5,
        b: { t: '面で分ける … 底面に平行に切ると 円', col: C.green },
        sliders: [{ key: 'z', label: '切る高さ', min: .2, max: 3.6, val: 2, anim: [.4, 3], fmt: function (x) { return x.toFixed(1) + 'cm'; } }],
        draw: function (D) {
          var z = D.V.z, r = R * (1 - z / H);
          D.mesh(CONE, { col: C.pink, a: .55 });
          D.poly([[-4, -4, z], [4, -4, z], [4, 4, z], [-4, 4, z]], { col: C.chalk, a: .08, stroke: C.chalk, sa: .4, dash: true });
          D.circle([0, 0, z], [1, 0, 0], [0, 1, 0], r, { col: C.green, a: .6, stroke: C.green, sw: D.lw * 1.6 });
        } },
      { tag: 'ことば', bh: 'ことば（単元のまとめ）', q: '単元で学んだ ことばと公式を、整理しよう。', spin: true,
        b: [{ t: '体積 … 柱 Sh　錐 1/3 Sh　球 4/3 πr³', col: C.green }, { t: '位置関係 … 交わる・平行・ねじれの位置', col: C.green }, { t: '回転させた立体 … 回転体　切り開いた図 … 展開図', col: C.green }, { t: '正面から 立面図・真上から 平面図 → あわせて 投影図', col: C.green }],
        draw: function (D) {
          var g = D.grid(4, { cols: [4, 2] }), F2 = K.frame([0, 0, 1.4], 2.3);
          [['柱', K.cylinder(1.2, 2.8), C.blue, [0, 0, 0]], ['錐', K.cone(1.3, 2.8), C.pink, [0, 0, 0]], ['球', K.sphere(1.4), C.orange, [0, 0, 1.4]], ['正多面体', K.prism(K.regPoly(4, 1.4), 2), C.lav, [0, 0, .4]]].forEach(function (x, i) {
            var p = g.pos[i], S = D.sub(p.cx, p.cy, g.size / 2, F2); S.mesh(x[1], { col: x[2], at: x[3] }); D.text(p.cx, p.ly, x[0], { size: 1 });
          });
        } },
      { tag: '例題', bh: '例題', model: K.frame([0, 0, 3], 5.5),
        view: function (s) { return !s.ph ? { th: -90, ps: 0, fov: 5 } : s.t < .3 ? { th: -90, ps: 0, fov: 5 } : { th: -60, ps: 16 }; },
        q: '立面図が 横 8cm・たて 6cm の長方形、平面図が 直径 8cm の円の立体の、名前と、表面積・体積（π のまま）は？',
        a: '円柱。表面積 80π cm²、体積 96π cm³', sub: '半径 4、高さ 6。側面 2π×4×6＝48π、底面 16π×2＝32π。体積 π×4²×6＝96π', dur: 3,
        b: { t: '円柱（半径 4・高さ 6）　表面積 48π＋32π＝<b>80π</b>　体積 <b>96π</b>', col: C.blue },
        draw: function (D) { D.mesh(K.cylinder(4, 6), { col: C.blue }); if (!D.ph || D.t < .3) { D.dim([-4, 0, 0], [4, 0, 0], '8cm', { off: [0, 0, -.6], dy: .8 }); D.dim([4, 0, 0], [4, 0, 6], '6cm', { off: [.6, 0, 0], dx: 1.2 }); } } },
      { tag: '考えよう', q: '次のア〜エには、どの見方が役に立つだろう。見方を選んで、わけを説明しよう。',
        notes: ['ア 立方体を、3つの頂点 B・D・G を通る平面で切ったときの、切り口の形', 'イ 底面の半径 3cm、母線 5cm の円錐の、表面積', 'ウ 半径 3cm の半円を、直径を軸として 1回転させてできる立体の、体積', 'エ どの向きから見ても、円に見える立体の、名前', '① 2つを選んで、その見方が役に立つわけを。② ちがう見方でも考えられるか、1つ例を。'],
        model: K.cuboid(4, 4, 4), view: { th: -58, ps: 22 },
        draw: function (D) { D.box(null, {}); } },
      { tag: 'チャレンジ', bh: 'チャレンジ', model: K.cuboid(6, 6, 6), view: { th: -58, ps: 22 },
        q: '1辺 6cm の立方体 ABCD-EFGH。（1）三角錐 A-BDE の体積　（2）4つの頂点 B、D、E、G を結んでできる三角錐 BDEG の体積',
        a: '（1）36cm³　（2）72cm³', sub: '（1）1/3 × 18 × 6 ＝ 36　（2）立方体 216 から、（1）と合同な三角錐 4つを切りとる　216 − 36 × 4 ＝ 72', dur: 5,
        b: { t: '（1）1/3×18×6＝<b>36</b>　（2）216 − 36×4 ＝ <b>72cm³</b>', col: C.orange },
        draw: function (D) {
          var M = D.M, P = M.P, t = D.ph ? D.t : 0;
          D.box(null, { dim: .55 });
          [['A', 'B', 'D', 'E'], ['C', 'B', 'D', 'G'], ['F', 'B', 'E', 'G'], ['H', 'D', 'E', 'G']].forEach(function (c, i) {
            var s0 = i / 4 * .7, out = v.smooth(s0, s0 + .14, t), V = c.map(function (k) { return P[k]; }), dir = v.nrm(v.sub(V[0], M.ctr));
            D.mesh(K.polyhedron(V, [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]]), { col: i === 0 ? C.yel : C.blue, a: .45, at: v.mul(dir, 2.4 * out) });
          });
          D.mesh(K.polyhedron([P.B, P.D, P.E, P.G], [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]]), { col: C.orange, a: .5 + .45 * v.smooth(.7, .85, t) });
        } }
    ]
  });
})();
</script>
</body>
</html>
