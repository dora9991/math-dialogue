<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>振り返りシート</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1e2a3a; --sub:#68788e;
    --accent:#3b6fe0; --accent-soft:#e7eeff;
    --v4:#2fa25f; --v3:#2f9e8f; --v2:#e8a13c; --v1:#d9534f;
    --line:#e3e8f2; --flag:#fdecec; --good-bg:#e6f5ec; --dup-bg:#eef1f7;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;}
  header{background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:10;}
  header h1{font-size:17px;}
  header .spacer{flex:1;}
  .mode-switch{display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .mode-switch button{border:none; background:transparent; padding:7px 18px; font-size:14px; cursor:pointer; color:var(--sub);}
  .mode-switch button.active{background:var(--accent); color:#fff;}
  main{max-width:960px; margin:0 auto; padding:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px;}
  .card h2{font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .card h2 .tag{font-size:11px; background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 8px; font-weight:normal;}
  .card h2 .tag.good-tag{background:var(--good-bg); color:var(--v4);}
  .card h2 .tag.dup-tag{background:var(--dup-bg); color:var(--sub);}
  label{display:block; font-size:13px; color:var(--sub); margin-bottom:4px;}
  select,input[type=text],textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink); font-weight:500;
  }
  /* date/number はブラウザのネイティブUIがOSのダーク/ライト設定を独自に見てしまい、
     ページのテーマと食い違って文字が薄く見えることがあるため、常に白背景・黒文字に固定する。 */
  input[type=date],input[type=number]{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:15px; font-family:inherit; background:#fff; color:#14181f; -webkit-text-fill-color:#14181f; color-scheme:light; font-weight:500;
  }
  input[type=date]::-webkit-datetime-edit-text,
  input[type=date]::-webkit-datetime-edit-month-field,
  input[type=date]::-webkit-datetime-edit-day-field,
  input[type=date]::-webkit-datetime-edit-year-field{ color:#14181f; }
  textarea{min-height:76px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row>div{flex:1; min-width:140px;}
  .field{margin-bottom:14px;}
  .abc{display:flex; gap:8px;}
  .abc button{flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px 0; font-size:16px; font-weight:bold; cursor:pointer; color:var(--sub);}
  .abc button.sel4{border-color:var(--v4); background:var(--v4); color:#fff;}
  .abc button.sel3{border-color:var(--v3); background:var(--v3); color:#fff;}
  .abc button.sel2{border-color:var(--v2); background:var(--v2); color:#fff;}
  .abc button.sel1{border-color:var(--v1); background:var(--v1); color:#fff;}
  .abc-note{font-size:11.5px; color:var(--sub); margin-top:4px;}
  .submit{width:100%; border:none; background:var(--accent); color:#fff; font-size:16px; font-weight:bold; border-radius:12px; padding:13px 0; cursor:pointer;}
  .submit:active{opacity:.85;}
  .submit:disabled{opacity:.6; cursor:default;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
  .stat{background:var(--accent-soft); border-radius:12px; padding:12px; text-align:center;}
  .stat .num{font-size:22px; font-weight:bold; color:var(--accent);}
  .stat .num small{font-size:12px; font-weight:normal;}
  .stat .lbl{font-size:12px; color:var(--sub);}
  .chips{display:flex; gap:4px; justify-content:center; margin-top:2px;}
  .chip{width:18px; height:18px; border-radius:5px; font-size:11px; font-weight:bold; color:#fff; display:flex; align-items:center; justify-content:center;}
  .chip.v4{background:var(--v4);} .chip.v3{background:var(--v3);} .chip.v2{background:var(--v2);} .chip.v1{background:var(--v1);} .chip.none{background:#cfd8e6;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap;}
  th{color:var(--sub); font-weight:normal; font-size:12px; background:#fafbfe; position:sticky; top:0;}
  td.name{text-align:left; font-weight:bold; cursor:pointer; color:var(--accent);}
  tr.flagged{background:var(--flag);}
  tr.goodrow{background:var(--good-bg);}
  tr.duprow{background:var(--dup-bg);}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .sign-badge{border:none; border-radius:8px; padding:4px 10px; font-size:12.5px; font-weight:bold; cursor:pointer;}
  .sign-badge.flag{background:var(--flag); color:var(--v1);}
  .sign-badge.good{background:var(--good-bg); color:var(--v4);}
  .sign-badge.dup{background:var(--dup-bg); color:var(--sub);}
  .entry{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .entry.is-flag{border-color:var(--v1); background:var(--flag);}
  .entry.is-good{border-color:var(--v4); background:var(--good-bg);}
  .entry.is-dup{border-style:dashed; border-color:var(--sub); background:var(--dup-bg);}
  .entry .head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; font-size:13px; color:var(--sub);}
  .entry .head b{color:var(--ink); font-size:14px;}
  .entry .txt{font-size:14px; margin:4px 0;}
  .entry .txt span.lb{font-size:11.5px; color:var(--sub); display:block;}
  .checks{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
  .ck{font-size:11px; border-radius:99px; padding:3px 10px; background:#eef1f7; color:#9aa7ba; border:1px solid var(--line);}
  .ck.on{background:#e6f5ec; color:var(--v4); border-color:#bfe3cd; font-weight:bold;}
  .advice-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .ck.advice{background:#fdf1de; color:#a5680f; border-color:#f0d4a0; font-weight:bold;}
  .toikaeshi{margin-top:8px; font-size:13px; background:#fff8e8; border:1px solid #f3e3b8; border-radius:10px; padding:8px 12px;}
  .toikaeshi::before{content:"🤖 AIからの問い返し："; font-size:11.5px; color:#a07a1e; display:block;}
  .flagnote{margin-top:6px; font-size:12.5px; color:var(--v1); font-weight:bold;}
  .goodnote{margin-top:6px; font-size:12.5px; color:var(--v4); font-weight:bold;}
  .dupnote{margin-top:6px; font-size:12.5px; color:var(--sub); font-weight:bold;}
  .dupwarning{margin-top:8px; font-size:13px; background:var(--dup-bg); border:1px dashed #b7c0d1; border-radius:10px; padding:8px 12px; color:var(--sub);}
  .dupwarning::before{content:"📋 コピーの疑いがあります："; font-size:11.5px; color:var(--sub); display:block; font-weight:bold;}
  .result-pop{border:2px solid var(--accent); background:var(--accent-soft);}
  .result-pop.is-dup{border-color:var(--sub); background:var(--dup-bg);}
  .muted{color:var(--sub); font-size:13px;}
  .back{background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; padding:0; margin-bottom:10px;}
  .legend{font-size:11.5px; color:var(--sub); margin-top:8px;}
  .bar-wrap{display:flex; align-items:flex-end; gap:3px; height:46px; margin-top:4px;}
  .bar{flex:1; background:var(--accent); border-radius:3px 3px 0 0; min-width:6px; max-width:22px;}
  .filter-tabs{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .filter-tabs button{border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:6px 14px; font-size:13px; cursor:pointer; color:var(--sub);}
  .filter-tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .idline{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; font-size:14px;}
  .idline b{font-family:ui-monospace,monospace; font-size:18px; letter-spacing:.04em;}
  .idpreview{font-family:ui-monospace,monospace; font-size:26px; letter-spacing:.06em; color:var(--accent);}
  .error-card{border-color:var(--v1); background:var(--flag); color:var(--v1);}
  .error-card button{margin-top:8px;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#141a24; --card:#1d2532; --ink:#e8edf5; --sub:#93a2b8; --line:#2c3648; --accent-soft:#22304c; --flag:#3a2426; --good-bg:#1f3226; --dup-bg:#20293a;}
    select,input[type=text],textarea,.abc button,.filter-tabs button{background:#151c28; color:var(--ink);}
    th{background:#1a2230;}
    .ck{background:#232c3c;}
    .ck.advice{background:#3a2e18; color:#e8a13c; border-color:#5a4726;}
    .toikaeshi{background:#2e2a1a; border-color:#4a4128;}
  }
</style>
</head>
<body>

<header>
  <h1>📝 振り返りシート</h1>
  <span class="spacer"></span>
  <div class="mode-switch">
    <button id="btnStudent" class="active" onclick="setMode('student')">生徒</button>
    <button id="btnTeacher" onclick="setMode('teacher')">教師</button>
  </div>
</header>

<main>
  <div id="app"></div>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
"use strict";
const KANTEN = ["まとめの具体性","つまづきの自覚","次の一手","問いの発生","前回との接続","学び方の工夫"];
const DUP_SIM_THRESHOLD = 0.85;
const DUP_MIN_LEN = 20;
const SHORT_LEN_THRESHOLD = 20;

/* ---------- 出席番号（学年・組・番号→4桁）＋合言葉。quiz/ツールの番号方式＋簡易ログイン ---------- */
const ID_CONFIG = { GRADES:[1,2,3], CLASSES:[1,2,3,4,5,6], CLASS_SIZE:40 };
const STUDENT_KEY = "reflection:student";
const makeSid = (g,c,n) => `${g}${c}${String(n).padStart(2,"0")}`;
const readSid = sid => ({ g:+sid[0], c:+sid[1], n:+sid.slice(2) });
const sidLabel = sid => { const {g,c,n}=readSid(sid); return `${g}年${c}組${n}番`; };
function loadStudentLogin(){
  try{ const v=JSON.parse(localStorage.getItem(STUDENT_KEY)||"null");
    return (v && /^[0-9]{3,6}$/.test(v.code) && v.passphrase) ? v : null;
  }catch(e){ return null; }
}
function saveStudentLogin(code, passphrase){ localStorage.setItem(STUDENT_KEY, JSON.stringify({code, passphrase})); }
function clearStudentLogin(){ localStorage.removeItem(STUDENT_KEY); }

/* ---------- コピー使い回し検知（2文字bigramのDice係数） ---------- */
function textSimilarity(a,b){
  if(a===b) return 1;
  if(!a.length || !b.length) return 0;
  const bigrams = s=>{ const arr=[]; for(let i=0;i<s.length-1;i++) arr.push(s.substr(i,2)); return arr; };
  const ba=bigrams(a), bb=bigrams(b);
  if(!ba.length || !bb.length) return a===b?1:0;
  const counts={};
  bb.forEach(g=>counts[g]=(counts[g]||0)+1);
  let common=0;
  ba.forEach(g=>{ if(counts[g]>0){ common++; counts[g]--; } });
  return (2*common)/(ba.length+bb.length);
}
// サーバーから読み込んだ既存記録にも同じ文字数/具体性アドバイスを適用する（DBには保存せず毎回導出）
function deriveAdvice(e){
  if(e.duplicate || !e.checks) return;
  const len = ((e.matome||"")+(e.furikaeri||"")).replace(/\s/g,"").length;
  e.tooShort = len < SHORT_LEN_THRESHOLD;
  e.tooVague = !e.tooShort && !e.checks[0];
}
function findDuplicate(nowText, prevEntries){
  const now = nowText.replace(/\s/g,"");
  if(now.length < DUP_MIN_LEN) return null;
  for(const p of prevEntries){
    const prevText = ((p.matome||"")+(p.furikaeri||"")).replace(/\s/g,"");
    if(prevText.length < DUP_MIN_LEN) continue;
    if(textSimilarity(now, prevText) >= DUP_SIM_THRESHOLD) return p;
  }
  return null;
}

/* ---------- 簡易AI分析（本番はClaude APIに置き換え） ---------- */
function analyze(e, prevEntries){
  const m = e.matome||"", f = e.furikaeri||"", all = m+f;

  const dup = findDuplicate(all, prevEntries);
  if(dup){
    e.duplicate = true;
    e.duplicateDate = dup.date;
    e.checks = null;
    e.flag = false;
    e.good = false;
    e.toikaeshi = null;
    e.warning = `${dup.date}の振り返りとほぼ同じ内容です。コピーではなく、今日の授業で気づいたことを自分の言葉で書いてみましょう。`;
    return;
  }
  e.duplicate = false;
  e.duplicateDate = null;
  e.warning = null;

  // 文字数・具体性のアドバイス（観点チェックとは別に、書く量・質そのものへの声かけ）
  e.tooShort = all.replace(/\s/g,"").length < SHORT_LEN_THRESHOLD;

  const checks = [];
  // ① まとめの具体性：内容語を含みある程度の長さで再構成しているか
  checks.push(m.replace(/\s/g,"").length>=15 && /[はがをにでとなら]/.test(m));
  // ② つまづきの自覚：何につまづいたかへの言及
  checks.push(/(つまず|間違|ミス|わからな|できなかっ|迷っ|苦手|あいまい)/.test(all));
  // ③ 次の一手：行動としての次の計画
  checks.push(/(次は|明日|今度|練習する|復習|やり直|見直|学び直|してみる|作る|書いてくる|やってみたい)/.test(f));
  // ④ 問いの発生
  checks.push(/(？|\?|なぜ|どうして|だろう|不思議|気になる|疑問)/.test(all));
  // ⑤ 前回との接続：前回の記述への言及
  checks.push(prevEntries.length>0 && /(前回|この前|昨日|先週|前に|決めた|言っていた|疑問が)/.test(f));
  // ⑥ 学び方の工夫：やりやすさへの気づき・人や友達に聞いて解決・図表や声出しなどの工夫発見
  checks.push(/(友(達|だち)に(聞い|教え)|人に(聞い|教え)|先生に(聞い|教え)|一緒に(考え|やっ|勉強)|やりやすい|考えやすい|わかりやすい|理解しやすい|式を書い|図に(かい|して)|表に(し|まとめ)|声に出し|書き出し|順番を変え|やり方を変え|工夫したら|コツが|に気づいた)/.test(all));
  e.checks = checks;
  e.tooVague = !e.tooShort && !checks[0]; // 量は足りているが「まとめ」が具体的な文になっていない
  const ckCoreCount = checks.slice(0,5).filter(Boolean).length; // 得意サイン判定は元の5観点ベースを維持（学び方は別軸）
  // 教師向けフラグ：SOS・空回り
  e.flag = /(むり|無理|嫌だ|つらい|しんどい|意味ない|やる気が出な|もうやだ)/.test(all)
        || (e.rikai===1 && f.replace(/\s/g,"").length<12);
  // 得意サイン：発展的な挑戦・自分の言葉での説明・高い自己調整を伴う高評価
  e.good = /(もっと(難しい|上級|発展)|人に(説明|教え)|友達に教え|挑戦したい|自分で気づいた|応用|得意)/.test(all)
        || (e.rikai===4 && e.iyoku>=3 && ckCoreCount>=4);
  // 問い返し（サンプルはルールベース。本番はAI生成）
  if(e.tooShort) e.toikaeshi = "文字数がすこし少ないかも。今日の授業で分かったことを、もう一言足してみよう。";
  else if(e.tooVague) e.toikaeshi = "「わかった」をもう少しくわしく——何が、どうしてわかったのかを書いてみよう。";
  else if(!checks[1] && e.rikai<4) e.toikaeshi = "「難しかった」のはどの問題の、どの瞬間だった？1つだけ思い出して書いてみよう。";
  else if(!checks[2]) e.toikaeshi = "今日の気づきを、明日の自分への「ひとこと作戦」にすると何になる？";
  else if(!checks[3]) e.toikaeshi = "今日の内容で「なぜ？」と聞きたくなるところを1つ探すとしたらどこ？";
  else if(checks[5]) e.toikaeshi = "「こうしたらやりやすかった」——自分に合う学び方を見つけているね。次はどんな工夫を試したい？";
  else if(checks[4]) e.toikaeshi = "前回の自分とのつながりが書けているのが素晴らしい。次の目標を1つ挙げるなら？";
  else e.toikaeshi = "いい振り返り！このやり方がうまくいった理由は何だと思う？";
}

/* ---------- 共通ヘルパー ---------- */
let mode = "student";
let studentLogin = loadStudentLogin();
let studentCode = studentLogin ? studentLogin.code : null;
let studentPassphrase = studentLogin ? studentLogin.passphrase : null;
let myEntries = [];
let myLoading = false;
let myFetched = false;
let myError = null;
let loginError = null;
let lastResult = null;

let teacherPin = sessionStorage.getItem("reflection:teacherPin") || null;
let teacherEntries = null;
let teacherLoading = false;
let teacherError = null;
let teacherDetail = null;
let filterMode = null; // null | 'flag' | 'good' | 'dup'

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byStudentIn = (entries,id)=>entries.filter(e=>e.studentId===id).sort((a,b)=>a.date<b.date?-1:1);
const avg = arr=>arr.length? arr.reduce((s,x)=>s+x,0)/arr.length : 0;
const formatAvg = v=> v.toFixed(1);
function chipRow(entries, key, n=6){
  const last = entries.slice(-n);
  let html = '<div class="chips">';
  for(const e of last) html += `<div class="chip v${e[key]}">${e[key]}</div>`;
  if(!last.length) html += '<div class="chip none">-</div>';
  return html+'</div>';
}
function summarize(entries){
  const evaluable = entries.filter(e=>e.checks);
  return {
    count: entries.length,
    total: entries.reduce((s,e)=>s+(+e.minutes||0),0),
    rikaiAvg: avg(entries.map(e=>e.rikai)),
    iyokuAvg: avg(entries.map(e=>e.iyoku)),
    ckTotal: evaluable.reduce((s,e)=>s+e.checks.filter(Boolean).length,0),
    ckMax: evaluable.length*KANTEN.length,
    flags: entries.filter(e=>e.flag).length,
    goods: entries.filter(e=>e.good).length,
    dups: entries.filter(e=>e.duplicate).length,
  };
}

/* ---------- 描画 ---------- */
function setMode(m){ mode=m; teacherDetail=null; filterMode=null; lastResult=null;
  $("#btnStudent").classList.toggle("active",m==="student");
  $("#btnTeacher").classList.toggle("active",m==="teacher");
  render();
}
function openDetail(id, filter){ teacherDetail=id; filterMode=filter||null; render(); }

function render(){
  if(!window.Reflection || !Reflection.configReady()){
    $("#app").innerHTML = `<div class="card error-card"><h2>⚠ サーバー未設定</h2><p>config.js にSupabaseの接続情報（URL・anonキー）が入っていません。schema.sql をSupabaseのSQL Editorで実行し、config.js を書き換えてください。</p></div>`;
    return;
  }
  $("#app").innerHTML = mode==="student" ? renderStudent() : renderTeacher();
}

/* ----- 生徒: 出席番号の取得 ----- */
async function loadMine(){
  if(!studentCode || !studentPassphrase) return;
  myLoading = true; render();
  try{
    const res = await Reflection.rpc("reflection_get_mine", {p_student: studentCode, p_passphrase: studentPassphrase});
    if(res.error === "bad_auth"){
      // 合言葉が一致しない＝端末の記憶が古い/不正。ログアウトしてやり直させる。
      clearStudentLogin();
      studentCode = null; studentPassphrase = null; myFetched = false;
      myError = null;
      render();
      return;
    }
    if(res.error) throw new Error(res.error);
    myEntries = res.entries || [];
    myEntries.forEach(deriveAdvice);
    myError = null;
  }catch(err){
    myError = "読み込みに失敗しました。通信環境を確認してください。";
  }
  myLoading = false; myFetched = true; render();
}
function changeStudent(){
  if(!confirm("出席番号を変更しますか？（この端末の記憶を消します）")) return;
  clearStudentLogin();
  studentCode = null; studentPassphrase = null; myEntries = []; myFetched = false; lastResult = null;
  render();
}

/* ----- 生徒画面 ----- */
function renderStudent(){
  if(!studentCode) return renderPicker();
  if(!myFetched && !myLoading) loadMine();

  const es = myEntries.slice().sort((a,b)=>a.date<b.date?-1:1);
  const sm = summarize(es);
  const today = new Date().toISOString().slice(0,10);
  let html = `
  <div class="card">

function updatePickerPreview(){
  pickerState.g=$("#pkG").value; pickerState.c=$("#pkC").value; pickerState.n=$("#pkN").value;
  $("#pkPreview").textContent = pickerState.n ? makeSid(pickerState.g,pickerState.c,pickerState.n) : "----";
}
async function confirmPicker(){
  pickerState.g=$("#pkG").value; pickerState.c=$("#pkC").value; pickerState.n=$("#pkN").value;
  pickerState.pass=$("#pkPass").value.trim();
  const {g,c,n,pass} = pickerState;
  if(!n){ alert("番号を選んでください"); return; }
  if(!pass || pass.length<2){ alert("合言葉を2文字以上で入力してください"); return; }
  const code = makeSid(g,c,n);
  const btn = $("#pkBtn");
  btn.disabled = true; btn.textContent = "確認中…";
  try{
    const res = await Reflection.rpc("reflection_login", {p_student: code, p_passphrase: pass});
    if(res.ok){
      saveStudentLogin(code, pass);
      studentCode = code; studentPassphrase = pass; myEntries = []; myFetched = false; loginError = null;
      pickerState.pass = "";
      render();
    }else{
      loginError = "合言葉が違います。前回と同じ合言葉を入力してください（分からない場合は先生に相談してください）。";
      render();
    }
  }catch(err){
    loginError = "通信エラーです。通信環境を確認してもう一度お試しください。";
    render();
  }
}

function abcBtns(group){

}
const picked = {rikai:null, iyoku:null};
function pickABC(group,v,btn){
  picked[group]=v;
  btn.parentElement.querySelectorAll("button").forEach(b=>b.className="");
  btn.className="sel"+v;
}
async function submitEntry(){
  const date=$("#fDate").value, minutes=+$("#fMin").value;
  const matome=$("#fMatome").value.trim(), furi=$("#fFuri").value.trim();
  if(!date){alert("日付を入れてください"); return;}
  if(!picked.rikai||!picked.iyoku){alert("理解度と意欲を選んでください"); return;}
  if(!matome&&!furi){alert("まとめか振り返りを書いてください"); return;}

  const e={studentId:studentCode, date, minutes, rikai:picked.rikai, iyoku:picked.iyoku, matome, furikaeri:furi};
  analyze(e, myEntries.filter(x=>x.date<date));

  const btn = $("#submitBtn");
  btn.disabled = true; btn.textContent = "送信中…";
  try{
    const res = await Reflection.rpc("reflection_submit", {
      p_student: studentCode, p_passphrase: studentPassphrase, p_date: date, p_minutes: minutes,
      p_rikai: e.rikai, p_iyoku: e.iyoku, p_matome: matome, p_furikaeri: furi, p_checks: e.checks,
      p_flag: e.flag, p_good: e.good, p_duplicate: e.duplicate, p_duplicate_date: e.duplicateDate,
      p_toikaeshi: e.toikaeshi, p_warning: e.warning,
    });
    if(res.error) throw new Error(res.error);
    const idx = myEntries.findIndex(x=>x.date===date);
    if(idx>=0) myEntries[idx]=e; else myEntries.push(e);
    picked.rikai=picked.iyoku=null; lastResult=e;
  }catch(err){
    alert("送信に失敗しました。通信環境を確認してもう一度お試しください。");
  }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function entryCard(e, forTeacher){
  const cls = (e.duplicate?" is-dup":"") + (forTeacher ? (e.flag?" is-flag":"")+(e.good?" is-good":"") : "");
  const evalBlock = e.duplicate
    ? `<div class="dupwarning">${esc(e.warning)}</div>${forTeacher?`<div class="dupnote">📋 コピー疑い：${e.duplicateDate}の記録と酷似のため評価スキップ</div>`:""}`

       <div class="checks">${KANTEN.map((k,i)=>`<span class="ck ${e.checks[i]?"on":""}">${e.checks[i]?"✓ ":""}${k}</span>`).join("")}</div>
       ${e.toikaeshi?`<div class="toikaeshi">${esc(e.toikaeshi)}</div>`:""}
       ${forTeacher&&e.flag?`<div class="flagnote">⚠ 要精読フラグ：SOSの可能性・記述の停滞</div>`:""}

  return `<div class="entry${cls}">

    <div class="txt"><span class="lb">振り返り</span>${esc(e.furikaeri)||"<span class='muted'>（未記入）</span>"}</div>

}

const CSV_HEADERS = [
  {label:"出席番号", get:e=>e.studentId},
  {label:"日付", get:e=>e.date},
  {label:"学習時間(分)", get:e=>e.minutes},
  {label:"理解度", get:e=>e.rikai},
  {label:"意欲", get:e=>e.iyoku},
  {label:"まとめ", get:e=>e.matome||""},
  {label:"振り返り", get:e=>e.furikaeri||""},
  {label:"まとめの具体性", get:e=>e.checks?(e.checks[0]?1:0):""},
  {label:"つまづきの自覚", get:e=>e.checks?(e.checks[1]?1:0):""},
  {label:"次の一手", get:e=>e.checks?(e.checks[2]?1:0):""},
  {label:"問いの発生", get:e=>e.checks?(e.checks[3]?1:0):""},
  {label:"前回との接続", get:e=>e.checks?(e.checks[4]?1:0):""},
  {label:"学び方の工夫", get:e=>e.checks?(e.checks[5]?1:0):""},
  {label:"要精読", get:e=>e.flag?1:0},
  {label:"得意サイン", get:e=>e.good?1:0},
  {label:"コピー疑い", get:e=>e.duplicate?1:0},
  {label:"もっとしっかり書こう", get:e=>e.tooShort?1:0},
  {label:"もっと具体的に書こう", get:e=>e.tooVague?1:0},
  {label:"AIの問い返し", get:e=>e.toikaeshi||e.warning||""},
];
function csvEscape(v){
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function entriesToCSV(entries){
  const lines = [CSV_HEADERS.map(h=>csvEscape(h.label)).join(",")];
  entries.forEach(e=>lines.push(CSV_HEADERS.map(h=>csvEscape(h.get(e))).join(",")));
  return lines.join("\r\n");
}
function downloadCSV(filename, csvText){
  const blob = new Blob(["﻿"+csvText], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvDateStamp(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
}
function exportClassCSV(){
  if(!teacherEntries || !teacherEntries.length){ alert("出力できる記録がありません。"); return; }
  downloadCSV(`振り返り_全員_${csvDateStamp()}.csv`, entriesToCSV(teacherEntries.slice().sort((a,b)=> a.studentId===b.studentId ? (a.date<b.date?-1:1) : (a.studentId<b.studentId?-1:1))));
}
function exportStudentCSV(){
  const es = byStudentIn(teacherEntries, teacherDetail);
  const filtered = filterMode==="flag" ? es.filter(e=>e.flag)
                  : filterMode==="good" ? es.filter(e=>e.good)
                  : filterMode==="dup" ? es.filter(e=>e.duplicate)
                  : es;
  if(!filtered.length){ alert("出力できる記録がありません。"); return; }
  downloadCSV(`振り返り_${teacherDetail}_${csvDateStamp()}.csv`, entriesToCSV(filtered));
}

function renderTeacher(){

      ${rows.map(r=>{
        const rowCls = r.last&&r.last.flag ? "flagged" : (r.last&&r.last.good ? "goodrow" : (r.last&&r.last.duplicate ? "duprow" : ""));
        return `
      <tr class="${rowCls}">
        <td class="name" onclick="openDetail('${r.code}')">${esc(r.code)}<br><span class="muted" style="font-weight:normal">${esc(sidLabel(r.code))}</span></td>
        <td>${r.sm.count}回</td>
        <td>${r.sm.total}分</td>
        <td>${r.es.length?formatAvg(r.sm.rikaiAvg):"-"}${chipRow(r.es,"rikai",4)}</td>
        <td>${r.es.length?formatAvg(r.sm.iyokuAvg):"-"}${chipRow(r.es,"iyoku",4)}</td>
        <td>${r.sm.ckTotal} / ${r.sm.ckMax}</td>
        <td>${r.last?r.last.date:"-"}</td>
        <td>${r.sm.flags?`<button class="sign-badge flag" onclick="openDetail('${r.code}','flag')">⚠ ${r.sm.flags}</button>`:"—"}</td>
        <td>${r.sm.goods?`<button class="sign-badge good" onclick="openDetail('${r.code}','good')">⭐ ${r.sm.goods}</button>`:"—"}</td>
        <td>${r.sm.dups?`<button class="sign-badge dup" onclick="openDetail('${r.code}','dup')">📋 ${r.sm.dups}</button>`:"—"}</td>
      </tr>`;}).join("")}
    </table></div>`}
    <div class="legend">⚠はSOS・記述停滞の可能性、⭐は発展的な挑戦や自分の言葉での説明など「得意」の兆候、📋は前回までの振り返りとほぼ同じ文章＝コピーの疑い（この回はAI評価をスキップ）。数字をタップすると該当する記録だけを個人ページで確認できます。出席番号をタップすると全履歴が開きます。観点チェック＝AIによる6観点（具体性/つまづき/次の一手/問い/接続/学び方）の✓数（コピー疑いの回は集計対象外）。オレンジのバッジ（✏️もっとしっかり書こう／🔍もっと具体的に書こう）は文字数・具体性が不足している記録への声かけ。</div>
  </div>`;
}

function renderTeacherDetail(){
  const es=byStudentIn(teacherEntries, teacherDetail), sm=summarize(es);

                  : filterMode==="good" ? es.filter(e=>e.good)
                  : filterMode==="dup" ? es.filter(e=>e.duplicate)
                  : es;

                     : filterMode==="good" ? "⭐ 得意のみ表示中"
                     : filterMode==="dup" ? "📋 使い回しのみ表示中" : "";
  const filterTagCls = filterMode==="good" ? "good-tag" : filterMode==="dup" ? "dup-tag" : "";
  return `
  <button class="back" onclick="teacherDetail=null;filterMode=null;render()">← 一覧にもどる</button>
  <div class="card">
    <h2>${esc(teacherDetail)}（${esc(sidLabel(teacherDetail))}） の記録
      <button class="back" style="margin:0;margin-left:auto;font-size:12.5px" onclick="exportStudentCSV()">CSV出力</button>
      <button class="back" style="margin:0;font-size:12.5px" onclick="resetStudentLogin('${teacherDetail}')">合言葉をリセット</button></h2>
    <div class="legend">合言葉を忘れた・他の生徒が先に番号を登録してしまった場合はリセットしてください。本人が次回ログイン時に新しい合言葉を決め直せます（それまでの記録は消えません）。</div>
    <div class="stats">
      <div class="stat"><div class="num">${sm.total}<small> 分</small></div><div class="lbl">学習合計時間</div></div>
      <div class="stat"><div class="num">${sm.count}<small> 回</small></div><div class="lbl">記入回数</div></div>
      <div class="stat"><div class="num">${es.length?formatAvg(sm.rikaiAvg):"-"}</div><div class="lbl">理解度（平均）</div>${chipRow(es,"rikai")}</div>
      <div class="stat"><div class="num">${es.length?formatAvg(sm.iyokuAvg):"-"}</div><div class="lbl">意欲（平均）</div>${chipRow(es,"iyoku")}</div>
      <div class="stat"><div class="num">${sm.ckTotal}<small> / ${sm.ckMax}</small></div><div class="lbl">観点チェック累計</div></div>
    </div>
    <div class="filter-tabs">
      <button class="${filterMode===null?"active":""}" onclick="filterMode=null;render()">すべて (${es.length})</button>
      <button class="${filterMode==="flag"?"active":""}" onclick="filterMode='flag';render()">⚠ つまづき (${sm.flags})</button>
      <button class="${filterMode==="good"?"active":""}" onclick="filterMode='good';render()">⭐ 得意 (${sm.goods})</button>
      <button class="${filterMode==="dup"?"active":""}" onclick="filterMode='dup';render()">📋 使い回し (${sm.dups})</button>
    </div>
  </div>
  <div class="card">
    <h2>振り返りの履歴（新しい順）${filterMode?`<span class="tag ${filterTagCls}">${filterLabel}</span>`:""}</h2>
    ${filtered.slice().reverse().map(e=>entryCard(e,true)).join("")||'<div class="muted">該当する記録はありません</div>'}
  </div>`;
}

render();
</script>
</body>
</html>
