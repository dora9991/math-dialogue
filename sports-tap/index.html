<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スポーツ タップ記録</title>
<meta name="description" content="サッカー・バレー・フットサル・ハンドボール・テニス・野球・ラグビー・水泳の試合を見ながら、タップで記録。種目ごとのルールに合ったボタンと集計（記録はどこにも送りません）">
<meta name="theme-color" content="#0a0e15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スポーツ記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
/* スポーツ タップ記録（見た目は「バスケ タップ記録」と同じ。撮影まわりを外し、種目の一覧・種目ごとの表示を足した） */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel2: #f2f4f8;
  --line: #d6dce6;
  --line2: #b9c3d2;
  --text: #0f172a;
  --muted: #566276;
  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37, 99, 235, 0.12);
  --good: #15803d;
  --warn: #b45309;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --bad: #dc2626;
  /* プレーのボタンの色（2P 緑・3P 紫・FT 茶・リバ 青。となりどうしで見分けやすく） */
  --k-fg2: #15803d;
  --k-fg3: #7c3aed;
  --k-ft: #b45309;
  --k-rb: #1d4ed8;
  --k-made: #15803d;
  --k-reb: #1d4ed8;
  --k-good: #0f766e;
  --k-bad: #c2410c;
  --k-foul: #a16207;
  --k-mark: #facc15;
  --k-mark-ink: #3b2a00;
  --k-miss-bg: #ffffff;
  --k-miss-line: #8b97aa;
  --k-miss-ink: #0f172a;
  --k-miss-x: #b91c1c;
  --ask: #f59e0b;
  --radius: 14px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
    --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
    --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
    --k-fg2: #16a34a; --k-fg3: #8b5cf6; --k-ft: #c26a0e; --k-rb: #2563eb;
    --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --panel: #131a26; --panel2: #1b2433; --line: #283447; --line2: #3a4860; --text: #eef2f8; --muted: #95a3ba;
  --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.18); --good: #22c55e; --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, 0.16); --bad: #f87171;
  --k-made: #16a34a; --k-reb: #2563eb; --k-good: #0d9488; --k-bad: #ea580c; --k-foul: #ca8a04; --k-mark: #facc15;
  --k-fg2: #16a34a; --k-fg3: #8b5cf6; --k-ft: #c26a0e; --k-rb: #2563eb;
  --k-miss-bg: #1b2433; --k-miss-line: #64748b; --k-miss-ink: #eef2f8; --k-miss-x: #f87171;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
a { color: var(--accent); }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 14px; font-size: 14px; line-height: 1.3; text-decoration: none; color: var(--text); transition: background 0.12s, border-color 0.12s, transform 0.06s; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.btn.small { min-height: 34px; padding: 4px 11px; font-size: 13px; border-radius: 9px; }
.btn.huge { width: 100%; min-height: 58px; font-size: 18px; font-weight: 800; border-radius: 14px; }
.btn.icon { width: 40px; padding: 0; font-weight: 800; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
.btn[disabled] { opacity: 0.45; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; font-size: 13px; }
.chip { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(128, 128, 128, 0.7); vertical-align: -2px; flex: none; }
.chip.neutral { background: var(--line2); }
.note { color: var(--muted); font-size: 13px; }
.note.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.center { justify-content: center; }
.spacer { flex: 1; }

/* ---------- 試合の一覧・準備（ふつうのページ） ---------- */
.hbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo { font-size: 28px; }
.brand b { display: block; font-size: 17px; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.htitle { font-size: 16px; }
.home, .setup { max-width: 920px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.going { border: 2px solid var(--bad); }
.going-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.games { display: flex; flex-direction: column; gap: 8px; }
.grow { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.gopen { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: none; border: 0; padding: 4px; }
.gline { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gline .when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gline .vs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.gline .vs b { font-size: 17px; font-variant-numeric: tabular-nums; }
.gline .gtitle { font-size: 12.5px; color: var(--muted); }
.tools .row { margin-top: 8px; }
.steps3 ol { margin: 4px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps3 li b { display: block; font-size: 15px; }
.steps3 li span { color: var(--muted); font-size: 13px; }
.lead { color: var(--muted); margin: 0; font-size: 14px; }

.teams2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 820px) { .teams2 { grid-template-columns: 1fr 1fr; } }
.teamcard { display: flex; flex-direction: column; gap: 10px; border-top: 8px solid var(--tc); box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.08); }
.tc-head { display: flex; align-items: center; gap: 10px; }
.tc-head b { font-size: 17px; }
.tc-band { background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.savedrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chipbtn small { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input[type="text"], .nostext { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; font-size: 16px; width: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(128, 128, 128, 0.55); padding: 0; position: relative; }
.sw.on { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.swc { width: 42px; height: 36px; padding: 0 2px; border: 1px dashed var(--line2); border-radius: 9px; background: var(--panel2); }
.presets .btn { font-weight: 700; }
.nogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.nb { min-height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nb.on { background: var(--tc); color: var(--tink); border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.names summary { cursor: pointer; color: var(--accent); font-size: 14px; padding: 4px 0; }
.namelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 6px; }
.namelist .nm { display: flex; align-items: center; gap: 6px; }
.namelist .nm b { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.namelist .nm input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; font-size: 15px; }
.gobar { position: sticky; bottom: 0; padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* ---------- 記録の画面 ---------- */
body[data-view="live"] { overflow: hidden; }
/* 上の帯（bar）・記録のボタン（stage）・下の帯（gbar） */
.live { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "bar" "stage" "gbar";
  background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.live button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* 上の帯：時計・ピリオド・得点・メニュー */
.lbar { grid-area: bar; display: flex; align-items: center; gap: 6px; padding: 6px 8px; flex: none; min-width: 0; }
.clock { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 0 10px; height: clamp(46px, 7.4vmin, 64px); min-width: clamp(104px, 21vmin, 170px); flex: none; }
.tval { font-size: clamp(30px, 6.2vmin, 50px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; line-height: 1; }
.tval.long { font-size: clamp(22px, 4.6vmin, 40px); }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); flex: none; animation: rec 1.6s ease-in-out infinite; }
.clock.ended .recdot { animation: none; background: var(--line2); }
.clock.ended .tval { color: var(--muted); }
@keyframes rec { 50% { opacity: 0.25; } }
.startbtn { height: clamp(46px, 7.4vmin, 64px); border: 0; border-radius: 12px; background: var(--good); color: #fff; font-size: clamp(17px, 3.4vmin, 26px); font-weight: 900; padding: 0 14px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); flex: none; white-space: nowrap; }
.period { height: clamp(46px, 7.4vmin, 64px); min-width: 48px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); font-size: clamp(18px, 3.8vmin, 26px); font-weight: 800; padding: 0 8px; flex: none; }
.score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.sc { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: clamp(46px, 7.4vmin, 64px); padding: 0 7px; border-radius: 12px; background: var(--tc); color: var(--tink); border: 2px solid rgba(128, 128, 128, 0.55); font-size: clamp(28px, 6vmin, 46px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.sc { flex: none; }
.score.big3 .sc { font-size: clamp(20px, 4.4vmin, 36px); padding: 0 4px; }
/* 幅の狭いスマホ：上の帯を詰める */
@media (max-width: 400px) {
  .lbar { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .period { min-width: 42px; padding: 0 5px; }
  .menubtn { min-width: 44px; }
  .lbar:has(.tval.long) .menubtn small, .lbar:has(.big3) .menubtn small { display: none; }
  .score { gap: 3px; }
  .tval.long ~ .recdot, .clock:has(.tval.long) .recdot { width: 8px; height: 8px; }
  .clock:has(.tval.long) { padding: 0 7px; gap: 5px; }
}
.dash { font-size: 22px; color: var(--muted); font-weight: 800; }
.menubtn { height: clamp(46px, 7.4vmin, 64px); min-width: 50px; border: 2px solid var(--line2); border-radius: 12px; background: var(--panel); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0 6px; flex: none; }
.menubtn span { font-size: 24px; font-weight: 800; }
.menubtn small { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* 2つのチーム：左右に並べる（lay-side）か、上下に重ねる（lay-stack）。どちらにするかは js の BT.planLayout が決める
   （すきま・ふちの数字は、core.js の BT.LAYOUT と合わせる） */
.stagewrap { grid-area: stage; position: relative; flex: 1; min-height: 0; min-width: 0; display: flex; }
.panels { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: row; gap: 6px; padding: 0 4px; }
.lay-stack .panels { flex-direction: column; }
.team { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--tc); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.35); }
.lay-stack .team { flex: var(--r, 1) 1 var(--base, 40px); }
/* チームの帯：名前・得点・「＋番号」 */
.thead { display: flex; align-items: center; gap: 6px; background: var(--tc); color: var(--tink); padding: 0 3px 0 8px; height: 22px; flex: none; border-bottom: 1px solid rgba(128, 128, 128, 0.45); }
.thead .tname { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
.tsc { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.tadd { flex: none; height: 18px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 0 6px; line-height: 1; opacity: 0.8; }
/* 選手の行：列の中は上から背番号の小さい順（grid-auto-flow: column）。行の高さは 28〜76px（入りきらなければ縦にすべらせる） */
.roster { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-template-columns: repeat(var(--c, 1), minmax(0, 1fr)); grid-template-rows: repeat(var(--r, 1), minmax(28px, 76px));
  gap: 3px 8px; padding: 4px; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; align-content: start; }
.team.scroll .roster { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), rgba(0, 0, 0, 0.35)); mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), rgba(0, 0, 0, 0.35)); }
.prow { display: grid; grid-template-columns: var(--nw, 36px) var(--cols, repeat(4, minmax(0, 1fr))); gap: 3px; min-height: 0; min-width: 0; }
.pno { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; overflow: hidden; border-radius: 8px; background: var(--tc); color: var(--tink); border: 1px solid rgba(128, 128, 128, 0.55); }
.pno b { font-size: var(--nf, 20px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.pno small { display: none; font-size: 10px; line-height: 1.15; max-width: 100%; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
.team.roomy .pno small { display: block; }
.prow.unk .pno { background: var(--panel2); color: var(--muted); border: 1px dashed var(--line2); }
.prow.teamonly .pno b { font-size: 12px; letter-spacing: 0; }
.pb { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 0 2px; border: 0; border-radius: 8px; color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); transition: transform 0.06s, filter 0.06s; }
.pb b { font-weight: 900; line-height: 1; white-space: nowrap; overflow: hidden; letter-spacing: -0.01em; }
.pb:active { transform: scale(0.94); filter: brightness(1.18); box-shadow: none; }
/* ボタンの色：種目の記録ごとに --bc（得点は緑系・ミスは白地にふち・カードは黄と赤。sp/*.js の col） */
.prow .pb { background: var(--bc, #475569); color: var(--bink, #fff); }
.pb b { font-size: var(--fz, var(--bf, 16px)); }
.pb .bs { display: none; }
.pb.useshort .bl { display: none; }
.pb.useshort .bs { display: inline; }
/* 失敗の「×」など：白地に、その記録の色のふち（成功のとなり） */
.prow .pb.miss { background: var(--k-miss-bg); color: var(--bc); box-shadow: inset 0 0 0 2px var(--bc), 0 2px 0 rgba(0, 0, 0, 0.12); }
.prow .pb.miss.x1 b { font-size: calc(var(--fz, var(--bf, 16px)) * 1.15); }
.pb.miss .cnt { background: var(--bc); }
/* 回数（ボタンの右上） */
.cnt { position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: rgba(0, 0, 0, 0.42); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 800; line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.prow.unk:not(.teamonly) .pb { opacity: 0.88; }
/* 幅の狭いボタン：回数は文字の下に（右上だと文字に重なるため） */
.team.narrowb .pb { flex-direction: column; gap: 1px; }
.team.narrowb .pb .cnt { position: static; height: 12px; min-width: 14px; padding: 0 3px; border-radius: 6px; font-size: 9.5px; line-height: 12px; }

.k-made { background: var(--k-made); }
.k-reb { background: var(--k-reb); }
.k-good { background: var(--k-good); }
.k-bad { background: var(--k-bad); }
.k-foul { background: var(--k-foul); }
.k-mark { background: var(--k-mark); color: var(--k-mark-ink); }
/* 押せたしるし（光る輪） */
.hit { animation: hit 0.32s ease-out; }
@keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.95), 0 0 0 0 var(--accent); filter: brightness(1.35); } 100% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0), 0 0 0 14px rgba(37, 99, 235, 0); filter: none; } }
.sc.hit, .tsc.hit { animation: bump 0.4s ease-out; }
@keyframes bump { 30% { transform: scale(1.25); } }

/* スタートの前・試合のあと：パネルの上に大きなボタン */
.cover { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 14, 21, 0.38); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); }
.cover-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cover-card p { margin: 0; }

.fam-swim .swbanner span { flex: 1; min-width: 0; }
.fam-swim .swwait { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; overflow-y: auto; }
.fam-swim .swwaitnames { font-size: 13px; color: var(--muted); }
.fam-swim .swwaitcard .startbig { font-size: 28px; }
/* 下の帯：次の組へ */
.fam-swim .gb.swnext { background: var(--accent); min-width: 84px; }
.fam-swim .gb.swnext.ready { animation: swready 1.4s ease-in-out infinite; }
@keyframes swready { 50% { box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.35); } }
@media (prefers-reduced-motion: reduce) { .fam-swim .gb.swnext.ready { animation: none; } }

/* 準備：レーンと名前 */
.swsetup h2 { margin-bottom: 4px; }
.swnames { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.swnrow { display: grid; grid-template-columns: 54px minmax(0, 1.3fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.swnl { font-variant-numeric: tabular-nums; text-align: center; background: #0e7490; color: #fff; border-radius: 8px; padding: 6px 0; font-size: 14px; }
.swnrow input { min-width: 0; width: 100%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 9px; padding: 8px 10px; font-size: 16px; }
/* 小窓：次の組・レーンのメニュー */
.swsheet h4 { margin: 12px 0 4px; font-size: 14px; }
.swsheet h4:first-child { margin-top: 0; }
.swsheet .field { margin-bottom: 10px; }
.swspec .field { margin-bottom: 8px; }
.swhrow { grid-template-columns: minmax(60px, auto) 1fr !important; }
/* 結果 */
.swstats h3 { margin-top: 14px; }
.swstats .swall { border-top: 2px solid var(--line2); padding-top: 10px; }
.swtable td.swsp small { display: block; color: var(--muted); font-size: 11px; }
.swtable tr.win td { background: rgba(250, 204, 21, 0.16); }
.swtable td.best { font-weight: 900; color: var(--good); }
.swtable .nm small { color: var(--muted); font-size: 11.5px; }
.swend { font-size: 18px !important; }
/* （準備の画面の名前の欄 .nm の display: flex が、表の名前の欄 td.nm にも効いてしまうので、表のマスに戻す） */
.swtable th.nm, .swtable td.nm { display: table-cell; }

</style>

<body>
<div id="view"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* js/core.js */
/* スポーツ タップ記録 — 画面を持たない共通の部分（時刻・記録・名簿・集計の道具・CSV・書き出しと読み込み・種目の登録）
   「バスケ タップ記録」（basket-tap）の核を、どの種目でも使えるように切り出したもの。DOM に依存しないので node のテストからも読める。

   ■ 記録のデータ（1試合＝1つ。書き出す JSON もこの形）
   {
     format: 'sports-tap', version: 1, sport: 'soccer' など（種目の id）,
     id, title（なくてよい）, date: 'YYYY-MM-DD', createdAt,
     startedAt: スタートを押した時刻（エポックミリ秒。押す前は null）, endedAt: 終えた時刻 | null,
     tz: 記録した端末の時差（分。日本は 540）, prec: 時刻の細かさ（10 ＝ 0.1 秒・100 ＝ 0.01 秒（水泳））,
     opts: 種目ごとの試合の形式（前半の長さ・セット数・距離 など。種目の defaultOpts）,
     teams: [ 自分, 相手 ]  … { name, color, colorName, players: [{ no: '7', name: '' }] }（水泳はレーン。種目が決める）
     events: [ { id, t, type, team, no, …種目ごとの項目 } ]  … 追加した順
   }
     t   : スタートからの秒（prec の細かさ）。ストップウォッチと同じで、止まらずに進む（あとで動画と合わせられる）
     type: 種目の TYPES の id
     team: 0 = 自分・1 = 相手・null = チームなし（「★ あとで見る」など）
     no  : 背番号（文字列。'0' と '00' は別）| null（だれか分からない・チームの記録）
   ピリオド・セット・イニングなどは、記録から計算して決める（記録を直す・取り消すと、自動で正しくなる）。 */
(function (root) {
  'use strict';
  const ST = root.ST = root.ST || {};
  ST.APP = 'スポーツ タップ記録';
  ST.FORMAT = 'sports-tap';
  ST.VERSION = 1;

  ST.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const clone = ST.clone = (o) => JSON.parse(JSON.stringify(o));

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。digits：小数の桁（1 ＝ 0.1 秒・2 ＝ 0.01 秒） */
  ST.fmtTime = function (sec, digits) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const d = digits === true ? 1 : digits || 0;
    const f = Math.pow(10, d);
    if (d) sec = Math.round(sec * f) / f;
    const whole = Math.floor(sec + 1e-9);
    const h = Math.floor(whole / 3600), m = Math.floor((whole % 3600) / 60), s = whole % 60;
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (d) out += '.' + String(Math.round((sec - whole) * f)).padStart(d, '0').slice(0, d);
    return out;
  };
  /* 水泳などの記録：1:02.35（1分未満は 35.12） */
  ST.fmtRace = function (sec) {
    if (!isFinite(sec) || sec < 0) return '—';
    const c = Math.round(sec * 100);
    const m = Math.floor(c / 6000), s = Math.floor((c % 6000) / 100), cs = c % 100;
    return (m ? m + ':' + String(s).padStart(2, '0') : String(s)) + '.' + String(cs).padStart(2, '0');
  };

  /* ---------- 種目の登録 ----------
     sp/*.js が ST.addSport({ id, name, icon, family, … }) で登録し、v/*.js が ST.addView(family, { build, stats, … }) で画面を足す */
  ST.SPORTS = {};
  ST.SPORT_ORDER = [];
  const PREFERRED = ['soccer', 'volley', 'futsal', 'handball', 'tennis', 'baseball', 'rugby', 'swim'];     // 種目を選ぶ画面の並び
  const order = (id) => { const i = PREFERRED.indexOf(id); return i < 0 ? 99 : i; };
  ST.addSport = function (def) {
    if (!def || !def.id) throw new Error('種目の id がありません');
    if (!ST.SPORTS[def.id]) ST.SPORT_ORDER.push(def.id);
    ST.SPORT_ORDER.sort((a, b) => order(a) - order(b));
    def.TYPE = def.TYPE || {};
    (def.TYPES || []).forEach((d) => { def.TYPE[d.id] = d; });
    ST.SPORTS[def.id] = def;
    return def;
  };
  ST.VIEWS = {};
  ST.addView = function (family, view) { ST.VIEWS[family] = Object.assign(ST.VIEWS[family] || {}, view); return ST.VIEWS[family]; };
  ST.sportOf = (game) => ST.SPORTS[game && game.sport] || null;
  ST.typeOf = (game, type) => { const sp = ST.sportOf(game); return (sp && sp.TYPE[type]) || null; };
  /* 種目の試合の形式：そろえる（知らない値は、はじめの値に） */
  ST.cleanOpts = function (sp, o) {
    const base = sp.defaultOpts ? sp.defaultOpts() : {};
    const out = Object.assign({}, base);
    if (o && typeof o === 'object') {
      Object.keys(base).forEach((k) => {
        const v = o[k];
        if (v == null) return;
        const f = (sp.optFields || []).find((x) => x.key === k);
        if (f && f.choices && !f.choices.some(([cv]) => String(cv) === String(v))) return;
        out[k] = typeof base[k] === 'number' ? Number(v) : typeof base[k] === 'boolean' ? !!v : v;
      });
    }
    return out;
  };

  /* ユニフォームの色（よくある色） */
  ST.COLORS = [
    { name: '白', hex: '#f4f4f4' }, { name: '黒', hex: '#222222' }, { name: '赤', hex: '#d93636' }, { name: '青', hex: '#2f6fed' },
    { name: '紺', hex: '#1f2f6e' }, { name: '水色', hex: '#45b0e6' }, { name: '緑', hex: '#2e9e5b' }, { name: '黄', hex: '#f2c230' },
    { name: 'オレンジ', hex: '#f08a24' }, { name: '紫', hex: '#7d4cc9' }, { name: 'ピンク', hex: '#e86aa6' }, { name: 'グレー', hex: '#8a8f98' }
  ];
  function hexRGB(hex) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128]; }
  ST.hexRGB = hexRGB;
  /* その色の上に載せる文字の色（黒か白の、読みやすいほう） */
  ST.inkOn = function (hex) {
    const [r, g, b] = hexRGB(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return L > 0.36 ? '#111111' : '#ffffff';
  };
  ST.nearestColorName = function (hex) {
    const [r, g, b] = hexRGB(hex);
    let best = null;
    ST.COLORS.forEach((c) => { const [r2, g2, b2] = hexRGB(c.hex); const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2; if (!best || d < best.d) best = { d, name: c.name }; });
    return best.name;
  };

  /* ---------- 背番号 ---------- */
  function toHalf(s) {
    return String(s || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[〜～~－ー−‐―]/g, '-').replace(/[、，,・／/\s]+/g, ' ');
  }
  ST.toHalf = toHalf;
  /* 背番号として使えるか（0〜99 と 00。'07' は 7 にそろえる） */
  ST.normNo = function (v) {
    const s = toHalf(v).trim();
    if (s === '00') return '00';
    if (!/^\d{1,2}$/.test(s)) return null;
    return String(Number(s));
  };
  ST.cmpNo = (a, b) => (Number(a) - Number(b)) || (String(a).length - String(b).length);
  ST.sortNos = (list) => list.slice().sort(ST.cmpNo);
  /* 「4-15, 23 33」「４〜１５」などを、背番号の並びにする（重なりは1つに。範囲は 0〜99） */
  ST.parseNumbers = function (text) {
    const out = new Set();
    toHalf(text).split(' ').forEach((tok) => {
      if (!tok) return;
      const m = /^(\d{1,2})-(\d{1,2})$/.exec(tok);
      if (m) {
        let a = Number(m[1]), b = Number(m[2]);
        if (a > b) [a, b] = [b, a];
        for (let i = a; i <= b && i <= 99; i++) out.add(String(i));
        return;
      }
      const n = ST.normNo(tok);
      if (n != null) out.add(n);
    });
    return ST.sortNos(Array.from(out));
  };
  /* 背番号の並びを、短い文字にする（4,5,6,7,9 → 「4-7, 9」） */
  ST.formatNumbers = function (nos) {
    const list = ST.sortNos(nos || []);
    const out = [];
    let i = 0;
    while (i < list.length) {
      if (list[i] === '00') { out.push('00'); i++; continue; }
      let j = i;
      while (j + 1 < list.length && list[j + 1] !== '00' && Number(list[j + 1]) === Number(list[j]) + 1) j++;
      out.push(j - i >= 2 ? `${list[i]}-${list[j]}` : list.slice(i, j + 1).join(', '));
      i = j + 1;
    }
    return out.join(', ');
  };
  /* 名簿をそろえる（番号の重なりは1つに・番号の順。keepOrder：並びを変えない（野球の打順など）） */
  function cleanPlayers(list, keepOrder) {
    const seen = new Set(), out = [];
    (list || []).forEach((p) => {
      const no = ST.normNo(p && p.no != null ? p.no : p);
      if (no == null || seen.has(no)) return;
      seen.add(no);
      const o = { no, name: String((p && p.name) || '').trim().slice(0, 12) };
      if (p && p.pos) o.pos = String(p.pos).slice(0, 6);
      out.push(o);
    });
    return keepOrder ? out : out.sort((a, b) => ST.cmpNo(a.no, b.no));
  }
  ST.cleanPlayers = cleanPlayers;
  ST.playersFromNos = function (nos, old) {
    const names = {};
    (old || []).forEach((p) => { names[p.no] = p.name; });
    return cleanPlayers(nos.map((no) => ({ no, name: names[no] || '' })));
  };

  /* ---------- 時刻 ---------- */
  ST.uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function pad2(n) { return String(n).padStart(2, '0'); }
  ST.ymdAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
  ST.hmsAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`; };
  ST.tzText = function (tz) { const s = tz < 0 ? '-' : '+', a = Math.abs(tz || 0); return s + pad2(Math.floor(a / 60)) + ':' + pad2(a % 60); };
  ST.localTz = () => -new Date().getTimezoneOffset();

  /* ---------- 試合 ---------- */
  function blankTeam(i) { return { name: '', color: i ? '#2f6fed' : '#f4f4f4', colorName: i ? '青' : '白', players: [] }; }
  ST.blankTeam = blankTeam;
  ST.newGame = function (opts) {
    opts = opts || {};
    const sp = ST.SPORTS[opts.sport];
    if (!sp) throw new Error('種目が分かりません：' + opts.sport);
    const now = opts.now || Date.now();
    const tz = opts.tz != null ? opts.tz : ST.localTz();
    const keep = !!sp.orderedRoster;
    const teams = [0, 1].map((i) => Object.assign(blankTeam(i), clone((opts.teams || [])[i] || {})));
    teams.forEach((t) => { t.players = cleanPlayers(t.players, keep); });
    const g = { format: ST.FORMAT, version: ST.VERSION, sport: sp.id, id: opts.id || ST.uid('g'), title: opts.title || '', date: ST.ymdAt(now, tz), createdAt: now, startedAt: null, endedAt: null, tz, prec: sp.prec || 10, opts: ST.cleanOpts(sp, opts.opts), teams, events: [], seq: 0 };
    if (sp.initGame) sp.initGame(g, opts);
    return g;
  };
  /* スタートからの秒（prec の細かさ） */
  ST.round = (game, t) => { const p = (game && game.prec) || 10; return Math.round((t || 0) * p) / p; };
  ST.elapsed = function (game, now) {
    if (!game || !game.startedAt) return 0;
    const end = game.endedAt || now || Date.now();
    const p = game.prec || 10;
    return Math.max(0, Math.round((end - game.startedAt) * p / 1000) / p);
  };
  /* 時刻の順（同じ時刻なら追加した順） */
  ST.sorted = function (game) {
    return (game.events || []).map((e, i) => ({ e, i })).sort((a, b) => (a.e.t - b.e.t) || (a.i - b.i)).map((x) => x.e);
  };
  /* 記録を足す。ev：{ t, type, team, no, …種目の項目 }。戻り値：足した記録
     team が 0・1 でなければ「チームなし」（null）。ただし得点のある記録は、チームなしにできないので 0（自分） */
  ST.addEvent = function (game, ev) {
    game.seq = (game.seq || 0) + 1;
    const e = Object.assign({}, ev, { id: 'e' + game.seq, t: ST.round(game, ev.t || 0), type: ev.type });
    const d = ST.typeOf(game, ev.type);
    if (!d || !d.noTeam) {
      e.team = ev.team === 0 || ev.team === 1 ? ev.team : d && d.pts ? 0 : null;
      e.no = e.team != null && ev.no != null ? String(ev.no) : null;
    }
    game.events.push(e);
    return e;
  };
  ST.findEvent = (game, id) => (game.events || []).find((e) => e.id === id) || null;
  ST.removeEvent = function (game, id) {
    const i = (game.events || []).findIndex((e) => e.id === id);
    if (i < 0) return null;
    return game.events.splice(i, 1)[0];
  };
  /* 種目の記録の数え方：「チーム:背番号:種類」→ 回数（チームなしは「-」、番号なしは空）。「*:種類」は、その種類の全部・「T:チーム:種類」はチームごと */
  ST.tally = function (game, filter) {
    const m = {};
    (game.events || []).forEach((e) => {
      if (filter && !filter(e)) return;
      const k = (e.team == null ? '-' : e.team) + ':' + (e.no == null ? '' : e.no) + ':' + e.type;
      m[k] = (m[k] || 0) + 1;
      m['*:' + e.type] = (m['*:' + e.type] || 0) + 1;
      if (e.team != null) m['T:' + e.team + ':' + e.type] = (m['T:' + e.team + ':' + e.type] || 0) + 1;
    });
    return m;
  };

  /* ---------- 名前 ---------- */
  ST.teamName = (game, tm) => { if (tm !== 0 && tm !== 1) return ''; const t = game.teams[tm] || {}; return (t.name || '').trim() || (tm ? '相手' : '自分'); };
  ST.playerName = function (game, tm, no) {
    const p = ((game.teams[tm] || {}).players || []).find((x) => x.no === no);
    return p ? p.name : '';
  };
  ST.typeLabel = (game, e) => { const sp = ST.sportOf(game); if (sp && sp.typeLabel) return sp.typeLabel(game, e); const d = ST.typeOf(game, e.type); return d ? d.label : e.type; };
  /* 一覧・書き出しの呼び名：「#7 たけし ゴール」 */
  ST.eventText = function (game, e, withTeam) {
    const sp = ST.sportOf(game);
    if (sp && sp.eventText) { const s = sp.eventText(game, e, withTeam); if (s != null) return s; }
    const who = e.team != null && e.no != null ? `#${e.no}${ST.playerName(game, e.team, e.no) ? ' ' + ST.playerName(game, e.team, e.no) : ''}` : '';
    return [withTeam ? ST.teamName(game, e.team) : '', who, ST.typeLabel(game, e)].filter(Boolean).join(' ');
  };

  /* ---------- 得点・試合の一覧の情報 ---------- */
  ST.score = function (game) { const sp = ST.sportOf(game); return sp && sp.score ? sp.score(game) : [0, 0]; };
  ST.scoreText = function (game) {
    const sp = ST.sportOf(game);
    if (sp && sp.scoreText) return sp.scoreText(game);
    const s = ST.score(game);
    return `${s[0]} − ${s[1]}`;
  };
  ST.summary = function (game) {
    const sp = ST.sportOf(game);
    const names = sp && sp.sideNames ? sp.sideNames(game) : [ST.teamName(game, 0), ST.teamName(game, 1)];
    return { id: game.id, sport: game.sport, title: game.title || '', date: game.date, startedAt: game.startedAt, endedAt: game.endedAt, names, colors: [game.teams[0].color, game.teams[1].color], score: ST.score(game), scoreText: ST.scoreText(game), n: (game.events || []).filter((e) => !(ST.typeOf(game, e.type) || {}).meta).length, at: Date.now() };
  };

  /* ---------- 記録の画面の並べ方（チームの行。バスケ タップ記録の planLayout と同じ考え方） ----------
     選手1人＝1行（背番号＋プレーのボタン）。画面の大きさと人数から、
       arr：2チームを左右に並べる（side）か、上下に重ねる（stack）か ／ c：チームの中を何列にするか
     を決める。ボタンの「幅」と「高さ」の小さいほうが、いちばん大きくなるもの。
     spec：行のボタンの数と幅の割合（rowSpec）。数字は css/app.css の記録の画面と合わせている */
  ST.LAYOUT = { pad: 4, gap: 6, border: 2, rpad: 4, rgap: 3, cgap: 8, bgap: 3, rmin: 30, rmax: 76, minBw: 30 };
  ST.rowSpec = function (weights) {
    const w = weights && weights.length ? weights : [1, 1, 1, 1];
    return { weights: w, k: w.length, units: w.reduce((a, b) => a + b, 0), minW: Math.min.apply(null, w) };
  };
  function rowWidths(cellW, spec) {
    const K = ST.LAYOUT, sp = spec || ST.rowSpec();
    // 背番号の欄：行の幅の 18%（ボタンが多いときは、ボタン1つ分くらいまで細くして、ボタンに幅を回す）
    const nw = Math.round(ST.clamp(Math.min(cellW * 0.18, cellW / (sp.units + 1.1) * 1.1), 34, 64));
    const bw = (cellW - nw - sp.k * K.bgap) / sp.units;
    return { nw, bw, bwMin: bw * sp.minW };
  }
  ST.planLayout = function (W, H, n, headH, spec) {
    const K = ST.LAYOUT;
    const fixed = 2 * K.border + headH + 2 * K.rpad;
    const cand = [];
    ['side', 'stack'].forEach((arr) => {
      for (let c0 = 1; c0 <= 3; c0++) {
        for (let c1 = 1; c1 <= 3; c1++) {
          const c = [c0, c1];
          if (c0 > n[0] || c1 > n[1]) continue;
          const r = [Math.ceil(n[0] / c0), Math.ceil(n[1] / c1)];
          let teamW, rowH;
          if (arr === 'side') {
            teamW = (W - 2 * K.pad - K.gap) / 2;
            rowH = r.map((ri) => (H - fixed - (ri - 1) * K.rgap) / ri);
          } else {
            teamW = W - 2 * K.pad;
            const one = (H - K.gap - 2 * fixed - (r[0] - 1 + r[1] - 1) * K.rgap) / (r[0] + r[1]);
            rowH = [one, one];
          }
          const teams = [0, 1].map((i) => {
            const cellW = (teamW - 2 * K.border - 2 * K.rpad - (c[i] - 1) * K.cgap) / c[i];
            const rw = rowWidths(cellW, spec);
            return { c: c[i], r: r[i], cellW, nw: rw.nw, bw: rw.bw, bwMin: rw.bwMin, rowH: Math.min(rowH[i], K.rmax), base: fixed + (r[i] - 1) * K.rgap };
          });
          const ease = (x) => Math.min(x.bwMin, x.rowH) + 0.15 * Math.min(Math.abs(x.bwMin - x.rowH), 30);
          const size = Math.min(...teams.map(ease));
          const wide = Math.min(...teams.map((x) => x.bwMin));
          const colCost = (size >= 34 ? 5 : 1) * (c0 - 1 + c1 - 1);
          const score = Math.min(size, 44) + 0.1 * Math.max(0, Math.min(size, 64) - 44) - colCost - (arr === 'stack' ? 1.5 : 0);
          cand.push({ arr, teams, size, wide, score, scroll: teams.some((x) => x.rowH < K.rmin) });
        }
      }
    });
    const okW = cand.filter((x) => x.wide >= K.minBw);
    const pool = okW.length ? okW : [cand.slice().sort((a, b) => b.wide - a.wide)[0]];
    return pool.sort((a, b) => b.score - a.score)[0];
  };

  /* ---------- 書き出し ---------- */
  ST.exportData = function (game) {
    const g = clone(game);
    g.format = ST.FORMAT; g.version = ST.VERSION;
    g.events = ST.sorted(game).map((e) => Object.assign({}, e));
    g.startedAtText = game.startedAt ? `${ST.ymdAt(game.startedAt, game.tz)} ${ST.hmsAt(game.startedAt, game.tz)} (UTC${ST.tzText(game.tz)})` : null;
    g.score = ST.score(game);
    g.scoreText = ST.scoreText(game);
    const sp = ST.sportOf(game);
    g.sportName = sp ? sp.name : '';
    g.types = {};
    if (sp) (sp.TYPES || []).forEach((d) => { g.types[d.id] = { label: d.label, pts: d.pts || 0 }; });
    if (sp && sp.exportExtra) sp.exportExtra(game, g);
    g.app = ST.APP;
    delete g.seq;
    return g;
  };
  ST.safeName = (s) => String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
  ST.fileBase = function (game) {
    const sp = ST.sportOf(game);
    const hm = game.startedAt ? ST.hmsAt(game.startedAt, game.tz).slice(0, 5).replace(':', '') : '';
    const names = sp && sp.sideNames ? sp.sideNames(game) : [ST.teamName(game, 0), ST.teamName(game, 1)];
    const who = sp && sp.fileWho ? sp.fileWho(game) : ST.safeName(names[0]) + 'vs' + ST.safeName(names[1]);
    return [(sp ? sp.name : 'スポーツ') + '記録', game.date, hm, who].filter(Boolean).join('_');
  };
  function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  ST.csv = (rows) => rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';

  /* ---------- 読み込み（書き出した JSON を開き直す） ---------- */

    if (typeof obj === 'string') { try { obj = JSON.parse(obj); } catch (e) { throw new Error('JSON として読めませんでした'); } }
    if (!obj || typeof obj !== 'object') throw new Error('記録のファイルではないようです');
    if (obj.format !== ST.FORMAT) throw new Error(obj.format === 'basket-tap' ? 'バスケの記録です。「バスケ タップ記録」で開いてください' : '「スポーツ タップ記録」で書き出したファイルではないようです');
    const sp = ST.SPORTS[obj.sport];
    if (!sp) throw new Error('この種目は開けません：' + obj.sport);
    if (!Array.isArray(obj.events) || !Array.isArray(obj.teams)) throw new Error('記録の中身（events・teams）がありません');
    const g = ST.newGame({ sport: sp.id, id: typeof obj.id === 'string' ? obj.id.slice(0, 40) : undefined, title: String(obj.title || '').slice(0, 40), now: obj.createdAt || obj.startedAt || Date.now(), tz: isFinite(obj.tz) ? obj.tz : 540, opts: obj.opts, teams: obj.teams.slice(0, 2).map((t, i) => cleanTeam(t, i, !!sp.orderedRoster)) });
    g.date = /^\d{4}-\d{2}-\d{2}$/.test(obj.date || '') ? obj.date : g.date;
    g.startedAt = isFinite(obj.startedAt) && obj.startedAt > 0 ? obj.startedAt : null;
    g.endedAt = isFinite(obj.endedAt) && obj.endedAt > 0 ? obj.endedAt : null;
    if (sp.importExtra) sp.importExtra(obj, g);
    const okId = (id) => typeof id === 'string' && /^e\d{1,7}$/.test(id);
    const used = new Set();
    let maxN = 0;
    obj.events.forEach((e) => {
      if (!e || !isFinite(e.t) || e.t < 0 || !sp.TYPE[e.type]) return;
      const clean = sp.cleanEvent ? sp.cleanEvent(e) : {};
      if (clean === null) return;
      const ev = ST.addEvent(g, Object.assign({}, clean, { t: +e.t, type: e.type, team: e.team, no: e.no != null ? ST.normNo(e.no) : null }));
      if (okId(e.id) && !used.has(e.id)) ev.id = e.id;
      while (used.has(ev.id)) ev.id = 'e' + (g.seq + used.size + 1);
      used.add(ev.id);
      maxN = Math.max(maxN, Number(ev.id.slice(1)) || 0);
    });
    g.seq = Math.max(g.seq, maxN);
    return g;
  };

    const b = blankTeam(i);
    if (!t || typeof t !== 'object') return b;

    return { name: String(t.name || '').trim().slice(0, 20), color, colorName: String(t.colorName || ST.nearestColorName(color)).slice(0, 8), players: cleanPlayers(t.players, keepOrder) };
  }
  ST.cleanTeam = cleanTeam;
  /* 0〜1 の割合 → 「67%」（打った数が 0 なら「—」） */
  ST.pct = (m, a) => (a ? Math.round(100 * m / a) + '%' : '—');

<script>
/* js/store.js */
/* スポーツ タップ記録 — 保存（このブラウザの中だけ。どこにも送らない）
   ・試合：1つ記録するたびに、すぐ保存する（途中で画面を閉じても、開き直せば続きから）
   ・チーム：種目ごとに、名前・色・名簿を覚えておき、次の試合で選べる
   ・設定：音・画面の色・最後に使った種目・種目ごとの設定（ボタンの組み合わせ・前の試合の形式）
   キーは「stap:」で始まる（バスケ タップ記録の「btap:」とは別）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const K = { games: 'stap:games', game: 'stap:game:', current: 'stap:current', teams: 'stap:teams', prefs: 'stap:prefs' };
  const KEEP = 80;          // 覚えておく試合の数（古いものから消す。書き出したファイルは残る）

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return false; try { s.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function remove(k) { const s = ls(); if (s) { try { s.removeItem(k); } catch (e) { /* 無視 */ } } }

  /* ---------- 試合 ---------- */
  function games(sport) { return (readJSON(K.games) || []).filter((g) => g && g.id && (!sport || g.sport === sport)).sort((a, b) => (b.startedAt || b.at || 0) - (a.startedAt || a.at || 0)); }
  function loadGame(id) {
    const g = readJSON(K.game + id);
    if (!g || g.format !== ST.FORMAT || !Array.isArray(g.events) || !ST.SPORTS[g.sport]) return null;
    if (!g.seq) g.seq = g.events.reduce((m, e) => Math.max(m, Number(String(e.id).slice(1)) || 0), 0);
    g.opts = ST.cleanOpts(ST.SPORTS[g.sport], g.opts);
    return g;
  }
  function saveGame(game) {
    if (!game || !game.id) return false;
    const list = games().filter((x) => x.id !== game.id);
    list.unshift(ST.summary(game));
    let ok = writeJSON(K.game + game.id, game);
    if (!ok || list.length > KEEP) {
      const old = list.slice().sort((a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0)).filter((x) => x.id !== game.id);
      const n = ok ? list.length - KEEP : Math.max(5, list.length - KEEP);
      old.slice(0, n).forEach((x) => { remove(K.game + x.id); const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list.splice(i, 1); });
      if (!ok) ok = writeJSON(K.game + game.id, game);
    }
    writeJSON(K.games, list);
    return ok;
  }
  function deleteGame(id) {
    remove(K.game + id);
    writeJSON(K.games, games().filter((x) => x.id !== id));
    if (current() === id) setCurrent(null);
  }
  function current() { const s = ls(); try { return s ? s.getItem(K.current) : null; } catch (e) { return null; } }
  function setCurrent(id) { const s = ls(); if (!s) return; try { if (id) s.setItem(K.current, id); else s.removeItem(K.current); } catch (e) { /* 無視 */ } }

  /* ---------- チーム（名簿。種目ごと） ---------- */
  function teams(sport) { return (readJSON(K.teams) || []).filter((t) => t && t.id && (!sport || t.sport === sport)).sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)); }
  /* 同じ種目・同じ名前のチームは上書き。名前のないチームは保存しない */
  function saveTeam(sport, team, mine) {
    const name = (team.name || '').trim();
    if (!name) return null;
    const all = teams();
    let t = all.find((x) => x.sport === sport && x.name === name);
    if (!t) { t = { id: ST.uid('t'), sport }; all.push(t); }
    const keep = !!(ST.SPORTS[sport] && ST.SPORTS[sport].orderedRoster);
    Object.assign(t, { name, color: team.color, colorName: team.colorName, players: ST.cleanPlayers(team.players, keep), usedAt: Date.now() });
    if (mine) { all.forEach((x) => { if (x.sport === sport) delete x.mine; }); t.mine = true; }
    const keepList = all.sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)).slice(0, 120);
    writeJSON(K.teams, keepList);
    return t;
  }
  function deleteTeam(id) { writeJSON(K.teams, teams().filter((t) => t.id !== id)); }
  function myTeam(sport) { return teams(sport).find((t) => t.mine) || null; }

  /* ---------- 設定 ----------
     sound：タップ音 / theme：画面の色 / last：最後に使った種目
     sp[種目]：{ opts（前の試合の形式）, rows（行のボタンの組み合わせ）, names, unknown, … 種目の設定 } */
  function prefs() {
    const p = Object.assign({ sound: false, theme: 'auto', last: '', sp: {} }, readJSON(K.prefs) || {});
    if (!p.sp || typeof p.sp !== 'object') p.sp = {};
    return p;
  }
  function savePrefs(p) { return writeJSON(K.prefs, p); }
  /* 種目の設定（なければ、その種目のはじめの値で作る） */
  function sportPrefs(p, sport) {
    const sp = ST.SPORTS[sport];
    const base = Object.assign({ names: true, unknown: true, opts: null, rows: {} }, sp && sp.defaultPrefs ? sp.defaultPrefs() : {});
    // いまある物に、足りない値だけを足す（作り直さない：先に受け取った物を書きかえても、保存される）
    if (!p.sp[sport] || typeof p.sp[sport] !== 'object') p.sp[sport] = {};
    const cur = p.sp[sport];
    Object.keys(base).forEach((k) => { if (cur[k] === undefined) cur[k] = base[k]; });
    if (!cur.rows || typeof cur.rows !== 'object') cur.rows = {};
    return cur;
  }

  function persist() {
    try { if (root.navigator && navigator.storage && navigator.storage.persist) return navigator.storage.persist().catch(() => false); } catch (e) { /* 無視 */ }
    return Promise.resolve(false);
  }

  ST.store = { games, loadGame, saveGame, deleteGame, current, setCurrent, teams, saveTeam, deleteTeam, myTeam, prefs, savePrefs, sportPrefs, persist, KEYS: K };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/ui.js */
/* スポーツ タップ記録 — 画面の部品（バスケ タップ記録と同じもの）（要素づくり・お知らせ・下から出る小窓・振動と音・保存と共有） */
(function (root) {
  'use strict';
  const ST = root.ST;

  /* h('div', { class: 'x', onclick: fn }, 子要素…) */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) el.style.setProperty(p, v[p]); else el.style[p] = v[p]; } }
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (sel, rootEl) => (rootEl || document).querySelector(sel);
  const $$ = (sel, rootEl) => Array.from((rootEl || document).querySelectorAll(sel));

  /* お知らせ（画面の下に数秒）。action：{ label, onClick } でボタンを1つ付けられる */
  function toast(text, kind, ms, action) {
    const box = $('#toasts');
    if (!box) return null;
    const el = h('div', { class: 'toast ' + (kind || ''), role: 'status' }, h('span', null, text));
    if (action) el.appendChild(h('button', { class: 'tbtn', onclick: () => { el.remove(); action.onClick(); } }, action.label));
    box.appendChild(el);
    while (box.children.length > 2) box.firstChild.remove();
    setTimeout(() => el.remove(), ms || 2600);
    return el;
  }

  /* 下から出る小窓（タブレットでは真ん中）。同時に1つだけ。
     opts: { title, body（要素）, foot（要素の配列）, onClose, wide, cls } → { close, body, el } */
  let current = null;
  function sheet(opts) {
    closeSheet(true);
    const wrap = $('#sheet');
    const card = h('div', { class: 'sheet-card' + (opts.wide ? ' wide' : '') + (opts.cls ? ' ' + opts.cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '' });
    const close = () => { if (current && current.card === card) closeSheet(); };
    card.appendChild(h('header', null, h('b', null, opts.title || ''), h('button', { class: 'x', 'aria-label': '閉じる', onclick: close }, '×')));
    const body = h('div', { class: 'sheet-body' });
    if (opts.body) body.appendChild(opts.body);
    card.appendChild(body);
    if (opts.foot && opts.foot.length) card.appendChild(h('div', { class: 'sheet-foot' }, opts.foot));
    wrap.innerHTML = '';
    wrap.appendChild(card);
    wrap.hidden = false;
    wrap.onclick = (e) => { if (e.target === wrap) close(); };
    current = { card, onClose: opts.onClose };
    return { close, body, el: card };
  }
  function closeSheet(silent) {
    const wrap = $('#sheet');
    if (!current || !wrap) return;
    const c = current;
    current = null;
    wrap.hidden = true; wrap.innerHTML = '';
    if (!silent && c.onClose) c.onClose();
    else if (silent && c.onClose) c.onClose(true);

  /* 確かめる小窓：ok を押したら onOk */
  function confirm(title, text, okLabel, onOk, danger) {
    const s = sheet({
      title, body: h('p', { class: 'confirm-text' }, text),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn ' + (danger ? 'danger-fill' : 'primary'), onclick: () => { s.close(); onOk(); } }, okLabel)]
    });
    return s;
  }

  /* ---------- 手ごたえ（振動・音） ---------- */
  /* 振動：Android は vibrate。iPhone（iOS 18 から）は、スイッチ（<input type="checkbox" switch>）を押したときの軽い振動を使う */
  let coarse = null;
  function haptic() {
    try { if (root.navigator && typeof navigator.vibrate === 'function') { navigator.vibrate(12); return; } } catch (e) { /* 次へ */ }
    try {
      if (coarse == null) coarse = !!(root.matchMedia && matchMedia('(pointer: coarse)').matches);
      if (!coarse) return;
      const lab = document.createElement('label');
      lab.setAttribute('aria-hidden', 'true');
      lab.style.display = 'none';
      const inp = document.createElement('input');
      inp.type = 'checkbox'; inp.setAttribute('switch', '');
      lab.appendChild(inp);

  let lock = null, want = false;
  const wakeSupported = () => !!(root.navigator && navigator.wakeLock && navigator.wakeLock.request);

  /* ---------- 保存（ダウンロード）・共有 ---------- */
  function download(name, blob) {
    const url = URL.createObjectURL(blob);

    a.click();

  }

  async function shareOrDownload(name, blob, preferShare) {
    try {

        }

    }

    return 'downloaded';
  }
  const canShareFiles = () => { try { return !!(root.navigator && navigator.canShare && typeof File !== 'undefined' && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } };
  /* ファイルを1つ選んでもらって、文字として読む */
  function pickText(accept) {
    return new Promise((resolve) => {
      const inp = h('input', { type: 'file', accept: accept || '.json,application/json', style: { display: 'none' } });
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        inp.remove();
        if (!f) { resolve(null); return; }
        const r = new FileReader();
        r.onload = () => resolve({ name: f.name, text: String(r.result || '') });
        r.onerror = () => resolve(null);
        r.readAsText(f);
      });
      document.body.appendChild(inp);
      inp.click();
    });
  }

  ST.ui = { h, $, $$, toast, sheet, closeSheet, sheetOpen, confirm, haptic, beep, keepAwake, awake, wakeSupported, download, shareOrDownload, canShareFiles, pickText };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sp/team.js */
/* スポーツ タップ記録 — チームの行で記録する種目（サッカー・フットサル・ハンドボール・ラグビー）。画面を持たない部分
   記録の画面は、バスケ タップ記録と同じ「選手1人＝1行」。行のボタンを1回押せば、その選手のプレーとして時刻つきで残る。
   種目ごとに違うのは、ボタン（得点の種類・ミス・カード）と、試合の進み方（前半・後半・延長・PK戦）・一時退場・累積ファウル。

   ■ この種目たちの記録（core.js の形に足すもの）
     type 'period'：ピリオド（前半・後半…）の始まり { period }。'pend'：その終わり { period }（ハーフタイムの間は時計を止めて見せる）
     ピリオドの番号：1 前半・2 後半・3 延長前半・4 延長後半・9 PK戦（7mTC）
     その時刻のピリオドは「その時刻より前の、いちばん新しい 'period'」（periodAt）。始めた時刻を直せば、それより後の記録は全部そのピリオドになる。
   ■ 時計
     画面の時計は「いまのピリオドが始まってからの時間」（サッカーの「前半 23 分」と同じ）。前半の長さ（opts.len 分）を過ぎると「40+1:23」。
     記録の t は、どれも「スタートからの秒」（止まらない。動画と合わせられる）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const SO = 9;                // PK戦・7mTC のピリオドの番号

  /* ---------- ボタンの色（どの種目も同じ考え：得点は緑系・ミスは白地にふち・カードは黄と赤） ---------- */
  const C = { goal: '#15803d', shot: '#0f766e', ast: '#1d4ed8', foul: '#a16207', yc: '#eab308', rc: '#dc2626', save: '#7c3aed', tf: '#c2410c', set: '#475569', try: '#15803d', con: '#0e7490', pg: '#7c3aed', dg: '#b45309', tackle: '#1d4ed8', pen: '#a16207', so: '#15803d' };

  /* 共通の記録 */
  const COMMON = [
    { id: 'period', label: 'ピリオド開始', meta: true, noTeam: true, kind: 'meta' },
    { id: 'pend', label: 'ピリオド終了', meta: true, noTeam: true, kind: 'meta' },
    { id: 'mark', btn: '★ あとで見る', label: '★ あとで見る', kind: 'mark', global: true },
    { id: 'sog', btn: '成功', label: '成功', kind: 'made', col: C.so, so: true },
    { id: 'sox', btn: '×', label: '失敗', kind: 'miss', col: C.so, so: true, of: 'sog' }
  ];

  /* ピリオドの名前 */
  function periodName(sp, p) {
    if (p === SO) return sp.shootout || 'PK戦';
    return sp.periodNames[p - 1] || `第${p}ピリオド`;
  }
  /* ピリオドの長さ（秒）。1・2 は opts.len 分、3・4（延長）は opts.elen 分。PK戦は時計なし */
  function periodLen(sp, game, p) {
    if (p === SO) return 0;
    const o = game.opts || {};
    return (p <= 2 ? o.len : o.elen || 0) * 60;
  }

  /* ---------- ピリオド（記録から計算する） ---------- */
  /* ピリオドの並び：[{ p, start, end（終わっていなければ null） }]（始まった順） */
  function periods(game) {
    const list = [];
    ST.sorted(game).forEach((e) => {
      if (e.type === 'period') list.push({ p: e.period, start: e.t, end: null, id: e.id });
      else if (e.type === 'pend') { const cur = list[list.length - 1]; if (cur && cur.end == null && e.t >= cur.start) cur.end = e.t; }
    });
    return list;
  }
  /* 記録ごとのピリオド（Map：記録の id → ピリオド）。時刻の順に見ていくので、同じ時刻のときは「足した順」で決まる
     （前半の最後のファウルと、後半の始まりが同じ秒でも、ファウルは前半） */
  function periodMap(game) {
    const m = new Map();
    let p = 1;
    ST.sorted(game).forEach((e) => { if (e.type === 'period') p = e.period; m.set(e.id, p); });
    return m;
  }
  function periodAt(game, t) {
    let p = 1, best = -Infinity;
    (game.events || []).forEach((e) => { if (e.type === 'period' && e.t <= t + 1e-9 && e.t >= best) { best = e.t; p = e.period; } });
    return p;
  }
  /* いまの時計：{ p, name, sec（ピリオドが始まってからの秒）, len, over（長さを過ぎた秒）, ended（ピリオドが終わっている）} */
  function clockAt(sp, game, t) {
    const ps = periods(game).filter((x) => x.start <= t + 1e-9);
    const cur = ps[ps.length - 1];
    if (!cur) return { p: game.startPeriod || 1, name: periodName(sp, game.startPeriod || 1), sec: 0, len: periodLen(sp, game, 1), over: 0, ended: false, before: true };
    const ended = cur.end != null && cur.end <= t + 1e-9;
    const sec = Math.max(0, (ended ? cur.end : t) - cur.start);
    const len = periodLen(sp, game, cur.p);
    return { p: cur.p, name: periodName(sp, cur.p), sec, len, over: len && sec > len ? sec - len : 0, ended };
  }
  /* 試合が進んでいた時間（ピリオドの間だけ。ハーフタイムは数えない）。一時退場の残り時間に使う */
  function playTime(game, t) {
    let s = 0;
    periods(game).forEach((x) => { if (x.p === SO) return; const a = x.start, b = x.end == null ? t : Math.min(x.end, t); if (b > a) s += b - a; });
    return s;
  }

  /* ---------- 一時退場・退場 ---------- */
  /* t の時点で：outs（もう出られない選手 'チーム:番号'）, susp（一時退場中 [{ team, no, rem, label }]）, short（チームごとの人数の少なさ） */
  function penalties(sp, game, t) {
    const now = playTime(game, t);
    const outs = new Set(), susp = [];
    const cnt = {};
    ST.sorted(game).forEach((e) => {
      if (e.t > t + 1e-9 || e.team == null) return;
      const d = sp.TYPE[e.type];
      if (!d || !(d.susp || d.suspOpt || d.out || d.teamSusp || d.yellow)) return;
      const key = e.team + ':' + (e.no == null ? '' : e.no);
      cnt[key] = cnt[key] || { yc: 0, susp: 0 };
      if (d.yellow) cnt[key].yc++;
      const dsusp = d.susp || (d.suspOpt ? ((game.opts || {})[d.suspOpt] || 0) * 60 : 0);    // ラグビーのシンビン：試合の形式の長さ
      if (dsusp) cnt[key].susp++;
      let out = !!d.out;
      if (sp.twoYellowOut && d.yellow && cnt[key].yc >= 2) out = true;           // サッカー：警告 2 回で退場
      if (sp.suspOut && dsusp && cnt[key].susp >= sp.suspOut) out = true;        // ハンドボール：3 回目の 2 分間退場で失格
      if (out && e.no != null) outs.add(key);
      const dur = dsusp || d.teamSusp || (out && sp.outTeamSusp) || 0;
      if (dur) {
        const rem = dur - (now - playTime(game, e.t));
        if (rem > 0) susp.push({ team: e.team, no: e.no, rem, label: d.short || d.label, id: e.id });
      }
    });
    const short = [0, 0];
    susp.forEach((x) => { short[x.team]++; });
    // 退場（ずっと出られない）で、チームの人数が試合の終わりまで減る種目（サッカー・ラグビーのレッド）
    if (sp.redShort) outs.forEach((k) => { const tm = Number(k.split(':')[0]); if (!susp.some((x) => x.team === tm && k === tm + ':' + x.no)) short[tm]++; });
    return { outs, susp, short };
  }

  /* ---------- 累積ファウル（フットサル） ---------- */
  /* ピリオドごとのチームファウル Map(ピリオド → [自分, 相手])。carry：後半の数を延長にも続ける */
  function teamFouls(sp, game) {
    const tf = sp.teamFoul;
    const map = new Map();
    if (!tf) return map;
    const pm = periodMap(game);
    (game.events || []).forEach((e) => {
      if (e.type !== tf.type || (e.team !== 0 && e.team !== 1)) return;
      let p = pm.get(e.id);
      if (p === SO) return;
      if (tf.carry && p > 2) p = 2;
      if (!map.has(p)) map.set(p, [0, 0]);
      map.get(p)[e.team]++;
    });
    return map;
  }
  function foulsNow(sp, game, t) {
    const tf = sp.teamFoul;
    if (!tf) return null;
    let p = periodAt(game, t);
    if (tf.carry && p > 2) p = 2;
    return (teamFouls(sp, game).get(p) || [0, 0]).slice();
  }

  /* ---------- 得点 ---------- */
  function score(game) {
    const sp = ST.sportOf(game);
    const s = [0, 0];
    (game.events || []).forEach((e) => { const d = sp.TYPE[e.type]; if (d && d.pts && (e.team === 0 || e.team === 1)) s[e.team] += d.pts; });
    return s;
  }
  function shootout(game) {
    const s = [0, 0], a = [0, 0];
    (game.events || []).forEach((e) => { if ((e.type === 'sog' || e.type === 'sox') && (e.team === 0 || e.team === 1)) { a[e.team]++; if (e.type === 'sog') s[e.team]++; } });
    return a[0] + a[1] ? s : null;
  }
  function scoreText(game) {
    const sp = ST.sportOf(game);
    const s = score(game), so = shootout(game);
    return `${s[0]} − ${s[1]}` + (so ? `（${sp.shootoutShort || 'PK'} ${so[0]}−${so[1]}）` : '');
  }

  /* ---------- 行のボタン ---------- */
  /* 選手の行に並ぶ種類（いつもある base ＋ 設定で選んだもの。並びは rowOrder）。PK戦の間は「成功」「×」だけ */
  function rowTypes(sp, sprefs, p) {
    if (p === SO) return ['sog', 'sox'];
    const on = new Set(sp.base);
    (sp.toggles || []).forEach((tg) => { if (tg.row !== 'team' && isOn(sprefs, tg)) tg.types.forEach((x) => on.add(x)); });
    return sp.rowOrder.filter((x) => on.has(x));
  }
  /* チームの行（チームとしての記録：CK・FK・タイムアウト…）。設定で消せる。PK戦の間はなし */
  function teamTypes(sp, sprefs, p) {
    if (p === SO || !sp.teamTypes || !sp.teamTypes.length) return [];
    const tg = (sp.toggles || []).find((x) => x.row === 'team');
    return !tg || isOn(sprefs, tg) ? sp.teamTypes.slice() : [];
  }
  function isOn(sprefs, tg) { const r = (sprefs && sprefs.rows) || {}; return r[tg.key] != null ? !!r[tg.key] : !!tg.def; }
  const WEIGHT = (sp, id) => ((sp.TYPE[id] || {}).kind === 'miss' ? 0.75 : 1);
  /* 一覧で直すときに選べる種類 */
  function editTypes(sp, game, e, sprefs) {
    const d = sp.TYPE[e.type] || {};
    if (d.so) return ['sog', 'sox'];
    const ids = [];
    const add = (x) => { if (!ids.includes(x) && sp.TYPE[x]) ids.push(x); };
    rowTypes(sp, sprefs, 1).forEach(add);
    (sp.teamTypes || []).forEach(add);
    (sp.globalTypes || []).forEach(add);
    if (!ids.includes(e.type)) add(e.type);
    return ids;
  }

  /* ---------- 集計 ---------- */
  /* 選手ごと：[{ team, rows: [{ no, name, c（種類 → 回数）, pts }], unknown: { c, pts }, teamRow: { c }, total: { c, pts } }] */
  function stats(game) {
    const sp = ST.sportOf(game);
    return [0, 1].map((tm) => {
      const team = game.teams[tm] || ST.blankTeam(tm);
      const byNo = new Map();
      const blank = () => ({ c: {}, pts: 0 });
      team.players.forEach((p) => byNo.set(p.no, Object.assign({ no: p.no, name: p.name }, blank())));
      const unknown = blank(), total = blank();
      (game.events || []).forEach((e) => {
        const d = sp.TYPE[e.type];
        if (!d || d.meta || e.team !== tm) return;
        let s = unknown;
        if (e.no != null) {
          if (!byNo.has(e.no)) byNo.set(e.no, Object.assign({ no: e.no, name: '', extra: true }, blank()));
          s = byNo.get(e.no);
        }
        [s, total].forEach((x) => { x.c[e.type] = (x.c[e.type] || 0) + 1; x.pts += d.pts || 0; });
      });
      const rows = Array.from(byNo.values()).sort((a, b) => ST.cmpNo(a.no, b.no));
      return { team: tm, rows, unknown, total };
    });
  }
  /* 集計の表の列：{ key, label, n（数える種類）, a（打った数に入れる種類。あれば「成功/打った数」）, pts（得点） }。記録のある列だけ出す */
  function colValue(col, s) {
    if (col.pts) return s.pts ? String(s.pts) : '';
    const n = (col.n || []).reduce((m, t) => m + (s.c[t] || 0), 0);
    if (col.a) { const a = col.a.reduce((m, t) => m + (s.c[t] || 0), 0); return a ? `${n}/${a}` : ''; }
    return n ? String(n) : '';
  }
  function usedCols(sp, st) {
    return sp.cols.filter((col) => col.pts || st.some((x) => colValue(col, x.total) !== ''));
  }
  const isEmpty = (s) => !Object.keys(s.c).length;
  /* ピリオドごとの得点 [{ p, label, pts: [自分, 相手] }]（PK戦は入れない） */
  function periodScores(game) {
    const sp = ST.sportOf(game);
    const map = new Map();
    const get = (p) => { if (!map.has(p)) map.set(p, { p, label: periodName(sp, p), pts: [0, 0] }); return map.get(p); };
    const pm = periodMap(game);
    (game.events || []).forEach((e) => {
      if (e.type === 'period') { if (e.period !== SO) get(e.period); return; }
      const d = sp.TYPE[e.type];
      if (!d || d.meta || d.so) return;
      const p = pm.get(e.id);
      if (p === SO) return;
      const row = get(p);
      if (d.pts && e.team != null) row.pts[e.team] += d.pts;
    });
    if (!map.size) get(1);
    return Array.from(map.values()).sort((a, b) => a.p - b.p);
  }

  /* ---------- 名前・CSV ---------- */
  function eventText(game, e, withTeam) {
    const sp = ST.sportOf(game);
    if (e.type === 'period') return `${periodName(sp, e.period)} 開始`;
    if (e.type === 'pend') return `${periodName(sp, e.period)} 終了`;
    return null;
  }
  function typeLabel(game, e) {
    const sp = ST.sportOf(game);
    const d = sp.TYPE[e.type];
    if (!d) return e.type;
    if (d.so) return `${sp.shootout || 'PK戦'} ${d.label}`;
    return d.label;
  }
  /* ピリオドの時間の呼び名：「前半 23:41」「後半 40+1:05」 */
  function clockText(sp, game, t) {
    const c = clockAt(sp, game, t);
    if (c.p === SO) return c.name;
    return `${c.name} ${c.over ? Math.round(c.len / 60) + '+' + ST.fmtTime(c.over) : ST.fmtTime(c.sec)}`;
  }
  function csvEvents(game) {
    const sp = ST.sportOf(game);
    const rows = [['No', '時刻', 'スタートからの秒', 'ピリオド', 'ピリオドの時間', 'チーム', '背番号', '名前', '記録', '得点', `${ST.teamName(game, 0)}の得点`, `${ST.teamName(game, 1)}の得点`]];
    const s = [0, 0];
    let n = 0;
    const pm = periodMap(game);
    ST.sorted(game).forEach((e) => {
      const d = sp.TYPE[e.type] || { label: e.type };
      if (d.meta) { rows.push(['', ST.fmtTime(e.t), e.t, periodName(sp, e.period), '', '', '', '', eventText(game, e), '', s[0], s[1]]); return; }
      if (e.team != null && d.pts) s[e.team] += d.pts;
      const c = clockAt(sp, game, e.t);
      const ct = c.p === SO ? '' : c.over ? Math.round(c.len / 60) + '+' + ST.fmtTime(c.over) : ST.fmtTime(c.sec);
      rows.push([++n, ST.fmtTime(e.t), e.t, periodName(sp, pm.get(e.id)), ct, ST.teamName(game, e.team), e.no != null ? e.no : '', e.no != null ? ST.playerName(game, e.team, e.no) : '', typeLabel(game, e), d.pts || '', s[0], s[1]]);
    });
    return rows;
  }
  function csvBox(game) {
    const sp = ST.sportOf(game);
    const st = stats(game);
    const cols = sp.cols.concat(sp.shootout ? [{ key: 'so', label: sp.shootout, n: ['sog'], a: ['sog', 'sox'] }] : []);
    const rows = [['チーム', '背番号', '名前'].concat(cols.map((c) => c.label))];
    st.forEach((x) => {
      const name = ST.teamName(game, x.team);
      x.rows.forEach((r) => rows.push([name, r.no, r.name].concat(cols.map((c) => colValue(c, r)))));
      if (!isEmpty(x.unknown)) rows.push([name, '番号なし・チーム', ''].concat(cols.map((c) => colValue(c, x.unknown))));
      rows.push([name, '合計', ''].concat(cols.map((c) => colValue(c, x.total))));
    });
    return rows;
  }

  /* ---------- 種目をつくる ---------- */
  function teamSport(def) {
    const sp = Object.assign({
      family: 'team', prec: 10, hasTeams: true, periodNames: ['前半', '後半', '延長前半', '延長後半'], SO,
      globalTypes: ['mark']
    }, def);
    sp.TYPES = COMMON.concat(def.TYPES);
    sp.TYPE = {};
    sp.TYPES.forEach((d) => { sp.TYPE[d.id] = d; });
    sp.defaultOpts = () => Object.assign({ len: def.lenDefault, elen: def.elenDefault }, def.moreOpts ? def.moreOpts() : {});
    sp.optFields = [
      { key: 'len', label: `${sp.periodNames[0]}・${sp.periodNames[1]}の長さ`, choices: def.lenChoices.map((m) => [m, `${m}分`]), note: def.lenNote },
      { key: 'elen', label: '延長の長さ（1本）', choices: def.elenChoices.map((m) => [m, `${m}分`]) }
    ].concat(def.moreFields || []);
    sp.onStart = (game) => { ST.addEvent(game, { t: 0, type: 'period', period: game.startPeriod || 1 }); delete game.startPeriod; };
    sp.periodName = (p) => periodName(sp, p);
    sp.periodLen = (game, p) => periodLen(sp, game, p);
    sp.periods = periods; sp.periodAt = periodAt; sp.periodMap = periodMap;
    sp.clockAt = (game, t) => clockAt(sp, game, t);
    sp.clockText = (game, t) => clockText(sp, game, t);
    sp.playTime = playTime;
    sp.penalties = (game, t) => penalties(sp, game, t);
    sp.teamFouls = (game) => teamFouls(sp, game);
    sp.foulsNow = (game, t) => foulsNow(sp, game, t);
    sp.score = score; sp.soScore = shootout; sp.scoreText = scoreText;
    sp.rowTypes = (sprefs, p) => rowTypes(sp, sprefs, p);
    sp.teamTypesOf = (sprefs, p) => teamTypes(sp, sprefs, p);
    sp.weight = (id) => WEIGHT(sp, id);
    sp.editTypes = (game, e, sprefs) => editTypes(sp, game, e, sprefs);
    sp.stats = stats; sp.colValue = colValue; sp.usedCols = (st) => usedCols(sp, st); sp.isEmpty = isEmpty;
    sp.periodScores = periodScores;
    sp.eventText = eventText; sp.typeLabel = typeLabel;
    sp.csvEvents = csvEvents; sp.csvBox = csvBox;
    sp.cleanEvent = (e) => {
      if (e.type === 'period' || e.type === 'pend') return isFinite(e.period) && e.period >= 1 ? { period: Math.min(SO, Math.round(e.period)) } : null;
      return {};
    };
    sp.keepFirst = true;               // スタートの記録（前半の始まり）は、取り消し・消すができない（時刻は直せる）
    sp.startHint = `${def.start || 'キックオフ'}（試合開始）の瞬間`;
    sp.timeText = (game, e) => ((sp.TYPE[e.type] || {}).meta ? ST.fmtTime(e.t) : clockText(sp, game, e.t));
    sp.whoText = (game, e) => {
      if (e.team == null) return 'チームなし';
      const nm = e.no != null ? ST.playerName(game, e.team, e.no) : '';
      return `${ST.teamName(game, e.team)} ${e.no != null ? '#' + e.no + (nm ? ' ' + nm : '') : (sp.teamTypes || []).includes(e.type) ? '（チーム）' : '番号なし'}`;
    };
    const first = (sp.TYPE[sp.base[0]] || {}).btn || '';
    sp.steps = def.steps || [
      ['チームと背番号を選ぶ', '「' + sp.presets[0][0] + '」などのボタンでまとめて。自分のチームは次から自動で入ります。相手の背番号は入れなくても大丈夫です（チームの1行になります）'],
      [`${def.start || 'キックオフ'}で ▶ スタート`, '時計（前半が始まってからの時間）が動き出します'],
      ['選手の行のボタンを1回タップ', `「10」の行の「${first}」を押すだけ。押した瞬間の時刻で残ります`],
      ['前半が終わったら「前半」→「前半を終える」', '後半の始まりで「後半を始める」。延長' + (sp.shootout ? `・${sp.shootout}` : '') + 'も同じところから']
    ];
    sp.help = [['記録の画面', [
      '選手の行：背番号の小さい順に上から並びます。行のボタンを押すと、その選手の記録になります（ボタンの右上の小さな数は、その選手の回数）',
      '「？」の行：だれか分からないとき。チームの記録になります（あとで一覧から番号を付けられます）',
      sp.teamTypes && sp.teamTypes.length ? `「チーム」の行：${sp.teamTypes.map((x) => sp.TYPE[x].label).join('・')}など、チームとしての記録` : null,
      '画面の下の「★ あとで見る」：だれのかは決めずに、時刻だけを残します。あとで動画で見返すときの目印に',
      `ボタンを足す：「≡ メニュー」→「設定」で、${(sp.toggles || []).filter((x) => x.row !== 'team').map((x) => x.label.replace(/（.*$/, '')).join('・')}のボタンを出せます`,
      '名簿にない背番号は、チームの帯の「＋番号」で足せます'
    ].filter(Boolean)], ['時計とピリオド', [

<script>

/* スポーツ タップ記録 — バレーボール。画面を持たない部分
   ラリーポイント制：記録1つ＝ラリー1つの結果。どちらのチームの点かは、記録の種類で決まる
     「アタック」「ブロック」「サーブ」（サービスエース）・チームの行の「得点」 → その選手（チーム）の点（pt: 'own'）
     「ミス」（サーブミス・アタックミス・その他のミス） → 相手の点（pt: 'opp'）
     「レシーブ」「タイムアウト」「★ あとで見る」 → 点は動かない
   セット・セットの点・サーブ権は、どれも記録から計算する（replay）。取り消し・一覧で直すと、自動で正しくなる。

   ■ この種目の記録（core.js の形に足すもの）
     type 'srv'：サーブ権を入れかえた（team：そこからサーブするチーム）。ふだんは要らない（ラリーを取ったチームが次にサーブ）。
       最終セットの最初のサーブ（トスで決まる）や、まちがいを直すときに、チームの帯の「🏐」を押して残す
   ■ 試合の形式（opts）
     fmt：'6' 6人制（25点・最終セット15点）／'9' 9人制（21点）／'j' 小学生（21点・最終セット15点）
     sets：3（2セット先取）・5（3セット先取）・1（1セットだけ）
     deuce：1 ＝ 2点差がつくまで（デュース）・0 ＝ 先に取ったほう
     first：最初のセットで最初にサーブするチーム（0 自分・1 相手）。2セット目からは交互 */
(function (root) {
  'use strict';
  const ST = root.ST;

  const C = { atk: '#15803d', blk: '#7c3aed', ace: '#0e7490', rec: '#1d4ed8', err: '#dc2626', pt: '#166534', to: '#475569' };
  const TYPES = [
    { id: 'atk', btn: 'アタック', btnShort: 'アタ', label: 'アタック決定', short: 'アタック', pt: 'own', kind: 'made', col: C.atk },

    { id: 'rec', btn: 'レシーブ', btnShort: 'レシ', label: 'よいレシーブ', short: 'レシーブ', kind: 'good', col: C.rec },
    { id: 'err', btn: 'ミス', label: 'ミス（相手の点）', short: 'ミス', pt: 'opp', kind: 'miss', col: C.err, err: true },
    { id: 'serr', btn: 'サーブミス', btnShort: 'Sミス', label: 'サーブミス（相手の点）', short: 'サーブミス', pt: 'opp', kind: 'miss', col: C.err, err: true },
    { id: 'aerr', btn: 'アタックミス', btnShort: 'Aミス', label: 'アタックミス（相手の点）', short: 'アタックミス', pt: 'opp', kind: 'miss', col: C.err, err: true },

    { id: 'pt', btn: '得点', label: '得点（理由なし）', short: '得点', pt: 'own', kind: 'made', col: C.pt },
    { id: 'to', btn: 'タイムアウト', btnShort: 'TO', label: 'タイムアウト', kind: 'set', col: C.to },
    { id: 'mark', btn: '★ あとで見る', label: '★ あとで見る', kind: 'mark', global: true },

  const FMT = {

  /* そのセットの目標の点（最終セットだけ短い形式がある） */
  function target(o, set) {

  }
