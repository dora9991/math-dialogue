    function fillRoster(tm) {
      const Pn = L.panels[tm], pr = ctx.sprefs, p = period();
      Pn.roster.innerHTML = '';
      Pn.rows = new Map();
      L.btns = L.btns.filter((b) => b.team !== tm);
      const types = sp.rowTypes(pr, p), ttypes = sp.teamTypesOf(pr, p);
      const rows = g.teams[tm].players.map((x) => ({ no: x.no, name: x.name }));
      const teamOnly = !rows.length;
      if (pr.unknown !== false || teamOnly) rows.push({ no: null, name: '' });
      if (ttypes.length) rows.push({ team: true });
      Pn.n = rows.length;
      rows.forEach((r) => {
        if (r.team) {
          const row = h('div', { class: 'prow trow', style: { '--tk': ttypes.length } }, h('div', { class: 'pno' }, h('b', null, 'チーム')));
          ttypes.forEach((type) => row.append(btn(tm, null, type, `${ST.teamName(g, tm)} チームの ${sp.TYPE[type].label}`, true)));
          Pn.roster.append(row);
          return;
        }
        const no = r.no == null ? '' : r.no;
        const who = r.no != null ? `${r.no}番${r.name ? ' ' + r.name : ''}` : teamOnly ? 'チーム' : 'だれか（番号なし）';
        const nameEl = r.no != null ? h('small', { class: 'pnm' }, pr.names && r.name ? r.name : '') : teamOnly ? null : h('small', null, 'だれか');
        const row = h('div', { class: 'prow' + (r.no == null ? ' unk' : '') + (teamOnly ? ' teamonly' : ''), dataset: { no } },
          h('div', { class: 'pno' }, h('b', null, r.no != null ? r.no : teamOnly ? 'チーム' : '？'), nameEl, r.no != null ? h('small', { class: 'ptag' }) : null));
        types.forEach((type) => row.append(btn(tm, r.no, type, `${ST.teamName(g, tm)} ${who} ${sp.TYPE[type].label}`)));
        if (r.no != null) Pn.rows.set(r.no, { row, name: r.name, tag: row.querySelector('.ptag'), nm: nameEl });
        Pn.roster.append(row);
      });
    }
    function btn(tm, no, type, aria, teamRow) {
      const d = sp.TYPE[type];
      const cnt = h('i', { class: 'cnt', hidden: true });
      const lab = d.btnShort ? [h('b', { class: 'bl' }, d.btn), h('b', { class: 'bs' }, d.btnShort)] : h('b', null, d.btn);
      const col = d.col || '#475569';
      const el = h('button', { class: 'pb k-' + d.kind + (d.kind === 'miss' ? ' miss' : '') + (d.btn === '×' ? ' x1' : ''), dataset: { type, no: no == null ? '' : no }, style: { '--bc': col, '--bink': ST.inkOn(col) }, 'aria-label': aria }, lab, cnt);
      L.btns.push({ team: tm, type, key: tm + ':' + (no == null ? '' : no) + ':' + type, el, cnt, teamRow: !!teamRow });
      return el;
    }

    /* 画面の大きさに合わせて並べ方を決める */
    function layout() {
      if (!rootEl.isConnected) return;
      rootEl.classList.toggle('short', (rootEl.clientHeight || root.innerHeight) < 430);
      const types = sp.rowTypes(ctx.sprefs, period());
      const weights = types.map((x) => sp.weight(x));
      const spec = ST.rowSpec(weights);
      const n = [L.panels[0].n, L.panels[1].n], headH = L.panels[0].head.offsetHeight || 24;
      const plan = ST.planLayout(P.clientWidth, P.clientHeight, n, headH, spec);
      const cols = weights.map((w) => `minmax(0, ${w}fr)`).join(' ');
      rootEl.classList.toggle('lay-side', plan.arr !== 'stack');
      rootEl.classList.toggle('lay-stack', plan.arr === 'stack');
      L.plan = plan;
      // 上下に重ねるとき：行の少ないチーム（相手の「チーム」の行だけ など）は、その行が楽に押せる高さに決め、残りを多いほうに
      const small = plan.arr === 'stack' ? plan.teams.map((T) => T.r <= 3 && plan.teams.some((o) => o.r > T.r * 2)) : [false, false];
      plan.teams.forEach((T, tm) => {
        const sec = L.panels[tm].sec;
        sec.style.flex = small[tm] ? `0 0 ${Math.ceil(T.base + T.r * Math.min(ST.LAYOUT.rmax, Math.max(T.rowH, 44)))}px` : '';
        const unit = Math.max(ST.LAYOUT.rmin, Math.min(T.bw, T.rowH));
        sec.style.setProperty('--cols', cols);
        sec.style.setProperty('--c', T.c);
        sec.style.setProperty('--r', T.r);
        sec.style.setProperty('--nw', T.nw + 'px');
        sec.style.setProperty('--base', Math.ceil(T.base) + 'px');
        const bf = Math.round(ST.clamp(unit * 0.42, 13, 24));
        sec.style.setProperty('--bf', bf + 'px');
        sec.style.setProperty('--nf', Math.round(ST.clamp(Math.min(Math.max(T.rowH, ST.LAYOUT.rmin) * 0.56, T.nw * 0.5), 14, 30)) + 'px');
        sec.classList.toggle('roomy', T.rowH >= 40 && T.nw >= 46);
        sec.classList.toggle('narrowb', (T.bwMin || T.bw) < 48);
        sec.classList.toggle('scroll', T.rowH < ST.LAYOUT.rmin);
        // ボタンごとの文字の大きさ：その幅に、呼び名（「ゴール」「タイムアウト」）が入る大きさ。小さくなりすぎるときは短い呼び名（btnShort）
        const ttypes = sp.teamTypesOf(ctx.sprefs, period());
        const teamBw = ttypes.length ? (T.cellW - T.nw - ttypes.length * ST.LAYOUT.bgap) / ttypes.length : 0;
        L.btns.filter((b) => b.team === tm).forEach((b) => {
          const d = sp.TYPE[b.type];
          const w = (b.teamRow ? teamBw : T.bw * sp.weight(b.type)) - (d.kind === 'miss' ? 10 : 6);
          let fz = Math.min(bf, Math.floor(w / textEm(d.btn)));
          const useShort = !!d.btnShort && fz < 12;
          if (useShort) fz = Math.min(bf, Math.floor(w / textEm(d.btnShort)));
          b.el.classList.toggle('useshort', useShort);
          b.el.style.setProperty('--fz', Math.max(9, fz) + 'px');
        });
      });
    }

    let lastClock = '', lastPen = '';
    function clockText() {
      if (!g.startedAt) return '0:00';
      const c = sp.clockAt(g, ctx.elapsed());
      if (c.p === sp.SO) return ST.fmtTime(c.sec);
      return c.over ? `${Math.round(c.len / 60)}+${ST.fmtTime(c.over)}` : ST.fmtTime(c.sec);
    }
    function periodText() {
      if (!g.startedAt) return sp.periodName(g.startPeriod || 1);
      const c = sp.clockAt(g, ctx.elapsed());
      if (c.ended) return c.p === 1 ? 'HT' : `${c.name}終了`;
      return c.name;
    }
    /* 退場・一時退場の表示（1 秒ごと） */
    function penaltyView() {
      const t = ctx.elapsed();
      const pen = sp.penalties(g, t);
      const key = JSON.stringify([Array.from(pen.outs), pen.susp.map((x) => [x.team, x.no, Math.ceil(x.rem)]), pen.short]);
      if (key === lastPen) return;
      lastPen = key;
      [0, 1].forEach((tm) => {
        const Pn = L.panels[tm];
        Pn.rows.forEach((r, no) => {
          const s = pen.susp.find((x) => x.team === tm && x.no === no);
          const out = pen.outs.has(tm + ':' + no);
          r.row.classList.toggle('out', out && !s);
          r.row.classList.toggle('susp', !!s);
          r.tag.textContent = s ? ST.fmtTime(s.rem) : out ? '退場' : '';
          if (r.nm) r.nm.hidden = !!(s || out);
        });
        const mine = pen.susp.filter((x) => x.team === tm);
        const n = pen.short[tm];
        Pn.short.hidden = !n;
        if (n) Pn.short.textContent = `−${n}` + (mine.length ? ' ' + ST.fmtTime(Math.min(...mine.map((x) => x.rem))) : '');
      });
    }
    function tick() {
      const s = clockText();
      if (s !== lastClock) { lastClock = s; clock.set(s); const c = g.startedAt ? sp.clockAt(g, ctx.elapsed()) : null; clock.el.classList.toggle('over', !!(c && c.over)); clock.el.classList.toggle('paused', !!(c && c.ended)); }
      const pt = periodText();
      if (L.period.textContent !== pt) { L.period.textContent = pt; L.period.classList.toggle('brk', pt.length > 3); }
      if (g.startedAt) penaltyView();
    }
    function update(bump) {
      if (rowKey() !== L.rowKey) { fillAll(); layout(); }
      startB.update();
      lastClock = ''; lastPen = '';
      tick();
      const sc = sp.score(g), so = sp.soScore(g);
      L.score[0].parentNode.classList.toggle('big3', Math.max(sc[0], sc[1]) >= 100);
      [0, 1].forEach((tm) => {
        L.score[tm].textContent = sc[tm];
        L.panels[tm].tsc.textContent = sc[tm];
        if (bump === tm) { ctx.flash(L.score[tm]); ctx.flash(L.panels[tm].tsc); }
      });
      L.so.hidden = !so;
      if (so) L.so.textContent = `${sp.shootoutShort} ${so[0]}−${so[1]}`;
      const tl = ST.tally(g);
      L.btns.forEach((b) => { const c = tl[b.key] || 0; setCnt(b.cnt, c); });
      (sp.globalTypes || []).forEach((type) => setCnt(L.gb[type].cnt, tl['*:' + type] || 0));
      // 累積ファウル（フットサル）：5つで黄・6つ目から赤（第2PK）
      const f = g.startedAt ? sp.foulsNow(g, ctx.elapsed()) : null;
      [0, 1].forEach((tm) => {
        const el = L.panels[tm].fouls;
        el.hidden = !sp.teamFoul;
        if (!sp.teamFoul) return;
        const n = f ? f[tm] : 0;
        el.textContent = `累積${n}`;
        el.classList.toggle('w', n >= sp.teamFoul.warn && n < sp.teamFoul.limit);
        el.classList.toggle('x', n >= sp.teamFoul.limit);
      });
    }
    fillAll();
    L.update = update;
    L.layout = layout;
    L.tick = tick;
    L.refresh = () => { fillAll(); layout(); };
    L.fillRoster = (tm) => { fillRoster(tm); L.rowKey = rowKey(); layout(); update(); };
    return L;
  }
  /* 文字の幅（全角 1・半角 0.62。文字の大きさの何倍か） */
  function textEm(s) { let w = 0; for (const ch of String(s || '')) w += /[\x20-\x7e]/.test(ch) ? 0.62 : 1; return Math.max(1.2, w); }
  function setCnt(el, n) {
    const s = n ? String(n) : '';
    if (el.textContent !== s) el.textContent = s;
    el.hidden = !n;
  }
  function onClick(ctx, L, e) {
    const b = e.target.closest('button');
    if (!b) return;
    const sec = b.closest('.team');
    if (!sec) return;
    const tm = Number(sec.dataset.team);
    if (b.dataset.type) ctx.record({ type: b.dataset.type, team: tm, no: b.dataset.no === '' ? null : b.dataset.no }, b);
    else if (b.dataset.add) openKeypad(ctx, L, tm);
  }

  /* ---------- ピリオド（前半を終える・後半を始める・延長・PK戦） ---------- */
  function openPeriod(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const started = !!g.startedAt;
    const SO = sp.SO;
    const all = [1, 2, 3, 4].concat(sp.shootout ? [SO] : []);
    const startP = (p) => {
      s.close();
      if (!started) { g.startPeriod = p; ctx.save(); ctx.update(); return; }
      const ev = ST.addEvent(g, { t: ctx.elapsed(), type: 'period', period: p });
      ctx.S.redo = [];
      ctx.save(); ctx.feel('made'); ctx.update();
      ctx.say(`${sp.periodName(p)}を始めました（${ST.fmtTime(ev.t)}）`, 'ok');
    };
    const endP = (p) => {
      s.close();
      const ev = ST.addEvent(g, { t: ctx.elapsed(), type: 'pend', period: p });
      ctx.S.redo = [];
      ctx.save(); ctx.feel('made'); ctx.update();
      ctx.say(`${sp.periodName(p)}を終えました（${ST.fmtTime(ev.t)}）`, 'ok');
    };
    let body;
    if (!started) {
      body = h('div', { class: 'periodbox' },
        h('div', { class: 'row pgrid' }, all.map((p) => h('button', { class: 'btn' + (p === (g.startPeriod || 1) ? ' on' : ''), onclick: () => startP(p) }, sp.periodName(p)))),
        h('p', { class: 'note' }, 'スタートを押したときのピリオドです（途中から記録するときに）。'));
    } else {
      const c = sp.clockAt(g, ctx.elapsed());
      const next = c.p === SO ? null : c.p >= 4 ? (sp.shootout ? SO : null) : c.p + 1;
      const mains = [];
      if (!c.ended && c.p !== SO) mains.push(h('button', { class: 'btn primary huge', id: 'btnEndPeriod', onclick: () => endP(c.p) }, `${c.name}を終える`));
      if (next) mains.push(h('button', { class: 'btn huge' + (c.ended ? ' primary' : ''), id: 'btnNextPeriod', onclick: () => startP(next) }, `${sp.periodName(next)}を始める`));
      if (c.p === 2 && sp.shootout) mains.push(h('button', { class: 'btn huge', id: 'btnShootout', onclick: () => startP(SO) }, `${sp.shootout}を始める`));
      body = h('div', { class: 'periodbox' }, mains,
        h('div', { class: 'row pgrid' }, all.filter((p) => p !== c.p && p !== next && !(c.p === 2 && p === SO)).map((p) => h('button', { class: 'btn', onclick: () => startP(p) }, `${sp.periodName(p)}にする`))),
        h('p', { class: 'note' }, `ピリオドが始まる瞬間・終わる瞬間（笛）に押します。時計は「いまのピリオドが始まってからの時間」で、${sp.periodName(1)}の長さ（${g.opts.len}分）を過ぎると「${g.opts.len}+0:30」のように出ます。押し忘れても、あとで「記録の一覧」で時刻を直せます（それより後の記録は、自動でそのピリオドになります）。`));
    }
    const s = ST.ui.sheet({ title: started ? `ピリオド（いまは ${sp.clockAt(g, ctx.elapsed()).name}）` : '始めるピリオド', body });
  }

  /* ---------- 番号を足す（記録の途中で、名簿にない番号が出たとき） ---------- */
  function openKeypad(ctx, L, tm) {
    const g = ctx.game;
    let val = '';
    const disp = h('div', { class: 'kdisp', id: 'kdisp' }, '　');
    const show = () => { disp.textContent = val ? '#' + val : '番号を入れる'; disp.classList.toggle('empty', !val); };
    const press = (k) => {
      if (k === '⌫') val = val.slice(0, -1);
      else if (k === '00') val = '00';
      else if (val === '00' || val.length >= 2) val = k;
      else val = val === '0' ? k : val + k;
      show();
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'];
    const s = ST.ui.sheet({
      title: `${ST.teamName(g, tm)} の背番号を足す`, cls: 'keypad',
      body: h('div', null, disp, h('div', { class: 'keys' }, keys.map((k) => h('button', { class: 'key', dataset: { key: k }, onclick: () => press(k) }, k))),
        h('p', { class: 'note' }, '足した番号の行が、番号の順のところに入ります。')),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn primary', id: 'btnKeyOk', onclick: () => {
        const no = ST.normNo(val);
        if (no == null) { ST.ui.toast('0〜99 の番号を入れてください', 'warn'); return; }
        const t = g.teams[tm];
        const had = t.players.some((p) => p.no === no);
        if (!had) t.players = ST.cleanPlayers(t.players.concat([{ no, name: '' }]));
        ctx.save();
        s.close();
        L.fillRoster(tm);
        ctx.say(had ? `#${no} はもう並んでいます` : `#${no} を足しました`, had ? 'warn' : 'ok');
      } }, '足す')]
    });
    show();
  }

  /* ---------- 集計 ---------- */
  function stats(ctx, g) {
    const sp = ST.sportOf(g);
    const st = sp.stats(g);
    const per = sp.periodScores(g);
    const cols = sp.usedCols(st);
    const so = sp.soScore(g);
    const chip = (tm) => h('i', { class: 'chip', style: { background: g.teams[tm].color } });
    const table = (x) => {
      const rows = x.rows.filter((r) => !sp.isEmpty(r));
      const idle = x.rows.filter((r) => sp.isEmpty(r));
      return h('div', { class: 'boxwrap' }, h('table', { class: 'box' },
        h('thead', null, h('tr', null, h('th', null, '#'), h('th', { class: 'nm' }, '名前'), cols.map((c) => h('th', null, c.label)))),
        h('tbody', null,
          rows.map((r) => h('tr', null, h('td', { class: 'no' }, r.no), h('td', { class: 'nm' }, r.name || ''), cols.map((c) => h('td', null, sp.colValue(c, r))))),
          !sp.isEmpty(x.unknown) ? h('tr', { class: 'unk' }, h('td', { class: 'no' }, '—'), h('td', { class: 'nm' }, '番号なし・チーム'), cols.map((c) => h('td', null, sp.colValue(c, x.unknown)))) : null,
          h('tr', { class: 'tot' }, h('td', { class: 'no' }), h('td', { class: 'nm' }, '合計'), cols.map((c) => h('td', null, sp.colValue(c, x.total)))))),
        idle.length ? h('p', { class: 'note' }, `記録なし：${idle.map((r) => '#' + r.no).join(' ')}`) : null);
    };
    const pf = sp.teamFouls(g);
    const foulTable = sp.teamFoul && pf.size ? h('div', { class: 'boxwrap' }, h('table', { class: 'per fouls', id: 'teamFouls' },
      h('thead', null, h('tr', null, h('th', null, sp.teamFoul.label), Array.from(pf.keys()).sort().map((p) => h('th', null, p === 2 && sp.teamFoul.carry ? `${sp.periodName(2)}（延長も）` : sp.periodName(p))))),
      h('tbody', null, [0, 1].map((tm) => h('tr', null, h('th', null, chip(tm), ST.teamName(g, tm)),
        Array.from(pf.keys()).sort().map((p) => { const f = pf.get(p)[tm]; return h('td', { class: f >= sp.teamFoul.limit ? 'bonus' : null }, String(f)); })))))) : null;
    // シュートの決定率（シュートを数える種目）
    const shotLine = (tm) => {
      const t = st[tm].total.c;
      const made = (sp.TYPES || []).filter((d) => d.shot && d.kind === 'made').reduce((m, d) => m + (t[d.id] || 0), 0);
      const all = (sp.TYPES || []).filter((d) => d.shot).reduce((m, d) => m + (t[d.id] || 0), 0);
      return all ? `・シュート ${all}本（決定率 ${ST.pct(made, all)}）` : '';
    };
    const kickLine = (tm) => {
      const t = st[tm].total.c;
      const made = (sp.TYPES || []).filter((d) => d.kick && d.kind === 'made').reduce((m, d) => m + (t[d.id] || 0), 0);
      const all = (sp.TYPES || []).filter((d) => d.kick).reduce((m, d) => m + (t[d.id] || 0), 0);
      const anyMiss = (sp.TYPES || []).some((d) => d.kick && d.kind === 'miss' && t[d.id]);
      return all && anyMiss ? `・キック ${made}/${all}（成功率 ${ST.pct(made, all)}）` : '';
    };
    const tl = ST.tally(g);
    const free = (sp.globalTypes || []).filter((x) => tl['-::' + x]).map((x) => `${sp.TYPE[x].label} ${tl['-::' + x]}`).join('・');
    return h('div', null,
      h('div', { class: 'boxwrap' }, h('table', { class: 'per' },
        h('thead', null, h('tr', null, h('th', null, ''), per.map((p) => h('th', null, p.label)), h('th', null, '計'), so ? h('th', null, sp.shootout) : null)),
        h('tbody', null, [0, 1].map((tm) => h('tr', null, h('th', null, chip(tm), ST.teamName(g, tm)), per.map((p) => h('td', null, String(p.pts[tm]))), h('td', { class: 'sum' }, String(sp.score(g)[tm])), so ? h('td', { class: 'sum' }, String(so[tm])) : null))))),
      foulTable,
      [0, 1].map((tm) => h('section', { class: 'teamstat' },
        h('h3', null, chip(tm), ST.teamName(g, tm), h('small', null, ` 得点 ${st[tm].total.pts}${shotLine(tm)}${kickLine(tm)}`)),
        table(st[tm]))),
      free ? h('section', { class: 'teamstat free' }, h('h3', null, h('i', { class: 'chip neutral' }), 'チームなし'), h('p', { class: 'freeline' }, free)) : null,
      h('p', { class: 'note' }, (sp.statsNote || '「成功/打った数」は、失敗のボタン（×）も使ったときに出ます。') + '時刻は「記録の一覧」で確かめられます。'));
  }

  ST.addView('team', { build, stats });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/v/volley.js */
/* スポーツ タップ記録 — バレーボールの画面
   上の帯：時計（スタートからの時間）・いまのセット・いまのセットの点（大きく。🏐 がサーブのチーム）・取ったセット数・メニュー
   2つのチーム：選手1人＝1行（背番号＋「アタック」「ブロック」「サーブ」「ミス」）。下に「？」（だれか分からない）と「チーム」の行（得点・タイムアウト）
   チームの帯の「🏐」：サーブのチームの印。押すと、そのチームのサーブに入れかえる（'srv' の記録）
   下の帯：★ あとで見る・いま記録したもの・取り消す
   並べ方は ST.planLayout（チームの種目と同じ）。点・セット・サーブ権は、記録から計算する（sp.replay）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const { h } = ST.ui;

  function build(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const L = { panels: [], btns: [], gb: {}, rowKey: '', rallies: -1 };
    const clock = ctx.ui.clockBtn();
    const startB = ctx.ui.startBtn();
    // 「第1セット」と、取ったセット数（2段）。押すと、セットごとの点の小窓
    L.setLab = h('span', { class: 'setlab', id: 'setLabel' }, '第1セット');
    L.sets = h('b', { class: 'setsc', id: 'setScore' }, '0−0');
    L.setBtn = h('button', { class: 'period setbtn', id: 'btnSet', 'aria-label': 'セット（取ったセット数）', onclick: () => openSets(ctx) }, L.setLab, L.sets);
    L.score = [0, 1].map((tm) => h('span', { class: 'sc', id: 'score' + tm, style: { '--tc': g.teams[tm].color, '--tink': ST.inkOn(g.teams[tm].color) } }, '0'));
    const bar = h('header', { class: 'lbar' }, clock.el, startB.el, L.setBtn,
      h('div', { class: 'score', 'aria-label': 'いまのセットの点' }, L.score[0], h('span', { class: 'dash' }, '−'), L.score[1]),
      ctx.ui.menuBtn());
    const P = L.panelsEl = h('main', { class: 'panels' }, [0, 1].map((tm) => buildPanel(tm)));
    const gl = (sp.globalTypes || []).map((type) => {
      const d = sp.TYPE[type];
      const cnt = h('i', { class: 'cnt', hidden: true });
      const parts = String(d.btn).split(' ');
      const el = h('button', { class: 'gb k-' + d.kind, id: 'btn_' + type, dataset: { gtype: type }, 'aria-label': `${d.label}（チーム・選手は決めない）`, onclick: (e) => ctx.record({ type, team: null, no: null }, e.currentTarget) },
        h('b', null, parts[0]), parts[1] ? h('small', null, parts.slice(1).join(' ')) : null, cnt);
      L.gb[type] = { el, cnt };
      return el;
    });
    const rootEl = h('div', { class: 'live fam-volley' }, bar, h('div', { class: 'stagewrap' }, P, ctx.ui.cover()), ctx.ui.footer(gl));
    rootEl.addEventListener('click', (e) => onClick(ctx, L, e));
    L.root = rootEl;

    function buildPanel(tm) {
      const t = g.teams[tm];
      const tsc = h('span', { class: 'tsc' }, '0');
      const srv = h('button', { class: 'srvb', dataset: { srv: String(tm) }, title: 'サーブの印（押すと、このチームのサーブに入れかえる）', 'aria-label': `${ST.teamName(g, tm)} のサーブにする` }, '🏐');
      const head = h('div', { class: 'thead' }, srv, h('b', { class: 'tname' }, ST.teamName(g, tm)), tsc,
        h('button', { class: 'tadd', dataset: { add: '1' }, title: '名簿にない背番号を足す', 'aria-label': `${ST.teamName(g, tm)} の背番号を足す` }, '＋番号'));
      const roster = h('div', { class: 'roster', role: 'group', 'aria-label': `${ST.teamName(g, tm)} の選手` });
      const sec = h('section', { class: 'team', id: 'panel' + tm, dataset: { team: tm }, style: { '--tc': t.color, '--tink': ST.inkOn(t.color) } }, head, roster);
      L.panels[tm] = { sec, head, tsc, srv, roster, n: 0 };
      return sec;
    }
    function rowKey() { return sp.rowTypes(ctx.sprefs).join(',') + '|' + sp.teamTypesOf(ctx.sprefs).join(',') + '|' + (ctx.sprefs.unknown !== false) + '|' + g.teams.map((t) => t.players.map((p) => p.no + p.name).join('.')).join('/'); }
    function fillAll() {
      L.btns = [];
      [0, 1].forEach((tm) => fillRoster(tm));
      L.rowKey = rowKey();
    }
    function fillRoster(tm) {
      const Pn = L.panels[tm], pr = ctx.sprefs;
      Pn.roster.innerHTML = '';
      L.btns = L.btns.filter((b) => b.team !== tm);
      const types = sp.rowTypes(pr), ttypes = sp.teamTypesOf(pr);
      const rows = g.teams[tm].players.map((x) => ({ no: x.no, name: x.name }));
      const teamOnly = !rows.length;
      if (pr.unknown !== false || teamOnly) rows.push({ no: null, name: '' });
      if (ttypes.length) rows.push({ team: true });
      Pn.n = rows.length;
      rows.forEach((r) => {
        if (r.team) {
          const row = h('div', { class: 'prow trow', style: { '--tk': ttypes.length } }, h('div', { class: 'pno' }, h('b', null, 'チーム')));
          ttypes.forEach((type) => row.append(btn(tm, null, type, `${ST.teamName(g, tm)} チームの ${sp.TYPE[type].label}`, true)));
          Pn.roster.append(row);
          return;
        }
        const no = r.no == null ? '' : r.no;
        const who = r.no != null ? `${r.no}番${r.name ? ' ' + r.name : ''}` : teamOnly ? 'チーム' : 'だれか（番号なし）';
        const nameEl = r.no != null ? (pr.names && r.name ? h('small', { class: 'pnm' }, r.name) : null) : teamOnly ? null : h('small', null, 'だれか');
        const row = h('div', { class: 'prow' + (r.no == null ? ' unk' : '') + (teamOnly ? ' teamonly' : ''), dataset: { no } },
          h('div', { class: 'pno' }, h('b', null, r.no != null ? r.no : teamOnly ? 'チーム' : '？'), nameEl));
        types.forEach((type) => row.append(btn(tm, r.no, type, `${ST.teamName(g, tm)} ${who} ${sp.TYPE[type].label}`)));
        Pn.roster.append(row);
      });
    }
    function btn(tm, no, type, aria, teamRow) {
      const d = sp.TYPE[type];
      const cnt = h('i', { class: 'cnt', hidden: true });
      const lab = d.btnShort ? [h('b', { class: 'bl' }, d.btn), h('b', { class: 'bs' }, d.btnShort)] : h('b', null, d.btn);
      const col = d.col || '#475569';
      const el = h('button', { class: 'pb k-' + d.kind + (d.kind === 'miss' ? ' miss' : ''), dataset: { type, no: no == null ? '' : no }, style: { '--bc': col, '--bink': ST.inkOn(col) }, 'aria-label': aria }, lab, cnt);
      L.btns.push({ team: tm, type, key: tm + ':' + (no == null ? '' : no) + ':' + type, el, cnt, teamRow: !!teamRow });
      return el;
    }

    /* 画面の大きさに合わせて並べ方を決める（チームの種目と同じ） */
    function layout() {
      if (!rootEl.isConnected) return;
      rootEl.classList.toggle('short', (rootEl.clientHeight || root.innerHeight) < 430);
      const types = sp.rowTypes(ctx.sprefs);
      const weights = types.map(() => 1);
      const spec = ST.rowSpec(weights);
      const n = [L.panels[0].n, L.panels[1].n], headH = L.panels[0].head.offsetHeight || 24;
      const plan = ST.planLayout(P.clientWidth, P.clientHeight, n, headH, spec);
      const cols = weights.map((w) => `minmax(0, ${w}fr)`).join(' ');
      rootEl.classList.toggle('lay-side', plan.arr !== 'stack');
      rootEl.classList.toggle('lay-stack', plan.arr === 'stack');
      L.plan = plan;
      const ttypes = sp.teamTypesOf(ctx.sprefs);
      plan.teams.forEach((T, tm) => {
        const sec = L.panels[tm].sec;
        const unit = Math.max(ST.LAYOUT.rmin, Math.min(T.bw, T.rowH));
        sec.style.setProperty('--cols', cols);
        sec.style.setProperty('--c', T.c);
        sec.style.setProperty('--r', T.r);
        sec.style.setProperty('--nw', T.nw + 'px');
        sec.style.setProperty('--base', Math.ceil(T.base) + 'px');
        const bf = Math.round(ST.clamp(unit * 0.42, 13, 24));
        sec.style.setProperty('--bf', bf + 'px');
        sec.style.setProperty('--nf', Math.round(ST.clamp(Math.min(Math.max(T.rowH, ST.LAYOUT.rmin) * 0.56, T.nw * 0.5), 14, 30)) + 'px');
        sec.classList.toggle('roomy', T.rowH >= 40 && T.nw >= 46);
        sec.classList.toggle('narrowb', (T.bwMin || T.bw) < 56);       // 回数は文字の下に（右上だと「アタ」に重なるため）
        sec.classList.toggle('scroll', T.rowH < ST.LAYOUT.rmin);
        // ボタンごとの文字の大きさ（「アタック」が入る大きさ。小さくなりすぎるときは短い呼び名）
        const teamBw = ttypes.length ? (T.cellW - T.nw - ttypes.length * ST.LAYOUT.bgap) / ttypes.length : 0;
        L.btns.filter((b) => b.team === tm).forEach((b) => {
          const d = sp.TYPE[b.type];
          const w = (b.teamRow ? teamBw : T.bw) - (d.kind === 'miss' ? 10 : 6);
          let fz = Math.min(bf, Math.floor(w / textEm(d.btn)));
          const useShort = !!d.btnShort && fz < 12;
          if (useShort) fz = Math.min(bf, Math.floor(w / textEm(d.btnShort)));
          b.el.classList.toggle('useshort', useShort);
          b.el.style.setProperty('--fz', Math.max(9, fz) + 'px');
        });
      });
    }

    let lastClock = '';
    function tick() {
      const s = g.startedAt ? ST.fmtTime(ctx.elapsed()) : '0:00';
      if (s !== lastClock) { lastClock = s; clock.set(s); }
    }
    function update() {
      if (rowKey() !== L.rowKey) { fillAll(); layout(); }
      startB.update();
      lastClock = '';
      tick();
      const rp = sp.replay(g);
      const setLabel = rp.done ? '試合終了' : `第${rp.set}セット`;
      if (L.setLab.textContent !== setLabel) L.setLab.textContent = setLabel;
      L.sets.textContent = `${rp.sets[0]}−${rp.sets[1]}`;
      L.sets.title = `取ったセット ${rp.sets[0]}−${rp.sets[1]}`;
      const shown = rp.done && rp.log.length ? rp.log[rp.log.length - 1].pts : rp.pts;
      [0, 1].forEach((tm) => {
        L.score[tm].textContent = shown[tm];
        L.panels[tm].tsc.textContent = shown[tm];
        const serving = !rp.done && rp.server === tm;
        L.score[tm].classList.toggle('srv', serving);
        L.panels[tm].sec.classList.toggle('serving', serving);
        L.panels[tm].srv.classList.toggle('on', serving);
        L.panels[tm].srv.setAttribute('aria-pressed', String(serving));
      });
      // 点が動いたら、点を取ったチームを光らせる
      if (L.rallies >= 0 && rp.rallies.length > L.rallies) {
        const w = rp.rallies[rp.rallies.length - 1].winner;
        ctx.flash(L.score[w]); ctx.flash(L.panels[w].tsc);
      }
      L.rallies = rp.rallies.length;
      const tl = ST.tally(g);
      L.btns.forEach((b) => setCnt(b.cnt, tl[b.key] || 0));
      (sp.globalTypes || []).forEach((type) => setCnt(L.gb[type].cnt, tl['*:' + type] || 0));
    }
    fillAll();
    L.update = update;
    L.layout = layout;
    L.tick = tick;
    L.refresh = () => { fillAll(); layout(); };
    L.fillRoster = (tm) => { fillRoster(tm); L.rowKey = rowKey(); layout(); update(); };
    return L;
  }
  function textEm(s) { let w = 0; for (const ch of String(s || '')) w += /[\x20-\x7e]/.test(ch) ? 0.62 : 1; return Math.max(1.2, w); }
  function setCnt(el, n) {
    const s = n ? String(n) : '';
    if (el.textContent !== s) el.textContent = s;
    el.hidden = !n;
  }

  /* 押したとき：選手のボタン → 記録（セット・試合が決まったら、下の帯で知らせる）／🏐 → サーブを入れかえる／＋番号 */
  function onClick(ctx, L, e) {
    const b = e.target.closest('button');
    if (!b) return;
    const sec = b.closest('.team');
    if (!sec) return;
    const g = ctx.game, sp = ctx.sport;
    const tm = Number(sec.dataset.team);
    if (b.dataset.type) {
      const d = sp.TYPE[b.dataset.type];
      if (d.pt && g.startedAt && !g.endedAt && sp.replay(g).done) {
        ctx.say('試合は決まっています（終えるときは ≡ メニューの「試合を終える」）', 'warn', 6000, { label: '試合を終える', onClick: ctx.endGame });
        return;
      }
      const ev = ctx.record({ type: b.dataset.type, team: tm, no: b.dataset.no === '' ? null : b.dataset.no }, b);
      if (ev && d.pt) announce(ctx, ev);
    } else if (b.dataset.srv != null) setServer(ctx, tm, b);
    else if (b.dataset.add) openKeypad(ctx, L, tm);
  }
  /* セット・試合が決まったことを知らせる */
  function announce(ctx, ev) {
    const g = ctx.game, sp = ctx.sport;
    const rp = sp.replay(g);
    const inf = rp.info[ev.id];
    if (!inf || !inf.ended) return;
    const name = ST.teamName(g, inf.winner);
    if (inf.match) ctx.say(`試合終了：${name}の勝ち（セット ${inf.sets[0]}−${inf.sets[1]}）。≡ メニューの「試合を終える」で集計`, 'ok', 10000, { label: '試合を終える', onClick: ctx.endGame });
    else ctx.say(`第${inf.set}セット ${inf.pts[0]}−${inf.pts[1]} で${name}。次の点から第${inf.set + 1}セット（サーブ：${ST.teamName(g, rp.server)}）`, 'ok', 6000);
  }
  /* サーブを入れかえる（スタート前は、最初のサーブを選ぶ） */
  function setServer(ctx, tm, btn) {
    const g = ctx.game, sp = ctx.sport;
    if (!g.startedAt) { g.opts.first = tm; ctx.save(); ctx.update(); return; }
    if (g.endedAt) { ctx.say('試合は終わっています', 'warn'); return; }
    const rp = sp.replay(g);
    if (rp.server === tm) { ctx.say(`いまは${ST.teamName(g, tm)}のサーブです（入れかえるときは、相手の帯の 🏐）`, 'warn', 4000); return; }
    const ev = ctx.record({ type: 'srv', team: tm }, btn, { key: 'srv:' + tm });
    if (ev) ctx.say(`サーブを${ST.teamName(g, tm)}に入れかえました`, 'ok', 3500);
  }

  /* スタート前の札：最初のサーブを選ぶ */
  function coverExtra(ctx) {
    const g = ctx.game;
    const first = g.opts.first || 0;
    return h('div', { class: 'firstsrv' }, h('b', null, '最初のサーブ：'),
      [0, 1].map((tm) => h('button', { class: 'btn small fsb' + (first === tm ? ' on' : ''), id: 'btnFirst' + tm, 'aria-pressed': String(first === tm), style: { '--tc': g.teams[tm].color }, onclick: () => { g.opts.first = tm; const pr = ctx.sprefs; pr.opts = Object.assign({}, g.opts); ctx.savePrefs(); ctx.save(); ctx.update(); } },
        first === tm ? '🏐 ' : '', ST.teamName(g, tm))));
  }
  /* 試合のあとの札：セットの数と、セットごとの点 */
  function endSummary(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const rp = sp.replay(g);
    return h('div', { class: 'endvb' },
      h('div', { class: 'endscore' }, h('span', null, ST.teamName(g, 0)), h('b', null, `${rp.sets[0]} − ${rp.sets[1]}`), h('span', null, ST.teamName(g, 1))),
      rp.log.length ? h('p', { class: 'note' }, rp.log.map((x) => `第${x.set}セット ${x.pts[0]}−${x.pts[1]}`).join('・')) : null);
  }

  /* セットの小窓（上の帯の「第1セット」） */
  function openSets(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const rp = sp.replay(g);
    const o = g.opts;
    const body = h('div', { class: 'periodbox' },
      setTable(g, rp),
      g.startedAt && !rp.done ? h('p', null, `いま：第${rp.set}セット ${rp.pts[0]}−${rp.pts[1]}・サーブ ${ST.teamName(g, rp.server)}（目標 ${sp.target(o, rp.set)}点）`) : null,
      g.startedAt && !g.endedAt && !rp.done ? h('button', { class: 'btn', id: 'btnSwapSrv', onclick: () => { s.close(); setServer(ctx, 1 - rp.server); } }, `🏐 サーブを${ST.teamName(g, 1 - rp.server)}に入れかえる`) : null,
      h('p', { class: 'note' }, `セットは記録から自動で決まります（${(sp.FMT[o.fmt] || sp.FMT['6']).name}：${sp.target(o, 1)}点${o.sets > 1 && sp.target(o, o.sets) !== sp.target(o, 1) ? '・最終セット' + sp.target(o, o.sets) + '点' : ''}${o.deuce ? '・2点差がつくまで' : ''}）。サーブ権も、ラリーを取ったチームに自動で移ります。違うときは、チームの帯の 🏐 で入れかえます。`));
    const s = ST.ui.sheet({ title: rp.done ? '試合終了' : `第${rp.set}セット`, body });
  }
  function setTable(g, rp) {
    const cols = rp.log.map((x) => ({ label: `第${x.set}セット`, pts: x.pts, win: x.winner }));
    if (!rp.done && (rp.pts[0] || rp.pts[1] || !rp.log.length)) cols.push({ label: `第${rp.set}セット（途中）`, pts: rp.pts, cur: true });
    const chip = (tm) => h('i', { class: 'chip', style: { background: g.teams[tm].color } });
    return h('div', { class: 'boxwrap' }, h('table', { class: 'per vsets', id: 'setTable' },
      h('thead', null, h('tr', null, h('th', null, ''), cols.map((c) => h('th', null, c.label)), h('th', null, 'セット'))),
      h('tbody', null, [0, 1].map((tm) => h('tr', null, h('th', null, chip(tm), ST.teamName(g, tm)),
        cols.map((c) => h('td', { class: c.win === tm ? 'won' : null }, String(c.pts[tm]))), h('td', { class: 'sum' }, String(rp.sets[tm])))))));
  }

  /* ---------- 番号を足す ---------- */
  function openKeypad(ctx, L, tm) {
    const g = ctx.game;
    let val = '';
    const disp = h('div', { class: 'kdisp', id: 'kdisp' }, '　');
    const show = () => { disp.textContent = val ? '#' + val : '番号を入れる'; disp.classList.toggle('empty', !val); };
    const press = (k) => {
      if (k === '⌫') val = val.slice(0, -1);
      else if (k === '00') val = '00';
      else if (val === '00' || val.length >= 2) val = k;
      else val = val === '0' ? k : val + k;
      show();
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'];
    const s = ST.ui.sheet({
      title: `${ST.teamName(g, tm)} の背番号を足す`, cls: 'keypad',
      body: h('div', null, disp, h('div', { class: 'keys' }, keys.map((k) => h('button', { class: 'key', dataset: { key: k }, onclick: () => press(k) }, k))),
        h('p', { class: 'note' }, '足した番号の行が、番号の順のところに入ります。')),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn primary', id: 'btnKeyOk', onclick: () => {
        const no = ST.normNo(val);
        if (no == null) { ST.ui.toast('0〜99 の番号を入れてください', 'warn'); return; }
        const t = g.teams[tm];
        const had = t.players.some((p) => p.no === no);
        if (!had) t.players = ST.cleanPlayers(t.players.concat([{ no, name: '' }]));
        ctx.save();
        s.close();
        L.fillRoster(tm);
        ctx.say(had ? `#${no} はもう並んでいます` : `#${no} を足しました`, had ? 'warn' : 'ok');
      } }, '足す')]
    });
    show();
  }

  /* ---------- 一覧で直す：サーブ権の記録は、チームを入れかえられる ---------- */
  function editExtra(ctx, e, body, changed) {
    if (e.type !== 'srv') return;
    const g = ctx.game;
    body.append(h('div', { class: 'field' }, h('span', null, 'ここからサーブするチーム'), h('div', { class: 'row' },
      [0, 1].map((tm) => h('button', { class: 'btn' + (e.team === tm ? ' on' : ''), dataset: { eteam: String(tm) }, onclick: () => { if (e.team !== tm) { e.team = tm; changed(); } } },
        h('i', { class: 'chip', style: { background: g.teams[tm].color } }), ST.teamName(g, tm))))));
  }

  /* ---------- 設定：「？」の行 ---------- */
  function settings(ctx, refresh) {
    const pr = ctx.sprefs;
    return h('section', { class: 'field' }, h('span', null, '「？」の行'),
      h('label', { class: 'chk' }, h('input', { type: 'checkbox', dataset: { pref: 'unknown' }, checked: pr.unknown !== false, onchange: (ev) => { pr.unknown = ev.target.checked; ctx.savePrefs(); refresh(); } }),
        '「？」の行を出す（だれか分からないときに、チームだけで記録する）'));
  }

  /* ---------- 集計 ---------- */
  function stats(ctx, g) {
    const sp = ST.sportOf(g);
    const st = sp.stats(g);
    const rp = st.rp;
    const chip = (tm) => h('i', { class: 'chip', style: { background: g.teams[tm].color } });
    const cols = sp.COLS.filter((c) => c.key === 'pts' || st.teams.some((x) => c.f(x.total)));
    const table = (x) => {
      const rows = x.rows.filter((r) => !sp.isEmpty(r));
      const idle = x.rows.filter((r) => sp.isEmpty(r));
      const line = (cls, no, nm, s) => h('tr', { class: cls }, h('td', { class: 'no' }, no), h('td', { class: 'nm' }, nm), cols.map((c) => h('td', null, c.f(s) ? String(c.f(s)) : '')));
      return h('div', { class: 'boxwrap' }, h('table', { class: 'box' },
        h('thead', null, h('tr', null, h('th', null, '#'), h('th', { class: 'nm' }, '名前'), cols.map((c) => h('th', null, c.label)))),
        h('tbody', null,
          rows.map((r) => line(null, r.no, r.name || '', r)),
          !sp.isEmpty(x.unknown) ? line('unk', '—', '番号なし', x.unknown) : null,
          !sp.isEmpty(x.teamRow) ? line('unk', '—', 'チーム', x.teamRow) : null,
          line('tot', '', '合計', x.total))),
        idle.length ? h('p', { class: 'note' }, `記録なし：${idle.map((r) => '#' + r.no).join(' ')}`) : null);
    };
    const rally = (x) => h('div', { class: 'rally' },
      h('span', null, `取ったラリー ${x.won}`),
      h('span', null, `サイドアウト率 ${ST.pct(x.recv.won, x.recv.n)}（${x.recv.won}/${x.recv.n}）`),
      h('span', null, `ブレイク率 ${ST.pct(x.serve.won, x.serve.n)}（${x.serve.won}/${x.serve.n}）`),
      h('span', null, `相手のミスでの得点 ${x.oppErr}`),
      Object.keys(x.tos).length ? h('span', null, `タイムアウト ${Object.keys(x.tos).sort().map((s) => `第${s}セット ${x.tos[s]}`).join('・')}`) : null);
    const tl = ST.tally(g);
    const free = (sp.globalTypes || []).filter((x) => tl['-::' + x]).map((x) => `${sp.TYPE[x].label} ${tl['-::' + x]}`).join('・');
    return h('div', null,
      setTable(g, rp),
      st.teams.map((x) => h('section', { class: 'teamstat' },
        h('h3', null, chip(x.team), ST.teamName(g, x.team), h('small', null, ` セット ${rp.sets[x.team]}・得点 ${x.won}`)),
        rally(x),
        table(x))),
      free ? h('section', { class: 'teamstat free' }, h('h3', null, h('i', { class: 'chip neutral' }), 'チームなし'), h('p', { class: 'freeline' }, free)) : null,
      h('p', { class: 'note' }, '得点は、アタック・ブロック・サーブエース（と、チームの行の「得点」）。ミスは相手の点になった数です。サイドアウト率は相手のサーブのラリーを取った割合、ブレイク率は自分のサーブのラリーを取った割合です。'));
  }

  ST.addView('volley', { build, stats, coverExtra, endSummary, editExtra, settings });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/v/tennis.js */
/* スポーツ タップ記録 — テニスの画面（試合の準備・記録の画面・集計）
   上の帯：時計・いまのセットと呼び名（デュース・アドバンテージ・タイブレーク …）・メニュー
   スコア：側ごとに、セットごとのゲーム数と、いまのゲームのポイント（大きく）。● がサーブする側
   2つの側：選手の行（エース・ウィナー・ミス・DF。設定でフォルト）と、側の「ポイント」（理由なし）。選手の行は少ない（1〜2行）ので、ボタンは大きく
   下の帯：★ あとで見る・いま記録したもの（そのあとのポイント）・取り消す */
(function (root) {
  'use strict';
  const ST = root.ST;
  const { h } = ST.ui;
  const SP = () => ST.SPORTS.tennis;

  /* ========== 試合の準備 ========== */
  /* 選手の人数をそろえる（シングルス 1人・ダブルス 2人。no は '1'・'2'） */
  function normalize(T) {
    const n = (T.opts || {}).fmt === 'double' ? 2 : 1;
    T.teams.forEach((t) => {
      const old = t.players || [];
      t.players = Array.from({ length: n }, (_, i) => ({ no: String(i + 1), name: ((old.find((p) => p.no === String(i + 1)) || old[i] || {}).name || '').trim().slice(0, 12) }));
    });
    T.serve = SP().cleanServe(T.serve);
    if (n === 1) T.serve.p = ['1', '1'];
  }
  function setup(ctx, T, o) {
    const sp = ctx.sport;
    normalize(T);
    const box = h('div', { class: 'tn-setup' });
    const changed = () => { if (o && o.changed) o.changed(); };
    function render() {
      box.innerHTML = '';
      box.append(
        h('p', { class: 'lead' }, '選手の名前（なくても大丈夫）と、最初にサーブする人を選びます。下の「試合の形式」で、硬式・ソフトテニス、シングルス・ダブルスを選べます。'),
        h('div', { class: 'teams2' }, [0, 1].map(sideCard)),
        serveCard());
    }
    function sideCard(i) {
      const t = T.teams[i];
      const dbl = T.opts.fmt === 'double', soft = T.opts.kind === 'soft';
      const card = h('section', { class: 'card teamcard tn-side', id: 'tside' + i, style: { '--tc': t.color, '--tink': ST.inkOn(t.color) } });
      const head = h('b', null, '');
      const label = () => { head.textContent = sp.sideName({ teams: T.teams, opts: T.opts }, i); };
      label();
      card.append(h('div', { class: 'tc-head' }, h('span', { class: 'tc-band' }, i ? '相手の側' : '自分の側'), head));
      const saved = ST.store.teams('tennis').filter((x) => (x.players || []).length && x.name !== t.name);
      if (saved.length) {
        card.append(h('div', { class: 'savedrow' }, h('span', { class: 'note' }, '前の選手から：'),
          saved.slice(0, 8).map((x) => h('button', { class: 'btn small chipbtn', onclick: () => {
            Object.assign(t, { name: x.name, color: x.color, colorName: x.colorName, players: (x.players || []).map((p) => ({ no: p.no, name: p.name })) });
            normalize(T); changed(); render();
          } }, h('i', { class: 'chip', style: { background: x.color } }), x.name, h('small', null, ' ' + (x.players || []).map((p) => p.name).filter(Boolean).join('・'))))));
      }
      t.players.forEach((p, k) => {
        card.append(h('label', { class: 'field' }, h('span', null, dbl ? `${k + 1}人目の名前${soft ? (k ? '（後衛 など）' : '（前衛 など）') : ''}` : '選手の名前'),
          h('input', { type: 'text', class: 'tpname', dataset: { side: i, no: p.no }, maxlength: 12, placeholder: '名前・ニックネーム（なくてもOK）', value: p.name || '',
            onchange: (e) => { p.name = e.target.value.trim().slice(0, 12); changed(); label(); refreshServe(); } })));
      });
      card.append(h('label', { class: 'field' }, h('span', null, '学校・チーム名（なくてもOK）'),
        h('input', { type: 'text', class: 'tname', maxlength: 20, placeholder: i ? '例：○○中' : '例：致遠館', value: t.name || '',
          onchange: (e) => { t.name = e.target.value.trim(); changed(); label(); refreshServe(); } })));
      const sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': '色' });
      ST.COLORS.forEach((c) => {
        const on = t.color.toLowerCase() === c.hex.toLowerCase();
        sw.append(h('button', { class: 'sw' + (on ? ' on' : ''), style: { background: c.hex }, title: c.name, 'aria-label': c.name, role: 'radio', 'aria-checked': on ? 'true' : 'false', dataset: { color: c.name },
          onclick: () => { t.color = c.hex; t.colorName = c.name; changed(); render(); } }));
      });
      card.append(h('div', { class: 'field' }, h('span', null, `色（画面での見分け）：${t.colorName}`), sw));
      if (T.teams[0].color.toLowerCase() === T.teams[1].color.toLowerCase()) card.append(h('p', { class: 'note warn' }, '⚠ 自分と相手が同じ色です。見分けやすいように、どちらかを変えてください。'));
      return card;
    }
    let serveBox = null;
    function serveCard() {
      serveBox = h('section', { class: 'card tn-serve', id: 'serveCard' });
      fillServe();
      return serveBox;
    }
    /* 名前を変えたとき：最初のサーブのボタンを作り直さず、名前の文字だけを書き換える
       （名前の欄からボタンへ指を動かした瞬間に作り直すと、そのボタンのタップが消えてしまうため） */
    function refreshServe() {
      if (!serveBox) return;
      const g = { teams: T.teams, opts: T.opts };
      serveBox.querySelectorAll('[data-lab]').forEach((el) => {
        const [s, no] = el.dataset.lab.split(':');
        el.textContent = no ? sp.pName(g, Number(s), no) : sp.sideName(g, Number(s));
      });
    }
    function fillServe() {
      const g = { teams: T.teams, opts: T.opts };
      const dbl = T.opts.fmt === 'double', soft = T.opts.kind === 'soft';
      serveBox.innerHTML = '';
      serveBox.append(h('h2', null, '最初のサーブ'));
      const pick = (side, no) => { T.serve.side = side; if (no) T.serve.p[side] = no; changed(); fillServe(); };
      const btn = (side, no, label) => h('button', { class: 'btn' + (T.serve.side === side && (!no || T.serve.p[side] === no) ? ' on' : ''), dataset: { serve: side + ':' + (no || '') }, onclick: () => pick(side, no) },
        h('i', { class: 'chip', style: { background: T.teams[side].color } }), h('span', { dataset: { lab: side + ':' + (no || '') } }, label));
      if (dbl && !soft) {
        serveBox.append(h('div', { class: 'row' }, [0, 1].map((s) => T.teams[s].players.map((p) => btn(s, p.no, sp.pName(g, s, p.no))))));
        const other = 1 - T.serve.side;
        serveBox.append(h('div', { class: 'field' }, h('span', null, h('span', { dataset: { lab: other + ':' } }, sp.sideName(g, other)), 'の側で、最初にサーブする人'),
          h('div', { class: 'row' }, T.teams[other].players.map((p) => h('button', { class: 'btn small' + (T.serve.p[other] === p.no ? ' on' : ''), dataset: { serve2: p.no }, onclick: () => { T.serve.p[other] = p.no; changed(); fillServe(); } }, h('span', { dataset: { lab: other + ':' + p.no } }, sp.pName(g, other, p.no)))))));
        serveBox.append(h('p', { class: 'note' }, 'サーブする人は、その側のサービスゲームごとに交代する目安で出します（セットの途中で順番を変えたときは、目安と違うことがあります）。'));
      } else {
        serveBox.append(h('div', { class: 'row' }, [0, 1].map((s) => btn(s, null, sp.sideName(g, s)))));
        serveBox.append(h('p', { class: 'note' }, '最初のゲームでサーブする側。そのあとは、ゲームごとに自動で交代します。'));
      }
    }
    render();
    // 形式（シングルス・ダブルス・硬式・ソフトテニス）を変えたら、選手の欄を作り直す
    sp.onOpts = (T2, key) => { if (T2 !== T) return; if (key === 'fmt' || key === 'kind') { normalize(T); changed(); render(); } };
    // 「試合の形式」の欄を、選手の欄より上へ（シングルス・ダブルスを先に選べるように）
    Promise.resolve().then(() => { const oc = document.getElementById('optsCard'); if (oc && box.parentNode && oc.parentNode === box.parentNode) box.parentNode.insertBefore(oc, box); });
    return box;
  }

  /* ========== 記録の画面 ========== */
  function build(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const L = { btns: [], sides: [] };
    const clock = ctx.ui.clockBtn();
    const startB = ctx.ui.startBtn();
    L.phase = h('small', { class: 'tphase' }, '');
    L.call = h('b', { class: 'tcallv', id: 'tCall' }, '');
    const bar = h('header', { class: 'lbar' }, clock.el, startB.el, h('div', { class: 'tcall', 'aria-live': 'polite' }, L.phase, L.call), ctx.ui.menuBtn());
    // スコア（側ごとの行：サーブの印・名前・セットごとのゲーム・いまのポイント）
    L.board = h('div', { class: 'tboard', id: 'tBoard', role: 'group', 'aria-label': 'スコア' });
    L.brows = [0, 1].map((s) => {
      const dot = h('i', { class: 'tbdot', 'aria-hidden': 'true' });
      const name = h('span', { class: 'tbname' }, h('i', { class: 'chip', style: { background: g.teams[s].color } }), h('span', { class: 'tbn' }, sp.sideName(g, s)));
      const sets = h('span', { class: 'tbsets' });
      const pt = h('b', { class: 'tbpt', id: 'tPt' + s, style: { '--tc': g.teams[s].color, '--tink': ST.inkOn(g.teams[s].color) } }, '0');
      const row = h('div', { class: 'tbrow', dataset: { side: s } }, dot, name, sets, pt);
      L.board.append(row);
      return { row, dot, sets, pt };
    });
    const types = () => sp.base.concat(isOn(ctx.sprefs, 'flt') ? ['flt'] : []);
    const panels = L.panelsEl = h('main', { class: 'tpanels' }, [0, 1].map(buildSide));
    function buildSide(s) {
      const t = g.teams[s];
      const tsv = h('span', { class: 'tsv' }, '🎾 サーブ');
      const tw = h('span', { class: 'tsw' }, '');
      const body = h('div', { class: 'tsbody' });
      const sec = h('section', { class: 'tside', id: 'tside' + s, dataset: { side: s }, style: { '--tc': t.color, '--tink': ST.inkOn(t.color) } },
        h('div', { class: 'tshead' }, h('b', { class: 'tsname' }, sp.sideName(g, s)), tsv, tw), body);
      const ts = types();
      t.players.forEach((p) => {
        const row = h('div', { class: 'tprow', dataset: { no: p.no }, style: { '--tk': ts.length } }, h('div', { class: 'tpn' }, h('b', null, sp.pName(g, s, p.no))));
        ts.forEach((type) => row.append(btn(s, p.no, type)));
        body.append(row);
      });
      const prow = h('div', { class: 'tprow tptrow' }, btn(s, null, 'pt'));
      body.append(prow);
      L.sides[s] = { sec, tsv, tw };
      return sec;
    }
    function btn(s, no, type) {
      const d = sp.TYPE[type];
      const cnt = h('i', { class: 'cnt', hidden: true });
      const label = type === 'pt' ? `${sp.sideName(g, s)} のポイント（理由なし）` : `${sp.pName(g, s, no)} ${d.label}`;
      const el = h('button', { class: 'tb k-' + d.kind + (d.kind === 'miss' ? ' miss' : '') + (type === 'pt' ? ' ptb' : ''), dataset: { type, no: no || '' }, style: { '--bc': d.col }, 'aria-label': label },
        h('b', null, type === 'pt' ? 'ポイント' : d.btn), h('small', null, type === 'pt' ? `${sp.sideName(g, s)}（理由なし）` : d.sub), cnt);
      L.btns.push({ side: s, type, key: s + ':' + (no || '') + ':' + type, el, cnt, serve: !!d.serve });
      return el;
    }
    const mark = (() => {
      const cnt = h('i', { class: 'cnt', hidden: true });
      const el = h('button', { class: 'gb k-mark', id: 'btn_mark', 'aria-label': '★ あとで見る（ポイントにはしない）', onclick: (e) => ctx.record({ type: 'mark', team: null, no: null }, e.currentTarget) }, h('b', null, '★'), h('small', null, 'あとで見る'), cnt);
      L.markCnt = cnt;
      return el;
    })();
    const rootEl = h('div', { class: 'live fam-tennis' }, bar, L.board, h('div', { class: 'stagewrap' }, panels, ctx.ui.cover()), ctx.ui.footer([mark]));
    rootEl.addEventListener('click', (e) => onClick(e));
    L.root = rootEl;

    function onClick(e) {
      const b = e.target.closest('button.tb');
      if (!b) return;
      const sec = b.closest('.tside');
      if (!sec) return;
      const s = Number(sec.dataset.side), type = b.dataset.type, no = b.dataset.no || null;
      const d = sp.TYPE[type];
      if (!ctx.canRecord()) return;
      const before = sp.replay(g);
      if (before.over && d.to) { ctx.say(`試合は決まっています（${sp.sideName(g, before.winner)}の勝ち）`, 'warn', 6000, { label: '試合を終える', onClick: ctx.endGame }); return; }
      if (d.serve && before.server !== s) { ctx.say(`サーブする側のボタンです（いまのサーブは ${sp.sideName(g, before.server)}）`, 'warn', 3500); return; }
      const nBefore = { k: before.k, sets: before.sets.length, over: before.over, tb: before.tb };
      if (ctx.S.msg && ctx.S.msg.kind === 'warn') ctx.S.msg = null;      // 前の注意（受ける側のエース など）は消して、いま記録したものを見せる
      const ev = ctx.record({ type, team: s, no }, b);
      if (!ev || !d.to) return;
      const st = sp.replay(g), sn = st.snap[ev.id];
      if (!sn || !sn.res) return;
      const names = [sp.sideName(g, 0), sp.sideName(g, 1)];
      const change = st.R.soft ? 'サイドチェンジ' : 'チェンジコート';
      if (sn.res.match) {
        ctx.feel('made');
        ctx.say(`試合終了：${names[sn.winner]}の勝ち（${st.R.soft ? `${st.g[0]}−${st.g[1]}` : sp.setsText(st)}）`, 'ok', 12000, { label: '試合を終える', onClick: ctx.endGame });
      } else if (sn.res.set) {
        const last = st.sets[st.sets.length - 1];
        const odd = (last.g[0] + last.g[1]) % 2 === 1 && !last.mtb;
        ctx.say(`第${st.sets.length}セット：${names[sn.winner]}（${sp.setText(last)}）${odd ? '・' + change : ''}${st.tb === 'mtb' ? '・次はマッチタイブレーク' : ''}`, 'ok', 6000);
      } else if (sn.res.game) {
        const odd = (st.g[0] + st.g[1]) % 2 === 1;
        ctx.say(`ゲーム：${names[sn.winner]}（${st.g[0]}−${st.g[1]}）${odd ? '・' + change : ''}${st.tb && !nBefore.tb ? '・' + sp.callText(st.R, [0, 0], st.tb, names) : ''}`, 'ok', 4000);
      } else if (st.tb && (st.p[0] + st.p[1]) % 6 === 0) {
        ctx.say(`${sp.pointText(st.R, st.p, st.tb)}・${change}`, 'ok', 3500);
      }
    }

    function layout() {
      if (!rootEl.isConnected) return;
      rootEl.classList.toggle('short', (rootEl.clientHeight || root.innerHeight) < 430);
      const W = panels.clientWidth, H = panels.clientHeight;
      const wide = W > H * 1.05;
      panels.classList.toggle('wide', wide);
      const rows = g.teams[0].players.length + 0.75;
      const sideW = wide ? (W - 14) / 2 : W - 8;
      const sideH = wide ? H - 4 : (H - 10) / 2;
      const head = 26;
      const rowH = Math.min(190, (sideH - head - 8 - (rows - 1) * 4) / rows);
      const k = types().length;
      const nw = Math.round(ST.clamp(sideW * 0.17, 56, 130));
      const bw = (sideW - 8 - nw - k * 4) / k;
      const tf = Math.round(ST.clamp(Math.min(rowH * 0.34, (bw - 8) / 4.3), 13, 30));
      panels.style.setProperty('--tf', tf + 'px');
      panels.style.setProperty('--tnw', nw + 'px');
      panels.classList.toggle('lowrow', rowH < 52);
    }
    function isOn(pr, key) { const r = (pr && pr.rows) || {}; return !!r[key]; }

    let lastClock = '';
    function tick() {
      const s = ST.fmtTime(ctx.elapsed());
      if (s !== lastClock) { lastClock = s; clock.set(s); }
    }
    function update() {
      startB.update();
      lastClock = '';
      tick();
      const st = sp.replay(g);
      const names = [sp.sideName(g, 0), sp.sideName(g, 1)];
      const started = !!g.startedAt;
      // 上の帯：いまのセット・呼び名（なければ、サーブする人）
      L.phase.textContent = st.over ? '試合終了' : st.R.soft ? `${st.R.matchGames}ゲームマッチ` : `第${st.sets.length + 1}セット${st.R.sets > 1 ? `（${st.R.sets}セットマッチ）` : ''}`;
      const call = st.over ? `${names[st.winner]}の勝ち` : sp.callText(st.R, st.p, st.tb, names) || (st.serverNo ? `サーブ：${sp.pName(g, st.server, st.serverNo)}` : `サーブ：${names[st.server]}`);
      L.call.textContent = call;
      L.call.classList.toggle('hot', !st.over && /デュース|アドバンテージ|デサイディング/.test(call));
      // スコア
      const cells = sp.pointCells(st.R, st.p, st.tb);
      [0, 1].forEach((s) => {
        const B = L.brows[s];
        B.row.classList.toggle('serving', !st.over && st.server === s);
        B.row.classList.toggle('winner', st.over && st.winner === s);
        B.sets.innerHTML = '';
        if (st.R.soft) B.sets.append(h('span', { class: 'tbset cur' }, String(st.g[s])));
        else {
          st.sets.forEach((x) => {
            const won = x.g[s] > x.g[1 - s];
            B.sets.append(h('span', { class: 'tbset' + (won ? ' won' : '') }, x.mtb ? String(x.tb[s]) : String(x.g[s]), x.tb && !x.mtb && !won ? h('sup', null, String(x.tb[s])) : null));
          });
          if (!st.over) B.sets.append(h('span', { class: 'tbset cur' }, String(st.g[s])));
        }
        B.pt.textContent = st.over ? (st.winner === s ? '勝ち' : '') : cells[s];
        B.pt.classList.toggle('adv', cells[s] === 'AD');
        B.pt.classList.toggle('tbn', !!st.tb);
        const S = L.sides[s];
        S.sec.classList.toggle('serving', started && !st.over && st.server === s);
        S.tw.textContent = st.R.soft ? `ゲーム ${st.g[s]}` : `セット ${st.sw[s]}・ゲーム ${st.over ? '' : st.g[s]}`;
      });
      // ボタン：回数・サーブする側だけのボタン（エース・DF・フォルト）
      const tl = ST.tally(g);
      L.btns.forEach((b) => {
        setCnt(b.cnt, tl[b.key] || 0);
        if (b.serve) b.el.classList.toggle('off', !st.over && st.server !== b.side);
        b.el.classList.toggle('done', st.over && !!sp.TYPE[b.type].to);
      });
      setCnt(L.markCnt, tl['*:mark'] || 0);
    }
    L.update = update;
    L.layout = layout;
    L.tick = tick;
    L.refresh = () => update();
    return L;
  }
  function setCnt(el, n) {
    const s = n ? String(n) : '';
    if (el.textContent !== s) el.textContent = s;
    el.hidden = !n;
  }

  /* スタート前の札：最初のサーブ */
  function coverExtra(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const st = sp.replay(g);
    const who = st.serverNo ? sp.pName(g, st.server, st.serverNo) : sp.sideName(g, st.server);
    return h('p', { class: 'note' }, `最初のサーブ：${who}（変えるときは ≡ メニュー →「選手・形式を直す」）`);
  }
  /* 試合のあとの札 */
  function endSummary(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const st = sp.replay(g);
    return h('div', { class: 'endscore tn-end' },
      h('span', null, sp.sideName(g, 0)), h('b', null, st.R.soft ? `${st.g[0]} − ${st.g[1]}` : sp.setsText(st) || `${st.g[0]} − ${st.g[1]}`), h('span', null, sp.sideName(g, 1)));
  }

  /* 記録を直す：側と選手（名前で選ぶ） */
  function editExtra(ctx, e, body, changed) {
    const g = ctx.game, sp = ctx.sport;
    const d = sp.TYPE[e.type];
    if (!d || d.global) return;

  /* ========== 集計 ========== */
  function stats(ctx, g) {

      if (x.sideOnly.c.pt) rows.push(h('tr', { class: 'unk' }, h('td', { class: 'nm' }, 'ポイント（理由なし）'), cols.map(() => h('td', null, '')), h('td', null, String(x.sideOnly.c.pt))));
      const line = [`取ったポイント ${x.won}`, `サーブのポイント ${x.serveWon}/${x.servePts}（${ST.pct(x.serveWon, x.servePts)}）`]
        .concat(fault ? [`1stサーブ ${x.firstIn}/${x.firstSv}（${ST.pct(x.firstIn, x.firstSv)}）`] : [])
        .concat([`サービスゲームのキープ ${x.held}/${x.svcGames}`, `ブレイク ${x.breaks}`]).join('・');
      return h('section', { class: 'teamstat' },
        h('h3', null, chip(x.side), x.name, h('small', null, ' ' + line)),

          h('tbody', null, rows,
            h('tr', { class: 'tot' }, h('td', { class: 'nm' }, '合計'), cols.map(([k]) => h('td', null, x.total.c[k] ? String(x.total.c[k]) : '')), x.sideOnly.c.pt ? h('td', null, String(x.sideOnly.c.pt)) : null)))));
    };
    return h('div', null, board, S.map(side),
      h('p', { class: 'note' }, 'エース・ウィナーはその側のポイント、ミス・DF（ダブルフォルト）は相手の側のポイントです。' + (fault ? '1stサーブは「フォルト」のボタンを押さなかったポイント（DF は 1stサーブもフォルト）を、入ったものとして数えます。' : '1stサーブの入った割合は、設定で「フォルト」のボタンを出すと出ます。') + 'キープ＝自分のサービスゲームを取った数、ブレイク＝相手のサービスゲームを取った数（タイブレーク・ファイナルゲームは入れません）。'));
  }

  ST.addView('tennis', { setup, build, stats, editExtra, coverExtra, endSummary });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/v/baseball.js */
/* スポーツ タップ記録 — 野球の画面（試合の準備・記録の画面・集計）
   記録の画面：
     上の帯：時計・いまのイニング（押すとチェンジ・打順を直す など）・カウント（B・S・O）・得点（▲ が攻撃中）・メニュー
     状況：いまの打者（押すと代打・打順を直す）・走者のダイヤモンド（塁を押すと置く・消す）・投手と投球数（押すと交代）

(function (root) {

        h('div', { class: 'teams2' }, [0, 1].map((i) => teamCard(i))),

        t.order = rows.length;
        o.changed();
        const dup = rows.filter((r) => ST.normNo(r.no) != null).length !== t.players.length;

        fillPitcher();
      };
      const countText = () => `打順：${rows.length}人${t.players.length < rows.length ? `（背番号を入れたのは ${t.players.length}人）` : ''}`;

          saved.slice(0, 8).map((x) => h('button', { class: 'btn small chipbtn', onclick: () => { Object.assign(t, { name: x.name, color: x.color, colorName: x.colorName, players: ST.cleanPlayers(x.players, true) }); ROWS.delete(t); o.changed(); draw(); } },
            h('i', { class: 'chip', style: { background: x.color } }), x.name, h('small', null, ` ${x.players.length}人`)))));
      }
      card.append(h('label', { class: 'field' }, h('span', null, 'チーム名'),
        h('input', { type: 'text', class: 'tname', maxlength: 20, placeholder: i ? '例：○○中（なくてもOK）' : '例：致遠館（なくてもOK）', value: t.name || '',
          onchange: (e) => { t.name = e.target.value.trim(); o.changed(); headName.textContent = label(); refreshTop(); } })));
      const sw = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'ユニフォームの色' });
      ST.COLORS.forEach((c) => {
        const on = t.color.toLowerCase() === c.hex.toLowerCase();
        sw.append(h('button', { class: 'sw' + (on ? ' on' : ''), style: { background: c.hex }, title: c.name, 'aria-label': c.name, role: 'radio', 'aria-checked': on ? 'true' : 'false', dataset: { color: c.name },
          onclick: () => { t.color = c.hex; t.colorName = c.name; o.changed(); draw(); } }));
      });
      card.append(h('div', { class: 'field' }, h('span', null, `ユニフォームの色：${t.colorName}`), sw));
      if (T.teams[0].color.toLowerCase() === T.teams[1].color.toLowerCase()) card.append(h('p', { class: 'note warn' }, '⚠ 自分と相手が同じ色です。見分けやすいように、どちらかを変えてください。'));
      // 打順
      const count = h('span', { class: 'bb-count' }, '');
      const warn = h('p', { class: 'note warn', hidden: true }, '⚠ 同じ背番号が2つあります（あとのほうは打順に入りません）');
      const list = h('div', { class: 'bb-order', role: 'group', 'aria-label': '打順' });
      rows.forEach((r, k) => {

          h('b', { class: 'bb-slot' }, `${k + 1}番`),
          h('input', { type: 'text', class: 'bb-no', inputmode: 'numeric', maxlength: 2, placeholder: '背番号', value: r.no || '', 'aria-label': `${k + 1}番の背番号`,
            onchange: (e) => { const v = ST.normNo(e.target.value); r.no = v || ''; e.target.value = r.no; sync(); } }),
          h('input', { type: 'text', class: 'bb-nm', maxlength: 12, placeholder: '名前（なくてもOK）', value: r.name || '', 'aria-label': `${k + 1}番の名前`,
            onchange: (e) => { r.name = e.target.value.trim().slice(0, 12); sync(); } })));
      });
      card.append(h('div', { class: 'field' }, count,
        h('div', { class: 'row presets' },
          h('button', { class: 'btn small', dataset: { fill: 'seq' }, onclick: () => { rows.forEach((r, k) => { r.no = String(k + 1); }); sync(); draw(); } }, `背番号 1〜${rows.length} を順に`),
          h('button', { class: 'btn small', id: 'bbAdd' + i, onclick: () => { if (rows.length < 20) rows.push({ no: '', name: '' }); sync(); draw(); } }, '打順を1人足す'),
          rows.length > 1 ? h('button', { class: 'btn small', onclick: () => { rows.pop(); sync(); draw(); } }, '最後の打順を消す') : null,
          h('button', { class: 'btn small', onclick: () => { rows.forEach((r) => { r.no = ''; r.name = ''; }); sync(); draw(); } }, '全部消す')),
        list, warn));
      // 先発投手
      const pIn = h('input', { type: 'text', class: 'bb-pno', id: 'bbPitcher' + i, inputmode: 'numeric', maxlength: 2, placeholder: '背番号', value: t.pitcher || '',
        onchange: (e) => { t.pitcher = ST.normNo(e.target.value); e.target.value = t.pitcher || ''; o.changed(); fillPitcher(); } });
      const pBtns = h('div', { class: 'row bb-pbtns' });

      function fillPitcher() {
        const nos = t.players.map((p) => p.no);
        while (pBtns.children.length > nos.length) pBtns.lastChild.remove();
        nos.forEach((no, k) => {
          let b = pBtns.children[k];
          if (!b) {
            b = h('button', { class: 'btn small', onclick: (e) => { const v = e.currentTarget.dataset.pno; t.pitcher = v; pIn.value = v; o.changed(); fillPitcher(); } });
            pBtns.append(b);
          }
          b.dataset.pno = no;
          if (b.textContent !== '#' + no) b.textContent = '#' + no;
          b.classList.toggle('on', t.pitcher === no);
        });
      }
      card.append(h('div', { class: 'field' }, h('span', null, '先発投手の背番号（なくてもOK）'), h('div', { class: 'row' }, pIn), pBtns));
      count.textContent = countText();
      fillPitcher();
      warn.hidden = rows.filter((r) => ST.normNo(r.no) != null).length === t.players.length;

  }

  /* ========== 記録の画面 ========== */

    // 状況：打者・ダイヤモンド・投手
    L.bOrder = h('b', { class: 'bb-border' }, '1番');

    L.bName = h('small', { class: 'bb-bname' }, '');
    L.bNext = h('small', { class: 'bb-next' }, '');
    L.bTeam = h('small', { class: 'bb-bteam' }, '');
