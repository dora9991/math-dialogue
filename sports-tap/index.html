    const T = target(o, set);
    const hi = Math.max(p[0], p[1]), lo = Math.min(p[0], p[1]);
    if (hi < T) return false;
    return o.deuce === 0 ? true : hi - lo >= 2;
  }
  /* そのセットの、最初にサーブするチーム（1セット目は opts.first。あとは交互） */
  const firstServer = (o, set) => ((o.first || 0) + (set - 1)) % 2;

  /* ---------- 記録から、セット・点・サーブを計算する ----------
     戻り値：{ set（いまのセット）, pts（いまのセットの点）, sets（取ったセット数）, server（いまサーブするチーム）,
              log（終わったセット [{ set, pts, winner, t }]）, done（試合が決まった）, winner,
              info（記録の id → { set, pts（そのラリーのあとの点）, server（そのラリーでサーブしたチーム）, winner（点を取ったチーム）, ended（そのラリーでセットが決まった）}）,
              rallies（ラリーごと [{ server, winner, set }]） } */
  function replay(game, until) {
    const o = game.opts || {};
    const st = { set: 1, pts: [0, 0], sets: [0, 0], server: firstServer(o, 1), log: [], done: false, winner: null, info: {}, rallies: [] };
    ST.sorted(game).forEach((e) => {
      if (until != null && e.t > until + 1e-9) return;
      if (e.type === 'srv') { if (e.team === 0 || e.team === 1) st.server = e.team; return; }
      const d = TYPES_BY[e.type];
      if (!d || !d.pt || (e.team !== 0 && e.team !== 1) || st.done) { st.info[e.id] = { set: st.set, pts: st.pts.slice(), server: st.server, winner: null, after: st.done }; return; }
      const winner = d.pt === 'own' ? e.team : 1 - e.team;
      const server = st.server;
      st.pts[winner]++;
      st.rallies.push({ server, winner, set: st.set, id: e.id });
      const inf = { set: st.set, pts: st.pts.slice(), server, winner, ended: false };
      st.server = winner;
      if (setWon(o, st.set, st.pts)) {
        inf.ended = true;
        st.log.push({ set: st.set, pts: st.pts.slice(), winner, t: e.t });
        st.sets[winner]++;
        inf.sets = st.sets.slice();
        if (st.sets[winner] >= need(o)) { st.done = true; st.winner = winner; inf.match = true; }
        else { st.set++; st.pts = [0, 0]; st.server = firstServer(o, st.set); }
      }
      st.info[e.id] = inf;
    });
    return st;
  }
  const TYPES_BY = {};
  TYPES.forEach((d) => { TYPES_BY[d.id] = d; });

  /* ---------- 行のボタン ---------- */
  const isOn = (sprefs, key, def) => { const r = (sprefs && sprefs.rows) || {}; return r[key] != null ? !!r[key] : !!def; };
  function rowTypes(sprefs) {
    const out = ['atk', 'blk', 'ace'];
    if (isOn(sprefs, 'rec')) out.push('rec');
    if (isOn(sprefs, 'errs')) out.push('serr', 'aerr', 'oerr'); else out.push('err');
    return out;
  }
  const teamTypes = (sprefs) => (isOn(sprefs, 'team', true) ? ['pt', 'to'] : []);

  /* ---------- 集計 ---------- */
  function stats(game) {
    const sp = ST.SPORTS.volley;
    const rp = replay(game);
    const teams = [0, 1].map((tm) => {
      const team = game.teams[tm] || ST.blankTeam(tm);
      const byNo = new Map();
      const blank = () => ({ c: {}, pts: 0, errs: 0 });
      team.players.forEach((p) => byNo.set(p.no, Object.assign({ no: p.no, name: p.name }, blank())));
      const unknown = blank(), teamRow = blank(), total = blank();
      (game.events || []).forEach((e) => {
        const d = sp.TYPE[e.type];
        if (!d || d.meta || e.team !== tm) return;
        let s;
        if (e.no != null) {
          if (!byNo.has(e.no)) byNo.set(e.no, Object.assign({ no: e.no, name: '', extra: true }, blank()));
          s = byNo.get(e.no);
        } else s = sp.teamTypesAll.includes(e.type) ? teamRow : unknown;
        const inf = rp.info[e.id] || {};
        [s, total].forEach((x) => {
          x.c[e.type] = (x.c[e.type] || 0) + 1;
          if (d.pt === 'own' && inf.winner != null) x.pts++;
          if (d.err) x.errs++;
        });
      });
      const rows = Array.from(byNo.values()).sort((a, b) => ST.cmpNo(a.no, b.no));
      // ラリー：サーブのとき（ブレイク）・相手のサーブのとき（サイドアウト）
      const srv = rp.rallies.filter((r) => r.server === tm), rcv = rp.rallies.filter((r) => r.server !== tm);
      const brk = srv.filter((r) => r.winner === tm).length, so = rcv.filter((r) => r.winner === tm).length;
      const won = rp.rallies.filter((r) => r.winner === tm).length;
      // 相手のミスでの得点
      const oppErr = (game.events || []).filter((e) => e.team === 1 - tm && (sp.TYPE[e.type] || {}).err && (rp.info[e.id] || {}).winner === tm).length;
      const tos = {};
      (game.events || []).forEach((e) => { if (e.type === 'to' && e.team === tm) { const s = (rp.info[e.id] || {}).set || 1; tos[s] = (tos[s] || 0) + 1; } });
      return { team: tm, rows, unknown, teamRow, total, won, serve: { n: srv.length, won: brk }, recv: { n: rcv.length, won: so }, oppErr, tos };
    });
    return { rp, teams };
  }
  /* 集計の表の列 */
  const COLS = [
    { key: 'pts', label: '得点', f: (s) => s.pts },
    { key: 'atk', label: 'アタック', f: (s) => s.c.atk || 0 },
    { key: 'blk', label: 'ブロック', f: (s) => s.c.blk || 0 },
    { key: 'ace', label: 'サーブエース', f: (s) => s.c.ace || 0 },
    { key: 'rec', label: 'レシーブ', f: (s) => s.c.rec || 0 },
    { key: 'errs', label: 'ミス', f: (s) => s.errs },
    { key: 'serr', label: 'サーブミス', f: (s) => s.c.serr || 0 },
    { key: 'aerr', label: 'アタックミス', f: (s) => s.c.aerr || 0 },
    { key: 'oerr', label: 'その他ミス', f: (s) => s.c.oerr || 0 }
  ];
  const isEmpty = (s) => !Object.keys(s.c).length;

  /* ---------- 名前・CSV ---------- */
  const setScoresText = (rp) => rp.log.map((x) => `${x.pts[0]}−${x.pts[1]}`).join('・');
  function score(game) { return replay(game).sets.slice(); }
  function scoreText(game) {
    const rp = replay(game);
    if (!rp.log.length) return `${rp.pts[0]} − ${rp.pts[1]}（第${rp.set}セット）`;
    const cur = !rp.done && (rp.pts[0] || rp.pts[1]) ? `・第${rp.set}セット ${rp.pts[0]}−${rp.pts[1]}` : '';
    return `${rp.sets[0]} − ${rp.sets[1]}（${setScoresText(rp)}${cur}）`;
  }
  function eventText(game, e) {
    if (e.type === 'srv') return `サーブ権：${ST.teamName(game, e.team)}`;
    return null;
  }
  /* 記録の一覧・下の帯：「アタック決定（第1セット 12−10）」 */
  function logText(game, e) {
    const d = TYPES_BY[e.type];
    if (!d) return e.type;
    const inf = replay(game).info[e.id];
    if (!d.pt || !inf || inf.winner == null) return d.label;
    return `${d.short || d.label}（第${inf.set}セット ${inf.pts[0]}−${inf.pts[1]}）`;
  }
  function lastText(game, e) {
    const d = TYPES_BY[e.type];
    if (!d) return e.type;
    if (d.meta) return eventText(game, e);
    const inf = replay(game).info[e.id];
    if (!d.pt || !inf || inf.winner == null) return d.short || d.label;
    return `${d.short || d.label} → ${inf.pts[0]}−${inf.pts[1]}`;
  }
  function csvEvents(game) {
    const rp = replay(game);
    const n0 = ST.teamName(game, 0), n1 = ST.teamName(game, 1);
    const rows = [['No', '時刻', 'スタートからの秒', 'セット', 'チーム', '背番号', '名前', '記録', '点を取ったチーム', 'サーブしたチーム', `${n0}の点`, `${n1}の点`, 'セットが決まった']];
    let n = 0;
    ST.sorted(game).forEach((e) => {
      const d = TYPES_BY[e.type] || { label: e.type };
      const inf = rp.info[e.id] || {};
      if (d.meta) { rows.push(['', ST.fmtTime(e.t), e.t, '', ST.teamName(game, e.team), '', '', eventText(game, e), '', '', '', '', '']); return; }
      rows.push([++n, ST.fmtTime(e.t), e.t, inf.set || '', ST.teamName(game, e.team), e.no != null ? e.no : '', e.no != null ? ST.playerName(game, e.team, e.no) : '', d.label,
        inf.winner != null ? ST.teamName(game, inf.winner) : '', inf.winner != null ? ST.teamName(game, inf.server) : '',
        inf.pts ? inf.pts[0] : '', inf.pts ? inf.pts[1] : '', inf.ended ? `第${inf.set}セット終了（セット ${inf.sets[0]}−${inf.sets[1]}）` : '']);
    });
    return rows;
  }
  function csvBox(game) {
    const st = stats(game);
    const rows = [['チーム', '背番号', '名前'].concat(COLS.map((c) => c.label))];
    st.teams.forEach((x) => {
      const name = ST.teamName(game, x.team);
      x.rows.forEach((r) => rows.push([name, r.no, r.name].concat(COLS.map((c) => c.f(r)))));
      if (!isEmpty(x.unknown)) rows.push([name, '番号なし', ''].concat(COLS.map((c) => c.f(x.unknown))));
      if (!isEmpty(x.teamRow)) rows.push([name, 'チーム（得点・タイムアウト）', ''].concat(COLS.map((c) => c.f(x.teamRow))));
      rows.push([name, '合計', ''].concat(COLS.map((c) => c.f(x.total))));
    });
    rows.push([]);
    rows.push(['チーム', '取ったラリー', 'サーブのラリー', 'うち取った（ブレイク）', 'ブレイク率', '相手のサーブのラリー', 'うち取った（サイドアウト）', 'サイドアウト率', '相手のミスでの得点', 'タイムアウト']);
    st.teams.forEach((x) => rows.push([ST.teamName(game, x.team), x.won, x.serve.n, x.serve.won, ST.pct(x.serve.won, x.serve.n), x.recv.n, x.recv.won, ST.pct(x.recv.won, x.recv.n), x.oppErr, Object.values(x.tos).reduce((a, b) => a + b, 0)]));
    return rows;
  }

  ST.addSport({
    id: 'volley', name: 'バレーボール', icon: '🏐', family: 'volley', prec: 10, hasTeams: true, rowNames: true,
    desc: 'ラリーポイント。アタック・ブロック・サーブ・ミスで点とセットが自動で進む。サーブ権・サイドアウト率',
    TYPES,
    unit: '試合',
    startHint: '最初のサーブ（試合開始の笛）の瞬間',
    presets: [['1〜12', '1-12'], ['1〜14', '1-14'], ['1〜18', '1-18']],
    rosterLabel: '背番号',
    statsSub: 'セットごとの点・選手ごとの得点とミス・サイドアウト率',
    defaultOpts: () => ({ fmt: '6', sets: 3, deuce: 1, first: 0 }),
    optFields: [
      { key: 'fmt', label: '形式', choices: [['6', '6人制（25点・最終セット15点）'], ['9', '9人制（21点）'], ['j', '小学生（21点・最終セット15点）']] },
      { key: 'sets', label: 'セット数', choices: [[3, '3セットマッチ（2セット先取）'], [5, '5セットマッチ（3セット先取）'], [1, '1セットだけ']] },
      { key: 'deuce', label: '同点で目標の点に近づいたとき', choices: [[1, '2点差がつくまで（デュース）'], [0, '先に目標の点を取ったほう']] },
      { key: 'first', label: '最初のサーブ（第1セット）', choices: [[0, '自分のチーム'], [1, '相手のチーム']], note: '2セット目からは、最初のサーブを交互にします。最終セット（トスで決める）などで違うときは、記録の画面のチームの帯の「🏐」を押して入れかえます' }
    ],
    optsEditNote: '試合の途中で形式を変えると、セットの区切りも記録から計算し直します。',
    toggles: [
      { key: 'errs', label: 'ミスの種類を分ける（サーブミス・アタックミス・その他のミス）' },
      { key: 'rec', label: 'レシーブ（よいレシーブ。点は動かない）' },
      { key: 'team', label: 'チームの行（得点（理由なし）・タイムアウト）', def: true }
    ],
    togglesNote: 'いつもある：アタック・ブロック・サーブ（どれも自分の点）・ミス（相手の点）。下を選ぶと、ボタンが増えます（1つずつは少し小さくなります）。',
    teamTypesAll: ['pt', 'to'],
    globalTypes: ['mark'],
    steps: [
      ['チームと背番号を選ぶ', '「1〜12」などのボタンでまとめて。自分のチームは次から自動で入ります。相手の背番号は入れなくても大丈夫です（チームの1行になります）'],
      ['最初のサーブのチームを選んで ▶ スタート', '最初のサーブ（試合開始の笛）の瞬間に。時計が動き出します'],
      ['ラリーが終わったら、決めた選手（ミスした選手）のボタンを1回', '「7」の行の「アタック」。ミスは「ミス」（相手の点）。点・セット・サーブ権は自動で進みます'],
      ['セットが決まると、次の点から次のセット', '試合が決まったら「≡ メニュー」→「試合を終える」で集計']
    ],
    help: [['記録の画面', [
      '選手の行：「アタック」「ブロック」「サーブ」（サービスエース）は、その選手のチームの点。「ミス」は、相手の点になります',
      '「？」の行：だれか分からないとき（設定で消せます）。「チーム」の行：「得点」（理由が分からない点）・「タイムアウト」',
      '上の帯：時計の右が、いまのセット。真ん中がいまのセットの点（大きく）と、取ったセット数（小さく）。🏐 がサーブのチーム',
      '画面の下の「★ あとで見る」：だれのかは決めずに、時刻だけを残します（動画で見返すときの目印）',
      'ボタンを足す：「≡ メニュー」→「設定」で、ミスの種類（サーブミス・アタックミス・その他のミス）・レシーブを出せます'
    ]], ['セットとサーブ権', [
      'セットは、記録から自動で決まります（6人制は25点・最終セット15点、9人制は21点。2点差がつくまで）。決まると画面の下に「第1セット 25−23 で〇〇」と出て、次の点から次のセットです',
      'サーブ権も自動：ラリーを取ったチームが、次にサーブします。セットの最初のサーブは交互です',
      '最終セット（トスで決める）などで違うときは、チームの帯の「🏐」を押すと、そのチームのサーブに入れかえます（記録に残り、一覧で直せます）',
      '取り消し・一覧で直すと、点・セット・サーブ権も自動で計算し直します'
    ]], ['集計', [
      'セットごとの点、選手ごとの得点（アタック・ブロック・サーブエース）とミス',
      'サイドアウト率：相手のサーブのラリーを取った割合。ブレイク率：自分のサーブのラリーを取った割合',
      '相手のミスでの得点・タイムアウトの数（セットごと）'
    ]]],
    replay, target, setWon, firstServer, need, FMT,
    rowTypes, teamTypesOf: teamTypes, weight: () => 1,
    score, scoreText, eventText, logText, lastText,
    typeLabel: (game, e) => (TYPES_BY[e.type] || { label: e.type }).label,
    whoText: (game, e) => {
      if (e.team == null) return 'チームなし';
      const nm = e.no != null ? ST.playerName(game, e.team, e.no) : '';
      return `${ST.teamName(game, e.team)} ${e.no != null ? '#' + e.no + (nm ? ' ' + nm : '') : ['pt', 'to'].includes(e.type) ? '（チーム）' : '番号なし'}`;
    },
    editTypes: (game, e) => {
      const d = TYPES_BY[e.type] || {};
      if (d.meta) return [];
      const ids = ['atk', 'blk', 'ace', 'rec', 'err', 'serr', 'aerr', 'oerr', 'pt', 'to', 'mark'];
      if (!ids.includes(e.type)) ids.push(e.type);
      return ids;
    },
    stats, COLS, isEmpty, csvEvents, csvBox,
    cleanEvent: (e) => (e.type === 'srv' ? ((e.team === 0 || e.team === 1) ? { team: e.team } : null) : {}),
    exportExtra: (game, g) => {
      const rp = replay(game);
      g.sets = rp.log.map((x) => ({ set: x.set, score: x.pts, winner: x.winner }));
      g.events.forEach((e) => { const inf = rp.info[e.id]; if (inf) { e.set = inf.set; if (inf.winner != null) { e.pointTo = inf.winner; e.server = inf.server; e.after = inf.pts; } } });
    }
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sp/tennis.js */
/* スポーツ タップ記録 — テニス（硬式・ソフトテニス）。画面を持たない部分
   記録1つ＝ポイント1つ。どちらの側がポイントを取ったか（とその理由：エース・ウィナー・相手のミス・ダブルフォルト）を時刻つきで残す。
   ゲーム・セット・試合・サーブ権は、すべて記録から計算する（取り消し・直しをすると、自動で正しくなる）。

   ■ この種目の記録（core.js の形に足すもの）
     team：側（0 = 自分の側・1 = 相手の側）。no：その側の何人目の選手か（'1'・'2'。シングルスは '1'）。「ポイント」（理由なし）は no なし
     type：'ace' エース・'win' ウィナー（→ その側のポイント）／'err' ミス・'df' ダブルフォルト（→ 相手の側のポイント）／
           'pt' ポイント（理由なし。その側のポイント）／'flt' フォルト（1stサーブ。ポイントは動かない）／'mark' ★ あとで見る
     game.serve：{ side: 最初のゲームでサーブする側（0・1）, p: [自分の側で最初にサーブする人, 相手の側で最初にサーブする人]（'1'・'2'） }
   ■ 試合の形式（opts）
     kind：'hard' 硬式 | 'soft' ソフトテニス / fmt：'single' | 'double'
     硬式：sets（1・3・5 セットマッチ）, games（6 ふつう・4 ショートセット・8 プロセット。同じ数でタイブレーク 7 ポイント）, adv（'ad' | 'noad'）, final（'set' | 'mtb' 最終セットを 10 ポイントのマッチタイブレークに）
     ソフトテニス：sgames（5・7・9 ゲームマッチ）。ゲームは 4 ポイント先取（3−3 からデュース）。ゲームが並んだら（7ゲームマッチなら 3−3）ファイナルゲーム（7 ポイント先取・2 ポイント差）
   ■ サーブ
     ゲームごとに交代（タイブレーク・ファイナルゲームも1つのゲームとして数える → 次のセットの最初のサーブも、この交代のまま決まる）。
     タイブレーク（硬式）：1 ポイント目のあと、2 ポイントずつ交代。ファイナルゲーム（ソフトテニス）：2 ポイントずつ交代。 */
(function (root) {
  'use strict';
  const ST = root.ST;

  const C = { ace: '#7c3aed', win: '#15803d', err: '#b91c1c', df: '#c2410c', pt: '#334155', flt: '#64748b' };
  const TYPES = [
    { id: 'ace', btn: 'エース', sub: 'サーブで', label: 'サービスエース', short: 'エース', kind: 'made', col: C.ace, to: 'self', serve: true },
    { id: 'win', btn: 'ウィナー', sub: '決めた', label: 'ウィナー', kind: 'made', col: C.win, to: 'self' },
    { id: 'err', btn: 'ミス', sub: '相手の点', label: 'ミス', kind: 'miss', col: C.err, to: 'opp' },
    { id: 'df', btn: 'ダブル', sub: 'フォルト', label: 'ダブルフォルト', kind: 'miss', col: C.df, to: 'opp', serve: true },
    { id: 'flt', btn: 'フォルト', sub: '1stサーブ', label: 'フォルト（1stサーブ）', short: 'フォルト', kind: 'miss', col: C.flt, serve: true },
    { id: 'pt', btn: 'ポイント', sub: '理由なし', label: 'ポイント', kind: 'made', col: C.pt, to: 'self', side: true },
    { id: 'mark', btn: '★ あとで見る', label: '★ あとで見る', kind: 'mark', global: true }
  ];
  const TYPE = {};
  TYPES.forEach((d) => { TYPE[d.id] = d; });

  /* ---------- 形式 ---------- */
  function rules(o) {
    o = o || {};
    if (o.kind === 'soft') {
      const n = Number(o.sgames) || 7;
      return { soft: true, matchGames: n, need: Math.ceil(n / 2), finalPts: 7 };
    }
    const sets = Number(o.sets) || 3, G = Number(o.games) || 6;
    return { soft: false, sets, need: Math.ceil(sets / 2), G, noAd: o.adv === 'noad', tbPts: 7, mtb: o.final === 'mtb' && sets > 1, mtbPts: 10 };
  }
  ST.tennisRules = rules;

  /* 側の名前（選手の名前・なければ学校名・なければ「自分」「相手」）と、選手の名前 */
  function sideName(game, s) {
    const t = game.teams[s] || {};
    const names = (t.players || []).map((p) => (p.name || '').trim()).filter(Boolean);
    if (names.length) return names.join('・');
    return (t.name || '').trim() || (s ? '相手' : '自分');
  }
  function pName(game, s, no) {
    const p = ((game.teams[s] || {}).players || []).find((x) => x.no === no);
    return (p && (p.name || '').trim()) || (isDouble(game) ? `${s ? '相手' : '自分'}の${no}人目` : sideName(game, s));
  }
  const isDouble = (game) => (game.opts || {}).fmt === 'double';

  /* ---------- 記録から、ゲーム・セット・サーブを計算する ----------
     戻り値：{ R, sets: [{ g: [a, b], tb: [a, b] | null, mtb }], g: [いまのセットのゲーム], p: [いまのゲームのポイント], tb: null | 'tb' | 'mtb' | 'final',
              k: 試合の何ゲーム目か（0〜）, sw: 取ったセット, over, winner, server（次のポイントでサーブする側）, serverNo（ダブルスの硬式：サーブする人の目安）,
              snap: { 記録の id → そのポイントのあとのようす }, stats } */
  const cache = { key: '', val: null };
  function replay(game) {
    const evs = ST.sorted(game);
    const key = JSON.stringify([game.opts, game.serve, evs.map((e) => [e.id, e.type, e.team, e.no, e.t])]);
    if (cache.key === key && cache.game === game.id) return cache.val;
    const R = rules(game.opts);
    const first = game.serve && (game.serve.side === 1) ? 1 : 0;
    const firstNo = (game.serve && Array.isArray(game.serve.p) ? game.serve.p : ['1', '1']).map((x) => (x === '2' ? '2' : '1'));
    const st = { R, sets: [], g: [0, 0], p: [0, 0], tb: null, k: 0, sw: [0, 0], over: false, winner: null, snap: {} };
    const stats = {
      won: [0, 0], servePts: [0, 0], serveWon: [0, 0], svcGames: [0, 0], held: [0, 0], breaks: [0, 0],
      firstSv: [0, 0], firstIn: [0, 0], anyFault: false, games: [0, 0]
    };
    const faulted = [false, false];       // いまのポイントで、1stサーブがフォルトだったか（側ごと）
    const gameServer = () => (st.k % 2 === 0 ? first : 1 - first);
    function serverNow() {
      const gs = gameServer();
      if (!st.tb) return gs;
      const i = st.p[0] + st.p[1];
      const block = R.soft ? Math.floor(i / 2) : Math.floor((i + 1) / 2);
      return block % 2 === 0 ? gs : 1 - gs;
    }
    /* ダブルスの硬式：サーブする人の目安（その側の何回目のサービスゲームか、で交代。タイブレークは 2 ポイントずつの順番） */
    function serverNoNow() {
      if (R.soft || game.opts.fmt !== 'double') return null;
      let turn = st.k;
      if (st.tb) { const i = st.p[0] + st.p[1]; turn = st.k + Math.floor((i + 1) / 2); }
      const side = turn % 2 === 0 ? first : 1 - first;
      const j = Math.floor(turn / 2);
      const a = firstNo[side], b = a === '1' ? '2' : '1';
      return j % 2 === 0 ? a : b;
    }
    function winGame(w) {
      const srv = gameServer();
      const wasTb = st.tb;
      if (!wasTb) { stats.svcGames[srv]++; if (w === srv) stats.held[srv]++; else stats.breaks[w]++; }
      stats.games[w]++;
      st.k++;
      const pts = st.p.slice();
      st.p = [0, 0];
      const res = { game: true, set: false, match: false, tb: wasTb };
      if (R.soft) {
        st.g[w]++;
        st.tb = null;
        if (wasTb === 'final' || st.g[w] >= R.need) { st.over = true; st.winner = w; res.match = true; res.set = true; }
        else if (st.g[0] === R.need - 1 && st.g[1] === R.need - 1) st.tb = 'final';
        return res;
      }
      if (wasTb === 'mtb') {
        st.sets.push({ g: w ? [0, 1] : [1, 0], tb: pts, mtb: true });
        st.sw[w]++; st.tb = null; st.g = [0, 0]; res.set = true;
      } else if (wasTb === 'tb') {
        st.g[w]++;
        st.sets.push({ g: st.g.slice(), tb: pts });
        st.sw[w]++; st.g = [0, 0]; st.tb = null; res.set = true;
      } else {
        st.g[w]++;
        const o = 1 - w;
        if (st.g[w] >= R.G && st.g[w] - st.g[o] >= 2) { st.sets.push({ g: st.g.slice(), tb: null }); st.sw[w]++; st.g = [0, 0]; res.set = true; }
        else if (st.g[0] === R.G && st.g[1] === R.G) st.tb = 'tb';
      }
      if (st.sw[w] >= R.need) { st.over = true; st.winner = w; res.match = true; }
      else if (res.set && R.mtb && st.sw[0] === R.need - 1 && st.sw[1] === R.need - 1) st.tb = 'mtb';
      return res;
    }
    evs.forEach((e) => {
      const d = TYPE[e.type];
      if (!d) return;
      if (e.type === 'flt') {
        stats.anyFault = true;
        if (!st.over && (e.team === 0 || e.team === 1)) faulted[e.team] = true;
        st.snap[e.id] = { fault: true, server: serverNow() };
        return;
      }
      if (!d.to || (e.team !== 0 && e.team !== 1)) return;
      if (st.over) { st.snap[e.id] = { after: true }; return; }
      const srv = serverNow(), srvNo = serverNoNow();
      const before = { g: st.g.slice(), p: st.p.slice(), tb: st.tb, setNo: st.sets.length + 1, k: st.k };
      const w = d.to === 'self' ? e.team : 1 - e.team;
      stats.won[w]++;
      stats.servePts[srv]++;
      if (w === srv) stats.serveWon[srv]++;
      stats.firstSv[srv]++;
      if (!(faulted[srv] || e.type === 'df')) stats.firstIn[srv]++;
      faulted[0] = faulted[1] = false;
      st.p[w]++;
      let done = false;
      if (st.tb) {
        const target = st.tb === 'mtb' ? R.mtbPts : st.tb === 'final' ? R.finalPts : R.tbPts;
        if (st.p[w] >= target && st.p[w] - st.p[1 - w] >= 2) done = true;
      } else if (!R.soft && R.noAd) done = st.p[w] >= 4;
      else done = st.p[w] >= 4 && st.p[w] - st.p[1 - w] >= 2;
      const res = done ? winGame(w) : { game: false };
      st.snap[e.id] = { winner: w, server: srv, serverNo: srvNo, before, res, after: false, g: st.g.slice(), p: st.p.slice(), sets: st.sets.map((x) => ({ g: x.g.slice(), tb: x.tb, mtb: x.mtb })), tb: st.tb, over: st.over, setNo: st.sets.length + (st.over ? 0 : 1) };
    });
    st.server = serverNow();
    st.serverNo = serverNoNow();
    st.stats = stats;
    cache.key = key; cache.game = game.id; cache.val = st;
    return st;
  }

  /* ---------- 呼び方 ---------- */
  const HARD = ['0', '15', '30', '40'];
  /* いまのゲームのポイントの表示：[自分の側, 相手の側]（「40」「AD」・タイブレークは数） */
  function pointCells(R, p, tb) {
    if (tb) return [String(p[0]), String(p[1])];
    const [a, b] = p;
    if (a >= 3 && b >= 3 && !(!R.soft && R.noAd)) {
      const base = R.soft ? '3' : '40';
      if (a === b) return [base, base];
      return a > b ? ['AD', base] : [base, 'AD'];
    }
    if (R.soft) return [String(Math.min(a, 3)), String(Math.min(b, 3))];
    return [HARD[Math.min(a, 3)], HARD[Math.min(b, 3)]];
  }
  /* 呼び名（デュース・アドバンテージ ○○・タイブレーク …）。names：側の名前 */
  function callText(R, p, tb, names) {
    if (tb === 'tb') return 'タイブレーク';
    if (tb === 'mtb') return 'マッチタイブレーク';
    if (tb === 'final') return 'ファイナルゲーム';
    const [a, b] = p;
    if (!R.soft && R.noAd && a === 3 && b === 3) return 'デサイディングポイント';
    if (a >= 3 && b >= 3) return a === b ? 'デュース' : `アドバンテージ ${names[a > b ? 0 : 1]}`;
    return '';
  }
  /* 「40−15」のような、いまのゲームのポイント（側の順） */
  function pointText(R, p, tb) { const c = pointCells(R, p, tb); return `${c[0]}−${c[1]}`; }
  function setText(x) {
    if (x.mtb) return `[${x.tb[0]}−${x.tb[1]}]`;
    let s = `${x.g[0]}−${x.g[1]}`;
    if (x.tb) s += `(${Math.min(x.tb[0], x.tb[1])})`;
    return s;
  }
  function setsText(st) { return st.sets.map(setText).join(' '); }

  /* ---------- 得点（core の score・scoreText） ---------- */
  function score(game) { const st = replay(game); return st.R.soft ? st.g.slice() : st.sw.slice(); }
  function scoreText(game) {
    const st = replay(game);
    if (st.R.soft) return `${st.g[0]}−${st.g[1]}`;
    const cur = !st.over && (st.g[0] + st.g[1] > 0 || st.p[0] + st.p[1] > 0) ? `${st.g[0]}−${st.g[1]}` : '';
    return [setsText(st), cur].filter(Boolean).join(' ') || '0−0';
  }

  /* ---------- 集計 ---------- */
  /* 選手ごと：[{ side, rows: [{ no, name, c }], total: { c }, side: {…} }] */
  function stats(game) {
    const st = replay(game);
    return [0, 1].map((s) => {
      const players = (game.teams[s].players || []).map((p) => ({ no: p.no, name: pName(game, s, p.no), c: {} }));
      const total = { c: {} }, sideOnly = { c: {} };
      (game.events || []).forEach((e) => {
        const d = TYPE[e.type];
        if (!d || d.global || e.team !== s) return;
        const r = e.no != null ? players.find((x) => x.no === e.no) : null;
        [r ? r.c : sideOnly.c, total.c].forEach((c) => { c[e.type] = (c[e.type] || 0) + 1; });
      });
      const S = st.stats;
      return { side: s, name: sideName(game, s), rows: players, sideOnly, total, won: S.won[s], servePts: S.servePts[s], serveWon: S.serveWon[s], svcGames: S.svcGames[s], held: S.held[s], breaks: S.breaks[s], firstSv: S.firstSv[s], firstIn: S.firstIn[s], games: S.games[s] };
    });
  }

  /* ---------- 名前・CSV ---------- */
  function snapText(game, e) {
    const st = replay(game);
    const sn = st.snap[e.id];
    if (!sn) return '';
    if (sn.fault) return '';
    if (sn.after) return '（試合のあと）';
    const names = [sideName(game, 0), sideName(game, 1)];
    if (sn.res.match) return `試合終了 ${names[sn.winner]}の勝ち`;
    if (sn.res.set && !st.R.soft) { const last = sn.sets[sn.sets.length - 1]; return `セット ${names[sn.winner]} ${setText(last)}`; }
    if (sn.res.game) return `ゲーム ${names[sn.winner]}（${sn.g[0]}−${sn.g[1]}）`;
    const call = callText(st.R, sn.p, sn.tb, names);
    return call && !sn.tb ? call : pointText(st.R, sn.p, sn.tb);
  }
  function csvEvents(game) {
    const st = replay(game);
    const names = [sideName(game, 0), sideName(game, 1)];
    const rows = [['No', '時刻', 'スタートからの秒', 'セット', 'ゲーム（そのセットの何ゲーム目）', 'サーブ', '側', '選手', '記録', 'ポイントを取った側', 'ポイント（あと）', 'ゲーム数（あと）', 'セット（あと）', 'できごと']];
    let n = 0;
    ST.sorted(game).forEach((e) => {
      const d = TYPE[e.type] || { label: e.type };
      const sn = st.snap[e.id] || {};
      const who = e.team != null && e.no != null ? pName(game, e.team, e.no) : '';
      if (!sn.before) {
        rows.push([++n, ST.fmtTime(e.t), e.t, '', '', sn.server != null ? names[sn.server] : '', e.team != null ? names[e.team] : '', who, d.label, '', '', '', '', sn.after ? '試合のあと' : '']);
        return;
      }
      const b = sn.before;
      const ev = sn.res.match ? '試合終了' : sn.res.set ? 'セット' : sn.res.game ? 'ゲーム' : '';
      rows.push([++n, ST.fmtTime(e.t), e.t, st.R.soft ? '' : b.setNo, b.g[0] + b.g[1] + 1, names[sn.server] + (sn.serverNo ? `（${pName(game, sn.server, sn.serverNo)}）` : ''), names[e.team], who, d.label, names[sn.winner],
        sn.res.game ? '' : pointText(st.R, sn.p, sn.tb), `${sn.g[0]}−${sn.g[1]}`, sn.sets.map(setText).join(' '), ev]);
    });
    return rows;
  }
  function csvBox(game) {
    const st = stats(game);
    const keys = [['ace', 'エース'], ['win', 'ウィナー'], ['err', 'ミス'], ['df', 'ダブルフォルト'], ['flt', 'フォルト（1st）'], ['pt', 'ポイント（理由なし）']];
    const rows = [['側', '選手'].concat(keys.map((k) => k[1]), ['取ったポイント', 'サーブのポイント（取った/全部）', '1stサーブ（入った/全部）', 'サービスゲーム（キープ/全部）', 'ブレイク'])];
    st.forEach((x) => {
      x.rows.forEach((r) => rows.push([x.name, r.name].concat(keys.map((k) => r.c[k[0]] || 0), ['', '', '', '', ''])));
      rows.push([x.name, '合計'].concat(keys.map((k) => x.total.c[k[0]] || 0), [x.won, `${x.serveWon}/${x.servePts}`, `${x.firstIn}/${x.firstSv}`, `${x.held}/${x.svcGames}`, x.breaks]));
    });
    return rows;
  }

  /* ---------- 種目の登録 ---------- */
  ST.addSport({
    id: 'tennis', name: 'テニス', icon: '🎾', family: 'tennis', prec: 10, hasTeams: true,
    desc: '硬式・ソフトテニス。ポイントの取り方（エース・ウィナー・ミス・ダブルフォルト）から、ゲーム・セット・サーブを自動で',
    unit: '試合',
    TYPES,
    base: ['ace', 'win', 'err', 'df'],
    toggles: [{ key: 'flt', label: 'フォルト（1stサーブ）のボタン → 1stサーブの入った割合', types: ['flt'] }],
    togglesTitle: '選手のボタン',
    togglesNote: 'いつもある：エース・ウィナー・ミス・DF（ダブルフォルト）と、側ごとの「ポイント」。フォルトを出すと、1stサーブが入った割合が集計に出ます（ポイントは動きません）。',
    noTeamEdit: true, noNoEdit: true, noSavedTeams: false,
    noNoText: '（側のポイント）',
    setupTitle: '試合の準備', setupEditTitle: '選手・形式を直す', setupEditSub: '名前・色・最初のサーブ・試合の形式',
    titleHint: '例：県総体 1回戦・練習試合',
    statsSub: 'セットごとのゲーム・エース・ダブルフォルト・1stサーブ・キープとブレイク',
    startHint: '最初のサーブの瞬間',
    optsEditNote: '試合の途中で形式を変えると、これまでのポイントから、ゲーム・セットを数え直します。',
    defaultOpts: () => ({ kind: 'hard', fmt: 'single', sets: 3, games: 6, adv: 'ad', final: 'set', sgames: 7 }),
    optFields: [
      { key: 'kind', label: '種類', choices: [['hard', '硬式テニス'], ['soft', 'ソフトテニス']] },
      { key: 'fmt', label: 'シングルス・ダブルス', choices: [['single', 'シングルス'], ['double', 'ダブルス']] },
      { key: 'sets', label: 'セット数', choices: [[1, '1セットマッチ'], [3, '3セットマッチ'], [5, '5セットマッチ']], hidden: (o) => o.kind === 'soft' },
      { key: 'games', label: '1セットのゲーム数', choices: [[6, '6ゲーム（ふつう）'], [4, '4ゲーム（ショートセット）'], [8, '8ゲーム（プロセット）']], note: '同じゲーム数で並んだら（6−6・4−4・8−8）、7ポイントのタイブレーク', hidden: (o) => o.kind === 'soft' },
      { key: 'adv', label: 'デュース', choices: [['ad', 'アドバンテージあり'], ['noad', 'ノーアド（40−40 は次の1ポイントで決める）']], hidden: (o) => o.kind === 'soft' },
      { key: 'final', label: '最終セット', choices: [['set', 'ふつうのセット'], ['mtb', '10ポイントのマッチタイブレーク']], hidden: (o) => o.kind === 'soft' || Number(o.sets) === 1 },
      { key: 'sgames', label: 'ゲーム数', choices: [[5, '5ゲームマッチ（3ゲーム先取）'], [7, '7ゲームマッチ（4ゲーム先取）'], [9, '9ゲームマッチ（5ゲーム先取）']], note: 'ゲームは4ポイント先取（3−3 からデュース）。ゲームが並ぶと（7ゲームマッチなら 3−3）、ファイナルゲーム（7ポイント先取・2ポイント差）', hidden: (o) => o.kind !== 'soft' }
    ],
    initGame: (g) => { if (!g.serve) g.serve = { side: 0, p: ['1', '1'] }; },
    fromDraft: (g, D) => { g.serve = cleanServe(D.serve); },
    importExtra: (obj, g) => { g.serve = cleanServe(obj.serve); },
    exportExtra: (game, g) => {
      const st = replay(game);
      g.tennis = { sets: st.sets, games: st.g, points: st.p, setsWon: st.sw, over: st.over, winner: st.winner, rules: st.R };
      g.events.forEach((e) => { const sn = st.snap[e.id]; if (sn && sn.winner != null) { e.won = sn.winner; e.server = sn.server; } });
    },
    cleanEvent: (e) => ({}),
    sideNames: (game) => [sideName(game, 0), sideName(game, 1)],
    fileWho: (game) => ST.safeName(sideName(game, 0)) + 'vs' + ST.safeName(sideName(game, 1)),
    score, scoreText,
    editTypes: (game, e) => (e.type === 'mark' ? ['mark'] : ['ace', 'win', 'err', 'df', 'pt', 'flt']),
    whoText: (game, e) => {
      if (e.team == null) return 'チームなし';
      return e.no != null ? pName(game, e.team, e.no) : `${sideName(game, e.team)}（側のポイント）`;
    },
    lastText: (game, e) => {
      const d = TYPE[e.type] || { label: e.type };
      const s = snapText(game, e);
      return (d.short || d.label) + (s ? ` → ${s}` : '');
    },
    logWho: () => '',
    logText: (game, e) => { const d = TYPE[e.type] || { label: e.type }; const s = snapText(game, e); return d.label + (s ? ` → ${s}` : ''); },
    csvEvents, csvBox,
    exports: [
      { key: 'csv', suffix: '_一覧', label: '📋 ポイントの一覧（CSV）', desc: '時刻・サーブ・取った側と理由・その時点のポイント・ゲーム・セット。Excel・Numbers・Google スプレッドシートで開けます', rows: csvEvents },
      { key: 'box', suffix: '_集計', label: '📊 選手ごとの集計（CSV）', desc: 'エース・ウィナー・ミス・ダブルフォルト・1stサーブ・キープとブレイク', rows: csvBox }
    ],
    steps: [
      ['形式と選手を選ぶ', '硬式かソフトテニスか・シングルスかダブルス・セット数（ゲーム数）。選手の名前と、最初にサーブする人も'],
      ['最初のサーブの瞬間に ▶ スタート', '時計が動き出します（試合の動画と同じ時間の流れ）'],
      ['ポイントが決まったら、その理由のボタンを1回', '「エース」「ウィナー」はその選手の側のポイント、「ミス」「DF」は相手の側のポイント。理由を付けないときは、側の「ポイント」'],
      ['ゲーム・セット・サーブは自動', 'ポイントから数えます。まちがえたら「↶ 取り消す」。試合が決まると、終える案内が出ます']
    ],
    help: [['記録の画面', [
      '上の帯：時計・いまのセット（ソフトテニスはゲーム数の形式）と呼び名（デュース・アドバンテージ・タイブレーク など）',
      'その下のスコア：セットごとのゲーム数と、いまのゲームのポイント（大きい数字）。● がサーブする側（ダブルスの硬式は、サーブする人の名前も目安で出します）',
      '選手の行：「エース」「ウィナー」（その側のポイント）・「ミス」「DF」（相手のポイント）。エース・DF・フォルトは、サーブする側だけ押せます',
      '側の「ポイント」：理由を付けずに、その側のポイントにします（相手のミスか分からないとき など）',
      '画面の下の「★ あとで見る」：ポイントにせず、時刻だけを残します'
    ]], ['ルールのしくみ', [
      '硬式：0・15・30・40・デュース・アドバンテージ（ノーアドも選べます）。6ゲーム先取・2ゲーム差、6−6 で7ポイントのタイブレーク。最終セットを10ポイントのマッチタイブレークにもできます',
      'ソフトテニス：4ポイント先取（3−3 からデュース）。7ゲームマッチなら4ゲーム先取で、3−3 になるとファイナルゲーム（7ポイント先取・2ポイント差）',
      'サーブはゲームごとに交代。タイブレーク（硬式）は1ポイント目のあと2ポイントずつ、ファイナルゲーム（ソフトテニス）は2ポイントずつ交代します',
      'ゲーム・セットはポイントの記録から数えるので、「記録の一覧」で直したり取り消したりすると、自動で正しくなります'
    ]]]
  });
  function cleanServe(s) {
    s = s && typeof s === 'object' ? s : {};
    const p = Array.isArray(s.p) ? s.p : ['1', '1'];
    return { side: s.side === 1 ? 1 : 0, p: [p[0] === '2' ? '2' : '1', p[1] === '2' ? '2' : '1'] };
  }

    togglesTitle: '記録のしかた',

<script>
/* js/sp/swim.js */
/* スポーツ タップ記録 — 水泳（画面を持たない部分）
   部活の記録会・練習で、ストップウォッチの代わりに使う。レーンごとの大きな「タッチ」ボタンを、壁にさわった瞬間に押す。
   時刻は 0.01 秒まで（game.prec = 100）。人がタップするので、本当のタッチから 0.1〜0.2 秒くらいずれることがある。

   ■ 水泳の記録（core.js の形に足すもの。どれもチーム・背番号は使わない：noTeam）
     'heat'  ：組（練習はセット）の始まり＝スタートの合図 { heat: 組の番号, lanes: [{ lane, name, team }], mode, stroke, dist, pool, reps, cycle, gap }
               組ごとに、種目・距離・名前を持つ（1回の記録会で、ちがう種目の組を続けて計れる）
     'touch' ：レーンのタッチ { lane }（壁にさわった瞬間。最後のタッチがゴール）
               どの組のタッチかは「その時刻より前の、いちばん新しい 'heat'」で決める（時刻を直せば、自動で正しくなる）
     'dq'・'dnf'・'dns'：失格・棄権（途中でやめた）・欠場 { lane, heat }（判定はあとから出ることがあるので、組の番号を持つ）
   ■ タイム
     レース：スプリット＝タッチの時刻 − その組のスタート。ラップ＝となりのスプリットの差。タッチの回数＝距離 ÷ プールの長さ
     練習（サークル）：本ごとのスタート＝セットのスタート ＋（本 − 1）× サークル ＋（泳ぐ順 − 1）× スタートの間隔。
       タッチ（ゴール）は、その時刻にいちばん新しく始まった本のもの（同じ本に2回あれば、あとのほう）
   ■ まだ始めていない次の組：game.pending = { heat, lanes, spec }（「次の組へ」で作り、「▶ スタート」で 'heat' になる） */
(function (root) {
  'use strict';
  const ST = root.ST;

  const STROKES = [['fr', '自由形'], ['ba', '背泳ぎ'], ['br', '平泳ぎ'], ['fly', 'バタフライ'], ['im', '個人メドレー'], ['relay', 'リレー']];
  const STROKE = {};
  STROKES.forEach(([k, v]) => { STROKE[k] = v; });
  const DISTS = [25, 50, 100, 200, 400, 800, 1500];
  const CYCLES = [30, 40, 45, 50, 60, 70, 75, 80, 90, 100, 105, 120, 150, 180, 240, 300];
  const MAXLANES = 10;
  const SPEC_KEYS = ['mode', 'stroke', 'dist', 'pool', 'reps', 'cycle', 'gap'];
  const r2 = (x) => Math.round(x * 100) / 100;

  const cycleText = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  /* 組の種目の呼び名：「自由形 50m」「練習 50m×8（1:00）」 */
  function specText(spec, short) {
    if (!spec) return '';
    if (spec.mode === 'circle') return `${short ? '' : '練習 '}${spec.dist}m×${spec.reps}（${cycleText(spec.cycle)}${spec.gap ? '・' + spec.gap + '秒おき' : ''}）`;
    return `${STROKE[spec.stroke] || ''} ${spec.dist}m`;
  }
  /* タッチの回数（距離 ÷ プールの長さ。25m をプール 50m で泳ぐときは1回） */
  const touchesOf = (spec) => Math.max(1, Math.round((spec.dist || 50) / (spec.pool || 25)));
  const specOf = (o) => { const s = {}; SPEC_KEYS.forEach((k) => { s[k] = o[k]; }); return s; };
  const unitOf = (spec) => (spec && spec.mode === 'circle' ? 'セット' : '組');

  /* レーン（名前・学校）をそろえる。n 本にそろえる（足りなければ空のレーン） */
  function cleanLanes(list, n) {
    const out = [];
    const src = Array.isArray(list) ? list : [];
    const count = n != null ? ST.clamp(Math.round(n) || 1, 1, MAXLANES) : ST.clamp(src.length || 1, 1, MAXLANES);
    for (let i = 0; i < count; i++) {
      const x = src[i] || {};
      out.push({ lane: i + 1, name: String(x.name || '').trim().slice(0, 16), team: String(x.team || '').trim().slice(0, 16) });
    }
    return out;
  }

  /* ---------- 組（記録から計算する） ---------- */
  /* 組の並び：[{ e, heat, start, end（次の組の始まり。なければ Infinity）, spec, lanes }]（始まった順） */
  function heats(game) {
    const list = ST.sorted(game).filter((e) => e.type === 'heat').map((e) => ({ e, id: e.id, heat: e.heat, start: e.t, spec: specOf(e), lanes: cleanLanes(e.lanes) }));
    list.forEach((x, i) => { x.end = i + 1 < list.length ? list[i + 1].start : Infinity; });
    return list;
  }
  function heatAt(game, t) {
    const hs = heats(game);
    let cur = null;
    hs.forEach((x) => { if (x.start <= t + 1e-9) cur = x; });
    return cur;
  }
  const heatByNo = (game, n) => heats(game).find((x) => x.heat === n) || null;
  const lastHeatNo = (game) => heats(game).reduce((m, x) => Math.max(m, x.heat), 0);
  /* 次の組の準備ができていて、まだスタートしていない */
  const waiting = (game) => !!(game.pending && game.pending.heat > lastHeatNo(game));

  /* 組の中のタッチ：レーン → [タッチの記録]（時刻の順） */
  function touchesIn(game, H) {
    const m = new Map();
    ST.sorted(game).forEach((e) => {
      if (e.type !== 'touch' || e.t < H.start - 1e-9 || e.t >= H.end - 1e-9) return;
      if (!m.has(e.lane)) m.set(e.lane, []);
      m.get(e.lane).push(e);
    });
    return m;
  }
  /* 組の中の失格・棄権・欠場：レーン → 記録（あとのものが勝つ） */
  function flagsIn(game, H) {
    const m = new Map();
    ST.sorted(game).forEach((e) => { if ((e.type === 'dq' || e.type === 'dnf' || e.type === 'dns') && e.heat === H.heat) m.set(e.lane, e); });
    return m;
  }

  /* レースの結果：[{ lane, name, team, touches, need, splits, laps, done, time, flag, rank }]（レーンの順） */
  function raceResults(game, H) {
    const need = touchesOf(H.spec);
    const tm = touchesIn(game, H), fl = flagsIn(game, H);
    const lanes = H.lanes.slice();
    tm.forEach((_, ln) => { if (!lanes.some((x) => x.lane === ln)) lanes.push({ lane: ln, name: '', team: '' }); });
    lanes.sort((a, b) => a.lane - b.lane);
    const rows = lanes.map((L) => {
      const ts = (tm.get(L.lane) || []).slice(0, need);
      const splits = ts.map((e) => r2(e.t - H.start));
      const laps = splits.map((s, i) => r2(i ? s - splits[i - 1] : s));
      const done = splits.length >= need;
      const f = fl.get(L.lane);
      return { lane: L.lane, name: L.name, team: L.team, touches: ts, need, splits, laps, done, time: done ? splits[need - 1] : null, flag: f ? f.type : null, flagId: f ? f.id : null, rank: null };
    });
    const ranked = rows.filter((x) => x.done && !x.flag).sort((a, b) => a.time - b.time);
    ranked.forEach((x, i) => { x.rank = i && Math.abs(x.time - ranked[i - 1].time) < 0.005 ? ranked[i - 1].rank : i + 1; });
    return rows;
  }
  /* 練習（サークル）の結果：[{ lane, name, team, reps: [{ r, start, time }], done（何本泳いだか）, avg, best, flag }] */
  function repStart(H, idx, r) { return r2(H.start + r * H.spec.cycle + idx * (H.spec.gap || 0)); }
  function circleResults(game, H) {
    const tm = touchesIn(game, H), fl = flagsIn(game, H);
    const R = H.spec.reps || 1;
    return H.lanes.map((L, idx) => {
      const reps = Array.from({ length: R }, (_, r) => ({ r: r + 1, start: repStart(H, idx, r), time: null, id: null }));
      (tm.get(L.lane) || []).forEach((e) => {
        let r = Math.floor((e.t - H.start - idx * (H.spec.gap || 0) + 1e-9) / H.spec.cycle);
        if (r < 0) return;                               // 自分のスタートより前（押しまちがい）
        r = Math.min(r, R - 1);
        reps[r].time = r2(e.t - reps[r].start);
        reps[r].id = e.id;
      });
      const times = reps.filter((x) => x.time != null).map((x) => x.time);
      const f = fl.get(L.lane);
      return { lane: L.lane, name: L.name, team: L.team, reps, done: times.length, avg: times.length ? r2(times.reduce((a, b) => a + b, 0) / times.length) : null, best: times.length ? Math.min(...times) : null, flag: f ? f.type : null, flagId: f ? f.id : null };
    });
  }
  const results = (game, H) => (H.spec.mode === 'circle' ? circleResults(game, H) : raceResults(game, H));
  /* その組は、全員が終わったか（レース：ゴール・失格など／練習：最後の本が始まってからサークル1つぶん過ぎた か 全部の本を泳いだ） */
  function heatDone(game, H, t) {
    const rs = results(game, H);
    if (!rs.length) return false;
    if (H.spec.mode === 'circle') return rs.every((x) => x.flag || x.done >= H.spec.reps || (t != null && t >= x.reps[x.reps.length - 1].start + H.spec.cycle));
    return rs.every((x) => x.flag || x.done || (!x.name && !x.touches.length && rs.some((y) => y.name)));
  }
  /* 名前のないレーン（だれも泳いでいない）は、名前のあるレーンがあれば、結果から外す */
  function activeRows(rs) {
    const named = rs.some((x) => x.name);
    return rs.filter((x) => !named || x.name || (x.touches && x.touches.length) || (x.reps && x.done) || x.flag);
  }
  /* 練習で、いまの本：{ r（1〜）, start, next（次の本のスタート）, swimming（泳いでいる）} */
  function circleNow(H, idx, t, row) {
    const R = H.spec.reps || 1;
    const rel = t - H.start - idx * (H.spec.gap || 0);
    if (rel < 0) return { r: 1, start: repStart(H, idx, 0), before: true };
    const r = Math.min(Math.floor(rel / H.spec.cycle), R - 1);
    const done = row && row.reps[r] && row.reps[r].time != null;
    const end = r >= R - 1 && done;
    return { r: r + 1, start: repStart(H, idx, r), next: r + 1 < R ? repStart(H, idx, r + 1) : null, swimming: !done, finished: end };
  }

  /* 種目と距離ごとの総合順位（レースの組をまとめる）：[{ key, label, rows: [{ heat, lane, name, team, time, rank }] }] */
  function overall(game) {
    const groups = new Map();
    heats(game).forEach((H) => {
      if (H.spec.mode === 'circle') return;
      const key = `${H.spec.stroke}:${H.spec.dist}:${H.spec.pool}`;
      if (!groups.has(key)) groups.set(key, { key, label: specText(H.spec) + (H.spec.pool === 50 ? '（長水路）' : ''), rows: [], heats: 0 });
      const gr = groups.get(key);
      gr.heats++;
      raceResults(game, H).forEach((x) => { if (x.done && !x.flag) gr.rows.push({ heat: H.heat, lane: x.lane, name: x.name, team: x.team, time: x.time }); });
    });
    const out = Array.from(groups.values());
    out.forEach((gr) => {
      gr.rows.sort((a, b) => a.time - b.time);
      gr.rows.forEach((x, i) => { x.rank = i && Math.abs(x.time - gr.rows[i - 1].time) < 0.005 ? gr.rows[i - 1].rank : i + 1; });
    });
    return out;
  }

  /* ---------- 名前・時刻 ---------- */
  const laneName = (H, ln) => { const L = H && H.lanes.find((x) => x.lane === ln); return L ? L.name : ''; };
  const FLAG = { dq: '失格（DQ）', dnf: '棄権（DNF）', dns: '欠場（DNS）' };
  const FLAG_SHORT = { dq: 'DQ', dnf: 'DNF', dns: 'DNS' };
  /* タッチの中身：{ H, idx（何回目・何本目）, need, split, lap, goal, rank } */
  function touchInfo(game, e) {
    const H = heatAt(game, e.t);
    if (!H) return null;
    if (H.spec.mode === 'circle') {
      const idx = H.lanes.findIndex((x) => x.lane === e.lane);
      const row = circleResults(game, H)[idx];
      const rep = row ? row.reps.find((x) => x.id === e.id) : null;
      return { H, circle: true, rep: rep ? rep.r : null, time: rep ? rep.time : null, extra: !rep };
    }
    const rs = raceResults(game, H);
    const row = rs.find((x) => x.lane === e.lane);
    const i = row ? row.touches.findIndex((x) => x.id === e.id) : -1;
    if (i < 0) return { H, extra: true, split: r2(e.t - H.start) };
    return { H, idx: i + 1, need: row.need, split: row.splits[i], lap: row.laps[i], goal: i + 1 === row.need, rank: i + 1 === row.need ? row.rank : null, flag: row.flag };

  function eventText(game, e) {

    const who = `${H ? H.heat + unitOf(H.spec) + ' ' : ''}L${e.lane}${laneName(H, e.lane) ? ' ' + laneName(H, e.lane) : ''}`;

  function touchText(info) {

    if (info.extra) return `タッチ（多い） ${ST.fmtRace(info.split)}`;
    if (info.goal) return `ゴール ${ST.fmtRace(info.split)}${info.rank ? `（${info.rank}位）` : ''}`;

  /* ---------- CSV ---------- */
  function csvEvents(game) {
    const rows = [['No', '時刻（スタートから）', 'スタートからの秒', '組', '種目', 'レーン', '名前', '学校・チーム', '記録', '何回目・何本目', 'スプリット・タイム', 'ラップ']];
    let n = 0;
    ST.sorted(game).forEach((e) => {
      if (e.type === 'heat') { rows.push(['', ST.fmtTime(e.t, 2), e.t, `${e.heat}${unitOf(e)}目`, specText(specOf(e)), '', '', '', 'スタート', '', '', '']); return; }
      const H = e.type === 'touch' ? heatAt(game, e.t) : heatByNo(game, e.heat);
      const L = H ? H.lanes.find((x) => x.lane === e.lane) || {} : {};
      const base = [++n, ST.fmtTime(e.t, 2), e.t, H ? `${H.heat}${unitOf(H.spec)}目` : '', H ? specText(H.spec) : '', e.lane, L.name || '', L.team || ''];
      if (FLAG[e.type]) { rows.push(base.concat([FLAG[e.type], '', '', ''])); return; }

      const sh = Array.from({ length: maxN }, (_, i) => (pool ? `${(i + 1) * pool}m` : `タッチ${i + 1}`));
      rows.push(['組', '種目', 'プール', 'レーン', '名前', '学校・チーム', '組の順位', 'タイム', '状態'].concat(sh, maxN > 1 ? sh.map((x) => 'ラップ ' + x) : []));

      }));
    }

      if (rows.length) rows.push([]);
      const maxR = Math.max(...circ.map((H) => H.spec.reps || 1));
      rows.push(['セット', '練習', '泳ぐ順', '名前', '学校・チーム', '泳いだ本数', '平均', 'ベスト', '状態'].concat(Array.from({ length: maxR }, (_, i) => `${i + 1}本目`)));
      circ.forEach((H) => circleResults(game, H).forEach((x) => {
        rows.push([`${H.heat}セット目`, specText(H.spec), x.lane, x.name, x.team, x.done, x.avg != null ? ST.fmtRace(x.avg) : '', x.best != null ? ST.fmtRace(x.best) : '', x.flag ? FLAG[x.flag] : ''].concat(Array.from({ length: maxR }, (_, i) => (x.reps[i] && x.reps[i].time != null ? ST.fmtRace(x.reps[i].time) : ''))));

    return rows;

    },
    whoText(game, e) {

        '組ごとに種目・距離を変えられるので、記録会のいくつもの種目を1つの記録で計れます。集計には、組ごとの順位と、同じ種目の組をまとめた総合順位が出ます'
