      L.bOrder.textContent = `${s.slot + 1}番`;
      L.bNo.textContent = s.batter != null ? '#' + s.batter : '';
      L.bName.textContent = nm;
      L.bName.hidden = !nm;
      const nnm = s.nextBatter != null ? ST.playerName(g, s.bat, s.nextBatter) : '';
      L.bNext.textContent = `次：${s.nextSlot + 1}番${s.nextBatter != null ? ' #' + s.nextBatter : ''}${nnm ? ' ' + nnm : ''}`;
      const bk = s.half + ':' + s.slot;
      if (lastBatterKey && bk !== lastBatterKey) ctx.flash(L.batter);
      lastBatterKey = bk;
      // 走者
      s.bases.forEach((r, i) => {
        const el = L.bases[i];
        el.classList.toggle('on', !!r);
        el.firstChild.textContent = r ? (r.no != null ? r.no : '●') : '';
        el.style.setProperty('--tc', g.teams[s.bat].color);
        el.style.setProperty('--tink', ST.inkOn(g.teams[s.bat].color));
      });
      L.outsTxt.textContent = `${s.outs}アウト`;
      // 投手
      L.pTeam.textContent = `${ST.teamName(g, s.fld)}の守り`;
      L.pNo.textContent = s.pitcherNo != null ? '#' + s.pitcherNo : '—';
      L.pCount.textContent = String(s.pitchCount);
      const lim = Number(g.opts.plim) || 0;
      L.pitcher.classList.toggle('lim-w', !!lim && s.pitchCount >= lim - 10 && s.pitchCount < lim);
      L.pitcher.classList.toggle('lim-x', !!lim && s.pitchCount >= lim);
      L.pLim.textContent = lim ? (s.pitchCount >= lim ? `⚠ 目安${lim}球` : `目安${lim}・あと${lim - s.pitchCount}`) : '';
      L.pLim.title = lim ? `投球数の目安 ${lim}球（試合の形式で決めたもの）` : '';
      L.pLim.hidden = !lim;
      // 3アウトで攻守交代
      if (lastHalf != null && s.half > lastHalf && g.startedAt) ctx.say(`3アウト チェンジ → ${s.halfText}（${ST.teamName(g, s.bat)}の攻撃）`, 'ok', 3500);
      lastHalf = s.half;
      layout();
    }
    function layout() {
      if (!rootEl.isConnected) return;
      const W = rootEl.clientWidth || root.innerWidth, H = rootEl.clientHeight || root.innerHeight;
      rootEl.classList.toggle('short', H < 430);
      rootEl.classList.toggle('bb-wide', W > H * 1.15 && W >= 600);
    }
    function tick() { if (g.startedAt) clock.set(ST.fmtTime(ctx.elapsed())); }
    L.update = update;
    L.layout = layout;
    L.tick = tick;
    L.refresh = () => update();
    return L;
  }

  /* ---------- 小窓：イニング（チェンジ・打順を直す・投手の交代・代打） ---------- */
  function openInning(ctx) {
    const sp = ctx.sport, g = ctx.game;
    const s = sp.situation(g);
    const sheet = ST.ui.sheet({
      title: `${s.halfText}・${s.outs}アウト（${ST.teamName(g, s.bat)}の攻撃）`,
      body: h('div', { class: 'periodbox' },
        h('button', { class: 'btn primary huge', id: 'btnChange', onclick: () => { sheet.close(); ctx.record({ type: 'chg', team: s.bat }, null, { key: 'chg:' + s.half }); } }, 'チェンジ（3アウトにする）'),
        h('div', { class: 'row pgrid' },
          h('button', { class: 'btn', onclick: () => { sheet.close(); openBatter(ctx); } }, '代打・打順を直す'),
          h('button', { class: 'btn', onclick: () => { sheet.close(); openPitcher(ctx); } }, '投手の交代')),
        h('p', { class: 'note' }, 'アウトは打席の結果から自動で数え、3アウトで自動でチェンジします。アウトを記録しそこねたときは「チェンジ」で次の半イニングへ（まちがえたら「↶ 取り消す」）。'))
    });
  }
  function keypad(title, onOk) {
    let val = '';
    const disp = h('div', { class: 'kdisp' }, '　');
    const show = () => { disp.textContent = val ? '#' + val : '番号を入れる'; disp.classList.toggle('empty', !val); };
    const press = (k) => {
      if (k === '⌫') val = val.slice(0, -1);
      else if (k === '00') val = '00';
      else if (val === '00' || val.length >= 2) val = k;
      else val = val === '0' ? k : val + k;
      show();
    };
    const s = ST.ui.sheet({
      title, cls: 'keypad',
      body: h('div', null, disp, h('div', { class: 'keys' }, ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'].map((k) => h('button', { class: 'key', dataset: { key: k }, onclick: () => press(k) }, k)))),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn primary', id: 'btnKeyOk', onclick: () => {
        const no = ST.normNo(val);
        if (no == null) { ST.ui.toast('0〜99 の番号を入れてください', 'warn'); return; }
        s.close();
        onOk(no);
      } }, '決める')]
    });
    show();
  }
  /* 打者：打順を直す（次の打者を選ぶ）・代打 */
  function openBatter(ctx) {
    const sp = ctx.sport, g = ctx.game;
    const s = sp.situation(g);
    const lineup = s.lineup[s.bat];
    const sheet = ST.ui.sheet({
      title: `${ST.teamName(g, s.bat)}の打順（いまは ${s.slot + 1}番）`,
      body: h('div', { class: 'bb-sheet' },
        h('button', { class: 'btn primary huge', id: 'btnPinch', onclick: () => { sheet.close(); keypad(`代打（${s.slot + 1}番に入る人の背番号）`, (no) => ctx.record({ type: 'sub', team: s.bat, slot: s.slot, no }, null, { key: 'sub:' + s.slot + ':' + no })); } }, `代打を出す（${s.slot + 1}番）`),
        h('p', { class: 'note' }, '打順を直す：次に打つ人を選びます（打席の記録を飛ばした・まちがえたとき）。'),
        h('div', { class: 'bb-slots' }, Array.from({ length: s.nSlots }, (_, k) => {
          const no = lineup[k] || null;
          const nm = no != null ? ST.playerName(g, s.bat, no) : '';
          return h('button', { class: 'btn' + (k === s.slot ? ' on' : ''), dataset: { slot: String(k) }, onclick: () => { sheet.close(); if (k !== s.slot) ctx.record({ type: 'bat', team: s.bat, slot: k }, null, { key: 'bat:' + k }); } },
            h('b', null, `${k + 1}番`), no != null ? ` #${no}` : '', nm ? h('small', null, ' ' + nm) : null);
        })))
    });
  }
  /* 投手の交代（守りのチーム） */
  function openPitcher(ctx) {
    const sp = ctx.sport, g = ctx.game;
    const s = sp.situation(g);
    const nos = (g.teams[s.fld].players || []).map((p) => p.no);
    const used = s.pitchers[s.fld].filter((P) => P.pitches || P.bf);
    const pick = (no) => { sheet.close(); if (no !== s.pitcherNo) ctx.record({ type: 'pch', team: s.fld, no }, null, { key: 'pch:' + no }); };
    const sheet = ST.ui.sheet({
      title: `${ST.teamName(g, s.fld)}の投手（いまは ${s.pitcherNo != null ? '#' + s.pitcherNo : '—'}・${s.pitchCount}球）`,
      body: h('div', { class: 'bb-sheet' },
        used.length ? h('p', { class: 'note' }, 'この試合の投球数：' + used.map((P) => `#${P.no != null ? P.no : '?'} ${P.pitches}球`).join('・')) : null,
        h('p', { class: 'note' }, '新しい投手を選ぶと、そこから投球数を 0 から数えます。'),
        h('div', { class: 'bb-slots' }, nos.map((no) => h('button', { class: 'btn' + (no === s.pitcherNo ? ' on' : ''), dataset: { pno: no }, onclick: () => pick(no) }, '#' + no, ST.playerName(g, s.fld, no) ? h('small', null, ' ' + ST.playerName(g, s.fld, no)) : null))),
        h('button', { class: 'btn', id: 'btnPitcherKey', onclick: () => { sheet.close(); keypad('新しい投手の背番号', (no) => ctx.record({ type: 'pch', team: s.fld, no }, null, { key: 'pch:' + no })); } }, 'ほかの番号を入れる'))
    });
  }

  /* ---------- 一覧で直す（打者・投手・塁） ---------- */
  function editExtra(ctx, e, body, changed) {
    const sp = ctx.sport, g = ctx.game;
    const isBat = sp.PITCHES.includes(e.type) || sp.RESULTS.includes(e.type);
    if ((isBat || e.type === 'sub' || e.type === 'bat') && (e.team === 0 || e.team === 1)) {
      const lineup = (g.teams[e.team].players || []).map((p) => p.no);
      const n = sp.slotsOf(lineup, g.teams[e.team].order);
      body.append(h('div', { class: 'field' }, h('span', null, `${ST.teamName(g, e.team)}の打順`), h('div', { class: 'row nopick' },
        Array.from({ length: n }, (_, k) => h('button', { class: 'btn small' + (e.slot === k ? ' on' : ''), dataset: { eslot: String(k) }, onclick: () => {
          e.slot = k;
          if (isBat) e.no = lineup[k] || null;
          changed();
        } }, `${k + 1}番${isBat && lineup[k] ? ' #' + lineup[k] : ''}`)))));
    }
    if (e.type === 'pch' || e.type === 'sub') {
      const nos = (g.teams[e.team].players || []).map((p) => p.no);
      if (e.no != null && !nos.includes(e.no)) nos.push(e.no);
      body.append(h('div', { class: 'field' }, h('span', null, e.type === 'pch' ? '投手' : '代打の人'), h('div', { class: 'row nopick' },
        nos.map((no) => h('button', { class: 'btn small' + (e.no === no ? ' on' : ''), onclick: () => { e.no = no; changed(); } }, '#' + no)))));
    }
    if (e.type === 'base') {
      body.append(h('div', { class: 'field' }, h('span', null, '塁'), h('div', { class: 'row' },
        sp.BASE.map((b, i) => h('button', { class: 'btn small' + (e.base === i ? ' on' : ''), onclick: () => { e.base = i; changed(); } }, b)),
        h('button', { class: 'btn small' + (e.on ? ' on' : ''), onclick: () => { e.on = true; changed(); } }, '走者を置く'),
        h('button', { class: 'btn small' + (!e.on ? ' on' : ''), onclick: () => { e.on = false; changed(); } }, '走者を消す'))));
    }
  }

  /* ---------- メニュー・札 ---------- */
  function menuItems(ctx) {
    return [
      { icon: '⚾', label: '投手の交代', sub: '守りのチームの投手を代える（投球数は 0 から）', fn: () => openPitcher(ctx) },
      { icon: '🔁', label: '代打・打順を直す', sub: 'いまの打順に代打・次に打つ人を選ぶ', fn: () => openBatter(ctx) },
      { icon: '⏭', label: 'チェンジ（3アウトにする）', sub: 'アウトを記録しそこねたとき', fn: () => openInning(ctx) }
    ];
  }
  function coverExtra(ctx) {
    const g = ctx.game, sp = ctx.sport;
    const s = sp.situation(g);
    return h('p', { class: 'note' }, `1回表：${ST.teamName(g, s.bat)}の攻撃（${s.batter != null ? '1番 #' + s.batter : '1番'}）・${ST.teamName(g, s.fld)}の投手 ${s.pitcherNo != null ? '#' + s.pitcherNo : '（未定）'}`);
  }
  function endSummary(ctx) { return h('div', null, h('div', { class: 'endscore' }, h('span', null, ST.teamName(ctx.game, 0)), h('b', null, ST.scoreText(ctx.game)), h('span', null, ST.teamName(ctx.game, 1))), scoreboard(ctx.game)); }

  /* ---------- 集計 ---------- */
  function scoreboard(g) {
    const sp = SP();
    const st = sp.derive(g);
    const top = g.opts.top === 1 ? 1 : 0;
    const order = [top, 1 - top];
    const played = Math.max(st.line[0].length, st.line[1].length);
    const N = Math.max(Number(g.opts.inn) || 9, played);
    const chip = (tm) => h('i', { class: 'chip', style: { background: g.teams[tm].color } });
    return h('div', { class: 'boxwrap' }, h('table', { class: 'per bb-board', id: 'bbBoard' },
      h('thead', null, h('tr', null, h('th', null, ''), Array.from({ length: N }, (_, i) => h('th', null, String(i + 1))), h('th', null, 'R'), h('th', null, 'H'), h('th', null, 'E'))),
      h('tbody', null, order.map((tm) => h('tr', null, h('th', null, chip(tm), ST.teamName(g, tm)),
        Array.from({ length: N }, (_, i) => h('td', null, st.line[tm][i] != null ? String(st.line[tm][i]) : '')),
        h('td', { class: 'sum' }, String(st.score[tm])), h('td', null, String(st.hits[tm])), h('td', null, String(st.errs[tm])))))));
  }
  function stats(ctx, g) {
    const sp = SP();
    const st = sp.derive(g);
    const bat = sp.batting(g, st);
    const chip = (tm) => h('i', { class: 'chip', style: { background: g.teams[tm].color } });
    const cols = [['pa', '打席'], ['ab', '打数'], ['h', '安打'], ['d2', '二塁打'], ['d3', '三塁打'], ['hr', '本塁打'], ['bb', '四死球'], ['k', '三振'], ['sac', '犠打飛']];
    const batTable = (x) => h('div', { class: 'boxwrap' }, h('table', { class: 'box' },
      h('thead', null, h('tr', null, h('th', null, '打順'), h('th', null, '#'), h('th', { class: 'nm' }, '名前'), cols.map(([, l]) => h('th', null, l)), h('th', null, '打率'))),
      h('tbody', null,
        x.rows.filter((r) => r.s.pa || r.slot >= 0).map((r) => h('tr', null, h('td', null, r.slot >= 0 ? String(r.slot + 1) : '代'), h('td', { class: 'no' }, r.no != null ? r.no : '—'), h('td', { class: 'nm' }, r.name || ''),
          cols.map(([k]) => h('td', null, r.s[k] ? String(r.s[k]) : '')), h('td', null, sp.avg(r.s.h, r.s.ab)))),
        h('tr', { class: 'tot' }, h('td', null), h('td', { class: 'no' }), h('td', { class: 'nm' }, '合計'), cols.map(([k]) => h('td', null, String(x.total[k]))), h('td', null, sp.avg(x.total.h, x.total.ab))))));
    const pitTable = (tm) => {
      const list = st.pitchers[tm].filter((P) => P.pitches || P.bf || P.outs);
      if (!list.length) return h('p', { class: 'note' }, 'まだ投球の記録はありません。');
      const lim = Number(g.opts.plim) || 0;
      return h('div', { class: 'boxwrap' }, h('table', { class: 'box' },
        h('thead', null, h('tr', null, h('th', null, '投手'), h('th', { class: 'nm' }, '名前'), ['投球数', '投球回', '打者', '被安打', '奪三振', '与四死球', '失点'].map((l) => h('th', null, l)))),
        h('tbody', null, list.map((P) => h('tr', null, h('td', { class: 'no' }, P.no != null ? '#' + P.no : '—'), h('td', { class: 'nm' }, P.no != null ? ST.playerName(g, tm, P.no) : ''),
          h('td', { class: lim && P.pitches >= lim ? 'bb-over' : null }, String(P.pitches)), h('td', null, sp.ipText(P.outs)), h('td', null, String(P.bf)), h('td', null, String(P.h)), h('td', null, String(P.k)), h('td', null, String(P.bb)), h('td', null, String(P.r)))))));
    };
    return h('div', null,
      scoreboard(g),
      [0, 1].map((tm) => h('section', { class: 'teamstat' },
        h('h3', null, chip(tm), ST.teamName(g, tm), h('small', null, ` ${st.score[tm]}点・安打 ${st.hits[tm]}・打率 ${sp.avg(bat[tm].total.h, bat[tm].total.ab)}`)),
        h('h4', { class: 'bb-h4' }, '打者'), batTable(bat[tm]),
        h('h4', { class: 'bb-h4' }, '投手'), pitTable(tm))),
      h('p', { class: 'note' }, '打数＝打席から四死球・犠打・犠飛を引いたもの。失点は「その投手が投げている間に入った点」です。自責点・打点は数えていません。' + (Number(g.opts.plim) ? `投球数が目安（${g.opts.plim}球）に届いた投手は赤で出しています。` : '')));
  }

  ST.addView('baseball', { setup, build, stats, editExtra, menuItems, coverExtra, endSummary });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/v/swim.js */
/* スポーツ タップ記録 — 水泳の画面（準備のレーンと名前・記録の画面・結果）
   上の帯：時計（いまの組のスタートからの時間。0.01 秒）・▶ スタート・「2組目」・種目と距離・メニュー
   レーンの行：レーン番号・名前・何回目のタッチか・スプリットとラップ（ゴールならタイムと順位）・「…」・大きな「タッチ」ボタン
   下の帯：次の組へ・いま記録したもの・取り消す
   次の組の準備ができてスタートを待つ間は、レーンの行の場所に「▶ 2組目 スタート」の札を出す。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const { h } = ST.ui;
  const SP = () => ST.SPORTS.swim;

  /* いまの組（スタート前・次の組を待っている間は、これから泳ぐ組 game.pending） */
  function stateOf(g, t) {
    const sp = SP();
    if (!g.startedAt) { const p = g.pending || { heat: 1, lanes: sp.cleanLanes([], g.opts.lanes), spec: sp.specOf(g.opts) }; return { before: true, P: p }; }
    if (sp.waiting(g)) return { waiting: true, P: g.pending, H: sp.heatAt(g, t) };
    const H = sp.heatAt(g, t) || sp.heats(g)[0];
    if (!H) return { before: true, P: g.pending || { heat: 1, lanes: sp.cleanLanes([], g.opts.lanes), spec: sp.specOf(g.opts) } };      // （組の始まりの記録がない：直したとき）
    return { H };
  }
  /* 要素を足す（DOM の append は null を「null」という文字にするので、ないものは渡さない） */
  const put = (el, ...kids) => el.append(...kids.filter((k) => k != null && k !== false));
  const raw = (ctx) => (ctx.game.startedAt ? ((ctx.game.endedAt || Date.now()) - ctx.game.startedAt) / 1000 : 0);

  function build(ctx) {
    const g = ctx.game, sp = SP();
    const L = { rows: new Map(), key: '' };
    // 上の帯
    L.tv = h('span', { class: 'swtv', id: 'tval' }, '0.00');
    L.clock = h('button', { class: 'clock swclock', id: 'clock', title: 'いまの組のスタートからの時間', onclick: ctx.openMenu }, h('span', { class: 'recdot' }), L.tv);
    const startB = ctx.ui.startBtn();
    L.heatBtn = h('button', { class: 'period swheat', id: 'btnHeat', 'aria-label': '組', onclick: () => openHeats(ctx, L) }, '1組目');
    L.ev1 = h('b', null, ''); L.ev2 = h('small', null, '');
    L.ev = h('div', { class: 'swev', id: 'swEvent' }, L.ev1, L.ev2);
    const bar = h('header', { class: 'lbar' }, L.clock, startB.el, L.heatBtn, L.ev, ctx.ui.menuBtn());
    // レーン
    L.lanes = h('main', { class: 'swlanes', id: 'swLanes', role: 'group', 'aria-label': 'レーン' });
    L.banner = h('div', { class: 'swbanner', id: 'swBanner', hidden: true });
    L.wait = h('div', { class: 'swwait', id: 'swWait', hidden: true });
    L.next = h('button', { class: 'gb swnext', id: 'btnNextHeat', onclick: () => openNext(ctx, L) }, h('b', null, '次の組へ'), h('small', null, '名前を入れかえる'));
    const rootEl = h('div', { class: 'live fam-swim' + (ctx.sprefs.side === 'left' ? ' sw-left' : '') }, bar,
      h('div', { class: 'stagewrap swstage' }, h('div', { class: 'swcol' }, L.banner, L.lanes, L.wait), ctx.ui.cover()), ctx.ui.footer([L.next]));
    L.root = rootEl;
    rootEl.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || !L.lanes.contains(b)) return;
      const ln = Number(b.dataset.lane);
      if (b.classList.contains('swtouch')) touch(ctx, L, ln, b);
      else if (b.classList.contains('swmore')) laneMenu(ctx, L, ln);
    });

    /* レーンの行を並べる（組・名前・並び順が変わったとき） */
    function fill() {
      const st = stateOf(g, ctx.elapsed());
      const lanes = st.H && !st.waiting ? st.H.lanes : st.P.lanes;
      const spec = st.H && !st.waiting ? st.H.spec : st.P.spec;
      const circle = spec.mode === 'circle';
      L.lanes.innerHTML = '';
      L.rows = new Map();
      const list = lanes.slice();
      if (ctx.sprefs.order === 'desc') list.reverse();
      list.forEach((ln) => {
        const name = h('b', { class: 'swnm' }, ln.name || (circle ? `${ln.lane}番目に出る人` : `レーン ${ln.lane}`));
        const team = h('small', { class: 'swteam' }, ln.team || '');
        const stat = h('div', { class: 'swstat' });
        const big = h('b', { class: 'swbig' }, circle ? 'ゴール' : 'タッチ');
        const sub = h('small', { class: 'swsub' }, '');
        const btn = h('button', { class: 'swtouch', dataset: { lane: ln.lane }, 'aria-label': `${circle ? ln.lane + '番目' : 'レーン' + ln.lane}${ln.name ? ' ' + ln.name : ''} の${circle ? 'ゴール' : 'タッチ'}` }, big, sub);
        const row = h('div', { class: 'swrow' + (ln.name ? '' : ' noname'), dataset: { lane: ln.lane } },
          h('div', { class: 'swl' }, h('b', null, String(ln.lane)), h('small', null, circle ? '番目' : 'レーン')),
          h('div', { class: 'swinfo' }, h('div', { class: 'swwho' }, name, team), stat),
          h('button', { class: 'swmore', dataset: { lane: ln.lane }, 'aria-label': `レーン${ln.lane}のメニュー（失格・取り消し・名前）` }, '…'),
          btn);
        L.rows.set(ln.lane, { row, stat, big, sub, btn });
        L.lanes.append(row);
      });
      L.key = keyOf();
      layout();
    }
    function keyOf() {
      const st = stateOf(g, ctx.elapsed());
      const x = st.H && !st.waiting ? st.H : null;
      return [st.before ? 'b' : st.waiting ? 'w' + st.P.heat : 'h' + (x ? x.id : ''), JSON.stringify(x ? x.lanes : st.P.lanes), x ? x.spec.mode : st.P.spec.mode, ctx.sprefs.order].join('|');
    }
    function layout() {
      if (!rootEl.isConnected) return;
      const n = Math.max(1, L.rows.size);
      const H = L.lanes.clientHeight || 400;
      const rowH = (H - 8 - (n - 1) * 5) / n;
      rootEl.classList.toggle('short', (rootEl.clientHeight || root.innerHeight) < 430);
      L.lanes.style.setProperty('--rh', Math.max(48, Math.min(130, rowH)) + 'px');
      L.lanes.classList.toggle('tight', rowH < 62);
      L.lanes.classList.toggle('roomy', rowH >= 84);
    }

    /* 表示を書き換える */
    function update() {
      if (keyOf() !== L.key) fill();
      startB.update();
      const t = ctx.elapsed();
      const st = stateOf(g, t);
      const spec = st.H && !st.waiting ? st.H.spec : st.P.spec;
      const hno = st.H && !st.waiting ? st.H.heat : st.P.heat;
      const unit = sp.unitOf(spec);
      L.heatBtn.textContent = `${hno}${unit}目`;
      L.ev1.textContent = sp.specText(spec, true).trim();
      L.ev2.textContent = spec.mode === 'circle' ? `${spec.pool}mプール・${(st.H && !st.waiting ? st.H.lanes : st.P.lanes).length}人` : `${spec.pool}mプール・タッチ${sp.touchesOf(spec)}回`;
      L.lanes.hidden = !!st.waiting;
      L.wait.hidden = !st.waiting;
      if (st.waiting) renderWait(ctx, L, st.P);
      const done = st.H && !st.waiting ? sp.heatDone(g, st.H, t) : false;
      L.next.hidden = !!st.waiting;
      L.next.classList.toggle('ready', !!done);
      L.banner.hidden = !(done && !g.endedAt);
      if (done && !g.endedAt) {
        L.banner.innerHTML = '';
        L.banner.append(h('span', null, `🏁 ${hno}${unit}目 全員が終わりました`), h('button', { class: 'btn small', onclick: ctx.openStats }, '結果を見る'), h('button', { class: 'btn small primary', id: 'btnBannerNext', onclick: () => openNext(ctx, L) }, `次の${unit}へ →`));
      }
      if (!st.waiting) rows(st, t);
      tickClock();
      layout();          // （上の「全員が終わりました」の帯が出る・消えると、行の高さが変わる）
    }
    /* レーンの行の中身 */
    function rows(st, t) {
      const H = st.H && !st.waiting ? st.H : null;
      if (!H) { L.rows.forEach((r) => { r.stat.textContent = st.before ? 'スタート前' : ''; r.sub.textContent = ''; }); return; }
      const rs = sp.results(g, H);
      if (H.spec.mode === 'circle') {
        rs.forEach((x, idx) => {
          const r = L.rows.get(x.lane);
          if (!r) return;
          const now = sp.circleNow(H, idx, t, x);
          const last = x.reps.filter((y) => y.time != null).pop();
          r.row.classList.toggle('flag', !!x.flag);
          r.row.classList.toggle('done', !x.flag && x.done >= H.spec.reps);
          r.stat.innerHTML = '';
          if (x.flag) { r.stat.append(h('span', { class: 'swflag' }, sp.FLAG[x.flag])); r.big.textContent = sp.FLAG_SHORT[x.flag]; r.sub.textContent = ''; return; }
          const cur = now.before ? h('span', { class: 'swrun wait' }, `スタートまで ${ST.fmtTime(Math.max(0, now.start - t))}`)
            : now.finished ? h('span', { class: 'swrun fin' }, '全部 泳ぎました')
              : now.swimming ? h('span', { class: 'swrun', dataset: { since: now.start } }, `${now.r}本目 ${ST.fmtRace(t - now.start)}`)
                : h('span', { class: 'swrun wait' }, now.next != null ? `次（${now.r + 1}本目）まで ${ST.fmtTime(Math.max(0, now.next - t))}` : '');
          r.stat.append(cur, h('span', { class: 'swsplit' }, last ? `${last.r}本目 ${ST.fmtRace(last.time)}` : '', x.avg != null ? h('small', null, ` 平均 ${ST.fmtRace(x.avg)}`) : null));
          r.big.textContent = x.done >= H.spec.reps ? '✓' : 'ゴール';
          r.sub.textContent = `${x.done}/${H.spec.reps}本`;
        });
        return;
      }
      rs.forEach((x) => {
        const r = L.rows.get(x.lane);
        if (!r) return;
        r.row.classList.toggle('flag', !!x.flag);
        r.row.classList.toggle('done', x.done && !x.flag);
        if (x.done || x.flag) r.row.classList.remove('last');
        r.row.classList.toggle('first', x.rank === 1 && !x.flag);
        r.stat.innerHTML = '';
        if (x.flag) {
          put(r.stat, h('span', { class: 'swflag' }, sp.FLAG[x.flag]), x.done ? h('small', null, ` ${ST.fmtRace(x.time)}`) : null);
          r.big.textContent = sp.FLAG_SHORT[x.flag]; r.sub.textContent = '';
          return;
        }
        if (x.done) {
          put(r.stat, h('span', { class: 'swtime' }, ST.fmtRace(x.time)), h('span', { class: 'swrank' }, `${x.rank}位`),
            x.need > 1 ? h('small', { class: 'swlaps' }, x.laps.map((l) => ST.fmtRace(l)).join(' / ')) : null);
          r.big.textContent = '✓'; r.sub.textContent = 'ゴール';
          return;
        }
        const n = x.splits.length;
        if (n) r.stat.append(h('span', { class: 'swsplit' }, `${n * H.spec.pool}m ${ST.fmtRace(x.splits[n - 1])}`), h('small', null, `（ラップ ${ST.fmtRace(x.laps[n - 1])}）`));
        else r.stat.append(h('span', { class: 'swsplit dim' }, 'まだタッチなし'));
        r.row.classList.toggle('last', n + 1 >= x.need);
        r.big.textContent = n + 1 >= x.need ? 'ゴール' : 'タッチ';
        r.sub.textContent = `${n}/${x.need}`;
      });
    }
    /* 時計（いまの組のタイム）：画面の書き換えごとに（0.01 秒まで動いて見えるよう、requestAnimationFrame で） */
    function tickClock() {
      const st = stateOf(g, ctx.elapsed());
      let txt = '0.00';
      const H = st.H && !st.waiting ? st.H : null;
      let paused = !g.startedAt || !!st.waiting || !!g.endedAt;
      if (H) {
        const rs = sp.results(g, H);
        const fin = H.spec.mode !== 'circle' && sp.heatDone(g, H, null) && rs.some((x) => x.done);
        if (fin) { txt = ST.fmtRace(Math.max(...rs.filter((x) => x.done).map((x) => x.time))); paused = true; }
        else txt = ST.fmtRace(Math.max(0, raw(ctx) - H.start));
      }
      if (L.tv.textContent !== txt) L.tv.textContent = txt;
      L.clock.classList.toggle('paused', paused);
      L.clock.hidden = !g.startedAt;
    }
    let rq = 0, lastRows = 0;
    const loop = () => {
      rq = root.requestAnimationFrame ? requestAnimationFrame(loop) : 0;
      if (!rootEl.isConnected) return;
      tickClock();
      // 練習の「泳いでいる時間」「スタートまで」は 0.1 秒ごと
      const now = Date.now();
      if (now - lastRows > 90) { lastRows = now; const st = stateOf(g, ctx.elapsed()); if (st.H && !st.waiting && st.H.spec.mode === 'circle') rows(st, raw(ctx)); }
    };
    if (root.requestAnimationFrame) rq = requestAnimationFrame(loop);
    fill();
    L.update = update;
    L.layout = layout;
    L.tick = () => { tickClock(); const st = stateOf(g, ctx.elapsed()); if (st.H && !st.waiting && st.H.spec.mode === 'circle') rows(st, raw(ctx)); else if (st.H && !st.waiting) { /* レースは記録したときだけ */ } };
    L.refresh = () => { fill(); update(); };
    L.destroy = () => { if (rq && root.cancelAnimationFrame) cancelAnimationFrame(rq); rq = 0; };
    return L;
  }

  /* タッチ（壁にさわった瞬間） */
  function touch(ctx, L, ln, btn) {
    const g = ctx.game, sp = SP();
    if (!ctx.canRecord()) return;
    const t = ctx.elapsed();
    const st = stateOf(g, t);
    if (st.waiting) { ctx.say('先に、次の組の「▶ スタート」を押してください', 'warn'); return; }
    const H = st.H;
    if (!H) return;
    const rs = sp.results(g, H);
    if (H.spec.mode === 'circle') {
      const idx = H.lanes.findIndex((x) => x.lane === ln);
      const x = rs[idx];
      if (!x) return;
      if (x.flag) { ctx.say(`${ln}番目は ${sp.FLAG[x.flag]} にしています（「…」で取り消せます）`, 'warn'); return; }
      const now = sp.circleNow(H, idx, t, x);
      if (now.before) { ctx.say(`${ln}番目は、まだスタートしていません（1本目は ${ST.fmtTime(now.start)} から）`, 'warn'); return; }
      if (x.done >= H.spec.reps && now.finished) { ctx.say(`${ln}番目は、もう ${H.spec.reps}本 泳ぎました`, 'warn'); return; }
    } else {
      const x = rs.find((y) => y.lane === ln);
      if (x && x.flag) { ctx.say(`レーン${ln}は ${sp.FLAG[x.flag]} にしています（「…」で取り消せます）`, 'warn'); return; }
      if (x && x.done) { ctx.say(`レーン${ln}は、もうゴールしています（${ST.fmtRace(x.time)}）`, 'warn'); return; }
    }
    const e = ctx.record({ type: 'touch', lane: ln }, btn, { key: 'touch:' + ln, dedupeMs: 1000 });
    if (e) {
      const info = sp.touchInfo(g, e);
      if (info && info.goal && info.rank === 1) ctx.feel('made');
    }
  }

  /* レーンの「…」：失格・棄権・欠場・いちばん新しいタッチの取り消し・名前 */
  function laneMenu(ctx, L, ln) {
    const g = ctx.game, sp = SP();
    const st = stateOf(g, ctx.elapsed());
    const H = st.H && !st.waiting ? st.H : null;
    const target = H ? H.e.lanes : st.P.lanes;
    const lane = target.find((x) => x.lane === ln) || { lane: ln, name: '', team: '' };
    const body = h('div', { class: 'swsheet' });
    body.append(nameInputs([lane], (i, k, v) => { lane[k] = v; ctx.save(); L.refresh(); }, H && H.spec.mode === 'circle'));
    if (H && g.startedAt) {
      const flags = sp.flagsIn(g, H);
      const f = flags.get(ln);
      const flagBtn = (type) => h('button', { class: 'btn' + (f && f.type === type ? ' on' : ''), dataset: { flag: type }, onclick: () => {
        s.close();
        if (f) ST.removeEvent(g, f.id);
        if (!f || f.type !== type) ctx.record({ type, lane: ln, heat: H.heat }, null, { force: true, nodedupe: true });
        else { ctx.save(); ctx.update(); }
        ctx.say(!f || f.type !== type ? `レーン${ln}：${sp.FLAG[type]}` : `レーン${ln}：${sp.FLAG[type]} を取り消しました`, 'ok');
      } }, f && f.type === type ? `${sp.FLAG[type]} を取り消す` : sp.FLAG[type]);
      body.append(h('div', { class: 'field' }, h('span', null, '失格・棄権・欠場'), h('div', { class: 'row' }, ['dq', 'dnf', 'dns'].map(flagBtn)),
        h('p', { class: 'note' }, '順位から外します（タイムは残ります）。もう一度押すと取り消せます。')));
      const ts = sp.touchesIn(g, H).get(ln) || [];
      if (ts.length) {
        const last = ts[ts.length - 1];
        body.append(h('div', { class: 'field' }, h('span', null, 'タッチ'),
          h('button', { class: 'btn', id: 'btnUndoLane', onclick: () => {
            s.close();
            ST.removeEvent(g, last.id);
            ctx.save(); ctx.update();
            ctx.say(`レーン${ln}のタッチを取り消しました（${ST.fmtRace(last.t - H.start)}）`, 'warn', 5000, { label: '↷ 戻す', onClick: () => { g.events.push(last); ctx.save(); ctx.update(); } });
          } }, `いちばん新しいタッチを取り消す（${ST.fmtRace(last.t - H.start)}）`),
          h('p', { class: 'note' }, '時刻を少しだけ直すときは「≡ メニュー」→「記録の一覧」から。')));
      }
    }
    const s = ST.ui.sheet({ title: `${H && H.spec.mode === 'circle' ? ln + '番目' : 'レーン' + ln}${lane.name ? ' ' + lane.name : ''}`, body, foot: [h('button', { class: 'btn primary', onclick: () => ST.ui.closeSheet() }, 'とじる')] });
  }

  /* 名前・学校の入れる欄。onChange(i, 'name'|'team', 値) */
  function nameInputs(lanes, onChange, circle) {
    return h('div', { class: 'swnames' }, lanes.map((ln, i) => h('div', { class: 'swnrow', dataset: { lane: ln.lane } },
      h('b', { class: 'swnl' }, circle ? `${ln.lane}番目` : `L${ln.lane}`),
      h('input', { type: 'text', class: 'swin-name', maxlength: 16, placeholder: '名前', value: ln.name || '', onchange: (e) => onChange(i, 'name', e.target.value.trim().slice(0, 16)) }),
      h('input', { type: 'text', class: 'swin-team', maxlength: 16, placeholder: '学校など', value: ln.team || '', onchange: (e) => onChange(i, 'team', e.target.value.trim().slice(0, 16)) }))));
  }

  /* 種目・距離などのボタン（準備の画面と同じ選び方）。spec を書きかえて onChange */
  function specButtons(spec, onChange) {
    const sp = SP();
    const box = h('div', { class: 'swspec' });
    const draw = () => {
      box.innerHTML = '';
      sp.optFields.filter((f) => !f.hidden || !f.hidden(spec)).forEach((f) => {
        box.append(h('div', { class: 'field' }, h('span', null, f.label), h('div', { class: 'row optrow', dataset: { opt: f.key } },
          f.choices.map(([v, lab]) => h('button', { class: 'btn small' + (String(spec[f.key]) === String(v) ? ' on' : ''), dataset: { v: String(v) }, onclick: () => { spec[f.key] = v; draw(); if (onChange) onChange(f.key); } }, lab)))));
      });
    };
    draw();
    return box;
  }

  /* 次の組へ（種目・距離・名前を決めて、スタートを待つ） */
  function openNext(ctx, L, edit) {
    const g = ctx.game, sp = SP();
    if (!g.startedAt) { ctx.say('先に「▶ スタート」で1組目を始めてください', 'warn'); return; }
    const t = ctx.elapsed();
    const last = sp.heats(g).slice(-1)[0];
    const editing = edit && sp.waiting(g);
    const base = editing ? g.pending : { heat: sp.lastHeatNo(g) + 1, lanes: last.lanes, spec: last.spec };
    const spec = Object.assign({}, base.spec, { lanes: base.lanes.length });
    let lanes = sp.cleanLanes(base.lanes.map((x) => ({ name: x.name, team: x.team })), spec.lanes);
    const notDone = last && !editing && !sp.heatDone(g, last, t);
    const namesBox = h('div');
    const drawNames = () => {
      lanes = sp.cleanLanes(lanes, spec.lanes);
      namesBox.innerHTML = '';
      namesBox.append(nameInputs(lanes, (i, k, v) => { lanes[i][k] = v; }, spec.mode === 'circle'));
    };
    const unit = sp.unitOf(spec);
    const body = h('div', { class: 'swsheet swnext-sheet' },
      notDone ? h('p', { class: 'note warn' }, `⚠ ${last.heat}${sp.unitOf(last.spec)}目に、まだ終わっていないレーンがあります（このまま次へ進めます。あとからでもタッチは直せます）。`) : null,
      h('h4', null, '種目・距離'),
      specButtons(spec, (key) => { if (key === 'lanes' || key === 'mode') drawNames(); }),
      h('h4', null, '名前'),
      h('div', { class: 'row' },
        h('button', { class: 'btn small', id: 'btnSameNames', onclick: () => { lanes = sp.cleanLanes(last.lanes.map((x) => ({ name: x.name, team: x.team })), spec.lanes); drawNames(); } }, '前の組と同じ名前'),
        h('button', { class: 'btn small', id: 'btnClearNames', onclick: () => { lanes = sp.cleanLanes([], spec.lanes); drawNames(); } }, '名前を消す')),
      namesBox);
    drawNames();
    ST.ui.sheet({
      title: editing ? `${base.heat}${unit}目を直す` : `次の組（${base.heat}${unit}目）`, wide: true, body,
      foot: [h('button', { class: 'btn', onclick: () => ST.ui.closeSheet() }, 'やめる'),
        h('button', { class: 'btn primary', id: 'btnNextReady', onclick: () => {
          const s2 = sp.specOf(spec);
          g.pending = { heat: base.heat, lanes: sp.cleanLanes(lanes, spec.lanes), spec: s2 };
          Object.assign(g.opts, s2, { lanes: spec.lanes });
          const pr = ctx.sprefs;
          pr.lanes = sp.cleanLanes(lanes, sp.MAXLANES).map((x) => ({ name: x.name, team: x.team }));
          ctx.savePrefs();
          ctx.save();
          ST.ui.closeSheet();
          L.refresh();
          ctx.say(`${base.heat}${sp.unitOf(s2)}目の準備ができました。スタートの合図で「▶ スタート」`, 'ok', 4000);
        } }, '準備できた（スタートを待つ）')]
    });
  }
  /* 次の組のスタートを待つ札 */
  function renderWait(ctx, L, P) {
    const g = ctx.game, sp = SP();
    const unit = sp.unitOf(P.spec);
    L.wait.innerHTML = '';
    const named = P.lanes.filter((x) => x.name);
    L.wait.append(h('div', { class: 'cover-card swwaitcard' },
      h('b', { class: 'endtitle' }, `${P.heat}${unit}目：${sp.specText(P.spec)}`),
      h('p', { class: 'note' }, P.spec.mode === 'circle' ? `${P.spec.pool}mプール・${P.lanes.length}人` : `${P.spec.pool}mプール・タッチ${sp.touchesOf(P.spec)}回・${P.lanes.length}レーン`),
      named.length ? h('p', { class: 'swwaitnames' }, named.map((x) => `L${x.lane} ${x.name}`).join('　')) : null,
      h('button', { class: 'startbig', id: 'btnHeatStart', onclick: (e) => {
        const ev = ctx.record(Object.assign({ type: 'heat', heat: P.heat, lanes: sp.cleanLanes(P.lanes) }, P.spec), e.currentTarget, { key: 'heat:' + P.heat, dedupeMs: 1500 });
        if (ev) { L.refresh(); ctx.say(`${P.heat}${unit}目 スタート`, 'ok'); }
      } }, `▶ ${P.heat}${unit}目 スタート`),
      h('p', null, h('b', null, 'スタートの合図（ピッ）の瞬間'), 'に押してください。'),
      h('div', { class: 'row center' },
        h('button', { class: 'btn small', onclick: () => openNext(ctx, L, true) }, '種目・名前を直す'),
        h('button', { class: 'btn small', id: 'btnCancelNext', onclick: () => { g.pending = null; ctx.save(); L.refresh(); ctx.say('前の組に戻りました', 'ok'); } }, `やめる（${P.heat - 1}${unit}目に戻る）`))));
  }

  /* 組の一覧（上の帯の「2組目」） */
  function openHeats(ctx, L) {
    const g = ctx.game, sp = SP();
    const hs = sp.heats(g);
    const s = ST.ui.sheet({
      title: '組', wide: true,
      body: h('div', { class: 'swsheet' },
        hs.length ? h('div', { class: 'loglist' }, hs.map((H) => {
          const rs = sp.activeRows(sp.results(g, H));
          const top = H.spec.mode === 'circle' ? `${rs.length}人` : rs.filter((x) => x.rank === 1).map((x) => `1位 ${x.name || 'L' + x.lane} ${ST.fmtRace(x.time)}`).join('・') || `${rs.length}人`;
          return h('div', { class: 'lrow per swhrow' }, h('b', { class: 'lt' }, `${H.heat}${sp.unitOf(H.spec)}目`), h('span', null, `${sp.specText(H.spec)}（${ST.fmtTime(H.start)} スタート）・${top}`));
        })) : h('p', { class: 'note' }, 'まだ始まっていません。'),
        sp.waiting(g) ? h('p', { class: 'note' }, `${g.pending.heat}${sp.unitOf(g.pending.spec)}目：スタート待ち（${sp.specText(g.pending.spec)}）`) : null),
      foot: [h('button', { class: 'btn', onclick: () => { s.close(); ctx.openStats(); } }, '📊 結果'),
        g.startedAt && !sp.waiting(g) ? h('button', { class: 'btn primary', onclick: () => { s.close(); openNext(ctx, L); } }, '次の組へ') : null,
        h('button', { class: 'btn', onclick: () => ST.ui.closeSheet() }, 'とじる')]
    });
  }

  /* ---------- 準備の画面：レーンと名前 ---------- */
  function setup(ctx, T, o) {
    const sp = SP();
    const edit = o && o.edit;
    const target = () => {
      if (!edit) return null;
      const g = T;
      if (g.startedAt && !sp.waiting(g)) { const last = sp.heats(g).slice(-1)[0]; return last ? last.e : null; }
      return g.pending || null;
    };
    const lanesOf = () => {
      if (!edit) return T.lanes;
      const x = target();
      return x ? x.lanes : [];
    };
    const card = h('section', { class: 'card swsetup', id: 'swSetup' });
    const draw = () => {
      card.innerHTML = '';
      const circle = T.opts.mode === 'circle';
      const n = T.opts.lanes;
      if (!edit) T.lanes = sp.cleanLanes(T.lanes, sp.MAXLANES);
      else { const x = target(); if (x) x.lanes = sp.cleanLanes(x.lanes, n); }
      const shown = lanesOf().slice(0, n);
      card.append(...[h('h2', null, circle ? `泳ぐ人（${n}人・スタートの順）` : `レーンと名前（${n}レーン）`),
        h('p', { class: 'note' }, circle ? '同じレーンで、上から順にスタートします（ずれは「人ごとのスタートのずれ」）。名前はなくても大丈夫です。' : '名前・学校は、なくても大丈夫です（入れた名前は、次の計測でも入っています）。2組目からは、記録の画面の「次の組へ」で入れかえます。'),
        edit && T.startedAt ? h('p', { class: 'note' }, `いまの組（${sp.heats(T).length ? sp.heats(T).slice(-1)[0].heat : 1}${sp.unitOf(T.opts)}目）の名前を直します。`) : null,
        nameInputs(shown, (i, k, v) => {
          shown[i][k] = v;
          if (!edit) { const pr = ctx.sprefs; pr.lanes = T.lanes.map((x) => ({ name: x.name, team: x.team })); ctx.savePrefs(); }
          else if (o.changed) o.changed();
        }, circle),
        h('div', { class: 'row' }, h('button', { class: 'btn small', id: 'btnClearAll', onclick: () => {
          lanesOf().forEach((x) => { x.name = ''; x.team = ''; });
          if (!edit) { const pr = ctx.sprefs; pr.lanes = []; ctx.savePrefs(); } else if (o.changed) o.changed();
          draw();
        } }, '名前を全部消す')),
        circle ? null : h('p', { class: 'note' }, `タッチの回数：${sp.touchesOf(T.opts)}回（${T.opts.dist}m ÷ ${T.opts.pool}m）${T.opts.dist < T.opts.pool ? '・⚠ プールより短い距離です' : ''}`),
        h('p', { class: 'note' }, '種目・距離・プール・レーンの数は、下の「種目・距離」で選びます。')].filter(Boolean));      // （DOM の append は null を「null」という文字にするので、ないものは渡さない）
    };
    draw();
    // 種目・距離・レーンの数を変えたら（骨組みの「試合の形式」）：名前の欄を作り直す。記録中なら、いまの組（次の組）にも入れる
    sp.onOpts = (T2, key) => {
      if (edit) {
        const x = target();
        const g = T2;
        const s2 = sp.specOf(g.opts);
        if (x && x.type === 'heat') { Object.assign(x, s2); x.lanes = sp.cleanLanes(x.lanes, g.opts.lanes); }
        else if (x) { x.spec = s2; x.lanes = sp.cleanLanes(x.lanes, g.opts.lanes); }
        ctx.save();
      }
      draw();
    };
    return card;
  }

  /* ---------- 結果（集計） ---------- */
  function stats(ctx, g) {
    const sp = SP();
    const hs = sp.heats(g);
    if (!hs.length) return h('p', { class: 'note' }, 'まだ記録はありません（▶ スタートで1組目が始まります）。');
    const box = h('div', { class: 'swstats' });
    hs.slice().reverse().forEach((H) => {
      const rs = sp.activeRows(sp.results(g, H));
      const unit = sp.unitOf(H.spec);
      box.append(h('h3', null, `${H.heat}${unit}目：${sp.specText(H.spec)}`, h('small', null, ` ${H.spec.pool}mプール・${ST.fmtTime(H.start)} スタート`)));
      if (H.spec.mode === 'circle') {
        const R = H.spec.reps;
        box.append(h('div', { class: 'boxwrap' }, h('table', { class: 'box swtable' },
          h('thead', null, h('tr', null, h('th', null, '順'), h('th', { class: 'nm' }, '名前'), Array.from({ length: R }, (_, i) => h('th', null, `${i + 1}本`)), h('th', null, '平均'), h('th', null, 'ベスト'))),
          h('tbody', null, rs.map((x) => h('tr', { class: x.flag ? 'unk' : null }, h('td', { class: 'no' }, String(x.lane)), h('td', { class: 'nm' }, x.name || '', x.team ? h('small', null, ` ${x.team}`) : null),
            x.reps.map((r) => h('td', { class: r.time != null && r.time === x.best ? 'best' : null }, r.time != null ? ST.fmtRace(r.time) : '')),
            h('td', { class: 'sum' }, x.flag ? sp.FLAG_SHORT[x.flag] : x.avg != null ? ST.fmtRace(x.avg) : ''), h('td', null, x.best != null ? ST.fmtRace(x.best) : '')))))));
        return;
      }
      const need = sp.touchesOf(H.spec);
      const order = rs.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99) || a.lane - b.lane);
      box.append(h('div', { class: 'boxwrap' }, h('table', { class: 'box swtable' },
        h('thead', null, h('tr', null, h('th', null, '順位'), h('th', null, 'L'), h('th', { class: 'nm' }, '名前'), h('th', null, 'タイム'), need > 1 ? Array.from({ length: need }, (_, i) => h('th', null, `${(i + 1) * H.spec.pool}m`)) : null)),
        h('tbody', null, order.map((x) => h('tr', { class: x.flag || !x.done ? 'unk' : x.rank === 1 ? 'win' : null },
          h('td', { class: 'no' }, x.flag ? sp.FLAG_SHORT[x.flag] : x.rank ? String(x.rank) : '—'), h('td', null, String(x.lane)),
          h('td', { class: 'nm' }, x.name || '', x.team ? h('small', null, ` ${x.team}`) : null),
          h('td', { class: 'sum' }, x.done ? ST.fmtRace(x.time) : x.splits.length ? '途中' : ''),
          need > 1 ? Array.from({ length: need }, (_, i) => h('td', { class: 'swsp' }, x.splits[i] != null ? [ST.fmtRace(x.splits[i]), h('small', null, ST.fmtRace(x.laps[i]))] : '')) : null))))));
    });
    // 同じ種目の組をまとめた総合順位（2組以上あるときだけ）
    sp.overall(g).filter((gr) => gr.heats > 1 && gr.rows.length).forEach((gr) => {
      box.append(h('h3', { class: 'swall' }, `総合順位：${gr.label}`, h('small', null, ` ${gr.heats}組`)),
        h('div', { class: 'boxwrap' }, h('table', { class: 'box swtable' },
          h('thead', null, h('tr', null, h('th', null, '順位'), h('th', { class: 'nm' }, '名前'), h('th', null, '組'), h('th', null, 'L'), h('th', null, 'タイム'))),
          h('tbody', null, gr.rows.map((x) => h('tr', { class: x.rank === 1 ? 'win' : null }, h('td', { class: 'no' }, String(x.rank)), h('td', { class: 'nm' }, x.name || `（${x.heat}組 L${x.lane}）`, x.team ? h('small', null, ` ${x.team}`) : null), h('td', null, `${x.heat}組`), h('td', null, String(x.lane)), h('td', { class: 'sum' }, ST.fmtRace(x.time))))))));
    });
    box.prepend(h('p', { class: 'note' }, 'タイムは、タッチのボタンを押した瞬間から計ったものです（人が押すので、0.1〜0.2 秒くらいずれることがあります）。スプリットの下の小さな数はラップ。'));
    return box;
  }

  /* 記録を直すとき：タッチのレーン・失格の組とレーン */
  function editExtra(ctx, e, body, changed) {
    const g = ctx.game, sp = SP();
    if (e.type === 'heat') {
      body.append(h('div', { class: 'field' }, h('span', null, `${e.heat}${sp.unitOf(e)}目：${sp.specText(sp.specOf(e))}`),
        h('p', { class: 'note' }, '時刻を直すと、この組のタイムが全部変わります（スタートの合図に合わせて直してください）。名前・距離は「≡ メニュー」→「種目・名前を直す」（いまの組）から。')));
      return;
    }
    const H = e.type === 'touch' ? sp.heatAt(g, e.t) : sp.heatByNo(g, e.heat);
    if (e.type === 'touch') {
      const info = sp.touchInfo(g, e);
      body.append(h('p', { class: 'note swinfo-edit' }, `${H ? H.heat + sp.unitOf(H.spec) + '目・' : ''}${sp.touchText(info)}`));
    } else {
      const hs = sp.heats(g);
      body.append(h('div', { class: 'field' }, h('span', null, '組'), h('div', { class: 'row' }, hs.map((x) => h('button', { class: 'btn small' + (x.heat === e.heat ? ' on' : ''), onclick: () => { e.heat = x.heat; changed(); } }, `${x.heat}${sp.unitOf(x.spec)}目`)))));
    }
    const lanes = H ? H.lanes : [];
    body.append(h('div', { class: 'field' }, h('span', null, H && H.spec.mode === 'circle' ? '泳ぐ順' : 'レーン'), h('div', { class: 'row nopick' },
      lanes.map((x) => h('button', { class: 'btn small nobtn' + (x.lane === e.lane ? ' on' : ''), dataset: { elane: x.lane }, onclick: () => { e.lane = x.lane; changed(); } }, `L${x.lane}${x.name ? ' ' + x.name : ''}`)))));
  }

  function coverExtra(ctx) {
    const g = ctx.game, sp = SP();
    const P = g.pending || { lanes: sp.cleanLanes([], g.opts.lanes), spec: sp.specOf(g.opts) };
    return h('p', { class: 'note swcover' }, `1${sp.unitOf(P.spec)}目：${sp.specText(P.spec)}（${P.spec.pool}mプール${P.spec.mode === 'circle' ? '' : '・タッチ' + sp.touchesOf(P.spec) + '回'}）・${P.lanes.length}${P.spec.mode === 'circle' ? '人' : 'レーン'}`);
  }
  function endSummary(ctx) {
    const g = ctx.game, sp = SP();
    return h('div', { class: 'endscore' }, h('b', { class: 'swend' }, sp.scoreText(g)));
  }
  function menuItems(ctx) {
    const g = ctx.game, sp = SP();
    const L = ctx.S.L;
    if (!g.startedAt) return [];
    return sp.waiting(g)
      ? [{ icon: '➡', label: `${g.pending.heat}${sp.unitOf(g.pending.spec)}目を直す`, sub: 'スタート待ちの組の種目・名前', fn: () => openNext(ctx, L, true) }]
      : [{ icon: '➡', label: '次の組へ', sub: '種目・名前を決めて、次のスタートを待つ', fn: () => openNext(ctx, L) }, { icon: '🏁', label: '組の一覧', sub: '組ごとの種目と1位', fn: () => openHeats(ctx, L) }];
  }
  function settings(ctx, refresh) {
    // （ctx.sprefs は読むたびに作り直されるので、押したときに読み直してから書く）
    const pick = (key, list) => h('div', { class: 'row' }, list.map(([v, lab]) => h('button', { class: 'btn small' + (ctx.sprefs[key] === v ? ' on' : ''), dataset: { swpref: key + ':' + v }, onclick: (e) => { ctx.sprefs[key] = v; ctx.savePrefs(); e.currentTarget.parentNode.querySelectorAll('.btn').forEach((b) => b.classList.toggle('on', b === e.currentTarget)); if (refresh) refresh(); } }, lab)));
    return h('section', { class: 'field swset' }, h('span', null, 'レーンの並び'),
      pick('order', [['asc', 'レーン1 を上に'], ['desc', 'レーン1 を下に']]),
      h('span', null, 'タッチのボタン'),
      pick('side', [['right', '右側'], ['left', '左側（左手で押す）']]),
      h('p', { class: 'note' }, 'プールサイドで見ている向きに合わせると、押しまちがいが減ります。'));
  }

  ST.addView('swim', { setup, build, stats, editExtra, coverExtra, endSummary, menuItems, settings });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/app.js */
/* スポーツ タップ記録 — アプリの骨組み（どの種目でも同じ部分）
   種目を選ぶ（picker）→ 種目のホーム（home：記録中の試合・これまでの試合）→ 試合の準備（setup）→ 記録（live）。
   記録の画面の中身は、種目の画面（ST.VIEWS[種目の family]）が作る。骨組みは、時刻・保存・取り消し・一覧で直す・集計・書き出し・設定を受け持つ。
   記録の画面は、いちど作ったら作り直さず、表示だけを書き換える（押している間にボタンが入れ替わると、Safari ではタップにならないため）。 */
(function (root) {
  'use strict';
  const ST = root.ST;
  const { h, $ } = ST.ui;
  const BASKET_URL = '../basket-tap/';

  const S = {
    view: 'picker',
    sport: null,            // いま選んでいる種目の id
    game: null,
    prefs: ST.store.prefs(),
    draft: null,            // 新しい試合の準備中 { sport, title, teams, opts }
    setupFor: 'new',        // 'new' | 'edit'（記録中の試合のチーム・形式を直す）
    more: [false, false],
    L: null,                // 記録の画面（種目の画面が返したもの）
    redo: [],
    lastTap: { key: '', at: 0 },
    guarded: false
  };
  const now = () => Date.now();
  const sport = () => ST.SPORTS[(S.game && S.game.sport) || S.sport] || null;
  const viewOf = (sp) => (sp && ST.VIEWS[sp.family]) || {};
  const sprefs = (id) => ST.store.sportPrefs(S.prefs, id || (sport() || {}).id);
  const elapsed = () => ST.elapsed(S.game, now());

  /* ---------- 小さな道具 ---------- */
  function save() {
    if (!S.game) return;
    if (!ST.store.saveGame(S.game) && !S.saveWarned) {
      S.saveWarned = true;
      ST.ui.toast('このブラウザに保存できません（プライベートブラウズ・空きが足りない など）。記録は続けられますが、終わったら必ず「書き出す」でファイルに残してください', 'err', 9000);
    }
  }
  function applyTheme() {
    const t = S.prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#0b0f17');
  }
  function savePrefs() { ST.store.savePrefs(S.prefs); }
  function feel(kind) {
    ST.ui.haptic();
    if (S.prefs.sound) ST.ui.beep(kind === 'made' ? 1046 : kind === 'undo' ? 440 : 784, 55);
  }
  function flash(el) {
    if (!el) return;
    el.classList.remove('hit');
    void el.offsetWidth;
    el.classList.add('hit');
  }
  const teamColor = (tm) => (S.game && S.game.teams[tm] ? S.game.teams[tm].color : '#888');
  /* 種目を選んだことを、URL（?s=soccer）にも残す（ブックマーク・ホーム画面に追加したときに、その種目から開けるように） */
  function setSport(id) {
    S.sport = id || null;
    if (id) { S.prefs.last = id; savePrefs(); }
    try {
      const u = new URL(root.location.href);
      if (id) u.searchParams.set('s', id); else u.searchParams.delete('s');
      if (u.href !== root.location.href) history.replaceState(history.state, '', u.href);
    } catch (e) { /* file:// など */ }
    const sp = ST.SPORTS[id];
    document.title = sp ? `${sp.name} タップ記録` : ST.APP;
  }

  /* ---------- 画面の切り替え ---------- */
  function go(view) {
    S.view = view;
    ST.ui.closeSheet(true);
    if (S.L && S.L.destroy) S.L.destroy();
    S.L = null;
    if (view === 'picker') renderPicker();
    else if (view === 'home') renderHome();
    else if (view === 'setup') renderSetup();
    else if (view === 'live') buildLive();
    root.scrollTo(0, 0);
  }
  function openGame(game) {
    S.game = game;
    S.redo = [];
    setSport(game.sport);
    ST.store.setCurrent(game.id);
    go('live');
    if (game.startedAt && !game.endedAt) { ST.ui.keepAwake(true); guard(); }
  }

  /* ========== 種目を選ぶ ========== */
  function renderPicker() {
    document.body.dataset.view = 'picker';
    ST.ui.keepAwake(false);
    const V = $('#view');
    V.innerHTML = '';
    const going = goingGame();
    V.append(
      h('header', { class: 'hbar' },
        h('div', { class: 'brand' }, h('span', { class: 'logo', 'aria-hidden': 'true' }, '⏱'), h('div', null, h('b', null, ST.APP), h('small', null, '試合を見ながらタップで記録。種目ごとに、ルールに合ったボタンと集計'))),
        h('button', { class: 'btn icon', id: 'btnHelp', 'aria-label': '使い方', onclick: helpPicker }, '？')),
      h('main', { class: 'home' },
        going ? goingCard(going) : null,
        h('section', { class: 'card' }, h('h2', null, '種目を選ぶ'),
          h('div', { class: 'sports', id: 'sportGrid' },
            ST.SPORT_ORDER.map((id) => {
              const sp = ST.SPORTS[id];
              const n = ST.store.games(id).length;
              return h('button', { class: 'sportbtn', dataset: { sport: id }, onclick: () => { setSport(id); go('home'); } },
                h('span', { class: 'si', 'aria-hidden': 'true' }, sp.icon), h('span', { class: 'st' }, h('b', null, sp.name), h('small', null, sp.desc)), n ? h('i', { class: 'sn' }, `${n}試合`) : null);
            }),
            h('a', { class: 'sportbtn basket', href: BASKET_URL }, h('span', { class: 'si', 'aria-hidden': 'true' }, '🏀'), h('span', { class: 'st' }, h('b', null, 'バスケットボール'), h('small', null, '専用のアプリ「バスケ タップ記録」（撮影しながら記録・動画の切り出しも）')), h('i', { class: 'sn' }, '別のアプリ')))),
        h('section', { class: 'card steps3' },
          h('h2', null, 'どの種目でも同じ使い方'),
          h('ol', null,
            h('li', null, h('b', null, 'チームと背番号（選手・レーン）を選ぶ'), h('span', null, '自分のチームは、次の試合から自動で入ります')),
            h('li', null, h('b', null, '試合が始まる瞬間に ▶ スタート'), h('span', null, '時計が動き出し、押した瞬間の時刻で記録が残ります')),
            h('li', null, h('b', null, 'プレーが起きたら、ボタンを1回タップ'), h('span', null, 'まちがえたら「↶ 取り消す」。あとで一覧から直せます')),
            h('li', null, h('b', null, '集計を見る・書き出す'), h('span', null, '選手ごとの集計、Excel で開ける CSV。記録の時刻は、試合の動画と合わせて見返すときの目印に')))),
        h('section', { class: 'card tools' }, h('h2', null, '記録のファイルを開く'),
          h('p', null, '「書き出す」で保存した記録のファイル（JSON）を、この端末で開き直せます（どの種目でも）。'),
          h('div', { class: 'row' }, h('button', { class: 'btn', onclick: importFile }, '📂 記録のファイルを開く'))),
        h('p', { class: 'note' }, '🔒 記録はこの端末のブラウザの中だけに保存します（どこにも送りません）。大事な試合は「書き出す」でファイルにも残してください（iPhone などは、長く開かないサイトの保存を消すことがあります）。')));
  }
  function goingGame() {
    const curId = ST.store.current();
    const g = curId ? ST.store.games().find((x) => x.id === curId) : null;
    return g && g.startedAt && !g.endedAt && ST.SPORTS[g.sport] ? g : null;
  }
  function goingCard(g) {
    return h('section', { class: 'card going' },
      h('div', { class: 'going-h' }, h('span', { class: 'recdot' }), h('b', null, `記録中の試合があります（${ST.SPORTS[g.sport].icon} ${ST.SPORTS[g.sport].name}）`)),
      gameLine(g),
      h('button', { class: 'btn primary huge', id: 'btnResume', onclick: () => resume(g.id) }, '続きを記録する'));
  }

  /* ========== 種目のホーム（試合の一覧） ========== */
  function renderHome() {
    const sp = sport();
    if (!sp) { go('picker'); return; }
    document.body.dataset.view = 'home';
    ST.ui.keepAwake(false);
    const V = $('#view');
    V.innerHTML = '';
    const list = ST.store.games(sp.id);
    const going = goingGame();
    V.append(
      h('header', { class: 'hbar' },
        h('button', { class: 'btn small', id: 'btnSports', onclick: () => { setSport(null); go('picker'); } }, '← 種目'),
        h('div', { class: 'brand' }, h('span', { class: 'logo', 'aria-hidden': 'true' }, sp.icon), h('div', null, h('b', null, `${sp.name} タップ記録`), h('small', null, sp.desc))),
        h('button', { class: 'btn icon', id: 'btnHelp', 'aria-label': '使い方', onclick: () => help(sp) }, '？')),
      h('main', { class: 'home' },
        going ? goingCard(going) : null,
        h('button', { class: 'btn ' + (going ? '' : 'primary ') + 'huge', id: 'btnNew', onclick: newGame }, `＋ 新しい${sp.unit || '試合'}を記録する`),
        list.length ? h('section', { class: 'card' }, h('h2', null, `これまでの${sp.unit || '試合'}`), h('div', { class: 'games' }, list.map(gameRow))) : h('section', { class: 'card steps3' },
          h('h2', null, 'つかいかた'),
          h('ol', null, (sp.steps || []).map(([b, s]) => h('li', null, h('b', null, b), h('span', null, s))))),
        h('section', { class: 'card tools' }, h('h2', null, '記録のファイルを開く'),
          h('div', { class: 'row' }, h('button', { class: 'btn', onclick: importFile }, '📂 記録のファイルを開く'))),
        h('p', { class: 'note' }, '🔒 記録はこの端末のブラウザの中だけに保存します（どこにも送りません）。')));
  }
  function gameLine(g) {
    const when = g.startedAt ? `${g.date} ${new Date(g.startedAt).toTimeString().slice(0, 5)}` : `${g.date}（まだスタートしていません）`;
    const sp = ST.SPORTS[g.sport] || {};
    return h('div', { class: 'gline' },
      h('span', { class: 'when' }, when),
      sp.lineText ? h('span', { class: 'vs' }, sp.lineText(g)) :
        h('span', { class: 'vs' }, h('i', { class: 'chip', style: { background: g.colors[0] } }), g.names[0], h('b', null, ` ${g.scoreText || ''} `), g.names[1], h('i', { class: 'chip', style: { background: g.colors[1] } })),
      g.title ? h('span', { class: 'gtitle' }, g.title) : null);
  }
  function gameRow(g) {
    return h('div', { class: 'grow', dataset: { id: g.id } },
      h('button', { class: 'gopen', onclick: () => resume(g.id) }, gameLine(g), h('small', { class: 'note' }, `${g.n}件の記録${g.endedAt ? '' : g.startedAt ? '・記録中' : ''}`)),
      h('button', { class: 'btn small', title: '書き出す', onclick: () => { const game = ST.store.loadGame(g.id); if (game) openExport(game); } }, '書き出す'),
      h('button', { class: 'btn small danger', title: '消す', onclick: () => ST.ui.confirm('この記録を消しますか？', `${g.date} ${g.names[0]} ${g.scoreText || ''} ${g.names[1]}（${g.n}件の記録）。消すと元に戻せません。書き出したファイルは残ります。`, '消す', () => { ST.store.deleteGame(g.id); renderHome(); ST.ui.toast('消しました', 'ok'); }, true) }, '消す'));
  }
  function resume(id) {
    const g = ST.store.loadGame(id);
    if (!g) { ST.ui.toast('この記録が見つかりませんでした', 'err'); go(S.sport ? 'home' : 'picker'); return; }
    openGame(g);
  }
  async function importFile() {
    const f = await ST.ui.pickText();

      const g = ST.importData(f.text);
      if (ST.store.loadGame(g.id)) g.id = ST.uid('g');
      ST.store.saveGame(g);
      openGame(g);
      ST.ui.toast('記録のファイルを開きました', 'ok');
    } catch (e) { ST.ui.toast('開けませんでした：' + e.message, 'err', 6000); }
  }

  /* ========== 試合の準備 ========== */
  function newGame() {
    const sp = sport();
    const pr = sprefs(sp.id);
    const mine = ST.store.myTeam(sp.id);
    const keep = !!sp.orderedRoster;
    S.draft = { sport: sp.id, title: '', opts: ST.cleanOpts(sp, pr.opts), teams: [mine ? { name: mine.name, color: mine.color, colorName: mine.colorName, players: ST.cleanPlayers(mine.players, keep) } : ST.blankTeam(0), ST.blankTeam(1)] };
    if (S.draft.teams[0].color === S.draft.teams[1].color) Object.assign(S.draft.teams[1], S.draft.teams[0].color === '#2f6fed' ? { color: '#d93636', colorName: '赤' } : {});
    if (sp.initDraft) sp.initDraft(S.draft, pr);
    S.setupFor = 'new';
    S.more = [false, false];
    go('setup');
  }
  const setupTarget = () => (S.setupFor === 'edit' ? S.game : S.draft);
  function setupChanged() { if (S.setupFor === 'edit') save(); }

  function renderSetup() {
    document.body.dataset.view = 'setup';

    const V = $('#view');

    const edit = S.setupFor === 'edit';

      h('header', { class: 'hbar' },

        h('span', { class: 'spacer' })),

          h('p', { class: 'lead' }, `${sp.rosterLabel || '背番号'}は、下の番号をタップして選びます（「${(sp.presets && sp.presets[0] && sp.presets[0][0]) || '1〜11'}」などのボタンで、まとめて選べます）。名前はなくても大丈夫です。`),
          h('div', { class: 'teams2' }, [0, 1].map((i) => teamCard(i)))],

        edit ? null : h('section', { class: 'card' },
          h('label', { class: 'field' }, h('span', null, 'メモ（なくてもOK）'),
            h('input', { type: 'text', id: 'gameTitle', maxlength: 40, placeholder: sp.titleHint || '例：練習試合・新人戦 1回戦', value: S.draft.title, oninput: (e) => { S.draft.title = e.target.value; } }))),
        h('div', { class: 'gobar' },
          edit ? h('button', { class: 'btn primary huge', onclick: () => { saveTeams(); go('live'); } }, '記録へ戻る')

  /* 試合の形式（前半の長さ・セット数 など）。ボタンで選ぶ */
  function optsCard(sp, T, edit) {
    const fields = (sp.optFields || []).filter((f) => !f.hidden || !f.hidden(T.opts));
    if (!fields.length) return null;
    const card = h('section', { class: 'card', id: 'optsCard' }, h('h2', null, sp.optsTitle || '試合の形式'));
    fields.forEach((f) => {
      const row = h('div', { class: 'row optrow', dataset: { opt: f.key } });
      f.choices.forEach(([v, lab]) => row.append(h('button', { class: 'btn small' + (String(T.opts[f.key]) === String(v) ? ' on' : ''), dataset: { v: String(v) }, 'aria-pressed': String(String(T.opts[f.key]) === String(v)),
        onclick: () => { T.opts[f.key] = v; if (!edit) { const pr = sprefs(sp.id); pr.opts = Object.assign({}, T.opts); savePrefs(); } setupChanged(); const fresh = optsCard(sp, T, edit); card.replaceWith(fresh); if (sp.onOpts) sp.onOpts(T, f.key); } }, lab)));
      card.append(h('div', { class: 'field' }, h('span', null, f.label), row, f.note ? h('p', { class: 'note' }, f.note) : null));
    });
    if (edit && sp.optsEditNote) card.append(h('p', { class: 'note' }, sp.optsEditNote));
    return card;
  }
  function saveTeams() {
    const sp = sport();
    const T = setupTarget().teams;
    if (sp.noSavedTeams) return;
    if (T[0].name) ST.store.saveTeam(sp.id, T[0], true);
    if (T[1].name) ST.store.saveTeam(sp.id, T[1], false);
  }
  function toLive() {
    const sp = sport();
    const D = S.draft;
    if (sp.checkDraft) { const msg = sp.checkDraft(D); if (msg) { ST.ui.toast(msg, 'warn', 5000); return; } }
    saveTeams();
    const pr = sprefs(sp.id);
    pr.opts = Object.assign({}, D.opts);
    savePrefs();
    const g = ST.newGame({ sport: sp.id, teams: D.teams, title: (D.title || '').trim(), opts: D.opts });
    if (sp.fromDraft) sp.fromDraft(g, D);
    S.draft = null;
    ST.store.saveGame(g);
    openGame(g);
  }

  /* チームのカード（名前・色・背番号・名前）。文字の欄を変えたときは、カードを作り直さずに、その場で書き換える */
  function teamCard(i) {
    const sp = sport();
    const T = setupTarget().teams;
    const t = T[i];
    const card = h('section', { class: 'card teamcard', id: 'team' + i, style: { '--tc': t.color, '--tink': ST.inkOn(t.color) } });
    const redraw = () => { [0, 1].forEach((k) => { const old = document.getElementById('team' + k); if (old) old.replaceWith(teamCard(k)); }); };
    const label = () => (t.name || '').trim() || (i ? '相手のチーム' : '自分のチーム');

    if (saved.length) {
