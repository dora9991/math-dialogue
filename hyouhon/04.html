/* 標本調査 第4時：調査の方法と結果を、批判的に読み取ろう（ikkan の lesson_hyouhon_04 と同じ流れ）。
   体育館に来ていた 60人の 7割 → 市の中学生全体では？（標本のかたより）。確かめる 3つの観点：選び方・大きさ・質問のしかた。
   考えようは、全校 480人の読書の時間を、選び方（図書室・運動部・くじ）と人数を変えて調べる道具。データ・場面はすべて自作（実際の調査ではない。たねつきの乱数で、毎回同じ）。 */
(function () {
  var C = CH.C, FF = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', NF = '"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';
  var DIM = 'rgba(242,240,230,.75)', INK = '#22302a', PAPER = 'rgba(242,240,230,.92)', GR = ['#9ad8ff', '#ffc078', '#a9f0b0'];
  function ft(D, x, y, s, o, mw) {
    o = o || {}; var g = D.ctx, z = o.size || CH.fs(D), p = {}, k;
    g.save(); g.font = (o.w || 600) + ' ' + z + 'px ' + (o.num ? NF : FF); var w = g.measureText(s).width; g.restore();
    for (k in o) p[k] = o[k]; p.size = w > mw ? z * mw / w : z; CH.text(D, x, y, s, p); return p.size;
  }
  /* 折り返して書く（左よせ）。行数を返す */
  function wrap(D, x, y, s, o, mw, lh) {
    var g = D.ctx, z = o.size || CH.fs(D), line = '', n = 0; g.save(); g.font = (o.w || 600) + ' ' + z + 'px ' + FF;
    var out = []; for (var i = 0; i < s.length; i++) { var t = line + s.charAt(i); if (g.measureText(t).width > mw && line) { out.push(line); line = s.charAt(i); } else line = t; }
    out.push(line); g.restore();
    out.forEach(function (l, j) { var p = {}; for (var k in o) p[k] = o[k]; p.align = o.align || 'left'; p.size = z; CH.text(D, x, y + j * lh, l, p); n++; });
    return n;
  }
  function wide(D) { return D.W > D.H * .9; }
  function pick(seed, n, k) { var r = CH.rng(seed), a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = 0; j < k; j++) { var m = j + Math.floor(r() * (n - j)), x = a[j]; a[j] = a[m]; a[m] = x; } return a.slice(0, k); }
  function set(a) { var o = {}; a.forEach(function (i) { o[i] = 1; }); return o; }
  function stream(seed) { var r = CH.rng(seed); for (var w = 0; w < 10; w++) r(); return r; }

  /* 今日の問い：体育館の 60人のうち 42人。市の中学生 600人（体育館の 60人をふくむ） */
  CH.check(CH.near(42 / 60, .7), '今日の問い　42÷60＝0.7');
  var GYM = set(pick(11, 60, 42)), CITY = (function () { var r = stream(2), a = []; for (var i = 0; i < 540; i++) a.push(r() < .42 ? 1 : 0); return a; })();
  var CITYALL = (42 + CH.sum(CITY)) / 600;
  CH.check(CH.sum(CITY) === 227 && CH.f2(CITYALL) === '0.45', '今日の問い　市全体（たとえば）0.45');
  /* 例題：900人。A班 20人中 14人、B班 200人中 124人 */
  CH.check(CH.near(124 / 200, .62) && CH.near(900 * 124 / 200, 558) && CH.near(900 * 14 / 20, 630), '例題　およそ 558人');
  function trials(seed, N, Y, n, T) { var r = stream(seed), out = []; for (var j = 0; j < T; j++) { var a = [], c = 0; for (var i = 0; i < N; i++) a.push(i); for (var q = 0; q < n; q++) { var m = q + Math.floor(r() * (N - q)), x = a[q]; a[q] = a[m]; a[m] = x; if (a[q] < Y) c++; } out.push(c / n); } return out; }
  var T20 = trials(2, 900, 558, 20, 15), T200 = trials(3, 900, 558, 200, 15);
  CH.check(Math.min.apply(null, T20) === .25 && Math.max.apply(null, T20) === .75 && Math.min.apply(null, T200) === .58 && Math.max.apply(null, T200) === .685, '例題　選びなおした標本（たねつきの乱数）');
  /* 考えよう：全校 480人。0 図書室によくいる 60人、1 運動部 150人、2 そのほか 270人。1：毎日 30分以上 読書する */
  var GRP = [], perm = pick(3, 480, 480); perm.forEach(function (p, i) { GRP[p] = i < 60 ? 0 : i < 210 ? 1 : 2; });
  var READ = (function () { var r = stream(4), a = []; for (var i = 0; i < 480; i++) a.push(r() < [.8, .15, .3][GRP[i]] ? 1 : 0); return a; })();
  var LIB = [], SPO = []; for (var i = 0; i < 480; i++) { if (GRP[i] === 0) LIB.push(i); if (GRP[i] === 1) SPO.push(i); }
  var LOT = pick(5, 480, 60), READALL = CH.sum(READ) / 480;
  function plan(m, n) { return (m === 0 ? LIB : m === 1 ? SPO : LOT).slice(0, n); }
  function rate(ids) { return ids.reduce(function (s, i) { return s + READ[i]; }, 0) / ids.length; }
  CH.check(CH.f2(READALL) === '0.31' && CH.f2(rate(plan(0, 60))) === '0.73' && CH.f2(rate(plan(1, 60))) === '0.17' && CH.f2(rate(plan(2, 60))) === '0.30', '考えよう　たねつきの乱数');
  /* チャレンジ */
  CH.check(600 / 60 === 10 && 200 / 10 + 160 / 10 + 240 / 10 === 60 && 7 + 8 + 15 === 30 && 600 * 30 / 60 === 300 && 200 * 7 / 20 + 160 * 8 / 16 + 240 * 15 / 24 === 300, 'チャレンジ　およそ 300人');

  /* 市の広報（紙のカード） */
  function paper(D, R, lines) {
    CH.fillRect(D, R.x0, R.y0, R.x1, R.y1, { fill: PAPER, stroke: 'rgba(20,30,24,.5)', sw: 1.5 });
    var s = CH.fs(D), y = R.y0 + s * .9, pad = s * .8;
    lines.forEach(function (L) { var z = s * (L.k || 1), n = wrap(D, R.x0 + pad, y, L.t, { col: L.col || INK, size: z, w: L.w || 600 }, R.w - pad * 2, z * 1.35); y += n * z * 1.35 + (L.gap || s * .3); });
    return y;
  }
  /* 人の並び（cols 列）。col(i) → 色、ring(i) → 黄の輪 */
  function people(D, R, n, cols, col, ring) {
    var rows = Math.ceil(n / cols), cw = Math.min(R.w / cols, R.h / rows), x0 = R.cx - cw * cols / 2, y0 = R.y0, out = [];
    for (var i = 0; i < n; i++) {
      var x = x0 + (i % cols + .5) * cw, y = y0 + (Math.floor(i / cols) + .5) * cw; CH.circle(D, x, y, cw * .34, { fill: col(i) });
      if (ring && ring(i)) CH.circle(D, x, y, cw * .5, { stroke: C.yel, sw: 1.4 });
    }
    return { x0: x0, y0: y0, x1: x0 + cw * cols, y1: y0 + cw * rows, cw: cw };
  }
  function bubble(D, x, y, w, h, txt, o) {
    o = o || {}; var g = D.ctx; g.save(); g.globalAlpha = D.ga * (o.a == null ? 1 : o.a); g.beginPath();
    var r = Math.min(w, h) * .25; g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.lineTo(x + w * .3, y + h); g.lineTo(x + w * .18, y + h + h * .35); g.lineTo(x + w * .2, y + h); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    g.fillStyle = o.fill || 'rgba(242,240,230,.12)'; g.fill(); g.strokeStyle = o.col || C.chalk; g.lineWidth = 2; g.stroke(); g.restore();
    if (txt) { var s = o.size || CH.fs(D, .85); if (Array.isArray(txt)) txt.forEach(function (l, j) { ft(D, x + s * .5, y + s * (.9 + j * 1.3), l, { align: 'left', col: o.tcol || C.chalk, size: s, a: o.a }, w - s); }); else wrap(D, x + s * .5, y + s * .9, txt, { col: o.tcol || C.chalk, size: s, a: o.a }, w - s, s * 1.3); }
  }

  K3.run({
    no: '第4時', title: '調査の方法と結果を、批判的に読み取ろう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '03.html', label: '◀ 第3時' }, { href: '05.html', label: '第5時 ▶' }],
    steps: [
      { tag: '今日の問い', bh: '市の広報の見出し', q: '市の広報に、見出し「市内の中学生の7割が、毎日1時間以上運動している」がのった。調査の方法は「土曜日の午前に、市営体育館に来ていた中学生 60人に聞いたところ、42人が『はい』と答えた」。この見出しは、正しいといえるだろうか。',
        notes: ['① 自分の考え（3分）　正しいか、どこに目をつけたかを書こう。', '② ペアの考え（3分）　自分とちがう点があれば、書こう。'],
        draw: function (D) {
          var R = CH.box(D, { l: .05, r: .05, t: .06, b: .08 }), s = CH.fs(D), w = wide(D);
          var P = w ? CH.rect(R.x0, R.y0 + R.h * .08, R.x0 + R.w * .58, R.y0 + R.h * .08 + Math.min(R.h * .6, s * 9.6)) : CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .5);
          paper(D, P, [{ t: '市の広報', k: .7, col: '#4b6b5a' }, { t: '市内の中学生の7割が、毎日1時間以上運動している', k: 1.2, w: 700 }, { t: '調査の方法：土曜日の午前に、市営体育館に来ていた中学生 60人に聞いたところ、42人が「はい」と答えた。', k: .78, col: '#3b4a42' }]);
          var G = w ? CH.rect(R.x0 + R.w * .64, R.y0 + s * 1.6, R.x1, R.y0 + R.h * .55) : CH.rect(R.x0 + R.w * .1, P.y1 + s * 1.8, R.x1 - R.w * .1, R.y1 - s * 1.6);
          ft(D, G.cx, G.y0 - s * .8, '体育館の 60人（● はい）', { col: DIM, size: s * .85 }, G.w);
          var Q = people(D, G, 60, 10, function (i) { return GYM[i] ? C.yel : 'rgba(242,240,230,.25)'; });
          ft(D, G.cx, Q.y1 + s * .9, '42 ÷ 60 ＝ 0.7', { col: C.yel }, G.w);
        } },
      { tag: '今日の問い', q: 'この見出しは、正しいといえる？', a: 'いえない', sub: '42÷60＝0.7 で、計算は合っている。でも、聞いたのは 体育館に来ていた中学生だけ。運動をよくする人が多いはずなので、標本がかたよっている', dur: 4,
        b: { t: '体育館に来た中学生だけ → 標本が <b>かたよっている</b> → 正しいとはいえない', col: C.yel },
        draw: function (D) {
          var R = CH.box(D, { l: .05, r: .05, t: .08, b: .08 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D), a = CH.smooth(.05, .4, t);
          var G = w ? CH.rect(R.x0, R.y0 + s * 1.4, R.x0 + R.w * .6, R.y1) : CH.rect(R.x0, R.y0 + s * 1.4, R.x1, R.y0 + R.h * .62);
          var cols = 30, rows = 20, cw = Math.min(G.w / cols, G.h / rows), x0 = G.cx - cw * cols / 2, y0 = G.y0, k = 0;
          ft(D, x0 + cw * cols / 2, R.y0 + s * .4, '市の中学生（たとえば 600人。● 毎日1時間以上運動）', { col: DIM, size: s * .8, a: a }, w ? R.w * .62 : R.w);
          for (var i = 0; i < 600; i++) {
            var c = i % cols, r = Math.floor(i / cols), gym = c < 10 && r < 6, x = x0 + (c + .5) * cw, y = y0 + (r + .5) * cw, yes;
            if (gym) yes = GYM[r * 10 + c]; else yes = CITY[k++];
            CH.circle(D, x, y, cw * .34, { fill: yes ? C.yel : 'rgba(242,240,230,.25)', a: gym ? 1 : a });
          }
          CH.fillRect(D, x0 + 1, y0 + 1, x0 + cw * 10 - 1, y0 + cw * 6 - 1, { stroke: C.pink, sw: 2.6 });
          CH.text(D, x0 + cw * 5, y0 + cw * 6 + s * .55, '体育館', { col: C.pink, size: s * .8, outline: 'rgba(20,40,30,.85)' });
          if (t > .45) {
            var a2 = CH.smooth(.45, .7, t), P = w ? CH.rect(R.x0 + R.w * .66, R.y0 + R.h * .12, R.x1, R.y1) : CH.rect(R.x0, G.y0 + cw * rows + s * .8, R.x1, R.y1), bw = P.w * (w ? .85 : .6), bh = Math.min(s * 1.2, P.h * .12);
            [[42 / 60, C.pink, '体育館の 60人', '0.70'], [CITYALL, C.yel, '市の中学生 全体', CH.f2(CITYALL)]].forEach(function (b, j) {
              var y = w ? P.y0 + j * s * 3.4 : P.y0 + j * bh * 2.1, lx = w ? P.x0 : P.x0, bx = w ? P.x0 : P.x1 - bw - s * 2.2;
              if (w) { ft(D, lx, y, b[2], { align: 'left', col: b[1], size: s * .85, a: a2 }, P.w); y += s * .8; }
              else ft(D, bx - s * .4, y + bh / 2, b[2], { align: 'right', col: b[1], size: s * .8, a: a2 }, bx - P.x0 - s * .5);
              CH.fillRect(D, bx, y, bx + bw, y + bh, { stroke: 'rgba(242,240,230,.35)', sw: 1, a: a2 }); CH.fillRect(D, bx, y, bx + bw * b[0], y + bh, { fill: CH.C.yel === b[1] ? 'rgba(255,226,122,.45)' : 'rgba(255,157,178,.45)', stroke: b[1], a: a2 });
              CH.text(D, bx + bw + s * .3, y + bh / 2, b[3], { align: 'left', col: b[1], size: s * .85, a: a2, num: true });
            });
            if (w) { wrap(D, P.x0, P.y0 + s * 7.6, '体育館に来る中学生は、運動をよくする人が多い', { col: C.chalk, size: s * .85, a: CH.smooth(.65, .85, t) }, P.w, s * 1.2); ft(D, P.x0, P.y0 + s * 10.4, '→ 標本が かたよっている', { align: 'left', col: C.pink, a: CH.smooth(.75, .95, t) }, P.w); }
            else ft(D, P.cx, P.y0 + bh * 4.6, '体育館の中学生は 運動をよくする人が多い → かたより', { col: C.pink, size: s * .85, a: CH.smooth(.65, .85, t) }, P.w);
          }
        } },
      { tag: 'ことば', bh: 'ことば', q: '調査の結果を読むとき、どんなことを確かめるとよいだろう？ 3つあげよう。', a: '標本の選び方・標本の大きさ・質問のしかた', sub: '選び方に かたよりはないか。大きさは 十分か。質問が、ある答えを みちびいていないか', dur: 3.5,
        b: [{ t: '標本の<b>選び方</b>に、かたよりはないか', col: C.green }, { t: '標本の<b>大きさ</b>は、十分か', col: C.green }, { t: '<b>質問</b>のしかたは、適切か', col: C.green }],
        draw: function (D) {
          var R = CH.box(D, { l: .04, r: .04, t: .1, b: .1 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D);
          if (w) { var H = Math.min(R.h, s * 11); R = CH.rect(R.x0, R.cy - H / 2, R.x1, R.cy + H / 2); }
          var ps = CH.split(D, R, 3, .08), TT = [['① 標本の選び方', 'かたよりはないか'], ['② 標本の大きさ', '十分か'], ['③ 質問のしかた', '答えをみちびいていないか']];
          ps.forEach(function (P, j) {
            var a = CH.smooth(.1 + j * .25, .3 + j * .25, t), on = t > .1 + j * .25;
            CH.fillRect(D, P.x0, P.y0, P.x1, P.y1, { stroke: on ? C.green : 'rgba(242,240,230,.35)', sw: on ? 2 : 1.2, fill: 'rgba(242,240,230,.04)' });
            var th = w ? s * 3 : P.h * .45, I = w ? CH.rect(P.x0 + P.w * .12, P.y0 + th + s * .4, P.x1 - P.w * .12, P.y1 - s * .8) : CH.rect(P.x0 + P.w * .55, P.y0 + P.h * .12, P.x1 - P.w * .05, P.y1 - P.h * .12);
            var tx = w ? P.cx : P.x0 + P.w * .28, mw = w ? P.w * .9 : P.w * .52;
            ft(D, tx, P.y0 + (w ? s * 1 : P.h * .32), on ? TT[j][0] : '？', { col: C.green, a: on ? a : 1, size: s }, mw);
            if (on) ft(D, tx, P.y0 + (w ? s * 2.2 : P.h * .68), TT[j][1], { col: DIM, a: a, size: s * .8 }, mw);
            if (j === 0) people(D, I, 40, 8, function (i) { return 'rgba(242,240,230,.3)'; }, function (i) { return i % 8 < 3 && i < 24; });
            if (j === 1) people(D, I, 40, 8, function (i) { return 'rgba(242,240,230,.3)'; }, function (i) { return i === 13 || i === 30; });
            if (j === 2) bubble(D, I.x0, I.y0, I.w, Math.min(I.h * .6, s * 3.4), '〜と思いませんか？', { size: Math.min(s * .8, I.w / 11) });

        } },
      { tag: '例題', bh: '例題　調査の問題点', q: 'ア〜ウの調査の問題点は？　ア 図書館の前で、出てきた人 100人に、読書が好きかを聞いた。　イ 全校生徒 600人から、くじで 4人を選び、好きな給食を聞いた。　ウ 「勉強しないと、損だと思いませんか」と聞いた。',
        a: 'ア 標本がかたよっている　イ 標本が小さすぎる　ウ 質問が答えをみちびく', sub: 'ア 図書館に来る人は、読書が好きな人が多い　イ 4人では、全校のようすを表せない　ウ「損」と先に言って、「はい」と答えさせる', dur: 4,
        b: [{ t: 'ア … 標本が <b>かたよっている</b>（図書館に来る人）', col: C.yel }, { t: 'イ … 標本が <b>小さすぎる</b>（4人）', col: C.yel }, { t: 'ウ … 質問が 答えを <b>みちびく</b>', col: C.yel }],
        draw: function (D) {
          var R = CH.box(D, { l: .04, r: .04, t: .08, b: .1 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D);
          if (w) { var H = Math.min(R.h, s * 13); R = CH.rect(R.x0, R.cy - H / 2, R.x1, R.cy + H / 2); }

          ps.forEach(function (P, j) {

              var bw = Math.min(I.w * .7, I.h * .9), bx = I.cx - bw / 2, by = I.y0 + bw * .22, bh = bw * .38;

              people(D, CH.rect(bx - bw * .1, by + bh + s * .3, bx + bw * 1.1, I.y1), 100, 20, function (i) { return i % 7 === 3 || i % 11 === 5 ? 'rgba(242,240,230,.3)' : C.yel; });
