/* 標本調査 第5時：「標本調査」で学んだことを、整理して確かめよう（ikkan の lesson_hyouhon_05 と同じ流れ）。
   調べ方の書かれていない記事（1800人のうち およそ 1260人）を、信頼してよいか判断する → 標本調査の流れを整理 → 推定（割合・比例式）。
   考えようは、聞く人数を 10人〜1800人（全員）に変えて、かかる時間と 推定のちらばりをくらべる道具。データ・場面はすべて自作（実際の調査ではない。たねつきの乱数で、毎回同じ）。 */
(function () {
  var C = CH.C, FF = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', NF = '"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';
  var DIM = 'rgba(242,240,230,.75)', INK = '#22302a', PAPER = 'rgba(242,240,230,.92)';
  function ft(D, x, y, s, o, mw) {
    o = o || {}; var g = D.ctx, z = o.size || CH.fs(D), p = {}, k;
    g.save(); g.font = (o.w || 600) + ' ' + z + 'px ' + (o.num ? NF : FF); var w = g.measureText(s).width; g.restore();
    for (k in o) p[k] = o[k]; p.size = w > mw ? z * mw / w : z; CH.text(D, x, y, s, p); return p.size;
  }
  function wrap(D, x, y, s, o, mw, lh) {
    var g = D.ctx, z = o.size || CH.fs(D), line = '', out = []; g.save(); g.font = (o.w || 600) + ' ' + z + 'px ' + FF;
    for (var i = 0; i < s.length; i++) { var t = line + s.charAt(i); if (g.measureText(t).width > mw && line) { out.push(line); line = s.charAt(i); } else line = t; }
    out.push(line); g.restore();
    out.forEach(function (l, j) { var p = {}; for (var k in o) p[k] = o[k]; p.align = 'left'; p.size = z; CH.text(D, x, y + j * lh, l, p); });
    return out.length;
  }
  function wide(D) { return D.W > D.H * .9; }
  function pick(seed, n, k) { var r = CH.rng(seed), a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = 0; j < k; j++) { var m = j + Math.floor(r() * (n - j)), x = a[j]; a[j] = a[m]; a[m] = x; } return a.slice(0, k); }
  function stream(seed) { var r = CH.rng(seed); for (var w = 0; w < 10; w++) r(); return r; }

  /* 今日の問い */
  CH.check(CH.near(1260 / 1800, .7) && CH.near(1800 * .7, 1260) && 1800 - 1260 === 540, '今日の問い　1260 ＝ 1800 × 0.7');
  /* 例題 */
  CH.check(CH.near(6 / 240, .025) && CH.near(7200 * .025, 180) && 7200 / 240 === 30 && 6 * 30 === 180, '例題　およそ 180個');
  CH.check(120 * 90 / 6 === 1800 && CH.near(120 / 1800, 6 / 90) && 90 / 6 === 15 && 120 * 15 === 1800, '例題　およそ 1800ぴき');
  /* チャレンジ */
  CH.check(CH.near(56 / 100, .56) && CH.near(192 / 400, .48) && 5000 * 56 / 100 === 2800 && 7500 * 192 / 400 === 3600 && 3600 - 2800 === 800, 'チャレンジ　B市が およそ 800人多い');
  /* 考えよう：A町 1800人のうち 1260人が 2時間以上（と したとき）。聞く人数ごとに 20回、無作為に選んで推定する */
  var NS = [10, 30, 100, 300, 900, 1800], POP = 1800, YES = 1260;
  var SIM = NS.map(function (n, k) {
    var r = stream(10 + k), out = [];
    for (var j = 0; j < 20; j++) { var a = [], c = 0; for (var i = 0; i < POP; i++) a.push(i); for (var q = 0; q < n; q++) { var m = q + Math.floor(r() * (POP - q)), x = a[q]; a[q] = a[m]; a[m] = x; if (a[q] < YES) c++; } out.push(POP * c / n); }
    return out;
  });
  var RG = SIM.map(function (e) { return [Math.min.apply(null, e), Math.max.apply(null, e)]; });
  CH.check(JSON.stringify(RG) === '[[720,1620],[900,1440],[1152,1404],[1212,1338],[1230,1314],[1260,1260]]', '考えよう　たねつきの乱数');
  CH.check(RG.every(function (r, i) { return i === 0 || r[1] - r[0] < RG[i - 1][1] - RG[i - 1][0]; }), '考えよう　人数が多いほど ちらばりが小さい');
  /* 例題の不良品の場所（240個のまとまり 30こ） */
  var TL = []; for (var i = 0; i < 30; i++) TL.push(pick(500 + i, 240, 6));

  function paper(D, R, lines) {
    CH.fillRect(D, R.x0, R.y0, R.x1, R.y1, { fill: PAPER, stroke: 'rgba(20,30,24,.5)', sw: 1.5 });
    var s = CH.fs(D), y = R.y0 + s * .9, pad = s * .8;
    lines.forEach(function (L) { var z = s * (L.k || 1), n = wrap(D, R.x0 + pad, y, L.t, { col: L.col || INK, size: z, w: L.w || 600 }, R.w - pad * 2, z * 1.35); y += n * z * 1.35 + s * .3; });
    return y;
  }
  var ARTICLE = [{ t: '新聞', k: .7, col: '#4b6b5a' }, { t: 'A町の中学生1800人のうち、およそ1260人が、毎日スマホを2時間以上使っている', k: 1.1, w: 700 }, { t: '（標本調査の結果。調べ方は 書かれていない）', k: .75, col: '#3b4a42' }];
  /* 曲がった矢印 */
  function carrow(D, x0, y0, cx, cy, x1, y1, o) {
    o = o || {}; var g = D.ctx; g.save(); g.globalAlpha = D.ga * (o.a == null ? 1 : o.a); g.strokeStyle = o.col || C.chalk; g.lineWidth = o.w || 2.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(cx, cy, x1, y1); g.stroke();
    var an = Math.atan2(y1 - cy, x1 - cx), hs = 11; g.fillStyle = o.col || C.chalk; g.beginPath(); g.moveTo(x1, y1);
    g.lineTo(x1 - hs * Math.cos(an - .45), y1 - hs * Math.sin(an - .45)); g.lineTo(x1 - hs * Math.cos(an + .45), y1 - hs * Math.sin(an + .45)); g.closePath(); g.fill(); g.restore();
  }
  var DOTS = (function () { var r = CH.rng(21), d = Math.sqrt(Math.PI / 140) * .86, pts = []; for (var y = -1; y <= 1; y += d) for (var x = -1; x <= 1; x += d) { var px = x + (r() - .5) * d * .5, py = y + (r() - .5) * d * .5; if (px * px + py * py < .84) pts.push([px, py]); } return pts; })();
  var SDOT = pick(22, DOTS.length, 14);
  /* 標本の円の中の 14 この場所 */
  var SPOS = (function () { var r = CH.rng(23), out = []; for (var i = 0; i < 14; i++) { var a = i * 2.39996, rr = Math.sqrt((i + .5) / 14) * .78; out.push([rr * Math.cos(a) + (r() - .5) * .05, rr * Math.sin(a) + (r() - .5) * .05]); } return out; })();

  K3.run({
    no: '第5時', title: '「標本調査」で学んだことを、整理して確かめよう', flat: true, hint: '',

    steps: [
      { tag: '今日の問い', bh: '新聞の記事', q: '新聞に「A町の中学生 1800人のうち、およそ 1260人が、毎日スマホを 2時間以上使っている」とあった。標本調査の結果だが、調べ方は書かれていない。この数が信頼できるかを判断するために、調べ方の何を確かめたいか。',
        notes: ['① 自分の考え（3分）　確かめたいことと、わけを書こう。', '② ペアの考え（3分）　自分とちがう点があれば、書こう。', 'この単元で学んだことを、思い出そう。'],
        draw: function (D) {
          var R = CH.box(D, { l: .06, r: .06, t: .1, b: .1 }), s = CH.fs(D), w = wide(D), H = Math.min(R.h * .7, s * 9);
          paper(D, w ? CH.rect(R.x0 + R.w * .08, R.cy - H / 2, R.x1 - R.w * .08, R.cy + H / 2) : CH.rect(R.x0, R.y0, R.x1, R.y0 + Math.min(R.h * .8, s * 11)), ARTICLE);
        } },
      { tag: '今日の問い', q: '記事の 1260人は、どうやって出した数だろう？', a: '1800 × 0.7（標本の割合を使った推定）', sub: '1260÷1800＝0.7。標本の中で、2時間以上の人の割合が 0.7 だったと考えられる', dur: 3.5,
        b: { t: '1260 ＝ 1800 × <b>0.7</b>（標本の割合を使った推定）', col: C.yel },
        draw: function (D) {
          var R = CH.box(D, { l: .06, r: .06, t: .14, b: .14 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D), h = Math.min(s * 2, R.h * .13), lw = w ? Math.min(R.w * .22, s * 6) : 0, x = R.x0 + lw, tw = R.w - lw;
          var lab = function (y, a, b, al) { if (w) { ft(D, x - s * .4, y + h * .32, a, { align: 'right', size: s * .9, a: al }, lw - s * .5); ft(D, x - s * .4, y + h * .82, b, { align: 'right', size: s * .72, col: DIM, a: al }, lw - s * .5); } else ft(D, R.x0, y - s * .7, a + '　' + b, { align: 'left', size: s * .85, a: al }, R.w); };
          var ya = R.y0 + (w ? 0 : s), yb = ya + h * (w ? 2.6 : 3.2);

          if (t > .05) {
            var a = CH.smooth(.05, .35, t); lab(ya, '標本', '？人', a);
            CH.tape(D, x, ya, tw, h, [{ v: .7, col: C.pink, txt: t > .4 ? '割合 0.7' : '' }, { v: .3, col: '#7d8a84', txt: t > .4 ? '0.3' : '' }], 1, { a: a });

        } },
      { tag: '今日の問い', q: 'この数が信頼できるか判断するために、調べ方の何を確かめたい？', a: '選び方（無作為か）・標本の大きさ・質問のしかた', sub: 'くじや乱数で選んだか（ゲームが好きな人だけでは、かたよる）。何人に聞いたか（少なすぎないか）。質問が、答えをみちびいていないか', dur: 3.5,
        b: { t: '確かめる … <b>選び方</b>（無作為か）・<b>大きさ</b>・<b>質問のしかた</b>', col: C.yel },
        draw: function (D) {
          var R = CH.box(D, { l: .06, r: .06, t: .1, b: .1 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D);
          var P = CH.rect(R.x0, R.y0, R.x1, R.y0 + Math.min(R.h * .4, s * (w ? 5.6 : 8))), y = P.y1 + s * 1.8, lh = Math.min(s * 2.6, (R.y1 - y) / 3.1);
          paper(D, P, ARTICLE.slice(1));
          [['くじや乱数で、無作為に選んだか', '（選び方）'], ['何人に聞いたか', '（標本の大きさ）'], ['質問のしかたは、適切か', '（答えをみちびいていないか）']].forEach(function (c, j) {
            var yy = y + j * lh, on = t > .1 + j * .28, a = CH.smooth(.1 + j * .28, .3 + j * .28, t), bx = R.x0 + s * .4, bs = s * 1.1;
            CH.fillRect(D, bx, yy - bs / 2, bx + bs, yy + bs / 2, { stroke: on ? C.green : 'rgba(242,240,230,.5)', sw: 2 });
            if (on) { CH.line(D, bx + bs * .2, yy, bx + bs * .45, yy + bs * .3, { col: C.green, w: 3, a: a }); CH.line(D, bx + bs * .45, yy + bs * .3, bx + bs * .9, yy - bs * .4, { col: C.green, w: 3, a: a }); }
            var sz = ft(D, bx + bs * 1.6, yy, on ? c[0] : '？', { align: 'left', col: on ? C.chalk : DIM, a: on ? a : 1, size: s }, R.w * (w ? .62 : .9) - bs * 1.6);
            if (on && w) ft(D, R.x0 + R.w * .66, yy, c[1], { align: 'left', col: C.green, a: a, size: s * .85 }, R.w * .34);
          });
        } },
      { tag: 'ことば', bh: 'ことば（単元の整理）', q: '標本調査の流れを、ことばで整理しよう。母集団から 標本を取り出して、全体を推しはかるまで。', a: '母集団 →（無作為に抽出）→ 標本 →（割合）→ 推定',
        sub: '全部を調べるのが 全数調査、一部を調べて全体を推しはかるのが 標本調査。推定した数は「およそ」の数', dur: 5,
        b: [{ t: '全部 … <b>全数調査</b>　一部 … <b>標本調査</b>', col: C.green }, { t: '<b>母集団</b> →（<b>無作為に抽出</b>）→ <b>標本</b> →（割合）→ <b>推定</b>', col: C.green }],
        draw: function (D) {
          var R = CH.box(D, { l: .06, r: .06, t: .1, b: .1 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D), big, sm;
          if (w) { big = { x: R.x0 + R.w * .24, y: R.cy, r: Math.min(R.w * .2, R.h * .36) }; sm = { x: R.x0 + R.w * .78, y: R.cy, r: big.r * .45 }; }
          else { big = { x: R.cx, r: Math.min(R.w * .3, R.h * .2) }; big.y = R.y0 + s * 1.4 + big.r; sm = { x: R.cx, r: big.r * .5 }; sm.y = R.y1 - s * 1.6 - sm.r; }
          var k = CH.ease(CH.smooth(.08, .35, t)), A = function (a, b) { return CH.smooth(a, b, t); };
          CH.circle(D, big.x, big.y, big.r, { stroke: C.blue, sw: 2.4, fill: 'rgba(154,216,255,.06)' });
          var sel = {}; SDOT.forEach(function (i, j) { sel[i] = j; });
          DOTS.forEach(function (p, i) {
            var x = big.x + p[0] * big.r, y = big.y + p[1] * big.r, j = sel[i];
            if (j != null) { var q = SPOS[j], x2 = sm.x + q[0] * sm.r, y2 = sm.y + q[1] * sm.r; CH.circle(D, CH.lerp(x, x2, k), CH.lerp(y, y2, k), big.r * .045, { fill: C.yel }); if (k > 0) CH.circle(D, x, y, big.r * .045, { stroke: 'rgba(255,226,122,.5)', sw: 1.2, a: k }); }
            else CH.circle(D, x, y, big.r * .045, { fill: 'rgba(154,216,255,.7)' });
          });
          if (t > .05) CH.circle(D, sm.x, sm.y, sm.r, { stroke: C.yel, sw: 2.4, fill: 'rgba(255,226,122,.06)', a: A(.05, .2) });
          var lab = function (c, txt, col, a, below) { if (w || c === big) CH.text(D, c.x, below ? c.y + c.r + s * .9 : c.y - c.r - s * .8, txt, { col: col, a: a, size: s * 1.05 }); else CH.text(D, c.x + c.r + s * .5, c.y, txt, { col: col, a: a, size: s * 1.05, align: 'left' }); };
          lab(big, t > .15 ? '母集団' : '？', C.blue, 1);
          if (t > .05) lab(sm, t > .4 ? '標本' : '？', C.yel, A(.05, .2));
          /* 無作為に抽出（行き）・推定（帰り） */
          if (w) {
            carrow(D, big.x + big.r * .7, big.y - big.r * .75, (big.x + sm.x) / 2, big.y - big.r * 1.25, sm.x - sm.r * .8, sm.y - sm.r * .9, { col: C.yel, a: A(.15, .35) });
            ft(D, (big.x + sm.x) / 2 + big.r * .1, big.y - big.r * 1.18, '無作為に抽出', { col: C.yel, a: A(.25, .4), size: s * .95 }, sm.x - big.x);
            if (t > .45) { ft(D, sm.x, sm.y + sm.r + s * 1, '割合を調べる', { col: C.chalk, a: A(.45, .6), size: s * .9 }, R.x1 - sm.x + sm.r); }
            carrow(D, sm.x - sm.r * .7, sm.y + sm.r * 1.3 + s, (big.x + sm.x) / 2, big.y + big.r * 1.15, big.x + big.r * .75, big.y + big.r * .75, { col: C.pink, a: A(.6, .8) });
            ft(D, (big.x + sm.x) / 2 + big.r * .1, big.y + big.r * 1.02 + s * 1.1, '推定する（およそ）', { col: C.pink, a: A(.7, .85), size: s * .95 }, sm.x - big.x);
          } else {
            var xr = R.x0 + R.w * .86, xl = R.x0 + R.w * .14;
            carrow(D, big.x + big.r * .9, big.y + big.r * .5, xr, (big.y + sm.y) / 2, sm.x + sm.r * 1.05, sm.y - sm.r * .5, { col: C.yel, a: A(.15, .35) });
            ft(D, xr, (big.y + sm.y) / 2 - s * .2, '無作為に抽出', { col: C.yel, a: A(.25, .4), size: s * .8, outline: 'rgba(20,40,30,.9)' }, R.w * .3);
            carrow(D, sm.x - sm.r * 1.05, sm.y - sm.r * .5, xl, (big.y + sm.y) / 2, big.x - big.r * .9, big.y + big.r * .5, { col: C.pink, a: A(.6, .8) });
            ft(D, xl, (big.y + sm.y) / 2 + s * .4, '推定（およそ）', { col: C.pink, a: A(.7, .85), size: s * .8, outline: 'rgba(20,40,30,.9)' }, R.w * .3);
          }
        } },
      { tag: '例題', bh: '例題　不良品の推定', q: '工場で作った部品 7200個から、240個を無作為に抽出して調べると、不良品が 6個あった。7200個の中の不良品は、およそ何個？',
        a: 'およそ 180個', sub: '6/240＝0.025 → 7200×0.025＝180（7200 は 240 の 30倍 → 6×30＝180）。無作為に抽出した標本だから、この推定ができる', dur: 5,
        b: [{ t: '6/240＝0.025 → 7200 × 0.025 ＝ 180 → <b>およそ 180個</b>', col: C.yel }, { t: '前提 … 標本は <b>無作為に抽出</b> したもの', col: C.yel }],
        draw: function (D) {
          var R = CH.box(D, { l: .04, r: .04, t: .06, b: .1 }), s = CH.fs(D), t = D.ph ? D.t : 0, w = wide(D);

          var Tb = CH.table(D, CH.rect(R.x0, R.y0, R.x1, R.y0 + s * 4.8), ['', '標本の中の不良品', '標本での割合', '母集団の不良品'], [['数', '6個', rv(.15, '6/240 ＝ 0.025'), rv(.85, '7200 × 0.025 ＝ 180')]],
            { fw: .08, top: true, size: Math.min(CH.fs(D, .8), R.w * .92 / 3 / 11), hl: function (r, c) { return r === 1 && ((c === 2 && t > .15) || (c === 3 && t > .85)) ? C.yel : null; } });
          var G = CH.rect(R.x0, Tb.y1 + s * 2, R.x1, R.y1 - s * 1.6), cols = 6, tw = Math.min(G.w / cols, G.h / 5 * 2), th = tw / 2, gx = G.cx - tw * cols / 2, n = Math.round(30 * CH.smooth(.25, .8, t));

          for (var i = 0; i < 30; i++) {
