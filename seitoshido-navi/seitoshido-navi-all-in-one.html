<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>生徒指導 対応ナビ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232c5e4f%22/%3E%3Cpath d=%22M16 27V17M16 17 9.5 8.5M16 17l6.5-8.5%22 stroke=%22%23fff%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3Ccircle cx=%2216%22 cy=%2217%22 r=%222.8%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 生徒指導 対応ナビ
   レイアウト：いまいる分かれ道（本文）を主役に、横に路線図のような分岐マップ。ホームは分類ごとの場面カード。
   色：紙（paper/sheet）と墨（ink）に、黒板の緑（chalk）を操作と道すじに。赤（alert）は命・安全だけ。○（ok）×（ng）は声かけ。
   字：本文は UD フォント（BIZ UDPゴシック）、見出しは丸ゴシック（Zen Maru Gothic）。 */
:root {
  --paper: #f2f5f4;
  --sheet: #ffffff;
  --ink: #1b2928;
  --ink-2: #485a59;
  --ink-3: #6a7d7b;
  --line: #d2dddb;
  --line-2: #b9c8c5;
  --chalk: #2c5e4f;
  --chalk-ink: #ffffff;
  --chalk-soft: #e1ede8;
  --alert: #b42318;
  --alert-soft: #fdeceb;
  --ok: #1d7448;
  --ok-soft: #e6f3ec;
  --ng: #b42318;
  --ng-soft: #fcefee;
  --amber: #855800;
  --amber-soft: #fff3d4;
  --mark: #ffe28a;
  --shadow: 0 1px 2px rgba(18, 40, 35, 0.06), 0 6px 18px rgba(18, 40, 35, 0.06);
  --font-display: "Zen Maru Gothic", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
  --fs-xs: 0.78rem;
  --fs-s: 0.875rem;
  --fs-m: 1rem;
  --fs-l: 1.125rem;
  --fs-xl: 1.35rem;
  --fs-2xl: 1.7rem;
  --fs-3xl: 2.1rem;
  --r: 10px;
  --bar-h: 54px;
  --measure: 44rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101715;
    --sheet: #17201e;
    --ink: #e2ebe8;
    --ink-2: #a8b8b4;
    --ink-3: #849590;
    --line: #2a3734;
    --line-2: #3a4a46;
    --chalk: #82caa9;
    --chalk-ink: #0e1a16;
    --chalk-soft: #1b2f28;
    --alert: #ff9387;
    --alert-soft: #371614;
    --ok: #7dd6a3;
    --ok-soft: #142d21;
    --ng: #ff9387;
    --ng-soft: #331513;
    --amber: #ecc062;
    --amber-soft: #32270f;
    --mark: #6e5711;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101715;
  --sheet: #17201e;
  --ink: #e2ebe8;
  --ink-2: #a8b8b4;
  --ink-3: #849590;
  --line: #2a3734;
  --line-2: #3a4a46;
  --chalk: #82caa9;
  --chalk-ink: #0e1a16;
  --chalk-soft: #1b2f28;
  --alert: #ff9387;
  --alert-soft: #371614;
  --ok: #7dd6a3;
  --ok-soft: #142d21;
  --ng: #ff9387;
  --ng-soft: #331513;
  --amber: #ecc062;
  --amber-soft: #32270f;
  --mark: #6e5711;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

/* ---- 土台 ---- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-m);
  line-height: 1.8;
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--sheet);
}
a { color: var(--chalk); text-underline-offset: 0.2em; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.4; text-wrap: balance; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 0.1em; }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- 上の帯 ---- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 8;
  background: var(--sheet);
  border-bottom: 1px solid var(--line);
}
.bar-in { display: flex; align-items: center; gap: 10px; min-height: var(--bar-h); }
.brand {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  font-family: var(--font-display); font-weight: 700; color: var(--ink); text-decoration: none;
}
.brand svg { width: 26px; height: 26px; flex: none; }
.brand .brand-s { display: none; }
.bar-sep { color: var(--line-2); flex: none; }
.bar-scene {
  min-width: 0; flex: 1 1 auto;
  font-weight: 700; color: var(--ink); text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
a.bar-scene:hover { color: var(--chalk); }
.bar-sp { flex: 1 1 0; }
.bar-btn {
  flex: none; border: 1px solid var(--line-2); background: var(--sheet); border-radius: 999px;
  padding: 4px 12px; font-size: var(--fs-s); cursor: pointer; color: var(--ink); text-decoration: none;
}
.bar-btn:hover { border-color: var(--chalk); color: var(--chalk); }
@media (min-width: 560px) { .brand .brand-s { display: inline; } }

/* ---- ホーム ---- */
.hero { padding-block: 28px 8px; display: grid; gap: 10px; }
.hero h1 { font-size: var(--fs-3xl); letter-spacing: 0.04em; }
.hero .tag { font-family: var(--font-display); font-size: var(--fs-l); color: var(--chalk); font-weight: 700; }
.hero p.how { color: var(--ink-2); max-width: var(--measure); }

.sos {
  margin-block: 18px 6px;
  border: 2px solid var(--alert);
  background: var(--alert-soft);
  border-radius: var(--r);
  padding: 14px 16px 16px;
}
.sos h2 { font-size: var(--fs-l); color: var(--alert); margin-bottom: 8px; }
.sos ol { display: grid; gap: 8px; }
.sos li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: start; }
.sos .n {
  width: 2rem; height: 2rem; border-radius: 50%; background: var(--alert); color: var(--sheet);
  display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums;
}
.sos b { display: block; }
.sos .tel { font-size: var(--fs-xl); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
@media (min-width: 820px) {
  .sos ol { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
}

.search { margin-block: 22px 8px; position: relative; max-width: 40rem; }
.search label { display: block; font-weight: 700; margin-bottom: 6px; }
.search input {
  width: 100%; font: inherit; font-size: var(--fs-l);
  padding: 12px 44px 12px 14px; border-radius: var(--r);
  border: 1.5px solid var(--line-2); background: var(--sheet); color: var(--ink);
}
.search input:focus { outline: none; border-color: var(--chalk); box-shadow: 0 0 0 3px var(--chalk-soft); }
.search .clear {
  position: absolute; right: 6px; bottom: 7px; width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: transparent; color: var(--ink-3); font-size: 1.3rem; cursor: pointer;
}
.search .clear:hover { background: var(--chalk-soft); color: var(--ink); }
.search .hint { font-size: var(--fs-s); color: var(--ink-3); margin-top: 6px; }
.search kbd {
  font-family: inherit; font-size: 0.85em; border: 1px solid var(--line-2); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 0.35em; background: var(--sheet);
}

.results { margin-block: 12px 28px; display: grid; gap: 8px; max-width: 48rem; }
.results .count { color: var(--ink-2); font-size: var(--fs-s); }
.results a {
  display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--sheet); color: var(--ink); text-decoration: none;
}
.results a:hover { border-color: var(--chalk); }
.results .r-path { font-weight: 700; color: var(--chalk); }
.results .r-snip { color: var(--ink-2); font-size: var(--fs-s); }

.cat { margin-block: 30px; }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.cat-head h2 { font-size: var(--fs-xl); }
.cat-head p { color: var(--ink-2); font-size: var(--fs-s); }
.cat-inochi .cat-head h2 { color: var(--alert); }
.cards { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.cards > li { display: grid; min-width: 0; }
@media (min-width: 640px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards > :last-child:nth-child(odd) { grid-column: 1 / -1; }
}
@media (min-width: 1080px) {
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cards > :last-child:nth-child(odd) { grid-column: auto; }
}
.card {
  display: grid; grid-template-rows: auto 1fr auto; gap: 6px;
  padding: 16px; border-radius: var(--r); background: var(--sheet);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  color: var(--ink); text-decoration: none; min-width: 0;
  transition: border-color 0.15s, transform 0.15s;
}
.card:hover { border-color: var(--chalk); transform: translateY(-1px); }
.card h3 { font-size: var(--fs-l); }
.card p { color: var(--ink-2); font-size: var(--fs-s); line-height: 1.7; }
.card .meta { display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-xs); color: var(--ink-3); }
.card .meta .go { color: var(--chalk); font-weight: 700; font-size: var(--fs-s); }
.cat-inochi .card { border-color: color-mix(in srgb, var(--alert) 35%, var(--line)); }

.guides .cards .card { grid-template-rows: auto 1fr; }

.data-errors {
  margin-block: 16px; padding: 12px 16px; border: 2px solid var(--alert); border-radius: var(--r);
  background: var(--alert-soft); font-size: var(--fs-s);
}
.data-errors ul { list-style: disc; padding-left: 1.4em; }

/* ---- 場面の中 ---- */
.layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); padding-block: 18px 56px; }
@media (min-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; }
  .map-aside {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 16px);
    max-height: calc(100vh - var(--bar-h) - 32px); overflow: auto; align-self: start;
  }
  .bar .map-toggle { display: none; }
}
.main { min-width: 0; max-width: var(--measure); display: grid; gap: 22px; align-content: start; }

.crumbs { font-size: var(--fs-s); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; }
.crumbs a { color: var(--ink-2); }
.crumbs a:hover { color: var(--chalk); }
.crumbs .sep { color: var(--line-2); }
.crumbs [aria-current] { color: var(--ink); font-weight: 700; }

.from {
  justify-self: start; display: inline-flex; gap: 6px; align-items: center;
  font-size: var(--fs-s); padding: 4px 12px; border-radius: 999px;
  background: var(--chalk-soft); color: var(--chalk); text-decoration: none; font-weight: 700;
}

.node-head { display: grid; gap: 8px; }
.node-head .eyebrow { font-size: var(--fs-s); color: var(--ink-3); }
.node-head h1 { font-size: var(--fs-2xl); }
.node-head .to-branch { justify-self: start; font-size: var(--fs-s); font-weight: 700; text-decoration: none; }

.alert {
  border: 2px solid var(--alert); background: var(--alert-soft); border-radius: var(--r);
  padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
}
.alert .alert-label {
  background: var(--alert); color: var(--sheet); font-weight: 700; font-size: var(--fs-s);
  padding: 1px 10px; border-radius: 999px; white-space: nowrap; margin-top: 3px;
}
.alert p { font-weight: 700; color: var(--ink); }

.lede { font-size: var(--fs-l); line-height: 1.85; }
.example {
  background: var(--sheet); border: 1px dashed var(--line-2); border-radius: var(--r);
  padding: 10px 14px; color: var(--ink-2); display: grid; gap: 2px;
}
.example .label { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); letter-spacing: 0.08em; }

.sec { display: grid; gap: 10px; }
.sec > h2 { font-size: var(--fs-l); display: flex; align-items: center; gap: 8px; }
.sec > h2 .mk {
  width: 1.55rem; height: 1.55rem; border-radius: 6px; display: grid; place-items: center;
  font-size: 0.95rem; flex: none; background: var(--chalk-soft); color: var(--chalk);
}
.sec.ok > h2 .mk { background: var(--ok-soft); color: var(--ok); }
.sec.ng > h2 .mk { background: var(--ng-soft); color: var(--ng); }
.sec.pt > h2 .mk { background: var(--amber-soft); color: var(--amber); }

.steps { display: grid; gap: 6px; }
.step {
  display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 10px 12px; border-radius: var(--r); background: var(--sheet); border: 1px solid var(--line);
  cursor: pointer;
}
.step input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.step .num {
  width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 2px solid var(--chalk); color: var(--chalk);
  display: grid; place-items: center; font-weight: 700; font-size: var(--fs-s); font-variant-numeric: tabular-nums;
  margin-top: 1px; background: var(--sheet);
}
.step .num::after { content: attr(data-n); }
.step input:checked + .num { background: var(--chalk); color: var(--chalk-ink); }
.step input:checked + .num::after { content: "✓"; }
.step input:checked ~ .t { color: var(--ink-3); }
.step input:focus-visible + .num { outline: 3px solid var(--chalk); outline-offset: 2px; }
.step:hover { border-color: var(--line-2); }
.steps-note { font-size: var(--fs-xs); color: var(--ink-3); }

.say, .avoid, .plain, .basis-list { display: grid; gap: 6px; }
.say li {
  position: relative; padding: 9px 12px 9px 2.4rem; border-radius: var(--r);
  background: var(--ok-soft); line-height: 1.75;
}
.say li::before {
  content: "○"; position: absolute; left: 0.8rem; top: 0.5rem; color: var(--ok); font-weight: 700; font-size: 1.05rem;
}
.avoid li {
  position: relative; padding: 9px 12px 9px 2.4rem; border-radius: var(--r);
  background: var(--ng-soft); display: grid; gap: 2px;
}
.avoid li::before {
  content: "×"; position: absolute; left: 0.85rem; top: 0.45rem; color: var(--ng); font-weight: 700; font-size: 1.15rem;
}
.avoid .ng-text { font-weight: 700; }
.avoid .why { font-size: var(--fs-s); color: var(--ink-2); }
.plain li, .basis-list li { position: relative; padding-left: 1.2em; }
.plain li::before { content: ""; position: absolute; left: 0.2em; top: 0.75em; width: 0.42em; height: 0.42em; border-radius: 50%; background: var(--ink-3); }
.sec.pt .plain li::before { background: var(--amber); }
.basis-list li { font-size: var(--fs-s); color: var(--ink-2); }
.basis-list li::before { content: "§"; position: absolute; left: 0; color: var(--ink-3); }

.team { display: grid; gap: 8px; }
.team-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.team-row .where { font-size: var(--fs-xs); color: var(--ink-3); width: 2.6rem; flex: none; }
.chip {
  border: 1px solid var(--line-2); background: var(--sheet); border-radius: 999px;
  padding: 3px 12px; font-size: var(--fs-s); cursor: pointer; line-height: 1.6;
}
.chip:hover { border-color: var(--chalk); }
.chip[aria-expanded="true"] { background: var(--chalk); border-color: var(--chalk); color: var(--chalk-ink); }
.chip.out { border-style: dashed; }
.team-note {
  font-size: var(--fs-s); background: var(--chalk-soft); border-radius: var(--r); padding: 8px 12px; color: var(--ink);
}

/* 分かれ道（選択肢） */
.branch {
  display: grid; gap: 12px; padding: 18px 16px; border-radius: 14px;
  background: var(--chalk-soft); border: 1px solid color-mix(in srgb, var(--chalk) 30%, transparent);
  scroll-margin-top: calc(var(--bar-h) + 16px);
}
.branch .kicker { font-size: var(--fs-xs); font-weight: 700; color: var(--chalk); letter-spacing: 0.1em; }
.branch h2 { font-size: var(--fs-xl); }
.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
  padding: 13px 14px; border-radius: var(--r); background: var(--sheet); border: 1.5px solid var(--line-2);
  color: var(--ink); text-decoration: none; font-weight: 700; line-height: 1.6;
  transition: border-color 0.12s, background 0.12s;
}
.opt:hover { border-color: var(--chalk); }
.opt .arrow { color: var(--chalk); font-size: 1.2rem; grid-row: 1 / span 2; grid-column: 2; }
.opt .sub { grid-column: 1; font-weight: 400; font-size: var(--fs-s); color: var(--ink-2); }
.opt.jump { border-style: dashed; }
.opt.jump .sub { color: var(--chalk); font-weight: 700; }

.back { justify-self: start; font-size: var(--fs-s); }

.leaf {
  display: grid; gap: 12px; padding: 18px 16px; border-radius: 14px; background: var(--sheet); border: 1px solid var(--line);
}
.leaf h2 { font-size: var(--fs-l); }
.leaf p { color: var(--ink-2); }
.leaf-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
  border: 1.5px solid var(--chalk); color: var(--chalk); background: var(--sheet); text-decoration: none;
  font-weight: 700; font-size: var(--fs-s); cursor: pointer;
}
.btn.solid { background: var(--chalk); color: var(--chalk-ink); }
.btn:hover { background: var(--chalk-soft); color: var(--chalk); }
.btn.solid:hover { background: var(--chalk); color: var(--chalk-ink); filter: brightness(1.08); }
.related { display: grid; gap: 8px; }
.related h3 { font-size: var(--fs-m); }
.related ul { display: flex; flex-wrap: wrap; gap: 8px; }
.related a { display: inline-block; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; text-decoration: none; color: var(--ink); font-size: var(--fs-s); }
.related a:hover { border-color: var(--chalk); color: var(--chalk); }

/* 分岐マップ（路線図） */
.map-box { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; scroll-margin-top: calc(var(--bar-h) + 16px); }
.map-box > summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-l); list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.map-box > summary::-webkit-details-marker { display: none; }
.map-box > summary .cnt { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--ink-3); font-weight: 400; }
.map-box > summary::after { content: "＋"; color: var(--ink-3); font-size: var(--fs-s); }
.map-box[open] > summary::after { content: "－"; }
.map-legend { font-size: var(--fs-xs); color: var(--ink-3); margin-block: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.map, .map ul { list-style: none; margin: 0; padding: 0; }
.map ul { margin-left: 9px; padding-left: 12px; border-left: 2px solid var(--line); }
.map li { position: relative; }
.map ul > li::before { content: ""; position: absolute; left: -12px; top: 1.05em; width: 10px; border-top: 2px solid var(--line); }
.m-node {
  display: flex; gap: 8px; align-items: flex-start; padding: 3px 6px 3px 0; border-radius: 6px;

<body>
<div id="app"></div>
<script>
/* ---- js/core.js ---- */
/* 生徒指導 対応ナビ：データの入れ物（SN）。
   場面のファイル（data/<id>.js）は、SN.scenario({...}) で自分を登録する。
   画面（js/app.js）は、ここに集まったデータだけを見て描く。データの書き方は README.md の「場面の足し方」。

   ■ 場面（SN.scenario に渡すもの）
     id       半角の英小文字・数字・_（例：'ijime'）。data/common.js の SN.cats に同じ id を書く
     title    場面の名前（一覧のカードの見出し）
     lead     どんなときに開くか（カードの説明。1〜2行）
     example  場面の例（はじめの画面に「たとえば」として出す。架空の例）
     words    検索で見つけてほしい言葉（本文にない言いかえ。例：'LINE'、'リスカ'）
     related  関連する場面の id（さいごの画面に出す）
     start    はじめの分かれ道の id（書かなければ 'start'）
     nodes    分かれ道（下の形）を id ごとに

   ■ 分かれ道（nodes の中の1つ）
     title    見出し（18字まで。分岐マップにも出る）
     alert    赤い注意（命・安全にかかわるとき、まず目に入れたい1〜2文）
     text     状況の説明・考え方（です・ます。\n で改行。**太字** が使える）
     steps    対応の手順（順番に。常体の短い文）
     say      声かけの例（「」でくくる。だれに向けた言葉かは（　）で前に書く）
     avoid    避けたい言葉・対応 [['言葉や対応', 'なぜ避けるか'], …]
     team     連携・報告先の id（data/common.js の SN.team）
     record   記録すること
     points   ポイント・注意
     basis    根拠・参考（法律・通知・手引き。確かなものだけ）
     question 次の分かれ道の問い
     options  選択肢 [{ label, to }]（同じ場面の分かれ道へ）または [{ label, jump }]（ほかの場面へ。'sns' や 'sns~seiteki' のように、~ で道すじも書ける）
              sub に小さな補足を書ける */
(function () {
  const SN = (window.SN = window.SN || {});
  SN.scenarios = {};
  SN.cats = SN.cats || [];
  SN.team = SN.team || {};

  SN.scenario = function (def) {
    if (!def || !def.id) throw new Error('SN.scenario：id がありません');
    if (SN.scenarios[def.id]) throw new Error('SN.scenario：id が重複しています：' + def.id);
    def.start = def.start || 'start';
    def.nodes = def.nodes || {};
    for (const nid of Object.keys(def.nodes)) def.nodes[nid].id = nid;
    SN.scenarios[def.id] = def;
  };

  // 一覧の並び（SN.cats に書いた順。データのない場面は飛ばす）
  SN.ordered = function () {
    return SN.cats.flatMap((c) => c.ids.filter((id) => SN.scenarios[id]).map((id) => SN.scenarios[id]));
  };

  // はじめの分かれ道から nid までの、いちばん短い道すじ（[start, …, nid]）。たどり着けなければ null
  SN.pathTo = function (sid, nid) {
    const s = SN.scenarios[sid];
    if (!s || !s.nodes[nid]) return null;
    const prev = { [s.start]: null }, q = [s.start];
    while (q.length) {
      const cur = q.shift();
      if (cur === nid) break;
      for (const o of s.nodes[cur].options || []) if (o.to && !(o.to in prev)) { prev[o.to] = cur; q.push(o.to); }
    }
    if (!(nid in prev)) return null;
    const path = [];
    for (let c = nid; c !== null; c = prev[c]) path.unshift(c);
    return path;
  };

  // 道すじ（['start','honnin',…]）が、選択肢どおりにつながっているか
  SN.validPath = function (sid, path) {
    const s = SN.scenarios[sid];
    if (!s || !path.length || path[0] !== s.start) return false;
    for (let i = 1; i < path.length; i++) {
      const n = s.nodes[path[i - 1]];
      if (!n || !(n.options || []).some((o) => o.to === path[i])) return false;
    }
    return !!s.nodes[path[path.length - 1]];
  };

  // データの検査。tools/check.cjs と、画面の読みこみ時（エラーの表示）に使う
  SN.validate = function () {
    const errors = [], warns = [];
    const E = (m) => errors.push(m), W = (m) => warns.push(m);
    const ID = /^[a-z][a-z0-9_]*$/;
    const NODE_KEYS = ['id', 'title', 'alert', 'text', 'steps', 'say', 'avoid', 'team', 'record', 'points', 'basis', 'question', 'options'];
    const SC_KEYS = ['id', 'title', 'lead', 'example', 'words', 'related', 'start', 'nodes'];
    const OPT_KEYS = ['label', 'to', 'jump', 'sub'];
    const catalog = new Set(SN.cats.flatMap((c) => c.ids));
    const isStrArr = (a) => Array.isArray(a) && a.every((x) => typeof x === 'string' && x.trim());
    const len = (t) => [...String(t)].length;
    const stars = (t, at) => { if ((String(t).match(/\*\*/g) || []).length % 2) E(`${at}：** の数が合わない（太字の閉じ忘れ）`); };
    const seenCat = new Set();
    for (const c of SN.cats) for (const id of c.ids) {
      if (seenCat.has(id)) E(`SN.cats：「${id}」が2回ある`);
      seenCat.add(id);
      if (!SN.scenarios[id]) W(`場面「${id}」：一覧（SN.cats）にあるが、データ（data/${id}.js）がまだない`);
    }
    for (const [tid, t] of Object.entries(SN.team)) if (!t.name || !t.role) E(`SN.team「${tid}」：name と role を書く`);

    for (const [sid, s] of Object.entries(SN.scenarios)) {
      const at = `場面「${sid}」`;
      if (!ID.test(sid)) E(`${at}：id は半角の英小文字・数字・_ で`);
      if (!catalog.has(sid)) E(`${at}：data/common.js の SN.cats に入っていない`);
      for (const k of Object.keys(s)) if (!SC_KEYS.includes(k)) E(`${at}：知らない項目「${k}」`);
      if (!s.title) E(`${at}：title がない`);
      if (!s.lead) E(`${at}：lead がない`);
      if (s.words !== undefined && !isStrArr(s.words)) E(`${at}：words は文字の配列で`);
      if (s.related !== undefined && !isStrArr(s.related)) E(`${at}：related は場面の id の配列で`);
      for (const r of s.related || []) if (!catalog.has(r)) E(`${at}：related の「${r}」という場面はない`);
      const nodes = s.nodes || {};
      if (!nodes[s.start]) E(`${at}：はじめの分かれ道「${s.start}」がない`);
      for (const [nid, n] of Object.entries(nodes)) {
        const nat = `${at} › 「${nid}」`;
        if (!ID.test(nid)) E(`${nat}：id は半角の英小文字・数字・_ で`);
        for (const k of Object.keys(n)) if (!NODE_KEYS.includes(k)) E(`${nat}：知らない項目「${k}」`);
        if (!n.title) E(`${nat}：title がない`);
        else if (len(n.title) > 18) W(`${nat}：title が長い（${len(n.title)}字。18字まで）`);
        for (const k of ['steps', 'say', 'record', 'points', 'basis']) if (n[k] !== undefined && !isStrArr(n[k])) E(`${nat}：${k} は文字の配列で`);
        for (const k of ['alert', 'text', 'question']) if (n[k] !== undefined && (typeof n[k] !== 'string' || !n[k].trim())) E(`${nat}：${k} は文字で`);
        if (n.avoid !== undefined && !(Array.isArray(n.avoid) && n.avoid.every((a) => Array.isArray(a) && a.length === 2 && a.every((x) => typeof x === 'string' && x.trim())))) E(`${nat}：avoid は [['言葉や対応', '理由'], …] の形で`);
        if (n.team !== undefined && !isStrArr(n.team)) E(`${nat}：team は連携先の id の配列で`);
        for (const t of n.team || []) if (!SN.team[t]) E(`${nat}：team の「${t}」は data/common.js の SN.team にない`);
        if (!n.text && !n.steps) W(`${nat}：text も steps もない`);
        for (const k of ['alert', 'text']) if (n[k]) stars(n[k], `${nat} › ${k}`);
        for (const k of ['steps', 'say', 'record', 'points']) (n[k] || []).forEach((t, i) => {
          stars(t, `${nat} › ${k}[${i}]`);
          if (len(t) > 110) W(`${nat} › ${k}[${i}]：長い（${len(t)}字）。2つに分けられないか`);
        });
        (n.say || []).forEach((t, i) => { if (!t.includes('「')) W(`${nat} › say[${i}]：「」がない`); });
        const opts = n.options || [];
        if (n.options !== undefined && !Array.isArray(n.options)) E(`${nat}：options は配列で`);
        if (opts.length && !n.question) E(`${nat}：options があるのに question がない`);
        if (!opts.length && n.question) E(`${nat}：question があるのに options がない`);
        for (const o of opts) {
          const oat = `${nat} › 選択肢「${o.label || '?'}」`;
          for (const k of Object.keys(o)) if (!OPT_KEYS.includes(k)) E(`${oat}：知らない項目「${k}」`);
          if (!o.label) E(`${nat}：label のない選択肢がある`);
          if (!!o.to === !!o.jump) E(`${oat}：to か jump の、どちらか一つを書く`);
          if (o.to && !nodes[o.to]) E(`${oat}：行き先「${o.to}」がない`);
          if (o.to === nid) E(`${oat}：自分自身に戻っている`);
          if (o.jump) {
            const [js, ...jp] = o.jump.split('~');
            if (js === sid) E(`${oat}：同じ場面の中は jump ではなく to で`);
            else if (!catalog.has(js)) E(`${oat}：jump 先「${js}」という場面はない`);
            else if (!SN.scenarios[js]) W(`${oat}：jump 先「${js}」のデータがまだない`);
            else if (jp.length && !SN.validPath(js, [SN.scenarios[js].start, ...jp])) E(`${oat}：jump の道すじ「${o.jump}」が、つながっていない`);
          }
        }
      }
      // はじめからたどり着けるか
      const seen = new Set([s.start]), q = [s.start];
      while (q.length) {
        const n = nodes[q.shift()];
        for (const o of (n && n.options) || []) if (o.to && nodes[o.to] && !seen.has(o.to)) { seen.add(o.to); q.push(o.to); }
      }
      for (const nid of Object.keys(nodes)) if (!seen.has(nid)) E(`${at}：「${nid}」に、はじめからたどり着けない`);
    }
    return { errors, warns };
  };
})();

/* ---- data/common.js ---- */
/* 生徒指導 対応ナビ：どの場面にも共通するデータ。
   SN.cats     … 一覧の分類と、場面の並び（場面を足したら、ここに id を1つ書く）
   SN.team     … 連携・報告先（場面の team: [...] に書く id）
   SN.hotlines … 相談窓口の電話番号（2026年10月に、各機関の案内で確かめた）
   SN.guides   … 「基本」のページ（初期対応の基本・声かけの基本・記録の書き方・連携先と相談窓口）
   学校ごとに直したいところ（連携先の名前、校内の窓口など）は、ここを書きかえる。 */
(function () {
  const SN = (window.SN = window.SN || {});

  SN.cats = [
    { id: 'inochi', name: '命と安全', note: '命や体の安全にかかわる場面。まず安全の確保と、応援を呼ぶこと。', ids: ['jishou', 'gyakutai', 'seihigai', 'yakubutsu'] },
    { id: 'trouble', name: 'いじめ・トラブル', note: '生徒どうしの関係の中で起きる場面。', ids: ['ijime', 'bouryoku', 'sns', 'kinsen'] },
    { id: 'gakko', name: '学校生活', note: '毎日の授業や登校の中で出会う場面。', ids: ['jugyou', 'futoukou', 'kousoku'] },

  ];

  // where：in＝校内 / home＝家庭 / out＝校外
  SN.team = {
    tannin: { name: '担任', where: 'in', role: '生徒と家庭のことをいちばんよく知る。情報を集め、家庭との連絡の中心になる。' },

    ijimetaisaku: { name: '学校いじめ対策組織', where: 'in', role: 'いじめ防止対策推進法 第22条で置く校内の組織。いじめの認知・事実確認・対応の方針を、組織で決める。' },

/* ---- js/app.js ---- */
/* 生徒指導 対応ナビ：画面。データ（SN.scenarios・SN.guides など）を見て描く。
   画面の場所（# のあと）：
     #top                     一覧（ホーム）
     #ijime                   場面のはじめの分かれ道
     #ijime~honnin~jijitsu    場面の中の道すじ（はじめから ~ でつなぐ）
     #ijime.all               場面の分かれ道を、すべて1ページで
     #kihon #kotoba #kiroku #renkei   基本のページ
   Artifact（SN.ARTIFACT が true）では # を書きかえず、ページの中だけで画面を切りかえる（開くときの # は読む）。 */
(function () {
  'use strict';
  const SN = window.SN;
  const app = document.getElementById('app');
  const ARTIFACT = !!SN.ARTIFACT;
  const WIDE = window.matchMedia ? window.matchMedia('(min-width: 1000px)') : { matches: true };
  const state = { route: { view: 'home' }, from: null, checks: {}, q: '' };
  const problems = SN.validate();
  if (problems.errors.length) console.warn('[生徒指導 対応ナビ] データのまちがい：\n' + problems.errors.join('\n'));

  // ---------- 小さな道具 ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  const plain = (s) => String(s).replace(/\*\*/g, '');
  // 検索用：全角半角・大文字小文字・カタカナとひらがなの違いをならす。1文字ずつ置きかえて、文字の位置を変えない（見つかった所に印をつけるため）
  const fold = (s) => String(s)
    .replace(/[^\x00-\x7f]/g, (c) => { const n = c.normalize('NFKC'); return n.length === 1 ? n : c; })
    .replace(/[A-Z]/g, (c) => c.toLowerCase())
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const titleOf = (sid) => (SN.scenarios[sid] ? SN.scenarios[sid].title : sid);
  // 問いが「次は」だけのときは、見出しを「次にすること」にする
  const qText = (q) => (/^次(は|に)?[。？?]?$/.test(String(q).trim()) ? '次にすること' : q);
  const FORK = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--chalk)"/><path d="M16 27V17M16 17 9.5 8.5M16 17l6.5-8.5" stroke="var(--sheet)" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="16" cy="17" r="2.8" fill="var(--sheet)"/></svg>';

  // ---------- 場所（route）と # ----------
  const GUIDES = Object.fromEntries(SN.guides.map((g) => [g.id, g]));
  function parse(hash) {
    let h = String(hash || '').replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* そのまま */ }
    if (!h || h === 'top') return { view: 'home' };
    if (GUIDES[h]) return { view: 'guide', id: h };
    const all = h.match(/^([a-z][a-z0-9_]*)\.all$/);
    if (all && SN.scenarios[all[1]]) return { view: 'all', sid: all[1] };
    const parts = h.split('~');
    const s = SN.scenarios[parts[0]];
    if (!s) return { view: 'home' };
    let path = [s.start].concat(parts.slice(1));
    if (!SN.validPath(s.id, path)) path = SN.pathTo(s.id, parts[parts.length - 1]) || [s.start];
    return { view: 'node', sid: s.id, path };
  }
  function encode(r) {
    if (r.view === 'guide') return '#' + r.id;
    if (r.view === 'all') return '#' + r.sid + '.all';
    if (r.view === 'node') return '#' + [r.sid].concat(r.path.slice(1)).join('~');
    return '#top';
  }
  const nodeRoute = (sid, nid) => ({ view: 'node', sid, path: SN.pathTo(sid, nid) || [SN.scenarios[sid].start] });
  const startRoute = (sid) => ({ view: 'node', sid, path: [SN.scenarios[sid].start] });
  function go(r) {
    if (ARTIFACT) return render(r);
    const h = encode(r);
    if (location.hash === h) render(r);
    else location.hash = h;
  }

  // ---------- 場面の木（はじめから幅優先でたどった順・親・入ってくる選択肢） ----------
  const trees = {};
  function tree(sid) {
    if (trees[sid]) return trees[sid];
    const s = SN.scenarios[sid];
    const parent = { [s.start]: null }, order = [s.start], incoming = {};
    for (let i = 0; i < order.length; i++) {
      const nid = order[i];
      for (const o of s.nodes[nid].options || []) {
        if (!o.to || !s.nodes[o.to]) continue;
        (incoming[o.to] = incoming[o.to] || []).push({ from: nid, label: o.label });
        if (!(o.to in parent)) { parent[o.to] = nid; order.push(o.to); }
      }
    }
    return (trees[sid] = { parent, order, incoming });
  }

  // ---------- 部品 ----------
  function bar(mid, right) {
    return `<header class="bar"><div class="wrap bar-in">
      <a class="brand" href="#top" data-go aria-label="生徒指導 対応ナビ（一覧へ）">${FORK}<span><span class="brand-s">生徒指導 </span>対応ナビ</span></a>
      ${mid ? `<span class="bar-sep" aria-hidden="true">/</span>${mid}` : '<span class="bar-sp"></span>'}
      ${right || ''}
    </div></header>`;
  }
  function footer() {
    return `<footer class="foot"><div class="wrap">
      <p><strong>このナビは、生徒指導の対応の「例」です。</strong>実際の対応は、各校の生徒指導規程・いじめ防止基本方針・管理職の判断に従ってください。命にかかわるときは、迷わず119番・110番へ。</p>
      <p>文部科学省「生徒指導提要」（2022年改訂）と、各分かれ道の「根拠・参考」に示した法律・通知・手引きをもとに作成しました（2026年10月）。</p>
    </div></footer>`;
  }
  const sec = (title, mark, cls, body) => `<section class="sec ${cls || ''}"><h2><span class="mk" aria-hidden="true">${mark}</span>${title}</h2>${body}</section>`;

  function teamBlock(key, ids) {
    const groups = [['in', '校内'], ['home', '家庭'], ['out', '校外']];
    const rows = groups.map(([w, label]) => {
      const chips = ids.filter((id) => SN.team[id] && SN.team[id].where === w)
        .map((id) => `<button type="button" class="chip${w === 'out' ? ' out' : ''}" data-team="${id}" data-key="${key}" aria-expanded="false">${esc(SN.team[id].name)}</button>`);
      return chips.length ? `<div class="team-row"><span class="where">${label}</span>${chips.join('')}</div>` : '';
    }).join('');
    return `<div class="team">${rows}<p class="team-note" data-note="${key}" aria-live="polite" hidden></p></div>`;
  }

  // 分かれ道の中身（はじめの画面・一覧のどちらでも使う）
  function nodeBody(s, n) {
    const key = s.id + ':' + n.id;
    const out = [];
    if (n.alert) out.push(`<div class="alert" role="note"><span class="alert-label">緊急</span><p>${rich(n.alert)}</p></div>`);
    if (n.text) out.push(`<p class="lede">${rich(n.text)}</p>`);
    if (n.id === s.start && s.example) out.push(`<div class="example"><span class="label">たとえば</span><p>${rich(s.example)}</p></div>`);
    if (n.steps) {
      const items = n.steps.map((t, i) => {
        const ck = `${key}:${i}`;
        return `<li><label class="step"><input type="checkbox" data-check="${ck}"${state.checks[ck] ? ' checked' : ''}><span class="num" data-n="${i + 1}" aria-hidden="true"></span><span class="t">${rich(t)}</span></label></li>`;
      }).join('');
      out.push(sec('対応の手順', '→', '', `<ol class="steps">${items}</ol><p class="steps-note">終わったものは押して印をつけられます（このページを閉じると消えます）。</p>`));
    }
    if (n.say) out.push(sec('声かけの例', '○', 'ok', `<ul class="say">${n.say.map((t) => `<li>${rich(t)}</li>`).join('')}</ul>`));
    if (n.avoid) out.push(sec('避けたい言葉・対応', '×', 'ng', `<ul class="avoid">${n.avoid.map(([t, why]) => `<li><span class="ng-text">${rich(t)}</span><span class="why">${rich(why)}</span></li>`).join('')}</ul>`));
    if (n.team) out.push(sec('連携・報告先', '⇄', '', teamBlock(key, n.team)));
    if (n.record) out.push(sec('記録すること', '✎', '', `<ul class="plain">${n.record.map((t) => `<li>${rich(t)}</li>`).join('')}</ul>`));
    if (n.points) out.push(sec('ポイント', '！', 'pt', `<ul class="plain">${n.points.map((t) => `<li>${rich(t)}</li>`).join('')}</ul>`));
    if (n.basis) out.push(sec('根拠・参考', '§', '', `<ul class="basis-list">${n.basis.map((t) => `<li>${rich(t)}</li>`).join('')}</ul>`));
    return out.join('');
  }

  // 選択肢のリンク
  function optLink(s, path, o) {
    if (o.to) {
      const r = { view: 'node', sid: s.id, path: path.concat(o.to) };
      return `<a class="opt" href="${encode(r)}" data-go><span>${esc(o.label)}</span>${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ''}<span class="arrow" aria-hidden="true">→</span></a>`;
    }
    const js = o.jump.split('~')[0];
    const here = encode({ view: 'node', sid: s.id, path });
    return `<a class="opt jump" href="#${esc(o.jump)}" data-go data-from="${esc(here)}"><span>${esc(o.label)}</span><span class="sub">別の場面へ：${esc(titleOf(js))}${o.sub ? '　' + esc(o.sub) : ''}</span><span class="arrow" aria-hidden="true">↗</span></a>`;
  }

  // 分岐マップ（路線図）
  function mapTree(s, path) {
    const t = tree(s.id), on = new Set(path), cur = path[path.length - 1];
    const item = (nid) => {
      const n = s.nodes[nid];
      const subs = [], seen = new Set();
      for (const o of n.options || []) {
        if (o.to && s.nodes[o.to]) {
          if (seen.has(o.to)) continue;
          seen.add(o.to);
          if (t.parent[o.to] === nid) subs.push(item(o.to));
          else subs.push(`<li class="m-ref"><a href="${encode(nodeRoute(s.id, o.to))}" data-go title="${esc(o.label)}"><span class="m-ic" aria-hidden="true">↪</span><span>${esc(s.nodes[o.to].title)}</span></a></li>`);
        } else if (o.jump) {
          const here = encode(nodeRoute(s.id, nid));
          subs.push(`<li class="m-ext"><a href="#${esc(o.jump)}" data-go data-from="${esc(here)}" title="${esc(o.label)}"><span class="m-ic" aria-hidden="true">↗</span><span>${esc(titleOf(o.jump.split('~')[0]))}</span></a></li>`);
        }
      }
      const cls = 'm-node' + (on.has(nid) ? ' on' : '') + (nid === cur ? ' cur' : '');
      return `<li><a class="${cls}" href="${encode(nodeRoute(s.id, nid))}" data-go${nid === cur ? ' aria-current="step"' : ''}><span class="dot" aria-hidden="true"></span><span>${esc(n.title)}</span></a>${subs.length ? `<ul>${subs.join('')}</ul>` : ''}</li>`;
    };
    return `<ul class="map">${item(s.start)}</ul>`;
  }
  function mapBox(s, path, open) {
    const count = Object.keys(s.nodes).length;
    return `<details class="map-box" id="map"${open ? ' open' : ''}>
      <summary>分岐マップ <span class="cnt">分かれ道 ${count}</span></summary>
      <p class="map-legend"><span>● いまの道すじ</span><span>↪ ほかの枝と合流</span><span>↗ 別の場面へ</span></p>
      ${mapTree(s, path)}
    </details>`;
  }

  // ---------- 画面：ホーム ----------
  function viewHome() {
    const errs = problems.errors.length
      ? `<div class="data-errors" role="alert"><strong>データにまちがいがあります（${problems.errors.length}件）。</strong>tools/check.cjs で確かめてください。<ul>${problems.errors.slice(0, 8).map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`
      : '';
    const cats = SN.cats.map((c) => {
      const list = c.ids.filter((id) => SN.scenarios[id]).map((id) => {
        const s = SN.scenarios[id];
        return `<li><a class="card" href="${encode(startRoute(id))}" data-go>
          <h3>${esc(s.title)}</h3><p>${esc(s.lead)}</p>
          <span class="meta"><span>分かれ道 ${Object.keys(s.nodes).length}</span><span class="go" aria-hidden="true">開く →</span></span></a></li>`;
      }).join('');
      if (!list) return '';
      return `<section class="cat cat-${c.id}" aria-labelledby="cat-${c.id}">
        <div class="cat-head"><h2 id="cat-${c.id}">${esc(c.name)}</h2><p>${esc(c.note)}</p></div>
        <ul class="cards">${list}</ul></section>`;
    }).join('');
    const guides = SN.guides.map((g) => `<li><a class="card" href="#${g.id}" data-go><h3>${esc(g.title)}</h3><p>${esc(g.lead)}</p></a></li>`).join('');
    return bar('', `<a class="bar-btn" href="#kihon" data-go>初期対応の基本</a>`) + `
      <main class="wrap" id="home">
        ${errs}
        <section class="hero">
          <h1 tabindex="-1">生徒指導 対応ナビ</h1>
          <p class="tag">迷ったときに開く、分かれ道の地図</p>
          <p class="how">場面を選び、問いに答えて進むと、その状況での<strong>対応の手順・声かけの例・避けたい言葉・連携先・記録すること</strong>が出ます。右の分岐マップ（スマホでは下）から、ほかの分かれ道へも移れます。</p>
        </section>
        <section class="sos" aria-labelledby="sos-h">
          <h2 id="sos-h">命や体の安全にかかわるときは、まずこの3つ</h2>
          <ol>
            <li><span class="n">1</span><span><b>安全を確保する</b><span class="tel">119</span> 救急　<span class="tel">110</span> 警察<br>生徒を一人にしない。</span></li>
            <li><span class="n">2</span><span><b>応援を呼ぶ</b>一人で対応しない。近くの先生・職員室へ。</span></li>
            <li><span class="n">3</span><span><b>管理職に報告する</b>そのあと、ここで場面を選んで対応を確かめる。</span></li>
          </ol>
        </section>
        <div class="search" role="search">
          <label for="q">場面やことばで探す</label>
          <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="例：LINE、リストカット、保護者" value="${esc(state.q)}">
          <button type="button" class="clear" data-clear aria-label="検索をけす"${state.q ? '' : ' hidden'}>×</button>
          <p class="hint">キーボードの <kbd>/</kbd> でここへ移れます。</p>
        </div>
        <div class="results" id="results" aria-live="polite"></div>
        <div id="browse">
          ${cats}
          <section class="cat guides" aria-labelledby="cat-kihon">
            <div class="cat-head"><h2 id="cat-kihon">基本</h2><p>どの場面にも共通すること。</p></div>
            <ul class="cards">${guides}</ul>
          </section>
        </div>
      </main>` + footer();
  }

  // ---------- 検索 ----------
  let INDEX = null;
  function buildIndex() {
    INDEX = [];
    for (const s of SN.ordered()) {
      INDEX.push({ sid: s.id, nid: s.start, title: s.title, scene: true, texts: [s.title, s.lead, s.example || '', (s.words || []).join('、')].filter(Boolean) });
      for (const nid of tree(s.id).order) {
        const n = s.nodes[nid];
        const texts = [n.title, n.alert, n.text, ...(n.steps || []), ...(n.say || []), ...(n.avoid || []).flat(), ...(n.record || []), ...(n.points || []), n.question, ...(n.options || []).map((o) => o.label)].filter(Boolean).map(plain);
        INDEX.push({ sid: s.id, nid, title: n.title, texts });
      }
    }
    for (const g of SN.guides) {
      const texts = [g.title, g.lead];
      for (const b of g.blocks) {
        if (b.h) texts.push(b.h);
        if (b.p) texts.push(b.p);
        if (b.template) texts.push(b.template);
        texts.push(...(b.ol || []), ...(b.ul || []), ...(b.pairs || []).flat());
        if (b.team) texts.push(...Object.values(SN.team).map((t) => `${t.name}：${t.role}`));
        if (b.hotlines) texts.push(...SN.hotlines.map((h) => `${h.tel} ${h.name}（${h.note}）`));
      }
      INDEX.push({ guide: g.id, title: g.title, texts: texts.map(plain) });
    }
    for (const e of INDEX) e.hay = fold(e.texts.join('\n'));
  }
  function snippet(texts, term) {
    for (const t of texts) {
      const i = fold(t).indexOf(term);
      if (i < 0) continue;
      const a = Math.max(0, i - 24), b = Math.min(t.length, i + term.length + 36);
      return (a > 0 ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + term.length)) + '</mark>' + esc(t.slice(i + term.length, b)) + (b < t.length ? '…' : '');
    }
    return esc(texts[1] || texts[0] || '');
  }
  function runSearch() {
    const box = document.getElementById('results'), browse = document.getElementById('browse'), clear = app.querySelector('[data-clear]');
    if (!box) return;
    const q = state.q.trim();
    if (clear) clear.hidden = !q;
    if (!q) { box.innerHTML = ''; browse.hidden = false; return; }
    if (!INDEX) buildIndex();
    const terms = fold(q).split(/\s+/).filter(Boolean);
    const seen = new Set();
    const hits = INDEX.filter((e) => terms.every((t) => e.hay.includes(t)))
      .map((e) => ({ e, score: (e.scene ? 2 : 0) + (terms.some((t) => fold(e.title).includes(t)) ? 3 : 0) }))
      .sort((x, y) => y.score - x.score)
      .filter(({ e }) => { const k = e.guide ? 'g:' + e.guide : e.sid + ':' + e.nid; if (seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, 40);
    browse.hidden = true;
    const line = (e) => e.guide
      ? `<a href="#${e.guide}" data-go><span class="r-path">基本 › ${esc(e.title)}</span><span class="r-snip">${snippet(e.texts, terms[0])}</span></a>`
      : `<a href="${encode(nodeRoute(e.sid, e.nid))}" data-go><span class="r-path">${esc(titleOf(e.sid))}${e.scene ? '' : ' › ' + esc(e.title)}</span><span class="r-snip">${snippet(e.texts, terms[0])}</span></a>`;
    box.innerHTML = `<p class="count">「${esc(q)}」が見つかったところ：${hits.length}件${hits.length === 40 ? '（上から40件）' : ''}</p>` +
      (hits.length
        ? hits.map(({ e }) => line(e)).join('')
        : `<p>見つかりませんでした。ほかの言い方（例：「スマホ」→「携帯」）でも探せます。下の一覧から選ぶこともできます。</p><p><button type="button" class="btn" data-clear>検索をけして一覧を見る</button></p>`);
  }

  // ---------- 画面：分かれ道 ----------
  function viewNode(r) {
    const s = SN.scenarios[r.sid], path = r.path, nid = path[path.length - 1], n = s.nodes[nid];
    const crumbs = path.map((id, i) => i < path.length - 1
      ? `<a href="${encode({ view: 'node', sid: s.id, path: path.slice(0, i + 1) })}" data-go>${esc(s.nodes[id].title)}</a>`
      : `<span aria-current="page">${esc(s.nodes[id].title)}</span>`).join('<span class="sep" aria-hidden="true">›</span>');
    const from = state.from && state.from.view === 'node' && state.from.sid !== s.id
      ? `<a class="from" href="${encode(state.from)}" data-go>← もどる：${esc(titleOf(state.from.sid))} › ${esc(SN.scenarios[state.from.sid].nodes[state.from.path[state.from.path.length - 1]].title)}</a>`
      : '';
    const opts = n.options || [];
    const branch = opts.length
      ? `<section class="branch" id="branch" aria-labelledby="branch-q"><p class="kicker">次の分かれ道</p><h2 id="branch-q">${esc(qText(n.question))}</h2><ul class="opts">${opts.map((o) => `<li>${optLink(s, path, o)}</li>`).join('')}</ul></section>`
      : `<section class="leaf"><h2>この道すじの対応は、ここまでです</h2><p>ほかの分かれ道は、分岐マップから確かめられます。場面全体を1ページで読むこともできます。</p>
          <div class="leaf-actions"><a class="btn" href="${encode(startRoute(s.id))}" data-go>はじめの分かれ道へ</a><a class="btn" href="${encode({ view: 'all', sid: s.id })}" data-go>この場面をすべて読む</a></div>
          ${(s.related || []).filter((id) => SN.scenarios[id]).length ? `<div class="related"><h3>関連する場面</h3><ul>${s.related.filter((id) => SN.scenarios[id]).map((id) => `<li><a href="${encode(startRoute(id))}" data-go>${esc(titleOf(id))}</a></li>`).join('')}</ul></div>` : ''}
        </section>`;
    const backR = path.length > 1 ? { view: 'node', sid: s.id, path: path.slice(0, -1) } : { view: 'home' };
    const depth = path.length === 1 ? 'はじめの分かれ道' : `${path.length}つめの分かれ道`;
    return bar(`<a class="bar-scene" href="${encode(startRoute(s.id))}" data-go>${esc(s.title)}</a>`, `<button type="button" class="bar-btn map-toggle" data-scroll="map">分岐マップ</button>`) + `
      <div class="wrap layout">
        <main class="main">
          ${from}
          <nav class="crumbs" aria-label="ここまでの道すじ">${crumbs}</nav>
          <header class="node-head">
            <p class="eyebrow">${esc(s.title)}・${depth}</p>
            <h1 tabindex="-1">${esc(n.title)}</h1>
            ${opts.length && (n.steps || n.text) ? `<a class="to-branch" href="#branch" data-scroll="branch">↓ 次の分かれ道：${esc(qText(n.question))}</a>` : ''}
          </header>
          ${nodeBody(s, n)}
          ${branch}
          <a class="back" href="${encode(backR)}" data-go>← ${path.length > 1 ? '前の分かれ道に戻る' : '一覧に戻る'}</a>
        </main>
        <aside class="map-aside" aria-label="この場面の分岐マップ">${mapBox(s, path, WIDE.matches)}
          <p class="small-note" style="margin-top:10px"><a href="${encode({ view: 'all', sid: s.id })}" data-go>この場面の分かれ道を、すべて1ページで読む</a></p>
        </aside>
      </div>` + footer();
  }

  // ---------- 画面：場面の全体 ----------
  function viewAll(r) {
    const s = SN.scenarios[r.sid], t = tree(s.id);
    const blocks = t.order.map((nid) => {
      const n = s.nodes[nid];
      const came = (t.incoming[nid] || []).map((x) => `「${esc(s.nodes[x.from].title)}」で「${esc(x.label)}」`).join('、');
      const opts = (n.options || []).map((o) => o.to
        ? `<li><button type="button" data-scroll="n-${o.to}">${esc(o.label)}</button>（→ ${esc(s.nodes[o.to].title)}）</li>`
        : `<li><a href="#${esc(o.jump)}" data-go data-from="${esc(encode(nodeRoute(s.id, nid)))}">${esc(o.label)}</a>（→ 別の場面：${esc(titleOf(o.jump.split('~')[0]))}）</li>`).join('');
      return `<article class="all-node" id="n-${nid}">
        <header>${nid === s.start ? '<p class="came">はじめの分かれ道</p>' : came ? `<p class="came">${came}を選んだとき</p>` : ''}<h2 class="node-t">${esc(n.title)}</h2></header>
        ${nodeBody(s, n)}
        ${opts ? `<div class="all-opts"><h3>${esc(qText(n.question))}</h3><ul>${opts}</ul></div>` : ''}
        <p class="no-print"><a href="${encode(nodeRoute(s.id, nid))}" data-go>この分かれ道を、ナビの画面で開く →</a></p>
      </article>`;
    }).join('');
    return bar(`<a class="bar-scene" href="${encode(startRoute(s.id))}" data-go>${esc(s.title)}</a>`, '') + `
      <div class="wrap layout">
        <main class="main">
          <header class="all-head">
            <h1 tabindex="-1">${esc(s.title)}（すべての分かれ道）</h1>
            <p>${esc(s.lead)} 分かれ道 ${t.order.length} をすべて、はじめから順に並べています。</p>
            <div class="all-tools">
              <a class="btn" href="${encode(startRoute(s.id))}" data-go>← ナビの画面に戻る</a>
              ${ARTIFACT ? '' : '<button type="button" class="btn solid" data-print>この場面を印刷する</button>'}
            </div>
          </header>
          ${blocks}
        </main>
        <aside class="map-aside" aria-label="この場面の分岐マップ">${mapBox(s, [s.start], WIDE.matches)}</aside>
      </div>` + footer();
  }

  // ---------- 画面：基本のページ ----------
  function viewGuide(r) {
    const g = GUIDES[r.id];
    const blocks = g.blocks.map((b, bi) => {
      if (b.h) return `<h2>${esc(b.h)}</h2>`;
      if (b.p) return `<p>${rich(b.p)}</p>`;
      if (b.ol) return `<ol class="g-ol">${b.ol.map((t) => `<li><span>${rich(t)}</span></li>`).join('')}</ol>`;
      if (b.ul) return `<ul class="g-ul">${b.ul.map((t) => `<li>${rich(t)}</li>`).join('')}</ul>`;
      if (b.pairs) return `<dl class="pairs">${b.pairs.map(([dt, dd]) => `<div><dt>${rich(dt)}</dt><dd>${rich(dd)}</dd></div>`).join('')}</dl>`;
      if (b.template) return `<div class="tpl"><pre id="tpl-${bi}">${esc(b.template)}</pre><div><button type="button" class="btn solid" data-copy="tpl-${bi}">枠をコピーする</button> <span class="copied" aria-live="polite"></span></div></div>`;
      if (b.team) {
        return `<div class="team-list">${[['in', '校内'], ['home', '家庭'], ['out', '校外']].map(([w, label]) => {
          const items = Object.values(SN.team).filter((t) => t.where === w);
          return items.length ? `<h3>${label}</h3><dl>${items.map((t) => `<div><dt>${esc(t.name)}</dt><dd>${esc(t.role)}</dd></div>`).join('')}</dl>` : '';
        }).join('')}</div>`;
      }
      if (b.hotlines) {
        return `<ul class="hotlines">${SN.hotlines.map((h) => `<li><span class="num">${esc(h.tel)}</span><span class="nm">${esc(h.name)}</span><span class="nt">${esc(h.note)}</span></li>`).join('')}</ul><p class="small-note">${esc(SN.hotlineNote)}</p>`;
      }
      return '';
    }).join('');
    const others = SN.guides.filter((x) => x.id !== g.id).map((x) => `<a class="btn" href="#${x.id}" data-go>${esc(x.title)}</a>`).join('');
    return bar(`<span class="bar-scene">${esc(g.title)}</span>`, '') + `
      <main class="wrap"><article class="guide">
        <h1 tabindex="-1">${esc(g.title)}</h1>
        <p class="lead">${esc(g.lead)}</p>
        ${blocks}
        <div class="leaf-actions no-print" style="margin-top:12px">${others}${ARTIFACT ? '' : '<button type="button" class="btn" data-print>印刷する</button>'}</div>
        <p class="no-print"><a href="#top" data-go>← 一覧に戻る</a></p>
      </article></main>` + footer();
  }

  // ---------- 描く ----------
  function render(r) {
    // 別の場面から来たときの「もどる」は、その場面の中にいるあいだだけ出す
    if (r.view !== 'node' || (state.from && state.from.sid === r.sid)) state.from = null;
    state.route = r;
    let html, title = '生徒指導 対応ナビ';
    if (r.view === 'node') { html = viewNode(r); const n = SN.scenarios[r.sid].nodes[r.path[r.path.length - 1]]; title = `${n.title}｜${titleOf(r.sid)}｜生徒指導 対応ナビ`; }
    else if (r.view === 'all') { html = viewAll(r); title = `${titleOf(r.sid)}（すべて）｜生徒指導 対応ナビ`; }
    else if (r.view === 'guide') { html = viewGuide(r); title = `${GUIDES[r.id].title}｜生徒指導 対応ナビ`; }
    else html = viewHome();
    app.innerHTML = html;
    if (!ARTIFACT) document.title = title;
    if (r.view === 'home') {
      runSearch();
      window.scrollTo(0, 0);
      return;
    }
    window.scrollTo(0, 0);
    const h1 = app.querySelector('h1');
    if (h1) try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
  }

  // ---------- 操作 ----------
  app.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-go]');
    if (a) {
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
      const from = a.getAttribute('data-from');
      if (from) state.from = parse(from);
      const r = parse(a.getAttribute('href'));
      e.preventDefault();
      go(r);
      return;
    }
    const scr = e.target.closest('[data-scroll]');
    if (scr) {
      e.preventDefault();
      const el = document.getElementById(scr.getAttribute('data-scroll'));
      if (el) {
        if (el.tagName === 'DETAILS') el.open = true;
        el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      }
      return;
    }
    const chip = e.target.closest('[data-team]');
    if (chip) {
      const key = chip.getAttribute('data-key'), id = chip.getAttribute('data-team');
      const note = app.querySelector(`[data-note="${key}"]`);
      const open = chip.getAttribute('aria-expanded') === 'true';
      app.querySelectorAll(`[data-key="${key}"]`).forEach((c) => c.setAttribute('aria-expanded', 'false'));
      if (open) { note.hidden = true; return; }
      chip.setAttribute('aria-expanded', 'true');
      note.innerHTML = `<strong>${esc(SN.team[id].name)}</strong>：${esc(SN.team[id].role)}`;
      note.hidden = false;
      return;
    }
    const cp = e.target.closest('[data-copy]');
    if (cp) {
      const pre = document.getElementById(cp.getAttribute('data-copy'));
      const msg = cp.parentElement.querySelector('.copied');
      const done = (t) => { if (msg) msg.textContent = t; };
      const selectIt = () => { const sel = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(rg); done('選びました。コピーしてください（Ctrl+C／長押し）'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pre.textContent).then(() => done('コピーしました'), selectIt);
      else selectIt();
      return;
    }
    if (e.target.closest('[data-print]')) { window.print(); return; }
    if (e.target.closest('[data-clear]')) {
      state.q = '';
      const q = document.getElementById('q');
      if (q) { q.value = ''; q.focus(); }
      runSearch();
    }
  });
  app.addEventListener('change', (e) => {
    const c = e.target.closest('input[data-check]');
    if (c) state.checks[c.getAttribute('data-check')] = c.checked;
  });
  app.addEventListener('input', (e) => {
    if (e.target.id === 'q') { state.q = e.target.value; runSearch(); }
  });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
    if (e.key === '/' && !typing && state.route.view === 'home') {
      const q = document.getElementById('q');
      if (q) { e.preventDefault(); q.focus(); }
    } else if (e.key === 'Escape' && e.target && e.target.id === 'q' && state.q) {
      state.q = ''; e.target.value = ''; runSearch();
    }
  });
  if (!ARTIFACT) window.addEventListener('hashchange', () => render(parse(location.hash)));
  if (WIDE.addEventListener) WIDE.addEventListener('change', () => { const m = document.getElementById('map'); if (m) m.open = WIDE.matches; });

  // 開くときの # を読む（Artifact でも、共有リンクの #ijime などは届く）
  render(parse(location.hash));
})();

</script>
</body>
</html>
