<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>体育館よやく</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230a6f50%22/%3E%3Crect x=%225%22 y=%229%22 width=%2222%22 height=%2214%22 rx=%221.5%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%221.8%22/%3E%3Cpath d=%22M16 9v14%22 stroke=%22%23fff%22 stroke-width=%221.8%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%221.8%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* 体育館よやく：見た目。
   レイアウト：上に画面の切りかえと「きょう」。その下に、体育館の床とコートラインを思わせる細い帯。
   本体は、日付を行・時間帯を列にした時間割。スマホでは日付ごとに縦に積む。
   色：コートラインから。緑＝使える・確定、黄＝申込・確定待ち、紺＝定期枠・土曜、赤＝違反・取り消し・日曜。 */
:root {
  --paper: #edf1ef;
  --card: #ffffff;
  --ink: #16202a;
  --ink2: #4e5d69;
  --rule: #d2d9d6;
  --rule2: #e4e9e7;
  --court: #0a6f50;
  --court-ink: #ffffff;
  --court-soft: #dcefe6;
  --gold: #976400;
  --gold-soft: #faedcc;
  --navy: #26467c;
  --navy-soft: #e2e9f5;
  --red: #b3372a;
  --red-soft: #f8e3df;
  --floor: #d9b47e;
  --shadow: rgb(16 32 26 / .14);
  --f-disp: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --f-data: "BIZ UDGothic", ui-monospace, Menlo, Consolas, monospace;
  --rad: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161a; --card: #182027; --ink: #e3e9ed; --ink2: #9ba9b4; --rule: #2c3741; --rule2: #222c34;
    --court: #3cbf90; --court-ink: #06140f; --court-soft: #163a2e; --gold: #e2b143; --gold-soft: #3a2f16;
    --navy: #93b4ec; --navy-soft: #1c2a41; --red: #f0806f; --red-soft: #3c201c; --floor: #7a5c35; --shadow: rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161a; --card: #182027; --ink: #e3e9ed; --ink2: #9ba9b4; --rule: #2c3741; --rule2: #222c34;
  --court: #3cbf90; --court-ink: #06140f; --court-soft: #163a2e; --gold: #e2b143; --gold-soft: #3a2f16;
  --navy: #93b4ec; --navy-soft: #1c2a41; --red: #f0806f; --red-soft: #3c201c; --floor: #7a5c35; --shadow: rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.75 var(--f-body); }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-disp); text-wrap: balance; margin: 0; }
h2 { font-size: 19px; font-weight: 700; line-height: 1.45; }
h3 { font-size: 16px; font-weight: 700; line-height: 1.5; }
p { margin: 0; }
small, .small { font-size: 13px; }
.muted { color: var(--ink2); }
.mono, code { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
code { background: var(--rule2); padding: 1px 6px; border-radius: 4px; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--court) 55%, transparent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- 上の帯 ---- */
.top { background: var(--card); border-bottom: 1px solid var(--rule); }
.top-in, .clock-in, .wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand .name { font: 900 20px/1.2 var(--f-disp); letter-spacing: .02em; }
.brand .sub { font-size: 12px; color: var(--ink2); }
.logo { width: 40px; height: 26px; flex: none; fill: var(--court-soft); stroke: var(--court); stroke-width: 1.6; }
.logo path, .logo line, .logo circle { fill: none; }
.views { display: flex; gap: 3px; padding: 3px; background: var(--rule2); border-radius: 10px; }
.view { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 700; color: var(--ink2); cursor: pointer; }
.view.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.clock { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock .k { font-size: 12px; color: var(--ink2); }
.floor { height: 6px; background: linear-gradient(var(--court) 0 2px, var(--floor) 2px); }
.clock-panel { border-top: 1px solid var(--rule2); background: var(--paper); }
.clock-in { padding-block: 14px; display: grid; gap: 12px; }
.reset { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--red); font-size: 13px; }

/* ---- 本体 ---- */
.wrap { padding-block: 20px 72px; display: grid; gap: 16px; }
.wrap > * { min-width: 0; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card > *, .sec > *, .hot-slot > *, .kuji > *, .block > * { min-width: 0; }
.card.attn { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); align-items: start; }
.grid2 > * { min-width: 0; }
.subbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; border-bottom: 1px solid var(--rule); }
.subbar .tabs { border-bottom: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tab { border: 0; background: none; padding: 10px 12px; border-bottom: 3px solid transparent; font-weight: 700; color: var(--ink2); white-space: nowrap; cursor: pointer; }
.tab.on { color: var(--ink); border-color: var(--court); }
.pick { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); padding-bottom: 8px; min-width: 0; }
.pick select { max-width: min(78vw, 420px); }
select, input:not([type="checkbox"]):not([type="radio"]), textarea {
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; min-width: 0; max-width: 100%;
}
textarea { width: 100%; font-family: var(--f-data); font-size: 12px; line-height: 1.5; resize: vertical; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.toolbar .pick { padding-bottom: 0; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--rule2); border-radius: 9px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 14px; color: var(--ink2); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.num-badge { display: inline-block; min-width: 1.6em; padding: 0 5px; border-radius: 999px; background: var(--red); color: var(--card); font-size: 11px; line-height: 1.6; text-align: center; }

/* ---- ボタン・印 ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--court); background: var(--court); color: var(--court-ink); font-weight: 700; line-height: 1.4; cursor: pointer; text-align: center; }
.btn.ghost { background: transparent; color: var(--court); }
.btn.warn { background: transparent; color: var(--red); border-color: var(--red); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.stack { flex-direction: column; gap: 0; }
.btn.stack small { font-weight: 400; font-size: 11px; color: var(--ink2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn .court { width: 20px; height: 13px; }
.row-btn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; font-size: 12px; line-height: 1.7; background: var(--rule2); color: var(--ink2); white-space: nowrap; font-weight: 700; }
.pill.ok { background: var(--court-soft); color: var(--court); }
.pill.wait { background: var(--gold-soft); color: var(--gold); }
.pill.reg { background: var(--navy-soft); color: var(--navy); }
.pill.bad { background: var(--red-soft); color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.court { width: 26px; height: 16px; vertical-align: -3px; flex: none; }
.court .bg { fill: none; stroke: currentColor; stroke-width: 1.4; }
.court .on { fill: currentColor; opacity: .28; }
.court line, .court circle { fill: none; stroke: currentColor; stroke-width: 1.2; }
.warn { color: var(--red); }
.okmsg { color: var(--court); font-weight: 700; }
.badmsg { color: var(--red); font-weight: 700; }
.callout { background: var(--court-soft); border-radius: var(--rad); padding: 10px 14px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 14px; }
.phase { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 14px; border-radius: var(--rad); background: var(--card); border: 1px solid var(--rule); }
.phase.wait { border-color: var(--gold); }
.phase.ok { border-color: var(--court); }

/* ---- しくみ ---- */
.hero { display: grid; gap: 14px; padding-block: 12px 4px; max-width: 760px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--court); }
.hero h1 { font-size: clamp(27px, 5.2vw, 42px); font-weight: 900; line-height: 1.28; letter-spacing: .01em; }
.lead { font-size: 16px; line-height: 1.9; max-width: 42em; }
.block { display: grid; gap: 14px; padding-block: 20px; border-top: 1px solid var(--rule); }
.block.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px 32px; align-items: start; }
.block.two > div { display: grid; gap: 12px; min-width: 0; }
.block p, .block li { max-width: 46em; }
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.layer { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 6px; align-content: start; position: relative; overflow: hidden; }
.layer::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--court); }
.layer:nth-child(2)::before { background: var(--gold); }
.layer:nth-child(3)::before { background: var(--navy); }
.step { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--ink2); }
.example { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; }
.facts li b { font-size: 26px; line-height: 1.1; color: var(--court); min-width: 1.5em; text-align: right; }
.facts li span { grid-column: 2; font-size: 14px; color: var(--ink2); }
.facts.row { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.dots { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.note { color: var(--ink2); }

/* ---- 日程（流れ） ---- */
.tl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
.tl li { position: relative; padding: 10px 12px 10px; border-radius: var(--rad); background: var(--card); border: 1px solid var(--rule); display: grid; gap: 2px; }
.tl li b { font-size: 14px; }
.tl li span { font-size: 13px; color: var(--ink2); }
.tl li.done { background: transparent; border-style: dashed; color: var(--ink2); }
.tl li.now { border-color: var(--court); box-shadow: inset 0 3px 0 var(--court); }
.tl li em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--court-ink); background: var(--court); border-radius: 4px; padding: 0 6px; justify-self: start; }

/* ---- 時間割 ---- */
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend .u.reg { color: var(--navy); font-weight: 700; }
.legend .u.pend { color: var(--gold); font-weight: 700; }
.sw { width: 16px; height: 12px; border-radius: 3px; border: 1px solid var(--rule); display: inline-block; }
.cal { display: grid; gap: 4px; }
.cal .row { display: grid; grid-template-columns: 5.2em repeat(var(--cols), minmax(0, 1fr)); gap: 4px; }
.cal .row.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); padding-block: 4px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.cal .row.past { opacity: .62; }
.dc { display: flex; flex-direction: column; justify-content: center; padding: 2px 6px; line-height: 1.3; }
.dc b { font-size: 19px; }
.dc span { font-size: 12px; }
.dc i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--court-ink); background: var(--court); border-radius: 4px; padding: 0 5px; align-self: flex-start; margin-top: 2px; }
.dc.sat { color: var(--navy); }
.dc.sun { color: var(--red); }
.closed-msg { grid-column: 2 / -1; display: flex; align-items: center; padding: 8px 12px; border-radius: 6px; background: var(--rule2); color: var(--ink2); font-size: 13px; }
.cell { display: flex; flex-direction: column; gap: 3px; min-height: 66px; min-width: 0; padding: 6px 8px; text-align: left; border-radius: 6px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; line-height: 1.35; }
.cell:hover { border-color: var(--ink2); }
.cell.none { visibility: hidden; }
.cell .tm { display: flex; gap: 6px; font-size: 11px; color: var(--ink2); }
.cell .tm b { display: none; }
.cell .ls { display: grid; gap: 1px; min-width: 0; }
.cell .u { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .u i { font-style: normal; font-family: var(--f-data); font-size: 10px; display: inline-block; width: 1.5em; color: var(--ink2); }
.cell .u.open { color: var(--court); }
.cell .u.reg { color: var(--navy); }
.cell .u.pend { color: var(--gold); font-weight: 700; }
.cell .u.mine { font-weight: 700; }
.cell .bd { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
.cnt, .me { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; background: var(--rule2); color: var(--ink2); }
.cnt.hot { background: var(--red-soft); color: var(--red); }
.me { background: var(--gold-soft); color: var(--gold); }
.me.ok { background: var(--court-soft); color: var(--court); }
.me.lost { background: var(--rule2); color: var(--ink2); }
.t-can { border-color: var(--court); background: var(--court-soft); }
.t-applied { border: 1.5px dashed var(--gold); background: var(--gold-soft); }
.t-mine { border-color: var(--court); background: var(--court); color: var(--court-ink); }
.t-mine .u, .t-mine .u.reg, .t-mine .u.open, .t-mine .tm, .t-mine .u i { color: var(--court-ink); }
.t-pend { border: 1.5px solid var(--gold); background: var(--gold-soft); }
.t-full { background: var(--rule2); }
.t-block { background: repeating-linear-gradient(135deg, var(--rule2) 0 6px, transparent 6px 12px), var(--card); color: var(--ink2); }
.t-reg { background: var(--navy-soft); border-color: var(--navy); }
@media (max-width: 720px) {
  .cal .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cal .row.head { display: none; }
  .dc { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 8px; padding: 8px 2px 0; }
  .closed-msg { grid-column: 1 / -1; }
  .cell.none { display: none; }
  .cell .tm b { display: inline; color: var(--ink); }
  .t-mine .tm b { color: var(--court-ink); }
}

/* ---- 表・数字 ---- */
.tw { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--rule2); text-align: left; white-space: nowrap; vertical-align: middle; }
thead th { font-size: 12px; color: var(--ink2); font-weight: 700; border-bottom-color: var(--rule); }
td.wrap { white-space: normal; min-width: 14em; font-size: 13px; color: var(--ink2); }
.num { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
table.plain td, table.plain th { padding: 6px 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; white-space: normal; }
.checks label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; display: grid; }
.tile span { font-size: 13px; color: var(--ink2); }
.tile b { font-size: 30px; line-height: 1.2; }
.tile small { color: var(--ink2); }
.tile.ok b { color: var(--court); }
.heat td { text-align: center; background: color-mix(in srgb, var(--red) calc(var(--v, 0) * 1%), var(--card)); min-width: 5.2em; }
.heat td b { display: block; font-size: 16px; }
.heat td small { display: block; font-size: 11px; color: var(--ink2); font-family: var(--f-data); }
.heat td.hot, .heat td.hot small { color: #ffffff; }
.heat td.na { background: transparent; color: var(--ink2); }
.heat th[scope="row"] { font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--ink2); font-size: 13px; }
.kv dd { margin: 0; min-width: 0; }
.meter { display: inline-block; width: 80px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--red) calc(var(--v) * 1%), var(--rule2) 0); vertical-align: middle; }
.months, .rows, .notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.months li { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--rule2); justify-items: start; }
.months li:last-child { border-bottom: 0; }
.rows li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--rule2); }
.rows li small { display: block; color: var(--ink2); }
.notes li { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--rule2); font-size: 14px; }
.notes li span { color: var(--ink2); }
.notes li:last-child, .rows li:last-child { border-bottom: 0; }

/* ---- フォーム ---- */
.form { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; }
.form label, .inline label { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); min-width: 0; }
.form label.grow { flex: 1 1 220px; }
.form label.grow input, .form label.grow select, .form label.grow textarea { width: 100%; }
.inline { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 12px; }
.nums { display: grid; gap: 8px; }
.num-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: 14px; padding: 4px 0; border-bottom: 1px dashed var(--rule2); }
.num-in > span:last-child { display: flex; align-items: center; gap: 6px; color: var(--ink2); }
.num-in input[type="number"] { width: 5.2em; text-align: right; font-family: var(--f-data); }

/* ---- くじ ---- */
.kuji { display: grid; gap: 6px; margin-top: 4px; }
.kuji .track { position: relative; padding-top: 8px; }
.kuji .bar { display: flex; min-height: 44px; border-radius: 6px; overflow: hidden; border: 1px solid var(--rule); }
.kuji .seg { flex-basis: 0; min-width: 0; padding: 3px 6px; background: var(--rule2); border-right: 1px solid var(--card); display: flex; flex-direction: column; justify-content: center; font-size: 11px; line-height: 1.3; }
.kuji .seg:last-child { border-right: 0; }
.kuji .seg b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kuji .seg.win { background: var(--court); color: var(--court-ink); }
.kuji .pin { position: absolute; top: 0; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.kuji .pin::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.kuji .cap { font-size: 13px; }
.kuji.demo .bar { min-height: 52px; }
.kuji1 { font-size: 14px; color: var(--ink2); }
.hot-slot { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--rule2); }

/* ---- コマの詳しい画面 ---- */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(8 16 13 / .5); }
.sheet {
  position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(600px, calc(100vw - 32px)); max-height: calc(100% - 48px); overflow: auto;
  background: var(--card); border-radius: 14px; padding: 18px 20px 22px; display: grid; gap: 12px; box-shadow: 0 18px 50px var(--shadow);
}
.sheet-h { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet-h h2 { font-size: 20px; }
.sheet-h h2:focus { outline: none; }
.sheet-h p { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.x { border: 0; background: var(--rule2); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; flex: none; }
.sec { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule2); }
.sec.act { gap: 10px; }
.units { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.units li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.units .ul { display: inline-flex; align-items: center; gap: 6px; min-width: 5.6em; font-size: 13px; color: var(--ink2); }
.blockmsg { padding: 10px 12px; border-radius: 6px; background: repeating-linear-gradient(135deg, var(--rule2) 0 6px, transparent 6px 12px); }

@media (max-width: 640px) {
  .sheet {
    left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; max-height: 88%;
    border-radius: 16px 16px 0 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  }
}

/* ---- お知らせ（下に出る） ---- */
.toast {
  position: fixed; z-index: 40; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--paper);
  font-size: 14px; box-shadow: 0 8px 24px var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--red); color: #ffffff; }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- js/rules.js ---- */
/* 体育館よやく：ルールの計算（日付・祝日・日程・くじの本数・空き区画・申込や予約ができるか）。画面を持たない。
   ブラウザでは window.GB に入る。Node では require すると同じものが返る（tools/test.cjs で検査する）。 */
(function (G) {
  'use strict';
  const GB = G.GB = G.GB || {};

  /* ---- 日付（'YYYY-MM-DD' の文字列であつかう。時差に左右されないよう UTC で計算する） ---- */
  const pad = n => String(n).padStart(2, '0');
  const utc = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const ymd = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  const D = GB.date = {
    pad,
    add: (s, n) => ymd(utc(s) + n * 864e5),
    diff: (a, b) => Math.round((utc(a) - utc(b)) / 864e5),            // a − b（日）
    wd: s => new Date(utc(s)).getUTCDay(),                             // 0＝日 … 6＝土
    ym: s => s.slice(0, 7),
    addMonths: (ym, n) => { const t = +ym.slice(0, 4) * 12 + +ym.slice(5, 7) - 1 + n; return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`; },
    days: ym => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate(),
    on: (ym, d) => `${ym}-${pad(Math.min(d, D.days(ym)))}`,            // その月の d 日（月末をこえたら月末）
    list: ym => Array.from({ length: D.days(ym) }, (_, i) => `${ym}-${pad(i + 1)}`),
    WD: ['日', '月', '火', '水', '木', '金', '土'],
  };
  GB.md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  GB.mdw = s => `${GB.md(s)}（${D.WD[D.wd(s)]}）`;
  GB.ymLabel = ym => `${+ym.slice(5, 7)}月分`;

  /* ---- 祝日（内閣府の決まりどおりに計算する。春分・秋分は 1980〜2099 年の近似式） ---- */
  const holCache = {};
  function holidays(y) {
    if (holCache[y]) return holCache[y];
    const H = {}, put = (m, d, name) => { H[`${y}-${pad(m)}-${pad(d)}`] = name; };
    const monday = (m, n) => 1 + (8 - new Date(Date.UTC(y, m - 1, 1)).getUTCDay()) % 7 + (n - 1) * 7;   // m 月の第 n 月曜
    const eq = base => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
    put(1, 1, '元日'); put(1, monday(1, 2), '成人の日'); put(2, 11, '建国記念の日'); put(2, 23, '天皇誕生日');
    put(3, eq(20.8431), '春分の日'); put(4, 29, '昭和の日'); put(5, 3, '憲法記念日'); put(5, 4, 'みどりの日'); put(5, 5, 'こどもの日');
    put(7, monday(7, 3), '海の日'); put(8, 11, '山の日'); put(9, monday(9, 3), '敬老の日'); put(9, eq(23.2488), '秋分の日');
    put(10, monday(10, 2), 'スポーツの日'); put(11, 3, '文化の日'); put(11, 23, '勤労感謝の日');
    for (const d of Object.keys(H).sort()) {                          // 国民の休日：祝日にはさまれた日
      const m = D.add(d, 1);
      if (!H[m] && H[D.add(d, 2)] && D.wd(m) !== 0) H[m] = '国民の休日';
    }
    for (const d of Object.keys(H).sort()) if (D.wd(d) === 0) {      // 振替休日：日曜の祝日のあと、最初の祝日でない日
      let m = D.add(d, 1);
      while (H[m]) m = D.add(m, 1);
      H[m] = '振替休日';
    }
    return (holCache[y] = H);
  }
  GB.holiday = s => holidays(+s.slice(0, 4))[s] || '';
  GB.dayType = s => (D.wd(s) === 0 || D.wd(s) === 6 || GB.holiday(s)) ? 'holiday' : 'weekday';

  /* ---- 区分と、ルールの既定値（市役所の「ルール」画面で変えられる） ---- */
  GB.TYPES = { club: '認定地域クラブ', youth: '子どもの団体', general: '一般の団体', commercial: '民間スクール等（営利）' };
  GB.TYPE_SHORT = { club: '認定地域クラブ', youth: '子ども', general: '一般', commercial: '営利' };
  GB.KINDS = { school: '学校体育館', city: '市の体育館' };
  const slot = (id, label, start, end, prio = []) => ({ id, label, start, end, prio });
  // 日程の既定値は、佐賀市の体育施設の予約（前月1〜9日に抽選申込・10日抽選・11〜15日に確定・16日から先着）にそろえた
  GB.defaults = () => ({
    lead: 1,                 // 何か月前に抽選するか（1＝利用月の前月）
    applyStart: 1, applyEnd: 9, drawDay: 10, confirmEnd: 15, firstCity: 16, firstAll: 16,
    bookUntil: 3,            // 先着の予約は、利用日の何日前まで
    maxApps: 10,             // 抽選の申込（1団体・1か月）
    maxWins: 4,              // 抽選で当たる上限（1団体・1か月）
    maxTotal: 8,             // 抽選と先着の合計（1団体・1か月。定期枠は数えない）
    maxRegular: 2,           // 定期枠は 1 団体につき週何コマまで
    maxPerDay: 1,            // 1日に使えるコマ（1団体。定期枠もふくむ）
    tickets: { club: 3, youth: 3, general: 2, commercial: 1 },   // くじの本数（区分ごとの基本）
    bonusDistrict: 2,        // 地区内の体育館
    bonusPriority: 2,        // 優先時間帯に、その対象の区分が申し込んだとき
    bonusLoss: 1, lossMax: 2,            // 前回の抽選で1つも当たらなかった：1回につき +1（2回ぶんまで）
    outsideLottery: false,   // 市外の団体も抽選に申し込めるか（学校体育館は、規則で市内の団体だけ）
    commercialSchool: 'none',            // 営利の団体と学校体育館：'none' 使えない／'first' 抽選のあとの空きだけ（先着）／'lottery' 抽選も
    regularMax: 50,          // 定期枠は、1週間のコマ（区画）の何％まで
    freeCancelDays: 7,       // 利用日の何日前までのキャンセルは違反にしない
    ptLate: 1, ptNoShow: 2, ptLimit: 3, suspendMonths: 1,
    showCounts: true,        // 団体に、コマごとの申込の件数を見せる（混んでいるコマを避けてもらう）
    closed: ['12-29', '12-30', '12-31', '01-01', '01-02', '01-03'],
    slots: {
      school: {
        weekday: [slot('after', '放課後', '17:00', '19:00', ['club', 'youth']), slot('night', '夜', '19:00', '21:00')],
        holiday: [slot('am', '午前', '09:00', '12:00'), slot('pm', '午後', '13:00', '17:00'), slot('night', '夜', '18:00', '21:00')],
      },
      city: {
        weekday: [slot('am', '午前', '09:00', '12:00'), slot('pm', '午後', '13:00', '17:00'), slot('night', '夜', '18:00', '21:00')],
        holiday: [slot('am', '午前', '09:00', '12:00'), slot('pm', '午後', '13:00', '17:00'), slot('night', '夜', '18:00', '21:00')],
      },
    },
  });

  // 日程の決まりとして成り立っているか（成り立たないときは、問題の文の配列）
  GB.checkSettings = s => {
    const out = [], days = [s.applyStart, s.applyEnd, s.drawDay, s.confirmEnd, s.firstCity, s.firstAll];
    if (days.some(d => !Number.isInteger(d) || d < 1 || d > 28)) out.push('日程の日にちは 1〜28 の整数にしてください');
    else if (!(s.applyStart <= s.applyEnd && s.applyEnd < s.drawDay && s.drawDay <= s.confirmEnd && s.confirmEnd < s.firstCity && s.firstCity <= s.firstAll))
      out.push('日程は「申込の開始 ≦ 申込の締切 ＜ 抽選日 ≦ 確定の締切 ＜ 先着（市内） ≦ 先着（だれでも）」の順にしてください');
    if (![1, 2].includes(s.lead)) out.push('抽選は、利用月の 1 か月前か 2 か月前にしてください');
    for (const k of ['maxApps', 'maxWins', 'maxTotal', 'maxPerDay', 'maxRegular', 'ptLimit', 'suspendMonths'])
      if (!Number.isInteger(s[k]) || s[k] < 1) out.push('上限と停止の数は 1 以上の整数にしてください');
    if (s.maxWins > s.maxTotal) out.push('抽選の当選の上限は、合計の上限以下にしてください');
    for (const t of Object.keys(GB.TYPES)) if (!Number.isInteger(s.tickets[t]) || s.tickets[t] < 1) out.push('区分ごとのくじの本数は 1 以上の整数にしてください');
    for (const k of ['bonusDistrict', 'bonusPriority', 'bonusLoss', 'lossMax', 'freeCancelDays', 'ptLate', 'ptNoShow', 'bookUntil'])
      if (!Number.isInteger(s[k]) || s[k] < 0) out.push('加える本数・日数・点数は 0 以上の整数にしてください');
    if (!(s.regularMax >= 0 && s.regularMax <= 100)) out.push('定期枠の割合は 0〜100 ％にしてください');
    return [...new Set(out)];
  };

  /* ---- 施設・コマ・定期枠 ---- */
  GB.find = (list, id) => list.find(x => x.id === id) || null;
  GB.units = fac => fac.areas >= 2 ? ['A', 'B'] : ['A'];
  GB.closed = (st, date) => (st.settings.closed || []).includes(date.slice(5));
  GB.slotsOn = (st, fac, date) => GB.closed(st, date) ? [] : ((st.settings.slots[fac.kind] || st.settings.slots.school)[GB.dayType(date)] || []);
  GB.slot = (st, fac, date, slotId) => GB.slotsOn(st, fac, date).find(s => s.id === slotId) || null;
  GB.time = s => `${s.start.replace(/^0/, '')}–${s.end.replace(/^0/, '')}`;
  // 定期枠がその日にあるか（平日の定期枠は、祝日には休み）
  GB.regularOn = (r, date) => D.wd(date) === r.weekday && date >= r.from && date <= r.to && (GB.dayType(date) === 'holiday') === (r.weekday === 0 || r.weekday === 6);

  /* ---- 空き区画：学校行事・大会 → 定期枠 → 予約 の順にふさぐ ---- */
  const LIVE = GB.LIVE = ['pending', 'confirmed', 'used', 'noshow'];
  GB.occupancy = (st, fac, date, slotId) => {
    const units = GB.units(fac), by = {};
    const block = st.blocks.find(b => b.facilityId === fac.id && b.date === date && (!b.slotId || b.slotId === slotId)) || null;
    const put = (half, item) => { for (const u of half ? [half] : units) if (!by[u]) by[u] = item; };
    for (const r of st.regulars) if (r.facilityId === fac.id && r.slotId === slotId && GB.regularOn(r, date)) put(r.need === 'half' ? (r.half || 'A') : null, { kind: 'regular', orgId: r.orgId, ref: r });
    for (const b of st.bookings) if (b.facilityId === fac.id && b.date === date && b.slotId === slotId && LIVE.includes(b.status)) put(b.half, { kind: 'booking', orgId: b.orgId, ref: b });
    return { block, by, units, free: block ? [] : units.filter(u => !by[u]) };
  };
  GB.fits = (occ, need) => need === 'full' ? occ.free.length === occ.units.length : occ.units.length > 1 && occ.free.length > 0;

  /* ---- くじの本数（区分の基本 ＋ 地区内 ＋ 優先時間帯 ＋ 前回はずれ） ---- */
  GB.tickets = (st, org, fac, slot) => {
    const s = st.settings, parts = [[GB.TYPE_SHORT[org.type], +s.tickets[org.type] || 0]];
    if (org.districtId && org.districtId === fac.districtId) parts.push(['地区内', +s.bonusDistrict || 0]);
    if (slot && (slot.prio || []).includes(org.type)) parts.push(['優先時間帯', +s.bonusPriority || 0]);
    const n = Math.min(org.lossStreak || 0, +s.lossMax || 0);
    if (n) parts.push([`前回はずれ${n > 1 ? `（${n}回）` : ''}`, n * (+s.bonusLoss || 0)]);
    const list = parts.filter(p => p[1] > 0);
    return { total: Math.max(1, list.reduce((a, p) => a + p[1], 0)), parts: list };
  };

  /* ---- 月の日程と、いまの段階 ---- */
  GB.lotteryMonth = st => D.addMonths(D.ym(st.clock), st.settings.lead);
  GB.schedule = (st, ym) => {
    const s = st.settings, base = D.addMonths(ym, -s.lead), run = st.runs.find(r => r.month === ym) || null;
    const sc = { month: ym, base, run, applyStart: D.on(base, s.applyStart), applyEnd: D.on(base, s.applyEnd), draw: D.on(base, s.drawDay),
      confirmEnd: D.on(base, s.confirmEnd), firstCity: D.on(base, s.firstCity), firstAll: D.on(base, s.firstAll) };
    if (run && run.confirmBy > sc.confirmEnd) {                        // 抽選が遅れたときは、確定と先着を後ろにずらす
      sc.confirmEnd = run.confirmBy;
      if (sc.firstCity <= sc.confirmEnd) sc.firstCity = D.add(sc.confirmEnd, 1);
      if (sc.firstAll < sc.firstCity) sc.firstAll = sc.firstCity;
    }
    return sc;
  };
  GB.PHASE = { before: '受付前', apply: '抽選の申込期間', closed: '締切後（抽選待ち）', drawing: '抽選待ち', confirm: '当選の確定期間', settle: '先着の受付前', firstCity: '先着（市内の団体）', firstAll: '先着（だれでも）' };
  GB.phase = (st, ym, today = st.clock) => {
    const sc = GB.schedule(st, ym);
    if (today < sc.applyStart) return 'before';
    if (!sc.run) return today <= sc.applyEnd ? 'apply' : today < sc.draw ? 'closed' : 'drawing';
    if (today <= sc.confirmEnd) return 'confirm';
    if (today < sc.firstCity) return 'settle';
    return today < sc.firstAll ? 'firstCity' : 'firstAll';
  };

  /* ---- 数える ---- */
  GB.regularsOn = (st, date) => st.regulars.filter(r => GB.regularOn(r, date) && (() => { const f = GB.find(st.facilities, r.facilityId); return f && GB.slot(st, f, date, r.slotId); })());
  GB.orgDayCount = (st, orgId, date) =>
    GB.regularsOn(st, date).filter(r => r.orgId === orgId).length + st.bookings.filter(b => b.orgId === orgId && b.date === date && LIVE.includes(b.status)).length;
  GB.monthCount = (st, orgId, ym) => st.bookings.filter(b => b.orgId === orgId && D.ym(b.date) === ym && LIVE.includes(b.status)).length;
  GB.appCount = (st, orgId, ym) => st.apps.filter(a => a.orgId === orgId && a.month === ym && a.status === 'applied').length;
  GB.suspended = (st, org) => !!(org.suspendUntil && st.clock < org.suspendUntil);
  // 定期枠が、1週間のコマ（区画の数でかぞえる）の何％を使っているか（祝日は考えない）
  GB.regularShare = (st, fac, extra = 0) => {
    const sl = st.settings.slots[fac.kind] || st.settings.slots.school, n = GB.units(fac).length;
    const total = (sl.weekday.length * 5 + sl.holiday.length * 2) * n;
    const used = st.regulars.filter(r => r.facilityId === fac.id && r.to >= st.clock).reduce((a, r) => a + (r.need === 'half' ? 1 : n), 0) + extra;
    return total ? Math.round(used / total * 100) : 0;
  };

  /* ---- 申込・予約ができない理由（できるときは ''）。
          mode：'apply' 抽選の申込／'draw' 抽選のときの確かめ直し／'book' 先着の予約 ---- */
  GB.blocker = (st, orgId, facId, date, slotId, need, mode) => {
    const s = st.settings, org = GB.find(st.orgs, orgId), fac = GB.find(st.facilities, facId);
    if (!org || !fac) return '団体または施設が見つかりません';
    if (org.status !== 'approved') return '団体の登録がまだ承認されていません（市役所の承認が必要です）';
    if (GB.suspended(st, org)) return `違反点数が上限に達したため、${GB.md(org.suspendUntil)} まで申込と予約を止めています`;
    const sl = GB.slot(st, fac, date, slotId);
    if (!sl) return 'この日は休館日か、このコマがありません';
    if (need === 'half' && fac.areas < 2) return 'この体育館は半面に分けられません';
    const ym = D.ym(date), sc = GB.schedule(st, ym), ph = GB.phase(st, ym), school = fac.kind === 'school';
    if (school && !org.inCity) return '学校体育館を使えるのは、市内に住む・通う・働く人の団体です（学校開放の規則）';
    if (mode === 'book') {
      if (D.diff(date, st.clock) < Math.max(1, s.bookUntil)) return `先着の予約は、利用日の ${Math.max(1, s.bookUntil)} 日前までです`;
      if (ph !== 'firstCity' && ph !== 'firstAll') return `この月の先着の予約は、抽選のあと ${GB.md(sc.firstCity)} からです`;
      if (!org.inCity && ph === 'firstCity') return `市外の団体は ${GB.md(sc.firstAll)} から予約できます`;
      if (school && org.type === 'commercial' && s.commercialSchool === 'none') return '営利目的の団体は、学校体育館を使えません';
    } else {
      if (mode === 'apply' && ph !== 'apply') return ph === 'before' ? `この月の抽選の申込は ${GB.md(sc.applyStart)}〜${GB.md(sc.applyEnd)} です` : 'この月の抽選の申込は締め切りました';
      if (!org.inCity && !s.outsideLottery) return `市外の団体は抽選に申し込めません（${GB.md(sc.firstAll)} からの先着予約は使えます）`;
      if (school && org.type === 'commercial' && s.commercialSchool !== 'lottery')
        return s.commercialSchool === 'none' ? '営利目的の団体は、学校体育館を使えません' : '営利目的の団体は、学校体育館の抽選には申し込めません（抽選のあとの先着予約は使えます）';
    }
    if (mode === 'apply') {
      if (st.apps.some(a => a.orgId === orgId && a.facilityId === facId && a.date === date && a.slotId === slotId && a.status === 'applied')) return 'このコマには申し込み済みです';
      if (GB.appCount(st, orgId, ym) >= s.maxApps) return `抽選の申込は 1 か月 ${s.maxApps} 件までです`;
    }
    if (GB.orgDayCount(st, orgId, date) >= s.maxPerDay) return `この日はすでに使う予定があります（1日 ${s.maxPerDay} コマまで）`;
    if (mode === 'book' && GB.monthCount(st, orgId, ym) >= s.maxTotal) return `1 か月に使えるのは ${s.maxTotal} コマまでです（定期枠は別）`;
    const occ = GB.occupancy(st, fac, date, slotId);
    if (occ.block) return `${occ.block.reason}のため使えません`;

/* 体育館よやく：抽選。画面を持たない。
   ・乱数は「シード」（文字列）から作る。同じ申込と同じシードなら、だれが何度やっても同じ結果になる（あとから再現して確かめられる）。
   ・コマごとに、くじを引く。当たる確率は、くじの本数に比例する（7本と2本なら 7/9 と 2/9）。
   ・コマを引く順番も乱数で決める。1か月の当選の上限・1日のコマ数の上限に達した団体は、そのあとのコマのくじから外れる。

(function (G) {
  'use strict';
  const GB = G.GB = G.GB || {};
  const idn = id => +String(id).replace(/\D/g, '');

  // シードの文字列から、0 以上 1 未満の乱数を順に返す関数を作る（cyrb53 でまぜて、mulberry32 で出す）
  GB.rng = seed => {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < seed.length; i++) {
      const c = seed.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    let a = h1 >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    const s = st.settings, items = [], invalid = [], capacity = {}, dayUsed = {}, count = {};

        here.add(win.orgId);
        log.push({ order: order + 1, key: k, n, total, cands: cands.map(c => [c.appId, c.tickets]), win: win.appId, half: win.half });
      }
    });
    const results = {};
    const CAP = `当選の上限（1か月 ${input.maxWins} コマ）に達したため`, DAY = `同じ日に、ほかのコマが当たったため（1日 ${input.maxPerDay} コマまで）`;
    for (const it of items) {
      if (it.state === 'won') { results[it.appId] = { status: 'won', half: it.half, tickets: it.tickets }; continue; }
      const reason = it.seen ? 'くじではずれ' : it.skip === 'day' ? DAY : it.skip === 'cap' ? CAP : 'くじではずれ';
      results[it.appId] = { status: 'lost', reason, tickets: it.tickets };
    }
    for (const x of input.invalid) results[x.appId] = { status: 'invalid', reason: x.reason };
    return { results, log, wins };
  };

  // 1つのコマだけを何度も引いてみて、当たる見込み（％）を出す（上限などは考えない目安）
  GB.odds = (cands, units, freeUnits, appId, times = 2000) => {
    const rnd = GB.rng(`odds|${appId}|${cands.length}`);
    let hit = 0;
    for (let t = 0; t < times; t++) {
      let left = freeUnits, pool = cands.slice();

        pool = pool.filter(c => c.need === 'full' ? left === units : left > 0);
        if (!pool.length) break;
        const total = pool.reduce((a, c) => a + c.tickets, 0);
        let n = rnd() * total, w = pool[pool.length - 1];
        for (const c of pool) { n -= c.tickets; if (n < 0) { w = c; break; } }
        if (w.id === appId) { hit++; break; }
        left -= w.need === 'full' ? units : 1;
        pool = pool.filter(c => c !== w);
      }
    }
    return Math.round(hit / times * 100);
  };

  // 残っている記録（input と seed）から抽選をやり直して、同じ結果になるかを確かめる
  GB.verifyRun = run => {
    const again = GB.draw(run.input, run.seed).results;
    const ids = Object.keys(run.results);
    return ids.length === Object.keys(again).length && ids.every(id => JSON.stringify(again[id]) === JSON.stringify(run.results[id]));
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = GB;
})(typeof window !== 'undefined' ? window : globalThis);

/* 体育館よやく：状態を変える操作（申込・取り下げ・抽選・確定・キャンセル・先着の予約・学校の使用・利用の確認・違反点数・日付）。画面を持たない。
   どの操作も { ok, msg } を返す。msg は画面にそのまま出す文。 */
(function (G) {
  'use strict';
  const GB = G.GB = G.GB || {};

  };
  A.where = where;

  /* ---- 団体：抽選の申込・取り下げ ---- */
  A.apply = (st, orgId, facId, date, slotId, need) => {
    const why = GB.blocker(st, orgId, facId, date, slotId, need, 'apply');
    if (why) return fail(why);
    st.apps.push({ id: nid(st, 'a'), orgId, facilityId: facId, date, slotId, need, month: D.ym(date), status: 'applied', reason: '', at: st.clock });
    return { ok: true, msg: `抽選に申し込みました（${GB.ymLabel(D.ym(date))} ${GB.appCount(st, orgId, D.ym(date))}/${st.settings.maxApps} 件）` };
  };
  A.withdraw = (st, appId) => {
    const a = GB.find(st.apps, appId);
    if (!a || a.status !== 'applied') return fail('この申込は取り下げられません');
    if (GB.phase(st, a.month) !== 'apply') return fail('申込期間が終わったので、取り下げられません');
    a.status = 'withdrawn';

    if (!seed) return fail('シード（抽選に使う数字や言葉）を入れてください');
    if (st.clock < sc0.draw) A.setClock(st, sc0.draw);                // デモ：申込を締め切って、抽選日まで進める

/* 体育館よやく：保存。ブラウザの localStorage に入れる（使えないときは、開いているあいだだけ覚える）。

(function (G) {

  const put = (k, v) => { try { G.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  GB.store = {
    load() { const s = get(KEY); return s && s.v === 1 && s.settings && Array.isArray(s.orgs) ? s : null; },
    save: st => put(KEY, st),
    loadUi: () => get(UI),
    saveUi: ui => put(UI, ui),
    clear() { try { G.localStorage.removeItem(KEY); G.localStorage.removeItem(UI); } catch (e) { /* 使えないときは何もしない */ } },
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = GB;
})(typeof window !== 'undefined' ? window : globalThis);

      if (sc.firstAll !== sc.firstCity) marks.push([sc.firstAll, `${lab}の先着（だれでも）`]);
    }
    const L = GB.lotteryMonth(st);
    marks.push([D.on(L, 10), `${+L.slice(5)}月10日（利用月）`]);
    const seen = new Set();
    const list = marks.filter(([d]) => d > st.clock && !seen.has(d) && seen.add(d)).sort((a, b) => a[0] < b[0] ? -1 : 1).slice(0, 6);
    return `<div class="clock-panel"><div class="clock-in">
      <p>デモ用に「きょう」を進めると、申込 → 抽選 → 確定 → 先着 → 利用 の流れを試せます。確定の締切を過ぎるとき、いま団体の画面でえらんでいる団体のほかは、当選を確定したことにします（1割ほどは確定しないまま取り消しになります）。</p>
      <div class="row-btn">${list.map(([d, l]) => btn(`${GB.mdw(d)}<small>${esc(l)}</small>`, 'setclock', { d }, 'sm ghost stack')).join('')}</div>
      <form class="inline" data-form="clock"><label>日付をえらぶ <input type="date" name="d" id="clock-date" min="${D.add(st.clock, 1)}" value="${D.add(st.clock, 1)}"></label><button class="btn sm">この日にする</button></form>
      <div class="reset">${ui.confirmReset ? `<span>入力した内容は消えます。</span>${btn('サンプルに戻す', 'reset', {}, 'sm warn')}${btn('やめる', 'reset-no', {}, 'sm ghost')}` : btn('最初からやり直す', 'reset-ask', {}, 'sm ghost')}</div>
    </div></div>`;
  }

  /* ---- しくみ（ルールの説明。いまの設定から作る） ---- */
  function guideView() {
    const s = st.settings, L = GB.lotteryMonth(st), sc = GB.schedule(st, L), base = s.lead === 1 ? '前月' : '2か月前の月';

      prio.push(`${GB.KINDS[k]}の${dt === 'weekday' ? '平日' : '土日祝'}の${x.label}（${GB.time(x)}）は、${x.prio.map(t => GB.TYPE_SHORT[t]).join('・')}`);
    const policy = { none: '使えません', first: '抽選のあとに残ったコマだけ、先着で使えます', lottery: '抽選にも申し込めます' }[s.commercialSchool];
    const afterSlot = (s.slots.school.weekday || []).find(x => x.id === 'after') || { prio: [] };
    const exParts = [s.tickets.youth, s.bonusDistrict, ...((afterSlot.prio || []).includes('youth') ? [s.bonusPriority] : [])].filter(n => n > 0);
    const ex = exParts.reduce((a, n) => a + n, 0), other = s.tickets.general;
    const sameAsSaga = s.lead === 1 && s.applyStart === 1 && s.applyEnd === 9 && s.drawDay === 10 && s.confirmEnd === 15 && s.firstCity === 16;
    return `

      <div class="row-btn">${btn('団体の画面で申し込んでみる', 'go', { v: 'org', tab: 'cal' })}${btn('市役所の画面で抽選してみる', 'go', { v: 'admin', tab: 'lottery' }, 'ghost')}</div>

      <div class="layers">
        <article class="layer"><p class="step">1　年に1回</p><h3>定期枠</h3><p>認定地域クラブの平日の練習など、毎週決まった活動の土台です。学校ごとの調整会議で決め、毎年見直します。1団体 週 ${s.maxRegular} コマまで、体育館のコマの ${s.regularMax}％ までにします。</p></article>
        <article class="layer"><p class="step">2　毎月</p><h3>抽選</h3><p>利用月の${base} ${s.applyStart}〜${s.applyEnd} 日に申し込み、${s.drawDay} 日に抽選します。申し込んだ順番は関係ないので、受付開始の瞬間に急ぐ必要はありません。</p></article>
        <article class="layer"><p class="step">3　抽選のあと</p><h3>先着</h3><p>${s.confirmEnd} 日までに確定されなかったコマと、残ったコマを、${s.firstCity} 日から先着で予約できます。利用日の ${s.bookUntil} 日前までです。</p></article>
      </div>
      <p class="callout">学校行事と大会は、いつでも最優先です。あとから入ったときは、予約していた団体に自動でお知らせが届き、違反にはなりません。</p>

    <section class="block">
      <h2>${GB.ymLabel(L)}の日程</h2>

    </section>

    <section class="block two">
      <div>
        <h2>くじの本数</h2>
        <p>当たる確率は、くじの本数に比例します。区分ごとの基本の本数に、条件に合うと本数が加わります。</p>
        <div class="tw"><table class="plain">
          <thead><tr><th>区分</th><th class="num">基本</th></tr></thead>
          <tbody>${Object.keys(GB.TYPES).map(t => `<tr><td>${GB.TYPES[t]}</td><td class="num">${s.tickets[t]} 本</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="tw"><table class="plain">
          <thead><tr><th>加わる条件</th><th class="num">本数</th></tr></thead>
          <tbody>
            <tr><td>活動している地区の体育館に申し込む</td><td class="num">＋${s.bonusDistrict} 本</td></tr>
            <tr><td>優先時間帯に、その対象の団体が申し込む</td><td class="num">＋${s.bonusPriority} 本</td></tr>
            <tr><td>前の月の抽選で1つも当たらなかった（${s.lossMax} 回ぶんまで）</td><td class="num">＋${s.bonusLoss} 本ずつ</td></tr>
          </tbody>
        </table></div>
        ${prio.length ? `<p class="small">優先時間帯：${prio.map(esc).join('。')}。</p>` : ''}
      </div>
      <div class="example">
        <h3>たとえば</h3>
        <p>中部の子どもの団体が、中部の中学校の平日の放課後に申し込むと、くじは ${exParts.join('＋')}＝<b>${ex} 本</b>。ほかの地区の一般の団体（${other} 本）と取り合うと、当たる確率は ${ex}/${ex + other} と ${other}/${ex + other} です。</p>
        <div class="kuji demo" aria-hidden="true"><div class="track"><div class="bar"><div class="seg win" style="flex-grow:${ex}"><b>中部の子どもの団体</b><span class="mono">1–${ex}</span></div><div class="seg" style="flex-grow:${other}"><b>ほかの地区</b><span class="mono">${ex + 1}–${ex + other}</span></div></div></div></div>
        <p class="small muted">落選が続いた団体のくじを増やす方法は、スポーツ施設では例が少なく、市営住宅の「優遇抽選」（落選が続くとくじが増える）を参考にしました。</p>
      </div>
    </section>

    <section class="block two">
      <div>
        <h2>上限</h2>
        <ul class="facts">
          <li><b class="mono">${s.maxApps}</b> 件<span>抽選に申し込めるのは 1 か月 ${s.maxApps} 件まで</span></li>
          <li><b class="mono">${s.maxWins}</b> コマ<span>抽選で当たるのは 1 か月 ${s.maxWins} コマまで。上限に達した団体は、残りのコマのくじから外れます</span></li>
          <li><b class="mono">${s.maxTotal}</b> コマ<span>抽選と先着を合わせて 1 か月 ${s.maxTotal} コマまで（定期枠は別）</span></li>
          <li><b class="mono">${s.maxPerDay}</b> コマ<span>1 日に使えるのは ${s.maxPerDay} コマまで（定期枠もふくむ）</span></li>
        </ul>
      </div>
      <div>
        <h2>約束ごと</h2>
        <ul class="dots">
          <li>当選したら、${s.confirmEnd} 日までに「確定」します。確定しないと取り消され、先着に回ります。</li>
          <li>キャンセルは、利用日の ${s.freeCancelDays} 日前までなら違反になりません。それより後は違反 ${s.ptLate} 点です。</li>
          <li>予約したのに連絡なしで使わなかったときは、違反 ${s.ptNoShow} 点です（学校が利用を確認します）。</li>
          <li>違反が ${s.ptLimit} 点になると、${s.suspendMonths} か月のあいだ、抽選の申込と先着の予約ができません。</li>
        </ul>
      </div>
    </section>

    <section class="block two">
      <div>
        <h2>使える団体</h2>
        <ul class="dots">
          <li>学校体育館を使えるのは、市内に住む・通う・働く人でつくる団体です（学校開放の規則）。</li>
          <li>市外の団体は、抽選に${s.outsideLottery ? '申し込めます' : '申し込めません'}。市の体育館の先着は ${s.firstAll} 日から予約できます。</li>
          <li>営利目的の団体（民間スクールなど）は、学校体育館を${policy}。市の体育館は抽選・先着とも使えます（くじは ${s.tickets.commercial} 本）。</li>
          <li>団体の登録は、市役所が承認してから使えます。</li>
        </ul>
      </div>
      <div>
        <h2>公平さを確かめる</h2>
        <ul class="dots">
          <li>抽選は「シード」という言葉や数字から作る乱数で行います。同じ申込と同じシードなら、だれが何度やっても同じ結果になります。</li>
          <li>市役所は、抽選のあとにシードを公開します。本番では、公開の場でサイコロを振るなどして決めます。</li>
          <li>区分ごと・地区ごとの申込数と当選率を、毎月公開します。</li>
          <li>コマごとの申込の件数が見えるので、混んでいるコマを避けて申し込めます。</li>
        </ul>
      </div>
    </section>

    <section class="block note">
      <h2>この試作について</h2>
      <ul class="dots">
        <li>データはすべてサンプルです。実在の施設・団体ではありません。佐賀市の公式のものでもありません。</li>
        <li>このページはブラウザの中だけで動きます。入力した内容は、ほかの人には見えません。</li>
        <li>上の「日付を進める」で、申込 → 抽選 → 確定 → 先着の流れを試せます。いまの「きょう」では、${GB.ymLabel(L)}が「${GB.PHASE[GB.phase(st, L)]}」です（申込は ${GB.md(sc.applyStart)}〜${GB.md(sc.applyEnd)}）。</li>
      </ul>
    </section>`;
  }

  function timeline(m) {
    const sc = GB.schedule(st, m), t = st.clock, run = !!sc.run;
    const state = (a, b) => t > b ? 'done' : t >= a ? 'now' : 'next';
    const baseEnd = D.on(sc.base, 31);
    const steps = [
      ['抽選の申込', `${GB.md(sc.applyStart)}〜${GB.md(sc.applyEnd)}`, run ? 'done' : state(sc.applyStart, sc.applyEnd)],
      ['抽選', GB.md(sc.draw), run ? 'done' : t > sc.applyEnd ? 'now' : 'next'],
      ['当選の確定', `${GB.md(sc.draw)}〜${GB.md(sc.confirmEnd)}`, run ? state(sc.draw, sc.confirmEnd) : 'next'],
      [sc.firstAll === sc.firstCity ? '先着' : '先着（市内）', `${GB.md(sc.firstCity)}〜`, run ? state(sc.firstCity, sc.firstAll === sc.firstCity ? baseEnd : D.add(sc.firstAll, -1)) : 'next'],
    ];
    if (sc.firstAll !== sc.firstCity) steps.push(['先着（だれでも）', `${GB.md(sc.firstAll)}〜`, run ? state(sc.firstAll, baseEnd) : 'next']);
    steps.push(['利用', `${+m.slice(5)}月`, state(`${m}-01`, D.on(m, 31))]);
    return `<ol class="tl">${steps.map(([l, d, k]) => `<li class="${k}"><b>${l}</b><span class="mono">${d}</span>${k === 'now' ? '<em>いまここ</em>' : ''}</li>`).join('')}</ol>`;
  }

  /* ---- 時間割（体育館 × 月） ---- */
  function calendar(f, m, role) {
    const sl = st.settings.slots[f.kind] || st.settings.slots.school;
    const ids = Object.keys(COLS).filter(id => sl.weekday.some(x => x.id === id) || sl.holiday.some(x => x.id === id));
    const idx = {};
    for (const a of st.apps) if (a.facilityId === f.id && a.month === m && a.status !== 'withdrawn') (idx[`${a.date}|${a.slotId}`] = idx[`${a.date}|${a.slotId}`] || []).push(a);
    const rows = D.list(m).map(date => {
      const wd = D.wd(date), hol = GB.holiday(date), slots = GB.slotsOn(st, f, date);
      const tone = wd === 0 || hol ? 'sun' : wd === 6 ? 'sat' : '';
      const dc = `<div class="dc ${tone}"><b class="mono">${+date.slice(8)}</b><span>${D.WD[wd]}${hol ? `・${esc(hol)}` : ''}</span>${date === st.clock ? '<i>きょう</i>' : ''}</div>`;
      if (!slots.length) return `<div class="row closed">${dc}<div class="closed-msg">休館日</div></div>`;
      return `<div class="row${date < st.clock ? ' past' : ''}">${dc}${ids.map(id => { const s = slots.find(x => x.id === id); return s ? cell(f, date, s, role, idx[`${date}|${id}`] || []) : '<div class="cell none" aria-hidden="true"></div>'; }).join('')}</div>`;
    });
    return `<div class="cal" style="--cols:${ids.length}"><div class="row head" aria-hidden="true"><div></div>${ids.map(id => `<div class="ch">${COLS[id]}</div>`).join('')}</div>${rows.join('')}</div>`;
  }
  function cell(f, date, s, role, apps) {
    const occ = GB.occupancy(st, f, date, s.id), ph = GB.phase(st, D.ym(date)), me = role === 'org' ? ui.orgId : null;
    const pre = ['before', 'apply', 'closed', 'drawing'].includes(ph);
    const lines = [], badges = [];
    let tone = 'free';
    if (occ.block) { tone = 'block'; lines.push(`<span class="u">${esc(occ.block.reason)}</span>`); }
    else {
      const seen = new Set();
      for (const u of occ.units) {
        const it = occ.by[u];
        if (it && seen.has(it)) continue;
        if (it) seen.add(it);
        const both = it && occ.units.length > 1 && occ.by.A === occ.by.B;
        const lab = occ.units.length > 1 ? `<i>${both ? '全' : u}</i>` : '';
        if (!it) { lines.push(`<span class="u open">${lab}空き</span>`); continue; }
        const mine = me && it.orgId === me, pend = it.kind === 'booking' && it.ref.status === 'pending';
        const name = role === 'org' && !mine ? (it.kind === 'regular' ? '定期枠' : '予約あり') : `${it.kind === 'regular' ? '定期 ' : ''}${O(it.orgId) ? O(it.orgId).name : ''}`;
        lines.push(`<span class="u ${it.kind === 'regular' ? 'reg' : pend ? 'pend' : 'bk'}${mine ? ' mine' : ''}">${lab}${esc(mine ? (it.kind === 'regular' ? 'あなた（定期）' : pend ? 'あなた（確定待ち）' : 'あなた') : name)}</span>`);
        if (mine) tone = pend ? 'pend' : 'mine';
      }
      if (tone === 'free' && !occ.free.length) tone = 'full';
    }
    if (pre && !occ.block) {
      const live = apps.filter(a => a.status === 'applied');
      const mineApp = me && live.find(a => a.orgId === me);
      if (live.length && (role !== 'org' || st.settings.showCounts)) badges.push(`<span class="cnt${live.length > 1 ? ' hot' : ''}">申込 ${live.length}</span>`);
      if (mineApp) { badges.push('<span class="me">申込済み</span>'); if (tone === 'free') tone = 'applied'; }
    } else if (role === 'org' && !occ.block) {
      const mineApp = apps.find(a => a.orgId === me && ['won', 'lost', 'invalid'].includes(a.status));
      if (mineApp && mineApp.status !== 'won') badges.push(`<span class="me lost">${APP[mineApp.status][0]}</span>`);
      if ((ph === 'firstCity' || ph === 'firstAll') && occ.free.length && (tone === 'free' || tone === 'full') && ['full', 'half'].some(n => !GB.blocker(st, me, f.id, date, s.id, n, 'book'))) { tone = 'can'; badges.push('<span class="me ok">予約できる</span>'); }
    }
    const label = `${GB.mdw(date)} ${s.label} ${GB.time(s)}`;
    return `<button type="button" class="cell t-${tone}" data-act="open" data-f="${f.id}" data-d="${date}" data-s="${s.id}" aria-label="${esc(label)}"><span class="tm"><b>${esc(s.label)}</b><span class="mono">${GB.time(s)}</span></span><span class="ls">${lines.join('')}</span>${badges.length ? `<span class="bd">${badges.join('')}</span>` : ''}</button>`;
  }
  function legend(role) {
    const items = role === 'org'
      ? [['free', '空きがある'], ['applied', '抽選に申込済み'], ['can', '先着で予約できる'], ['mine', 'あなたの予約・定期枠'], ['pend', '当選（確定待ち）'], ['full', 'ほかの団体で埋まっている'], ['block', '学校行事・大会']]
      : [['free', '空きがある'], ['full', '埋まっている'], ['block', '学校行事・大会']];
    const text = role === 'org' ? '' : '<li><span class="u reg">紺の字</span>＝定期枠</li><li><span class="u pend">黄の字</span>＝当選の確定待ち</li>';
    return `<ul class="legend">${items.map(([t, l]) => `<li><i class="sw t-${t}"></i>${l}</li>`).join('')}${text}</ul>`;
  }
  function monthSwitch(cur, ch) {
    return `<div class="seg" role="group" aria-label="月">${monthsFor().map(m => `<button type="button" class="${m === cur ? 'on' : ''}" data-act="${ch}" data-m="${m}"${m === cur ? ' aria-pressed="true"' : ' aria-pressed="false"'}>${+m.slice(5)}月</button>`).join('')}</div>`;
  }
  function facSelect(ch, value, filter = () => true) {
    const list = st.facilities.filter(filter);
    return sel(ch, list.map(f => [f.id, `${dn(f.districtId)}｜${f.name}`]), value, `id="${ch}"`);
  }

  /* ---- まだ抽選していない月のお知らせ ---- */
  function pendingBanner() {
    return monthsFor().filter(m => GB.phase(st, m) === 'drawing').map(m =>
      `<div class="banner"><p><b>${GB.ymLabel(m)}の抽選がまだです。</b>本番では抽選日（${GB.md(GB.schedule(st, m).draw)}）に自動で行います。</p>${btn('いま抽選する', 'quickdraw', { m })}</div>`).join('');
  }

  /* ---- 団体の画面 ---- */
  function orgView() {
    const o = O(ui.orgId) || st.orgs[0];
    ui.orgId = o.id;
    const tabs = [['home', 'ホーム'], ['cal', '空きと申込'], ['list', '申込と予約']];
    const opts = st.orgs.map(x => [x.id, `${x.name}（${GB.TYPE_SHORT[x.type]}・${dn(x.districtId)}${x.status !== 'approved' ? '・承認待ち' : ''}）`]);
    return `<div class="subbar"><label class="pick">団体 ${sel('org', opts, o.id, 'id="org-pick"')}</label>
      <nav class="tabs" aria-label="団体の画面">${tabs.map(([k, l]) => `<button type="button" class="tab${ui.orgTab === k ? ' on' : ''}" data-act="orgtab" data-tab="${k}">${l}</button>`).join('')}</nav></div>
      ${pendingBanner()}
      ${ui.orgTab === 'cal' ? orgCal(o) : ui.orgTab === 'list' ? orgList(o) : orgHome(o)}`;
  }
  function orgHome(o) {
    const s = st.settings;
    const regs = st.regulars.filter(r => r.orgId === o.id && r.to >= st.clock);
    const pend = st.bookings.filter(b => b.orgId === o.id && b.status === 'pending').sort((a, b) => a.date < b.date ? -1 : 1);
    const notes = st.notices.filter(n => n.orgId === o.id).slice(0, 10);
    const cards = monthsFor().map(m => {
      const ph = GB.phase(st, m), sc = GB.schedule(st, m);
      const lines = {
        before: `抽選の申込は ${GB.md(sc.applyStart)}〜${GB.md(sc.applyEnd)} です。`,
        apply: `抽選の申込期間です（${GB.md(sc.applyStart)}〜${GB.md(sc.applyEnd)}）。申込 <b class="mono">${GB.appCount(st, o.id, m)}/${s.maxApps}</b> 件。`,
        closed: `申込を締め切りました。${GB.md(sc.draw)} に抽選します。`,
        drawing: '抽選を待っています。',

        settle: `先着の予約は ${GB.md(sc.firstCity)} からです。`,

  /* ---- 市役所の画面 ---- */
  function adminView() {
    const tabs = [['overview', '概要'], ['cal', '予定'], ['lottery', '抽選'], ['orgs', '団体'], ['facilities', '施設'], ['regular', '定期枠・大会'], ['rules', 'ルール'], ['data', 'データ']];

  function adminCal() {

      ${legend('admin')}${calendar(f, m, 'admin')}`;

  function adminOverview() {
    const L = GB.lotteryMonth(st), ym = D.ym(st.clock);
    const apps = st.apps.filter(a => a.month === L && a.status !== 'withdrawn');
    const keys = {};
    for (const a of apps) keys[`${a.facilityId}|${a.date}|${a.slotId}`] = (keys[`${a.facilityId}|${a.date}|${a.slotId}`] || 0) + 1;
    const contested = Object.values(keys).filter(n => n > 1).length;
    const now = st.bookings.filter(b => D.ym(b.date) === ym);
    const cnt = k => now.filter(b => k.includes(b.status)).length;
    return `<section class="card"><h2>${GB.ymLabel(L)}の流れ</h2>${timeline(L)}</section>
      <div class="tiles">
        <div class="tile"><span>${GB.ymLabel(L)}の申込</span><b class="mono">${apps.length}</b><small>件</small></div>
        <div class="tile"><span>申し込んだ団体</span><b class="mono">${new Set(apps.map(a => a.orgId)).size}</b><small>団体</small></div>
        <div class="tile"><span>取り合いのコマ</span><b class="mono">${contested}</b><small>コマ（申込 2 件以上）</small></div>
        <div class="tile"><span>承認待ちの団体</span><b class="mono">${st.orgs.filter(o => o.status !== 'approved').length}</b><small>団体</small></div>
      </div>
      <section class="card"><h2>混み具合（${GB.ymLabel(L)}）</h2><p class="small muted">大きな数字は、申込の区画数 ÷ 抽選にかけられる区画数（月の平均。学校行事・大会・定期枠はのぞく）。「取り合い」は、空きより申込が多く、だれかが落選するコマの数です。</p>${heat(L)}</section>
      <section class="card"><h2>${+ym.slice(5)}月の利用</h2><ul class="facts row">
        <li><b class="mono">${cnt(['confirmed', 'pending'])}</b> コマ<span>これからの予約</span></li>
        <li><b class="mono">${cnt(['used'])}</b> コマ<span>使った</span></li>
        <li><b class="mono">${now.filter(b => b.status === 'confirmed' && b.date <= st.clock).length}</b> コマ<span>学校の確認待ち</span></li>
        <li><b class="mono">${cnt(['noshow'])}</b> コマ<span>使わなかった</span></li>
      </ul></section>`;
  }
  function heat(m) {
    const kinds = [...new Set(st.facilities.map(f => f.kind))];
    const cols = [];
    for (const dt of ['weekday', 'holiday']) for (const id of Object.keys(COLS))
      if (kinds.some(k => ((st.settings.slots[k] || {})[dt] || []).some(x => x.id === id))) cols.push([dt, id]);
    const want = {}, bare = { ...st, bookings: [] };
    for (const a of st.apps) if (a.month === m && a.status !== 'withdrawn') {
      const k = `${a.facilityId}|${a.date}|${a.slotId}`;
      want[k] = (want[k] || 0) + (a.need === 'full' ? GB.units(F(a.facilityId)).length : 1);
    }
    const rows = st.facilities.map(f => {
      const tds = cols.map(([dt, id]) => {
        let supply = 0, need = 0, fights = 0, exists = false;
        for (const d of D.list(m)) {
          if (GB.dayType(d) !== dt || !GB.slot(st, f, d, id)) continue;
          exists = true;
          const free = GB.occupancy(bare, f, d, id).free.length, w = want[`${f.id}|${d}|${id}`] || 0;
          supply += free; need += w;
          if (w > free) fights++;
        }
        if (!exists) return '<td class="na">—</td>';
        const r = supply ? need / supply : (need ? 9 : 0), v = Math.round(Math.min(1, r / 1.5) * 80);
        return `<td style="--v:${v}"${v > 46 ? ' class="hot"' : ''}><b class="mono">${r.toFixed(1)}</b><small>${fights ? `取り合い ${fights}` : `${need}/${supply}`}</small></td>`;
      }).join('');
      return `<tr><th scope="row">${esc(f.name)}</th>${tds}</tr>`;
    }).join('');
    return `<div class="tw"><table class="heat"><thead><tr><th></th>${cols.map(([dt, id]) => `<th>${dt === 'weekday' ? '平日' : '土日祝'}<br>${COLS[id]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function adminLottery() {
    const L = GB.lotteryMonth(st);
    const months = [...new Set([...st.runs.map(r => r.month), ...monthsFor().filter(m => GB.phase(st, m) !== 'before')])].sort();
    const m = ui.runMonth = months.includes(ui.runMonth) ? ui.runMonth : (months.includes(L) ? L : months[months.length - 1]);
    const sc = GB.schedule(st, m), run = sc.run;
    const seg = `<div class="seg" role="group" aria-label="月">${months.map(x => `<button type="button" class="${x === m ? 'on' : ''}" data-act="runmonth" data-m="${x}" aria-pressed="${x === m}">${+x.slice(5)}月分</button>`).join('')}</div>`;
    if (!run) {
      const apps = st.apps.filter(a => a.month === m && a.status === 'applied');
      if (!ui.seed) ui.seed = newSeed(m);
      const ph = GB.phase(st, m);
      return `<div class="toolbar">${seg}</div><section class="card"><h2>${GB.ymLabel(m)}の抽選</h2>
        <p>${pill(GB.PHASE[ph], PH_TONE[ph] || '')} 申込 <b class="mono">${apps.length}</b> 件（${new Set(apps.map(a => a.orgId)).size} 団体）。抽選日は ${GB.md(sc.draw)} です。</p>
        <form class="form" data-form="draw"><input type="hidden" name="m" value="${m}">
          <label class="grow">シード（抽選に使う言葉や数字） <input name="seed" id="seed" value="${esc(ui.seed)}" maxlength="40" required></label>
          <button class="btn">${st.clock < sc.draw ? `申込を締め切って抽選する（きょうを ${GB.md(sc.draw)} にします）` : '抽選する'}</button>
        </form>
        <p class="small muted">シードは、抽選のあとに公開します。同じ申込と同じシードなら、だれがやっても同じ結果になります。本番では、公開の場でサイコロを振るなどしてシードを決めます。</p></section>`;
    }
    const res = Object.entries(run.results);
    const count = k => res.filter(([, r]) => r.status === k).length;
    const by = { type: {}, district: {} }, perOrg = {};
    for (const [appId, r] of res) {
      const a = GB.find(st.apps, appId), o = a && O(a.orgId);
      if (!o) continue;
      for (const [g, k] of [['type', o.type], ['district', o.districtId || '']]) { const x = by[g][k] = by[g][k] || { apps: 0, won: 0, lost: 0, invalid: 0 }; x.apps++; x[r.status]++; }
      const y = perOrg[o.id] = perOrg[o.id] || { apps: 0, won: 0, ok: 0 }; y.apps++; if (r.status === 'won') y.won++; if (r.status !== 'invalid') y.ok++;
    }
    const rate = x => x.won + x.lost ? `${Math.round(x.won / (x.won + x.lost) * 100)}％` : '—';

        <p>${esc(f.name)}・${f.areas > 1 ? '半面ずつ使える（A面・B面）' : '全面だけ'}　${pill(`${GB.ymLabel(m)}：${GB.PHASE[ph]}`, PH_TONE[ph] || '')}</p></div>
        <button type="button" class="x" data-act="close" aria-label="閉じる">×</button></header>

  function unitsBlock(f, occ, role, me) {
    if (occ.block) return `<div class="sec"><p class="blockmsg">${esc(occ.block.reason)}（${occ.block.kind === 'school' ? '学校' : '市役所'}が登録）のため、このコマは使えません。</p></div>`;
    const rows = [], seen = new Set();
    for (const u of occ.units) {
      const it = occ.by[u];
      if (it && seen.has(it)) continue;
      if (it) seen.add(it);
      const lab = occ.units.length === 1 || (it && occ.by.A === occ.by.B) ? '全面' : `${u}面`;
      let txt = '<span class="muted">空き</span>';
      if (it) {
        const mine = me && it.orgId === me.id;
        const name = role === 'org' && !mine ? 'ほかの団体' : mine ? 'あなた' : esc(O(it.orgId).name);
        txt = it.kind === 'regular' ? `${pill('定期枠', 'reg')} ${name}` : `${pill(it.ref.source === 'lottery' ? '抽選' : '先着')} ${name} ${pill(BK[it.ref.status][0], BK[it.ref.status][1])}`;
      }
      rows.push(`<li><span class="ul">${court(lab === '全面' ? 'full' : 'half', u)} ${lab}</span>${txt}</li>`);
    }
    return `<div class="sec"><h3>いまの状態</h3><ul class="units">${rows.join('')}</ul></div>`;
  }
  function lotteryBlock(f, date, sl, apps, ph, sc, role, me, names) {
    const s = st.settings, out = [], pre = ['before', 'apply', 'closed', 'drawing'].includes(ph);
    if (sl.prio && sl.prio.length) out.push(`<p class="note">優先時間帯：${sl.prio.map(t => GB.TYPE_SHORT[t]).join('・')}は、くじ ＋${s.bonusPriority} 本</p>`);
    if (me) { const t = GB.tickets(st, me, f, sl); out.push(`<p>あなたのくじ：<b class="mono">${t.total} 本</b>（${t.parts.map(p => `${esc(p[0])} ${p[1]}`).join('＋')}）</p>`); }
    if (pre) {
      const live = apps.filter(a => a.status === 'applied');
      if (role !== 'org' || s.showCounts) {
        const nf = live.filter(a => a.need === 'full').length;
        out.push(`<p>抽選の申込：<b class="mono">${live.length} 件</b>${live.length ? `（全面 ${nf}・半面 ${live.length - nf}）` : ''}</p>`);
      }
      if (role !== 'org' && live.length) out.push(`<div class="tw"><table class="plain"><thead><tr><th>団体</th><th>区画</th><th class="num">くじ</th><th>内訳</th></tr></thead><tbody>${live.map(a => { const t = GB.tickets(st, O(a.orgId), f, sl); return `<tr><td>${esc(names[a.orgId])}</td><td>${NEED[a.need]}</td><td class="num">${t.total}</td><td>${t.parts.map(p => `${esc(p[0])} ${p[1]}`).join('＋')}</td></tr>`; }).join('')}</tbody></table></div>`);
      const mine = me && live.find(a => a.orgId === me.id);
      if (mine && s.showCounts) {
        const occ = GB.occupancy(st, f, date, sl.id);
        const cands = live.map(a => ({ id: a.id, need: a.need, tickets: GB.tickets(st, O(a.orgId), f, sl).total }));
        out.push(`<p>いまの申込で計算した、当たる見込み：<b class="mono">約 ${GB.odds(cands, occ.units.length, occ.free.length, mine.id)}％</b><br><small class="muted">このコマだけで考えた目安です（1か月・1日の上限は入れていません）。</small></p>`);
      }
    } else if (sc.run) {
      const key = `${f.id}|${date}|${sl.id}`, log = runLog(sc.run).filter(e => e.key === key);
      if (log.length) out.push(`<h3>くじの結果</h3>${log.map(e => kuji(e, role, names)).join('')}`);
      else if (apps.length) out.push('<p class="muted">このコマは、くじを引く前に決まりました（申込が対象外だったか、上限に達していたため）。</p>');
      const mine = me && apps.find(a => a.orgId === me.id);
      if (mine) out.push(`<p>あなたの申込：${pill(APP[mine.status][0], APP[mine.status][1])} ${esc(mine.reason || '')}</p>`);
    }
    return out.length ? `<div class="sec">${out.join('')}</div>` : '';
  }
  function kuji(e, role, names = {}) {
    const nm = appId => { const a = GB.find(st.apps, appId); return a ? esc(names[a.orgId] || (O(a.orgId) || {}).name || '') : ''; };
    if (e.cands.length === 1) return `<p class="kuji1">${nm(e.win)} だけが申し込んでいたので、当選${e.half ? `（${e.half}面）` : ''}。</p>`;
    let acc = 0;
    const segs = e.cands.map(([appId, t]) => { const from = acc + 1; acc += t; return `<div class="seg${appId === e.win ? ' win' : ''}" style="flex-grow:${t}"><b>${nm(appId)}</b><span class="mono">${from === acc ? from : `${from}–${acc}`}</span></div>`; }).join('');
    return `<div class="kuji"><div class="track"><div class="bar">${segs}</div><i class="pin" style="left:${((e.n - 0.5) / e.total * 100).toFixed(2)}%"></i></div>
      <p class="cap">くじ ${e.total} 本から <b class="mono">${e.n} 番</b>を引いた → <b>${nm(e.win)}</b>${e.half ? `（${e.half}面）` : ''}</p></div>`;
  }
  function choice(title, act, f, date, sl, mode) {
    const rows = (f.areas > 1 ? ['full', 'half'] : ['full']).map(n => ({ n, why: GB.blocker(st, ui.orgId, f.id, date, sl.id, n, mode) }));
    const whys = [...new Set(rows.filter(r => r.why).map(r => r.why))];
    return `<div class="row-btn">${rows.map(r => btn(`${court(r.n)} ${title}（${NEED[r.n]}）`, act, { f: f.id, d: date, s: sl.id, n: r.n }, r.n === 'half' ? 'ghost' : '', !!r.why)).join('')}</div>${whys.length ? `<ul class="why">${whys.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}`;
  }
  function orgActions(f, date, sl, apps, ph, sc, me) {
    const s = st.settings, out = [];
    const mineApp = apps.find(a => a.orgId === me.id && a.status === 'applied');
    const bk = st.bookings.find(b => b.orgId === me.id && b.facilityId === f.id && b.date === date && b.slotId === sl.id && ['pending', 'confirmed'].includes(b.status));
    if (ph === 'apply') {
      if (mineApp) out.push(`<p>${pill('申込済み', 'wait')} ${NEED[mineApp.need]}で申し込んでいます。</p><div class="row-btn">${btn('申込を取り下げる', 'withdraw', { id: mineApp.id }, 'ghost')}</div>`);
      else out.push(choice('抽選に申し込む', 'apply', f, date, sl, 'apply'));
    } else if (ph === 'before') out.push(`<p class="muted">抽選の申込は ${GB.md(sc.applyStart)}〜${GB.md(sc.applyEnd)} です。</p>`);
    else if (ph === 'closed' || ph === 'drawing') out.push(`<p class="muted">${GB.md(sc.draw)} の抽選を待っています。</p>`);
    if (bk && bk.status === 'pending') out.push(`<p>${pill('当選', 'ok')} ${GB.md(sc.confirmEnd)} までに確定してください。</p><div class="row-btn">${btn('当選を確定する', 'confirm', { id: bk.id })}${btn('辞退する', 'cancel', { id: bk.id }, 'ghost')}</div>`);
    else if (bk && bk.date > st.clock) {
      const late = D.diff(bk.date, st.clock) < s.freeCancelDays;
      out.push(`<p>${pill('予約あり', 'ok')} ${late ? `<span class="warn">いまキャンセルすると違反 ${s.ptLate} 点です（利用日の ${s.freeCancelDays} 日前を過ぎています）。</span>` : `利用日の ${s.freeCancelDays} 日前までは、キャンセルしても違反になりません。`}</p><div class="row-btn">${btn('キャンセルする', 'cancel', { id: bk.id }, 'warn')}</div>`);
    }
    if ((ph === 'firstCity' || ph === 'firstAll') && !bk) out.push(choice('先着で予約する', 'book', f, date, sl, 'book'));
    return out.length ? `<div class="sec act">${out.join('')}</div>` : '';
  }
  function blockForm(kind, f, date) {
    const def = kind === 'school' ? '学校行事' : '大会';

      <label class="grow">理由 <input name="reason" id="sheet-reason" value="${def}" maxlength="30"></label>
      <div class="row-btn"><button class="btn" name="scope" value="slot">このコマを${kind === 'school' ? '学校で使う' : '確保する'}</button><button class="btn ghost" name="scope" value="day">この日を終日${kind === 'school' ? ' 学校で使う' : ' 確保する'}</button></div></form>
      <p class="small muted">入っていた予約・申込・定期枠の団体には、自動でお知らせが届きます（違反にはなりません）。</p>`;
  }
  function useButtons(f, date, sl) {
    return st.bookings.filter(b => b.facilityId === f.id && b.date === date && b.slotId === sl.id && b.status === 'confirmed' && b.date <= st.clock)
      .map(b => `<p>${esc(O(b.orgId).name)}は使いましたか？</p><div class="row-btn">${btn('使った', 'use', { id: b.id, v: 1 }, 'sm')}${btn('使わなかった', 'use', { id: b.id, v: 0 }, 'sm warn')}</div>`).join('');
  }
  function schoolActions(f, date, sl, occ) {
    if (f.kind !== 'school') return '<div class="sec act"><p class="muted">市の体育館です。学校の画面からは登録できません。</p></div>';
    const out = [];
    if (occ.block) out.push(occ.block.kind === 'school' ? `<div class="row-btn">${btn('学校の使用を取り消す', 'unblock', { id: occ.block.id }, 'warn')}</div>` : `<p class="muted">市役所が登録した「${esc(occ.block.reason)}」です。</p>`);
    else if (date > st.clock) out.push(blockForm('school', f, date));
    out.push(useButtons(f, date, sl));
    return `<div class="sec act">${out.join('')}</div>`;
  }
  function adminActions(f, date, sl, occ) {
    const out = [];
    if (occ.block) out.push(occ.block.kind === 'event' ? `<div class="row-btn">${btn('優先確保を取り消す', 'unblock', { id: occ.block.id }, 'warn')}</div>` : `<p class="muted">学校が登録した「${esc(occ.block.reason)}」です。</p>`);
    else if (date > st.clock) out.push(blockForm('event', f, date));
    out.push(useButtons(f, date, sl));
    return `<div class="sec act">${out.join('')}</div>`;
  }

  /* ---- 描く ---- */

    const view = { org: orgView, school: schoolView, admin: adminView }[ui.view] || guideView;
    root.innerHTML = `${topbar()}<main class="wrap" id="main">${view()}</main>${ui.sheet ? sheetView() : ''}`;
    document.body.classList.toggle('locked', !!ui.sheet);
  }

  /* ---- 操作 ---- */
  const settingsCopy = () => JSON.parse(JSON.stringify(st.settings));
  const setPath = (obj, path, v) => { const ks = path.split('.'), last = ks.pop(); ks.reduce((o, k) => o[k], obj)[last] = v; };
  const ACT = {
    view: d => { ui.view = d.v; ui.sheet = null; save(); render(); window.scrollTo(0, 0); },
    go: d => { ui.view = d.v; if (d.v === 'org') ui.orgTab = d.tab; if (d.v === 'admin') ui.adminTab = d.tab; save(); render(); window.scrollTo(0, 0); },
    gocal: d => { ui.orgTab = 'cal'; ui.orgMonth = d.m; save(); render(); window.scrollTo(0, 0); },
    orgtab: d => { ui.orgTab = d.tab; save(); render(); },
    schooltab: d => { ui.schoolTab = d.tab; save(); render(); },
    admintab: d => { ui.adminTab = d.tab; ui.confirmReset = false; save(); render(); },
    orgmonth: d => { ui.orgMonth = d.m; save(); render(); },
    schoolmonth: d => { ui.schoolMonth = d.m; save(); render(); },
    csvmonth: d => { ui.csvMonth = d.m; render(); },
    adminmonth: d => { ui.adminMonth = d.m; save(); render(); },
    runmonth: d => { ui.runMonth = d.m; ui.seed = ''; render(); },
    clock: () => { ui.clockOpen = !ui.clockOpen; ui.confirmReset = false; render(); },
    setclock: d => { const r = moveClock(d.d); ui.clockOpen = false; done(r); },
    'reset-ask': () => { ui.confirmReset = true; render(); },
    'reset-no': () => { ui.confirmReset = false; render(); },
    reset: () => { st = GB.sample(); ui.confirmReset = false; ui.clockOpen = false; ui.sheet = null; ui.verified = {}; ui.seed = ''; done({ ok: true, msg: 'サンプルの状態に戻しました' }); },
    open: d => { ui.sheet = { f: d.f, d: d.d, s: d.s }; render(); const h = document.getElementById('sheet-h'); if (h) h.focus(); },
    close: () => { ui.sheet = null; render(); },
    apply: d => done(A.apply(st, ui.orgId, d.f, d.d, d.s, d.n)),
    withdraw: d => done(A.withdraw(st, d.id)),
    book: d => done(A.book(st, ui.orgId, d.f, d.d, d.s, d.n)),
    confirm: d => done(A.confirm(st, d.id)),
    'confirm-all': () => {
      const list = st.bookings.filter(b => b.orgId === ui.orgId && b.status === 'pending');
      const ok = list.map(b => A.confirm(st, b.id)).filter(r => r.ok).length;

    cancel: d => done(A.cancel(st, d.id)),
    use: d => done(A.markUse(st, d.id, d.v === '1')),

    },
    unblock: d => done(A.removeBlock(st, d.id)),
    quickdraw: d => done(A.runLottery(st, d.m, newSeed(d.m))),
    verify: d => { const run = GB.schedule(st, d.m).run; ui.verified[d.m] = !!run && GB.verifyRun(run); render(); },
    approve: d => { const o = O(d.id); if (o) o.status = 'approved'; done({ ok: true, msg: `「${o.name}」を承認しました` }); },
    resetpts: d => { const o = O(d.id); if (o) o.points = 0; done({ ok: true, msg: '違反点数を 0 にしました' }); },
    delreg: d => done(A.removeRegular(st, d.id)),
    'rules-default': () => done(A.setSettings(st, GB.defaults())),
    copy: (d, el) => {
      const ta = document.getElementById(d.t);
      if (!ta) return;
      const fallback = () => { ta.focus(); ta.select(); toast('選びました。コピーの操作（Ctrl+C や長押し）でコピーしてください'); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('コピーしました'), fallback); } catch (e) { fallback(); }
    },
    download: d => {
      const ta = document.getElementById(d.t);
      if (!ta) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + ta.value], { type: d.name.endsWith('.csv') ? 'text/csv' : 'application/json' }));

      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);

  const CH = {
    org: el => { ui.orgId = el.value; save(); render(); },
    fac: el => { ui.facId = el.value; save(); render(); },

    adminfac: el => { ui.adminFac = el.value; save(); render(); },
    'org-type': el => { const o = O(el.dataset.id); o.type = el.value; done({ ok: true, msg: `「${o.name}」の区分を変えました` }); },
    'org-dist': el => { const o = O(el.dataset.id); o.inCity = !!el.value; o.districtId = el.value || null; done({ ok: true, msg: `「${o.name}」の地区を変えました` }); },
    'fac-name': el => { const f = F(el.dataset.id), v = el.value.trim(); if (v) f.name = v; done({ ok: !!v, msg: v ? '名前を変えました' : '名前を入れてください' }); },
    'fac-kind': el => {

    if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el);
  });
  root.addEventListener('submit', e => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = FORM[form.dataset.form];
    if (fn) fn(new FormData(form), e.submitter ? e.submitter.value : '');
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (ui.sheet) { ui.sheet = null; render(); }
    else if (ui.clockOpen) { ui.clockOpen = false; render(); }
  });

  render();
})();

</script>
</body>
</html>
