      chain(D, CH.rect(c.x0 + s * .6, c.y0 + s * 2, c.x1 - s * .6, c.y1 - s * (i ? .6 : 2.2)), A[i][1], u, { labs: D.W > D.H * .9 ? A[i][2] : [], size: s * 1.5, cols: LBL.cols });
      if (i === 0) TX(D, c.cx, c.y1 - s * 1.2, '6＋(−4) を先にすると 2×2＝4（×）', { size: fit(D, '6＋(−4) を先にすると 2×2＝4（×）', c.w * .92, s * .85), col: C.pink, a: CH.smooth(.9, 1, u) });
    });
  }

  /* ---- ことば：計算の順序の階段 ---- */
  function stairs(D, t) {
    var R = CH.box(D, { l: .05, r: .05, t: .06, b: .08 }), s = CH.fs(D), bh = R.h * .2, w = R.w * .62, dx = (R.w - w) / 2;
    var L = [['①', '累乗・かっこの中', '( )　{ }　□^2', C.pink], ['②', '乗法・除法', '×　÷', C.orange], ['③', '加法・減法', '＋　−', C.blue]];
    L.forEach(function (l, i) {
      var a = CH.smooth(i * .25, i * .25 + .15, t), x0 = R.x0 + i * dx, y0 = R.y0 + i * bh * 1.35, x1 = x0 + w;
      if (a <= 0) return;
      rr(D, x0, y0, x1, y0 + bh, { stroke: l[3], fill: ha(l[3], .14), sw: 2.4, a: a });
      TX(D, x0 + s * 1.1, y0 + bh / 2, l[0], { size: Math.min(s * 1.4, bh * .5), col: l[3], a: a });
      var z = Math.min(s * 1.15, fit(D, l[1], w - s * 2.6, s * 1.15), bh * .3);
      TX(D, x0 + s * 2.2, y0 + bh * .32, l[1], { size: z, align: 'left', a: a });
      TX(D, x0 + s * 2.2, y0 + bh * .72, l[2], { size: z, align: 'left', col: l[3], a: a });
      if (i < 2) CH.arrow(D, x0 + w * .6, y0 + bh + 3, x0 + dx + w * .4, y0 + bh * 1.35 - 3, { col: C.chalk, w: 2, a: CH.smooth(i * .25 + .15, i * .25 + .25, t) });
    });
    var txt = 'かっこが二重のとき … 内側の ( ) から、次に { }';
    TX(D, R.cx, Math.min(R.y0 + 3 * bh * 1.35 + s * .9, R.y1), txt, { size: fit(D, txt, R.w, s * 1.05), col: C.green, a: CH.smooth(.8, .95, t) });
  }

  /* ---- 考えよう：2通りの計算 ---- */
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .04, t: .06, b: .06 }), s = CH.fs(D), h = TH[D.V.k], cs = CH.cols(R, 2, .06), show = D.V.ans;
    var W = [['ア', '左から順に', [h.e, h.a[0], '＝' + (show ? S(h.a[1]) : '？')]], ['イ', 'かけ算・わり算を先に', [h.e, h.b[0], '＝' + (show ? S(h.b[1]) : '？')]]];
    cs.forEach(function (c, i) {
      rr(D, c.x0, c.y0, c.x1, c.y1, { stroke: 'rgba(242,240,230,.4)', fill: 'rgba(242,240,230,.04)', sw: 1.6 });
      TX(D, c.x0 + s * .5, c.y0 + s * 1.1, W[i][0] + '　' + W[i][1], { size: fit(D, W[i][0] + '　' + W[i][1], c.w - s, s * 1.05), col: i ? C.blue : C.orange, align: 'left' });
      chain(D, CH.rect(c.x0 + s * .5, c.y0 + s * 2.2, c.x1 - s * .5, c.y1 - s * .4), W[i][2], 1, { size: s * 1.4 });
    });
  }

  /* ---- チャレンジ：かっこの入れ方 5通り ---- */
  function chal(D, t) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .05 }), s = CH.fs(D), head = '−3＋2×5−4　（かっこなし … 3）';
    TX(D, R.cx, R.y0 + s * .8, head, { size: fit(D, head, R.w, s * 1.15), col: C.chalk });
    var top = R.y0 + s * 2.2, lh = (R.y1 - top) / 5, z = Math.min(s * 1.2, lh * .5);
    var wE = Math.max.apply(null, BR.map(function (b) { return TW(D, b.p.join(''), 100) / 100; })), wM = Math.max.apply(null, BR.map(function (b) { return TW(D, b.m, 100) / 100; })), wV = TW(D, '＝−9', 100) / 100;
    z = Math.min(z, R.w / (wE + wM + wV + 1.6));
    var x1 = R.x0 + s * .2, x2 = x1 + (wE + .6) * z, x3 = x2 + (wM + .6) * z;
    BR.forEach(function (b, i) {
      var y = top + lh * (i + .5), a = D.ph ? CH.smooth(.05 + i * .13, .15 + i * .13, t) : 0, hit = b.v === -9 || b.v === -1, ka = CH.smooth(.8, .95, t);
      if (hit && ka > 0) rr(D, R.x0, y - lh * .45, R.x1, y + lh * .45, { fill: ha(C.yel, .14), stroke: C.yel, sw: 2, a: ka });
      var x = x1; x += TX(D, x, y, b.p[0], { size: z, align: 'left', a: a }); x += TX(D, x, y, b.p[1], { size: z, align: 'left', col: C.pink, a: a }); TX(D, x, y, b.p[2], { size: z, align: 'left', a: a });
      TX(D, x2, y, b.m, { size: z, align: 'left', col: 'rgba(242,240,230,.75)', a: a * CH.smooth(.06, .5, t) });
      TX(D, x3, y, '＝' + S(b.v), { size: z, align: 'left', col: hit ? C.yel : C.chalk, a: a });
    });
  }

  K3.run({
    no: '第14時', title: '計算の順序を守って、四則の混じった式を計算しよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '13.html', label: '◀ 第13時' }, { href: '15.html', label: '第15時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'ア 6＋(−4)×2　イ (6−4)×(−2)', q: '次の2つの式は、形がにている。どこから計算すればよいか、自分で順序を決めて、答えを求めよう。ア 6＋(−4)×2　イ (6−4)×(−2)',
        notes: ['① 自分の考え（3分）　計算の順序と、答えを書こう。', '② ペアの考え（3分）　自分とちがう順序・気づきを書こう。'],
        draw: function (D) { pair(D, 0); } },
      { tag: '今日の問い', q: 'どこから計算する？ 答えは？', a: 'ア −2　イ −4', sub: 'ア かけ算を先に 6＋(−8)＝−2（6＋(−4) を先にすると 4 になって、ちがう）　イ かっこの中を先に 2×(−2)＝−4', dur: 7,
        b: { t: 'ア かけ算が先 → <b>−2</b>　イ かっこの中が先 → <b>−4</b>', col: C.yel },
        draw: function (D) { pair(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '加法・減法・乗法・除法を、まとめて何という？ 四則の混じった式は、どの順に計算する？', a: '四則。累乗・かっこの中 → 乗除 → 加減', sub: 'かっこが二重のときは、内側のかっこから先に計算する', dur: 4,
        b: [{ t: '加法・減法・乗法・除法 … まとめて <b>四則</b>', col: C.green }, { t: '順序：<b>累乗・かっこの中</b> → <b>乗法・除法</b> → <b>加法・減法</b>', col: C.green }, { t: 'かっこが二重 → <b>内側</b> から', col: C.green }],
        draw: function (D) { stairs(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題', q: '（1）10−(−2)^2×3 を、計算の順序にしたがって計算しよう。', a: '−2', sub: '① 累乗 (−2)^2＝4　② 乗法 4×3＝12　③ 減法 10−12＝−2', dur: 6,
        b: { t: '（1）10−4×3＝10−12＝<b>−2</b>', col: C.pink },
        draw: function (D) { chain(D, CH.box(D, { l: .06, r: .06, t: .08, b: .08 }), ['10−【(−2)^2】×3', '＝10−【〔4〕×3】', '＝【10−〔12〕】', '＝〔−2〕'], D.ph ? D.t : 0, { labs: ['', '① 累乗', '② 乗法', '③ 減法'], cols: LBL.cols, size: CH.fs(D, 1.6) }); } },
      { tag: '例題', q: '（2）20−{5−(−3)}×4 を計算しよう。', a: '−12', sub: '① かっこの中 5−(−3)＝8　② 乗法 8×4＝32　③ 減法 20−32＝−12', dur: 6,
        b: { t: '（2）20−8×4＝20−32＝<b>−12</b>', col: C.pink },
        draw: function (D) { chain(D, CH.box(D, { l: .06, r: .06, t: .08, b: .08 }), ['20−【{5−(−3)}】×4', '＝20−【〔8〕×4】', '＝【20−〔32〕】', '＝〔−12〕'], D.ph ? D.t : 0, { labs: ['', '① かっこの中', '② 乗法', '③ 減法'], cols: LBL.cols, size: CH.fs(D, 1.6) }); } },
      { tag: '考えよう', bh: '考えよう', q: '2＋3×(−4) を、ア・イの2通りに計算した。答えをくらべて、気づいたことを書こう。8−6÷(−2) でも、2通りに計算して確かめよう。',
        notes: ['どちらが正しいか、そのわけも書こう。', 'スライダーで、式を変えたり、答えを見たりできます。'],
        sliders: [{ key: 'k', label: '式', min: 0, max: 1, step: 1, val: 0, fmt: function (k) { return TH[k].e.replace('＋', '+'); } }, { key: 'ans', label: '答え', min: 0, max: 1, step: 1, val: 0, fmt: function (x) { return x ? '見る' : 'かくす'; } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '−3＋2×5−4 に、かっこを1組入れて、① 答えが −9　② 答えが −1 になる式をつくろう。', a: '① (−3＋2)×5−4　② −3＋2×(5−4)',
        sub: '① (−1)×5−4＝−9　② −3＋2×1＝−1。かっこの入れ方は 5通り（ほかの3通りは、どれも 3）', dur: 6,
        b: { t: '① (−3＋2)×5−4＝<b>−9</b>　② −3＋2×(5−4)＝<b>−1</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
})();
