      TX(D, x0 - s * .9, y, '西', { size: s, col: 'rgba(242,240,230,.75)' }); TX(D, x1 + s * 2.1, y, '東', { size: s, col: 'rgba(242,240,230,.75)' });
      K.forEach(function (k, i) {
        var a = CH.clamp(n - i, 0, 1); if (a <= 0) return;
        var x = X(w.v * k);
        if (i > 0 && arcs && arcs[j]) arc(D, X(w.v * K[i - 1]), x, y - s * 2.3, w.col, CH.smooth(0, .7, a), { h: s * .75, lab: w.step, size: s * .85, hd: 7 });
        dot(D, x, y, i === 4 && hl === j ? C.yel : w.col, null, { size: s, a: CH.smooth(.6, 1, a) });
        TX(D, x, y - s * 1.35, tname(k), { size: s * .78, col: w.col, a: CH.smooth(.6, 1, a), outline: 'rgba(20,40,30,.9)' });
      });
    });
    var tr = rs[2], vals = [UP, DN];
    CH.table(D, tr, ['かける数（分）'].concat(K.map(P)), WHO.map(function (w, j) { return [w.t].concat(vals[j].map(function (v, i) { return show[j] >= i + 1 ? P(v) : '？'; })); }),
      { fw: .3, size: Math.min(CH.fs(D, .85), tr.h / 3 * .42), hl: function (r, c) { return r > 0 && c > 0 && show[r - 1] >= c ? (c === 5 && hl === r - 1 ? C.yel : c > 3 ? WHO[r - 1].col : null) : null; } });
  }

  /* ---- ことば：符号のきまり ---- */
  function rules(D, t) {
    var R = CH.box(D, { l: .05, r: .05, t: .06, b: .08 }), s = CH.fs(D), cs = CH.cols(CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .78), 2, .06);
    var L = [[['(＋)×(＋) → ＋', POS], ['(−)×(−) → ＋', POS]], [['(＋)×(−) → −', NEG], ['(−)×(＋) → −', NEG]]], hd = ['同符号の2数の積', '異符号の2数の積'];
    cs.forEach(function (c, i) {
      var a0 = CH.smooth(i * .35, i * .35 + .12, t), z = fit(D, '(＋)×(−) → −', c.w * .8, s * 1.35);
      if (a0 <= 0) return;
      rr(D, c.x0, c.y0, c.x1, c.y1, { stroke: i ? NEG : POS, sw: 2, fill: ha(i ? NEG : POS, .08), a: a0 });
      TX(D, c.cx, c.y0 + c.h * .16, hd[i], { size: fit(D, hd[i], c.w * .9, s), col: i ? NEG : POS, a: a0 });
      L[i].forEach(function (l, j) { TX(D, c.cx, c.y0 + c.h * (.45 + j * .27), l[0], { size: z, a: CH.smooth(i * .35 + .08 + j * .1, i * .35 + .2 + j * .1, t) }); });
      TX(D, c.cx, c.y1 + s * 1.2, i ? '絶対値の積に −' : '絶対値の積に ＋', { size: s * .95, col: i ? NEG : POS, a: CH.smooth(i * .35 + .25, i * .35 + .35, t) });
    });
    TX(D, R.cx, R.y1 - s * .3, 'ある数と 0 との積は 0', { size: s * 1.1, col: C.yel, a: CH.smooth(.85, 1, t) });
  }

  /* ---- 例題：符号 → 絶対値の積 → 積 ---- */
  function ex(D, t) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .06 }), wide = D.W > D.H * .9, rs = CH.rows(R, 3, .08), s = CH.fs(D);
    EXS.forEach(function (p, i) {
      var r = rs[i], u = CH.clamp(t * 3 - i, 0, 1), a1 = CH.smooth(0, .25, u), a2 = CH.smooth(.3, .6, u), a3 = CH.smooth(.65, .95, u), v = p[0] * p[1];
      var h = Math.min(r.h * (wide ? .62 : .4), s * 2.3), y1 = wide ? r.cy : r.y0 + r.h * .26, y2 = wide ? r.cy : r.y0 + r.h * .76;
      var items = [{ s: P(p[0]) }, { s: '×', op: 1 }, { s: P(p[1]) }], nx = r.x0 + s * 1.6, pos = crow(D, nx, y1, items, h, { align: 'left', maxW: wide ? r.w * .38 : r.w - s * 2 });
      TX(D, r.x0, y1, '(' + (i + 1) + ')', { size: s * .85, align: 'left' });
      var x2 = wide ? pos[2].x1 + s * 1.2 : r.x0 + s * 1.6, rest = r.x1 - x2, br = Math.min(h, s * 2) * .42, z = Math.min(s * 1.05, rest / 11);
      if (a1 > 0) { CH.circle(D, x2 + br, y2, br, { fill: ha(vcol(v), .3), stroke: vcol(v), sw: 2.2, a: a1 }); TX(D, x2 + br, y2, v > 0 ? '＋' : '−', { size: br * 1.3, col: vcol(v), a: a1 }); }
      if (a2 > 0) TX(D, x2 + br * 2 + z * .6, y2, Math.abs(p[0]) + '×' + Math.abs(p[1]) + '＝' + Math.abs(v), { size: z, align: 'left', a: a2 });
      if (a3 > 0) { var rw = Math.max(h * 1.5, TW(D, P(v), h * .5) + h * .5), rx = r.x1 - rw / 2; TX(D, rx - rw / 2 - z * .3, y2, '→', { size: z, align: 'right', col: C.yel, a: a3 }); card(D, rx, y2, rw, Math.min(h, s * 2), P(v), { col: vcol(v), a: a3, glow: true }); }
    });
  }

  /* ---- 考えよう：−1 をかけると ---- */
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .04, t: .06, b: .05 }), s = CH.fs(D), x = D.V.x, n = D.V.n, sn = CH.fs(D, .85);
    var y = R.y1 - sn * 2.2, x0 = R.x0 + sn, x1 = R.x1 - sn * 1.8, X = NL(D, x0, x1, y, -6, 6, { step: 1, major: 1, size: sn });
    [[3, 'A'], [-2, 'B']].forEach(function (p) { TX(D, X(p[0]), y + sn * 2.6, p[1], { size: sn * .9, col: 'rgba(242,240,230,.6)' }); });
    var eq = P(x), cur = x;
    dot(D, X(x), y, C.orange, null, { size: sn });
    for (var i = 1; i <= n; i++) {
      var nx = -cur; if (cur !== 0) arc(D, X(cur), X(nx), y - sn * .3, C.yel, 1, { h: sn * (1.3 + i * .9), lab: i === n ? '×(−1)' : '', size: sn });
      eq = (i === 1 ? '(' + P(x) + ')' : eq) + '×(−1)'; cur = nx;
    }
    if (n > 0) dot(D, X(cur), y, C.yel, null, { size: sn });
    var txt = n ? eq + '＝' + P(cur) : 'ある数 ' + P(x);
    TX(D, R.cx, R.y0 + (y - R.y0) * .25, txt, { size: fit(D, txt, R.w, s * 1.4), col: C.yel });
  }

  /* ---- チャレンジ：積が −20 になる組 ---- */
  function chal(D, t) {
    var R = CH.box(D, { l: .06, r: .06, t: .05, b: .06 }), s = CH.fs(D), top = R.y0 + s * 1.2;
    TX(D, R.cx, top, '積が負 → 正の数と負の数が 1つずつ', { size: fit(D, '積が負 → 正の数と負の数が 1つずつ', R.w, s * 1.05), col: C.orange, a: D.ph ? CH.smooth(0, .12, t) : 0 });
    var TR = CH.rect(R.x0, top + s * 1.4, R.x1, R.y1);
    CH.table(D, TR, ['2つの数', '積', '和'], PR.map(function (p) { return [P(p[0]) + ' と ' + P(p[1]), P(p[0] * p[1]), P(p[0] + p[1])]; }),
      { fw: .46, size: Math.min(CH.fs(D, .9), TR.h / 7 * .45), show: function (r, c) { return r === 0 ? 1 : D.ph ? CH.smooth(.1 + r * .1, .18 + r * .1, t) * (c === 2 ? CH.smooth(.75, .85, t) : 1) : 0; },
        hl: function (r, c) { return r === 6 && t > .88 ? C.yel : null; } });
  }

  K3.run({
    no: '第10時', title: '負の数をかけると、積はどうなるだろう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '09.html', label: '◀ 第9時' }, { href: '11.html', label: '第11時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: '(＋3)×□ と (−3)×□', q: 'かける数を1ずつ小さくしたときの、積の変わり方に目をつけて、(＋3)×(−2) と (−3)×(−2) の積を予想しよう。',
        notes: ['東へ進むことを ＋、□分後を ＋□分、□分前を −□分 で表す。', '① 自分の考え（3分）　積の変わり方のきまりと、予想を書こう。', '② ペアの考え（3分）　自分とちがう見方があれば、書こう。'],
        draw: function (D) { road(D, [3, 3], -1, [0, 0]); } },
      { tag: '今日の問い', q: '(＋3)×□ の段。かける数が 1 小さくなると、積はどう変わる？ (＋3)×(−2) は？', a: '3 ずつ小さくなる。(＋3)×(−2)＝−6', sub: '毎分 東へ 3m 進む人の、2分前（−2分）の位置は、西へ 6m（−6）', dur: 5,
        b: { t: '(＋3)×□ … 3 ずつ小さくなる → (＋3)×(−2)＝<b>−6</b>', col: C.yel },
        draw: function (D) { road(D, [D.ph ? 3 + 2 * CH.smooth(0, .9, D.t) : 3, 3], D.ph && D.t > .9 ? 0 : -1, [D.ph, 0]); } },
      { tag: '今日の問い', q: '(−3)×□ の段は？ (−3)×(−2) は？', a: '3 ずつ大きくなる。(−3)×(−2)＝＋6', sub: '毎分 西へ 3m（−3m）進む人の、2分前の位置は、東へ 6m（＋6）', dur: 5,
        b: { t: '(−3)×□ … 3 ずつ大きくなる → (−3)×(−2)＝<b>＋6</b>', col: C.yel },
        draw: function (D) { road(D, [5, D.ph ? 3 + 2 * CH.smooth(0, .9, D.t) : 3], D.ph && D.t > .9 ? 1 : -1, [1, D.ph]); } },
      { tag: 'ことば', bh: 'ことば', q: '同符号の2数の積・異符号の2数の積は、どう決まる？ ある数と 0 との積は？', a: '同符号 → ＋、異符号 → −、0 との積は 0', sub: '積の符号を先に決めてから、絶対値の積を求める', dur: 4,
        b: [{ t: '<b>同符号</b>の2数の積 … 絶対値の積に <b>＋</b>', col: C.green }, { t: '<b>異符号</b>の2数の積 … 絶対値の積に <b>−</b>', col: C.green }, { t: 'ある数と 0 との積は <b>0</b>', col: C.green }],
        draw: function (D) { rules(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　符号を先に決める', q: '次の積を求めよう。符号を先に決めてから、絶対値の積を求めよう。（1）(＋4)×(−6)　（2）(−5)×(−7)　（3）(−9)×(＋3)', a: '（1）−24　（2）＋35　（3）−27',
        sub: '（1）異符号 → −、4×6＝24　（2）同符号 → ＋、5×7＝35　（3）異符号 → −、9×3＝27', dur: 6,
        b: { t: '（1）<b>−24</b>　（2）<b>＋35</b>　（3）<b>−27</b>（符号 → 絶対値の積）', col: C.pink },
        draw: function (D) { ex(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: 'ある数に −1 をかけると、数直線の上で、その数を表す点は、どこへ動くだろう。点 A（＋3）、B（−2）で確かめよう。−1 を 2回かけると、どうなるだろう。',
        notes: ['気づいたことと、その理由を書こう。', 'スライダーで、ある数と、−1 をかける回数を変えられます。'],
        sliders: [{ key: 'x', label: 'ある数', min: -6, max: 6, step: 1, val: 3, fmt: P }, { key: 'n', label: '−1 をかける回数', min: 0, max: 3, step: 1, val: 0, fmt: function (n) { return n + '回'; } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '積が −20 で、和が 1 になる2つの整数を求めよう。', a: '＋5 と −4', sub: '積が負だから、正の数と負の数が1つずつ。絶対値の積が 20 の組は 1 と 20、2 と 10、4 と 5。和が 1 になるのは ＋5 と −4', dur: 6,
        b: { t: '積 −20 → 正と負が1つずつ。和 1 → <b>＋5 と −4</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
