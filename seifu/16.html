  PERM.forEach(function (p) { for (var j = 0; j < 64; j++) for (var k = 0; k < 6; k++) { var v = evalB(k, numsOf(p), opsOf(j)); if (v) { best = Math.max(best, v.n / v.d); worst = Math.min(worst, v.n / v.d); } } });
  CH.check(best === 144 && worst === -120, '考えよう（ここで確かめるだけ：最大 144・最小 −120）');
  function ex(p, j, k) { return evalB(k, numsOf(p), opsOf(j)); }
  function pi(arr) { return PERM.map(function (p) { return p.join(); }).indexOf(arr.join()); }
  var EX10 = { p: [2, 3, 0, 1], o: ['＋', '×', '−'], k: 3 }, EX24 = { p: [1, 2, 0, 3], o: ['×', '−', '−'], k: 2, seq: [{ n: 1 }, { o: '×' }, { b: '{' }, { n: 2 }, { o: '−' }, { n: 0 }, { b: '}' }, { o: '−' }, { n: 3 }] }, EXY = { p: [2, 3, 0, 1], o: ['＋', '÷', '×'], k: 0 };
  function jOf(o) { return OPS.indexOf(o[0]) * 16 + OPS.indexOf(o[1]) * 4 + OPS.indexOf(o[2]); }
  CH.check(feq(ex(EX10.p, jOf(EX10.o), EX10.k), 10, 1) && feq(ex(EX24.p, jOf(EX24.o), EX24.k), 24, 1) && feq(ex(EXY.p, jOf(EXY.o), EXY.k), 13, 1), '今日の問いの例（10）・例題（24・13）');
  CH.check(4 * ((-6) / (-2) - 3) === 0 && (-6) + 3 * ((-2) + 4) === 0, '今日の問い（0）');
  CH.check(5 - 3 * (-2) === 11 && (5 - 3) * (-2) === -4, 'ことば');
  var HIT = []; OPS.forEach(function (a) { OPS.forEach(function (b) { OPS.forEach(function (c) { if (a === b || b === c || a === c) return; var v = flat([F(6), F(-3), F(4), F(2)], [a, b, c]); if (feq(v, -6, 1)) HIT.push(a + b + c); }); }); });
  CH.check(HIT.join() === '÷×＋', 'チャレンジ');

  /* ---- カードの式：手もとの4枚 → 式の中へ ---- */
  function layout(D, R, h) { return { yH: R.y0 + h * .7, yE: R.y0 + h * 2.3, top: R.y0 + h * 3.25 }; }
  function hand(D, R, h, y) { var items = CD.map(function (v) { return { s: S(v) }; }); return crow(D, R.cx, y, items, h, { maxW: R.w * .8 }); }
  function placeCards(D, R, ex, u, h) {
    var Ly = layout(D, R, h), hp = crowPos(D, R.cx, CD.map(function (v) { return { s: S(v) }; }), h, { maxW: R.w * .8 });
    hp.forEach(function (p) { rr(D, p.x0, Ly.yH - hp.h / 2, p.x1, Ly.yH + hp.h / 2, { stroke: 'rgba(242,240,230,.25)', dash: true, sw: 1.4, r: hp.h * .18 }); });
    var T = ex.seq || toks(ex.k, ex.p, ex.o), items = T.map(function (t) { return t.n != null ? { s: S(CD[t.n]) } : { s: t.o || t.b, op: 1, col: t.o ? C.yel : C.chalk }; }), hh = Math.min(hp.h, hp.h * R.w * .96 / crowW(D, items, hp.h));
    var ep = crowPos(D, R.cx, items, hh);
    T.forEach(function (t, i) {
      var p = ep[i];
      if (t.n == null) { TX(D, p.cx, Ly.yE, t.o || t.b, { size: hh * .55, col: t.o ? C.yel : C.chalk, a: CH.smooth(.55, 1, u) }); return; }
      var hpos = hp[t.n], k = CH.ease(CH.smooth(t.n * .08, .5 + t.n * .1, u));
      card(D, CH.lerp(hpos.cx, p.cx, k), CH.lerp(Ly.yH, Ly.yE, k) - Math.sin(Math.PI * k) * hh * .5, CH.lerp(hpos.x1 - hpos.x0, p.w, k), CH.lerp(hp.h, hh, k), S(CD[t.n]), { col: vcol(CD[t.n]), size: CH.lerp(hp.h, hh, k) * .5 });
    });
    return Ly;
  }
  function H(D) { var R = CH.box(D, { l: .04, r: .04, t: .04, b: .05 }); return { R: R, h: Math.min(CH.fs(D) * 2.6, R.h * .14) }; }
  function cardsChain(D, ex, L, labs, t, o) {
    o = o || {}; var B = H(D), R = B.R, Ly = placeCards(D, R, ex, D.ph ? CH.smooth(0, .3, t) : 0, B.h);
    if (o.goal) TX(D, R.x1, Ly.yH, '目標 ' + o.goal, { size: CH.fs(D, .9), col: C.orange, align: 'right' });
    chain(D, CH.rect(R.x0, Ly.top, R.x1, R.y1), L, D.ph ? CH.smooth(.32, 1, t) : 0, { labs: labs, cols: [C.pink, C.orange, C.blue], size: CH.fs(D, 1.4), a: D.ph ? CH.smooth(.3, .4, t) : 0 });
  }

  function start(D) {
    var B = H(D), R = B.R, Ly = layout(D, R, B.h); hand(D, R, B.h, Ly.yH);
    crow(D, R.cx, Ly.yE + B.h * .4, ['＋', '−', '×', '÷', '(　)', '{　}'].map(function (x) { return { s: x, col: C.chalk }; }), B.h * .8, { maxW: R.w * .9 });
    TX(D, R.cx, R.y0 + R.h * .78, '目標の数　0', { size: CH.fs(D, 1.5), col: C.orange });
  }
  /* ---- 2つの式を、ならべて計算 ---- */
  function two(D, t, A, ttl) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .05 }), s = CH.fs(D), cs = CH.split(D, R, 2, .08);
    cs.forEach(function (c, i) {
      var u = D.ph ? CH.clamp(t * 2.1 - i * 1.05, 0, 1) : 0;
      rr(D, c.x0, c.y0, c.x1, c.y1, { stroke: 'rgba(242,240,230,.35)', fill: 'rgba(242,240,230,.04)', sw: 1.6 });
      if (ttl) TX(D, c.x0 + s * .5, c.y0 + s * .9, ttl[i], { size: fit(D, ttl[i], c.w - s, s), col: C.yel, align: 'left' });
      chain(D, CH.rect(c.x0 + s * .5, c.y0 + s * 1.8, c.x1 - s * .5, c.y1 - s * .4), A[i][0], u, { labs: D.W > D.H * .9 ? A[i][1] : [], cols: [C.pink, C.orange, C.blue], size: s * 1.4 });
    });
  }

  /* ---- 考えよう：ならべ方・記号・かっこを変えて調べる ---- */
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .05 }), s = CH.fs(D), p = PERM[D.V.p], j = D.V.j, k = D.V.k, o = opsOf(j), T = toks(k, p, o);
    var items = T.map(function (t) { return t.n != null ? { s: S(CD[t.n]) } : { s: t.o || t.b, op: 1, col: t.o ? C.yel : C.chalk }; }), h = Math.min(s * 2.8, R.h * .26); h = Math.min(h, h * R.w * .96 / crowW(D, items, h));
    hand(D, R, Math.min(h, s * 2) * .8, R.y0 + s);

    var v = ex(p, j, k), txt = v ? '＝' + ftx(v) : '0 でわることになる（計算できない）';
    TX(D, R.cx, R.y0 + R.h * .8, txt, { size: Math.min(s * (v ? 2 : 1.1), fit(D, txt, R.w, s * 2)), col: v ? C.yel : NEG });
  }

  /* ---- チャレンジ：記号のカードが □ に入る ---- */
  function chal(D, t) {
    var B = H(D), R = B.R, s = CH.fs(D), h = B.h, u = D.ph ? CH.smooth(0, .3, t) : 0, OP = ['÷', '×', '＋'];
    var items = [{ s: '6' }, { s: '□', op: 1 }, { s: '−3' }, { s: '□', op: 1 }, { s: '4' }, { s: '□', op: 1 }, { s: '2' }, { s: '＝', op: 1 }, { s: '−6' }], hh = Math.min(h * 1.2, h * 1.2 * R.w * .96 / crowW(D, items, h * 1.2)), y = R.y0 + h * 1.6;
    var ep = crowPos(D, R.cx, items, hh);
    items.forEach(function (it, i) {
      if (!it.op) { card(D, ep[i].cx, y, ep[i].w, hh, it.s, { col: i === 8 ? C.orange : vcol(+it.s.replace('−', '-')) }); return; }
      if (it.s === '＝') { TX(D, ep[i].cx, y, '＝', { size: hh * .55 }); return; }
      var q = (i - 1) / 2, k = CH.smooth(q * .2, q * .2 + .45, u);
      rr(D, ep[i].cx - hh * .3, y - hh * .32, ep[i].cx + hh * .3, y + hh * .32, { stroke: C.chalk, sw: 1.6, r: 4, a: 1 - k });
      if (k > 0) TX(D, ep[i].cx, CH.lerp(y - hh * 1.3, y, CH.ease(k)), OP[q], { size: hh * .6, col: C.yel, a: k });
    });
    chain(D, CH.rect(R.x0, R.y0 + h * 2.9, R.x1, R.y1), ['【6÷(−3)】×4＋2', '＝【〔(−2)〕×4】＋2', '＝【〔(−8)〕＋2】', '＝〔−6〕'], D.ph ? CH.smooth(.32, 1, t) : 0, { labs: ['', 'わり算', 'かけ算', 'たし算'], cols: [C.pink, C.orange, C.blue], size: s * 1.4, a: D.ph ? CH.smooth(.3, .4, t) : 0 });
  }

  K3.run({
    no: '第16時', title: '4つの数と四則・かっこで、目標の数をつくろう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '15.html', label: '◀ 第15時' }, { href: '17.html', label: '第17時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'カード −2、3、4、−6', q: '4枚のカードを1回ずつ全部使い、＋、−、×、÷ とかっこで、答えが 0 になる式を、できるだけたくさんつくろう。（例）答えが 10 … {4＋(−6)}×{(−2)−3}',
        notes: ['① 自分の考え（3分）　式を書いて、計算して確かめよう。', '② ペアの考え（3分）　自分とちがう式を書こう。'],
        draw: start },
      { tag: '今日の問い', q: '例の式 {4＋(−6)}×{(−2)−3} は、本当に 10 になる？ 計算の順序を守って確かめよう。', a: '10', sub: '4＋(−6)＝−2、(−2)−3＝−5、(−2)×(−5)＝10', dur: 6,
        b: { t: '例 {4＋(−6)}×{(−2)−3}＝(−2)×(−5)＝<b>10</b>', col: C.yel },
        draw: function (D) { cardsChain(D, EX10, ['【{4＋(−6)}】×【{(−2)−3}】', '＝【〔(−2)〕×〔(−5)〕】', '＝〔10〕'], ['', 'かっこの中', 'かけ算'], D.t, { goal: 10 }); } },
      { tag: '今日の問い', q: '答えが 0 になる式は？', a: '（例）4×{(−6)÷(−2)−3}、(−6)＋3×{(−2)＋4}', sub: '(−6)÷(−2)＝3、3−3＝0、4×0＝0 ／ (−2)＋4＝2、3×2＝6、(−6)＋6＝0', dur: 7,
        b: { t: '0 … 4×{(−6)÷(−2)−3}、(−6)＋3×{(−2)＋4} など', col: C.yel },
        draw: function (D) { if (!D.ph) { start(D); return; } two(D, D.t, [[['4×{【(−6)÷(−2)】−3}', '＝4×【{〔3〕−3}】', '＝【4×〔0〕】', '＝〔0〕'], ['', 'わり算', 'ひき算', 'かけ算']], [['(−6)＋3×{【(−2)＋4】}', '＝(−6)＋【3×〔2〕】', '＝【(−6)＋〔6〕】', '＝〔0〕'], ['', 'かっこの中', 'かけ算', 'たし算']]], ['式の例 1', '式の例 2']); } },
      { tag: 'ことば', bh: 'ことば', q: '計算の順序は？ 5−3×(−2) と (5−3)×(−2) の答えをくらべよう。かっこをつけると、どうなる？', a: 'かっこの中・累乗 → 乗除 → 加減。かっこで順序を変えられる', sub: '5−3×(−2)＝5−(−6)＝11、(5−3)×(−2)＝2×(−2)＝−4。つくった式は、計算の順序どおりに計算して確かめる', dur: 6,
        b: [{ t: '計算の順序 … <b>かっこの中・累乗</b> → <b>乗除</b> → <b>加減</b>', col: C.green }, { t: 'かっこをつけると、計算の <b>順序</b> を変えられる（11 と −4）', col: C.green }, { t: 'つくった式は、計算して <b>確かめる</b>', col: C.green }],
        draw: function (D) { two(D, D.ph ? D.t : 0, [[['5−【3×(−2)】', '＝【5−〔(−6)〕】', '＝〔11〕'], ['', 'かけ算', 'ひき算']], [['【(5−3)】×(−2)', '＝【〔2〕×(−2)】', '＝〔−4〕'], ['', 'かっこの中', 'かけ算']]], ['かっこなし', 'かっこあり']); } },
      { tag: '例題', bh: '例題　式を確かめる', q: '（1）目標の数は 24。ある班の式 3×{4−(−2)}−(−6) を、計算の順序を守って確かめよう。', a: '24', sub: '① かっこの中 4−(−2)＝6　② かけ算 3×6＝18　③ ひき算 18−(−6)＝24', dur: 7,

      { tag: '例題', q: '（2）ゆうさんは、目標の数「6」の式として 4＋(−6)÷(−2)×3 をつくった。本当に 6 になるだろうか。', a: 'ならない（13 になる）', sub: '(−6)÷(−2)＝3、3×3＝9、4＋9＝13。たし算より、わり算・かけ算が先', dur: 7,
        b: { t: '（2）4＋3×3＝4＋9＝<b>13</b>（6 にはならない）', col: C.pink },
        draw: function (D) { cardsChain(D, EXY, ['4＋【(−6)÷(−2)】×3', '＝4＋【〔3〕×3】', '＝【4＋〔9〕】', '＝〔13〕'], ['', 'わり算', 'かけ算', 'たし算'], D.t, { goal: 6 }); } },
      { tag: '考えよう', bh: '考えよう', q: '−2、3、4、−6 を1回ずつ使って、答えができるだけ大きくなる式と、できるだけ小さくなる式を、つくろう。',
        notes: ['いちばん大きくなる式・小さくなる式と、その理由を書こう。', 'スライダーで、カードのならべ方・記号・かっこの入れ方を変えて、答えを調べられます。'],
        sliders: [{ key: 'p', label: 'ならべ方', min: 0, max: 23, step: 1, val: pi(EX10.p), fmt: function (i) { return PERM[i].map(function (k) { return S(CD[k]); }).join(' '); } },
          { key: 'j', label: '記号', min: 0, max: 63, step: 1, val: jOf(EX10.o), fmt: function (j) { return opsOf(j).join(' '); } },
          { key: 'k', label: 'かっこ', min: 0, max: 5, step: 1, val: 3, fmt: function (k) { return BRN[k]; } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '3つの □ に、＋、−、×、÷ のうち、ちがう記号を入れて、式を完成させよう。6 □ (−3) □ 4 □ 2＝−6', a: '6÷(−3)×4＋2', sub: '6÷(−3)＝−2、(−2)×4＝−8、(−8)＋2＝−6。ちがう記号の入れ方のうち、−6 になるのは この1通りだけ', dur: 6,
        b: { t: '6<b>÷</b>(−3)<b>×</b>4<b>＋</b>2＝−2×4＋2＝<b>−6</b>', col: C.orange },

    ])
  });
