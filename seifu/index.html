<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正負の数の黒板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
<style>
/* 目次：黒板に、23時間を並べる */
html,body{height:auto}
.app{height:auto;min-height:100%}
.menu{padding:.4rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.menu p.lead{margin:0;font-family:var(--f-chalk);font-weight:600;color:var(--chalk-2);font-size:1.05rem;line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:.6rem}
.list li{display:flex;flex-direction:column;gap:.3rem;padding:.65rem .9rem;border:2px solid var(--chalk-4);border-radius:12px;min-width:0}
.list li.on{border-color:var(--chalk-3);background:rgba(242,240,230,.05)}
.list .no{font-family:var(--f-chalk);font-weight:600;font-size:.9rem;color:var(--chalk-2)}
.list .ttl{font-family:var(--f-chalk);font-weight:600;font-size:1.1rem;line-height:1.45}
.list li:not(.on) .ttl{color:var(--chalk-2)}
.list .go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.15rem}
.list .soon{font-size:.85rem;color:var(--chalk-3)}
</style>
</head>
<body>
<div class="app" lang="ja">
  <div class="board">
    <header class="bar"><h1><small>中1</small>正負の数の黒板（目次）</h1></header>
    <div class="track" aria-hidden="true"></div>
    <main class="menu">
      <p class="lead">電子黒板に映して、図を動かしながら考える授業のページ。23時間ぶん、どの時間からでも開けます。</p>
      <ul class="list" id="list"></ul>
    </main>
  </div>
</div>
<script>
(function () {
  /* 時間ごとの題名は、ikkan の正負の数と同じ */
  var L = [
    ['第1時', '反対の性質をもつ量を、1つの数で表そう', [['01.html', 'ひらく ▶']]],
    ['第2時', '数直線の上に、負の数の場所をつくろう', [['02.html', 'ひらく ▶']]],
    ['第3時', '0からのきょりに目をつけて、数をくらべよう', [['03.html', 'ひらく ▶']]],
    ['第4時', '赤と黒のカードで、得点を計算しよう', [['04.html', 'ひらく ▶']]],
    ['第5時', '2つの数の和の符号と絶対値は、どう決まるだろう', [['05.html', 'ひらく ▶']]],
    ['第6時', 'たす順番を変えて、らくに計算しよう', [['06.html', 'ひらく ▶']]],
    ['第7時', 'ひき算は、たし算に直せるだろうか', [['07.html', 'ひらく ▶']]],
    ['第8時', '加法と減法の混じった式を、項の和とみて計算しよう', [['08.html', 'ひらく ▶']]],
    ['第9時', '加法・減法を、速く正確にできるようになろう', [['09.html', 'ひらく ▶']]],
    ['第10時', '負の数をかけると、積はどうなるだろう', [['10.html', 'ひらく ▶']]],
    ['第11時', 'いくつもの数をかけるとき、符号はどう決まるだろう', [['11.html', 'ひらく ▶']]],
    ['第12時', 'わり算を、かけ算に直して計算しよう', [['12.html', 'ひらく ▶']]],
    ['第13時', '乗法と除法の混じった式を、計算しよう', [['13.html', 'ひらく ▶']]],
    ['第14時', '計算の順序を守って、四則の混じった式を計算しよう', [['14.html', 'ひらく ▶']]],
    ['第15時', '分配法則を使って、くふうして計算しよう', [['15.html', 'ひらく ▶']]],
    ['第16時', '4つの数と四則・かっこで、目標の数をつくろう', [['16.html', 'ひらく ▶']]],
    ['第17時', '計算のまちがいを見つけて、正しく直そう', [['17.html', 'ひらく ▶']]],
    ['第18時', '数の範囲を広げると、いつでもできる計算が、どう変わるか調べよう', [['18.html', 'ひらく ▶']]],
    ['第19時', '自然数を、素数の積で表そう', [['19.html', 'ひらく ▶']]],
    ['第20時', '素因数分解から、数のひみつを読み取ろう', [['20.html', 'ひらく ▶']]],
    ['第21時', '基準を決めて、平均をくふうして求めよう', [['21.html', 'ひらく ▶']]],
    ['第22時', '正負の数を使って、変化のようすを説明しよう', [['22.html', 'ひらく ▶']]],
    ['第23時', '「正の数・負の数」で学んだことを、整理して確かめよう', [['23.html', 'ひらく ▶']]]
  ];
  document.getElementById('list').innerHTML = L.map(function (x) {
    var on = !!x[2];
    return '<li' + (on ? ' class="on"' : '') + '><span class="no">' + x[0] + '</span><span class="ttl">' + x[1] + '</span>' +
      (on ? '<span class="go">' + x[2].map(function (l) { return '<a class="btn primary" href="' + l[0] + '">' + l[1] + '</a>'; }).join('') + '</span>' : '<span class="soon">準備中</span>') + '</li>';
  }).join('');
})();
</script>
</body>
</html>
