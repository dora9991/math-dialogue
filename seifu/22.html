/* 正の数・負の数 第22時：正負の数を使って、変化のようすを説明しよう（ikkan の lesson_seifu_22 と同じ流れ）。

(function () {

    if (lab) TX(D, L.X(v), L.y - L.s * (o.up || 1.15), lab, { col: o.tc || col, size: o.size || L.s, a: o.a, outline: OUT });
  }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

  /* 階段のグラフ：v（その日の値）、d（ちがい）。o：y、yt、unit、kd(i)（i 番目の矢印 0→1）、net（はじめとのちがいの矢印）、fmt、from（はじめの日の点を出すか） */
