<script>
/* 正の数・負の数 第9時：加法・減法を、速く正確にできるようになろう（ikkan の lesson_seifu_09 と同じ流れ）。

   考えようは、まちがい探し（はじめの数・たす数のスライダーで、矢印を確かめる道具。答えは出さない）。
   数値は ikkan のまま。答えはページの中で計算し直している（CH.check）。 */
(function () {
  var C = CH.C, S = CH.mnum, NEG = C.pink, POS = C.blue;
  /* ---- 道具（正負の数の黒板 第9〜16時で共通。どのページにも同じものを入れてある） ---- */
  var FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = fr(s[k]); }); if (s.notes) s.notes = s.notes.map(fr); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = fr(b.t); }); }); return st; }

  function parse(s) {

    if (i < s.length) out.push({ t: s.slice(i) });

  function mw(D, t, size) { var g = D.ctx; g.save(); g.font = '600 ' + size + 'px ' + FONT; var w = g.measureText(t).width; g.restore(); return w; }

  function TW(D, s, size) { return parse(s).reduce(function (w, p) { return w + segW(D, p, size); }, 0); }

  function TX(D, x, y, s, o) {
    o = o || {}; var size = o.size || CH.fs(D), fz = size * .72, w = TW(D, s, size), x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, oo = { col: o.col, a: o.a, outline: o.outline };
    parse(s).forEach(function (p) {
      var pw = segW(D, p, size);
      if (p.t != null) CH.text(D, x0, y, p.t, ext({ size: size, align: 'left' }, oo));
      else if (p.p) CH.text(D, x0 + size * .05, y - size * .42, p.p, ext({ size: size * .6, align: 'left' }, oo));
      else {

  /* 幅 maxW に入る大きさ */

    g.save(); g.globalAlpha = D.ga * (o.a == null ? 1 : o.a); g.beginPath();

  /* 数の色：正は青、負は赤（ピンク）、0 は白 */

  function NL(D, x0, x1, y, min, max, o) {
    o = o || {}; var X = function (v) { return x0 + (v - min) / (max - min) * (x1 - x0); }, s = o.size || CH.fs(D, .8), st = o.step || 1, mj = o.major || st, n = Math.round((max - min) / st);
    CH.arrow(D, x0 - s * .5, y, x1 + s * 1.3, y, { w: 2, head: 9, a: o.a });
    for (var k = 0; k <= n; k++) {
      var v = min + k * st, q = v / mj, big = Math.abs(q - Math.round(q)) < 1e-6;
      CH.line(D, X(v), y - (big ? 7 : 4), X(v), y + (big ? 7 : 4), { w: big ? 1.8 : 1.2, a: o.a });
      if (big && o.lab !== false) { var L = o.fmt ? o.fmt(v) : S(Math.round(v * 1e6) / 1e6); if (L != null && L !== '') TX(D, X(v), y + s * (hasFr(L) ? 1.7 : 1.25), L, { size: s, a: o.a, col: Math.abs(v) < 1e-9 ? C.yel : C.chalk }); }
    }

  }
  /* 数直線の上の矢印（a から b へ。k は 0〜1 の のび）。lab は上に書く字 */
  function arw(D, X, y, a, b, col, k, lab, o) {
    o = o || {}; k = CH.clamp(k, 0, 1); if (k <= 0) return; var x0 = X(a), x1 = X(a + (b - a) * k), s = o.size || CH.fs(D, .8);
    CH.circle(D, x0, y, 3.4, { fill: col, a: o.a });
    if (Math.abs(x1 - x0) > 2) CH.arrow(D, x0, y, x1, y, { col: col, w: o.w || 3, head: Math.min(11, Math.abs(x1 - x0) * .6), a: o.a });
    if (lab && k >= 1) TX(D, (x0 + x1) / 2, y - s * (hasFr(lab) ? 1.35 : .95), lab, { size: s, col: col, a: o.a, outline: 'rgba(20,40,30,.9)' });
  }
  /* 数直線の上の点 */
  function dot(D, x, y, col, lab, o) {
    o = o || {}; var s = o.size || CH.fs(D, .8);

    if (lab) TX(D, x, y + (o.up ? -1 : 1) * s * (hasFr(lab) ? 1.9 : 1.5) * (o.k || 1), lab, { size: s, col: col, a: o.a, outline: 'rgba(20,40,30,.9)' });
  }
  /* 式を1行ずつ計算していく（板書の形）。L：['10−【(−2)^2】×3', '＝10−〔4〕×3', …]

    if (a4 > 0) TX(D, R.cx, yD, '(＋10)＋(−19)＝−9', { size: Math.min(z, fit(D, '(＋10)＋(−19)＝−9', R.w, z)), col: C.yel, a: a4 });
  }

  /* ---- 例題：上に「符号 → 絶対値」の行、下に数直線の矢印 ---- */
  function ex(D, t, o) {
    var R = CH.box(D, { l: .05, r: .05, t: .04, b: .06 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .6), n = o.lines.length;
    var z = Math.min(s * 1.15, top.h / n / (o.frac ? 2.3 : 1.7)), lh = top.h / n;
    o.lines.forEach(function (L, i) {
      var a = i === 0 ? 1 : CH.smooth(o.at[i - 1], o.at[i - 1] + .12, t), zz = fit(D, L[0], top.w, i === 0 ? z * 1.25 : z);
      if (a > 0) TX(D, top.x0, top.y0 + lh * (i + .5), L[0], { size: zz, col: L[1] || C.chalk, a: a, align: 'left' });
    });
    var sn = CH.fs(D, .8), y = R.y1 - sn * 2.2, x0 = R.x0 + sn, x1 = R.x1 - sn * 1.8, nl = o.nl;
    var X = NL(D, x0, x1, y, nl.min, nl.max, { step: nl.step, major: nl.major, fmt: nl.fmt, size: sn });
    arw(D, X, y - sn * 1.3, 0, o.a, vcol(o.a), CH.smooth(.6, .75, t), o.la, { size: sn });
    arw(D, X, y - sn * 3.4, o.a, o.a + o.b, vcol(o.b), CH.smooth(.77, .9, t), o.lb, { size: sn });
    var kr = CH.smooth(.9, 1, t);
    if (kr > 0) { CH.line(D, X(o.a + o.b), y - sn * 3.4, X(o.a + o.b), y, { col: C.yel, dash: [4, 4], a: kr }); dot(D, X(o.a + o.b), y, C.yel, o.dl, { a: kr, size: sn }); }
  }
  var EX1 = { lines: [['−2.4＋0.9'], ['① 符号 … 絶対値は 2.4 ＞ 0.9 → −', C.pink], ['② 絶対値 … 2.4−0.9＝1.5', C.orange], ['③ 答え … −1.5', C.yel]], at: [.05, .25, .45],
    a: -2.4, b: .9, la: '−2.4', lb: '＋0.9', nl: { min: -3, max: 1, step: .1, major: .5 } };
  var EX2 = { frac: true, lines: [['[1/4]−[5/6]'], ['① 通分 … ＝[3/12]−[10/12]', C.blue], ['② 符号 … [10/12] のほうが大きい → −', C.pink], ['③ 絶対値 … [10/12]−[3/12]＝[7/12]', C.orange], ['④ 答え … −[7/12]', C.yel]], at: [.04, .2, .36, .5],
    a: 3 / 12, b: -10 / 12, la: '＋[3/12]', lb: '−[10/12]', dl: '−[7/12]', nl: { min: -1, max: .5, step: 1 / 12, major: 1 / 12, fmt: function (v) { return Math.abs(v - Math.round(v)) < 1e-9 ? S(Math.round(v)) : ''; } } };

  /* ---- 考えよう：まちがいカードと、たし算の矢印の道具 ---- */
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .04 }), s = CH.fs(D), a = D.V.a, b = D.V.b, h = Math.min(s * 2.4, R.h * .2);
    var cs = [['ア　−5−3＝−2'], ['イ　6−(−2)＝4']], cw = Math.min(R.w * .46, s * 11);
    cs.forEach(function (c, i) {
      var cx = R.cx + (i - .5) * (cw + R.w * .04);
      rr(D, cx - cw / 2, R.y0, cx + cw / 2, R.y0 + h, { fill: 'rgba(242,240,230,.06)', stroke: C.chalk, sw: 1.6 });
      TX(D, cx, R.y0 + h / 2, c[0], { size: fit(D, c[0], cw * .8, s * 1.05) });
      TX(D, cx + cw / 2 - s * .2, R.y0 + s * .2, '？', { size: s * 1.1, col: C.pink, align: 'right' });
    });
    var sn = CH.fs(D, .78), y = R.y1 - sn * 2, x0 = R.x0 + sn, x1 = R.x1 - sn * 1.8, e = { min: -12, max: 12, step: 1 };
    var X = NL(D, x0, x1, y, -12, 12, { step: 1, major: major(D, x0, x1, e, sn), size: sn });
    var eq = S(a) + '＋' + (b < 0 ? '(' + S(b) + ')' : S(b)) + '＝' + S(a + b);
    TX(D, R.cx, R.y0 + h + (y - sn * 4.6 - R.y0 - h) / 2, eq, { size: Math.min(s * 1.4, (y - R.y0 - h) * .3), col: C.yel });
    if (a !== 0) arw(D, X, y - sn * 1.3, 0, a, vcol(a), 1, (a > 0 ? '＋' : '') + S(a), { size: sn });
    if (b !== 0) arw(D, X, y - sn * 3.3, a, a + b, vcol(b), 1, (b > 0 ? '＋' : '') + S(b), { size: sn });
    dot(D, X(a + b), y, C.yel, null, { size: sn });
  }

  /* ---- チャレンジ：まちがえた計算を、もどってから正しく ---- */
  function chal(D, t) {
    var R = CH.box(D, { l: .05, r: .05, t: .04, b: .06 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .5);
    if (D.ph) chain(D, top, ['□−[2/3]＝−[5/6]', '□＝−[5/6]＋[2/3]＝−[1/6]', '正しい答え　−[1/6]＋[2/3]＝[1/2]'], CH.smooth(0, .75, t), { size: s * 1.05, align: 'left', cols: [C.orange, C.blue, C.yel] });
    var sn = CH.fs(D, .8), y = R.y1 - sn * 2.6, x0 = R.x0 + sn, x1 = R.x1 - sn * 1.8;
    var X = NL(D, x0, x1, y, -1, 1, { step: 1 / 6, major: 1 / 6, size: sn, fmt: function (v) { return Math.abs(v - Math.round(v)) < 1e-9 ? S(Math.round(v)) : ''; } });
    var k0 = D.ph ? CH.smooth(0, .12, t) : 0, k1 = CH.smooth(.15, .4, t), k2 = CH.smooth(.5, .78, t), k3 = CH.smooth(.8, .95, t);
    dot(D, X(-5 / 6), y, C.pink, '−[5/6]', { size: sn, a: D.ph ? 1 : 0 });
    if (D.ph) TX(D, X(-5 / 6), y - sn * 1.2, 'まちがえた答え', { size: sn * .85, col: C.pink, a: k0 * (1 - k1) });
    arw(D, X, y - sn * 1.3, -5 / 6, -1 / 6, C.orange, k1, '＋[2/3]（もどす）', { size: sn });
    if (k1 >= 1) dot(D, X(-1 / 6), y, C.orange, '□', { size: sn, k: .8 });
    arw(D, X, y - sn * 3.6, -1 / 6, 1 / 2, C.blue, k2, '＋[2/3]', { size: sn });
    if (k3 > 0) { CH.line(D, X(.5), y - sn * 3.6, X(.5), y, { col: C.yel, dash: [4, 4], a: k3 }); dot(D, X(.5), y, C.yel, '[1/2]', { size: sn, a: k3 }); }
  }

  K3.run({
    no: '第9時', title: '加法・減法を、速く正確にできるようになろう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '08.html', label: '◀ 第8時' }, { href: '10.html', label: '第10時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'ア 整数　イ 小数　ウ 分数', q: '次の3つの計算をして、計算のしかたの、同じところとちがうところを見つけよう。　ア −9＋4　イ −0.9＋0.4　ウ −[1/2]＋[1/3]',
        notes: ['① 自分の考え（3分）　同じところ・ちがうところを書こう。', '② ペアの考え（3分）　自分とちがう気づきを、教え合おう。'],
        draw: function (D) { trio(D, 0); } },
      { tag: '今日の問い', q: '3つの答えは？ 計算のしかたの、同じところ・ちがうところは？', a: 'ア −5　イ −0.5　ウ −[1/6]', sub: '同じ … 答えの符号は、絶対値の大きいほうの符号（−）。ちがう … 分数は、通分してから計算する（−[3/6]＋[2/6]）', dur: 6,
        b: [{ t: 'ア −9＋4＝<b>−5</b>　イ −0.9＋0.4＝<b>−0.5</b>', col: C.yel }, { t: 'ウ −[1/2]＋[1/3]＝−[3/6]＋[2/6]＝<b>−[1/6]</b>（分数は <b>通分</b>）', col: C.yel }],
        draw: function (D) { trio(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '4−11＋6−8 のように、加法と減法の混じった式は、どう見ると計算しやすい？ 答えの符号は、いつ決める？', a: '項の和とみる。符号を先に決める',
        sub: '(＋4)＋(−11)＋(＋6)＋(−8) の和。正の項 ＋10 と 負の項 −19 をまとめて −9。答えの符号は、絶対値の大きいほうの符号', dur: 5,
        b: [{ t: '混じった式は、<b>加法だけ</b>の式に直し、<b>項</b>の和とみる', col: C.green }, { t: '正の項・負の項を、それぞれ <b>まとめて</b> 計算する', col: C.green }, { t: '答えの <b>符号</b> を先に決めて、絶対値を計算する。分数は <b>通分</b>', col: C.green }],
        draw: function (D) { terms(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　符号を先に決める', q: '（1）−2.4＋0.9 を計算しよう。答えの符号を先に決めてから、絶対値を計算しよう。', a: '−1.5', sub: '絶対値は 2.4 のほうが大きいから、符号は −。絶対値は 2.4−0.9＝1.5', dur: 5,
        b: { t: '（1）符号 −、2.4−0.9＝1.5 → <b>−1.5</b>', col: C.pink },
        draw: function (D) { ex(D, D.ph ? D.t : 0, EX1); } },
      { tag: '例題', q: '（2）[1/4]−[5/6] を計算しよう。', a: '−[7/12]', sub: '通分して [3/12]−[10/12]。[10/12] のほうが大きいから、符号は −。10−3＝7', dur: 6,
        b: { t: '（2）[3/12]−[10/12] → 符号 −、[10/12]−[3/12] → <b>−[7/12]</b>', col: C.pink },
        draw: function (D) { ex(D, D.ph ? D.t : 0, EX2); } },
      { tag: '考えよう', bh: '考えよう', q: 'ある人が、ア −5−3＝−2、イ 6−(−2)＝4 と計算した。どこでまちがえたのだろう。正しい答えと、まちがいの理由を説明しよう。',
        notes: ['まちがえないための、くふうも書こう。', 'ひき算は、たし算に直してから、数直線で確かめよう。', 'スライダーで、はじめの数と たす数を変えると、矢印で確かめられます。'],
        sliders: [{ key: 'a', label: 'はじめの数', min: -6, max: 6, step: 1, val: -5, fmt: S }, { key: 'b', label: 'たす数', min: -6, max: 6, step: 1, val: 0, fmt: S }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'ある数に [2/3] をたすところを、まちがえてひいてしまったので、答えが −[5/6] になった。正しい答えを求めよう。', a: '[1/2]',
        sub: 'ある数を □ とすると □−[2/3]＝−[5/6]。□＝−[5/6]＋[4/6]＝−[1/6]。正しい答えは −[1/6]＋[4/6]＝[3/6]＝[1/2]', dur: 6,
        b: { t: '□＝−[5/6]＋[2/3]＝−[1/6] → −[1/6]＋[2/3]＝<b>[1/2]</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
