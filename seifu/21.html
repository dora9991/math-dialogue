<script>
/* 正の数・負の数 第21時：基準を決めて、平均をくふうして求めよう（ikkan の lesson_seifu_21 と同じ流れ）。
   記録の棒グラフに基準の線をひき、基準とのちがいを正（青）・負（ピンク）で色分け。ちがいをならすと、棒が平均の線にそろう。
   数値は ikkan のまま（メロンパン 62・55・58・66・54、基準 60 と 55、最高気温、5回のテスト、通学時間、A班・B班）。
   平均・ちがいの合計は、ページの中で計算し直して照らし合わせている。 */
(function () {
  var C = CH.C, RED = '#ff7b7b', FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  /* ---- 図の中の式：a^2（指数）・[1/2]（たての分数）・{…}（印をつける場所。字にはならない）。

  function TX(D, x, y, s, o) {
    o = o || {}; var g = D.ctx, size = o.size || CH.fs(D), fz = size * .72, ez = size * .6, segs = [], sp = [], open = [], w = 0, m;
    var re = /\[([^\/\]]+)\/([^\]]+)\]|\^(\d+)|([{}])|([^\[\^{}]+|[\[\^])/g;
    g.save();
    while ((m = re.exec(String(s)))) {
      if (m[1] != null) { g.font = '600 ' + fz + 'px ' + FONT; var fw = Math.max(g.measureText(m[1]).width, g.measureText(m[2]).width) + fz * .4; segs.push({ n: m[1], d: m[2], x: w, w: fw }); w += fw; }
      else if (m[3] != null) { g.font = '600 ' + ez + 'px ' + FONT; var ew = g.measureText(m[3]).width + size * .2; segs.push({ e: m[3], x: w, w: ew }); w += ew; }
      else if (m[4] === '{') { open.push(sp.length); sp.push([w, w]); }
      else if (m[4] === '}') sp[open.pop()][1] = w;

    }

    var x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, oo = { col: o.col, a: o.a, outline: o.outline };

      var X = x0 + q.x;
      if (q.t != null) CH.text(D, X, y, q.t, Object.assign({ size: size, align: 'left' }, oo));
      else if (q.e != null) CH.text(D, X + size * .15, y - size * .38, q.e, Object.assign({ size: ez, align: 'left' }, oo));
      else { var cx = X + q.w / 2; CH.text(D, cx, y - fz * .62, q.n, Object.assign({ size: fz }, oo)); CH.text(D, cx, y + fz * .68, q.d, Object.assign({ size: fz }, oo)); CH.line(D, X + fz * .15, y + fz * .04, X + q.w - fz * .15, y + fz * .04, { col: o.col || C.chalk, w: Math.max(1.3, size * .07), a: o.a }); }
    });

  function fit(D, s, maxW, size) { var w = TX(D, 0, 0, s, { size: size, measure: true }).w; return w > maxW ? size * maxW / w : size; }

  function H(s) { return CH.fr(String(s)).replace(/\^(\d+)/g, '<sup>$1</sup>').replace(/[{}]/g, ''); }
  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = H(s[k]); }); if (s.notes) s.notes = s.notes.map(H); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = H(b.t); }); }); return st; }

  }
  /* ✗ と ○ と ①（丸の中の番号） */
  function ng(D, x, y, z, a) { if (a <= 0) return; var d = z * .32; CH.line(D, x - d, y - d, x + d, y + d, { col: RED, w: Math.max(3, z * .13), a: a }); CH.line(D, x + d, y - d, x - d, y + d, { col: RED, w: Math.max(3, z * .13), a: a }); }
  function okm(D, x, y, z, a, col) { if (a > 0) CH.circle(D, x, y, z * .36, { stroke: col || C.green, sw: Math.max(2.6, z * .11), a: a }); }

  function ncard(D, x, y, w, h, txt, col, a, o) {

  /* ---- 数直線（第2時などと同じ形。右に矢印、正は青・負はピンク） ---- */

    var lab = o.lab || [1, 2, 5, 10, 20, 50].filter(function (q) { return q * u >= s * 2.1; })[0] || 100, st = o.st || (u < 6 ? lab : 1);
    CH.arrow(D, x0 - s * .5, y, x1 + s * 1.1, y, { w: 2, head: 9, a: a });
    for (var v = Math.ceil(min / st) * st; v <= max + 1e-9; v += st) {
      var isL = Math.abs(v / lab - Math.round(v / lab)) < 1e-9, h = v === 0 ? 9 : isL ? 7 : 4, la = a * (o.la ? o.la(v) : 1);
      CH.line(D, X(v), y - h, X(v), y + h, { w: v === 0 ? 2.4 : 1.5, a: a });
      if (isL && la > 0) CH.text(D, X(v), y + s * 1.25, o.fmt ? o.fmt(v) : S(v), { size: s, num: true, a: la, col: o.lc ? o.lc(v) : C.chalk });
    }
    return { X: X, y: y, s: s, u: u, x0: x0, x1: x1 };
  }
  function pt(D, L, v, col, lab, o) {
    o = o || {}; CH.circle(D, L.X(v), L.y, o.r || L.s * .36, { fill: col, stroke: 'rgba(20,30,24,.8)', sw: 1.2, a: o.a });
    if (lab) TX(D, L.X(v), L.y - L.s * (o.up || 1.15), lab, { col: o.tc || col, size: o.size || L.s, a: o.a, outline: OUT });
  }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function r2(x) { return Math.round(x * 100) / 100; }
  function diffs(v, b) { return v.map(function (x) { return r2(x - b); }); }
  /* メロンパン */
  var MP = [62, 55, 58, 66, 54], DAY = ['月', '火', '水', '木', '金'];
  CH.check(CH.near(sum(MP) / 5, 59) && diffs(MP, 60).join() === '2,-5,-2,6,-6' && sum(diffs(MP, 60)) === -5 && CH.near(60 + sum(diffs(MP, 60)) / 5, 59), '今日の問い（基準 60）');
  CH.check(diffs(MP, 55).join() === '7,0,3,11,-1' && sum(diffs(MP, 55)) === 20 && CH.near(55 + 20 / 5, 59), '例題（1）基準 55');
  /* 最高気温（基準 25） */
  var KI = [24, 27, 22, 25, 26];
  CH.check(CH.near(sum(KI) / 5, 24.8) && diffs(KI, 25).join() === '-1,2,-3,0,1' && CH.near(25 + sum(diffs(KI, 25)) / 5, 24.8), '例題（2）気温');
  /* 5回のテスト（基準 70、平均 68） */
  var TD = [-3, 4, -8, -5], T5 = (68 - 70) * 5 - sum(TD);
  CH.check(sum(TD) === -12 && T5 === 2 && 70 + T5 === 72 && CH.near((67 + 74 + 62 + 65 + 72) / 5, 68), '例題（3）5回目');
  /* 考えよう（答えはページに出さない） */
  var TU = [12, 18, 15, 21, 14];
  CH.check(CH.near(sum(TU) / 5, 16) && CH.near(12 + sum(diffs(TU, 12)) / 5, 16) && CH.near(15 + sum(diffs(TU, 15)) / 5, 16), '考えよう（ここで確かめるだけ）');
  /* チャレンジ：A班 66点×4人、B班 71点×6人、基準 70 */
  var AB = [66, 66, 66, 66, 71, 71, 71, 71, 71, 71];
  CH.check(CH.near(sum(AB) / 10, 69) && sum(diffs(AB.slice(0, 4), 70)) === -16 && sum(diffs(AB.slice(4), 70)) === 6 && CH.near(70 + sum(diffs(AB, 70)) / 10, 69), 'チャレンジ 69点');

  /* ---- 棒グラフ：ちがいの行・基準の線・ならす ----

  function bars(D, R, vals, o) {

    var lv = CH.ease(o.lv || 0), bw = Ax.R.w / n, z = Math.min(s * 1.05, bw * .42);
    vals.forEach(function (v, i) {
      var vv = CH.lerp(v, o.avg == null ? v : o.avg, lv), x0 = Ax.X(i + .18), x1 = Ax.X(i + .82), yb = Ax.Y(o.y[0]), yt = Ax.Y(vv), d = o.base == null ? 0 : r2(v - o.base), da = o.dA ? o.dA(i) : 0;
      CH.fillRect(D, x0, yt, x1, yb, { fill: 'rgba(242,240,230,.13)', stroke: 'rgba(242,240,230,.75)', sw: 1.6 });
      if (o.base != null && da > 0 && Math.abs(vv - o.base) > 1e-9) { var col = vv > o.base ? POS : NEG; CH.fillRect(D, x0, Ax.Y(o.base), x1, yt, { fill: hexA(col, .45), stroke: col, sw: 2, a: da }); }
      if (lv < .05) CH.text(D, (x0 + x1) / 2, yt - z * .75, S(v), { size: z, num: true, a: 1 - lv * 20 });
      CH.text(D, (x0 + x1) / 2, Ax.R.y1 + z * .95, o.names[i], { size: z * .95 });
      if (o.base != null && da > 0) TX(D, (x0 + x1) / 2, R.y0 + top * .5, sg(d), { size: z * 1.05, col: sc(d) === C.yel ? C.chalk : sc(d), a: da });
    });
    if (o.base != null) {

      CH.text(D, Ax.R.x1 + s * .5, Ax.Y(o.base) - s * .55, '基準 ' + S(o.base), { size: s * .8, col: C.yel, align: 'left', a: ba });
      CH.text(D, R.x0, R.y0 + top * .5, o.tag || 'ちがい', { size: Math.min(s * .8, CH.fitSize(D, o.tag || 'ちがい', Ax.R.x0 - R.x0 - 4, s * .8)), col: 'rgba(242,240,230,.75)', align: 'left', a: o.dA ? Math.max.apply(null, vals.map(function (_, i) { return o.dA(i); })) : 0 });

    return Ax;
  }
  /* 下の式の行 */
