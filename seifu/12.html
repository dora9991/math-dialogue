      var x = x2, bw = TW(D, '(＋4)', z) * 1.08;
      if (a1 < .5) { rr(D, x + bw * .2, y - z * .55, x + bw * .8, y + z * .55, { stroke: C.chalk, sw: 1.8, r: 3, a: 1 - a1 * 2 }); }
      else TX(D, x + bw / 2, y, PQ(qv), { size: z, col: vcol(qv), a: (a1 - .5) * 2 });
      TX(D, x + bw, y, '×' + PQ(o.b) + '＝' + P(o.a), { size: z, align: 'left' });
      if (a2 > 0) { var cw = Math.max(z * 2.6, TW(D, P(qv), z) + z), cx = R.x1 - cw / 2; TX(D, cx - cw / 2 - z * .4, y, '商', { size: z * .8, align: 'right', col: C.yel, a: a2 }); card(D, cx, y, cw, z * 1.8, P(qv), { col: vcol(qv), a: a2, glow: true }); }
    });
    TX(D, R.cx, R.y1 + s * 1.3, '同符号の商 → ＋　　異符号の商 → −', { size: fit(D, '同符号の商 → ＋　　異符号の商 → −', R.w, s * 1.1), col: C.yel, a: D.ph ? CH.smooth(.88, 1, t) : 0 });
  }

  /* ---- ことば：逆数のカードがひっくり返る ---- */
  function flips(D, t) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .06 }), s = CH.fs(D), cs = CH.cols(CH.rect(R.x0, R.y0 + R.h * .12, R.x1, R.y0 + R.h * .75), 3, .06);

      var c = cs[i], u = CH.smooth(.05 + i * .25, .25 + i * .25, t), h = Math.min(c.h * .55, s * 3.6), w = Math.min(c.w * .8, h * 1.2), str = u < .5 ? ftx(p[0]) : ftx(p[1]);
      card(D, c.cx, c.y0 + c.h * .38, w, h, str, { col: NEG === scol(str) ? NEG : POS, sx: Math.cos(Math.PI * u), size: h * .44, glow: u >= 1 });

      var eq = ftx(p[0]) + '×' + (p[1].n < 0 ? '(' + ftx(p[1]) + ')' : ftx(p[1])) + '＝1';
      TX(D, c.cx, c.y1 - s * .4, eq, { size: fit(D, eq, c.w, s * 1.05), col: C.yel, a: CH.smooth(.25 + i * .25, .32 + i * .25, t) });
    });
    var L = 'わる数の逆数をかける：　÷[3/5] は ×[5/3] と同じ';
    TX(D, R.cx, R.y1 - s * 1.2, L, { size: fit(D, L, R.w, s * 1.15), col: C.orange, a: CH.smooth(.9, 1, t) });
  }

  /* ---- 例題：÷ と わる数のカードがひっくり返る ---- */
  function exRow(D, e, t) {
    var R = CH.box(D, { l: .05, r: .05, t: .08, b: .08 }), s = CH.fs(D), u = CH.smooth(.05, .4, t), inv = fdiv(F(1), e.b), ka = CH.smooth(.45, .65, t), kb = CH.smooth(.68, .85, t);
    var items = [{ s: ftx(e.a) }, { s: u < .5 ? '÷' : '×', op: 1, col: u < .5 ? C.chalk : C.yel, sx: Math.cos(Math.PI * u) }, { s: u < .5 ? ftx(e.b) : ftx(inv), sx: Math.cos(Math.PI * u), glow: u >= 1 }, { s: '＝', op: 1, a: kb }, { s: ftx(e.r), a: kb, glow: kb >= 1, minW: 1.6 }];
    var h = Math.min(s * 3.6, R.h * .3); h = Math.min(h, h * R.w / crowW(D, items, h));
    var pos = crow(D, R.cx, R.y0 + R.h * .3, items.map(function (it) { return it.op ? ext(it, { s: it.s }) : it; }), h);
    if (u > 0 && u < 1) arc(D, pos[2].x0, pos[2].x1, R.y0 + R.h * .3 - h * .62, C.yel, 1, { h: h * .15 });
    var sgn = e.r.n > 0 ? '＋' : '−', nn = [e.a, inv].filter(function (x) { return x.n < 0; }).length;
    var L1 = '逆数をかける：　' + ftx(e.a) + '×(' + ftx(inv) + ')', L2 = '負の数 ' + nn + '個 → 符号 ' + sgn + '　　絶対値 ' + ftx(F(Math.abs(e.a.n), e.a.d)) + '×' + ftx(F(Math.abs(inv.n), inv.d)) + '＝' + ftx(F(Math.abs(e.r.n), e.r.d));
    var z = Math.min(s * 1.15, fit(D, L2, R.w, s * 1.15), fit(D, L1, R.w, s * 1.15));
    TX(D, R.cx, R.y0 + R.h * .66, L1, { size: z, col: C.orange, a: CH.smooth(.38, .5, t) });
    TX(D, R.cx, R.y0 + R.h * .88, L2, { size: z, col: e.r.n > 0 ? POS : NEG, a: ka });
  }

  /* ---- 考えよう：□ をさがす ---- */
  function tool(D) {
    var R = CH.box(D, { l: .05, r: .05, t: .06, b: .06 }), s = CH.fs(D), d = TRY[D.V.k], x = D.V.x, ok = x * d[1] === d[0];

    var t2 = '□×' + d[1] + '＝' + S(d[0]) + ' の □ をさがそう';
    TX(D, R.cx, R.y0 + R.h * .3, t2, { size: fit(D, t2, R.w, s * 1.05), col: 'rgba(242,240,230,.8)' });
    var z = Math.min(s * 1.8, R.h * .14), items = [{ s: x < 0 ? '(' + S(x) + ')' : S(x), col: C.yel }, { s: '×', op: 1 }, { s: String(d[1]), col: C.chalk }, { s: '＝', op: 1 }, { s: S(x * d[1]), col: ok ? C.green : C.chalk }];
    var h = Math.min(z * 1.6, R.h * .2); h = Math.min(h, h * R.w * .9 / crowW(D, items, h));

  }

        b: { t: 'ア <b>＋4</b>　イ <b>−4</b>　ウ <b>−4</b>　エ <b>＋4</b>（同符号 → ＋、異符号 → −）', col: C.yel },
