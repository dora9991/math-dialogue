<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和の符号と絶対値</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script>
/* 正の数・負の数 第5時：2つの数の和の符号と絶対値は、どう決まるだろう（ikkan の lesson_seifu_05 と同じ流れ）。
   0 から1本目の矢印、その先から2本目の矢印をつなぐ（＋は右、−は左）。同じ向きなら長さがたされ、反対向きなら重なった部分が打ち消し合う（黄色）。
   例題は、符号 → 絶対値 → 答えの順に表がうまる。考えようは、はじめの数とたす数を動かす道具（和の数は書かない）。
   数値は ikkan のまま（ア〜エ (±3)＋(±5)、例題 (＋9)＋(＋4) ほか、チャレンジ ＋9 と −9）。ことばの図の (−2)＋(−4)・(＋6)＋(−4)・(＋4)＋(−4) は自作。
   答えはページの中で、「符号と絶対値のきまり」と、ふつうの計算の両方で確かめている。 */
(function () {
  var C = CH.C, S = CH.mnum, POS = C.blue, NEG = C.pink, OUT = 'rgba(20,40,30,.9)';
  function sg(v) { return v > 0 ? '＋' + S(v) : S(v); }
  function pr(v) { return '(' + sg(v) + ')'; }
  function sc(v) { return v > 0 ? POS : v < 0 ? NEG : C.yel; }
  /* ---- 数直線（よこ。右に矢印）。o：s、lab、a、la(v)、lc(v) ---- */
  function NL(D, x0, x1, y, min, max, o) {
    o = o || {}; var s = o.s || CH.fs(D, .8), u = (x1 - x0) / (max - min), X = function (v) { return x0 + (v - min) * u; }, a = o.a == null ? 1 : o.a;
    var lab = o.lab || [1, 2, 5, 10, 20, 50].filter(function (q) { return q * u >= s * 2.1; })[0] || 100, st = u < 6 ? lab : 1;
    CH.arrow(D, x0 - s * .5, y, x1 + s * 1.1, y, { w: 2, head: 9, a: a });
    for (var v = Math.ceil(min / st) * st; v <= max + 1e-9; v += st) {
      var isL = v % lab === 0, h = v === 0 ? 9 : isL ? 7 : 4, la = a * (o.la ? o.la(v) : 1);
      CH.line(D, X(v), y - h, X(v), y + h, { w: v === 0 ? 2.4 : 1.5, a: a });
      if (isL && la > 0) CH.text(D, X(v), y + s * 1.25, S(v), { size: s, num: true, a: la, col: o.lc ? o.lc(v) : (v < 0 ? 'rgba(255,157,178,.95)' : v === 0 ? C.yel : C.chalk) });
    }
    return { X: X, y: y, s: s, u: u, x0: x0, x1: x1 };
  }
  /* 数直線の上の矢印（from → to）。lev：高さの段、k：のびる進み */
  function jump(D, L, from, to, lev, o) {
    o = o || {}; var k = o.k == null ? 1 : o.k; if (k <= 0) return;
    var y = L.y - L.s * (o.h || 1.7) * lev, col = o.col || sc(to - from), a = o.a == null ? 1 : o.a, x0 = L.X(from), x1 = CH.lerp(x0, L.X(to), k);
    CH.line(D, x0, L.y - 3, x0, y, { col: col, dash: [3, 4], w: 1.3, a: a * .6 });
    if (Math.abs(x1 - x0) > 2) CH.arrow(D, x0, y, x1, y, { col: col, w: 3, head: Math.min(11, Math.abs(x1 - x0) * .8), a: a });
    if (k >= 1 && o.drop) CH.line(D, x1, y, x1, L.y - 3, { col: col, dash: [3, 4], w: 1.3, a: a * .6 });
    if (o.txt) CH.text(D, (x0 + x1) / 2, y - L.s * .8, o.txt, { col: col, size: o.ts || L.s, a: a * CH.smooth(.3, .8, k), outline: OUT, num: true });
  }
  function pt(D, L, v, col, lab, o) {
    o = o || {}; CH.circle(D, L.X(v), L.y, o.r || L.s * .4, { fill: col, stroke: 'rgba(20,30,24,.8)', sw: 1.2, a: o.a });
    if (lab) CH.text(D, L.X(v), L.y + L.s * (o.dn || 2.6), lab, { col: o.tc || col, size: o.size || L.s * 1.1, a: o.a, outline: OUT, w: 700, num: true });
  }

  /* ---- 符号と絶対値のきまり（同符号・異符号）と検算 ---- */
  function rule(a, b) { var A = Math.abs(a), B = Math.abs(b); return a * b > 0 ? Math.sign(a) * (A + B) : (A === B ? 0 : Math.sign(A > B ? a : b) * Math.abs(A - B)); }
  var Q = [['ア', 3, 5], ['イ', -3, -5], ['ウ', 3, -5], ['エ', -3, 5]];
  CH.check(Q.map(function (q) { return rule(q[1], q[2]); }).join() === '8,-8,-2,2' && Q.every(function (q) { return rule(q[1], q[2]) === q[1] + q[2]; }), '今日の問い ア〜エ');
  var EX = [[9, 4], [-6, -7], [8, -3], [-10, 4]], EXR = EX.map(function (p) { return rule(p[0], p[1]); });
  CH.check(EXR.join() === '13,-13,5,-6' && EX.every(function (p, i) { return p[0] + p[1] === EXR[i]; }), '例題');
  var KT = [[-2, -4], [6, -4], [4, -4]];
  CH.check(KT.map(function (p) { return rule(p[0], p[1]); }).join() === '-6,2,0' && KT.every(function (p) { return rule(p[0], p[1]) === p[0] + p[1]; }), 'ことばの図');
  var SOME = []; for (var x = -20; x <= 20; x++) if (x + 9 === 4) SOME.push(x);
  CH.check(SOME.join() === '-5' && rule(-5, -9) === -14 && -5 + -9 === -14, 'チャレンジ');
  CH.check([4, 1, 0, -1, -4].map(function (v) { return 3 + v; }).join() === '7,4,3,2,-1', '考えよう（ここで確かめるだけ）');

  /* ---- 1本の数直線に、2本の矢印（a のあと b）。k：動き、o：sum（重なり・長さ） ---- */
  function addRow(D, R, a, b, k, o) {
    o = o || {}; var s = CH.fs(D, .82), L = NL(D, R.x0 + s * .3, R.x1 - s * .9, R.y1 - s * 1.5, o.min || -9, o.max || 9, { s: CH.fs(D, .66) }), t = a + b;
    var k1 = CH.smooth(0, .35, k), k2 = CH.smooth(.38, .75, k), ka = CH.smooth(.78, .92, k), h = Math.min(1.7, (L.y - R.y0 - s * 1.8) / (2.2 * L.s));
    if (o.title) CH.text(D, R.x0, R.y0 + s * .55, o.title + (ka > 0 ? '＝' + sg(t) : ''), { align: 'left', size: s, col: C.chalk, num: true });
    if (o.sum && k >= 1) {
      var same = a * b > 0, y1 = L.y - L.s * h, y2 = L.y - L.s * h * 2;
      if (!same && Math.min(Math.abs(a), Math.abs(b)) > 0) { var ov = a > 0 ? [Math.max(0, a + b), a] : [a, Math.min(0, a + b)]; CH.fillRect(D, L.X(ov[0]), y2 - 3, L.X(ov[1]), y1 + 3, { fill: 'rgba(255,226,122,.3)', stroke: C.yel, sw: 1.2, a: o.sa }); }
      var txt = same ? '絶対値 ' + Math.abs(a) + '＋' + Math.abs(b) + '＝' + Math.abs(t) : '絶対値 ' + Math.max(Math.abs(a), Math.abs(b)) + '−' + Math.min(Math.abs(a), Math.abs(b)) + '＝' + Math.abs(t);
      CH.text(D, R.x1, R.y0 + s * .55, txt, { align: 'right', size: CH.fitSize(D, txt, R.w * .45, s * .95), col: C.yel, a: o.sa, w: 700 });
    }
    jump(D, L, 0, a, 1, { k: k1, txt: sg(a), h: h });
    jump(D, L, a, t, 2, { k: k2, txt: sg(b), h: h, drop: true });
    if (ka > 0) pt(D, L, t, C.yel, '', { a: ka });
    return L;
  }
  function grid4(D) {
    var R = CH.box(D, { l: .04, r: .05, t: .05, b: .05 }), wide = D.W > D.H * .9;
    return wide ? [].concat.apply([], CH.rows(R, 2, .14).map(function (q) { return CH.cols(q, 2, .1); })) : CH.rows(R, 4, .1);
  }

  /* ---- ことば：同符号・異符号・0 ---- */
  function kotoba(D, k) {
    var R = CH.box(D, { l: .04, r: .05, t: .04, b: .05 }), rs = CH.rows(R, 3, .14), s = CH.fs(D, .85);
    var name = ['同符号　', '異符号　', '異符号（絶対値が等しい）　'];
    KT.forEach(function (p, i) {
      var ki = CH.clamp((k - i * .3) / .32, 0, 1);
      addRow(D, rs[i], p[0], p[1], ki, { title: name[i] + pr(p[0]) + '＋' + pr(p[1]), sum: true, sa: CH.smooth(.85, 1, ki), min: -8, max: 8 });
    });
  }

  /* ---- 例題：符号 → 絶対値 → 答え ---- */
  function exTable(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .08, b: .1 }), s = CH.fs(D);
    var rows = EX.map(function (p, i) { return [pr(p[0]) + '＋' + pr(p[1]), EXR[i] > 0 ? '＋' : '−', String(Math.abs(EXR[i])), sg(EXR[i])]; });
    var T = CH.table(D, R, ['式', '符号', '絶対値', '答え'], rows, { fw: .4, size: CH.fs(D, .95), rh: s * 2.6,
      show: function (r, c) { if (r < 2 || c === 0) return 1; var t0 = (r - 2) * .3 + (c - 1) * .08; return CH.smooth(t0, t0 + .07, k); },
      hl: function (r, c) { return r > 0 && c === 3 ? sc(EXR[r - 1]) : null; } });
    var c = T.cell(1, 0);
    CH.text(D, c.x0 + s * .25, c.y0 + s * .45, '見本', { size: s * .6, col: C.yel, align: 'left' });
    CH.text(D, R.cx, T.y1 + s * 1.4, 'まず符号、つぎに絶対値', { size: CH.fitSize(D, 'まず符号、つぎに絶対値', R.w * .8, s * .9), col: C.yel });
    for (var i = 1; i < 4; i++) {
      var p = EX[i], same = p[0] * p[1] > 0, ka = CH.smooth((i - 1) * .3, (i - 1) * .3 + .06, k), q = T.cell(i + 1, 0);
      if (!same && ka > 0) { var big = Math.abs(p[0]) > Math.abs(p[1]) ? 0 : 1; CH.text(D, q.x1 - s * .2, q.y0 + s * .5, (big ? '右' : '左') + 'の絶対値が大きい', { size: s * .55, col: sc(p[big]), a: ka, align: 'right' }); }
    }
  }

  /* ---- 考えよう：はじめの数とたす数を動かす ---- */
  function tryAdd(D, V) {
    var R = CH.box(D, { l: .05, r: .06, t: .12, b: .08 }), s = CH.fs(D), L = NL(D, R.x0, R.x1, R.y0 + R.h * .7, -12, 12, { s: CH.fs(D, .8) }), a = V.a, b = V.b;
    CH.line(D, L.X(a), L.y + s * .3, L.X(a), R.y0 + s * .3, { col: C.green, dash: [5, 5], w: 1.6 });
    CH.text(D, L.X(a), R.y0 - s * .5, 'はじめの数 ' + (a === 0 ? '0' : sg(a)), { col: C.green, size: s * .85 });
    jump(D, L, 0, a, 1, { txt: a ? sg(a) : '', h: 1.9 });
    if (b) jump(D, L, a, a + b, 2, { txt: sg(b), h: 1.9, drop: true });
    pt(D, L, a + b, C.yel, '', {});
    var eq = (a === 0 ? '0' : pr(a)) + '＋' + (b === 0 ? '0' : pr(b));
    CH.text(D, R.cx, L.y + s * 3.3, eq, { col: C.yel, size: s * 1.2, w: 700, num: true });
  }

  /* ---- チャレンジ ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .05, r: .06, t: .1, b: .1 }), s = CH.fs(D), L = NL(D, R.x0, R.x1, R.y0 + R.h * .6, -16, 6, { s: CH.fs(D, .8) });
    var k1 = CH.smooth(0, .3, k), k2 = CH.smooth(.45, .75, k), ka = CH.smooth(.8, .95, k);
    pt(D, L, 4, POS, '＋4', { dn: -1.6 });
    jump(D, L, -5, 4, 1, { txt: '＋9（まちがい）', ts: s * .8, h: 2 });
    CH.text(D, L.X(-5), L.y - s * 4.6, k1 >= 1 ? 'ある数 −5' : 'ある数 ？', { col: C.green, size: s, w: 700, outline: OUT });
    if (k1 > 0) { CH.arrow(D, L.X(4), L.y + s * 2.6, CH.lerp(L.X(4), L.X(-5), k1), L.y + s * 2.6, { col: C.green, w: 2.4 }); CH.text(D, L.X(-.5), L.y + s * 3.6, '＋4 から 9 もどる', { col: C.green, size: s * .8, a: k1 }); }
    if (k1 >= 1) pt(D, L, -5, C.green, '', {});
    jump(D, L, -5, -14, 2, { k: k2, txt: '−9（正しい）', ts: s * .8, h: 2, drop: true });
    if (ka > 0) pt(D, L, -14, C.yel, '② −14', { a: ka, dn: 3.2 });
  }

  K3.run({
    no: '第5時', title: '2つの数の和の符号と絶対値は、どう決まるだろう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '04.html', label: '◀ 第4時' }, { href: '06.html', label: '第6時 ▶' }],
    steps: [
      { tag: '今日の問い', bh: '数直線でたし算', q: '0 から出発して、＋は右へ、−は左へ進むとして、ア〜エのたし算を数直線で計算しよう。答えの符号と絶対値は、どう決まっているだろう。',
        notes: ['ア (＋3)＋(＋5)　イ (−3)＋(−5)　ウ (＋3)＋(−5)　エ (−3)＋(＋5)', '① 自分の考え（3分）　答えと、きまりを書こう。', '② ペアの考え（3分）　自分とちがう言い方・気づきは？'],
        draw: function (D) { var rs = grid4(D); Q.forEach(function (q, i) { addRow(D, rs[i], q[1], q[2], 0, { title: q[0] + '　' + pr(q[1]) + '＋' + pr(q[2]) }); }); } },
      { tag: '今日の問い', q: 'ア〜エの答えは？', a: 'ア ＋8　イ −8　ウ −2　エ ＋2', sub: '1本目の矢印の先から、2本目の矢印をつなぐ。矢印の先が答え', dur: 8,
        b: { t: 'ア <b>＋8</b>　イ <b>−8</b>　ウ <b>−2</b>　エ <b>＋2</b>', col: C.yel },
        draw: function (D) { var rs = grid4(D), k = D.ph ? D.t : 0; Q.forEach(function (q, i) { addRow(D, rs[i], q[1], q[2], CH.clamp((k - i * .24) / .28, 0, 1), { title: q[0] + '　' + pr(q[1]) + '＋' + pr(q[2]) }); }); } },
      { tag: '今日の問い', q: '答えの符号と絶対値は、どう決まっている？', a: '同じ符号 … 絶対値をたして、同じ符号。ちがう符号 … 絶対値の差に、絶対値の大きいほうの符号', sub: 'ア・イは同じ向きに進むから 3＋5＝8。ウ・エは反対向きに進んで 3 だけ打ち消し合い（黄色）、5−3＝2', dur: 2,
        b: { t: '同じ符号 … 絶対値の<b>和</b>　ちがう符号 … 絶対値の<b>差</b>、大きいほうの符号', col: C.yel },
        draw: function (D) { var rs = grid4(D), k = D.ph ? D.t : 0; Q.forEach(function (q, i) { addRow(D, rs[i], q[1], q[2], 1, { title: q[0] + '　' + pr(q[1]) + '＋' + pr(q[2]), sum: D.ph, sa: CH.smooth(.1, .6, k) }); }); } },
      { tag: 'ことば', bh: 'ことば', q: '符号が同じ2数、符号がちがう2数を、それぞれ何という？', a: '同符号・異符号', sub: '同符号の和 … 絶対値の和に、共通の符号　異符号の和 … 絶対値の差に、絶対値の大きいほうの符号　絶対値が等しい異符号の2数の和は 0', dur: 7,
        b: [{ t: '<b>同符号</b>の和 … 絶対値の和に、共通の符号', col: C.green }, { t: '<b>異符号</b>の和 … 絶対値の差に、絶対値の大きいほうの符号', col: C.green }, { t: '絶対値が等しい異符号の2数の和は <b>0</b>', col: C.green }],
        draw: function (D) { kotoba(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　符号 → 絶対値', q: 'まず符号、つぎに絶対値を決めて計算しよう。（(＋9)＋(＋4) は見本）　(−6)＋(−7)、(＋8)＋(−3)、(−10)＋(＋4)', a: '−13、＋5、−6', sub: '(−6)＋(−7) は同符号 → −(6＋7)　(＋8)＋(−3) は異符号、＋8 の絶対値が大きい → ＋(8−3)　(−10)＋(＋4) は −10 の絶対値が大きい → −(10−4)', dur: 4,
        b: { t: '(−6)＋(−7)＝<b>−13</b>　(＋8)＋(−3)＝<b>＋5</b>　(−10)＋(＋4)＝<b>−6</b>', col: C.pink },
        draw: function (D) { exTable(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: '(＋3) に、いろいろな数をたす。和は (＋3) より大きくなるだろうか、小さくなるだろうか。',
        notes: ['たす数を ＋4、＋1、0、−1、−4 にして、表にまとめよう。気づいたことは？', '(−3) など、ほかの数にたしても確かめよう。', 'スライダーで、はじめの数とたす数を変えられます。'],
        sliders: [{ key: 'a', label: 'はじめの数', min: -6, max: 6, step: 1, val: 3, fmt: function (x) { return x ? sg(x) : '0'; } }, { key: 'b', label: 'たす数', min: -6, max: 6, step: 1, val: 4, fmt: function (x) { return x ? sg(x) : '0'; } }],
        draw: function (D) { tryAdd(D, D.V); } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'ある数に −9 をたすところを、まちがえて ＋9 をたしてしまい、答えが ＋4 になった。① ある数は？ ② 正しい答えは？',
        a: '① −5　② −14', sub: '① ある数を □ とすると、□＋(＋9)＝＋4。＋4 から 9 もどって □＝−5　② (−5)＋(−9)＝−14', dur: 6,
        b: { t: '① □＋(＋9)＝＋4 → □＝<b>−5</b>　② (−5)＋(−9)＝<b>−14</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ]
  });
})();
</script>
</body>
