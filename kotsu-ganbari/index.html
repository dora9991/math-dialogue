<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13a07f">
<meta name="robots" content="noindex,nofollow">
<title>がんばりまっしょいプリント 解説動画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2313a07f'/%3E%3Cpath d='M24 18l22 14-22 14z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="in">
  <a class="back" href="../">← コツコツくんにもどる</a>
  <h1>📺 がんばりまっしょいプリント 解説動画</h1>
  <p>期末テスト対策プリントの、問1〜問42。図がうごいて、1手ずつ解説するよ（音は出ません）。 <span class="today" id="today" hidden></span></p>
</div></header>
<main class="wrap">
  <div class="howto">🦉 問題をえらぶと、動画がはじまります。<b>▶ ⏸</b> でとめたり、<b>◀ ▶</b> で1つずつ見たり、下の <b>線のバー</b> をタップして好きなところに行けます。まず自分で解いてから、答え合わせに見てね。<br>動画を見た時間は、コツコツくんの<b>学習時間</b>に入ります（1日 40分まで）。</div>
  <div id="list"></div>
  <p class="foot">コツコツくん ・ 11月30日まで公開</p>
</main>
<div id="overlay" hidden>
  <div class="ov-top"><div class="in">
    <button class="pbtn" id="ov-close" type="button">← 一覧</button>
    <div class="ttl" id="ov-title"></div>
    <button class="pbtn" id="ov-prev" type="button" aria-label="前の問題">‹</button>
    <button class="pbtn" id="ov-next" type="button" aria-label="次の問題">›</button>
  </div></div>
  <div class="ov-body">
    <div class="prob" id="ov-prob"></div>
    <div id="ov-player"></div>
    <div class="next-box" id="ov-next-box" hidden></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
