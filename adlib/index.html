<style>
/* アドリブ・ラボ：見た目 */
:root {
  --bg: #f5f2eb;
  --surface: #ffffff;
  --surface-2: #faf8f3;
  --ink: #1d2430;
  --ink-2: #444e5d;
  --muted: #6f7a89;
  --line: #e3ddd0;
  --line-2: #cfc7b6;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --accent-soft: #dcefee;
  --accent-2: #b4541a;
  --bad: #b42318;
  --play: #ffe9a8;
  --sel: #e2f0ef;
  --range: #eef3ff;
  --t: #2b6cb0; --t-bg: #e6f0fb;
  --sd: #2a7d52; --sd-bg: #e3f4ea;
  --d: #c2410c; --d-bg: #fdeadd;
  --x: #7448c8; --x-bg: #efe8fb;
  --c0: #1f8a8a; --c1: #e07a5f; --c2: #5b6bd6; --c3: #9aa61f;
  --shadow: 0 1px 2px rgba(30, 40, 50, .06), 0 6px 18px rgba(30, 40, 50, .06);
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
  --chord-font: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --surface: #1c2229; --surface-2: #20272f; --ink: #e8ecf1; --ink-2: #c2cad5; --muted: #93a0b0;
    --line: #2e3742; --line-2: #3d4856; --accent: #4fb3bd; --accent-ink: #0b1a1c; --accent-soft: #1c3a3e; --accent-2: #f0a56a;
    --bad: #ff8a80; --play: #4a3d10; --sel: #1e3a3d; --range: #1c2740;
    --t: #7cb4f0; --t-bg: #1b2c40; --sd: #6fd1a0; --sd-bg: #17322a; --d: #ff9a62; --d-bg: #3a2418; --x: #b796f5; --x-bg: #2b2140;
    --c0: #4fc3c3; --c1: #f09a82; --c2: #8c98f0; --c3: #c6d34a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 .35em; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 6px; }

/* ---- 上の帯 ---- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.top-in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 34px; height: 34px; flex: none; }
.logo rect { fill: var(--accent); }
.logo path { fill: var(--accent-ink); }
.brand h1 { font-size: 1.15rem; line-height: 1.2; letter-spacing: .02em; }
.brand .tag { font-size: .72rem; color: var(--muted); line-height: 1.3; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 1px solid transparent; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: .92rem; color: var(--ink-2); white-space: nowrap; }
.tabs button:hover { background: var(--surface-2); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

main { max-width: 1080px; margin: 0 auto; padding: 14px 16px 150px; }
.tab { display: flex; flex-direction: column; gap: 14px; }
.foot { margin-top: 18px; color: var(--muted); font-size: .76rem; }

/* ---- 部品 ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-h h2 { font-size: 1.05rem; line-height: 1.4; }
.card h3 { font-size: .92rem; margin: 14px 0 6px; color: var(--ink-2); }
.row { display: flex; align-items: center; }
.row.gap { gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.center { justify-content: center; }
.grow { flex: 1 1 auto; }
.mt { margin-top: 10px; }
.muted { color: var(--muted); }
.small { font-size: .8rem; line-height: 1.55; }
.hint { color: var(--muted); font-size: .8rem; margin-top: 8px; }
.empty { color: var(--muted); padding: 18px 8px; text-align: center; grid-column: 1 / -1; }
.val { font-size: .82rem; color: var(--muted); min-width: 3.2em; }

.btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; line-height: 1.3; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.sm { padding: 4px 10px; font-size: .8rem; border-radius: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

input[type="text"], input[type="search"], input[type="number"], select, textarea {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 10px; min-width: 0; max-width: 100%;
}
select { padding-right: 26px; }
.ttl { flex: 1 1 200px; }
textarea.code { width: 100%; font-family: var(--mono); font-size: .92rem; line-height: 1.7; resize: vertical; tab-size: 2; }
.errs { list-style: none; margin: 6px 0 0; padding: 0; color: var(--bad); font-size: .82rem; }
.errs:empty { display: none; }
.errs li::before { content: "⚠ "; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 18px; margin-top: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f-label { font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.f-hint { font-size: .74rem; color: var(--muted); line-height: 1.45; }
.field select { width: 100%; }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); flex-wrap: nowrap; max-width: 100%; }
.seg-b { border: 0; background: none; padding: 6px 12px; font-size: .84rem; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); white-space: nowrap; }
.seg-b:last-child { border-right: 0; }
.seg-b[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field .seg { align-self: flex-start; overflow-x: auto; }

.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .86rem; user-select: none; }
.sw-in { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw-track { width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.sw-dot { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.sw-in:checked + .sw-track { background: var(--accent); }
.sw-in:checked + .sw-track .sw-dot { transform: translateX(16px); }
.sw-in:focus-visible + .sw-track { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

.rng { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; flex: 1 1 120px; min-width: 90px; cursor: pointer; }
.rng::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--line-2); }
.rng::-moz-range-track { height: 5px; border-radius: 3px; background: var(--line-2); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); margin-top: -7.5px; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.rng::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }

.chip { display: inline-block; font-size: .72rem; line-height: 1.4; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.tone-t { color: var(--t); background: var(--t-bg); border-color: transparent; }
.chip.tone-sd { color: var(--sd); background: var(--sd-bg); border-color: transparent; }
.chip.tone-d { color: var(--d); background: var(--d-bg); border-color: transparent; }
.chip.tone-x { color: var(--x); background: var(--x-bg); border-color: transparent; }
.chip.btnchip { cursor: pointer; }
.chip.btnchip:hover { border-color: var(--accent); }
.chip.btnchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.lvl1 { background: #e3f4ea; color: #2a7d52; border-color: transparent; }
.chip.lvl2 { background: #fff3d6; color: #8a5a00; border-color: transparent; }
.chip.lvl3 { background: #fde3e0; color: #b42318; border-color: transparent; }
@media (prefers-color-scheme: dark) { .chip.lvl1 { background: #17322a; color: #6fd1a0; } .chip.lvl2 { background: #3a3014; color: #e8c15a; } .chip.lvl3 { background: #3d1d1a; color: #ff9a90; } }
.tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.badge { font-size: .7rem; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-weight: 700; white-space: nowrap; }

/* ---- 再生バー ---- */
.transport { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(30, 40, 50, .08); padding-bottom: env(safe-area-inset-bottom); }
.transport-in { max-width: 1080px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .22); }
.play svg { width: 26px; height: 26px; fill: currentColor; }
.play.on { background: var(--accent-2); }
.pos { display: flex; flex-direction: column; min-width: 8.5em; line-height: 1.3; }
.pos b { font-size: .95rem; }
.pos span { font-size: .76rem; color: var(--muted); }
.tempo { display: flex; align-items: center; gap: 6px; flex: 1 1 260px; min-width: 220px; }
.tempo .lab, .mini .lab { font-size: .78rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.num { width: 4.4em; text-align: center; font-weight: 700; padding: 5px 4px; -moz-appearance: textfield; }
.num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; padding: 0; }
.mini { display: flex; align-items: center; gap: 6px; }
.mini select { padding: 5px 24px 5px 8px; font-size: .86rem; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px); background: #263340; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: .88rem; max-width: min(92vw, 560px); z-index: 60; opacity: 0; transition: opacity .2s, transform .2s; box-shadow: 0 6px 24px rgba(0, 0, 0, .3); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---- はじめての方へ ---- */
.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: .88rem; line-height: 1.6; }
.banner b { color: var(--accent); }
.cc:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -3px; }

/* ---- コードパレット・ヘルプ ---- */
.palette { margin-top: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.pal-t { font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
.pal-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pal-b { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: .86rem; min-width: 44px; font-family: var(--chord-font); }
.pal-b.root[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pal-b:hover { border-color: var(--accent); }
.pal-b.st { font-family: var(--font); font-weight: 600; font-size: .8rem; }
.pal-b .pr { color: var(--muted); font-weight: 500; margin-right: 1px; }
.help summary { cursor: pointer; color: var(--accent); font-size: .86rem; font-weight: 600; }
.help ul { margin: 8px 0 0; padding-left: 1.3em; font-size: .86rem; color: var(--ink-2); }
.help li { margin: 4px 0; }

/* ---- コード記号 ---- */
.cs { font-family: var(--chord-font); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; color: var(--ink); }
.cs .a { font-size: .62em; vertical-align: .38em; margin-left: -.06em; margin-right: .02em; }
.cs sup.q { font-size: .62em; vertical-align: .55em; line-height: 0; font-weight: 600; margin-left: .06em; }
.cs .sl { font-size: .8em; font-weight: 600; opacity: .85; }
.cs.nc { opacity: .6; font-weight: 600; }
.cs.pct { font-weight: 400; color: var(--muted); font-size: 1.1em; }

/* ---- 小節のならび ---- */
.keyinfo { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: .86rem; margin: 4px 0 12px; }
.keyinfo:empty { display: none; }
.keyinfo .ki b { color: var(--ink-2); }
.keyinfo .ki.alt { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 0; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--surface); }
.bar { position: relative; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 4px 6px 8px; min-height: 92px; display: flex; flex-direction: column; background: var(--surface); transition: background .08s; }
.bar:nth-child(var(--cols, 4) + 0) { }
.grid > .bar:last-child { }
.bar.rs { box-shadow: inset 5px 0 0 -2px var(--ink); border-left: 2px solid var(--ink); }
.bar.re { box-shadow: inset -5px 0 0 -2px var(--ink); border-right: 2px solid var(--ink); }
.bar.rs.re { box-shadow: inset 5px 0 0 -2px var(--ink), inset -5px 0 0 -2px var(--ink); }
.bar-top { display: flex; align-items: center; gap: 4px; min-height: 18px; }
.bar-top .bno { margin-left: auto; font-size: .64rem; color: var(--muted); opacity: .8; }
.sect { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 4px; font-size: .74rem; font-weight: 800; }
.ending { font-size: .72rem; font-weight: 700; color: var(--ink-2); border-top: 1.5px solid var(--ink-2); padding: 0 4px; }
.chords { display: flex; flex: 1; gap: 2px; align-items: stretch; }
.cc { position: relative; flex: 1 1 0; min-width: 0; padding: 4px 4px 9px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.cc:hover { background: var(--surface-2); }
.cc .cs { font-size: clamp(1.1rem, 2.4vw, 1.55rem); line-height: 1.25; }
.cc.cp .cs { font-size: 1.3rem; }
.cc.bad .cs { color: var(--bad); text-decoration: underline wavy; }
.cc .chips { display: flex; flex-wrap: wrap; gap: 3px; }
.cc .chip { font-size: .64rem; padding: 0 6px; }
.cc.cp .chips { display: none; }
.cc.ph::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 4px; background: var(--phc, var(--c0)); opacity: .85; }
.cc.ph.first::after { border-radius: 4px 0 0 4px; left: 4px; }
.cc.ph.last::after { border-radius: 0 4px 4px 0; right: 4px; }
.cc.ph.first.last::after { border-radius: 4px; }
.cc.c0 { --phc: var(--c0); } .cc.c1 { --phc: var(--c1); } .cc.c2 { --phc: var(--c2); } .cc.c3 { --phc: var(--c3); }
.cc .chip.phase { background: transparent; border: 1.5px solid var(--phc); color: var(--ink); font-weight: 700; }

<!-- 画面 -->
<script>
/* ---- js/theory.js ---- */
/* アドリブ・ラボ：音楽理論の土台（画面を持たない。ブラウザでも node の検査でも読める）。
   ・音名の綴り（C, D♭, F♯ …）と、音程の数え方（度数 b7, #11 …）
   ・コード記号の読みとり（Dm7b5, G7(b9,#13), C/E, Cmaj7#11 …）
   ・スケール辞典、ローマ数字、調号、移調
   使い方のきまり：音は「綴り {l:文字0〜6, a:変化記号-2〜2}」と「音高 {l,a,oct}」で持つ（C4 = 60）。
   リックはコードの度数（b7, #11 …）で数えるので、移調しても D♯ と E♭ のような綴りがくずれない。 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const AL = (root.AL = root.AL || {});
  const T = (AL.T = AL.T || {});

  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];
  const mod = (n, m) => ((n % m) + m) % m;
  const SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

  /* ---------------- 音名（綴り） ---------------- */
  function parseSpell(s) {
    const m = /^([A-G])(##|bb|x|[#b♯♭])?$/.exec(String(s == null ? '' : s).trim());
    if (!m) return null;
    const a = m[2] ? { '#': 1, '♯': 1, '##': 2, x: 2, b: -1, '♭': -1, bb: -2 }[m[2]] : 0;
    return { l: LETTERS.indexOf(m[1]), a };
  }
  const spellPc = sp => mod(LETTER_PC[sp.l] + sp.a, 12);
  function spellStr(sp, uni) {
    const acc = sp.a === 0 ? '' : sp.a > 0 ? (uni ? '♯' : '#').repeat(sp.a) : (uni ? '♭' : 'b').repeat(-sp.a);
    return LETTERS[sp.l] + acc;
  }
  const spellFromPc = (pc, preferFlat) => parseSpell((preferFlat ? FLAT_NAMES : SHARP_NAMES)[mod(pc, 12)]);
  const sameSpell = (a, b) => a && b && a.l === b.l && a.a === b.a;

  /* ---------------- 音高（綴り＋オクターブ。C4 = MIDI 60） ---------------- */
  const pitchMidi = p => 12 * (p.oct + 1) + LETTER_PC[p.l] + p.a;
  function pitchFromMidi(m, preferFlat) {
    const sp = spellFromPc(m, preferFlat);
    return { l: sp.l, a: sp.a, oct: Math.floor((m - sp.a - LETTER_PC[sp.l]) / 12) - 1 };
  }
  function parsePitch(s) {
    const m = /^([A-G])(##|bb|x|[#b♯♭])?(-?\d)$/.exec(String(s).trim());
    if (!m) return null;
    const sp = parseSpell(m[1] + (m[2] || ''));
    return { l: sp.l, a: sp.a, oct: parseInt(m[3], 10) };
  }
  const pitchStr = (p, uni) => spellStr(p, uni) + p.oct;
  // 文字（度数）で steps、半音で semis だけ上へ（負なら下へ）動かす。綴れないとき（三重♯など）は null
  function shiftPitch(p, steps, semis) {
    const abs = p.oct * 7 + p.l + steps;
    const oct = Math.floor(abs / 7), l = mod(abs, 7);
    const a = pitchMidi(p) + semis - (12 * (oct + 1) + LETTER_PC[l]);
    if (a < -2 || a > 2) return null;
    return { l, a, oct };
  }

  /* ---------------- 度数（1, b3, #4, b7, 9, #11, b13 …） ---------------- */
  function parseDegree(str) {
    const m = /^(bb|b|##|#|♭|♯)?(\d{1,2})$/.exec(String(str));
    if (!m) return null;
    const n = parseInt(m[2], 10);
    if (n < 1) return null;
    const alt = !m[1] ? 0 : { b: -1, bb: -2, '#': 1, '##': 2, '♭': -1, '♯': 1 }[m[1]];
    const steps = n - 1;
    return { n, alt, steps, semis: MAJOR[steps % 7] + 12 * Math.floor(steps / 7) + alt };
  }
  // ルートの綴りと度数から、その音の綴り（オクターブなし）
  function degreeSpell(rootSp, deg) {
    const d = typeof deg === 'string' ? parseDegree(deg) : deg;
    if (!d) return null;
    const l = mod(rootSp.l + d.steps, 7);
    const pc = mod(spellPc(rootSp) + d.semis, 12);
    const a = mod(pc - LETTER_PC[l] + 6, 12) - 6;
    if (a < -2 || a > 2) return null;
    return { l, a };
  }
  // 音高（綴り＋オクターブ）→ ルートからの度数（文字上の距離 steps と半音 semis）
  function intervalFromRoot(rootSp, p) {
    const steps = mod(p.l - rootSp.l, 7);
    const semis = mod(pitchMidi(p) - spellPc(rootSp), 12);
    return { steps, semis };
  }
  const DEG_NAMES = { 0: '1', 1: 'b9', 2: '9', 3: '#9', 4: '3', 5: '11', 6: '#11', 7: '5', 8: 'b13', 9: '13', 10: 'b7', 11: '7' };
  // 半音数（0〜11）→ ジャズ式の度数名。コードの種類 cls を渡すと、その種類らしい呼び名になる（短調系の 3 半音は b3 など）
  function semisToDegreeName(semis, cls, chord) {
    const s = mod(semis, 12);
    if (s === 6 && chord && chord.alt) return 'b5';   // オルタード・ドミナントのトライトーンは ♭5（♯11 とは呼ばない）
    const minorish = cls === 'min' || cls === 'minmaj' || cls === 'hdim' || cls === 'dim';
    if (minorish) {
      const m = { 3: 'b3', 6: 'b5', 8: 'b6', 9: cls === 'dim' ? 'bb7' : '6' };
      if (m[s]) return m[s];
    } else if (cls === 'maj') {
      const m = { 3: 'b3', 8: 'b6' };
      if (m[s]) return m[s];
    }
    return DEG_NAMES[s];
  }

  /* ---------------- 調号 ---------------- */
  const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6]; // F C G D A E B
  const FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3];  // B E A D G C F
  // fifths（-7〜+7）→ 文字ごとの変化記号 [C,D,E,F,G,A,B]
  function keySigAccs(fifths) {
    const acc = [0, 0, 0, 0, 0, 0, 0];
    const n = Math.max(-7, Math.min(7, fifths | 0));
    for (let i = 0; i < Math.abs(n); i++) acc[(n > 0 ? SHARP_ORDER : FLAT_ORDER)[i]] += n > 0 ? 1 : -1;
    return acc;
  }
  const FIFTHS_OF_LETTER = [0, 2, 4, -1, 1, 3, 5]; // C D E F G A B のメジャーキー
  function keyFifths(tonicSp, mode) {
    return FIFTHS_OF_LETTER[tonicSp.l] + 7 * tonicSp.a - (mode === 'minor' ? 3 : 0);
  }
  // 12の主音それぞれの「ふつうの綴り」（ジャズの譜面でよく見る調）
  const MAJOR_KEY_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const MINOR_KEY_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B'];
  const keySpell = (pc, mode) => parseSpell((mode === 'minor' ? MINOR_KEY_NAMES : MAJOR_KEY_NAMES)[mod(pc, 12)]);
  // 調（主音の音階）のなかでの「#系か♭系か」。C は♭系にしておく（Eb・Ab・Bb が多いため）
  const keyPrefersFlat = (tonicSp, mode) => keyFifths(tonicSp, mode) <= 0;

  /* ---------------- コード記号 ---------------- */
  // ♭♯の表示（入力の b/# を ♭/♯ に。度数の前の b/# だけが対象）
  function prettyAcc(s) {
    return String(s == null ? '' : s).replace(/b(?=\d)/g, '♭').replace(/#(?=\d)/g, '♯').replace(/^b/, '♭').replace(/^#/, '♯');
  }
  const PARTS_RE = /^([A-G])([#b♭♯＃]?)(.*?)(?:\/([A-G][#b♭♯＃]?))?$/;

  // 'G7b9' → {root:G, cls:'dom', tones:[…]} 。読めないときは {error:'…'} ではなく null
  function parseChord(srcIn) {
    const src = String(srcIn == null ? '' : srcIn).trim();
    if (!src) return null;
    if (/^N\.?C\.?$/i.test(src)) {
      return { src, nc: true, cls: 'nc', root: null, rootPc: -1, bass: null, bassPc: -1, suffix: '', tones: [], pcs: [] };
    }
    const pm = PARTS_RE.exec(src.replace(/\s+/g, ''));
    if (!pm) return null;
    const rootSp = parseSpell(pm[1] + pm[2].replace('♭', 'b').replace(/[♯＃]/, '#'));
    if (!rootSp) return null;
    let suffixRaw = pm[3];
    const bassSp = pm[4] ? parseSpell(pm[4].replace('♭', 'b').replace(/[♯＃]/, '#')) : null;

    // 読みやすい形にそろえる（ø → m7b5 など）
    let q = suffixRaw.replace(/♭/g, 'b').replace(/[♯＃]/g, '#').replace(/[−–﹣－]/g, '-')
      .replace(/[øØ]7?/g, 'm7b5').replace(/6\/9/g, '69').replace(/[()[\]]/g, ',');
    const parts = q.split(',').filter(Boolean);
    if (!parts.length) parts.push('');

    const st = { third: 'M', fifth: 0, seventh: null, six: false, ext: { 9: [], 11: [], 13: [] }, omit3: false, omit5: false, alt: false };
    const addExt = (n, alt) => {
      const arr = st.ext[n];
      if (alt !== 0) { const i = arr.indexOf(0); if (i >= 0) arr.splice(i, 1); }
      if (alt === 0 && arr.some(a => a !== 0)) return;
      if (arr.indexOf(alt) < 0) arr.push(alt);
    };
    let bad = null;

    // ---- 基本形（頭の部分） ----
    let head = parts[0], m;
    const take = re => { const mm = re.exec(head); if (mm) head = head.slice(mm[0].length); return mm; };
    if (take(/^(maj|Maj|MAJ|ma|Ma|Δ|∆|△|▵|\^|M(?![a-z]))/)) {
      st.third = 'M'; st.seventh = '7';              // ジャズでは Cmaj / CΔ は maj7 の意味
      if (take(/^69/)) { st.seventh = null; st.six = true; addExt(9, 0); }
      else if (take(/^6/)) { st.seventh = null; st.six = true; }
      else if (take(/^7/)) { /* maj7 */ }
      else if (take(/^9/)) addExt(9, 0);
      else if (take(/^11/)) { addExt(9, 0); addExt(11, 0); }
      else if (take(/^13/)) { addExt(9, 0); addExt(13, 0); }
    } else if (take(/^(min|Min|MIN|mi|Mi|m|-)/)) {
      st.third = 'm';
      if (take(/^(maj|Maj|MAJ|M|Δ|△|\^)/)) {
        st.seventh = '7';
        if (take(/^9/)) addExt(9, 0); else take(/^7/);
      }
      else if (take(/^69/)) { st.six = true; addExt(9, 0); }
      else if (take(/^6/)) st.six = true;
      else if (take(/^7/)) st.seventh = 'b7';
      else if (take(/^9/)) { st.seventh = 'b7'; addExt(9, 0); }
      else if (take(/^11/)) { st.seventh = 'b7'; addExt(9, 0); addExt(11, 0); }
      else if (take(/^13/)) { st.seventh = 'b7'; addExt(9, 0); addExt(13, 0); }
    } else if (take(/^(dim|Dim|o|°|º)/)) {
      st.third = 'm'; st.fifth = -1;
      if (take(/^7/)) st.seventh = 'bb7';
    } else if (take(/^(aug|Aug|\+)/)) {
      st.fifth = 1;
      if (take(/^7/)) st.seventh = 'b7';
      else if (take(/^9/)) { st.seventh = 'b7'; addExt(9, 0); }
      else if (take(/^13/)) { st.seventh = 'b7'; addExt(9, 0); addExt(13, 0); }
    } else if ((m = take(/^sus(4|2)?/))) {
      st.third = m[1] === '2' ? 'sus2' : 'sus4';
      if (take(/^7/)) st.seventh = 'b7';
      else if (take(/^9/)) { st.seventh = 'b7'; addExt(9, 0); }
      else if (take(/^13/)) { st.seventh = 'b7'; addExt(9, 0); addExt(13, 0); }
    } else if (take(/^alt/)) {
      st.seventh = 'b7'; st.alt = true;
    } else if (take(/^(13|11|9|7|69|6|5|4|2)/)) {
      const d = parts[0].slice(0, parts[0].length - head.length);
      if (d === '7') st.seventh = 'b7';
      else if (d === '9') { st.seventh = 'b7'; addExt(9, 0); }
      else if (d === '11') { st.seventh = 'b7'; addExt(9, 0); addExt(11, 0); st.third = 'sus4'; }
      else if (d === '13') { st.seventh = 'b7'; addExt(9, 0); addExt(13, 0); }
      else if (d === '6') st.six = true;
      else if (d === '69') { st.six = true; addExt(9, 0); }
      else if (d === '5') { st.third = null; }
      else if (d === '4') st.third = 'sus4';
      else if (d === '2') st.third = 'sus2';
    }
    // ---- 追加の指定（b9, #11, add9, sus4, omit3 …） ----
    const rest = [head].concat(parts.slice(1));
    outer: for (let str of rest) {
      while (str.length) {
        let mm;
        if ((mm = /^(maj7|Maj7|M7|Δ7|△7|Δ|△)/.exec(str))) { st.seventh = '7'; str = str.slice(mm[0].length); continue; }
        if ((mm = /^sus(4|2)?/.exec(str))) { st.third = mm[1] === '2' ? 'sus2' : 'sus4'; str = str.slice(mm[0].length); continue; }
        if ((mm = /^add(\d+)/.exec(str))) {
          const n = +mm[1];
          if (n === 9 || n === 2) addExt(9, 0); else if (n === 11 || n === 4) addExt(11, 0); else if (n === 13 || n === 6) { if (st.seventh) addExt(13, 0); else st.six = true; }
          else { bad = str; break outer; }
          str = str.slice(mm[0].length); continue;
        }
        if ((mm = /^(omit|no)(\d+)/.exec(str))) {
          if (mm[2] === '3') st.omit3 = true; else if (mm[2] === '5') st.omit5 = true; else { bad = str; break outer; }
          str = str.slice(mm[0].length); continue;
        }
        if ((mm = /^alt/.exec(str))) { st.alt = true; if (!st.seventh) st.seventh = 'b7'; str = str.slice(3); continue; }
        if ((mm = /^\+(?!\d)/.exec(str))) { st.fifth = 1; str = str.slice(1); continue; }   // 7+ = 7(#5)
        if ((mm = /^([#b+\-]?)(13|11|9|7|6|5)/.exec(str))) {
          const sign = mm[1] === '#' || mm[1] === '+' ? 1 : mm[1] === 'b' || mm[1] === '-' ? -1 : 0;
          const n = +mm[2];
          if (n === 5) { if (sign) st.fifth = sign; }
          else if (n === 9) addExt(9, sign);
          else if (n === 11) addExt(11, sign > 0 ? 1 : 0);
          else if (n === 13) addExt(13, sign < 0 ? -1 : 0);
          else if (n === 6) { if (!st.seventh) st.six = true; else addExt(13, 0); }
          else if (n === 7) { if (!st.seventh) st.seventh = 'b7'; }
          str = str.slice(mm[0].length); continue;
        }
        if ((mm = /^[\/.]/.exec(str))) { str = str.slice(1); continue; }
        bad = str; break outer;
      }
    }
    if (bad) return null;

    if (st.omit3) st.third = null;
    // ---- 構成音 ----
    const tones = [{ n: 1, alt: 0 }];
    if (st.third === 'M') tones.push({ n: 3, alt: 0 });
    else if (st.third === 'm') tones.push({ n: 3, alt: -1 });
    else if (st.third === 'sus4') tones.push({ n: 4, alt: 0 });
    else if (st.third === 'sus2') tones.push({ n: 2, alt: 0 });
    if (st.alt) {
      // オルタード：5度は持たず、♭9 ♯9 ♯11(♭5) ♭13 を足す。指定があればそれを優先する
      if (!st.ext[9].length) { addExt(9, -1); addExt(9, 1); }
      if (!st.ext[11].length) addExt(11, 1);
      if (!st.ext[13].length) addExt(13, -1);
    } else if (!st.omit5) tones.push({ n: 5, alt: st.fifth });
    if (st.seventh) tones.push({ n: 7, alt: st.seventh === 'b7' ? -1 : st.seventh === '7' ? 0 : -2 });
    if (st.six) tones.push({ n: 6, alt: 0 });
    for (const n of [9, 11, 13]) for (const a of st.ext[n].slice().sort()) {
      if (n === 11 && a === 0 && st.third === 'sus4') continue;   // sus4 と 11th は同じ音
      tones.push({ n, alt: a });
    }

    let cls;
    if (st.third === 'M') cls = st.seventh === 'b7' ? 'dom' : (st.fifth === 1 && !st.seventh && !st.six ? 'aug' : 'maj');
    else if (st.third === 'm') {
      if (st.fifth === -1) cls = st.seventh === 'b7' ? 'hdim' : 'dim';
      else cls = st.seventh === '7' ? 'minmaj' : 'min';
    } else if (st.third === 'sus4' || st.third === 'sus2') cls = 'sus';
    else cls = 'pow';

    const out = {
      src, nc: false, root: rootSp, rootPc: spellPc(rootSp), bass: bassSp, bassPc: bassSp ? spellPc(bassSp) : -1,
      suffix: suffixRaw.replace(/♭/g, 'b').replace(/[♯＃]/g, '#'),
      cls, third: st.third, fifth: st.omit5 ? null : st.fifth, seventh: st.seventh, six: st.six,
      ext: st.ext, alt: st.alt, omit5: st.omit5,
      tones: [],
    };
    for (const t of tones) {
      const d = { n: t.n, alt: t.alt, steps: t.n - 1, semis: MAJOR[(t.n - 1) % 7] + 12 * Math.floor((t.n - 1) / 7) + t.alt };
      const sp = degreeSpell(rootSp, d) || spellFromPc(rootSp ? spellPc(rootSp) + d.semis : 0, false);
      out.tones.push({ n: t.n, alt: t.alt, semis: d.semis, pc: mod(out.rootPc + d.semis, 12), sp, name: (t.alt < 0 ? 'b'.repeat(-t.alt) : '#'.repeat(t.alt)) + t.n });
    }
    out.pcs = Array.from(new Set(out.tones.map(t => t.pc))).sort((a, b) => a - b);
    out.hasAlt = !!(st.alt || st.fifth !== 0 || [9, 11, 13].some(n => st.ext[n].some(a => a !== 0)));
    out.dim7 = cls === 'dim' && st.seventh === 'bb7';
    // 3度・7度（ガイドトーン）
    const third = out.tones.find(t => t.n === 3 || t.n === 4 || t.n === 2), seventh = out.tones.find(t => t.n === 7 || t.n === 6);
    out.guide3 = st.third === 'M' || st.third === 'm' ? mod(out.rootPc + (st.third === 'M' ? 4 : 3), 12) : (third ? third.pc : -1);
    out.guide7 = st.seventh ? mod(out.rootPc + (st.seventh === 'b7' ? 10 : st.seventh === '7' ? 11 : 9), 12) : (seventh ? seventh.pc : -1);
    return out;
  }

  // 表示用に（ルート・種類・ベース）に分けたもの。♭♯は記号に
  function chordParts(chord) {
    if (!chord || chord.nc) return { root: 'N.C.', suffix: '', bass: '' };
    return {
      root: spellStr(chord.root, true),
      suffix: prettyAcc(chord.suffix),
      bass: chord.bass ? spellStr(chord.bass, true) : '',
    };
  }
  function chordText(chord, uni) {
    if (!chord || chord.nc) return 'N.C.';
    const suf = uni ? prettyAcc(chord.suffix) : chord.suffix;
    return spellStr(chord.root, uni) + suf + (chord.bass ? '/' + spellStr(chord.bass, uni) : '');
  }

  // 種類の日本語名
  const CLASS_JP = {
    maj: 'メジャー系（maj7・6 など）', min: 'マイナー系（m7・m6 など）', dom: 'ドミナント7th系',
    hdim: 'ハーフディミニッシュ（m7♭5）', dim: 'ディミニッシュ', sus: 'サス（sus4）系', aug: 'オーギュメント', minmaj: 'マイナー・メジャー7th', pow: 'パワーコード', nc: 'ノーコード',
  };

  /* ---------------- 移調 ---------------- */
  // 根音の綴りを「半音 semis だけ上げた」ものにする。調号に合わせて♯か♭かを選ぶ
  function transposeRoot(sp, semis, ctx) {
    const pc = mod(spellPc(sp) + semis, 12);
    return spellInKey(pc, ctx || {});
  }
  // pc を、調（ctx.tonicPc, ctx.fifths）に合わせた綴りで。♯系の調なら♯、♭系の調なら♭。
  // C メジャー／A マイナー（変化記号なし）のときだけ、コードの種類で C♯/D♭ のような迷いを決める
  function spellInKey(pc, ctx) {
    pc = mod(pc, 12);
    const f = ctx.fifths == null ? 0 : ctx.fifths;
    if (f > 0) return spellFromPc(pc, false);
    if (f < 0) return spellFromPc(pc, true);
    const tonic = ctx.tonicPc == null ? 0 : ctx.tonicPc;
    const d = mod(pc - tonic, 12), cls = ctx.cls || 'maj';
    const minorish = cls === 'min' || cls === 'hdim' || cls === 'minmaj';
    if (cls === 'dim') return spellFromPc(pc, false);          // 経過のディミニッシュは #I° #II° #IV° …
    if (d === 1 || d === 6) return spellFromPc(pc, !minorish); // m7 系は C♯m・F♯m7♭5、ドミナントやmaj7は D♭・G♭
    return spellFromPc(pc, true);
  }
  // pc が、調号（fifths：♯の数、♭は負）に入っている音か
  function inKeySig(pc, fifths) {
    for (let i = fifths - 1; i <= fifths + 5; i++) if (mod(7 * i, 12) === pc) return true;
    return false;
  }
  // コードの根音の綴り。調号に入っている音は spellInKey と同じ。
  // 調号に入っていない音（借用和音・裏コードなど）は、調の主音からの度数とコードの種類で決める：
  // ♭II7・♭III・♭VI・♭VII は♭（D♯7 でなく E♭7）、ディミニッシュの ♯I°・m7 系の ♯IV は♯
  function spellRootInKey(pc, ctx) {
    pc = mod(pc, 12);
    const f = ctx.fifths == null ? 0 : ctx.fifths;
    if (!f || ctx.tonicPc == null || inKeySig(pc, f)) return spellInKey(pc, ctx);
    const d = mod(pc - ctx.tonicPc, 12), cls = ctx.cls || 'maj';
    if (cls === 'dim') return spellFromPc(pc, false);
    if (d === 1 || d === 6) return spellFromPc(pc, !(cls === 'min' || cls === 'hdim' || cls === 'minmaj'));
    return spellFromPc(pc, true);
  }
  // コード文字列を semis だけ移調（接尾辞はそのまま）。ctx は spellInKey と同じ
  function transposeChordStr(src, semis, ctx) {
    const s = String(src);
    const pm = PARTS_RE.exec(s.replace(/\s+/g, ''));
    if (!pm) return s;
    const chord = parseChord(s);
    if (!chord || chord.nc) return s;
    const c2 = Object.assign({}, ctx || {}, { cls: chord.cls });
    const nr = spellRootInKey(chord.rootPc + semis, c2);
    let out = spellStr(nr, false) + chord.suffix;
    if (chord.bass) out += '/' + spellStr(spellRootInKey(chord.bassPc + semis, Object.assign({}, c2, { cls: 'maj' })), false);
    return out;
  }

  // 文章（リックの名前・説明）のなかの音名・コード名（C, Gm, B♭maj7, F♯ …）の根音だけを、semis 半音ずらす。接尾辞や度数はそのまま。
  // 「Dorian」「Bebop」のような語は触らない（根音のあとに続く小文字が、コードの種類の書き出しのときだけ根音とみなす）。ctx は spellInKey と同じ。
  // dl を渡すと、楽譜の音と同じ数え方（文字を dl つぶんずらして semis 半音上げる）で綴る。♯♭が2つ以上になるときだけ ctx で綴りなおす
  const QUAL_START = ['maj', 'min', 'dim', 'aug', 'sus', 'alt', 'add', 'm'];
  function transposeNotesInText(text, semis, ctx, dl) {
    const src = String(text == null ? '' : text);
    const dlm = dl == null ? null : mod(dl, 7);
    if (!mod(semis, 12) && !dlm) return src;
    return src.replace(/(^|[^A-Za-z0-9])([A-G])([♭♯#]|b(?![a-zA-Z]|[0-9]b))?/g, (m, pre, letter, acc, off) => {
      const end = off + m.length, rest = src.slice(end);
      if (/^[a-z]/.test(rest) && !QUAL_START.some(q => rest.indexOf(q) === 0)) return m;   // 語の一部（Dorian など）
      const a = !acc ? 0 : acc === 'b' || acc === '♭' ? -1 : 1;
      const li = LETTERS.indexOf(letter);
      const pc = mod(LETTER_PC[li] + a + semis, 12);
      if (dlm != null) {
        const nl = mod(li + dlm, 7), na = mod(pc - LETTER_PC[nl] + 6, 12) - 6;
        if (na >= -1 && na <= 1) return pre + spellStr({ l: nl, a: na }, true);
      }
      return pre + spellStr(spellInKey(pc, ctx || {}), true);
    });
  }

  /* ---------------- スケール辞典 ---------------- */
  // f：度数の並び（綴りは度数から決まる）。jp：日本語名。use：どんなときに使うか
  const SCALES = {
    ionian: { jp: 'アイオニアン（メジャー）', en: 'Ionian', f: '1 2 3 4 5 6 7', use: 'トニックの maj7・6。アヴォイドは4度' },
    dorian: { jp: 'ドリアン', en: 'Dorian', f: '1 2 b3 4 5 6 b7', use: 'm7 の定番。ii、モーダルな m7' },
    phrygian: { jp: 'フリジアン', en: 'Phrygian', f: '1 b2 b3 4 5 b6 b7', use: 'iii の m7（スペイン風）' },
    lydian: { jp: 'リディアン', en: 'Lydian', f: '1 2 3 #4 5 6 7', use: 'IV の maj7、浮遊感のある maj7（#11）' },
    mixolydian: { jp: 'ミクソリディアン', en: 'Mixolydian', f: '1 2 3 4 5 6 b7', use: 'ドミナント7th の基本。ブルースの I7 も' },
    aeolian: { jp: 'エオリアン（ナチュラルマイナー）', en: 'Aeolian', f: '1 2 b3 4 5 b6 b7', use: 'vi の m7、マイナーのトニック' },
    locrian: { jp: 'ロクリアン', en: 'Locrian', f: '1 b2 b3 4 b5 b6 b7', use: 'm7♭5 の基本形' },
    locrian2: { jp: 'ロクリアン♯2', en: 'Locrian #2', f: '1 2 b3 4 b5 b6 b7', use: 'm7♭5（ii ø）に使いやすい（9thが自然）' },
    melodicMinor: { jp: 'メロディックマイナー（ジャズ・マイナー）', en: 'Melodic Minor', f: '1 2 b3 4 5 6 7', use: 'm6、m(maj7) のトニックマイナー' },
    dorianb2: { jp: 'ドリアン♭2', en: 'Dorian b2', f: '1 b2 b3 4 5 6 b7', use: 'sus4(♭9) 系' },
    lydianAug: { jp: 'リディアン・オーグメンテッド', en: 'Lydian Augmented', f: '1 2 3 #4 #5 6 7', use: 'maj7(#5)' },
    lydianDom: { jp: 'リディアン♭7（リディアン・ドミナント）', en: 'Lydian b7', f: '1 2 3 #4 5 6 b7', use: '裏コード（♭II7）、7(#11)。ドミナントなのに解決しない所' },
    mixob6: { jp: 'ミクソリディアン♭6', en: 'Mixolydian b6', f: '1 2 3 4 5 b6 b7', use: 'マイナーに解決するV7（♭13）' },
    altered: { jp: 'オルタード（スーパーロクリアン）', en: 'Altered', f: '1 b2 #2 3 b5 b6 b7', use: 'V7 → 解決（特にマイナーへ）。♭9 ♯9 ♭5 ♭13 の緊張' },
    harmonicMinor: { jp: 'ハーモニックマイナー', en: 'Harmonic Minor', f: '1 2 b3 4 5 b6 7', use: 'マイナーのトニック（m(maj7)）' },
    phrygianDom: { jp: 'フリジアン・ドミナント', en: 'Phrygian Dominant', f: '1 b2 3 4 5 b6 b7', use: 'マイナーに解決する V7（♭9 ♭13）' },
    dimWH: { jp: 'ディミニッシュ（全・半）', en: 'Whole-Half Diminished', f: '1 2 b3 4 b5 b6 6 7', use: 'dim7 コード' },
    dimHW: { jp: 'コンビネーション・オブ・ディミニッシュ（半・全）', en: 'Half-Whole Diminished', f: '1 b2 #2 3 #4 5 6 b7', use: 'V7(♭9) ほか。コンディミ' },
    wholeTone: { jp: 'ホールトーン', en: 'Whole Tone', f: '1 2 3 #4 #5 b7', use: '7(♯5)、7(♭5)、オーギュメント' },
    bebopDom: { jp: 'ビバップ・ドミナント', en: 'Bebop Dominant', f: '1 2 3 4 5 6 b7 7', use: 'ドミナント7th。下降すると1・3・5・♭7 が拍の頭に来る' },
    bebopMaj: { jp: 'ビバップ・メジャー', en: 'Bebop Major', f: '1 2 3 4 5 b6 6 7', use: 'maj7・6。下降すると和音の音が拍の頭に来る' },
    bebopDorian: { jp: 'ビバップ・ドリアン', en: 'Bebop Dorian', f: '1 2 b3 3 4 5 6 b7', use: 'm7。♭3 と 3 を行き来する' },
    majPent: { jp: 'メジャー・ペンタトニック', en: 'Major Pentatonic', f: '1 2 3 5 6', use: 'maj7・6・ドミナントのシンプルなライン' },
    minPent: { jp: 'マイナー・ペンタトニック', en: 'Minor Pentatonic', f: '1 b3 4 5 b7', use: 'm7、ブルース。モダンな4度のライン' },
    blues: { jp: 'ブルース・スケール', en: 'Blues', f: '1 b3 4 b5 5 b7', use: 'ブルース。ドミナントにも m にも' },
    majBlues: { jp: 'メジャー・ブルース', en: 'Major Blues', f: '1 2 b3 3 5 6', use: 'ブルースの I7、明るいブルース' },
  };
  function scaleNotes(rootSp, id) {
    const sc = SCALES[id];
    if (!sc) return [];
    return sc.f.split(' ').map(d => degreeSpell(rootSp, d) || spellFromPc(spellPc(rootSp) + parseDegree(d).semis, false));
  }
  const scalePcs = (rootPc, id) => SCALES[id].f.split(' ').map(d => mod(rootPc + parseDegree(d).semis, 12));

  // コードだけから決まる、いちばん素直なスケール候補（文脈による選びなおしは analysis.js）
  function defaultScales(chord) {
    if (!chord || chord.nc) return [];
    const e = chord.ext;
    const has = (n, a) => e[n] && e[n].indexOf(a) >= 0;
    switch (chord.cls) {
      case 'maj':
        if (chord.third === 'M' && has(11, 1)) return ['lydian', 'ionian'];
        if (chord.seventh === '7' && chord.fifth === 1) return ['lydianAug'];
        return ['ionian', 'lydian', 'bebopMaj'];
      case 'min':

/* アドリブ・ラボ：コード譜の文字 → 小節・コードの並び（画面を持たない）。
   書き方（iReal Pro に似せたもの）：
     | Dm7 | G7 | Cmaj7 | % |        … 縦線で小節を区切る。% は前の小節をくり返す
     | Dm7 G7 | Cmaj7 . . . |        … 1小節に複数のコード（均等に分ける）。. は「前のコードを1拍のばす」
     |: A :| / [1 … :| [2 …          … くり返し記号、1番・2番かっこ
     *A *B  /  [A] [B]               … セクション記号（表示用）
     N.C.   C/E   Dm7/G              … ノーコード、スラッシュコード（分数コード）
     // メモ   # メモ                 … 行末までコメント

  'use strict';

  const C = (AL.C = AL.C || {});

  /* ---------------- 字句に分ける ---------------- */
  // 戻り値：[{t:'word'|'bar'|'dbar'|'rstart'|'rend'|'end'|'ending'|'section'|'repeat', s, n, i, j}]
  function tokenize(text) {
    const toks = [], len = text.length;
    let i = 0;

      if (ch === '#') { while (i < len && text[i] !== '\n') i++; continue; }   // 語の頭の # はコメント（C#m7 の # は語の途中なので別）
      const st = i;

        if (text[i + 1] === '|') { toks.push({ t: 'dbar', i: st, j: st + 2 }); i += 2; }
        else if (text[i + 1] === ':') { toks.push({ t: 'rstart', i: st, j: st + 2 }); i += 2; }
        else if (text[i + 1] === ']') { toks.push({ t: 'end', i: st, j: st + 2 }); i += 2; }
        else { toks.push({ t: 'bar', i: st, j: st + 1 }); i++; }
        continue;
      }
      if (ch === ':' && text[i + 1] === '|') { toks.push({ t: 'rend', i: st, j: st + 2 }); i += 2; continue; }
      if (ch === '[' && /\d/.test(text[i + 1] || '')) {
        let j = i + 1; while (j < len && /\d/.test(text[j])) j++;

        if (text[j] === ']' || text[j] === '.') j++;

        let j = i + 1; while (j < len && text[j] !== ']' && text[j] !== '\n') j++;

      const out = [];
      toks.forEach(tk => { out.push(tk); if (tk.t === 'word' || tk.t === 'repeat') out.push({ t: 'bar', i: tk.j, j: tk.j }); });

    }
    const bars = [];
    let cells = [], repeatStart = false, section = null, curEnding = null;
    const flush = (repeatEnd) => {
      if (!cells.length) {
        if (repeatEnd && bars.length) { bars[bars.length - 1].repeatEnd = true; if (bars[bars.length - 1].ending === 1) curEnding = null; }

      }
      const b = buildBar(cells, bpb, bars, errors, bars.length + 1);
      const first = cells[0].i, last = cells[cells.length - 1].j;
      cells = [];
      if (!b) return;
      b.idx = bars.length; b.i = first; b.j = last;

      b.section = section; section = null;
      b.ending = curEnding;
      b.repeatEnd = !!repeatEnd;
      if (repeatEnd && curEnding === 1) curEnding = null;
      bars.push(b);

      switch (tk.t) {
        case 'bar': case 'dbar': case 'end': flush(false); break;

  function analyze(hs, opts) {

    const bpb = opts.beatsPerBar || 4;
    const est = estimateKey(hs, bpb);
    const key = opts.key ? keyInfo(opts.key.tonicPc, opts.key.mode, hs) : keyInfo(est.tonicPc, est.mode, hs);
    key.auto = !opts.key;
    key.candidates = est.list.map(r => keyInfo(r.tonicPc, r.mode, hs));

    const matches = findMatches(hs);
    const phrases = segment(hs, matches, opts);
    const primaryAt = {};
    phrases.forEach(ph => { if (ph.match) for (let k = 0; k < ph.n; k++) primaryAt[ph.from + k] = ph.match; });
    const form = detectForm(hs, key, bpb);
    const n = hs.length;
    const chords = hs.map((h, i) => ({ i, h, chord: h.chord, roles: [], chips: [], scales: [], roman: h.chord.nc ? 'N.C.' : T.romanLabel(h.chord, key.tonicPc), fn: 'X', diatonic: false }));
    const next = i => { const j = i + 1 < n ? i + 1 : (opts.cyclic === false ? -1 : 0); return j < 0 ? null : hs[j]; };

    for (let i = 0; i < n; i++) {
      const h = hs[i], c = h.chord, roles = chords[i].roles;
      if (c.nc) { roles.push({ kind: 'info', tone: 'x', label: 'N.C.', title: 'ノーコード', text: '和音のない小節。休符として扱う。', scales: [] }); chords[i].chips = [{ label: 'N.C.', tone: 'x' }]; continue; }
      if (c.bad) continue;

      // 1) パターンの一員。実際に使う区切り（primary）を先頭に。ほかのパターンは補足
      const covering = matches.filter(m => i >= m.at && i < m.at + m.n).sort((a, b) => b.n - a.n || b.pattern.score - a.pattern.score);
      const prim = primaryAt[i];
      const patRoles = covering.map(m => {
        const p = m.pattern, k = i - m.at;
        const keyName = T.spellStr(m.tonicSpell, true) + (m.mode === 'minor' ? 'm' : '');
        return {
          kind: 'pattern', primary: m === prim, tone: p.tones[k], label: p.names[k], pat: m.id, patAt: m.at, patIndex: k, patName: p.jp,
          title: `${p.jp.replace(/（.*$/, '')}の ${p.names[k]}`,
          text: patternText(p, k, m, hs, keyName), scales: scalesForName(p.names[k], m.mode),
        };
      });
      patRoles.filter(r => r.primary).forEach(r => roles.push(r));

      // 2) キー内での働き
      const dr = diatonicRole(c, key);
      if (dr) { roles.push(dr); chords[i].fn = dr.fn; chords[i].diatonic = true; }
      // 3) 借用和音
      const br = borrowRole(c, key);
      if (br && !dr) { roles.push(br); }

      // 4) ドミナントの働き（セカンダリー・ドミナント／裏コード／バックドア／連鎖）
      const nx = next(i);
      if (P.domLike(c) && nx && !nx.chord.nc && !nx.chord.bad) {
        const nc = nx.chord, mv = mod(nc.rootPc - c.rootPc, 12), dT = mod(nc.rootPc - key.tonicPc, 12);
        const wrap = nx === hs[0] && i === n - 1;
        const tgt = ctext(nx) + (wrap ? '（次のコーラスの頭）' : '');
        const minorTgt = nc.cls === 'min' || nc.cls === 'minmaj';
        if (mv === 5) {
          if (dT !== 0) {
            const relMajor = key.mode === 'minor' && dT === 3;
            roles.push({ kind: 'sec', fn: 'X', tone: 'd', label: relMajor ? 'V7/♭III' : 'V7/' + rn(nc.rootPc, key.tonicPc), title: relMajor ? `平行調（${ctext(nx)}）へのドミナント` : `セカンダリー・ドミナント（V7/${rn(nc.rootPc, key.tonicPc)}）`, text: relMajor ? `${tgt} に向かう V7。マイナー・キーの平行調（メジャー）のトニックへ解決する。` : `${tgt} に向かうドミナント7th。${ctext(nx)} を一時的なトニックと見立てて弾く。`, scales: minorTgt ? ['phrygianDom', 'altered', 'dimHW'] : ['mixolydian', 'altered', 'dimHW'] });
          } else if (P.dom(nc)) {
            roles.push({ kind: 'sec', fn: 'X', tone: 'd', label: 'V7→I7', title: 'ドミナントの連鎖', text: `${tgt} に向かうドミナント7th どうしのつながり（ブルースの I7→IV7 など）。`, scales: ['mixolydian', 'bebopDom', 'blues'] });
          } else {
            roles.push({ kind: 'sec', fn: 'D', tone: 'd', label: 'V→' + (minorTgt ? 'i' : 'I'), title: `ドミナント・モーション（${tgt} へ解決）`, text: `5度下（4度上）の ${tgt} へ解決する。解決先が${minorTgt ? 'マイナーなので、♭9・♭13 のオルタード系が合う' : 'メジャーなので、ミクソリディアンでもオルタードでもよい'}。`, scales: minorTgt ? ['phrygianDom', 'altered', 'dimHW'] : ['mixolydian', 'altered', 'dimHW'] });
          }
        } else if (mv === 11 && P.dom(c)) {
          const sub = T.chordText(T.parseChord(T.spellStr(T.spellFromPc(nc.rootPc + 7, T.keyPrefersFlat(nc.root, 'major'))) + '7'), true);
          roles.push({ kind: 'sub', fn: 'X', tone: 'd', label: dT === 0 ? '♭II7（裏）' : 'subV7/' + rn(nc.rootPc, key.tonicPc), title: `裏コード（トライトーン・サブスティテューション）${dT === 0 ? '：♭II7' : ''}`, text: `${tgt} に半音下から解決する。${sub} の代わりに使える裏コード（ルートが三全音ちがう）。リディアン♭7 で弾くと色が出る。`, scales: ['lydianDom', 'mixolydian', 'altered'] });
        } else if (mv === 2 && P.dom(c) && dT === 0) {
          roles.push({ kind: 'sub', fn: 'X', tone: 'd', label: '♭VII7（バックドア）', title: 'バックドア・ドミナント（♭VII7→I）', text: `${tgt} に全音下から入る「裏口」の解決。IVm7–♭VII7–I の形でよく出る。ミクソリディアン（またはリディアン♭7）で弾く。`, scales: ['mixolydian', 'lydianDom', 'bebopDom'] });
        } else if (mv === 2 && mod(c.rootPc - key.tonicPc, 12) === 7 && key.mode === 'major') {
          roles.push({ kind: 'sec', fn: 'D', tone: 'd', label: '偽終止', title: '偽終止（V7→VIm）', text: 'V7 が I ではなく VIm7 へ進む「だまし」の終止。', scales: ['mixolydian', 'altered'] });
        }
      }
      // 5) ディミニッシュ
      if (c.cls === 'dim' && nx && !nx.chord.nc) {
        const mv = mod(nx.chord.rootPc - c.rootPc, 12);
        if (mv === 1) roles.push({ kind: 'dim', fn: 'X', tone: 'x', label: '経過の°7', title: '経過のディミニッシュ（半音上へ解決）', text: `${ctext(nx)} の半音下から入る dim7。V7(♭9) のルートを抜いた形と同じ働きで、${ctext(nx)} への「通り道」。`, scales: ['dimWH', 'dimHW'] });
        else if (mv === 11) roles.push({ kind: 'dim', fn: 'X', tone: 'x', label: '下行の°7', title: '下行のディミニッシュ', text: `半音下の ${ctext(nx)} へ降りていく途中の dim7。`, scales: ['dimWH'] });
        else roles.push({ kind: 'dim', fn: 'X', tone: 'x', label: 'dim7', title: 'ディミニッシュ7th', text: 'dim7 は4つの音が短3度で並ぶ対称な和音。どの音から数えても同じ形になる。全・半のディミニッシュ・スケールで弾く。', scales: ['dimWH'] });
      }
      // 6) モーダル（長く続く1つのコード）
      const endOfTonic = matches.some(m => i === m.at + m.n - 1 && m.pattern.tones[m.n - 1] === 't');
      if (h.dur >= 2 * bpb - 1e-6 && !endOfTonic && !prim && (c.cls === 'min' || c.cls === 'dom' || c.cls === 'maj' || c.cls === 'sus')) {
        const sc = T.defaultScales(c);
        roles.push({ kind: 'modal', fn: 'X', tone: 'x', label: 'モーダル', title: '長く続く1コード（モーダルな扱い）', text: `${ctext(h)} が長く続くので、コードの動きにこだわらず「${T.SCALES[sc[0]].jp}」の1つの音階でじっくり弾ける。`, scales: sc });
      }
      // 7) ブルース形式
      if (form) {
        const bar = Math.floor(h.t0 / bpb + 1e-6), d = mod(c.rootPc - key.tonicPc, 12);
        const nm = d === 0 ? 'I' : d === 5 ? 'IV' : d === 7 ? 'V' : null;
        if (nm && (c.cls === 'dom' || c.cls === 'min' || c.cls === 'sus')) roles.push({ kind: 'blues', fn: 'X', tone: d === 0 ? 't' : d === 5 ? 'sd' : 'd', label: 'ブルース ' + nm, title: `${form.minor ? 'マイナー・' : ''}ブルースの ${nm}（${bar + 1} 小節目）`, text: `12小節ブルースの${nm}。ブルース・スケールとミクソリディアンを行き来して弾ける。`, scales: form.minor ? ['minPent', 'blues', 'dorian'] : ['blues', 'mixolydian', 'majBlues', 'bebopDom'] });
      }
      // 8) どの役割もなければ
      if (!roles.length) {
        roles.push({ kind: 'other', fn: 'X', tone: 'x', label: T.romanLabel(c, key.tonicPc), title: 'キーの外のコード', text: 'このキーのダイアトニック・コードではない。前後のつながりを見て、コードトーンを手がかりに弾く。', scales: T.defaultScales(c) });
      }
      // 補足：ほかのパターンの一員としても見られる
      patRoles.filter(r => !r.primary).forEach(r => { r.chip = false; roles.push(r); });

      // スケールの候補（役割の順に重複なし）。コードに指定のテンションがあれば、その指定が優先
      const seen = [];
      for (const r of roles) for (const sc of (r.scales || [])) if (seen.indexOf(sc) < 0) seen.push(sc);
      if (!seen.length) T.defaultScales(c).forEach(sc => seen.push(sc));
      if (c.hasAlt && c.cls === 'dom') T.defaultScales(c).slice().reverse().forEach(sc => { const k = seen.indexOf(sc); if (k >= 0) seen.splice(k, 1); seen.unshift(sc); });
      chords[i].scales = seen.slice(0, 5);
      chords[i].pools = poolsFor(h, chords[i], key, matches, form, nx);

      // 画面に出す札（最大3つ）：①キーの中のローマ数字　②区切りのパターン　③特別な働き
      const chips = [];
      const fnRole = roles.find(r => r.kind === 'func') || roles.find(r => r.kind === 'borrow') || roles.find(r => r.kind === 'other');
      if (fnRole) chips.push({ label: chords[i].roman, tone: fnRole.tone || 'x', kind: 'roman', fn: fnRole.fn });
      const pr = roles.find(r => r.kind === 'pattern' && r.primary);
      if (pr) chips.push({ label: pr.label, sub: pr.patName.replace(/（.*$/, ''), tone: pr.tone, kind: 'pattern' });
      const sp = roles.find(r => ['sec', 'sub', 'dim', 'borrow', 'modal', 'blues'].indexOf(r.kind) >= 0 && r !== fnRole);
      if (sp) chips.push({ label: sp.label, tone: sp.tone || 'x', kind: sp.kind });
      chords[i].chips = chips;
    }
    return { key, matches, chords, phrases, form, bpb };
  }

  function patternText(p, k, m, hs, keyName) {
    const nm = p.names[k], who = T.chordText(hs[m.at + k].chord, true);
    const key = `${keyName}`;
    switch (p.id) {
      case 'ii-V-I': return k === 0 ? `${who} は ${key} の ii。V7 へ進む「準備」の和音で、ドリアンで弾く。` : k === 1 ? `${who} は ${key} の V。次の I へ解決するための緊張の和音。` : `${who} は ${key} の I。ii–V–I のゴール（着地点）。`;
      case 'ii-V-I7': return k === 0 ? `${who} は ii。V7 を経て I7（ブルースの主和音）へ向かう。` : k === 1 ? `${who} は V。I7 へ解決するドミナント。` : `${who} は I7。ブルースの着地点（ドミナント7th のまま落ち着く）。`;
      case 'ii-V-i': return k === 0 ? `${who} は ${key} マイナーの iiø。ロクリアン♯2 で弾く。` : k === 1 ? `${who} は ${key} マイナーの V。♭9・♭13 のオルタード系で強く解決へ向かう。` : `${who} は ${key} マイナーの i。ゴール。`;
      case 'ii-V': return k === 0 ? `${who} は ii。つづく V7 とセットの「ツーファイブ」。` : `${who} は V。解決先（${key}）へ向かう。`;
      case 'iio-V': return k === 0 ? `${who} は iiø。マイナーのツーファイブの前半。` : `${who} は V。${key} へ向かうオルタード系のドミナント。`;
      case 'V-I': case 'V-i': return k === 0 ? `${who} は ${key} へ解決する V7。` : `${who} は V7 の解決先（${key}）。`;
      case 'I-vi-ii-V': case 'I-VI-ii-V': case 'iii-vi-ii-V': case 'I-#Io-ii-V': return `${who} は ${key} のターンアラウンドの ${nm}。I に戻るための 4 コードのつながり。`;
      case 'ii-bII-I': return `${who} は ${nm}。ii–V の V を裏コードにした形。ルートが半音ずつ下がってなめらかに I へ。`;
      case 'iv-bVII-I': return `${who} は ${nm}。ii–V の代わりにサブドミナント・マイナーから入る「バックドア」。`;
      case 'bII-I': case 'bII-i': return `${who} は ${nm}。半音下から解決する裏コード。`;
      case 'bVII-I': return `${who} は ${nm}。全音下から I に入る裏口の解決。`;
      case 'V-I7': return `${who} は ${nm}。ドミナント7th どうしが 5度下行でつながる。`;
      case 'IV7-I7': return `${who} は ${nm}。ブルースで IV7 から I7 に戻る動き。`;
      case 'min-cliche': return `${who}：同じルートで内声が半音ずつ下がるクリシェ。`;
      default: return `${who} は ${nm}。`;
    }
  }

  /* ---------------- ブルース形式 ---------------- */
  function detectForm(hs, key, bpb) {
    const total = hs.reduce((a, h) => a + h.dur, 0);
    if (Math.abs(total / bpb - 12) > 1e-6) return null;
    const at = b => { const t = b * bpb + 1e-6; for (const h of hs) if (h.t0 <= t && t < h.t0 + h.dur) return h.chord; return null; };
    const rel = b => { const c = at(b); return !c || c.nc ? -1 : mod(c.rootPc - key.tonicPc, 12); };
    let s = 0;
    if (rel(0) === 0) s++;
    if (rel(1) === 5 || rel(1) === 0) s++;
    if (rel(4) === 5) s++;
    if (rel(6) === 0) s++;
    if (rel(8) === 7 || rel(8) === 2) s++;
    if (rel(10) === 0) s++;
    if (s < 5) return null;
    const c0 = at(0), c4 = at(4);
    const dom = c => c && (c.cls === 'dom' || c.cls === 'sus');
    const minor = c0 && c0.cls === 'min' && c4 && (c4.cls === 'min' || c4.cls === 'dom');
    if (!(dom(c0) || minor)) return null;
    return { type: minor ? 'minor-blues' : 'blues', minor: !!minor, name: minor ? 'マイナー・ブルース（12小節）' : 'ブルース（12小節）' };
  }

  /* ---------------- ソロの「プール」（単独のコードに使うリックの種類） ---------------- */
  function poolsFor(h, info, key, matches, form, nx) {
    const c = h.chord, out = [];
    const push = (ctx, w) => out.push({ ctx, w });
    const toMinor = nx && !nx.chord.nc && (nx.chord.cls === 'min' || nx.chord.cls === 'minmaj') && mod(nx.chord.rootPc - c.rootPc, 12) === 5;
    const lyd = info.roles.some(r => r.kind === 'sub') || info.roles.some(r => r.fn === 'SD' && r.diatonic && c.cls === 'maj');
    const has = (n, a) => c.ext[n] && c.ext[n].indexOf(a) >= 0;
    switch (c.cls) {
      case 'maj':
        push('maj7', 3);
        if (lyd || has(11, 1)) push('maj7#11', 2);
        break;
      case 'min': if (c.six) { push('min6', 3); push('min7', 1); } else push('min7', 3); break;
      case 'minmaj': push('minmaj7', 3); push('min6', 1); break;
      case 'hdim': push('m7b5', 3); break;
      case 'dim': push('dim7', 3); break;
      case 'aug': push('dom7alt', 3); break;
      case 'sus': push('dom7sus', 3); push('dom7', 1); break;
      case 'dom': {
        const hardAlt = c.alt || has(9, -1) || has(9, 1) || has(13, -1) || c.fifth !== 0;
        const sharp11 = has(11, 1) && !hardAlt;
        if (hardAlt) { push('dom7alt', 4); }
        else if (sharp11) { push('dom7#11', 4); push('dom7', 1); }
        else if (info.roles.some(r => r.kind === 'sub')) { push('dom7#11', 3); push('dom7', 2); }
        else if (toMinor) { push('dom7alt', 3); push('dom7', 2); }
        else if (form && !form.minor) { push('blues7', 3); push('dom7', 2); }
        else { push('dom7', 4); push('dom7alt', 1); }
        break;
      }
      default: push('maj7', 1);
    }
    return out;
  }

  /* ---------------- フレーズに区切る ---------------- */
  // 最も得点の高い「パターンの敷きつめ」を選ぶ（長いパターンほど優先。重ならない）
  // 戻り値：[{from, n, pat（パターンのid or null）, match}]
  function segment(hs, matches, opts) {
    opts = opts || {};
    const n = hs.length;
    const best = new Array(n + 1).fill(-Infinity); best[n] = 0;
    const take = new Array(n + 1).fill(null);
    const byStart = {};
    matches.forEach(m => { (byStart[m.at] = byStart[m.at] || []).push(m); });
    const skip = opts.skip || {};
    for (let i = n - 1; i >= 0; i--) {
      best[i] = 1 + best[i + 1]; take[i] = null;
      for (const m of (byStart[i] || [])) {
        if (skip[m.id]) continue;
        if (opts.canUse && !opts.canUse(m)) continue;
        const sc = m.pattern.score * (opts.preferShort ? 0.5 : 1) + best[i + m.n];
        if (sc > best[i]) { best[i] = sc; take[i] = m; }
      }
    }
    const out = [];
    for (let i = 0; i < n;) {
      const m = take[i];
      if (m) { out.push({ from: i, n: m.n, pat: m.id, match: m }); i += m.n; }
      else { out.push({ from: i, n: 1, pat: null, match: null }); i++; }
    }
    return out;
  }

  Object.assign(A, { PATTERNS, PAT_BY_ID, P, analyze, estimateKey, findMatches, detectForm, segment, poolsFor, FN_JP });
  if (typeof module !== 'undefined' && module.exports) module.exports = AL;
})();

/* アドリブ・ラボ：リック辞典のしくみ（記法の読みとり・検査・移調・検索）。リックの中身（データ）は licks-*.js。
   ■ リックの書き方
   リックは「C の調で、楽譜を読むように音名で」書く。読みこむとき、コードのルートとの関係（度数）に自動で直すので、
   どの調にも移調できる（綴りは崩れない：G7 の ♭9 は A♭、♯9 は A♯ などが正しく出る）。
     C5 B4 Bb4 A4 G4 F4 E4 D4      … 音名＋オクターブ（C4 = 真ん中のド）。何も書かなければ8分音符
     C5:q  E4:h  G4:q.  D5:e.      … 長さ：w 全 h 2分 q 4分 e 8分 s 16分 t 3連の8分 T 3連の4分、 . は付点
     r  r:q                        … 休符
     @s  @e                        … これ以降の標準の長さを変える（16分の連続などに）
     |                             … 小節線（拍の数が合っているかの確認用。置いた位置が小節の頭でないと検査で落ちる）
     <                             … これより前は「前の小節から入るアウフタクト（食い）」
     /                             … ここでフレーズを切ってもよい（コードが短いときは、ここまでを使う）
     C5>  C5^  C5~                 … アクセント、スタッカート、次の同じ音にタイ
   ■ 登録：L.pack({ ctx, ref, segs, tags, lvl }, [ [名前, 音, 解説, 追加指定], … ])
     ctx：どんなコードに使えるか（'dom7' 単体、'ii-V-I' のように複数コードなど）
     ref：音を書いたときのコード（'C7' や ['Dm7','G7','Cmaj7']）。segs：各コードの拍数。 */
(function () {
  'use strict';
  const root = typeof window !== 'undefined' ? window : globalThis;
  const AL = (root.AL = root.AL || {});
  const T = AL.T;
  const L = (AL.L = AL.L || {});
  const mod = T.mod;
  const LPC = [0, 2, 4, 5, 7, 9, 11];   // C D E F G A B の高さ（半音）
  L.all = []; L.byId = {}; L.byCtx = {}; L.errors = [];
  const TPB = 12;   // 1拍 = 12 ティック（2・3・4 分割がすべて割りきれる）

  /* ---------------- 種類（ctx）の一覧：画面の分類にも使う ---------------- */
  L.CTX = {
    // ---- コード単体 ----
    'dom7': { group: 'single', jp: 'ドミナント7th（ミクソリディアン）', ref: 'C7', note: 'G7・C7・F7 などの7thコード全般。ブルース、解決しない7thにも' },
    'dom7alt': { group: 'single', jp: 'オルタード・ドミナント（♭9 ♯9 ♭13）', ref: 'C7alt', note: 'マイナーへ解決するV7、7(♭9)・7(♯9)・7alt などの緊張したドミナント' },
    'dom7#11': { group: 'single', jp: 'リディアン♭7（7♯11・裏コード）', ref: 'C7#11', note: '♭II7（裏コード）、7(♯11)、解決しない浮遊したドミナント' },
    'dom7sus': { group: 'single', jp: '7sus4', ref: 'C7sus4', note: '7sus4・sus4・11 のコード。ペンタトニックや4度の積み重ねが合う' },
    'blues7': { group: 'single', jp: 'ブルースのドミナント', ref: 'C7', note: '12小節ブルースの I7・IV7・V7。ブルース・スケールの語り口' },
    'maj7': { group: 'single', jp: 'メジャー7th（トニック）', ref: 'Cmaj7', note: 'Imaj7・IVmaj7・6・69 など長調のコード' },
    'maj7#11': { group: 'single', jp: 'リディアン（maj7♯11）', ref: 'Cmaj7#11', note: 'IVmaj7・♭VImaj7・♭IIImaj7 などの浮遊感のある maj7' },
    'min7': { group: 'single', jp: 'マイナー7th（ドリアン）', ref: 'Cm7', note: 'IIm7・IIIm7・VIm7・Im7 など、m7 全般' },
    'min6': { group: 'single', jp: 'マイナー6th（ドリアン／メロディックマイナー）', ref: 'Cm6', note: 'm6 のトニック・マイナー' },
    'minmaj7': { group: 'single', jp: 'マイナー・メジャー7th', ref: 'Cm(maj7)', note: 'm(maj7) とマイナー・クリシェ' },
    'm7b5': { group: 'single', jp: 'ハーフディミニッシュ（m7♭5）', ref: 'Cm7b5', note: 'IIm7♭5・VIIm7♭5。ロクリアン♯2' },
    'dim7': { group: 'single', jp: 'ディミニッシュ7th', ref: 'Cdim7', note: '経過のディミニッシュ。全・半のスケール、短3度で動く' },
    // ---- 2コード ----
    'V-I': { group: 'two', jp: 'V7 → Imaj7（メジャーへ解決）', ref: ['G7', 'Cmaj7'], note: '5度下行の解決。V7 から I の 3rd や 5th へ' },
    'V-i': { group: 'two', jp: 'V7 → Im7（マイナーへ解決）', ref: ['G7alt', 'Cm7'], note: 'オルタードやフリジアン・ドミナントでマイナーへ' },
    'ii-V': { group: 'two', jp: 'IIm7 → V7（ツーファイブ）', ref: ['Dm7', 'G7'], note: '2-5。解決先がなくても使える ii–V（次の I は別のフレーズで）' },
    'iio-V': { group: 'two', jp: 'IIm7♭5 → V7（マイナーのツーファイブ）', ref: ['Dm7b5', 'G7alt'], note: 'マイナーの ii–V（解決先がなくても）' },
    'bII-I': { group: 'two', jp: '♭II7 → Imaj7（裏コードの解決）', ref: ['Db7', 'Cmaj7'], note: '半音下からの解決。リディアン♭7' },
    'bII-i': { group: 'two', jp: '♭II7 → Im7（裏コードからマイナーへ）', ref: ['Db7', 'Cm7'], note: '半音下からマイナーへ' },
    'bVII-I': { group: 'two', jp: '♭VII7 → Imaj7（バックドア）', ref: ['Bb7', 'Cmaj7'], note: '全音下から入る裏口の解決' },
    'V-I7': { group: 'two', jp: 'V7 → I7（ドミナントの連鎖・ブルースの I7→IV7）', ref: ['C7', 'F7'], note: 'ドミナント7th が5度下行でつながる。ブルースの I7→IV7' },
    'IV7-I7': { group: 'two', jp: 'IV7 → I7（ブルースの下属→主）', ref: ['F7', 'C7'], note: 'ブルースの IV7→I7' },
    // ---- 3コード ----
    'ii-V-I': { group: 'three', jp: 'ii–V–I（ツーファイブワン・メジャー）', ref: ['Dm7', 'G7', 'Cmaj7'], note: '2-5-1。ジャズの基本。ii の準備 → V の緊張 → I の着地' },
    'ii-V-i': { group: 'three', jp: 'ii–V–i（ツーファイブワン・マイナー）', ref: ['Dm7b5', 'G7alt', 'Cm7'], note: 'マイナーの 2-5-1。♭9・♭13 のオルタード系' },
    'ii-bII-I': { group: 'three', jp: 'ii–♭II7–I（裏コードのツーファイブ）', ref: ['Dm7', 'Db7', 'Cmaj7'], note: 'V7 を裏コードにした ii–V–I。ルートが半音ずつ下がる' },
    'iv-bVII-I': { group: 'three', jp: 'バックドア ii–V（IVm7–♭VII7–I）', ref: ['Fm7', 'Bb7', 'Cmaj7'], note: 'サブドミナント・マイナーから入る裏口の ii–V' },
    // ---- 4コード（ターンアラウンド） ----
    'I-vi-ii-V': { group: 'four', jp: 'ターンアラウンド I–vi–ii–V', ref: ['Cmaj7', 'Am7', 'Dm7', 'G7'], note: 'イチロクニゴー。1小節を2コードずつなどで次々に' },
    'I-VI-ii-V': { group: 'four', jp: 'ターンアラウンド I–VI7–ii–V', ref: ['Cmaj7', 'A7', 'Dm7', 'G7'], note: 'リズムチェンジのAセクション前半など' },
    'iii-vi-ii-V': { group: 'four', jp: 'ターンアラウンド iii–VI7–ii–V', ref: ['Em7', 'A7', 'Dm7', 'G7'], note: '5度下行でつながる定番の4コード' },
    'I-#Io-ii-V': { group: 'four', jp: 'ターンアラウンド I–♯Io7–ii–V', ref: ['Cmaj7', 'C#dim7', 'Dm7', 'G7'], note: '経過のディミニッシュで半音上がる' },
  };
  L.GROUPS = [
    { id: 'three', jp: '3つのコードのかたまり（ii–V–I 系）' },
    { id: 'two', jp: '2つのコードのかたまり（V→I・ii–V など）' },
    { id: 'four', jp: 'ターンアラウンド（4つのコード）' },
    { id: 'single', jp: 'コード1つに使えるリック' },
  ];

  /* ---------------- 音の読みとり ---------------- */
  const BASE = { w: 48, h: 24, q: 12, e: 6, s: 3, t: 4, T: 8 };
  function ticksOf(code) {
    const dotted = code.endsWith('.'), b = BASE[code[0]];
    if (b == null) return null;
    if (!dotted) return b;
    return b % 2 === 0 ? b * 3 / 2 : null;
  }
  const NOTE_RE = /^([A-G](?:##|bb|#|b)?-?\d)(?::([whqestT]\.?))?([>^~]*)$/;

  function parseNotes(text) {
    const toks = String(text == null ? '' : text).trim().split(/\s+/).filter(Boolean);
    const out = { events: [], bars: [], cuts: [], errors: [], pickup: 0 };
    let def = BASE.e, tick = 0, pick = null;
    for (const tk of toks) {
      let m;
      if (tk === '|') { out.bars.push(tick); continue; }
      if (tk === '/') { out.cuts.push(tick); continue; }
      if (tk === '<') { pick = tick; continue; }
      if ((m = /^@([whqestT]\.?)$/.exec(tk))) { const d = ticksOf(m[1]); if (d == null) out.errors.push('長さが読めない：' + tk); else def = d; continue; }
      if ((m = /^r(?::([whqestT]\.?))?$/.exec(tk))) {
        const d = m[1] ? ticksOf(m[1]) : def;
        if (d == null) { out.errors.push('長さが読めない：' + tk); continue; }
        out.events.push({ t12: tick, d12: d, rest: true }); tick += d; continue;
      }
      if ((m = NOTE_RE.exec(tk))) {
        const d = m[2] ? ticksOf(m[2]) : def;
        const p = T.parsePitch(m[1]);
        if (d == null || !p) { out.errors.push('読めない：' + tk); continue; }
        out.events.push({ t12: tick, d12: d, rest: false, p, midi: T.pitchMidi(p), tie: m[3].includes('~'), accent: m[3].includes('>'), stac: m[3].includes('^') });
        tick += d; continue;
      }
      out.errors.push('読めない：' + tk);
    }
    out.total12 = tick;
    if (pick != null) {
      for (const e of out.events) e.t12 -= pick;
      out.bars = out.bars.map(b => b - pick); out.cuts = out.cuts.map(c => c - pick);
      out.pickup = pick; out.total12 = tick - pick;
    }
    return out;
  }

  /* ---------------- 検査用：その場面で使ってよい音 ---------------- */
  function allowedPcs(refChord, lick) {
    const sets = [];
    const add = ids => ids.forEach(id => sets.push(T.scalePcs(refChord.rootPc, id)));
    const alt = lick.tags.indexOf('alt') >= 0;
    switch (refChord.cls) {
      case 'maj': add(['ionian', 'lydian', 'bebopMaj', 'majPent']); if (lick.tags.indexOf('blues') >= 0) add(['majBlues']); break;
      case 'min':
        if (refChord.six) add(['dorian', 'melodicMinor', 'bebopDorian']); else add(['dorian', 'aeolian', 'bebopDorian', 'minPent']);
        if (lick.tags.indexOf('blues') >= 0) add(['blues']);
        break;
      case 'minmaj': add(['melodicMinor', 'harmonicMinor']); break;
      case 'dom':
        if (refChord.hasAlt || alt || lick.ctx === 'dom7alt') add(['altered', 'dimHW', 'wholeTone', 'phrygianDom', 'mixob6']);
        else add(['mixolydian', 'bebopDom']);
        if (lick.tags.indexOf('blues') >= 0) add(['blues', 'majBlues']);
        if (lick.tags.indexOf('lydian') >= 0 || lick.ctx === 'dom7#11' || lick.ctx === 'bII-I' || lick.ctx === 'bII-i' || lick.ctx === 'ii-bII-I') add(['lydianDom']);
        if (lick.ctx === 'dom7alt' || /^(ii-V-i|iio-V|V-i|bII-i)$/.test(lick.ctx) || alt) add(['mixolydian']);
        if (lick.ctx !== 'dom7alt' && (/^(ii-V|V-I|bII-I|ii-bII-I|iv-bVII-I|bVII-I|I-vi-ii-V|I-VI-ii-V|iii-vi-ii-V|I-#Io-ii-V|ii-V-I)$/.test(lick.ctx))) add(['altered', 'dimHW']);
        break;
      case 'hdim': add(['locrian2', 'locrian']); break;
      case 'dim': add(['dimWH', 'dimHW']); break;
      case 'sus': add(['mixolydian', 'dorian', 'minPent']); break;
      case 'aug': add(['wholeTone', 'lydianAug']); break;
      default: add(['ionian']);
    }
    const set = new Set();
    sets.forEach(a => a.forEach(pc => set.add(pc)));
    if (lick.ctx === 'blues7' || lick.tags.indexOf('blues') >= 0) T.scalePcs(refChord.rootPc, 'blues').forEach(pc => set.add(pc));
    refChord.pcs.forEach(pc => set.add(pc));
    return set;
  }

  /* ---------------- 組み立て ---------------- */
  const counters = {};
  function compile(spec) {
    const errs = [];
    const refSrc = [].concat(spec.ref);
    const ref = refSrc.map(s => T.parseChord(s));
    if (ref.some(c => !c)) errs.push('ref のコードが読めない：' + refSrc.join(' '));
    const segs = spec.segs ? spec.segs.slice() : ref.map(() => 4);
    if (segs.length !== ref.length) errs.push('segs と ref の数が合わない');
    const pr = parseNotes(spec.notes);
    pr.errors.forEach(e => errs.push(e));
    const lick = {
      id: spec.id, ctx: spec.ctx, name: spec.name, desc: spec.desc || '', tags: (spec.tags || []).slice(), lvl: spec.lvl || 1,
      ref, refSrc, segs, bpb: spec.bpb || 4, src: spec.notes, errors: errs,
      total: pr.total12 / TPB, pickup: pr.pickup / TPB, cuts: pr.cuts.map(c => c / TPB), bars12: pr.bars, total12: pr.total12, events: [],
    };
    if (errs.length) return lick;
    const cum = [0]; segs.forEach(s => cum.push(cum[cum.length - 1] + Math.round(s * TPB)));
    let min = 999, max = -1, first = null, last = null;
    for (const e of pr.events) {
      const ev = { t: e.t12 / TPB, dur: e.d12 / TPB, t12: e.t12, d12: e.d12, rest: e.rest };
      let seg = 0; for (let k = 0; k < segs.length; k++) if (e.t12 >= cum[k]) seg = k;
      ev.seg = seg;
      if (!e.rest) {
        Object.assign(ev, { p: e.p, midi: e.midi, tie: e.tie, accent: e.accent, stac: e.stac });
        ev.rel = mod(e.midi - ref[seg].rootPc, 12);
        ev.deg = T.semisToDegreeName(ev.rel, ref[seg].cls, ref[seg]);
        if (e.midi < min) min = e.midi; if (e.midi > max) max = e.midi;
        if (first == null) first = e.midi; last = e.midi;
      }
      lick.events.push(ev);
    }
    lick.midi = { min, max, first, last };
    // 最後のコードが「トニック」の解決のとき、7th（♭7・△7）を使っていなければ、ドミナント7th の I7 にも使える
    const lastSeg = segs.length - 1;
    lick.anyTonic = lick.events.every(ev => ev.rest || ev.seg !== lastSeg || (ev.rel !== 10 && ev.rel !== 11) || (ev.dur < 1 && ev.t12 % TPB !== 0));
    return lick;
  }

  /* ---------------- 検査（lint） ---------------- */
  // 戻り値 {errors:[…], warns:[…]}。errors が出たら書き間違いの可能性が高い
  function lint(lick) {
    const errors = lick.errors.slice(), warns = [];
    if (errors.length) return { errors, warns };
    const sumSegs = lick.segs.reduce((a, b) => a + b, 0);
    const lastEnd = lick.events.length ? Math.max.apply(null, lick.events.map(e => e.t12 + e.d12)) : 0;
    if (lastEnd !== Math.round(sumSegs * TPB)) errors.push(`長さが合わない：音は ${lastEnd / TPB} 拍ぶん、コードは ${sumSegs} 拍ぶん`);
    const barLen = lick.bpb * TPB;
    lick.bars12.forEach(b => { if (b < 0 || b % barLen !== 0) errors.push(`小節線の位置が小節の頭でない（${b / TPB} 拍目）`); });
    lick.cuts.forEach(c => { const c12 = Math.round(c * TPB); if (c12 % (TPB / 2) !== 0) errors.push(`カット位置が拍の途中（${c} 拍目）`); });
    const notes = lick.events.filter(e => !e.rest);
    if (!notes.length) { errors.push('音がない'); return { errors, warns }; }
    if (lick.midi.min < 52) errors.push('低すぎる（' + T.pitchStr(T.pitchFromMidi(lick.midi.min)) + '）');
    if (lick.midi.max > 88) errors.push('高すぎる（' + T.pitchStr(T.pitchFromMidi(lick.midi.max)) + '）');
    const span = lick.midi.max - lick.midi.min;
    if (span > 21) errors.push('音域が広すぎる（' + span + '半音）');
    // コードの切り替わりでの音のとび（小節をまたぐ・コードをまたぐ所で大きく跳ぶと、つながって聞こえない）
    {
      const segEnd = []; let acc = 0;
      lick.segs.forEach(sg => { acc += Math.round(sg * TPB); segEnd.push(acc); });
      for (let k = 0; k < segEnd.length - 1; k++) {
        const before = lick.events.filter(e => e.t12 + e.d12 === segEnd[k]).pop();
        const after = lick.events.find(e => e.t12 === segEnd[k]);
        if (before && after && !before.rest && !after.rest && Math.abs(after.midi - before.midi) > 7) {
          errors.push(`コードの切り替わりで音が大きく跳ぶ（${T.pitchStr(before.p)}→${T.pitchStr(after.p)}、${Math.abs(after.midi - before.midi)}半音）`);
        }
      }
    }
    // コードの音か、その色（テンション）の音か
    const chordish = (e) => {
      const ref = lick.ref[e.seg], pc = mod(e.midi, 12), rel = mod(pc - ref.rootPc, 12);
      if (ref.pcs.indexOf(pc) >= 0) return true;
      if (ref.cls === 'dom' || ref.cls === 'sus') return [2, 9, 6, 3, 8, 1].indexOf(rel) >= 0;   // 9・13・♯11・♯9・♭13・♭9
      if (ref.cls === 'maj') return [2, 6, 9].indexOf(rel) >= 0;
      if (ref.cls === 'min') return [2, 5, 9].indexOf(rel) >= 0;
      return [2].indexOf(rel) >= 0;
    };
    // 隣りあう音のとびと、スケールの外の音
    const allowed = lick.ref.map(c => allowedPcs(c, lick));
    let weakNon = 0, strong = 0, strongCT = 0;
    for (let i = 0; i < lick.events.length; i++) {
      const e = lick.events[i];
      if (e.rest) continue;
      const prev = (() => { for (let k = i - 1; k >= 0; k--) { if (lick.events[k].rest) return null; return lick.events[k]; } return null; })();
      const next = (() => { for (let k = i + 1; k < lick.events.length; k++) { if (lick.events[k].rest) return null; return lick.events[k]; } return null; })();
      if (prev) {
        const leap = Math.abs(e.midi - prev.midi);
        if (leap > 12) errors.push(`音のとびが大きすぎる（${leap}半音：${T.pitchStr(prev.p)}→${T.pitchStr(e.p)}）`);
        else if (leap > 9) warns.push(`大きなとび ${leap}半音（${T.pitchStr(prev.p)}→${T.pitchStr(e.p)}）`);
      }
      const pc = e.midi % 12, ok = allowed[e.seg].has(mod(e.midi, 12));
      const onBeat = e.t12 % TPB === 0;
      if (!ok) {
        // 半音で入る／半音で出る 経過音・装飾音ならよい（短く、あとが今のスケールの音）
        const nbIn = (n) => n && Math.abs(n.midi - e.midi) <= 1 && allowed[n.seg].has(mod(n.midi, 12));
        const short = e.dur <= 0.5 + 1e-9;
        if (!(short && (nbIn(next) || nbIn(prev)))) errors.push(`スケール外の音 ${T.pitchStr(e.p)}（${e.t} 拍目、${T.semisToDegreeName(e.rel, lick.ref[e.seg].cls, lick.ref[e.seg])}）`);
        else if (onBeat) warns.push(`拍頭の半音アプローチ ${T.pitchStr(e.p)}（${e.t} 拍目）`);
        weakNon++;
      }
      if (onBeat && !e.rest) { strong++; if (chordish(e)) strongCT++; }
    }
    if (!chordish(notes[0]) && lick.pickup === 0) warns.push('はじまりの音がコードの音（色も含む）でない');
    if (!chordish(notes[notes.length - 1])) warns.push('終わりの音がコードの音（色も含む）でない：' + T.pitchStr(notes[notes.length - 1].p));
    if (strong >= 3 && strongCT / strong < 0.5) warns.push(`拍頭のコードトーンが少ない（${strongCT}/${strong}）`);
    return { errors, warns };
  }

  /* ---------------- 登録 ---------------- */
  function add(spec) {
    counters[spec.ctx] = (counters[spec.ctx] || 0) + 1;
    spec.id = spec.id || `${spec.ctx}-${String(counters[spec.ctx]).padStart(3, '0')}`;
    const lick = compile(spec);
    if (lick.errors.length) { L.errors.push(`${spec.id} ${spec.name || ''}：${lick.errors.join(' / ')}`); return null; }
    if (!L.CTX[spec.ctx]) { L.errors.push(`${spec.id}：知らない ctx（${spec.ctx}）`); return null; }
    if (L.byId[lick.id]) { L.errors.push(`${lick.id}：id がかぶっている`); return null; }
    L.all.push(lick); L.byId[lick.id] = lick;
    (L.byCtx[spec.ctx] = L.byCtx[spec.ctx] || []).push(lick);
    return lick;
  }
  // base：{ctx, ref, segs, tags, lvl, bpb}。rows：[名前, 音, 解説, {tags, lvl, …}]
  function pack(base, rows) {
    rows.forEach(r => {
      const extra = r[3] || {};
      add(Object.assign({}, base, {
        name: r[0], notes: Array.isArray(r[1]) ? r[1].join(' | ') : r[1], desc: r[2] || '',
        tags: (base.tags || []).concat(extra.tags || []), lvl: extra.lvl || base.lvl || 1,
        segs: extra.segs || base.segs, ref: extra.ref || base.ref, bpb: extra.bpb || base.bpb,
      }));
    });
  }

  /* ---------------- 検索 ---------------- */
  const EPS = 1e-6;
  // コードの長さ durs（拍）に置けるか。置けるなら { lead, tail, len, cut }：
  //   lead … 最初のコードが長いときの手前のあき（その前に別のリックを置く）
  //   tail … 最後のコードが長いときのあと（あとで別のリックを置く）
  //   len … このリックが使う拍数。1コードだけのリックは、cut（途中で切れる位置）まででも置ける
  // 途中のコードの長さは、リックの書いた長さと一致していること
  function fit(lick, durs) {
    const n = lick.segs.length;
    if (durs.length !== n) return null;
    for (let k = 1; k < n - 1; k++) if (Math.abs(durs[k] - lick.segs[k]) > EPS) return null;
    if (n === 1) {
      if (durs[0] >= lick.segs[0] - EPS) return { lead: 0, tail: durs[0] - lick.segs[0], len: lick.total, cut: null };
      const cut = lick.cuts.filter(c => c <= durs[0] + EPS).pop();
      if (cut && cut >= 1.5) return { lead: 0, tail: durs[0] - cut, len: cut, cut };
      return null;
    }
    if (durs[0] < lick.segs[0] - EPS || durs[n - 1] < lick.segs[n - 1] - EPS) return null;
    return { lead: durs[0] - lick.segs[0], tail: durs[n - 1] - lick.segs[n - 1], len: lick.total, cut: null };
  }
  const fitLength = (lick, durs) => { const f = fit(lick, durs); return f ? f.len : null; };
  // 実際のコードの7thの種類と、リックの最後のコードでの7thの使い方が衝突していないか（拍頭か長い音だけ見る）
  function seventhConflict(lick, segIdx, chord) {
    if (!chord || chord.nc) return false;
    const forb = [];
    if (chord.seventh === 'b7') forb.push(11);

/* ---- js/solo.js ---- */
/* アドリブ・ラボ：ソロの自動作成（画面を持たない）。

   ・決めたことは decisions（どのリックを、どこに）として持つ。差し替えは decisions を直して realize しなおす。

(function () {

  const root = typeof window !== 'undefined' ? window : globalThis;
  const AL = (root.AL = root.AL || {});

    piano: [55, 84], ep: [55, 84], vibes: [57, 84], altosax: [52, 77], tenorsax: [46, 72], trumpet: [57, 82], guitar: [52, 74], flute: [60, 86],

    return realize(hs, an, { decisions: st.decisions, phrases, opts: o });

  function realize(hs, an, solo) {
    const o = solo.opts;
    const rand = rng(o.seed * 2654435761 >>> 0 ^ 0x9e3779b9);

      const { lick, r } = realizeOne(hs, d, st, o);

    all.forEach(c => { list = list.concat(L.find(c, { durs: [avail], chords: [h.chord], lvlMax, bpb: o.bpb })); });

})();

    { w: 2, hits: [[1.5, 1, 1], [3.5, 0.5, 0.8]] },

    { w: 2, hits: [[0, 0.5, 1], [1.5, 0.5, 0.9], [3, 1, 1]] },
    { w: 2, hits: [[1, 1, 1], [2.5, 0.5, 0.9]] },
    { w: 2, hits: [[0, 1, 1], [2.5, 1.5, 0.9]] },

        }

      for (let b = 0; b < bars; b++) {

    out.lastVoicing = prevV;

  /* ---------------- 楽器 ---------------- */

  /* ---- 管楽器 ---- */

  VOICES.altosax = (E, d, t, m, du, ve) => wind(E, d, t, m, du, ve, { wave: 'sax', start: 3, open: 7, settle: 5, att: 0.022, rel: 0.07, gain: 0.17, vib: 7, breath: 0.007, peak: [1250, 3.5], q: 1.1 });
