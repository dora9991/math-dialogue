      { tag: 'チャレンジ', bh: 'チャレンジ', q: '図は、1辺 10cm の正方形 ABCD に、B、D を中心とする 半径 10cm の弧をかいたもの。2つの弧で囲まれた ア の面積と、正方形から ア をのぞいた残りの部分の面積を求めよう。',
        notes: ['ヒント① 対角線 AC をひくと、ア は どんな 2つの形に分かれるかな。', 'ヒント② その1つは、おうぎ形から何をひいた形かな。'],
        a: 'ア 50π−100（cm²）、残り 200−50π（cm²）', sub: '対角線 AC で分けた片方は、おうぎ形 25π − 三角形 50。もう片方は、それを 180° 回した形。ア＝(25π−50)×2、残り＝100−(50π−100)', dur: 10,

        draw: function (D) {

          if (g1 > 0 && k <= 0) sector(F, LB, 10, 0, 90, { col: C.blue, fa: .2 * g1 * (1 - g2), stroke: false });

          if (g0 > 0) GE.seg(F, [LA, LC], { col: C.chalk, w: 2, dash: [7, 6], a: g0 });

          if (g2 > .5 && k <= 0) lab(F, [6.6, 6.6], 0, 0, '25π−50', { col: C.yel, size: .85 });
