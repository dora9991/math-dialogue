          if (r !== 3) sector(F, O, 3, 0, a, { col: C.chalk, fa: .08, sc: C.chalk, w: 2, dash: true });
          markDir(F, O, 0, a, C.pink, { r: F.s * 1.1, t: a + '°', at: a >= 300 ? 200 : null });
          lab(F, [r / 2, 0], 270, .8, r + 'cm', { col: C.yel }); GE.dot(F, O);
          say(D, L.side, [{ t: '半径 ' + r + 'cm', col: C.yel }, { t: '中心角 ' + a + '°', col: C.pink }, { t: '点線 … 半径 3cm' }, { t: '方眼 1目もり … 1cm' }]);
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '半径 6cm、中心角 90° のおうぎ形がある。① 面積を求めよう。② ① と同じ面積の円の、半径を求めよう。',
        notes: ['ヒント① おうぎ形の面積は、何π cm² かな。', 'ヒント② 円の面積は π×(半径)²。半径を r cm として、式をつくろう。'],
        a: '① 9π cm²　② 3cm', sub: '① π×6²×[90/360]＝9π　② 半径を r cm とすると πr²＝9π、r²＝9。r は正の数だから r＝3', dur: 6,
        b: { t: '① π×6²×[90/360]＝<b>9π</b>（cm²）　② πr²＝9π → r²＝9 → r＝<b>3</b>（cm）', col: C.orange },
        draw: function (D) {
          var t = D.ph ? D.t : 0, L = lay(D, .4), F = fitB(D, L.fig, { O: O }, [[-.9, -1.1], [14.2, 6.9]]), k1 = D.ph ? CH.smooth(0, .3, t) : 0, k2 = D.ph ? CH.smooth(.38, .68, t) : 0, k3 = D.ph ? CH.smooth(.75, .95, t) : 0;
          sector(F, O, 6, 0, 90, { col: C.yel, fa: .1 + .3 * k1, w: 2.6 }); GE.right(F, [[1, 0], O, [0, 1]], { col: C.pink, r: F.s * .6 }); slab(F, O, [6, 0], '6cm', -1);
          if (k1 > 0) lab(F, GE.polar(O, 3.4, 45), 0, 0, '9π cm²', { col: C.yel, a: k1, size: .95 });
          GE.circ(F, CC, 3, { col: k2 > 0 ? C.blue : 'rgba(242,240,230,.7)' }); if (k2 > 0) sector(F, CC, 3, 0, 360, { col: C.blue, fa: .3 * k2, stroke: false });
          GE.seg(F, [CC, [CC[0] + 3, CC[1]]], { col: C.blue, w: 2.4 }); lab(F, [CC[0] + 1.5, CC[1]], 90, .8, k3 > .5 ? '3cm' : 'r', { col: C.blue, size: .9 });
          if (k2 > 0) lab(F, [CC[0], CC[1] - 1.3], 0, 0, '9π cm²', { col: C.blue, a: k2, size: .95 });
          GE.dot(F, O); GE.dot(F, CC);
          say(D, L.side, [D.ph ? { t: '① π×6²×[90/360]＝9π', col: C.yel, a: k1 } : null, D.ph && t > .38 ? { t: '② πr²＝9π', col: C.blue, a: k2 } : null, D.ph && t > .55 ? { t: 'r²＝9', col: C.blue, a: CH.smooth(.55, .7, t) } : null, D.ph && t > .75 ? { t: 'r＝3（cm）', col: C.orange, a: k3 } : null]);
        } }
    ])
  });
