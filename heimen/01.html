<!doctype html>

<title>直線・線分・半直線と記号</title>

<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script src="../heikou/js/geo.js"></script>
<script>
/* 平面図形 第1時：直線や角を、記号を使って表そう（ikkan の lesson_heimen_01 と同じ流れ）。
   今日の問いは、点 A、B を通る3つの線が、両方向にのびる（直線）・A から B でとまる（線分）・B の先へのびる（半直線）動きで、ちがいが見える。
   ことばでは、半直線 AB と半直線 BA のちがい、∠ABC・AB⊥CD・AB∥CD の記号が図の上に出る。直線の上の点 Q を動かすと、垂線 PH がいちばん短い（点と直線のきょり）。
   例題は ikkan と同じ長方形 ABCD（AB＝3cm、BC＝5cm、対角線 AC）。考えようは、平行な2直線の間のきょりを調べる道具（答えは出さない）。チャレンジは 5点の線分 10本・半直線 20本。
   図の座標・数値はページの中で作った自作のデータ。長さ・角・垂直・平行・本数は、座標と数えあげで計算し直している（GE.verify・CH.check）。 */
(function () {
  /* ---- 平面図形の図の道具（このページの中だけで使う。heimen/ の各ページに同じものが入っている） ---- */
  var C = CH.C, RAD = Math.PI / 180, PR = '′', OUT = 'rgba(20,40,30,.9)', FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  function hexA(h, a) { var n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function dg(x) { var r = Math.round(x * 10) / 10; return (Math.abs(r - Math.round(r)) < .05 ? String(Math.round(r)) : r.toFixed(1)) + '°'; }
  function f1(x) { return CH.f1(x); }
  function tw(D, s, size) { var g = D.ctx; g.save(); g.font = '600 ' + size + 'px ' + FONT; var w = g.measureText(s).width; g.restore(); return w; }
  /* 図の四角（fig）と、字を書く四角（side）。よこ長なら右、たて長なら下 */
  function lay(D, k, o) {
    o = o || {}; var B = CH.box(D, { l: .03, r: .03, t: o.t == null ? .04 : o.t, b: .04 });
    if (B.w > B.h * 1.25 && B.w > 560) { var w = B.w * (k || .34); return { fig: CH.rect(B.x0, B.y0, B.x1 - w, B.y1), side: CH.rect(B.x1 - w + B.w * .02, B.y0 + B.h * .06, B.x1, B.y1), wide: true }; }
    var h = B.h * (o.hk || .25); return { fig: CH.rect(B.x0, B.y0, B.x1, B.y1 - h), side: CH.rect(B.x0 + B.w * .03, B.y1 - h + 4, B.x1, B.y1), wide: false };
  }
  /* 字の行（四角の幅に入るよう、字を小さくする）。rows：[{ t, col, a }] */
  function say(D, Rr, rows, o) {
    o = o || {}; rows = rows.filter(Boolean); if (!rows.length) return;
    var nc = Rr.w > Rr.h * 2.5 && rows.length > 3 && Rr.h / (rows.length * 1.6) < CH.fs(D, .62) ? 2 : 1, per = Math.ceil(rows.length / nc), cw = Rr.w / nc;
    var s = Math.min(o.size || CH.fs(D, .92), Rr.h / (per * 1.6));
    rows.forEach(function (r, i) {
      var w = tw(D, r.t, s), sz = w > cw - 6 ? s * (cw - 6) / w : s, c = Math.floor(i / per), j = i % per;
      CH.text(D, Rr.x0 + c * cw, Rr.y0 + s * .8 + j * s * 1.6, r.t, { col: r.col || C.chalk, a: r.a, size: sz, align: 'left' });
    });
  }
  /* 図の上の1行（はばに入らなければ、字を小さくする） */
  function top(D, s, col, a) {
    var B = CH.box(D, { t: 0, l: .02, r: .02 }), fs = CH.fitSize(D, s, B.w, CH.fs(D, 1.02));
    CH.text(D, B.cx, B.y0 + CH.fs(D, 1.02) * .7, s, { col: col || C.yel, a: a, size: fs, outline: OUT });
  }
  /* 点の名前：{ A: 向き（度） }。o.name で字をかえる */
  function nm(F, m, o) {
    o = o || {}; Object.keys(m).forEach(function (k) {
      if (m[k] == null || !F.P[k]) return; var p = F.X(k), r = F.s * (o.k || .95);
      CH.text(F.D, p[0] + Math.cos(m[k] * RAD) * r, p[1] - Math.sin(m[k] * RAD) * r, (o.name && o.name[k]) || k, { size: F.s * (o.size || 1), col: (o.col && o.col[k]) || o.c || C.chalk, a: o.a, outline: OUT });
    });
  }
  function dots(F, ks, o) { o = o || {}; (Array.isArray(ks) ? ks : ks.split('')).forEach(function (k) { if (typeof k !== 'string' || F.P[k]) GE.dot(F, k, o); }); }
  /* 字（座標 p から、向き deg に k（字の大きさの倍）だけはなれたところ） */
  function lab(F, p, deg, k, t, o) {
    o = o || {}; var q = F.X(p);
    CH.text(F.D, q[0] + Math.cos(deg * RAD) * F.s * k, q[1] - Math.sin(deg * RAD) * F.s * k, t, { col: o.col || C.chalk, size: F.s * (o.size || .85), a: o.a, outline: OUT, num: o.num });
  }
  /* 図の四角の中だけに描く */
  function clip(F, fn) { var g = F.D.ctx, r = F.R; g.save(); g.beginPath(); g.rect(r.x0, r.y0, r.w, r.h); g.clip(); fn(); g.restore(); }
  /* 直線（四角のはしまで）・半直線（a から b の向きに、四角のはしまで） */
  function full(F, a, b, o) { clip(F, function () { GE.line(F, [a, b], o || {}); }); }
  function ray(F, a, b, o) { var pa = F.X(a), pb = F.X(b), L = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]) || 1, k = (F.R.w + F.R.h) * 2 / L; clip(F, function () { GE.seg(F, [a, GE.lerpP(F.P[a] || a, F.P[b] || b, 1 + k)], o || {}); }); }
  function arrowW(F, a, b, o) { o = o || {}; var p = F.X(a), q = F.X(b); CH.arrow(F.D, p[0], p[1], q[0], q[1], { col: o.col || C.chalk, w: o.w || 2.8, a: o.a, head: o.head || F.s * .6, dash: o.dash }); }
  /* 中心 c・半径 r（座標の長さ）の円の、a0 → a1（反時計まわり、度）の弧 */
  function arcAt(F, c, r, a0, a1, o) {
    o = o || {}; if (a1 < a0) { var z = a0; a0 = a1; a1 = z; } var g = F.D.ctx, p = F.X(c);
    g.save(); g.globalAlpha = F.D.ga * (o.a == null ? 1 : o.a); g.strokeStyle = o.col || C.chalk; g.lineWidth = o.w || 2.2; g.lineCap = 'round';
    if (o.dash) g.setLineDash(o.dash === true ? [8, 7] : o.dash); g.beginPath(); g.arc(p[0], p[1], r * F.u, -a0 * RAD, -a1 * RAD, true); g.stroke(); g.restore();
  }
  /* コンパスで弧をかく：a0 → a1 を k（0〜1）だけ。かいている途中は、コンパスの2本の足も見せる */
  function comp(F, c, r, a0, a1, k, o) {
    o = o || {}; if (k <= 0) return; var a = a0 + (a1 - a0) * Math.min(1, k), col = o.col || C.blue; if (typeof c === 'string') c = F.P[c];
    arcAt(F, c, r, a0, a, { col: col, w: o.w || 2.2, a: o.a });
    if (k < 1 && !o.noLeg) {
      var p = F.X(GE.polar(c, r, a)), q = F.X(c), m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], d = [p[0] - q[0], p[1] - q[1]], L = Math.hypot(d[0], d[1]) || 1, n = [d[1] / L, -d[0] / L];
      if (n[1] > 0) n = [-n[0], -n[1]];
      var hh = [m[0] + n[0] * Math.min(L * .55, F.s * 5), m[1] + n[1] * Math.min(L * .55, F.s * 5)];
      CH.line(F.D, q[0], q[1], hh[0], hh[1], { col: 'rgba(242,240,230,.75)', w: 2.6 }); CH.line(F.D, hh[0], hh[1], p[0], p[1], { col: 'rgba(242,240,230,.75)', w: 2.6 });
      CH.circle(F.D, hh[0], hh[1], F.s * .22, { fill: 'rgba(242,240,230,.85)' }); CH.circle(F.D, p[0], p[1], F.s * .17, { fill: col });
    }
  }
  /* 点の列を動かす（数学の座標） */
  function mv(ps, v, k) { return ps.map(function (p) { return [p[0] + v[0] * k, p[1] + v[1] * k]; }); }
  function rotP(ps, c, deg) { return ps.map(function (p) { return GE.rot(p, c, deg); }); }
  function refP(ps, a, b) { return ps.map(function (p) { return GE.reflect(p, a, b); }); }
  /* 直線 ab で折る途中（k＝0 で もと、.5 で 線の上、1 で 折り返したところ） */
  function foldP(ps, a, b, k) { return ps.map(function (p) { var f = GE.foot(p, a, b); return GE.lerpP(p, [2 * f[0] - p[0], 2 * f[1] - p[1]], CH.ease(k)); }); }
  /* 点の集まりが同じか（順番は問わない） */
  function key(ps) { return ps.map(function (p) { return p.map(function (x) { return Math.round(x * 1000) / 1000 + 0; }).join(','); }).sort().join('|'); }
  function same(ps, qs) { return key(ps) === key(qs); }
  function named(names, ps, P) { P = P || {}; (Array.isArray(names) ? names : names.split('')).forEach(function (k, i) { P[k] = ps[i]; }); return P; }
  function cen(ps) { var c = [0, 0]; ps.forEach(function (p) { c[0] += p[0] / ps.length; c[1] += p[1] / ps.length; }); return c; }
  function poly(F, ps, col, o) { o = o || {}; GE.polyP(F, ps, { col: col || C.blue, fa: o.fa == null ? .22 : o.fa, a: o.a, sw: o.sw }); }
  /* 方眼（x0〜x1、y0〜y1） */
  function grid(F, x0, y0, x1, y1, o) {
    o = o || {}; for (var x = x0; x <= x1 + 1e-9; x++) GE.seg(F, [[x, y0], [x, y1]], { col: 'rgba(242,240,230,.16)', w: 1, a: o.a });
    for (var y = y0; y <= y1 + 1e-9; y++) GE.seg(F, [[x0, y], [x1, y]], { col: 'rgba(242,240,230,.16)', w: 1, a: o.a });
  }
  /* 三角形の頂点の名前（中心から外向き） */
  function vlab(F, ps, names, o) {
    o = o || {}; var c = F.X(cen(ps));
    ps.forEach(function (p, i) { var q = F.X(p), d = [q[0] - c[0], q[1] - c[1]], L = Math.hypot(d[0], d[1]) || 1, r = F.s * (o.k || .85); CH.text(F.D, q[0] + d[0] / L * r, q[1] + d[1] / L * r, names[i], { size: F.s * (o.size || .95), col: o.col || C.chalk, a: o.a, outline: OUT }); });
  }
  /* 色ちがいの字を1行にならべる（parts：[[字, 色], …]）。はばに入らなければ小さくする */
  function rich(D, x, y, parts, o) {
    o = o || {}; var s = o.size || CH.fs(D, 1.02), W = 0; parts.forEach(function (p) { W += tw(D, p[0], s); });
    if (o.maxW && W > o.maxW) { s *= o.maxW / W; W = o.maxW; }
    var xx = x - W / 2; parts.forEach(function (p) { CH.text(D, xx, y, p[0], { size: s, col: p[1] || C.chalk, align: 'left', a: o.a, outline: OUT }); xx += tw(D, p[0], s); });
  }
  /* 図の上の1行（色ちがい） */
  function topRich(D, parts, a, row) { var B = CH.box(D, { t: 0, l: .02, r: .02 }), s = CH.fs(D, 1.02); rich(D, B.cx, B.y0 + s * (.7 + (row || 0) * 1.45), parts.filter(Boolean), { a: a, maxW: B.w, size: s }); }
  /* ---- 今日の問い：点 A、B を通る3つの線（1段ずつ） ---- */
  var KANA = ['ア', 'イ', 'ウ'], KIND = ['直線', '線分', '半直線'];
  /* 1段の線。sp：{ x0, x1（のびたところ）, L, R（はしの矢じり）, col }。xa・xb は A、B の位置 */
  function rowLine(D, r, xa, xb, sp, o) {
    o = o || {}; var y = r.cy, s = Math.min(CH.fs(D, 1), r.h * .32), col = sp.col || C.chalk, hd = s * .62;
    if (sp.x1 - sp.x0 > 1) CH.line(D, sp.x0, y, sp.x1, y, { col: col, w: 3.2, a: sp.a });
    if (sp.L) CH.arrow(D, sp.x0 + hd, y, sp.x0, y, { col: col, w: 3.2, head: hd, a: sp.a });
    if (sp.R) CH.arrow(D, sp.x1 - hd, y, sp.x1, y, { col: col, w: 3.2, head: hd, a: sp.a });
    /* のびつづける感じ：はしの先へ流れる点 */
    if (sp.flowL || sp.flowR) for (var j = 0; j < 3; j++) {
      var ph = ((D.now * .45 + j / 3) % 1);
      if (sp.flowR) CH.circle(D, CH.lerp(xb + s, sp.x1 - hd, ph), y, s * .13, { fill: col, a: .8 * Math.sin(ph * Math.PI) });
      if (sp.flowL) CH.circle(D, CH.lerp(xa - s, sp.x0 + hd, ph), y, s * .13, { fill: col, a: .8 * Math.sin(ph * Math.PI) });
    }
    [[xa, 'A'], [xb, 'B']].forEach(function (p) { CH.circle(D, p[0], y, s * .2, { fill: C.chalk }); CH.text(D, p[0], y + s * 1.05, p[1], { size: s, outline: OUT }); });
    if (o.kana) CH.text(D, r.x0 + s * .6, y, o.kana, { size: s * 1.15, col: C.yel });
    if (o.name) CH.text(D, o.nx || (xa + xb) / 2, y - s * 1.1, o.name, { size: s * .95, col: o.ncol || C.yel, a: o.na, outline: OUT });
  }
  /* ア〜ウ。g：それぞれの段の進み（0〜1）。names：名前の濃さ */
  function threeLines(D, g, o) {
    o = o || {}; var R = CH.box(D, { l: .03, r: .03, t: .05, b: .05 }), rows = CH.rows(R, 3, .08);
    rows.forEach(function (r, i) {
      var xa = r.x0 + r.w * .34, xb = r.x0 + r.w * .58, xl = r.x0 + r.w * .1, xr = r.x1 - r.w * .01, k = g ? g[i] : 1, sp;
      if (i === 0) sp = { x0: CH.lerp(xa, xl, k), x1: CH.lerp(xb, xr, k), L: k > .98, R: k > .98, flowL: o.flow && k > .98, flowR: o.flow && k > .98 };
      else if (i === 1) sp = { x0: xa, x1: CH.lerp(xa, xb, k) };
      else sp = { x0: xa, x1: CH.lerp(xa, xr, k), R: k > .98, flowR: o.flow && k > .98 };
      if (o.hl) sp.col = o.hl[i];
      rowLine(D, r, xa, xb, sp, { kana: KANA[i], name: o.na && o.na[i] > 0 ? KIND[i] + ' AB' : null, na: o.na ? o.na[i] : 0, ncol: o.hl ? o.hl[i] : C.yel, nx: i === 1 ? (xa + xb) / 2 : (xb + xr) / 2 });
    });
  }

  /* ---- ことば：∠ABC・AB⊥CD・AB∥CD（3つの小さな図） ---- */
  var PA = { A: [1.6, 2.6], B: [0, 0], C: [3.4, 0] };
  var PP0 = { A: [0, 1.5], B: [3.4, 1.5], C: [2.1, -.2], D: [2.1, 3.2] }, PP = {}, PPm = GE.rot([2.1, 1.5], [0, 0], 12);
  Object.keys(PP0).forEach(function (k) { PP[k] = GE.rot(PP0[k], [0, 0], 12); }); PP.M = PPm;
  var PL = { A: [0, 2.6], B: [3.4, 3.3], C: [.3, .5], D: [3.7, 1.2] };
  GE.verify(PP, 'AB⊥CD、AM⊥CM', null, 'ことば AB⊥CD');
  GE.verify(PL, 'AB∥CD', null, 'ことば AB∥CD');
  CH.check(GE.near(GE.len(PP, 'AM') + GE.len(PP, 'MB'), GE.len(PP, 'AB')) && GE.near(GE.len(PP, 'CM') + GE.len(PP, 'MD'), GE.len(PP, 'CD')), 'ことば：AB と CD は M で交わる');
  function symbols(D, t, ans) {
    var R = CH.box(D, { l: .03, r: .03, t: .05, b: .05 }), cs = CH.split(D, R, 3, .06);
    [PA, PP, PL].forEach(function (P, i) {
      var c = cs[i], row = c.w > c.h * 1.3, s = Math.min(CH.fs(D, 1.25), (row ? c.w * .45 : c.w) * .16), side = Math.max(40, Math.min(c.w, c.h - s * 2.8)), y0 = c.cy - (side + s * 2.6) / 2;
      var fr = row ? CH.rect(c.x0 + c.w * .45, c.y0, c.x1, c.y1) : CH.rect(c.x0, y0 + s * 2.4, c.x1, y0 + s * 2.4 + side), tx0 = row ? c.x0 + c.w * .22 : c.cx, tw0 = row ? c.w * .44 : c.w;
      if (row) y0 = c.cy - s * 1.1;
      var F = GE.fit(D, fr, P, { pad: .14, keys: i === 1 ? ['A', 'B', 'C', 'D'] : null, size: Math.min(CH.fs(D, .95), fr.w * .09, fr.h * .12) });
      var k = ans ? CH.smooth(i / 3 + .02, i / 3 + .2, t) : 0, col = [C.yel, C.pink, C.green][i];
      if (i === 0) {
        GE.seg(F, 'BA', { w: 3, col: k > 0 ? col : null }); GE.seg(F, 'BC', { w: 3, col: k > 0 ? col : null }); dots(F, 'ABC');
        GE.arc(F, 'ABC', { col: k > 0 ? col : C.chalk, fill: k * .35 });
        nm(F, { A: 90, B: 225, C: 315 }, { col: k > 0 ? { B: col } : null });
      } else if (i === 1) {
        GE.seg(F, 'AB', { w: 3, col: k > 0 ? col : null }); GE.seg(F, 'CD', { w: 3, col: k > 0 ? col : null }); dots(F, 'ABCD');
        GE.right(F, 'BMD', { col: k > 0 ? col : C.chalk, fill: k > 0 });
        nm(F, { A: 180, B: 0, C: 270, D: 90 });
      } else {
        GE.seg(F, 'AB', { w: 3, col: k > 0 ? col : null }); GE.seg(F, 'CD', { w: 3, col: k > 0 ? col : null }); dots(F, 'ABCD');
        GE.par(F, 'AB', 1, { col: k > 0 ? col : C.chalk }); GE.par(F, 'CD', 1, { col: k > 0 ? col : C.chalk });
        nm(F, { A: 180, B: 0, C: 180, D: 0 });
      }
      var tx = ['∠ABC', 'AB⊥CD', 'AB∥CD'][i], sub = ['角（頂点 B を まん中に）', '垂直', '平行'][i];
      if (ans) CH.text(D, tx0, y0 + s * .55, tx, { size: s, col: col, a: k, outline: OUT });
      CH.text(D, tx0, y0 + s * (ans ? 1.6 : 1.1), sub, { size: CH.fitSize(D, sub, tw0 * .95, s * (ans ? .62 : .8)), col: ans ? col : 'rgba(242,240,230,.8)', a: ans ? k : 1, outline: OUT });
    });
  }

  /* ---- ことば：点と直線のきょり（P から ℓ へ。Q を ℓ の上で動かす） ---- */
  var PD = { P: [0, 3], H: [0, 0], L1: [-7, 0], L2: [7, 0] };
  CH.check([-6, -3, -1, 1, 3, 6].every(function (x) { return Math.hypot(x, 3) > GE.len(PD, 'PH'); }) && GE.near(GE.len(PD, 'PH'), 3), '垂線 PH がいちばん短い');

  /* ---- 例題：長方形 ABCD（AB＝3cm、BC＝5cm）と対角線 AC ---- */
  var PR4 = { A: [0, 3], B: [0, 0], C: [5, 0], D: [5, 3] };
  GE.verify(PR4, 'AB⊥BC、AB∥DC、AB＝DC＝3、BC＝AD＝5、∠ABC＝90°', null, '例題 長方形');
  CH.check(GE.near(GE.ang(PR4, 'BAC'), Math.atan(5 / 3) / RAD) && GE.near(GE.len(PR4, 'AC'), Math.sqrt(34)) && f1(Math.sqrt(34)) === '5.8', '例題：∠a＝∠BAC、AC は約 5.8cm');
  function rect4(D, o) {
    o = o || {}; var L = lay(D, .36), F = GE.fit(D, L.fig, PR4, { pad: .18 });
    GE.poly(F, 'ABCD', { col: C.blue, fa: .1 }); GE.seg(F, 'AC', { a: o.acA == null ? 1 : o.acA });
