<script>
/* 平面図形 第15時：「平面図形」で学んだことを、整理して確かめよう（ikkan の lesson_heimen_15 と同じ流れ）。
   今日の問いは、三角形 ABC の中の点 P（2辺 AB、BC から等しく、B、C からも等しい）。答えでは、∠B の二等分線と BC の垂直二等分線を

   考えようは、3つの作図（垂直二等分線・角の二等分線・垂線）を1手ずつ進め、コンパスでとった点を結べる道具（答えは出さない）。
   チャレンジは、平行な 2直線 ℓ、m（4cm）で 2回 対称移動 → 8cm の平行移動。

(function () {

    o = o || {}; var B = CH.box(D, { l: .03, r: .03, t: o.t == null ? .04 : o.t, b: .04 });

  function ftxt(D, x, y, s, o) {

    o = o || {}; var q = F.X(p);

  }
  /* 線分 pq の横に字（side：1 で pq の左がわ、−1 で右がわ。k は はなれぐあい） */
  function slab(F, p, q, t, side, o) {
    o = o || {}; var d = Math.atan2(q[1] - p[1], q[0] - p[0]) / RAD + 90 * (side || 1);
    lab(F, GE.mid(p, q), d, o.k || .9, t, o);

  function full(F, a, b, o) { clip(F, function () { GE.line(F, [a, b], o || {}); }); }

    o = o || {}; if (a1 < a0) { var z = a0; a0 = a1; a1 = z; } var g = F.D.ctx, p = F.X(c);
    g.save(); g.globalAlpha = F.D.ga * (o.a == null ? 1 : o.a); g.strokeStyle = o.col || C.chalk; g.lineWidth = o.w || 2.2; g.lineCap = 'round';
    if (o.glow) { g.shadowColor = o.col || C.chalk; g.shadowBlur = 8; }
    if (o.dash) g.setLineDash(o.dash === true ? [8, 7] : o.dash); g.beginPath(); g.arc(p[0], p[1], r * F.u, -a0 * RAD, -a1 * RAD, true); g.stroke(); g.restore();

      var p = F.X(GE.polar(c, r, a)), q = F.X(c), m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], d = [p[0] - q[0], p[1] - q[1]], L = Math.hypot(d[0], d[1]) || 1, n = [d[1] / L, -d[0] / L];

  function cc(c1, r1, c2, r2, side) {
    var d = Math.hypot(c2[0] - c1[0], c2[1] - c1[1]), a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a)), u = [(c2[0] - c1[0]) / d, (c2[1] - c1[1]) / d];

  function mark(F, s, col, o) {
    o = o || {}; var r = o.r || F.s * 1.05;
    GE.arc(F, s, { col: col, fill: o.fill == null ? .3 : o.fill, a: o.a, r: r, n: o.n, tick: o.tick });
