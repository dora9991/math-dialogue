<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ミニバス スコアシート分析</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%232a78d6%22/%3E%3Cpath d=%22M9 24L23 8%22 stroke=%22%23fff%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2210%22 cy=%2210%22 r=%223%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* ミニバス スコアシート分析 — 見た目
   方針：紙のスコアシートの「罫線のセル」と、赤・黒のペンの記号（● ／ ○）を、そのまま画面の部品にする。
   自チームは青、相手はオレンジ。得点の種類（FT・2点・3点）は青の濃淡（点が大きいほど濃い）。
   色は全部トークン。暗い画面は同じ色相を暗い面向けに選び直したもの。 */
:root {
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --line: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11, 11, 11, .10);
  --wash: #f0efec;
  --me: #2a78d6;
  --opp: #eb6834;
  --pos: #2a78d6;
  --neg: #e34948;
  --k-ft: #86b6ef;
  --k-fg: #2a78d6;
  --k-3p: #104281;
  --on-me: #ffffff;
  --st-bad: #d03b3b;
  --st-warn: #fab219;
  --st-ok: #0ca30c;
  --ok-text: #006300;
  --ink-red: #d03b3b;
  --ink-black: #0b0b0b;
  --tint-me: rgba(42, 120, 214, .10);
  --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --line: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, .10); --wash: #232321;
    --me: #3987e5; --opp: #d95926; --pos: #3987e5; --neg: #e66767;
    --k-ft: #184f95; --k-fg: #3987e5; --k-3p: #86b6ef;
    --on-me: #0b0b0b; --ok-text: #0ca30c; --ink-red: #e66767; --ink-black: #f0efec;
    --tint-me: rgba(57, 135, 229, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --line: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, .10); --wash: #232321;
  --me: #3987e5; --opp: #d95926; --pos: #3987e5; --neg: #e66767;
  --k-ft: #184f95; --k-fg: #3987e5; --k-3p: #86b6ef;
  --on-me: #0b0b0b; --ok-text: #0ca30c; --ink-red: #e66767; --ink-black: #f0efec;
  --tint-me: rgba(57, 135, 229, .16);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.65 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
[hidden] { display: none !important; }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; text-wrap: balance; font-weight: 700; }
h1 { font-size: 22px; letter-spacing: .01em; }
h2 { font-size: 17px; }
h3 { font-size: 14px; color: var(--ink-2); }
p { margin: 0; }
a { color: var(--me); }
small, .sub { color: var(--ink-2); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; border-radius: 4px; }

/* ── ヘッダー ── */
.app-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.app-head p { color: var(--ink-2); max-width: 46em; }
.brand { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slash { display: inline-block; width: 1.05em; text-align: center; color: var(--ink-3); font-weight: 400; }

/* ── 段（ステップ）── */
.steps { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.steps button {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  font: inherit; padding: 7px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center;
}
.steps button b { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 700; }
.steps button[aria-current="step"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps button[aria-current="step"] b { color: var(--bg); }
.steps button:disabled { opacity: .45; cursor: default; }

/* ── 区画 ── */
.sect { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.sect-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.hint { color: var(--ink-2); font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* ── ボタン・入力 ── */
.btn {
  appearance: none; font: inherit; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 9px 16px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 40px;
}
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--me); border-color: var(--me); color: var(--on-me); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); font-weight: 400; text-decoration: underline; text-underline-offset: 3px; padding-inline: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0; max-width: 100%;
}
input[type="number"] { font-variant-numeric: tabular-nums; }
textarea { width: 100%; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
label.chk { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-2); }
.drop {
  border: 1.5px dashed var(--axis); border-radius: 12px; padding: 26px 16px; text-align: center; color: var(--ink-2);
  display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--bg);
}
.drop.over { border-color: var(--me); background: var(--tint-me); }
.drop strong { color: var(--ink); font-size: 15px; }

/* ── 写真の一覧 ── */
.photos { display: flex; flex-direction: column; gap: 10px; }
.photo {
  display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
}
.photo img { width: 72px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--wash); }
.photo .meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.photo .name { overflow-wrap: anywhere; font-weight: 700; }
.photo .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.status { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.status.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--axis); border-top-color: var(--me); animation: spin 0.9s linear infinite; }
@media (prefers-reduced-motion: reduce) { .status.busy::before { animation: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
  .photo { grid-template-columns: 56px minmax(0, 1fr); }
  .photo img { width: 56px; height: 76px; }
  .photo .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
.tiles { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tiles img { height: 88px; width: auto; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.paper-box { position: relative; display: inline-block; max-width: 100%; }
.paper-box img { display: block; max-width: 100%; max-height: 420px; border-radius: 6px; }
.paper-box .rect { position: absolute; border: 2px solid var(--me); background: var(--tint-me); pointer-events: none; }

/* ── 確認と修正 ── */
.issues { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.issues li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; }
.badge { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.badge.err { background: var(--st-bad); }
.badge.warn { background: #b87500; }
.badge.info { background: var(--ink-3); }
.okline { color: var(--ok-text); font-weight: 700; }
.ptab { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptab th, .ptab td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.ptab th { font-weight: 700; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.ptab input[type="text"] { padding: 4px 6px; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.qbtn { appearance: none; border: 1px solid var(--line); background: var(--bg); width: 30px; height: 28px; border-radius: 5px; font: inherit; cursor: pointer; color: var(--ink-3); }
.qbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.qbtn[data-odd="1"][aria-pressed="true"] { background: var(--ink-red); border-color: var(--ink-red); color: #fff; }
.ev { height: 190px; }
details.fold > summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
details.fold[open] > summary { margin-bottom: 8px; }
pre.prompt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; font: 12px/1.5 var(--font-mono); background: var(--bg); border: 1px solid var(--line); padding: 10px; border-radius: 8px; }

/* ── 分析：見出し・スコア ── */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; cursor: pointer;
  border-radius: 8px; padding: 6px 12px; text-align: left; min-width: 0;
}
.tabs button[aria-selected="true"] { border-color: var(--me); box-shadow: inset 0 0 0 1px var(--me); color: var(--ink); }
.tabs .t1 { display: block; font-weight: 700; color: var(--ink); }
.tabs .t2 { display: block; font-size: 12px; }
.hero { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: center; justify-content: space-between; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; flex: 1 1 360px; }
.board .team { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.board .team.opp { text-align: right; align-items: flex-end; }
.board .tn { font-weight: 700; overflow-wrap: anywhere; display: inline-flex; gap: 8px; align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
.board .score { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -.01em; }
.board .mid { display: flex; align-items: center; gap: 12px; }
.board .dash { color: var(--ink-3); font-size: 28px; }
.result { display: flex; flex-direction: column; gap: 2px; }
.result .big { font-size: 20px; font-weight: 700; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); }
.pill.w { background: var(--tint-me); border-color: var(--me); }
.qtab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.qtab th, .qtab td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.qtab th:first-child, .qtab td:first-child { text-align: left; }
.qtab thead th { color: var(--ink-2); font-weight: 700; font-size: 12.5px; }
.qtab tbody tr:last-child td { border-bottom: 0; }
.qtab td.pos { color: var(--ok-text); font-weight: 700; }
.qtab td.neg { color: var(--neg); font-weight: 700; }
.qtab td.tot, .qtab th.tot { border-left: 1px solid var(--line); font-weight: 700; }
.qtab .team-cell { display: inline-flex; gap: 8px; align-items: center; }

/* ── 気づき ── */
.insights { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.insights li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--line); }
.insights li:first-child { border-top: 0; padding-top: 0; }
.insights .tg { font-size: 12px; color: var(--ink-2); font-weight: 700; padding-top: 1px; }
@media (max-width: 520px) { .insights li { grid-template-columns: minmax(0, 1fr); } }

/* ── グラフ ── */
.chart { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-ui); fill: var(--ink-2); font-size: 12px; }
.chart .v { fill: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); }
.chart .mute { fill: var(--ink-3); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart [data-tip] { cursor: default; }
.chart [data-tip]:hover, .chart [data-tip]:focus-visible { filter: brightness(1.12); outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend i.ln { height: 3px; width: 16px; border-radius: 2px; }
.legend i.dot { border-radius: 50%; }
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px;
  padding: 7px 10px; font-size: 12.5px; line-height: 1.45; max-width: 260px; box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
}
.tip b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.tw summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.tw table { margin-top: 8px; }

/* ── 選手・出場の表 ── */
.ptable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.ptable th, .ptable td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; vertical-align: middle; }
.ptable th:first-child, .ptable td:first-child, .ptable th.l, .ptable td.l { text-align: left; }
.ptable thead th { color: var(--ink-2); font-weight: 700; font-size: 12px; }
.ptable .no { font-weight: 700; }
.ptable .dim { color: var(--ink-3); }
.cells { display: inline-flex; gap: 3px; vertical-align: middle; }
.cell {
  width: 30px; height: 24px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; background: var(--wash); color: var(--ink-3); border: 1px solid transparent;
}
.cell.on { background: var(--tint-me); color: var(--ink); border-color: var(--me); }
.cell.on.pts { background: var(--me); color: var(--on-me); border-color: var(--me); }
.cell.odd { border-style: dashed; }
.cell.off { background: transparent; border-color: var(--line); color: transparent; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.ptable .chips { flex-wrap: nowrap; }
.chip { display: inline-flex; padding: 0 6px; border-radius: 5px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); }
.chip.red { color: var(--ink-red); border-color: var(--ink-red); }
.chip.black { color: var(--ink-black); border-color: var(--axis); }
.chip.none { color: var(--ink-2); }
.lineup { display: flex; flex-wrap: wrap; gap: 4px; }
.lineup span { padding: 0 6px; border-radius: 5px; background: var(--wash); font-weight: 700; font-size: 12px; }
.note { border-left: 3px solid var(--axis); padding: 6px 12px; color: var(--ink-2); font-size: 13px; background: var(--bg); border-radius: 0 6px 6px 0; }
.cant { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; margin: 0; padding-left: 1.2em; color: var(--ink-2); font-size: 13px; }
@media (max-width: 640px) { .cant { grid-template-columns: minmax(0, 1fr); } }
.tiles-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
.tile .tv { font-size: 24px; font-weight: 700; line-height: 1.2; }
.tile .tl { font-size: 12.5px; color: var(--ink-2); }
.tile .ts { font-size: 12px; color: var(--ink-3); }
.foot { color: var(--ink-3); font-size: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; z-index: 60; font-size: 13px; max-width: 90vw; }

@media print {
  body { background: #fff; color: #000; }
  .no-print, .steps, .drop { display: none !important; }
}

</style>

<body>
<div id="app"></div>
<script>
/* ---- js/config.js ---- */
/* 設定。自チームの名前に含まれる言葉（例：チーム名が「○○男子ミニバスケットボールクラブ」なら「○○」）。
   空のままなら、用紙の右側のチームBを自チームにする。画面の「自チームの名前に含まれる言葉」の欄からも変えられる（変えた値は保存される）。 */
window.MB_CONFIG = { myKeyword: '' };

/* ---- js/core.js ---- */
/* minibasket/js/core.js
   スコアシート1試合ぶんのデータ（読み取り結果）の「正規化」と「整合性チェック」。
   ブラウザでも Node でも動く（Node では module.exports、ブラウザでは window.MB に載る）。

   ── 入力の形（読み取りJSON）───────────────────────────────────────────
   { meta:{event,date,venue,time,gameNo},
     teams:[ { side:'A', name, uniform, finalScore, quarterScores:[6,3,6,2],
               timeouts:[{box:2, minute:4}], teamFouls:[0,1,0,0],
               players:[{ no:'28', name:'', marks:['','/','/','/'], fouls:[{type:'P', ft:1, ink:'black'}] }],
               running:[{ total:2, mark:'slash'|'dot', player:'18', playerCircled:false, qEnd:false }] },
             { side:'B', … } ] }
   marks   … 出場時限の4マス。'/'=出場、'\\' 'X'=斜線以外の印（交代などの意味。出場扱いだが「参考値」にする）、''=なし
   fouls   … type は P/T/U/D、ft はフリースロー数（P2 の 2）、ink は 'red'|'black'（赤=1Q・3Q、黒=2Q・4Q）
   running … 得点が入った「マス」だけを小さい順に。mark: dot=●(1点FT) / slash=斜線(2点)。
             playerCircled=選手番号が丸で囲まれている（3点シュート）。qEnd=ピリオド終了の丸・下線がある
   ──────────────────────────────────────────────────────────────────── */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.MB = Object.assign(root.MB || {}, api);
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const QLABEL = ['1Q', '2Q', '3Q', '4Q', 'OT', 'OT2', 'OT3'];
  const KIND_LABEL = { FT: 'フリースロー', FG: '2点', TP: '3点' };

  const str = v => (v == null ? '' : String(v).trim());
  const int = (v, d = null) => {
    if (v == null || v === '') return d;
    const n = Number(String(v).replace(/[^\d.-]/g, ''));

  };
  const sum = a => a.reduce((s, x) => s + x, 0);

  function normMark(m) {
    if (m === true) return '/';
    if (!m) return '';

    if (s === '/' || s === '／') return '/';
    if (s === '\\' || s === '＼' || s === '¥') return '\\';
    if (/^[xX×✕✖]$/.test(s)) return 'X';
    return s === '' ? '' : '/';
  }

  function normFoul(f) {
    if (typeof f === 'string') {
      const m = /^([PTUDC]?)(\d?)\s*(red|black|r|b)?$/i.exec(f.trim());
      f = m ? { type: m[1] || 'P', ft: m[2] ? +m[2] : 0, ink: m[3] } : { type: 'P' };
    }
    const type = (str(f.type).toUpperCase() || 'P').slice(0, 1);
    const ft = Math.max(0, Math.min(3, int(f.ft, 0)));
    const ink = /^r/i.test(str(f.ink)) ? 'red' : /^b/i.test(str(f.ink)) ? 'black' : null;
    return { type, ft, ink };
  }

  function normPlayer(p) {
    let marks = Array.isArray(p.marks) ? p.marks.map(normMark) : [];
    if (!marks.length && Array.isArray(p.quarters)) marks = p.quarters.map(normMark);
    while (marks.length < 4) marks.push('');
    marks = marks.slice(0, 4);
    return {
      no: str(p.no),
      name: str(p.name),
      marks,
      played: marks.map(m => m !== ''),

      .map(e => ({
        total: int(e.total, 0),
        player: str(e.player),
        mark: /dot|●|ft/i.test(str(e.mark)) ? 'dot' : /slash|\/|fg/i.test(str(e.mark)) ? 'slash' : null,
        circled: !!(e.playerCircled || e.circled),

      .filter(e => e.total > 0)

      name: str(r.name),

      final: final != null ? final : (quarters.length ? sum(quarters) : (events.length ? events[events.length - 1].total : 0)),

      teams: [normTeam((raw.teams || [])[0] || {}, 0), normTeam((raw.teams || [])[1] || {}, 1)],
      notes: Array.isArray(raw.notes) ? raw.notes.map(String) : [],

    };
    g.nq = Math.max(4, ...g.teams.map(t => t.quarters.length));
    for (const t of g.teams) {
      while (t.quarters.length < g.nq) t.quarters.push(0);
      t.cum = [];
      t.quarters.reduce((s, v, k) => (t.cum[k] = s + v), 0);
      for (const e of t.events) {

        else if (e.markKind && e.markKind !== e.kind) add(warnings, 'MARK_MISMATCH', i, `${nm}：得点 ${e.total} の印は「${KIND_LABEL[e.markKind]}」ですが、増えた点数は+${e.pts}です`, { total: e.total });

      t.cum.forEach((c, k) => {

      });

      const byNo = new Map(t.players.map(p => [p.no, p]));
      for (const e of t.events) {
        const p = byNo.get(e.player);
        if (!p) add(warnings, 'SCORER_UNKNOWN', i, `${nm}：得点 ${e.total} の背番号 #${e.player || '?'} が選手登録にありません`, { total: e.total });
        else if (e.q < 4 && !p.played[e.q]) add(warnings, 'SCORER_NOT_PLAYING', i, `${nm}：得点 ${e.total}（${QLABEL[e.q]}）の #${e.player} は、その出場時限に印がありません`, { total: e.total });
      }
      // 7) ファウル
      for (const p of t.players) {
        if (p.fouls.length > 5) add(warnings, 'FOUL_OVER', i, `${nm}：#${p.no} のファウルが${p.fouls.length}個あります（最大5個）`);
      }
      const foulTotal = sum(t.players.map(p => p.fouls.length));
      const tallyTotal = sum(t.tally);
      if (tallyTotal > foulTotal) add(warnings, 'TALLY_OVER', i, `${nm}：チームファウル欄の合計(${tallyTotal})が、個人ファウルの合計(${foulTotal})より多いです`);
      // 8) 出場メンバー
      for (let k = 0; k < 4; k++) {
        const n = t.players.filter(p => p.played[k]).length;
        if (n > 0 && n < 5) add(warnings, 'LINEUP_LT5', i, `${nm}：${QLABEL[k]}の出場記録が${n}人です。ふつうは5人なので、斜線の見落としがないか確認してください（④は右の太い線に接していて見落としやすい）`, { q: k });
        else if (n > 5) add(infos, 'LINEUP_GT5', i, `${nm}：${QLABEL[k]}の出場記録が${n}人です（途中交代があった、または印の読み違い）`, { q: k });
      }
      const dnp = t.players.filter(p => !p.played.some(Boolean)).map(p => '#' + p.no);
      if (dnp.length) add(infos, 'ROSTER_DNP', i, `${nm}：出場の印がない登録選手：${dnp.join(' ')}（欠席・ケガ等かは記録からは分かりません）`);
      const odd = t.players.flatMap(p => p.partial.map((x, k) => (x ? `#${p.no}の${QLABEL[k]}` : null)).filter(Boolean));
      if (odd.length) add(infos, 'ODD_MARK', i, `${nm}：出場時限に斜線(／)以外の印：${odd.join('、')}。出場扱いにしていますが、プラスマイナスは参考値になります`);
    });
    // 9) 勝敗・見出し
    if (g.teams[0].final === g.teams[1].final) add(infos, 'DRAW', null, '同点です（延長の記録が抜けていないか確認）');
    return { errors, warnings, infos, ok: errors.length === 0 };
  }

  // ── 画面で直すための「テキスト ⇄ データ」変換 ─────────────────────────────
  const foulsToText = fouls => (fouls || []).map(f => `${f.type || 'P'}${f.ft || ''}${f.ink === 'red' ? 'r' : f.ink === 'black' ? 'b' : ''}`).join(' ');
  const parseFoulsText = s => String(s || '').split(/[\s,、]+/).filter(Boolean).map(t => {
    const m = /^([PTUDC])(\d?)([rRbB]?)$/i.exec(t.trim());
    return m ? { type: m[1].toUpperCase(), ft: m[2] ? +m[2] : 0, ink: m[3] ? (/r/i.test(m[3]) ? 'red' : 'black') : null } : null;
  }).filter(Boolean);
  const rawEventsToText = ev => (ev || []).map(e => `${e.total} ${e.mark === 'dot' ? 'FT' : e.playerCircled ? '3P' : 'FG'} ${e.player}${e.qEnd ? ' *' : ''}`).join('\n');
  function parseEventsText(s) {
    const out = [];
    String(s || '').split(/\n|;|；/).forEach(line => {
      const toks = line.split(/[\s,、:：]+/).filter(Boolean);
      if (toks.length < 3) return;
      const total = int(toks[0], 0);
      if (!total) return;
      const k = toks[1].toUpperCase();
      const e = { total, player: String(toks[2]).replace(/^#/, '') };
      if (/^(FT|●|1)$/.test(k)) e.mark = 'dot';
      else if (/^(3P|3|○)$/.test(k)) { e.mark = 'slash'; e.playerCircled = true; } else e.mark = 'slash';
      if (toks.slice(3).some(t => /^(\*|end|終)$/i.test(t))) e.qEnd = true;
      out.push(e);
    });
    return out;
  }
  const timeoutsToText = t => (t || []).map(x => `${x.box}:${x.minute == null ? '' : x.minute}`).join(' ');
  const parseTimeoutsText = s => String(s || '').split(/[\s,、]+/).filter(Boolean).map(t => {
    const m = /^(\d):?(\d*)$/.exec(t);
    return m ? { box: +m[1], minute: m[2] === '' ? null : +m[2] } : null;
  }).filter(Boolean);

  /** 手入力で始めるための空の試合 */
  function emptyRaw(n) {
    n = n || 10;
    const team = side => ({
      side, name: '', uniform: side === 'A' ? '白' : '濃', finalScore: 0, quarterScores: [0, 0, 0, 0], timeouts: [], teamFouls: [0, 0, 0, 0],
      players: Array.from({ length: n }, () => ({ no: '', name: '', marks: ['', '', '', ''], fouls: [] })), running: [],
    });
    return { meta: { event: '', date: '', venue: '', time: '', gameNo: '' }, teams: [team('A'), team('B')], notes: [] };
  }

  /** 試合の表示名（タブや一覧用） */
  function gameTitle(raw) {
    const m = (raw && raw.meta) || {};
    const d = String(m.date || '').replace(/^\d{4}-0?(\d+)-0?(\d+)$/, '$1/$2');
    return [d, m.time, m.gameNo ? `Game${m.gameNo}` : ''].filter(Boolean).join(' ') || '日時不明';

  return { QLABEL, KIND_LABEL, normalizeGame, validateGame, str, int, sum, foulsToText, parseFoulsText, rawEventsToText, parseEventsText, timeoutsToText, parseTimeoutsText, emptyRaw, gameTitle };
});

/* minibasket/js/analysis.js

   ・フリースロー：成功数（ランニングスコアの●）／機会数（相手のファウルの P1,P2 の数字）→ 成功率
   ・ファウル：選手別、ピリオド別（インクの色＋チームファウル欄から推定）、相手に与えたフリースロー
   ・出場ピリオド、5人の組み合わせ(ラインナップ)ごとの得失点、選手ごとのプラスマイナス（ピリオド単位）
   ・タイムアウト（どのピリオドの何分か）

   できないこと（シートに載っていない）
   ・シュートの試投数・成功率(FG%)、リバウンド、アシスト、ターンオーバー、スティール
   ・同じピリオド内での両チームの得点の「前後関係」（→リードチェンジ・連続得点は出せない）

  function foulsByQuarter(t) {

    const out = tally.map((v, q) => ({ q, tally: v, lo: v, hi: v < 4 ? v : null, exact: v < 4 }));

      opp: { made: scoring.opp.FT.n, att: att(T) },

    ft.my.pct = pct(ft.my.made, ft.my.att); ft.opp.pct = pct(ft.opp.made, ft.opp.att);
    const players = { my: playerStats(g, my), opp: playerStats(g, op) };
    const lineups = { my: lineupsOf(g, my), opp: lineupsOf(g, op) };
    const fouls = { my: foulsByQuarter(T), opp: foulsByQuarter(O) };
    const timeouts = {
      my: T.timeouts.map(x => ({ ...x, label: x.quarter != null ? QLABEL[x.quarter] : '?', net: x.quarter != null && x.quarter < g.nq ? quarters[x.quarter].net : null })),
      opp: O.timeouts.map(x => ({ ...x, label: x.quarter != null ? QLABEL[x.quarter] : '?', net: x.quarter != null && x.quarter < g.nq ? -quarters[x.quarter].net : null })),
    };
    const used = players.my.filter(p => p.qCount > 0);
    const participation = {
      roster: T.players.length, used: used.length,
      dnp: players.my.filter(p => p.qCount === 0 && !p.synthetic).map(p => p.no),
      four: used.filter(p => p.qCount === 4).map(p => p.no),
      counts: [0, 1, 2, 3].map(k => T.players.filter(p => p.played[k]).length),
    };
    const diff = T.final - O.final;
    const r = {
      game: g, my, opp: op, myName: T.name, oppName: O.name,
      meta: g.meta,
      result: { pf: T.final, pa: O.final, diff, outcome: diff > 0 ? 'W' : diff < 0 ? 'L' : 'D' },
      quarters, halves: { first: half(0, 2), second: half(2, 4) },
      scoring, ft, players, lineups, fouls, timeouts, participation,
      checks: core.validateGame(g),
    };
    r.insights = insightsForGame(r);
    return r;
  }

  // ── 複数試合（自チームの通算）─────────────────────────────────
  function analyzeMany(games, opts) {
    opts = opts || {};
    const reports = games.map(g => analyzeGame(g, pickMine(g, opts.myKeyword)));
    const n = reports.length;
    const A = { n, reports };
    A.record = { w: 0, l: 0, d: 0 };
    reports.forEach(r => { A.record[r.result.outcome === 'W' ? 'w' : r.result.outcome === 'L' ? 'l' : 'd']++; });
    A.pf = sum(reports.map(r => r.result.pf)); A.pa = sum(reports.map(r => r.result.pa)); A.diff = A.pf - A.pa;
    A.avgPf = n ? r1(A.pf / n) : 0; A.avgPa = n ? r1(A.pa / n) : 0;
    A.quarters = [0, 1, 2, 3].map(k => {
      const nets = reports.map(r => r.quarters[k].net);
      const pf = sum(reports.map(r => r.quarters[k].pf)), pa = sum(reports.map(r => r.quarters[k].pa));
      return { k, label: QLABEL[k], pf, pa, net: pf - pa, avgPf: n ? r1(pf / n) : 0, avgPa: n ? r1(pa / n) : 0, avgNet: n ? r1((pf - pa) / n) : 0, nets };
    });
    const addScoring = side => {
      const s = { FT: { n: 0, pts: 0 }, FG: { n: 0, pts: 0 }, TP: { n: 0, pts: 0 } };
      reports.forEach(r => ['FT', 'FG', 'TP'].forEach(k => { s[k].n += r.scoring[side][k].n; s[k].pts += r.scoring[side][k].pts; }));
      return s;
    };
    A.scoring = { my: addScoring('my'), opp: addScoring('opp') };
    A.ft = {
      my: { made: sum(reports.map(r => r.ft.my.made)), att: sum(reports.map(r => r.ft.my.att)) },
      opp: { made: sum(reports.map(r => r.ft.opp.made)), att: sum(reports.map(r => r.ft.opp.att)) },
    };
    A.ft.my.pct = pct(A.ft.my.made, A.ft.my.att); A.ft.opp.pct = pct(A.ft.opp.made, A.ft.opp.att);
    A.fouls = {
      my: { total: sum(reports.map(r => r.fouls.my.total)), perGame: reports.map(r => r.fouls.my.total) },
      opp: { total: sum(reports.map(r => r.fouls.opp.total)), perGame: reports.map(r => r.fouls.opp.total) },
    };
    // 選手ごとの通算（背番号で束ねる）
    const map = new Map();
    reports.forEach((r, gi) => {
      r.players.my.forEach(p => {
        let a = map.get(p.no);
        if (!a) map.set(p.no, a = { no: p.no, name: '', onRoster: 0, games: 0, qCount: 0, pts: 0, fgPts: 0, tpPts: 0, ftPts: 0, fgN: 0, tpN: 0, ftN: 0, fouls: 0, ftGiven: 0, pm: 0, pmApprox: false, foul4: 0, foulOut: 0, qHist: [0, 0, 0, 0], ptsByQ: [0, 0, 0, 0], perGame: [] });
        if (p.name) a.name = p.name;
        a.onRoster++;
        if (p.qCount > 0) a.games++;
        a.qCount += p.qCount; a.pts += p.pts; a.fgPts += p.fgPts; a.tpPts += p.tpPts; a.ftPts += p.ftPts;
        a.fgN += p.fgN; a.tpN += p.tpN; a.ftN += p.ftN; a.fouls += p.foulCount; a.ftGiven += p.ftGiven; a.pm += p.pm; a.pmApprox = a.pmApprox || p.pmApprox;
        if (p.foulCount >= 4) a.foul4++;
        if (p.foulCount >= 5) a.foulOut++;
        p.played.forEach((x, k) => { if (x) a.qHist[k]++; });
        p.ptsByQ.forEach((v, k) => { a.ptsByQ[k] += v; });
        a.perGame[gi] = { pts: p.pts, q: p.qCount, fouls: p.foulCount, pm: p.pm };
      });
    });
    A.players = [...map.values()].map(a => ({ ...a, ppq: a.qCount ? r1(a.pts / a.qCount) : null }))
      .sort((a, b) => b.pts - a.pts || b.qCount - a.qCount || Number(a.no) - Number(b.no));
    // ラインナップ（5人の組み合わせ）：試合をまたいで同じ組み合わせを束ねる
    const lm = new Map();
    reports.forEach((r, gi) => r.lineups.my.forEach(l => {
      const key = l.members.slice().sort((a, b) => Number(a) - Number(b)).join('-');
      let a = lm.get(key);
      if (!a) lm.set(key, a = { key, members: l.members.slice().sort((a, b) => Number(a) - Number(b)), n: 0, pf: 0, pa: 0, approx: false, where: [] });
      a.n++; a.pf += l.pf; a.pa += l.pa; a.approx = a.approx || l.approx; a.where.push({ game: gi, q: l.q });
    }));
    A.lineups = [...lm.values()].map(a => ({ ...a, net: a.pf - a.pa })).sort((a, b) => b.net - a.net);

  // ── 「気づき」の文章 ──────────────────────────────────────────
  const hashNo = ns => ns.map(n => '#' + n).join(' ');
  // ファウル数の表示：確定なら「9」、幅があれば「5〜7」、上限不明なら「4以上」
  const rangeText = x => (x.exact ? String(x.lo) : x.hi == null ? `${x.lo}以上` : `${x.lo}〜${x.hi}`);

  function insightsForGame(r) {
    const L = [], o = r.result;
    const add = (tag, text) => L.push({ tag, text });
    add('result', `${r.myName} ${o.pf} − ${o.pa} ${r.oppName}（${o.outcome === 'W' ? '勝ち' : o.outcome === 'L' ? '負け' : '引き分け'}、${sgn(o.diff)}）。`);
    const qs = r.quarters.slice(0, 4);
    const best = qs.reduce((a, b) => (b.net > a.net ? b : a)), worst = qs.reduce((a, b) => (b.net < a.net ? b : a));
    add('flow', `ピリオド別の得失点差は ${qs.map(q => `${q.label} ${sgn(q.net)}`).join('、')}。最も差を広げたのは${best.label}、最も詰められたのは${worst.label}${worst.net < 0 ? '（このピリオドは負け）' : ''}。`);
    const sc = r.players.my.filter(p => p.pts > 0).sort(byDesc(p => p.pts));
    if (sc.length) {
      const top = sc[0], top2 = sc.slice(0, 2);
      add('scoring', `得点者は${sc.length}人。最多は #${top.no}（${top.pts}点、チームの${pct(top.pts, o.pf)}%）。上位2人で${pct(sum(top2.map(p => p.pts)), o.pf)}%。`);
    }
    const tp = r.players.my.filter(p => p.tpN > 0);
    if (tp.length) add('scoring', `3点シュート：${tp.map(p => `#${p.no}が${p.tpN}本`).join('、')}。`);
    const ft = r.ft;
    if (ft.my.att > 0 || ft.opp.att > 0) {
      add('ft', `フリースローは、機会${ft.my.att}本のうち${ft.my.made}本成功${ft.my.pct != null ? `（${ft.my.pct}%）` : ''}。相手は${ft.opp.att}本のうち${ft.opp.made}本${ft.opp.pct != null ? `（${ft.opp.pct}%）` : ''}。`
        + `（機会は、相手ファウルの P1・P2 の数字の合計です）`);
    }
    const fm = r.fouls.my, fo = r.fouls.opp;
    add('foul', `ファウルは自チーム${fm.total}個、相手${fo.total}個。相手に与えたフリースロー機会は${ft.opp.att}本で、相手はそのうち${ft.opp.made}本（${ft.opp.made}点）を決めました（相手の得点の${pct(ft.opp.made, o.pa) ?? 0}%）。`);
    const heavy = fm.byQ.filter(x => (x.hi ?? x.lo) >= 6 || x.lo >= 6).sort((a, b) => b.lo - a.lo)[0];
    if (heavy) add('foul', `ファウルが多かったのは${QLABEL[heavy.q]}（${rangeText(heavy)}個${fm.method === 'ink' ? '・インクの色から推定' : ''}）。このピリオドの得失点差は${sgn(r.quarters[heavy.q].net)}でした。`);
    const f4 = r.players.my.filter(p => p.foulCount >= 4);
    if (f4.length) add('foul', `4ファウル以上：${f4.map(p => `#${p.no}（${p.foulCount}）`).join('、')}。`);
    if (worst.net <= 0) {
      const lu = r.lineups.my.find(l => l.q === worst.k);
      if (lu) add('lineup', `${worst.label}（${sgn(worst.net)}）の出場：${hashNo(lu.members)}${lu.approx ? '（交代の印があり参考）' : ''}。`);
    }
    const pa = r.participation;
    add('participation', `出場した選手は${pa.used}人（登録${pa.roster}人）。${pa.dnp.length ? `出場の印がないのは ${hashNo(pa.dnp)}（欠席・ケガ等かは記録から分かりません）。` : ''}`);
    return L;
  }

  function insightsForMany(A) {
    const L = [];
    const add = (tag, text) => L.push({ tag, text });
    const n = A.n;
    if (!n) return L;
    add('result', `${n}試合で ${A.record.w}勝${A.record.l}敗${A.record.d ? `${A.record.d}分` : ''}。得点${A.pf}・失点${A.pa}（${sgn(A.diff)}）、平均 ${A.avgPf} − ${A.avgPa}。`);
    // ピリオド別
    const qs = A.quarters;
    const min = qs.reduce((a, b) => (b.avgNet < a.avgNet ? b : a)), max = qs.reduce((a, b) => (b.avgNet > a.avgNet ? b : a));
    add('flow', `ピリオド別の平均得失点差：${qs.map(q => `${q.label} ${sgn(q.avgNet)}`).join('、')}。最も差が出るのは${max.label}、最も縮むのは${min.label}。`);
    const lowCount = qs.map(q => q.nets.filter(v => v <= 0).length);
    if (lowCount[min.k] > 0) add('flow', `${min.label}は${n}試合中${lowCount[min.k]}試合で相手に上回られるか同点でした（${min.nets.map(sgn).join('、')}）。`);
    // 弱いピリオドの顔ぶれ
    if (n >= 2) {
      const c = {};
      A.reports.forEach(r => r.lineups.my.filter(l => l.q === min.k).forEach(l => l.members.forEach(m => { c[m] = (c[m] || 0) + 1; })));
      const list = Object.entries(c).sort((a, b) => b[1] - a[1] || Number(a[0]) - Number(b[0])).map(([m, k]) => `#${m}(${k})`).join(' ');
      add('lineup', `${min.label}に出た選手（延べ回数）：${list}。ほかのピリオドと顔ぶれが違うことが、差の縮み方に関係しているかを見る材料になります。`);
    }
    // 得点
    const sc = A.players.filter(p => p.pts > 0);
    if (sc.length) {
      const top = sc[0], top2 = sc.slice(0, 2);
      add('scoring', `得点者は延べ${sc.length}人。最多は #${top.no}（${top.pts}点、チームの${pct(top.pts, A.pf)}%、${top.qCount}ピリオドで1ピリオドあたり${top.ppq}点）。上位2人で${pct(sum(top2.map(p => p.pts)), A.pf)}%。`);
    }
    const tp = A.players.filter(p => p.tpN > 0);
    if (tp.length) add('scoring', `3点シュート：${sum(tp.map(p => p.tpN))}本（${tp.map(p => `#${p.no}×${p.tpN}`).join('、')}）。`);
    // FT
    add('ft', `フリースローは、機会${A.ft.my.att}本のうち${A.ft.my.made}本成功（${A.ft.my.pct ?? '-'}%）。相手は${A.ft.opp.att}本のうち${A.ft.opp.made}本（${A.ft.opp.pct ?? '-'}%）。決まらなかったのは自チーム${A.ft.my.att - A.ft.my.made}本です。`);
    // ファウル
    add('foul', `ファウルは自チーム合計${A.fouls.my.total}個（1試合平均${r1(A.fouls.my.total / n)}）、相手${A.fouls.opp.total}個（${r1(A.fouls.opp.total / n)}）。相手のフリースロー得点は${A.ft.opp.made}点で、失点の${pct(A.ft.opp.made, A.pa)}%でした。`);
    const f4 = A.players.filter(p => p.foul4 > 0);
    if (f4.length) add('foul', `1試合で4ファウルに達した選手：${f4.map(p => `#${p.no}（${p.foul4}回）`).join('、')}。5ファウル退場は${sum(A.players.map(p => p.foulOut))}回。`);
    const heavy = A.reports.map((r, gi) => ({ gi, h: r.fouls.my.byQ.slice().sort((a, b) => b.lo - a.lo)[0], r })).filter(x => x.h.lo >= 6);
    heavy.forEach(x => add('foul', `${x.r.oppName}戦：${QLABEL[x.h.q]}に${rangeText(x.h)}個のファウル（このピリオドの得失点差${sgn(x.r.quarters[x.h.q].net)}）。`));
    // 出場
    const used = A.players.filter(p => p.qCount > 0);
    const core4 = used.filter(p => p.qCount >= n * 3);
    add('participation', `出場した選手は${used.length}人（登録${A.players.length}人）。${A.neverPlayed.length ? `${n}試合とも出場の印がないのは ${hashNo(A.neverPlayed)}（欠席・ケガ等かは記録から分かりません）。` : '全員が1回以上出場しています。'}`);
    if (core4.length) add('participation', `ほぼ毎試合3ピリオド出ている選手：${hashNo(core4.map(p => p.no))}。`);
    // 注意
    add('note', `${n}試合分の記録なので、傾向というより「目安」として見てください。`);
    return L;
  }

  return { pickMine, analyzeGame, analyzeMany, foulsByQuarter, scoringOf, playerStats, lineupsOf, insightsForGame, insightsForMany, sgn, pct };
});

/* minibasket/js/charts.js

   決まり：棒は太さ24px以内・データ側の先端だけ4px丸め／隣り合う塗りの間は2pxの隙間／線は2px／丸い印は直径8px以上で2pxの縁／
          格子は実線の細線／数字は先端にだけ／文字は文字色トークン（データの色は印にだけ）／全部の印に tooltip（data-tip）と表の写し。 */

  /** 縦棒（先端だけ丸め） */
  const vbar = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h)); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
  /** 横棒：x=基準線、右へ伸びる（右端だけ丸め） */
  const hbarR = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, h / 2, w)); return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`; };
  /** 横棒：x=基準線、左へ伸びる（左端だけ丸め） */
  const hbarL = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, h / 2, w)); return `M${x},${y}H${x - w + r}Q${x - w},${y} ${x - w},${y + r}V${y + h - r}Q${x - w},${y + h} ${x - w + r},${y + h}H${x}Z`; };

  const legend = items => `<div class="legend">${items.map(i => `<span><i class="${i.cls || ''}" style="background:${i.color}"></i>${esc(i.label)}</span>`).join('')}</div>`;

  /** ピリオド終了ごとの点差（自チーム目線）の折れ線。点は5つだけ（ピリオド内の前後関係は記録がない）。縦軸は 0 を含む範囲だけ */

    const pts = o.points; // [{label, v, tip:[...]}]
    const mx = Math.max(0, ...pts.map(p => p.v)), mn = Math.min(0, ...pts.map(p => p.v));
    let hi = mx > 0 ? niceMax(mx) : 0, lo = mn < 0 ? -niceMax(-mn) : 0;
    if (hi === 0 && lo === 0) { hi = 5; lo = -5; }
    const x = i => ml + (W - ml - mr) * (i / (pts.length - 1));
    const y = v => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(o.title || '')}">`;
    [...new Set([lo, ...(lo < 0 && hi > 0 ? [0] : []), hi, 0])].sort((a, b) => a - b).forEach(t => { s += `<line class="${t === 0 ? 'axis' : 'grid'}" x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}"/><text class="mute" x="${ml - 6}" y="${y(t) + 4}" text-anchor="end">${sgn(t)}</text>`; });
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join('');
    s += `<path d="${path}L${x(pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--me)" opacity=".10"/>`;
    s += `<path d="${path}" fill="none" stroke="var(--me)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => {
      s += `<text class="lbl" x="${x(i)}" y="${H - mb + 20}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${esc(p.label)}</text>`;
      s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="var(--me)" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(p.v)}" r="14" fill="transparent"${tip(p.tip)}/>`;
      if (i > 0) s += `<text class="v" x="${x(i)}" y="${y(p.v) + (p.v >= 0 ? -11 : 19)}" text-anchor="middle">${sgn(p.v)}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /** 選手ごとの得点を、フリースロー・2点・3点の積み上げ横棒で（点が大きいほど濃い青） */
  function kindsBar(o) {
    const rows = o.rows; // [{label, ft, fg, tp, ftN, fgN, tpN, total}]
    const W = Math.max(280, o.W || 640), rh = 28, mt = 6, mb = 8;
    const labW = Math.min(150, Math.max(70, Math.max(...rows.map(r => tw(r.label, 13))) + 12)), mr = 34;
    const H = mt + rows.length * rh + mb;
    const max = Math.max(1, ...rows.map(r => r.total));
    const sc = v => (W - labW - mr) * (v / max);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(o.title || '')}">`;
    s += `<line class="axis" x1="${labW}" x2="${labW}" y1="${mt}" y2="${H - mb}"/>`;
    rows.forEach((r, i) => {
      const y0 = mt + i * rh + 5, h = 18;
      s += `<text class="lbl" x="${labW - 8}" y="${y0 + 13}" text-anchor="end">${esc(r.label)}</text>`;
      let x = labW;
      const segs = [['ft', r.ft, 'var(--k-ft)', 'フリースロー', r.ftN, '1点'], ['fg', r.fg, 'var(--k-fg)', '2点シュート', r.fgN, '2点'], ['tp', r.tp, 'var(--k-3p)', '3点シュート', r.tpN, '3点']].filter(sg => sg[1] > 0);
      segs.forEach((sg, k) => {
        const w = sc(sg[1]), last = k === segs.length - 1;
        const dw = Math.max(1, w - (last ? 0 : 2));
        s += `<path d="${last ? hbarR(x, y0, dw, h, 4) : `M${x},${y0}h${dw}v${h}h${-dw}Z`}" fill="${sg[2]}"${tip([`${sg[1]}点`, `${r.label}　${sg[3]} ${sg[4]}本(各${sg[5]})`, `合計 ${r.total}点`])}/>`;
        x += w;
      });
      s += `<text class="v" x="${x + 6}" y="${y0 + 13}">${r.total}</text>`;
    });
    s += '</svg>';
    return legend([{ label: 'フリースロー（●）', color: 'var(--k-ft)' }, { label: '2点シュート（／）', color: 'var(--k-fg)' }, { label: '3点シュート（○）', color: 'var(--k-3p)' }]) + s;
  }

  /** プラスマイナス（出場したピリオドの得失点差の合計）の左右に伸びる横棒。青=プラス、赤=マイナス */
  function plusMinus(o) {
    const rows = o.rows; // [{label, v, approx, q}]
    const W = Math.max(280, o.W || 640), rh = 28, mt = 6, mb = 8;
    const labW = Math.min(150, Math.max(70, Math.max(...rows.map(r => tw(r.label, 13))) + 12));
    const H = mt + rows.length * rh + mb;
    const ext = niceMax(Math.max(5, ...rows.map(r => Math.abs(r.v))));
    const cx0 = labW + (W - labW - 8) / 2, half = (W - labW - 8) / 2 - 34;
    const sc = v => half * (Math.abs(v) / ext);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(o.title || '')}">`;
    s += `<line class="axis" x1="${cx0}" x2="${cx0}" y1="${mt}" y2="${H - mb}"/>`;
    rows.forEach((r, i) => {
      const y0 = mt + i * rh + 5, h = 18;
      s += `<text class="lbl" x="${labW - 8}" y="${y0 + 13}" text-anchor="end">${esc(r.label)}</text>`;
      const w = Math.max(r.v === 0 ? 0 : 1, sc(r.v));
      const t = tip([`${sgn(r.v)}`, `${r.label}　出場${r.q}ピリオドの得失点差の合計`, ...(r.approx ? ['交代の印があるため参考値'] : [])]);
      if (r.v > 0) s += `<path d="${hbarR(cx0, y0, w, h, 4)}" fill="var(--pos)"${r.approx ? ' opacity=".55"' : ''}${t}/>`;
      else if (r.v < 0) s += `<path d="${hbarL(cx0, y0, w, h, 4)}" fill="var(--neg)"${r.approx ? ' opacity=".55"' : ''}${t}/>`;
      else s += `<rect x="${cx0 - 1}" y="${y0}" width="2" height="${h}" fill="var(--axis)"${t}/>`;
      const lx = r.v >= 0 ? cx0 + w + 6 : cx0 - w - 6;
      s += `<text class="v" x="${lx}" y="${y0 + 13}" text-anchor="${r.v >= 0 ? 'start' : 'end'}">${sgn(r.v)}${r.approx ? '＊' : ''}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /** ピリオドごとの「試合ごとの差」を点で、平均を横線で（通算用） */
  function quarterDots(o) {
    const W = Math.max(280, o.W || 640), H = 230, ml = 34, mr = 10, mt = 22, mb = 40;
    const ext = niceMax(Math.max(5, ...o.groups.flatMap(g => g.dots.map(d => Math.abs(d.v)))));
    const n = o.groups.length, gw = (W - ml - mr) / n;
    const y = v => mt + (H - mt - mb) * (1 - (v + ext) / (2 * ext));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(o.title || '')}">`;
    [-ext, 0, ext].forEach(t => { s += `<line class="${t === 0 ? 'axis' : 'grid'}" x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}"/><text class="mute" x="${ml - 6}" y="${y(t) + 4}" text-anchor="end">${sgn(t)}</text>`; });
    o.groups.forEach((g, i) => {
      const cx = ml + gw * i + gw / 2;
      const mean = g.dots.reduce((a, d) => a + d.v, 0) / (g.dots.length || 1);
      s += `<line x1="${cx - 22}" x2="${cx + 22}" y1="${y(mean)}" y2="${y(mean)}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"${tip([`平均 ${sgn(Math.round(mean * 10) / 10)}`, `${g.label}の得失点差の平均`])}/>`;
      g.dots.forEach((d, k) => {
        const dx = cx + (k - (g.dots.length - 1) / 2) * 16;
        s += `<circle cx="${dx}" cy="${y(d.v)}" r="5" fill="var(--me)" stroke="var(--surface)" stroke-width="2"/><circle cx="${dx}" cy="${y(d.v)}" r="13" fill="transparent"${tip([sgn(d.v), `${g.label}　${d.name}`])}/>`;
      });
      s += `<text class="lbl" x="${cx}" y="${H - mb + 20}" text-anchor="middle">${esc(g.label)}</text>`;
      s += `<text class="v" x="${cx}" y="${H - mb + 36}" text-anchor="middle">平均 ${sgn(Math.round(mean * 10) / 10)}</text>`;
    });
    s += '</svg>';
    return legend([{ label: '試合ごとの得失点差', color: 'var(--me)', cls: 'dot' }, { label: '平均', color: 'var(--ink)', cls: 'ln' }]) + s;
  }

  return { esc, sgn, f1, tw, groupedBars, marginLine, kindsBar, plusMinus, quarterDots, legend };
});

   写真1枚をそのまま渡すと、Claude 側で約120万画素に縮小されて、ランニングスコアの小さな数字がつぶれる。
   「見出し」「A欄」「B欄」「ランニングスコア（3分割）」に分けて、それぞれを大きく見せる。
   読み取りは2段階：①基本情報（得点・出場・ファウル・タイムアウト）②ランニングスコア。

## シートの構造（JBAミニバスケットボール スコアシート。FIBA形式の日本語版）
- 上段の表：大会名・日付・会場・時間・Game No.、その下に「スコア」欄（チームAの最終得点の枠／ピリオド別の「A − B」が上から4行／チームBの最終得点の枠）。

- 出場時限（①〜④のマス）：そのピリオドに出場した選手のマスに斜線「/」。ごくまれに逆斜線「\\」や「X」が書かれる（交代などの意味）。見えたまま "/" "\\" "X"、空欄は ""。

    const colCov = bx => { let n = 0, m = 0; for (let by = Math.floor(bh * 0.25); by < bh * 0.75; by++) { m++; if (paper(bx, by)) n++; } return n / m; };
    const grow = (cov, start, lim, step) => {
      let pos = start, miss = 0, last = start;
      while (pos + step >= 0 && pos + step < lim) {

        if (cov(pos) >= 0.5) { last = pos; miss = 0; } else if (++miss >= 2) break;

  function labeler(players) {
    const fam = p => (p.name || '').trim().split(/[\s　]+/);
    const count = {}; players.forEach(p => { const f = fam(p)[0]; if (f) count[f] = (count[f] || 0) + 1; });
    return p => {
      const [f, g1] = fam(p);

    };
  }

  const pn = n => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');

  async function saveFile(name, text, mime) {
    try {
      if (window.claude && window.claude.use) {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename: name, data: text }); return; }
      }
    } catch (e) { if (e && e.code === 'declined') return; }

  }

  document.addEventListener('focusout', () => { tipEl.hidden = true; });

  // ════════ 画面の骨組み ═════════════════════════════════════════════

    const acts = [];

    if (it.status === 'done' && g) acts.push(`<button class="btn primary" data-act="open" data-g="${g.id}">確認して分析へ</button>`);

    if (it.status !== 'reading') acts.push(`<button class="btn quiet" data-act="rmItem" data-id="${it.id}">外す</button>`);
    return `<div class="photo" id="${it.id}"><img src="${it.url}" alt="スコアシートの写真"><div class="meta"><span class="name">${esc(it.file.name || '写真')}</span>${st}</div><div class="acts">${acts.join('')}</div></div>`;
  }
