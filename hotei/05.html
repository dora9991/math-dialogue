/* 方程式 第5時：分数のある方程式を、分母をはらって解こう（ikkan の lesson_hotei_05 と同じ流れ）。

   考えようは、x のスライダーで「式に 6 をかけた値」と「方程式の両辺に 6 をかけた値」をくらべる道具（答えは出さない）。
   数値は ikkan のまま。答えは、ページの中で計算し直している（CH.check。式の行はどれも同じ解をもつか、も確かめる）。データは自作。 */
(function () {
  /* ---- 道具（方程式の黒板 第1〜7時で共通。どのページにも同じものを入れてある） ---- */
  var C = CH.C, S = CH.mnum, XC = C.blue, NC = C.orange, OUT = 'rgba(20,40,30,.9)';

  /* ---- 式の値（検算用）。'5x＋3'・'[x＋5/3]'・'2(x−1)' を、x と a の関数に ---- */

    if (s != null && s !== '') { var sz = Math.min(o.size || h * .52, w * .84 / Math.max(.01, TW(D, s, 100) / 100)); TX(D, 0, 1, s, { size: sz, col: o.tcol || C.chalk, a: o.a }); }

  /* 式のカード：'5x|＋3|＝|2x|−9' と id の配列から。記号（＝ など）は op */

  function nf(L) { L.forEach(function (it) { it.flip = false; }); return L; }
  /* カードに「×6」がついて、かけた結果のカードになる */
  function mul(D, R, y, A, B, k, o) {
    o = o || {}; var P = seq(D, R, y, [A, B], [[0, 1]], CH.smooth(.3, 1, k), { h: o.h || CH.fs(D, 2.6), hl: o.cl });
    var a = CH.smooth(0, .25, k) * (1 - CH.smooth(.85, 1, k));
    if (a > 0) A.forEach(function (it) { if (it.op) return; var p = P[it.id]; if (!p) return; TX(D, p.x, p.y - P.h * .98, o.lab, { size: P.h * .4, col: o.hl && o.hl(it.id) ? C.pink : C.yel, a: a, outline: OUT }); });
    return P;
  }

  /* ---- 今日の問い ---- */
  var QA = mk('[1/2]x|−2|＝|[1/3]x', ['a', 'b', '=', 'c']), QB = nf(mk('3x|−12|＝|2x', ['a', 'b', '=', 'c']));
  function q1(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .04 }), s = CH.fs(D), y = R.y0 + R.h * .14;
    var P = mul(D, R, y, QA, QB, D.ph ? CH.smooth(0, .4, k) : 0, { lab: '×6' });
    if (!D.ph) { TX(D, R.cx, y + P.h * 1.6, '分数があって、解きにくい…', { size: s, col: 'rgba(242,240,230,.8)' }); return; }
    var a = CH.smooth(.05, .2, k) * (1 - CH.smooth(.35, .45, k));
    if (a > 0) TX(D, R.cx, y + P.h * 1.3, '[1/2]x×6＝3x　　[1/3]x×6＝2x', { size: fit(D, '[1/2]x×6＝3x　　[1/3]x×6＝2x', R.w, s * 1.05), col: C.yel, a: a });
    eqs(D, CH.rect(R.x0, y + P.h * .9, R.x1, R.y1 - s * 2.4), [{ s: LQ[1], lab: '両辺に 6 をかける' }, { s: LQ[2], lab: '移項' }, { s: LQ[3], col: C.yel }], k, { size: s * 1.4, at: [.62, .78], a: CH.smooth(.45, .52, k) });
    TX(D, R.cx, R.y1 - s * .9, '確かめ　左辺 [1/2]×12−2＝4、右辺 [1/3]×12＝4', { size: fit(D, '確かめ　左辺 [1/2]×12−2＝4、右辺 [1/3]×12＝4', R.w, s), col: C.green, a: CH.smooth(.9, .98, k) });
  }

  /* ---- ことば：2 と 3 の最小公倍数 ---- */
  function words(D, k) {
    var R = CH.box(D, { l: .06, r: .05, t: .1, b: .06 }), s = CH.fs(D), X = function (v) { return R.x0 + R.w * (v - .5) / 12; }, cw = Math.min(R.w / 13.5, s * 2.2);
    var rows = [[2, C.blue, R.y0 + R.h * .12], [3, C.orange, R.y0 + R.h * .36]];
    rows.forEach(function (rw, j) {
      TX(D, R.x0 - s * .2, rw[2] - cw * .95, rw[0] + ' の倍数', { size: s * .85, col: rw[1], align: 'left' });
      for (var v = rw[0], i = 0; v <= 12; v += rw[0], i++) {
        var a = D.ph ? CH.smooth(i * .07 + j * .02, i * .07 + j * .02 + .08, k) : (v <= 6 ? 1 : 0), on = v === 6 && k > .5, al = v === 12 && k > .5 ? .5 : 1;
        if (a > 0) card(D, X(v), rw[2], cw, cw * .9, String(v), { col: on ? C.yel : rw[1], a: a * al, glow: on, fa: on ? .35 : .2 });
      }
    });
    var a6 = CH.smooth(.5, .62, k);
    if (a6 > 0) { CH.line(D, X(6), rows[0][2] + cw * .5, X(6), rows[1][2] - cw * .5, { col: C.yel, w: 2.6, a: a6 }); TX(D, X(6), rows[1][2] + cw * 1.15, '最小公倍数 6', { size: s * .95, col: C.yel, a: a6 }); }
    var a2 = CH.smooth(.7, .85, k), y2 = R.y0 + R.h * .78;
    if (a2 > 0) TX(D, R.cx, y2, '分母 2 と 3 → 両辺に 6 をかける', { size: fit(D, '分母 2 と 3 → 両辺に 6 をかける', R.w, s * 1.15), a: a2 });
    if (a2 > 0) TX(D, R.cx, y2 + s * 2, '分数のない式に … 分母をはらう', { size: fit(D, '分数のない式に … 分母をはらう', R.w, s * 1.15), col: C.green, a: CH.smooth(.85, .97, k) });
  }

  /* ---- 例題：分子が式 ---- */
  var XA = mk('[x＋5/3]|＝|[x−1/2]', ['a', '=', 'b']), XB = nf(mk('2(x＋5)|＝|3(x−1)', ['a', '=', 'b']));
  function ex1(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .04 }), s = CH.fs(D), y = R.y0 + R.h * .14;
    var P = mul(D, R, y, XA, XB, D.ph ? CH.smooth(0, .38, k) : 0, { lab: '×6' });
    var a = D.ph ? CH.smooth(.36, .44, k) * (1 - CH.smooth(.55, .62, k)) : 0;
    if (a > 0) TX(D, R.cx, y + P.h * 1.15, '分子はひとまとまり → かっこをつける', { size: fit(D, '分子はひとまとまり → かっこをつける', R.w, s * 1.05), col: C.lav, a: a });
    if (D.ph) eqs(D, CH.rect(R.x0, y + P.h * .9, R.x1, R.y1), [{ s: E1[2], lab: 'かっこをはずす' }, { s: E1[3], lab: '移項' }, { s: E1[4], col: C.yel }], k, { size: s * 1.4, at: [.75, .88], a: CH.smooth(.6, .68, k) });
  }

  /* ---- 例題：右辺の 1 にもかける ---- */
  var YA = mk('[3x−1/4]|−[x＋2/2]|＝|1', ['a', 'b', '=', 'c']), YB = nf(mk('3x−1|−2(x＋2)|＝|4', ['a', 'b', '=', 'c']));
  function ex2(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .04 }), s = CH.fs(D), y = R.y0 + R.h * .14, kk = D.ph ? CH.smooth(0, .38, k) : 0;
    var P = mul(D, R, y, YA, YB, kk, { lab: '×4', hl: function (id) { return id === 'c'; } });
    var a = D.ph ? CH.smooth(.38, .46, k) : 0;
    if (a > 0 && P.c) { rr(D, P.c.x - P.c.w / 2 - 4, y - P.h / 2 - 4, P.c.x + P.c.w / 2 + 4, y + P.h / 2 + 4, { stroke: C.pink, sw: 2.4, a: a, glow: true }); TX(D, P.c.x, y + P.h * 1.05, '1 にも ×4', { size: s * .9, col: C.pink, a: a }); }
    if (D.ph) eqs(D, CH.rect(R.x0, y + P.h * 1.5, R.x1, R.y1), [{ s: E2[2], lab: 'かっこをはずす' }, { s: E2[3], col: C.yel, lab: '移項してまとめる' }], k, { size: s * 1.4, at: [.82], a: CH.smooth(.62, .7, k) });
  }

  /* ---- 考えよう：式に 6 をかける・方程式の両辺に 6 をかける ---- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var r = a % b; a = b; b = r; } return a || 1; }
  function frs(n, d) { var g = gcd(n, d), sg = n < 0 ? '−' : ''; n = Math.abs(n) / g; d /= g; return d === 1 ? sg + n : sg + '[' + n + '/' + d + ']'; }
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .04, t: .06, b: .04 }), s = CH.fs(D), x = D.V.x, xs = x < 0 ? '(' + S(x) + ')' : String(x);
    var head = [['[x/2]＋1', C.blue], ['[x/3]', C.orange]], rows = [['もとの式', [frs(x + 2, 2), frs(x, 3)]], ['6 をかけた式', [S(3 * x + 6), S(2 * x)], ['3x＋6', '2x']]];
    var c0 = R.w * .3, cw = (R.w - c0) / 2, rh = Math.min(s * 3.2, R.h * .2), y0 = R.y0 + s * 2.4;
    TS(D, R.cx, R.y0 + s * .7, [['x＝', C.chalk], [S(x), C.yel], [' のときの値', C.chalk]], { size: s * 1.1 });
    head.forEach(function (h, j) { TX(D, R.x0 + c0 + cw * (j + .5), y0 + rh / 2, h[0], { size: s * 1.1, col: h[1] }); });
    rows.forEach(function (r, i) {
      var y = y0 + rh * (i + 1);
      TX(D, R.x0 + c0 - s * .5, y + rh / 2, r[0], { size: fit(D, r[0], c0 * .9, s * .95), align: 'right', col: 'rgba(242,240,230,.85)' });
      r[1].forEach(function (v, j) {
        var cx = R.x0 + c0 + cw * (j + .5);
        rr(D, cx - cw * .45, y + rh * .08, cx + cw * .45, y + rh * .92, { stroke: 'rgba(242,240,230,.4)', sw: 1.2 });
        if (r[2]) TX(D, cx, y + rh * .3, r[2][j], { size: s * .8, col: 'rgba(242,240,230,.7)' });
        TX(D, cx, y + rh * (r[2] ? .66 : .5), v, { size: s * 1.2, col: C.yel });
      });
    });
    var yn = y0 + rh * 3 + s * 1.2;
    TX(D, R.cx, yn, '式 [x/2]＋1 と 3x＋6、方程式 [x/2]＋1＝[x/3] の両辺', { size: fit(D, '式 [x/2]＋1 と 3x＋6、方程式 [x/2]＋1＝[x/3] の両辺', R.w, s * .9), col: 'rgba(242,240,230,.75)' });
  }

  /* ---- チャレンジ ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .04 }), s = CH.fs(D);
    eqs(D, R, [{ s: '① 3x＋5＝−7　→　x＝−4', txt: true }, { s: '② [x＋a/3]＝[x/4]＋2' }, { s: LC2[1], lab: 'x＝−4 を代入' }, { s: LC2[2] }, { s: LC2[3], lab: '両辺に 3 をかける' }, { s: LC2[4], col: C.yel }], D.ph ? k : 0, { size: s * 1.3, at: [.12, .3, .5, .68, .85] });
  }

  K3.run({
    no: '第5時', title: '分数のある方程式を、分母をはらって解こう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '04.html', label: '◀ 第4時' }, { href: '06.html', label: '第6時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: '分数のある方程式', q: '方程式 [1/2]x−2＝[1/3]x は、分数があって解きにくい。分数のない方程式に直して解くには、どうすればよいだろう。',
        notes: ['① 自分の考え（3分）　直し方と、解を書こう。', '② ペアの考え（3分）　自分とちがう直し方は？'],
        draw: function (D) { q1(D, 0); } },
      { tag: '今日の問い', q: '分数のない方程式にするには？ 解は？', a: '両辺に 6 をかける。x＝12', sub: '6 は 分母 2 と 3 の最小公倍数。3x−12＝2x → x＝12。確かめ 左辺 4、右辺 4', dur: 8,
        b: { t: '両辺に <b>6</b> をかける 3x−12＝2x → <b>x＝12</b>', col: C.yel },
        draw: function (D) { q1(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '両辺に分母の最小公倍数をかけて、分数のない式にすることを、何という？', a: '分母をはらう', sub: '分母が 2 と 3 なら 6、4 と 6 なら 12。両辺のすべての項にかける。分子が式のときは、かっこをつける', dur: 7,
        b: [{ t: '両辺に分母の<b>最小公倍数</b>をかける … <b>分母をはらう</b>', col: C.green }, { t: '<b>すべての項</b>にかける。分子が式なら <b>かっこ</b>をつける', col: C.green }],
        draw: function (D) { words(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　分母をはらって解く', q: '方程式 [x＋5/3]＝[x−1/2] を解こう。', a: 'x＝13', sub: '両辺に 6 をかけて 2(x＋5)＝3(x−1) → 2x＋10＝3x−3 → −x＝−13 → x＝13', dur: 8,
        b: { t: '両辺に 6 → 2(x＋5)＝3(x−1) → <b>x＝13</b>', col: C.pink },
        draw: function (D) { ex1(D, D.ph ? D.t : 0); } },
      { tag: '例題', q: '方程式 [3x−1/4]−[x＋2/2]＝1 を解こう。', a: 'x＝9', sub: '両辺に 4 をかけて 3x−1−2(x＋2)＝4。右辺の 1 にも 4 をかける → 3x−1−2x−4＝4 → x＝9', dur: 7,
        b: { t: '両辺に 4 → 3x−1−2(x＋2)＝<b>4</b> → <b>x＝9</b>', col: C.pink },
        draw: function (D) { ex2(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: '方程式 [x/2]＋1＝[x/3] は、両辺に 6 をかけて分母をはらえる。では、式 [x/2]＋1 だけに 6 をかけて 3x＋6 としてよいだろうか。x に数を入れて確かめよう。',
        notes: ['気づいたことを書こう。方程式のときは、なぜ分母をはらってよいのだろう。', 'スライダーで x の値を変えると、もとの式の値と、6 をかけた式の値をくらべられます。'],
        sliders: [{ key: 'x', label: 'x の値', min: -6, max: 12, step: 1, val: 4, fmt: function (v) { return 'x＝' + S(v); } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'x についての方程式 [x＋a/3]＝[x/4]＋2 の解が、方程式 3x＋5＝−7 の解と同じである。a の値を求めよう。',
        a: 'a＝7', sub: '3x＋5＝−7 より x＝−4。代入して [−4＋a/3]＝1 → −4＋a＝3 → a＝7', dur: 6,
        b: { t: 'x＝−4 を代入 → [−4＋a/3]＝1 → <b>a＝7</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
})();
