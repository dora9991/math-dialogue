/* 方程式 第4時：かっこや小数のある方程式を解こう（ikkan の lesson_hotei_04 と同じ流れ）。

(function () {

    if (s != null && s !== '') { var sz = Math.min(o.size || h * .52, w * .84 / Math.max(.01, TW(D, s, 100) / 100)); TX(D, 0, 1, s, { size: sz, col: o.tcol || C.chalk, a: o.a }); }

  /* 弧の矢印（x0 から x1 へ、上にふくらむ）。k：0〜1 ののび */
  function arcA(D, x0, x1, y, h, col, k) {
    k = CH.clamp(k, 0, 1); if (k <= 0) return; var g = D.ctx, mx = (x0 + x1) / 2, N = 24, m = Math.max(1, Math.round(N * k));
    function P(u) { return [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * mx + u * u * x1, (1 - u) * (1 - u) * y + 2 * (1 - u) * u * (y - h * 2) + u * u * y]; }
    g.save(); g.globalAlpha = D.ga; g.strokeStyle = col; g.lineWidth = 2.6; g.lineCap = 'round'; g.beginPath();
    for (var i = 0; i <= m; i++) { var p = P(i / N); if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); } g.stroke(); g.restore();
    if (k >= 1) { var q = P(.85); CH.arrow(D, q[0], q[1], x1, y, { col: col, w: 2.6, head: 9 }); }
  }
  /* 式の行 E（eqs の結果）の i 行目の左辺で、j 文字目のまん中 */
  function chx(D, E, left, j) { var x0 = E.ex - TW(D, left, E.z); return x0 + TW(D, left.slice(0, j), E.z) + TW(D, left.charAt(j), E.z) / 2; }
  /* かっこをはずす矢印：left の c 文字目（かっこの前の数）から、ts の文字へ */
  function dist(D, E, row, left, c, ts, k) {
    var y = E.ys[row] - E.z * .62, x0 = chx(D, E, left, c);
    ts.forEach(function (j, i) { var x1 = chx(D, E, left, j); arcA(D, x0, x1, y, E.z * (.42 + i * .3), i ? C.pink : C.yel, CH.smooth(i * .45, i * .45 + .55, k)); });
  }
  /* 小数の項のカードが、×10 で整数になる */
  function x10(D, R, y, A, B, k, o) {
    o = o || {}; var P = seq(D, R, y, [A, B], [[0, 1]], CH.smooth(.3, 1, k), { h: o.h });
    var a = CH.smooth(0, .25, k) * (1 - CH.smooth(.85, 1, k));
    if (a > 0) A.forEach(function (it) { if (it.op) return; var p = P[it.id]; if (!p) return; TX(D, p.x, p.y - P.h * .95, '×10', { size: P.h * .42, col: o.hl && o.hl(it.id) ? C.pink : C.yel, a: a, outline: OUT }); });
    return P;
  }

  /* ---- 今日の問い：ア かっこ、イ 小数 ---- */
  var QCA = mk('0.3x|＋1.2|＝|0.1x|−0.4', ['a', 'b', '=', 'c', 'd']), QCB = mk('3x|＋12|＝|x|−4', ['a', 'b', '=', 'c', 'd'], { a: { flip: false }, b: { flip: false }, c: { flip: false }, d: { flip: false } });
  function q1(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .03, b: .03 }), s = CH.fs(D), rs = CH.rows(R, 2, .08);
    TX(D, rs[0].x0, rs[0].y0 + s * .5, 'ア', { size: s * 1.1, col: C.lav, align: 'left' }); TX(D, rs[1].x0, rs[1].y0 + s * .5, 'イ', { size: s * 1.1, col: C.lav, align: 'left' });
    var ra = CH.rect(rs[0].x0 + s * 1.5, rs[0].y0, rs[0].x1, rs[0].y1), E = eqs(D, ra, [{ s: QA[0] }, { s: QA[1], lab: 'かっこをはずす' }, { s: QA[2], col: C.yel }], D.ph ? k : 0, { size: s * 1.4, at: [.3, .42] });
    if (D.ph) dist(D, E, 0, '2(x＋5)', 0, [2, 4], CH.smooth(.04, .28, k));
    else TX(D, E.x0 + E.w + s * 1.2, E.ys[0], '？', { size: s * 1.6, col: C.pink });
    var rb = CH.rect(rs[1].x0 + s * 1.5, rs[1].y0, rs[1].x1, rs[1].y1), y = rb.y0 + rb.h * .22, kb = D.ph ? CH.smooth(.5, .78, k) : 0;
    var P = x10(D, rb, y, QCA, QCB, kb, {});
    if (!D.ph) TX(D, rb.x1 - s * .6, y, '？', { size: s * 1.6, col: C.pink });
    if (D.ph) eqs(D, CH.rect(rb.x0, y + P.h * .7, rb.x1, rb.y1), [{ s: QB[2], lab: '移項してまとめる' }, { s: QB[3], col: C.yel }], k, { size: s * 1.3, at: [.9], a: CH.smooth(.8, .86, k) });
  }

  /* ---- ことば：分配法則と、数だけの項にも ×10 ---- */
  var KA = mk('0.2x|−1|＝|0.5x|＋2', ['a', 'b', '=', 'c', 'd']), KB = mk('2x|−10|＝|5x|＋20', ['a', 'b', '=', 'c', 'd'], { a: { flip: false }, b: { flip: false }, c: { flip: false }, d: { flip: false } });
  function words(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .08, b: .04 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .36);
    var E = eqs(D, top, [{ s: 'a(b＋c)＝ab＋ac' }], 1, { size: s * 1.7 });
    dist(D, E, 0, 'a(b＋c)', 0, [2, 4], D.ph ? CH.smooth(.02, .3, k) : 1);
    TX(D, R.cx, top.y1 + s * .2, '分配法則', { size: s, col: C.green });
    var y = R.y0 + R.h * .66, hl = function (id) { return id === 'b' || id === 'd'; };
    var P = x10(D, R, y, KA, KB, D.ph ? CH.smooth(.35, .8, k) : 0, { hl: hl });
    var a = D.ph ? CH.smooth(.82, .95, k) : 0;
    ['b', 'd'].forEach(function (id) { if (P[id] && a > 0) rr(D, P[id].x - P[id].w / 2 - 4, y - P.h / 2 - 4, P[id].x + P[id].w / 2 + 4, y + P.h / 2 + 4, { stroke: C.pink, sw: 2.4, a: a, glow: true }); });
    TX(D, R.cx, y + P.h * 1.2, '数だけの項にも 10 をかける', { size: fit(D, '数だけの項にも 10 をかける', R.w, s), col: C.pink, a: a });
  }

  /* ---- 例題（1）かっこ ---- */
  function ex1(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .04 }), s = CH.fs(D);
    var E = eqs(D, R, [{ s: E1[0] }, { s: E1[1], lab: 'かっこをはずす' }, { s: E1[2], lab: '移項' }, { s: E1[3] }, { s: E1[4], col: C.yel, lab: '係数 2 でわる' }], D.ph ? k : 0, { size: s * 1.5, at: [.3, .5, .66, .82] });
    if (D.ph) dist(D, E, 0, '3(x＋2)', 0, [2, 4], CH.smooth(.03, .27, k));
  }

  /* ---- 例題（2）小数 ---- */
  var XA = mk('0.2x|＋0.5|＝|0.4x|−1.1', ['a', 'b', '=', 'c', 'd']), XB = mk('2x|＋5|＝|4x|−11', ['a', 'b', '=', 'c', 'd'], { a: { flip: false }, b: { flip: false }, c: { flip: false }, d: { flip: false } });
  function ex2(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .04 }), s = CH.fs(D), y = R.y0 + R.h * .12;
    var P = x10(D, R, y, XA, XB, D.ph ? CH.smooth(0, .38, k) : 0, {});
    if (D.ph) eqs(D, CH.rect(R.x0, y + P.h * .9, R.x1, R.y1), [{ s: E2[1], lab: '両辺に 10 をかける' }, { s: E2[2], lab: '移項' }, { s: E2[3] }, { s: E2[4], col: C.yel, lab: '係数 −2 でわる' }], k, { size: s * 1.4, at: [.55, .7, .85], a: CH.smooth(.38, .44, k) });
  }

  /* ---- 考えよう：かっこをはずさずに、両辺を同じ数でわる ---- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var r = a % b; a = b; b = r; } return a || 1; }
  function frs(n, d) { var g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : '[' + n + '/' + d + ']'; }
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .05 }), s = CH.fs(D), e = TE[D.V.e], n = D.V.n;
    var cw = Math.min(R.w / 3.3, s * 9), ch = Math.min(s * 2.4, R.h * .14);
    TE.forEach(function (q, i) { var cx = R.cx + (i - 1) * (cw + s * .4); rr(D, cx - cw / 2, R.y0, cx + cw / 2, R.y0 + ch, { stroke: i === D.V.e ? C.yel : 'rgba(242,240,230,.4)', sw: i === D.V.e ? 2.6 : 1.4, fill: i === D.V.e ? 'rgba(255,226,122,.1)' : null }); TX(D, cx, R.y0 + ch / 2, q[0] + ' ' + q[1], { size: fit(D, q[0] + ' ' + q[1], cw * .88, s * .95), col: i === D.V.e ? C.yel : 'rgba(242,240,230,.75)' }); });
    var c = e[2], lc = c % n === 0 ? (c / n === 1 ? e[3] : (c / n) + '(' + e[3] + ')') : frs(c, n) + '(' + e[3] + ')';
    var rc = typeof e[4] === 'number' ? frs(e[4], n) : (n === 1 ? e[4] : '[' + e[4] + '/' + n + ']');
    var y = R.y0 + ch + R.h * .2, z = Math.min(s * 1.6, R.h * .1);
    TX(D, R.cx, y, e[1], { size: z });
    TS(D, R.cx, y + z * 1.7, [['両辺を ', C.chalk], [String(n), C.yel], [' でわると', C.chalk]], { size: s });
    TX(D, R.cx, y + z * 3.6, lc + '＝' + rc, { size: Math.min(z * 1.15, fit(D, lc + '＝' + rc, R.w * .9, z * 1.15)), col: C.yel });
  }

  /* ---- チャレンジ ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .06, b: .06 }), s = CH.fs(D);
    eqs(D, R, [{ s: LC[0] }, { s: LC[1], lab: 'x＝3 を代入' }, { s: LC[2] }, { s: LC[3], lab: '両辺に 10 をかける' }, { s: LC[4], col: C.yel }], D.ph ? k : 0, { size: s * 1.4, at: [.1, .35, .6, .82] });
  }

  K3.run({
    no: '第4時', title: 'かっこや小数のある方程式を解こう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '03.html', label: '◀ 第3時' }, { href: '05.html', label: '第5時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'ア かっこ　イ 小数', q: '次の2つの方程式は、これまでの方程式と、どこがちがうだろう。どうすれば、これまでのように解けるか考えよう。　ア 2(x＋5)＝x＋13　イ 0.3x＋1.2＝0.1x−0.4',
        notes: ['① 自分の考え（3分）　ちがうところと、直し方を書こう。', '② ペアの考え（3分）　自分とちがう考えは？'],
        draw: function (D) { q1(D, 0); } },
      { tag: '今日の問い', q: 'それぞれ、どう直せば これまでのように解ける？', a: 'ア かっこをはずす　イ 両辺に 10 をかけて、整数にする', sub: 'ア 2x＋10＝x＋13 → x＝3　イ 3x＋12＝x−4 → 2x＝−16 → x＝−8', dur: 9,
        b: [{ t: 'ア かっこをはずす 2x＋10＝x＋13 → <b>x＝3</b>', col: C.yel }, { t: 'イ 両辺に 10 をかける 3x＋12＝x−4 → <b>x＝−8</b>', col: C.yel }],
        draw: function (D) { q1(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: 'かっこは、何を使ってはずす？ 小数は、どうすれば整数になる？', a: '分配法則。両辺に 10 や 100 をかける', sub: 'かっこの前の数は、中のすべての項にかける。両辺にかけるときは、数だけの項にもかける（0.2x−1＝0.5x＋2 → 2x−10＝5x＋20）', dur: 7,
        b: [{ t: 'かっこ … <b>分配法則</b> a(b＋c)＝ab＋ac', col: C.green }, { t: '小数 … 両辺に 10 や 100 をかけて<b>整数</b>に（<b>すべての項</b>にかける）', col: C.green }],
        draw: function (D) { words(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　直してから解く', q: '（1）3(x＋2)＝x＋14 を解こう。', a: 'x＝4', sub: 'かっこをはずして 3x＋6＝x＋14 → 3x−x＝14−6 → 2x＝8 → x＝4', dur: 7,
        b: { t: '（1）かっこをはずす 3x＋6＝x＋14 → <b>x＝4</b>', col: C.pink },
        draw: function (D) { ex1(D, D.ph ? D.t : 0); } },
      { tag: '例題', q: '（2）0.2x＋0.5＝0.4x−1.1 を解こう。', a: 'x＝8', sub: '両辺に 10 をかけて 2x＋5＝4x−11 → 2x−4x＝−11−5 → −2x＝−16 → x＝8', dur: 7,
        b: { t: '（2）両辺に 10 をかける 2x＋5＝4x−11 → <b>x＝8</b>', col: C.pink },
        draw: function (D) { ex2(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: 'かっこをはずさずに、方程式 2(x＋3)＝14 を解く方法を考えよう。ア 2(x＋3)＝14　イ 3(x−1)＝12　ウ 4(x＋2)＝x＋17 は、その方法で解けるだろうか。',
        notes: ['解けるものは x の値も。○になる方程式の、特ちょうを書こう。', 'スライダーで、式と、両辺をわる数を変えられます。'],
        sliders: [{ key: 'e', label: '式', min: 0, max: 2, step: 1, val: 0, fmt: function (v) { return TE[v][0]; } }, { key: 'n', label: 'わる数', min: 1, max: 4, step: 1, val: 1, fmt: function (v) { return '÷' + v; } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'x についての方程式 0.1(x＋a)＝0.3x−0.2 の解が x＝3 のとき、a の値を求めよう。',
        a: 'a＝4', sub: 'x＝3 を代入すると 0.1(3＋a)＝0.7。両辺に 10 をかけて 3＋a＝7 → a＝4', dur: 6,
        b: { t: '0.1(3＋a)＝0.7 → 両辺に 10 をかけて 3＋a＝7 → <b>a＝4</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
})();
