<script src="../kukan/js/k3.js"></script>

<script>
/* 方程式 第1時：あてはまる数を、式を使ってさがそう（ikkan の lesson_hotei_01 と同じ流れ）。
   12本入りの箱と ばら5本の絵。x に 1、2、3、… を入れると、12x＋5 の帯が 12 ずつのびて、113 にぴったり重なる所（x＝9）が光る。
   左辺・右辺・両辺・解に、かっこがつく。例題は表に左辺の値がならび、右辺 10 と等しい列が光る。x＝4 を代入して左辺・右辺を別々に計算する。
   考えようは、x のスライダーで左辺と右辺の値をくらべる道具（答えは出さない）。チャレンジは、x＝3 を2つの式に代入して a をくらべる。
   数値は ikkan のまま。答えは、ページの中で計算し直している（CH.check。式の行はどれも同じ解をもつか、も確かめる）。データは自作。 */
(function () {
  /* ---- 道具（方程式の黒板 第1〜7時で共通。どのページにも同じものを入れてある） ---- */
  var C = CH.C, S = CH.mnum, XC = C.blue, NC = C.orange, OUT = 'rgba(20,40,30,.9)';
  var FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  function ha(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function ext(a, b) { for (var k in b) if (b[k] !== undefined) a[k] = b[k]; return a; }
  /* 問い・答え・板書（HTML）の [1/2] を、たての分数に。
     式のまとまり（12x＋5＝113 など）は、とちゅうで折り返さない */
  function nb(s) { return String(s).split(/(<[^>]+>)/).map(function (p) { return p.charAt(0) === '<' ? p : p.replace(/[0-9A-Za-z.＋−＝×÷()\[\]\/]{3,}/g, function (m) { return /[＋−＝×÷]/.test(m) ? '<span style="white-space:nowrap">' + m + '</span>' : m; }); }).join(''); }
  function hf(s) { return CH.fr(nb(s)); }
  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = hf(s[k]); }); if (s.notes) s.notes = s.notes.map(hf); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = hf(b.t); }); }); return st; }
  /* 図の中（canvas）の字。[x＋5/3] はたての分数。TW で幅、TX でかく */
  function parse(s) {
    var out = [], re = /\[([^\/\]]+)\/([^\]]+)\]/g, m, i = 0; s = String(s);
    while ((m = re.exec(s))) { if (m.index > i) out.push({ t: s.slice(i, m.index) }); out.push({ n: m[1], d: m[2] }); i = re.lastIndex; }
    if (i < s.length) out.push({ t: s.slice(i) });
    return out;
  }
  function mw(D, t, size) { var g = D.ctx; g.save(); g.font = '600 ' + size + 'px ' + FONT; var w = g.measureText(t).width; g.restore(); return w; }
  function segW(D, p, size) { var fz = size * .72; return p.t != null ? mw(D, p.t, size) : Math.max(mw(D, p.n, fz), mw(D, p.d, fz)) + fz * .4; }
  function TW(D, s, size) { return parse(s).reduce(function (w, p) { return w + segW(D, p, size); }, 0); }
  function hasFr(s) { return /\[[^\/\]]+\/[^\]]+\]/.test(String(s)); }
  function TX(D, x, y, s, o) {
    o = o || {}; var size = o.size || CH.fs(D), fz = size * .72, w = TW(D, s, size), x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, oo = { col: o.col, a: o.a, outline: o.outline };
    parse(s).forEach(function (p) {
      var pw = segW(D, p, size);
      if (p.t != null) CH.text(D, x0, y, p.t, ext({ size: size, align: 'left' }, oo));
      else {
        var cx = x0 + pw / 2; CH.text(D, cx, y - fz * .64, p.n, ext({ size: fz }, oo)); CH.text(D, cx, y + fz * .7, p.d, ext({ size: fz }, oo));
        CH.line(D, x0 + fz * .14, y + fz * .03, x0 + pw - fz * .14, y + fz * .03, { col: o.col || C.chalk, w: Math.max(1.3, size * .07), a: o.a });
      }
      x0 += pw;
    });
    return w;
  }
  /* 色ちがいの字をつなげて：segs [[字, 色], …] */
  function TS(D, x, y, segs, o) {
    o = o || {}; var size = o.size || CH.fs(D), w = segs.reduce(function (s, g) { return s + TW(D, g[0], size); }, 0), x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
    segs.forEach(function (g) { x0 += TX(D, x0, y, g[0], { size: size, col: g[1] || o.col, a: o.a, align: 'left', outline: o.outline }); });
    return w;
  }
  function fit(D, s, maxW, size) { var w = TW(D, s, size); return w > maxW ? size * maxW / w : size; }
  /* 角の丸い四角 */
  function rr(D, x0, y0, x1, y1, o) {
    o = o || {}; var g = D.ctx, r = Math.max(0, Math.min(o.r == null ? 8 : o.r, Math.abs(y1 - y0) / 2, Math.abs(x1 - x0) / 2));
    g.save(); g.globalAlpha = D.ga * (o.a == null ? 1 : o.a); g.beginPath();
    g.moveTo(x0 + r, y0); g.arcTo(x1, y0, x1, y1, r); g.arcTo(x1, y1, x0, y1, r); g.arcTo(x0, y1, x0, y0, r); g.arcTo(x0, y0, x1, y0, r); g.closePath();
    if (o.fill) { g.fillStyle = o.fill; g.fill(); }
    if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.sw || 2; if (o.dash) g.setLineDash([6, 5]); if (o.glow) { g.shadowColor = o.stroke; g.shadowBlur = 12; } g.stroke(); }
    g.restore();
  }
  /* 波かっこ（x0〜x1。dir 1 で下に、−1 で上に）。o.lab：字 */
  function brace(D, x0, x1, y, dir, o) {
    o = o || {}; var g = D.ctx, h = o.h || 7, m = (x0 + x1) / 2, r = Math.min(h, (x1 - x0) / 4), s = o.size || CH.fs(D, .85);
    g.save(); g.globalAlpha = D.ga * (o.a == null ? 1 : o.a); g.strokeStyle = o.col || C.chalk; g.lineWidth = o.w || 2; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
    g.moveTo(x0, y); g.quadraticCurveTo(x0, y + dir * h, x0 + r, y + dir * h); g.lineTo(m - r, y + dir * h); g.quadraticCurveTo(m, y + dir * h, m, y + dir * h * 2);
    g.moveTo(m, y + dir * h * 2); g.quadraticCurveTo(m, y + dir * h, m + r, y + dir * h); g.lineTo(x1 - r, y + dir * h); g.quadraticCurveTo(x1, y + dir * h, x1, y);
    g.stroke(); g.restore();
    if (o.lab) TX(D, m, y + dir * (h * 2 + s * (hasFr(o.lab) ? 1.3 : .85)), o.lab, { size: s, col: o.tcol || o.col || C.chalk, a: o.a });
  }

  /* ---- 式の値（検算用）。'5x＋3'・'[x＋5/3]'・'2(x−1)' を、x と a の関数に ---- */
  function fn(s) {
    var e = String(s).replace(/\[([^\/\]]+)\/([^\]]+)\]/g, '(($1)/($2))').replace(/＋/g, '+').replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/').replace(/\s/g, '')
      .replace(/(\d|\)|x|a)(?=[xa(])/g, '$1*').replace(/\)(?=[\d.])/g, ')*');
    return new Function('x', 'a', 'return (' + e + ');');
  }
  function near(a, b) { return Math.abs(a - b) < 1e-9; }
  /* 方程式 'L＝R' の解（1次式。3つの値から。1次でなければ NaN）。va が true なら a について解く（x＝v） */
  function root(s, v, va) {
    var p = String(s).split('＝'); if (p.length !== 2) return NaN;
    var L = fn(p[0]), R = fn(p[1]), f = function (t) { return va ? L(v, t) - R(v, t) : L(t, v) - R(t, v); };
    var d = f(1) - f(0); if (Math.abs(f(2) - f(1) - d) > 1e-9 || Math.abs(d) < 1e-12) return NaN;
    return -f(0) / d;
  }
  /* 式の行が、すべて同じ解 ans をもつか（解き方の各行を、まとめて確かめる） */
  function same(L, ans, v, va) { return L.every(function (s) { return near(root(s, v, va), ans); }); }
  function val(s, x, a) { return fn(s)(x, a); }

  /* ---- 項のカード ---- */
  /* 色：文字の項は青、数の項はオレンジ、かっこ・分数のまとまりはむらさき */
  function kcol(s) { s = String(s); return /[(\[]/.test(s) ? C.lav : /[xa]/.test(s) ? XC : NC; }
  function card(D, x, y, w, h, s, o) {
    o = o || {}; var g = D.ctx, sx = o.sx == null ? 1 : o.sx, col = o.col || kcol(s);
    if (Math.abs(sx) < .02 || (o.a != null && o.a <= 0)) return;
    g.save(); g.translate(x, y + (o.dy || 0)); g.scale(Math.abs(sx), 1);
    rr(D, -w / 2, -h / 2, w / 2, h / 2, { r: Math.min(w, h) * .18, fill: o.fill || ha(col, o.fa == null ? .2 : o.fa), stroke: col, sw: o.sw || 2.2, a: o.a, glow: o.glow });
    if (s != null && s !== '') { var sz = Math.min(o.size || h * .52, w * .84 / Math.max(.01, TW(D, s, 100) / 100)); TX(D, 0, 1, s, { size: sz, col: o.tcol || C.chalk, a: o.a }); }
    g.restore();
  }
  /* 式のカード：'5x|＋3|＝|2x|−9' と id の配列から。記号（＝ など）は op */
  function EQ(str, ids) { return str.split('|').map(function (s, i) { return { s: s, id: ids ? ids[i] : 'i' + i, op: /^[＝＋−×÷]$/.test(s) }; }); }
  function itW(D, it, h) { return it.op ? Math.max(h * .55, TW(D, it.s, h * .6) + h * .12) : Math.max(h * .95, TW(D, it.s, h * .52) + h * (hasFr(it.s) ? .4 : .5)); }
  function place(D, items, h, eqX) {
    var gap = h * .14, ws = items.map(function (it) { return itW(D, it, h); }), ie = -1, x = 0, P = {};
    items.forEach(function (it, i) { if (it.op && it.s === '＝') ie = i; });
    if (ie >= 0) { var lw = 0; for (var i = 0; i < ie; i++) lw += ws[i] + gap; x = eqX - ws[ie] / 2 - lw; }
    else x = eqX - (ws.reduce(function (a, b) { return a + b; }, 0) + gap * (items.length - 1)) / 2;
    var mn = x;
    items.forEach(function (it, i) { P[it.id] = { x: x + ws[i] / 2, w: ws[i], it: it }; x += ws[i] + gap; });
    return { P: P, x0: mn, x1: x - gap };
  }
  /* カードの式の動き：A から B へ（k：0→1）。同じ id のカードは動く。B の項に jump があると弧をえがいてとび、字がかわる項はひっくり返る。
     B の項の at:[t0, t1] で、動く時をずらせる。o：h（カードの高さ）、hl(id)→色（光らせる）、eqX */
  function morph(D, R, y, A, B, k, o) {
    o = o || {}; var h = o.h || CH.fs(D, 2.3);
    function span(hh) { var a = place(D, A, hh, 0), b = B ? place(D, B, hh, 0) : a; return [Math.min(a.x0, b.x0), Math.max(a.x1, b.x1)]; }
    var sp = span(h); if (sp[1] - sp[0] > R.w) { h *= R.w / (sp[1] - sp[0]); sp = span(h); }
    var eqX = o.eqX != null ? o.eqX : R.cx - (sp[0] + sp[1]) / 2, PA = place(D, A, h, eqX).P, PB = B ? place(D, B, h, eqX).P : PA, ids = [], out = {};
    A.forEach(function (it) { ids.push(it.id); }); (B || []).forEach(function (it) { if (!PA[it.id]) ids.push(it.id); });
    ids.forEach(function (id) {
      var pa = PA[id], pb = PB[id], it = (pb || pa).it, at = it.at || [0, 1], e = CH.ease(CH.smooth(at[0], at[1], k)), x, w, s, sx = 1, a = 1, dy = 0, glow = false;
      if (pa && pb) {
        x = CH.lerp(pa.x, pb.x, e); w = CH.lerp(pa.w, pb.w, e); s = e < .5 ? pa.it.s : pb.it.s;
        if (pb.it.jump) dy = -Math.sin(Math.PI * e) * h * 1.35;
        if (pa.it.s !== pb.it.s && pb.it.flip !== false) { sx = Math.cos(Math.PI * e); glow = e > .02 && e < .98; }
      } else if (pa) { x = pa.x; w = pa.w; s = pa.it.s; a = 1 - e; dy = pa.it.up ? -e * h : 0; }
      else { x = pb.x; w = pb.w; s = pb.it.s; a = e; }
      var hl = o.hl ? o.hl(id) : null;
      if (it.op) TX(D, x, y + dy, s, { size: h * .6, col: hl || C.chalk, a: a });
      else card(D, x, y, w, h, s, { sx: sx, a: a, dy: dy, glow: glow || !!hl, col: glow ? C.pink : (hl || null), fa: hl ? .32 : null });
      out[id] = { x: x, w: w, y: y + dy };
    });
    out.h = h; out.eqX = eqX;
    return out;
  }

  /* ---- 式の行（板書の形。'＝' をそろえる） ----
     L：[{s, lab, col, lc, txt}]（txt：'＝' でそろえない字の行）。t：0〜1 で、行が順に出る。o：at（各行の出る時）、size、align、top、mark {行: ['×', 色]} */
  function eqs(D, R, L, t, o) {
    o = o || {}; var n = L.length, at = o.at ? [-1].concat(o.at) : L.map(function (_, i) { return i === 0 ? -1 : .04 + (i - 1) / Math.max(1, n - 1) * .86; });
    var frc = L.some(function (l) { return hasFr(l.s); });
    function parts(l) { if (l.txt) return null; var i = l.s.indexOf('＝'); return i < 0 ? null : [l.s.slice(0, i), l.s.slice(i + 1)]; }
    function dims(z) {
      var lw = 0, rw = 0, xw = 0, eq = mw(D, '＝', z);
      L.forEach(function (l) { var p = parts(l), lb = l.lab ? TW(D, l.lab, z * .62) + z * .7 : 0, mk = o.mark && o.mark[L.indexOf(l)] ? z * 1.4 : 0; if (p) { lw = Math.max(lw, TW(D, p[0], z)); rw = Math.max(rw, TW(D, p[1], z) + lb + mk); } else xw = Math.max(xw, TW(D, l.s, z) + lb + mk); });
      return { lw: lw, rw: rw, eq: eq, w: Math.max(lw + eq + rw, xw) };
    }
    var z = o.size || CH.fs(D, 1.2), d = dims(z); if (d.w > R.w) { z *= R.w / d.w; d = dims(z); }
    var k = frc ? 2.25 : 1.6, lh = z * k; if (lh * n > R.h) { lh = R.h / n; z = Math.min(z, lh / k); d = dims(z); }
    var x0 = o.align === 'left' ? R.x0 : R.cx - d.w / 2, ex = x0 + d.lw, y0 = o.top ? R.y0 + lh / 2 : R.cy - lh * n / 2 + lh / 2, ys = [], xe = [];
    L.forEach(function (l, i) {
      var y = y0 + i * lh, a = at[i] < 0 ? 1 : CH.smooth(at[i], at[i] + .1, t), p = parts(l), col = l.col || C.chalk, x1; ys.push(y);
      if (a <= 0) { xe.push(null); return; } a *= (o.a == null ? 1 : o.a);
      if (p) { if (p[0]) TX(D, ex, y, p[0], { size: z, col: col, a: a, align: 'right' }); TX(D, ex, y, '＝', { size: z, col: col, a: a, align: 'left' }); x1 = ex + d.eq + TX(D, ex + d.eq, y, p[1], { size: z, col: col, a: a, align: 'left' }); }
      else x1 = x0 + TX(D, x0, y, l.s, { size: z, col: col, a: a, align: 'left' });
      if (o.mark && o.mark[i]) { var mk = o.mark[i]; TX(D, x1 + z * .7, y, mk[0], { size: z * 1.05, col: mk[1] || C.pink, a: a * (mk[2] == null ? 1 : mk[2]) }); x1 += z * 1.4; }
      if (l.lab) TX(D, x1 + z * .7, y, l.lab, { size: z * .62, col: l.lc || C.green, a: a, align: 'left' });
      xe.push(x1);
    });
    return { z: z, lh: lh, ys: ys, ex: ex, x0: x0, xe: xe, w: d.w };
  }
  /* ---- 数と検算 ---- */
  var X30 = []; for (var i = 0; i <= 30; i++) X30.push(i);
  CH.check(X30.filter(function (x) { return 12 * x + 5 === 113; }).join() === '9' && root('12x＋5＝113') === 9 && 12 * 8 + 5 === 101, '今日の問い（9箱）');
  var EX = [1, 2, 3, 4, 5].map(function (x) { return val('3x−2', x); });
  CH.check(EX.join() === '1,4,7,10,13' && [1, 2, 3, 4, 5].filter(function (x) { return val('3x−2', x) === 10; }).join() === '4', '例題（解は 4）');
  CH.check(val('5x−3', 4) === 17 && val('2x＋9', 4) === 17, '例題（x＝4 は解）');
  var TE = [['ア', '3x＋4＝19'], ['イ', '2x−5＝9'], ['ウ', '6x＋1＝25']];
  CH.check(TE.map(function (e) { return root(e[1]); }).join() === '5,7,4', '考えよう（ここで確かめるだけ）');
  var CA = ['2x＋a＝10', '2×3＋a＝10', '6＋a＝10', 'a＝4'], CB = ['3x−a＝5', '3×3−a＝5', '9−a＝5', 'a＝4'];
  CH.check(same(CA, 4, 3, true) && same(CB, 4, 3, true) && val('2x＋a', 3, 4) === 10 && val('3x−a', 3, 4) === 5, 'チャレンジ（a＝4）');

  /* ---- 今日の問い：12本入りの箱と、ばら5本 ---- */
  function bottle(D, x, yb, u, o) {
    o = o || {}; var w = u * .42, h = u * 1.25;
    rr(D, x - w / 2, yb - h * .78, x + w / 2, yb, { r: w * .3, fill: 'rgba(154,216,255,.28)', stroke: C.blue, sw: 1.6, a: o.a });
    CH.fillRect(D, x - w * .22, yb - h, x + w * .22, yb - h * .78, { fill: C.blue, a: o.a });
  }
  function crate(D, x, y, u, o) {
    o = o || {}; var w = u * 2.1, h = u * 1.5;
    rr(D, x - w / 2, y - h / 2, x + w / 2, y + h / 2, { r: 4, fill: o.q ? 'rgba(201,163,122,.1)' : 'rgba(201,163,122,.32)', stroke: '#d9b48a', sw: 2, dash: o.q, a: o.a });
    if (o.q) { TX(D, x, y, '？', { size: u * .9, col: C.yel, a: o.a }); return; }
    for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) CH.circle(D, x - w * .33 + c * w * .22, y - h * .27 + r * h * .27, u * .14, { fill: 'rgba(154,216,255,.8)', a: o.a });
    TX(D, x, y - h / 2 - u * .45, '12本', { size: u * .52, col: '#e9cfa9', a: o.a });
  }
  function pic(D) {
    var R = CH.box(D, { l: .03, r: .03, t: .1, b: .1 }), u = Math.min(R.w / 17.4, R.h / 4.6), y = R.cy - u * .3, x = R.cx - u * 7.6;
    [0, 1, 2].forEach(function (i) { crate(D, x + i * u * 2.35, y, u); });
    TX(D, x + u * 6.1, y, '…', { size: u * .8 });
    crate(D, x + u * 7.5, y, u, { q: true });
    brace(D, x - u * 1.05, x + u * 8.55, y + u * 1.05, 1, { h: u * .25, lab: '何箱？', size: u * .62, col: C.yel });
    TX(D, x + u * 9.35, y, '＋', { size: u * .9 });
    for (var j = 0; j < 5; j++) bottle(D, x + u * 10.1 + j * u * .55, y + u * .62, u);
    brace(D, x + u * 9.8, x + u * 12.5, y + u * 1.05, 1, { h: u * .25, lab: 'ばら 5本', size: u * .62, col: C.blue });
    TX(D, x + u * 13.35, y - u * .05, '＝', { size: u * .9 });
    TX(D, x + u * 13.85, y - u * .05, '113本', { size: u * .75, col: C.yel, align: 'left' });
  }

  /* ---- 今日の問い（答え）：x に 1、2、3、… を入れると、帯が 12 ずつのびる ---- */
