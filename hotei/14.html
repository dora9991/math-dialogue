/* 方程式 第14時：「方程式」で学んだことを、整理して確かめよう（ikkan の lesson_hotei_14 と同じ流れ）。
   今日の問い：x＝4 を解にもつ方程式をつくる。x＝4 から、両辺に同じ数をかける・ひくと 5x−6＝14 ができる（解くのと反対の向き）。ほかの式は、x＝4 を代入して ○。

   小数・分数・比例式の「はじめの一手」（10倍・15倍・外側の積＝内側の積）。
   考えようは、4x＋5＝x＋14 → 4x＝x＋9 → 3x＝9 → x＝3 の変わり方を、てんびんで（第2時と同じてんびん。使ったきまりは書かない）。
   チャレンジは、5x−a＝2x＋5 の解が 4(x−1)＝x＋8 の解の 2倍（a＝19）。
   数値は ikkan のまま。答えはページの中で計算し直している（CH.check。式の行が、どれも同じ解をもつかも確かめる）。 */
(function () {
  /* ======== 式を描く道具（文字と式の黒板 moji/ と同じ） ======== */

  /* 図の中の式。書き方：[分子/分母]（たての分数）・^2（指数）・{y|…}（色のまとまり。y 黄・p ピンク・b 青・g 緑・o だいだい・l むらさき・w 白）。
