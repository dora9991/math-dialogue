(function () {

    var g = D.ctx, mx = (x0 + x1) / 2, top = y - h;
    g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = col; g.lineWidth = 2.2; g.setLineDash([6, 5]); g.beginPath(); g.moveTo(x0, y); g.quadraticCurveTo(mx, top - h * .4, x1, y); g.stroke(); g.restore();
    CH.arrow(D, CH.lerp(mx, x1, .82), y - h * .32, x1, y, { col: col, w: 2.2, a: a, head: 9 });
    if (lab) TX(D, mx, top - h * .35, lab, { size: CH.fs(D, .85), col: col, a: a, outline: OUT });
  }

  /* ---- 今日の問い：Bさんの解き方 ---- */
  function bsan(D, k) {
    var R = CH.box(D, { l: .05, r: .05, t: .04, b: .04 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .58), bot = CH.rect(R.x0, R.y0 + R.h * .66, R.x1, R.y1);
    if (!D.ph) {
      TX(D, top.x0, top.y0 + s * .6, 'Bさんの解き方', { size: s * .9, align: 'left', col: 'rgba(242,240,230,.75)' });
      var E = eqs(D, CH.rect(top.x0, top.y0 + s * 1.4, top.x1, top.y1), [{ s: '2x{＋3}＝13', hc: C.pink }, { s: '2x＝13{−3}', hc: C.pink }, { s: '2x＝10' }, { s: 'x＝5' }], 1, { size: s * 1.5 });
      TX(D, E.x0 + E.w + s * 1.6, (E.ys[0] + E.ys[1]) / 2, '？', { size: s * 2, col: C.pink });
      morph(D, bot, bot.cy, mk('2x|＋3|＝|13', ['a', 'b', '=', 'c']), null, 0, {});
      return;
    }
    eqs(D, top, [{ s: LQ[0] }, { s: LQ[1], lab: '両辺から 3 をひく', hc: C.yel }, { s: '2x{＋3−3}＝13−3', hc: C.pink, lab: '＋3−3 は 0' }, { s: LQ[2], col: C.yel }], k, { size: s * 1.4, at: [.08, .26, .42] });
    var m = CH.smooth(.58, .9, k), A = mk('2x|＋3|＝|13', ['a', 'b', '=', 'c']), B = mk('2x|＝|13|−3', ['a', '=', 'c', 'b'], { b: { jump: true } });
    var P = morph(D, bot, bot.cy, A, B, m, {});
    TX(D, bot.cx, bot.y1 - s * .3, '符号を変えて、反対の辺へ', { size: s, col: C.yel, a: CH.smooth(.85, .97, k) });
    if (m <= 0) TX(D, bot.cx, bot.y1 - s * .3, '同じことを、カードで', { size: s * .9, col: 'rgba(242,240,230,.7)', a: CH.smooth(.5, .58, k) });
  }

  /* ---- ことば：3x−4＝x＋6 の移項 ---- */
  function iko(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .06, b: .04 }), s = CH.fs(D), y = R.y0 + R.h * .3;
    var A = mk('3x|−4|＝|x|＋6', ['a', 'b', '=', 'c', 'd']), M = mk('3x|＝|x|＋6|＋4', ['a', '=', 'c', 'd', 'b'], { b: { jump: true } }), B = mk('3x|−x|＝|6|＋4', ['a', 'c', '=', 'd', 'b'], { c: { jump: true }, d: { flip: false } });
    var P = seq(D, R, y, [A, M, B], [[.05, .38], [.47, .8]], D.ph ? k : 0, {});
    var a1 = D.ph ? CH.smooth(.02, .1, k) * (1 - CH.smooth(.35, .45, k)) : 0, a2 = D.ph ? CH.smooth(.42, .5, k) * (1 - CH.smooth(.78, .88, k)) : 0;
    if (a1 > 0) TX(D, R.cx, y - P.h * 2.3, '−4 → 右辺へ移すと ＋4', { size: fit(D, '−4 → 右辺へ移すと ＋4', R.w, s * 1.05), col: C.pink, a: a1 });
    if (a2 > 0) TX(D, R.cx, y - P.h * 2.3, '＋x → 左辺へ移すと −x', { size: fit(D, '＋x → 左辺へ移すと −x', R.w, s * 1.05), col: C.pink, a: a2 });
    if (!D.ph) TX(D, R.cx, y - P.h * 2.3, '文字の項は左辺に、数の項は右辺に', { size: fit(D, '文字の項は左辺に、数の項は右辺に', R.w, s * 1.05), col: 'rgba(242,240,230,.85)' });
    if (D.ph && k > .85) { TX(D, P.eqX - P.h * 1.6, y + P.h * 1.05, '文字の項', { size: s * .8, col: XC, a: CH.smooth(.85, .95, k) }); TX(D, P.eqX + P.h * 1.6, y + P.h * 1.05, '数の項', { size: s * .8, col: NC, a: CH.smooth(.85, .95, k) }); }
    eqs(D, CH.rect(R.x0, y + P.h * 1.8, R.x1, R.y1), [{ s: '2x＝10', lab: 'まとめて ax＝b に' }, { s: 'x＝5', lab: '係数 2 でわる', col: C.yel }], D.ph ? CH.smooth(.86, 1, k) : 0, { size: s * 1.3, at: [.5], a: D.ph ? CH.smooth(.86, .92, k) : 0 });
  }

  /* ---- 例題：5x＋3＝2x−9 ---- */
  function ex1(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .04 }), s = CH.fs(D), y = R.y0 + R.h * .14;
    var A = mk('5x|＋3|＝|2x|−9', ['a', 'b', '=', 'c', 'd']), M = mk('5x|＝|2x|−9|−3', ['a', '=', 'c', 'd', 'b'], { b: { jump: true } }), B = mk('5x|−2x|＝|−9|−3', ['a', 'c', '=', 'd', 'b'], { c: { jump: true } });
    var P = seq(D, R, y, [A, M, B], [[.02, .2], [.25, .43]], D.ph ? k : 0, {});
    eqs(D, CH.rect(R.x0, y + P.h * .9, R.x1, R.y1 - s * 2.6), [{ s: '5x−2x＝−9−3', lab: '移項' }, { s: '3x＝−12', lab: 'まとめる' }, { s: 'x＝−4', lab: '係数 3 でわる', col: C.yel }], D.ph ? k : 0, { size: s * 1.4, at: [.6, .75], a: D.ph ? CH.smooth(.44, .5, k) : 0 });
    var ck = '確かめ　左辺 5×(−4)＋3＝−17、右辺 2×(−4)−9＝−17';
    if (D.ph) TX(D, R.cx, R.y1 - s * 1, ck, { size: fit(D, ck, R.w, s), col: C.green, a: CH.smooth(.88, .97, k) });
  }

  /* ---- 例題：まちがい探し ---- */
  function ex2(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .05 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .42), m = D.ph ? CH.smooth(.06, .2, k) : 0;
    eqs(D, top, [{ s: '3x−4＝x＋10' }, { s: '3x{＋x}＝10{−4}', hc: C.pink }], 1, { size: s * 1.5, mark: m > 0 ? { 1: ['×', C.pink, m] } : null });
    if (!D.ph) return;
    var y = R.y0 + R.h * .58, A = mk('3x|−4|＝|x|＋10', ['a', 'b', '=', 'c', 'd']), M = mk('3x|＝|x|＋10|＋4', ['a', '=', 'c', 'd', 'b'], { b: { jump: true } }), B = mk('3x|−x|＝|10|＋4', ['a', 'c', '=', 'd', 'b'], { c: { jump: true }, d: { flip: false } });
    var P = seq(D, R, y, [A, M, B], [[.22, .42], [.46, .66]], k, {});
    TX(D, R.cx, y - P.h * 1.9, '符号を変えて移す', { size: s, col: C.yel, a: CH.smooth(.2, .28, k) });
    eqs(D, CH.rect(R.x0, y + P.h * .8, R.x1, R.y1), [{ s: '2x＝14' }, { s: 'x＝7', col: C.yel }], k, { size: s * 1.3, at: [.85], a: CH.smooth(.7, .78, k) });
  }

  /* ---- 考えよう：＋3・×3・÷3 を「移す」 ---- */
  function tool(D) {
    var R = CH.box(D, { l: .05, r: .05, t: .1, b: .05 }), s = CH.fs(D), e = TE[D.V.e], x = D.V.x, y = R.y0 + R.h * .32;
    var A = EQ(e[1], ['a', 'b', '=', 'c']), P = morph(D, R, y, A.concat([{ s: '？', id: 'q' }]), null, 0, { hl: function (id) { return id === 'b' ? C.pink : id === 'q' ? C.yel : null; } });
    var pb = P.b, pq = P.q; hop(D, pb.x, pq.x, y - P.h * .6, P.h * .9, C.pink, 1, '右辺へ移すと？');
    TX(D, R.cx, R.y0 + s * .2, e[0] + '　' + e[2].replace(/\[x\/3\]/, 'x÷3'), { size: s * 1.1, col: 'rgba(242,240,230,.85)' });
    var p = e[2].split('＝'), lv = val(p[0], x), rv = +p[1], ok = near(lv, rv), y2 = R.y0 + R.h * .72;
    var lt = e[0] === 'ア' ? x + '＋3' : e[0] === 'イ' ? '3×' + x : x + '÷3';
    TS(D, R.cx, y2, [['x＝', C.chalk], [String(x), C.yel], [' のとき　左辺 ' + lt + '＝' + (Math.round(lv * 100) / 100), C.chalk]], { size: fit(D, 'x＝10 のとき　左辺 10÷3＝3.33', R.w, s * 1.1) });
    TS(D, R.cx, y2 + s * 1.9, [['右辺 ' + rv + '　', C.chalk], [ok ? '等しい' : '等しくない', ok ? C.yel : C.pink]], { size: s * 1.1 });
  }

  /* ---- チャレンジ ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .04 }), s = CH.fs(D);
    eqs(D, R, [{ s: '① x＋4＝−2　→　x＝−6', txt: true }, { s: '② 2x−a＝5x＋6' }, { s: '2×(−6)−a＝5×(−6)＋6', lab: 'x＝−6 を代入' }, { s: '−12−a＝−24' }, { s: '−a＝−12', lab: '移項' }, { s: 'a＝12', col: C.yel }], D.ph ? k : 0, { size: s * 1.3, at: [.15, .3, .5, .68, .85] });
  }

  K3.run({
    no: '第3時', title: '移項を使って、方程式をすばやく解こう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '02.html', label: '◀ 第2時' }, { href: '04.html', label: '第4時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'Bさんの解き方', q: 'Bさんは、方程式 2x＋3＝13 を、2x＋3＝13 → 2x＝13−3 → 2x＝10 → x＝5 と解いた。左辺の ＋3 が、右辺では −3 になっている。このように書いてよいのは、なぜだろう。',
        notes: ['① 自分の考え（3分）　書いてよいわけを、等式の性質を使って書こう。', '② ペアの考え（3分）　自分とちがう説明は？'],
        draw: function (D) { bsan(D, 0); } },
      { tag: '今日の問い', q: '＋3 が −3 になって、右辺にうつってよいのは、なぜ？', a: '両辺から 3 をひいたのと同じだから', sub: '2x＋3−3＝13−3。左辺の ＋3−3 は 0 で消え、右辺に −3 があらわれる。＋3 が、符号を変えて右辺に移ったのと同じ', dur: 8,
        b: { t: '両辺から 3 をひく → 左辺の ＋3 が消え、右辺に <b>−3</b>', col: C.yel },
        draw: function (D) { bsan(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '等式の一方の辺の項を、符号を変えて他方の辺に移すことを、何という？', a: '移項', sub: '文字の項は左辺に、数の項は右辺に集めて ax＝b の形にし、両辺を x の係数 a でわる', dur: 8,
        b: [{ t: '符号を変えて、項を他方の辺に移す … <b>移項</b>', col: C.green }, { t: '文字の項は<b>左辺</b>、数の項は<b>右辺</b> → ax＝b → 係数 a でわる', col: C.green }],
        draw: function (D) { iko(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　移項を使って解く', q: '方程式 5x＋3＝2x−9 を、移項を使って解こう。', a: 'x＝−4', sub: '＋3 を右辺へ、2x を左辺へ移項して 5x−2x＝−9−3 → 3x＝−12 → x＝−4', dur: 9,
        b: { t: '5x−2x＝−9−3 → 3x＝−12 → <b>x＝−4</b>', col: C.pink },
        draw: function (D) { ex1(D, D.ph ? D.t : 0); } },
      { tag: '例題', q: '3x−4＝x＋10 を、ある人は 3x＋x＝10−4 と移項した。どこがまちがい？ 正しく解こう。', a: '移した項の符号を変えていない。x＝7', sub: '正しくは 3x−x＝10＋4 → 2x＝14 → x＝7。移した先で、符号が変わったか確かめる', dur: 7,
        b: { t: 'まちがい探し … 符号を変えて移す 3x−x＝10＋4 → <b>x＝7</b>', col: C.pink },
        draw: function (D) { ex2(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: 'ア x＋3＝10　イ 3x＝15　ウ [x/3]＝2 の左辺の「＋3」「×3」「÷3」を、右辺へ「移す」ように書くと、どんな式になるだろう。x＝□ の形にしよう。',
        notes: ['気づいたことを書こう。自分で方程式をつくって、同じことがいえるか確かめよう。', 'スライダーで、式と x の値を変えると、左辺と右辺の値をくらべられます。'],
        sliders: [{ key: 'e', label: '式', min: 0, max: 2, step: 1, val: 0, fmt: function (v) { return TE[v][0]; } }, { key: 'x', label: 'x の値', min: 0, max: 10, step: 1, val: 0, fmt: function (v) { return 'x＝' + v; } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'x についての方程式 2x−a＝5x＋6 の解が、方程式 x＋4＝−2 の解と同じである。a の値を求めよう。',
        a: 'a＝12', sub: 'x＋4＝−2 より x＝−6。2x−a＝5x＋6 に x＝−6 を代入して −12−a＝−24 → −a＝−12 → a＝12', dur: 6,
        b: { t: 'x＝−6 を代入 → −12−a＝−24 → <b>a＝12</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
})();
