/* 方程式 第10時：方程式の解は、いつも問題の答えになるだろうか（ikkan の lesson_hotei_10 と同じ流れ）。

   ことばは、人数・個数（0以上の整数）、長さ・時間（0より大きい数）、気温の変化（どんな数でも）を数直線で。
   例題は、プリンとゼリー（x＝5.2：代金を数直線にならべると、1250円は 5個と 6個のあいだ）。解が答えになるか、4つの問題に ○・✕ の印。
   考えようは、−2・3・4.5・7 を、りんごの個数・歩いた時間・気温の変化 にあてはめる図（○✕は出さない）。チャレンジは、パンとおにぎり（6.5個 と 7個）。
   数値は ikkan のまま。答えはページの中で計算し直している（CH.check）。 */
(function () {
