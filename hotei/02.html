    var f = Math.min(1, pw * .94 / Math.max(lay(lf, 1).W, lay(rt, 1).W, 1));
    /* 台と支点 */
    CH.poly(D, [[cx - s * 2.4, yb], [cx + s * 2.4, yb], [cx + s * 1.5, yb - s * .55], [cx - s * 1.5, yb - s * .55]], { fill: 'rgba(242,240,230,.1)', stroke: C.chalk, sw: 2 });
    CH.line(D, cx, yb - s * .55, cx, yP, { w: 4 });
    var nl = s * 1.5, sc = [-.3, -.15, 0, .15, .3];
    sc.forEach(function (q) { CH.line(D, cx + Math.sin(q) * nl * 1.1, yP - Math.cos(q) * nl * 1.1, cx + Math.sin(q) * nl * 1.3, yP - Math.cos(q) * nl * 1.3, { w: q ? 1.4 : 2.2, col: q ? 'rgba(242,240,230,.6)' : C.yel }); });
    CH.line(D, cx, yP, cx + Math.sin(th) * nl, yP - Math.cos(th) * nl, { w: 2.4, col: Math.abs(th) < .005 ? C.yel : C.pink });
    var ex = Math.cos(th) * Lb, ey = Math.sin(th) * Lb;
    CH.line(D, cx - ex, yP - ey, cx + ex, yP + ey, { w: 5 });
    CH.circle(D, cx, yP, s * .26, { fill: C.yel, stroke: 'rgba(20,30,24,.8)', sw: 1.2 });
    var out = {};
    [[-1, lf, 'L'], [1, rt, 'R']].forEach(function (p) {
      var bx = cx + p[0] * ex, by = yP + p[0] * ey, py = by - s * .85, L = p[1], g = lay(L, f), x = bx - g.W / 2;
      CH.line(D, bx, by, bx, py, { w: 3 });
      rr(D, bx - pw / 2, py - s * .1, bx + pw / 2, py + s * .22, { r: 4, fill: 'rgba(242,240,230,.35)', stroke: C.chalk, sw: 1.6 });
      g.slots.forEach(function (q) {
        q.items.forEach(function (i, j) {
          var it = L[i], a = it.a == null ? 1 : it.a, dy = it.dy || 0, hl = it.hl; if (a <= 0) return;
          if (it.k === 'x') { var h = g.bw * .9; rr(D, x, py - s * .1 - h + dy, x + q.w, py - s * .1 + dy, { r: 4, fill: ha(hl || XC, .3), stroke: hl || XC, sw: 2, a: a, glow: !!hl }); TX(D, x + q.w / 2, py - s * .1 - h / 2 + dy, it.lab || 'x', { size: g.bw * .5, a: a, col: hl || C.chalk }); }
          else if (it.k === 'u') { var u = g.u, yy = py - s * .1 - (j + 1) * u * 1.04 + dy; rr(D, x, yy, x + u, yy + u * .96, { r: 2, fill: ha(hl || NC, .55), stroke: hl || NC, sw: 1.2, a: a, glow: !!hl }); }
          else { var wh = g.bw * .78, c = hl || it.col || NC, y0 = py - s * .1 + dy; CH.poly(D, [[x, y0], [x + q.w, y0], [x + q.w * .88, y0 - wh], [x + q.w * .12, y0 - wh]], { fill: ha(c, .3), stroke: c, sw: 2, a: a }); TX(D, x + q.w / 2, y0 - wh / 2, it.lab, { size: g.bw * .46, a: a, col: hl || C.chalk }); }
        });
        x += q.w + g.gap;
      });
      out[p[2]] = { x: bx, y: py, w: pw };
    });
    out.s = s; out.th = th;
    return out;
  }
  function items(nx, nu) { var L = [], i; for (i = 0; i < nx; i++) L.push({ k: 'x' }); for (i = 0; i < nu; i++) L.push({ k: 'u' }); return L; }
  function off(it, k, hold) { it.a = 1 - CH.smooth(.15, 1, k) * (hold == null ? 1 : 1 - hold); it.dy = -CH.ease(k) * 60; return it; }
  function legend(D, R, s, xg) {
    var y = R.y1 - s * 1.5, u = s * .6;
    rr(D, R.x0, y - u / 2, R.x0 + u, y + u / 2, { r: 2, fill: ha(NC, .55), stroke: NC, sw: 1.2 });
    TX(D, R.x0 + u * 1.5, y, '1 g の分銅', { size: s * .62, align: 'left', col: 'rgba(242,240,230,.85)' });
    rr(D, R.x0, y + s * .9 - u / 2, R.x0 + u, y + s * .9 + u / 2, { r: 2, fill: ha(XC, .3), stroke: XC, sw: 1.2 });
    TX(D, R.x0 + u * 1.5, y + s * .9, '箱 1個 … ' + (xg ? xg + ' g' : 'x g'), { size: s * .62, align: 'left', col: 'rgba(242,240,230,.85)' });
  }

  /* ---- 今日の問い：2x＋4＝16 ---- */
  function q1(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .03, b: .04 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .62);
    var a1 = CH.smooth(.04, .22, k), a2 = CH.smooth(.3, .48, k), a3 = CH.smooth(.6, .78, k);
    var lf = items(2, 4), rt = items(0, 16);
    if (k > 0) { for (var i = 2; i < 6; i++) off(lf[i], a1); for (var j = 12; j < 16; j++) off(rt[j], a2); }
    if (a3 > 0) { lf[1].a = 1 - .78 * a3; for (var m = 6; m < 12; m++) rt[m].a = 1 - .78 * a3; lf[0].hl = C.yel; }
    bal(D, top, lf, rt, { xg: 6 });
    legend(D, top, s, a3 >= 1 ? 6 : 0);
    if (!D.ph) { return; }
    var tilt = a1 > .3 && a2 < .7;
    if (tilt) TX(D, R.cx, top.y0 + s * .6, '左の皿からだけ取ると、かたむく！', { size: fit(D, '左の皿からだけ取ると、かたむく！', R.w * .6, s), col: C.pink, a: CH.smooth(.3, .45, a1) * (1 - CH.smooth(.5, .7, a2)) });
    eqs(D, CH.rect(R.x0, R.y0 + R.h * .66, R.x1, R.y1), [{ s: LQ[0] }, { s: LQ[1], lab: '両方から 4 g ずつ取る' }, { s: LQ[2], lab: '両方を 2つに分ける', col: C.yel }], k, { at: [.42, .76], size: s * 1.25 });
  }

  /* ---- ことば：等式の性質（小さなてんびん4つ） ---- */
  var PROP = [['① 同じものを のせる', 'A{＋C}＝B{＋C}'], ['② 同じものを 取る', 'A{−C}＝B{−C}'], ['③ 2倍にする', 'A{×2}＝B{×2}'], ['④ 半分にする', '{[A/2]}＝{[B/2]}']];
  function props(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .02, b: .02 }), s = CH.fs(D), g = CH.rows(R, 2, .06).map(function (r) { return CH.cols(r, 2, .06); });
    PROP.forEach(function (p, i) {
      var r = g[i >> 1][i & 1], u = D.ph ? CH.ease(CH.smooth(.06 + i * .22, .2 + i * .22, k)) : 0, sz = Math.min(s * .85, r.h * .1);
      rr(D, r.x0, r.y0, r.x1, r.y1, { stroke: 'rgba(242,240,230,.3)', sw: 1.2 });
      TX(D, r.x0 + sz * .5, r.y0 + sz * .9, p[0], { size: fit(D, p[0], r.w * .9, sz), align: 'left', col: C.green });
      var A = { k: 'w', lab: 'A', col: XC }, Bw = { k: 'w', lab: 'B', col: XC }, lf, rt;
      if (i === 0) { lf = [A, { k: 'w', lab: 'C', a: u, dy: -(1 - u) * 40 }]; rt = [Bw, { k: 'w', lab: 'C', a: u, dy: -(1 - u) * 40 }]; }
      else if (i === 1) { lf = [A, off({ k: 'w', lab: 'C' }, u)]; rt = [Bw, off({ k: 'w', lab: 'C' }, u)]; }
      else if (i === 2) { lf = [A, { k: 'w', lab: 'A', col: XC, a: u }]; rt = [Bw, { k: 'w', lab: 'B', col: XC, a: u }]; }
      else { lf = [A, off({ k: 'w', lab: 'A', col: XC }, u)]; rt = [Bw, off({ k: 'w', lab: 'B', col: XC }, u)]; }
      var br = CH.rect(r.x0 + r.w * .04, r.y0 + sz * 1.8, r.x1 - r.w * .04, r.y1 - sz * 3); bal(D, br, lf, rt, { tilt: 0, s: Math.min(br.w / 13, br.h / 6) });
      TM(D, r.cx, r.y1 - sz * 1.2, u > .5 ? p[1] : 'A＝B', { size: Math.min(sz * 1.25, r.h * .1), col: C.chalk, hc: C.yel });
    });
  }

  /* ---- 例題：両辺に同じ数を ---- */
  function ex(D, k, A, B, la, lb) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .04 }), s = CH.fs(D), rs = CH.rows(R, 2, .08);
    [[rs[0], A, la, 0], [rs[1], B, lb, .5]].forEach(function (p) {
      var r = p[0], t = D.ph ? CH.smooth(p[3], p[3] + .45, k) : 0;
      rr(D, r.x0, r.y0, r.x1, r.y1, { stroke: 'rgba(242,240,230,.3)', sw: 1.2 });
      eqs(D, CH.rect(r.x0 + s * .5, r.y0 + s * .4, r.x1 - s * .5, r.y1 - s * .4), [{ s: p[1][0] }, { s: p[1][1], lab: p[2], hc: C.yel }, { s: p[1][2], col: C.yel }], t, { size: s * 1.6, at: [.1, .6] });
    });
  }

  /* ---- 例題：図2（箱が両方の皿に） ---- */
  function fig2(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .03, b: .04 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .62);
    var a1 = CH.smooth(.05, .32, k), a2 = CH.smooth(.42, .7, k);
    var lf = items(2, 5), rt = items(1, 13);
    if (k > 0) { off(lf[1], a1); off(rt[0], a1); for (var i = 2; i < 7; i++) off(lf[i], a2); for (var j = 9; j < 14; j++) off(rt[j], a2); }
    if (k > .75) lf[0].hl = C.yel;
    bal(D, top, lf, rt, { xg: 8 });
    legend(D, top, s, k >= .8 ? 8 : 0);
    if (!D.ph) { return; }
    eqs(D, CH.rect(R.x0, R.y0 + R.h * .66, R.x1, R.y1), [{ s: LF[0] }, { s: LF[1], lab: '両方から 箱を1個ずつ取る' }, { s: LF[2], lab: '両方から 5 g ずつ取る', col: C.yel }], k, { at: [.3, .68], size: s * 1.25 });
  }

  /* ---- 考えよう：両辺に 0 をかけると？ ---- */
  function zero(D) {
    var R = CH.box(D, { l: .05, r: .05, t: .06, b: .05 }), s = CH.fs(D), c = D.V.c, x = D.V.x, lv = 3 * x * c, rv = 12 * c, ok = lv === rv, z = Math.min(s * 1.5, R.h * .1);
    TX(D, R.cx, R.y0 + z * .6, '3x＝12', { size: z * 1.2 });
    TS(D, R.cx, R.y0 + z * 2.1, [['両辺に ', C.chalk], [String(c), C.yel], [' をかけると', C.chalk]], { size: s });
    TS(D, R.cx, R.y0 + z * 3.4, [['3x×', C.chalk], [String(c), C.yel], ['＝12×', C.chalk], [String(c), C.yel]], { size: z });
    var y = R.y0 + R.h * .55, w = Math.min(R.w * .44, s * 12), h = Math.min(s * 4.2, R.h * .3);
    [[R.cx - w / 2 - s * .4, '左辺 3x×' + c, '3×' + (x < 0 ? '(' + S(x) + ')' : x) + '×' + c + '＝' + S(lv), C.blue], [R.cx + w / 2 + s * .4, '右辺 12×' + c, '12×' + c + '＝' + S(rv), C.orange]].forEach(function (p) {
      rr(D, p[0] - w / 2, y - h / 2, p[0] + w / 2, y + h / 2, { stroke: ok ? C.yel : p[3], sw: ok ? 2.6 : 1.6, fill: ha(p[3], .07) });
      TX(D, p[0], y - h * .22, p[1], { size: fit(D, p[1], w * .9, s * .9), col: p[3] });
      TX(D, p[0], y + h * .2, p[2], { size: fit(D, p[2], w * .9, s * 1.1), col: ok ? C.yel : C.chalk });
    });
    TS(D, R.cx, R.y1 - s * 1.2, [['x＝', C.chalk], [S(x), C.yel], [' のとき　', C.chalk], [ok ? '等しい' : '等しくない', ok ? C.yel : C.pink]], { size: s * 1.15 });
  }

  /* ---- チャレンジ：4x＋5＝x＋35 ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .03, b: .03 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .54);
    var a1 = CH.smooth(.04, .2, k), a2 = CH.smooth(.26, .42, k), a3 = CH.smooth(.5, .62, k);
    var lf = items(4, 5), rt = items(1, 35);
    if (k > 0) { off(lf[3], a1); off(rt[0], a1); for (var i = 4; i < 9; i++) off(lf[i], a2); for (var j = 31; j < 36; j++) off(rt[j], a2); }
    if (a3 > 0) { lf[1].a = lf[2].a = 1 - .78 * a3; for (var m = 11; m < 31; m++) rt[m].a = 1 - .78 * a3; lf[0].hl = C.yel; }
    bal(D, top, lf, rt, { xg: 10, ch: 5 });
    legend(D, top, s, a3 >= 1 ? 10 : 0);
    if (!D.ph) { return; }
    eqs(D, CH.rect(R.x0, R.y0 + R.h * .58, R.x1, R.y1), [{ s: LC[0] }, { s: LC[1], lab: '両方から 箱を1個' }, { s: LC[2], lab: '両方から 5 g' }, { s: LC[3], lab: '3つに分ける', col: C.yel },
      { s: '② 5×10＋1＝51、51−2×10＝31 → 31 g', txt: true, col: C.yel }], k, { at: [.18, .4, .6, .8], size: s * 1.15 });
  }

  K3.run({
    no: '第2時', title: 'てんびんのつり合いから、方程式の解き方を考えよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '01.html', label: '◀ 第1時' }, { href: '03.html', label: '第3時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'てんびん（箱1個 x g）', q: '同じ重さの箱 2個と 4 g の分銅を左の皿に、16 g の分銅を右の皿にのせたら、つり合った。つり合いをくずさずに 箱1個の重さ x g を求めるには、皿の上のものを どう動かせばよいだろう。',
        notes: ['① 自分の考え（3分）　皿の上の動かし方を、式と結びつけて書こう。', '② ペアの考え（3分）　自分とちがう動かし方は？'],
        draw: function (D) { q1(D, 0); } },
      { tag: '今日の問い', q: 'どう動かすと、x が求められる？', a: '両方の皿から 4 g ずつ取り、両方を 2つに分ける。x＝6', sub: '2x＋4＝16 → 2x＝12 → x＝6。片方の皿からだけ取ると、つり合いがくずれる', dur: 8,
        b: { t: '両方から 4 g 取る → 両方を 2つに分ける → <b>x＝6</b>（6 g）', col: C.yel },
        draw: function (D) { q1(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: 'つり合いをくずさない動かし方は、等式でいうと？（A＝B ならば …）', a: '等式の性質', sub: '① 両辺に同じ数をたす ② 両辺から同じ数をひく ③ 両辺に同じ数をかける ④ 両辺を 0 でない同じ数でわる。どれも、等式は成り立つ', dur: 7,
        b: [{ t: '<b>等式の性質</b>　A＝B ならば', col: C.green }, { t: '① A＋C＝B＋C　② A−C＝B−C', col: C.green }, { t: '③ AC＝BC　④ [A/C]＝[B/C]（C は 0 でない）', col: C.green }],
        draw: function (D) { props(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　等式の性質で解く', q: '方程式を解こう。両辺に何をする？　（1）x−6＝4　（2）x＋7＝2', a: '（1）x＝10　（2）x＝−5', sub: 'x に何がされているかを見て、その反対のことを両辺にする。（1）両辺に 6 をたす　（2）両辺から 7 をひく', dur: 6,
        b: { t: '（1）両辺に 6 をたす <b>x＝10</b>　（2）両辺から 7 をひく <b>x＝−5</b>', col: C.pink },
        draw: function (D) { ex(D, D.ph ? D.t : 0, E1, E2, '両辺に 6 をたす', '両辺から 7 をひく'); } },
      { tag: '例題', q: '（3）[x/3]＝−2　（4）5x＝−20', a: '（3）x＝−6　（4）x＝−4', sub: '（3）両辺に 3 をかける　（4）両辺を 5 でわる', dur: 6,
        b: { t: '（3）両辺に 3 をかける <b>x＝−6</b>　（4）両辺を 5 でわる <b>x＝−4</b>', col: C.pink },
        draw: function (D) { ex(D, D.ph ? D.t : 0, E3, E4, '両辺に 3 をかける', '両辺を 5 でわる'); } },
      { tag: '例題', q: '箱が両方の皿にある（左 箱2個と 5 g、右 箱1個と 13 g）。箱1個の重さを求めよう。', a: '8 g', sub: '2x＋5＝x＋13。両方から箱を1個ずつ取って x＋5＝13、両方から 5 g ずつ取って x＝8', dur: 7,
        b: { t: '2x＋5＝x＋13 → 両方から箱1個 → 5 g → <b>x＝8</b>', col: C.pink },
        draw: function (D) { fig2(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: '等式の性質④には「0 でない数でわる」とことわりがある。そのわけを考えよう。3x＝12 の両辺に 0 をかけた 3x×0＝12×0 は、x＝4、10、−7 のとき成り立つだろうか。',
        notes: ['気づいたことを書こう。0 でわることは、できるだろうか。', 'スライダーで、両辺にかける数と x の値を変えて、左辺と右辺をくらべられます。'],
        sliders: [{ key: 'c', label: 'かける数', min: 0, max: 3, step: 1, val: 1, fmt: function (v) { return '×' + v; } }, { key: 'x', label: 'x の値', min: -10, max: 10, step: 1, val: 4, fmt: function (v) { return 'x＝' + S(v); } }],
        draw: zero },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '左の皿に箱4個と 5 g、右の皿に箱1個と 35 g の分銅をのせると、つり合う。① 箱1個の重さは？ ② 箱5個と 1 g の分銅は、箱2個と何 g の分銅とつり合う？',
        a: '① 10 g　② 31 g', sub: '① 4x＋5＝x＋35 → 3x＝30 → x＝10　② 箱5個と 1 g は 51 g。箱2個は 20 g だから 51−20＝31', dur: 9,
        b: { t: '① 4x＋5＝x＋35 → 3x＝30 → <b>x＝10</b>　② 51−20＝<b>31 g</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
})();
