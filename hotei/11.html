<script>
/* 方程式 第11時：比が等しいことを式に表して、x の値を求めよう（ikkan の lesson_hotei_11 と同じ流れ）。

   例題は、x：10＝3：5 と (x＋1)：4＝5：2（式の項は かっこをつけたまま かける）。
   考えようは、ad＝bc になるわけ（2本の帯と、a×d・b×c の長方形。どちらも a×b の長方形が k こ。答えは出さない）。チャレンジは a：b＝3：4・a＋b＝42。
   数値は ikkan のまま。答えはページの中で計算し直している（CH.check）。 */
(function () {
  /* ======== 式を描く道具（文字と式の黒板 moji/ と同じ） ======== */

  /* 右の板書・問い（HTML）：[1/2] はたての分数、^2 は上つき、{y|…} は色 */
