/* 方程式 第6時：方程式リレーで、解き方をつなごう（ikkan の lesson_hotei_06 と同じ流れ）。

(function () {
  /* ---- 道具（方程式の黒板 第1〜7時で共通。どのページにも同じものを入れてある） ---- */

  var PC = [C.blue, C.green, C.orange, C.pink];
