/* 方程式 第7時：わからない数量を x として、問題を解決しよう（ikkan の lesson_hotei_07 と同じ流れ）。

   考えようは、x をケーキにするかドーナツにするかを切りかえる表と、ケーキの個数で代金を確かめる道具（答えは出さない）。
   数値は ikkan のまま。答えは、ページの中で計算し直している（CH.check。式の行はどれも同じ解をもつか、も確かめる）。データは自作。 */
(function () {
  /* ---- 道具（方程式の黒板 第1〜7時で共通。どのページにも同じものを入れてある） ---- */

  /* ---- 式の値（検算用）。'5x＋3'・'[x＋5/3]'・'2(x−1)' を、x と a の関数に ---- */

  function root(s, v, va) {

  /* ---- 項のカード ---- */
  /* 色：文字の項は青、数の項はオレンジ、かっこ・分数のまとまりはむらさき */
  function kcol(s) { s = String(s); return /[(\[]/.test(s) ? C.lav : /[xa]/.test(s) ? XC : NC; }
  function card(D, x, y, w, h, s, o) {
    o = o || {}; var g = D.ctx, sx = o.sx == null ? 1 : o.sx, col = o.col || kcol(s);
    if (Math.abs(sx) < .02 || (o.a != null && o.a <= 0)) return;
    g.save(); g.translate(x, y + (o.dy || 0)); g.scale(Math.abs(sx), 1);
    rr(D, -w / 2, -h / 2, w / 2, h / 2, { r: Math.min(w, h) * .18, fill: o.fill || ha(col, o.fa == null ? .2 : o.fa), stroke: col, sw: o.sw || 2.2, a: o.a, glow: o.glow });
    if (s != null && s !== '') { var sz = Math.min(hasFr(s) ? h * .58 : (o.size || h * .52), w * .84 / Math.max(.01, TW(D, s, 100) / 100)); TX(D, 0, 1, s, { size: sz, col: o.tcol || C.chalk, a: o.a }); }

  /* 式のカード：'5x|＋3|＝|2x|−9' と id の配列から。記号（＝ など）は op */
  function EQ(str, ids) { return str.split('|').map(function (s, i) { return { s: s, id: ids ? ids[i] : 'i' + i, op: /^[＝＋−×÷]$/.test(s) }; }); }

  /* いくつかの段階を、順に動かす（1回に1つずつ動かすと、カードが重ならない）。Ls：[A, M, B, …]、ts：[[t0, t1], …] 段階のあいだの動きの時。

    TX(D, x0 - s * .3, y + h / 2, '袋 60', { size: fit(D, '袋 60', s * 2.2, s * .75), col: NC, align: 'right' });
    var n = D.ph ? Math.min(12, Math.floor(CH.smooth(.05, .5, k) * 12.999)) : 4;
    for (var i = 0; i < n; i++) { var bx = x0 + (60 + 140 * i) * U; CH.fillRect(D, bx, y, bx + 140 * U, y + h, { fill: ha(XC, .35), stroke: XC }); TX(D, bx + 70 * U, y + h / 2, '140', { size: Math.min(s * .75, 140 * U * .42) }); }
    if (!D.ph) { TX(D, x0 + (60 + 140 * 4) * U + s * 1.5, y + h / 2, '…', { size: s * 1.2 }); TX(D, x0 + w * .72, y + h / 2, '140円が 何個？', { size: fit(D, '140円が 何個？', w * .4, s), col: C.yel }); return; }
    if (n > 0) brace(D, x0 + 60 * U, x0 + (60 + 140 * n) * U, y + h + s * .3, 1, { h: s * .4, lab: n === 12 ? '140x 円（x＝12）' : '140×' + n + '＝' + 140 * n, col: XC, size: s * .85 });
    if (n === 12) CH.fillRect(D, x0, y, x0 + w, y + h, { stroke: C.yel, sw: 3, a: CH.smooth(.5, .56, k) });
    var a = CH.smooth(.5, .58, k);
    TX(D, R.cx, R.y0 + R.h * .5, '（お菓子の代金）＋（袋の代金）＝（代金の合計）', { size: fit(D, '（お菓子の代金）＋（袋の代金）＝（代金の合計）', R.w, s), col: C.green, a: a });
    eqs(D, CH.rect(R.x0, R.y0 + R.h * .57, R.x1, R.y1), [{ s: LQ[0] }, { s: LQ[2], lab: '移項' }, { s: LQ[3], col: C.yel }, { s: '確かめ　140×12＋60＝1740 → 12個', txt: true, col: C.green }], k, { size: s * 1.3, at: [.72, .82, .92], a: CH.smooth(.6, .66, k) });
  }

  /* ---- ことば：問題を解く手順 ---- */
  var STEPS = [['① 何を x とするか 決める', 'お菓子の個数を x 個'], ['② 等しい関係を見つけて、方程式に', '140x＋60＝1740'], ['③ 方程式を 解く', 'x＝12'], ['④ 解が問題に 合っているか 確かめる', '12個は 個数として正しい。代金 1740円 ○']];
  function flow(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .03, b: .03 }), s = CH.fs(D), n = 4, rh = R.h / n;
    STEPS.forEach(function (st, i) {
      var y0 = R.y0 + rh * i, bh = rh * .84, a = D.ph ? CH.smooth(.05 + i * .22, .17 + i * .22, k) : 0, z = Math.min(s, bh * .3);
      rr(D, R.x0, y0, R.x1, y0 + bh, { stroke: C.green, sw: 1.6, fill: 'rgba(169,240,176,.05)' });
      TX(D, R.x0 + z * .6, y0 + bh * .3, st[0], { size: fit(D, st[0], R.w * .94, z), col: C.green, align: 'left' });
      if (a > 0) TX(D, R.cx, y0 + bh * .7, st[1], { size: fit(D, st[1], R.w * .9, z * 1.15), col: i === 2 ? C.yel : C.chalk, a: a });
      if (i < n - 1) CH.arrow(D, R.x0 + s, y0 + bh, R.x0 + s, y0 + rh, { col: C.green, w: 1.6, head: 6 });
    });
  }

  /* ---- 例題：えんぴつとペン（表に整理） ---- */
  function pens(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .03, b: .03 }), s = CH.fs(D), T = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .42);
    var show = { '2,1': [.02, .1], '2,2': [.12, .2], '3,1': [.24, .32], '3,2': [.34, .42] };
    CH.table(D, T, ['', 'えんぴつ', 'ペン', '合計'], [['1本のねだん（円）', 80, 130, '—'], ['本数（本）', 'x', '12−x', 12], ['代金（円）', '80x', '130(12−x)', 1160]], {
      fw: .3, size: Math.min(s * 1.05, T.w / 15), top: true,
      show: function (r, c) { var q = show[r + ',' + c]; return q ? (D.ph ? CH.smooth(q[0], q[1], k) : 0) : 1; },
      hl: function (r, c) { return D.ph && k > .42 && k < .62 && r === 3 ? C.yel : (r === 2 && c === 2 && D.ph && k > .12 && k < .3 ? C.pink : null); }
    });
    if (!D.ph) return;
    TX(D, R.cx, T.y1 + s * .9, '代金の合計が 1160円', { size: s * .95, col: C.yel, a: CH.smooth(.42, .5, k) });
    eqs(D, CH.rect(R.x0, T.y1 + s * 1.8, R.x1, R.y1 - s * 2), [{ s: LE[0] }, { s: LE[1], lab: 'かっこをはずす' }, { s: LE[2], lab: '移項してまとめる' }, { s: LE[3], col: C.yel }], k, { size: s * 1.25, at: [.66, .76, .86], a: CH.smooth(.5, .58, k) });
    TX(D, R.cx, R.y1 - s * .8, 'えんぴつ 8本、ペン 12−8＝4本', { size: fit(D, 'えんぴつ 8本、ペン 12−8＝4本', R.w, s * 1.1), col: C.yel, a: CH.smooth(.92, 1, k) });
  }

  /* ---- 例題：母と子の年れい（テープ図） ---- */
  function ages(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .04 }), s = CH.fs(D), q = D.ph ? 4 * CH.smooth(.05, .5, k) : 0, x = Math.min(4, Math.floor(q) + CH.ease(CH.clamp((q - Math.floor(q)) * 2, 0, 1))), U = (R.w - s * 3.6) / 48, x0 = R.x0 + s * 3.4, h = Math.min(s * 1.9, R.h * .1);
    var y1 = R.y0 + R.h * .1, y2 = y1 + h * 1.9, ok = D.ph && k >= .5;
    TX(D, R.x0, y1 + h / 2, '母', { size: s, col: C.pink, align: 'left' }); TX(D, R.x0, y2 + h / 2, '子×3', { size: fit(D, '子×3', s * 3, s), col: C.blue, align: 'left' });
    CH.tape(D, x0, y1, (41 + x) * U, h, [{ v: 41, col: C.pink, txt: '41' }, { v: x, col: C.green, txt: x > 1 ? 'x' : '' }], 41 + x);
    var parts = []; for (var i = 0; i < 3; i++) parts.push({ v: 11, col: C.blue, txt: '11' }, { v: x, col: C.green, txt: x > 1 ? 'x' : '' });
    CH.tape(D, x0, y2, 3 * (11 + x) * U, h, parts, 3 * (11 + x));
    var m = 41 + x, c3 = 3 * (11 + x);
    CH.line(D, x0 + m * U, y1 - s * .4, x0 + m * U, y2 + h + s * .4, { col: ok ? C.yel : 'rgba(242,240,230,.5)', dash: ok ? null : [4, 4], w: ok ? 3 : 1.6, glow: ok });
    var yr = Math.floor(x + 1e-9);
    TS(D, R.cx, y2 + h + s * 1.6, [[yr ? yr + '年後' : 'いま', C.green], ['　母 ' + (41 + yr) + '才、子の3倍 ' + 3 * (11 + yr) + '才', C.chalk]], { size: fit(D, '4年後　母 45才、子の3倍 45才', R.w, s) });
    if (!D.ph) return;
    eqs(D, CH.rect(R.x0, y2 + h + s * 3, R.x1, R.y1), [{ s: '（x年後の母）＝3×（x年後の子）', txt: true, col: C.green }, { s: LA[0] }, { s: LA[1], lab: 'かっこをはずす' }, { s: LA[2], lab: '移項' }, { s: LA[3], col: C.yel }], k, { size: s * 1.2, at: [.55, .66, .78, .9], a: CH.smooth(.5, .56, k) });
  }

  /* ---- 考えよう：x をどちらにするか ---- */
  function tool(D) {
    var R = CH.box(D, { l: .03, r: .03, t: .03, b: .03 }), s = CH.fs(D), w = D.V.w, c = D.V.c, T = CH.rect(R.x0, R.y0 + s * 1.6, R.x1, R.y0 + R.h * .55);
    TX(D, R.cx, R.y0 + s * .6, w ? 'ドーナツを x 個とすると？' : 'ゆうさん：ケーキを x 個', { size: s * 1.05, col: w ? C.pink : C.yel });
    var rows = [['1個のねだん（円）', 250, 90, '—'], ['個数（個）', w ? '？' : 'x', w ? 'x' : '11−x', 11], ['代金（円）', w ? '？' : '250x', w ? '？' : '90(11−x)', 1470]];
    var tb = CH.table(D, T, ['', 'ケーキ', 'ドーナツ', '合計'], rows, { fw: .3, size: Math.min(s * 1.05, T.w / 15), top: true, hl: function (r, c2) { return r >= 2 && c2 >= 1 && c2 <= 2 && rows[r - 1][c2] === '？' ? C.pink : null; } });
    if (!w) TX(D, R.cx, tb.y1 + s * 1.1, '250x＋90(11−x)＝1470', { size: fit(D, '250x＋90(11−x)＝1470', R.w, s * 1.2), col: C.yel });
    var y = R.y0 + R.h * .78, tot = 250 * c + 90 * (11 - c), ok = tot === 1470;
    TS(D, R.cx, y, [['ケーキ ', C.chalk], [String(c), C.yel], ['個・ドーナツ ', C.chalk], [String(11 - c), C.yel], ['個のとき', C.chalk]], { size: fit(D, 'ケーキ 11個・ドーナツ 0個のとき', R.w, s) });
    TS(D, R.cx, y + s * 1.8, [['代金 250×' + c + '＋90×' + (11 - c) + '＝' + tot + '円　', C.chalk], [ok ? '1470円と等しい' : '1470円ではない', ok ? C.yel : C.pink]], { size: fit(D, '代金 250×11＋90×0＝2750円　1470円ではない', R.w, s) });
  }

  /* ---- チャレンジ：パンとおにぎりを入れかえる ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .03, b: .03 }), s = CH.fs(D), T = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .36);
    CH.table(D, T, ['', 'パン 120円', 'おにぎり 90円', '代金（円）'], [['予定', 'x個', '(15−x)個', '120x＋90(15−x)'], ['入れかえ', '(15−x)個', 'x個', '120(15−x)＋90x']], {
      fw: .2, size: fit(D, '120(15−x)＋90x', T.w * .8 / 3 * .9, Math.min(s * .95, T.w / 19)), top: true,
      show: function (r, c) { return r === 2 && D.ph ? CH.smooth(.04 + c * .04, .1 + c * .04, k) : (r === 2 ? 0 : 1); },
      hl: function (r, c) { return D.ph && k > .2 && k < .45 && c === 3 && r > 0 ? C.yel : null; }
    });
    if (!D.ph) return;
    TX(D, R.cx, T.y1 + s * .9, '（入れかえた代金）＝（予定の代金）＋150', { size: fit(D, '（入れかえた代金）＝（予定の代金）＋150', R.w, s), col: C.green, a: CH.smooth(.25, .33, k) });
    eqs(D, CH.rect(R.x0, T.y1 + s * 1.8, R.x1, R.y1 - s * 2), [{ s: LC[0] }, { s: LC[1], lab: 'かっこをはずしてまとめる' }, { s: LC[2], lab: '移項' }, { s: LC[3], col: C.yel }], k, { size: s * 1.2, at: [.5, .65, .8], a: CH.smooth(.33, .4, k) });
    TX(D, R.cx, R.y1 - s * .8, 'パン 5個、おにぎり 10個（予定 1500円、入れかえ 1650円）', { size: fit(D, 'パン 5個、おにぎり 10個（予定 1500円、入れかえ 1650円）', R.w, s), col: C.yel, a: CH.smooth(.9, 1, k) });
  }

  K3.run({
    no: '第7時', title: 'わからない数量を x として、問題を解決しよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '06.html', label: '◀ 第6時' }, { href: '08.html', label: '第8時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'お菓子と袋（代金 1740円）', q: '1個 140円のお菓子を何個かと、60円の袋を1枚買って、代金をちょうど 1740円にしたい。お菓子は何個買えるだろう。何を x として、どんな関係を式にするか考えよう。',
        notes: ['① 自分の考え（3分）　x を決めて、式と答えを書こう。', '② ペアの考え（3分）　自分とちがう考え方は？'],
        draw: function (D) { shop(D, 0); } },
      { tag: '今日の問い', q: 'お菓子の個数を x個として、式に表そう。何個買える？', a: '140x＋60＝1740。12個', sub: '（お菓子の代金）＋（袋の代金）＝（代金の合計）。140x＝1680 → x＝12', dur: 9,
        b: { t: 'お菓子を x個 → <b>140x＋60＝1740</b> → x＝12 → <b>12個</b>', col: C.yel },
        draw: function (D) { shop(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '方程式を使って問題を解くとき、どんな順に考えるとよいだろう。', a: 'x を決める → 等しい関係で方程式 → 解く → 確かめる', sub: '解が、問題に合っているか（個数なら自然数か など）を確かめてから答える', dur: 6,
        b: [{ t: '① 何を <b>x</b> とするか決める　② <b>等しい関係</b>を見つけて方程式', col: C.green }, { t: '③ 方程式を解く　④ 解が問題に<b>合っているか</b>確かめる', col: C.green }],
        draw: function (D) { flow(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　表に整理する', q: '1本 80円のえんぴつと、1本 130円のペンを、合わせて 12本買ったら、代金の合計は 1160円だった。それぞれ何本買った？', a: 'えんぴつ 8本、ペン 4本', sub: 'えんぴつを x本とすると、ペンは 12−x本。80x＋130(12−x)＝1160 → −50x＝−400 → x＝8', dur: 9,
        b: { t: 'ペンは 12−x本 → 80x＋130(12−x)＝1160 → <b>えんぴつ 8本、ペン 4本</b>', col: C.pink },
        draw: function (D) { pens(D, D.ph ? D.t : 0); } },
      { tag: '例題', q: 'いま、母は 41才、子は 11才。母の年れいが、子の年れいの 3倍になるのは、何年後だろう。', a: '4年後', sub: 'x年後とすると、41＋x＝3(11＋x) → 41＋x＝33＋3x → −2x＝−8 → x＝4。母 45才、子 15才', dur: 8,
        b: { t: 'x年後 → 41＋x＝3(11＋x) → <b>4年後</b>（45才と 15才）', col: C.pink },
        draw: function (D) { ages(D, D.ph ? D.t : 0); } },
      { tag: '考えよう', bh: '考えよう', q: 'ケーキ 250円とドーナツ 90円を、合わせて 11個買ったら、代金は 1470円だった。ゆうさんは、ケーキを x個として 250x＋90(11−x)＝1470 とした。ドーナツを x個とすると、どんな式になるだろう。',
        notes: ['ドーナツを x個とした方程式と解を書こう。ゆうさんの式とくらべて、気づいたことは？', 'スライダーで、x とするものを切りかえたり、ケーキの個数を変えて代金を確かめたりできます。'],
        sliders: [{ key: 'w', label: 'x とするもの', min: 0, max: 1, step: 1, val: 0, fmt: function (v) { return v ? 'ドーナツ' : 'ケーキ'; } }, { key: 'c', label: 'ケーキの個数', min: 0, max: 11, step: 1, val: 0, fmt: function (v) { return v + '個'; } }],
        draw: tool },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '1個 120円のパンと 1個 90円のおにぎりを、合わせて 15個買う予定だった。ところが、個数を入れかえて買ったら、予定より代金が 150円高くなった。予定していた個数は？',
        a: 'パン 5個、おにぎり 10個', sub: 'パンを x個とすると、120(15−x)＋90x＝120x＋90(15−x)＋150 → 1800−30x＝30x＋1500 → x＝5', dur: 9,
        b: { t: '120(15−x)＋90x＝120x＋90(15−x)＋150 → <b>パン 5個、おにぎり 10個</b>', col: C.orange },
        draw: function (D) { chal(D, D.ph ? D.t : 0); } }
    ])
  });
})();
