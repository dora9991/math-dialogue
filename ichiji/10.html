<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2点から式を求める</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script>
/* 一次関数 第10時：2点から、一次関数の式を求めよう（ikkan の lesson_ichiji_new_10 と同じ流れ）。
   2点が置かれ、傾きの三角形から傾き、さかのぼって切片。考えようは、直線上の ● から 2点を選ぶ道具（式は出さない）。
   数値は ikkan と同じ（今日の問い A(1, 3)・B(3, 7)、例題 (−2, 5)・(4, −1)、チャレンジは変域から 2通り）。図はすべてページの中で計算して描く。 */
(function () {
  var C = CH.C, M = CH.mnum, OUT = 'rgba(20,40,30,.9)';
  function P(p) { return '(' + M(p[0]) + ', ' + M(p[1]) + ')'; }
  /* 2点を通る直線：傾き＝(y の増加量)÷(x の増加量)、1点を代入して b */
  function fit(p, q) { var a = (q[1] - p[1]) / (q[0] - p[0]); return [a, p[1] - a * p[0]]; }
  /* 2点を a・x＋b＝y に代入した連立方程式を、加減法で（fit とは別の計算） */
  function sys(p, q) { var a = (q[1] - p[1]) / (q[0] - p[0]), b = (p[1] * q[0] - q[1] * p[0]) / (q[0] - p[0]); return [a, b]; }
  var A = [1, 3], B = [3, 7], EA = [-2, 5], EB = [4, -1];
  var L = fit(A, B), LE = fit(EA, EB);
  CH.check(L[0] === 2 && L[1] === 1 && sys(A, B).join() === '2,1' && 2 * B[0] + 1 === B[1], '今日の問い y＝2x＋1');
  CH.check(LE[0] === -1 && LE[1] === 3 && sys(EA, EB).join() === '-1,3' && -EA[0] + 3 === EA[1] && -EB[0] + 3 === EB[1], '例題 y＝−x＋3');
  /* 考えよう：直線 y＝−3/2 x＋2 の上の ●（どの 2点を選んでも、同じ式になる。式は画面に出さない） */
  var TH = [[-2, 5], [0, 2], [2, -1], [4, -4]];
  (function () { var ok = TH.every(function (p) { return CH.near(-1.5 * p[0] + 2, p[1]); }); for (var i = 0; i < 4; i++) for (var j = i + 1; j < 4; j++) { var f = fit(TH[i], TH[j]); ok = ok && CH.near(f[0], -1.5) && CH.near(f[1], 2); } CH.check(ok, '考えよう（どの 2点でも同じ直線）'); })();
  /* チャレンジ：1≦x≦4 のとき 3≦y≦9。a・b を総当たりして、2通りだけ */
  (function () { var all = []; for (var a = -12; a <= 12; a++) for (var b = -30; b <= 30; b++) { if (!a) continue; var y1 = a + b, y4 = 4 * a + b; if (Math.min(y1, y4) === 3 && Math.max(y1, y4) === 9) all.push(a + ',' + b); } CH.check(all.join(' ') === '-2,11 2,1' && fit([1, 9], [4, 3]).join() === '-2,11' && fit([1, 3], [4, 9]).join() === '2,1', 'チャレンジ（2通り）'); })();

  /* 座標平面を、舞台いっぱいに（目もりの字・x・y の字の分だけ内側に） */
  function full(D) { return CH.box(D, { l: 0, r: 0, t: 0, b: 0 }); }
  function plane(D, x, y, R) {
    var s = CH.fs(D, .72); R = R || full(D);
    return CH.plane(D, CH.rect(R.x0 + s * 1.2, R.y0 + s * 1.8, R.x1 - s * 2.4, R.y1 - s * .8), { x: x, y: y });
  }
  /* 舞台を 2つに（横長なら左右、縦長なら上下）。k は 1つめの割合 */
  function two(D, k) {
    var R = full(D);
    if (D.W > D.H * .9) { var x = R.x0 + R.w * k; return [CH.rect(R.x0, R.y0, x, R.y1), CH.rect(x + R.w * .02, R.y0, R.x1 - R.w * .02, R.y1)]; }
    var y = R.y0 + R.h * k; return [CH.rect(R.x0, R.y0, R.x1, y), CH.rect(R.x0 + 8, y + 4, R.x1 - 8, R.y1)];
  }
  /* 字の行（左そろえ）。L：[{ t, col, a }]。いちばん長い行が R におさまる大きさで */
  function lines(D, R, L, size) {
    var n = Math.max.apply(null, L.map(function (l) { return l.t.length; })), s = Math.min(size || CH.fs(D, .95), R.w / (n + .5), R.h / (L.length * 1.7 + .3));
    L.forEach(function (l, i) { if (l.a === 0) return; CH.text(D, R.x0, R.y0 + s * (1.1 + i * 1.7), l.t, { col: l.col || C.chalk, size: s, align: 'left', a: l.a }); });
  }
  function lab(D, Pl, x, y, t, o) { o = o || {}; CH.text(D, Pl.X(x), Pl.Y(y), t, { col: o.col || C.chalk, size: o.size || CH.fs(D, .85), align: o.align || 'left', a: o.a, outline: OUT }); }
  /* 線分を、とちゅうまで（k：0〜1） */
  function part(D, Pl, p, q, k, o) { if (k <= 0) return; CH.pseg(D, Pl, p, [CH.lerp(p[0], q[0], k), CH.lerp(p[1], q[1], k)], o); }
  function glow(D, Pl, p, col, a) { var r = CH.fs(D, .3); CH.circle(D, Pl.X(p[0]), Pl.Y(p[1]), r * (2.1 + .4 * Math.sin(D.now * 5)), { stroke: col, sw: 2.6, a: (a == null ? 1 : a) * .7 }); }
  /* 傾きの三角形を、横 → 縦の順にかく（k：0〜1）。lx・ly は字 */
  function tri(D, Pl, p, q, k, col, lx, ly) {
    var c = [q[0], p[1]], k1 = CH.clamp(k * 2, 0, 1), k2 = CH.clamp(k * 2 - 1, 0, 1), s = CH.fs(D, .8), dn = q[1] < p[1];
    part(D, Pl, p, c, k1, { col: col, w: 2.6, dash: true });
    part(D, Pl, c, q, k2, { col: col, w: 2.6, dash: true });
    if (k1 >= 1) CH.text(D, Pl.X((p[0] + c[0]) / 2), Pl.Y(c[1]) + (dn ? -s : s), lx, { col: col, size: s, outline: OUT });
    if (k2 >= 1) CH.text(D, Pl.X(c[0]) + s * .5, Pl.Y((c[1] + q[1]) / 2), ly, { col: col, size: s, align: 'left', outline: OUT });
  }
  /* 点 A・B（最初は座標も。そのあとは A・B の字だけ。A は y 軸に近いので） */
  function ptAB(D, Pl, full) { CH.pt(D, Pl, A[0], A[1], { lab: full ? 'A' + P(A) : 'A', dir: full ? 'e' : 'nw' }); CH.pt(D, Pl, B[0], B[1], { lab: full ? 'B' + P(B) : 'B', dir: full ? 'e' : 'nw' }); }
  var XA = [-2, 6], YA = [-1, 9];

  K3.run({
    no: '第10時', title: '2点から、一次関数の式を求めよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '09.html', label: '◀ 第9時' }, { href: '11.html', label: '第11時 ▶' }],
    steps: [
      { tag: '今日の問い', bh: '2点 A(1, 3)、B(3, 7) を通る直線', q: 'グラフが 2点 A(1, 3)、B(3, 7) を通る一次関数の式を求めよう。前の時間とちがい、傾きはわからない。どう求めればよいだろう。',
        notes: ['① 自分の考え（3分）　求め方と式を書こう。', '② ペアの考え（3分）　ちがう求め方を書こう。'],
        draw: function (D) { var Pl = plane(D, XA, YA); ptAB(D, Pl, true); } },
      { tag: '今日の問い', q: 'A から B へ、x と y は いくつ増える？ 傾きは？', a: '傾き 2', sub: 'x の増加量 3−1＝2、y の増加量 7−3＝4。傾き＝4÷2＝2', dur: 3.5,
        b: { t: '傾き ＝ (y の増加量)÷(x の増加量) ＝ (7−3)÷(3−1) ＝ <b>2</b>', col: C.yel },
        draw: function (D) {
          var Pl = plane(D, XA, YA), t = D.ph ? D.t : 0;
          if (t > 0) CH.pseg(D, Pl, A, B, { col: C.chalk, w: 2, a: .45 * CH.smooth(0, .1, t) });
          tri(D, Pl, A, B, CH.smooth(.05, .75, t), C.pink, 'x ＋2', 'y ＋4');
          ptAB(D, Pl);
          if (t > .8) lab(D, Pl, 3.5, 3.6, '傾き 4÷2＝2', { col: C.pink, a: CH.smooth(.8, .95, t), size: CH.fs(D, .95) });
        } },
      { tag: '今日の問い', q: '切片は？ 式は？', a: 'y＝2x＋1', sub: 'y＝2x＋b に A(1, 3) を代入　3＝2×1＋b　b＝1。確かめ　B(3, 7)：2×3＋1＝7 ○', dur: 4.5,
        b: { t: 'A(1, 3) を代入　3＝2×1＋b、b＝1 → <b>y＝2x＋1</b>', col: C.yel },
        draw: function (D) {
          var Pl = plane(D, XA, YA), t = D.ph ? D.t : 0, I = [0, 1];
          tri(D, Pl, A, B, 1, 'rgba(255,157,178,.55)', '＋2', '＋4');
          /* A から、y を 2 もどすと、x は 1 もどる → (0, 1) */
          var k1 = CH.smooth(0, .2, t), k2 = CH.smooth(.2, .4, t);
          part(D, Pl, A, [1, 1], k1, { col: C.blue, w: 2.6, dash: true });
          part(D, Pl, [1, 1], I, k2, { col: C.blue, w: 2.6, dash: true });
          if (k1 >= 1) lab(D, Pl, 1.15, 2, '−2', { col: C.blue });
          if (k2 >= 1) lab(D, Pl, .5, 1.4, '−1', { col: C.blue, align: 'center' });
          if (t > 0) CH.lin(D, Pl, 2, 1, { col: C.yel, t: CH.smooth(.45, .8, t), x0: -1, x1: 4 });
          ptAB(D, Pl);
          if (t > .4) { CH.pt(D, Pl, 0, 1, { col: C.blue, lab: '切片 1', dir: 'se', a: CH.smooth(.4, .5, t) }); if (t < 1) glow(D, Pl, I, C.blue, CH.smooth(.4, .5, t)); }
          if (t > .85) lab(D, Pl, 4.0, 8.4, 'y＝2x＋1', { col: C.yel, a: CH.smooth(.85, 1, t), size: CH.fs(D, 1.05) });
        } },
      { tag: 'ことば', bh: 'ことば', q: '2点の座標から、式を求める 2つの方法は？', a: '傾きを先に求める／連立方程式を解く', sub: '方法1　傾き＝(y の増加量)÷(x の増加量)、1点の座標を代入して b。方法2　2点の座標をそれぞれ代入して、a、b の連立方程式を解く', dur: 4,
        b: [{ t: '<b>方法1</b>　傾き＝(y の増加量)÷(x の増加量) → 1点を<b>代入</b>して b', col: C.green }, { t: '<b>方法2</b>　2点を それぞれ代入 → a、b の<b>連立方程式</b>', col: C.green }],
        draw: function (D) {
          var Rs = two(D, .56), Pl = plane(D, XA, YA, Rs[0]), t = D.ph ? D.t : 0, a1 = CH.smooth(.02, .2, t), a2 = CH.smooth(.5, .65, t);
          CH.lin(D, Pl, 2, 1, { col: C.yel, a: .55, x0: -1, x1: 4 });
          if (t > 0) tri(D, Pl, A, B, CH.smooth(.02, .35, t), C.pink, '＋2', '＋4');
          if (t > .5) { glow(D, Pl, A, C.blue, a2); glow(D, Pl, B, C.blue, a2); }
          ptAB(D, Pl);
          lines(D, Rs[1], [{ t: '方法1　傾きを先に', col: C.pink, a: a1 }, { t: '　傾き (7−3)÷(3−1)＝2', a: CH.smooth(.15, .3, t) }, { t: '　3＝2×1＋b → b＝1', a: CH.smooth(.3, .45, t) },
            { t: '方法2　連立方程式', col: C.blue, a: a2 }, { t: '　3＝a＋b …①', a: CH.smooth(.62, .75, t) }, { t: '　7＝3a＋b …②', a: CH.smooth(.72, .85, t) }, { t: '　②−①　4＝2a → a＝2、b＝1', a: CH.smooth(.85, .97, t) }]);
        } },
      { tag: '例題', bh: '例題　2点 (−2, 5)、(4, −1)', q: 'グラフが 2点 (−2, 5)、(4, −1) を通る式を求めよう。どちらの方法でもよい。', a: 'y＝−x＋3',
        sub: '傾き＝(−1−5)÷(4−(−2))＝−6÷6＝−1。(4, −1) を代入　−1＝−4＋b　b＝3', dur: 5,
        b: { t: '(−2, 5)、(4, −1) → 傾き −6÷6＝−1、b＝3 → <b>y＝−x＋3</b>', col: C.pink },
        draw: function (D) {
          var Pl = plane(D, [-4, 6], [-3, 7]), t = D.ph ? D.t : 0;
          tri(D, Pl, EA, EB, CH.smooth(0, .45, t), C.pink, 'x ＋6', 'y −6');
          if (t > .45) lab(D, Pl, .6, 6.2, '傾き −6÷6＝−1', { col: C.pink, a: CH.smooth(.45, .55, t) });
          if (t > 0) CH.lin(D, Pl, -1, 3, { col: C.yel, t: CH.smooth(.55, .85, t) });
          CH.pt(D, Pl, EA[0], EA[1], { lab: P(EA), dir: 'nw' }); CH.pt(D, Pl, EB[0], EB[1], { lab: P(EB), dir: 'sw' });
          if (t > .7) { CH.pt(D, Pl, 0, 3, { col: C.blue, lab: '切片 3', dir: 'ne', a: CH.smooth(.7, .8, t) }); if (t < 1) glow(D, Pl, [0, 3], C.blue); }
          if (t > .88) lab(D, Pl, -3.8, -1.6, 'y＝−x＋3', { col: C.yel, a: CH.smooth(.88, 1, t), size: CH.fs(D, 1.05) });
        } },
      { tag: '考えよう', q: 'グラフ上の点（●）から 2点を選んで、この一次関数の式を求めよう。選ぶ 2点を変えると、式は変わるだろうか。',
        notes: ['選んだ 2点と、求めた式を書こう。別の 2点でも、もう一度。', 'どの 2点を選ぶと、計算が楽になるだろう。', 'スライダーで、選ぶ 2点を変えられます。'],
        sliders: [{ key: 'p', label: '1つめ', min: 0, max: 3, step: 1, val: 0, fmt: function (i) { return P(TH[i]); } },
          { key: 'q', label: '2つめ', min: 0, max: 3, step: 1, val: 2, fmt: function (i) { return P(TH[i]); } }],
        draw: function (D) {
          var Pl = plane(D, [-4, 6], [-5, 6]), p = TH[D.V.p], q = TH[D.V.q];
          CH.lin(D, Pl, -1.5, 2, { col: C.chalk, a: .8 });
          if (D.V.p !== D.V.q) { var a = p[0] < q[0] ? p : q, b = p[0] < q[0] ? q : p; CH.pseg(D, Pl, a, [b[0], a[1]], { col: C.pink, w: 2.6, dash: true }); CH.pseg(D, Pl, [b[0], a[1]], b, { col: C.pink, w: 2.6, dash: true }); }
          TH.forEach(function (r, i) { var on = i === D.V.p || i === D.V.q; CH.pt(D, Pl, r[0], r[1], { col: on ? C.yel : C.chalk, r: on ? CH.fs(D, .38) : null, lab: on ? P(r) : null, dir: 'sw' }); });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '一次関数 y＝ax＋b で、x の変域が 1≦x≦4 のとき、y の変域は 3≦y≦9 である。この一次関数の式を、すべて求めよう。',
        a: 'y＝2x＋1 と y＝−2x＋11', sub: 'a が正 → x＝1 で y＝3、x＝4 で y＝9。(1, 3)、(4, 9) を通る。a が負 → (1, 9)、(4, 3) を通る', dur: 6,
        b: { t: 'a＞0 … (1, 3)、(4, 9) → <b>y＝2x＋1</b>　a＜0 … (1, 9)、(4, 3) → <b>y＝−2x＋11</b>', col: C.orange },
        draw: function (D) {
          var Pl = plane(D, [-1, 6], [-1, 12]), t = D.ph ? D.t : 0, s = CH.fs(D, .8);
          /* 変域：x 軸の 1〜4、y 軸の 3〜9 を太く。わく（1≦x≦4、3≦y≦9） */
          CH.pseg(D, Pl, [1, 0], [4, 0], { col: C.yel, w: 6, a: .75 }); CH.pseg(D, Pl, [0, 3], [0, 9], { col: C.yel, w: 6, a: .75 });
          CH.fillRect(D, Pl.X(1), Pl.Y(9), Pl.X(4), Pl.Y(3), { fill: 'rgba(255,226,122,.08)', stroke: 'rgba(255,226,122,.6)', dash: true });
          CH.text(D, Pl.X(2.5), Pl.Y(9) - s * .9, '1≦x≦4、3≦y≦9', { col: C.yel, size: s, outline: OUT });
          var k1 = CH.smooth(.05, .4, t), k2 = CH.smooth(.5, .85, t);
          if (t > .3) CH.lin(D, Pl, 2, 1, { col: C.yel, a: .35 * CH.smooth(.3, .45, t), dash: true });
          part(D, Pl, [1, 3], [4, 9], k1, { col: C.yel, w: 3.2 });
          if (k1 > 0) { CH.pt(D, Pl, 1, 3, { col: C.yel }); if (k1 >= 1) CH.pt(D, Pl, 4, 9, { col: C.yel }); }
          if (t > .38) lab(D, Pl, 2.5, 10.7, 'a＞0　y＝2x＋1', { col: C.yel, a: CH.smooth(.38, .48, t), align: 'center' });
          if (t > .8) CH.lin(D, Pl, -2, 11, { col: C.pink, a: .35 * CH.smooth(.8, .95, t), dash: true });
          part(D, Pl, [1, 9], [4, 3], k2, { col: C.pink, w: 3.2 });
          if (k2 > 0) { CH.pt(D, Pl, 1, 9, { col: C.pink }); if (k2 >= 1) CH.pt(D, Pl, 4, 3, { col: C.pink }); }
          if (t > .85) lab(D, Pl, 2.5, 1.5, 'a＜0　y＝−2x＋11', { col: C.pink, a: CH.smooth(.85, .97, t), align: 'center' });
        } }
    ]
  });
})();
</script>
</body>
