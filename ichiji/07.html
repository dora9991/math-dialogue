<script>
/* 一次関数 第7時：式とグラフのカードを合わせて、決め手を説明しよう（ikkan の lesson_ichiji_new_07 と同じ流れ）。
   式カード A〜D が、グラフ ①〜④ へ1枚ずつ飛んでいく。決め手（切片の点・傾きの階段）が光る。考えようは、傾き・切片のスライダーで、自分のカードをつくる。
   数値は ikkan のまま（A y＝2x＋1、B y＝−2x＋1、C y＝2x−2、D y＝−1/2x、例題 y＝−1/2x＋2、チャレンジ 直線 m）。合う組は、直線の式から計算し直している。 */
(function () {
  var C = CH.C, S = CH.mnum;
  /* ---- 分数入りの字（[2/3] をたての分数に）。canvas 用と、右の板書（HTML）用 ---- */
  var FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  function TX(D, x, y, s, o) {
    o = o || {}; var g = D.ctx, size = o.size || CH.fs(D), fz = size * .72, parts = String(s).split(/\[([^\/\]]+)\/([^\]]+)\]/), segs = [], w = 0, i;
    g.save();
    for (i = 0; i < parts.length; i += 3) {
      if (parts[i]) { g.font = '600 ' + size + 'px ' + FONT; segs.push({ t: parts[i], w: g.measureText(parts[i]).width }); w += segs[segs.length - 1].w; }
      if (i + 1 < parts.length) { g.font = '600 ' + fz + 'px ' + FONT; var fw = Math.max(g.measureText(parts[i + 1]).width, g.measureText(parts[i + 2]).width) + fz * .35; segs.push({ n: parts[i + 1], d: parts[i + 2], w: fw }); w += fw; }
    }
    g.restore();
    var x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, oo = { col: o.col, a: o.a, outline: o.outline };
    segs.forEach(function (sg) {
      if (sg.t != null) CH.text(D, x0, y, sg.t, Object.assign({ size: size, align: 'left' }, oo));
      else {
        var cx = x0 + sg.w / 2; CH.text(D, cx, y - fz * .6, sg.n, Object.assign({ size: fz }, oo)); CH.text(D, cx, y + fz * .66, sg.d, Object.assign({ size: fz }, oo));
        CH.line(D, x0 + fz * .12, y + fz * .04, x0 + sg.w - fz * .12, y + fz * .04, { col: o.col || C.chalk, w: Math.max(1.3, size * .07), a: o.a });
      }
      x0 += sg.w;
    });
    return w;
  }
  function fr(s) { return String(s).replace(/\[([^\/\]]+)\/([^\]]+)\]/g, '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.75em;line-height:1.1;margin:0 .12em"><span style="border-bottom:.09em solid currentColor;padding:0 .12em">$1</span><span>$2</span></span>'); }
  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = fr(s[k]); }); if (s.notes) s.notes = s.notes.map(fr); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = fr(b.t); }); }); return st; }
  var OUT = 'rgba(20,40,30,.92)';
  function plane(D, P, xr, yr, o) { var s = CH.fs(D, .72); return CH.plane(D, CH.rect(P.x0 + s * .4, P.y0 + s * 1.6, P.x1 - s * 1.8, P.y1 - s * .4), Object.assign({ x: xr, y: yr }, o || {})); }
  function lab(D, Pl, x, y, txt, col, o) { o = o || {}; TX(D, Pl.X(x) + (o.dx || 0), Pl.Y(y) + (o.dy || 0), txt, { col: col, size: o.size || CH.fs(D, .9), align: o.align || 'left', outline: OUT, a: o.a }); }
  function stair(D, Pl, x0, y0, dx, dy, o) {
    o = o || {}; var col = o.col || C.pink, s = o.size || CH.fs(D, o.k || .85), a = o.a, p = o.p == null ? 1 : o.p, h = Math.min(1, p * 2), v = CH.clamp(p * 2 - 1, 0, 1);
    CH.pseg(D, Pl, [x0, y0], [x0 + dx * h, y0], { col: col, w: o.w || 2.8, a: a });
    if (v > 0) CH.pseg(D, Pl, [x0 + dx, y0], [x0 + dx, y0 + dy * v], { col: col, w: o.w || 2.8, a: a, arrow: v > .3, head: 8 });
    if (o.lx !== '' && h > .5) TX(D, Pl.X(x0 + dx / 2), Pl.Y(y0) + (dy >= 0 ? s * .95 : -s * .95), o.lx || ('右へ ' + dx), { col: col, size: s, outline: OUT, a: a });
    if (o.ly !== '' && v > .5) TX(D, Pl.X(x0 + dx) + s * .4, Pl.Y(y0 + dy * (o.at || .5)), o.ly || ((dy >= 0 ? '上へ ' : '下へ ') + S(Math.abs(dy))), { col: col, size: s, align: 'left', outline: OUT, a: a });
  }
  function ftxt(v) { var n = Math.round(v * 6), g = (function h(p, q) { return q ? h(q, p % q) : p; })(Math.abs(n), 6); return n % 6 === 0 ? S(n / 6) : (n < 0 ? '−' : '') + '[' + Math.abs(n) / g + '/' + 6 / g + ']'; }
  function eqOf(a, b) { return 'y＝' + (a === 1 ? '' : a === -1 ? '−' : ftxt(a)) + 'x' + (b === 0 ? '' : (b > 0 ? '＋' : '−') + ftxt(Math.abs(b))); }

  /* ---- 数（ikkan と同じ）と検算 ---- */
  var NUM = '①②③④';
  var CARDS = [{ k: 'A', a: 2, b: 1, g: 3 }, { k: 'B', a: -2, b: 1, g: 1 }, { k: 'C', a: 2, b: -2, g: 4 }, { k: 'D', a: -1 / 2, b: 0, g: 2 }];
  CARDS.forEach(function (c) { c.eq = eqOf(c.a, c.b); });
  var GR = [1, 2, 3, 4].map(function (n) { var c = CARDS.filter(function (c) { return c.g === n; })[0]; return { n: n, a: c.a, b: c.b }; });
  /* 合う組を、グラフの直線（2点）から読みとって出し直す */
  var MATCH = CARDS.map(function (c) { return NUM[GR.filter(function (g) { var y0 = g.b, y2 = g.a * 2 + g.b; return CH.near(y0, c.b) && CH.near((y2 - y0) / 2, c.a); })[0].n - 1]; });
  CH.check(CARDS.map(function (c) { return c.eq; }).join() === 'y＝2x＋1,y＝−2x＋1,y＝2x−2,y＝−[1/2]x' && MATCH.join('') === '③①④②', '今日の問い（A−③ B−① C−④ D−②）');
  CH.check(CH.near(-1 / 2 * 2 + 2, 1) && CH.near(-1 / 2 * 0 + 2, 2), '例題（(0, 2) と (2, 1) を通る）');
  CH.check(CH.near(.5 * 6 - 3, 0) && 6 * 3 / 2 === 9, 'チャレンジ');
  var AS = [-3, -2, -3 / 2, -1, -2 / 3, -1 / 2, -1 / 3, 1 / 3, 1 / 2, 2 / 3, 1, 3 / 2, 2, 3];

  /* ---- 配置：左に式カード、右に 2×2 のグラフ ---- */
  function lay(D) {
    var R = CH.box(D, { l: .02, r: .02, t: .03, b: .04 }), s = CH.fs(D), cw = R.w * (D.W > D.H * .9 ? .24 : .3), L = CH.rect(R.x0, R.y0, R.x0 + cw, R.y1), G = CH.rect(R.x0 + cw + R.w * .03, R.y0, R.x1, R.y1);
    var rs = CH.rows(G, 2, .04), cells = []; rs.forEach(function (r) { CH.cols(r, 2, .05).forEach(function (c) { cells.push(c); }); });
    var ch = Math.min(L.h / 6, s * 2.6), cards = CARDS.map(function (c, i) { return { x: L.cx, y: L.y0 + (i + .5) * L.h / 4, w: L.w * .94, h: ch }; });
    return { L: L, cells: cells, cards: cards, s: s };
  }
  function card(D, c, x, y, w, h, o) {
    o = o || {}; var s = CH.fs(D), col = o.col || C.blue;
    CH.card(D, x, y, w, h, '', { col: col, fill: 'rgba(31,58,44,.94)', sw: 2, a: o.a });
    CH.text(D, x - w / 2 + Math.min(s * .7, h * .35), y, c.k, { col: col, size: Math.min(s, h * .5), a: o.a });
    TX(D, x + w * .08, y, c.eq, { size: Math.min(s * .95, h * .42, w / 6.2), a: o.a });
  }
  function mini(D, cell, g, o) {
    o = o || {}; var s = CH.fs(D), top = Math.min(s * 1.9, cell.h * .18), R = CH.rect(cell.x0, cell.y0 + top, cell.x1, cell.y1), u = Math.min(R.w, R.h) / 7.5;
    var Pl = CH.plane(D, CH.rect(R.x0 + u * .3, R.y0 + u * .6, R.x1 - u * .9, R.y1 - u * .2), { x: [-3, 3], y: [-3, 3], size: Math.min(CH.fs(D, .6), u * .42) });
    CH.lin(D, Pl, g.a, g.b, { col: C.orange, w: 3 });
    CH.text(D, cell.x0 + s * .2, cell.y0 + top * .5, NUM[g.n - 1], { col: C.orange, size: Math.min(s * 1.1, top * .8), align: 'left' });
    return { Pl: Pl, top: top, u: u };
  }
  /* 決め手を光らせる：kind 'b'（切片の点）、'a'（傾きの階段） */
  function key(D, M, g, kind, a) {

    if (kind === 'b') { CH.circle(D, Pl.X(0), Pl.Y(g.b), M.u * .45, { stroke: C.yel, sw: 3, a: a }); CH.pt(D, Pl, 0, g.b, { col: C.yel, r: M.u * .2, a: a }); }
    else { var dx = Math.abs(g.a) < 1 ? 2 : 1; stair(D, Pl, 0, g.b, dx, g.a * dx, { col: C.pink, a: a, lx: String(dx), ly: S(Math.abs(g.a * dx)), size: sz, w: 2.4 }); }
  }
  function draw3(D, Pl, a, b, dx, p, o) {
    o = o || {}; var col = o.col || C.yel, r = CH.fs(D, .34), dy = a * dx, p1 = CH.smooth(0, .18, p), p2 = CH.clamp((p - .22) / .38, 0, 1), p3 = CH.smooth(.6, .68, p), p4 = CH.ease(CH.smooth(.7, 1, p)), s = CH.fs(D);

    if (p1 > 0) { CH.circle(D, Pl.X(0), Pl.Y(b), r * (1 + (1 - p1) * 1.5), { stroke: col, sw: 2, a: 1 - p1 }); CH.pt(D, Pl, 0, b, { col: col, r: r, a: p1 }); }
    if (p2 > 0) stair(D, Pl, 0, b, dx, dy, { col: C.pink, p: p2, lx: o.lx, ly: o.ly, at: o.at });
    if (p3 > 0) CH.pt(D, Pl, dx, b + dy, { col: col, r: r, a: p3 });

      if (p1 > .5) lab(D, Pl, 0, b, o.labs[0], col, { dx: l0[0] * s, dy: l0[1] * Pl.u, align: l0[0] < 0 ? 'right' : 'left', a: p1 });
      if (p3 > .5) lab(D, Pl, dx, b + dy, o.labs[1], col, { dx: l1[0] * s, dy: l1[1] * Pl.u, align: l1[0] < 0 ? 'right' : 'left', a: p3 }); }
  }

  /* 今日の問い：カードが合うグラフへ飛ぶ。k：0〜1 */
  function matchScene(D, k, o) {

  }

  K3.run({
    no: '第7時', title: '式とグラフのカードを合わせて、決め手を説明しよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '06.html', label: '◀ 第6時' }, { href: '08.html', label: '第8時 ▶' }],
    steps: fixSteps([

        b: { t: '<b>A−③　B−①　C−④　D−②</b>（切片と傾きが決め手）', col: C.yel },
        draw: function (D) { matchScene(D, D.ph ? D.t * 1.05 : 0); } },
      { tag: '今日の問い', q: 'A と B、A と C は、どこで見分ける？ D の決め手は？', a: 'A・B は傾き、A・C は切片', sub: 'A・B は切片が同じ（1）で、右上がりか右下がりかでちがう。A・C は傾きが同じ（2）で、切片がちがう。D は原点を通り（切片 0）、右へ 2 進むと下へ 1', dur: 6,
        b: { t: 'A・B … 切片が同じ → <b>傾き</b>で　A・C … 傾きが同じ → <b>切片</b>で　D … 原点を通る', col: C.yel },
        draw: function (D) {
          var t = D.ph ? D.t : 0, ph = !D.ph ? -1 : t < .34 ? 0 : t < .67 ? 1 : 2;
          matchScene(D, 1.05, { kb: function (g) { return ph < 0 ? 1 : ph === 0 ? (g === 1 || g === 3 ? 1 : .12) : ph === 1 ? (g === 3 || g === 4 ? 1 : .12) : (g === 2 ? 1 : .12); }, kab: function (g) { return ph < 0 ? 1 : ph === 0 ? (g === 1 || g === 3 ? 1 : .12) : ph === 1 ? .12 : (g === 2 ? 1 : .12); } });
        } },
      { tag: 'ことば', bh: 'ことば', q: 'b＝0 のとき、グラフはどこを通る？ 傾きが同じ2つの直線は、どんな位置関係？', a: '原点を通る・平行', sub: 'y＝ax＋b の a を傾き、b を切片という。a＞0 なら右上がり、a＜0 なら右下がり', dur: 4,

        draw: function (D) {

          CH.lin(D, Pl, 2, 1, { col: C.orange, w: 3 }); CH.lin(D, Pl, 2, -2, { col: C.blue, w: 3 }); CH.lin(D, Pl, -.5, 0, { col: C.lav, w: 3 });
          lab(D, Pl, .9, 3.4, 'A y＝2x＋1', C.orange, { align: 'right', dx: -s * .3 }); lab(D, Pl, 2.9, 3.4, 'C y＝2x−2', C.blue, { dx: s * .3 }); lab(D, Pl, -3.9, 2, 'D y＝−[1/2]x', C.lav, { dy: s * .9 });

            CH.text(D, Pl.X(3.9), Pl.Y(.8), '平行', { col: C.yel, a: a1, align: 'right', size: s * 1.1, outline: OUT });
            var a2 = CH.smooth(.5, .85, t); CH.circle(D, Pl.X(0), Pl.Y(0), s * .7, { stroke: C.green, sw: 3, a: a2 }); CH.pseg(D, Pl, [1.1, -2.3], [.25, -.3], { col: C.green, w: 2, a: a2 }); lab(D, Pl, 1.15, -2.65, '原点を通る', C.green, { a: a2 });

      { tag: '例題', bh: '例題　グラフから式を求める', q: '図の直線の式を求めよう。この直線は、y 軸上の点 (0, 2) を通り、そこから右へ 2 進むと、下へ 1 進む。', a: 'y＝−[1/2]x＋2', sub: '切片は 2。右へ 2 進むと下へ 1 進むから、傾きは −[1/2]。確かめ：(2, 1) を代入すると −[1/2]×2＋2＝1', dur: 6,
        b: { t: '切片 2、傾き −[1/2] → <b>y＝−[1/2]x＋2</b>', col: C.pink },
        draw: function (D) {
          var Pl = plane(D, CH.box(D, { l: .1, r: .08, t: .02, b: .03 }), [-4, 4], [-2, 4]), t = D.ph ? D.t : 0, s = CH.fs(D);
          CH.lin(D, Pl, -.5, 2, { col: C.orange, w: 3 }); CH.pt(D, Pl, 0, 2, { col: C.yel, r: CH.fs(D, .3) }); CH.pt(D, Pl, 2, 1, { col: C.yel, r: CH.fs(D, .3) });
          if (!D.ph) return;

          stair(D, Pl, 0, 2, 2, -1, { col: C.pink, p: CH.smooth(.25, .55, t), lx: '右へ 2', ly: '下へ 1' });

          TX(D, Pl.X(3.9), Pl.Y(3.4), 'y＝−[1/2]x＋2', { col: C.yel, size: s * 1.25, align: 'right', outline: OUT, a: CH.smooth(.75, .95, t) });
        } },

        sliders: [{ key: 'k', label: '傾き', min: 0, max: AS.length - 1, step: 1, val: 12, fmt: function (k) { return ['−3', '−2', '−3/2', '−1', '−2/3', '−1/2', '−1/3', '1/3', '1/2', '2/3', '1', '3/2', '2', '3'][k]; } },

        draw: function (D) {
          var Pl = plane(D, CH.box(D, { l: .1, r: .08, t: .02, b: .03 }), [-4, 4], [-4, 4]), a = AS[D.V.k], b = D.V.b, s = CH.fs(D);
          CH.lin(D, Pl, a, b, { col: C.orange, w: 3.4, glow: true });

          if (D.V.show) TX(D, Pl.R.x0 + s * .4, Pl.R.y0 + s * 2.2, eqOf(a, b), { col: C.yel, size: s * 1.2, align: 'left', outline: OUT });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '直線 m は、y 軸上の点 (0, −3) を通り、右へ 2 進むと上へ 1 進む。m と x 軸、y 軸で囲まれた三角形の面積を求めよう。（1目もりを 1 cm とする。）', a: '9 cm²', sub: 'm は y＝[1/2]x−3。y＝0 のとき 0＝[1/2]x−3、x＝6 → (6, 0)。底辺 6 cm、高さ 3 cm → 6×3÷2＝9', dur: 7,
        b: { t: 'm：y＝[1/2]x−3、(6, 0)　面積 6×3÷2＝<b>9 cm²</b>', col: C.orange },
        draw: function (D) {

          if (t > .7) { var a = CH.smooth(.7, .85, t); CH.poly(D, [[Pl.X(0), Pl.Y(0)], [Pl.X(6), Pl.Y(0)], [Pl.X(0), Pl.Y(-3)]], { fill: 'rgba(255,226,122,.25)', stroke: C.yel, sw: 2.4, a: a });
            CH.text(D, Pl.X(3), Pl.Y(0) - s * 1.1, '底辺 6', { col: C.yel, a: a, outline: OUT }); CH.text(D, Pl.X(0) - s * .5, Pl.Y(-1.5), '高さ 3', { col: C.yel, a: a, align: 'right', outline: OUT }); }
          draw3(D, Pl, .5, -3, 2, Math.min(1, t / .5), { lx: '右へ 2', ly: '上へ 1', labs: ['(0, −3)', ''] });
          if (t > .5) { var b2 = CH.smooth(.5, .65, t); CH.pt(D, Pl, 6, 0, { col: C.yel, r: CH.fs(D, .34), a: b2 }); lab(D, Pl, 6, 0, '(6, 0)', C.yel, { dx: s * .2, dy: -Pl.u * .55, a: b2 }); lab(D, Pl, -1.5, -3.2, 'm', C.orange, { a: b2 }); }
          if (t > .85) TX(D, Pl.R.x0 + s * .3, Pl.R.y0 + s * .9, '6×3÷2＝9', { col: C.yel, size: s * 1.2, align: 'left', outline: OUT, a: CH.smooth(.85, 1, t) });
