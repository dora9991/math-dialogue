<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>傾きと切片でグラフをかく</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script>
/* 一次関数 第6時：傾きと切片を使って、グラフをかこう（ikkan の lesson_ichiji_new_06 と同じ流れ）。
   切片の点をとり、そこから「右へ 1、上へ 2」と進んで、もう1つの点。2点を結ぶと、直線がのびる。傾きが分数なら、分母の数だけ右へ。
   数値は ikkan のまま（y＝2x−3、例題 y＝−2/3x＋2、練習 y＝1/2x＋2・y＝−2/3x−1、考えよう y＝1/2x＋1/2・y＝2/3x−1/3、チャレンジ y＝−3/4x＋3）。点・答えはページの中で計算し直している。 */
(function () {
  var C = CH.C, S = CH.mnum;
  /* ---- 分数入りの字（[2/3] をたての分数に）。canvas 用と、右の板書（HTML）用 ---- */
  var FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
  function TX(D, x, y, s, o) {
    o = o || {}; var g = D.ctx, size = o.size || CH.fs(D), fz = size * .72, parts = String(s).split(/\[([^\/\]]+)\/([^\]]+)\]/), segs = [], w = 0, i;
    g.save();
    for (i = 0; i < parts.length; i += 3) {
      if (parts[i]) { g.font = '600 ' + size + 'px ' + FONT; segs.push({ t: parts[i], w: g.measureText(parts[i]).width }); w += segs[segs.length - 1].w; }
      if (i + 1 < parts.length) { g.font = '600 ' + fz + 'px ' + FONT; var fw = Math.max(g.measureText(parts[i + 1]).width, g.measureText(parts[i + 2]).width) + fz * .35; segs.push({ n: parts[i + 1], d: parts[i + 2], w: fw }); w += fw; }
    }
    g.restore();
    var x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2, oo = { col: o.col, a: o.a, outline: o.outline };
    segs.forEach(function (sg) {
      if (sg.t != null) CH.text(D, x0, y, sg.t, Object.assign({ size: size, align: 'left' }, oo));
      else {
        var cx = x0 + sg.w / 2; CH.text(D, cx, y - fz * .6, sg.n, Object.assign({ size: fz }, oo)); CH.text(D, cx, y + fz * .66, sg.d, Object.assign({ size: fz }, oo));
        CH.line(D, x0 + fz * .12, y + fz * .04, x0 + sg.w - fz * .12, y + fz * .04, { col: o.col || C.chalk, w: Math.max(1.3, size * .07), a: o.a });
      }
      x0 += sg.w;
    });
    return w;
  }
  function fr(s) { return String(s).replace(/\[([^\/\]]+)\/([^\]]+)\]/g, '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.75em;line-height:1.1;margin:0 .12em"><span style="border-bottom:.09em solid currentColor;padding:0 .12em">$1</span><span>$2</span></span>'); }
  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = fr(s[k]); }); if (s.notes) s.notes = s.notes.map(fr); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = fr(b.t); }); }); return st; }
  var OUT = 'rgba(20,40,30,.92)';
  function plane(D, P, xr, yr, o) { var s = CH.fs(D, .72); return CH.plane(D, CH.rect(P.x0 + s * .4, P.y0 + s * 1.6, P.x1 - s * 1.8, P.y1 - s * .4), Object.assign({ x: xr, y: yr }, o || {})); }
  function lab(D, Pl, x, y, txt, col, o) { o = o || {}; TX(D, Pl.X(x) + (o.dx || 0), Pl.Y(y) + (o.dy || 0), txt, { col: col, size: o.size || CH.fs(D, .9), align: o.align || 'left', outline: OUT, a: o.a }); }
  function stair(D, Pl, x0, y0, dx, dy, o) {
    o = o || {}; var col = o.col || C.pink, s = CH.fs(D, o.k || .85), a = o.a, p = o.p == null ? 1 : o.p, h = Math.min(1, p * 2), v = CH.clamp(p * 2 - 1, 0, 1);
    CH.pseg(D, Pl, [x0, y0], [x0 + dx * h, y0], { col: col, w: 2.8, a: a });
    if (v > 0) CH.pseg(D, Pl, [x0 + dx, y0], [x0 + dx, y0 + dy * v], { col: col, w: 2.8, a: a, arrow: v > .3, head: 8 });
    if (o.lx !== '' && h > .5) TX(D, Pl.X(x0 + dx / 2), Pl.Y(y0) + (dy >= 0 ? s * .95 : -s * .95), o.lx || ('右へ ' + dx), { col: col, size: s, outline: OUT, a: a });
    if (o.ly !== '' && v > .5) TX(D, Pl.X(x0 + dx) + s * .4, Pl.Y(y0 + dy * (o.at || .5)), o.ly || ((dy >= 0 ? '上へ ' : '下へ ') + S(Math.abs(dy))), { col: col, size: s, align: 'left', outline: OUT, a: a });
  }
  /* 切片 → 傾き → 直線 の順にかく。p：0〜1。dx：右へ進む数（傾きの分母） */
  function draw3(D, Pl, a, b, dx, p, o) {
    o = o || {}; var col = o.col || C.yel, r = CH.fs(D, .34), dy = a * dx, p1 = CH.smooth(0, .18, p), p2 = CH.clamp((p - .22) / .38, 0, 1), p3 = CH.smooth(.6, .68, p), p4 = CH.ease(CH.smooth(.7, 1, p));
    if (p4 > 0) CH.lin(D, Pl, a, b, { col: o.lcol || C.orange, w: 3, x0: CH.lerp(0, Pl.xr[0], p4), x1: CH.lerp(dx, Pl.xr[1], p4) });
    if (p1 > 0) { CH.circle(D, Pl.X(0), Pl.Y(b), r * (1 + (1 - p1) * 1.5), { stroke: col, sw: 2, a: 1 - p1 }); CH.pt(D, Pl, 0, b, { col: col, r: r, a: p1 }); }
    if (p2 > 0 && !o.noStair) stair(D, Pl, 0, b, dx, dy, { col: o.scol || C.pink, p: p2, lx: o.lx, ly: o.ly, at: o.at });
    if (p3 > 0) CH.pt(D, Pl, dx, b + dy, { col: col, r: r, a: p3 });
    if (o.labs) {
      /* 字の位置：l0・l1 ＝ [横（字の大きさの何倍）, たて（1目もりの何倍）]。y 軸の上の点は、目もりの数のあいだ（半目もり）に書く */
      var s = CH.fs(D), l0 = o.l0 || [-.3, a > 0 ? -.5 : .5], l1 = o.l1 || [.5, 0];
      if (p1 > .5) lab(D, Pl, 0, b, o.labs[0], col, { dx: l0[0] * s, dy: l0[1] * Pl.u, align: l0[0] < 0 ? 'right' : 'left', a: p1 });
      if (p3 > .5) lab(D, Pl, dx, b + dy, o.labs[1], col, { dx: l1[0] * s, dy: l1[1] * Pl.u, align: l1[0] < 0 ? 'right' : 'left', a: p3 });
    }
  }

  /* ---- 数（ikkan と同じ）と検算 ---- */
  function on(a, b, x, y) { return CH.near(a * x + b, y); }
  CH.check(on(2, -3, 0, -3) && on(2, -3, 1, -1), '今日の問い（(0, −3) と (1, −1)）');
  CH.check(on(-2 / 3, 2, 0, 2) && on(-2 / 3, 2, 3, 0) && !on(-2 / 3, 2, 2, -1), '例題（(3, 0)。右へ 2・下へ 3 はまちがい）');
  CH.check(on(.5, 2, 2, 3) && on(-2 / 3, -1, 3, -3), '練習 ③④');
  var LAT = []; for (var x = -4; x <= 5; x++) if (CH.near((x + 1) / 2, Math.round((x + 1) / 2))) LAT.push(x);
  CH.check(LAT.join() === '-3,-1,1,3,5' && on(2 / 3, -1 / 3, 2, 1) && on(2 / 3, -1 / 3, -1, -1), '考えよう（ここで確かめるだけ）');
  CH.check(on(-.75, 3, 4, 0) && 4 * 3 / 2 === 6, 'チャレンジ');

  function full(D) { return CH.box(D, { l: .1, r: .08, t: .02, b: .03 }); }
  var TH = [[.5, .5, 'ア y＝[1/2]x＋[1/2]'], [2 / 3, -1 / 3, 'イ y＝[2/3]x−[1/3]']], seen = [{}, {}];
  function fy(f, x) { var n = Math.round((f[0] * x + f[1]) * 6), g = (function h(p, q) { return q ? h(q, p % q) : p; })(Math.abs(n), 6); return n % 6 === 0 ? S(n / 6) : (n < 0 ? '−' : '') + '[' + Math.abs(n) / g + '/' + 6 / g + ']'; }

  K3.run({
    no: '第6時', title: '傾きと切片を使って、グラフをかこう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '05.html', label: '◀ 第5時' }, { href: '07.html', label: '第7時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: 'y＝2x−3 のグラフ', q: '一次関数 y＝2x−3 のグラフを、傾きと切片を使って、座標平面にかこう。どんな順に点をとれば、かけるだろう。',
        notes: ['① 自分の考え（3分）　かいた順を書こう。', '② ペアの考え（3分）'],
        draw: function (D) { var Pl = plane(D, full(D), [-4, 4], [-5, 5]); TX(D, Pl.R.x0 + CH.fs(D, .4), Pl.R.y0 + CH.fs(D, .8), 'y＝2x−3', { col: C.orange, size: CH.fs(D, 1.2), align: 'left', outline: OUT }); } },
      { tag: '今日の問い', q: 'どんな順に点をとれば、かける？', a: '① 切片の点 (0, −3)　② 右へ 1、上へ 2 で (1, −1)　③ 2点を通る直線', sub: '切片 −3 から y 軸上の点。傾き 2 から、もう1つの点。点と点を、定規で結んでのばす', dur: 7,
        b: { t: '① 切片 −3 → <b>(0, −3)</b>　② 傾き 2 → 右へ 1、上へ 2 → <b>(1, −1)</b>　③ 直線', col: C.yel },
        draw: function (D) {
          var Pl = plane(D, full(D), [-4, 4], [-5, 5]), t = D.ph ? D.t : 0, s = CH.fs(D);
          TX(D, Pl.R.x0 + CH.fs(D, .4), Pl.R.y0 + CH.fs(D, .8), 'y＝2x−3', { col: C.orange, size: CH.fs(D, 1.2), align: 'left', outline: OUT });
          if (!D.ph) return;
          draw3(D, Pl, 2, -3, 1, t, { lx: '1', ly: '2', labs: ['① (0, −3)', '② (1, −1)'] });
          if (t > .85) lab(D, Pl, 2.6, 2.2, '③', C.orange, { a: CH.smooth(.85, .95, t), dx: s * .4 });
        } },
      { tag: 'ことば', bh: 'ことば', q: '一次関数のグラフ（直線）をかく手順を、ことばでまとめよう。', a: '切片 → 傾き → 直線', sub: '① 切片 b から、y 軸上の点 (0, b) をとる　② 傾き a から、もう1つの点をとる　③ 2点を通る直線をひく', dur: 3,
        b: [{ t: '① <b>切片</b> から、y 軸上の点 (0, b) をとる', col: C.green }, { t: '② <b>傾き</b> から、もう1つの点をとる', col: C.green }, { t: '③ 2点を通る <b>直線</b> をひく', col: C.green }],
        draw: function (D) {
          var Pl = plane(D, full(D), [-4, 4], [-5, 5]), t = D.ph ? D.t : 0, s = CH.fs(D);
          draw3(D, Pl, 2, -3, 1, 1, { lx: '1', ly: '2', labs: ['(0, −3)', '(1, −1)'] });
          /* 手順の字：座標平面の右があいていれば、その外に。せまい画面では、平面の左上に小さく */
          var out = D.W - Pl.R.x1 > s * 9.5, fz = out ? s : s * .78, x0 = out ? Pl.R.x1 + s * 1.6 : Pl.X(-3.9), y0 = out ? Pl.Y(3) : Pl.Y(4.3);
          if (D.ph) ['① 切片 → (0, b)', '② 傾き → もう1点', '③ 2点を通る直線'].forEach(function (txt, i) { CH.text(D, x0, y0 + i * fz * 1.6, txt, { col: C.green, align: 'left', size: fz, a: CH.smooth(i * .25, i * .25 + .2, t), outline: OUT }); });
        } },
      { tag: '例題', bh: '例題　y＝−[2/3]x＋2', q: 'y＝−[2/3]x＋2 のグラフをかこう。切片の点 (0, 2) の次に、どのように進んで点をとる？', a: '右へ 3、下へ 2 進んだ点 (3, 0)', sub: '傾き −[2/3] は、右へ 3 進むと下へ 2 進むこと（−[2/3]×3＝−2）。分母の数だけ右へ、分子の数だけ下へ', dur: 7,
        b: { t: '傾き −[2/3] … <b>右へ 3、下へ 2</b> → (3, 0)。(0, 2) と結ぶ', col: C.pink },
        draw: function (D) {
          var Pl = plane(D, full(D), [-4, 5], [-3, 5]), t = D.ph ? D.t : 0, s = CH.fs(D);
          TX(D, Pl.R.x0 + CH.fs(D, .4), Pl.R.y0 + CH.fs(D, .8), 'y＝−[2/3]x＋2', { col: C.orange, size: CH.fs(D, 1.1), align: 'left', outline: OUT });
          if (!D.ph) { CH.pt(D, Pl, 0, 2, { col: C.yel, r: CH.fs(D, .34) }); return; }
          draw3(D, Pl, -2 / 3, 2, 3, t, { lx: '右へ 3', ly: '下へ 2', at: .35, labs: ['(0, 2)', '(3, 0)'], l1: [.4, -.4] });
        } },
      { tag: '例題', q: '③ y＝[1/2]x＋2、④ y＝−[2/3]x−1 のグラフをかこう。それぞれ、どの2点を通る？', a: '③ (0, 2) と (2, 3)　④ (0, −1) と (3, −3)', sub: '③ 傾き [1/2] … 右へ 2、上へ 1　④ 傾き −[2/3] … 右へ 3、下へ 2', dur: 8,
        b: { t: '③ (0, 2)・(2, 3)　④ (0, −1)・(3, −3)', col: C.pink },
        draw: function (D) {
          var Pl = plane(D, full(D), [-4, 4], [-4, 4]), t = D.ph ? D.t : 0, s = CH.fs(D);
          if (!D.ph) return;
          draw3(D, Pl, .5, 2, 2, CH.clamp(t / .5, 0, 1), { lx: '2', ly: '1', lcol: C.orange, labs: ['(0, 2)', '(2, 3)'], l1: [.3, .45] });
          if (t > .45) lab(D, Pl, 4, 4, '③', C.orange, { dx: s * .4, a: CH.smooth(.45, .5, t) });
          draw3(D, Pl, -2 / 3, -1, 3, CH.clamp((t - .5) / .5, 0, 1), { lx: '3', ly: '2', lcol: C.blue, labs: ['(0, −1)', '(3, −3)'] });
          if (t > .95) lab(D, Pl, 4, -11 / 3, '④', C.blue, { dx: s * .4, a: CH.smooth(.95, 1, t) });
        } },
      { tag: '考えよう', bh: '考えよう', q: 'ア y＝[1/2]x＋[1/2] のグラフをかこう。切片が整数でないので、点をとりにくい。どのようにかけばよいだろう。',
        notes: ['かき方を説明しよう。', 'イ y＝[2/3]x−[1/3] でも、同じかき方でかけるか、たしかめよう。', 'スライダーで、x の値を変えると、グラフの上の点 P が出ます。通ったあとは、うすく残ります。'],
        sliders: [{ key: 'f', label: '式', min: 0, max: 1, step: 1, val: 0, fmt: function (k) { return k ? 'イ' : 'ア'; } }, { key: 'x', label: 'P の x 座標', min: -4, max: 5, step: 1, val: 0, fmt: S }],
        draw: function (D) {
          var Pl = plane(D, full(D), [-4, 5], [-3, 4]), f = TH[D.V.f], x = D.V.x, y = f[0] * x + f[1], s = CH.fs(D), mem = seen[D.V.f];
          mem[x] = 1;
          TX(D, Pl.R.x0 + s * .4, Pl.R.y0 + s * 1, f[2], { col: C.orange, size: s * 1.1, align: 'left', outline: OUT });
          Object.keys(mem).forEach(function (k) { k = +k; if (k !== x) CH.pt(D, Pl, k, f[0] * k + f[1], { col: C.orange, r: CH.fs(D, .24), a: .45 }); });
          CH.pseg(D, Pl, [x, 0], [x, y], { col: C.yel, w: 1.6, dash: true }); CH.pseg(D, Pl, [0, y], [x, y], { col: C.yel, w: 1.6, dash: true });
          CH.pt(D, Pl, x, y, { col: C.yel, r: CH.fs(D, .36) });
          TX(D, Pl.X(x) + s * .5, Pl.Y(y) - s * 1.1, 'P(' + S(x) + ', ' + fy(f, x) + ')', { col: C.yel, size: s * .95, align: x > 2 ? 'right' : 'left', outline: OUT });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '一次関数 y＝−[3/4]x＋3 のグラフと、x 軸、y 軸で囲まれた三角形の面積を求めよう。（1目もりを 1 cm とする。）', a: '6 cm²', sub: '切片 3 から (0, 3)。右へ 4、下へ 3 で (4, 0)。底辺 4 cm、高さ 3 cm → 4×3÷2＝6', dur: 7,
        b: { t: '(0, 3)・(4, 0)　面積 4×3÷2＝<b>6 cm²</b>', col: C.orange },
        draw: function (D) {
          var Pl = plane(D, full(D), [-2, 6], [-2, 5]), t = D.ph ? D.t : 0, s = CH.fs(D);
          TX(D, Pl.R.x1 - s * .2, Pl.R.y0 + s * .9, 'y＝−[3/4]x＋3', { col: C.orange, size: CH.fs(D, 1.1), align: 'right', outline: OUT });
          if (!D.ph) return;
          if (t > .7) { var a = CH.smooth(.7, .85, t); CH.poly(D, [[Pl.X(0), Pl.Y(0)], [Pl.X(4), Pl.Y(0)], [Pl.X(0), Pl.Y(3)]], { fill: 'rgba(255,226,122,.25)', stroke: C.yel, sw: 2.4, a: a });
            CH.text(D, Pl.X(2), Pl.Y(0) + s * 1.7, '底辺 4', { col: C.yel, a: a, outline: OUT }); CH.text(D, Pl.X(0) - s * .5, Pl.Y(1.5), '高さ 3', { col: C.yel, a: a, align: 'right', outline: OUT }); }
          draw3(D, Pl, -.75, 3, 4, Math.min(1, t / .65), { lx: '右へ 4', ly: '下へ 3', at: .3, labs: ['(0, 3)', '(4, 0)'], l1: [.3, -.4] });
          if (t > .85) TX(D, Pl.R.x1 - s * .2, Pl.R.y0 + s * 2.6, '4×3÷2＝6', { col: C.yel, size: s * 1.2, align: 'right', outline: OUT, a: CH.smooth(.85, 1, t) });
        } }
    ])
  });
})();
</script>
</body>
</html>
