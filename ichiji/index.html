<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一次関数の黒板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
<style>
/* 目次：黒板に、17時間を並べる */
html,body{height:auto}
.app{height:auto;min-height:100%}
.menu{padding:.4rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.menu p.lead{margin:0;font-family:var(--f-chalk);font-weight:600;color:var(--chalk-2);font-size:1.05rem;line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:.6rem}
.list li{display:flex;flex-direction:column;gap:.3rem;padding:.65rem .9rem;border:2px solid var(--chalk-4);border-radius:12px;min-width:0}
.list li.on{border-color:var(--chalk-3);background:rgba(242,240,230,.05)}
.list .no{font-family:var(--f-chalk);font-weight:600;font-size:.9rem;color:var(--chalk-2)}
.list .ttl{font-family:var(--f-chalk);font-weight:600;font-size:1.1rem;line-height:1.45}
.list li:not(.on) .ttl{color:var(--chalk-2)}
.list .go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.15rem}
.list .soon{font-size:.85rem;color:var(--chalk-3)}
</style>
</head>
<body>
<div class="app" lang="ja">
  <div class="board">
    <header class="bar"><h1><small>中2</small>一次関数の黒板（目次）</h1><a class="btn" href="../kokuban/index.html">総目次</a></header>
    <div class="track" aria-hidden="true"></div>
    <main class="menu">
      <p class="lead">電子黒板に映して、グラフを動かしながら考える授業のページ。17時間ぶん、どの時間からでも開けます。</p>
      <ul class="list" id="list"></ul>
    </main>
  </div>
</div>
<script>
(function () {
  /* 時間ごとの題名は、ikkan の一次関数（新しい形）と同じ */
  var L = [
    ['第1時', '比例に似ているけれど、比例ではない関係を調べよう', [['01.html', 'ひらく ▶']]],
    ['第2時', '一次関数かどうかを、式の形で判断しよう', [['02.html', 'ひらく ▶']]],
    ['第3時', 'x が増えると、y はどんな割合で変わるだろう', [['03.html', 'ひらく ▶']]],
    ['第4時', '一次関数のグラフは、比例のグラフとどうちがうだろう', [['04.html', 'ひらく ▶']]],
    ['第5時', 'グラフのかたむきぐあいを、数で表そう', [['05.html', 'ひらく ▶']]],
    ['第6時', '傾きと切片を使って、グラフをかこう', [['06.html', 'ひらく ▶']]],
    ['第7時', '式とグラフのカードを合わせて、決め手を説明しよう', [['07.html', 'ひらく ▶']]],
    ['第8時', 'x の変域から、y の変域を求めよう', [['08.html', 'ひらく ▶']]],
    ['第9時', '傾きと1点から、一次関数の式を求めよう', [['09.html', 'ひらく ▶']]],
    ['第10時', '2点から、一次関数の式を求めよう', [['10.html', 'ひらく ▶']]],
    ['第11時', '2元1次方程式の解を、グラフに表そう', [['11.html', 'ひらく ▶']]],
    ['第12時', 'y＝k、x＝h のグラフをかこう', [['12.html', 'ひらく ▶']]],
    ['第13時', '連立方程式の解は、グラフのどこに現れるだろう', [['13.html', 'ひらく ▶']]],
    ['第14時', '実験の結果を一次関数とみなして、予測しよう', [['14.html', 'ひらく ▶']]],
    ['第15時', '3つの料金プランを、グラフでくらべよう', [['15.html', 'ひらく ▶']]],
    ['第16時', '図形の中を動く点がつくる面積を調べよう', [['16.html', 'ひらく ▶']]],
    ['第17時', '「一次関数」で学んだことを、整理して確かめよう', [['17.html', 'ひらく ▶']]]
  ];
  document.getElementById('list').innerHTML = L.map(function (x) {
    var on = !!x[2];
    return '<li' + (on ? ' class="on"' : '') + '><span class="no">' + x[0] + '</span><span class="ttl">' + x[1] + '</span>' +
      (on ? '<span class="go">' + x[2].map(function (l) { return '<a class="btn primary" href="' + l[0] + '">' + l[1] + '</a>'; }).join('') + '</span>' : '<span class="soon">準備中</span>') + '</li>';
  }).join('');
})();
</script>
</body>
</html>
