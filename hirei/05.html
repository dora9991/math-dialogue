<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>座標で宝さがし</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script>
/* 比例と反比例 第5時：座標を使って、かくれた宝をさがそう（ikkan の lesson_hirei_05 と同じ流れ）。
   原点から「右へ 4、上へ 1」と矢印が進んで A(4, 1)。(1, 4) は別の場所。宝さがしは、スライダーで x と y を決めると「当たり・おしい・はずれ」が出る
   （宝の場所は、このステップに入るたびに変わる。さがした点には印が残る）。x 軸・y 軸・原点・座標、点 B〜F の座標を読む（軸の上の点は片方が 0）。
   考えようは、点 P を動かすと、x 軸・y 軸・原点について対称な点 Q・R・S がついてくる。
   数値は ikkan のまま（点 A〜F、考えよう P(3, −2)、チャレンジ A(−3, −1)・B(1, −3)・C(4, 2)）。座標・答えはページの中で計算し直している。 */
(function () {
  var C = CH.C, S = CH.mnum, OUT = 'rgba(20,40,30,.92)';
  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = CH.fr(s[k]); }); if (s.notes) s.notes = s.notes.map(CH.fr); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = CH.fr(b.t); }); }); return st; }
  function co(p) { return '(' + S(p[0]) + ', ' + S(p[1]) + ')'; }

  /* ---- 数と検算 ---- */
  var PTS = { A: [4, 1], B: [-3, 3], C: [-4, -2], D: [2, -4], E: [0, 3], F: [-2, 0] }, NAMES = ['A', 'B', 'C', 'D', 'E', 'F'];
  var DIRS = { A: 'ne', B: 'nw', C: 'sw', D: 'se', E: 'ne', F: 'nw' };
  CH.check(NAMES.filter(function (n) { return PTS[n][0] === 0 || PTS[n][1] === 0; }).join() === 'E,F', '例題（軸の上の点は E と F）');
  CH.check(co(PTS.A) === '(4, 1)' && co([1, 4]) !== co(PTS.A), '(4, 1) と (1, 4) は別の点');
  function near(p, q) { return Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) === 1; }
  CH.check([[-1, 0], [1, 0], [0, 1], [0, -1]].every(function (d) { return near([2 + d[0], 3 + d[1]], [2, 3]); }) && !near([3, 4], [2, 3]), '宝さがしの「おしい」（上下左右のとなり）');
  function refl(p) { return { Q: [p[0], -p[1]], R: [-p[0], p[1]], S: [-p[0], -p[1]] }; }
  var RF = refl([3, -2]);
  CH.check(co(RF.Q) === '(3, 2)' && co(RF.R) === '(−3, −2)' && co(RF.S) === '(−3, 2)', '考えよう（ここで確かめるだけ）');
  var CA = [-3, -1], CB = [1, -3], CC = [4, 2], CD = [CA[0] + CC[0] - CB[0], CA[1] + CC[1] - CB[1]];
  CH.check(co(CD) === '(0, 4)' && CC[0] - CB[0] === CD[0] - CA[0] && CC[1] - CB[1] === CD[1] - CA[1] && CD[0] - CA[0] === 3 && CD[1] - CA[1] === 5, 'チャレンジ（D(0, 4)）');

  /* ---- 座標平面 ---- */
  function plane(D, P, xr, yr, o) { var s = CH.fs(D, .72); return CH.plane(D, CH.rect(P.x0 + s * .4, P.y0 + s * 1.6, P.x1 - s * 1.8, P.y1 - s * .4), Object.assign({ x: xr, y: yr }, o || {})); }
  function full(D, o) { return plane(D, CH.box(D, { l: .06, r: .06, t: .02, b: .03 }), [-5, 5], [-5, 5], o); }
  function dot(D, Pl, p, lab, col, o) { o = o || {}; CH.pt(D, Pl, p[0], p[1], { col: col || C.yel, r: CH.fs(D, o.r || .3), lab: lab, dir: o.dir || 'ne', a: o.a, size: CH.fs(D, o.k || .85) }); }
  function guide(D, Pl, p, col, a) {
    if (p[1] !== 0) CH.pseg(D, Pl, [p[0], 0], p, { col: col, w: 1.8, dash: [5, 5], a: a });
    if (p[0] !== 0) CH.pseg(D, Pl, [0, p[1]], p, { col: col, w: 1.8, dash: [5, 5], a: a });
  }
  /* 宝箱 */
  function chest(D, x, y, w, a) {
    var h = w * .62;
    CH.fillRect(D, x - w / 2, y - h * .2, x + w / 2, y + h * .55, { fill: '#b9773a', stroke: C.yel, sw: 2, a: a });
    CH.poly(D, [[x - w / 2, y - h * .2], [x - w * .42, y - h * .62], [x + w * .42, y - h * .62], [x + w / 2, y - h * .2]], { fill: '#d08e48', stroke: C.yel, sw: 2, a: a });
    CH.fillRect(D, x - w * .08, y - h * .3, x + w * .08, y + h * .05, { fill: C.yel, a: a });
  }
  function star(D, x, y, r, a) { var P = []; for (var i = 0; i < 10; i++) { var t = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; P.push([x + rr * Math.cos(t), y + rr * Math.sin(t)]); } CH.poly(D, P, { fill: C.yel, a: a }); }

  /* ---- 宝さがし（ステップに入るたびに、宝の場所を変える） ---- */
  var game = { V: null, T: [3, -2], seen: {} };
  function newGame(V) {
    game.V = V; game.seen = {};
    var p; do { p = [Math.floor(Math.random() * 11) - 5, Math.floor(Math.random() * 11) - 5]; } while (Math.abs(p[0]) + Math.abs(p[1]) < 2);
    game.T = p;
  }

  K3.run({
    no: '第5時', title: '座標を使って、かくれた宝をさがそう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '04.html', label: '◀ 第4時' }, { href: '06.html', label: '第6時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: '宝の場所を数で伝える', q: '宝の場所を、数だけで相手に伝えて、宝さがしをしたい。図の A の場所は、どう言えば、まちがいなく伝わるだろう。',
        notes: ['① 自分の考え（3分）　A の場所の伝え方を書こう。B〜F にも使えるか、ためそう。', '② ペアの考え（3分）　宝さがしをしよう（つぎのステップ）。'],
        draw: function (D) { var Pl = full(D); NAMES.forEach(function (n) { dot(D, Pl, PTS[n], n, n === 'A' ? C.yel : C.chalk, { dir: DIRS[n] }); }); } },
      { tag: '今日の問い', q: 'A の場所は、どう言えば、まちがいなく伝わる？', a: '「右へ 4、上へ 1」の場所 → (4, 1) と言う', sub: '横の数を先、縦の数をあとに言う。順を入れかえた (1, 4) は、別の場所になる', dur: 5,
        b: { t: 'A は 右へ 4、上へ 1 → <b>(4, 1)</b>　横の数が先、縦の数があと', col: C.yel },
        draw: function (D) {
          var Pl = full(D), t = D.ph ? D.t : 0, s = CH.fs(D);
          NAMES.forEach(function (n) { dot(D, Pl, PTS[n], n, n === 'A' ? C.yel : C.chalk, { dir: DIRS[n], a: n === 'A' || !D.ph ? 1 : .35 }); });
          if (D.ph) {
            var h = 4 * CH.ease(CH.smooth(.02, .35, t)), v = CH.ease(CH.smooth(.38, .55, t));
            CH.pseg(D, Pl, [0, 0], [h, 0], { col: C.orange, w: 4, arrow: h > .3, head: 11 });
            if (h > 2) CH.text(D, Pl.X(2), Pl.Y(0) + s * 1.7, '右へ 4', { col: C.orange, size: s, outline: OUT, a: CH.smooth(.15, .3, t) });
            if (v > 0) { CH.pseg(D, Pl, [4, 0], [4, v], { col: C.orange, w: 4, arrow: v > .3, head: 11 }); CH.text(D, Pl.X(4) + s * .5, Pl.Y(.5), '上へ 1', { col: C.orange, size: s, outline: OUT, align: 'left', a: CH.smooth(.45, .55, t) }); }
            if (t > .58) CH.text(D, Pl.X(3.6), Pl.Y(1) - s * 1.4, '(4, 1)', { col: C.yel, size: s * 1.3, outline: OUT, align: 'right', a: CH.smooth(.58, .7, t) });
            if (t > .75) { var a2 = CH.smooth(.75, .9, t); CH.pt(D, Pl, 1, 4, { col: C.pink, open: true, r: CH.fs(D, .3), a: a2 }); CH.text(D, Pl.X(1) + s * .6, Pl.Y(4) - s * .9, '(1, 4) は別の場所', { col: C.pink, size: s * .9, align: 'left', outline: OUT, a: a2 }); }
          }
        } },
      { tag: '今日の問い', bh: '宝さがし', q: '宝さがしをしよう。宝は、どこかの点にかくれている。横の数と縦の数を決めて、(横, 縦) の形で場所を言おう。',
        notes: ['答えは「当たり」「おしい（上下左右のとなり）」「はずれ」。', 'さがした点には印が残ります（× はずれ、○ おしい）。', 'スライダーで、横の数・縦の数を決めます。このステップに入るたびに、宝の場所が変わります。'],
        sliders: [{ key: 'x', label: '横の数', min: -5, max: 5, step: 1, val: 0, fmt: function (v) { return S(v); } }, { key: 'y', label: '縦の数', min: -5, max: 5, step: 1, val: 0, fmt: function (v) { return S(v); } }],
        draw: function (D) {
          if (game.V !== D.V) newGame(D.V);
          var R = CH.box(D, { l: .04, r: .04, t: .02, b: .03 }), wide = D.W > D.H * .9, s = CH.fs(D);
          var Pp = wide ? CH.rect(R.x0, R.y0, R.x0 + R.w * .7, R.y1) : CH.rect(R.x0, R.y0, R.x1, R.y1 - s * 2.6);
          var Pl = plane(D, Pp, [-5, 5], [-5, 5]), p = [D.V.x, D.V.y], hit = p[0] === game.T[0] && p[1] === game.T[1], nr = near(p, game.T);
          game.seen[p.join()] = hit ? 2 : nr ? 1 : 0;
          Object.keys(game.seen).forEach(function (k) {
            var q = k.split(',').map(Number), v = game.seen[k], px = Pl.X(q[0]), py = Pl.Y(q[1]), r = Pl.u * .18;
            if (v === 1) CH.circle(D, px, py, Pl.u * .28, { stroke: C.orange, sw: 2.4, a: .8 });
            else if (v === 0) { CH.line(D, px - r, py - r, px + r, py + r, { col: 'rgba(242,240,230,.4)', w: 2 }); CH.line(D, px + r, py - r, px - r, py + r, { col: 'rgba(242,240,230,.4)', w: 2 }); }
          });
          if (hit) { chest(D, Pl.X(p[0]), Pl.Y(p[1]), Pl.u * .9); var tt = D.now * 3; [0, 1, 2, 3].forEach(function (i) { var an = tt + i * Math.PI / 2; star(D, Pl.X(p[0]) + Math.cos(an) * Pl.u * .75, Pl.Y(p[1]) + Math.sin(an) * Pl.u * .75, Pl.u * .16); }); }
          else CH.pt(D, Pl, p[0], p[1], { col: C.blue, r: CH.fs(D, .32) });
          var msg = hit ? '当たり！' : nr ? 'おしい！' : 'はずれ', col = hit ? C.yel : nr ? C.orange : C.chalk;
          if (wide) {
            var cx = R.x0 + R.w * .86, cy = R.cy;
            CH.text(D, cx, cy - s * 2.2, co(p), { size: s * 1.5, col: C.blue, num: true });
            CH.text(D, cx, cy, msg, { size: s * 1.6, col: col });
            if (hit) CH.text(D, cx, cy + s * 2, '宝を見つけた', { size: s * .9, col: C.yel });
          } else {
            CH.text(D, R.cx - s * 3, R.y1 - s * 1.1, co(p), { size: s * 1.3, col: C.blue, num: true });
            CH.text(D, R.cx + s * 4, R.y1 - s * 1.1, msg, { size: s * 1.3, col: col });
          }
        } },
      { tag: 'ことば', bh: 'ことば', q: '横の数直線、縦の数直線、2つが交わる点を、それぞれ何という？ (4, 1) のような数の組は？', a: 'x 軸・y 軸・原点・座標', sub: '(4, 1) の 4 を x 座標、1 を y 座標という。原点 O の座標は (0, 0)', dur: 6,
        b: [{ t: '横の数直線 … <b>x 軸</b>　縦の数直線 … <b>y 軸</b>　交わる点 … <b>原点</b>（O）', col: C.green }, { t: '(4, 1) のような数の組 … <b>座標</b>　4 が <b>x 座標</b>、1 が <b>y 座標</b>', col: C.green }],
        draw: function (D) {
          var Pl = full(D), t = D.ph ? D.t : 0, s = CH.fs(D);
          dot(D, Pl, PTS.A, 'A', C.yel);
          if (!D.ph) return;
          var a1 = CH.smooth(.02, .18, t), a2 = CH.smooth(.2, .36, t), a3 = CH.smooth(.38, .52, t), a4 = CH.smooth(.56, .75, t), a5 = CH.smooth(.75, .92, t);
          CH.pseg(D, Pl, [-5, 0], [5, 0], { col: C.blue, w: 5, glow: true, a: a1 * .8 }); CH.text(D, Pl.X(-4), Pl.Y(0) - s * 1.1, 'x 軸', { col: C.blue, size: s * 1.1, outline: OUT, a: a1 });
          CH.pseg(D, Pl, [0, -5], [0, 5], { col: C.pink, w: 5, glow: true, a: a2 * .8 }); CH.text(D, Pl.X(0) - s * .7, Pl.Y(4.4), 'y 軸', { col: C.pink, size: s * 1.1, outline: OUT, align: 'right', a: a2 });
          CH.circle(D, Pl.X(0), Pl.Y(0), s * .55, { stroke: C.green, sw: 3, a: a3 }); CH.text(D, Pl.X(-.9), Pl.Y(-1.6), '原点 O (0, 0)', { col: C.green, size: s * .95, outline: OUT, align: 'right', a: a3 });
          guide(D, Pl, PTS.A, C.yel, a4);
          CH.text(D, Pl.X(4), Pl.Y(0) + s * 1.2, '4', { col: C.blue, size: s * 1.15, outline: OUT, a: a4 }); CH.text(D, Pl.X(0) - s * .6, Pl.Y(1), '1', { col: C.pink, size: s * 1.15, outline: OUT, align: 'right', a: a4 });
          CH.text(D, Pl.X(4), Pl.Y(1) - s * 1.5, 'A(4, 1)', { col: C.yel, size: s * 1.15, outline: OUT, a: a5 });
          CH.text(D, Pl.X(2.5), Pl.Y(-2), 'x 座標 4、y 座標 1', { col: C.yel, size: s * .95, outline: OUT, a: a5 });
        } },
      { tag: '例題', bh: '例題　点の座標を読む', q: '図の点 B〜F の座標を答えよう。（A は (4, 1)）', a: 'B(−3, 3)　C(−4, −2)　D(2, −4)　E(0, 3)　F(−2, 0)', sub: 'x 座標（横）を先に読む。E や F のように、軸の上の点は、片方の座標が 0', dur: 7,
        b: { t: 'B(−3, 3)　C(−4, −2)　D(2, −4)　E(<b>0</b>, 3)　F(−2, <b>0</b>)（軸の上の点は、片方が 0）', col: C.pink },
        draw: function (D) {
          var Pl = full(D), t = D.ph ? D.t : 0, s = CH.fs(D);
          if (t > .85) { var aq = CH.smooth(.85, 1, t); [[3.5, 4.4, '(＋, ＋)'], [-3.5, 4.4, '(−, ＋)'], [-3.5, -4.4, '(−, −)'], [4, -2.6, '(＋, −)']].forEach(function (q) { CH.text(D, Pl.X(q[0]), Pl.Y(q[1]), q[2], { col: C.lav, size: s * .85, a: aq, outline: OUT }); }); }
          NAMES.forEach(function (n, i) {
            var p = PTS[n], a = i === 0 ? 1 : D.ph ? CH.smooth(.02 + (i - 1) * .16, .14 + (i - 1) * .16, t) : 0;
            if (a > 0) guide(D, Pl, p, n === 'E' || n === 'F' ? C.orange : C.yel, a * .9);
            dot(D, Pl, p, a > 0 ? n + co(p) : n, n === 'E' || n === 'F' ? C.orange : a > 0 ? C.yel : C.chalk, { dir: DIRS[n], k: .8 });
          });
        } },
      { tag: '考えよう', bh: '考えよう', q: '点 P(3, −2) と、x 軸について対称な点 Q、y 軸について対称な点 R、原点について対称な点 S。Q、R、S の座標を、P の座標とくらべよう。',
        notes: ['Q、R、S の座標を読んで、P の座標の何が変わっているか調べよう。', 'ほかの点でも、同じようになるか、たしかめよう。', 'スライダーで、点 P を動かせます。'],
        sliders: [{ key: 'x', label: 'P の x 座標', min: -5, max: 5, step: 1, val: 3, fmt: function (v) { return S(v); } }, { key: 'y', label: 'P の y 座標', min: -5, max: 5, step: 1, val: -2, fmt: function (v) { return S(v); } }],
        draw: function (D) {
          var Pl = full(D), p = [D.V.x, D.V.y], F = refl(p);
          CH.pseg(D, Pl, p, F.Q, { col: C.blue, w: 1.8, dash: [6, 6], a: .7 }); CH.pseg(D, Pl, p, F.R, { col: C.pink, w: 1.8, dash: [6, 6], a: .7 }); CH.pseg(D, Pl, p, F.S, { col: C.green, w: 1.8, dash: [6, 6], a: .7 });
          function dd(q) { return (q[0] >= 0 ? 'e' : 'w'); }
          dot(D, Pl, F.Q, 'Q', C.blue, { dir: (F.Q[1] >= 0 ? 'n' : 's') + dd(F.Q) }); dot(D, Pl, F.R, 'R', C.pink, { dir: (F.R[1] >= 0 ? 'n' : 's') + dd(F.R) }); dot(D, Pl, F.S, 'S', C.green, { dir: (F.S[1] >= 0 ? 'n' : 's') + dd(F.S) });
          dot(D, Pl, p, 'P' + co(p), C.yel, { r: .34, dir: (p[1] >= 0 ? 'n' : 's') + dd(p) });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '3点 A(−3, −1)、B(1, −3)、C(4, 2) がある。四角形 ABCD が平行四辺形になるように、点 D をとる。D の座標を求めよう。',
        a: 'D(0, 4)', sub: 'B から C へは、右へ 3、上へ 5。AD は BC と平行で長さが同じだから、A から右へ 3、上へ 5 進む', dur: 7,
        b: { t: 'B → C は 右へ 3・上へ 5　A から同じだけ進んで <b>D(0, 4)</b>', col: C.orange },
        draw: function (D) {
          var Pl = full(D), t = D.ph ? D.t : 0, s = CH.fs(D);
          if (t > .8) CH.poly(D, [CA, CB, CC, CD].map(function (p) { return [Pl.X(p[0]), Pl.Y(p[1])]; }), { fill: 'rgba(255,192,120,.18)', stroke: C.orange, sw: 2.6, a: CH.smooth(.8, .95, t) });
          CH.pseg(D, Pl, CA, CB, { col: C.chalk, w: 2.6 }); CH.pseg(D, Pl, CB, CC, { col: C.chalk, w: 2.6 });
          if (D.ph) {
            var h1 = CH.smooth(.02, .2, t), v1 = CH.smooth(.2, .38, t), h2 = CH.smooth(.45, .6, t), v2 = CH.smooth(.6, .75, t);
            CH.pseg(D, Pl, CB, [CB[0] + 3 * h1, CB[1]], { col: C.pink, w: 3, arrow: h1 > .2, head: 9 });
            if (v1 > 0) CH.pseg(D, Pl, [CC[0], CB[1]], [CC[0], CB[1] + 5 * v1], { col: C.pink, w: 3, arrow: v1 > .1, head: 9 });
            if (t > .2) CH.text(D, Pl.X(2.5), Pl.Y(CB[1]) + s * 1, '右へ 3', { col: C.pink, size: s * .9, outline: OUT });
            if (t > .38) CH.text(D, Pl.X(CC[0]) + s * .5, Pl.Y(-1.6), '上へ 5', { col: C.pink, size: s * .9, outline: OUT, align: 'left' });
            if (h2 > 0) CH.pseg(D, Pl, CA, [CA[0] + 3 * h2, CA[1]], { col: C.yel, w: 3, arrow: h2 > .2, head: 9 });
            if (v2 > 0) CH.pseg(D, Pl, [CD[0], CA[1]], [CD[0], CA[1] + 5 * v2], { col: C.yel, w: 3, arrow: v2 > .1, head: 9 });
          }
          dot(D, Pl, CA, 'A', C.chalk, { dir: 'sw' }); dot(D, Pl, CB, 'B', C.chalk, { dir: 'se' }); dot(D, Pl, CC, 'C', C.chalk, { dir: 'ne' });
          if (t > .75) dot(D, Pl, CD, 'D(0, 4)', C.orange, { dir: 'nw', a: CH.smooth(.75, .85, t) });
        } }
    ])
  });
})();
</script>
