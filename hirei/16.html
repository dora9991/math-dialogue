/* 比例と反比例 第16時：「比例と反比例」で学んだことを、整理して確かめよう（ikkan の lesson_hirei_16 と同じ流れ。単元のまとめ）。

   例題②は、点 (4, −7) が x 軸・y 軸で折り返され、原点のまわりに半回転する。

(function () {
