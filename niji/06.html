          r.forEach(function (x) { if (x >= -6 && x <= 6) { CH.pt(D, Pl, x, 0, { col: C.yel, r: CH.fs(D, .3) }); glow(D, Pl, x, 0, C.yel); } });
          var res = r.length === 0 ? '解なし' : r.map(function (x) { var n = Math.round(x * 1000) / 1000; return 'x' + (Number.isInteger(n) ? '＝' + S(n) : '≒' + CH.f2(x).replace('-', '−')); }).join('、');
          lines(D, L, [{ t: eqStr(a, b, c), col: C.yel }, { t: 'x＝[−' + pn(b) + '±√{' + pn(b) + '²−4×' + pn(a) + '×' + pn(c) + '}/2×' + pn(a) + ']' }, { t: res, col: r.length ? C.yel : C.pink }], { size: s * 1.2, mid: true });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'x²＋6x＋k＝0 を、解の公式で解くと、x＝[−6±√{20}/2] になった。k の値を求めよう。また、解を、できるだけ簡単な形で表そう。', a: 'k＝4、x＝−3±√{5}', sub: '√ の中は 6²−4×1×k＝36−4k。36−4k＝20 → k＝4。x＝[−6±2√{5}/2]＝−3±√{5}', dur: 9,
        b: { t: '36−4k＝20 → <b>k＝4</b>、[−6±2√{5}/2] → <b>x＝−3±√{5}</b>', col: C.orange },
        draw: function (D) {
          var R = box(D, { t: .05, b: .05 }), t = D.ph ? D.t : 0;
          lines(D, R, [{ t: 'x＝[−6±√{6²−4×1×«k»}/2×1]', hc: C.orange }, { t: '√ の中　36−4k＝20 → k＝4', col: C.yel, a: CH.smooth(.06, .2, t) }, { t: '√{20}＝' + CH.root(20).replace(/√(\d+)/, '√{$1}') + ' → x＝[−6±2√{5}/2]', a: CH.smooth(.36, .5, t) },
            { t: '2 で約分 → x＝−3±√{5}', col: C.yel, a: CH.smooth(.62, .76, t) }, { t: '確かめ　x²＋6x＋4＝0 の解（約 −5.24、約 −0.76）', col: C.green, a: CH.smooth(.84, .96, t) }], { size: CH.fs(D, 1.2), center: true, mid: true });
        } }
    ])
  });
})();
