/* 二次方程式 第12時：「二次方程式」で学んだことを、使って確かめよう（ikkan の lesson_niji_12 と同じ流れ・単元のまとめ）。
   今日の問いは、解が x＝2 と x＝−5 になる二次方程式をつくる（数直線の 2点 → (x−2)(x＋5)＝0 → 展開・移項・2倍。x を入れて 0 の確かめ）。

   考えようは、x²−6x＋k＝0 の k をスライダーで変え、解の公式に入れた式だけを出す道具（解の個数は出さない）。チャレンジは x²＋ax−12＝0（a＝1、もう1つの解 −4）。

(function () {
  /* ======== 道具（二次方程式の黒板 第7〜12時で共通。どのページにも同じものを入れてある） ======== */

      g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = col; g.lineWidth = Math.max(1.5, s * .07); g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath();

  }
  /* 式を描く。o：align、a、col（白い字の色をかえる）、hl（0〜1：{…} の色とわくが、白から出てくる。なければ はじめから色つき） */

        notes: ['解の個数（2つ・1つ・なし）と、k の関係で、気づいたことは？', 'x^2−4x＋k＝0 でも調べて、解が 1つになる k を見つけよう。', 'スライダーで k を変えると、解の公式に入れた式が出ます（計算はしていません）。'],
