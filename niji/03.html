          CH.circle(D, X(x), R.y1 - s * 1.6, CH.fs(D, .34), { fill: z ? C.yel : C.blue, stroke: OUT, sw: 1.4 });
        } },

            { s: '(x＋3)(x−2)＝0' }, { s: 'x＝−3、x＝2', col: C.yel }], t, { size: s * 1.25, at: [.08, .3, .5, .7] });
          var w = '両辺を x＋3 でわると、x＝−3 が落ちる';
