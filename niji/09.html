<script>
/* 二次方程式 第9時：図形の問題を、二次方程式で解こう（ikkan の lesson_niji_09 と同じ流れ）。

   考えようは、縦 13m・横 19m の土地で、道のはばをスライダーで 0〜6m（1m の方眼。面積は出さない）。チャレンジは、縦の道 2本・横の道 1本の畑（3m）。

(function () {

  }
