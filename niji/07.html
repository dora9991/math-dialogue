<script>
/* 二次方程式 第7時：式の形を見て、いちばんよい解き方を選ぼう（ikkan の lesson_niji_07 と同じ流れ）。
   方程式カード A〜F が、「因数分解」「平方根の考え」「解の公式」の3つの箱へ仕分けられる。とぶ前に、決め手になる式の部分が光る

   考えようは、ア〜オの方程式で b²−4ac に a・b・c を入れた式だけを出す道具（値と、因数分解できるかは出さない）。
   チャレンジは (x−2)²＝3(x−2)：x−2 を A とおく（両辺を x−2 でわると x＝2 を落とす）。
   数値は ikkan のまま。答えは、ページの中で代入・解の公式・整数の組の全探索で計算し直している（CH.check）。 */
(function () {
  /* ======== 道具（二次方程式の黒板 第7〜12時で共通。どのページにも同じものを入れてある） ======== */
  var C = CH.C, OUT = 'rgba(20,40,30,.9)', S = CH.mnum;
  var FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', NUM = '"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif', OPS = '×÷';  /* × と ÷ は、文字の x とまぎれないよう、ゴシックの字で */

    else if (it.rad != null) {
      var g = D.ctx, L = it.x, sw = it.sw, s = it.s, yT = it.y - it.T, yB = it.y + it.B;
      g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = col; g.lineWidth = Math.max(1.5, s * .07); g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath();
      g.moveTo(L + sw * .06, it.y + s * .12); g.lineTo(L + sw * .26, it.y + s * .02); g.lineTo(L + sw * .55, yB); g.lineTo(L + sw, yT); g.lineTo(L + sw + it.rad, yT); g.stroke(); g.restore();
    }
    else if (it.t !== ' ' && it.t !== '　') CH.text(D, it.x, it.y, it.t, { size: it.s, col: col, a: a, num: it.op, w: it.op ? 400 : 600 });
  }
  /* 式を描く。o：align、a、col（白い字の色をかえる）、hl（0〜1：{…} の色とわくが、白から出てくる。なければ はじめから色つき） */

    o = o || {}; var P = put(lay(D, str, size), cx, cy, o.align), al = o.a == null ? 1 : o.a, hl = o.hl;
    if (hl != null && hl > 0) P.spans.forEach(function (sp) { rbox(D, sp.x0 - size * .05, sp.y0 - size * .02, sp.x1 + size * .05, sp.y1 + size * .02, sp.col, al * hl, { r: size * .25, w: 1.8, fa: .16 }); });
    P.items.forEach(function (it) { drawIt(D, it, al, hl != null ? (it.col === C.chalk ? o.col || null : mix(o.col || C.chalk, it.col, hl)) : (o.col && it.col === C.chalk ? o.col : null)); });
    return P;
  }
  function eqW(D, str, size) { return lay(D, str, size).w; }

    var kOut = 1 - CH.smooth(0, .4, k), kMv = CH.ease(CH.clamp((k - .2) / .6, 0, 1)), kIn = CH.smooth(.6, 1, k);

    function same(a, b) { return a.t === b.t && !a.bar === !b.bar && (a.rad == null) === (b.rad == null); }

      var m = { x: CH.lerp(a.x, b.x, e), y: CH.lerp(a.y, b.y, e), s: CH.lerp(a.s, b.s, e), t: a.t, op: a.op, bar: a.bar && b.bar ? CH.lerp(a.bar, b.bar, e) : a.bar, col: mix(a.col, b.col, e) };
      if (a.rad != null) { m.rad = b.rad != null ? CH.lerp(a.rad, b.rad, e) : a.rad; m.sw = b.sw != null ? CH.lerp(a.sw, b.sw, e) : a.sw; m.T = b.T != null ? CH.lerp(a.T, b.T, e) : a.T; m.B = b.B != null ? CH.lerp(a.B, b.B, e) : a.B; }

    abc.forEach(function (q, j) { chip(D, B.cx + (j - 1) * cw, B.y0 + s * .8, q[0], q[1], ph ? CH.smooth(0, .15, k2) : .35, Math.min(s * .8, cw / 4)); });
    STEPS(D, B.cx, B.y0 + s * 2, EXC, k2, Math.min(s * 1.2, B.w / 9), { from: 1, maxW: B.w * .98, maxH: B.h - s * 2.2, gap: 2.3, cols: [null, null, null, C.pink] });
  }
  /* ---- 考えよう：b²−4ac に a・b・c を入れた式 ---- */
  function think(D, k) {
    var R = box(D, { t: .03, b: .03 }), s = CH.fs(D), q = KAN[k], n = KAN.length, cw = R.w / n;
    if (D.W > 560) KAN.forEach(function (g, i) {
      var on = i === k, x = R.x0 + cw * (i + .5), str = g[0] + '　' + eqStr(g[1], g[2], g[3]);
      if (on) rbox(D, x - cw * .48, R.y0, x + cw * .48, R.y0 + s * 2.2, C.yel, 1, { fa: .12, w: 1.8 });
      EQ(D, x, R.y0 + s * 1.1, str, fitEq(D, str, cw * .9, s * .85), { col: on ? C.yel : 'rgba(242,240,230,.6)' });
    });
    var big = eqStr(q[1], q[2], q[3]), z = Math.min(s * 1.8, R.w / 9);
    EQ(D, R.cx, R.y0 + R.h * .34, q[0] + '　' + big, fitEq(D, q[0] + '　' + big, R.w * .9, z));
    var ab = [['a＝' + q[1], C.yel], ['b＝' + S(q[2]), C.pink], ['c＝' + S(q[3]), C.blue]], w3 = Math.min(R.w / 3.4, s * 5);
    ab.forEach(function (u, j) { chip(D, R.cx + (j - 1) * w3, R.y0 + R.h * .54, u[0], u[1], 1, Math.min(s * .95, w3 / 4)); });
    var sb = subStr(q[1], q[2], q[3]);
    EQ(D, R.cx, R.y0 + R.h * .76, sb, fitEq(D, sb, R.w * .92, s * 1.35));
  }
  /* ---- チャレンジ：x−2 を A とおく ---- */
  function chal(D, t, ph) {
    var R = box(D, { t: .03, b: .03 }), s = CH.fs(D), z = Math.min(s * 1.4, R.w / 10), y0 = R.y0 + z * 1.1;
    var k1 = ph ? CH.smooth(0, .15, t) : 0, k4 = ph ? CH.smooth(.88, 1, t) : 0;
    EQ(D, R.cx, y0, '{y|(x−2)}^2＝3{y|(x−2)}', z, { hl: k1 });
    if (k1 > 0) chip(D, R.cx, y0 + z * 1.3, 'x−2 を A とおく', C.yel, k1, s * .75);
    var list = ['{y|A}^2＝3{y|A}'].concat(CHA, ['x−2＝0、x−2＝3', 'x＝2、x＝5']);
    if (ph) STEPS(D, R.cx, y0 + z * 2.1, list, CH.smooth(.16, .86, t), z * .9, { maxW: R.w * .96, maxH: R.y1 - y0 - z * 2.1 - (k4 > 0 ? s * 2.4 : s * .4), gap: 1.7, cols: [null, null, null, null, null, C.orange], tags: [null, ['移項', C.green], ['因数分解', C.green], null, ['A を x−2 にもどす', C.green], null] });
    if (k4 > 0) {
      var yw = R.y1 - s * 1.1; rbox(D, R.x0 + R.w * .04, yw - s * .95, R.x1 - R.w * .04, yw + s * .95, C.pink, k4, { fa: .1, w: 1.8 });
      EQ(D, R.cx + s * .7, yw, '両辺を x−2 でわると　x−2＝3　x＝5 だけ（x＝2 を落とす）', fitEq(D, '両辺を x−2 でわると　x−2＝3　x＝5 だけ（x＝2 を落とす）', R.w * .8, s * .85), { a: k4, col: C.pink });
      mark(D, R.x0 + R.w * .04 + s * 1.1, yw, s * 1.1, false, k4);
    }
  }

  K3.run({
    no: '第7時', title: '式の形を見て、いちばんよい解き方を選ぼう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '06.html', label: '◀ 第6時' }, { href: '08.html', label: '第8時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: '方程式カード A〜F', q: 'A〜F の方程式を、「因数分解」「平方根の考え」「解の公式」のうち、いちばん早く解けそうな解き方に分けよう。式のどこを見て決めたか、理由も言えたら 1まいにつき 1点。',
        notes: ['① 自分の考え（3分）　カードを分けて、決め手を書こう。', '② ペアの考え（3分）　自分とちがう分け方や、迷ったカードを書こう。'],
        draw: function (D) { sortFig(D, none); } },
      { tag: '今日の問い', q: '因数分解で解くとよいのは、どのカード？ 決め手は？', a: 'A と E', sub: 'A … かけて 10、たして −7 の 2数（−2 と −5）がある → (x−2)(x−5)＝0。E … どの項にも x がある → x(x−6)＝0', dur: 4.5,
        b: { t: '因数分解 … <b>A・E</b>（かけて・たして の2数がある／x が共通）', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0; sortFig(D, function (i) { return i === 0 || i === 4 ? { hl: CH.smooth(0, .3, t), f: CH.smooth(.35, .85, t) } : none(); }); } },
      { tag: '今日の問い', q: '平方根の考えで解くとよいのは、どのカード？ 残りのカードは？', a: 'B・D は平方根の考え、C・F は解の公式', sub: 'B … x の項がない（3x^2＝60 → x^2＝20）。D … (x＋m)^2＝k の形。C・F … かけて・たして の2つの整数が見つからず、因数分解できない', dur: 6,
        b: [{ t: '平方根の考え … <b>B・D</b>（x の項がない／(x＋m)^2＝k の形）', col: C.blue }, { t: '解の公式 … <b>C・F</b>（因数分解できない）', col: C.pink }],
        draw: function (D) {
          var t = D.ph ? D.t : 0;
          sortFig(D, function (i) { if (i === 0 || i === 4) return done(); if (i === 1 || i === 3) return { hl: CH.smooth(0, .14, t), f: CH.smooth(.16, .46, t) }; return { hl: CH.smooth(.52, .66, t), f: CH.smooth(.68, .98, t) }; });
        } },
      { tag: 'ことば', bh: 'ことば', q: '3つの解き方は、それぞれ どんな形の式に使う？ どんな式にも使えるのは？', a: '平方根の考え … x^2＝k・(x＋m)^2＝k、因数分解 … AB＝0 にできる式、解の公式 … どんな式にも', sub: '解き方は、式の形を見て選ぶ。まず x の項がないか、つぎに 因数分解できるかを見る', dur: 4,
        b: [{ t: '<b>平方根</b>の考え … x^2＝k ならば x＝±√k', col: C.green }, { t: '<b>因数分解</b> … AB＝0 ならば A＝0 または B＝0', col: C.green }, { t: '<b>解の公式</b> … どんな二次方程式にも使える', col: C.green }, { t: '解き方は、式の<b>形</b>を見て選ぶ', col: C.green }],
        draw: function (D) { flow(D, D.t, D.ph); } },
      { tag: '例題', bh: '例題　選んだ解き方で解く', q: 'A・B を、選んだ解き方で解こう。　A x^2−7x＋10＝0　B 3x^2−60＝0', a: 'A x＝2、5　B x＝±2√5', sub: 'A (x−2)(x−5)＝0 → x＝2、x＝5　B 3x^2＝60 → x^2＝20 → x＝±√20＝±2√5', dur: 6,
        b: { t: 'A (x−2)(x−5)＝0 → <b>x＝2、5</b>　B x^2＝20 → <b>x＝±2√5</b>', col: C.pink },
        draw: function (D) { exAB(D, D.t, D.ph); } },
      { tag: '例題', q: 'C x^2＋5x−3＝0 を解こう。C を 解の公式で解くことにした わけは？', a: 'x＝[−5±√37/2]', sub: 'かけて −3 になる整数の組（1 と −3、−1 と 3）は、たすと −2、2 で 5 にならない → 因数分解できない。a＝1、b＝5、c＝−3 を解の公式に入れる', dur: 7,
        b: { t: 'C 因数分解できない → 解の公式 <b>x＝[−5±√37/2]</b>', col: C.pink },
        draw: function (D) { exC(D, D.t, D.ph); } },
      { tag: '考えよう', q: '因数分解できるかを、すばやく見分けるには？ ア〜オで、解の公式の根号の中の値 b^2−4ac を求め、整数を使って因数分解できるか、ためしてみよう。',
        notes: ['b^2−4ac の値と、因数分解できるかどうかの関係で、気づいたことは？', '自分で方程式をつくって、気づいたことが正しいか確かめよう。', 'スライダーで方程式を選ぶと、a・b・c を入れた式が出ます（計算はしていません）。'],
        sliders: [{ key: 'k', label: '方程式', min: 0, max: 4, step: 1, val: 0, fmt: function (v) { return KAN[v][0]; } }],
        draw: function (D) { think(D, D.V.k); } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'x の方程式 (x−2)^2＝3(x−2) の解を、すべて求めよう。', a: 'x＝2、x＝5', sub: 'x−2＝A とおくと A^2＝3A → A(A−3)＝0 → A＝0、3 → x＝2、5。両辺を x−2 でわると、x＝2 を落としてしまう', dur: 8,
        b: { t: 'x−2＝A → A(A−3)＝0 → <b>x＝2、5</b>（x−2 でわると x＝2 を落とす）', col: C.orange },
        draw: function (D) { chal(D, D.t, D.ph); } }
    ])
  });
})();
