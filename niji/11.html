/* 二次方程式 第11時：二次方程式に合う問題をつくって、解き合おう（ikkan の lesson_niji_11 と同じ流れ）。

   考えようは、x²−10x＋21＝0 を、いろいろな形に直す道具（解 3・7 の点はそのまま。場面は出さない）。チャレンジは連続する3つの自然数（3・4・5 の正方形）。

(function () {
  /* ======== 道具（二次方程式の黒板 第7〜12時で共通。どのページにも同じものを入れてある） ======== */
