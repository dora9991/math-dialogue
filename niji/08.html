/* 二次方程式 第8時：数についての問題を、二次方程式で解決しよう（ikkan の lesson_niji_08 と同じ流れ）。

   チャレンジは、十の位が一の位より 4 大きい2けたの数（x＝6 は十の位が 10 になり ✕ → 51）。

(function () {
  /* ======== 道具（二次方程式の黒板 第7〜12時で共通。どのページにも同じものを入れてある） ======== */

  }

  function eqW(D, str, size) { return lay(D, str, size).w; }
