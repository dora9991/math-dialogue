<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二次方程式の黒板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
<style>
/* 目次：黒板に、12時間を並べる */
html,body{height:auto}
.app{height:auto;min-height:100%}
.menu{padding:.4rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.menu p.lead{margin:0;font-family:var(--f-chalk);font-weight:600;color:var(--chalk-2);font-size:1.05rem;line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:.6rem}
.list li{display:flex;flex-direction:column;gap:.3rem;padding:.65rem .9rem;border:2px solid var(--chalk-4);border-radius:12px;min-width:0}
.list li.on{border-color:var(--chalk-3);background:rgba(242,240,230,.05)}
.list .no{font-family:var(--f-chalk);font-weight:600;font-size:.9rem;color:var(--chalk-2)}
.list .ttl{font-family:var(--f-chalk);font-weight:600;font-size:1.1rem;line-height:1.45}
.list li:not(.on) .ttl{color:var(--chalk-2)}
.list .go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.15rem}
.list .soon{font-size:.85rem;color:var(--chalk-3)}
</style>
</head>
<body>
<div class="app" lang="ja">
  <div class="board">
    <header class="bar"><h1><small>中3</small>二次方程式の黒板（目次）</h1></header>
    <div class="track" aria-hidden="true"></div>
    <main class="menu">
      <p class="lead">電子黒板に映して、図を動かしながら考える授業のページ。12時間ぶん、どの時間からでも開けます。</p>
      <ul class="list" id="list"></ul>
    </main>
  </div>
</div>
<script>
(function () {
  /* 時間ごとの題名は、ikkan の二次方程式と同じ */
  var L = [
    ['第1時', '2乗をふくむ方程式の解を、さがそう', [['01.html', 'ひらく ▶']]],
    ['第2時', '因数分解を使って、二次方程式を解こう', [['02.html', 'ひらく ▶']]],
    ['第3時', '式を整理してから、因数分解で解こう', [['03.html', 'ひらく ▶']]],
    ['第4時', '平方根の考えで、因数分解できない二次方程式を解こう', [['04.html', 'ひらく ▶']]],
    ['第5時', '(x＋m)²＝k の形に直して、二次方程式を解こう', [['05.html', 'ひらく ▶']]],
    ['第6時', '解の公式を使って、二次方程式を解こう', [['06.html', 'ひらく ▶']]],
    ['第7時', '式の形を見て、いちばんよい解き方を選ぼう', [['07.html', 'ひらく ▶']]],
    ['第8時', '数についての問題を、二次方程式で解決しよう', [['08.html', 'ひらく ▶']]],
    ['第9時', '図形の問題を、二次方程式で解こう', [['09.html', 'ひらく ▶']]],
    ['第10時', '動く点がつくる図形の面積を、二次方程式で調べよう', [['10.html', 'ひらく ▶']]],
    ['第11時', '二次方程式に合う問題をつくって、解き合おう', [['11.html', 'ひらく ▶']]],
    ['第12時', '「二次方程式」で学んだことを、使って確かめよう', [['12.html', 'ひらく ▶']]]
  ];
  document.getElementById('list').innerHTML = L.map(function (x) {
    var on = !!x[2];
    return '<li' + (on ? ' class="on"' : '') + '><span class="no">' + x[0] + '</span><span class="ttl">' + x[1] + '</span>' +
      (on ? '<span class="go">' + x[2].map(function (l) { return '<a class="btn primary" href="' + l[0] + '">' + l[1] + '</a>'; }).join('') + '</span>' : '<span class="soon">準備中</span>') + '</li>';
  }).join('');
})();
</script>
</body>
</html>
