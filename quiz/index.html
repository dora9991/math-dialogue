<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学小テスト・振り返り｜1年 4章 比例と反比例</title>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="quizdata.js"></script>
<style>
:root{
  --ink:#16202e;
  --ink-soft:#4a5768;
  --ai:#24467d;          /* 藍：主要アクション */
  --ai-weak:#e8eef7;
  --shu:#c8322d;         /* 朱：赤ペン */
  --shu-weak:#fbecea;
  --paper:#fcfcfa;
  --rule:#d9dfe7;
  --grid:#e6ebf1;
  --ok:#1d6b4f;
  --ok-weak:#e6f2ec;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--gothic);
  color:var(--ink);
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  line-height:1.75;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.sheet{
  background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);
  margin:20px 0 0;padding:18px 20px;
}
h1{font-family:var(--mincho);font-size:20px;font-weight:600;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--ink-soft);margin-top:4px}
.card{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.card h2{font-family:var(--mincho);font-size:16px;margin:0 0 12px;font-weight:600}
label.f{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
select,input[type=text],input[type=password],input[type=number],textarea{
  font:inherit;font-size:16px;padding:11px 12px;width:100%;
  border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;
}
input[type=text],input[type=password]{font-family:var(--mono);}
input[type=number]{font-family:var(--mono);max-width:140px}
textarea{font-family:inherit;line-height:1.6;resize:vertical;min-height:96px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:2px;border:1px solid transparent}
.btn{background:var(--ai);color:#fff;padding:13px 20px;font-weight:600;width:100%;font-size:16px}
.btn:disabled{background:#9aa6b6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ai);border-color:var(--ai);}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;font-weight:400}
.tests{display:grid;gap:8px}
.tests button{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:#fff;border:1px solid var(--rule);padding:14px 16px;text-align:left;width:100%;
}
.tests button:hover{border-color:var(--ai);background:var(--ai-weak)}
.testrow{display:flex;gap:8px;align-items:stretch}
.testrow .teststart{flex:1;min-width:0}
.testrow .rfbtn{flex:none;align-self:center;white-space:nowrap}
.tests .no{font-family:var(--mono);font-size:13px;color:var(--ai);letter-spacing:.05em}
.tests .nm{flex:1;font-size:15px}
.tests .pg{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.tests .badge{font-size:11px;font-family:var(--mono);border:1px solid var(--rule);padding:1px 7px;white-space:nowrap}

/* 出題画面 */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--rule);margin:0 -16px 0;padding:10px 16px;
  display:flex;align-items:center;gap:12px;backdrop-filter:blur(4px);
}
.bar .who{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.bar .tm{margin-left:auto;font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.bar .tm.warn{color:var(--shu)}
.prog{height:3px;background:var(--rule);margin:0 -16px}
.prog i{display:block;height:100%;background:var(--ai);width:0;transition:width .25s}

.q{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.q .head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .n{font-family:var(--mono);font-size:12px;color:#fff;background:var(--ink);padding:2px 7px;letter-spacing:.05em;flex:none}
.q .prompt{font-size:15.5px}
.q .lead{font-size:14px;color:var(--ink-soft);margin:-4px 0 12px}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.q.bonus{border-color:#c98a2b;border-top:3px solid #c98a2b;background:#fffdf7}
.q.bonus .n{background:#c98a2b}
.bonus-tag{display:inline-block;font-size:11px;font-family:var(--mono);color:#8a5a12;background:#f6e6c8;border:1px solid #e3c789;padding:1px 7px;margin-left:8px;white-space:nowrap}
.bonus-note{font-size:12px;color:#8a5a12;margin:6px 0 2px}
.r.bonusrow{background:#fffdf7;border-color:#e3c789}
.score .bonusline{font-size:12.5px;color:#8a5a12;margin-top:6px;font-weight:600}
.choices{display:grid;gap:8px;margin-top:10px}
.choices button{
  text-align:left;background:#fff;border:1px solid var(--rule);padding:12px 14px;font-size:15px;width:100%;
}
.choices button[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);box-shadow:inset 3px 0 0 var(--ai)}
.subq{display:flex;align-items:center;gap:10px;margin-top:10px}
.subq .lb{font-family:var(--mono);font-size:13px;color:var(--ink-soft);flex:none;min-width:44px}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--rule);color:var(--ink-soft);margin-left:auto;font-family:var(--mono)}

/* 方眼 */
.gridwrap{margin:10px 0 4px;text-align:center}
svg.gr{width:100%;max-width:360px;height:auto;touch-action:manipulation;cursor:crosshair;background:#fff}
svg.fig{width:100%;max-width:360px;height:auto;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chips button{
  font-family:var(--mono);font-size:14px;padding:7px 12px;background:#fff;border:1px solid var(--rule);min-width:44px;
}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.done{border-color:var(--ai);color:var(--ai)}
.chips button.done[aria-pressed=true]{background:var(--ai);color:#fff}
.counter{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:6px;text-align:center}

/* 結果 */
.score{background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);padding:22px 20px;text-align:center;margin-top:20px}
.score .big{font-family:var(--mincho);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--ink-soft)}
.r{background:#fff;border:1px solid var(--rule);padding:14px 16px;margin-top:8px;display:flex;gap:12px}
.r .mk{font-size:26px;line-height:1.2;flex:none;font-family:var(--mincho)}
.r.ok .mk{color:var(--ok)} .r.ng .mk{color:var(--shu)}
.r .body{flex:1;min-width:0}
.r .qn{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.r .txt{font-size:14px;margin:2px 0}
.r .ans{font-family:var(--mono);font-size:14px;word-break:break-all}
.r .yours{color:var(--shu)}
.r .right{color:var(--ok)}
.r .body svg{max-width:230px;margin-top:8px;display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.tools button{font-size:13px;padding:8px 12px;background:#fff;border:1px solid var(--rule);color:var(--ink)}
.tools button.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.tools button:disabled{opacity:.4;cursor:not-allowed}
.notice{border:1px solid var(--rule);background:#fff;padding:12px 14px;font-size:13px;margin-top:12px}
.notice.warn{border-color:var(--shu);background:var(--shu-weak);color:#7d211d}
.notice.ok{border-color:var(--ok);background:var(--ok-weak);color:#12503a}
.foot{display:flex;gap:8px;margin-top:16px}
.foot button{flex:1}
.hidden{display:none!important}
/* 数式キーボード */
#kb{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:#f3f5f8;border-top:1px solid var(--rule);
  padding:5px 6px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(22,32,46,.10);
}
#kb .kbhead{display:flex;align-items:center;gap:8px;padding:0 3px 4px;font-size:11px;color:var(--ink-soft)}
#kb .keys{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
#kb button{
  background:#fff;border:1px solid var(--rule);color:var(--ink);
  font-family:var(--mono);font-size:15px;line-height:1;padding:0;height:36px;
}
#kb button:active{background:var(--ai-weak);border-color:var(--ai)}
#kb button.op{color:var(--ai)}
#kb button.fn{font-family:var(--gothic);font-size:12px;background:#e9edf3}
#kb button.del{color:var(--shu);font-size:16px}
#kb button.num{font-size:16px;font-weight:600}
#kb button.var{color:var(--ai);font-style:italic}
#kb button.span3{grid-column:span 3}
#kb button.span10{grid-column:span 10}
body.kbopen{padding-bottom:230px}

/* 分数ビルダー */
#frac{display:none;align-items:center;justify-content:center;gap:14px;padding:6px 0 10px}
#frac.on{display:flex}
#kb.fracmode .keys{display:none}
.frac-stack{display:flex;flex-direction:column;align-items:center;gap:2px}
.frac-in{
  width:78px;text-align:center;font-family:var(--mono);font-size:17px;
  border:1px solid var(--rule);background:#fff;padding:5px 2px;border-radius:2px;
}
.frac-in:focus{outline:2px solid var(--ai);outline-offset:1px}
.frac-bar{width:78px;height:2px;background:var(--ink)}
#frac button{height:34px;font-size:13px;padding:0 12px;font-family:var(--gothic);background:#e9edf3;border:1px solid var(--rule)}
#frac button.go{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* お祝い演出（振り返り送信後） */
@keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-56px) scale(1.15);opacity:0}}
.doneBadge{display:block;font-size:48px;text-align:center;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
.celebrate{position:relative;height:0;max-width:320px;margin:0 auto}
.celebrate span{position:absolute;left:calc(6% + var(--i)*15%);top:0;font-size:24px;animation:floatUp 1.5s ease-out calc(var(--i)*.08s) both}

/* 暇な時間カード */
.idle-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.idle-chips button{font-family:var(--mono);font-size:15px;padding:9px 16px;background:#fff;border:1px solid var(--rule)}
.idle-chips button:active{background:var(--ai-weak);border-color:var(--ai)}
.idle-chips button.done{background:var(--ok-weak);border-color:var(--ok);color:var(--ok)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.doneBadge,.celebrate span{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="kb" class="hidden" aria-label="数式キーボード">
  <div class="kbhead"><span id="kbhint">数式キーボード</span></div>
  <div id="frac">
    <div class="frac-stack">
      <input id="frac-num" class="frac-in" inputmode="none" placeholder="分子">
      <div class="frac-bar"></div>
      <input id="frac-den" class="frac-in" inputmode="none" placeholder="分母">
    </div>
    <button type="button" id="frac-ok" class="go">✓ 挿入</button>
    <button type="button" id="frac-cancel">やめる</button>
  </div>
  <div class="keys" id="kbkeys"></div>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */
const CONFIG = {
  GRADES: [1,2,3],                    // 学年
  CLASSES: [1,2,3,4,5,6],             // 組
  CLASS_SIZE: 40,                     // 出席番号の最大
  GROUP_LETTERS: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""), // 学校コード（アルファベット側）
  GROUP_NUMBERS: Array.from({length:100},(_,i)=>i+1),     // 学校コード（数字側・1〜100）
};
const ACCOUNT_KEY    = "quiz:account_id"; // この端末に記憶するID（例：E-101236）
const ACCOUNT_PW_KEY = "quiz:account_pw"; // 「パスワードを保存する」を選んだ場合のみ、この端末に平文で記憶する
const APPLIED_BASE = "https://math-applied.pages.dev"; // 応用チャレンジ（別デプロイ・同じ回番号M1-04-xを共有）
const qs = new URLSearchParams(location.search);
const CLASS_ID = qs.get("c") || "";          // 例: ?c=1-3 （出席番号選択の学年・組を固定）
const QUIZ_ID  = qs.get("quiz") || "";       // QRコードで指定された小テストID

/* ============================================================
   保存（localStorage が使えない環境ではメモリにフォールバック）
   ============================================================ */
const store = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();

/* ============================================================
   数式キーボード
   ============================================================ */
const KB = (()=>{
  const el = document.getElementById("kb");
  const keys = document.getElementById("kbkeys");
  const hint = document.getElementById("kbhint");
  let target = null;

  const LAYOUT = [
    ["0","0","num"],["1","1","num"],["2","2","num"],["3","3","num"],["4","4","num"],
    ["5","5","num"],["6","6","num"],["7","7","num"],["8","8","num"],["9","9","num"],

    ["a","a","var"],["b","b","var"],["c","c","var"],["n","n","var"],["m","m","var"],
    ["r","r","var"],["x","x","var"],["y","y","var"],["z","z","var"],["π","π","op"],

    ["＝","=","op"],[".","."],["＋","+","op"],["−","-","op"],["×","×","op"],
    ["÷","÷","op"],["≦","≦","op"],["≧","≧","op"],["＜","<","op"],["＞",">","op"],

    ["(","(","op"],[")",")","op"],[",",",","op"],["/","/","op"],
    ["⌫","\b","fn del span3"],["閉じる",null,"fn span3"],

    ["分数","FRAC","fn span10"],
  ];

  LAYOUT.forEach(([label,ins,cls])=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=label; if(cls) b.className=cls;
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.addEventListener("click", ()=>{
      if(ins===null){ hide(); return; }
      if(ins==="FRAC"){ openFrac(); return; }
      if(ins==="\b") back(); else insert(ins);
    });
    keys.appendChild(b);
  });

  function insert(txt){
    if(!target) return;
    const s=target.selectionStart ?? target.value.length, e=target.selectionEnd ?? s;
    target.value = target.value.slice(0,s) + txt + target.value.slice(e);
    const p=s+txt.length;
    try{ target.setSelectionRange(p,p); }catch(_){}
    target.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function back(){
    if(!target) return;
    let s=target.selectionStart ?? target.value.length, e=target.selectionEnd ?? s;
    if(s===e){ if(s===0) return; s=s-1; }
    target.value = target.value.slice(0,s) + target.value.slice(e);
    try{ target.setSelectionRange(s,s); }catch(_){}
    target.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function show(input, label){
    target=input;
    hint.textContent = label ? `数式キーボード　—　${label}` : "数式キーボード";
    el.classList.remove("hidden");
    document.body.classList.add("kbopen");
    setTimeout(()=>input.scrollIntoView({block:"center",behavior:"smooth"}), 60);
  }
  function hide(){
    target=null;
    el.classList.add("hidden");
    document.body.classList.remove("kbopen");
    closeFrac();
  }

  const fracEl = document.getElementById("frac");
  const numEl = document.getElementById("frac-num");
  const denEl = document.getElementById("frac-den");
  let outerTarget = null, outerLabel = "";

  numEl.addEventListener("focus", ()=>{ target=numEl; hint.textContent="分数　—　分子"; });
  denEl.addEventListener("focus", ()=>{ target=denEl; hint.textContent="分数　—　分母"; });

  function openFrac(){
    if(!target || target===numEl || target===denEl) return;
    outerTarget = target; outerLabel = hint.textContent;
    numEl.value=""; denEl.value="";
    fracEl.classList.add("on");
    el.classList.add("fracmode");
    numEl.focus();
  }
  function closeFrac(){
    fracEl.classList.remove("on");
    el.classList.remove("fracmode");
    outerTarget=null;
  }
  document.getElementById("frac-ok").addEventListener("pointerdown", e=>e.preventDefault());
  document.getElementById("frac-ok").addEventListener("click", ()=>{
    if(!outerTarget) return;
    const n = numEl.value.trim(), d = denEl.value.trim();
    let txt = "";
    if(n && d) txt = `(${n}/${d})`;
    else if(n) txt = n;
    else { closeFrac(); return; }
    const t = outerTarget;
    const s=t.selectionStart ?? t.value.length, e2=t.selectionEnd ?? s;
    t.value = t.value.slice(0,s) + txt + t.value.slice(e2);
    const p=s+txt.length;
    try{ t.setSelectionRange(p,p); }catch(_){}
    t.dispatchEvent(new Event("input",{bubbles:true}));
    closeFrac();
    show(t, outerLabel.replace(/^数式キーボード\s*—\s*/,""));
  });
  document.getElementById("frac-cancel").addEventListener("pointerdown", e=>e.preventDefault());
  document.getElementById("frac-cancel").addEventListener("click", ()=>{
    if(outerTarget) show(outerTarget, outerLabel.replace(/^数式キーボード\s*—\s*/,""));
    else closeFrac();
  });

  return {
    hide,
    attach(input, label){
      input.setAttribute("inputmode","none");
      input.addEventListener("focus", ()=>show(input,label));
    }
  };
})();

/* ============================================================
   アカウント（学校コード＋出席番号＋パスワード）
   ============================================================ */
const loadAccountId     = () => store.get(ACCOUNT_KEY) || null;
const saveAccountId     = id => store.set(ACCOUNT_KEY, id);
const loadSavedPassword = () => store.get(ACCOUNT_PW_KEY);
const saveSavedPassword = pw => store.set(ACCOUNT_PW_KEY, pw);
const clearSavedPassword = () => store.del(ACCOUNT_PW_KEY);

/* ============================================================
   完了記録（この端末のキャッシュ。真の判定はサーバーの check_quiz で行う）
   ============================================================ */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const doneKey = (quizId,sid) => `done:${quizId}:${sid}`;
function saveDone(quizId, score, max){
  store.set(doneKey(quizId,S.sid), JSON.stringify({date:todayStr(), score, max}));
}
function loadDoneFor(quizId, sid){
  try{ return JSON.parse(store.get(doneKey(quizId,sid))||"null"); }catch(e){ return null; }
}

/* ============================================================
   状態
   ============================================================ */
let S = { test:null, sid:null, ans:{}, startedAt:0, qStart:{}, timer:null, submitted:false, practice:false };
let ACTIVE = [];         // 小テスト本体が「配布中」の quiz_id の一覧
let REFLECT_ACTIVE = []; // 振り返りだけ「配布中」の quiz_id の一覧
let waitTimer = null;  // QR待ちの自動再確認タイマー
const KEY = t => `quiz:${t}:${S.sid}`;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => { if(S.test&&S.sid&&!S.practice) store.set(KEY(S.test.id), JSON.stringify({ans:S.ans, startedAt:S.startedAt, qStart:S.qStart, date:todayStr()})); };

/* ============================================================
   ホーム画面 ／ ログイン・新規登録
   ============================================================ */
const meBox = () => document.getElementById("me");

function renderAccountCard(id){
  S.sid = id;
  meBox().innerHTML = `
    <h2>ログイン中</h2>
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <div style="font-family:var(--mono);font-size:18px;letter-spacing:.03em">${esc(id)}</div>
      <div style="font-size:14px;color:var(--ink-soft)">${esc(accountLabel(id))}</div>
      <button class="btn mini ghost" id="logout" style="margin-left:auto">ログアウト</button>
    </div>
    <div class="hint">この端末に記憶しています。</div>`;
  document.getElementById("logout").onclick=()=>{

async function tryLogin(id, pw, remember){

  let r;
  try{ r = await Quiz.rpc("quiz_login", {p_account_id:id, p_password:pw}); }
  catch(e){ renderLoginForm(id, "通信エラーです。もう一度お試しください。"); return; }
  if(r && r.ok){
    saveAccountId(id);
    if(remember) saveSavedPassword(pw); else clearSavedPassword();

/** 指定した小テスト(t)の、今日の振り返りを書く／編集する画面。t が配布中でなくなっていたら保存時に拒否される。 */
/* ---------- reflection-sheet/ と同じ簡易評価ロジック（コピー使い回し検知＋6観点チェック＋問い返し） ---------- */
const DUP_SIM_THRESHOLD = 0.85, DUP_MIN_LEN = 20, SHORT_LEN_THRESHOLD = 20;
function reflSimilarity(a,b){
  if(a===b) return 1;
  if(!a.length || !b.length) return 0;
  const bigrams = s=>{ const arr=[]; for(let i=0;i<s.length-1;i++) arr.push(s.substr(i,2)); return arr; };
  const ba=bigrams(a), bb=bigrams(b);
  if(!ba.length || !bb.length) return a===b?1:0;
  const counts={}; bb.forEach(g=>counts[g]=(counts[g]||0)+1);
  let common=0; ba.forEach(g=>{ if(counts[g]>0){ common++; counts[g]--; } });
  return (2*common)/(ba.length+bb.length);
}
function reflFindDuplicate(nowText, prevEntries){
  const now = nowText.replace(/\s/g,"");
  if(now.length < DUP_MIN_LEN) return null;
  for(const p of prevEntries){
    const prevText = (p.comment||"").replace(/\s/g,"");
    if(prevText.length < DUP_MIN_LEN) continue;
    if(reflSimilarity(now, prevText) >= DUP_SIM_THRESHOLD) return p;
  }
  return null;
}
/** comment・理解度・意欲・本人の過去の振り返り(他のquiz_id含む)から、6観点チェック＋問い返しを算出する。 */
function reflAnalyze(comment, understanding, effort, prevEntries){
  const all = comment || "";
  const e = {};
  const dup = reflFindDuplicate(all, prevEntries);
  if(dup){
    e.is_duplicate = true; e.duplicate_date = dup.date;
    e.checks = null; e.flag = false; e.good = false; e.toikaeshi = null;
    e.warning = `${dup.date}の振り返りとほぼ同じ内容です。コピーではなく、今日の授業で気づいたことを自分の言葉で書いてみましょう。`;
    return e;
  }
  e.is_duplicate = false; e.duplicate_date = null; e.warning = null;
  const tooShort = all.replace(/\s/g,"").length < SHORT_LEN_THRESHOLD;
  const checks = [];
  checks.push(all.replace(/\s/g,"").length>=15 && /[はがをにでとなら]/.test(all));
  checks.push(/(つまず|間違|ミス|わからな|できなかっ|迷っ|苦手|あいまい)/.test(all));
  checks.push(/(次は|明日|今度|練習する|復習|やり直|見直|学び直|してみる|作る|書いてくる|やってみたい)/.test(all));
  checks.push(/(？|\?|なぜ|どうして|だろう|不思議|気になる|疑問)/.test(all));
  checks.push(prevEntries.length>0 && /(前回|この前|昨日|先週|前に|決めた|言っていた|疑問が)/.test(all));
  checks.push(/(友(達|だち)に(聞い|教え)|人に(聞い|教え)|先生に(聞い|教え)|一緒に(考え|やっ|勉強)|やりやすい|考えやすい|わかりやすい|理解しやすい|式を書い|図に(かい|して)|表に(し|まとめ)|声に出し|書き出し|順番を変え|やり方を変え|工夫したら|コツが|に気づいた)/.test(all));
  e.checks = checks;
  const tooVague = !tooShort && !checks[0];
  const ckCoreCount = checks.slice(0,5).filter(Boolean).length;
  e.flag = /(むり|無理|嫌だ|つらい|しんどい|意味ない|やる気が出な|もうやだ)/.test(all)
        || (understanding===1 && all.replace(/\s/g,"").length<12);
  e.good = /(もっと(難しい|上級|発展)|人に(説明|教え)|友達に教え|挑戦したい|自分で気づいた|応用|得意)/.test(all)
        || (understanding===4 && effort>=3 && ckCoreCount>=4);
  if(tooShort) e.toikaeshi = "文字数がすこし少ないかも。今日の授業で分かったことを、もう一言足してみよう。";
  else if(tooVague) e.toikaeshi = "「わかった」をもう少しくわしく——何が、どうしてわかったのかを書いてみよう。";
  else if(!checks[1] && understanding<4) e.toikaeshi = "「難しかった」のはどの問題の、どの瞬間だった？1つだけ思い出して書いてみよう。";
  else if(!checks[2]) e.toikaeshi = "今日の気づきを、明日の自分への「ひとこと作戦」にすると何になる？";
  else if(!checks[3]) e.toikaeshi = "今日の内容で「なぜ？」と聞きたくなるところを1つ探すとしたらどこ？";
  else if(checks[5]) e.toikaeshi = "「こうしたらやりやすかった」——自分に合う学び方を見つけているね。次はどんな工夫を試したい？";
  else if(checks[4]) e.toikaeshi = "前回の自分とのつながりが書けているのが素晴らしい。次の目標を1つ挙げるなら？";
  else e.toikaeshi = "いい振り返り！このやり方がうまくいった理由は何だと思う？";
  return e;
}

function wireIdleCard(quizId){
  const box = document.getElementById(`idle-${quizId}`);
  if(!box || !S.sid) return;
  const chipsBox = document.getElementById(`study-mins-${quizId}`);
  const customEl = document.getElementById(`study-custom-${quizId}`);
  chipsBox.querySelectorAll("[data-mins]").forEach(b=>b.onclick=()=>{
    chipsBox.querySelectorAll("[data-mins]").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    customEl.value = "";
  });
  customEl.oninput = ()=>{ if(customEl.value) chipsBox.querySelectorAll("[data-mins]").forEach(x=>x.setAttribute("aria-pressed","false")); };
  document.getElementById(`study-submit-${quizId}`).onclick = async ()=>{
    const pressed = chipsBox.querySelector('[aria-pressed="true"]');
    const mins = customEl.value ? +customEl.value : (pressed ? +pressed.dataset.mins : null);
    const msgEl = document.getElementById(`study-msg-${quizId}`);
    if(!mins || mins<1){ if(msgEl) msgEl.textContent = "学習時間を選ぶか入力してください。"; return; }
    const note = document.getElementById(`study-note-${quizId}`).value;
    const btn = document.getElementById(`study-submit-${quizId}`);
    btn.disabled = true;
    try{
      const r = await Quiz.rpc("quiz_study_time_submit", {p_account_id:S.sid, p_quiz_id:quizId, p_minutes:mins, p_note:note});
      if(r && r.ok){ if(msgEl) msgEl.textContent = `${mins}分、記録したよ！`; }
      else if(msgEl) msgEl.textContent = "記録できませんでした。もう一度お試しください。";
    }catch(e){ if(msgEl) msgEl.textContent = "通信エラーです。"; }
    btn.disabled = false;
  };
  const recBtn = document.getElementById(`idle-record-${quizId}`);
  if(recBtn) recBtn.onclick = renderMyRecord;
  const gameBtn = document.getElementById(`idle-game-${quizId}`);
  if(gameBtn) gameBtn.onclick = ()=>renderConfirmQuiz();
}

/* ============================================================
   確認問題5問（数学ラボ2「はいちモード」の確認問題と同じ発想：
   5問すべて正解で合格。全レッスンの問題プールからランダムに5問出し、
   1問ずつ即採点・自動で次へ進む。サーバーには送らない、その場の腕試し用。）
   ============================================================ */
function confirmQuizPool(){
  const pool = [];
  CH.forEach(t=>{
    (t.qs||[]).forEach(q=>{
      if(q.type==="choice"){
        q.subs.forEach(s=>pool.push({no:t.no, lead:s.prompt||q.lead, type:"choice", choices:q.choices, ans:s.a}));
      } else if(q.type==="input"){
        q.subs.forEach(s=>pool.push({no:t.no, lead:s.prompt||q.lead, type:"input", mode:s.mode, ans:s.a, ph:s.ph||q.ph}));
      }
    });
  });
  return pool;
}
function renderConfirmQuiz(){
  KB.hide(); clearInterval(waitTimer);
  const ROUND = 5;
  const pool = confirmQuizPool();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const set = pool.slice(0, Math.min(ROUND, pool.length));
  let i = 0, correct = 0;
  const showQ = ()=>{
    if(i>=set.length){ finish(); return; }
    const q = set[i];
    app.innerHTML = `
      <header class="sheet">
        <h1>数学　小テスト・振り返り</h1>
        <div class="sub">🎯 確認問題　${i+1}/${set.length}問目　（${set.length}問すべて正解で合格）</div>
      </header>
      <div class="q">
        <div class="head"><span class="n">${esc(q.no)}</span><span class="prompt">${esc(q.lead||"")}</span></div>
        ${q.type==="choice"
          ? `<div class="choices">${q.choices.map((c,ci)=>`<button type="button" data-ci="${ci}">${esc(c)}</button>`).join("")}</div>`
          : `<div class="subq"><input type="text" id="cq-ans" placeholder="${esc(q.ph||"")}" autocomplete="off" spellcheck="false"></div>
             <button class="btn" id="cq-check" style="margin-top:10px;width:100%">こたえる</button>`}
        <div id="cq-fb" style="margin-top:10px"></div>
      </div>
      <div class="foot"><button class="btn ghost" id="cq-quit" style="width:100%">やめる</button></div>`;
    document.getElementById("cq-quit").onclick = renderHome;
    const fb = document.getElementById("cq-fb");
    const judge = ok=>{
      fb.innerHTML = ok
        ? `<div class="notice ok">○ 正解！</div>`
        : `<div class="notice warn">× 正解は「${esc(q.type==="choice"?q.choices[q.ans]:q.ans)}」</div>`;
      if(ok) correct++;
      i++;
      setTimeout(showQ, 900);
    };
    if(q.type==="choice"){
      app.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{
        app.querySelectorAll("[data-ci]").forEach(x=>x.disabled=true);
        judge(+b.dataset.ci === q.ans);
      });
    } else {
      const inp = document.getElementById("cq-ans");
      KB.attach(inp, q.lead||"");
      document.getElementById("cq-check").onclick = ()=>{
        document.getElementById("cq-check").disabled = true;
        judge(gradeSub(q.mode, inp.value, q.ans));
      };
    }
  };
  const finish = ()=>{
    const pass = correct===set.length;
    app.innerHTML = `
      <header class="sheet"><h1>数学　小テスト・振り返り</h1><div class="sub">🎯 確認問題・結果</div></header>
      <div class="score">
        <div class="big">${correct}<small> / ${set.length}</small></div>
        <div style="margin-top:8px">${pass ? "🎉 全問正解！合格です！" : "おしい！もう一度チャレンジしてみよう。"}</div>
      </div>
      <div class="foot"><button class="btn" id="cq-again" style="width:100%">もう一度</button></div>
      <div class="foot"><button class="btn ghost" id="cq-back" style="width:100%">もどる</button></div>`;
    document.getElementById("cq-again").onclick = renderConfirmQuiz;
    document.getElementById("cq-back").onclick = renderHome;
  };
  showQ();
}

async function renderMyRecord(){
  KB.hide();
  clearInterval(waitTimer);
  app.innerHTML = `
    <header class="sheet">
      <h1>数学　小テスト・振り返り</h1>
      <div class="sub">${esc(accountLabel(S.sid))}　・　記録</div>
    </header>

  let ra, rr;
  try{
    [ra, rr] = await Promise.all([
      Quiz.rpc("quiz_my_attempts", {p_account_id:S.sid}),

    ]);
  }catch(e){ ra=null; rr=null; }
  const attempts = (ra && Array.isArray(ra.attempts)) ? ra.attempts : [];
  const reflections = (rr && Array.isArray(rr.reflections)) ? rr.reflections : [];
  const reflByQuiz = {};
  reflections.forEach(x=>{ if(!reflByQuiz[x.quiz_id] || x.date > reflByQuiz[x.quiz_id].date) reflByQuiz[x.quiz_id]=x; });
  const attemptByQuiz = {};
  attempts.forEach(a=>{ attemptByQuiz[a.quiz_id]=a; });
  const known = [...new Set([...Object.keys(attemptByQuiz), ...Object.keys(reflByQuiz)])]
    .map(id=>CH.find(x=>x.id===id)).filter(Boolean).sort((a,b)=>a.id.localeCompare(b.id));

  if(!known.length){
    app.innerHTML = `
      <header class="sheet">
        <h1>数学　小テスト・振り返り</h1>
        <div class="sub">${esc(accountLabel(S.sid))}　・　記録</div>
      </header>
      <div class="notice">まだ記録がありません。</div>
      <div class="foot"><button class="btn" id="pr-back" style="width:100%">ホームへもどる</button></div>`;
    document.getElementById("pr-back").onclick = renderHome;
    return;
  }

  const cardHTML = t=>{
    const a = attemptByQuiz[t.id];
    const rf = reflByQuiz[t.id];
    const perfect = a && a.best_max>0 && a.best_score>=a.best_max;
    const pct = (a && a.best_max) ? Math.round(a.best_score/a.best_max*100) : null;
    let badges = "";
    if(rf){
      if(rf.is_duplicate) badges += `<span class="badge">📋 前回と似た内容</span>`;
      if(rf.flag) badges += `<span class="badge" style="border-color:var(--shu);color:var(--shu)">⚠ 要フォロー</span>`;
      if(rf.good) badges += `<span class="badge" style="border-color:var(--ok);color:var(--ok)">⭐ よくできた振り返り</span>`;
    }
    return `<div class="card">
      <h2>${esc(t.no)}　${esc(t.name)}</h2>
      ${a ? `<div style="font-size:14px">小テスト：最高 <b>${a.best_score}/${a.best_max}</b>（${pct}%）・${a.times}回挑戦</div>`
          : `<div class="hint">小テストはまだ受けていません。</div>`}
      ${rf ? `
        <div class="hint" style="margin-top:10px;margin-bottom:0">${esc(rf.date)}の振り返り　理解度${esc(rf.understanding)}・意欲${esc(rf.effort)}</div>
        ${rf.comment ? `<div class="ans" style="margin-top:4px;white-space:pre-wrap">${esc(rf.comment)}</div>` : ""}
        ${badges ? `<div style="margin-top:8px">${badges}</div>` : ""}
        ${rf.warning ? `<div class="notice warn" style="margin-top:8px">${esc(rf.warning)}</div>`
          : (rf.toikaeshi ? `<div class="notice" style="margin-top:8px">💬 ${esc(rf.toikaeshi)}</div>` : "")}
        ` : `<div class="hint" style="margin-top:10px">振り返りはまだありません。</div>`}
      ${a && !perfect ? `<button class="btn ghost" data-retry="${t.id}" style="margin-top:12px">🔁 もう一度挑戦する</button>` : ""}
      ${a && perfect ? `<div class="notice ok" style="margin-top:12px">満点です！🎉</div>` : ""}
    </div>`;
  };

  app.innerHTML = `
    <header class="sheet">
      <h1>数学　小テスト・振り返り</h1>
      <div class="sub">${esc(accountLabel(S.sid))}　・　記録</div>
    </header>

    startTest(t, {practice:true});
  });

}

/** サーバーの配布状況を取得する。小テスト（ACTIVE）と授業開始＝振り返り受付（REFLECT_ACTIVE）は独立。 */
async function fetchDistribution(){
  const [a, r] = await Promise.all([
    Quiz.rpc("quiz_list_active", {p_student:S.sid}),
    Quiz.rpc("quiz_list_reflect_active", {p_student:S.sid}),
  ]);
  return { active: Array.isArray(a) ? a : [], reflect: Array.isArray(r) ? r : [] };
}

/** 1回分のテスト行のHTML。小テストと振り返りは互いに独立（小テストが未配布でも授業開始済みなら振り返りだけ書ける）。 */
function testRowHTML(t, quizOn, reflOn){
  const d = S.sid ? loadDoneFor(t.id, S.sid) : null;

    ? `<button class="teststart" data-id="${t.id}">

/** サーバーで「配布中」の小テストを取得し、テスト選択カードを描く。 */
async function refreshTests(){
  const box = document.getElementById("teststate");
  if(!box) return;
  try{
    const d = await fetchDistribution();
    ACTIVE = d.active; REFLECT_ACTIVE = d.reflect;
  }catch(e){
    box.innerHTML = `<div class="notice warn">通信エラー：テストの状況を取得できませんでした。画面を再読み込みしてください。</div>`;
    return;
  }

  if(QUIZ_ID){
    const t = CH.find(x=>x.id===QUIZ_ID);
    if(!t){ box.innerHTML = `<div class="notice warn">指定された小テストが見つかりません。QRコードを確認してください。</div>`; return; }
    const quizOn = ACTIVE.includes(t.id), reflOn = REFLECT_ACTIVE.includes(t.id);
    if(quizOn || reflOn){
      clearInterval(waitTimer);
      box.innerHTML = `
        <h2>${esc(t.no)}　${esc(t.name)}</h2>
        <div style="display:flex;gap:8px">
          ${quizOn
            ? `<button class="btn" id="go" style="flex:1">この小テストをはじめる</button>`
            : `<div class="notice" style="flex:1">小テストは先生がまだ配布していません。</div>`}
          ${S.sid && reflOn ? `<button class="btn ghost" id="go-reflect" style="flex:none">📝 振り返り</button>` : ""}
        </div>
        ${!S.sid ? `<div class="notice warn" style="margin-top:8px">振り返りを書くには先にログインしてください。</div>` : ""}`;
      if(quizOn) document.getElementById("go").onclick=()=>startTest(t);
      if(S.sid && reflOn) document.getElementById("go-reflect").onclick=()=>renderReflectionForm(t);
    } else {
      box.innerHTML = `
        <h2>${esc(t.no)}　${esc(t.name)}</h2>
        <div class="notice">先生が開始するのを待っています…（自動で確認します）</div>
        <div id="idleSlot"></div>`;
      if(S.sid){ document.getElementById("idleSlot").innerHTML = idleCardHTML(t.id, `${t.no}　${t.name}`); wireIdleCard(t.id); }
      clearInterval(waitTimer);
      waitTimer = setInterval(async ()=>{
        try{
          const dd = await fetchDistribution();
          if(dd.active.includes(t.id)){ clearInterval(waitTimer); startTest(t); }
          else if(dd.reflect.includes(t.id)){ clearInterval(waitTimer); refreshTests(); }
        }catch(e){}
      }, 4000);
    }
    return;
  }

  const list = CH.filter(t=>ACTIVE.includes(t.id) || REFLECT_ACTIVE.includes(t.id));
  if(!list.length){
    box.innerHTML = `<div class="notice">現在受付中の小テスト・振り返りはありません。先生の指示を待つか、QRコードを読み込んでください。</div>
      <div id="idleSlot"></div>`;
    if(S.sid){ document.getElementById("idleSlot").innerHTML = idleCardHTML("unknown", "今日の学習"); wireIdleCard("unknown"); }
    return;
  }
  box.innerHTML = `
    <h2>今日の授業</h2>
    <div class="tests">
      ${list.map(t=>testRowHTML(t, ACTIVE.includes(t.id), REFLECT_ACTIVE.includes(t.id))).join("")}
    </div>`;
  box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    const t = CH.find(x=>x.id===b.dataset.id);
    startTest(t);
  });
  box.querySelectorAll("[data-reflect]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const t = CH.find(x=>x.id===b.dataset.reflect);
    renderReflectionForm(t);
  });
}

/* ============================================================
   出題
   ============================================================ */
async function safeCheck(quizId){
  try{ return await Quiz.rpc("quiz_check", {p_quiz_id:quizId, p_student:S.sid}); }
  catch(e){ alert("通信エラー：もう一度お試しください。"); return null; }
}
async function startTest(t, opts){
  const practice = !!(opts && opts.practice);
  if(!S.sid){ alert("先にログインしてください。"); return; }
  clearInterval(waitTimer);
  S.practice = practice;

  let effectiveTest = t;
  if(!practice){
    const check = await safeCheck(t.id);
    if(!check) return;
    if(check.error){ alert("エラーが発生しました。"); return; }
    if(!check.active){ alert("このテストは現在受け付けられていません。"); renderHome(); return; }
    if(check.already_today){ renderAlreadyDone(t, {score:check.score, max:check.max}); return; }
    if(check.time_limit_sec) effectiveTest = {...t, limit: check.time_limit_sec}; // 先生が設定した制限時間で上書き
  }

  S.test=effectiveTest; S.ans={}; S.submitted=false; S.qStart={};
  let resumed=false;
  if(!practice){
    const raw = store.get(KEY(t.id));
    if(raw){
      try{
        const d=JSON.parse(raw);
        if(d.date===todayStr()){
          if(confirm("前回の解答が残っています。続きから再開しますか？")){ S.ans=d.ans||{}; S.startedAt=d.startedAt; S.qStart=d.qStart||{}; resumed=true; }
        } else {
          store.del(KEY(t.id));
        }
      }catch(e){ store.del(KEY(t.id)); }
    }
  }
  if(!resumed) S.startedAt = Date.now();
  renderTest();
  tick();
  S.timer = setInterval(tick, 500);
}
function remain(){ return S.test.limit - Math.floor((Date.now()-S.startedAt)/1000); }
function tick(){
  const el=document.getElementById("tm"); if(!el) return;
  let r = remain();
  if(r<=0){ r=0; clearInterval(S.timer); if(!S.submitted) submit(true); }
  const m=String(Math.floor(r/60)).padStart(2,"0"), s=String(r%60).padStart(2,"0");
  el.textContent = `${m}:${s}`;
  el.classList.toggle("warn", r<=60);
  const p=document.getElementById("pg");
  if(p){ const {done,total}=progress(); p.style.width = (total? done/total*100:0)+"%"; }
}
function keyOf(qi,si){ return si==null? `${qi}` : `${qi}.${si}`; }
function progress(){
  let done=0,total=0;
  S.test.qs.forEach((q,qi)=>{
    if(q.type==="input"||q.type==="choice"){ q.subs.forEach((_,si)=>{ total++; const v=S.ans[keyOf(qi,si)]; if(v!==undefined&&v!==""&&v!==null) done++; }); }
    else { total++; const v=S.ans[keyOf(qi)]; if(v&&v.length) done++; }
  });
  return {done,total};
}
function touch(qi){ if(!S.qStart[qi]) S.qStart[qi]=Date.now(); }

function renderTest(){
  KB.hide();
  const t=S.test;
  app.innerHTML = `
    <div class="bar">
      <span class="who">${esc(accountLabel(S.sid))}</span>
      ${S.practice ? `<span class="badge" style="border-color:#c98a2b;color:#8a5a12">練習</span>` : ""}
      <span style="font-size:13px;color:var(--ink-soft)">${t.no} ${esc(t.name)}</span>
      <span class="tm" id="tm">--:--</span>
    </div>
    <div class="prog"><i id="pg"></i></div>
    <div id="qs"></div>
    ${S.practice
      ? `<div class="notice">これは練習（やり直し）です。結果は保存・送信されません。何度でも挑戦できます。</div>`
      : `<div class="notice">解答は入力するたびにこの端末に保存されます。送信は最後に1回だけです。</div>`}
    <div class="foot">
      <button class="btn ghost" id="back">中断してもどる</button>
      <button class="btn" id="sb">解答を提出する</button>
    </div>
  `;
  const box=document.getElementById("qs");
  t.qs.forEach((q,qi)=>box.appendChild(renderQ(q,qi)));
  if(t.bonus) box.appendChild(renderBonus(t.bonus));
  document.getElementById("sb").onclick=()=>{ const {done,total}=progress();
    if(done<total && !confirm(`未解答が ${total-done} 問あります。このまま提出しますか？`)) return; submit(false); };
  document.getElementById("back").onclick=()=>{
    const msg = S.practice ? "中断してホームにもどりますか？" : "中断してホームにもどりますか？（解答はこの端末に残ります）";
    if(confirm(msg)){ clearInterval(S.timer); renderHome(); }
  };
}

function renderQ(q,qi){
  const d=document.createElement("div"); d.className="q";
  let h=`<div class="head"><span class="n">${q.no}</span><span class="prompt">${esc(q.lead||"")}</span></div>`;
  if(q.hint) h+=`<div class="lead">${esc(q.hint)}</div>`;
  if(q.fig) h+=`<div class="gridwrap">${FIG[q.fig]()}</div>`;
  d.innerHTML=h;

  if(q.type==="choice"){
    q.subs.forEach((s,si)=>{
      const w=document.createElement("div");
      if(s.prompt) w.innerHTML=`<div style="margin-top:12px;font-size:15px"><span style="font-family:var(--mono);color:var(--ink-soft)">${s.lb}</span> ${esc(s.prompt)}</div>`;
      const c=document.createElement("div"); c.className="choices";
      q.choices.forEach((txt,ci)=>{
        const b=document.createElement("button"); b.type="button"; b.textContent=txt;
        b.setAttribute("aria-pressed", String(S.ans[keyOf(qi,si)]===ci));
        b.onclick=()=>{ touch(qi); S.ans[keyOf(qi,si)]=ci; save();
          c.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed",String(j===ci))); tick(); };
        c.appendChild(b);
      });
      w.appendChild(c); d.appendChild(w);
    });
  }
  else if(q.type==="input"){
    q.subs.forEach((s,si)=>{
      const w=document.createElement("div");
      if(s.prompt) w.innerHTML=`<div style="margin-top:12px;font-size:15px"><span style="font-family:var(--mono);color:var(--ink-soft)">${s.lb}</span> ${esc(s.prompt)}</div>`;
      const row=document.createElement("div"); row.className="subq";
      if(!s.prompt) row.innerHTML=`<span class="lb">${s.lb}</span>`;
      const inp=document.createElement("input");
      inp.type="text"; inp.placeholder=s.ph||q.ph||""; inp.autocomplete="off"; inp.spellcheck=false;
      inp.value = S.ans[keyOf(qi,si)] ?? "";
      inp.oninput=()=>{ touch(qi); S.ans[keyOf(qi,si)]=inp.value; save(); tick(); };
      KB.attach(inp, `${q.no}${s.lb?" "+s.lb:""}`);
      row.appendChild(inp); w.appendChild(row); d.appendChild(w);
    });
  }
  else if(q.type==="plot")  d.appendChild(plotUI(q,qi));
  else if(q.type==="line")  d.appendChild(lineUI(q,qi));
  else if(q.type==="hyper") d.appendChild(hyperUI(q,qi));
  return d;
}

/* ボーナス（応用）問題。基本問題を全問正解したときだけ +1 点になる。 */
function renderBonus(b){
  const d=document.createElement("div"); d.className="q bonus";
  d.innerHTML=`<div class="head"><span class="n">★</span><span class="prompt">${esc(b.lead||"")}<span class="bonus-tag">ボーナス</span></span></div>
    <div class="bonus-note">基本問題を全問正解すると、この問題の正解で ＋1点（例：4点満点なら 5/4）。</div>`;
  if(b.hint) d.innerHTML+=`<div class="hint">${esc(b.hint)}</div>`;
  const sub=b.subs[0];
  const K=keyOf("bonus",0);
  if(b.type==="choice"){
    const c=document.createElement("div"); c.className="choices";
    b.choices.forEach((txt,ci)=>{
      const btn=document.createElement("button"); btn.type="button"; btn.textContent=txt;
      btn.setAttribute("aria-pressed", String(S.ans[K]===ci));
      btn.onclick=()=>{ S.ans[K]=ci; save();
        c.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed",String(j===ci))); };
      c.appendChild(btn);
    });
    d.appendChild(c);
  } else {
    const row=document.createElement("div"); row.className="subq";

    inp.type="text"; inp.placeholder=sub.ph||b.ph||""; inp.autocomplete="off"; inp.spellcheck=false;

    KB.attach(inp,"★ ボーナス");
    row.appendChild(inp); d.appendChild(row);
  }
  return d;
}

/* --- 方眼の共通処理：SVGを1度だけ描き、.ink レイヤーだけ更新する --- */
function makeGrid(R){
  const S0=400, M=26, U=(S0-2*M)/(2*R), C=S0/2;
  const X=gx=>C+gx*U, Y=gy=>C-gy*U;
  const svgStr = gridSVG(R,{cls:"gr", extra:()=>`<g class="ink"></g>`}).svg;
  return { svgStr, X, Y, R,
    at(svg,e){
      const r=svg.getBoundingClientRect();
      return [ ((e.clientX-r.left)/r.width*S0 - C)/U, (C - (e.clientY-r.top)/r.height*S0)/U ];
    }};
}
function mountGrid(box, R){
  const g=makeGrid(R);
  const wrap=document.createElement("div"); wrap.className="gridwrap"; wrap.innerHTML=g.svgStr;
  box.appendChild(wrap);
  const svg=wrap.querySelector("svg");
  svg.style.touchAction="none";
  return {g, svg, ink:svg.querySelector(".ink")};
}
const inRange=(x,y,R)=>Math.abs(x)<=R&&Math.abs(y)<=R;

function plotUI(q,qi){
  const box=document.createElement("div");
  const st = S.ans[keyOf(qi)] ? JSON.parse(S.ans[keyOf(qi)]) : {};
  let cur = q.points.find(p=>!(p[0] in st))?.[0] || q.points[0][0];
  const {g,svg,ink} = mountGrid(box,q.R);
  const chips=document.createElement("div"); chips.className="chips";
  const tools=document.createElement("div"); tools.className="tools";

  const draw=()=>{ let s="";
    for(const k in st){ const [x,y]=st[k];
      s+=dot(g.X,g.Y,x,y,k===cur?"#24467d":"#c8322d")+`<text x="${g.X(x)+7}" y="${g.Y(y)-7}" font-size="13" font-weight="600">${k}</text>`; }
    ink.innerHTML=s;
  };
  const sync=()=>chips.querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed",String(b.dataset.k===cur));
    b.classList.toggle("done", b.dataset.k in st);
  });
  const commit=()=>{ S.ans[keyOf(qi)]=JSON.stringify(st); save(); tick(); };
  const hitAt=(x,y)=>Object.keys(st).find(k=>st[k][0]===x&&st[k][1]===y);

  let dragging=false;
  const place=e=>{
    const [fx,fy]=g.at(svg,e); const x=Math.round(fx), y=Math.round(fy);
    if(!inRange(x,y,q.R)) return;
    if(st[cur] && st[cur][0]===x && st[cur][1]===y) return;
    if(hitAt(x,y) && hitAt(x,y)!==cur) return;
    st[cur]=[x,y]; draw();
  };
  svg.addEventListener("pointerdown",e=>{
    touch(qi); e.preventDefault(); svg.setPointerCapture(e.pointerId); dragging=true;
    const [fx,fy]=g.at(svg,e); const x=Math.round(fx), y=Math.round(fy);
    const h=hitAt(x,y);
    if(h){ cur=h; sync(); draw(); return; }
    place(e);
  });
  svg.addEventListener("pointermove",e=>{ if(dragging) place(e); });
  const end=()=>{ if(!dragging) return; dragging=false; commit();
    const nx=q.points.find(p=>!(p[0] in st)); if(nx){ cur=nx[0]; sync(); draw(); } };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);

  q.points.forEach(([k,x,y])=>{
    const b=document.createElement("button"); b.type="button"; b.dataset.k=k;
    b.textContent=`${k}(${x},${y})`;
    b.onclick=()=>{ cur=k; sync(); draw(); };
    chips.appendChild(b);
  });
  const del=document.createElement("button"); del.type="button"; del.textContent="選んでいる点を消す";
  del.onclick=()=>{ delete st[cur]; commit(); sync(); draw(); };
  tools.appendChild(del);

  sync(); draw(); box.appendChild(chips); box.appendChild(tools);
  const c=document.createElement("div"); c.className="counter";
  c.textContent="ラベルを選んで方眼をタップ。そのままドラッグで動かせます。";
  box.appendChild(c);
  return box;
}

function lineUI(q,qi){
  const box=document.createElement("div");
  let pt = S.ans[keyOf(qi)] ? JSON.parse(S.ans[keyOf(qi)]) : null;
  const {g,svg,ink} = mountGrid(box,q.R);
  const c=document.createElement("div"); c.className="counter";

  const draw=()=>{
    if(!pt){ ink.innerHTML=""; return; }
    const [x,y]=pt;
    if(x===0){ ink.innerHTML=dot(g.X,g.Y,x,y); return; }
    const a=y/x, R=q.R;
    let x1=-R,y1=a*x1,x2=R,y2=a*x2;
    if(Math.abs(y1)>R){y1=Math.sign(y1)*R;x1=y1/a;}
    if(Math.abs(y2)>R){y2=Math.sign(y2)*R;x2=y2/a;}
    ink.innerHTML=`<line x1="${g.X(x1)}" y1="${g.Y(y1)}" x2="${g.X(x2)}" y2="${g.Y(y2)}" stroke="#24467d" stroke-width="2" opacity=".9"/>`+dot(g.X,g.Y,x,y);
  };
  const upd=()=>c.textContent = pt ? `通る点：(${pt[0]}, ${pt[1]})　ドラッグで動かせます` : "原点以外の格子点を1つタップ（そのままドラッグで移動）";

  let dragging=false;
  const place=e=>{
    const [fx,fy]=g.at(svg,e); const x=Math.round(fx), y=Math.round(fy);
    if(!inRange(x,y,q.R) || (x===0&&y===0)) return;
    if(pt && pt[0]===x && pt[1]===y) return;
    pt=[x,y]; draw(); upd();
  };
  svg.addEventListener("pointerdown",e=>{ touch(qi); e.preventDefault(); svg.setPointerCapture(e.pointerId); dragging=true; place(e); });
  svg.addEventListener("pointermove",e=>{ if(dragging) place(e); });
  const end=()=>{ if(!dragging) return; dragging=false;
    if(pt){ S.ans[keyOf(qi)]=JSON.stringify(pt); save(); tick(); } };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);

  draw(); upd(); box.appendChild(c);
  return box;
}

function hyperUI(q,qi){
  const box=document.createElement("div");
  let pts = readHyperPts(S.ans[keyOf(qi)], q);
  const {g,svg,ink} = mountGrid(box,q.R);
  const c=document.createElement("div"); c.className="counter";

  const draw=()=>{
    let s="";
    for(const side of ["pos","neg"]){
      const [x,y] = pts[side];
      const k = x*y, sgn = side==="pos" ? 1 : -1;
      if(isFinite(k) && Math.abs(k)>1e-9) s += hyperPath(k, q.R, g.X, g.Y, sgn);
      s += dot(g.X,g.Y,x,y,"#24467d",4.8);
    }
    ink.innerHTML=s;
  };
  const commit=()=>{ S.ans[keyOf(qi)]=JSON.stringify(pts); save(); tick(); };
  const upd=()=>{ c.textContent = "点をドラッグして、正しい位置に動かしましょう。1点で曲線が決まります。"; };

  let drag=null;
  const findNear=(x,y)=>{
    for(const side of ["pos","neg"]){
      const [px,py]=pts[side];
      if(Math.hypot(x-px,y-py) < 0.6) return side;
    }
    return null;
  };
  svg.addEventListener("pointerdown",e=>{
    touch(qi); e.preventDefault(); svg.setPointerCapture(e.pointerId);
    const [fx,fy]=g.at(svg,e);
    drag = findNear(fx,fy);
  });
  svg.addEventListener("pointermove",e=>{
    if(!drag) return;
    const [fx,fy]=g.at(svg,e); let x=Math.round(fx), y=Math.round(fy);
    if(!inRange(x,y,q.R) || x===0 || y===0) return;
    if((drag==="pos" && x<0) || (drag==="neg" && x>0)) return;
    pts[drag]=[x,y]; draw();
  });
  const end=()=>{ if(!drag) return; drag=null; commit(); draw(); upd(); };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);

  draw(); upd(); box.appendChild(c);
  return box;
}
function readHyperPts(raw, q){
  const R=q.R;
  const def = { pos:[Math.max(1,Math.round(R*0.5)),1], neg:[-Math.max(1,Math.round(R*0.5)),-1] };
  if(!raw) return def;
  try{ const v=JSON.parse(raw);
    if(v && Array.isArray(v.pos) && Array.isArray(v.neg)) return v;
    return def;
  }catch(e){ return def; }
}

/* ============================================================
   採点
   ============================================================ */
function gradeAll(){
  const rows=[]; let score=0, max=0;
  S.test.qs.forEach((q,qi)=>{
    const el = S.qStart[qi] ? Date.now()-S.qStart[qi] : 0;
    if(q.type==="choice"||q.type==="input"){
      q.subs.forEach((s,si)=>{
        const u = S.ans[keyOf(qi,si)];
        const ok = q.type==="choice" ? (u===s.a) : gradeSub(s.mode, u, s.a);
        const shown = q.type==="choice" ? (u==null?"":q.choices[u]) : (u??"");
        const right = q.type==="choice" ? q.choices[s.a] : (s.mode==="coord"?`(${s.a[0]}, ${s.a[1]})`:(s.mode==="text"?s.a[0]:String(s.a)));
        rows.push({q_no:`${q.no}${s.lb?" "+s.lb:""}`, label:s.prompt||q.lead, raw:String(shown), ok, right, score:ok?1:0, max:1, ms:el});
        score+=ok?1:0; max++;
      });
    } else if(q.type==="plot"){
      const st = S.ans[keyOf(qi)] ? JSON.parse(S.ans[keyOf(qi)]) : {};
      let s=0;
      q.points.forEach(([k,x,y])=>{ if(st[k]&&st[k][0]===x&&st[k][1]===y) s++; });
      const ok = s===q.points.length;
      const fig = gridSVG(q.R,{extra:({X,Y})=>{
        let g="";
        q.points.forEach(([k,x,y])=>{ g+=dot(X,Y,x,y,"#24467d",3.6)+`<text x="${X(x)+6}" y="${Y(y)-6}" font-size="11" fill="#24467d">${k}</text>`; });
        for(const k in st){ const [x,y]=st[k];
          const good = q.points.some(p=>p[0]===k&&p[1]===x&&p[2]===y);
          if(!good) g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="none" stroke="#c8322d" stroke-width="1.8"/><text x="${X(x)+6}" y="${Y(y)+14}" font-size="11" fill="#c8322d">${k}</text>`;
        }
        return g;
      }}).svg;
      rows.push({q_no:q.no, label:"点をかき入れる", raw:JSON.stringify(st), ok, fig,
        right:q.points.map(p=>`${p[0]}(${p[1]},${p[2]})`).join(" "), score:s, max:q.points.length, ms:el});
      score+=s; max+=q.points.length;
    } else if(q.type==="line"){
      const p = S.ans[keyOf(qi)] ? JSON.parse(S.ans[keyOf(qi)]) : null;
      const ok = !!p && !(p[0]===0&&p[1]===0) && (q.n*p[0] === q.d*p[1]);
      const fig = gridSVG(q.R,{extra:({X,Y,R})=> linePath(q.n,q.d,R,X,Y) + (p?dot(X,Y,p[0],p[1], ok?"#1d6b4f":"#c8322d"):"") }).svg;
      rows.push({q_no:q.no, label:"比例のグラフ", raw:p?`(${p[0]}, ${p[1]})`:"", ok, fig,
        right:`y=${q.d===1?q.n:`${q.n}/${q.d}`}x が通る格子点`, score:ok?1:0, max:1, ms:el});
      score+=ok?1:0; max++;
    } else if(q.type==="hyper"){
      const d = readHyperPts(S.ans[keyOf(qi)], q);
      const pts = [d.pos, d.neg];
      const s = pts.filter(([x,y])=> x!==0 && x*y===q.a).length;
      const ok = s===2;
      const fig = gridSVG(q.R,{extra:({X,Y,R})=>
        hyperPath(q.a,R,X,Y) + pts.map(([x,y])=>dot(X,Y,x,y, x*y===q.a?"#1d6b4f":"#c8322d",4.2)).join("")
      }).svg;
      rows.push({q_no:q.no, label:"反比例のグラフ", raw:pts.map(p=>`(${p[0]},${p[1]})`).join(" "), ok, fig,
        right:`xy=${q.a} をみたす格子点（正の側・負の側に1点ずつ）`, score:s, max:2, ms:el});
      score+=s; max+=2;
    }
  });

  // ボーナス（応用）問題：基本が全問正解のときだけ +1 点。max は増やさない（5/4 のような表示になる）。
  const baseScore=score, baseMax=max;
  const perfect = baseMax>0 && baseScore===baseMax;
  let bonus=null, awarded=false;
  if(S.test.bonus){
    const b=S.test.bonus, sub=b.subs[0];
    const u=S.ans[keyOf("bonus",0)];
    const ok = b.type==="choice" ? (u===sub.a) : gradeSub(sub.mode, u, sub.a);
    const shown = b.type==="choice" ? (u==null?"":b.choices[u]) : (u??"");
    const right = b.type==="choice" ? b.choices[sub.a]
      : (sub.mode==="coord" ? `(${sub.a[0]}, ${sub.a[1]})`
      : (sub.mode==="text" ? sub.a[0] : String(sub.a)));
    awarded = ok && perfect;
    bonus = {ok, raw:String(shown), right, sol:b.sol||"", lead:b.lead||""};
    rows.push({q_no:"★応用", label:b.lead, raw:String(shown), ok, right,
      score: awarded?1:0, max:0, ms:0, bonus:true, sol:b.sol||""});
    if(awarded) score += 1;
  }
  return {rows, score, max, bonus, awarded, perfect, baseScore, baseMax};
}

/* ============================================================
   提出・送信（Supabase）
   ============================================================ */
async function submit(auto){
  if(S.submitted) return;
  S.submitted=true; clearInterval(S.timer);
  const g = gradeAll();
  if(S.practice){ renderResult(g, auto, "practice"); return; }
  saveDone(S.test.id, g.score, g.max);
  renderResult(g, auto, "sending");
  const res = await send(g);
  renderResult(g, auto, res);
}
async function send(g){
  try{
    const r = await Quiz.rpc("quiz_submit", {
      p_quiz_id: S.test.id, p_student: S.sid, p_score: g.score, p_max: g.max,
      p_rows: g.rows.map(r=>({q_no:r.q_no, raw:r.raw, ok:r.ok, score:r.score, max:r.max, ms:r.ms})),
    });
    if(r.error==="already_today") return "already_today";
    if(r.error==="inactive") return "inactive";
    if(r.error) return "fail";
    store.del(KEY(S.test.id));
    return "ok";
  }catch(e){ return "fail"; }
}
function csv(rows){
  const head=["timestamp","student_id","quiz_id","q_no","raw_answer","is_correct","score","max_score","elapsed_ms"];
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const ts=new Date().toISOString();
  return "﻿"+[head.join(",")].concat(rows.map(r=>[ts,S.sid,S.test.id,r.q_no,r.raw,r.ok,r.score,r.max,r.ms].map(q).join(","))).join("\n");
}

/* ============================================================
   結果画面
   ============================================================ */
function renderResult(g, auto, state){
  KB.hide();
  const pct = g.max? Math.min(100, Math.round(g.baseScore/g.max*100)):0;
  const bonusLine = g.bonus
    ? (g.awarded
        ? `<div class="bonusline">★ ボーナス正解！ ＋1点（${g.baseScore}/${g.baseMax} → ${g.score}/${g.baseMax}）</div>`
        : (g.bonus.ok && !g.perfect
            ? `<div class="bonusline">★ ボーナスは正解。基本が全問正解なら加点でした（基本 ${g.baseScore}/${g.baseMax}）</div>`
            : (g.bonus.raw
                ? `<div class="bonusline">★ ボーナスは不正解でした</div>`
                : `<div class="bonusline">★ ボーナスは未解答でした</div>`)))
    : "";
  const banner = {
    sending:`<div class="notice">送信しています…</div>`,
    ok:`<div class="notice ok">送信しました。先生の画面に届いています。</div>`,
    already_today:`<div class="notice warn">今日はすでに提出済みでした。この結果はサーバーには保存されません。</div>`,
    inactive:`<div class="notice warn">このテストは先生によって終了されました。結果は保存されませんでした。</div>`,
    fail:`<div class="notice warn">送信できませんでした。電波を確認して「もう一度送信」を押してください。解答はこの端末に残っています。</div>`,
    practice:`<div class="notice">これは練習（やり直し）です。結果は先生には送られず、記録にも残りません。</div>`,
  }[state];

  app.innerHTML = `
    <div class="score">
      <div style="font-size:13px;color:var(--ink-soft);letter-spacing:.08em">${S.test.no}　${esc(S.test.name)}${S.practice?"　・　練習":""}</div>
      <div class="big">${g.score}<small> / ${g.max}</small></div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:6px">${pct}%　・　${esc(accountLabel(S.sid))}</div>
      ${bonusLine}
      ${auto?`<div style="font-size:12px;color:var(--shu);margin-top:8px">制限時間になったため自動で提出しました</div>`:""}
    </div>
    ${banner}
    <div id="rows"></div>
    <div class="foot">
      <button class="btn ghost" id="csv">CSVを保存</button>
      <button class="btn ghost ${state==="fail"?"":"hidden"}" id="re">もう一度送信</button>
      <button class="btn ghost ${state==="practice"?"":"hidden"}" id="retry">🔁 もう一度挑戦する</button>
      <button class="btn" id="home">ホームへ</button>
    </div>
  `;
  const box=document.getElementById("rows");
  g.rows.forEach(r=>{
    const d=document.createElement("div"); d.className="r "+(r.ok?"ok":"ng")+(r.bonus?" bonusrow":"");
    const showRight = !r.ok || r.bonus;
    d.innerHTML=`<div class="mk">${r.ok?"○":"×"}</div>
      <div class="body">
        <div class="qn">${r.bonus?"★応用（ボーナス）":esc(r.q_no)}${(!r.bonus&&r.max>1)?`　${r.score}/${r.max}`:""}</div>
        <div class="txt">${esc((r.label||"").slice(0,80))}</div>
        <div class="ans">あなた: <span class="${r.ok?"right":"yours"}">${esc(r.raw||"（無解答）")}</span></div>
        ${showRight?`<div class="ans">正解: <span class="right">${esc(r.right)}</span></div>`:""}
        ${r.fig && showRight && !r.bonus ? r.fig : ""}
        ${r.bonus && r.sol ? `<div class="hint" style="border-left:2px solid var(--rule);padding-left:10px;white-space:pre-wrap;margin-top:8px">${esc(r.sol)}</div>` : ""}
      </div>`;
    box.appendChild(d);
  });
  document.getElementById("home").onclick=()=>{ S.startedAt=0; renderHome(); };
  document.getElementById("csv").onclick=()=>{
    const b=new Blob([csv(g.rows)],{type:"text/csv"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download=`${S.test.id}_${S.sid}.csv`; a.click(); URL.revokeObjectURL(a.href);
  };
  const re=document.getElementById("re");
  if(re) re.onclick=async()=>{
    re.disabled=true; re.textContent="送信中…";
    const res=await send(g);
    renderResult(g, auto, res);
  };
  const retry=document.getElementById("retry");
  if(retry) retry.onclick=()=>{ const t=S.test; startTest(t, {practice:true}); };
}

/* ============================================================
   起動
   ============================================================ */
(function boot(){
  if(!Quiz.configReady()){
    app.innerHTML = `<div class="card"><h2>準備中です</h2><p class="hint">このアプリはまだセットアップが終わっていません（config.js に Supabase の接続情報を設定してください）。</p></div>`;
    return;
  }
  renderHome();
})();
</script>
</body>
</html>
