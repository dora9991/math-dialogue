<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学小テスト・振り返り｜1年 4章 比例と反比例</title>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="quizdata.js"></script>
<script src="appliedProblems.js"></script>
<style>
:root{
  --ink:#16202e;
  --ink-soft:#4a5768;
  --ai:#24467d;          /* 藍：主要アクション */
  --ai-weak:#e8eef7;
  --shu:#c8322d;         /* 朱：赤ペン */
  --shu-weak:#fbecea;
  --paper:#fcfcfa;
  --rule:#d9dfe7;
  --grid:#e6ebf1;
  --ok:#1d6b4f;
  --ok-weak:#e6f2ec;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--gothic);
  color:var(--ink);
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  line-height:1.75;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.sheet{
  background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);
  margin:20px 0 0;padding:18px 20px;
}
h1{font-family:var(--mincho);font-size:20px;font-weight:600;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--ink-soft);margin-top:4px}
.card{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.card h2{font-family:var(--mincho);font-size:16px;margin:0 0 12px;font-weight:600}
label.f{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
select,input[type=text],input[type=password],input[type=number],textarea{
  font:inherit;font-size:16px;padding:11px 12px;width:100%;
  border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;
}
input[type=text],input[type=password]{font-family:var(--mono);}
input[type=number]{font-family:var(--mono);max-width:140px}
textarea{font-family:inherit;line-height:1.6;resize:vertical;min-height:96px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:2px;border:1px solid transparent}
.btn{background:var(--ai);color:#fff;padding:13px 20px;font-weight:600;width:100%;font-size:16px}
.btn:disabled{background:#9aa6b6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ai);border-color:var(--ai);}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;font-weight:400}
.tests{display:grid;gap:8px}
.tests button{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:#fff;border:1px solid var(--rule);padding:14px 16px;text-align:left;width:100%;
}
.tests button:hover{border-color:var(--ai);background:var(--ai-weak)}
.testrow{display:flex;gap:8px;align-items:stretch}
.testrow .teststart{flex:1;min-width:0}
.testrow .rfbtn{flex:none;align-self:center;white-space:nowrap}
.tests .no{font-family:var(--mono);font-size:13px;color:var(--ai);letter-spacing:.05em}
.tests .nm{flex:1;font-size:15px}
.tests .pg{font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
.tests .badge{font-size:11px;font-family:var(--mono);border:1px solid var(--rule);padding:1px 7px;white-space:nowrap}

/* 出題画面 */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--rule);margin:0 -16px 0;padding:10px 16px;
  display:flex;align-items:center;gap:12px;backdrop-filter:blur(4px);
}
.bar .who{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.bar .tm{margin-left:auto;font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.bar .tm.warn{color:var(--shu)}
.prog{height:3px;background:var(--rule);margin:0 -16px}
.prog i{display:block;height:100%;background:var(--ai);width:0;transition:width .25s}

.q{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.q .head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .n{font-family:var(--mono);font-size:12px;color:#fff;background:var(--ink);padding:2px 7px;letter-spacing:.05em;flex:none}
.q .prompt{font-size:15.5px}
.q .lead{font-size:14px;color:var(--ink-soft);margin:-4px 0 12px}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.q.bonus{border-color:#c98a2b;border-top:3px solid #c98a2b;background:#fffdf7}
.q.bonus .n{background:#c98a2b}
.bonus-tag{display:inline-block;font-size:11px;font-family:var(--mono);color:#8a5a12;background:#f6e6c8;border:1px solid #e3c789;padding:1px 7px;margin-left:8px;white-space:nowrap}
.bonus-note{font-size:12px;color:#8a5a12;margin:6px 0 2px}
.r.bonusrow{background:#fffdf7;border-color:#e3c789}
.score .bonusline{font-size:12.5px;color:#8a5a12;margin-top:6px;font-weight:600}
.choices{display:grid;gap:8px;margin-top:10px}
.choices button{
  text-align:left;background:#fff;border:1px solid var(--rule);padding:12px 14px;font-size:15px;width:100%;
}
.choices button[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);box-shadow:inset 3px 0 0 var(--ai)}
.subq{display:flex;align-items:center;gap:10px;margin-top:10px}
.subq .lb{font-family:var(--mono);font-size:13px;color:var(--ink-soft);flex:none;min-width:44px}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--rule);color:var(--ink-soft);margin-left:auto;font-family:var(--mono)}

/* 方眼 */
.gridwrap{margin:10px 0 4px;text-align:center}
svg.gr{width:100%;max-width:360px;height:auto;touch-action:manipulation;cursor:crosshair;background:#fff}
svg.fig{width:100%;max-width:360px;height:auto;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chips button{
  font-family:var(--mono);font-size:14px;padding:7px 12px;background:#fff;border:1px solid var(--rule);min-width:44px;
}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.done{border-color:var(--ai);color:var(--ai)}
.chips button.done[aria-pressed=true]{background:var(--ai);color:#fff}
.counter{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:6px;text-align:center}

/* 結果 */
.score{background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);padding:22px 20px;text-align:center;margin-top:20px}
.score .big{font-family:var(--mincho);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--ink-soft)}
.r{background:#fff;border:1px solid var(--rule);padding:14px 16px;margin-top:8px;display:flex;gap:12px}
.r .mk{font-size:26px;line-height:1.2;flex:none;font-family:var(--mincho)}
.r.ok .mk{color:var(--ok)} .r.ng .mk{color:var(--shu)}
.r .body{flex:1;min-width:0}
.r .qn{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.r .txt{font-size:14px;margin:2px 0}
.r .ans{font-family:var(--mono);font-size:14px;word-break:break-all}
.r .yours{color:var(--shu)}
.r .right{color:var(--ok)}
.r .body svg{max-width:230px;margin-top:8px;display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.tools button{font-size:13px;padding:8px 12px;background:#fff;border:1px solid var(--rule);color:var(--ink)}
.tools button.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.tools button:disabled{opacity:.4;cursor:not-allowed}
.notice{border:1px solid var(--rule);background:#fff;padding:12px 14px;font-size:13px;margin-top:12px}
.notice.warn{border-color:var(--shu);background:var(--shu-weak);color:#7d211d}
.notice.ok{border-color:var(--ok);background:var(--ok-weak);color:#12503a}
.foot{display:flex;gap:8px;margin-top:16px}
.foot button{flex:1}
.hidden{display:none!important}

/* 出題画面：問題＋手書きメモの2カラム */
.testWide{width:100vw;position:relative;left:50%;transform:translateX(-50%);max-width:1320px;padding:0 16px 96px}
.testLayout{display:flex;gap:20px;align-items:flex-start}
.testLayout.swapped{flex-direction:row-reverse}
.qCol{flex:1 1 52%;min-width:0}
.scratchCol{flex:1 1 48%;min-width:0;position:sticky;top:64px}
.scratchHead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:14px 0 6px}
.scratchCanvasWrap{background:#fff;border:1px solid var(--rule)}
#scratchCanvas{display:block;width:100%;height:min(72vh,640px);touch-action:none;cursor:crosshair}
.scratchToolbar{
  position:fixed;z-index:30;display:flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--rule);border-radius:4px;padding:6px;
  box-shadow:0 3px 14px rgba(22,32,46,.16);
}
.scratchToolbar .grip{cursor:grab;padding:4px 6px;color:var(--ink-soft);font-size:15px;user-select:none;touch-action:none}
.scratchToolbar .grip:active{cursor:grabbing}
.scratchToolbar button{font-size:13px;padding:7px 10px;background:#fff;border:1px solid var(--rule);white-space:nowrap}
.scratchToolbar button[aria-pressed=true]{background:var(--ai);border-color:var(--ai);color:#fff}
.scratchToolbar button:disabled{opacity:.4;cursor:not-allowed}
.scratchToolbar .sep{width:1px;align-self:stretch;background:var(--rule);margin:0 2px}
@media (max-width:860px){
  .testLayout,.testLayout.swapped{flex-direction:column}
  .scratchCol{position:static;width:100%}
  #scratchCanvas{height:340px}
}

/* 数字・文字式・関数の3キーボード共通パーツ */
.mathx{font-family:"Times New Roman","Hiragino Mincho ProN",Georgia,serif;font-style:italic;font-weight:400}
.funcKB-form{display:flex;flex-direction:column;gap:6px;flex:none;width:112px}
.funcKB-formBtn{width:100%;background:#fff;border:1px solid var(--rule);padding:10px 4px;font-size:15px;font-family:var(--mincho)}
.funcKB-formBtn[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.funcKB-preview{
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:2px;
  font-family:var(--mincho);font-size:24px;background:#fff;border:1px solid var(--rule);padding:8px;
}
.funcKB-hint{font-size:13px;color:var(--ink-soft);font-family:var(--gothic)}
.funcKB-minus{margin-right:2px}
.fracStack{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;margin:0 2px;vertical-align:middle}
.fracStack .fracNum,.fracStack .fracDen{padding:0 4px}
.fracStack .fracBar{display:block;width:100%;height:0;border-top:2px solid var(--ink);margin:1px 0}

/* 出題画面内の、タップすると下からキーボードが出てくる入力欄 */
.mkb3-field{
  display:inline-flex;align-items:center;gap:2px;min-height:42px;min-width:64px;
  border:1px solid var(--rule);background:#fff;padding:6px 12px;cursor:pointer;
  font-family:var(--mincho);font-size:18px;
}
.mkb3-field.placeholder{color:var(--ink-soft);font-size:13px;font-family:var(--gothic)}
.mkb3-field:hover{border-color:var(--ai)}
body.mkb3open{padding-bottom:250px}

/* 下部ドック：数字／文字式／関数キーボード */
#mkb3{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:#f3f5f8;border-top:1px solid var(--rule);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(22,32,46,.10);
}
#mkb3 .mkb3-head{display:flex;align-items:center;gap:8px;padding:0 2px 6px;font-size:12px;color:var(--ink-soft)}
#mkb3 .mkb3-head button{margin-left:auto;font-size:12px;padding:5px 12px;background:#fff;border:1px solid var(--rule)}
.mkb3-panel{display:none;gap:14px;align-items:flex-start;max-width:520px;margin:0 auto}
.mkb3-panel.on{display:flex}
.mkb3-pad{display:grid;grid-template-columns:repeat(3,42px);grid-auto-rows:36px;gap:4px;flex:none}
.mkb3-pad button{font-family:var(--mono);font-size:15px;background:#fff;border:1px solid var(--rule);padding:0;line-height:1}
.mkb3-pad button:active{background:var(--ai-weak);border-color:var(--ai)}

/* 数字キーボード右側（分数） */
.mkb3-numRight{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.mkb3-fracLabel{font-size:12px;color:var(--ink-soft);align-self:flex-start}
.mkb3-fracRow{display:flex;flex-direction:column;align-items:center;gap:0}
.mkb3-fracSlot{
  width:96px;padding:8px;font-family:var(--mono);font-size:18px;background:#fff;
  border:1px solid var(--rule);
}
.mkb3-fracSlot[aria-pressed=true]{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.mkb3-fracDiv{width:96px;height:2px;background:var(--ink);margin:2px 0}
.mkb3-numRight .btn{width:100%}

/* 文字式キーボード（数字パッド＋記号グリッド＋分数ボタン） */
.mkb3-sym{display:grid;grid-template-columns:repeat(5,38px);grid-auto-rows:36px;gap:4px;flex:none}
.mkb3-sym button{font-family:var(--mono);font-size:14px;background:#fff;border:1px solid var(--rule);padding:0}
.mkb3-sym button.var{color:var(--ai);font-style:italic}
.mkb3-sym button.op{color:var(--ai)}
.mkb3-sym button:active{background:var(--ai-weak);border-color:var(--ai)}
.mkb3-fracBtn{align-self:stretch;width:64px;font-family:var(--gothic);font-size:13px;background:#e9edf3;border:1px solid var(--rule)}

/* 関数キーボード（左＝式を選ぶ、右＝数字入力） */
.mkb3-funcRight{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mkb3-funcRight .btn{width:100%}

/* 文字式キーボードの分数挿入ポップアップ */
#mkb3-fracPopup{
  position:fixed;left:50%;bottom:220px;transform:translateX(-50%);z-index:61;
  background:#fff;border:1px solid var(--rule);box-shadow:0 6px 20px rgba(22,32,46,.18);
  padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;
}
#mkb3-fracPopup .btnrow{display:flex;gap:6px;width:100%}
#mkb3-fracPopup .btnrow button{flex:1}
@media (max-width:460px){ .mkb3-panel{flex-direction:column;align-items:center} .mkb3-pad,.mkb3-sym{margin:0 auto} }
/* 数式キーボード */
#kb{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:#f3f5f8;border-top:1px solid var(--rule);
  padding:5px 6px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(22,32,46,.10);
}
#kb .kbhead{display:flex;align-items:center;gap:8px;padding:0 3px 4px;font-size:11px;color:var(--ink-soft)}
#kb .keys{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
#kb button{
  background:#fff;border:1px solid var(--rule);color:var(--ink);
  font-family:var(--mono);font-size:15px;line-height:1;padding:0;height:36px;
}
#kb button:active{background:var(--ai-weak);border-color:var(--ai)}
#kb button.op{color:var(--ai)}
#kb button.fn{font-family:var(--gothic);font-size:12px;background:#e9edf3}
#kb button.del{color:var(--shu);font-size:16px}
#kb button.num{font-size:16px;font-weight:600}
#kb button.var{color:var(--ai);font-style:italic}
#kb button.span3{grid-column:span 3}
#kb button.span10{grid-column:span 10}
body.kbopen{padding-bottom:230px}

/* 分数ビルダー */
#frac{display:none;align-items:center;justify-content:center;gap:14px;padding:6px 0 10px}
#frac.on{display:flex}
#kb.fracmode .keys{display:none}
.frac-stack{display:flex;flex-direction:column;align-items:center;gap:2px}
.frac-in{
  width:78px;text-align:center;font-family:var(--mono);font-size:17px;
  border:1px solid var(--rule);background:#fff;padding:5px 2px;border-radius:2px;
}
.frac-in:focus{outline:2px solid var(--ai);outline-offset:1px}
.frac-bar{width:78px;height:2px;background:var(--ink)}
#frac button{height:34px;font-size:13px;padding:0 12px;font-family:var(--gothic);background:#e9edf3;border:1px solid var(--rule)}
#frac button.go{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* お祝い演出（振り返り送信後） */
@keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-56px) scale(1.15);opacity:0}}
.doneBadge{display:block;font-size:48px;text-align:center;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
.celebrate{position:relative;height:0;max-width:320px;margin:0 auto}
.celebrate span{position:absolute;left:calc(6% + var(--i)*15%);top:0;font-size:24px;animation:floatUp 1.5s ease-out calc(var(--i)*.08s) both}

/* 暇な時間カード */
.idle-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.idle-chips button{font-family:var(--mono);font-size:15px;padding:9px 16px;background:#fff;border:1px solid var(--rule)}
.idle-chips button:active{background:var(--ai-weak);border-color:var(--ai)}
.idle-chips button[aria-pressed=true]{background:var(--ai);border-color:var(--ai);color:#fff}
.idle-chips button.done{background:var(--ok-weak);border-color:var(--ok);color:var(--ok)}

/* 60秒計算チャレンジ：押し合いバトル */
.duel-track{position:relative;height:64px;margin:4px 0 14px;border:1px solid var(--rule);border-radius:8px;
  background:linear-gradient(90deg,var(--ai-weak),#fff 55%,var(--shu-weak));overflow:hidden}
.duel-track.danger{background:linear-gradient(90deg,var(--ai-weak),#fff 30%,var(--shu-weak))}
.duel-player{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:30px;z-index:2}
.duel-enemy{position:absolute;top:50%;font-size:30px;transform:translateY(-50%);
  transition:left .35s cubic-bezier(.34,1.56,.64,1);will-change:left;z-index:1}
.duel-enemy.knock{animation:duelKnock .35s ease}
.duel-enemy.spawn{animation:duelSpawn .5s ease}
@keyframes duelKnock{0%{transform:translateY(-50%) scale(1.22) rotate(-10deg)}100%{transform:translateY(-50%) scale(1) rotate(0)}}
@keyframes duelSpawn{0%{transform:translate(0,-58px) scale(.5);opacity:0}100%{transform:translateY(-50%) scale(1);opacity:1}}
.duel-impact{position:absolute;top:50%;font-size:22px;transform:translate(-50%,-50%);animation:duelImpactFade .5s ease forwards;pointer-events:none;z-index:3}
@keyframes duelImpactFade{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.doneBadge,.celebrate span,.duel-enemy.knock,.duel-enemy.spawn,.duel-impact{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="kb" class="hidden" aria-label="数式キーボード">
  <div class="kbhead"><span id="kbhint">数式キーボード</span></div>
  <div id="frac">
    <div class="frac-stack">
      <input id="frac-num" class="frac-in" inputmode="none" placeholder="分子">
      <div class="frac-bar"></div>
      <input id="frac-den" class="frac-in" inputmode="none" placeholder="分母">
    </div>
    <button type="button" id="frac-ok" class="go">✓ 挿入</button>
    <button type="button" id="frac-cancel">やめる</button>
  </div>
  <div class="keys" id="kbkeys"></div>
</div>

<div id="mkb3" class="hidden" aria-label="回答用キーボード">
  <div class="mkb3-head"><span id="mkb3hint"></span><button type="button" id="mkb3-close">閉じる</button></div>

  <!-- 数字キーボード -->
  <div id="mkb3-num" class="mkb3-panel">
    <div class="mkb3-pad" id="numPad"></div>
    <div class="mkb3-numRight">
      <div class="mkb3-fracLabel">分数</div>
      <div class="mkb3-fracRow">
        <button type="button" class="mkb3-fracSlot" id="numSlotN">◻</button>
        <div class="mkb3-fracDiv"></div>
        <button type="button" class="mkb3-fracSlot" id="numSlotD">◻</button>
      </div>
      <button type="button" class="btn" id="numOk" disabled>確定</button>

  <!-- 文字式キーボード -->
  <div id="mkb3-expr" class="mkb3-panel">

  <!-- 関数キーボード -->
  <div id="mkb3-func" class="mkb3-panel">
    <div class="funcKB-form">
      <button type="button" class="funcKB-formBtn" data-form="prop">y = a<i class="mathx">x</i></button>
      <button type="button" class="funcKB-formBtn" data-form="inv">y = a/<i class="mathx">x</i></button>
    </div>
    <div class="mkb3-funcRight">

<div id="mkb3-fracPopup" class="hidden">

<script>
/* ============================================================
   設定
   ============================================================ */
const CONFIG = {
  GRADES: [1,2,3],                    // 学年
  CLASSES: [1,2,3,4,5,6],             // 組
  CLASS_SIZE: 40,                     // 出席番号の最大
  GROUP_LETTERS: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""), // 学校コード（アルファベット側）
  GROUP_NUMBERS: Array.from({length:100},(_,i)=>i+1),     // 学校コード（数字側・1〜100）
};
const ACCOUNT_KEY    = "quiz:account_id"; // この端末に記憶するID（例：E-101236）
const ACCOUNT_PW_KEY = "quiz:account_pw"; // 「パスワードを保存する」を選んだ場合のみ、この端末に平文で記憶する
const APPLIED_BASE = "https://math-applied.pages.dev"; // 応用チャレンジ（別デプロイ・同じ回番号M1-04-xを共有）
const qs = new URLSearchParams(location.search);
const CLASS_ID = qs.get("c") || "";          // 例: ?c=1-3 （出席番号選択の学年・組を固定）
const QUIZ_ID  = qs.get("quiz") || "";       // QRコードで指定された小テストID

/* ============================================================
   保存（localStorage が使えない環境ではメモリにフォールバック）
   ============================================================ */
const store = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();

/* ============================================================
   数式キーボード
   ============================================================ */
const KB = (()=>{
  const el = document.getElementById("kb");
  const keys = document.getElementById("kbkeys");
  const hint = document.getElementById("kbhint");
  let target = null;

  const LAYOUT = [
    ["0","0","num"],["1","1","num"],["2","2","num"],["3","3","num"],["4","4","num"],
    ["5","5","num"],["6","6","num"],["7","7","num"],["8","8","num"],["9","9","num"],

    ["a","a","var"],["b","b","var"],["c","c","var"],["n","n","var"],["m","m","var"],
    ["r","r","var"],["x","x","var"],["y","y","var"],["z","z","var"],["π","π","op"],

    ["＝","=","op"],[".","."],["＋","+","op"],["−","-","op"],["×","×","op"],
    ["÷","÷","op"],["≦","≦","op"],["≧","≧","op"],["＜","<","op"],["＞",">","op"],

    ["(","(","op"],[")",")","op"],[",",",","op"],["/","/","op"],
    ["⌫","\b","fn del span3"],["閉じる",null,"fn span3"],

    ["分数","FRAC","fn span10"],
  ];

  LAYOUT.forEach(([label,ins,cls])=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=label; if(cls) b.className=cls;
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.addEventListener("click", ()=>{
      if(ins===null){ hide(); return; }
      if(ins==="FRAC"){ openFrac(); return; }
      if(ins==="\b") back(); else insert(ins);
    });
    keys.appendChild(b);
  });

  function insert(txt){
    if(!target) return;
    const s=target.selectionStart ?? target.value.length, e=target.selectionEnd ?? s;
    target.value = target.value.slice(0,s) + txt + target.value.slice(e);
    const p=s+txt.length;
    try{ target.setSelectionRange(p,p); }catch(_){}
    target.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function back(){
    if(!target) return;
    let s=target.selectionStart ?? target.value.length, e=target.selectionEnd ?? s;
    if(s===e){ if(s===0) return; s=s-1; }
    target.value = target.value.slice(0,s) + target.value.slice(e);
    try{ target.setSelectionRange(s,s); }catch(_){}
    target.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function show(input, label){
    target=input;
    hint.textContent = label ? `数式キーボード　—　${label}` : "数式キーボード";
    el.classList.remove("hidden");
    document.body.classList.add("kbopen");
    setTimeout(()=>input.scrollIntoView({block:"center",behavior:"smooth"}), 60);
  }
  function hide(){
    target=null;
    el.classList.add("hidden");
    document.body.classList.remove("kbopen");
    closeFrac();
  }

  const fracEl = document.getElementById("frac");
  const numEl = document.getElementById("frac-num");
  const denEl = document.getElementById("frac-den");
  let outerTarget = null, outerLabel = "";

  numEl.addEventListener("focus", ()=>{ target=numEl; hint.textContent="分数　—　分子"; });
  denEl.addEventListener("focus", ()=>{ target=denEl; hint.textContent="分数　—　分母"; });

  function openFrac(){
    if(!target || target===numEl || target===denEl) return;
    outerTarget = target; outerLabel = hint.textContent;
    numEl.value=""; denEl.value="";
    fracEl.classList.add("on");
    el.classList.add("fracmode");
    numEl.focus();
  }
  function closeFrac(){
    fracEl.classList.remove("on");
    el.classList.remove("fracmode");
    outerTarget=null;
  }
  document.getElementById("frac-ok").addEventListener("pointerdown", e=>e.preventDefault());
  document.getElementById("frac-ok").addEventListener("click", ()=>{
    if(!outerTarget) return;
    const n = numEl.value.trim(), d = denEl.value.trim();
    let txt = "";
    if(n && d) txt = `(${n}/${d})`;
    else if(n) txt = n;
    else { closeFrac(); return; }
    const t = outerTarget;
    const s=t.selectionStart ?? t.value.length, e2=t.selectionEnd ?? s;
    t.value = t.value.slice(0,s) + txt + t.value.slice(e2);
    const p=s+txt.length;
    try{ t.setSelectionRange(p,p); }catch(_){}
    t.dispatchEvent(new Event("input",{bubbles:true}));
    closeFrac();
    show(t, outerLabel.replace(/^数式キーボード\s*—\s*/,""));
  });
  document.getElementById("frac-cancel").addEventListener("pointerdown", e=>e.preventDefault());
  document.getElementById("frac-cancel").addEventListener("click", ()=>{
    if(outerTarget) show(outerTarget, outerLabel.replace(/^数式キーボード\s*—\s*/,""));
    else closeFrac();
  });

  return {
    hide,
    attach(input, label){
      input.setAttribute("inputmode","none");
      input.addEventListener("focus", ()=>show(input,label));
    }
  };
})();

/* ============================================================
   数字／文字式／関数キーボード（Mkb3）
   1つの下部ドックパネルの中身を、答えの種類ごとに出し分ける。
   ・数字キーボード：電卓配置の数字パッド＋分数（分子/分母）＋確定
   ・文字式キーボード：数字パッド＋記号グリッド＋分数挿入ボタン（普通のキーボードと同じくライブ入力）
   ・関数キーボード：y=ax／y=a/x を選び、数字パッドで係数を入力＋確定
   ============================================================ */
const Mkb3 = (()=>{
  const CALC_KEYS = ["7","8","9","4","5","6","1","2","3","±","0","⌫"];
  const el = document.getElementById("mkb3");
  const hint = document.getElementById("mkb3hint");
  const panels = {
    num: document.getElementById("mkb3-num"),
    expr: document.getElementById("mkb3-expr"),
    func: document.getElementById("mkb3-func"),
  };

  function showPanel(mode, label){
    Object.values(panels).forEach(p=>p.classList.remove("on"));
    panels[mode].classList.add("on");
    hint.textContent = label || "";
    el.classList.remove("hidden");
    document.body.classList.add("mkb3open");
  }
  function hide(){
    el.classList.add("hidden");
    document.body.classList.remove("mkb3open");
    closeFracPopup();
  }
  document.getElementById("mkb3-close").addEventListener("click", hide);

  /* ---------- 数字キーボード ---------- */
  const numPad = document.getElementById("numPad");
  const numSlotN = document.getElementById("numSlotN");
  const numSlotD = document.getElementById("numSlotD");
  const numOk = document.getElementById("numOk");
  let numState = {n:"", d:"", nNeg:false, dNeg:false, active:"n", onConfirm:null};
  function syncNum(){
    numSlotN.textContent = (numState.nNeg?"−":"") + (numState.n||"◻");
    numSlotD.textContent = (numState.dNeg?"−":"") + (numState.d||"◻");
    numSlotN.setAttribute("aria-pressed", String(numState.active==="n"));
    numSlotD.setAttribute("aria-pressed", String(numState.active==="d"));
    numOk.disabled = !numState.n;
  }
  CALC_KEYS.forEach(k=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=k;
    b.addEventListener("click", ()=>{
      const key = numState.active;
      if(k==="⌫") numState[key] = numState[key].slice(0,-1);
      else if(k==="±") numState[key+"Neg"] = !numState[key+"Neg"];
      else if(numState[key].length<6) numState[key] = (numState[key]+k).replace(/^0+(?=\d)/,"");
      syncNum();
    });
    numPad.appendChild(b);
  });
  numSlotN.addEventListener("click", ()=>{ numState.active="n"; syncNum(); });
  numSlotD.addEventListener("click", ()=>{ numState.active="d"; syncNum(); });
  numOk.addEventListener("click", ()=>{
    if(!numState.n) return;
    const n = (numState.nNeg?"-":"")+numState.n;
    const out = numState.d ? `${n}/${(numState.dNeg?"-":"")+numState.d}` : n;
    const cb = numState.onConfirm; hide(); cb && cb(out);
  });
  function openNum(initialVal, label, onConfirm){
    const parts = String(initialVal||"").split("/");
    const parseOne = s=>{ const neg = s.startsWith("-"); return {v: neg?s.slice(1):s, neg}; };
    const np = parseOne(parts[0]||""), dp = parts[1]!=null ? parseOne(parts[1]) : {v:"",neg:false};
    numState = {n:np.v, d:dp.v, nNeg:np.neg, dNeg:dp.neg, active:"n", onConfirm};
    syncNum();
    showPanel("num", label);
  }

  /* ---------- 文字式キーボード（普通のキーボードと同じくライブ入力） ---------- */
  const exprPad = document.getElementById("exprPad");
  const exprSym = document.getElementById("exprSym");
  const fracPopup = document.getElementById("mkb3-fracPopup");
  const exprFracN = document.getElementById("exprFracN"), exprFracD = document.getElementById("exprFracD");
  let exprTarget = null;
  let fracState = {n:"", d:"", active:"n"};
  function syncFracPopup(){
    exprFracN.textContent = fracState.n||"◻"; exprFracD.textContent = fracState.d||"◻";
    exprFracN.setAttribute("aria-pressed", String(fracState.active==="n"));
    exprFracD.setAttribute("aria-pressed", String(fracState.active==="d"));
  }
  function closeFracPopup(){ fracPopup.classList.add("hidden"); }
  function exprInsert(txt){
    if(!exprTarget) return;
    const t=exprTarget;
    const s=t.selectionStart ?? t.value.length, e=t.selectionEnd ?? s;
    t.value = t.value.slice(0,s)+txt+t.value.slice(e);
    const p=s+txt.length;
    try{ t.setSelectionRange(p,p); }catch(_){}
    t.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function exprBack(){
    if(!exprTarget) return;
    const t=exprTarget;
    let s=t.selectionStart ?? t.value.length, e=t.selectionEnd ?? s;
    if(s===e){ if(s===0) return; s=s-1; }
    t.value = t.value.slice(0,s)+t.value.slice(e);
    try{ t.setSelectionRange(s,s); }catch(_){}
    t.dispatchEvent(new Event("input",{bubbles:true}));
  }
  function exprToggleSign(){
    if(!exprTarget) return;
    const t=exprTarget;
    t.value = t.value.startsWith("-") ? t.value.slice(1) : "-"+t.value;
    t.dispatchEvent(new Event("input",{bubbles:true}));
  }
  CALC_KEYS.forEach(k=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=k;
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.addEventListener("click", ()=>{
      if(!fracPopup.classList.contains("hidden")){
        const key=fracState.active;
        if(k==="⌫") fracState[key]=fracState[key].slice(0,-1);
        else if(k==="±") fracState[key] = fracState[key].startsWith("-") ? fracState[key].slice(1) : "-"+fracState[key];
        else fracState[key]=fracState[key]+k;
        syncFracPopup();
        return;
      }
      if(k==="⌫") exprBack();
      else if(k==="±") exprToggleSign();
      else exprInsert(k);
    });
    exprPad.appendChild(b);
  });
  const SYM_LAYOUT = ["+","-","×","÷","a","b","c","x","y","z","n","m","r","π","(",")","<",">","≦","≧"];
  SYM_LAYOUT.forEach(sym=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=sym;
    if("abcxyznmr".includes(sym)) b.className="var";
    else if("+-×÷".includes(sym)) b.className="op";
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.addEventListener("click", ()=> exprInsert(sym));
    exprSym.appendChild(b);
  });
  document.getElementById("exprFracBtn").addEventListener("click", ()=>{
    fracState = {n:"",d:"",active:"n"}; syncFracPopup();
    fracPopup.classList.remove("hidden");
  });
  exprFracN.addEventListener("click", ()=>{ fracState.active="n"; syncFracPopup(); });
  exprFracD.addEventListener("click", ()=>{ fracState.active="d"; syncFracPopup(); });
  document.getElementById("exprFracOk").addEventListener("click", ()=>{
    const n=fracState.n, d=fracState.d;
    const txt = n&&d ? `(${n}/${d})` : n;
    closeFracPopup();
    if(txt) exprInsert(txt);
  });
  document.getElementById("exprFracCancel").addEventListener("click", closeFracPopup);
  function attachExpr(input, label){
    input.setAttribute("inputmode","none");
    input.addEventListener("focus", ()=>{ exprTarget=input; showPanel("expr", label); });
  }

  /* ---------- 関数キーボード：y=ax／y=a/x を選び、数字パッドで係数を入力 ---------- */
  const funcFormBtns = document.querySelectorAll('#mkb3-func .funcKB-formBtn');
  const funcPreview = document.getElementById("funcPreview");
  const funcPad = document.getElementById("funcPad");
  const funcOk = document.getElementById("funcOk");
  let funcState = {form:null, neg:false, digits:"", onConfirm:null};
  function syncFunc(){
    funcFormBtns.forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.form===funcState.form)));
    funcPreview.innerHTML = funcPreviewHTML(funcState.form, funcState.neg, funcState.digits);
    funcOk.disabled = !(funcState.form && funcState.digits);
  }
  funcFormBtns.forEach(b=>b.addEventListener("click", ()=>{ funcState.form=b.dataset.form; syncFunc(); }));
  CALC_KEYS.forEach(k=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=k;
    b.addEventListener("click", ()=>{
      if(k==="⌫") funcState.digits = funcState.digits.slice(0,-1);
      else if(k==="±") funcState.neg = !funcState.neg;
      else if(funcState.digits.length<6) funcState.digits = (funcState.digits+k).replace(/^0+(?=\d)/,"");
      syncFunc();
    });
    funcPad.appendChild(b);
  });
  funcOk.addEventListener("click", ()=>{
    if(!funcState.form || !funcState.digits) return;
    const out = funcState.form==="prop" ? `y=${funcState.neg?"-":""}${funcState.digits}x` : `y=${funcState.neg?"-":""}${funcState.digits}/x`;
    const cb = funcState.onConfirm; hide(); cb && cb(out);
  });
  function openFunc(initialVal, label, onConfirm){
    const p = parseFuncAnswer(initialVal);
    funcState = {form:p?.form||null, neg:p?.neg||false, digits:p?.digits||"", onConfirm};
    syncFunc();
    showPanel("func", label);
  }

  return {hide, openNum, openFunc, attachExpr};
})();

/* ============================================================
   アカウント（学校コード＋出席番号＋パスワード）
   ============================================================ */
const loadAccountId     = () => store.get(ACCOUNT_KEY) || null;
const saveAccountId     = id => store.set(ACCOUNT_KEY, id);
const loadSavedPassword = () => store.get(ACCOUNT_PW_KEY);

/* ============================================================
   完了記録（この端末のキャッシュ。真の判定はサーバーの check_quiz で行う）
   ============================================================ */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const doneKey = (quizId,sid) => `done:${quizId}:${sid}`;
function saveDone(quizId, score, max){
  store.set(doneKey(quizId,S.sid), JSON.stringify({date:todayStr(), score, max}));
}
function loadDoneFor(quizId, sid){
  try{ return JSON.parse(store.get(doneKey(quizId,sid))||"null"); }catch(e){ return null; }
}

/* ============================================================
   状態
   ============================================================ */
let S = { test:null, sid:null, ans:{}, startedAt:0, qStart:{}, timer:null, submitted:false, practice:false };
let ACTIVE = [];         // 小テスト本体が「配布中」の quiz_id の一覧
let REFLECT_ACTIVE = []; // 振り返りだけ「配布中」の quiz_id の一覧
let waitTimer = null;  // QR待ちの自動再確認タイマー
const KEY = t => `quiz:${t}:${S.sid}`;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   ホーム画面 ／ ログイン・新規登録
   ============================================================ */
const meBox = () => document.getElementById("me");

function renderAccountCard(id){
  S.sid = id;
  meBox().innerHTML = `
    <h2>ログイン中</h2>
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <div style="font-family:var(--mono);font-size:18px;letter-spacing:.03em">${esc(id)}</div>
      <div style="font-size:14px;color:var(--ink-soft)">${esc(accountLabel(id))}</div>
      <button class="btn mini ghost" id="logout" style="margin-left:auto">ログアウト</button>
    </div>
    <div class="hint">この端末に記憶しています。</div>`;
  document.getElementById("logout").onclick=()=>{
    store.del(ACCOUNT_KEY); clearSavedPassword(); S.sid=null;
    hideRecordCard();
    renderLoginForm("");
  };
  renderRecordCard();
}

function renderLoginForm(prefillId, msg){
  meBox().innerHTML = `
    <h2>ログイン</h2>
    ${msg?`<div class="notice warn" style="margin-bottom:10px">${esc(msg)}</div>`:""}
    <label class="f">ID</label>
    <input type="text" id="li-id" autocomplete="off" spellcheck="false" value="${esc(prefillId||"")}" placeholder="例：E-101236">
    <label class="f" style="margin-top:10px">パスワード</label>
    <input type="password" id="li-pw" autocomplete="off">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-top:10px">
      <input type="checkbox" id="li-remember"> この端末にパスワードを保存する
    </label>
    <button class="btn" id="li-go" style="margin-top:14px">ログイン</button>
    <div class="hint" style="margin-top:12px">
      はじめての方は　<button class="btn mini ghost" type="button" id="li-toreg">新規登録はこちら</button>
    </div>`;
  document.getElementById("li-toreg").onclick = ()=>renderRegisterForm();
  const go = document.getElementById("li-go");
  go.onclick = async ()=>{
    const id = document.getElementById("li-id").value.trim().toUpperCase();
    const pw = document.getElementById("li-pw").value;
    const remember = document.getElementById("li-remember").checked;
    if(!parseAccountId(id)){ alert("IDの形式が正しくありません（例：E-101236）。"); return; }
    if(!pw){ alert("パスワードを入力してください。"); return; }
    await tryLogin(id, pw, remember);
  };
}

/** ID・パスワードでログインを試みる。成功時は画面をログイン済みに切り替え、失敗時はログイン画面を出し直す。 */
async function tryLogin(id, pw, remember){
  const go = document.getElementById("li-go");
  if(go){ go.disabled=true; go.textContent="確認中…"; }
  let r;
  try{ r = await Quiz.rpc("quiz_login", {p_account_id:id, p_password:pw}); }
  catch(e){ renderLoginForm(id, "通信エラーです。もう一度お試しください。"); return; }
  if(r && r.ok){
    saveAccountId(id);
    if(remember) saveSavedPassword(pw); else clearSavedPassword();
    renderAccountCard(id);
    refreshTests();
  } else {
    const msg = (r && r.error==="no_such_id") ? "そのIDは登録されていません。「新規登録」からはじめてください。"
                                               : "IDまたはパスワードが正しくありません。";
    renderLoginForm(id, msg);
  }
}

/** 指定した小テスト(t)の、今日の振り返りを書く／編集する画面。t が配布中でなくなっていたら保存時に拒否される。 */
/* ---------- reflection-sheet/ と同じ簡易評価ロジック（コピー使い回し検知＋6観点チェック＋問い返し） ---------- */
const DUP_SIM_THRESHOLD = 0.85, DUP_MIN_LEN = 20, SHORT_LEN_THRESHOLD = 20;
function reflSimilarity(a,b){
  if(a===b) return 1;
  if(!a.length || !b.length) return 0;
  const bigrams = s=>{ const arr=[]; for(let i=0;i<s.length-1;i++) arr.push(s.substr(i,2)); return arr; };
  const ba=bigrams(a), bb=bigrams(b);
  if(!ba.length || !bb.length) return a===b?1:0;
  const counts={}; bb.forEach(g=>counts[g]=(counts[g]||0)+1);
  let common=0; ba.forEach(g=>{ if(counts[g]>0){ common++; counts[g]--; } });
  return (2*common)/(ba.length+bb.length);
}
function reflFindDuplicate(nowText, prevEntries){
  const now = nowText.replace(/\s/g,"");
  if(now.length < DUP_MIN_LEN) return null;
  for(const p of prevEntries){
    const prevText = (p.comment||"").replace(/\s/g,"");
    if(prevText.length < DUP_MIN_LEN) continue;
    if(reflSimilarity(now, prevText) >= DUP_SIM_THRESHOLD) return p;
  }
  return null;
}
/** 判定用キーワード。比例・反比例（中1第4章）の内容語＋本人の指定した5カテゴリのトリガー語。 */
const REFL_KW = {

  vocab: /(関数|変域|比例|反比例|座標|原点|傾き|変化の割合|x軸|y軸|双曲線|グラフ|直線|対応|増加|減少|y\s*=|表に(し|まとめ)|式に表)/,
  // ②つまづき・難しさ→ピックアップ（本人指定：わからない/解けなかった/悩んでいる/難しい）
  struggle: /(わからな|わかりませ|分からな|解けなかっ|解けませ|悩んで|悩んだ|なやんで|むずかし|難し)/,
  // ③理解している方に分類（本人指定：得意/できた/簡単）
  understood: /(得意|とくい|できた|出来た|簡単|かんたん|楽勝|スラスラ|すらすら|ばっちり|バッチリ)/,

  // SOS（既存・重い言葉。ピックアップに含める）
  sos: /(むり|無理|嫌だ|つらい|しんどい|意味ない|やる気が出な|もうやだ)/,

  nextStep: /(次は|明日|今度|練習する|復習|やり直|見直|学び直|してみる|作る|書いてくる|やってみたい|頑張りたい|挑戦したい)/,

  method: /(友(達|だち)に(聞い|教え)|人に(聞い|教え)|先生に(聞い|教え)|一緒に(考え|やっ|勉強)|やりやすい|考えやすい|わかりやすい|理解しやすい|式を書い|図に(かい|して)|表に(し|まとめ)|声に出し|書き出し|順番を変え|やり方を変え|工夫したら|コツが|に気づいた)/,

/** カテゴリごとに複数用意し、ランダムに1つ返す（同じ言葉を書き続けても毎回違う声かけになるように）。 */
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
/* 声かけの基本方針（kazuのペルソナに寄せる）：
   ・褒めるだけで終わらせない——「なぜ」を一緒に気にする一言を必ず添える
   ・「もっと頑張れ」というプレッシャーはかけない。今のペース・今の自分を否定しない
   ・つまずきや波があるのを普通のこととして扱う（隠さず書けたこと自体を認める）
   ・可能性を信じる姿勢——今できていないことより、次に開くものを見る */

/** comment・理解度・意欲・本人の過去の振り返り(他のquiz_id含む)から、観点チェック＋問い返しを算出する。 */
function reflAnalyze(comment, understanding, effort, prevEntries){
  const all = comment || "";
  const e = {};
  const dup = reflFindDuplicate(all, prevEntries);
  if(dup){
    e.is_duplicate = true; e.duplicate_date = dup.date;
    e.checks = null; e.flag = false; e.good = false; e.toikaeshi = null;
    e.warning = `${dup.date}の振り返りとほぼ同じ内容です。コピーではなく、今日の授業で気づいたことを自分の言葉で書いてみましょう。`;
    return e;
  }
  e.is_duplicate = false; e.duplicate_date = null; e.warning = null;
  const tooShort = all.replace(/\s/g,"").length < SHORT_LEN_THRESHOLD;
  // 「あいまい」判定は元の緩い文章チェック（内容語彙が無くても、努力や気持ちを書いた
  // まっとうな一文まで「あいまい」扱いにしないため）。単元語彙の有無は別の加点シグナルとして checks[0] に残す。
  const looksLikeSentence = all.replace(/\s/g,"").length>=15 && /[はがをにでとなら]/.test(all);
  const checks = [];
  checks.push(REFL_KW.vocab.test(all));                                     // ①比例・反比例の言葉でまとめている
  checks.push(REFL_KW.struggle.test(all));                                  // ②つまづき・難しさ
  checks.push(REFL_KW.nextStep.test(all));                                  // 次の一手
  checks.push(REFL_KW.question.test(all));                                  // ④質問
  checks.push(prevEntries.length>0 && REFL_KW.connect.test(all));           // 前回との接続
  checks.push(REFL_KW.method.test(all));                                    // 学び方の工夫
  e.checks = checks;
  const tooVague = !tooShort && !looksLikeSentence;
  const ckCoreCount = checks.slice(0,5).filter(Boolean).length;

  const hasStruggle = checks[1] || REFL_KW.sos.test(all);
  const hasQuestion = checks[3];
  const hasUnderstood = REFL_KW.understood.test(all);
  const hasMotivated = REFL_KW.motivated.test(all);

  // ピックアップ（教師の「⚠要フォロー」フィルタに出る）＝ わからない/難しい/悩んでいる/重い言葉/質問
  e.flag = REFL_KW.sos.test(all) || hasStruggle || hasQuestion
        || (understanding===1 && all.replace(/\s/g,"").length<12);
  // 理解している方に分類（⭐得意サイン）＝ 得意/できた/簡単、または高評価＋高観点の組み合わせ
  e.good = hasUnderstood || REFL_KW.method.test(all) && hasMotivated
        || (understanding===4 && effort>=3 && ckCoreCount>=4);

  // 声かけは優先順位順に1カテゴリだけ選び、その中からランダムに1つ。
  // 「短いから」より「何を書いたか」を優先する——短い一言でも わからない/質問/得意/やる気 が
  // 読み取れるなら、文字数チェックより先にそちらへの声かけを返す。
  if(hasStruggle) e.toikaeshi = pick(REFL_MSG.struggle);
  else if(hasQuestion) e.toikaeshi = pick(REFL_MSG.question);
  else if(hasUnderstood) e.toikaeshi = pick(REFL_MSG.understood);
  else if(hasMotivated) e.toikaeshi = pick(REFL_MSG.motivated);
  else if(tooShort) e.toikaeshi = pick(REFL_MSG.tooShort);
  else if(tooVague) e.toikaeshi = pick(REFL_MSG.tooVague);
  else e.toikaeshi = pick(REFL_MSG.general);
  return e;
}

      <div class="hint" style="margin-top:0;margin-bottom:8px">今日の授業で気づいたこと、次にやってみたいこと、質問や困っていることなど、何でも書いてね。</div>
      <textarea id="rf-comment" placeholder="例：分数の通分がまだ苦手です／◯◯のところがわかりませんでした など">${esc(ex?.comment||"")}</textarea>
    </div>
    <div class="foot">
      <button class="btn ghost" id="rf-back">ホームへもどる</button>
      <button class="btn" id="rf-save">保存する</button>
    </div>
  `;
  wireLevelChoices("lv-under", v=>picked.understanding=v);
  wireLevelChoices("lv-effort", v=>picked.effort=v);
  document.getElementById("rf-back").onclick = ()=>renderHome();
  document.getElementById("rf-save").onclick = async ()=>{
    if(!picked.understanding || !picked.effort){ alert("授業の理解度と、意欲・態度をそれぞれ選んでください。"); return; }
    const scoreRaw = document.getElementById("rf-score").value.trim();
    const score = scoreRaw==="" ? null : Math.max(0, Math.min(100, Math.round(+scoreRaw)));
    const comment = document.getElementById("rf-comment").value;
    const btn = document.getElementById("rf-save");
    btn.disabled=true; btn.textContent="保存中…";

    // 過去の自分の振り返り（他の授業分も含む）を取得し、コピー使い回し検知・6観点チェックを行う
    let prev = [];
    try{
      const hist = await Quiz.rpc("quiz_my_reflections", {p_account_id:S.sid});
      if(hist && Array.isArray(hist.reflections)){
        // 今回の上書き元（今日のこの単元の分。2回目以降は quiz_id が派生idの場合もある）は除く
        prev = hist.reflections.filter(x=>!(x.date===todayStr() && (x.quiz_id===t.id || x.quiz_id.startsWith(t.id+"-"))));
      }
    }catch(e){ /* 履歴が取れなくても保存自体は続行する */ }
    const ev = reflAnalyze(comment, picked.understanding, picked.effort, prev);

    let r2;
    try{
      r2 = await Quiz.rpc("quiz_reflection_submit", {
        p_account_id: S.sid, p_quiz_id: t.id, p_understanding: picked.understanding, p_effort: picked.effort,
        p_score: score, p_comment: comment,
        p_checks: ev.checks, p_flag: ev.flag, p_good: ev.good,
        p_is_duplicate: ev.is_duplicate, p_duplicate_date: ev.duplicate_date,
        p_toikaeshi: ev.toikaeshi, p_warning: ev.warning,
      });
    }catch(e){ btn.disabled=false; btn.textContent="保存する"; alert("通信エラーです。もう一度お試しください。"); return; }
    if(r2 && r2.ok){ renderReflectionDone(t, ev); }
    else if(r2 && r2.error==="inactive"){
      alert("この授業の振り返りは先生によって締め切られたため、保存できませんでした。");
      renderHome();
    } else {
      btn.disabled=false; btn.textContent="保存する";
      alert("保存できませんでした。もう一度お試しください。");
    }
  };
}

/* ============================================================
   60秒計算チャレンジ（押し合いバトル）
   自分は左端に固定。敵は右側から現れ、時間が経つとじわじわ左（自分側）へ迫ってくる。
   正解すると、答えた速さに応じて敵をドンと右へ押し返す。右端まで押し出すと撃退＝
   新しい敵が上から降ってきてまた押してくる。サーバーには送らない、その場の気分転換用。
   ============================================================ */
function renderMiniGame(){
  KB.hide(); clearInterval(waitTimer);
  const MIN_X = 8, MAX_X = 90, START_X = 78, CREEP = 2.6, CREEP_MS = 650;
  let score = 0, driven = 0, timeLeft = 60, cur = null, qStart = 0;
  let enemyX = START_X;
  let creepTimer = null, countTimer = null;

  const enemyEl  = ()=>document.getElementById("duel-enemy");
  const trackEl  = ()=>document.getElementById("duel-track");
  const paintEnemy = ()=>{ const el=enemyEl(); if(el) el.style.left = enemyX+"%"; };
  const paintDanger = ()=>{ const tr=trackEl(); if(tr) tr.classList.toggle("danger", enemyX < 30); };

  const impactFx = ()=>{
    const tr = trackEl(); if(!tr) return;
    const el = document.createElement("div");
    el.className = "duel-impact"; el.textContent = "💥";
    el.style.left = enemyX+"%";
    tr.appendChild(el);
    setTimeout(()=>el.remove(), 520);
  };
  const bump = ()=>{ const el=enemyEl(); if(!el) return; el.classList.remove("knock"); void el.offsetWidth; el.classList.add("knock"); };

  const nextQ = ()=>{
    const a = 1+Math.floor(Math.random()*12), b = 1+Math.floor(Math.random()*12);
    const op = Math.random()<0.5 ? "+" : "-";
    const [x,y] = (op==="-" && a<b) ? [b,a] : [a,b];
    cur = { text:`${x} ${op} ${y}`, ans: op==="+" ? x+y : x-y };
    qStart = Date.now();
    const qEl = document.getElementById("mg-q"), aEl = document.getElementById("mg-ans");
    if(qEl) qEl.textContent = cur.text;
    if(aEl){ aEl.value = ""; aEl.focus(); }
  };

  /** 時間経過で敵がじわじわ迫る。自分側の端に達したら少しだけ押し戻して続行（ペナルティ演出のみ）。 */
  const creep = ()=>{
    enemyX = Math.max(MIN_X, enemyX - CREEP);
    paintEnemy(); paintDanger();
    if(enemyX<=MIN_X){ bump(); enemyX = MIN_X + 8; paintEnemy(); }
  };

  /** 正解時：答えた速さに応じて右へ押し返す。右端まで届いたら撃退→新しい敵が降ってくる。 */
  const pushBack = (elapsedMs)=>{
    const sec = elapsedMs/1000;
    const amount = Math.max(10, 32 - sec*7); // 速いほど大きく押し返す
    enemyX = Math.min(MAX_X, enemyX + amount);
    impactFx(); bump(); paintEnemy(); paintDanger();
    if(enemyX >= MAX_X){
      driven++;
      const dEl = document.getElementById("mg-drive"); if(dEl) dEl.textContent = driven;
      setTimeout(()=>{
        enemyX = START_X;
        const el = enemyEl();
        if(el){ el.classList.remove("knock"); paintEnemy(); el.classList.add("spawn"); setTimeout(()=>el.classList.remove("spawn"), 520); }
        paintDanger();
      }, 260);
    }
  };

  const finish = ()=>{
    clearInterval(creepTimer); clearInterval(countTimer);
    app.innerHTML = `
      <header class="sheet"><h1>数学　小テスト・振り返り</h1><div class="sub">🕹️ 60秒計算チャレンジ・結果</div></header>
      <div class="score">
        <div class="big">${score}<small> 問</small></div>
        <div style="margin-top:6px">🚀 おいだした数：${driven}体</div>
        <div style="margin-top:8px">よくがんばった！ひと息ついたら、また戻ってきてね。</div>
      </div>
      <div class="foot"><button class="btn" id="mg-again" style="width:100%">もう一度</button></div>
      <div class="foot"><button class="btn ghost" id="mg-back" style="width:100%">もどる</button></div>`;
    document.getElementById("mg-again").onclick = renderMiniGame;
    document.getElementById("mg-back").onclick = renderHome;
  };

  app.innerHTML = `
    <header class="sheet">
      <h1>数学　小テスト・振り返り</h1>
      <div class="sub">🕹️ 60秒計算チャレンジ</div>
    </header>
    <div class="score">
      <div style="font-size:13px;color:var(--ink-soft)">残り時間　<span id="mg-time">60</span>秒　・　🚀 おいだした数　<span id="mg-drive">0</span>体</div>
      <div class="big" id="mg-score">0<small> 問</small></div>
    </div>
    <div class="card">
      <div class="duel-track" id="duel-track">
        <div class="duel-player">🧑</div>
        <div class="duel-enemy" id="duel-enemy">😈💣</div>
      </div>
      <div style="text-align:center">
        <div id="mg-q" style="font-family:var(--mono);font-size:34px;margin:10px 0"></div>
        <input type="number" id="mg-ans" inputmode="numeric" style="font-size:22px;text-align:center;max-width:160px;margin:0 auto;display:block" autocomplete="off">
      </div>
    </div>
    <div class="foot"><button class="btn ghost" id="mg-quit" style="width:100%">やめる</button></div>
  `;
  paintEnemy(); paintDanger();
  const ansEl = document.getElementById("mg-ans");
  ansEl.oninput = ()=>{
    if(ansEl.value==="" || cur===null) return;
    if(+ansEl.value === cur.ans){
      score++;
      const sEl = document.getElementById("mg-score");
      if(sEl) sEl.innerHTML = `${score}<small> 問</small>`;
      pushBack(Date.now()-qStart);
      nextQ();
    }
  };
  document.getElementById("mg-quit").onclick = ()=>{ clearInterval(creepTimer); clearInterval(countTimer); renderHome(); };
  creepTimer = setInterval(creep, CREEP_MS);
  countTimer = setInterval(()=>{
    timeLeft--;
    const tEl = document.getElementById("mg-time");
    if(tEl) tEl.textContent = timeLeft;
    if(timeLeft<=0) finish();
  }, 1000);
  nextQ();
}

/* ============================================================
   確認問題5問（数学ラボ2「はいちモード」の確認問題と同じ発想：
   5問すべて正解で合格）。開始された授業に関係する類似問題を、
   応用チャレンジ(applied/、appliedProblems.js の SETS)から優先的に出題し、
   足りなければその回のquiz本体の問題も混ぜる。図が必要な問題（fig）は、
   テキストだけでは意味が通らないため除外する。1問ずつ即採点・自動で次へ進み、
   サーバーには送らない、その場の腕試し用。
   ============================================================ */
function poolFromQuestions(qs, noLabel, leadKey){
  const out = [];
  (qs||[]).forEach(q=>{
    if(q.fig) return; // 図が必要な問題はテキストだけでは成立しないため除外
    if(q.type!=="choice" && q.type!=="input") return;
    if(!Array.isArray(q.subs) || !q.subs.length) return;
    const base = q[leadKey] || "";
    q.subs.forEach(s=>{
      const lead = s.prompt ? `${base}${base?"　":""}${s.lb?s.lb+"　":""}${s.prompt}` : base;
      if(!lead) return;
      if(q.type==="choice") out.push({no:noLabel, lead, type:"choice", choices:q.choices, ans:s.a});
      else out.push({no:noLabel, lead, type:"input", mode:s.mode, ans:s.a, ph:s.ph||q.ph});
    });
  });
  return out;
}
function confirmQuizPool(quizId){
  // その回の小テストと同じレベルにするため、まずその回自身の問題（CH.qs）だけを使う。
  // 応用バンク(SETS)は難易度が上のため、CH.qsだけでは5問に満たないときの補充にのみ使う。
  const t = CH.find(x=>x.id===quizId);
  let pool = t ? poolFromQuestions(t.qs, t.no, "lead") : [];
  if(pool.length<5 && typeof SETS !== "undefined"){
    const set = SETS.find(s=>s.id===quizId);
    if(set) pool = pool.concat(poolFromQuestions(set.qs, set.no || quizId, "prompt"));
  }
  if(!pool.length){
    // 最終手段：その回の問題が見つからないときだけ、中1第4章の全問題から出す
    CH.forEach(x=>{ pool = pool.concat(poolFromQuestions(x.qs, x.no, "lead")); });
  }
  return pool;
}
function renderConfirmQuiz(quizId){
  KB.hide(); clearInterval(waitTimer);
  const ROUND = 5;
  const pool = confirmQuizPool(quizId);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const set = pool.slice(0, Math.min(ROUND, pool.length));
  let i = 0, correct = 0;
  const showQ = ()=>{
    if(i>=set.length){ finish(); return; }
    const q = set[i];
    app.innerHTML = `
      <header class="sheet">
        <h1>数学　小テスト・振り返り</h1>
        <div class="sub">🎯 確認問題　${i+1}/${set.length}問目　（${set.length}問すべて正解で合格）</div>
      </header>
      <div class="q">
        <div class="head"><span class="n">${esc(q.no)}</span><span class="prompt">${esc(q.lead||"")}</span></div>
        ${q.type==="choice"
          ? `<div class="choices">${q.choices.map((c,ci)=>`<button type="button" data-ci="${ci}">${esc(c)}</button>`).join("")}</div>`
          : `<div class="subq"><input type="text" id="cq-ans" placeholder="${esc(q.ph||"")}" autocomplete="off" spellcheck="false"></div>
             <button class="btn" id="cq-check" style="margin-top:10px;width:100%">こたえる</button>`}
        <div id="cq-fb" style="margin-top:10px"></div>
      </div>
      <div class="foot"><button class="btn ghost" id="cq-quit" style="width:100%">やめる</button></div>`;
    document.getElementById("cq-quit").onclick = renderHome;
    const fb = document.getElementById("cq-fb");
    const judge = ok=>{
      fb.innerHTML = ok
        ? `<div class="notice ok">○ 正解！</div>`
        : `<div class="notice warn">× 正解は「${esc(q.type==="choice"?q.choices[q.ans]:q.ans)}」</div>`;
      if(ok) correct++;
      i++;
      setTimeout(showQ, 900);
    };
    if(q.type==="choice"){
      app.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{
        app.querySelectorAll("[data-ci]").forEach(x=>x.disabled=true);
        judge(+b.dataset.ci === q.ans);
      });
    } else {
      const inp = document.getElementById("cq-ans");
      KB.attach(inp, q.lead||"");
      document.getElementById("cq-check").onclick = ()=>{
        document.getElementById("cq-check").disabled = true;
        judge(gradeSub(q.mode, inp.value, q.ans));
      };
    }
  };
  const finish = ()=>{
    const pass = correct===set.length;
    app.innerHTML = `
      <header class="sheet"><h1>数学　小テスト・振り返り</h1><div class="sub">🎯 確認問題・結果</div></header>
      <div class="score">
        <div class="big">${correct}<small> / ${set.length}</small></div>
        <div style="margin-top:8px">${pass ? "🎉 全問正解！合格です！" : "おしい！もう一度チャレンジしてみよう。"}</div>
      </div>
      <div class="foot"><button class="btn" id="cq-again" style="width:100%">もう一度</button></div>
      <div class="foot"><button class="btn ghost" id="cq-back" style="width:100%">もどる</button></div>`;
    document.getElementById("cq-again").onclick = ()=>renderConfirmQuiz(quizId);
    document.getElementById("cq-back").onclick = renderHome;
  };
  showQ();
}

/* ============================================================
   記録（今までの小テストの結果＋振り返りをまとめて見る）
   満点でない小テストは、その場でもう一度練習できる（配布中かどうかに関わらず挑戦でき、
   結果はサーバーに送信・記録されない）。
   ============================================================ */
function hideRecordCard(){
  const box = document.getElementById("practice");
  if(box){ box.classList.add("hidden"); box.innerHTML=""; }
}
function renderRecordCard(){
  const box = document.getElementById("practice");
  if(!box) return;
  box.classList.remove("hidden");
  box.innerHTML = `
    <h2>記録</h2>

/** サーバーの配布状況を取得する。小テスト（ACTIVE）と授業開始＝振り返り受付（REFLECT_ACTIVE）は独立。 */
async function fetchDistribution(){
  const [a, r] = await Promise.all([
    Quiz.rpc("quiz_list_active", {p_student:S.sid}),
    Quiz.rpc("quiz_list_reflect_active", {p_student:S.sid}),
  ]);
  return { active: Array.isArray(a) ? a : [], reflect: Array.isArray(r) ? r : [] };
}

/** サーバーで「配布中」の小テストを取得し、テスト選択カードを描く。 */
async function refreshTests(){
  const box = document.getElementById("teststate");
  if(!box) return;
  try{
    const d = await fetchDistribution();
    ACTIVE = d.active; REFLECT_ACTIVE = d.reflect;
  }catch(e){
    box.innerHTML = `<div class="notice warn">通信エラー：テストの状況を取得できませんでした。画面を再読み込みしてください。</div>`;
    return;
  }

  if(QUIZ_ID){
    const t = CH.find(x=>x.id===QUIZ_ID);
    if(!t){ box.innerHTML = `<div class="notice warn">指定された小テストが見つかりません。QRコードを確認してください。</div>`; return; }
    const quizOn = ACTIVE.includes(t.id), reflOn = REFLECT_ACTIVE.includes(t.id);
    if(quizOn || reflOn){
      clearInterval(waitTimer);
      box.innerHTML = `
        <h2>${esc(t.no)}　${esc(t.name)}</h2>
        ${reflOn ? `<div class="notice ok">🎉 授業が開始されました。</div>` : ""}
        <div style="display:flex;gap:8px">
          ${quizOn
            ? `<button class="btn" id="go" style="flex:1">この小テストをはじめる</button>`
            : `<div class="notice" style="flex:1">小テストは先生がまだ配布していません。</div>`}
          ${S.sid && reflOn ? `<button class="btn ghost" id="go-reflect" style="flex:none">📝 振り返り</button>` : ""}
        </div>
        ${!S.sid ? `<div class="notice warn" style="margin-top:8px">振り返りを書くには先にログインしてください。</div>` : ""}
        <div id="idleSlot"></div>`;
      if(quizOn) document.getElementById("go").onclick=()=>startTest(t);
      if(S.sid && reflOn) document.getElementById("go-reflect").onclick=()=>renderReflectionForm(t);
      if(S.sid && reflOn){ document.getElementById("idleSlot").innerHTML = idleCardHTML(t.id, `${t.no}　${t.name}`); wireIdleCard(t.id); }
    } else {
      box.innerHTML = `
        <h2>${esc(t.no)}　${esc(t.name)}</h2>
        <div class="notice">先生が開始するのを待っています…（自動で確認します）</div>`;
      clearInterval(waitTimer);
      waitTimer = setInterval(async ()=>{
        try{
          const dd = await fetchDistribution();
          if(dd.active.includes(t.id) || dd.reflect.includes(t.id)){ clearInterval(waitTimer); refreshTests(); }
        }catch(e){}
      }, 4000);
    }
    return;
  }

  const list = CH.filter(t=>ACTIVE.includes(t.id) || REFLECT_ACTIVE.includes(t.id));
  if(!list.length){
    box.innerHTML = `<div class="notice">現在受付中の小テスト・振り返りはありません。先生の指示を待つか、QRコードを読み込んでください。</div>`;
    return;
  }
  const startedLessons = list.filter(t=>REFLECT_ACTIVE.includes(t.id));
  box.innerHTML = `
    <h2>今日の授業</h2>
    <div class="tests">
      ${list.map(t=>testRowHTML(t, ACTIVE.includes(t.id), REFLECT_ACTIVE.includes(t.id))).join("")}
    </div>
    <div id="idleSlot"></div>`;
  box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    const t = CH.find(x=>x.id===b.dataset.id);
    startTest(t);
  });
  box.querySelectorAll("[data-reflect]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const t = CH.find(x=>x.id===b.dataset.reflect);
    renderReflectionForm(t);
  });
  if(S.sid && startedLessons.length){
    document.getElementById("idleSlot").innerHTML = startedLessons.map(t=>idleCardHTML(t.id, `${t.no}　${t.name}`)).join("");
    startedLessons.forEach(t=>wireIdleCard(t.id));
  }
}

async function safeCheck(quizId){
  try{ return await Quiz.rpc("quiz_check", {p_quiz_id:quizId, p_student:S.sid}); }
  catch(e){ alert("通信エラー：もう一度お試しください。"); return null; }
}
async function startTest(t, opts){
  const practice = !!(opts && opts.practice);
  if(!S.sid){ alert("先にログインしてください。"); return; }
  clearInterval(waitTimer);
  S.practice = practice;

  let effectiveTest = t;
  if(!practice){
    const check = await safeCheck(t.id);
    if(!check) return;
    if(check.error){ alert("エラーが発生しました。"); return; }
    if(!check.active){ alert("このテストは現在受け付けられていません。"); renderHome(); return; }
    if(check.already_today){ renderAlreadyDone(t, {score:check.score, max:check.max}); return; }
    if(check.time_limit_sec) effectiveTest = {...t, limit: check.time_limit_sec}; // 先生が設定した制限時間で上書き
  }

  S.test=effectiveTest; S.ans={}; S.submitted=false; S.qStart={};
  let resumed=false;
  if(!practice){
    const raw = store.get(KEY(t.id));
    if(raw){
      try{
        const d=JSON.parse(raw);
        if(d.date===todayStr()){
          if(confirm("前回の解答が残っています。続きから再開しますか？")){ S.ans=d.ans||{}; S.startedAt=d.startedAt; S.qStart=d.qStart||{}; resumed=true; }
        } else {
          store.del(KEY(t.id));
        }
      }catch(e){ store.del(KEY(t.id)); }
    }
  }
  if(!resumed) S.startedAt = Date.now();
  renderTest();
  tick();
  S.timer = setInterval(tick, 500);
}
function remain(){ return S.test.limit - Math.floor((Date.now()-S.startedAt)/1000); }
function tick(){
  const el=document.getElementById("tm"); if(!el) return;
  let r = remain();
  if(r<=0){ r=0; clearInterval(S.timer); if(!S.submitted) submit(true); }
  const m=String(Math.floor(r/60)).padStart(2,"0"), s=String(r%60).padStart(2,"0");
  el.textContent = `${m}:${s}`;
  el.classList.toggle("warn", r<=60);
  const p=document.getElementById("pg");
  if(p){ const {done,total}=progress(); p.style.width = (total? done/total*100:0)+"%"; }
}
function keyOf(qi,si){ return si==null? `${qi}` : `${qi}.${si}`; }
function progress(){
  let done=0,total=0;
  S.test.qs.forEach((q,qi)=>{
    if(q.type==="input"||q.type==="choice"){ q.subs.forEach((_,si)=>{ total++; const v=S.ans[keyOf(qi,si)]; if(v!==undefined&&v!==""&&v!==null) done++; }); }
    else { total++; const v=S.ans[keyOf(qi)]; if(v&&v.length) done++; }
  });
  return {done,total};
}
function touch(qi){ if(!S.qStart[qi]) S.qStart[qi]=Date.now(); }
