/* 三平方の定理 第12時：「三平方の定理」で学んだことを、整理して確かめよう（ikkan の lesson_sanhei_12 と同じ流れ）。

   例題は定理の逆（3辺から三角形を作り、いちばん大きい角をはかる）。考えようは、3辺の上の図形をスライダーで変える道具（面積は出さない）。
   数値は ikkan のまま（自作）。長さは座標から計算し直して照らし合わせる（GE.verify・CH.check）。 */
(function () {
  var C = CH.C, K = K3, v = K.v, RAD = Math.PI / 180, S3 = Math.sqrt(3);
  var OUT = 'rgba(20,40,30,.9)';
  /* ---- 4つの図の座標 ---- */

  var BXE = K.cuboid(3, 4, 12);
  GE.verify(PA, 'AB＝BC＝CA＝8、HC＝4', null, 'ア'); GE.checkFig(PA, { rights: ['AHC'] }, 'ア');
  CH.check(CH.near(Math.pow(GE.len(PA, 'AH'), 2), 48) && CH.near(Math.pow(4 * S3, 2), 48), 'ア（x＝4√3）');
  GE.verify(PB, 'AC＝4、BC＝3、AB＝5', null, 'イ'); GE.checkFig(PB, { rights: ['ACB'] }, 'イ');
  GE.verify(PC, 'OA＝OB＝OR＝5、OH＝3、AH＝HB＝4、AB＝8', null, 'ウ'); GE.checkFig(PC, { rights: ['OHB'] }, 'ウ');

  /* 例題（定理の逆）：c がいちばん長い辺。直角かどうかは、余弦（座標で作った三角形の角）で確かめる */

      { tag: '例題', bh: '例題　定理の逆', q: '3辺の長さが次の三角形は、直角三角形だろうか。ア 5、12、13　イ 4、6、7　ウ 3、√7、4（cm）', a: 'ア ○、イ ×、ウ ○',

        b: { t: 'ア <b>○</b>（25＋144＝169）　イ <b>×</b>（52 と 49）　ウ <b>○</b>（9＋7＝16）', col: C.yel },
        draw: function (D) {
          var B = CH.box(D, { l: .03, r: .03, t: .04, b: .04 }), cells = D.W > D.H * .9 ? CH.cols(B, 3, .05) : CH.rows(B, 3, .05), t = D.ph ? D.t : 0;
          EXT.forEach(function (e, i) {
            var cell = cells[i], s = CH.fs(D, .9), tall = cell.h > cell.w;
            var fr = tall ? CH.rect(cell.x0, cell.y0 + s * 1.6, cell.x1, cell.y0 + cell.h * .62) : CH.rect(cell.x0 + s * 1.6, cell.y0, cell.x0 + cell.w * .5, cell.y1);
            var F = GE.fit(D, fr, e.P, { pad: .14 }), k = CH.smooth(i * .3, i * .3 + .25, t);
            GE.poly(F, 'ABC', { col: C.blue, fa: .12, stroke: C.chalk, sw: 2.4 });
            lab(F, GE.mid(e.P.C, e.P.B), e.t[0], -90, { k: .8 }); lab(F, GE.mid(e.P.C, e.P.A), e.t[1], 180, { k: .9 }); lab(F, GE.mid(e.P.A, e.P.B), e.t[2], 45, { k: .9 });
            CH.text(D, cell.x0 + 4, cell.y0 + s * .7, e.n, { size: s * 1.2, align: 'left' });
            if (k > 0) {
              if (e.ok) GE.right(F, 'ACB', { col: C.yel, a: k, r: F.s * .7 }); else GE.arc(F, 'BCA', { col: C.pink, a: k, fill: .3, lab: '約' + Math.round(e.g) + '°' });
              var tx = tall ? cell.cx : cell.x0 + cell.w * .75, ty = tall ? cell.y0 + cell.h * .74 : cell.cy - s * .9;
              CH.text(D, tx, ty, e.ok ? '○' : '×', { size: s * 1.8, col: e.ok ? C.yel : C.pink, a: k, outline: OUT });
              CH.text(D, tx, ty + s * 1.9, e.sq, { size: CH.fitSize(D, e.sq, (tall ? cell.w : cell.w * .48) - 4, s * .9), col: e.ok ? C.yel : C.pink, a: k, outline: OUT });
            }
          });
        } },

      { tag: '考えよう', bh: '考えよう',
        q: '直角三角形の 3辺を 1辺とする正三角形 P、Q、R の面積を求めよう（直角をはさむ辺 3cm・4cm、斜辺 5cm）。どんなことに気づくだろう。',
        notes: ['P・Q・R の面積を求めて、くらべよう。', '正方形のときと くらべよう。ほかの図形（半円など）でも、成り立つだろうか。', 'スライダーで、直角三角形の形と、3辺の上にかく図形を変えられます。'],
        sliders: [{ key: 'b', label: 'たての辺', min: 2, max: 6, step: .5, val: 4, fmt: function (x) { return x + 'cm'; } }, { key: 'f', label: '図形', min: 0, max: 2, step: 1, val: 0, fmt: function (x) { return ['正三角形', '正方形', '半円'][x]; } }],
        draw: function (D) {
          var P = { C: [0, 0], B: [3, 0], A: [0, D.V.b] }, f = D.V.f;
          var sP = shapeOn(P.C, P.B, P.A, f), sQ = shapeOn(P.C, P.A, P.B, f), sR = shapeOn(P.A, P.B, P.C, f);
          var R = CH.box(D, { l: .06, r: .06, t: .04, b: .04 }), F = GE.fit(D, R, P, { bounds: sP.concat(sQ, sR), pad: .04 });
          GE.polyP(F, sP, { col: C.blue, fa: .3 }); GE.polyP(F, sQ, { col: C.pink, fa: .3 }); GE.polyP(F, sR, { col: C.yel, fa: .25 });
          GE.poly(F, 'ABC', { col: C.chalk, fa: .12, stroke: C.chalk, sw: 3 }); GE.right(F, 'ACB');
          var c = function (pts) { var x = 0, y = 0; pts.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; };
          [[sP, 'P', C.blue], [sQ, 'Q', C.pink], [sR, 'R', C.yel]].forEach(function (s) { var p = F.X(c(s[0])); CH.text(D, p[0], p[1], s[1], { size: F.s * 1.3, col: s[2], outline: OUT }); });
          lab(F, GE.mid(P.C, P.B), '3cm', 90, { k: .9 }); lab(F, GE.mid(P.C, P.A), D.V.b + 'cm', 0, { k: 1.4 });
        } },

      { tag: 'チャレンジ', bh: 'チャレンジ',
        q: '長方形 ABCD で、AB＝9cm、BC＝12cm。頂点 B から対角線 AC に垂線 BH をひく。AC・BH・AH の長さは？',
        a: 'AC ＝ 15cm、BH ＝ 36/5&nbsp;cm、AH ＝ 27/5&nbsp;cm',
        sub: 'AC² ＝ 9² ＋ 12² ＝ 225。△ABC の面積を 2通りに　1/2 × 15 × BH ＝ 1/2 × 9 × 12 ＝ 54 → BH ＝ 36/5。△ABH で AH² ＝ 9² − (36/5)² ＝ 729/25', dur: 8,
        banner: function (s) { if (!s.ph) return ''; return s.t < .25 ? 'AC² ＝ 9² ＋ 12² ＝ 225' : s.t < .5 ? '△ABC ＝ 1/2 × 9 × 12 ＝ 54' : s.t < .75 ? '1/2 × 15 × BH ＝ 54 → BH ＝ 36/5' : '△ABH で　AH² ＝ 9² − (36/5)²'; },
        b: { t: 'AC ＝ <b>15</b>　面積 2通り → BH ＝ <b>36/5</b>　AH² ＝ 81 − 1296/25 → AH ＝ <b>27/5</b>（cm）', col: C.orange },
        draw: function (D) {
          var t = D.ph ? D.t : 0, R = CH.box(D, { l: .1, r: .1, t: .1, b: .08 }), F = GE.fit(D, R, PR, { pad: .1 });
          var a1 = CH.smooth(.02, .2, t), a2 = CH.smooth(.27, .45, t) * (1 - CH.smooth(.75, .85, t)), a3 = CH.smooth(.52, .7, t), a4 = CH.smooth(.78, .95, t);
          if (a2 > 0) GE.poly(F, 'ABC', { col: C.blue, fa: .28 * a2, stroke: false });
          if (a4 > 0) GE.poly(F, 'ABH', { col: C.yel, fa: .3 * a4, stroke: false });
          GE.seg(F, ['A', 'B']); GE.seg(F, ['B', 'C']); GE.seg(F, ['C', 'D']); GE.seg(F, ['D', 'A']);
          GE.seg(F, ['A', 'C'], { col: a1 ? C.yel : C.chalk, w: a1 ? 3.2 : 2.2 });
          GE.seg(F, ['B', 'H'], { col: a3 ? C.pink : C.chalk, w: a3 ? 3.2 : 2.2 });
          GE.right(F, 'BHC', { col: a3 ? C.pink : C.chalk }); GE.dot(F, 'H');
          GE.labels(F, ['A', 'B', 'C', 'D', 'H'], { dir: { A: 'nw', B: 'sw', C: 'se', D: 'ne', H: 'ne' } });
          lab(F, GE.mid(PR.A, PR.B), '9cm', 180, { k: 1.4 }); lab(F, GE.mid(PR.B, PR.C), '12cm', -90, { k: 1 });
          if (a1 > 0) lab(F, GE.lerpP(PR.A, PR.C, .7), '15', 50, { k: 1, col: C.yel, a: a1 });
          if (a3 > 0) lab(F, GE.mid(PR.B, PR.H), '36/5', 135, { k: 1.4, col: C.pink, a: a3 });
          if (a4 > 0) lab(F, GE.mid(PR.A, PR.H), '27/5', 50, { k: 1.2, col: C.yel, a: a4 });
        } }
    ]
  });
