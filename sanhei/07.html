   接点・弦の端は、円と直線の式から座標を出し、長さ・角は座標から測り直して確かめる（GE.verify・CH.check。√ をふくむ長さは、2乗して整数になるかで確かめる）。 */
(function () {

  function rt(n) { n = Math.round(n); var a = 1, b = n; for (var k = 2; k * k <= b; k++) while (b % (k * k) === 0) { a *= k; b /= k * k; } return b === 1 ? String(a) : (a === 1 ? '' : a) + '√' + b; }
  function sq(s) { var m = /^(\d*)√(\d+)$/.exec(s); if (m) { var a = m[1] ? +m[1] : 1; return a * a * +m[2]; } return +s * +s; }

    L.forEach(function (l) { if (l && l.t && (l.a == null || l.a > 0)) say(D, R.cx, y, l.t, { col: l.col, a: l.a, size: s * (l.big ? 1.25 : l.k || 1), maxW: R.w, num: l.num }); y += h * (l && l.big ? 1.2 : 1); });
  }
  /* 辺 pq の外がわ（点 r の反対がわ）に字。inside なら内がわ。たての辺は、字の幅の分だけはなす */
  function sideLab(F, p, q, r, txt, o) {
    o = o || {}; var a = F.X(p), b = F.X(q), c = F.X(r), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], n = [a[1] - b[1], b[0] - a[0]], L = Math.hypot(n[0], n[1]) || 1, g = F.D.ctx, w;
    var sg = (n[0] * (c[0] - m[0]) + n[1] * (c[1] - m[1]) > 0) === !!o.inside ? 1 : -1, sz = o.size || F.s * .85, nx = n[0] / L, ny = n[1] / L;
    g.save(); g.font = '600 ' + sz + 'px "Klee One",sans-serif'; w = g.measureText(txt).width; g.restore();

  /* 円 x²＋y²＝r² と直線 y＝k の交点 */

        notes: ['① 自分の考え（3分）　線をかき入れて、求め方を書こう。', '② ペアの考え（3分）　自分とちがう考えは？'],

        b: [{ t: '垂線 OH と半径 OA → 直角三角形 OAH', col: C.yel }, { t: 'AH²＝8²−3²＝55 → AH＝√55、AB＝2AH＝<b>2√55</b>（cm）', col: C.yel }],

        sliders: [{ key: 'd', label: '弦と中心のきょり', min: 0, max: 4.5, step: .1, val: 2.4, fmt: function (v) { return v.toFixed(1); } }, { key: 'p', label: '接点の位置', min: 10, max: 170, step: 1, val: 55, fmt: function (v) { return v + '°'; } }],
        b: [{ t: '中心から弦への垂線 → 弦を <b>2等分</b>', col: C.green }, { t: '接線は、接点を通る半径に <b>垂直</b>', col: C.green }],

          GE.seg(F, 'AB', { w: 3 }); GE.seg(F, 'MN', { col: C.yel, dash: [7, 5], w: 2.6 }); GE.right(F, 'NMB', { col: C.yel, r: F.s * .5 });
          if (k1 > 0) { GE.seg(F, 'OM', { dash: [7, 5], w: 2.2, a: k1 }); GE.seg(F, 'OA', { w: 2.4, a: k1 }); GE.dot(F, 'O', { a: k1 }); }
          sideLab(F, 'M', 'N', 'B', '4cm', { size: F.s * .8 }); var mm = F.X('M'); say(D, mm[0] + F.s * 2.8, mm[1] + F.s * .9, 'AB＝16cm', { size: F.s * .8 });
          if (k2 > 0) { sideLab(F, 'A', 'M', 'N', '8', { col: C.yel, a: k2, inside: true, k: .3 }); sideLab(F, 'O', 'A', 'M', 'r', { col: C.yel, a: k2 }); sideLab(F, 'O', 'M', 'A', 'r−4', { col: C.yel, a: k2, size: F.s * .8 }); }
          GE.labels(F, k1 > 0 ? ['A', 'B', 'M', 'N', 'O'] : ['A', 'B', 'M', 'N'], { dir: { A: 'w', B: 'e', M: 'se', N: 'n', O: 's' } });
          lines(D, sp[1], [{ t: '中心 O、半径 r とする', a: k1 }, { t: 'OM＝r−4、AM＝8', col: C.yel, a: k2 }, { t: '(r−4)²＋8²＝r²', a: k3 }, { t: 'r²−8r＋16＋64＝r²', a: k3, k: .9 }, { t: '−8r＋80＝0', a: k4 }, { t: '半径 10cm', col: C.orange, big: true, a: k4 }], { mid: true });
        } }
    ]
  });

  /* 今日の問い：半径 8cm、中心から 3cm の弦 */
  function today(D, t) {
    var sp = split(D), P = P1, F = fitC(D, sp[0], P, [0, 0], 8, .08);
    var k1 = CH.ease(CH.smooth(.03, .2, t)), k2 = CH.smooth(.24, .38, t), k3 = CH.smooth(.42, .56, t), k4 = CH.smooth(.6, .74, t), k5 = CH.smooth(.8, .94, t);
    if (k3 > 0) GE.poly(F, 'OAH', { col: C.yel, fa: .28 * k3, stroke: false });
    circ(F, 'O', 8); GE.seg(F, 'AB', { w: 3 }); GE.dot(F, 'O'); GE.dot(F, 'A'); GE.dot(F, 'B');
    if (k1 > 0) { GE.seg(F, ['O', GE.lerpP(P.O, P.H, k1)], { col: C.yel, dash: [8, 6], w: 2.6 }); if (k1 >= 1) { GE.right(F, 'OHB', { col: C.yel }); sideLab(F, 'O', 'H', 'B', '3cm', { col: C.yel, size: F.s * .8 }); } }
    if (k2 > 0) { GE.seg(F, 'OA', { w: 2.6, a: k2 }); sideLab(F, 'O', 'A', 'H', '8cm', { a: k2, size: F.s * .8 }); }
    if (k4 > 0) sideLab(F, 'A', 'H', 'O', '√55', { col: C.yel, a: k4 });
    if (k5 > 0) { GE.tick(F, 'AH', 1, { col: C.yel, a: k5 }); GE.tick(F, 'HB', 1, { col: C.yel, a: k5 }); sideLab(F, 'H', 'B', 'O', '√55', { a: k5 }); }
    GE.labels(F, k1 >= 1 ? ['O', 'A', 'B', 'H'] : ['O', 'A', 'B'], { dir: { O: 'n', A: 'w', B: 'e', H: 's' } });
    if (t > 0) lines(D, sp[1], [{ t: 'O から AB に垂線 OH', col: C.yel, a: k1 }, { t: '半径 OA をひく', a: k2 }, { t: '△OAH は直角三角形', col: C.yel, a: k3 }, { t: 'AH²＝8²−3²＝55', a: k4 }, { t: 'AH＝√55', col: C.yel, a: k4 }, { t: 'H は AB の中点', a: k5, k: .9 }, { t: 'AB＝2√55', col: C.yel, big: true, a: k5 }], { mid: true });
  }
})();
