<script>
/* 相似な図形 第18時：相似の問題を、教え合って解こう（ikkan の lesson_souji_18 と同じ流れ）。
   今日の問い：DE∥BC、AD＝3cm・DB＝6cm・BC＝12cm で、ゆうさんの「3：6＝DE：12」のまちがい探し（△ADE を拡大すると △ABC に重なる → AD：AB）。
   例題：AB∥DC で AD と BC が O で交わる図の △OAB∽△ODC の証明（GE.proof。1行ずつ図が光り、最後に三角形が縮みながら重なる）。
   考えようは、まちがえやすいところ ア〜エ の図を切りかえる道具だけ。チャレンジは台形の対角線でできる △OAD∽△OCB と面積。
   座標は ikkan と同じ作り方（A(6,√45)・B(0,0)・C(12,0)、O(0,0)・A(−3,3)…、台形 A(1,3)・B(0,0)・C(6,0)・D(5,3)）。
   長さ・比・角・相似・面積は、座標から計算し直して照らし合わせる（GE.verify・CH.check）。 */
(function () {
  var C = CH.C, OUT = 'rgba(20,40,30,.9)';
  function at(p, q, t) { return GE.lerpP(p, q, t); }
  function area(P) { var s = 0; for (var i = 0; i < P.length; i++) { var q = P[(i + 1) % P.length]; s += P[i][0] * q[1] - q[0] * P[i][1]; } return Math.abs(s) / 2; }
  function pts(P, s) { return s.split('').map(function (k) { return P[k]; }); }
  function cen(P) { var c = [0, 0]; P.forEach(function (p) { c[0] += p[0] / P.length; c[1] += p[1] / P.length; }); return c; }
  function tx(F, p, s, o) { o = o || {}; var q = F.X(p); CH.text(F.D, q[0] + (o.dx || 0) * F.s, q[1] + (o.dy || 0) * F.s, s, { size: F.s * (o.size || 1), col: o.col, a: o.a, align: o.align, outline: OUT }); }
  function sideLab(F, p, q, s, nrm, o) { o = o || {}; var m = F.X(GE.mid(p, q)), k = F.s * (o.k || 1.1); CH.text(F.D, m[0] + nrm[0] * k, m[1] - nrm[1] * k, s, { size: F.s * (o.size || .9), col: o.col || C.chalk, a: o.a, outline: OUT }); }
  /* 字の札（折り返し）。lines：[[字, 色], …]。o.dry：描かずに高さだけ返す */
  function card(D, R, title, lines, o) {
    o = o || {}; var s = Math.min(CH.fs(D, .95), D.W / 24), pad = s * .8, rows = [];
    lines.forEach(function (l) { if (l[0]) CH.wrap(D, l[0], R.w - pad * 2, s).forEach(function (t) { rows.push([t, l[1]]); }); });
    var h = pad * 2 + s * 1.6 * (rows.length + (title ? 1.1 : 0)); if (o.dry) return h;
    var c = CH.rect(R.x0, R.cy - h / 2, R.x1, R.cy + h / 2);
    CH.card(D, c.cx, c.cy, c.w, c.h, '', { col: o.col || C.yel, fill: 'rgba(255,226,122,.07)', sw: 2, a: o.a });
    var y = c.y0 + pad + s * .5;
    if (title) { CH.text(D, c.x0 + pad, y, title, { size: s, col: o.col || C.yel, align: 'left', a: o.a }); y += s * 1.75; }
    rows.forEach(function (r) { CH.text(D, c.x0 + pad, y, r[0], { size: s, col: r[1] || C.chalk, align: 'left', a: o.a }); y += s * 1.6; });
    return h;
  }
  /* 図と札をならべる（よこ長なら札は右、たて長なら札は上）。図の四角を返す */
  function withCard(D, title, lines, k) {
    var B = CH.box(D, { l: .03, r: .03, t: .1, b: .05 });
    if (D.W > D.H * 1.05) { card(D, CH.rect(B.x0 + B.w * ((k || .6) + .03), B.y0, B.x1, B.y1), title, lines); return CH.rect(B.x0, B.y0, B.x0 + B.w * (k || .6), B.y1); }
    var h = card(D, B, title, lines, { dry: true }); card(D, CH.rect(B.x0, B.y0, B.x1, B.y0 + h), title, lines);
    return CH.rect(B.x0, B.y0 + h + CH.fs(D, 1.3), B.x1, B.y1);
  }
  /* ---- 今日の問い：AB＝AC＝9、BC＝12。AD＝3、DB＝6（DE∥BC） ---- */
  var P0 = { B: [0, 0], C: [12, 0], A: [6, Math.sqrt(45)] }; P0.D = at(P0.A, P0.B, 1 / 3); P0.E = at(P0.A, P0.C, 1 / 3);
  GE.verify(P0, 'AD＝3、DB＝6、BC＝12、DE＝4、DE∥BC、AD：AB＝DE：BC、△ADE∽△ABC', null, '今日の問い');
  CH.check(!GE.near(GE.len(P0, 'AD') / GE.len(P0, 'DB'), GE.len(P0, 'DE') / GE.len(P0, 'BC')) && 3 / 6 * 12 === 6 && 3 / 9 * 12 === 4, '今日の問い：ゆうさんの 6cm はちがう');
  function fig0(D, R, o) {
    o = o || {}; var F = GE.fit(D, R, P0, { pad: .12 });
    GE.poly(F, 'ADE', { col: C.blue, fa: .18, stroke: false });
    GE.poly(F, 'ABC', { fill: false, stroke: C.chalk, sw: 2.6 }); GE.seg(F, 'DE', { w: 2.6 }); GE.par(F, 'DE', 1); GE.par(F, 'BC', 1);
    GE.labels(F, ['A', 'B', 'C', 'D', 'E'], { dir: { A: 'n', B: 'sw', C: 'se', D: 'w', E: 'e' } });
    var n = [-.75, .66];
    if (o.lens !== false) { sideLab(F, P0.A, P0.D, '3cm', n); sideLab(F, P0.D, P0.B, '6cm', n); sideLab(F, P0.B, P0.C, '12cm', [0, -1]); }
    return F;
  }

  /* ---- 例題：AB∥DC、AD と BC が O で交わる（D＝−A/2、C＝−B/2） ---- */
  var PX = { O: [0, 0], A: [-3, 3], B: [2, 3], C: [-1, -1.5], D: [1.5, -1.5] };
  var PROOF = GE.proof({ id: '第18時 例題', lv: 1, ttl: '例題　△OAB∽△ODC の証明', P: PX,
    q: 'AB∥DC で、線分 AD と BC が点 O で交わっている。△OAB∽△ODC を証明しよう。',
    fig: { segs: ['AB', 'DC', 'AD', 'BC'], pars: [['AB', 1], ['DC', 1]], dir: { O: 'e', A: 'nw', B: 'ne', C: 'sw', D: 'se' } },
    hyp: 'AB∥DC', goal: '△OAB∽△ODC', tri: ['OAB', 'ODC'], plan: { q: '', a: '' },
    L: [{ t: '△OAB と △ODC で' }, { t: '∠OAB＝∠ODC', r: 'AB∥DC で、錯角は等しい', n: 1 }, { t: '∠AOB＝∠DOC', r: '対頂角は等しい', n: 2 },
      { t: '①、② より、2組の角が、それぞれ等しいから △OAB∽△ODC', c: 'AA' }],
    point: { a: '相似な三角形の頂点は、対応する順に書く', sub: 'A↔D、B↔C、O↔O だから △OAB∽△ODC（△OAB∽△OCD と書くと、まちがい）' } }, { tag: '例題' });
  /* 方針のステップはとばす（問題文に △OAB∽△ODC と書いてある）。「△OAB と △ODC で」は、問題の板書に入れる */
  PROOF.splice(1, 1); PROOF[0].b.push({ t: '△OAB と △ODC で', col: C.chalk });
  CH.check(!GE.near(GE.ang(PX, 'OAB'), GE.ang(PX, 'OCD')) && GE.near(GE.len(PX, 'OA') / GE.len(PX, 'OD'), 2), '例題：△OAB∽△OCD ではない');

  /* ---- 考えよう：まちがえやすいところ ア〜エ ---- */
  function tf(p) { var q = GE.rot([-p[0], p[1]], [0, 0], 65); return [q[0] * 1.35 + 9.6, q[1] * 1.35 - .4]; }
  var KA = { A: [.6, 3.2], B: [0, 0], C: [3.6, 0] }; KA.D = tf(KA.A); KA.E = tf(KA.B); KA.F = tf(KA.C);
  GE.verify(KA, '△ABC∽△DEF', null, '考えよう ア');
  var KE = { A: [0, 0], B: [8, 0] }, t1 = (Math.sqrt(192) + Math.sqrt(36)) / 2, t2 = (Math.sqrt(192) - Math.sqrt(36)) / 2 * 1.5;
  KE.C = [t1 * Math.cos(Math.PI / 6), t1 * Math.sin(Math.PI / 6)]; KE.D = [12, 0]; KE.E = [24, 0]; KE.F = [12 + t2 * Math.cos(Math.PI / 6), t2 * Math.sin(Math.PI / 6)];
  GE.verify(KE, 'AB：DE＝BC：EF＝2：3、∠BAC＝∠EDF＝30°、AB＝8、BC＝5、DE＝12、EF＝7.5', null, '考えよう エ');
  CH.check(!GE.near(GE.ang(KE, 'ACB'), GE.ang(KE, 'DFE')) && GE.ang(KE, 'ACB') < 90 && GE.ang(KE, 'DFE') > 90, '考えよう エ：相似ではない例（ここで確かめるだけ）');
  var FOUR = [['ア　対応する辺', '例：△ABC∽△DEF で、向きがちがう。辺 AB に対応する辺は？ どこを見ればまちがえない？'],
    ['イ　辺の比の選び方', '例：DE∥BC のとき、DE：BC と等しいのは、AD：DB？ それとも AD：AB？'],
    ['ウ　面積比と体積比', '例：相似比 1：2 の正方形と立方体。面積の比は？ 体積の比は？ 何乗するかを、どう見分ける？'],
    ['エ　相似条件', '例：AB：DE＝BC：EF＝2：3、∠A＝∠D＝30°。「2組の辺の比とその間の角」といえる？']];
  /* ななめに見た立方体（左下手前 (x, y)、1辺 s） */
  function cube2(F, x, y, s, col) {
    var d = [s * .45, s * .35], f = [[x, y], [x + s, y], [x + s, y + s], [x, y + s]], b = f.map(function (p) { return [p[0] + d[0], p[1] + d[1]]; });
    GE.polyP(F, [f[3], f[2], b[2], b[3]], { col: col, fa: .3, sw: 2 }); GE.polyP(F, [f[1], b[1], b[2], f[2]], { col: col, fa: .2, sw: 2 }); GE.polyP(F, f, { col: col, fa: .4, sw: 2 });
  }
  function drawFour(D, R, i) {
    if (i === 0) {
      var F = GE.fit(D, R, KA, { pad: .14 }); GE.poly(F, 'ABC', { col: C.blue, fa: .2, sw: 2.6 }); GE.poly(F, 'DEF', { col: C.orange, fa: .2, sw: 2.6 });
      ['A', 'B', 'C'].forEach(function (k) { var c = cen(pts(KA, 'ABC')), p = KA[k], d = [p[0] - c[0], p[1] - c[1]], l = Math.hypot(d[0], d[1]); tx(F, [p[0] + d[0] / l * .5, p[1] + d[1] / l * .5], k); });
      ['D', 'E', 'F'].forEach(function (k) { var c = cen(pts(KA, 'DEF')), p = KA[k], d = [p[0] - c[0], p[1] - c[1]], l = Math.hypot(d[0], d[1]); tx(F, [p[0] + d[0] / l * .6, p[1] + d[1] / l * .6], k); });
      GE.arc(F, 'BAC', { n: 1 }); GE.arc(F, 'EDF', { n: 1 }); GE.arc(F, 'ABC', { n: 2 }); GE.arc(F, 'DEF', { n: 2 });
    }
    if (i === 1) { fig0(D, R, { lens: false }); }
    if (i === 2) {
      var F2 = GE.fit(D, R, { a: [-.3, -.9], b: [9.6, 3.2] }, { pad: .02 });
      GE.polyP(F2, [[0, 0], [1, 0], [1, 1], [0, 1]], { col: C.blue, fa: .3 }); GE.polyP(F2, [[1.6, 0], [3.6, 0], [3.6, 2], [1.6, 2]], { col: C.blue, fa: .3 });
      cube2(F2, 4.6, 0, 1, C.orange); cube2(F2, 6.4, 0, 2, C.orange);
      tx(F2, [1.8, -.55], '正方形', { size: .85, col: C.blue }); tx(F2, [6.9, -.55], '立方体', { size: .85, col: C.orange });
    }
    if (i === 3) {
      var F3 = GE.fit(D, R, KE, { pad: .1 }); GE.poly(F3, 'ABC', { col: C.blue, fa: .2, sw: 2.6 }); GE.poly(F3, 'DEF', { col: C.orange, fa: .2, sw: 2.6 });
      GE.labels(F3, ['A', 'B', 'C', 'D', 'E', 'F'], { dir: { A: 'sw', B: 'se', C: 'n', D: 'sw', E: 'se', F: 'n' } });
      GE.arc(F3, 'BAC', { lab: '30°', r: F3.s * 1.4 }); GE.arc(F3, 'EDF', { lab: '30°', r: F3.s * 1.4 });
      sideLab(F3, KE.A, KE.B, '8cm', [0, -1]); sideLab(F3, KE.B, KE.C, '5cm', [.9, .45]); sideLab(F3, KE.D, KE.E, '12cm', [0, -1]); sideLab(F3, KE.E, KE.F, '7.5cm', [.6, .8]);
    }
  }

  /* ---- チャレンジ：台形 ABCD（AD∥BC、AD＝4、BC＝6）、O は対角線の交点。△OAD＝8 → △OBC＝18 ---- */
  var P8 = { B: [0, 0], C: [6, 0], A: [1, 3], D: [5, 3] }; P8.O = GE.meet(P8.A, P8.C, P8.B, P8.D);
  GE.verify(P8, 'AD∥BC、AD＝4、BC＝6、∠OAD＝∠OCB、∠ODA＝∠OBC、△OAD∽△OCB、AO：OC＝2：3', null, 'チャレンジ');
  var K8 = 8 / area(pts(P8, 'OAD'));
  CH.check(CH.near(area(pts(P8, 'OBC')) * K8, 18) && CH.near(area(pts(P8, 'OAD')) / area(pts(P8, 'OBC')), 4 / 9) && 8 * 9 / 4 === 18, 'チャレンジ：△OBC＝18');

  K3.run({
    no: '第18時', title: '相似の問題を、教え合って解こう', flat: true, hint: '', alt: '相似の問題の図',
    links: [{ href: 'index.html', label: '目次' }, { href: '17.html', label: '◀ 第17時' }, { href: '19.html', label: '第19時 ▶' }],
    steps: [
      { tag: '今日の問い', bh: 'ゆうさんの求め方', q: '△ABC で、DE∥BC、AD＝3cm、DB＝6cm、BC＝12cm のとき、DE の長さを、ゆうさんは「3：6＝DE：12 より、DE＝6cm」と求めた。まちがいを見つけて、正しく直そう。',
        notes: ['① 自分の考え（3分）　まちがいの場所と、直し方を書こう。', '② ペアの考え（3分）　自分とちがう気づきを書こう。'],
        draw: function (D) { var F = fig0(D, withCard(D, 'ゆうさんの求め方', [['3：6＝DE：12'], ['→　DE＝6cm']])); sideLab(F, P0.D, P0.E, 'DE？', [0, 1], { col: C.yel }); } },
      { tag: '今日の問い', q: 'まちがいはどこ？ 正しい DE の長さは？', a: 'AD：DB を使ったのがまちがい。DE＝4cm', sub: 'DE：BC と等しいのは、AD：AB（△ADE と △ABC の相似比）。AB＝3＋6＝9 → 3：9＝DE：12 → DE＝4', dur: 7,
        b: [{ t: '✕ 3：6＝DE：12（AD：DB を使った）', col: C.pink }, { t: '○ AD：AB＝DE：BC → 3：9＝DE：12 → <b>DE＝4cm</b>', col: C.yel }],
        banner: function (s) { if (!s.ph) return ''; return s.t < .3 ? 'DB は、△ADE の辺ではない' : s.t < .72 ? '△ADE を拡大すると、△ABC に重なる' : 'AD に対応するのは AB → 3：9＝DE：12'; },
        draw: function (D) {
          var t = D.ph ? D.t : 0, F = fig0(D, withCard(D, 'ゆうさんの求め方', [['3：6＝DE：12' + (t > .1 ? '　✕' : ''), t > .1 ? C.pink : null], ['→　DE＝6cm', t > .1 ? C.pink : null], [t > .1 ? '（AD：DB を使った）' : '', C.pink], [t > .76 ? '正しくは 3：9＝DE：12' : '', C.yel], [t > .76 ? '→　DE＝4cm' : '', C.yel]])), a1 = v(0, .08, t) * (1 - v(.26, .32, t));
          if (a1 > 0) { GE.seg(F, 'DB', { col: C.pink, w: 5, glow: true, a: a1 }); }
          if (t > .3 && t < .74) GE.polyP(F, GE.moveTri(P0, 'ADE', 'ABC', CH.smooth(.34, .66, t)), { col: C.yel, fa: .22, sw: 3 });
          if (t > .72) { var a2 = v(.72, .82, t); GE.seg(F, 'AB', { col: C.yel, w: 5, glow: true, a: a2 }); GE.seg(F, 'DE', { col: C.yel, w: 5, glow: true, a: a2 }); GE.seg(F, 'BC', { col: C.yel, w: 4, a: a2 }); sideLab(F, P0.D, P0.E, '4cm', [0, 1], { col: C.yel, a: a2 }); }
        } },
      { tag: 'ことば', bh: 'ことば', q: '△ABC で DE∥BC のとき、等しい比は？ 相似比が m：n のとき、面積の比・体積の比は？', a: 'AD：AB＝AE：AC＝DE：BC',
        sub: '辺を分けた比 AD：DB＝AE：EC も等しい（でも DE：BC とは等しくない）。面積の比 m²：n²、体積の比 m³：n³', dur: 6,
        b: [{ t: 'DE∥BC → <b>AD：AB＝AE：AC＝DE：BC</b>（AD：DB＝AE：EC も）', col: C.green }, { t: '相似比 m：n → 面積の比 <b>m²：n²</b>、体積の比 <b>m³：n³</b>', col: C.green }],
        banner: function (s) { if (!s.ph) return ''; return s.t < .7 ? 'AD：AB ＝ AE：AC ＝ DE：BC' : 'AD：DB ＝ AE：EC'; },
        draw: function (D) {
          var R = CH.box(D, { l: .08, r: .08, t: .12, b: .06 }), F = fig0(D, R, { lens: false }), t = D.ph ? D.t : 0;
          [['AD', 'AB', C.yel], ['AE', 'AC', C.blue], ['DE', 'BC', C.pink]].forEach(function (q, i) {
            var a = v(.05 + i * .2, .15 + i * .2, t) * (1 - v(.68, .72, t)); if (a <= 0) return;
            GE.seg(F, q[1], { col: q[2], w: 3.5, a: a }); GE.seg(F, q[0], { col: q[2], w: 6, glow: true, a: a });
          });
          var a4 = v(.72, .8, t); if (a4 > 0) { GE.seg(F, 'AD', { col: C.green, w: 6, glow: true, a: a4 }); GE.seg(F, 'DB', { col: C.orange, w: 6, glow: true, a: a4 }); GE.seg(F, 'AE', { col: C.green, w: 6, glow: true, a: a4 }); GE.seg(F, 'EC', { col: C.orange, w: 6, glow: true, a: a4 }); }
        } }
    ].concat(PROOF, [
      { tag: '考えよう', q: '相似の問題で、自分がまちがえやすいところを、ア〜エ から 1つ選ぼう。「こうすればまちがえない」というコツを、友だちに教えるつもりで書こう。',
        notes: ['ア 対応する辺　イ 辺の比の選び方　ウ 面積比と体積比　エ 相似条件', '選んだものと、コツ（例も入れよう）。友だちのコツを聞いて、気づいたこと。', 'スライダーで、ア〜エ の例の図を切りかえられます。'],
        sliders: [{ key: 'i', label: 'まちがえやすいところ', min: 0, max: 3, step: 1, val: 0, fmt: function (x) { return 'アイウエ'.charAt(x); } }],
        draw: function (D) { var i = D.V.i; drawFour(D, withCard(D, FOUR[i][0], [[FOUR[i][1]]], .55), i); } },
      { tag: 'チャレンジ', bh: 'チャレンジ　台形の対角線', q: '台形 ABCD で、AD∥BC、AD＝4cm、BC＝6cm。対角線 AC、BD の交点を O とする。① △OAD∽△OCB を証明しよう。② △OAD の面積が 8cm² のとき、△OBC の面積は？',
        a: '② 18cm²', sub: '① AD∥BC より、錯角は等しいから ∠OAD＝∠OCB、∠ODA＝∠OBC。2組の角が、それぞれ等しいから △OAD∽△OCB　② 相似比 AD：CB＝4：6＝2：3、面積の比 4：9 → 8：△OBC＝4：9 → 18', dur: 8,
        b: [{ t: '① 錯角 ∠OAD＝∠OCB、∠ODA＝∠OBC → 2組の角 → △OAD∽△OCB', col: C.orange }, { t: '② 相似比 2：3 → 面積の比 4：9 → △OBC＝<b>18cm²</b>', col: C.orange }],
        banner: function (s) { if (!s.ph) return ''; return s.t < .42 ? 'AD∥BC → 錯角が 2組 等しい' : s.t < .76 ? '△OAD∽△OCB（相似比 4：6＝2：3）' : '面積の比 4：9 → 8：△OBC＝4：9 → 18'; },
        draw: function (D) {

          GE.poly(F, 'ABCD', { fill: false, stroke: C.chalk, sw: 2.6 }); GE.seg(F, 'AC'); GE.seg(F, 'BD'); GE.par(F, 'AD', 1); GE.par(F, 'BC', 1);
          var a1 = v(.04, .14, t), a2 = v(.2, .3, t);
          if (a1 > 0) { GE.arc(F, 'OAD', { col: C.yel, fill: .45, a: a1, r: F.s * 1.3 }); GE.arc(F, 'OCB', { col: C.yel, fill: .45, a: a1, r: F.s * 1.3 }); }
          if (a2 > 0) { GE.arc(F, 'ODA', { col: C.pink, fill: .45, a: a2, r: F.s * 1.3, n: 2 }); GE.arc(F, 'OBC', { col: C.pink, fill: .45, a: a2, r: F.s * 1.3, n: 2 }); }
          if (t > .44 && t < .78) GE.polyP(F, GE.moveTri(P8, 'OAD', 'OCB', CH.smooth(.46, .74, t)), { col: C.yel, fa: .25, sw: 3 });
          sideLab(F, P8.A, P8.D, '4cm', [0, 1]); sideLab(F, P8.B, P8.C, '6cm', [0, -1]);
          tx(F, cen(pts(P8, 'OAD')), '8cm²', { size: .8 });
          if (t > .78) tx(F, cen(pts(P8, 'OBC')), '18cm²', { col: C.yel, a: v(.78, .88, t) });

        } }
