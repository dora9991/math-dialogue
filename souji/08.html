<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三角形と比で長さを求める</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script src="../heikou/js/geo.js"></script>
<script>
/* 相似な図形 第8時：三角形と比の性質を使って、線分の長さを求めよう（ikkan の lesson_souji_08 と同じ流れ）。
   図の座標・数値は ikkan のデータ（自作）をもとにした。長さ・比・平行・相似は GE.verify で座標から確かめ、計算は CH.check で計算し直す。
   DE∥BC の図で、AD：DB＝AE：EC（上：下）と AD：AB＝DE：BC（上：全体）を使い分ける。対応する線分が同じ色で光る。
   DE が A の外に出る「砂時計型」（AB∥CD で AD と BC が O で交わる形）でも、相似な三角形から比をつくる。 */
(function () {
  var C = CH.C, FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', OUT = 'rgba(20,40,30,.9)';
  /* ---- このページの道具 ---- */
  function tw(D, s, size) { var g = D.ctx; g.save(); g.font = '600 ' + size + 'px ' + FONT; var w = g.measureText(s).width; g.restore(); return w; }
  function say(D, x, y, s, o) { o = o || {}; var size = o.size || CH.fs(D), w = tw(D, s, size); if (o.maxW && w > o.maxW) size *= o.maxW / w; CH.text(D, x, y, s, Object.assign({ outline: OUT }, o, { size: size })); }
  /* 図の四角（fig）と、字の四角（side）。よこ長ならみぎ、たて長なら下 */
  function lay(D, k, kh) {
    var B = CH.box(D, { l: .03, r: .03, t: .04, b: .04 });
    if (B.w > B.h * 1.15 && B.w > 560) { var w = B.w * (k || .36); return { fig: CH.rect(B.x0, B.y0, B.x1 - w, B.y1), side: CH.rect(B.x1 - w + B.w * .02, B.y0 + B.h * .1, B.x1, B.y1 - B.h * .05), wide: true }; }
    var h = B.h * (kh || .3); return { fig: CH.rect(B.x0, B.y0, B.x1, B.y1 - h), side: CH.rect(B.x0 + B.w * .04, B.y1 - h + 6, B.x1 - B.w * .02, B.y1), wide: false };
  }
  /* 字の行（四角の幅に入るよう、字を小さくする）。list：[{ t, col, a }] */
  function rows(D, R, list, o) {
    o = o || {}; list = list.filter(Boolean); if (!list.length) return;
    var nc = R.w > R.h * 2.2 && list.length > 3 ? 2 : 1, per = Math.ceil(list.length / nc), cw = R.w / nc;   // 下の帯では 2列
    var s = Math.min(o.size || CH.fs(D, .92), R.h / (per * 1.55));
    list.forEach(function (r, i) {
      if (r.a === 0) return; var c = Math.floor(i / per), j = i % per, w = tw(D, r.t, s), sz = w > cw - 8 ? s * (cw - 8) / w : s;
      CH.text(D, R.x0 + c * cw, R.y0 + s * .8 + j * s * 1.55, r.t, { col: r.col || C.chalk, a: r.a, size: sz, align: 'left', outline: OUT });
    });
  }
  /* 辺 ab のそばの字（ref から遠ざかる向き。ref がなければ図の中心から）。pos：a からの位置（0〜1） */
  function len(F, a, b, t, o) {
    o = o || {}; var p = F.X(a), q = F.X(b), u = o.pos == null ? .5 : o.pos, m = [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u];
    var d = [q[0] - p[0], q[1] - p[1]], L = Math.hypot(d[0], d[1]) || 1, n = [-d[1] / L, d[0] / L], r = F.X(o.ref || F.c);
    if ((m[0] - r[0]) * n[0] + (m[1] - r[1]) * n[1] < 0) n = [-n[0], -n[1]];
    var sz = F.s * (o.size || .85), w = tw(F.D, t, sz), k = (o.k || .45) * F.s + Math.abs(n[0]) * w / 2 + Math.abs(n[1]) * sz / 2;
    CH.text(F.D, m[0] + n[0] * k, m[1] + n[1] * k, t, { col: o.col || C.chalk, size: sz, a: o.a, outline: OUT });
  }
  /* 寸法線：線分 ab にそって、外がわへ k ずらした線（両はしに短い線）と字 */
  function dim(F, a, b, o) {
    o = o || {}; var p = F.X(a), q = F.X(b), d = [q[0] - p[0], q[1] - p[1]], L = Math.hypot(d[0], d[1]) || 1, n = [-d[1] / L, d[0] / L], r = F.X(o.ref || F.c), m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    if ((m[0] - r[0]) * n[0] + (m[1] - r[1]) * n[1] < 0) n = [-n[0], -n[1]];
    var k = (o.k || 1) * F.s, h = F.s * .32, P0 = [p[0] + n[0] * k, p[1] + n[1] * k], Q0 = [q[0] + n[0] * k, q[1] + n[1] * k];
    CH.line(F.D, P0[0], P0[1], Q0[0], Q0[1], { col: o.col, w: 3, a: o.a, glow: true });
    [P0, Q0].forEach(function (z) { CH.line(F.D, z[0] - n[0] * h, z[1] - n[1] * h, z[0] + n[0] * h, z[1] + n[1] * h, { col: o.col, w: 2.4, a: o.a }); });
    if (o.t) { var sz = F.s * .85, w = tw(F.D, o.t, sz), kk = k + F.s * .4 + Math.abs(n[0]) * w / 2 + Math.abs(n[1]) * sz / 2; CH.text(F.D, m[0] + n[0] * kk, m[1] + n[1] * kk, o.t, { col: o.col, size: sz, a: o.a, outline: OUT }); }
  }
  function glow(F, ss, col, a) { if (a > 0) ss.split(' ').forEach(function (s) { GE.seg(F, s, { col: col, w: 5, glow: true, a: a }); }); }
  function tri(ab, ac, bc) { var x = (ab * ab - ac * ac + bc * bc) / (2 * bc); return { A: [x, Math.sqrt(ab * ab - x * x)], B: [0, 0], C: [bc, 0] }; }
  /* D は AB 上、E は AC 上（A から t の位置。t＜0 なら A の外がわ）：DE∥BC */
  function para(P, t) { return { A: P.A, B: P.B, C: P.C, D: GE.lerpP(P.A, P.B, t), E: GE.lerpP(P.A, P.C, t) }; }
  /* AB∥CD で、AD と BC が O で交わる形（O が原点。D＝−k×A、C＝−k×B） */
  function xpts(p, q, h, k) { return { A: [-p, h], B: [q, h], C: [-k * q, -k * h], D: [k * p, -k * h], O: [0, 0] }; }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function ratio(a, b) { var g = gcd(a, b); return a / g + '：' + b / g; }
  function nf(x) { return String(Math.round(x * 10) / 10); }

  /* ---- 今日の問い：AB＝12、AC＝15、BC＝18。AD＝8、DB＝4、AE＝10、EC＝x（5）、DE＝y（12） ---- */
  var T1 = tri(12, 15, 18), P1 = para(T1, 2 / 3);
  GE.verify(P1, 'AD＝8、DB＝4、AE＝10、EC＝5、DE＝12、BC＝18、DE∥BC、AD：DB＝AE：EC＝8：4、AD：AB＝DE：BC＝8：12、△ADE∽△ABC', null, '今日の問いの図');
  CH.check(8 * 5 === 4 * 10 && 8 + 4 === 12 && 12 * 12 === 8 * 18 && 8 * 18 / 4 === 36, '今日の問いの計算（x＝5、y＝12。8：4＝y：18 だと y＝36 になってしまう）');
  var DIR = { A: 'n', B: 'sw', C: 'se', D: 'w', E: 'e' };
  function fit1(D, R) { return GE.fit(D, R, P1, { pad: .13 }); }
  function paraFig(F, lab) {
    GE.figure(F, { segs: ['AB', 'BC', 'CA', 'DE'], pars: [['DE', 1], ['BC', 1]], dots: ['D', 'E'], labels: ['A', 'B', 'C', 'D', 'E'], dir: DIR });
    var mBC = GE.mid(F.P.B, F.P.C);
    Object.keys(lab).forEach(function (s) { var v = lab[s]; if (v == null) return; if (typeof v === 'string') v = { t: v }; len(F, s[0], s[1], v.t, { col: v.col, a: v.a, ref: s === 'DE' ? mBC : null, pos: s === 'DE' ? .38 : .5 }); });
  }
  var GIVEN = [{ t: 'DE∥BC' }, { t: 'AD＝8cm　DB＝4cm' }, { t: 'AE＝10cm　EC＝x', col: C.chalk }, { t: 'BC＝18cm　DE＝y' }];

  /* ---- ことば：DE を A の外まで動かす（AD は −8〜10。AB＝12） ---- */
  [-8, -6, -3, 4, 8, 10].forEach(function (v) { var P = para(T1, v / 12); GE.verify(P, 'DE∥BC、AD：AB＝AE：AC＝DE：BC、AD：DB＝AE：EC', null, 'ことば（AD＝' + v + '）'); });
  var KB = [GE.lerpP(T1.A, T1.B, -8 / 12), GE.lerpP(T1.A, T1.C, -8 / 12)];

  /* ---- 例題1：AB∥CD、OA＝6、OD＝9、CD＝12、AB＝x（8） ---- */
  var P2 = xpts(3.6, 4.4, 4.8, 1.5);
  GE.verify(P2, 'OA＝6、OD＝9、CD＝12、AB＝8、AB∥CD、∠OAB＝∠ODC、∠AOB＝∠DOC、△OAB∽△ODC、OA：OD＝AB：DC＝6：9', null, '例題1の図');
  CH.check(6 * 12 === 9 * 8, '例題1（6：9＝x：12 → x＝8）');
  /* ---- 例題2：AB∥CD、OA＝3、AD＝8（OD＝5）、AB＝6、CD＝10 ---- */
  var P3 = xpts(1.8, 4.2, 2.4, 5 / 3);
  GE.verify(P3, 'OA＝3、AD＝8、OD＝5、AB＝6、CD＝10、AB∥CD、△OAB∽△ODC、OA：OD＝AB：DC＝3：5', null, '例題2の図');
  CH.check(8 - 3 === 5 && 3 * 10 === 5 * 6, '例題2（OD＝5、3：5＝6：CD → CD＝10）');
  var XDIR = { A: 'nw', B: 'ne', C: 'sw', D: 'se', O: 'e' };
  function xFig(F, lab) {
    GE.figure(F, { segs: ['AB', 'CD', 'AD', 'BC'], pars: [['AB', 1], ['CD', 1]], dots: ['O'], labels: ['A', 'B', 'C', 'D', 'O'], dir: XDIR });
    var ref = { OA: 'B', OB: 'A', OC: 'D', OD: 'C', AB: 'O', CD: 'O' };
    Object.keys(lab).forEach(function (s) { var v = lab[s]; if (v == null) return; if (typeof v === 'string') v = { t: v }; len(F, s[0], s[1], v.t, { col: v.col, a: v.a, ref: ref[s], pos: s === 'AB' || s === 'CD' ? .3 : .5 }); });
  }

  /* ---- 考えよう：DE∥FG∥BC。AB＝9、AC＝18、BC＝14（D、F は AB 上、E、G は AC 上） ---- */
  var T4 = tri(9, 18, 14);
  function two(d, f) { var P = { A: T4.A, B: T4.B, C: T4.C }; P.D = GE.lerpP(P.A, P.B, d / 9); P.F = GE.lerpP(P.A, P.B, f / 9); P.E = GE.lerpP(P.A, P.C, d / 9); P.G = GE.lerpP(P.A, P.C, f / 9); return P; }
  CH.check(GE.verify(two(3, 5), 'AD＝3、DF＝2、FB＝4、AE＝6、DE∥FG、FG∥BC') && GE.near(GE.len(two(3, 5), 'EG'), 4) && GE.near(GE.len(two(3, 5), 'GC'), 8), '考えようの図（ここで確かめるだけ）');

  /* ---- チャレンジ：柱 AB（6m）、CD（4m）が w m はなれて立つ。ロープ AD、BC の交点 E、垂線 EF（2.4m） ---- */
  function poles(w) { var P = { A: [0, 6], B: [0, 0], C: [w, 4], D: [w, 0] }; P.E = GE.meet(P.A, P.D, P.B, P.C); P.F = [P.E[0], 0]; return P; }
  [6, 10, 12].forEach(function (w) { GE.verify(poles(w), 'AB＝6、CD＝4、EF＝2.4、AB∥CD、EF∥CD、△EAB∽△EDC、BE：EC＝AB：DC＝3：2、EF：CD＝BE：BC＝3：5', null, 'チャレンジ（きょり ' + w + 'm）'); });
  CH.check(GE.near(4 * 3 / 5, 2.4) && GE.near(6 * 4 / (6 + 4), 2.4), 'チャレンジの計算（EF＝4×3/5＝2.4）');

  var steps = [
    { tag: '今日の問い', bh: '図1（DE∥BC）', q: '図1で、DE∥BC のとき、x、y の値を求めたい。三角形と比の定理の、どの比を、どの線分に使えばよいだろう。わけも考えよう。',
      notes: ['① 自分の考え（3分）　x、y を求める式と、使った比のわけを書こう。', '② ペアの考え（3分）　自分とちがう比の選び方は？'],
      b: { t: 'AD＝8cm、DB＝4cm、AE＝10cm、EC＝x、DE＝y、BC＝18cm', col: C.blue },
      draw: function (D) {
        var L = lay(D), F = fit1(D, L.fig);
        paraFig(F, { AD: '8cm', DB: '4cm', AE: '10cm', EC: { t: 'x', col: C.pink }, DE: { t: 'y', col: C.pink }, BC: '18cm' });
        rows(D, L.side, GIVEN);
      } },
    { tag: '今日の問い', q: 'x（EC の長さ）を求めるには、どの比を使う？', a: 'AD：DB＝AE：EC　8：4＝10：x　x＝5', sub: '辺 AB と辺 AC は、同じ比に分けられる（上：下＝上：下）。8×x＝4×10 より 8x＝40', dur: 4,
      b: { t: 'x … AD：DB＝AE：EC　8：4＝10：x　8x＝40　<b>x＝5</b>', col: C.yel },
      draw: function (D) {
        var L = lay(D), F = fit1(D, L.fig), t = D.ph ? D.t : 0, k1 = CH.smooth(.04, .3, t), k2 = CH.smooth(.32, .58, t), k3 = CH.smooth(.66, .9, t);
        paraFig(F, { AD: { t: '8cm', col: k1 ? C.yel : null }, DB: { t: '4cm', col: k2 ? C.pink : null }, AE: { t: '10cm', col: k1 ? C.yel : null }, EC: { t: k3 > .5 ? '5cm' : 'x', col: C.pink }, DE: 'y', BC: '18cm' });
        if (!D.ph) { rows(D, L.side, GIVEN); return; }
        glow(F, 'AD AE', C.yel, k1); glow(F, 'DB EC', C.pink, k2);
        rows(D, L.side, [{ t: 'x は、上：下 の比', col: C.chalk, a: k1 }, { t: 'AD：DB＝AE：EC', col: C.yel, a: k1 }, { t: '8：4＝10：x', a: k2 }, { t: '8×x＝4×10', a: k3 }, { t: 'x＝5', col: C.pink, a: k3 }]);
      } },
    { tag: '今日の問い', q: 'y（DE の長さ）を求めるには、どの比を使う？', a: 'AD：AB＝DE：BC　8：12＝y：18　y＝12', sub: 'DE と BC の比は、AD と AB（＝8＋4）の比と等しい（△ADE を 1.5倍すると △ABC）。8：4＝y：18 としてはいけない', dur: 5,
      b: { t: 'y … AD：AB＝DE：BC　8：12＝y：18　12y＝144　<b>y＝12</b>（AB＝8＋4）', col: C.yel },
      draw: function (D) {
        var L = lay(D), F = fit1(D, L.fig), t = D.ph ? D.t : 0, k1 = CH.smooth(.03, .22, t), k2 = CH.smooth(.26, .62, t), k3 = CH.smooth(.66, .86, t), k4 = CH.smooth(.88, .98, t);
        if (D.ph && k2 > 0) GE.polyP(F, GE.moveTri(P1, 'ADE', 'ABC', k2), { col: C.yel, fa: .22 * (1 - .6 * k4) });
        paraFig(F, { AD: { t: '8cm', col: k1 ? C.yel : null }, DB: '4cm', AE: '10cm', EC: { t: '5cm', col: C.chalk }, DE: { t: k4 > .5 ? '12cm' : 'y', col: k1 ? C.yel : C.pink }, BC: { t: '18cm', col: k3 ? C.blue : null } });
        if (!D.ph) { rows(D, L.side, GIVEN.slice(0, 2).concat([{ t: 'AE＝10cm　EC＝5cm' }, GIVEN[3]])); return; }
        glow(F, 'AD DE', C.yel, k1); glow(F, 'BC', C.blue, k3); dim(F, 'A', 'B', { col: C.blue, a: k3, k: 2.9, t: '12cm' });
        rows(D, L.side, [{ t: 'y は、上：全体 の比', a: k1 }, { t: 'AD：AB＝DE：BC', col: C.yel, a: k1 }, { t: 'AB＝8＋4＝12', col: C.blue, a: k3 }, { t: '8：12＝y：18', a: k3 }, { t: '12×y＝8×18　y＝12', col: C.pink, a: k4 }]);
      } },
    { tag: 'ことば', bh: 'ことば', q: 'DE∥BC のとき、等しい比を2通りで言おう。また、比例式 a：b＝c：d の a と d、b と c を、それぞれ何という？',
      a: 'AD：AB＝AE：AC＝DE：BC、AD：DB＝AE：EC。a と d は外項、b と c は内項', sub: '外項の積＝内項の積（ad＝bc）。DE が A の外がわ（砂時計の形）にあっても、同じ比が成り立つ', dur: 5,
      notes: ['スライダーで、DE の位置を変えられます（A の外がわにも出せます）。'],
      sliders: [{ key: 'v', label: 'DE の位置（AD）', min: -8, max: 10, step: 1, val: 8, anim: [8, -6], fmt: function (v) { v = Math.round(v); return v < 0 ? 'A の外 ' + (-v) + 'cm' : v ? v + 'cm' : '—'; } }],
      b: [{ t: '<b>三角形と比の定理</b>　DE∥BC ならば', col: C.green }, { t: '① AD：AB＝AE：AC＝DE：BC（上：全体）', col: C.green }, { t: '② AD：DB＝AE：EC（上：下）', col: C.green },
        { t: '比例式 a：b＝c：d … a、d を <b>外項</b>、b、c を <b>内項</b>　外項の積＝内項の積（ad＝bc）', col: C.green }],
      draw: function (D) {
        var v = Math.round(D.V.v), L = lay(D, .4), P = para(T1, v / 12), F = GE.fit(D, L.fig, P, { keys: ['A', 'B', 'C'], bounds: KB, pad: .1 }), out = v < 0;
        if (v) { glow(F, 'DB EC', C.pink, .8); glow(F, 'AD AE', C.yel, 1); glow(F, 'DE', C.yel, 1); glow(F, 'BC', C.blue, 1); }
        GE.figure(F, { segs: ['AB', 'BC', 'CA'].concat(v ? ['DE'] : []), dots: v ? ['D', 'E'] : [], labels: v ? ['A', 'B', 'C', 'D', 'E'] : ['A', 'B', 'C'], dir: { A: out ? 's' : 'n', B: 'sw', C: 'se', D: out ? 'ne' : 'w', E: out ? 'nw' : 'e' } });
        if (v) { GE.par(F, 'DE', 1); GE.par(F, 'BC', 1); }
        var a = Math.abs(v);
        rows(D, L.side, [{ t: 'AB＝12、AC＝15、BC＝18' }, v ? { t: 'AD：AB＝AE：AC＝DE：BC', col: C.yel } : null, v ? { t: '　＝' + ratio(a, 12), col: C.yel } : null,
          v ? { t: 'AD：DB＝AE：EC', col: C.pink } : null, v ? { t: '　＝' + ratio(a, 12 - v), col: C.pink } : null, out ? { t: '（砂時計の形）', col: C.chalk } : null]);
      } },
    { tag: '例題', bh: '例題　図2（AB∥CD）', q: '図2で、AB∥CD で、線分 AD と BC は点 O で交わっている。OA＝6cm、OD＝9cm、CD＝12cm のとき、AB＝x の値を求めよう。□ をうめよう。',
      a: '△OAB∽△ODC　OA：OD＝AB：DC　6：9＝x：12　x＝8', sub: '錯角（AB∥CD）と対頂角で、2組の角が等しいから相似。△OAB を O のまわりに回して 1.5倍すると △ODC', dur: 5,
      b: [{ t: '△OAB∽△ODC（2組の角）　OA：OD＝AB：DC', col: C.pink }, { t: '6：9＝x：12　9x＝72　<b>x＝8</b>', col: C.pink }],
      draw: function (D) {
        var L = lay(D, .42), F = GE.fit(D, L.fig, P2, { pad: .14 }), t = D.ph ? D.t : 0, k1 = CH.smooth(.04, .48, t), k2 = CH.smooth(.5, .66, t), k3 = CH.smooth(.68, .82, t), k4 = CH.smooth(.84, .96, t);
        if (D.ph) GE.polyP(F, GE.moveTri(P2, 'OAB', 'ODC', k1), { col: C.yel, fa: .25 * (1 - .5 * k2) });
        xFig(F, { OA: { t: '6cm', col: k2 ? C.yel : null }, OD: { t: '9cm', col: k2 ? C.yel : null }, CD: { t: '12cm', col: k2 ? C.pink : null }, AB: { t: k4 > .5 ? '8cm' : 'x', col: C.pink } });
        glow(F, 'OA OD', C.yel, k2); glow(F, 'AB CD', C.pink, k2);
        var f = function (s, k) { return k > .5 ? s : '□'; };
