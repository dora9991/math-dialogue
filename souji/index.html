<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相似な図形の黒板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
<style>
/* 目次：黒板に、20時間を並べる */
html,body{height:auto}
.app{height:auto;min-height:100%}
.menu{padding:.4rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.menu p.lead{margin:0;font-family:var(--f-chalk);font-weight:600;color:var(--chalk-2);font-size:1.05rem;line-height:1.6}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:.6rem}
.list li{display:flex;flex-direction:column;gap:.3rem;padding:.65rem .9rem;border:2px solid var(--chalk-4);border-radius:12px;min-width:0}
.list li.on{border-color:var(--chalk-3);background:rgba(242,240,230,.05)}
.list .no{font-family:var(--f-chalk);font-weight:600;font-size:.9rem;color:var(--chalk-2)}
.list .ttl{font-family:var(--f-chalk);font-weight:600;font-size:1.1rem;line-height:1.45}
.list li:not(.on) .ttl{color:var(--chalk-2)}
.list .go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.15rem}
.list .soon{font-size:.85rem;color:var(--chalk-3)}
</style>
</head>
<body>
<div class="app" lang="ja">
  <div class="board">
    <header class="bar"><h1><small>中3</small>相似な図形の黒板（目次）</h1></header>
    <div class="track" aria-hidden="true"></div>
    <main class="menu">
      <p class="lead">電子黒板に映して、図を動かしながら考える授業のページ。20時間ぶん。証明は1行ずつ、図の辺や角が光ります。</p>
      <ul class="list" id="list"></ul>
    </main>
  </div>
</div>
<script>
(function () {
  /* 時間ごとの題名は、ikkan の相似な図形と同じ */
  var L = [
    ['第1時', '「形が同じ」とは、どういうことだろう', [['01.html', 'ひらく ▶']]],
    ['第2時', '相似比を使って、辺の長さを求めよう', [['02.html', 'ひらく ▶']]],
    ['第3時', '2つの三角形が相似であることは、何を調べればわかるだろう', [['03.html', 'ひらく ▶']]],
    ['第4時', '相似条件を使って、相似な三角形を見つけよう', [['04.html', 'ひらく ▶']]],
    ['第5時', '2つの三角形が相似であることを、証明しよう', [['05.html', 'ひらく ▶']]],
    ['第6時', '縮図を使って、はかれない高さやきょりを求めよう', [['06.html', 'ひらく ▶']]],
    ['第7時', '三角形の辺に平行な直線をひくと、どんな比ができるだろう', [['07.html', 'ひらく ▶']]],
    ['第8時', '三角形と比の性質を使って、線分の長さを求めよう', [['08.html', 'ひらく ▶']]],
    ['第9時', '線分の比が等しければ、平行といえるだろうか', [['09.html', 'ひらく ▶']]],
    ['第10時', '2辺の中点を結ぶと、どんなことがいえるだろうか', [['10.html', 'ひらく ▶']]],
    ['第11時', '中点連結定理を使って、図形の性質を証明しよう', [['11.html', 'ひらく ▶']]],
    ['第12時', '平行な直線にはさまれた線分の比を調べよう', [['12.html', 'ひらく ▶']]],
    ['第13時', 'ノートの罫線だけで、線分を等分しよう', [['13.html', 'ひらく ▶']]],
    ['第14時', '2倍に拡大すると、面積も2倍になるだろうか', [['14.html', 'ひらく ▶']]],
    ['第15時', '面積比を使って、面積を求めよう', [['15.html', 'ひらく ▶']]],
    ['第16時', '相似な立体の表面積と体積は、何倍になるだろう', [['16.html', 'ひらく ▶']]],
    ['第17時', '体積比を使って、体積を求めよう', [['17.html', 'ひらく ▶']]],
    ['第18時', '相似の問題を、教え合って解こう', [['18.html', 'ひらく ▶']]],
    ['第19時', 'どちらが得か、相似を使って判断しよう', [['19.html', 'ひらく ▶']]],
    ['第20時', '「相似な図形」で学んだことを、整理して確かめよう', [['20.html', 'ひらく ▶']]]
  ];
  document.getElementById('list').innerHTML = L.map(function (x) {
    var on = !!x[2];
    return '<li' + (on ? ' class="on"' : '') + '><span class="no">' + x[0] + '</span><span class="ttl">' + x[1] + '</span>' +
      (on ? '<span class="go">' + x[2].map(function (l) { return '<a class="btn primary" href="' + l[0] + '">' + l[1] + '</a>'; }).join('') + '</span>' : '<span class="soon">準備中</span>') + '</li>';
  }).join('');
})();
</script>
</body>
</html>
