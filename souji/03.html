<script>
/* 相似な図形 第3時：2つの三角形が相似であることは、何を調べればわかるだろう（ikkan の lesson_souji_03 と同じ流れ）。
   図の座標・数値は ikkan のデータ（自作）をもとにした。三角形は「3辺」「2辺と間の角」「1辺と両端の角」から座標で作り、
   辺の比・角は GE.len・GE.ang で計算し直して、CH.check・GE.verify で答えと照らし合わせる。
   今日の問い：△ABC を 2倍にした △DEF を、コンパスと分度器でかく3通りのかき方を、順に動かして見せる。
   ことば：相似条件（3組の辺の比・2組の辺の比とその間の角・2組の角）と、合同条件との見くらべ。考えよう：2辺と1つの角（間でない角）では、三角形が2通りできる。 */
(function () {
  var C = CH.C, R = Math.PI / 180, FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', OUT = 'rgba(20,40,30,.9)';
  /* ---- このページの道具 ---- */
  function box(D, o) { return CH.box(D, o || { l: .05, r: .05, t: .08, b: .1 }); }

  function lay(D, k) {

    });

  /* 点の並び（座標）の角：頂点 v、両どなり a・b */

  function movePoly(P, s1, s2, k) {
    var p = s1.split('').map(function (n) { return P[n]; }), q = s2.split('').map(function (n) { return P[n]; }), av = function (a) { return a.reduce(function (m, x) { return [m[0] + x[0] / a.length, m[1] + x[1] / a.length]; }, [0, 0]); };
    var cp = av(p), cq = av(q), th = Math.atan2(q[1][1] - q[0][1], q[1][0] - q[0][0]) - Math.atan2(p[1][1] - p[0][1], p[1][0] - p[0][0]);
    while (th > Math.PI) th -= 2 * Math.PI; while (th <= -Math.PI) th += 2 * Math.PI;

  }

  function labs(F, ns, o) {
    o = o || {}; var c = F.X(cen(F.P, ns)), map = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0], ne: [.75, -.75], nw: [-.75, -.75], se: [.75, .75], sw: [-.75, .75] };
    ns.split('').forEach(function (n) { var p = F.X(n), v = o.dir && o.dir[n] ? map[o.dir[n]] : [p[0] - c[0], p[1] - c[1]], L = Math.hypot(v[0], v[1]) || 1, r = F.s * .95; CH.text(F.D, p[0] + v[0] / L * r, p[1] + v[1] / L * r, n, { size: F.s, col: (o.col && o.col[n]) || C.chalk, a: o.a, w: 600 }); });
  }

  function arcAt(F, c, r, a0, a1, o) { o = o || {}; var g = F.D.ctx, p = F.X(c); g.save(); g.globalAlpha = F.D.ga * (o.a == null ? 1 : o.a); g.strokeStyle = o.col || C.chalk; g.lineWidth = o.w || 2; if (o.dash) g.setLineDash([5, 5]); g.beginPath(); g.arc(p[0], p[1], r * F.u, -a0 * R, -a1 * R, true); g.stroke(); g.restore(); }
  function deg(x) { return Math.round(x) + '°'; }

  /* ---- 今日の問い：△ABC（AB＝4、BC＝6、CA＝5）。角は 約83°・56°・41° ---- */
  var W = tri(4, 6, 5), AB_ = GE.ang(W, 'ABC'), AC_ = GE.ang(W, 'BCA'), AA_ = GE.ang(W, 'CAB');
  CH.check(deg(AA_) === '83°' && deg(AB_) === '56°' && deg(AC_) === '41°' && 83 + 56 + 41 === 180, '今日の問いの角（83°・56°・41°）');
  /* 2倍の △DEF を3通りでかく（DE＝8、EF＝12、FD＝10、∠E＝∠B、∠F＝∠C） */
  var DF0 = { E: [0, 0], F: [12, 0] };
  var K1 = Object.assign({}, DF0);

    var cap = ['① 3辺', '② 2辺とその間の角', '③ 1辺とその両端の角'][i], ccol = k > 0 ? C.yel : 'rgba(242,240,230,.6)';
    if (row) say(D, Rr.x0, Rr.y0 + cs * .7, cap, { size: cs, col: ccol, align: 'left', maxW: Rr.w * .4 });
    else say(D, Rr.cx, Math.max(Rr.y0 + cs * .7, F.X([6, 8.7])[1] - cs * .6), cap, { size: cs, col: ccol, maxW: Rr.w });

    GE.seg(F, [E, GE.lerpP(E, Fp, kb)]); sideLab(F, [E, Fp], '12cm', { ref: KD, a: kb, size: s * .9 });
    var Fx = ext(F, { D: KD, E: E, F: Fp });

      arcAt(F, Fp, 10, 120, 120 + 36 * k2, { col: C.pink }); if (k2 > .9) sideLab(F, [Fp, KD], '10cm', { ref: E, col: C.pink, a: k3, size: s * .9 });
    } else if (i === 1) {

      if (k2 > 0) { GE.seg(F, [E, GE.lerpP(E, KD, k2)], { col: C.blue, w: 3 }); sideLab(F, [E, KD], '8cm', { ref: Fp, col: C.blue, a: k2, size: s * .9 }); }
    } else {

      GE.seg(F, [Fp, GE.polar(Fp, 12 * k2, 180 - KF)], { col: C.pink, w: 1.6, dash: [5, 5] }); if (k2 > 0) mark(Fx, 'DFE', C.pink, { a: k2, t: '41°', size: s * .85 });

  /* ---- 考えよう：AB＝6cm、BC＝4cm、∠A＝30°（C は A から 30°の半直線の上） ---- */
  var SA = { A: [0, 0], B: [6, 0] };
  (function () {
    var b = 12 * Math.cos(30 * R), r = Math.sqrt(b * b - 80), t1 = (b - r) / 2, t2 = (b + r) / 2;
