<script>
/* 平方根 第11時：分配法則や乗法公式を使って計算しよう（ikkan の lesson_heihou_11 と同じ流れ）。

(function () {
  /* ======== 道具（平方根の黒板 第8〜14時で共通。どのページにも同じものを入れてある） ======== */

  }

  function eqW(D, str, size) { return lay(D, str, size).w; }

  function today(D, t) {
