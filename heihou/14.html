/* 平方根 第14時：「平方根」で学んだことを、整理して確かめよう（ikkan の lesson_heihou_14 と同じ流れ。単元のまとめ）。

   例題2は、√49・√18・√0.04・π のカードが、有理数・無理数の場所に入る。考えようは、ア〜エの式の、もとの2つの数が どこにあるかを見る道具（答えは出さない）。
   チャレンジは、n＝26〜35 と 2n＝52〜70 をならべて、2乗の数 64 が光る。
   数値は ikkan のまま。データは自作。式の「＝」の両がわ・大小・有理数かどうかは、ページの中で計算し直して照らし合わせている（CH.check）。 */
(function () {
  /* ======== 道具（平方根の黒板 第8〜14時で共通。どのページにも同じものを入れてある） ======== */

  function eqW(D, str, size) { return lay(D, str, size).w; }
