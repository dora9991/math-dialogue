<script>
/* 平方根 第12時：根号をふくむ式の計算を、たしかなものにしよう（ikkan の lesson_heihou_12 と同じ流れ。まちがい探し）。
   ア〜カの6つの計算は、どれも「＝」のうち1か所だけがまちがい。まちがった「＝」に × がつき、正しい計算が下に出る（どの「＝」がまちがいかは、ページの中で数として計算して決めている）。
   ことばは、計算のきまりの整理図。例題は、答えを書いたあと、点検の3つ（根号の中は小さいか・分母に根号はないか・まとめ忘れはないか）に ✓ がつく。
   考えようは、「かけてから簡単に」と「先に簡単にしてからかける」をくらべる式と、2乗の数の表（答えは出さない）。チャレンジは、3つの部分を1つずつ簡単にしてから まとめる。
   数値は ikkan のまま。データは自作。式の「＝」の両がわは、ページの中で数として計算し直して照らし合わせている（CH.check）。 */
(function () {
  /* ======== 道具（平方根の黒板 第8〜14時で共通。どのページにも同じものを入れてある） ======== */

  }
  /* 式を描く。o：align、a、col（白い字の色をかえる） */
  function EQ(D, cx, cy, str, size, o) {

  }
  function eqW(D, str, size) { return lay(D, str, size).w; }
  function fitEq(D, str, maxW, size) { var w = eqW(D, str, size); return w > maxW ? size * maxW / w : size; }
