/* 平方根 第9時：√2+√3 は √5 だろうか（ikkan の lesson_heihou_09 と同じ流れ）。

          var NL = CH.rect(R.x0 + R.w * .04, R.y0 + R.h * .7, R.x1 - R.w * .04, R.y0 + R.h * .7), X = CH.numline(D, NL, 0, 6, .5, { lab: 1, fmt: function (x) { return String(Math.round(x)); } });
          for (var k = 1; k * R2 <= 6.01; k++) { CH.line(D, X(k * R2), NL.y1 - s * 2.2, X(k * R2), NL.y1 + s * 2.4, { col: C.yel, w: 2, a: .8 }); CH.circle(D, X(k * R2), NL.y1 + s * 2.4, s * .18, { fill: C.yel }); }
          CH.text(D, R.x1, NL.y1 + s * 3.4, '黄色の線：√2 ごとの目もり', { size: s * .75, align: 'right', col: C.yel });
          var y = R.y0 + R.h * .3;
          EQ(D, R.x0 + s * .2, R.y0 + s * 1.2, '√2＋√' + n, s * 1.4, { align: 'left' });
          rod(D, X(0), y, X(R2) - X(0), h, C.blue, '√2', 1); rod(D, X(R2), y, X(R2 + rn) - X(R2), h, C.orange, '√' + n, 1);
          CH.line(D, X(R2 + rn), y + h, X(R2 + rn), NL.y1, { col: C.orange, dash: [5, 4], w: 2 });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'x＝2√3＋√5、y＝√3−√5 のとき、次の式の値を求めよう。① x＋y　② x−2y',
        notes: ['ヒント① x と y の かっこをつけたまま、式に入れてみよう。同じ根号の数は、どれとどれ？', 'ヒント② −2y は、y のかっこの中の、どの数にもかかるよ。'],
        a: '① 3√3　② 3√5', sub: '① (2√3＋√5)＋(√3−√5)＝2√3＋√3＋√5−√5＝3√3　② (2√3＋√5)−2(√3−√5)＝2√3＋√5−2√3＋2√5＝3√5', dur: 9,
        b: { t: '① x＋y＝<b>3√3</b>　② x−2y＝2√3＋√5−2√3＋2√5＝<b>3√5</b>', col: C.orange },
        draw: function (D) {
          var R = box(D), s = CH.fs(D), t = D.ph ? D.t : 0, cs = wide(R) ? CH.rows(R, 2, .1) : CH.rows(R, 2, .1);
          var z = Math.min(s * 1.5, R.h * .07); [C1, C2].forEach(function (L) { L.forEach(function (q) { z = Math.min(z, fitEq(D, q, R.w * .82, z)); }); });
          EQ(D, R.cx, R.y0 + s * .5, 'x＝{b|2√3}＋{o|√5}　　y＝{b|√3}−{o|√5}', Math.min(s * 1.2, fitEq(D, 'x＝2√3＋√5　　y＝√3−√5', R.w * .95, s * 1.2)));
          [C1, C2].forEach(function (L, i) {
            var P = cs[i], y0 = P.y0 + s * 1.6 + (i ? 0 : s * .4), dy = Math.min(z * 2, (P.h - s * 1.2) / 4);
            CH.text(D, P.x0 + s * .2, y0, ['①', '②'][i], { size: s, align: 'left' });
            L.forEach(function (q, j) {
              var a = j === 0 ? 1 : D.ph ? CH.smooth(.05 + i * .45 + (j - 1) * .13, .15 + i * .45 + (j - 1) * .13, t) : 0;
              if (j === 0) EQ(D, P.x0 + s * 1.6, y0, q, z, { align: 'left' }); else EQ(D, P.x0 + s * 1.6 + z * 1.6, y0 + j * dy, q, z, { align: 'left', a: a });
            });
            if (!D.ph) EQ(D, P.x0 + s * 1.6 + z * 1.6, y0 + dy, '＝{y|？}', z, { align: 'left' });
          });
        } }
    ])
