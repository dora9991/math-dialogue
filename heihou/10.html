<script>
/* 平方根 第10時：同じ根号の数をまとめて、たし算・ひき算をしよう（ikkan の lesson_heihou_10 と同じ流れ。根号の中を簡単にしてから まとめる）。

(function () {
  /* ======== 道具（平方根の黒板 第8〜14時で共通。どのページにも同じものを入れてある） ======== */

  }

  function eqW(D, str, size) { return lay(D, str, size).w; }

  function near(a, b) { return Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)); }

  K3.run({

        sub: '(2) 5√3−4√3＝√3（1√3 の 1 は書かない）　(3) 2√7＋√7−3√7＝(2＋1−3)√7＝0', dur: 8,

        } },
