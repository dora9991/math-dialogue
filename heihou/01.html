<script>
/* 平方根 第1時：面積が2の正方形の1辺は、どんな数だろう（ikkan の lesson_heihou_01 と同じ流れ）。

   数直線の区間が 1〜2 → 1.4〜1.5 → 1.41〜1.42 → 1.414〜1.415 とせまくなる（はさみうち）。単位正方形の対角線をたおすと、数直線の √2 の場所。 */
(function () {

  /* 図の枠：四角 R に、座標の範囲 bx＝[x0, y0, x1, y1] を入れる */

    for (y = y0; y <= y1 + 1e-9; y++) { p = F.X([x0, y]); q = F.X([x1, y]); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); }

  function mid(p, q) { return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }

  /* 小数第 k 位までの x の2乗（字）。整数にして計算する */
  function sq(x, k) { var X = Math.round(x * Math.pow(10, k)); return dec(X * X, 2 * k); }

  /* ---- 数と検算 ---- */

  var SQ5 = [[1, 0], [3, 1], [2, 3], [0, 2]], SQ13 = [[2, 0], [5, 2], [3, 5], [0, 3]];

  CH.check(CORN.every(function (c) { var m = mid(c[1], c[2]); return CH.near(2 * m[0] - c[0][0], 1) && CH.near(2 * m[1] - c[0][1], 1) && shoe(c) === .5; }) && 4 * .5 === shoe(SQ2), '今日の問い（すみの三角形を折る）');

    var k = i + 1;
    return { lo: q[0], hi: q[1], step: q[2], big: 5, a: q[3], b: q[4], txt: fx(q[3]) + '²＝' + sq(q[3], k) + '、' + fx(q[4]) + '²＝' + sq(q[4], k), res: fx(q[3]) + '＜x＜' + fx(q[4]) };
  });
  CH.check(LV2[0].txt === '1.4²＝1.96、1.5²＝2.25' && LV2[1].txt === '1.41²＝1.9881、1.42²＝2.0164' && LV2[2].txt === '1.414²＝1.999396、1.415²＝2.002225' &&
    LV2.every(function (L) { return L.a * L.a < 2 && 2 < L.b * L.b && L.a < S2 && S2 < L.b; }) && Math.floor(S2 * 1e8) === 141421356, '今日の問い（1.4＜x＜1.5、1.41＜x＜1.42）');
  /* 例題：面積 5（まわり 3×3 から 2×1÷2 の三角形4つ） */
  var T5 = [[[0, 0], [1, 0], [0, 2]], [[1, 0], [3, 0], [3, 1]], [[3, 1], [3, 3], [2, 3]], [[2, 3], [0, 3], [0, 2]]];
  var EXX = [2.2, 2.3, 2.23, 2.24], EXV = EXX.map(function (x, i) { return sq(x, i < 2 ? 1 : 2); });
  CH.check(shoe(SQ5) === 5 && d2(SQ5[0], SQ5[1]) === 5 && 9 - T5.reduce(function (s, t) { return s + shoe(t); }, 0) === 5 && EXV.join() === '4.84,5.29,4.9729,5.0176' &&
    2.23 < Math.sqrt(5) && Math.sqrt(5) < 2.24 && 2.23 * 2.23 < 5 && 2.24 * 2.24 > 5, '例題（面積 5、2.23＜x＜2.24）');
  /* 考えよう：面積の候補（答えは出さない） */
  var AR = [2, 4, 5, 9, 0.25, 0.5, 1.44];
  /* チャレンジ：5×5 から 3×2÷2 の三角形4つ → 13、3.6²＝12.96、3.7²＝13.69 */
  var T13 = [[[0, 0], [2, 0], [0, 3]], [[2, 0], [5, 0], [5, 2]], [[5, 2], [5, 5], [3, 5]], [[3, 5], [0, 5], [0, 3]]];
  CH.check(shoe(SQ13) === 13 && d2(SQ13[0], SQ13[1]) === 13 && 25 - T13.reduce(function (s, t) { return s + shoe(t); }, 0) === 13 && T13.every(function (t) { return shoe(t) === 3; }) &&
    sq(3.6, 1) === '12.96' && sq(3.7, 1) === '13.69' && 3.6 < Math.sqrt(13) && Math.sqrt(13) < 3.7, 'チャレンジ（13、√13、3.6＜√13＜3.7）');

  /* ---- 今日の問い：図1〜図3 ---- */
  function panel(D, c, P, cap, l1, l2, o) {
    o = o || {}; var s = CH.fs(D, .85), u = Math.min(c.w / 2.4, (c.h - s * 4.6) / 2), gy = c.cy + u - s * .6;
    var F = { X: function (p) { return [c.cx + (p[0] - 1) * u, gy - p[1] * u]; }, u: u, D: D, s: s };
    grid(F, 0, 0, 2, 2);
    poly(F, P, { fill: hexA(o.col || C.blue, .25), stroke: o.col || C.blue, sw: 2.6 });
    say(D, c.cx, gy - 2 * u - s * 1.1, cap, { size: s });
    say(D, c.cx, gy + s * 1.1, l1, { size: s, maxW: c.w, col: o.c1 });

  }
  function three(D) {
    var R = CH.box(D, { l: .03, r: .03, t: .1, b: .06 }), cs = CH.cols(R, 3, .08);

    panel(D, cs[1], SQ4, '図2', '1辺 2cm', '面積 4cm²');

  }
  /* すみの三角形を内がわに折る（t：答えの進み） */
  function fold(D, t) {

    grid(F, 0, 0, 2, 2);

    poly(F, SQ2, { fill: hexA(C.orange, .22), stroke: C.orange, sw: 3 });
    CORN.forEach(function (c, i) {
      if (t <= 0) return;
      var k = CH.ease(CH.smooth(.14 + i * .14, .3 + i * .14, t)), m = mid(c[1], c[2]), cs = Math.cos(Math.PI * k), p = [m[0] + (c[0][0] - m[0]) * cs, m[1] + (c[0][1] - m[1]) * cs];
      poly(F, [c[1], c[2], p], { fill: hexA(k > .5 ? C.pink : C.blue, .4), stroke: k > .5 ? C.pink : C.blue, sw: 2, a: k0 });
    });

    if (t <= 0) { top(D, '図3 の正方形の面積は、なぜ 2cm² といえる？', C.chalk, 1, 0); return; }
    if (t < .14) top(D, '図2 の正方形（面積 4cm²）', C.chalk, k0, 0);
    else if (t < .8) top(D, 'すみの三角形4つを、内がわに折ると…', C.pink, 1, 0);
    else { top(D, 'まん中の正方形に、ぴったり重なる', C.pink, 1, 0); top(D, '図3 ＝ 図2 の半分 → 4÷2＝2（cm²）', C.yel, CH.smooth(.82, .95, t), 1); }
  }
  /* 単位正方形の対角線（面積 2 の正方形の1辺）を、数直線にたおす */
  function diag(D, t) {
    var R = CH.box(D, { l: .05, r: .05, t: .1, b: .1 }), F = fr(D, R, [-1.25, -1.05, 3.25, 2.1]), s = F.s, o = F.X([0, 0]), y = o[1];
    grid(F, -1, 0, 3, 2, .7);
    CH.line(D, F.X([-1.2, 0])[0], y, F.X([3.2, 0])[0], y, { w: 2.4 });
    for (var i = -10; i <= 30; i++) { var x = F.X([i / 10, 0])[0], big = i % 10 === 0; CH.line(D, x, y - (big ? 8 : 4), x, y + (big ? 8 : 4), { w: big ? 2 : 1.1 }); if (big) say(D, x, y + s * 1.1, String(i / 10).replace('-', '−'), { size: s * .8, num: true }); }

    var lab = F.X([.62, .38]); say(D, lab[0], lab[1], k1 > .5 ? '√2' : '?', { size: s, col: k1 > .5 ? C.yel : C.chalk, num: true });
    if (t > 0) {

      var E = F.X(e); CH.line(D, o[0], o[1], E[0], E[1], { col: C.yel, w: 4.5, glow: true, a: k1 });
    }
    if (k2 >= 1) { var P = F.X([S2, 0]); CH.circle(D, P[0], P[1], s * .3, { fill: C.yel }); say(D, P[0], P[1] - s * 1.1, '√2', { col: C.yel, size: s, num: true }); }

  /* 例題：面積 5 の正方形と、x² の表 */
  function ex5(D, t) {

      say(D, q.cx, y + s * 4, 'x ＝ √5', { size: s * 1.1, col: C.yel, a: CH.smooth(.85, 1, t), num: true });

  /* 考えよう：1辺 x の正方形と、面積 a の正方形（点線）をくらべる道具 */

    for (var i = 0; i <= 3; i++) { var p = F.X([i, 0]); say(D, p[0], p[1] + s * .9, String(i), { size: s * .75, num: true, outline: false }); }
