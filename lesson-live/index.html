<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://mtzhbiadzqjhvhzzdsbn.supabase.co http://127.0.0.1:54433; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a1231">
<title>授業ライブ</title>
<meta name="description" content="中学1年数学の授業で使う、小テスト・振り返り・授業の反応ボタン（生徒用）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="sky-deco" aria-hidden="true"></div>
<header class="topbar narrow">
  <div class="in">
    <div class="brand" id="brand"><span class="wm"><b>授業ライブ</b><small>LIVE CLASSROOM</small></span></div>
    <span class="grow"></span>
    <div class="who" id="who"></div>
    <button class="btn ghost iconbtn" id="menuBtn" aria-label="メニュー" hidden></button>
  </div>
</header>
<div id="offline" class="offline" hidden>インターネットにつながっていません。つながると自動で送ります</div>
<main class="wrap" id="app"><p class="empty">読み込み中…</p></main>
<nav class="dock" id="dock" aria-label="授業への反応" hidden>
  <div class="in">
    <button class="rx" data-rx="like"><span class="e" aria-hidden="true">👍</span>いいね</button>
    <button class="rx" data-rx="aha"><span class="e" aria-hidden="true">💡</span>なるほど</button>
    <button class="rx lost" data-rx="lost" aria-pressed="false"><span class="e" aria-hidden="true">🤔</span><span class="lbl">わからない</span></button>
    <button class="rx" data-rx="slow"><span class="e" aria-hidden="true">🐢</span>ゆっくり</button>
    <button class="rx hand" data-rx="hand" aria-pressed="false"><span class="e" aria-hidden="true">✋</span><span class="lbl">手をあげる</span></button>
    <button class="rx" data-rx="help" aria-pressed="false"><span class="e" aria-hidden="true">🆘</span><span class="lbl">ヘルプ</span></button>
    <button class="rx" data-rx="q"><span class="e" aria-hidden="true">❓</span>質問</button>
    <button class="rx" data-rx="c"><span class="e" aria-hidden="true">💬</span>コメント</button>
  </div>
</nav>
<script src="js/config.js"></script>
<script src="js/math.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/bank/u1.js"></script>
<script src="js/bank/u2.js"></script>
<script src="js/bank/u3.js"></script>
<script src="js/bank/u4.js"></script>
<script src="js/bank/u5.js"></script>
<script src="js/bank/u6.js"></script>
<script src="js/bank/u7.js"></script>
<script src="js/figs.js"></script>
<script src="js/ui.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/quizcore.js"></script>
<script src="js/mathinput.js"></script>
<script src="js/gridinput.js"></script>
<script src="js/reflect.js"></script>
<script src="js/student.js"></script>
</body>
</html>
