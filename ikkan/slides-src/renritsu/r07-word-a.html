<p style="font-size:46px;line-height:1.5">② 一方の式を他方の式に<span style="color:#C0392B"><b>代入</b></span>して、<br>　1つの文字を消去する方法を、<span style="color:#C0392B"><b>代入法</b></span>という。</p>
<p style="font-size:46px;line-height:1.5">③ どちらの方法で解いても、解は<span style="color:#C0392B"><b>同じ</b></span>になる。</p>
