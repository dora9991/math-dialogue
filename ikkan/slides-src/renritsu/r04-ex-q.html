<aside>【解説 5分・例題】x−3y＝−5、2x+5y＝12 を解く。① を x＝… に直し、② に代入。解をもとの式に代入して確かめる。発問：x＝… の形の式がないときは、どうしよう。　想定される反応：① を x＝3y−5 に直し、2(3y−5)+5y＝12 と書く。　留意：かっこの理由は言わない（考えようで）。</aside>
