<aside>【解説 5分・例題】x+3y＝2x+3＝5y−1 を、A＝B、B＝C に分けて解き、解を確かめる。空欄の数は、先生が言ってから書かせる。発問：どの組に分けようか。／整理した式は、どう解く？　想定される反応：「x−3y＝−3」「2x−5y＝−4」に整理して、加減法で解く。留意：確かめは、① と ② に解を代入して成り立つか。</aside>
