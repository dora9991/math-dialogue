<p style="font-size:48px;line-height:1.55">式の両辺に、同じ数をかけても、<br>等式は成り立つ。（等式の<span style="color:#C0392B"><b>性質</b></span>）</p>

<div style="display:flex;flex-direction:row;align-items:flex-start;gap:24px">

<p style="font-size:48px;line-height:1.55">係数がそろっていないときは、式の両辺を<span style="color:#C0392B"><b>何倍</b></span>かして、<br>消したい文字の係数の<span style="color:#C0392B"><b>絶対値</b></span>をそろえてから、<br><span style="color:#C0392B"><b>加減法</b></span>で解く。</p>
