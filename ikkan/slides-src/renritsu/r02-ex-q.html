<aside>【解説 5分・例題】x+2y＝10、3x−2y＝6 を、加減法で解く。たして x、代入して y を求め、確かめる。発問：どちらの文字を消せそうだろう。／消したあと、もう1つの文字は、どう求める？　想定される反応：消す文字を決め、①+② で x を求める。x＝4 を ① に代入。　留意：「どの文字を消すか」を、かならず書かせる。</aside>
