<p style="font-size:46px;line-height:1.55">立体を、見えるように表した図を <span style="color:#C0392B"><b>見取図</b></span>、<br>切り開いた図を <span style="color:#C0392B"><b>展開図</b></span> という。</p>
<p style="font-size:46px;line-height:1.55">正面から見た図を <span style="color:#C0392B"><b>立面図</b></span>、真上から見た図を <span style="color:#C0392B"><b>平面図</b></span> という。</p>
<p style="font-size:46px;line-height:1.55">立面図と平面図をあわせた図を <span style="color:#C0392B"><b>投影図</b></span> という。</p>
<p style="font-size:46px;line-height:1.55">平面図形を、直線を軸に 1回転させてできる<br>立体を <span style="color:#C0392B"><b>回転体</b></span> という。</p>
