<div style="display:flex;flex-direction:column;gap:20px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:44px 56px">
<p style="font-size:48px;line-height:1.6">空間にある 2つの直線の位置関係は、<br><span style="color:#C0392B"><b>交わる</b></span>・<span style="color:#C0392B"><b>平行</b></span>・<span style="color:#C0392B"><b>ねじれの位置</b></span>の 3つ。</p>
<p style="font-size:48px;line-height:1.6">平行でなく、交わらない 2直線を、<span style="color:#C0392B"><b>ねじれの位置</b></span>にあるという。</p>
<p style="font-size:48px;line-height:1.6">交わる 2直線、平行な 2直線は、同じ<span style="color:#C0392B"><b>平面</b></span>上にある。</p>
<p style="font-size:48px;line-height:1.6">ねじれの位置にある 2直線は、同じ平面上に<span style="color:#C0392B"><b>ない</b></span>。</p>
</div>

<aside>【解説 3分・ことば（答え）】空欄の答え。先生が言い切ってから、書かせる。交わる 2直線と平行な 2直線は、同じ平面上にある。ねじれの位置にある 2直線は、同じ平面上にない。</aside>
