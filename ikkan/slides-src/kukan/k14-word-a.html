<div style="display:flex;flex-direction:column;gap:28px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:36px 44px">
<p style="font-size:44px;line-height:1.55">身のまわりのものを、円柱・円錐・球などの立体と<span style="color:#C0392B"><b>みなす</b></span>ことを、<br>「<span style="color:#C0392B"><b>モデル</b></span>にする」という。</p>
<p style="font-size:44px;line-height:1.55">モデルで求めた値は、実物とぴったり同じではなく、<span style="color:#C0392B"><b>およそ</b></span>の値である。<br>これを求めることを「見積もる」という。</p>
<p style="font-size:44px;line-height:1.55">モデルが実物より大きいと、見積もりは<span style="color:#C0392B"><b>大きめ</b></span>になり、<br>小さいと<span style="color:#C0392B"><b>小さめ</b></span>になる。</p>
<p style="font-size:44px;line-height:1.55">1L＝<span style="color:#C0392B"><b>1000</b></span>cm³　　1m³＝<span style="color:#C0392B"><b>1000</b></span>L</p>
