<p style="font-size:36px;font-weight:700;background:#FFFFFF;color:#1E3A5F;border:3px solid #1E3A5F;padding:10px 28px;border-radius:12px;white-space:nowrap">学習課題のまとめ</p>
<p style="font-size:30px;color:#6B7480">第14時　身のまわりのものを立体とみなして、量を見積もろう</p>
</div>
<div style="display:flex;flex-direction:row;align-items:flex-start;gap:32px">
<div style="display:flex;flex-direction:column;gap:16px;flex:1;background:#FFFFFF;border:3px solid #E3E6EA;border-radius:20px;padding:32px 48px">
<p style="font-size:34px;font-weight:700;color:#6B7480">【自分の考え】どんな立体とみなすか。</p>
<p style="font-size:48px;line-height:1.45;color:#C0392B"><b>円錐とみなす。底面の半径は 4÷2＝2（m）</b></p>
<div style="border-top:2px solid #E3E6EA;display:flex;flex-direction:column;gap:2px;padding:16px 0px 0px 0px">
<p style="font-size:34px;font-weight:700;color:#6B7480">体積と、運ぶ回数</p>
<p style="font-size:48px;line-height:1.45;color:#C0392B">1⁄3×π×2²×1.5＝2π（m³）</p>
<p style="font-size:48px;line-height:1.45;color:#C0392B">π＝3.14 で　2×3.14＝6.28　およそ 6.28m³</p>
<p style="font-size:48px;line-height:1.45;color:#C0392B">6.28÷0.5＝12.56　→　<b>13回</b></p>
<p style="font-size:44px;line-height:1.45;color:#C0392B">（12回では、運び終わらない）</p>
</div>
