<p style="font-size:42px;line-height:1.5;color:#6B7480">底面の半径が <span style="color:#C0392B"><b>3</b></span>cm、母線の長さが <span style="color:#C0392B"><b>9</b></span>cm の円錐。側面になるおうぎ形の中心角は？</p>
<div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:32px">
<div style="display:flex;flex-direction:column;gap:10px;background:#FFFFFF;border:3px solid #E3E6EA;border-radius:20px;padding:32px 48px;flex:1">
<p style="font-size:46px;line-height:1.5;color:#C0392B"><b>弧の長さ ＝ 底面の円周</b></p>
<p style="font-size:46px;line-height:1.5;color:#C0392B">　2π×3＝6π（cm）</p>
<p style="font-size:46px;line-height:1.5;color:#C0392B"><b>半径 9cm の円の周</b>　2π×9＝18π（cm）</p>
<p style="font-size:46px;line-height:1.5;color:#C0392B"><b>中心角は、円の周の</b>　6π⁄18π</p>
<p style="font-size:50px;font-weight:700;line-height:1.5;color:#C0392B">　360°×6π⁄18π＝120°</p>
</div>
