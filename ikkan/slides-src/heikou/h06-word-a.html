<p style="font-size:30px;color:#6B7480">第6時　多角形の外角の和は、何度になるだろう</p>

<div style="display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:44px 56px">
<p style="font-size:46px;line-height:1.55">多角形の1つの辺をのばしたとき、のばした辺と、<br>となりの辺がつくる角を、その頂点の<span style="color:#C0392B"><b>外角</b></span>という。</p>
<p style="font-size:46px;line-height:1.55">どの頂点でも、内角と外角の和は <span style="color:#C0392B"><b>180°</b></span> である。</p>
<p style="font-size:46px;line-height:1.55">多角形の外角の和は、何角形でも <span style="color:#C0392B"><b>360°</b></span> である。</p>
<p style="font-size:46px;line-height:1.55">正<i>n</i>角形の1つの外角の大きさは、<span style="color:#C0392B"><b>360°÷<i>n</i></b></span> である。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">平行と合同　第6時　多角形の外角の和は、何度になるだろう</p>
<aside>【解説 3分・ことば（答え）】空欄の答え。先生が言い切ってから、書かせる。外角の和は 360° なので、正n角形の外角 n個分で 360°、1つぶんは 360°÷n。</aside>
