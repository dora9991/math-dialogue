<p style="font-size:30px;color:#6B7480">第8時　ぴったり重なる図形の、辺や角の関係を調べよう</p>

<div style="display:flex;flex-direction:column;gap:24px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:36px 56px">
<p style="font-size:46px;line-height:1.5">平面上の 2つの図形が、移動して、ぴったり重なるとき、<br>この 2つの図形は<span style="color:#C0392B"><b>合同</b></span>であるという。</p>
<p style="font-size:46px;line-height:1.5">合同な図形で、重なり合う頂点・辺・角を、それぞれ<br><span style="color:#C0392B"><b>対応</b></span>する頂点・辺・角という。</p>
<p style="font-size:46px;line-height:1.5">合同な図形では、対応する線分の<span style="color:#C0392B"><b>長さ</b></span>は等しく、<br>対応する角の<span style="color:#C0392B"><b>大きさ</b></span>も等しい。</p>
<p style="font-size:46px;line-height:1.5">合同であることは、記号 <span style="color:#C0392B"><b>≡</b></span> を使って、<br>△ABC≡△DEF のように書く。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">平行と合同　第8時　ぴったり重なる図形の、辺や角の関係を調べよう</p>
