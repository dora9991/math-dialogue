<div style="display:flex;flex-direction:column;gap:30px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:44px 56px">
<p style="font-size:46px;line-height:1.55">図形の中や外に、角を求めるためにかき入れる線を<span style="color:#C0392B"><b>補助線</b></span>という。</p>
<p style="font-size:46px;line-height:1.55">平行な 2直線に 1つの直線が交わるとき、<br><span style="color:#C0392B"><b>同位角</b></span>も<span style="color:#C0392B"><b>錯角</b></span>も等しい。</p>
<p style="font-size:46px;line-height:1.55">三角形の内角の和は<span style="color:#C0392B"><b>180</b></span>°。<br>三角形の外角は、となりあわない 2つの<span style="color:#C0392B"><b>内角</b></span>の和に等しい。</p>
</div>
