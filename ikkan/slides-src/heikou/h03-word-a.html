<p style="font-size:46px;line-height:1.5">多角形の内側の角を<span style="color:#C0392B"><b>内角</b></span>という。</p>
<p style="font-size:46px;line-height:1.5">1つの辺と、となりの辺をのばした線がつくる角を<br><span style="color:#C0392B"><b>外角</b></span>という。</p>
<p style="font-size:46px;line-height:1.5">三角形の内角の和は<span style="color:#C0392B"><b>180°</b></span>である。</p>
<p style="font-size:46px;line-height:1.5">三角形の外角は、<br>それととなり合わない 2つの内角の<span style="color:#C0392B"><b>和</b></span>に等しい。</p>
<p style="font-size:46px;line-height:1.5">説明のために、かき加える線を<span style="color:#C0392B"><b>補助線</b></span>という。</p>
