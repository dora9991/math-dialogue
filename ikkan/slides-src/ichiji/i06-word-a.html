<p style="font-size:46px;line-height:1.5">一次関数のグラフ（直線）は、次の順にかく。</p>
<p style="font-size:46px;line-height:1.5">　① <span style="color:#C0392B"><b>切片</b></span>から、<i>y</i> 軸上の点 (0, <i>b</i>) をとる。</p>
<p style="font-size:46px;line-height:1.5">　② <span style="color:#C0392B"><b>傾き</b></span>から、もう1つの点をとる。<br><span style="color:#6B7480">　　（右へ 1 進んで、上へ <i>a</i> 進む。<i>a</i> が負の数なら、下へ進む。）</span></p>
<p style="font-size:46px;line-height:1.5">　③ 2点を通る<span style="color:#C0392B"><b>直線</b></span>をひく。</p>
<p style="font-size:46px;line-height:1.5">傾きが <i>p</i>⁄<i>q</i> のときは、右へ <span style="color:#C0392B"><b><i>q</i></b></span>、上へ <span style="color:#C0392B"><b><i>p</i></b></span> 進んだ点をとる。</p>
