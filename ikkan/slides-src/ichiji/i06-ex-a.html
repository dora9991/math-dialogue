<div style="display:flex;flex-direction:row;align-items:center;gap:6px">
<p style="font-size:44px;line-height:1.4;color:#6B7480">一次関数　<i>y</i>＝−</p>
<div style="display:flex;flex-direction:column;padding:0px 6px"><p style="font-size:36px;line-height:1.2;text-align:center;color:#6B7480">2</p><div style="border-top:3px solid #6B7480"><p style="font-size:36px;line-height:1.2;text-align:center;color:#6B7480">3</p></div></div>
<p style="font-size:44px;line-height:1.4;color:#6B7480"><i>x</i>+</p>
<p style="font-size:44px;line-height:1.4;color:#C0392B"><b>2</b></p>
<p style="font-size:44px;line-height:1.4;color:#6B7480">　のグラフ</p>

<p style="font-size:44px;line-height:1.45;color:#C0392B"><b>① 切片が 2 だから、点 (0, 2) をとる。</b></p>

<p style="font-size:44px;line-height:1.45;color:#C0392B"><b>② 傾きが −</b></p>
