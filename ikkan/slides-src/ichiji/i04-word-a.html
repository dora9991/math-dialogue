<p style="font-size:30px;color:#6B7480">第4時　一次関数のグラフは、比例のグラフとどうちがうだろう</p>
</div>
<div style="display:flex;flex-direction:column;gap:22px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:40px 56px">
<div style="display:flex;flex-direction:column;gap:2px">
<p style="font-size:46px;line-height:1.55"><i>y</i>＝<i>ax</i>+<i>b</i> のグラフは、比例 <i>y</i>＝<i>ax</i> のグラフを、<br><i>y</i> 軸の正の方向に <span style="color:#C0392B"><b><i>b</i></b></span> だけ<span style="color:#C0392B"><b>平行移動</b></span>した直線である。</p>
<p style="font-size:40px;line-height:1.5;color:#1F2A37">　（<i>b</i> が負の数のときは、下へ動かす。）</p>
</div>
<p style="font-size:46px;line-height:1.55">グラフが <i>y</i> 軸と交わる点は (0, <i>b</i>)。<br>この <i>b</i> を、グラフの<span style="color:#C0392B"><b>切片</b></span>という。</p>
<p style="font-size:46px;line-height:1.55">　例　<i>y</i>＝2<i>x</i>+4 の切片は <span style="color:#C0392B"><b>4</b></span>、<i>y</i>＝2<i>x</i> の切片は <span style="color:#C0392B"><b>0</b></span>。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">一次関数　第4時　一次関数のグラフは、比例のグラフとどうちがうだろう</p>
<aside>【解説 3分・ことば（答え）】空欄の答え（b・平行移動・切片・4・0）。先生が言い切ってから、書かせる。b が負の数のときは、下へ動かす。</aside>
