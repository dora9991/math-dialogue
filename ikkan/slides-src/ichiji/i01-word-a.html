<p style="font-size:30px;color:#6B7480">第1時　比例に似ているけれど、比例ではない関係を調べよう</p>

<div style="display:flex;flex-direction:column;gap:28px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:40px 56px">
<p style="font-size:46px;line-height:1.6"><i>x</i> の値を決めると、<i>y</i> の値がただ1つに決まるとき、<br><i>y</i> は <i>x</i> の<span style="color:#C0392B"><b>関数</b></span>である。（1年）</p>
<p style="font-size:46px;line-height:1.6"><i>y</i> が <i>x</i> の<span style="color:#C0392B"><b>1次式</b></span> <i>y</i>＝<span style="color:#C0392B"><b><i>a</i><i>x</i>+<i>b</i></b></span> で表されるとき、<br><i>y</i> は <i>x</i> の<span style="color:#C0392B"><b>一次関数</b></span>であるという。</p>
<p style="font-size:46px;line-height:1.6"><i>a</i>、<i>b</i> は<span style="color:#C0392B"><b>定数</b></span>（決まった数）で、<i>a</i> は 0 でない。<br>例　<i>y</i>＝70<i>x</i>+200</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">一次関数　第1時　比例に似ているけれど、比例ではない関係を調べよう</p>
<aside>【解説 3分・ことば（答え）】空欄の答え（関数・1次式・ax+b・一次関数・定数）。先生が言い切ってから、書かせる。y＝70x+200 では、a＝70、b＝200 と読ませるとよい。</aside>
