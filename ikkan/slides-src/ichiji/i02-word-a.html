<p style="font-size:36px;font-weight:700;background:#2563C9;color:#F7F5F0;padding:10px 28px;border-radius:12px;white-space:nowrap">ことば</p>
<p style="font-size:30px;color:#6B7480">第2時　一次関数かどうかを、式の形で判断しよう</p>
</div>
<div style="display:flex;flex-direction:column;gap:24px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:40px 56px">
<p style="font-size:46px;line-height:1.6"><i>y</i>＝<i>ax</i>+<i>b</i> の形の式で、<i>a</i> を <i>x</i> の<span style="color:#C0392B"><b>係数</b></span>、<br><i>b</i> を<span style="color:#C0392B"><b>定数項</b></span>（数だけの項）という。</p>
<p style="font-size:46px;line-height:1.6">例　<i>y</i>＝−3<i>x</i>+4 では、<i>a</i>＝<span style="color:#C0392B"><b>−3</b></span>、<i>b</i>＝<span style="color:#C0392B"><b>4</b></span></p>
<p style="font-size:46px;line-height:1.6"><i>y</i>＝4−3<i>x</i> のように、項の順がちがうときは、<br><i>y</i>＝<span style="color:#C0392B"><b>−3<i>x</i>+4</b></span> とならべかえて、<i>a</i>、<i>b</i> を読む。</p>
<p style="font-size:46px;line-height:1.6"><i>x</i> の値を式に<span style="color:#C0392B"><b>代入</b></span>すると、<br>それに対応する <i>y</i> の値が求められる。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">一次関数　第2時　一次関数かどうかを、式の形で判断しよう</p>
<aside>【解説 3分・ことば（答え）】空欄の答え（係数・定数項・−3・4・−3x+4・代入）。先生が言い切ってから、書かせる。項の順がちがうときは、ならべかえてから a、b を読む。</aside>
