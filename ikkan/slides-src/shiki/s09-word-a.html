<p style="font-size:30px;color:#6B7480">第9時　カレンダーの数からきまりを見つけて、文字で説明しよう</p>
</div>
<div style="display:flex;flex-direction:column;gap:24px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:44px 56px">
<p style="font-size:46px;line-height:1.5">カレンダーの数は <span style="color:#C0392B"><b>整数</b></span>。ある数を <i>n</i>（整数）とすると</p>
<p style="font-size:46px;line-height:1.5">　真下の数は <span style="color:#C0392B"><b><i>n</i>+7</b></span>、真上の数は <span style="color:#C0392B"><b><i>n</i>−7</b></span>　（1週間は <span style="color:#C0392B"><b>7</b></span> 日）</p>
<p style="font-size:46px;line-height:1.5">　右どなりの数は <span style="color:#C0392B"><b><i>n</i>+1</b></span>、左どなりの数は <span style="color:#C0392B"><b><i>n</i>−1</b></span></p>
<p style="font-size:46px;line-height:1.5">　右ななめ下の数は <span style="color:#C0392B"><b><i>n</i>+8</b></span>、左ななめ下の数は <span style="color:#C0392B"><b><i>n</i>+6</b></span></p>
<p style="font-size:46px;line-height:1.5">きまりを見つけて説明するときは、<span style="color:#C0392B"><b>基準</b></span>にする数を <i>n</i> と<span style="color:#C0392B"><b>おく</b></span>。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">式の計算　第9時　カレンダーの数からきまりを見つけて、文字で説明しよう</p>
