<tr><th style="width:20%;text-align:center">項</th><th style="width:20%;text-align:center">3<i>x</i>²</th><th style="width:20%;text-align:center">−<span style="color:#C0392B"><b>5</b></span><i>xy</i></th><th style="width:20%;text-align:center"><i>y</i></th><th style="width:20%;text-align:center">−<span style="color:#C0392B"><b>4</b></span></th></tr>
<tr><td style="text-align:center"><b>係数</b></td><td style="text-align:center">3</td><td style="text-align:center"><span style="color:#C0392B"><b>−5</b></span></td><td style="text-align:center"><span style="color:#C0392B"><b>1</b></span></td><td style="text-align:center">—</td></tr>
<tr><td style="text-align:center"><b>次数</b></td><td style="text-align:center">2</td><td style="text-align:center"><span style="color:#C0392B"><b>2</b></span></td><td style="text-align:center"><span style="color:#C0392B"><b>1</b></span></td><td style="text-align:center">—</td></tr>

<p style="font-size:44px;line-height:1.4;color:#C0392B">3<i>x</i>²＝3×<i>x</i>×<i>x</i>　→　文字 2個　→　次数 2</p>
<p style="font-size:44px;line-height:1.4;color:#C0392B">−5<i>xy</i>＝−5×<i>x</i>×<i>y</i>　→　文字 2個　→　次数 2</p>
<p style="font-size:44px;line-height:1.4;color:#C0392B"><i>y</i>　→　文字 1個　→　次数 1</p>
<p style="font-size:48px;line-height:1.4;color:#C0392B"><b>いちばん大きい次数は 2　→　2次式</b></p>
<p style="font-size:40px;line-height:1.4;color:#C0392B">（−4 のような数だけの項は、次数を考えない）</p>

<aside>【解説 5分・例題（解答）】赤い字は、先生の板書。次数は、文字をかけ算の形に書いて、個数を数える。多項式の次数は、各項の次数のうち、いちばん大きいもの。−4 のような数だけの項は、次数を考えない。</aside>
