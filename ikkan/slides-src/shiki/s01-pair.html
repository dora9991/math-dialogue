<aside>【導入 3分】1年「文字と式」の重要語句（項・係数・同類項・1次式）を、ペアで1人1問ずつ出題し合う。言葉の意味を、自分の言葉で言う。静かに、時間を切って。緊張感をつくる。このあと、小テスト（7分。第1時は、1年の復習など。5分＋答え合わせ・回収 2分。10点満点。チャレンジは別枠で、正解で満点）。</aside>
