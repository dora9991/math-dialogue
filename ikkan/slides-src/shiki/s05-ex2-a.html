<p style="font-size:44px;line-height:1.5;color:#6B7480">（2）<i>x</i>＝−2、<i>y</i>＝3 のとき、3(<i>x</i>−2<i>y</i>)−2(2<i>x</i>−<i>y</i>) の値を求めよう。</p>
<div style="display:flex;flex-direction:column;gap:12px;background:#FFFFFF;border:3px solid #E3E6EA;border-radius:20px;padding:36px 56px">

<p style="font-size:50px;line-height:1.4;color:#C0392B"><b>＝3<i>x</i>−6<i>y</i>−4<i>x</i>+2<i>y</i></b></p>
<p style="font-size:50px;line-height:1.4;color:#C0392B"><b>＝−<i>x</i>−4<i>y</i></b></p>
<p style="font-size:50px;line-height:1.4;color:#C0392B"><b>＝−(−2)−4×3</b></p>
<p style="font-size:50px;line-height:1.4;color:#C0392B"><b>＝2−12＝−10</b></p>
