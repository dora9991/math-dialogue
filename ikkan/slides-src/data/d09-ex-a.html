<p style="font-size:36px;font-weight:700;background:#FFFFFF;color:#1B7F5C;border:3px solid #1B7F5C;padding:10px 28px;border-radius:12px;white-space:nowrap">例題　解答</p>
<p style="font-size:30px;color:#6B7480">第9時　相対度数を、確率として使おう</p>

<p style="font-size:44px;line-height:1.5;color:#6B7480">フリースローを <span style="color:#C0392B"><b>280</b></span>本打って、<span style="color:#C0392B"><b>210</b></span>本入れた。<br>① 入る確率は？　　② 次の <span style="color:#C0392B"><b>60</b></span>本では、およそ何本？</p>
<div style="display:flex;flex-direction:column;gap:24px;background:#FFFFFF;border:3px solid #E3E6EA;border-radius:20px;padding:40px 56px">
<p style="font-size:34px;font-weight:700;color:#6B7480">先生の板書</p>
<p style="font-size:56px;line-height:1.4;color:#C0392B"><b>① 210÷280＝0.75</b></p>
<p style="font-size:56px;line-height:1.4;color:#C0392B"><b>② 60×0.75＝45　　およそ 45本</b></p>
<hr style="width:1500px;border-top:2px solid #E3E6EA">
<p style="font-size:44px;line-height:1.4;color:#C0392B"><b>【確かめ】0.75 は、0 以上 1 以下になっている。</b></p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">データの活用　第9時　相対度数を、確率として使おう</p>
<aside>【解説 5分・例題（解答）】赤い字は、先生の板書。確率は「入った本数÷打った本数」。次の60本は、およそで答える。0以上1以下になっているかの確かめも、ワークシートに書かせる。</aside>
</section>
