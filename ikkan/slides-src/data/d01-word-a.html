<p style="font-size:30px;color:#6B7480">第1時　ばらばらのデータを整理して、傾向を読み取ろう</p>
</div>
<div style="display:flex;flex-direction:column;gap:28px;background:#FFFFFF;border:3px solid #2563C9;border-radius:20px;padding:44px 56px">
<p style="font-size:46px;line-height:1.6">データを整理するために区切った区間を<span style="color:#C0392B"><b>階級</b></span>という。</p>
<p style="font-size:46px;line-height:1.6">区間の幅を<span style="color:#C0392B"><b>階級の幅</b></span>、<br>各階級に入るデータの個数を<span style="color:#C0392B"><b>度数</b></span>という。</p>
<p style="font-size:46px;line-height:1.6">階級ごとに度数をまとめた表を<span style="color:#C0392B"><b>度数分布表</b></span>という。</p>
<p style="font-size:46px;line-height:1.6">「5〜10」の階級は、5<span style="color:#C0392B"><b>以上</b></span>10<span style="color:#C0392B"><b>未満</b></span>を表す。<br>5はふくみ、10はふくまない。</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">データの活用　第1時　ばらばらのデータを整理して、傾向を読み取ろう</p>
<aside>【解説 3分・ことば（答え）】空欄の答え。先生が言い切ってから、書かせる。「10分」の人は、10分以上15分未満の階級に入る（以上は、その数をふくむ）ことを確かめる。</aside>
