<p style="font-size:52px;line-height:1.5;color:#C0392B"><b>10回のうち、上向きは 6回</b>　　6÷10＝<b>0.6</b></p>

<div style="display:flex;flex-direction:column;gap:20px;background:#FFFFFF;border:3px solid #E3E6EA;border-radius:20px;padding:36px 56px">

<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">データの活用　第8時　実験をくり返して、起こりやすさを数で表そう</p>
