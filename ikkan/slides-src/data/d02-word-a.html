<p style="font-size:46px;line-height:1.6">度数分布表を、長方形で表したグラフを<span style="color:#C0392B"><b>ヒストグラム</b></span>という。</p>
<p style="font-size:46px;line-height:1.6">長方形の上の辺の<span style="color:#C0392B"><b>中点</b></span>を順に結んだ折れ線を、<br><span style="color:#C0392B"><b>度数折れ線</b></span>という。</p>
<p style="font-size:46px;line-height:1.6">折れ線の両はしは、度数が<span style="color:#C0392B"><b>0</b></span>の階級があると考え、横軸まで結ぶ。</p>
<p style="font-size:46px;line-height:1.6">分布は、<span style="color:#C0392B"><b>山</b></span>の位置（いちばん高い所）と、<br><span style="color:#C0392B"><b>すそ</b></span>（山の左右）ののび方で読み取る。</p>

<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#6B7480">データの活用　第2時　ヒストグラムと度数折れ線に表して、分布を読み取ろう</p>
