<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>板書型ワークシート</title>
<style>
/* ikkan：板書型ワークシート。紙面は実寸（mm）でつくり、画面では zoom で縮める。 */
:root{
  --wsfont:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","UD デジタル 教科書体 NK-R","YuKyokasho Yoko","游教科書体 横用","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --bg:#e7e5df;--panel:#fff;--ink:#1f2933;--ink2:#52606d;--ink3:#667382;--line:#d9d6cc;--btn-line:#c5cbd3;--acc:#1d5fbf;--acc-soft:#e8f0fc;
  --ans:#c62020;--ans-soft:#fdecec;--ans-line:#eba8a8;--ans-ink:#a31616;--on-ans:#fff;
  --paper-ans:#d62828;   /* 紙面の赤（白い紙の上なので、暗い画面でも変えない） */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181d;--panel:#1d2329;--ink:#e6e9ec;--ink2:#a9b3bd;--ink3:#8a96a2;--line:#2f3841;--btn-line:#3d4853;--acc:#7db2ff;--acc-soft:#1e2e45;
    --ans:#ff8a8a;--ans-soft:#3a2224;--ans-line:#6b3a3d;--ans-ink:#ffb0b0;--on-ans:#2a1214;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181d;--panel:#1d2329;--ink:#e6e9ec;--ink2:#a9b3bd;--ink3:#8a96a2;--line:#2f3841;--btn-line:#3d4853;--acc:#7db2ff;--acc-soft:#1e2e45;
  --ans:#ff8a8a;--ans-soft:#3a2224;--ans-line:#6b3a3d;--ans-ink:#ffb0b0;--on-ans:#2a1214;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* ================= 紙面 ================= */
.wsp{position:relative;flex:none;background:#fff;color:#1f2328;font-family:var(--wsfont);line-height:1.4;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.1);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wsp-head{position:absolute;height:10mm;display:flex;align-items:flex-end;justify-content:space-between;gap:4mm;font-size:3.5mm;white-space:nowrap}
.wsp-head .u{display:inline-block;border-bottom:.25mm solid #333;height:4.6mm;vertical-align:-1.1mm;margin:0 .7mm}
.wsp-head .w1{width:7mm}.wsp-head .w2{width:9mm}.wsp-head .w6{width:46mm}
.wh-mid{flex:1;text-align:center;font-size:3mm;color:#6b7280;overflow:hidden;text-overflow:ellipsis}
.wsp-body{position:absolute}
.wsp-rule{position:absolute;left:0;top:0;display:block;pointer-events:none;overflow:visible}
.wsp-flow{position:relative;font-size:calc(var(--pitch) * .56);line-height:var(--pitch)}

/* ---- ブロック（高さはいつも罫の幅の倍数） ---- */
.wb{position:relative}
.wb-t{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;overflow:hidden}
.wb .tx{grid-column:2;position:relative;top:calc(var(--pitch) * .06);min-width:0;overflow-wrap:anywhere}
.wb.box{padding:0 1.6mm;overflow:visible}
.wb.box::after{content:"";position:absolute;left:0;right:0;top:.35mm;bottom:.35mm;border:.3mm solid #2d3748;border-radius:1.4mm;pointer-events:none}
.wsp .tag{grid-column:1;box-sizing:border-box;display:inline-block;height:calc(var(--pitch) * .7);margin:calc(var(--pitch) * .15) 1.8mm 0 0;padding:0 1.5mm;
  line-height:calc(var(--pitch) * .7);font-size:calc(var(--pitch) * .42);font-weight:700;border-radius:1mm;white-space:nowrap;letter-spacing:.04em}
.wsp .t-meate{background:#2d3748;color:#fff}
.wsp .t-kadai{border:.3mm solid #2d3748;line-height:calc(var(--pitch) * .7 - .6mm);background:#fff}
/* 板書の写し：ふだんは罫線だけ。解答を表示すると、教師の板書が赤で出る */
.wb-b{overflow:hidden}
.wb-b .tx{display:none;grid-column:auto;top:calc(var(--pitch) * .06);padding-left:.8mm;color:var(--paper-ans)}
.ans-on .wb-b .tx{display:block}

/* 答え（赤）：問題の中の空欄の数字、図の中の空欄の数字、板書 */
.wsp .ansx{display:none;color:var(--paper-ans)}
.ans-on .wsp .ansx{display:inline}

/* 文字の中の空欄・分数・累乗・文字式の字 */
.wsp .bl{display:inline-block;height:1.1em;line-height:1.1em;border-bottom:.25mm solid #333;vertical-align:-.25em;text-align:center;margin:0 .15em;white-space:nowrap}
.wsp .fr{display:inline-block;vertical-align:middle;font-size:.7em;line-height:1;text-align:center;margin:0 .14em}
.wsp .fr>span{display:block;padding:0 .12em}
.wsp .fr>span:first-child{border-bottom:.2mm solid currentColor;padding-bottom:.06em}
.wsp .fr>span:last-child{padding-top:.04em}
.wsp i.v{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.1em;line-height:0;padding:0 .03em}
.wsp sup{font-size:.62em;vertical-align:.5em;line-height:0}
.wsp .sq{white-space:nowrap}
.wsp .sq>span{display:inline-block;border-top:.2mm solid currentColor;line-height:1.02;padding:0 .08em 0 .03em;margin-left:-.07em}

/* 図 */
.wb-fig{display:flex;gap:4mm;align-items:stretch;background:#fff}
.wb-fig::before{content:"";position:absolute;top:-.4mm;bottom:-.4mm;left:-3mm;right:-3mm;background:#fff}
.wb-fig .fg{flex:none;position:relative}
.fsvg{display:block;overflow:visible;fill:#222}
.fsvg text{font-family:var(--wsfont)}
.fsvg .sv,.fsvg .pl{font-family:"Times New Roman",Times,serif;font-style:italic}
.fsvg .cap{font-weight:700}
.fsvg .ansx{display:none;fill:var(--paper-ans)}
.ans-on .fsvg .ansx{display:inline}
.fsvg g.ansx{fill:var(--paper-ans)}


/* ことば（重要語句）・学び合い・小問の文 */
.wsp .t-words{background:#e8f0fc;color:#1d4a99;border:.3mm solid #1d4a99;line-height:calc(var(--pitch) * .7 - .6mm)}
.wsp .t-manabi{background:#1e7a4a;color:#fff}
.wb.words::after{border-color:#1d4a99 !important}
.wb.manabi::after{border-color:#1e7a4a !important}
.wsp .t-text{padding:0 .8mm 0 0;font-size:calc(var(--pitch) * .5);font-weight:700;letter-spacing:0}
/* 表（セルの {{ }} は空欄。ふだんは空に見え、解答を表示すると赤で出る） */
.wb-tab{display:block}
.wt{border-collapse:collapse;table-layout:fixed;height:100%;background:#fff;font-size:.9em}
.wt th,.wt td{border:.25mm solid #333;padding:0 .4mm;text-align:center;vertical-align:middle;line-height:1.1;white-space:nowrap;overflow:hidden}
.wt th{background:#f0f2f5;font-weight:700}
.wsp .wt .bl{border:0;width:auto !important;margin:0;height:auto;line-height:inherit}

/* 2段組 */
.wb-cols{display:grid;column-gap:6mm;align-items:start}
.wcol{min-width:0}

/* ================= 画面（ワークシート以外） ================= */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.top .brand small{font-weight:600;font-size:11px;color:var(--ink3);margin-left:6px}
.top .sp{flex:1}
.top .ttl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.top .ttl small{font-size:11px;color:var(--ink3);font-weight:700}
.top .ttl b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:var(--panel);border-radius:8px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.main{background:var(--ans-soft);border-color:var(--ans-line);color:var(--ans-ink);font-weight:700}
.btn.main[aria-pressed=true]{background:var(--ans);border-color:var(--ans);color:var(--on-ans)}
.btn.main:hover{border-color:var(--ans);color:var(--ans-ink)}
.btn.main[aria-pressed=true]:hover{color:var(--on-ans)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pages-wrap{padding:16px 16px 60px;overflow-x:auto}
.pages{display:flex;flex-direction:column;align-items:center;gap:10mm;transform-origin:top center}
.hint{max-width:210mm;margin:0 auto 12px;font-size:13px;color:var(--ink2);text-align:center}
.hint b{color:var(--ans)}


.seg{display:inline-flex;border:1px solid var(--btn-line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg a{padding:6px 14px;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap;border-left:1px solid var(--btn-line)}
.seg a:first-child{border-left:0}
.seg a:hover{color:var(--acc)}
.seg a[aria-current=page]{background:var(--acc-soft);color:var(--acc);font-weight:700}
.seg a:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips i{font-style:normal;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:700}

/* 一覧 */
.home{max-width:860px;margin:0 auto;padding:26px 16px 60px}
.home h1{font-size:22px;margin:0 0 6px}
.home .lead{margin:0 0 20px;color:var(--ink2);font-size:14px;line-height:1.75}
.home .lead b{color:var(--ans)}
.unit{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.unit h2{font-size:16px;margin:0}
.unit span{font-size:12px;color:var(--ink3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--acc);box-shadow:0 2px 10px rgba(29,95,191,.12)}
.card small{display:block;font-size:11.5px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.card b{display:block;font-size:15.5px;line-height:1.45}
.card p{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.card .go{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--acc);font-weight:700}
.note{margin-top:28px;padding:14px 16px;background:var(--panel);border:1px dashed var(--btn-line);border-radius:10px;font-size:13px;color:var(--ink2);line-height:1.75}
.note h3{margin:0 0 4px;font-size:13.5px;color:var(--ink)}

@media (max-width:640px){
  .top{padding:8px 16px}
  .top .ttl b{max-width:60vw}
  .btn{padding:7px 10px;font-size:13px}
}


/* ================= 授業計画（A4 1枚） ================= */
.plan-page{overflow:hidden}
.plan-body{position:absolute;left:12mm;right:12mm;top:10mm;bottom:8mm;font-family:var(--ui);font-size:2.85mm;line-height:1.42;color:#1f2328}
.plan-body b{font-weight:700}
.plan-h{border-bottom:.5mm solid #2d3748;padding-bottom:1.6mm;margin-bottom:2.4mm}
.pl-meta{font-size:2.9mm;color:#52606d;font-weight:700}
.pl-type{display:inline-block;background:#2d3748;color:#fff;border-radius:1mm;padding:0 1.8mm;margin-left:.6mm}
.pl-min{display:inline-block;border:.25mm solid #2d3748;border-radius:1mm;padding:0 1.6mm}
.plan-h h1{font-size:5mm;line-height:1.3;margin:1mm 0 .8mm}
.pl-aim{margin:0}
.pl-aim b,.pl-words b,.pl-prep b{display:inline-block;margin-right:2mm;font-size:2.9mm;color:#1d4a99}
.plan-body h3{font-size:3.2mm;margin:0 0 .8mm;color:#1d4a99}
.plan-body h4{font-size:2.9mm;margin:0 0 .4mm;color:#52606d}
.plan-body ul,.plan-body ol{margin:0;padding-left:4.2mm}
.plan-body li{margin:0 0 .4mm}
.pl-flow table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:2.62mm;line-height:1.38}
.pl-flow th,.pl-flow td{border:.22mm solid #8b96a3;padding:.7mm 1.4mm;vertical-align:top;text-align:left}
.pl-flow th{background:#eef1f5;font-size:2.8mm}
.pl-flow th:nth-child(1),.pl-flow td:nth-child(1){width:27mm}
.pl-flow th:nth-child(3),.pl-flow td:nth-child(3){width:44mm}
.pl-flow td.t b{margin-right:1.4mm}
.pl-flow td.t small{color:#52606d;font-size:2.5mm}
.pl-flow td.t .s{font-weight:700;margin-top:.3mm}
.pl-flow .q{margin-top:.5mm;padding-left:2.2mm;border-left:.6mm solid #1d5fbf;color:#143a75}
.pl-flow .n{margin-top:.3mm;color:#667382;font-size:2.5mm}
.pl-flow .qq{color:#143a75}
.pl-words{margin:1.6mm 0;padding:.8mm 2mm;background:#e8f0fc;border-radius:1.2mm}
.pl-words span{display:inline-block;margin-right:3mm;font-weight:700}
.pl-think{margin:0 0 1.6mm;padding:1.2mm 2.2mm 1mm;border:.35mm solid #1e7a4a;border-radius:1.6mm}
.pl-think h3{color:#1e7a4a}
.pl-think .pq{margin:0 0 1mm;font-weight:700}
.pl-two{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.pl-think .pdir{margin:1mm 0 0;padding-top:.8mm;border-top:.22mm dashed #8b96a3}
.pl-think .pdir b{margin-right:2mm;color:#1e7a4a}
.pl-think .pdir small{margin-left:1.5mm;color:#667382}
.pl-low{margin-bottom:2mm}
.pl-low li b{margin-right:1mm}
.pl-tips{margin-bottom:2mm}
.pl-tips li b{margin-right:2mm}
.pl-prep{position:absolute;left:0;right:0;bottom:0;padding-top:1.2mm;border-top:.22mm solid #8b96a3;font-size:2.8mm}
.pl-prep span{display:inline-block;margin-right:3mm}

.set-cap{width:210mm;max-width:100%;font-size:14px;font-weight:700;color:var(--ink);margin:6px 0 -4mm}
.set-cap small{font-size:12px;font-weight:400;color:var(--ink3)}
.btn.main2{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}

/* ================= 印刷 ================= */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff !important;height:auto !important}
  .top,.hint,.home,.set-cap{display:none !important}
  .pages-wrap{padding:0 !important;overflow:visible !important}
  .pages{zoom:1 !important;display:block !important;gap:0 !important}
  .wsp{box-shadow:none !important;margin:0 !important;break-after:page;page-break-after:always}
  .wsp:last-child{break-after:auto;page-break-after:auto}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- js/core.js ---- */
/* ikkan：板書型ワークシートの紙面をつくる道具（画面を持たない。ブラウザでも node の検査でも読める）。
   ワークシートの形：日付・名前 → めあて → 学習課題・例題（1〜3問）。問題の下は、図・グラフ以外は空欄（板書を写す）。
   「解答を表示」で、空欄に教師が板書する内容と、問題文・図の中の空欄（数字）が赤で出る。
   文字の中：{{答え}}＝空欄、[[1/2]]＝分数、x^2＝累乗、**太字**、\\m＝立体にしない文字、√{12}＝根号。
   図のきまり（ws.css と同じ）：長さの字は '{{3}}cm' のように書くと、数字だけ空欄になる。 */
(function () {
  'use strict';
  const IK = (window.IK = window.IK || {});
  IK.units = IK.units || [];
  IK.lessons = IK.lessons || {};
  IK.order = IK.order || [];

  /* ---------------- 小道具 ---------------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v, d) => { const n = parseFloat(String(v == null ? '' : v).replace(/[−–]/g, '-')); return isFinite(n) ? n : d; };
  const f2 = n => String(Math.round(n * 100) / 100);
  // 字の幅のめやす（全角＝1、数字＝0.65 …）
  const emOf = t => { let n = 0; for (const ch of String(t).replace(/\[\[|\]\]|\*\*|\^|\{\{|\}\}/g, '')) n += /[A-Z]/.test(ch) ? 0.75 : /[0-9]/.test(ch) ? 0.65 : /[\x20-\x7e]/.test(ch) ? 0.56 : 1; return n; };

  /* ---------------- 文字の中 ---------------- */
  // 1〜3文字の小文字（x, l, ax …）は数式らしく斜体に。cm・kg などの単位と、\ をつけた文字は立体のまま
  const UNITS = new Set(['cm', 'mm', 'km', 'kg', 'mg', 'ml', 'dl', 'kl', 'ha', 'min', 'sec', 'cc']);
  const VAR_RE = /(^|[^A-Za-z&#;\u0001])([a-z]{1,3})(?![A-Za-z])/g;
  const italic = (t, open, close) => t.replace(VAR_RE, (m, pre, w) => (w.length > 1 && UNITS.has(w) ? m : pre + open + w + close));
  const plain = t => italic(esc(String(t).replace(/\\([A-Za-z])/g, '\u0001$1')), '<i class="v">', '</i>').replace(/\n/g, '<br>').replace(/\u0001/g, '');
  function inl(s) {
    s = String(s == null ? '' : s);
    const re = /\{\{([\s\S]*?)\}\}|\[\[([^\]\/]*)\/([^\]]*)\]\]|\*\*([\s\S]+?)\*\*|\^\{([^}]*)\}|\^([0-9]+|[A-Za-z])|√\{([^{}]*)\}/g;
    let out = '', last = 0, m;
    while ((m = re.exec(s))) {
      out += plain(s.slice(last, m.index));
      if (m[1] !== undefined) out += `<span class="bl" style="width:${Math.max(2.4, emOf(m[1]) + 1).toFixed(1)}em"><span class="ansx">${inl(m[1])}</span></span>`;
      else if (m[2] !== undefined) out += `<span class="fr"><span>${inl(m[2])}</span><span>${inl(m[3])}</span></span>`;
      else if (m[4] !== undefined) out += `<b>${inl(m[4])}</b>`;
      else if (m[5] !== undefined) out += `<sup>${inl(m[5])}</sup>`;
      else if (m[7] !== undefined) out += `<span class="sq">√<span>${inl(m[7])}</span></span>`;
      else out += `<sup>${plain(m[6])}</sup>`;
      last = re.lastIndex;
    }
    return out + plain(s.slice(last));
  }

  /* ---------------- 図（SVG・単位は mm） ---------------- */
  const ln = (x1, y1, x2, y2, c, w, extra) => `<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" stroke="${c}" stroke-width="${w}"${extra || ''}/>`;
  const tx = (x, y, s, size, anchor, extra) => `<text x="${f2(x)}" y="${f2(y)}" font-size="${size}" text-anchor="${anchor || 'middle'}"${extra || ''}>${s}</text>`;
  const svgMath = s => italic(esc(String(s).replace(/\\([A-Za-z])/g, '\u0001$1')), '<tspan class="sv">', '</tspan>').replace(/\u0001/g, '');
  const plab = n => esc(String(n).replace(/_.*$/, '').replace(/'/g, '′'));
  const pol = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];   // 画面の座標（y が下向き）で、数学の向き（反時計まわり）の角度

  // 図の中の字。{{3}}cm のように書くと、「3」のところが空欄（下線）になり、解答を表示すると赤で出る
  function rich(x, y, s, size, anchor, extra) {
    s = String(s == null ? '' : s);
    if (!/\{\{/.test(s)) return tx(x, y, svgMath(s), size, anchor, extra);
    const parts = s.split(/(\{\{[^}]*\}\})/).filter(p => p !== '');
    const isBlank = p => /^\{\{/.test(p);
    const wOf = p => (isBlank(p) ? Math.max(5.2, emOf(p.slice(2, -2)) * size * 0.62 + 3.2) : emOf(p.replace(/\\/g, '')) * size * 0.62);
    const total = parts.reduce((a, p) => a + wOf(p), 0);
    let cur = anchor === 'start' ? x : anchor === 'end' ? x - total : x - total / 2, out = '';
    parts.forEach(p => {
      const w = wOf(p);
      if (isBlank(p)) {
        out += ln(cur + 0.4, y + 0.9, cur + w - 0.4, y + 0.9, '#333', 0.25);
        out += tx(cur + w / 2, y - 0.1, svgMath(p.slice(2, -2)), size, 'middle', ' class="ansx"');
      } else out += tx(cur, y, svgMath(p), size, 'start');
      cur += w;
    });
    return out;
  }

      const n = b.cols.length, sum = b.cols.reduce((a, c, i) => a + (r[i] || 1), 0);
      const widths = b.cols.map((c, i) => (W - COL_GAP * (n - 1)) * (r[i] || 1) / sum);
      return `<div class="wb wb-cols" style="grid-template-columns:${widths.map(w => f2(w) + 'mm').join(' ')}">${b.cols.map((c, i) => `<div class="wcol">${c.blocks.map(x => blockHTML(x, widths[i], g)).join('')}</div>`).join('')}</div>`;
    }
    return '';
  }

  // 罫線とドット（印刷でもくっきり出るよう、模様を使わず1本ずつ線で描く）
  function ruleSVG(g, dots) {
    const W = g.cw, H = g.rows * g.pitch, p = g.pitch, off = (W % p) / 2;
    let s = '';
    for (let i = 0; i <= g.rows; i++) {
      const y = f2(i * p);
      s += `<line x1="0" y1="${y}" x2="${f2(W)}" y2="${y}" stroke="#a3b6c8" stroke-width="${i === 0 ? 0.28 : 0.2}"/>`;
      if (dots) s += `<line x1="${f2(off)}" y1="${y}" x2="${f2(W)}" y2="${y}" stroke="#58748e" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="0 ${p}"/>`;
    }
    return `<svg class="wsp-rule" viewBox="0 0 ${f2(W)} ${f2(H)}" width="${f2(W)}mm" height="${f2(H)}mm" overflow="visible" aria-hidden="true">${s}</svg>`;
  }

  const geo = sheet => { const P = PAPER[sheet.paper] || PAPER.A4, pitch = sheet.pitch || 7; return { P, pitch, rows: Math.floor((P.h - P.top - P.bottom) / pitch + 1e-6), cw: P.w - 2 * P.mx }; };
  // ブロックの高さ（行）。2段組は、高い列
  const heightOf = b => (b.type === 'cols' ? Math.max(...b.cols.map(c => c.blocks.reduce((a, x) => a + heightOf(x), 0))) : rowsOf(b));
  const splitPages = blocks => { const pages = [[]]; blocks.forEach(b => { if (b.type === 'break') pages.push([]); else pages[pages.length - 1].push(b); }); return pages; };

  function pagesHTML(sheet) {
    const g = geo(sheet), P = g.P, pages = splitPages(sheet.blocks), hd = sheet.head != null ? sheet.head : '';
    return pages.map((bl, pi) => `<div class="wsp" style="width:${P.w}mm;height:${P.h}mm;--pitch:${g.pitch}mm">
      <div class="wsp-head" style="left:${P.mx}mm;right:${P.mx}mm;top:${P.top - 12}mm">
        <div class="wh-date"><span class="u w2"></span>月<span class="u w2"></span>日（<span class="u w1"></span>）</div>
        <div class="wh-mid">${esc(hd)}${pages.length > 1 ? `　${pi + 1}／${pages.length}` : ''}</div>
        <div class="wh-name"><span class="u w1"></span>年<span class="u w1"></span>組<span class="u w1"></span>号　氏名<span class="u w6"></span></div>
      </div>
      <div class="wsp-body" style="left:${P.mx}mm;top:${P.top}mm;width:${g.cw}mm;height:${g.rows * g.pitch}mm">
        ${ruleSVG(g, sheet.dots !== false)}
        <div class="wsp-flow">${bl.map(b => blockHTML(b, g.cw, g)).join('')}</div>
      </div>
    </div>`).join('');
  }

  /* ---------------- 授業の登録 ---------------- */
  const O = (o, extra) => Object.assign(o, extra || {});
  IK.unit = u => { IK.units.push(u); };
  IK.add = (id, meta, blocks) => {
    IK.lessons[id] = Object.assign({ id, paper: 'A4', pitch: 7, dots: true }, meta, { blocks });
    if (IK.order.indexOf(id) < 0) IK.order.push(id);
  };
  IK.drills = IK.drills || {};   // 演習プリント（授業のIDごと）
  IK.plans = IK.plans || {};     // 授業計画（授業のIDごと）
  IK.quizzes = IK.quizzes || {}; // 小テスト（授業のIDごと）
  /* 1 授業ぶん（授業計画・ワークシート・演習プリント・小テスト）を登録する。data/lesson_<単元>_<番号>.js で使う。
     IK.lesson(ID, { unit, unitName, no, title, summary, head, checks, plan: {…}, ws: [ブロック…], dr: [ブロック…], qz: [ブロック…] })
     印刷の3点セット：ワークシート（A4 表裏）・演習プリント（A4 表裏：表＝基礎・標準／裏＝応用・入試レベル）・小テスト（A4 片面・5分） */
  IK.lesson = (id, def) => {
    const { plan, ws, dr, qz } = def, meta = Object.assign({}, def);
    delete meta.plan; delete meta.ws; delete meta.dr; delete meta.qz;
    IK.add(id, meta, ws || []);
    if (qz) IK.quizzes[id] = { id, paper: 'A4', pitch: 7, dots: true, head: (meta.head ? meta.head + '・' : '') + '小テスト', blocks: qz };
    if (dr) IK.drills[id] = { id, paper: 'A4', pitch: 7, dots: true, head: (meta.head ? meta.head + '・' : '') + '演習', blocks: dr };
    if (plan) IK.plans[id] = Object.assign({ id }, plan);
  };
  // ワークシートを書くときの道具（data/ws_<単元>.js で使う）
  IK.b = {
    M: (text, o) => O({ type: 'meate', text, rows: 1 }, o),                                        // めあて
    K: (label, text, rows, o) => O({ type: 'kadai', label, text, rows: rows || 2 }, o),            // 学習課題・例題（枠つき。字は最初から印刷する。数字の空欄は {{3}} と書く）
    B: (rows, answer, o) => O({ type: 'board', rows: rows || 3, answer: answer || '' }, o),        // 板書の写し（空欄の罫）。answer は解答を表示したときだけ赤で出る。1行＝\n で区切る
    G: rows => ({ type: 'gap', rows: rows || 1 }),                                                 // すき間
    F: (rows, ...figs) => ({ type: 'figure', rows, figs }),                                        // 図（印刷する。横に並べられる）
    C2: (left, right, ratio) => ({ type: 'cols', ratio: ratio || '3:2', cols: [{ blocks: left }, { blocks: right }] }),   // 2段組（左に問題と板書、右に図）
    BR: () => ({ type: 'break' }),                                                                 // 改ページ
    T: (label, text, rows, o) => O({ type: 'text', label, text, rows: rows || 1 }, o),               // 小問の文（ラベルは（1）など）
    HD: (label, text, o) => O({ type: 'meate', label, text, rows: 1 }, o),                          // 見出し（演習・基礎・標準 など）
    WD: (text, rows, o) => O({ type: 'words', text, rows: rows || 3 }, o),                          // ことば（重要語句。{{ }} で穴埋め）
    MA: (text, rows, o) => O({ type: 'manabi', text, rows: rows || 2 }, o),                         // 学び合いの発問（演習プリントなど）
    TB: (corner, head, data, o) => O({ type: 'table', corner, head, data, rows: data.length + (head ? 1 : 0) }, o),   // 表：rows＝[[行の見出し, [セル…]], …]
    SO: o => O({ kind: 'solid' }, o),                                                              // 立体の見取図
    NET: o => O({ kind: 'conenet' }, o),                                                           // 円錐の展開図
    SVG: (svg, o) => O({ kind: 'svg', svg }, o)                                                    // 自由な図
  };
  IK.render = { pagesHTML, geo, heightOf, inl, emOf, blockHTML };
})();

/* ---- js/figs.js ---- */
/* ikkan：ワークシートの図（数直線・座標平面・ヒストグラム・おうぎ形・てんびん・長方形）。
   どれも「(W, H, h) => SVG の中身（単位 mm）」を返す。h は core.js の小道具。
   解答を表示したときだけ出る赤いもの（矢印・グラフの線・強調）は、h.ans(…) でかこむ。
   図の中の字に {{3}}cm と書くと、数字だけが空欄になる（core.js の rich）。
   使い方（data/ws_*.js）： IK.b.NL({ … })、CO、HIST、SEC、BAL、RECT を、F(行数, 図…) の中に書く。 */
(function () {
  'use strict';
  const IK = window.IK, B = IK.b;
  const RED = '#d62828';
  const f2 = n => String(Math.round(n * 100) / 100);
  const mn = v => (v < 0 ? '−' : '') + Math.abs(Math.round(v * 1000) / 1000);   // 負の数は −（U+2212）
  // 矢じり：先が (x, y)、進む向きが ang（画面の座標でのラジアン）
  const head = (x, y, ang, c, s) => {
    s = s || 1.7;
    const a1 = ang + Math.PI * 0.85, a2 = ang - Math.PI * 0.85;
    return `<polygon points="${f2(x)},${f2(y)} ${f2(x + s * Math.cos(a1))},${f2(y + s * Math.sin(a1))} ${f2(x + s * Math.cos(a2))},${f2(y + s * Math.sin(a2))}" fill="${c}"/>`;
  };

  /* ---- 数直線。{ min, max, arrows:[{ from, to, text }], marks:[{ at }] }
          arrows（動きの矢印）と marks（答えの位置）は、解答を表示したときだけ赤で出る。矢印は上にえがき、2本目からは高くなる（7・13・19mm）。字は弧の内側 ---- */
  const numline = o => (W, H, h) => {
    const min = o.min != null ? o.min : -6, max = o.max != null ? o.max : 6, padL = 7, padR = 7;
    const u = (W - padL - padR) / (max - min), X = v => padL + (v - min) * u, y0 = o.y != null ? o.y : H - 8;
    let out = h.ln(X(min) - 2.5, y0, X(max) + 2.5, y0, '#222', 0.32) + head(X(max) + 3.6, y0, 0, '#222') + head(X(min) - 3.6, y0, Math.PI, '#222');
    for (let v = min; v <= max + 1e-9; v += 1) {
      out += h.ln(X(v), y0 - 1.3, X(v), y0 + 1.3, '#222', 0.28);
      out += h.tx(X(v), y0 + 5.3, mn(v), 2.9, 'middle');
    }
    const an = [];
    (o.arrows || []).forEach((a, i) => {
      const x1 = X(a.from), x2 = X(a.to), mx = (x1 + x2) / 2, hh = a.h || 7 + 6 * i, cy = y0 - 2 * hh;
      an.push(`<path d="M${f2(x1)},${f2(y0)} Q${f2(mx)},${f2(cy)} ${f2(x2)},${f2(y0)}" fill="none" stroke="${RED}" stroke-width="0.5"/>`);
      an.push(head(x2, y0, Math.atan2(y0 - cy, x2 - mx), RED, 2));
      if (a.text) an.push(h.tx(mx, y0 - hh + 3.7, a.text, 3, 'middle'));   // 字は弧の内側（頂点のすぐ下）。外がわにかく別の矢印とぶつからない
    });
    (o.marks || []).forEach(m => {   // 答えの位置：点と、目もりの数字をかこむ輪
      an.push(`<circle cx="${f2(X(m.at))}" cy="${f2(y0)}" r="0.9" fill="${RED}"/>`);
      an.push(`<ellipse cx="${f2(X(m.at))}" cy="${f2(y0 + 4.4)}" rx="${f2(m.at < 0 ? 4.2 : 3.3)}" ry="3.3" fill="none" stroke="${RED}" stroke-width="0.4"/>`);
    });
    return out + (an.length ? h.ans(an.join('')) : '');
  };

  /* ---- 座標平面。{ xmin, xmax, ymin, ymax, lines:[{ a, b, from, to, text, at:[x, y], anchor }], points:[{ x, y }] }
          lines（y＝ax+b の線分）と points は、解答を表示したときだけ赤で出る ---- */
  const coord = o => (W, H, h) => {
    const x0 = o.xmin != null ? o.xmin : -4, x1 = o.xmax != null ? o.xmax : 4, y0 = o.ymin != null ? o.ymin : -4, y1 = o.ymax != null ? o.ymax : 4;
    const padL = 6, padR = 7, padT = 7, padB = 6;
    const u = Math.min((W - padL - padR) / (x1 - x0), (H - padT - padB) / (y1 - y0));
    const ox = padL + (W - padL - padR - u * (x1 - x0)) / 2, oy = padT + (H - padT - padB - u * (y1 - y0)) / 2;
    const X = x => ox + (x - x0) * u, Y = y => oy + (y1 - y) * u;
    let out = '';
    for (let x = x0; x <= x1; x++) out += h.ln(X(x), Y(y0), X(x), Y(y1), '#c9d1da', 0.15);
    for (let y = y0; y <= y1; y++) out += h.ln(X(x0), Y(y), X(x1), Y(y), '#c9d1da', 0.15);
    out += h.ln(X(x0) - 1, Y(0), X(x1) + 2.4, Y(0), '#222', 0.3) + head(X(x1) + 3.4, Y(0), 0, '#222', 1.6);
    out += h.ln(X(0), Y(y0) + 1, X(0), Y(y1) - 2.4, '#222', 0.3) + head(X(0), Y(y1) - 3.4, -Math.PI / 2, '#222', 1.6);
    const fs = Math.min(2.5, u * 0.6);
    for (let x = x0; x <= x1; x++) if (x !== 0) out += h.tx(X(x), Y(0) + 3, mn(x), fs, 'middle');
    for (let y = y0; y <= y1; y++) if (y !== 0) out += h.tx(X(0) - 1, Y(y) + fs * 0.35, mn(y), fs, 'end');
    out += h.tx(X(0) - 1.3, Y(0) - 1.0, 'O', 2.6, 'end', ' class="pl"') + h.tx(X(x1) + 2.6, Y(0) + 4.6, 'x', 3, 'middle', ' class="pl"') + h.tx(X(0) - 2.4, Y(y1) - 2.4, 'y', 3, 'end', ' class="pl"');
    const an = [];
    (o.lines || []).forEach(l => {
      const fr = l.from != null ? l.from : x0, to = l.to != null ? l.to : x1, b = l.b || 0;
      an.push(h.ln(X(fr), Y(l.a * fr + b), X(to), Y(l.a * to + b), RED, 0.5, ' stroke-linecap="round"'));
      if (l.text && l.at) an.push(h.rich(X(l.at[0]), Y(l.at[1]), l.text, 3, l.anchor || 'start'));
    });
    (o.points || []).forEach(p => an.push(`<circle cx="${f2(X(p.x))}" cy="${f2(Y(p.y))}" r="0.85" fill="${RED}"/>`));
    return out + (an.length ? h.ans(an.join('')) : '');
  };

  /* ---- ヒストグラム。{ edges:[階級のさかい…], counts:[度数…], ymax, ystep, xname, yname, hl:[強調する階級の番号], show:true なら度数を棒の上に書く }
          hl は、解答を表示したときだけ赤い枠で出る ---- */
  const hist = o => (W, H, h) => {
    const e = o.edges, c = o.counts, n = c.length, ymax = o.ymax, ys = o.ystep || 1;
    const padL = 9, padR = 13, padT = 8, padB = 8;
    const bw = (W - padL - padR) / n, yu = (H - padT - padB) / ymax, X = i => padL + i * bw, Y = v => H - padB - v * yu;
    let out = '';
    for (let v = ys; v <= ymax; v += ys) out += h.ln(X(0), Y(v), X(n), Y(v), '#d3d9e0', 0.15);
    c.forEach((v, i) => { out += `<rect x="${f2(X(i))}" y="${f2(Y(v))}" width="${f2(bw)}" height="${f2(v * yu)}" fill="#eef1f5" stroke="#222" stroke-width="0.3"/>`; if (o.show) out += h.tx(X(i) + bw / 2, Y(v) - 1.2, String(v), 2.6, 'middle'); });
    out += h.ln(X(0), Y(0), X(n) + 2, Y(0), '#222', 0.32) + h.ln(X(0), Y(0), X(0), Y(ymax) - 2, '#222', 0.32);
    for (let v = 0; v <= ymax; v += ys) out += h.tx(X(0) - 1.6, Y(v) + 1, String(v), 2.6, 'end');
    e.forEach((v, i) => { out += h.tx(X(i), Y(0) + 4.2, String(v), 2.6, 'middle'); });
    if (o.yname) out += h.tx(X(0) - 1.6, Y(ymax) - 3.6, o.yname, 2.6, 'end');
    if (o.xname) out += h.tx(X(n) + 4.6, Y(0) + 4.2, o.xname, 2.6, 'start');
    const an = (o.hl || []).map(i => `<rect x="${f2(X(i))}" y="${f2(Y(c[i]))}" width="${f2(bw)}" height="${f2(c[i] * yu)}" fill="none" stroke="${RED}" stroke-width="0.7"/>`);
    return out + (an.length ? h.ans(an.join('')) : '');
  };

  /* ---- おうぎ形。{ R, th（中心角）, start（はじめの半径の向き。度。0＝右）, lr（半径の字）, la（中心角の字）, larc（弧の字）} ---- */
  const sector = o => (W, H, h) => {
    const R = o.R, th = o.th, a0 = o.start || 0, rad = d => d * Math.PI / 180;
    const arc = []; for (let k = 0; k <= 60; k++) arc.push([R * Math.cos(rad(a0 + th * k / 60)), R * Math.sin(rad(a0 + th * k / 60))]);
    const pts = [[0, 0], ...arc], bx0 = Math.min(...pts.map(p => p[0])), bx1 = Math.max(...pts.map(p => p[0])), by0 = Math.min(...pts.map(p => p[1])), by1 = Math.max(...pts.map(p => p[1]));
    const ml = 5, mr = o.larc ? 16 : 7, mt = 6, mb = o.lr ? 9 : 4;
    const s = Math.min((W - ml - mr) / (bx1 - bx0), (H - mt - mb) / (by1 - by0));
    const ox = ml + (W - ml - mr - (bx1 - bx0) * s) / 2 - bx0 * s, oy = mt + (H - mt - mb - (by1 - by0) * s) / 2 + by1 * s;
    const X = x => ox + x * s, Y = y => oy - y * s;
    let out = `<polygon points="${pts.map(p => f2(X(p[0])) + ',' + f2(Y(p[1]))).join(' ')}" fill="none" stroke="#222" stroke-width="0.32" stroke-linejoin="round"/>`;
    const ar = 0.2 * R, ap = []; for (let k = 0; k <= 30; k++) ap.push([ar * Math.cos(rad(a0 + th * k / 30)), ar * Math.sin(rad(a0 + th * k / 30))]);
    out += `<polyline points="${ap.map(p => f2(X(p[0])) + ',' + f2(Y(p[1]))).join(' ')}" fill="none" stroke="#222" stroke-width="0.25"/>`;
    const bis = rad(a0 + th / 2);
    if (o.lr) { const q = [R / 2 * Math.cos(rad(a0)), R / 2 * Math.sin(rad(a0))]; out += h.rich(X(q[0]), Y(q[1]) + 4.6, o.lr, 2.9, 'middle'); }
    if (o.la) out += h.rich(X(0.46 * R * Math.cos(bis)), Y(0.46 * R * Math.sin(bis)) + 1, o.la, 2.9, 'middle');
    if (o.larc) { const q = [(R + 2.8 / s) * Math.cos(bis), (R + 2.8 / s) * Math.sin(bis)]; out += h.rich(X(q[0]), Y(q[1]) + 1, o.larc, 2.9, Math.cos(bis) > 0.3 ? 'start' : Math.cos(bis) < -0.3 ? 'end' : 'middle'); }
    return out;
  };

  /* ---- てんびん（つり合っている）。{ left:[おもり…], right:[おもり…] }。おもり：{ box:'x' }＝重さのわからない箱、{ w:'5g' }＝おもり ---- */
  const balance = o => (W, H, h) => {
    const items = side => side.map(it => (it.box != null ? { kind: 'box', w: 8, text: it.box } : { kind: 'w', w: 10, text: it.w }));
    const L = items(o.left || []), R = items(o.right || []), tw = a => a.reduce((s, it) => s + it.w, 0) + Math.max(0, a.length - 1) * 1;
    const hwOf = a => Math.max(11, (tw(a) / 2 + 1.2) / 0.62), hwL = hwOf(L), hwR = hwOf(R);   // 皿の幅：おもりの高さのところで、紐よりも内がわにおさまるように
    const span = Math.min(W - hwL - hwR - 6, 60), cx = W / 2;   // 支点から、はりの左右のはしまで ＝ span / 2
    const beamY = 9, D = Math.min(24, H * 0.5), panY = beamY + D, by = Math.min(H - 2, panY + 12);
    let out = h.ln(cx - 9, by, cx + 9, by, '#222', 0.45) + h.ln(cx, beamY, cx, by, '#222', 0.7);   // 支点は細い柱（皿とかさならない）
    out += h.ln(cx - span / 2, beamY, cx + span / 2, beamY, '#222', 0.55) + `<circle cx="${f2(cx)}" cy="${f2(beamY)}" r="0.9" fill="#222"/>`;
    [[-1, L, hwL], [1, R, hwR]].forEach(([sg, a, hw]) => {
      const px = cx + sg * span / 2;
      out += h.ln(px, beamY, px - hw, panY, '#222', 0.25) + h.ln(px, beamY, px + hw, panY, '#222', 0.25) + h.ln(px - hw, panY, px + hw, panY, '#222', 0.7, ' stroke-linecap="round"');
      let x = px - tw(a) / 2;
      a.forEach(it => {
        if (it.kind === 'box') out += `<rect x="${f2(x)}" y="${f2(panY - 0.4 - 8)}" width="8" height="8" fill="#fff" stroke="#222" stroke-width="0.35"/>` + h.rich(x + 4, panY - 0.4 - 2.6, it.text, 3.2, 'middle');
        else out += `<rect x="${f2(x)}" y="${f2(panY - 0.4 - 6)}" width="10" height="6" rx="1" fill="#e9edf2" stroke="#222" stroke-width="0.3"/>` + h.rich(x + 5, panY - 0.4 - 1.8, it.text, 2.7, 'middle');
        x += it.w + 1;
      });
    });
    return out;
  };

  /* ---- 長方形。{ w, h（図の形をきめる数）, top（横の字）, side（縦の字）} ---- */
  const rect = o => (W, H, h) => {
    const w = o.w || 5, hh = o.h || 3, s = Math.min((W - 24) / w, (H - 16) / hh), rw = w * s, rh = hh * s, x0 = (W - rw) / 2, y0 = (H - rh) / 2;
    let out = `<rect x="${f2(x0)}" y="${f2(y0)}" width="${f2(rw)}" height="${f2(rh)}" fill="none" stroke="#222" stroke-width="0.32"/>`;
    const m = 2.2;   // 直角のしるし
    [[x0, y0, 1, 1], [x0 + rw, y0, -1, 1], [x0, y0 + rh, 1, -1], [x0 + rw, y0 + rh, -1, -1]].forEach(([x, y, dx, dy]) => { out += `<polyline points="${f2(x + dx * m)},${f2(y)} ${f2(x + dx * m)},${f2(y + dy * m)} ${f2(x)},${f2(y + dy * m)}" fill="none" stroke="#222" stroke-width="0.22"/>`; });
    if (o.top) out += h.rich(W / 2, y0 - 2.2, o.top, 2.9, 'middle');
    if (o.side) out += h.rich(x0 - 3.6, H / 2 + 1, o.side, 2.9, 'end');
    return out;
  };

  const reg = (name, f) => { B[name] = (o, fo) => B.SVG(f(o), fo); };
  reg('NL', numline); reg('CO', coord); reg('HIST', hist); reg('SEC', sector); reg('BAL', balance); reg('RECT', rect);
})();

/* ---- js/plan.js ---- */
/* ikkan：授業計画（1 コマ＝A4 1枚）の紙面。画面を持たない（core.js のあとに読む）。
   授業計画のデータ（data/lesson_*.js の plan）：
     type   授業の型（'探（課題解決）' など）
     aim    ねらい
     prep   準備するもの・教卓に置くもの［文…］
     flow   時間割［{ m:分, scene:場面, do:先生がすること, q:発問［文…］, st:生徒の動き・想定される反応, note:ひとこと }…］。分の合計は 50
     words  この時間に押さえる重要語句［…］
     think  { q:考えよう の問い, views:想定される見方（深まりの順）［…］, hints:ヒント（出す順）［…］, direction:最後に伝える方向性（答えは示さない）}
     manabi 演習プリントの学び合い発問［{ kind, text }…］
     see    見取り［[観点, 見るところ]…］
     tips   つまずきと手立て［[つまずき, 手立て]…］ */
(function () {
  'use strict';
  const IK = window.IK, R = IK.render;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = s => R.inl(s);   // {{ }}・累乗・分数などの書き方は、ワークシートと同じ

  // 時間割の「時刻」（0–3、3–8、…）を、分から組み立てる
  function clock(flow) {
    let at = 0;
    return flow.map(f => { const a = at; at += f.m; return { a, b: at }; });
  }

  function planHTML(p, l) {
    const ck = clock(p.flow);
    const flow = p.flow.map((f, i) => `<tr>
        <td class="t"><b>${ck[i].a}–${ck[i].b}</b><small>${f.m}分</small><div class="s">${t(f.scene)}</div></td>
        <td>${t(f.do || '')}${(f.q || []).map(q => `<div class="q">${t(q)}</div>`).join('')}${f.note ? `<div class="n">${t(f.note)}</div>` : ''}</td>
        <td>${t(f.st || '')}</td></tr>`).join('');
    const th = p.think || {};
    const li = (a, ord) => `<${ord ? 'ol' : 'ul'}>${(a || []).map(x => `<li>${t(x)}</li>`).join('')}</${ord ? 'ol' : 'ul'}>`;
    return `<div class="wsp plan-page" style="width:210mm;height:297mm">
  <div class="plan-body">
    <header class="plan-h">
      <div class="pl-meta">${esc(l.unitName || '')}　${esc(l.no || '')}　<span class="pl-type">${esc(p.type || '')}</span>　<span class="pl-min">50分</span></div>
      <h1>${esc(l.title)}</h1>
      <p class="pl-aim"><b>ねらい</b>${t(p.aim)}</p>
    </header>
    <section class="pl-flow">
      <table><thead><tr><th>時間・場面</th><th>先生がすること（青い線の文は発問）</th><th>生徒の動き・想定される反応</th></tr></thead><tbody>${flow}</tbody></table>
    </section>
    <section class="pl-words"><b>重要語句</b>${(p.words || []).map(w => `<span>${t(w)}</span>`).join('')}</section>
    <section class="pl-think">
      <h3>考えよう（学び合いの課題）</h3>
      <p class="pq">${t(th.q || '')}</p>
      <div class="pl-two">
        <div><h4>想定される見方（深まりの順）</h4>${li(th.views, true)}</div>
        <div><h4>ヒント（出す順。答えは言わない）</h4>${li(th.hints, true)}</div>
      </div>
      <p class="pdir"><b>最後に伝える方向性</b>${t(th.direction || '')}<small>（答えは示さない。教卓の解答にも載せない）</small></p>
    </section>
    <div class="pl-two pl-low">
      <section><h3>演習プリントの学び合い発問</h3><ul>${(p.manabi || []).map(m => `<li><b>【${esc(m.kind)}】</b>${t(m.text)}</li>`).join('')}</ul></section>
      <section><h3>見取り</h3><ul>${(p.see || []).map(s => `<li><b>${esc(s[0])}</b>${t(s[1])}</li>`).join('')}</ul></section>
    </div>
    <section class="pl-tips"><h3>つまずきと手立て</h3><ul>${(p.tips || []).map(s => `<li><b>${t(s[0])}</b>${t(s[1])}</li>`).join('')}</ul></section>
    <footer class="pl-prep"><b>準備・教卓</b>${(p.prep || []).map(x => `<span>${t(x)}</span>`).join('')}</footer>
  </div>
</div>`;
  }
  R.planHTML = planHTML;
})();

/* ---- data/ws_kukan.js ---- */
/* 板書型ワークシート：中1 空間図形。A4 1枚（罫7mm・37行）。
   書き方：IK.add(ID, { 授業の情報 }, [ブロック…])
     M(めあて)　K(ラベル, 問題文, 行数)　B(行数, 板書の内容)　F(行数, 図…)　C2([左…], [右…], 幅の比)
   ・問題文と図は、最初から印刷する。1問目（学習課題）は、数字もすべて印刷する。
   ・2問目以降は、数字のいくつかを {{3}} のように書いて空欄にする（問題文でも、図の長さの字でも同じ書き方）。
     「解答を表示」で、空欄の数字が赤で出る。
   ・B(…) は、板書を写すための空欄の罫。2つ目の引数が、解答を表示したときに赤で出る教師の板書（1行＝\n で区切る。1行が罫1行ぶん）。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {
  const { M, K, B, G, F, C2, SO, NET } = IK.b;

  IK.add('kukan-enzui-hyomenseki', {
    unit: 'kukan', unitName: '空間図形', no: '試作（旧形式）', title: '円錐の表面積',
    summary: '展開図をもとに、円錐の表面積の求め方を考える。学習課題＋例題2問。',
    head: '空間図形',
    // 検算に使う式（node tools/verify.cjs が確かめる。PI＝π、near(a, b)＝ほぼ等しい）
    checks: [
      'near(360 * 4 / 10, 144)',                                    // 学習課題：中心角
      'near(2 * PI * 4, 8 * PI) && near(2 * PI * 10, 20 * PI)',     // 弧の長さ＝底面の円周、半径10の円の周
      'near(8 / 20, 2 / 5)',
      'near(PI * 10 ** 2 * (2 / 5), 40 * PI)',                      // 側面積
      'near(PI * 4 ** 2, 16 * PI) && near(40 * PI + 16 * PI, 56 * PI)',
      'near(PI * 10 * 4, 40 * PI)',                                 // 気づき：側面積＝π×母線×半径
      'near(PI * 7 * 3, 21 * PI) && near(PI * 3 ** 2, 9 * PI) && near(21 * PI + 9 * PI, 30 * PI)',   // 例題1
      'near(PI * 3 ** 2, 9 * PI) && near(36 * PI - 9 * PI, 27 * PI) && near(27 / 3, 9)',              // 例題2
      'near(PI * 9 * 3 + PI * 3 ** 2, 36 * PI)'                     // 例題2の確かめ
    ]
  }, [
    M('円錐の表面積を求める方法を考えよう'),

    // ---- 学習課題（数字もすべて印刷する） ----
    C2([
      K('学習課題', '底面の半径が 4cm、母線の長さが 10cm の円錐の表面積を求めよう。\n展開図をもとに考えよう。', 3),
      B(6, '展開図 … 側面はおうぎ形、底面は円\n弧の長さ＝底面の円周＝2π×4＝8π\n半径10の円周 … 2π×10＝20π\nおうぎ形は、円の [[8π/20π]]＝[[2/5]]\n側面積 … π×10^2×[[2/5]]＝40π\n底面積 … π×4^2＝16π')
    ], [
      F(9,
        SO({ shape: 'cone', a: 4, c: 9.165, dims: 'r 4cm\nl 10cm', w: 0.8 }),
        NET({ R: 10, r: 4, lR: '10cm', lr: '4cm', ansAngle: '144°', ansArc: '弧 8π cm', w: 1.2 }))
    ], '1:1'),
    B(5, '表面積 … 40π+16π＝56π　　（答）56π cm^2\n【気づき】側面積 40π＝π×10×4\n　　　側面積＝π×（母線の長さ）×（底面の半径）'),

    G(1),

    // ---- 例題1（数字のいくつかを空欄にする） ----
    C2([
      K('例題1', '底面の半径が {{3}}cm、母線の長さが {{7}}cm の円錐の表面積を求めよう。', 2),
      B(6, '側面積 … π×7×3＝21π\n底面積 … π×3^2＝9π\n表面積 … 21π+9π＝30π\n（答）30π cm^2')
    ], [
      F(8, SO({ shape: 'cone', a: 3, c: 6.325, dims: 'r {{3}}cm\nl {{7}}cm' }))
    ], '3:2'),

    G(1),

    // ---- 例題2 ----
    C2([
      K('例題2', '表面積が {{36}}π cm^2、\n底面の半径が {{3}}cm の円錐がある。\n母線の長さを求めよう。', 3),
      B(6, '底面積 … π×3^2＝9π\n側面積 … 36π−9π＝27π\n母線を l cm とすると、π×l×3＝27π\n3πl＝27π　　l＝9\n（答）9cm\n確かめ … 27π+9π＝36π')
    ], [
      F(9, SO({ shape: 'cone', a: 3, c: 8.485, dims: 'r {{3}}cm\nl ？cm' }))
    ], '3:2'),
    B(2, '')
  ]);
})();

/* ---- js/app.js ---- */
/* ikkan：画面。一覧 → 授業（授業計画／ワークシート／演習プリント／小テスト／3点セット）。解答の表示・かくす、印刷。
   場所：#/ ＝一覧、#/<授業のID> ＝ワークシート、#/<授業のID>/plan・/ws・/dr・/qz・/set ＝授業計画・ワークシート・演習プリント・小テスト・3点セット（印刷用）、
         最後に /ans をつけると、解答を表示した状態で開く（例：#/kukan-01/dr/ans） */
(function () {
  'use strict';
  const IK = window.IK, R = IK.render;
  const $app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MM = 96 / 25.4;   // 1mm のピクセル数
  const TABS = [['plan', '授業計画'], ['ws', 'ワークシート'], ['dr', '演習プリント'], ['qz', '小テスト'], ['set', '3点セット（印刷）']];
  let ans = false, fit = 'w', cur = null, curTab = 'ws';

  const tabsOf = id => TABS.filter(([k]) => (k === 'plan' ? IK.plans[id] : k === 'dr' ? IK.drills[id] : k === 'qz' ? IK.quizzes[id] : k === 'set' ? (IK.drills[id] || IK.quizzes[id]) : IK.lessons[id]));
  const sheetOf = (id, tab) => (tab === 'dr' ? IK.drills[id] : tab === 'qz' ? IK.quizzes[id] : IK.lessons[id]);
  // 3点セット：印刷する順（ワークシート → 演習プリント → 小テスト）
  const partsOf = id => [['ワークシート', IK.lessons[id]], ['演習プリント', IK.drills[id]], ['小テスト', IK.quizzes[id]]].filter(p => p[1]);
  const nPages = sh => sh.blocks.filter(b => b.type === 'break').length + 1;

  const setAns = on => {
    ans = !!on;
    document.body.classList.toggle('ans-on', ans);
    const b = document.getElementById('ansBtn');
    if (b) { b.setAttribute('aria-pressed', String(ans)); b.textContent = ans ? '解答をかくす' : '解答を表示'; }
    const h = document.getElementById('hint');
    if (h) h.innerHTML = curTab === 'set'
      ? (ans ? '<b>解答を表示中</b>　教卓に置く解答の確認用です。印刷するときは「解答をかくす」にします。' : '印刷の順：①ワークシート（表裏）②演習プリント（表裏）③小テスト（片面）。<b>両面印刷</b>にすると、3枚になります。')
      : ans ? '<b>解答を表示中</b>　赤い字が、教師の板書と、空欄に入れる答えです。（考えようの答えは載せていません）' : '空欄の罫は、授業で書き込む場所です。ことばの空欄は、先生の説明で埋めます。';
  };

  function zoom() {
    const pages = document.querySelector('.pages');
    if (!pages) return;
    const wrap = pages.parentElement, top = document.querySelector('.top');
    const g = R.geo(cur || { paper: 'A4' }), pw = g.P.w * MM, ph = g.P.h * MM;
    let z = Math.min(1.6, (wrap.clientWidth - 32) / pw);
    if (fit === 'all') z = Math.min(z, (window.innerHeight - (top ? top.offsetHeight : 0) - 70) / ph);
    pages.style.zoom = Math.max(0.3, z);
  }

  function home() {
    cur = null; ans = false;
    document.title = '数学ワークシート（板書型）';
    document.body.classList.remove('ans-on');
    const units = IK.units.map(u => {
      const ls = IK.order.map(id => IK.lessons[id]).filter(l => l.unit === u.key);
      if (!ls.length) return '';
      return `<div class="unit"><h2>${esc(u.name)}</h2><span>中${esc(u.grade)}</span></div>
        <div class="cards">${ls.map(l => `<a class="card" href="#/${esc(l.id)}">${l.no ? `<small>${esc(l.no)}</small>` : ''}<b>${esc(l.title)}</b><p>${esc(l.summary || '')}</p>
          <span class="chips">${tabsOf(l.id).map(([, n]) => `<i>${esc(n)}</i>`).join('')}</span><span class="go">ひらく →</span></a>`).join('')}</div>`;
    }).join('');
    $app.innerHTML = `<div class="home">
      <h1>数学ワークシート（板書型）</h1>
      <p class="lead">日付・名前 → めあて → 学習課題・例題。問題の下は、図・グラフ以外は<b>空欄</b>にしてあり、書き込んで使います。
        「解答を表示」を押すと、<b>教師の板書</b>と<b>空欄の答え</b>が赤で出ます。<b>授業計画</b>・<b>演習プリント</b>・<b>小テスト</b>がある授業は、上のタブで切りかえます。<b>3点セット（印刷）</b>のタブでは、ワークシート・演習プリント・小テストを続けて印刷できます。</p>
      ${units || '<p>ワークシートがまだありません。</p>'}
      <div class="note"><h3>ワークシートのつくり方</h3>
        <code>data/lesson_*.js</code>（授業計画・ワークシート・演習プリント）か、<code>data/ws_*.js</code>（ワークシートだけ）に書き足します。くわしくは <code>README.md</code> を見てください。</div>
    </div>`;
  }

  function show(id, tab, askAns) {
    const l = IK.lessons[id];
    if (!l) { location.hash = '#/'; return; }
    const tabs = tabsOf(id);
    if (!tabs.some(([k]) => k === tab)) tab = 'ws';
    curTab = tab;
    cur = tab === 'plan' ? { paper: 'A4' } : sheetOf(id, tab);
    document.title = `${l.title}　数学ワークシート`;
    const pages = tab === 'plan' ? R.planHTML(IK.plans[id], l)
      : tab === 'set' ? partsOf(id).map(([n, sh], i) => `<div class="set-cap">${'①②③'[i]} ${esc(n)}　<small>A4 ${nPages(sh) > 1 ? `${nPages(sh)}ページ（表裏）` : '1ページ（片面）'}</small></div>${R.pagesHTML(sh)}`).join('')
      : R.pagesHTML(cur);
    const seg = tabs.length > 1 ? `<nav class="seg" aria-label="資料の切りかえ">${tabs.map(([k, n]) => `<a href="#/${esc(id)}/${k}"${k === tab ? ' aria-current="page"' : ''}>${esc(n)}</a>`).join('')}</nav>` : '';
    $app.innerHTML = `<header class="top">
        <a class="brand" href="#/" title="一覧へ">← 一覧</a>
        <div class="ttl"><small>${esc([l.unitName, l.no].filter(Boolean).join('　'))}</small><b>${esc(l.title)}</b></div>
        ${seg}
        <span class="sp"></span>
        ${tab === 'plan' ? '' : '<button type="button" class="btn main" id="ansBtn" aria-pressed="false">解答を表示</button>'}
        <button type="button" class="btn" id="fitBtn" title="紙面の見せ方">全体を見る</button>
        ${IK.noPrint ? '' : `<button type="button" class="btn${tab === 'set' ? ' main2' : ''}" id="prtBtn">${tab === 'set' ? '3点セットを印刷' : '印刷'}</button>`}
      </header>
      <div class="pages-wrap">${tab === 'plan' ? '' : '<p class="hint" id="hint"></p>'}<div class="pages">${pages}</div></div>`;
    setAns(tab === 'plan' ? false : tab === 'set' ? !!askAns : (askAns !== undefined ? askAns : ans));   // 3点セットは、いつも解答をかくした状態で開く（印刷用）
    const ab = document.getElementById('ansBtn'); if (ab) ab.onclick = () => setAns(!ans);
    document.getElementById('fitBtn').onclick = e => { fit = fit === 'w' ? 'all' : 'w'; e.target.textContent = fit === 'w' ? '全体を見る' : '幅に合わせる'; zoom(); };
    const prt = document.getElementById('prtBtn'); if (prt) prt.onclick = () => window.print();
    zoom();
  }

  function route(hash) {
    const h = String(hash != null ? hash : location.hash).replace(/^#\/?/, '').split('/');
    if (!h[0]) home();
    else show(h[0], ['plan', 'ws', 'dr', 'qz', 'set'].includes(h[1]) ? h[1] : 'ws', h.includes('ans') ? true : undefined);
    window.scrollTo(0, 0);
  }

  // 一覧↔ワークシートの移動は、ページの中で処理する（埋めこみ表示では、アドレスの # が変えられないことがある）
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    const h = a.getAttribute('href');
    try { history.pushState(null, '', h); } catch (_) { /* 変えられなくてもよい */ }
    route(h);
  });
  window.addEventListener('hashchange', () => route());
  window.addEventListener('popstate', () => route());
  window.addEventListener('resize', zoom);
  document.addEventListener('keydown', e => {
    if (!cur || !document.getElementById('ansBtn') || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'a' || e.key === 'A') setAns(!ans);
  });
  route();
})();

</script>
</body>
</html>
