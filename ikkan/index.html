/* 空間図形 第14時「身のまわりのものを立体とみなして、量を見積もろう」：授業計画・ワークシート・演習プリント・小テスト（新しい形）。
   授業ナビ 標準版（hyojun-navi）の第14時（活用）をもとに、50分の流れ（ペア学習3＋小テスト7＋解説・発問12＋演習23＋振り返り・回収5）に合わせて、新しく書き直した。
   印刷は3点セット：ワークシート（A4 表裏）／演習プリント（A4 表裏：表＝基礎・標準、裏＝応用・入試レベル）／小テスト（A4 片面・5分・10点満点。最後の1問は、別枠の入試レベル「チャレンジ」）。
   ・型は「活」。演習の23分は、身のまわりのものを立体とみなして見積もる活動。考えよう（紙コップの容積を円柱とみなして見積もる）が学び合いの核。
   ・見積もりは、答えが1つに決まらない。解答は「見積もりの式と範囲」を書く。checks は、式の計算を確かめる（π＝3.14 は問題で指示）。
   ・考えようの答えは、教卓の解答（解答を表示）には載せない。答えは示さず、方向性だけを最後に伝える。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {
  const { M, K, B, G, F, C2, BR, T, HD, WD, MA, SVG } = IK.b;

  /* ---------------- 図の道具（図の座標は cm、y は上向き。fit で図の枠（mm）におさめる） ---------------- */
  const f2 = n => Math.round(n * 100) / 100;
  const DASH = ' stroke-dasharray="1.2 0.9"';
  const TAU = 2 * Math.PI;
  const fit = (W, H, bb, pad) => {
    const [pl, pt, pr, pb] = pad || [3, 3, 3, 3];
    const s = Math.min((W - pl - pr) / (bb[2] - bb[0]), (H - pt - pb) / (bb[3] - bb[1]));
    const ox = pl + (W - pl - pr - (bb[2] - bb[0]) * s) / 2 - bb[0] * s, oy = pt + (H - pt - pb - (bb[3] - bb[1]) * s) / 2 + bb[3] * s;
    return { s, X: x => ox + x * s, Y: y => oy - y * s };
  };
  const pl = (m, pts, o) => { o = o || {}; return `<polyline points="${pts.map(p => f2(m.X(p[0])) + ',' + f2(m.Y(p[1]))).join(' ')}" fill="${o.fill || 'none'}"${o.fo ? ` fill-opacity="${o.fo}"` : ''} stroke="${o.c || '#222'}" stroke-width="${o.w || 0.32}"${o.dash ? DASH : ''} stroke-linejoin="round" stroke-linecap="round"/>`; };
  const arc = (cx, cy, rx, ry, t0, t1) => { const a = []; for (let k = 0; k <= 48; k++) { const t = t0 + (t1 - t0) * k / 48; a.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); } return a; };
  const hid = { dash: true, c: '#555', w: 0.22 };   // かくれた線（点線）
  const thin = { c: '#222', w: 0.22 };
  const dsh = { dash: true, c: '#222', w: 0.22 };   // 長さを示す点線
  // 先がとがった円錐（頂点が上）。底面の中心は (cx, cy)
  const coneUp = (m, cx, cy, r, ht, q) => {
    const ry = q * r, t1 = Math.asin(Math.min(0.98, ry / ht)), A = [cx, cy + ht];
    return pl(m, arc(cx, cy, r, ry, Math.PI - t1, TAU + t1)) + pl(m, arc(cx, cy, r, ry, t1, Math.PI - t1), hid)
      + pl(m, [A, [cx + r * Math.cos(t1), cy + ry * Math.sin(t1)]]) + pl(m, [A, [cx - r * Math.cos(t1), cy + ry * Math.sin(t1)]]);
  };
  // 縦の長さを表す線（両はしに小さな印）
  const dimV = (m, x, y0, y1) => pl(m, [[x, y0], [x, y1]], thin) + `<line x1="${f2(m.X(x) - 0.9)}" y1="${f2(m.Y(y0))}" x2="${f2(m.X(x) + 0.9)}" y2="${f2(m.Y(y0))}" stroke="#222" stroke-width="0.22"/>` + `<line x1="${f2(m.X(x) - 0.9)}" y1="${f2(m.Y(y1))}" x2="${f2(m.X(x) + 0.9)}" y2="${f2(m.Y(y1))}" stroke="#222" stroke-width="0.22"/>`;

  /* 砂の山（円錐とみなす）：底面の直径と、高さ */
  const sandFig = () => SVG((W, H, h) => {
    const r = 2, ht = 1.5, q = 0.3, m = fit(W, H, [-r, -q * r, r, ht], [6, 6, 6, 5]);
    return coneUp(m, 0, 0, r, ht, q) + pl(m, [[-r, 0], [r, 0]], dsh) + pl(m, [[0, 0], [0, ht]], dsh)
      + h.rich(m.X(0), m.Y(0) + 4.8, '直径 4\\m', 2.9, 'middle') + h.rich(m.X(0) + 1.6, m.Y(ht * 0.55) + 1, '1.5\\m', 2.9, 'start')
      + h.tx(m.X(0), m.Y(ht) - 2, '砂の山', 2.9, 'middle');
  });

  /* ペットボトル（実物）と、円柱のモデル。直径と高さは {{ }} で空欄にできる */
  const bottleFig = (dTxt, hTxt) => SVG((W, H, h) => {
    const R = 3, ht = 20, cx2 = 13, q = 0.3, ry = q * R, m = fit(W, H, [-R, -3.6, 24, ht + 3.4], [3, 2, 3, 2]);
    const P = (x, y) => f2(m.X(x)) + ',' + f2(m.Y(y));
    let o = `<path d="M${P(-2.4, 0)} L${P(2.4, 0)} Q${P(3, 0)} ${P(3, 0.8)} L${P(3, 11.5)} C${P(3, 14.2)} ${P(1.3, 14.2)} ${P(1.3, 16.4)} L${P(1.3, 18.3)} L${P(-1.3, 18.3)} L${P(-1.3, 16.4)} C${P(-1.3, 14.2)} ${P(-3, 14.2)} ${P(-3, 11.5)} L${P(-3, 0.8)} Q${P(-3, 0)} ${P(-2.4, 0)} Z" fill="none" stroke="#222" stroke-width="0.32" stroke-linejoin="round"/>`;
    o += `<rect x="${f2(m.X(-1.45))}" y="${f2(m.Y(ht))}" width="${f2(2.9 * m.s)}" height="${f2(1.7 * m.s)}" fill="none" stroke="#222" stroke-width="0.32"/>`;
    o += h.tx(m.X(0), m.Y(0) + 5.6, 'ペットボトル', 2.8, 'middle');
    // 矢印（みなす）
    const ay = m.Y(10.5), ax0 = m.X(4.6), ax1 = m.X(8.6);
    o += h.ln(ax0, ay, ax1 - 1.4, ay, '#222', 0.4) + `<polygon points="${f2(ax1)},${f2(ay)} ${f2(ax1 - 1.9)},${f2(ay - 1)} ${f2(ax1 - 1.9)},${f2(ay + 1)}" fill="#222"/>` + h.tx((ax0 + ax1) / 2, ay - 1.8, 'みなす', 2.6, 'middle');
    // 円柱のモデル
    o += pl(m, arc(cx2, ht, R, ry, 0, TAU)) + pl(m, arc(cx2, 0, R, ry, Math.PI, TAU)) + pl(m, arc(cx2, 0, R, ry, 0, Math.PI), hid)
      + pl(m, [[cx2 - R, 0], [cx2 - R, ht]]) + pl(m, [[cx2 + R, 0], [cx2 + R, ht]]);
    o += pl(m, [[cx2 - R, ht], [cx2 + R, ht]], dsh) + h.rich(m.X(cx2), m.Y(ht + ry) - 1.6, dTxt, 2.9, 'middle');
    o += dimV(m, cx2 + R + 1.6, 0, ht) + h.rich(m.X(cx2 + R + 1.6) + 1.8, m.Y(ht / 2) + 1, hTxt, 2.9, 'start');
    o += h.tx(m.X(cx2), m.Y(0) + 5.6, '円柱のモデル', 2.8, 'middle');
    return o;
  });

  // 長さの字（白い地の上。線の上にかさねてもよむことができる）
  const wlab = (h, x, y, s, size) => {
    const w = IK.render.emOf(s) * size * 0.62 + 2.4;
    return `<rect x="${f2(x - w / 2)}" y="${f2(y - size * 0.95)}" width="${f2(w)}" height="${f2(size * 1.3)}" fill="#fff"/>` + h.rich(x, y, s, size, 'middle');
  };

  /* 円錐台（紙コップ・たらい）：上の底面が大きい。cone:true のときは、頂点まで点線でのばして、切りとった円錐を示す */
  const frustumFig = o => SVG((W, H, h) => {
    const { R, r, ht } = o, q = 0.3, ext = o.cone ? ht * r / (R - r) : 0, ryT = q * R, ryB = q * r;
    const m = fit(W, H, [-R, -ext - (o.cone ? 0 : ryB) - (o.cone ? 0.5 : 3.3), R + 1.8 + (o.right || 7), ht + ryT + 3.6], [3, 2, 2, 2]);
    let s = pl(m, arc(0, ht, R, ryT, 0, TAU)) + pl(m, arc(0, 0, r, ryB, Math.PI, TAU)) + pl(m, [[-R, ht], [-r, 0]]) + pl(m, [[R, ht], [r, 0]]);
    s += pl(m, [[-R, ht], [R, ht]], dsh) + h.rich(m.X(0), m.Y(ht + ryT) - 1.6, o.lt, 2.9, 'middle');
    s += pl(m, [[-r, 0], [r, 0]], dsh);
    s += o.cone ? h.rich(m.X(0), m.Y(0) - 1.4, o.lb, 2.9, 'middle') : h.rich(m.X(0), m.Y(-ryB) + 3.8, o.lb, 2.9, 'middle');
    s += dimV(m, R + 1.8, 0, ht) + h.rich(m.X(R + 1.8) + 1.8, m.Y(ht / 2) + 1, o.lh, 2.9, 'start');
    if (o.cone) {
      s += pl(m, [[-r, 0], [0, -ext]], hid) + pl(m, [[r, 0], [0, -ext]], hid) + pl(m, [[0, 0], [0, -ext]], dsh);
      s += wlab(h, m.X(0), m.Y(-ext * 0.45) + 1, o.lc, 2.9);
    }
    return s;
  });

  /* ソフトクリーム：円錐のコーンの上に、同じ直径の半球 */
  const softFig = () => SVG((W, H, h) => {
    const R = 3, ht = 12, q = 0.3, ry = q * R, m = fit(W, H, [-R - 1, -ht, R + 6.4, R + 2.6], [3, 3, 3, 3]);
    let s = pl(m, arc(0, 0, R, R, 0, Math.PI)) + pl(m, arc(0, 0, R, ry, Math.PI, TAU)) + pl(m, arc(0, 0, R, ry, 0, Math.PI), hid)
      + pl(m, [[-R, 0], [0, -ht]]) + pl(m, [[R, 0], [0, -ht]]);
    s += pl(m, [[-R, R + 1], [R, R + 1]], thin) + `<line x1="${f2(m.X(-R))}" y1="${f2(m.Y(R + 1) - 0.9)}" x2="${f2(m.X(-R))}" y2="${f2(m.Y(R + 1) + 0.9)}" stroke="#222" stroke-width="0.22"/><line x1="${f2(m.X(R))}" y1="${f2(m.Y(R + 1) - 0.9)}" x2="${f2(m.X(R))}" y2="${f2(m.Y(R + 1) + 0.9)}" stroke="#222" stroke-width="0.22"/>`
      + h.rich(m.X(0), m.Y(R + 1) - 1.6, '直径 6cm', 2.9, 'middle');
    s += dimV(m, R + 1.8, -ht, 0) + h.rich(m.X(R + 1.8) + 1.8, m.Y(-ht / 2) + 1, '12cm', 2.9, 'start');
    s += h.tx(m.X(0), m.Y(R * 0.4), 'アイス', 2.6, 'middle');
    return s;
  });

  /* ボール缶：半径 3cm のボール 3こが、ちょうど入る円柱 */
  const canFig = () => SVG((W, H, h) => {
    const r = 3, ht = 18, q = 0.3, ry = q * r, m = fit(W, H, [-r, -ry, r + 8.5, ht + ry], [3, 2, 2, 2]);
    let s = pl(m, arc(0, ht, r, ry, 0, TAU)) + pl(m, arc(0, 0, r, ry, Math.PI, TAU)) + pl(m, arc(0, 0, r, ry, 0, Math.PI), hid)
      + pl(m, [[-r, 0], [-r, ht]]) + pl(m, [[r, 0], [r, ht]]);
    [3, 9, 15].forEach(cy => { s += pl(m, arc(0, cy, r, r, 0, TAU), { w: 0.28 }); });
    s += dimV(m, r + 1.6, 0, ht) + h.rich(m.X(r + 1.6) + 1.8, m.Y(ht / 2) + 1, '18cm', 2.9, 'start');
    return s;
  });

  IK.lesson('kukan-14', {
    unit: 'kukan', unitName: '空間図形', no: '第14時', title: '身のまわりのものを立体とみなして、量を見積もろう',
    summary: '砂の山・ペットボトル・紙コップなどを、円柱・円錐・球とみなして体積や表面積を見積もる。見積もりが、およその値であること（大きめ・小さめ・範囲）を、考えようで学び合う。',
    head: '空間図形　第14時',
    checks: [
      // 学習課題：砂の山（直径 4m → 半径 2m、高さ 1.5m）　体積 2π、π＝3.14 で 6.28m^3、0.5m^3 ずつ運ぶ → 12.56 → 13回
      'near(4 / 2, 2) && near((1 / 3) * PI * 2 ** 2 * 1.5, 2 * PI) && near(2 * 3.14, 6.28) && near(6.28 / 0.5, 12.56) && Math.ceil(12.56) === 13',

/* データの活用 第2時「ヒストグラムと度数折れ線に表して、分布を読み取ろう」：授業計画・ワークシート・演習プリント・小テスト（新しい形）。
   授業ナビ 標準版（hyojun-navi）の内容をもとに、50分の流れ（ペア学習3＋小テスト7＋解説・発問12＋演習23＋振り返り・回収5）に合わせて、新しく書き直した。
   型は「例（例題と練習）」。学習課題＝A組30人の度数分布表をヒストグラムに表す（全部印刷。方眼に自分でかく）、例題＝B組のヒストグラムに度数折れ線をかき、A組とくらべて分布を説明する（数字・語は空欄）。
   考えよう＝「ヒストグラムは、棒グラフとちがって、長方形の間をあけずにかく。なぜだろう」。答えは、ワークシートにも教卓の解答にも載せない。
   図：ヒストグラム＋度数折れ線 histFig、棒グラフ barFig は、このファイルの中で描く。数値は、データの配列から計算し直して checks で確かめる。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {
  const { M, K, B, G, F, C2, BR, T, HD, WD, MA, TB, SVG } = IK.b;
  const RED = '#d62828';

  /* ---- ヒストグラム（と度数折れ線）。o：{ edges, counts, ymax, ystep, xname, yname, caption,
         bars：'given'＝灰色の棒を印刷／'ans'＝解答のときだけ赤で出る（印刷は方眼だけ）、
         poly：'given'＝度数折れ線を黒で印刷／'ans'＝解答のときだけ赤、 ext：左右に度数0の階級を1つずつ足した幅まで軸をのばす（度数折れ線の両はし用）、
         vgrid：階級のさかいの薄い縦線、 noy：縦軸の数字と横線を出さない } ---- */
  const histFig = o => SVG((W, H, h) => {
    const e = o.edges, c = o.counts, n = c.length, ext = o.ext ? 1 : 0, ymax = o.ymax, ys = o.ystep || 1, f = h.f2;
    const padL = 9, padR = o.xname ? 12 : 5, padT = o.caption ? 10 : (o.yname ? 8 : 4), padB = 8;
    const bw = (W - padL - padR) / (n + 2 * ext), yu = (H - padT - padB) / ymax;
    const X = i => padL + (i + ext) * bw, Y = v => H - padB - v * yu;
    let out = '';
    if (o.caption) out += h.tx(W / 2, 4.2, h.svgMath(o.caption), 3, 'middle', ' class="cap"');
    if (!o.noy) for (let v = ys; v <= ymax + 1e-9; v += ys) out += h.ln(X(-ext), Y(v), X(n + ext), Y(v), '#d3d9e0', 0.15);
    if (o.vgrid) for (let i = 0; i <= n; i++) out += h.ln(X(i), Y(0), X(i), Y(ymax), '#e3e7ec', 0.15);
    const bar = (i, st) => `<rect x="${f(X(i))}" y="${f(Y(c[i]))}" width="${f(bw)}" height="${f(c[i] * yu)}" ${st}/>`;
    const an = [];
    c.forEach((v, i) => {
      if (v <= 0) return;
      if (o.bars === 'ans') an.push(bar(i, `fill="#fbe3e3" stroke="${RED}" stroke-width="0.5"`)); else out += bar(i, 'fill="#eef1f5" stroke="#222" stroke-width="0.3"');
    });
    out += h.ln(X(-ext), Y(0), X(n + ext) + 2, Y(0), '#222', 0.32) + h.ln(X(-ext), Y(0), X(-ext), Y(ymax) - 2, '#222', 0.32);
    if (!o.noy) for (let v = 0; v <= ymax + 1e-9; v += ys) out += h.tx(X(-ext) - 1.6, Y(v) + 1, String(v), 2.6, 'end');
    e.forEach((v, i) => { out += h.tx(X(i), Y(0) + 4.2, String(v), 2.6, 'middle'); });
    if (o.yname) out += h.tx(X(-ext) - 1.6, Y(ymax) - 3.6, o.yname, 2.6, 'end');
    if (o.xname) out += h.tx(X(n + ext) + 4.6, Y(0) + 4.2, o.xname, 2.6, 'start');
    if (o.poly && ext) {
      const mid = i => X(i + 0.5), pts = [[mid(-1), Y(0)], ...c.map((v, i) => [mid(i), Y(v)]), [mid(n), Y(0)]], col = o.poly === 'ans' ? RED : '#222';

      if (o.poly === 'ans') an.push(pl); else out += pl;
    }

    const X = i => padL + i * sw, Y = v => H - padB - v * yu;

   授業ナビ 標準版（hyojun-navi）の内容をもとに、50分の流れ（ペア学習3＋小テスト7＋解説・発問12＋演習23＋振り返り・回収5）に合わせて、新しく書き直した。
   型は「探（課題解決）」。学習課題＝本の冊数（1年50人・2年40人）で「6〜8冊は1年10人・2年6人。1年のほうがよく借りている？」（全部印刷）、例題＝各階級の相対度数を求め、「4冊以上」の割合をくらべる（空欄あり）。
   考えよう＝「相対度数が大きければ、人数も多いといえるだろうか」。答えは、ワークシートにも教卓の解答にも載せない。
   数値は、度数の配列から計算し直して checks で確かめる（相対度数は、割り切れる数だけを使う。四捨五入が出るのは、演習（5）だけ）。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {

  const J = JSON.stringify;

  // 度数 c の、相対度数（小数第 d 位までに四捨五入）
  const REL = '((c, d) => { const n = c.reduce((a, b) => a + b, 0); return c.map(v => Math.round(v / n * 10 ** d) / 10 ** d); })';
  const SUMC = '(c => c.reduce((a, b) => a + b, 0))';

  IK.lesson('data-04', {
    unit: 'data', unitName: 'データの活用', no: '第4時', title: '人数のちがう2つの集団を、公平にくらべよう',

    head: 'データの活用　第4時',

      // 学習課題：1年50人（6 14 16 10 4）・2年40人（8 14 10 6 2）。6〜8冊は 10÷50＝0.20、6÷40＝0.15

      // 例題：相対度数 1年 0.12 0.28 0.32 0.20 0.08（合計 1.00）、2年 0.20 0.35 0.25 0.15 0.05（合計 1.00）。4冊以上は 1年 0.60、2年 0.45

      // 考えよう（答えは載せない。ここで確かめるだけ）：600×0.1＝60人、30×0.5＝15人。度数は小さいほうが相対度数は大きい。発展の例：1年50人中10人（0.2）、2年100人中15人（0.15）
      'near(600 * 0.1, 60) && near(30 * 0.5, 15) && 60 > 15 && 0.1 < 0.5 && near(10 / 50, 0.2) && near(15 / 100, 0.15) && 15 > 10 && 0.2 > 0.15',
      // 演習 基礎（1）20人（2 5 6 4 3）：0.10 0.25 0.30 0.20 0.15　（2）12÷40＝0.3、60×0.15＝9
      `JSON.stringify(${REL}([2, 5, 6, 4, 3], 2)) === '[0.1,0.25,0.3,0.2,0.15]' && ${SUMC}([2, 5, 6, 4, 3]) === 20 && near(12 / 40, 0.3) && near(60 * 0.15, 9)`,
      // 標準（3）A組25人（3 10 9 3）：0.12 0.40 0.36 0.12、B組40人（4 14 16 6）：0.10 0.35 0.40 0.15。20分以上は A 0.48、B 0.55 → B組が大きい
      `${SUMC}([3, 10, 9, 3]) === 25 && ${SUMC}([4, 14, 16, 6]) === 40 && JSON.stringify(${REL}([3, 10, 9, 3], 2)) === '[0.12,0.4,0.36,0.12]' && JSON.stringify(${REL}([4, 14, 16, 6], 2)) === '[0.1,0.35,0.4,0.15]' && near(0.36 + 0.12, 0.48) && near(0.4 + 0.15, 0.55) && 0.55 > 0.48 && near((9 + 3) / 25, 0.48) && near((16 + 6) / 40, 0.55)`,
      // （4）120人の相対度数 0.15 0.30 0.35 0.20 → 度数 18 36 42 24（合計 120）、60分以上は 42+24＝66人
      'near(120 * 0.15, 18) && near(120 * 0.3, 36) && near(120 * 0.35, 42) && near(120 * 0.2, 24) && near(18 + 36 + 42 + 24, 120) && near(0.15 + 0.3 + 0.35 + 0.2, 1) && near(42 + 24, 66)',
      // 応用（5）30人（4 6 9 7 4）：小数第3位を四捨五入 → 0.13 0.20 0.30 0.23 0.13、合計 0.99（1にならない）

      // （6）度数 21・相対度数 0.35 → 合計 21÷0.35＝60、相対度数 0.25 の階級は 60×0.25＝15
      'near(21 / 0.35, 60) && near(60 * 0.25, 15)',
      // 入試（7）150人：イ＝150×0.22＝33、ア＝150−(9+54+33+15)＝39、ウ＝39÷150＝0.26。25m以上は 0.22+0.10＝0.32 → 32%
      'near(150 * 0.22, 33) && near(150 - (9 + 54 + 33 + 15), 39) && near(39 / 150, 0.26) && near(9 / 150, 0.06) && near(54 / 150, 0.36) && near(15 / 150, 0.1) && near(0.06 + 0.26 + 0.36 + 0.22 + 0.1, 1) && near((0.22 + 0.1) * 100, 32)',

      `${SUMC}([5, 8, 9, 3]) === 25 && JSON.stringify(${REL}([5, 8, 9, 3], 2)) === '[0.2,0.32,0.36,0.12]' && near(0.2 + 0.32 + 0.36 + 0.12, 1) && near(15 / 50, 0.3) && near(35 * 0.2, 7)`,

  const sum = a => a.reduce((x, y) => x + y, 0), cum = a => a.map((_, i) => sum(a.slice(0, i + 1)));
  const pc2 = (x, n) => (Math.round(100 * x / n) / 100).toFixed(2);

  const CK = (body, ...arrs) => `(() => { const sum = a => a.reduce((x, y) => x + y, 0), cum = a => a.map((_, i) => sum(a.slice(0, i + 1))), pc = (x, n) => Math.round(100 * x / n) / 100; ${arrs.map((a, i) => `const D${i} = ${JSON.stringify(a)};`).join(' ')} ${body} })()`;

/* データの活用 第7時「データを根拠にして判断し、「本当にそういえるか」を確かめよう」：授業計画・ワークシート・演習プリント・小テスト（新しい形）。
   授業ナビ 標準版（hyojun-navi）の第7時（活：説明・批判的に読む）をもとに、50分の流れ（ペア学習3＋小テスト7＋解説・発問12＋演習23＋振り返り・回収5）に合わせて、新しく書き直した。
   印刷は3点セット：ワークシート（A4 表裏）／演習プリント（A4 表裏：表＝基礎・標準、裏＝応用・入試レベル）／小テスト（A4 片面・5分・10点満点。最後の1問は、別枠の入試レベル「チャレンジ」）。
   ・型は「活」。第6時と同じ場面（体育祭の大なわとび。作戦A・Bの20回ずつの記録）と同じデータでつづく。
   ・ワークシートの表＝学習課題（ア・イの目的で、選ぶ作戦を決める）・ことば・例題（「平均値が大きいからA」を点検）／裏＝考えよう（2つの説明が、本当にそういえるかを点検し、気をつける点をまとめる）。
   ・考えようの答えは、教卓の解答（解答を表示）には載せない。答えは示さず、方向性だけを最後に伝える。
   ・データはすべて自作（実際の調査ではない）。数値は checks で、データの配列から計算し直して確かめている。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {
  const { M, K, B, G, F, C2, BR, T, HD, WD, MA, TB, SVG, HIST } = IK.b;

  // ---- 第6時と同じ記録（20回ずつ。小さい順）。度数は階級の幅 10回 ----
  const RA = [4, 8, 11, 13, 15, 17, 19, 21, 23, 24, 26, 27, 29, 31, 33, 35, 37, 42, 44, 51];   // 作戦A
  const RB = [17, 19, 21, 22, 22, 23, 23, 24, 24, 24, 25, 25, 26, 26, 27, 27, 28, 31, 32, 34];   // 作戦B
  const EDG = [0, 10, 20, 30, 40, 50, 60];
  const CA = [2, 5, 6, 4, 2, 1], CB = [0, 2, 15, 3, 0, 0];
  const SA = [5, 6, 6, 7, 7, 7, 7, 8, 8, 9], SB = [2, 3, 4, 6, 7, 7, 8, 10, 11, 12];             // 演習 基礎：シュートゲーム
  const TA = [2, 8, 12, 6, 2], TBB = [1, 5, 9, 10, 5];                                          // 演習 標準：A市・B市の最高気温（28〜30℃ … 36〜38℃）
  const HA = [2, 4, 8, 12, 4], HB = [3, 6, 12, 14, 5];                                          // 演習 入試：A組30人・B組40人のテストの得点（0〜20点 … 80〜100点）
  const SP = ' ', row = a => a.join(SP);
  const sum = a => a.reduce((x, y) => x + y, 0);
  const tr = a => [...a.map(String), String(sum(a))];                 // 度数の行（さいごは計）
  // 検算の道具（文字列で、検算の式の中に埋めこむ）
  const CK = (body, ...arrs) => `(() => { const sum = a => a.reduce((x, y) => x + y, 0), mean = a => sum(a) / a.length, med = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }, rng = a => Math.max(...a) - Math.min(...a), cnt = (a, e) => e.slice(0, -1).map((x, i) => a.filter(v => v >= x && v < e[i + 1]).length); ${arrs.map((a, i) => `const D${i} = ${JSON.stringify(a)};`).join(' ')} ${body} })()`;

  const r2 = v => Math.round(v * 100) / 100;
  /* ヒストグラム（HIST に、見出しをつけたもの）。2つをくらべるときは、ymax をそろえる */
  const histFig = o => SVG((W, H, h) => HIST({ edges: o.edges, counts: o.counts, ymax: o.ymax, ystep: o.ystep, xname: o.xname, yname: o.yname }).svg(W, H, h) + (o.caption ? h.tx(W / 2, 3.4, o.caption, 3, 'middle', ' class="cap"') : ''));

  /* 棒グラフ。縦軸が 0 から始まらないものも、かける（考えよう・演習プリントで、縦軸の目もりを読ませるため）。
     o = { cats:['A','B'], vals:[25.5, 25], ymin, ymax, ystep, dec（目もりの小数の桁）, yname, xname } */
  const barFig = o => SVG((W, H, h) => {
    const n = o.vals.length, padL = 13, padR = 6, padT = 9, padB = 8, bw = (W - padL - padR) / n, yu = (H - padT - padB) / (o.ymax - o.ymin), dec = o.dec || 0;
    const X = i => padL + i * bw, Y = v => H - padB - (v - o.ymin) * yu;
    let out = '';
    for (let v = o.ymin; v <= o.ymax + 1e-9; v += o.ystep) {
      out += h.ln(X(0), Y(v), X(n), Y(v), '#d3d9e0', 0.15) + h.tx(X(0) - 1.6, Y(v) + 1, v.toFixed(dec), 2.6, 'end');
    }

    out += h.ln(X(0), Y(o.ymin), X(n) + 2, Y(o.ymin), '#222', 0.32) + h.ln(X(0), Y(o.ymin), X(0), Y(o.ymax) - 2, '#222', 0.32);
    o.cats.forEach((c, i) => { out += h.tx(X(i) + bw / 2, Y(o.ymin) + 4.2, c, 2.8, 'middle'); });
    if (o.yname) out += h.tx(1, Y(o.ymax) - 3.6, o.yname, 2.6, 'start');
    return out;
  });

  IK.lesson('data-07', {
    unit: 'data', unitName: 'データの活用', no: '第7時', title: 'データを根拠にして判断し、「本当にそういえるか」を確かめよう',
    summary: '前時の大なわとびのデータで、目的に合わせて、根拠をあげて作戦を選ぶ。そのうえで、平均値や縦軸のとり方、調べた人数など、データを使った説明が「本当にそういえるか」を点検し、気をつける点をまとめる。',
    head: 'データの活用　第7時',
    checks: [
      // 学習課題：前時の度数分布表（A 2,5,6,4,2,1／B 0,2,15,3,0,0）。ア 30回以上：A 7人 0.35、B 3人 0.15 → A。イ 20回未満：A 2+5＝7人 0.35、B 0+2＝2人 0.10 → B

   ・型は「探（課題解決）」。学習課題＝ノートとペンを買う2つの班の代金の合計と差（全部印刷）、例題＝(4x+3y)＋(2x−5y) と (4x+3y)−(2x−5y)（空欄あり）。
   ・考えよう＝「x^2+x を、2x^2・x^3・2x にまとめた3人の考えは正しいか。x にいろいろな数を入れて確かめ、まとめられるか説明しよう」。

   ・式の変形の答えは、画面に出す式の文字列そのものを数で計算して（x, y に数を入れて）、もとの式・途中の式・答えの式が等しいことを、checks で確かめる。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {
  const { M, K, B, G, BR, T, HD, WD, MA, TB } = IK.b;

     same(s, t)：2つの式が、たくさんの (x, y) の組で等しいか　chain(列)：列のすべての式が、最初の式と等しいか */
  const EV = (s, v) => {
    let t = String(s).replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
    for (let k = 0; k < 3; k++) t = t.replace(/\[\[([^\]\/]*)\/([^\]]*)\]\]/g, '(($1)/($2))');
    t = t.replace(/([a-z])\^(\d)/g, '($1**$2)').replace(/([0-9a-z)])(?=[a-z(])/g, '$1*');
    const ks = [...new Set(t.match(/[a-z]/g) || [])];
    return new Function(...ks, 'return ' + t)(...ks.map(k => (v && k in v ? v[k] : 1)));
  };
  const LIB = 'const EV = ' + EV + ';'
    + ' const V = p => ({ x: p[0], y: p[1], a: p[0], b: p[1] }); const PTS = [[1, 2], [3, -1], [-2, 5], [4, 3], [2, -4], [-3, -2], [5, 1], [0.5, 7]];'

   型は「遊（ゲーム・活動）」。演習の 23分を、ビンゴにあてる。範囲は、第1〜5時（項・次数、同類項、加減、数との乗除、単項式の乗除、乗除の混じった計算・式の値）。
   ・ビンゴのしくみ：ワークシートの表に「答え ア〜シ（12個）」と、3×3 の空のカードがある。生徒は 12個から 9個を選び、好きなマスに書く。
     出題の問題は、演習プリントの表（基礎（1）〜（6）・標準（7）〜（12））。先生が番号を引き、全員が計算して、答えがカードにあれば ○。縦・横・ななめの 1列でビンゴ。

   ・12問の答えは、すべて別。答えの記号（ア〜シ）と問題番号の対応は、このファイルの BG と POOL で決め、ワークシートの答えの表と、演習プリントの解答（記号つき）は、どちらも BG から作る。

/* 板書型ワークシート：中1 空間図形。A4 1枚（罫7mm・37行）。
   書き方：IK.add(ID, { 授業の情報 }, [ブロック…])
     M(めあて)　K(ラベル, 問題文, 行数)　B(行数, 板書の内容)　F(行数, 図…)　C2([左…], [右…], 幅の比)
   ・問題文と図は、最初から印刷する。1問目（学習課題）は、数字もすべて印刷する。
   ・2問目以降は、数字のいくつかを {{3}} のように書いて空欄にする（問題文でも、図の長さの字でも同じ書き方）。
     「解答を表示」で、空欄の数字が赤で出る。
   ・B(…) は、板書を写すための空欄の罫。2つ目の引数が、解答を表示したときに赤で出る教師の板書（1行＝\n で区切る。1行が罫1行ぶん）。
   検算：node tools/verify.cjs　／　見た目：node tools/check.cjs */
(function () {

  IK.add('kukan-enzui-hyomenseki', {
    unit: 'kukan', unitName: '空間図形', no: '試作（旧形式）', title: '円錐の表面積',

      'near(360 * 4 / 10, 144)',                                    // 学習課題：中心角

      'near(8 / 20, 2 / 5)',
      'near(PI * 10 ** 2 * (2 / 5), 40 * PI)',                      // 側面積
      'near(PI * 4 ** 2, 16 * PI) && near(40 * PI + 16 * PI, 56 * PI)',
      'near(PI * 10 * 4, 40 * PI)',                                 // 気づき：側面積＝π×母線×半径
      'near(PI * 7 * 3, 21 * PI) && near(PI * 3 ** 2, 9 * PI) && near(21 * PI + 9 * PI, 30 * PI)',   // 例題1
      'near(PI * 3 ** 2, 9 * PI) && near(36 * PI - 9 * PI, 27 * PI) && near(27 / 3, 9)',              // 例題2
      'near(PI * 9 * 3 + PI * 3 ** 2, 36 * PI)'                     // 例題2の確かめ
    ]
  }, [
    M('円錐の表面積を求める方法を考えよう'),

    // ---- 学習課題（数字もすべて印刷する） ----
    C2([
      K('学習課題', '底面の半径が 4cm、母線の長さが 10cm の円錐の表面積を求めよう。\n展開図をもとに考えよう。', 3),
      B(6, '展開図 … 側面はおうぎ形、底面は円\n弧の長さ＝底面の円周＝2π×4＝8π\n半径10の円周 … 2π×10＝20π\nおうぎ形は、円の [[8π/20π]]＝[[2/5]]\n側面積 … π×10^2×[[2/5]]＝40π\n底面積 … π×4^2＝16π')
    ], [
      F(9,
        SO({ shape: 'cone', a: 4, c: 9.165, dims: 'r 4cm\nl 10cm', w: 0.8 }),
        NET({ R: 10, r: 4, lR: '10cm', lr: '4cm', ansAngle: '144°', ansArc: '弧 8π cm', w: 1.2 }))
    ], '1:1'),
    B(5, '表面積 … 40π+16π＝56π　　（答）56π cm^2\n【気づき】側面積 40π＝π×10×4\n　　　側面積＝π×（母線の長さ）×（底面の半径）'),

    G(1),

    // ---- 例題1（数字のいくつかを空欄にする） ----
    C2([
      K('例題1', '底面の半径が {{3}}cm、母線の長さが {{7}}cm の円錐の表面積を求めよう。', 2),
      B(6, '側面積 … π×7×3＝21π\n底面積 … π×3^2＝9π\n表面積 … 21π+9π＝30π\n（答）30π cm^2')
    ], [
      F(8, SO({ shape: 'cone', a: 3, c: 6.325, dims: 'r {{3}}cm\nl {{7}}cm' }))
    ], '3:2'),

    G(1),

    // ---- 例題2 ----
    C2([
      K('例題2', '表面積が {{36}}π cm^2、\n底面の半径が {{3}}cm の円錐がある。\n母線の長さを求めよう。', 3),
      B(6, '底面積 … π×3^2＝9π\n側面積 … 36π−9π＝27π\n母線を l cm とすると、π×l×3＝27π\n3πl＝27π　　l＝9\n（答）9cm\n確かめ … 27π+9π＝36π')
    ], [
      F(9, SO({ shape: 'cone', a: 3, c: 8.485, dims: 'r {{3}}cm\nl ？cm' }))
    ], '3:2'),
    B(2, '')
  ]);
})();

/* ---- js/app.js ---- */
/* ikkan：画面。一覧 → 授業（授業計画／ワークシート／演習プリント／小テスト／3点セット）。解答の表示・かくす、印刷。
   場所：#/ ＝一覧、#/<授業のID> ＝ワークシート、#/<授業のID>/plan・/ws・/dr・/qz・/set ＝授業計画・ワークシート・演習プリント・小テスト・3点セット（印刷用）、
         最後に /ans をつけると、解答を表示した状態で開く（例：#/kukan-01/dr/ans）、
         #/print/<単元のキー> ＝ 単元の授業を、まとめて印刷する画面（例：#/print/kukan） */
(function () {
  'use strict';
  const IK = window.IK, R = IK.render;
  const $app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MM = 96 / 25.4;   // 1mm のピクセル数
  const TABS = [['plan', '授業計画'], ['ws', 'ワークシート'], ['dr', '演習プリント'], ['qz', '小テスト'], ['set', '3点セット（印刷）']];
  let ans = false, fit = 'w', cur = null, curTab = 'ws';

  const tabsOf = id => TABS.filter(([k]) => (k === 'plan' ? IK.plans[id] : k === 'dr' ? IK.drills[id] : k === 'qz' ? IK.quizzes[id] : k === 'set' ? (IK.drills[id] || IK.quizzes[id]) : IK.lessons[id]));
  const sheetOf = (id, tab) => (tab === 'dr' ? IK.drills[id] : tab === 'qz' ? IK.quizzes[id] : IK.lessons[id]);
  // 3点セット：印刷する順（ワークシート → 演習プリント → 小テスト）
  const partsOf = id => [['ワークシート', IK.lessons[id]], ['演習プリント', IK.drills[id]], ['小テスト', IK.quizzes[id]]].filter(p => p[1]);
  const nPages = sh => sh.blocks.filter(b => b.type === 'break').length + 1;

  const setAns = on => {
    ans = !!on;
    document.body.classList.toggle('ans-on', ans);
    const b = document.getElementById('ansBtn');
    if (b) { b.setAttribute('aria-pressed', String(ans)); b.textContent = ans ? '解答をかくす' : '解答を表示'; }
    const h = document.getElementById('hint');
    if (h) h.innerHTML = curTab === 'set'
      ? (ans ? '<b>解答を表示中</b>　教卓に置く解答の確認用です。印刷するときは「解答をかくす」にします。' : '印刷の順：①ワークシート（表裏）②演習プリント（表裏）③小テスト（片面）。<b>両面印刷</b>にすると、3枚になります。')
      : ans ? '<b>解答を表示中</b>　赤い字が、教師の板書と、空欄に入れる答えです。（考えようの答えは載せていません）' : '空欄の罫は、授業で書き込む場所です。ことばの空欄は、先生の説明で埋めます。';
  };

  function zoom() {
    const pages = document.querySelector('.pages');
    if (!pages) return;
    const wrap = pages.parentElement, top = document.querySelector('.top');
    const g = R.geo(cur || { paper: 'A4' }), pw = g.P.w * MM, ph = g.P.h * MM;
    let z = Math.min(1.6, (wrap.clientWidth - 32) / pw);
    if (fit === 'all') z = Math.min(z, (window.innerHeight - (top ? top.offsetHeight : 0) - 70) / ph);
    pages.style.zoom = Math.max(0.3, z);
  }

  /* ---- 単元まとめ印刷 ----
     新しい形の授業（授業計画・演習プリント・小テストのどれかがある授業）を、単元ごとに、続けて印刷する。
     印刷するもの・授業のはんい・解答つき・両面印刷を選べる。両面印刷にすると、1ページだけの資料（小テストなど）のうしろに白紙を入れて、
     次の資料が、かならず紙の表から始まるようにする。 */
  const unitLessons = key => IK.order.map(id => IK.lessons[id]).filter(l => l.unit === key && (IK.plans[l.id] || IK.drills[l.id] || IK.quizzes[l.id]));
  const PO = { unit: null, ws: true, dr: true, qz: true, plan: false, duplex: true, mark: true, from: 0, to: 0 };   // 印刷の選び方（この画面を開いているあいだ、覚えておく）
  // 白紙のページ。プリンターや複合機は、まっ白なページを「白紙スキップ」でとばすことがある（とばされると、つぎの資料が小テストのうらに出る）。
  // そこで、紙の下に小さな「白紙」の字（.bl-mk）を印刷して、白紙と見なされないようにする（PO.mark）。画面には出ない。
  const blankHTML = () => `<div class="wsp wsp-blank" style="width:210mm;height:297mm"><span>（白紙：両面印刷で、つぎの資料を紙の表から始めるため）</span>${PO.mark ? '<i class="bl-mk">白紙　（両面印刷で、つぎの資料を表から始めるためのページです）</i>' : ''}</div>`;

  function printParts(key) {
    const ls = unitLessons(key), a = Math.max(0, Math.min(PO.from, ls.length - 1)), b = Math.max(a, Math.min(PO.to, ls.length - 1)), parts = [];
    ls.slice(a, b + 1).forEach(l => {
      const name = [l.unitName, l.no].filter(Boolean).join('　');
      if (PO.plan && IK.plans[l.id]) parts.push({ cap: `${name}　授業計画`, n: 1, html: R.planHTML(IK.plans[l.id], l) });
      [['ws', 'ワークシート', IK.lessons[l.id]], ['dr', '演習プリント', IK.drills[l.id]], ['qz', '小テスト', IK.quizzes[l.id]]].forEach(([k, label, sh]) => {
        if (PO[k] && sh) parts.push({ cap: `${name}　${label}`, n: nPages(sh), html: R.pagesHTML(sh) });
      });
    });
    return parts;
  }

  function printPagesHTML(key) {
    const parts = printParts(key);
    let html = '', pages = 0;
    parts.forEach((p, i) => {
      html += `<div class="set-cap">${esc(p.cap)}　<small>A4 ${p.n}ページ</small></div>${p.html}`;
      pages += p.n;
      if (PO.duplex && p.n % 2 === 1 && i < parts.length - 1) { html += blankHTML(); pages += 1; }
    });
    return { html, pages, docs: parts.length };
  }

  function showPrint(key, askAns) {
    const u = IK.units.find(x => x.key === key), ls = unitLessons(key);
    if (!u || !ls.length) { location.hash = '#/'; return; }
    if (PO.unit !== key) Object.assign(PO, { unit: key, from: 0, to: ls.length - 1 });
    PO.to = Math.min(PO.to, ls.length - 1);
    curTab = 'print'; cur = { paper: 'A4' };
    document.title = `${u.name}　まとめて印刷`;
    const opt = i => `<option value="${i}">${esc([ls[i].no, ls[i].title].filter(Boolean).join('　'))}</option>`;
    const kinds = [['ws', 'ワークシート'], ['dr', '演習プリント'], ['qz', '小テスト'], ['plan', '授業計画']].filter(([k]) => ls.some(l => (k === 'ws' ? IK.lessons[l.id] : k === 'dr' ? IK.drills[l.id] : k === 'qz' ? IK.quizzes[l.id] : IK.plans[l.id])));
    $app.innerHTML = `<header class="top">
        <a class="brand" href="#/" title="一覧へ">← 一覧</a>
        <div class="ttl"><small>${esc(u.name)}</small><b>授業を、まとめて印刷</b></div>
        <span class="sp"></span>
        <button type="button" class="btn" id="fitBtn" title="紙面の見せ方">全体を見る</button>
        ${IK.noPrint ? '' : '<button type="button" class="btn main2" id="prtBtn">まとめて印刷</button>'}
      </header>
      <div class="pages-wrap">
        <div class="pbar">
          <div class="pbar-row"><b>印刷するもの</b>${kinds.map(([k, n]) => `<label><input type="checkbox" data-k="${k}"${PO[k] ? ' checked' : ''}> ${esc(n)}</label>`).join('')}</div>
          <div class="pbar-row"><b>授業</b><select id="pFrom">${ls.map((_, i) => opt(i)).join('')}</select> から <select id="pTo">${ls.map((_, i) => opt(i)).join('')}</select> まで</div>
          <div class="pbar-row"><label><input type="checkbox" id="pAns"> 解答つき（教卓用。生徒に配るときは、はずす）</label>
            <label><input type="checkbox" data-k="duplex"${PO.duplex ? ' checked' : ''}> 両面印刷にする（小テストなど 1ページの資料のうしろに、白紙を入れる。片面で印刷するときは、はずす）</label>
            <label><input type="checkbox" data-k="mark"${PO.mark ? ' checked' : ''}> 白紙には、小さな「白紙」の字を印刷する（プリンターが白紙をとばして、枚数がずれるときに）</label></div>
          <p class="psum" id="pSum"></p>
        </div>
        <div class="pages" id="pPages"></div>
      </div>`;
    const sel = (id, v) => { const e = document.getElementById(id); e.value = String(v); return e; };
    const redraw = () => {
      const r = printPagesHTML(key), sheets = PO.duplex ? Math.ceil(r.pages / 2) : r.pages;
      document.getElementById('pPages').innerHTML = r.html;
      document.getElementById('pSum').innerHTML = r.pages ? `資料 ${r.docs}件、全 <b>${r.pages}ページ</b>（${PO.duplex ? '両面印刷で、紙 <b>' + sheets + '枚</b>' : '片面印刷で、紙 <b>' + sheets + '枚</b>'}）。印刷の設定は、A4・倍率 100%・ヘッダーとフッターなし。` : '印刷するものを選んでください。';
      zoom();
    };
    sel('pFrom', PO.from).onchange = e => { PO.from = +e.target.value; if (PO.to < PO.from) { PO.to = PO.from; sel('pTo', PO.to); } redraw(); };
    sel('pTo', PO.to).onchange = e => { PO.to = +e.target.value; if (PO.from > PO.to) { PO.from = PO.to; sel('pFrom', PO.from); } redraw(); };
    document.querySelectorAll('.pbar input[data-k]').forEach(c => { c.onchange = () => { PO[c.dataset.k] = c.checked; redraw(); }; });
    document.getElementById('pAns').onchange = e => setAns(e.target.checked);
    setAns(!!askAns); document.getElementById('pAns').checked = !!askAns;
    document.getElementById('fitBtn').onclick = e => { fit = fit === 'w' ? 'all' : 'w'; e.target.textContent = fit === 'w' ? '全体を見る' : '幅に合わせる'; zoom(); };
    const prt = document.getElementById('prtBtn'); if (prt) prt.onclick = () => window.print();
    redraw();
  }

  function home() {
    cur = null; ans = false;
    document.title = '数学ワークシート（板書型）';
    document.body.classList.remove('ans-on');
    const units = IK.units.map(u => {
      const ls = IK.order.map(id => IK.lessons[id]).filter(l => l.unit === u.key);
      if (!ls.length) return '';
      const np = unitLessons(u.key).length;
      return `<div class="unit"><h2>${esc(u.name)}</h2><span>中${esc(u.grade)}</span>${np ? `<a class="btn btnp" href="#/print/${esc(u.key)}">この単元を、まとめて印刷（${np}時間）</a>` : ''}</div>
        <div class="cards">${ls.map(l => `<a class="card" href="#/${esc(l.id)}">${l.no ? `<small>${esc(l.no)}</small>` : ''}<b>${esc(l.title)}</b><p>${esc(l.summary || '')}</p>
          <span class="chips">${tabsOf(l.id).map(([, n]) => `<i>${esc(n)}</i>`).join('')}</span><span class="go">ひらく →</span></a>`).join('')}</div>`;
    }).join('');
    $app.innerHTML = `<div class="home">
      <h1>数学ワークシート（板書型）</h1>
      <p class="lead">日付・名前 → めあて → 学習課題・例題。問題の下は、図・グラフ以外は<b>空欄</b>にしてあり、書き込んで使います。
        「解答を表示」を押すと、<b>教師の板書</b>と<b>空欄の答え</b>が赤で出ます。<b>授業計画</b>・<b>演習プリント</b>・<b>小テスト</b>がある授業は、上のタブで切りかえます。<b>3点セット（印刷）</b>のタブでは、ワークシート・演習プリント・小テストを続けて印刷できます。単元の見出しの<b>「この単元を、まとめて印刷」</b>では、単元の授業を、続けて印刷できます。</p>
      ${units || '<p>ワークシートがまだありません。</p>'}
      <div class="note"><h3>ワークシートのつくり方</h3>
        <code>data/lesson_*.js</code>（授業計画・ワークシート・演習プリント）か、<code>data/ws_*.js</code>（ワークシートだけ）に書き足します。くわしくは <code>README.md</code> を見てください。</div>
    </div>`;
  }

  function show(id, tab, askAns) {
    const l = IK.lessons[id];
    if (!l) { location.hash = '#/'; return; }
    const tabs = tabsOf(id);
    if (!tabs.some(([k]) => k === tab)) tab = 'ws';
    curTab = tab;
    cur = tab === 'plan' ? { paper: 'A4' } : sheetOf(id, tab);
    document.title = `${l.title}　数学ワークシート`;
    const pages = tab === 'plan' ? R.planHTML(IK.plans[id], l)
      : tab === 'set' ? partsOf(id).map(([n, sh], i) => `<div class="set-cap">${'①②③'[i]} ${esc(n)}　<small>A4 ${nPages(sh) > 1 ? `${nPages(sh)}ページ（表裏）` : '1ページ（片面）'}</small></div>${R.pagesHTML(sh)}`).join('')
      : R.pagesHTML(cur);
    const seg = tabs.length > 1 ? `<nav class="seg" aria-label="資料の切りかえ">${tabs.map(([k, n]) => `<a href="#/${esc(id)}/${k}"${k === tab ? ' aria-current="page"' : ''}>${esc(n)}</a>`).join('')}</nav>` : '';
    $app.innerHTML = `<header class="top">
        <a class="brand" href="#/" title="一覧へ">← 一覧</a>
        <div class="ttl"><small>${esc([l.unitName, l.no].filter(Boolean).join('　'))}</small><b>${esc(l.title)}</b></div>
        ${seg}
        <span class="sp"></span>
        ${tab === 'plan' ? '' : '<button type="button" class="btn main" id="ansBtn" aria-pressed="false">解答を表示</button>'}
        <button type="button" class="btn" id="fitBtn" title="紙面の見せ方">全体を見る</button>
        ${IK.noPrint ? '' : `<button type="button" class="btn${tab === 'set' ? ' main2' : ''}" id="prtBtn">${tab === 'set' ? '3点セットを印刷' : '印刷'}</button>`}
      </header>
      <div class="pages-wrap">${tab === 'plan' ? '' : '<p class="hint" id="hint"></p>'}<div class="pages">${pages}</div></div>`;
    setAns(tab === 'plan' ? false : tab === 'set' ? !!askAns : (askAns !== undefined ? askAns : ans));   // 3点セットは、いつも解答をかくした状態で開く（印刷用）
    const ab = document.getElementById('ansBtn'); if (ab) ab.onclick = () => setAns(!ans);
    document.getElementById('fitBtn').onclick = e => { fit = fit === 'w' ? 'all' : 'w'; e.target.textContent = fit === 'w' ? '全体を見る' : '幅に合わせる'; zoom(); };
    const prt = document.getElementById('prtBtn'); if (prt) prt.onclick = () => window.print();
    zoom();
  }

  function route(hash) {
    const h = String(hash != null ? hash : location.hash).replace(/^#\/?/, '').split('/');
    if (!h[0]) home();
    else if (h[0] === 'print') showPrint(h[1], h.includes('ans'));
    else show(h[0], ['plan', 'ws', 'dr', 'qz', 'set'].includes(h[1]) ? h[1] : 'ws', h.includes('ans') ? true : undefined);
    window.scrollTo(0, 0);
  }

  // 一覧↔ワークシートの移動は、ページの中で処理する（埋めこみ表示では、アドレスの # が変えられないことがある）
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    const h = a.getAttribute('href');
    try { history.pushState(null, '', h); } catch (_) { /* 変えられなくてもよい */ }
    route(h);
  });
  window.addEventListener('hashchange', () => route());
  window.addEventListener('popstate', () => route());
  window.addEventListener('resize', zoom);
  document.addEventListener('keydown', e => {
    if (!cur || !document.getElementById('ansBtn') || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'a' || e.key === 'A') setAns(!ans);
  });
  route();
})();

</script>
</body>
</html>
