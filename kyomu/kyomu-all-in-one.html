      <div class="grid-btn">${subs.map((s) => `<button data-set="${u.esc(s.code)}" class="${cur === s.code ? 'cur' : ''}" title="${u.esc(s.name)}">${u.esc(s.code)}</button>`).join('')}</div>
      <div class="grid-btn">${['読書', 'C', '自習', ''].map((t) => `<button data-set="${u.esc(t)}">${t ? u.esc(t) : '空き'}</button>`).join('')}</div>
      <div class="row"><input type="text" data-free placeholder="ほかの文字" style="flex:1"><button class="btn small" data-act="free">入れる</button></div>
      ${sameRow ? `<div class="sec row"><b class="small">1くくり</b><button class="btn small" data-merge="grade">${m.cls(x.c).g}年でまとめる</button><button class="btn small" data-merge="all">全校でまとめる</button>${ui.sel.length > 1 ? '<button class="btn small" data-merge="sel">選んだクラスで</button>' : ''}${merged ? '<button class="btn small" data-act="unmerge">まとめを解除</button>' : ''}</div>` : ''}
    </div>`;
  }

  function bind(root, el) {
    const redraw = () => V.base.render(el);
    root.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-term]');
      if (t) {
        ui.sel = [];
        return K.app.go('base', t.dataset.term);
      }
      const a = e.target.closest('[data-act]');
      if (a) {
        if (a.dataset.act === 'print') return K.print.direct({ kind: 'base' });
        if (a.dataset.act === 'zin' || a.dataset.act === 'zout') {
          ui.zoom = Math.max(0.6, Math.min(2, Math.round((ui.zoom + (a.dataset.act === 'zin' ? 0.1 : -0.1)) * 10) / 10));
          localStorage.setItem('kyomu-zoom', ui.zoom);
          return redraw();
        }
        if (a.dataset.act === 'free') return ops.baseSet(ui.term, ui.sel, root.querySelector('[data-free]').value.trim());
        if (a.dataset.act === 'unmerge') {
          const x = ui.sel[0];
          return ops.baseUnmerge(ui.term, x.wd, x.s, m.st.classes.map((c) => c.id));
        }
      }
      const sb = e.target.closest('[data-set]');
      if (sb) return ops.baseSet(ui.term, ui.sel, sb.dataset.set);
      const mb = e.target.closest('[data-merge]');
      if (mb) {
        const x = ui.sel[0];
        const g = m.cls(x.c).g;
        const cls = mb.dataset.merge === 'grade' ? m.st.classes.filter((c) => c.g === g).map((c) => c.id) : mb.dataset.merge === 'all' ? m.st.classes.map((c) => c.id) : ui.sel.map((y) => y.c);
        const cur = (m.base(ui.term).cells[`${x.wd}|${x.s}|${x.c}`] || {}).t || '';
        const text = await u.ask('まとめた枠に入れる文字', cur, { help: '例：読書・総' });
        if (text == null) return;
        ops.baseMerge(ui.term, x.wd, x.s, cls, text.trim());
        ui.sel = cls.map((c) => ({ wd: x.wd, s: x.s, c }));
        return;
      }
      const td = e.target.closest('td');
      if (!td) return;
      if (td.classList.contains('c') && td.dataset.wd) {
        const wd = Number(td.dataset.wd);
        const s = td.dataset.s;
        const cs = td.dataset.c.split(',');
        const cells = cs.map((c) => ({ wd, s, c }));
        if (e.shiftKey && ui.sel.length && ui.sel[0].wd === wd && ui.sel[0].s === s) {
          const ids = m.st.classes.map((c) => c.id);
          const i0 = ids.indexOf(ui.sel[0].c);
          const i1 = ids.indexOf(cs[cs.length - 1]);
          ui.sel = ids.slice(Math.min(i0, i1), Math.max(i0, i1) + 1).map((c) => ({ wd, s, c }));
        } else if (e.ctrlKey || e.metaKey) ui.sel = ui.sel.concat(cells);
        else ui.sel = cells;
        return redraw();
      }
      if (td.dataset.line === 'st') {
        const wd = td.dataset.wd;
        const r = td.dataset.r;
        const b = m.base(ui.term);
        const cur = b.staff[`${wd}|${r}`] || '';
        const v = await u.ask(`${u.WD[wd]}曜 ${Number(r) + 1}行目の「出張等」`, cur, { help: '毎週の定例（④運営委員会 など）。空にすると消します。' });
        if (v == null) return;
        K.store.commit('定例の書きこみ', () => {
          if (v.trim()) b.staff[`${wd}|${r}`] = v.trim();
          else delete b.staff[`${wd}|${r}`];
        });
      }
    });
    const cp = root.querySelector('[data-copy]');
    if (cp)
      cp.addEventListener('change', async () => {
        const from = cp.value;
        if (!from) return;
        const ft = m.st.terms.find((t) => t.id === from);
        if (!(await u.confirm(`「${ft.name}」の基本時間割を、いまの期間にコピーします（いまの内容は上書き）。`, 'コピーする'))) return (cp.value = '');
        K.store.commit('基本時間割をコピー', (st) => (st.bases[ui.term] = u.clone(st.bases[from] || { cells: {}, staff: {} })));
      });
    // ドラッグで入れ替え
    const sheet = root.querySelector('.xs');
    let from = null;
    sheet.addEventListener('dragstart', (e) => {
      const td = e.target.closest('td.c');
      if (!td || !td.dataset.wd) return;
      from = { wd: Number(td.dataset.wd), s: td.dataset.s, c: td.dataset.c.split(',')[0] };
      e.dataTransfer.setData('text/plain', 'swap');
    });
    sheet.addEventListener('dragover', (e) => {
      if (from && e.target.closest('td.c')) e.preventDefault();
    });
    sheet.addEventListener('drop', (e) => {
      const td = e.target.closest('td.c');
      if (!from || !td || !td.dataset.wd) return;
      e.preventDefault();
      const cs = td.dataset.c.split(',');
      const to = { wd: Number(td.dataset.wd), s: td.dataset.s, c: cs.includes(from.c) ? from.c : cs[0] };
      ops.baseSwap(ui.term, from, to);
      from = null;
    });
    const free = root.querySelector('[data-free]');
    if (free) free.addEventListener('keydown', (e) => e.key === 'Enter' && ops.baseSet(ui.term, ui.sel, free.value.trim()));
  }
})();

/* ---- js/views/teachers.js ---- */
/* 先生：担当表（どのクラスのどの教科をだれが持つか）と、先生ごとの週の時間割・全員の空き時間。
   担当表を入れると、入れ替えのときに「その先生があいているか」を見て、入れ替えられるコマを光らせる。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const V = (K.views = K.views || {});
  const ui = { tab: 'matrix', who: '', mon: null };

  function assignTable() {
    const cls = m.st.classes;
    const used = new Set();
    Object.values(m.st.bases).forEach((b) => Object.values(b.cells).forEach((x) => {
      const sj = m.subject(x.t);
      if (sj && sj.counted) used.add(sj.code);
    }));
    const subs = m.st.subjects.filter((s) => s.counted && s.code !== '行事' && (used.has(s.code) || Object.keys(m.st.teach).some((k) => k.endsWith('|' + s.code))));
    return `<table class="cnt" data-assign><tr><th class="l">教科</th>${cls.map((c) => `<th>${c.id}</th>`).join('')}</tr>
      ${subs.map((s, r) => `<tr><td class="l">${u.esc(s.code)}</td>${cls.map((c, i) => `<td style="padding:1px"><input type="text" data-t="${c.id}|${u.esc(s.code)}" data-rc="${r},${i}" value="${u.esc(m.st.teach[`${c.id}|${s.code}`] || '')}" style="width:74px;padding:2px 4px" list="tnames"></td>`).join('')}</tr>`).join('')}
      </table><datalist id="tnames">${m.allTeachers().map((n) => `<option value="${u.esc(n)}">`).join('')}</datalist>`;
  }

  // 先生ごとの、その週のコマ { d|s: [ {c, t} ] }
  function teacherWeek(name, mon) {
    const out = {};
    for (let i = 0; i < 5; i++) {
      const d = u.add(mon, i);
      const day = m.day(d);
      if (!day.school) continue;
      day.layout.forEach((s) => {
        m.st.classes.forEach((c) => {
          const r = m.cell(d, s, c.id);
          if (m.teachersOf(c.id, r.t).includes(name)) (out[d + '|' + s] = out[d + '|' + s] || []).push({ c: c.id, t: r.t });
        });
      });
    }
    return out;
  }

  function matrix(mon, forPrint) {
    const names = m.allTeachers();
    if (!names.length) return '<p class="help">先に「担当表」に先生の名前を入れてください。</p>';
    const days = [0, 1, 2, 3, 4].map((i) => u.add(mon, i));
    const cols = [];
    days.forEach((d) => {
      const day = m.day(d);
      (day.school ? day.layout : m.st.daySlots[u.dow(d)] || []).forEach((s) => {
        const sl = m.slot(s);
        if (sl && sl.counted) cols.push({ d, s, school: day.school });
      });
    });
    let html = `<table class="cnt" style="font-size:12px"><tr><th class="l" rowspan="2">先生</th>${days.map((d) => `<th colspan="${cols.filter((c) => c.d === d).length}">${u.mdw(d)}</th>`).join('')}<th rowspan="2">コマ数</th></tr>
      <tr>${cols.map((c, i) => `<th class="${i && cols[i - 1].d !== c.d ? 'gsep' : ''}">${u.esc(m.slot(c.s).label)}</th>`).join('')}</tr>`;
    names.forEach((n) => {
      const w = teacherWeek(n, mon);
      let count = 0;
      html += `<tr><td class="l"><a href="#teachers" data-who="${u.esc(n)}">${u.esc(n)}</a></td>${cols
        .map((c, i) => {
          const list = w[c.d + '|' + c.s] || [];
          const abs = m.absent(c.d, c.s).has(n);
          count += list.length ? 1 : 0;
          const bad = list.length > 1 && !list.every((x) => u.key(x.t) === u.key(list[0].t) && (m.subject(x.t) || {}).joint);
          return `<td class="${i && cols[i - 1].d !== c.d ? 'gsep' : ''}${bad || (abs && list.length) ? ' lack' : abs ? ' gap1' : ''}" title="${u.esc(list.map((x) => x.c + ' ' + x.t).join('、'))}${abs ? '（不在）' : ''}">${!c.school ? '<span class="muted">−</span>' : list.length ? u.esc(list.map((x) => x.c).join('・')) : abs ? '不在' : ''}</td>`;
        })
        .join('')}<td>${count}</td></tr>`;
    });
    return html + '</table>';
  }

  function personal(name, mon) {
    if (!name) return '<p class="help">先生を選んでください。</p>';
    const w = teacherWeek(name, mon);
    const days = [0, 1, 2, 3, 4].map((i) => u.add(mon, i));
    const slots = m.st.slots.filter((s) => days.some((d) => (m.day(d).layout || []).includes(s.id)));
    return `<table class="cnt" style="font-size:13px"><tr><th></th>${days.map((d) => `<th>${u.mdw(d)}</th>`).join('')}</tr>
      ${slots.map((s) => `<tr><th>${u.esc(m.slotName(s.id))}</th>${days.map((d) => {
        const day = m.day(d);
        if (!day.school) return `<td class="zero">${u.esc(day.offName || '')}</td>`;
        const list = w[d + '|' + s.id] || [];
        const abs = m.absent(d, s.id).has(name);
        return `<td class="${list.length > 1 ? 'lack' : abs ? 'gap1' : ''}">${list.map((x) => `${x.c} ${u.esc(x.t)}`).join('<br>')}${abs ? '<br><span class="small">不在</span>' : ''}</td>`;
      }).join('')}</tr>`).join('')}</table>`;
  }

  V.teachers = {
    title: '先生',
    render(el) {
      if (!ui.mon) ui.mon = (K.views.week.mon && K.views.week.mon()) || u.monday(u.today());
      const names = m.allTeachers();
      const weeks = m.weeks().filter((w) => w.no);
      el.innerHTML = `<div class="view">
        <div class="card row">
          <button class="btn ${ui.tab === 'matrix' ? 'on' : ''}" data-tab2="matrix">全員の週（空き時間）</button>
          <button class="btn ${ui.tab === 'one' ? 'on' : ''}" data-tab2="one">先生ごと</button>
          <button class="btn ${ui.tab === 'assign' ? 'on' : ''}" data-tab2="assign">担当表</button>
          <span style="flex:1"></span>
          ${ui.tab !== 'assign' ? `<select data-mon>${weeks.map((w) => `<option value="${w.mon}" ${w.mon === ui.mon ? 'selected' : ''}>第${w.no}週（${u.md(w.mon)}〜）</option>`).join('')}</select>` : ''}
          ${ui.tab === 'one' ? `<select data-who><option value="">先生を選ぶ</option>${names.map((n) => `<option ${n === ui.who ? 'selected' : ''}>${u.esc(n)}</option>`).join('')}</select>` : ''}
          ${ui.tab !== 'assign' ? '<button class="btn primary" data-act="print">印刷・PDF</button>' : ''}
        </div>
        <div class="card">
          ${ui.tab === 'assign' ? `<h2>担当表</h2><p class="help">クラス×教科ごとに、担当の先生の名前を入れます（2人なら「山田・鈴木」）。Excel の表をコピーして、左上のマスを選んで貼りつけることもできます。<br>入れると：①入れ替えのとき、先生があいているコマが緑に光る　②同じ先生が同じ時間に2クラスにいると赤い枠　③職員の予定に「だれが」を書くと、その先生の授業に⚠</p><div style="overflow:auto">${assignTable()}</div>`
          : ui.tab === 'one' ? `<h2>${u.esc(ui.who || '先生ごとの時間割')}</h2>${personal(ui.who, ui.mon)}`
          : `<h2>全員の週　<span class="small muted">第${m.weekNo(ui.mon)}週</span></h2><p class="help">空いているマス＝その時間は授業なし。自習監督や代わりの先生を探すときに。赤＝同じ時間に2クラス／不在なのに授業あり。</p><div style="overflow:auto">${matrix(ui.mon)}</div>`}
        </div></div>`;
      const root = el.firstElementChild;
      root.addEventListener('click', (e) => {
        const t = e.target.closest('[data-tab2]');
        if (t) {
          ui.tab = t.dataset.tab2;
          return V.teachers.render(el);
        }
        const w = e.target.closest('[data-who]');
        if (w && w.tagName === 'A') {
          e.preventDefault();
          ui.who = w.dataset.who;
          ui.tab = 'one';
          return V.teachers.render(el);
        }
        if (e.target.closest('[data-act="print"]')) K.print.direct({ kind: 'teachers' });
      });
      const ms = root.querySelector('[data-mon]');
      if (ms)
        ms.addEventListener('change', () => {
          ui.mon = ms.value;
          V.teachers.render(el);
        });
      const ws = root.querySelector('select[data-who]');
      if (ws)
        ws.addEventListener('change', () => {
          ui.who = ws.value;
          V.teachers.render(el);
        });
      const tb = root.querySelector('[data-assign]');
      if (tb) {
        tb.addEventListener('change', (e) => {
          const inp = e.target.closest('[data-t]');
          if (!inp) return;
          K.store.commit('担当表', (st) => {
            if (inp.value.trim()) st.teach[inp.dataset.t] = inp.value.trim();
            else delete st.teach[inp.dataset.t];
          });
        });
        // Excel から表を貼りつけ
        tb.addEventListener('paste', (e) => {
          const inp = e.target.closest('[data-rc]');
          const text = (e.clipboardData || window.clipboardData).getData('text');
          if (!inp || !/[\t\n]/.test(text)) return;
          e.preventDefault();
          const [r0, c0] = inp.dataset.rc.split(',').map(Number);
          const rows = text.replace(/\r/g, '').replace(/\n$/, '').split('\n').map((l) => l.split('\t'));
          K.store.commit('担当表を貼りつけ', (st) => {
            rows.forEach((cols, dr) =>
              cols.forEach((v, dc) => {
                const t = tb.querySelector(`[data-rc="${r0 + dr},${c0 + dc}"]`);
                if (!t) return;
                if (v.trim()) st.teach[t.dataset.t] = v.trim();
                else delete st.teach[t.dataset.t];
              })
            );
          });
        });
      }
    },
    printPages() {
      const title = `${ui.tab === 'one' ? ui.who + '先生' : '全員'}の時間割　第${m.weekNo(ui.mon)}週（${u.md(ui.mon)}〜${u.md(u.add(ui.mon, 4))}）`;
      return { pages: [`<div class="page land"><div class="fitbox"><div class="print-doc"><h2>${u.esc(title)}</h2>${ui.tab === 'one' ? personal(ui.who, ui.mon) : matrix(ui.mon, true)}</div></div></div>`], land: true };
    },
  };
})();

/* ---- js/views/settings.js ---- */

(function () {

  const m = K.m;

  V.settings = {
    title: '設定・取り込み',
    render(el, params) {
      if (params && params[0] === 'import') return K.views.importer.render(el);

      el.innerHTML = `<div class="view" style="max-width:1100px">
        ${sec(
          'データ（このブラウザの中だけに保存）',

            <button class="btn primary" data-act="import">今の Excel（週行事）から取り込む</button>
            <button class="btn" data-act="export">バックアップを書き出す（JSON）</button>

          '入力した内容は、このブラウザに自動で保存されます。インターネットには何も送りません。ブラウザの「閲覧データを削除」をすると消えるので、週に1回くらいバックアップをとってください（別のパソコンへ移すときも、このファイルを「戻す」で読みこみます）。'
        )}
        ${sec(
          'バックアップの保存先フォルダ（ボタン一つで上書き保存）',
          K.backup.supported()
            ? `<div class="row"><span>保存先：</span><b data-bkfolder>…</b>
                <button class="btn small primary" data-act="bk-choose">フォルダを選ぶ・変える</button>
                <button class="btn small" data-act="bk-save" data-bkneed>いま保存する</button>
                <button class="btn small" data-act="bk-restore" data-bkneed>保存先のバックアップから戻す</button>
                <button class="btn small danger" data-act="bk-forget" data-bkneed>保存先を解除</button></div>
              <p class="small" style="margin:8px 0 0">保存するファイル：<code>${u.esc(K.store.backupName(false))}</code>（毎回、上書き）</p>
              <label class="chk small" style="margin-top:6px"><input type="checkbox" data-o="backupDated" ${st.opt.backupDated ? 'checked' : ''}>上書きのほかに、日付つきのファイルも残す（例：<code>${u.esc(K.store.backupName(true))}</code>。1日1つ）</label>`
            : '<p class="help">このブラウザでは、フォルダへの上書き保存は使えません（Edge か Chrome なら使えます）。上の「バックアップを書き出す」で、ダウンロードの場所に保存してください。</p>',
          '一度フォルダを選んでおくと、右上の「バックアップ」を押すだけで、そのフォルダのファイルに上書き保存します。OneDrive や学校の共有フォルダなど、パソコンが壊れても残る場所がおすすめです。2回目からは、ブラウザが「保存を許可しますか」と聞くことがあります（「許可」を押す）。'
        )}
        ${sec(
          '学校・年度',
          `<div class="form"><label>学校名</label><input type="text" data-s="name" value="${u.esc(st.school.name)}" placeholder="（週行事の右上に出ます）">
          <label>年度</label><div class="row"><input type="number" data-s="year" value="${st.school.year}" style="width:100px"><span class="small muted">（令和${st.school.year - 2018}年度）</span></div>
          <label>週行事の題</label><input type="text" data-s="title" value="${u.esc(st.school.title)}"></div>`
        )}
        ${sec(
          '期間（基本時間割が変わる区切り）',
          `<table class="cnt"><tr><th class="l">名前</th><th>はじまり</th><th>おわり</th><th>授業日数</th><th></th></tr>
          ${st.terms.map((t, i) => `<tr><td class="l"><input type="text" data-t="${i}|name" value="${u.esc(t.name)}" style="width:140px"></td><td><input type="date" data-t="${i}|start" value="${t.start}"></td><td><input type="date" data-t="${i}|end" value="${t.end}"></td><td>${t.start && t.end ? m.schoolDays(t.start, t.end) : ''}</td><td><button class="btn small" data-go-base="${t.id}">基本時間割</button> ${st.terms.length > 1 ? `<button class="btn small danger" data-del-term="${i}">消す</button>` : ''}</td></tr>`).join('')}
          </table><div class="row" style="margin-top:8px"><button class="btn small" data-act="add-term">＋期間を足す</button></div>`,
          '期間に入っていない日（夏休みなど）は授業のない日になります。週の番号は、授業のある週だけに 1 から順にふります。祝日は自動で入ります（振替休日・国民の休日も）。'
        )}
        ${sec(
          'クラス',
          `<div class="row">${st.classes.map((c, i) => `<span class="chip">${u.esc(c.id)} <button class="btn small" data-del-cls="${i}" title="消す" style="padding:0 4px">×</button></span>`).join(' ')}</div>
          <div class="row" style="margin-top:8px"><input type="text" data-new-cls placeholder="例：3-4" style="width:90px"><button class="btn small" data-act="add-cls">＋クラスを足す</button></div>`
        )}
        ${sec(
          '校時と曜日',
          `<table class="cnt"><tr><th>校時</th><th>表示</th><th>時数に数える</th>${[1, 2, 3, 4, 5].map((w) => `<th>${u.WD[w]}</th>`).join('')}<th>昼休みの線</th></tr>
          ${st.slots.map((s) => `<tr><td>${u.esc(m.slotName(s.id))}</td><td><input type="text" data-sl="${s.id}|label" value="${u.esc(s.label)}" style="width:44px"></td><td><input type="checkbox" data-sl="${s.id}|counted" ${s.counted ? 'checked' : ''}></td>
            ${[1, 2, 3, 4, 5].map((w) => `<td><input type="checkbox" data-ds="${w}|${s.id}" ${(st.daySlots[w] || []).includes(s.id) ? 'checked' : ''}></td>`).join('')}
            <td><input type="radio" name="lunch" data-lunch="${s.id}" ${st.lunchAfter === s.id ? 'checked' : ''}></td></tr>`).join('')}</table>`,
          '曜日ごとに、時間割に並ぶ校時を選びます（例：木曜だけ7限まで）。「昼休みの線」の校時の下に太い線が入ります。'
        )}
        ${sec(
          '教科（時間割に書く記号）',
          `<table class="cnt"><tr><th>記号</th><th>名前</th><th>まとめる先</th><th>時数に数える</th><th title="体育のように、同じ先生が複数クラスを同時に持ってよい">合同可</th><th></th></tr>
          ${st.subjects.map((s, i) => `<tr><td><input type="text" data-sj="${i}|code" value="${u.esc(s.code)}" style="width:70px"></td><td><input type="text" data-sj="${i}|name" value="${u.esc(s.name)}" style="width:120px"></td>
            <td><input type="text" data-sj="${i}|group" value="${u.esc(s.group)}" style="width:70px"></td><td><input type="checkbox" data-sj="${i}|counted" ${s.counted ? 'checked' : ''}></td><td><input type="checkbox" data-sj="${i}|joint" ${s.joint ? 'checked' : ''}></td>
            <td><button class="btn small danger" data-del-sj="${i}">×</button></td></tr>`).join('')}</table>
          <div class="row" style="margin-top:8px"><button class="btn small" data-act="add-sj">＋教科を足す</button></div>`,
          '「まとめる先」は時数で教科ごとに足すときの名前（理a・理b・理c → 理）。時数に数えないもの（読書・C など）はチェックを外します。'
        )}
        ${sec(
          '表示',
          `<label class="chk"><input type="checkbox" data-o="firstHeaderColor" ${st.opt.firstHeaderColor ? 'checked' : ''}>月曜のクラス名の行に学年の色</label>
           <label class="chk"><input type="checkbox" data-o="printDate" ${st.opt.printDate ? 'checked' : ''}>右上に印刷日時</label>`
        )}
      </div>`;
      const root = el.firstElementChild;
      const commit = (label, fn) => K.store.commit(label, fn);
      const fl = root.querySelector('[data-bkfolder]');
      if (fl)
        K.backup.folder().then((h) => {
          fl.textContent = h ? `「${h.name}」フォルダ` : 'まだ決めていません';
          root.querySelectorAll('[data-bkneed]').forEach((b) => (b.disabled = !h));
        });
      root.addEventListener('change', (e) => {
        const t = e.target;
        if (t.dataset.s) commit('学校の設定', (s) => (s.school[t.dataset.s] = t.dataset.s === 'year' ? Number(t.value) : t.value));
        if (t.dataset.t) {
          const [i, k] = t.dataset.t.split('|');
          commit('期間', (s) => (s.terms[i][k] = t.value));
        }
        if (t.dataset.sl) {
          const [id, k] = t.dataset.sl.split('|');
          commit('校時', (s) => (s.slots.find((x) => x.id === id)[k] = k === 'counted' ? t.checked : t.value));
        }
        if (t.dataset.ds) {
          const [w, id] = t.dataset.ds.split('|');
          commit('曜日の校時', (s) => {
            const set = new Set(s.daySlots[w] || []);
            if (t.checked) set.add(id);
            else set.delete(id);
            s.daySlots[w] = s.slots.map((x) => x.id).filter((x) => set.has(x));
          });
        }
        if (t.dataset.lunch) commit('昼休みの線', (s) => (s.lunchAfter = t.dataset.lunch));
        if (t.dataset.sj) {
          const [i, k] = t.dataset.sj.split('|');
          commit('教科', (s) => (s.subjects[i][k] = k === 'counted' || k === 'joint' ? t.checked : t.value.trim()));
        }
        if (t.dataset.o) commit('表示', (s) => (s.opt[t.dataset.o] = t.checked));
        if (t.dataset.restore != null && t.files[0])
          K.store
            .importJson(t.files[0])
            .then(() => u.toast('バックアップから戻しました'))
            .catch((err) => u.toast('読みこめませんでした：' + err.message, 5000));
      });
      root.addEventListener('click', async (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const act = b.dataset.act;
        if (act === 'import') K.app.go('settings', 'import');
        if (act === 'export') K.store.exportJson();
        if (act === 'bk-choose') K.backup.choose(false);
        if (act === 'bk-save') K.backup.button();
        if (act === 'bk-restore') K.backup.restoreFromFolder();
        if (act === 'bk-forget' && (await u.confirm('保存先フォルダを解除します（フォルダの中のファイルは消えません）。', '解除する'))) {
          await K.backup.forget();
          K.app.refresh();
        }
        if (act === 'wipe' && (await u.confirm('すべてのデータを消して、最初の状態にします。\n（念のため、先にバックアップを書き出してください）', '全部消す'))) K.store.replace(m.blank(m.st.school.year), '全部消す');
        if (act === 'add-term') commit('期間を足す', (s) => {
          const id = 't' + u.uid();
          s.terms.push({ id, name: '新しい期間', start: '', end: '' });
          s.bases[id] = { cells: {}, staff: {} };
        });
        if (b.dataset.delTerm != null && (await u.confirm('この期間と、その基本時間割を消します。', '消す'))) commit('期間を消す', (s) => {
          const t = s.terms.splice(Number(b.dataset.delTerm), 1)[0];
          delete s.bases[t.id];
        });
        if (b.dataset.goBase) K.app.go('base', b.dataset.goBase);
        if (act === 'add-cls') {
          const v = u.norm(root.querySelector('[data-new-cls]').value).replace(/[・]/g, '-');
          const mm = /^([1-9])-([1-9])$/.exec(v);
          if (!mm) return u.toast('「3-4」のように 学年-組 で入れてください');
          if (m.cls(v)) return u.toast('すでにあります');
          commit('クラスを足す', (s) => {
            s.classes.push({ id: v, g: Number(mm[1]), label: `${u.toZen(mm[1])}・${u.toZen(mm[2])}` });
            s.classes.sort((a, c) => (a.id < c.id ? -1 : 1));
          });
        }
        if (b.dataset.delCls != null && (await u.confirm('このクラスを消します（時間割の中身は残りますが表示されなくなります）。', '消す'))) commit('クラスを消す', (s) => s.classes.splice(Number(b.dataset.delCls), 1));
        if (act === 'add-sj') commit('教科を足す', (s) => s.subjects.push({ code: '新', name: '新しい教科', group: '新', counted: true, joint: false }));
        if (b.dataset.delSj != null) commit('教科を消す', (s) => s.subjects.splice(Number(b.dataset.delSj), 1));
      });
    },
  };
})();

/* ---- js/views/import.js ---- */
/* Excel（今使っている週行事のファイル）から取り込む画面。
   ファイルはブラウザの中で読むだけ。どこにも送らない。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const V = (K.views = K.views || {});
  let found = []; // scan の結果
  let busy = '';
  let scanning = false;
  const opt = { events: true, marks: true, mode: 'merge' };

  V.importer = {
    title: '取り込み',
    render(el) {
      const bases = found.filter((x) => x.kind === 'base');
      const weeks = found.filter((x) => x.kind === 'week');
      const byMon = {};
      weeks.forEach((x) => (byMon[x.mon] = byMon[x.mon] || []).push(x));
      el.innerHTML = `<div class="view" style="max-width:1100px">
        <div class="card">
          <h2>今の Excel から取り込む</h2>
          <p class="help">週行事のファイル（.xlsx）を選んでください。<b>複数まとめて選べます</b>（1学期のファイルと2学期のファイルなど）。ファイルはこのブラウザの中で読むだけで、どこにも送りません。<br>
          読み取るもの：基本時間割のシート（「R8の前期」「R8の後期」など）、週のシート（「R8の16週」など）の時間割・行事欄・出張等・結合（1くくり）・セルの色・図形（確定版の四角・お知らせ）。</p>
          <div class="row"><label class="btn primary">Excel ファイルを選ぶ<input type="file" accept=".xlsx,.xlsm" multiple data-files hidden></label>
            <span class="small">日付は <b>${m.st.school.year}年度</b> として読みます（ちがうときは「設定」で年度を変えてから）。</span></div>
          ${busy ? `<p class="chip warn" style="margin-top:10px">${u.esc(busy)}</p>` : ''}
        </div>
        ${found.length && !scanning ? `
        <div class="card"><h3>基本時間割（どの期間に使うか）</h3>
          ${bases.length ? `<table class="cnt"><tr><th class="l">シート</th><th class="l">ファイル</th>${m.st.terms.map((t) => `<th>${u.esc(t.name)}</th>`).join('')}</tr>
          ${bases.map((x, i) => `<tr><td class="l">${u.esc(x.sheet)}</td><td class="l small">${u.esc(x.file)}</td>${m.st.terms.map((t) => `<td><input type="checkbox" data-bt="${i}|${t.id}" ${(x.terms || []).includes(t.id) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}</table>` : '<p class="help">基本時間割らしいシートは見つかりませんでした。</p>'}
          <p class="help">ふつうは「前期」→ 1学期・2学期前期、「後期」→ 2学期後期・3学期後期。期間の日付は、週のシートの日付から自動で合わせます。</p>
        </div>
        <div class="card"><h3>週のシート（${Object.keys(byMon).length}週）</h3>
          <div style="max-height:360px;overflow:auto"><table class="cnt"><tr><th>使う</th><th>月曜日</th><th>Excel の週</th><th class="l">シート（ファイル）</th></tr>
          ${Object.keys(byMon).sort().map((mon) => {
            const list = byMon[mon];
            return list.map((x, j) => `<tr><td><input type="${list.length > 1 ? 'radio' : 'checkbox'}" name="w-${mon}" data-w="${found.indexOf(x)}" ${x.use ? 'checked' : ''}></td>${j === 0 ? `<td rowspan="${list.length}">${u.mdw(mon)}</td>` : ''}<td>${x.weekNo ? '第' + x.weekNo + '週' : ''}</td><td class="l">${u.esc(x.sheet)} <span class="small muted">（${u.esc(x.file)}）</span></td></tr>`).join('') + (list.length > 1 ? `<tr><td><input type="radio" name="w-${mon}" data-wnone="${mon}" ${list.every((x) => !x.use) ? 'checked' : ''}></td><td colspan="3" class="l small muted">この週は取り込まない</td></tr>` : '');
          }).join('')}</table></div>
          <p class="help">同じ週が何枚かあるときは、あとに選んだファイルのものを先に選んでいます。年度の書いていないシート（去年の残りなど）は外してあります。</p>
        </div>
        <div class="card"><h3>取り込み方</h3>
          <label class="chk"><input type="checkbox" data-o="events" ${opt.events ? 'checked' : ''}>行事欄の文字を、年間行事・月行事にも入れる（時刻や注意書きの行は、その週だけの書きこみにする）</label><br>
          <label class="chk"><input type="checkbox" data-o="marks" ${opt.marks ? 'checked' : ''}>セルの色・太字も取り込む</label><br>
          <label class="chk"><input type="radio" name="mode" value="merge" ${opt.mode === 'merge' ? 'checked' : ''}>今のデータに入れる（取り込む週・期間だけ入れかえ。自分で入れた行事は残す）</label><br>
          <label class="chk"><input type="radio" name="mode" value="fresh" ${opt.mode === 'fresh' ? 'checked' : ''}>まっさらにしてから取り込む</label>
          <div class="btns"><button class="btn" data-act="clear">選びなおす</button><button class="btn primary" data-act="go">取り込む</button></div>
        </div>` : ''}
      </div>`;
      const root = el.firstElementChild;
      root.querySelector('[data-files]').addEventListener('change', async (e) => {
        const files = [...e.target.files];
        if (!files.length) return;
        found = [];
        scanning = true;
        for (const f of files) {
          busy = `読みこみ中…　${f.name}（大きいファイルは数秒かかります）`;
          V.importer.render(el);
          try {
            const book = await K.xlsx.open(f);
            const items = await K.imp.scan(book, f.name, m.st.school.year);
            found.push(...items);
          } catch (err) {
            u.toast(`${f.name} を読めませんでした：${err.message}`, 6000);
          }
        }
        // 同じ週は、あとのファイルを使う
        const last = {};
        found.forEach((x) => x.kind === 'week' && x.use && (last[x.mon] = x));
        found.forEach((x) => x.kind === 'week' && (x.use = last[x.mon] === x));
        // 基本：名前から期間をあてる（同じ名前なら、あとのファイル）
        const seen = {};
        found.filter((x) => x.kind === 'base').forEach((x) => (seen[x.sheet.trim()] = x));
        found.filter((x) => x.kind === 'base').forEach((x) => (x.terms = seen[x.sheet.trim()] === x && (x.era == null || x.era === m.st.school.year) ? K.imp.guessTerms(x.sheet) : []));
        scanning = false;
        busy = `${files.length}ファイルから、基本時間割 ${found.filter((x) => x.kind === 'base').length}枚・週 ${found.filter((x) => x.kind === 'week').length}枚 を見つけました。`;
        V.importer.render(el);
      });
      root.addEventListener('change', (e) => {
        const t = e.target;
        const bases2 = found.filter((x) => x.kind === 'base');
        if (t.dataset.bt) {
          const [i, tid] = t.dataset.bt.split('|');
          const x = bases2[Number(i)];
          x.terms = (x.terms || []).filter((y) => y !== tid);
          if (t.checked) {
            bases2.forEach((y) => (y.terms = (y.terms || []).filter((z) => z !== tid)));
            x.terms.push(tid);
            root.querySelectorAll(`[data-bt$="|${tid}"]`).forEach((cb) => cb !== t && (cb.checked = false));
          }
        }
        if (t.dataset.w != null) {
          const x = found[Number(t.dataset.w)];
          if (t.type === 'radio') found.filter((y) => y.kind === 'week' && y.mon === x.mon).forEach((y) => (y.use = y === x));
          else x.use = t.checked;
        }
        if (t.dataset.wnone) found.filter((y) => y.kind === 'week' && y.mon === t.dataset.wnone).forEach((y) => (y.use = false));
        if (t.dataset.o) opt[t.dataset.o] = t.checked;
        if (t.name === 'mode') opt.mode = t.value;
      });
      root.addEventListener('click', async (e) => {
        const a = e.target.closest('[data-act]');
        if (!a) return;
        if (a.dataset.act === 'clear') {
          found = [];
          busy = '';
          return V.importer.render(el);
        }
        if (a.dataset.act === 'go') run(el);
      });
    },
  };

  function run(el) {
    const bases = found.filter((x) => x.kind === 'base' && x.terms && x.terms.length).map((item) => ({ item, terms: item.terms }));
    const weeks = found.filter((x) => x.kind === 'week' && x.use).sort((a, b) => (a.mon < b.mon ? -1 : 1)).map((item) => ({ item }));
    if (!bases.length && !weeks.length) return u.toast('取り込むシートを選んでください');
    const orig = m.st;
    const st = opt.mode === 'fresh' ? m.blank(orig.school.year) : u.clone(orig);
    if (opt.mode === 'fresh') st.school = Object.assign({}, st.school, { name: orig.school.name });
    // 取り込む週の、前に取り込んだ分を消す（自分で入れた行事は残す）
    weeks.forEach(({ item }) => {
      const days = u.range(item.mon, u.add(item.mon, 6));
      days.forEach((d) => {
        Object.keys(st.ovr).forEach((k) => k.startsWith(d + '|') && delete st.ovr[k]);
        delete st.lines[d];
        delete st.memo[d];
      });
      st.events = st.events.filter((e) => !(e.imported && days.includes(e.date)));
      delete st.weekMeta[item.mon];
    });
    let rep;
    try {
      rep = K.imp.apply(st, bases, weeks, { events: opt.events, marks: opt.marks });
    } catch (err) {
      m.st = orig;
      m.touch();
      console.error(err);
      return u.toast('取り込みの途中でうまくいきませんでした：' + err.message, 6000);
    }
    m.st = orig;
    K.store.replace(st, 'Excel から取り込み');
    found = [];
    busy = '';
    const lastMon = weeks.length ? weeks[weeks.length - 1].item.mon : null;
    const md = u.modal(`<h3>取り込みました</h3>
      <ul><li>基本時間割：${rep.bases}期間ぶん</li><li>週：${rep.weeks}週（基本と違うコマ ${rep.overrides}こ）</li><li>行事：${rep.events}件・休業日：${rep.holidays}日</li><li>行事欄・出張等の書きこみ：${rep.lines}行</li></ul>
      <p class="help">期間の日付：${m.st.terms.map((t) => `${u.esc(t.name)} ${t.start ? u.md(t.start) + '〜' + u.md(t.end) : '—'}`).join('　')}<br>ちがっていたら「設定」の「期間」で直してください。<br>担当の先生（担当表）は Excel に無いので、「先生」の画面で入れると、入れ替えのときに空いている先生がわかるようになります。</p>
      <div class="btns"><button class="btn" data-close>閉じる</button>${lastMon ? '<button class="btn primary" data-open>週行事を開く</button>' : ''}</div>`);
    const ob = md.el.querySelector('[data-open]');
    if (ob)
      ob.addEventListener('click', () => {
        md.close();
        K.views.week.go(lastMon);
      });
  }
})();

/* ---- js/print.js ---- */
/* 印刷・PDF。ブラウザの印刷を使う（送り先で「PDF に保存」を選ぶと PDF になる）。
   週行事は 1 週＝A4 縦 1 枚（Excel と同じ）。年間行事は A4 横（A3 にも拡大印刷できる）。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const P = (K.print = {});

  // pages: ページの HTML の並び、land: 横向き
  P.run = (pages, land) => {
    const area = u.$('#print-area');
    area.innerHTML = pages.join('');
    let style = u.$('#page-style');
    if (!style) {
      style = document.createElement('style');
      style.id = 'page-style';
      document.head.appendChild(style);
    }
    style.textContent = `@page { size: A4 ${land ? 'landscape' : 'portrait'}; margin: 0; }`;
    // 縮める計算のため、いったん画面の外に出して大きさを測る
    area.style.cssText = 'display:block;position:absolute;left:-30000px;top:0';
    K.sheet.fitPages(area);
    area.style.cssText = '';
    const clear = () => {
      area.innerHTML = '';
      window.removeEventListener('afterprint', clear);
    };
    window.addEventListener('afterprint', clear);
    setTimeout(() => window.print(), 50);
  };

  P.weekPages = (mons, o) => mons.map((mon) => K.sheet.page(K.sheet.week(mon, o)));

  // ボタンを使わずに Ctrl+P で印刷したときも、いま開いている画面の印刷用ページを出す
  window.addEventListener('beforeprint', () => {
    const area = u.$('#print-area');
    if (!area || area.innerHTML.trim()) return;
    const h = location.hash.replace(/^#/, '').split('/')[0] || 'week';
    let pages = [];
    let land = false;
    if (h === 'week') pages = P.weekPages([K.views.week.mon()], {});
    else if (K.views[h] && K.views[h].printPages) {
      const r = K.views[h].printPages({ kind: h });
      pages = r.pages;
      land = r.land;
    }
    if (!pages.length) return;
    area.innerHTML = pages.join('');
    let style = u.$('#page-style');
    if (!style) {
      style = document.createElement('style');
      style.id = 'page-style';
      document.head.appendChild(style);
    }
    style.textContent = `@page { size: A4 ${land ? 'landscape' : 'portrait'}; margin: 0; }`;
    area.style.cssText = 'display:block;position:absolute;left:-30000px;top:0';
    K.sheet.fitPages(area);
    area.style.cssText = '';
    const clear = () => {
      area.innerHTML = '';
      window.removeEventListener('afterprint', clear);
    };
    window.addEventListener('afterprint', clear);
  });

  P.dialog = (job) => {
    if (job.kind !== 'week') return P.direct(job);
    const weeks = m.weeks().filter((w) => w.no);
    const curNo = m.weekNo(job.mon);
    const opt = m.st.opt;
    const md = u.modal(
      `<h3>週行事を印刷・PDF</h3>
      <p class="help">Excel と同じ形で、1週を A4 縦 1 枚にします。PDF にするときは、印刷の画面の「送信先（プリンター）」で<b>「PDF に保存」</b>を選んでください。</p>
      <div class="form">
        <label>どの週</label>
        <div class="row">
          <label class="chk"><input type="radio" name="rng" value="one" checked>この週（${curNo ? `第${curNo}週` : u.md(job.mon)}）</label>
          <label class="chk"><input type="radio" name="rng" value="many">第<select data-p="from">${weeks.map((w) => `<option value="${w.mon}" ${w.mon === job.mon ? 'selected' : ''}>${w.no}</option>`).join('')}</select>週 〜 第<select data-p="to">${weeks.map((w) => `<option value="${w.mon}" ${w.mon === job.mon ? 'selected' : ''}>${w.no}</option>`).join('')}</select>週</label>
        </div>
        <label>入れるもの</label>
        <div class="row">
          <label class="chk"><input type="checkbox" data-p="staff" ${opt.showStaff ? 'checked' : ''}>出張等の欄</label>
          <label class="chk"><input type="checkbox" data-p="mark" ${opt.mark ? 'checked' : ''}>変更したコマの色</label>
          <label class="chk"><input type="checkbox" data-p="printDate" ${opt.printDate ? 'checked' : ''}>印刷した日時</label>
          <label class="chk"><input type="checkbox" data-p="stamp" checked>四角の印（確定版など）</label>
        </div>
      </div>
      <div class="btns"><button class="btn" data-close>やめる</button><button class="btn primary" data-go>印刷する</button></div>`
    );
    md.el.querySelector('[data-go]').addEventListener('click', () => {
      const q = (k) => md.el.querySelector(`[data-p="${k}"]`);
      const many = md.el.querySelector('input[name="rng"]:checked').value === 'many';
      let mons = [job.mon];
      if (many) {
        const a = q('from').value;
        const b = q('to').value;
        mons = weeks.map((w) => w.mon).filter((x) => x >= (a < b ? a : b) && x <= (a < b ? b : a));
      }
      const o = { staff: q('staff').checked, mark: q('mark').checked, printDate: q('printDate').checked, noStamp: !q('stamp').checked };
      md.close();
      P.run(P.weekPages(mons, o), false);
    });
  };

  // 週以外：その画面が用意したページをそのまま印刷
  P.direct = (job) => {
    const v = K.views[job.kind];
    if (!v || !v.printPages) return;
    const r = v.printPages(job);
    P.run(r.pages, r.land);
  };
})();

/* ---- js/demo-data.js ---- */
/* デモ用の見本の学校（「見本中学校」）。先生の名前も時間割もすべて架空。
   毎回おなじ時間割になるように、決まった乱数で作る。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const DD = (K.demoData = {});

  // 決まった順番で出る乱数
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const shuffle = (arr, r) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // 学年ごとの週の時数（固定のコマ：月3 道・木7 学・金5〜6 総 をのぞく 27 コマ）
  const COUNTS = {
    1: { 国: 4, 社: 3, 数: 4, 理: 3, 英: 4, 音: 2, 美: 1, 体: 3, 技: 1, 家: 1, 書: 1 },
    2: { 国: 4, 社: 3, 数: 4, 理: 4, 英: 4, 音: 1, 美: 1, 体: 3, 技: 1, 家: 1, 英ALT: 1 },
    3: { 国: 3, 社: 4, 数: 4, 理: 4, 英: 4, 音: 1, 美: 1, 体: 3, 技家: 1, 探: 1, 英ALT: 1 },
  };
  // 担当（架空）
  const T = {
    国: ['山田', '鈴木', '高橋'],
    社: ['伊藤', '伊藤', '渡辺'],
    数: ['中村', '小川', '加藤'],
    理: ['吉田', '山本', '森'],
    英: ['池田', '前田', '岡田'],
    英ALT: [null, '前田', '岡田'],
    音: ['長谷川', '長谷川', '長谷川'],
    美: ['村上', '村上', '村上'],
    体: ['近藤・坂本', '近藤・坂本', '近藤・坂本'],
    技: ['遠藤', '遠藤', null],
    家: ['青木', '青木', null],
    技家: [null, null, '原田'],
    書: ['山田', null, null],
  };
  const HR = { '1-1': '山田', '1-2': '中村', '1-3': '吉田', '2-1': '鈴木', '2-2': '小川', '2-3': '山本', '3-1': '高橋', '3-2': '加藤', '3-3': '森' };

  function makeTimetable(classes, daySlots) {
    const free = [];
    for (let wd = 1; wd <= 5; wd++)
      daySlots[wd].forEach((s) => {
        if (s === 'am' || s === 'pm' || s === '7') return;
        if (wd === 1 && s === '3') return;
        if (wd === 5 && (s === '5' || s === '6')) return;
        free.push(`${wd}|${s}`);
      });
    const teacherOf = (cid, sj) => {
      if (sj === '探') return [HR[cid]];
      const g = Number(cid[0]);
      const t = T[sj] && T[sj][g - 1];
      return t ? t.split('・') : [];
    };
    for (let seed = 1; seed < 400; seed++) {
      const r = rng(seed * 7919);
      const cells = {};
      const busy = {}; // slot -> Set(先生)
      const mark = (slot, names) => names.forEach((n) => (busy[slot] = busy[slot] || new Set()).add(n));
      const isBusy = (slot, names) => names.some((n) => busy[slot] && busy[slot].has(n));
      const left = {};
      classes.forEach((c) => (left[c.id] = Object.assign({}, COUNTS[c.g])));
      let ok = true;
      // 体育は学年そろって同じ時間（先生は学年をまたいで同じなので、学年どうしはずらす）
      for (const g of [1, 2, 3]) {
        const ids = classes.filter((c) => c.g === g).map((c) => c.id);
        const cand = shuffle(free, r).filter((sl) => !isBusy(sl, teacherOf(ids[0], '体')));
        const days = new Set();
        const pick = [];
        for (const sl of cand) {
          const wd = sl.split('|')[0];
          if (days.has(wd)) continue;
          pick.push(sl);
          days.add(wd);
          if (pick.length === 3) break;
        }
        if (pick.length < 3) ok = false;
        pick.forEach((sl) => {
          ids.forEach((id) => {
            cells[`${sl}|${id}`] = '体';
            left[id].体--;
          });
          mark(sl, teacherOf(ids[0], '体'));
        });
      }
      if (!ok) continue;
      // のこりを、先生が重ならないように埋める
      for (const sl of shuffle(free, r)) {
        const wd = sl.split('|')[0];
        for (const c of shuffle(classes, r)) {
          if (cells[`${sl}|${c.id}`]) continue;
          const today = free.filter((x) => x.split('|')[0] === wd).map((x) => cells[`${x}|${c.id}`]);
          const opts = Object.entries(left[c.id])
            .filter(([sj, n]) => n > 0 && !isBusy(sl, teacherOf(c.id, sj)))
            .sort((a, b) => b[1] - a[1] + (today.includes(a[0]) ? 2 : 0) - (today.includes(b[0]) ? 2 : 0) + (r() - 0.5) * 0.5);
          if (!opts.length) {
            ok = false;
            break;
          }
          const sj = opts[0][0];
          cells[`${sl}|${c.id}`] = sj;
          left[c.id][sj]--;
          mark(sl, teacherOf(c.id, sj));
        }
        if (!ok) break;
      }
      if (ok) return { cells, teacherOf };
    }
    return null;
  }

  DD.make = (year) => {
    const st = m.blank(year);
    st.school.name = '見本中学校';
    st.opt.printDate = true;
    const tt = makeTimetable(st.classes, st.daySlots);
    const base = { cells: {}, staff: { '2|5': '④運営委員会', '2|7': '⑥1年会議', '3|2': '①教育相談', '4|2': '①2年会議', '4|6': '⑤3年会議' } };
    for (let wd = 1; wd <= 5; wd++)
      st.daySlots[wd].forEach((s) =>
        st.classes.forEach((c) => {
          const k = `${wd}|${s}|${c.id}`;
          if (s === 'am') base.cells[k] = { t: '読書', m: `am${wd}g${c.g}` };
          else if (s === 'pm') base.cells[k] = { t: 'C' };
          else if (s === '7') base.cells[k] = { t: '学' };
          else if (wd === 1 && s === '3') base.cells[k] = { t: '道' };
          else if (wd === 5 && (s === '5' || s === '6')) base.cells[k] = { t: '総' };
          else if (tt) base.cells[k] = { t: tt.cells[`${wd}|${s}|${c.id}`] || '' };
        })
      );
    // 後期は、技術と家庭の時間を入れかえた形
    const late = u.clone(base);
    Object.values(late.cells).forEach((x) => {
      if (x.t === '技') x.t = '家';
      else if (x.t === '家') x.t = '技';
    });
    st.bases = { t1: u.clone(base), t2: u.clone(base), t3: late, t4: u.clone(late) };
    // 担当表
    if (tt)
      st.classes.forEach((c) => {
        Object.keys(T).forEach((sj) => {
          const n = tt.teacherOf(c.id, sj);
          if (n.length) st.teach[`${c.id}|${sj}`] = n.join('・');
        });
        ['道', '学', '総', '探'].forEach((sj) => (st.teach[`${c.id}|${sj}`] = HR[c.id]));
      });
    // 計画時数（標準授業時数）
    const STD = { 国: [140, 140, 105], 社: [105, 105, 140], 数: [140, 105, 140], 理: [105, 140, 140], 英: [140, 140, 140], 音: [45, 35, 35], 美: [45, 35, 35], 体: [105, 105, 105], 技家: [70, 70, 35], 道: [35, 35, 35], 総: [50, 70, 70], 学: [35, 35, 35] };
    [1, 2, 3].forEach((g) => {
      st.targets[g] = {};
      Object.entries(STD).forEach(([k, v]) => (st.targets[g][k] = v[g - 1]));
    });
    // 行事（見本）
    const t1 = st.terms[0].start;
    const t3 = st.terms[2].start;
    const ev = (o) => st.events.push(Object.assign({ id: u.uid(), kind: 'event', targets: ['all'], inYear: true, inMonth: true, countAs: '行事' }, o));
    ev({ date: t1, title: '始業式', from: '1', to: '2' });
    ev({ date: u.add(t1, 1), title: '入学式', targets: ['g1'], from: 'all', noText: false });
    ev({ date: u.add(t1, 22), title: '体育大会', from: 'all' });
    ev({ date: st.terms[1].start, title: '始業式', from: '1', to: '2' });
    ev({ date: u.add(st.terms[1].start, 9), title: '文化祭', from: 'all' });
    ev({ date: t3, title: '後期始業式', from: '1' });
    st.events.push({ id: u.uid(), kind: 'staff', date: u.add(t3, 1), title: '職員会議', from: '7', targets: ['all'], inYear: false, inMonth: true });
    ev({ date: u.add(t3, 9), title: '避難訓練', from: '5', place: '運動場' });
    ev({ date: u.add(t3, 16), title: '中間考査', from: 'all', noText: false, countAs: '' });
    ev({ date: st.terms[1].end, title: '前期終業式', from: '6' });
    // 少しだけ過去の週の変更（時数の「学年内の差」が見えるように）
    const mon0 = u.monday(u.add(t3, 7));
    const put = (d, s, c, t) => (st.ovr[`${d}|${s}|${c}`] = { t, mk: 'o' });
    put(u.add(mon0, 1), '2', '1-2', '自習');
    put(u.add(mon0, 2), '4', '1-2', '自習');
    put(u.add(mon0, 3), '1', '2-3', '自習');
    st.savedAt = new Date().toISOString();
    return st;
  };

  // デモで使う週（後期の、平日がぜんぶ授業日で行事のない週）
  DD.week = () => {
    const t3 = m.st.terms[2];
    let mon = u.monday(u.add(t3.start, 14));
    for (let k = 0; k < 10; k++, mon = u.add(mon, 7)) {
      const ok = [0, 1, 2, 3, 4].every((i) => {
        const day = m.day(u.add(mon, i));
        return day.school && !day.events.some((e) => e.kind !== 'staff');
      });
      if (ok) return mon;
    }
    return u.monday(u.add(t3.start, 14));
  };
})();

/* ---- js/demo.js ---- */
/* 操作デモ：「やりたいこと」のタグを押すと、見本の学校で、実際の画面の上でカーソルが動いて操作を見せる。
   デモの間は保存しない（試し箱）。終わったら、元のデータ・元の画面に戻る。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const D = (K.demo = {});
  D.speed = Number(localStorage.getItem('kyomu-demo-speed') || 1); // 1＝ふつう、1.6＝ゆっくり、0.55＝はやく
  let R = null; // いま流れているデモ

  class Stop extends Error {}

  /* ---------- 画面の部品 ---------- */
  function layer() {
    let el = u.$('#demo-layer');
    if (el) return el;
    el = u.h(`<div id="demo-layer">
      <div class="dm-block"></div>
      <div class="dm-ring"></div>
      <div class="dm-ghost"></div>
      <div class="dm-cursor"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="dm-click"></span></div>
      <div class="dm-card" role="status" aria-live="polite">
        <div class="dm-tag"></div>
        <div class="dm-text"></div>
        <div class="dm-foot">
          <span class="dm-prog"></span>
          <span style="flex:1"></span>
          <button data-dm="pause">一時停止</button>
          <select data-dm="speed" title="速さ"><option value="1.6">ゆっくり</option><option value="1">ふつう</option><option value="0.55">はやく</option></select>
          <button data-dm="stop">やめる</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(el);
    el.querySelector('[data-dm="speed"]').value = String(D.speed);
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-dm]');
      if (!b || !R) return;
      if (b.dataset.dm === 'pause') {
        R.paused = !R.paused;
        b.textContent = R.paused ? '再生' : '一時停止';
      }
      if (b.dataset.dm === 'stop') D.stop();
      if (b.dataset.dm === 'again') D.play(R.id);
      if (b.dataset.dm === 'others') {
        D.stop();
        D.panel();
      }
      if (b.dataset.dm === 'next' && R.next) D.play(R.next);
    });
    el.querySelector('[data-dm="speed"]').addEventListener('change', (e) => {
      D.speed = Number(e.target.value);
      localStorage.setItem('kyomu-demo-speed', D.speed);
    });
    return el;
  }

  /* ---------- 動かす道具 ---------- */
  const H = {};
  H.sleep = async (ms) => {
    const end = Date.now() + ms * D.speed;
    while (Date.now() < end || (R && R.paused)) {
      if (!R || R.stopped) throw new Stop();
      await new Promise((r) => setTimeout(r, 40));
    }
    if (!R || R.stopped) throw new Stop();
  };
  H.read = (text) => H.sleep(1400 + String(text).length * 55);

  // 要素を待って探す（セレクタか、要素を返す関数）
  H.find = async (target, ms) => {
    const end = Date.now() + (ms || 5000);
    for (;;) {
      if (!R || R.stopped) throw new Stop();
      const el = typeof target === 'function' ? target() : u.$(target);
      if (el && el.getClientRects().length) return el;
      if (Date.now() > end) throw new Error('デモの相手が見つかりませんでした：' + (typeof target === 'string' ? target : '（コマ）'));
      await new Promise((r) => setTimeout(r, 60));
    }
  };

  function inView(el) {
    const r = el.getBoundingClientRect();
    return r.top >= 60 && r.bottom <= window.innerHeight - 150 && r.left >= 0 && r.right <= window.innerWidth;
  }
  H.show = async (el) => {
    if (!inView(el)) {
      el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: D.speed < 0.2 ? 'auto' : 'smooth' });
      await H.sleep(450);
    }
  };

  let cx = window.innerWidth / 2;
  let cy = window.innerHeight / 2;
  function placeCursor(x, y, dur) {
    const c = u.$('#demo-layer .dm-cursor');
    c.style.transitionDuration = `${Math.max(0, dur)}ms`;
    c.style.transform = `translate(${x - 4}px, ${y - 3}px)`;
    cx = x;
    cy = y;
  }
  function ring(el) {
    const rg = u.$('#demo-layer .dm-ring');
    if (!el) {
      rg.style.opacity = 0;
      return;
    }
    const r = el.getBoundingClientRect();
    rg.style.opacity = 1;
    rg.style.left = `${r.left - 4}px`;
    rg.style.top = `${r.top - 4}px`;
    rg.style.width = `${r.width + 8}px`;
    rg.style.height = `${r.height + 8}px`;
    // 説明の札が、光らせたところに重ならないように
    const card = u.$('#demo-layer .dm-card');
    card.classList.toggle('top', r.top + r.height / 2 > window.innerHeight * 0.55);
  }
  H.move = async (el) => {
    await H.show(el);
    const r = el.getBoundingClientRect();
    const x = r.left + Math.min(r.width / 2, r.width - 6);
    const y = r.top + Math.min(r.height / 2, 14);
    const dist = Math.hypot(x - cx, y - cy);
    const dur = Math.min(900, 250 + dist * 0.7) * D.speed;
    placeCursor(x, y, dur);
    ring(el);
    await H.sleep(Math.min(900, 250 + dist * 0.7) + 120);
    return el;
  };
  const pulse = async () => {
    const c = u.$('#demo-layer .dm-click');
    c.classList.remove('go');
    void c.offsetWidth;
    c.classList.add('go');
    await H.sleep(260);
  };
  H.click = async (target, opts) => {
    const el = await H.move(await H.find(target));
    await pulse();
    const o = opts || {};
    if (el.matches('input[type=checkbox],input[type=radio],button,a,label') && !o.shift && !o.ctrl) el.click();
    else el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window, shiftKey: !!o.shift, ctrlKey: !!o.ctrl }));
    await H.sleep(o.wait != null ? o.wait : 380);
    return el;
  };
  H.select = async (target, value) => {
    const el = await H.move(await H.find(target));
    await pulse();
    el.value = value;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
    await H.sleep(380);
    return el;
  };
  H.type = async (target, text, opts) => {
    const el = await H.move(await H.find(target));
    await pulse();
    el.focus();
    if (!opts || opts.clear !== false) el.value = '';
    for (const ch of String(text)) {
      el.value += ch;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      await H.sleep(ch === '\n' ? 160 : 55);
    }
    el.dispatchEvent(new Event('change', { bubbles: true }));
    await H.sleep(250);
    return el;
  };
  H.setDate = async (target, value) => H.select(target, value);
  // ドラッグ（つかんで運んで、落とす）
  H.drag = async (from, to) => {
    const a = await H.move(await H.find(from));
    const ghost = u.$('#demo-layer .dm-ghost');
    ghost.textContent = (a.textContent || '').trim() || '空き';
    const ra = a.getBoundingClientRect();
    ghost.style.transitionDuration = '0ms';
    ghost.style.transform = `translate(${ra.left + ra.width / 2 - 14}px, ${ra.top + ra.height / 2 - 12}px)`;
    ghost.style.opacity = 1;
    u.$('#demo-layer .dm-cursor').classList.add('grab');
    const dt = typeof DataTransfer === 'function' ? new DataTransfer() : null;
    a.dispatchEvent(new DragEvent('dragstart', { bubbles: true, cancelable: true, dataTransfer: dt }));
    await H.sleep(250);
    const b = await H.find(to);
    await H.show(b);
    const rb = b.getBoundingClientRect();
    const dur = 900 * D.speed;
    ghost.style.transitionDuration = `${dur}ms`;
    ghost.style.transform = `translate(${rb.left + rb.width / 2 - 14}px, ${rb.top + rb.height / 2 - 12}px)`;
    placeCursor(rb.left + rb.width / 2, rb.top + rb.height / 2, dur);
    ring(b);
    await H.sleep(950);
    b.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dt }));
    await H.sleep(150);
    b.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
    a.dispatchEvent(new DragEvent('dragend', { bubbles: true, dataTransfer: dt }));
    ghost.style.opacity = 0;
    u.$('#demo-layer .dm-cursor').classList.remove('grab');
    await H.sleep(450);
  };
  // 説明を出して、読む時間だけ待つ
  H.say = async (text, opts) => {
    const t = u.$('#demo-layer .dm-text');
    t.innerHTML = u.esc(text).replace(/「([^」]+)」/g, '「<b>$1</b>」');
    R.n++;
    u.$('#demo-layer .dm-prog').textContent = `${Math.min(R.n, R.total)} / ${R.total}`;
    if (!opts || !opts.nowait) await H.read(text);
  };
  H.point = async (target, text) => {
    const el = await H.move(await H.find(target));
    if (text) await H.say(text);
    return el;
  };
  H.go = async (view, ...p) => {
    ring(null);
    K.app.go(view, ...p);
    await H.sleep(500);
    window.scrollTo(0, 0);
  };
  H.okModal = async () => {
    const btns = u.$$('.modal-back .modal [data-ok]');
    if (btns.length) await H.click(() => btns[btns.length - 1]);
  };
  H.closeModals = () => u.$$('.modal-back').forEach((x) => x.remove());
  H.text = async (target) => ((await H.find(target)).textContent || '').trim();

  /* ---------- 見本の週のコマを指す ---------- */
  const W = {};
  W.day = (i) => u.add(W.mon, i);
  // 週のシートのコマ（i：月=0…金=4、s：校時、c：クラス）
  W.cell = (i, s, c) => () => u.$$(`#main .xs td.c[data-d="${W.day(i)}"][data-s="${s}"]`).find((td) => td.dataset.c.split(',').includes(c));
  W.stLine = (i, s) => () => {
    const lay = m.day(W.day(i)).layout;
    return u.$(`#main .xs td.st[data-d="${W.day(i)}"][data-r="${lay.indexOf(s) + 1}"]`);
  };
  W.evLine = (i, r) => () => u.$(`#main .xs td.ev[data-d="${W.day(i)}"][data-r="${r}"]`);
  W.baseCell = (wd, s, c) => () => u.$$(`#main .xs td.c[data-wd="${wd}"][data-s="${s}"]`).find((td) => td.dataset.c.split(',').includes(c));
  W.subj = (i, s, c) => m.cell(W.day(i), s, c).t;
  // 入れ替えの相手：同じクラスで、ちがう教科・ふつうの授業のコマ（道・総・学などはさける）
  W.partner = (i0, s0, c, fromDay) => {
    const t0 = W.subj(i0, s0, c);
    const fixed = ['道', '総', '学', 'C', '読書', ''];
    for (let i = fromDay == null ? i0 + 1 : fromDay; i < 5; i++)
      for (const s of ['4', '2', '5', '3', '1', '6']) {
        const t = W.subj(i, s, c);
        if (t !== t0 && !fixed.includes(t) && !(i === i0 && s === s0)) return { i, s };
      }
    return { i: Math.min(4, i0 + 1), s: '4' };
  };
  const WDN = (i) => u.WD[u.dow(W.day(i))];

  /* ---------- デモの台本（やりたいこと） ---------- */
  const S = [];
  // 説明の数（進み具合の表示用）は、台本の中の say と、文つきの point を数える
  const countSteps = (fn) => {
    const src = fn.toString();
    return (src.match(/h\.say\(/g) || []).length + (src.match(/h\.point\([^;]*?,\s*[`'"]/g) || []).length;
  };
  const add = (group, id, title, desc, steps) => S.push({ group, id, title, desc, steps, total: countSteps(steps) });

    H.closeModals();
  });

  add('印刷・保存', 'backup', 'バックアップしたい・別のパソコンに移したい', 'JSON に書き出す・戻す', async (h) => {
    await h.point('[data-top="backup"]', '入力した内容は、このブラウザに自動で保存されています。もしものために「バックアップ」でファイルにも残しておきます（週に1回くらい）。');
    await h.say('はじめて押したときに保存先のフォルダ（OneDrive など）を選んでおくと、次からはボタン一つで、そのフォルダのファイルに上書き保存されます。');
    await h.go('settings');
    if (u.$('#main [data-act="bk-choose"]')) await h.point('#main [data-act="bk-choose"]', '保存先のフォルダは、ここで変えたり、そのフォルダのバックアップから戻したりできます。日付つきのファイルも残す設定もあります。');
    await h.point('#main label.btn:has([data-restore])', '別のパソコンでは「バックアップから戻す」でそのファイルを読みこめば、同じ状態になります。');
  });

  // 通しで見る
  const TOUR = ['swap', 'event', 'set', 'hours', 'print'];

  /* ---------- 印刷はデモの中では見本を見せる ---------- */
  function preview(pages, land) {
    const md = u.modal(`<h3>印刷の見本</h3><div class="dm-preview ${land ? 'land' : ''}">${pages.join('')}</div><div class="btns"><button class="btn" data-close>閉じる</button></div>`, { wide: true, noFocus: true });
    K.sheet.fitPages(md.el);
  }

  /* ---------- 流す・止める ---------- */
  D.active = () => !!R;
  D.play = async (id, chain) => {
    const sc = S.find((x) => x.id === id);
    if (!sc) return;
    if (R) {
      R.stopped = true;
      await new Promise((r) => setTimeout(r, 80));
    }
    const first = !K.store.inSandbox();
    if (first) D.origHash = location.hash;
    H.closeModals();
    K.store.sandbox(true);
    K.store.load2(K.demoData.make(m.st.school.year || u.fy(u.today())));
    W.mon = K.demoData.week();
    const el = layer();
    el.classList.add('on');
    document.body.classList.add('demo-on');
    el.querySelector('.dm-tag').textContent = `▶ ${sc.title}`;
    el.querySelector('.dm-foot').classList.remove('done');
    el.querySelector('[data-dm="pause"]').textContent = '一時停止';
    if (K.views.week.resetUi) K.views.week.resetUi();
    const me = (R = { id, n: 0, total: sc.total, paused: false, stopped: false, chain: chain || null });
    try {
      await sc.steps(H);
      if (me !== R) return;
      const next = chain && chain.length ? chain[0] : null;
      R.next = next;
      ring(null);
      el.querySelector('.dm-text').innerHTML = next ? 'つづきを流します…' : 'デモはここまでです。このまま見本の学校を<b>さわってみてもOK</b>（保存されません）。「閉じる」で元のデータに戻ります。';
      R.n = R.total;
      el.querySelector('.dm-prog').textContent = '';
      if (next) {
        await H.sleep(1200);
        return D.play(next, chain.slice(1));
      }
      done(el);
    } catch (e) {
      if (me !== R) return;
      if (!(e instanceof Stop)) {
        console.warn(e);
        el.querySelector('.dm-text').textContent = 'デモをうまく進められませんでした。画面の大きさを変えて、もう一度ためしてください。';
        done(el);
      }
    }
  };
  function done(el) {
    if (R) R.done = true;
    const foot = el.querySelector('.dm-foot');
    foot.classList.add('done');
    foot.innerHTML = `<span class="dm-prog"></span><span style="flex:1"></span><button data-dm="again">もう一度</button><button data-dm="others">ほかのデモ</button><button data-dm="stop" class="pri">閉じる</button>`;
    u.$('#demo-layer .dm-block').classList.add('off');
  }
  D.stop = () => {
    if (!R) return;
    R.stopped = true;
    R = null;
    const el = u.$('#demo-layer');
    if (el) el.remove();
    document.body.classList.remove('demo-on');
    H.closeModals();
    K.store.sandbox(false);
    if (K.views.week.resetUi) K.views.week.resetUi(true);
    if (D.origHash != null && location.hash !== D.origHash) location.hash = D.origHash;
    else K.app.refresh();
    D.origHash = null;
    u.toast('デモを終わりました。データは元のままです');
    if (K.app.needsWelcome && K.app.needsWelcome()) setTimeout(() => K.app.welcome(), 300);
  };

  // デモ中は、人のキー操作を止める（Esc でデモを終わる）
  window.addEventListener(
    'keydown',
    (e) => {
      if (!R || !e.isTrusted || R.done) return;
      if (e.target.closest && e.target.closest('#demo-layer')) return;
      e.stopPropagation();
      e.preventDefault();
      if (e.key === 'Escape') D.stop();
      if (e.key === ' ') {
        R.paused = !R.paused;
        const b = u.$('#demo-layer [data-dm="pause"]');
        if (b) b.textContent = R.paused ? '再生' : '一時停止';
      }
    },
    true
  );

  /* ---------- やりたいことのタグ ---------- */
  D.list = () => S.map(({ id, group, title, desc }) => ({ id, group, title, desc }));
  D.panel = () => {
    const groups = [...new Set(S.map((x) => x.group))];
    const md = u.modal(
      `<h2>やりたいことから選ぶ</h2>
      <p class="help">タグを押すと、見本の学校（見本中学校）で、実際の画面の上で操作のデモが流れます。<b>あなたのデータは変わりません</b>。とちゅうで「一時停止」「やめる」（Esc）、速さも変えられます。</p>
      <div class="row" style="margin:6px 0 12px"><button class="btn primary" data-demo-tour>▶ 通しで見る（約2〜3分：入れ替え → 行事 → 1コマ変更 → 時数 → 印刷）</button></div>
      ${groups
        .map(
          (g) => `<h3 style="margin-top:10px">${u.esc(g)}</h3><div class="tags">${S.filter((x) => x.group === g)
            .map((x) => `<button class="tag" data-demo="${x.id}" title="${u.esc(x.desc)}"><span class="pl">▶</span>${u.esc(x.title)}<small>${u.esc(x.desc)}</small></button>`)
            .join('')}</div>`
        )
        .join('')}
      <div class="btns"><button class="btn" data-close>閉じる</button></div>`,
      { wide: true, noFocus: true }
    );
    md.el.addEventListener('click', (e) => {
      const t = e.target.closest('[data-demo]');
      if (t) {
        md.close();
        D.play(t.dataset.demo);
      }
      if (e.target.closest('[data-demo-tour]')) {
        md.close();
        D.play(TOUR[0], TOUR.slice(1));
      }
    });
  };

  // 印刷：デモの中では印刷の画面のかわりに見本を出す
  const run0 = K.print.run;
  K.print.run = (pages, land) => (R ? preview(pages, land) : run0(pages, land));
})();

/* ---- js/app.js ---- */
/* アプリの外枠：上のタブ、画面の切りかえ、元に戻す（Ctrl+Z）、はじめて開いたときの案内。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const V = K.views;
  const app = (K.app = {});

  const TABS = [
    ['week', '週行事'],
    ['month', '月行事'],
    ['year', '年間行事'],
    ['hours', '時数'],
    ['base', '基本時間割'],
    ['teachers', '先生'],
    ['settings', '設定・取り込み'],
  ];
  let cur = 'week';
  let params = [];

  function shell() {
    const y = m.st.school.year;
    u.$('#app').innerHTML = `
      <header class="top">
        <div class="brand">教務・時間割<small>R${y - 2018}（${y}年度）</small></div>
        <nav class="tabs">${TABS.map(([k, t]) => `<button data-tab="${k}">${t}</button>`).join('')}</nav>
        <div class="right">
          <span id="save-state"></span>
          <span id="backup-chip"></span>
          <button class="icon demo-btn" data-top="help" title="やりたいことを選ぶと、操作のデモが流れます（キーの ?）">▶ 使い方・デモ</button>
          <button class="icon" data-top="undo" title="元に戻す（Ctrl+Z）">↶ 戻す</button>
          <button class="icon" data-top="redo" title="やり直す（Ctrl+Y）">↷</button>
          <button class="icon" data-top="backup" title="バックアップ（保存先フォルダを決めておくと、ボタン一つで上書き保存）">バックアップ</button>
        </div>
      </header>
      <main id="main"></main>`;
    u.$('.top').addEventListener('click', (e) => {
      const t = e.target.closest('[data-tab]');
      if (t) app.go(t.dataset.tab);
      const b = e.target.closest('[data-top]');
      if (!b) return;
      if (b.dataset.top === 'help') K.demo.panel();
      if (b.dataset.top === 'undo') K.store.undo();
      if (b.dataset.top === 'redo') K.store.redo();
      if (b.dataset.top === 'backup') K.backup.button().then(backupChip);
    });
  }

  function backupChip() {
    const el = u.$('#backup-chip');
    if (!el) return;
    const n = K.store.daysSinceBackup();
    const hasData = Object.keys(m.st.ovr).length || m.st.events.length;
    el.innerHTML = hasData && (n == null || n >= 7) ? `<span class="chip warn" title="ブラウザのデータが消えると戻せません">${n == null ? 'まだバックアップしていません' : `バックアップ：${n}日前`}</span>` : '';
  }

  function render() {
    u.$$('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === cur));
    const v = V[cur];
    const main = u.$('#main');
    if (!v) {
      main.innerHTML = '<div class="view">準備中</div>';
      return;
    }
    const y = window.scrollY;
    if (v.open && !render.same) v.open(params);
    v.render(main, params);
    if (render.same) window.scrollTo(0, y);
    document.title = `${v.title}｜教務・時間割`;
    backupChip();
  }

  app.go = (view, ...p) => {
    const h = '#' + [view, ...p].filter(Boolean).join('/');
    if (location.hash !== h) location.hash = h;
    else route();
  };
  function route() {
    const [v, ...p] = location.hash.replace(/^#/, '').split('/');
    cur = V[v] ? v : 'week';
    params = p.map(decodeURIComponent);
    render.same = false;
    render();
  }
  app.refresh = () => {
    render.same = true;
    render();
    render.same = false;
  };

  app.welcome = () => welcome();
  app.needsWelcome = () => !m.st.savedAt && !m.st.events.length && !Object.keys(m.st.ovr).length;
  function welcome() {
    const md = u.modal(
      `<h2>教務・時間割へようこそ</h2>
      <p>このページは、<b>このパソコンのブラウザの中だけ</b>で動きます。入力した内容はどこにも送られません（インターネットにつながっていなくても使えます）。</p>
      <p class="help">ブラウザの「閲覧データの削除」をすると消えるので、上の「バックアップ」でときどき JSON ファイルに書き出してください。</p>
      <div class="card" style="margin-top:12px">
        <h3>はじめ方</h3>
        <div class="row" style="gap:10px">
          <button class="btn" data-w="demo">▶ まず操作のデモを見る</button>
          <button class="btn primary" data-w="import">今の Excel（週行事）から取り込む</button>
          <button class="btn" data-w="restore">バックアップ（JSON）から戻す</button>
          <button class="btn" data-w="blank">空の状態から始める</button>
        </div>
      </div>`,
      { wide: false }
    );
    md.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-w]');
      if (!b) return;
      md.close();
      if (b.dataset.w === 'demo') K.demo.panel();
      if (b.dataset.w === 'import') app.go('settings', 'import');
      if (b.dataset.w === 'restore') app.go('settings');
      if (b.dataset.w === 'blank') {
        K.store.commit('はじめる', (st) => (st.savedAt = new Date().toISOString()));
        app.go('base', 't1');
      }
    });
  }

  app.start = () => {
    const had = K.store.load();
    shell();
    K.store.on(() => {
      if (render.lock) return;
      app.refresh();
    });
    window.addEventListener('hashchange', route);
    document.addEventListener('keydown', (e) => {
      const mod = e.ctrlKey || e.metaKey;
      const inField = e.target.closest && e.target.closest('input,textarea,select');
      if (mod && !inField && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) K.store.redo();
        else K.store.undo();
        return;
      }
      if (mod && !inField && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        K.store.redo();
        return;
      }
      if (u.$('.modal-back')) return;
      if (e.key === '?' && !inField) {
        e.preventDefault();
        return K.demo.panel();
      }
      const v = V[cur];
      if (v && v.key) v.key(e);
    });
    window.addEventListener('beforeunload', () => K.store.status(''));
    route();
    K.store.status(had ? '保存済み' : '');
    if (!had) welcome();
  };

  document.addEventListener('DOMContentLoaded', app.start);
})();

</script>
</body>
