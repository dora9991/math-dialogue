<body>
<div id="app"></div>
<div id="print-area"></div>
<script>
/* ---- js/util.js ---- */
/* 共通の小道具：日付・祝日・文字・画面部品。
   どのファイルからも K.u で使う。 */
(function () {
  const K = (window.K = window.K || {});
  const u = (K.u = {});

  /* ---------- 日付（文字列 'YYYY-MM-DD' で扱う） ---------- */
  u.pad = (n) => String(n).padStart(2, '0');
  u.ymd = (d) => `${d.getFullYear()}-${u.pad(d.getMonth() + 1)}-${u.pad(d.getDate())}`;
  u.parse = (s) => {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  };
  u.add = (s, n) => {
    const d = u.parse(s);
    d.setDate(d.getDate() + n);
    return u.ymd(d);
  };
  u.dow = (s) => u.parse(s).getDay(); // 0=日 … 6=土
  u.monday = (s) => u.add(s, -((u.dow(s) + 6) % 7));
  u.today = () => u.ymd(new Date());
  u.WD = ['日', '月', '火', '水', '木', '金', '土'];
  u.md = (s) => {
    const d = u.parse(s);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  };
  u.mdw = (s) => `${u.md(s)}(${u.WD[u.dow(s)]})`;
  u.month = (s) => u.parse(s).getMonth() + 1;
  u.day = (s) => u.parse(s).getDate();
  u.range = (a, b) => {
    const out = [];
    for (let s = a; s <= b; s = u.add(s, 1)) out.push(s);
    return out;
  };
  // 年度（4月はじまり）
  u.fy = (s) => {
    const d = u.parse(s);
    return d.getMonth() < 3 ? d.getFullYear() - 1 : d.getFullYear();
  };

  /* ---------- 祝日（内閣府の決まりを計算で出す。2000〜2099年） ---------- */
  const hcache = {};
  function nthMonday(y, m, n) {
    const first = new Date(y, m - 1, 1, 12).getDay();
    const day = 1 + ((8 - first) % 7) + (n - 1) * 7;
    return `${y}-${u.pad(m)}-${u.pad(day)}`;
  }
  function holidaysOf(y) {
    if (hcache[y]) return hcache[y];
    const h = {};
    const put = (m, d, name) => (h[`${y}-${u.pad(m)}-${u.pad(d)}`] = name);
    put(1, 1, '元日');
    h[nthMonday(y, 1, 2)] = '成人の日';
    put(2, 11, '建国記念の日');
    if (y >= 2020) put(2, 23, '天皇誕生日');
    const spring = Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
    put(3, spring, '春分の日');
    put(4, 29, '昭和の日');
    put(5, 3, '憲法記念日');
    put(5, 4, 'みどりの日');
    put(5, 5, 'こどもの日');
    if (y === 2020) put(7, 23, '海の日');
    else if (y === 2021) put(7, 22, '海の日');
    else h[nthMonday(y, 7, 3)] = '海の日';
    if (y === 2020) put(8, 10, '山の日');
    else if (y === 2021) put(8, 8, '山の日');
    else put(8, 11, '山の日');
    h[nthMonday(y, 9, 3)] = '敬老の日';
    const autumn = Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
    put(9, autumn, '秋分の日');
    if (y === 2020) put(7, 24, 'スポーツの日');
    else if (y === 2021) put(7, 23, 'スポーツの日');
    else h[nthMonday(y, 10, 2)] = 'スポーツの日';
    put(11, 3, '文化の日');
    put(11, 23, '勤労感謝の日');
    // 振替休日（日曜の祝日 → 次の祝日でない日）
    Object.keys(h).sort().forEach((s) => {
      if (u.dow(s) === 0) {
        let n = u.add(s, 1);
        while (h[n]) n = u.add(n, 1);
        h[n] = '振替休日';
      }
    });
    // 国民の休日（祝日にはさまれた平日）
    Object.keys(h).sort().forEach((s) => {
      const n2 = u.add(s, 2);
      const mid = u.add(s, 1);
      if (h[n2] && !h[mid] && u.dow(mid) !== 0) h[mid] = '国民の休日';
    });
    return (hcache[y] = h);
  }
  u.holiday = (s) => holidaysOf(Number(s.slice(0, 4)))[s] || '';

  /* ---------- 文字 ---------- */
  u.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  u.norm = (s) => String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, ' ').trim();
  u.key = (s) => u.norm(s).replace(/\s/g, '').toUpperCase(); // 突き合わせ用（全角半角・空白を無視）
  u.uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  u.clone = (o) => JSON.parse(JSON.stringify(o));
  u.toZen = (s) => String(s).replace(/[0-9]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0xfee0));
  u.circled = (n) => ('①②③④⑤⑥⑦⑧⑨⑩'[Number(n) - 1] || String(n));

  /* ---------- 画面部品 ---------- */
  u.$ = (sel, root) => (root || document).querySelector(sel);
  u.$$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
  u.h = (html) => {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  u.debounce = (fn, ms) => {
    let t;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };
  u.download = (name, text, type) => {
    const blob = new Blob([text], { type: type || 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
  };
  u.toast = (msg, ms) => {
    let box = u.$('#toast');
    if (!box) {
      box = u.h('<div id="toast" role="status"></div>');
      document.body.appendChild(box);
    }
    box.textContent = msg;
    box.classList.add('show');
    clearTimeout(box._t);
    box._t = setTimeout(() => box.classList.remove('show'), ms || 2600);
  };

  /* モーダル（中身の HTML と、閉じるときの処理） */
  u.modal = (html, opts) => {
    const o = opts || {};
    const back = u.h(`<div class="modal-back"><div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`);
    document.body.appendChild(back);
    const close = () => {
      back.remove();
      document.removeEventListener('keydown', onKey);
      if (o.onClose) o.onClose();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') close();
    };
    document.addEventListener('keydown', onKey);
    back.addEventListener('mousedown', (e) => {
      if (e.target === back) close();
    });
    back.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
    const first = back.querySelector('input,select,textarea,button');
    if (first && !o.noFocus) setTimeout(() => first.focus(), 30);
    return { el: back.firstElementChild, close };
  };
  u.confirm = (msg, okLabel) =>
    new Promise((res) => {
      let done = false;
      const m = u.modal(
        `<h3>確認</h3><p class="pre">${u.esc(msg)}</p><div class="btns"><button class="btn" data-close>やめる</button><button class="btn primary" data-ok>${u.esc(okLabel || 'OK')}</button></div>`,
        { onClose: () => !done && res(false) }
      );
      m.el.querySelector('[data-ok]').addEventListener('click', () => {
        done = true;
        m.close();
        res(true);
      });
    });

  // 文字を1つ入れてもらう（ブラウザの prompt の代わり）。やめたら null
  u.ask = (title, def, opts) =>
    new Promise((res) => {
      const o = opts || {};
      let done = false;
      const m = u.modal(
        `<h3>${u.esc(title)}</h3>${o.help ? `<p class="help">${u.esc(o.help)}</p>` : ''}
        ${o.multi ? `<textarea data-ask style="min-height:90px">${u.esc(def || '')}</textarea>` : `<input type="text" data-ask value="${u.esc(def || '')}" style="width:100%">`}
        <div class="btns"><button class="btn" data-close>やめる</button><button class="btn primary" data-ok>${u.esc(o.ok || 'OK')}</button></div>`,
        { onClose: () => !done && res(null) }
      );
      const inp = m.el.querySelector('[data-ask]');
      setTimeout(() => {
        inp.focus();
        if (inp.select) inp.select();
      }, 40);
      const ok = () => {
        done = true;
        const v = inp.value;
        m.close();
        res(v);
      };
      m.el.querySelector('[data-ok]').addEventListener('click', ok);
      if (!o.multi) inp.addEventListener('keydown', (e) => e.key === 'Enter' && ok());
    });

  /* 文字をセルの幅に収める（Excel の「縮小して全体を表示」と同じ考え方） */
  u.fit = (root) => {
    u.$$('.fit', root).forEach((el) => {
      el.style.fontSize = '';
      const box = el.parentElement;
      const w = box.clientWidth - 2;
      if (w <= 0) return;
      let size = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > w && size > 4 && guard++ < 30) {
        size *= 0.92;
        el.style.fontSize = size + 'px';
      }
    });
  };
})();

/* ---- js/model.js ---- */
/* データの形と、そこから「その日・その時間・そのクラスに何が入るか」を決める計算。
   画面のファイルは、ここの関数を通してだけデータを読む。

   決まり（強い順）：
     1. 手で変えたコマ（入れ替え・変更・まとめ）…… ovr
     2. 行事で埋まるコマ（年間行事に「学年・校時」を入れたもの）…… events
     3. 基本時間割（その日が入る期間の時間割。○曜校時ならその曜日の分）…… bases
*/
(function () {
  const K = window.K;
  const u = K.u;
  const m = (K.m = {});

  /* ---------- はじめの形 ---------- */
  const SUBJECTS = [
    ['国', '国語', '国'], ['社', '社会', '社'], ['数', '数学', '数'], ['理', '理科', '理'],
    ['理a', '理科a', '理'], ['理b', '理科b', '理'], ['理c', '理科c', '理'], ['英', '英語', '英'],
    ['英ALT', '英語ALT', '英'], ['音', '音楽', '音'], ['美', '美術', '美'], ['体', '保健体育', '体'],
    ['技', '技術', '技家'], ['家', '家庭', '技家'], ['技家', '技術・家庭', '技家'], ['書', '書写', '書'],
    ['トライ', 'トライ', 'トライ'], ['探', '探究', '探'], ['学', '学級活動', '学'], ['道', '道徳', '道'],
    ['総', '総合的な学習', '総'], ['自習', '自習', '自習'], ['行事', '学校行事', '行事'],
  ];
  const NOT_COUNTED = [['読書', '朝読書'], ['C', 'ショートホームルーム']];
  const JOINT = { 体: 1, 総: 1, 行事: 1 };
  const TERM_NAMES = ['1学期', '2学期前期', '2学期後期', '3学期後期'];

  m.blank = (year) => {
    const y = year || u.fy(u.today());
    const classes = [];
    for (let g = 1; g <= 3; g++) for (let c = 1; c <= 3; c++) classes.push({ id: `${g}-${c}`, g, label: `${u.toZen(g)}・${u.toZen(c)}` });
    const slots = [{ id: 'am', label: 'C', counted: false }];
    for (let i = 1; i <= 7; i++) slots.push({ id: String(i), label: String(i), counted: true });
    slots.push({ id: 'pm', label: 'C', counted: false });
    const six = ['am', '1', '2', '3', '4', '5', '6', 'pm'];
    const terms = [
      [`${y}-04-06`, `${y}-07-17`], [`${y}-08-26`, `${y}-10-09`],
      [`${y}-10-13`, `${y}-12-23`], [`${y + 1}-01-07`, `${y + 1}-03-23`],
    ].map(([start, end], i) => ({ id: 't' + (i + 1), name: TERM_NAMES[i], start, end }));
    const bases = {};
    terms.forEach((t) => (bases[t.id] = { cells: {}, staff: {} }));
    return {
      v: 1,
      school: { name: '', year: y, title: '週　　　週　行　事' },
      classes,
      slots,
      daySlots: { 0: six, 1: six, 2: six, 3: six, 4: ['am', '1', '2', '3', '4', '5', '6', '7'], 5: six, 6: six },
      lunchAfter: '4', // この校時の下に太い線（昼休み）
      subjects: SUBJECTS.map(([code, name, group]) => ({ code, name, group, counted: true, joint: !!JOINT[code] }))
        .concat(NOT_COUNTED.map(([code, name]) => ({ code, name, group: '', counted: false, joint: true }))),
      terms,
      bases,
      events: [],
      ovr: {},
      log: [],
      lines: {},
      memo: {},
      weekMeta: {},
      teach: {},
      targets: {},
      opt: { mark: true, showStaff: true, firstHeaderColor: true, printDate: true, backupDated: false },
      savedAt: '',
      backupAt: '',
    };
  };

  /* 読みこんだデータの形をそろえる（古いバックアップや一部欠けても動くように） */
  m.normalize = (s) => {
    const b = m.blank(s && s.school && s.school.year);
    const st = Object.assign({}, b, s || {});
    st.school = Object.assign({}, b.school, st.school || {});
    st.opt = Object.assign({}, b.opt, st.opt || {});
    ['events', 'log'].forEach((k) => Array.isArray(st[k]) || (st[k] = []));
    ['ovr', 'lines', 'memo', 'weekMeta', 'teach', 'targets', 'bases'].forEach((k) => (st[k] && typeof st[k] === 'object') || (st[k] = {}));
    st.terms.forEach((t) => st.bases[t.id] || (st.bases[t.id] = { cells: {}, staff: {} }));
    Object.values(st.bases).forEach((bs) => {
      bs.cells = bs.cells || {};
      bs.staff = bs.staff || {};
    });
    return st;
  };

  /* ---------- いまのデータ（store.js が入れる） ---------- */
  m.st = null;
  let cache = {};
  m.touch = () => (cache = {}); // データが変わったら計算の控えを捨てる

  const memo = (bucket, key, fn) => {
    const b = cache[bucket] || (cache[bucket] = new Map());
    if (b.has(key)) return b.get(key);
    const v = fn();
    b.set(key, v);
    return v;
  };

  /* ---------- 名簿・校時・教科 ---------- */
  m.cls = (id) => m.st.classes.find((c) => c.id === id);
  m.grades = () => [...new Set(m.st.classes.map((c) => c.g))];
  m.slot = (id) => m.st.slots.find((s) => s.id === id);
  m.slotIndex = (id) => m.st.slots.findIndex((s) => s.id === id);
  m.slotName = (id) => {
    if (id === 'am') return '朝';
    if (id === 'pm') return '帰り';
    const s = m.slot(id);
    return s ? `${s.label}限` : id;
  };
  m.clsName = (id) => id; // 「1-1」の形で書く
  m.subject = (text) => {
    const k = u.key(text);
    if (!k) return null;
    return memo('subj', k, () => m.st.subjects.find((s) => u.key(s.code) === k) || m.st.subjects.find((s) => u.key(s.name) === k) || null);
  };

  /* ---------- 期間・その日の様子 ---------- */
  m.termOf = (d) => m.st.terms.find((t) => t.start && t.end && d >= t.start && d <= t.end) || null;
  m.base = (termId) => m.st.bases[termId] || (m.st.bases[termId] = { cells: {}, staff: {} });

  m.eventsOn = (d) =>
    memo('evOn', d, () =>
      m.st.events
        .filter((e) => e.date && d >= e.date && d <= (e.end && e.end >= e.date ? e.end : e.date))
        .sort((a, b) => (m.slotIndex(a.from) - m.slotIndex(b.from)) || (a.title > b.title ? 1 : -1))
    );

  m.targets = (e, clsId) => {
    const t = e.targets && e.targets.length ? e.targets : ['all'];
    if (t.includes('all')) return true;
    const c = m.cls(clsId);
    return t.includes(clsId) || (c && t.includes('g' + c.g));
  };
  m.targetLabel = (e) => {
    const t = e.targets && e.targets.length ? e.targets : ['all'];
    if (t.includes('all')) return '全校';
    return t.map((x) => (x[0] === 'g' ? `${x.slice(1)}年` : x)).join('・');
  };

  // その日の情報：授業がある日か、どの基本時間割の何曜日を使うか、並ぶ校時
  m.day = (d) =>
    memo('day', d, () => {
      const wd = u.dow(d);
      const evs = m.eventsOn(d);
      const swap = evs.find((e) => e.kind === 'swap');
      const off = evs.find((e) => e.kind === 'holiday');
      const hol = u.holiday(d);
      const term = m.termOf(d);
      const weekday = wd >= 1 && wd <= 5;
      let school = !!term && (weekday || !!swap);
      let offName = '';
      if (school && hol && !swap) {
        school = false;
        offName = hol;
      }
      if (school && off) {
        school = false;
        offName = off.title;
      }
      const baseWd = swap && swap.swapWd != null && swap.swapWd !== '' ? Number(swap.swapWd) : wd;
      const layout = weekday ? m.st.daySlots[wd] : m.st.daySlots[baseWd >= 1 && baseWd <= 5 ? baseWd : 1];
      // 短縮日課など、その日だけ「授業なし」にした校時
      const offSlots = new Set(((m.st.lines[d] || {}).off || []).filter(Boolean));
      evs.filter((e) => e.kind === 'short' && e.upTo).forEach((e) => {
        const lim = m.slotIndex(e.upTo);
        (layout || []).forEach((s) => m.slotIndex(s) > lim && s !== 'pm' && offSlots.add(s));
      });
      return { d, wd, weekday, school, term, baseWd, layout: layout || [], offSlots, hol, offName, swap, events: evs };
    });

  m.eventSlots = (e, layout) => {
    if (!e.from) return [];
    if (e.from === 'all') return layout.slice();
    const a = m.slotIndex(e.from);
    const b = m.slotIndex(e.to || e.from);
    return layout.filter((s) => {
      const i = m.slotIndex(s);
      return i >= Math.min(a, b) && i <= Math.max(a, b);
    });
  };

  /* ---------- コマの中身 ---------- */
  m.ck = (d, s, c) => `${d}|${s}|${c}`;

  // 基本時間割のコマ（曜日 wd・校時 s・クラス c）
  m.baseCell = (termId, wd, s, c) => {
    const b = m.st.bases[termId];
    return (b && b.cells[`${wd}|${s}|${c}`]) || null;
  };

  // 手で変えたものを除いた中身（行事 → 基本）
  m.under = (d, s, c) =>
    memo('under', m.ck(d, s, c), () => {
      const day = m.day(d);
      if (!day.school || day.offSlots.has(s)) return { t: '', m: '', src: 'off' };
      const ev = day.events.find((e) => e.kind === 'event' && e.from && m.targets(e, c) && m.eventSlots(e, day.layout).includes(s));
      if (ev) return ev.noText ? { t: '', m: '', src: 'ev', ev } : { t: ev.short || ev.title, m: 'ev:' + ev.id, src: 'ev', ev };
      let cell = m.baseCell(day.term.id, day.baseWd, s, c);
      if (!cell && day.baseWd !== day.wd && !(m.st.daySlots[day.baseWd] || []).includes(s)) cell = m.baseCell(day.term.id, day.wd, s, c);
      return cell ? { t: cell.t || '', m: cell.m || '', src: 'base' } : { t: '', m: '', src: 'base' };
    });

  // 実際の中身
  m.cell = (d, s, c) =>
    memo('cell', m.ck(d, s, c), () => {
      const under = m.under(d, s, c);
      const o = m.st.ovr[m.ck(d, s, c)];
      if (o && under.src !== 'off') {
        return { t: o.t || '', m: o.m || '', src: 'ovr', mk: o.mk || '', bg: o.bg || '', b: !!o.b, red: !!o.red, under, changed: (o.t || '') !== under.t };
      }
      return Object.assign({}, under, { under, changed: false });
    });

  // 時数として何に数えるか（教科の記号を返す。数えないなら ''）
  m.countCode = (r) => {
    if (r.src === 'off') return '';
    if (r.src === 'ev') return r.ev.countAs || '';
    const sj = m.subject(r.t);
    return sj && sj.counted ? sj.code : '';
  };

  /* ---------- 週 ---------- */
  m.fyStart = () => `${m.st.school.year}-04-01`;
  m.fyEnd = () => `${m.st.school.year + 1}-03-31`;
  // 授業のある週に 1 から番号をふる（夏休みなど授業のない週は飛ばす）
  m.weeks = () =>
    memo('weeks', 'all', () => {
      const out = [];
      let n = 0;
      for (let mon = u.monday(m.fyStart()); mon <= m.fyEnd(); mon = u.add(mon, 7)) {
        const has = u.range(mon, u.add(mon, 6)).some((d) => m.day(d).school);
        out.push({ mon, no: has ? ++n : 0 });
      }
      return out;
    });
  m.weekNo = (mon) => {
    const w = m.weeks().find((x) => x.mon === mon);
    return w ? w.no : 0;
  };

  /* ---------- 時数 ---------- */
  m.countDay = (d, into) => {
    const day = m.day(d);
    if (!day.school) return into;
    day.layout.forEach((s) => {
      const sl = m.slot(s);
      if (!sl) return;
      m.st.classes.forEach((c) => {
        const code = m.countCode(m.cell(d, s, c.id));
        if (!code) return;
        // 朝・帰りの C の行は、ふつうは数えない。ただし授業（教科）を入れたときは数える（自習は数えない）
        if (!sl.counted) {
          const sj = m.subject(code);
          if (!sj || (sj.group || sj.code) === '自習' || code === '行事') return;
        }
        const row = into[c.id] || (into[c.id] = {});
        row[code] = (row[code] || 0) + 1;
      });
    });
    return into;
  };
  m.countRange = (from, to) =>
    memo('count', from + '~' + to, () => {
      const out = {};
      if (from > to) return out;
      u.range(from, to).forEach((d) => m.countDay(d, out));
      return out;
    });
  // 教科のまとまり（理a・理b → 理 など）で足しなおす
  m.byGroup = (counts) => {
    const out = {};
    Object.entries(counts).forEach(([cid, row]) => {
      const o = (out[cid] = {});
      Object.entries(row).forEach(([code, n]) => {
        const sj = m.subject(code);
        const g = (sj && sj.group) || code;
        o[g] = (o[g] || 0) + n;
      });
    });
    return out;
  };
  m.groups = () => [...new Set(m.st.subjects.filter((s) => s.counted).map((s) => s.group || s.code))];
  m.schoolDays = (from, to) => u.range(from, to).filter((d) => m.day(d).school).length;

  /* ---------- 先生 ---------- */
  m.splitNames = (s) => u.norm(s).split(/[、,，・\/／\s]+/).filter(Boolean);
  m.teachersOf = (clsId, text) => {
    const sj = m.subject(text);
    const v = m.st.teach[`${clsId}|${sj ? sj.code : u.norm(text)}`];
    return v ? m.splitNames(v) : [];
  };
  m.allTeachers = () => {
    const set = new Set();
    Object.values(m.st.teach).forEach((v) => m.splitNames(v).forEach((n) => set.add(n)));
    return [...set].sort((a, b) => a.localeCompare(b, 'ja'));
  };
  // 出張・不在（職員の予定に「だれが」を書いたもの）
  m.absent = (d, s) =>
    memo('absent', d + '|' + s, () => {
      const set = new Set();
      const day = m.day(d);
      day.events.forEach((e) => {
        if (e.kind !== 'staff' || !e.who) return;
        const slots = e.from ? m.eventSlots(e, day.layout) : day.layout;
        if (slots.includes(s)) m.splitNames(e.who).forEach((n) => set.add(n));
      });
      return set;
    });
  // その時間に、同じ先生が2つのクラスに入っていないか・不在の先生の授業がないか
  m.issues = (d, s) =>
    memo('issues', d + '|' + s, () => {
      const out = {};
      const day = m.day(d);
      if (!day.school) return out;
      const who = {};
      m.st.classes.forEach((c) => {
        const r = m.cell(d, s, c.id);
        if (!r.t || r.src === 'ev') return;
        m.teachersOf(c.id, r.t).forEach((n) => (who[n] = who[n] || []).push({ c: c.id, r }));
      });
      const add = (cid, msg) => (out[cid] = out[cid] || []).push(msg);
      Object.entries(who).forEach(([n, list]) => {
        if (list.length < 2) return;
        const sameMerge = list.every((x) => x.r.m && x.r.m === list[0].r.m);
        const sj = m.subject(list[0].r.t);
        const joint = sj && sj.joint && list.every((x) => u.key(x.r.t) === u.key(list[0].r.t));
        if (sameMerge || joint) return;
        list.forEach((x) => add(x.c, `${n}先生が同じ時間に ${list.map((y) => y.c).join('・')}`));
      });
      const abs = m.absent(d, s);
      if (abs.size)
        Object.entries(who).forEach(([n, list]) => {
          if (abs.has(n)) list.forEach((x) => add(x.c, `${n}先生は不在（出張など）`));
        });
      return out;
    });

  /* ---------- 記録の文（出張等の欄に出す） ---------- */
  m.dateWord = (d, ref) => (u.month(d) === u.month(ref) && d.slice(0, 4) === ref.slice(0, 4) ? `${u.day(d)}日` : u.md(d));
  m.shortCls = (id) => id;
})();

/* ---- js/store.js ---- */
/* 保存（このブラウザの中だけ）と、元に戻す／やり直す。
   データはどこにも送らない。ブラウザのデータを消すと消えるので、ときどきバックアップ（JSON）を書き出す。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const s = (K.store = {});
  const KEY = 'kyomu-jikanwari-v1';
  const undo = [];
  const redo = [];
  const subs = [];
  let lastJson = '';

  s.load = () => {
    let data = null;
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) {
      console.warn('読みこめませんでした', e);
    }
    m.st = m.normalize(data);
    m.touch();
    lastJson = JSON.stringify(m.st);
    return !!data;
  };

  let sandbox = false;
  // 試し箱（デモ）：この間は保存しない。終わったら元のデータ・元に戻すの履歴をそのまま戻す
  s.sandbox = (on) => {
    if (on) {
      if (sandbox) return;
      // まだ書きこんでいない変更があれば、先に保存しておく
      try {
        if (m.st.savedAt || undo.length) localStorage.setItem(KEY, JSON.stringify(m.st));
      } catch (e) {
        /* 保存できなくてもデモは続ける */
      }
      sandbox = { st: JSON.stringify(m.st), undo: undo.slice(), redo: redo.slice(), lastJson };
      return;
    }
    if (!sandbox) return;
    const x = sandbox;
    sandbox = false;
    m.st = m.normalize(JSON.parse(x.st));
    undo.length = 0;
    undo.push(...x.undo);
    redo.length = 0;
    redo.push(...x.redo);
    lastJson = x.lastJson;
    s.emit('sandbox-end');
  };
  s.inSandbox = () => !!sandbox;
  s.load2 = (data) => {
    // 試し箱の中で、見本のデータに入れかえる（保存しない）
    m.st = m.normalize(data);
    lastJson = JSON.stringify(m.st);
    undo.length = 0;
    redo.length = 0;
    s.emit('sandbox-load');
  };

  const write = u.debounce(() => {
    if (sandbox) return s.status('デモ中（保存しません）');
    try {
      m.st.savedAt = new Date().toISOString();
      lastJson = JSON.stringify(m.st);
      localStorage.setItem(KEY, lastJson);
      s.status('保存しました');
    } catch (e) {
      s.status('保存できませんでした（容量がいっぱい？バックアップを書き出してください）', true);
    }
  }, 250);

  s.status = (msg, bad) => {
    const el = u.$('#save-state');
    if (el) {
      el.textContent = msg;
      el.classList.toggle('bad', !!bad);
    }
  };

  s.on = (fn) => subs.push(fn);
  s.emit = (why) => {
    m.touch();
    subs.forEach((fn) => fn(why));
  };

  // データを変えるときは必ずここを通す（元に戻せるように）
  s.commit = (label, fn) => {
    const before = lastJson || JSON.stringify(m.st);
    const r = fn(m.st);
    const after = JSON.stringify(m.st);
    if (after === before) return r;
    undo.push({ label, json: before });
    if (undo.length > 80) undo.shift();
    redo.length = 0;
    lastJson = after;
    write();
    s.emit(label);
    return r;
  };

  s.undo = () => {
    const x = undo.pop();
    if (!x) return u.toast('戻せる操作はありません');
    redo.push({ label: x.label, json: JSON.stringify(m.st) });
    m.st = m.normalize(JSON.parse(x.json));
    lastJson = x.json;
    write();
    s.emit('undo');
    u.toast(`元に戻しました：${x.label}`);
  };
  s.redo = () => {
    const x = redo.pop();
    if (!x) return u.toast('やり直せる操作はありません');
    undo.push({ label: x.label, json: JSON.stringify(m.st) });
    m.st = m.normalize(JSON.parse(x.json));
    lastJson = x.json;
    write();
    s.emit('redo');
    u.toast(`やり直しました：${x.label}`);
  };
  s.canUndo = () => undo.length > 0;

  // まるごと入れかえ（バックアップから戻す・取り込み）
  s.replace = (data, label) => {
    undo.push({ label: label || '入れかえ', json: JSON.stringify(m.st) });
    redo.length = 0;
    m.st = m.normalize(data);
    lastJson = JSON.stringify(m.st);
    write();
    s.emit('replace');
  };

  // バックアップの中身（書き出した日時も記録する）
  s.backupJson = () => {
    m.st.backupAt = new Date().toISOString();
    const json = JSON.stringify(m.st, null, 1);
    lastJson = JSON.stringify(m.st);
    write();
    return json;
  };
  s.backupName = (dated) => {
    const r = `R${m.st.school.year - 2018}`;
    if (!dated) return `教務時間割_${r}_バックアップ.json`;
    const d = new Date();
    return `教務時間割_${r}_${d.getFullYear()}${u.pad(d.getMonth() + 1)}${u.pad(d.getDate())}.json`;
  };
  s.exportJson = () => u.download(s.backupName(true), s.backupJson());

  s.importJson = (file) =>
    new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const data = JSON.parse(fr.result);
          if (!data || !data.classes || !data.terms) throw new Error('この形式のファイルではありません');
          s.replace(data, 'バックアップから戻す');
          res();
        } catch (e) {
          rej(e);
        }
      };
      fr.onerror = rej;
      fr.readAsText(file);
    });

  s.daysSinceBackup = () => {
    if (!m.st.backupAt) return null;
    return Math.floor((Date.now() - new Date(m.st.backupAt).getTime()) / 86400000);
  };
})();

/* ---- js/backup.js ---- */
/* バックアップを、決めておいたフォルダにボタン一つで上書き保存する。
   ブラウザの「ファイルに直接書きこむ機能」（File System Access API。Edge・Chrome で使える）を使う。
   選んだフォルダは、このブラウザの中（IndexedDB）に覚えておく。フォルダの中身をのぞいたり、ほかのファイルにさわったりはしない。
   使えないブラウザ（Safari・Firefox）では、これまでどおりダウンロードで保存する。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const B = (K.backup = {});
  const DB = 'kyomu-backup';
  let mem = null; // IndexedDB にしまえないとき（テストなど）は、開いている間だけ覚える

  B.supported = () => typeof window.showDirectoryPicker === 'function';

  /* ---------- IndexedDB（フォルダの覚え書き） ---------- */
  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('h');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idb(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('h', mode);
      const req = fn(tx.objectStore('h'));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
  B.folder = async () => {
    if (mem) return mem;
    try {
      return (await idb('readonly', (s) => s.get('dir'))) || null;
    } catch (e) {
      return null;
    }
  };
  async function remember(h) {
    mem = null;
    try {
      await idb('readwrite', (s) => s.put(h, 'dir'));
    } catch (e) {
      mem = h;
    }
  }
  B.forget = async () => {
    mem = null;
    try {
      await idb('readwrite', (s) => s.delete('dir'));
    } catch (e) {
      /* なにもしない */
    }
  };

  // 書きこんでよいか（2回目からは、ブラウザが「このフォルダへの保存を許可しますか」と聞くことがある）
  async function allowed(h) {
    const o = { mode: 'readwrite' };
    if (h.queryPermission && (await h.queryPermission(o)) === 'granted') return true;
    if (h.requestPermission) return (await h.requestPermission(o)) === 'granted';
    return true;
  }

  /* ---------- フォルダを選ぶ・保存する・戻す ---------- */
  B.pick = async () => {
    const h = await window.showDirectoryPicker({ id: 'kyomu-backup', mode: 'readwrite', startIn: 'documents' });
    await remember(h);
    return h;
  };

  async function writeFile(dir, name, text) {
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(new Blob([text], { type: 'application/json' }));
    await w.close();
  }

  // 保存先フォルダに上書き保存（日付つきも残す設定なら、そちらも）
  B.saveToFolder = async (dir) => {
    if (!(await allowed(dir))) throw new Error('フォルダへの保存が許可されませんでした');
    const json = K.store.backupJson();
    const name = K.store.backupName(false);
    await writeFile(dir, name, json);
    if (m.st.opt.backupDated) await writeFile(dir, K.store.backupName(true), json);
    return name;
  };

  B.restoreFromFolder = async () => {
    const dir = await B.folder();
    if (!dir) return u.toast('保存先フォルダがまだ決まっていません');
    try {
      if (!(await allowed(dir))) return u.toast('フォルダを読むことが許可されませんでした');
      const fh = await dir.getFileHandle(K.store.backupName(false));
      const f = await fh.getFile();
      const when = new Date(f.lastModified).toLocaleString('ja-JP');
      if (!(await u.confirm(`保存先フォルダ「${dir.name}」の\n${f.name}（${when} に保存）\nから戻します。いまの内容は、このファイルの内容に置きかわります。`, '戻す'))) return;
      await K.store.importJson(f);
      u.toast('保存先フォルダのバックアップから戻しました');
    } catch (e) {
      u.toast(e && e.name === 'NotFoundError' ? `保存先フォルダに ${K.store.backupName(false)} がありません` : '読みこめませんでした：' + (e.message || e), 5000);
    }
  };

  /* ---------- 上の「バックアップ」ボタン ---------- */
  B.button = async () => {
    if (K.store.inSandbox && K.store.inSandbox()) return u.toast('デモ中はバックアップしません');
    if (!B.supported()) {
      K.store.exportJson();
      return u.toast('ダウンロードの場所に保存しました（このブラウザでは、フォルダへの上書き保存は使えません。Edge か Chrome なら使えます）', 6000);
    }
    const dir = await B.folder();
    if (!dir) return B.setup();
    try {
      const name = await B.saveToFolder(dir);
      u.toast(`「${dir.name}」フォルダに保存しました（${name}）`, 4000);
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      const md = u.modal(`<h3>保存先フォルダに保存できませんでした</h3>
        <p class="pre">${u.esc(e.message || String(e))}</p>
        <p class="help">フォルダの名前を変えたり、消したり、移したりしたときにおこります。フォルダを選びなおすか、今回はダウンロードで保存してください。</p>
        <div class="btns"><button class="btn" data-dl>今回はダウンロードで保存</button><button class="btn primary" data-pick>フォルダを選びなおす</button></div>`);
      md.el.querySelector('[data-dl]').addEventListener('click', () => {
        md.close();
        K.store.exportJson();
      });
      md.el.querySelector('[data-pick]').addEventListener('click', () => {
        md.close();
        B.choose(true);
      });
    }
  };

  // はじめて押したとき：保存先を決めるか、今回はダウンロードか
  B.setup = () => {
    const md = u.modal(`<h3>バックアップの保存先</h3>
      <p>保存先のフォルダを<b>一度だけ</b>選んでおくと、次からは「バックアップ」を押すだけで、そのフォルダの <code>${u.esc(K.store.backupName(false))}</code> に上書き保存します。</p>
      <p class="help">おすすめは、OneDrive や学校の共有フォルダなど、パソコンが壊れても残る場所です。選んだフォルダは、このブラウザが覚えています（中のほかのファイルにはさわりません）。<br>
      2回目からは、ブラウザが「このフォルダへの保存を許可しますか」と聞くことがあります。そのときは「許可」を押してください。</p>
      <div class="btns"><button class="btn" data-dl>今回はダウンロードで保存</button><button class="btn primary" data-pick>保存先のフォルダを選ぶ</button></div>`);
    md.el.querySelector('[data-dl]').addEventListener('click', () => {
      md.close();
      K.store.exportJson();
    });
    md.el.querySelector('[data-pick]').addEventListener('click', () => {
      md.close();
      B.choose(true);
    });
  };

  // フォルダを選ぶ（save：選んだあと、そのまま保存する）
  B.choose = async (save) => {
    try {
      const dir = await B.pick();
      if (save) {
        const name = await B.saveToFolder(dir);
        u.toast(`「${dir.name}」フォルダに保存しました（${name}）。次からはボタン一つで上書きします`, 5000);
      } else u.toast(`保存先を「${dir.name}」フォルダにしました`);
      if (K.app && K.app.refresh) K.app.refresh();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      u.toast('フォルダを選べませんでした：' + (e.message || e), 5000);
    }
  };
})();

/* ---- js/ops.js ---- */
/* 時間割を変える操作：入れ替え・変更・学年（全校）でまとめる・元に戻す。
   週の時間割の操作は、必ず記録（log）を残す。記録の文は「出張等」の欄にも出る。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const ops = (K.ops = {});

  const slotMark = (s) => (s === 'am' ? '朝' : s === 'pm' ? '帰' : u.circled(s));

  // 手で変えた中身を書く（元と同じになったら、手で変えた印を消す）
  function writeOvr(st, d, s, c, t, extra) {
    const key = m.ck(d, s, c);
    const under = m.under(d, s, c);
    const e = extra || {};
    if (t === under.t && !e.m) delete st.ovr[key];
    else st.ovr[key] = Object.assign({ t }, e.m ? { m: e.m } : {}, e.mk ? { mk: e.mk } : {});
  }

  /* ---------- 記録の文 ---------- */
  ops.noteTexts = (en) => {
    if (en.kind === 'swap') {
      const a = en.a;
      const b = en.b;
      if (a.c !== b.c) {
        const t = `${a.c}${a.from}⇄${b.c}${b.from}`;
        return a.d === b.d && a.s === b.s ? [{ d: a.d, s: a.s, text: t }] : [{ d: a.d, s: a.s, text: t }, { d: b.d, s: b.s, text: t }];
      }
      if (a.d === b.d) return [{ d: a.d, s: a.s, text: `${a.c} ${slotMark(a.s)}${a.to}・${slotMark(b.s)}${b.to}入替` }];
      return [
        { d: a.d, s: a.s, text: `${a.c}${a.to}は${m.dateWord(b.d, a.d)}分` },
        { d: b.d, s: b.s, text: `${b.c}${b.to}は${m.dateWord(a.d, b.d)}分` },
      ];
    }
    if (en.kind === 'set') {
      // 同じ日・同じ時間・同じ中身はまとめて1行に（1-1・1-2国は…）
      const groups = {};
      en.cells.forEach((x) => {
        const k = `${x.d}|${x.s}|${x.to}|${x.from}`;
        (groups[k] = groups[k] || []).push(x);
      });
      return Object.values(groups).map((list) => {
        const x = list[0];
        const who = list.map((y) => y.c).join('・');
        let text;
        if (en.why === 'adjust') text = `${who}${x.to}は時間数調整`;
        else if (en.why === 'makeup' && en.src) text = `${who}${x.to}は${m.dateWord(en.src, x.d)}分`;
        else if (en.why === 'self') text = `${who}${x.from || ''}→自習`;
        else if (en.why === 'text') text = en.text || '';
        else if (en.why === 'none') text = '';
        else text = `${who}${x.from || '（空き）'}→${x.to || '（空き）'}`;
        return { d: x.d, s: x.s, text };
      });
    }
    if (en.kind === 'merge') return en.text ? [{ d: en.d, s: en.s, text: en.text }] : [];
    return [];
  };
  ops.entryNotes = (en) => (en.hideNote ? [] : en.notes || ops.noteTexts(en));

  // 記録をひとことで（右の一覧に出す文）
  ops.describe = (en) => {
    const at = (x) => `${u.mdw(x.d)}${slotMark(x.s)}`;
    if (en.kind === 'swap') return `${at(en.a)} ${en.a.c} ${en.a.from || '空き'} ⇄ ${at(en.b)} ${en.b.c} ${en.b.from || '空き'}`;
    if (en.kind === 'set') {
      const x = en.cells[0];
      const who = [...new Set(en.cells.map((y) => y.c))].join('・');
      const more = en.cells.length > 1 && new Set(en.cells.map((y) => y.d + y.s)).size > 1 ? ` ほか${en.cells.length - 1}コマ` : '';
      return `${at(x)} ${who} ${x.from || '空き'} → ${x.to || '空き'}${more}`;
    }
    if (en.kind === 'merge') return `${u.mdw(en.d)}${slotMark(en.s)} ${en.cls.join('・')} を「${en.t}」でまとめる`;
    if (en.kind === 'unmerge') return `${u.mdw(en.d)}${slotMark(en.s)} まとめを解除`;
    return en.kind;
  };
  ops.weekOf = (en) => {
    const d = en.kind === 'swap' ? en.a.d : en.kind === 'set' ? en.cells[0].d : en.d;
    return u.monday(d);
  };
  ops.touches = (en, mon) => {
    const end = u.add(mon, 6);
    const ds = en.kind === 'swap' ? [en.a.d, en.b.d] : en.kind === 'set' ? en.cells.map((x) => x.d) : [en.d];
    return ds.some((d) => d >= mon && d <= end);
  };

  /* ---------- 週の操作 ---------- */
  ops.swap = (a, b) => {
    const ra = m.cell(a.d, a.s, a.c);
    const rb = m.cell(b.d, b.s, b.c);
    return K.store.commit('入れ替え', (st) => {
      writeOvr(st, a.d, a.s, a.c, rb.t, { mk: 'y' });
      writeOvr(st, b.d, b.s, b.c, ra.t, { mk: 'y' });
      const en = { id: u.uid(), ts: Date.now(), kind: 'swap', a: { d: a.d, s: a.s, c: a.c, from: ra.t, to: rb.t }, b: { d: b.d, s: b.s, c: b.c, from: rb.t, to: ra.t } };
      en.notes = ops.noteTexts(en);
      st.log.push(en);
      return en;
    });
  };

  // cells: [{d,s,c}]、opt: {why, src, text, mk}
  ops.set = (cells, t, opt) => {
    const o = opt || {};
    const list = cells.map((x) => ({ d: x.d, s: x.s, c: x.c, from: m.cell(x.d, x.s, x.c).t, to: t }));
    return K.store.commit('授業の変更', (st) => {
      list.forEach((x) => writeOvr(st, x.d, x.s, x.c, t, { mk: o.mk || 'o' }));
      const en = { id: u.uid(), ts: Date.now(), kind: 'set', cells: list, why: o.why || '', src: o.src || '', text: o.text || '' };
      en.notes = ops.noteTexts(en);
      st.log.push(en);
      return en;
    });
  };

  // 学年・全校でまとめる（1くくりの枠にする）
  ops.merge = (d, s, cls, t, opt) => {
    const o = opt || {};
    const key = 'b' + u.uid();
    return K.store.commit('まとめる', (st) => {
      cls.forEach((c) => (st.ovr[m.ck(d, s, c)] = { t, m: key }));
      const en = { id: u.uid(), ts: Date.now(), kind: 'merge', d, s, cls: cls.slice(), t, text: o.text || '' };
      en.notes = ops.noteTexts(en);
      st.log.push(en);
    });
  };
  ops.unmerge = (d, s, cls) =>
    K.store.commit('まとめを解除', (st) => {
      cls.forEach((c) => {
        const key = m.ck(d, s, c);
        const o = st.ovr[key];
        const under = m.under(d, s, c);
        if (o) {
          if ((o.t || '') === under.t && !o.mk) delete st.ovr[key];
          else st.ovr[key] = { t: o.t || '', mk: o.mk || '' };
        } else if (under.m) {
          st.ovr[key] = { t: under.t };
        }
      });
    });

  // コマの色（黄・橙・青・緑・なし）
  ops.mark = (cells, mk) =>
    K.store.commit('色をつける', (st) => {
      cells.forEach((x) => {
        const key = m.ck(x.d, x.s, x.c);
        const r = m.cell(x.d, x.s, x.c);
        const o = st.ovr[key] || { t: r.t, m: r.m };
        if (mk) o.mk = mk;
        else ['mk', 'bg', 'b', 'red'].forEach((k) => delete o[k]);
        if (!o.mk && !o.m && !o.bg && !o.b && !o.red && (o.t || '') === m.under(x.d, x.s, x.c).t) delete st.ovr[key];
        else st.ovr[key] = o;
      });
    });

  // 基本の時間割に戻す
  ops.reset = (cells) =>
    K.store.commit('基本に戻す', (st) => {
      cells.forEach((x) => delete st.ovr[m.ck(x.d, x.s, x.c)]);
    });

  // 記録を取り消す（変更そのものを戻す）
  ops.revert = (id) => {
    const en = m.st.log.find((x) => x.id === id);
    if (!en) return false;
    const cells = en.kind === 'swap' ? [en.a, en.b] : en.kind === 'set' ? en.cells : [];
    const moved = cells.filter((x) => m.cell(x.d, x.s, x.c).t !== x.to);
    if (moved.length) {
      u.toast('そのあと同じコマがさらに変わっているので、自動では戻せません。記録だけ消すか、手で直してください。', 5000);
      return false;
    }
    K.store.commit('記録を取り消す', (st) => {
      cells.forEach((x) => writeOvr(st, x.d, x.s, x.c, x.from, {}));
      if (en.kind === 'merge') en.cls.forEach((c) => delete st.ovr[m.ck(en.d, en.s, c)]);
      st.log = st.log.filter((x) => x.id !== id);
    });
    return true;
  };
  ops.dropLog = (id) =>
    K.store.commit('記録を消す', (st) => {
      st.log = st.log.filter((x) => x.id !== id);
    });
  ops.editNote = (id, notes) =>
    K.store.commit('記録の文を直す', (st) => {
      const en = st.log.find((x) => x.id === id);
      if (en) en.notes = notes;
    });

  /* ---------- 基本時間割の操作 ---------- */
  ops.baseSet = (termId, cells, t) =>
    K.store.commit('基本時間割を変える', (st) => {
      const b = m.base(termId);
      cells.forEach((x) => {
        const k = `${x.wd}|${x.s}|${x.c}`;
        if (!t) delete b.cells[k];
        else b.cells[k] = { t };
      });
    });
  ops.baseSwap = (termId, a, b) =>
    K.store.commit('基本時間割の入れ替え', (st) => {
      const bs = m.base(termId);
      const ka = `${a.wd}|${a.s}|${a.c}`;
      const kb = `${b.wd}|${b.s}|${b.c}`;
      const va = bs.cells[ka] ? { t: bs.cells[ka].t } : null;
      const vb = bs.cells[kb] ? { t: bs.cells[kb].t } : null;
      if (vb && vb.t) bs.cells[ka] = vb;
      else delete bs.cells[ka];
      if (va && va.t) bs.cells[kb] = va;
      else delete bs.cells[kb];
    });
  ops.baseMerge = (termId, wd, s, cls, t) =>
    K.store.commit('基本時間割でまとめる', (st) => {
      const key = 'b' + u.uid();
      const b = m.base(termId);
      cls.forEach((c) => (b.cells[`${wd}|${s}|${c}`] = { t, m: key }));
    });
  ops.baseUnmerge = (termId, wd, s, cls) =>
    K.store.commit('基本時間割のまとめを解除', (st) => {
      const b = m.base(termId);
      cls.forEach((c) => {
        const x = b.cells[`${wd}|${s}|${c}`];
        if (x) delete x.m;
      });
    });
})();

/* ---- js/sheet.js ---- */
/* Excel の「週行事」シートと同じ見た目の表をつくる（画面でも印刷でも同じものを使う）。
   列：日｜行事｜校時｜クラス×9｜出張等。1週＝A4縦1枚。
   列幅・行の高さは、もとの Excel（列幅 3.75 / 29.625 / 2.5 / 3.5×9 / 25.875、行 15.75pt など）から写した。 */
(function () {
  const K = window.K;
  const u = K.u;
  const m = K.m;
  const sh = (K.sheet = {});
  sh.lastSrc = {};

  // 列幅（px・96dpi で Excel と同じ）
  sh.W = { date: 30, ev: 237, slot: 20, cls: 28, staff: 207 };
  // 行の高さ（pt）
  const H = { title: 18.75, head: 18, chead: 10.5, slot: 15.75, gap: 10.5, we: 15, weSmall: 11.25 };
  const MARK = { y: 'mk-y', o: 'mk-o', b: 'mk-b', g: 'mk-g', p: 'mk-p' };
  const GRADE_BG = ['', 'g-green', 'g-yellow', 'g-green', 'g-yellow', 'g-green', 'g-yellow'];

  const esc = u.esc;
  const fcls = (col, r) => {
    const f = (col.fmt && col.fmt[r]) || {};
    return (f.b ? ' b' : '') + (f.red ? ' red' : '') + (f.big ? ' big' : '');
  };
  const fit = (t, cls) => `<span class="fit${cls ? ' ' + cls : ''}">${esc(t).replace(/\n/g, '<br>')}</span>`;

  /* ---------- 行事・出張等の欄に、文を行ごとに並べる ---------- */
  // fixed：{行番号: 文}（手で書いた行）、items：[{row, text}]（自動で入れる文。row は入れたい行）
  sh.place = (R, fixed, items, start) => {
    const out = new Array(R).fill('');
    const own = new Array(R).fill(false);
    const fmt = Array.from({ length: R }, () => ({}));
    const src = Array.from({ length: R }, () => []);
    Object.entries(fixed || {}).forEach(([r, v]) => {
      const i = Number(r);
      const t = v && typeof v === 'object' ? v.t : v;
      if (i < R && t) {
        out[i] = t;
        own[i] = true;
        if (v && typeof v === 'object') fmt[i] = { b: !!v.b, red: !!v.red, big: !!v.big };
        src[i].push({ own: true, text: t });
      }
    });
    const first = start == null ? 1 : start;
    (items || []).forEach((it) => {
      if (!it.text) return;
      // 同じ文をすでに手で書いた行があれば、二重に出さない
      const same = out.findIndex((x, k) => own[k] && u.norm(x) === u.norm(it.text));
      if (same >= 0) {
        src[same].push(it);
        return;
      }
      // 改行のある文は、次の行へ続けて書く（Excel でセルの中で改行していたもの）
      const parts = String(it.text).split('\n').filter(Boolean);
      let want = it.row == null ? first : Math.max(0, Math.min(R - 1, it.row));
      let i = want;
      while (i < R && out[i]) i++;
      if (i >= R) {
        i = want;
        while (i >= 0 && out[i]) i--;
      }
      if (i < 0) {
        i = Math.max(0, Math.min(R - 1, want));
        out[i] = out[i] ? `${out[i]}、${parts.join(' ')}` : parts.join(' ');
        src[i].push(it);
        return;
      }
      out[i] = parts[0];
      fmt[i] = { b: !!it.b, red: !!it.red, big: !!it.big };
      src[i].push(it);
      let k = i;
      for (let p = 1; p < parts.length; p++) {
        if (k + 1 < R && !out[k + 1]) {
          k++;
          out[k] = parts[p];
          fmt[k] = fmt[i];
          src[k].push(it);
        } else out[k] += ' ' + parts[p];
      }
    });
    return { lines: out, own, src, fmt };
  };

  const rowOfSlot = (layout, s) => {
    const i = layout.indexOf(s);
    return i < 0 ? null : i + 1;
  };

  // その日の「行事」欄の文
  sh.evItems = (d, layout) => {
    const day = m.day(d);
    const items = [];
    if (day.hol) items.push({ row: null, text: day.hol, hol: true });
    day.events.forEach((e) => {
      if (e.kind === 'staff' || e.inWeek === false) return;
      let text = e.title;
      if (e.place) text += `（${e.place}）`;
      if (e.end && e.end > e.date && d === e.date) text += `～${m.dateWord(e.end, d)}`;
      const row = e.row != null ? e.row : e.from && e.from !== 'all' ? rowOfSlot(layout, e.from) : null;
      items.push({ row, text, ev: e.id, b: e.bold, red: e.red, big: e.big });
    });
    return items;
  };
  // その日の「出張等」欄の文（定例の会議・職員の予定・時間割の変更の記録）
  sh.stItems = (d, layout) => {
    const day = m.day(d);
    const items = [];
    if (day.school && day.term && day.weekday) {
      const bs = m.st.bases[day.term.id];
      if (bs)
        Object.entries(bs.staff).forEach(([k, t]) => {
          const [wd, r] = k.split('|');
          if (Number(wd) === day.wd && t) items.push({ row: Number(r), text: t, base: true });
        });
    }
    day.events.forEach((e) => {
      if (e.kind !== 'staff') return;
      const text = e.who && !e.title.includes(e.who) ? `${e.title} ${e.who}` : e.title;
      const row = e.row != null ? e.row : e.from && e.from !== 'all' ? rowOfSlot(layout, e.from) : null;
      items.push({ row, text, ev: e.id, b: e.bold, red: e.red });
    });
    m.st.log.forEach((en) => {
      K.ops.entryNotes(en).forEach((n) => {
        if (n.d === d && n.text) items.push({ row: rowOfSlot(layout, n.s), text: n.text, log: en.id });
      });
    });
    return items;
  };

  /* ---------- 罫線 ---------- */
  // 辺ごとに T（細線）か h（極細線）か無し
  const B = (l, r, t, b) => `${l ? 'l' + l : ''} ${r ? 'r' + r : ''} ${t ? 't' + t : ''} ${b ? 'b' + b : ''}`.trim();

  /* ---------- 1日ぶん（平日の形） ---------- */
  // ctx: {d, wd, layout, first, dateParts[], ev{lines,own}, st{lines,own}, get(s,c) → 表示用, key(s,c), lineKey(kind,row)}
  function dayBlock(ctx, o) {
    const cls = m.st.classes;
    const n = cls.length;
    const R = ctx.layout.length + 1;
    // コマのまとまり：横（同じ結合・同じ文字）と、縦（下の行が同じ結合で文字が空＝続き）
    const groups = ctx.layout.map((s) => {
      const row = cls.map((c) => ctx.get(s, c.id));
      const out = [];
      let i = 0;
      while (i < n) {
        const v = row[i];
        let j = i + 1;
        if (v.m)
          while (j < n && row[j].m === v.m && row[j].t === v.t) j++;
        out.push({ i, j, v, rs: 1, covered: false });
        i = j;
      }
      return out;
    });
    groups.forEach((gs, r) =>
      gs.forEach((g) => {
        if (!g.v.m || g.covered) return;
        for (let k = r + 1; k < groups.length; k++) {
          const h = groups[k].find((x) => x.i === g.i && x.j === g.j && x.v.m === g.v.m && !x.v.t && !x.covered);
          if (!h) break;
          h.covered = true;
          g.rs++;
        }
      })
    );
    let html = '';
    for (let r = 0; r < R; r++) {
      const last = r === R - 1;
      const top = r === 0;
      const s = top ? null : ctx.layout[r - 1];
      const ht = top ? H.chead : H.slot;
      const lunch = s && s === m.st.lunchAfter;
      const rowB = last || lunch ? 'T' : 'h';
      html += `<tr style="height:${ht}pt">`;
      // 日付
      const dp = ctx.dateParts[r] || '';
      html += `<td class="dt ${B('T', 'T', top ? 'T' : '', last ? 'T' : '')}">${dp ? fit(dp) : ''}</td>`;
      // 行事
      const evT = ctx.ev.lines[r] || '';
      html += `<td class="ev ${B('T', 'T', top ? 'T' : '', last ? 'T' : '')}${ctx.ev.own[r] ? ' own' : ''}${fcls(ctx.ev, r)}" ${ctx.lineAttr('ev', r)}>${evT ? fit(evT) : ''}</td>`;
      // 校時
      if (top) html += `<td class="sl ${B('h', 'T', 'T', 'h')}"></td>`;
      else {
        const sl = m.slot(s);
        const smk = ctx.slotMark ? ctx.slotMark(s) : '';
        const sbg = smk && o.mark ? (smk[0] === '#' ? ` style="background:${smk}"` : '') : '';
        const offS = ctx.slotOff ? ctx.slotOff(s) : false;
        html += `<td class="sl ${B('h', 'T', '', rowB)}${smk && o.mark && smk[0] !== '#' ? ' sk-' + smk : ''}"${sbg} ${ctx.slotAttr ? ctx.slotAttr(s) : ''}>${offS ? '' : fit(sl ? sl.label : s)}</td>`;
      }
      // クラス
      if (top) {
        cls.forEach((c, i) => {
          const edge = i === cls.length - 1 || cls[i + 1].g !== c.g;
          const bg = ctx.first && o.firstHeaderColor ? GRADE_BG[c.g] || '' : '';
          html += `<td class="ch ${bg} ${B(i === 0 ? 'T' : '', edge ? 'T' : 'h', 'T', 'h')}">${fit(c.label)}</td>`;
        });
      } else {
        groups[r - 1].forEach((g) => {
          if (g.covered) return;
          const { i, j, v } = g;
          const span = j - i;
          const lastC = cls[j - 1];
          const edge = j === n || cls[j].g !== lastC.g;
          const endS = ctx.layout[r - 2 + g.rs];
          const endB = r - 1 + g.rs === R - 1 || endS === m.st.lunchAfter ? 'T' : 'h';
          // 色：アプリでつけた印（mk）か、Excel から取りこんだ色（bg・太字・赤字）
          const mk = v.mk && o.mark ? MARK[v.mk] || '' : '';
          const look = o.mark && !mk ? `${v.b ? ' b' : ''}${v.red ? ' red' : ''}` : '';
          const bg = o.mark && !mk && v.bg ? ` style="background:${v.bg}"` : '';
          const extra = ctx.cellClass ? ctx.cellClass(s, cls.slice(i, j), v) : '';
          html += `<td class="c ${B(i === 0 ? 'T' : '', edge ? 'T' : 'h', '', endB)} ${mk}${look} ${extra}"${bg}${span > 1 ? ` colspan="${span}"` : ''}${g.rs > 1 ? ` rowspan="${g.rs}"` : ''} ${ctx.cellAttr(s, cls.slice(i, j))}>${v.t ? fit(v.t) : ''}</td>`;
        });
      }
      // 出張等
      if (o.staff) {
        const stT = ctx.st.lines[r] || '';
        html += `<td class="st ${B('T', 'T', top ? 'T' : '', last ? 'T' : '')}${ctx.st.own[r] ? ' own' : ''}${fcls(ctx.st, r)}" ${ctx.lineAttr('st', r)}>${stT ? fit(stT) : ''}</td>`;
      }
      html += '</tr>';
    }
    return html;
  }

  /* ---------- 土日（授業なしの形） ---------- */
  function weekendBlock(ctx, o) {
    const n = m.st.classes.length;
    const heights = ctx.wd === 6 ? [H.we, H.we, H.we, H.we, H.weSmall, H.weSmall] : [H.we, H.we, H.we, H.we];
    const R = heights.length;
    let html = `<tr style="height:${H.gap}pt"><td colspan="${n + 3 + (o.staff ? 1 : 0)}" class="gap"></td></tr>`;
    for (let r = 0; r < R; r++) {
      const top = r === 0;
      const last = r === R - 1;
      html += `<tr style="height:${heights[r]}pt">`;
      const dp = ctx.dateParts[r] || '';
      html += `<td class="dt ${B('T', 'T', top ? 'T' : '', last ? 'T' : '')}">${dp ? fit(dp) : ''}</td>`;
      const evT = ctx.ev.lines[r] || '';
      html += `<td class="ev ${B('T', 'T', top ? 'T' : '', last ? 'T' : '')}${ctx.ev.own[r] ? ' own' : ''}${fcls(ctx.ev, r)}" ${ctx.lineAttr('ev', r)}>${evT ? fit(evT) : ''}</td>`;
      if (top) html += `<td class="we ${B('T', 'T', 'T', 'T')}" colspan="${n + 1}" rowspan="${R}"></td>`;
      if (o.staff) {
        const stT = ctx.st.lines[r] || '';
        html += `<td class="st ${B('T', 'T', top ? 'T' : '', last ? 'T' : '')}${ctx.st.own[r] ? ' own' : ''}${fcls(ctx.st, r)}" ${ctx.lineAttr('st', r)}>${stT ? fit(stT) : ''}</td>`;
      }
      html += '</tr>';
    }
    return html;
  }

  /* ---------- 見出し（第○週 週行事／学校名／日・行事・時間割・出張等） ---------- */
  function headRows(t, o) {
    const n = m.st.classes.length;
    let html = `<tr class="ttl" style="height:${H.title}pt">`;
    html += `<td class="t-dai">${t.no != null ? '第' : ''}</td>`;
    html += `<td class="t-main" colspan="1"><span class="t-no">${esc(t.no == null ? '' : t.no || '')}</span><span class="t-txt">${esc(t.text)}</span>${t.label ? `<span class="t-label">${esc(t.label)}</span>` : ''}${t.stamp ? `<span class="t-stamp">${esc(t.stamp)}</span>` : ''}</td>`;
    html += `<td class="t-school bT" colspan="${n + 1}">${fit(t.school || '')}</td>`;
    if (o.staff) html += `<td class="t-date">${o.printDate && t.date ? fit(t.date) : ''}</td>`;
    html += '</tr>';
    html += `<tr class="hd" style="height:${H.head}pt">`;
    html += `<td class="${B('T', 'T', 'T', 'T')} hc">日</td>`;
    html += `<td class="${B('T', '', 'T', 'T')} hc">行　　　　事</td>`;
    html += `<td class="${B('T', 'T', 'T', 'T')} hc" colspan="${n + 1}">時　　間　　割</td>`;
    if (o.staff) html += `<td class="${B('T', 'T', 'T', 'T')} hc">出　　　張　　　等</td>`;
    html += '</tr>';
    return html;
  }

  function colgroup(o) {
    const W = sh.W;
    let html = `<colgroup><col style="width:${W.date}px"><col style="width:${W.ev}px"><col style="width:${W.slot}px">`;
    m.st.classes.forEach(() => (html += `<col style="width:${W.cls}px">`));
    if (o.staff) html += `<col style="width:${W.staff}px">`;
    return html + '</colgroup>';
  }
  sh.tableWidth = (o) => sh.W.date + sh.W.ev + sh.W.slot + sh.W.cls * m.st.classes.length + (o.staff ? sh.W.staff : 0);

  // 日付を縦に（月・／・日・曜）
  function dateParts(d, R, weekend) {
    const p = new Array(R).fill('');
    if (!d) return p;
    if (weekend) {
      p[0] = String(u.month(d));
      p[1] = '／';
      p[2] = String(u.day(d));
      p[3] = u.WD[u.dow(d)];
    } else {
      p[Math.min(2, R - 1)] = String(u.month(d));
      p[Math.min(3, R - 1)] = '／';
      p[Math.min(4, R - 1)] = String(u.day(d));
      p[Math.min(6, R - 1)] = u.WD[u.dow(d)];
    }
    return p;
  }

  /* ---------- 週のシート ---------- */
  // o: {staff, mark, firstHeaderColor, printDate, hooks:{cellClass, cellAttr, lineAttr}}
  sh.week = (mon, opts) => {
    const o = Object.assign({ staff: true, mark: true, firstHeaderColor: true, printDate: true }, m.st.opt, opts || {});
    const hk = o.hooks || {};
    const meta = m.st.weekMeta[mon] || {};
    const no = m.weekNo(mon);
    const now = new Date();
    const t = {
      no: no || '',
      text: m.st.school.title || '週　　　週　行　事',
      label: meta.label || '',
      stamp: o.noStamp ? '' : meta.stamp || '',
      school: m.st.school.name,
      date: `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${u.pad(now.getMinutes())}`,
    };
    let body = headRows(t, o);
    let first = true;
    sh.lastSrc = {};
    for (let i = 0; i < 7; i++) {
      const d = u.add(mon, i);
      const day = m.day(d);
      const full = i < 5 || day.school;
      const layout = full ? day.layout : [];
      const R = full ? layout.length + 1 : i === 5 ? 6 : 4;
      const lines = m.st.lines[d] || {};
      const ev = sh.place(R, lines.ev, sh.evItems(d, layout));
      const st = sh.place(R, lines.st, sh.stItems(d, layout));
      sh.lastSrc[d] = { ev: ev.src, st: st.src };
      const ctx = {
        d,
        wd: day.wd,
        layout,
        first,
        dateParts: dateParts(d, R, !full),
        ev,
        st,
        get: (s, c) => {
          const r = m.cell(d, s, c);
          return r;
        },
        cellClass: hk.cellClass ? (s, cs, v) => hk.cellClass(d, s, cs, v) : null,
        cellAttr: (s, cs) => (hk.cellAttr ? hk.cellAttr(d, s, cs) : ''),
        lineAttr: (kind, r) => (hk.lineAttr ? hk.lineAttr(kind, d, r) : ''),
        slotMark: (s) => (lines.sl || {})[s] || '',
        slotOff: (s) => day.offSlots.has(s),
        slotAttr: (s) => (hk.slotAttr ? hk.slotAttr(d, s) : ''),
      };
      body += full ? dayBlock(ctx, o) : weekendBlock(ctx, o);
      if (full) first = false;
    }
    const table = `<table class="xs" style="width:${sh.tableWidth(o)}px">${colgroup(o)}<tbody>${body}</tbody></table>`;
    return `<div class="sheetwrap" style="width:${sh.tableWidth(o)}px">${table}${sh.boxes(meta.boxes || [], body, o)}</div>`;
  };

  /* ---------- 図形（確定版の四角・お知らせの吹き出し）：Excel の行・列の位置に置く ---------- */
  sh.boxes = (boxes, body, o) => {
    if (!boxes.length) return '';
    const rowsPx = [...body.matchAll(/<tr[^>]*style="height:([\d.]+)pt"/g)].map((x) => (Number(x[1]) * 4) / 3);
    const Y = (r, off) => {
      let y = 0;
      for (let i = 0; i < r && i < rowsPx.length; i++) y += rowsPx[i];
      return y + off / 9525;
    };
    const widths = [sh.W.date, 26, sh.W.ev - 26, sh.W.slot].concat(m.st.classes.map(() => sh.W.cls)).concat(o.staff ? [sh.W.staff] : []);
    const X = (c, off) => {
      let x = 0;
      for (let i = 0; i < c; i++) x += widths[i] != null ? widths[i] : 64;
      return x + off / 9525;
    };
    const maxX = widths.reduce((a, b) => a + b, 0);
    return boxes
      .filter((b) => X(b.c0, b.co0) < maxX - 4)
      .map((b) => {
        const left = X(b.c0, b.co0);
        const top = Y(b.r0, b.ro0);
        const w = Math.max(20, Math.min(maxX, X(b.c1, b.co1)) - left);
        const h = Math.max(12, Y(b.r1, b.ro1) - top);
        const jc = b.anchor === 'ctr' ? 'center' : b.anchor === 'b' ? 'flex-end' : 'flex-start';
        return `<div class="bx${b.shape === 'round' ? ' round' : ''}" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;background:${b.fill || 'transparent'};border:${b.lw || 1}px solid ${b.line || 'transparent'};color:${b.color || '#000'};font-size:${b.size || 10.5}pt;${b.bold ? 'font-weight:bold;' : ''}justify-content:${jc};text-align:${b.align || 'left'}"><div>${esc(b.text).replace(/\n/g, '<br>')}</div></div>`;
      })
      .join('');
  };

  /* ---------- 基本時間割のシート（日付なし） ---------- */
  sh.base = (termId, opts) => {
    const o = Object.assign({ staff: true, mark: false, firstHeaderColor: true, printDate: false }, opts || {});
    const hk = o.hooks || {};
    const term = m.st.terms.find((x) => x.id === termId);
    const bs = m.base(termId);
    const t = { no: null, text: `基本時間割　${term ? term.name : ''}`, label: term && term.start ? `（${u.md(term.start)}～${u.md(term.end)}）` : '', school: m.st.school.name };
    let body = headRows(t, o);
    for (let wd = 1; wd <= 5; wd++) {
      const layout = m.st.daySlots[wd] || [];
      const R = layout.length + 1;
      const fixed = {};
      Object.entries(bs.staff).forEach(([k, v]) => {
        const [w, r] = k.split('|');
        if (Number(w) === wd) fixed[r] = v;
      });
      const parts = new Array(R).fill('');
      parts[Math.min(4, R - 1)] = u.WD[wd];
      const ctx = {
        d: null,
        wd,
        layout,
        first: wd === 1,
        dateParts: parts,
        ev: { lines: new Array(R).fill(''), own: [] },
        st: sh.place(R, fixed, []),
        get: (s, c) => {
          const x = bs.cells[`${wd}|${s}|${c}`];
          return { t: (x && x.t) || '', m: (x && x.m) || '' };
        },
        cellClass: hk.cellClass ? (s, cs, v) => hk.cellClass(wd, s, cs, v) : null,
        cellAttr: (s, cs) => (hk.cellAttr ? hk.cellAttr(wd, s, cs) : ''),
        lineAttr: (kind, r) => (hk.lineAttr ? hk.lineAttr(kind, wd, r) : ''),
      };
      body += dayBlock(ctx, o);
    }
    return `<table class="xs" style="width:${sh.tableWidth(o)}px">${colgroup(o)}<tbody>${body}</tbody></table>`;
  };

  /* ---------- A4 の紙にのせて、はみ出さないように縮める ---------- */
  sh.page = (tableHtml, cls) => `<div class="page ${cls || ''}"><div class="fitbox">${tableHtml}</div></div>`;
  sh.fitPages = (root) => {
    u.$$('.page', root).forEach((pg) => {
      const box = pg.querySelector('.fitbox');
      const tb = box && box.firstElementChild;
      if (!tb) return;
      box.style.zoom = '';
      u.fit(box);
      // 画面（操作するところ）では縮めない：線がにじまないように。紙に合わせて縮めるのは印刷のときだけ
      if (pg.closest('#app')) return;
      const cs = getComputedStyle(pg);
      const aw = pg.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const ah = pg.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const z = Math.min(1, aw / tb.offsetWidth, ah / tb.offsetHeight);
      box.style.zoom = String(Math.floor(z * 1000) / 1000);
    });
  };
})();

/* ---- js/xlsx.js ---- */
/* Excel（.xlsx）を、ブラウザの中だけで読む小さな読み取り器。
   外の部品は使わない（ZIP をほどくのはブラウザに入っている DecompressionStream）。
   読むのは「文字・数字」「結合セル」「塗りの色」だけ。数式は計算結果（保存されている値）を使う。 */
(function () {
  const K = (window.K = window.K || {});
  const X = (K.xlsx = {});

  /* ---------- ZIP ---------- */
  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function readZip(buf) {
    const dv = new DataView(buf);
    const u8 = new Uint8Array(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65600); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) {
        eocd = i;
        break;
      }
    }
    if (eocd < 0) throw new Error('Excel のファイルとして読めませんでした（.xlsx ですか？）');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const entries = {};
    const dec = new TextDecoder();
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true);
      const elen = dv.getUint16(p + 30, true);
      const clen = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      entries[name] = { method, csize, off };
      p += 46 + nlen + elen + clen;
    }
    return {
      names: Object.keys(entries),
      has: (n) => !!entries[n],
      async text(n) {
        const e = entries[n];
        if (!e) return '';
        const ln = dv.getUint16(e.off + 26, true);
        const le = dv.getUint16(e.off + 28, true);
        const start = e.off + 30 + ln + le;
        const raw = u8.subarray(start, start + e.csize);
        const out = e.method === 0 ? raw : await inflateRaw(raw);
        return dec.decode(out);
      },
    };
  }

  /* ---------- XML の小道具 ---------- */
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  const unxml = (s) =>
    s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g, (_, e) =>
      e[0] === '#' ? String.fromCodePoint(e[1] === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10)) : ENT[e]
    );
  const attrs = (s) => {
    const o = {};
    s.replace(/([\w:]+)="([^"]*)"/g, (_, k, v) => (o[k] = unxml(v)));
    return o;
  };
  X.colNum = (letters) => {
    let n = 0;
    for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n;
  };
  X.colName = (n) => {
    let s = '';
    while (n > 0) {
      const r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  };
  const ref = (a) => {
    const mm = /^([A-Z]+)(\d+)$/.exec(a);
    return mm ? { c: X.colNum(mm[1]), r: Number(mm[2]) } : null;
  };

  /* ---------- 色（塗り） ---------- */
  const THEME_DEFAULT = ['FFFFFF', '000000', 'E7E6E6', '44546A', '5B9BD5', 'ED7D31', 'A5A5A5', 'FFC000', '4472C4', '70AD47'];
  const INDEXED = { 5: 'FFFF00', 13: 'FFFF00', 6: 'FF00FF', 7: '00FFFF', 22: 'C0C0C0', 26: 'FFFFCC', 27: 'CCFFFF', 41: 'CCFFFF', 42: 'CCFFCC', 43: 'FFFF99', 44: '99CCFF', 45: 'FF99CC', 46: 'CC99FF', 47: 'FFCC99', 51: 'FFCC00', 52: 'FF9900', 50: '99CC00' };
  function tint(hex, t) {
    const v = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const out = v.map((x) => Math.round(t < 0 ? x * (1 + t) : x + (255 - x) * t));
    return out.map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  async function readStyles(zip) {
    const xml = await zip.text('xl/styles.xml');
    const theme = THEME_DEFAULT.slice();
    const th = await zip.text('xl/theme/theme1.xml');
    if (th) {
      const order = ['lt1', 'dk1', 'lt2', 'dk2', 'accent1', 'accent2', 'accent3', 'accent4', 'accent5', 'accent6'];
      order.forEach((nm, i) => {
        const mm = new RegExp(`<a:${nm}>[\\s\\S]*?(?:srgbClr val="([0-9A-Fa-f]{6})"|lastClr="([0-9A-Fa-f]{6})")`).exec(th);
        if (mm) theme[i] = (mm[1] || mm[2]).toUpperCase();
      });
    }
    const fills = [];
    const fs = /<fills[^>]*>([\s\S]*?)<\/fills>/.exec(xml);
    if (fs)
      (fs[1].match(/<fill>[\s\S]*?<\/fill>|<fill\/>/g) || []).forEach((f) => {
        const pt = /patternType="(\w+)"/.exec(f);
        const fg = /<fgColor ([^>]*)\/?>/.exec(f);
        let color = '';
        if (pt && pt[1] === 'solid' && fg) {
          const a = attrs(fg[1]);
          if (a.rgb) color = a.rgb.slice(-6).toUpperCase();
          else if (a.theme != null) color = theme[Number(a.theme)] || '';
          else if (a.indexed != null) color = INDEXED[a.indexed] || '';
          if (color && a.tint) color = tint(color, Number(a.tint));
        }
        fills.push(color);
      });
    // 文字：太字・色
    const fonts = [];
    const fo = /<fonts[^>]*>([\s\S]*?)<\/fonts>/.exec(xml);
    if (fo)
      (fo[1].match(/<font>[\s\S]*?<\/font>|<font\/>/g) || []).forEach((f) => {
        const b = /<b\/>|<b val="1"\/>|<b val="true"\/>/.test(f);
        const cm = /<color ([^>]*)\/>/.exec(f);
        let color = '';
        if (cm) {
          const a = attrs(cm[1]);
          if (a.rgb) color = a.rgb.slice(-6).toUpperCase();
          else if (a.theme != null && Number(a.theme) > 1) color = theme[Number(a.theme)] || '';
          else if (a.indexed === '10') color = 'FF0000';
        }
        const szm = /<sz val="([\d.]+)"\/>/.exec(f);
        fonts.push({ b, color: color === '000000' ? '' : color, sz: szm ? Number(szm[1]) : 11 });
      });
    const xfFill = [];
    const xfFont = [];
    const xs = /<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml);
    if (xs)
      (xs[1].match(/<xf [^>]*>/g) || []).forEach((x) => {
        const a = attrs(x);
        xfFill.push(fills[Number(a.fillId || 0)] || '');
        xfFont.push(fonts[Number(a.fontId || 0)] || { b: false, color: '' });
      });
    return { xfFill, xfFont, theme };
  }

  /* ---------- 本を開く ---------- */
  X.open = async (file) => {
    const buf = file instanceof ArrayBuffer ? file : await file.arrayBuffer();
    const zip = readZip(buf);
    const wb = await zip.text('xl/workbook.xml');
    const rels = await zip.text('xl/_rels/workbook.xml.rels');
    const relMap = {};
    (rels.match(/<Relationship [^>]*>/g) || []).forEach((r) => {
      const a = attrs(r);
      let t = a.Target || '';
      t = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
      relMap[a.Id] = t;
    });
    const sheets = (wb.match(/<sheet [^>]*>/g) || []).map((s) => {
      const a = attrs(s);
      return { name: a.name, path: relMap[a['r:id']], hidden: a.state === 'hidden' || a.state === 'veryHidden' };
    });
    const sst = [];
    const sx = await zip.text('xl/sharedStrings.xml');
    (sx.match(/<si>[\s\S]*?<\/si>/g) || []).forEach((si) => {
      const body = si.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').replace(/<phoneticPr[^>]*\/>/g, '');
      let t = '';
      body.replace(/<t(?: [^>]*)?>([\s\S]*?)<\/t>/g, (_, x) => (t += x));
      sst.push(unxml(t));
    });
    const sty = await readStyles(zip);
    const xfFill = sty.xfFill;
    return {
      sheets,
      // 1 枚のシートを読む（maxRow 行まで）
      async sheet(name, maxRow) {
        const sh = sheets.find((x) => x.name === name);
        if (!sh) throw new Error('シートがありません：' + name);
        const xml = await zip.text(sh.path);
        const cells = new Map();
        const fill = new Map();
        const font = new Map();
        const lim = maxRow || 100;
        const rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
        let mm;
        const sdStart = xml.indexOf('<sheetData');
        rowRe.lastIndex = sdStart < 0 ? 0 : sdStart;
        while ((mm = rowRe.exec(xml))) {
          const ra = attrs(mm[1]);
          const r = Number(ra.r);
          if (r > lim) break;
          if (!mm[2]) continue;
          const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
          let cm;
          while ((cm = cRe.exec(mm[2]))) {
            const a = attrs(cm[1]);
            const p = ref(a.r);
            if (!p) continue;
            const key = p.r + ',' + p.c;
            const f = xfFill[Number(a.s || 0)];
            if (f) fill.set(key, f);
            const ft = sty.xfFont[Number(a.s || 0)];
            if (ft && (ft.b || ft.color || ft.sz >= 11.5)) font.set(key, ft);
            const inner = cm[2] || '';
            let v = null;
            if (a.t === 'inlineStr') {
              let t = '';
              inner.replace(/<t(?: [^>]*)?>([\s\S]*?)<\/t>/g, (_, x) => (t += x));
              v = unxml(t);
            } else {
              const vm = /<v>([\s\S]*?)<\/v>/.exec(inner);
              if (vm) {
                const raw = unxml(vm[1]);
                if (a.t === 's') v = sst[Number(raw)];
                else if (a.t === 'str' || a.t === 'e') v = raw;
                else if (a.t === 'b') v = raw === '1';
                else v = Number(raw);

    let headRow = 0;
    const colId = {};
    for (let r = 1; r <= 70; r++) {
      const cols = [];
      for (let c = 2; c <= 40; c++) {
        const id = classLabel(sh.get(r, c));

    const anchor = all.find((a) => a.x.month && a.x.day && a.wd >= 1);
    if (!anchor) return;
    const base = I.dateOf(fy, anchor.x.month, anchor.x.day);
    const mon = u.add(base, -((u.dow(base) + 6) % 7));
    all.forEach((a) => (a.x.date = u.add(mon, a.wd - 1)));
  };

  /* ---------- シートの種類を見分ける ---------- */
  I.scan = async (book, fileName, fy) => {
    const out = [];
    for (const s of book.sheets) {
      let p = null;
      try {
        p = I.parseSheet(await book.sheet(s.name, 95));
      } catch (e) {
        p = null;
      }
      if (!p || p.filled < 10) continue;
      const era = I.eraYear(s.name);
      const item = { file: fileName, sheet: s.name, parsed: p, era, hidden: s.hidden };
      if (p.hasDates) {
        I.fillDates(p, fy);
        item.kind = 'week';
        item.mon = u.monday(p.days.find((d) => d.date).date);
        item.weekNo = p.weekNo;
        item.use = (era == null || era === fy) && !/\(\d\)$/.test(s.name.trim());
      } else {
        item.kind = 'base';
        item.use = false;
      }
      out.push(item);
    }
    // 同じファイルに「R8の…」があれば、年度の書いていないシート（去年の残りなど）は最初は外しておく
    if (out.some((x) => x.era === fy)) out.forEach((x) => x.kind === 'week' && x.era == null && (x.use = false));
    return out;
  };

  // 基本の候補を、名前から期間に当てる（前期 → 1学期・2学期前期、後期 → 2学期後期・3学期後期）
  I.guessTerms = (name) => {
    const t = m.st.terms;
    if (/前期/.test(name)) return t.filter((x) => /1学期|前期/.test(x.name)).map((x) => x.id);
    if (/後期/.test(name)) return t.filter((x) => /後期/.test(x.name)).map((x) => x.id);
    return [];
  };

  /* ---------- 色 → このアプリの印 ---------- */
  const PALETTE = { y: 'FFFF00', o: 'FFC000', b: 'B4C6E7', g: 'E2EFDA', p: 'F8CBAD' };
  I.markOf = (hex) => {
    if (!hex || hex === 'FFFFFF') return '';
    const v = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
    let best = '';
    let bd = 1e9;
    Object.entries(PALETTE).forEach(([k, h]) => {
      const w = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
      const dist = (v[0] - w[0]) ** 2 + (v[1] - w[1]) ** 2 + (v[2] - w[2]) ** 2;
      if (dist < bd) {
        bd = dist;
        best = k;
      }
    });
    return best;
  };

  /* ---------- データに入れる ---------- */
  // picks: [{item, terms:[termId]}]（基本） と [{item}]（週）。opts: {events:true, marks:true, staff:true}
  I.apply = (st, bases, weeks, opts) => {
    const o = Object.assign({ events: true, marks: true, school: true }, opts || {});
    const fy = st.school.year;
    const report = { bases: 0, weeks: 0, overrides: 0, events: 0, holidays: 0, lines: 0 };

    // クラス（Excel の並びに合わせる）
    const any = bases[0] || weeks[0];
    if (any) {
      const ids = any.item.parsed.classes;
      st.classes = ids.map((id) => {
        const [g, c] = id.split('-').map(Number);
        return { id, g, label: `${u.toZen(g)}・${u.toZen(c)}` };
      });
      if (o.school && any.item.parsed.school && !st.school.name) st.school.name = any.item.parsed.school;
    }

    // 教科（Excel の一覧にあって、まだないもの）
    const subjNames = new Set();
    [...bases, ...weeks].forEach((x) => x.item.parsed.subjects.forEach((s) => subjNames.add(s)));
    subjNames.forEach((code) => {
      if (!st.subjects.some((s) => u.key(s.code) === u.key(code)))
        st.subjects.push({ code, name: code, group: code === 'C' || code === 'Ｃ' ? '' : code, counted: !/^[CＣ]$/.test(code), joint: false });
    });

    // 曜日ごとの校時の並び（基本のシートから）
    const layoutFrom = (p) => {
      p.days.slice(0, 5).forEach((d, i) => {
        const lay = d.rows.filter((x) => x.slot).map((x) => x.slot);
        if (lay.length) st.daySlots[i + 1] = lay;
      });
    };

    // 基本時間割
    bases.forEach(({ item, terms }) => {
      const p = item.parsed;
      layoutFrom(p);
      (terms || []).forEach((tid) => {
        const b = (st.bases[tid] = { cells: {}, staff: {} });
        p.days.slice(0, 5).forEach((d, i) => {
          const wd = i + 1;
          d.rows.forEach((x) => {
            if (x.st) b.staff[`${wd}|${x.i}`] = x.st;
            if (!x.slot) return;
            Object.entries(x.vals).forEach(([cid, v]) => {
              if (v.t) b.cells[`${wd}|${x.slot}|${cid}`] = v.m ? { t: v.t, m: v.m } : { t: v.t };
            });
          });
        });
        report.bases++;
      });
    });

    // 週：まず日付と中身を集める
    const dayData = {};
    weeks.forEach(({ item }) => {
      const p = item.parsed;
      I.fillDates(p, fy);
      p.days.forEach((d) => d.date && (dayData[d.date] = { d, item }));
      p.weekend.forEach((w) => {
        if (!w.date) return;
        // 土曜授業など：時間割の行があれば、平日と同じように中身を入れる
        const d = w.slotRows && w.slotRows.length ? { wd: w.wd, rows: w.slotRows, weekend: true } : null;
        dayData[w.date] = d ? { w, d, item } : { w, item };
      });
      const mon = item.mon;
      const meta = (st.weekMeta[mon] = Object.assign({}, st.weekMeta[mon]));
      if (p.label) meta.label = p.label;
      if (p.boxes && p.boxes.length) meta.boxes = p.boxes;
    });

    // 期間の日付を、週のシートに授業がある日から決めなおす
    m.st = st;
    m.touch();
    const orig = st.terms.map((t) => ({ id: t.id, start: t.start, end: t.end }));
    const dist = (d, t) => (d >= t.start && d <= t.end ? 0 : Math.min(Math.abs(u.parse(d) - u.parse(t.start)), Math.abs(u.parse(d) - u.parse(t.end))));
    const assigned = {};
    Object.entries(dayData).forEach(([date, x]) => {
      if (!x.d) return;
      const cells = x.d.rows.filter((r) => r.slot && r.slot !== 'am' && r.slot !== 'pm');
      const filled = cells.reduce((a, r) => a + Object.values(r.vals).filter((v) => v.t || v.m).length, 0);
      const hasText = x.d.rows.some((r) => r.ev && !/休|振替|記念日/.test(r.ev));
      if (filled < 3 && (u.holiday(date) || (!filled && !hasText))) return;
      // どの基本時間割にいちばん近いか（同じ基本を使う期間どうしは、日付の近いほう）
      let best = null;
      let bestScore = -1;
      const near = orig.filter((t) => date >= u.add(t.start, -40) && date <= u.add(t.end, 40));
      if (filled < 3) {
        // 授業がほとんどない日（終業式・入学式など）は、日付のいちばん近い期間へ
        if (!near.length) return;
        best = near.slice().sort((a, b) => dist(date, a) - dist(date, b))[0];
        (assigned[best.id] = assigned[best.id] || []).push(date);
        return;
      }
      (near.length ? near : orig).forEach((t) => {
        const bs = st.bases[t.id];
        let score = 0;
        if (bs)
          cells.forEach((r) =>
            Object.entries(r.vals).forEach(([cid, v]) => {
              const bc = bs.cells[`${x.d.wd}|${r.slot}|${cid}`];
              if (bc && v.t && bc.t === v.t) score++;
            })
          );
        if (score > bestScore || (score === bestScore && best && dist(date, t) < dist(date, best))) {
          bestScore = score;
          best = t;
        }
      });
      if (best) (assigned[best.id] = assigned[best.id] || []).push(date);
    });
    st.terms.forEach((t, i) => {
      const ds = (assigned[t.id] || []).sort();
      if (!ds.length) return;
      t.start = ds[0];
      const later = st.terms.slice(i + 1).some((x) => (assigned[x.id] || []).length);
      t.end = later ? ds[ds.length - 1] : ds[ds.length - 1] > t.end ? ds[ds.length - 1] : t.end;
    });
    m.touch();

    // 授業がない平日は「休業日」に、祝日に授業がある日は「○曜校時」に
    Object.entries(dayData).forEach(([date, x]) => {
      if (!x.d) return;
      if (x.d.weekend) {
        if (!m.day(date).school) {
          st.events.push({ id: u.uid(), kind: 'swap', date, swapWd: null, title: `${u.WD[u.dow(date)]}曜授業`, targets: ['all'], inYear: true, inMonth: true, inWeek: false, imported: true });
          report.events++;
          m.touch();
        }
        return;
      }
      const filled = x.d.rows.reduce((a, r) => a + (r.slot && r.slot !== 'am' && r.slot !== 'pm' ? Object.values(r.vals).filter((v) => v.t || v.m).length : 0), 0);
      const day = m.day(date);
      if (filled === 0 && day.school) {
        const first = x.d.rows.map((r) => r.ev).find(Boolean) || '';
        const title = first.replace(/^[・･]\s*/, '');
        if (!title || /休|振替|記念日/.test(title)) {
          // 休みの日
          st.events.push({ id: u.uid(), kind: 'holiday', date, title: title || '休業日', targets: ['all'], inYear: true, inMonth: true, inWeek: false, imported: true });
          report.holidays++;
        } else {
          // 授業はないが学校のある日（体育大会・考査など）：時間割の欄は空のまま
          x.wholeDay = st.events.length;
          st.events.push({ id: u.uid(), kind: 'event', date, title, targets: ['all'], from: 'all', to: '', noText: true, countAs: '', row: x.d.rows.findIndex((r) => r.ev === first), inYear: true, inMonth: true, imported: true });
          report.events++;
        }
      }
      // 「火曜校時」などの文
      const sw = x.d.rows.map((r) => r.ev).find((t) => /^([月火水木金])曜校時/.test(u.norm(t)));
      if (sw && filled > 0) {
        const wd = '日月火水木金土'.indexOf(u.norm(sw)[0]);
        const swRow = x.d.rows.find((r) => r.ev === sw);
        st.events.push(Object.assign({ id: u.uid(), kind: 'swap', date, swapWd: wd, title: u.norm(sw), targets: ['all'], inYear: true, inMonth: true, row: x.d.rows.indexOf(swRow), imported: true }, swRow && swRow.evf && swRow.evf.b ? { bold: true } : {}));
        report.events++;
      }
    });
    m.touch();

    // 行事の文・出張等・中身の違い
    const holNames = (date) => [u.holiday(date)].filter(Boolean);
    Object.entries(dayData).forEach(([date, x]) => {
      const lines = (st.lines[date] = st.lines[date] || {});
      const evLines = {};
      const stLines = {};
      const evF = {};
      const stF = {};
      if (x.w) {
        Object.entries(x.w.lines).forEach(([i, t]) => ((evLines[i] = t), (evF[i] = x.w.linesF[i])));
        Object.entries(x.w.st).forEach(([i, t]) => ((stLines[i] = t), (stF[i] = x.w.stF[i])));
      } else {
        x.d.rows.forEach((r) => {
          if (r.ev) (evLines[r.i] = r.ev), (evF[r.i] = r.evf);
          if (r.st) (stLines[r.i] = r.st), (stF[r.i] = r.stf);
        });
        // 校時の数字の色（45分授業などで塗っていたもの）
        x.d.rows.forEach((r) => {
          if (o.marks && r.slot && r.slotFill && r.slotFill !== 'FFFFFF') (lines.sl = lines.sl || {})[r.slot] = '#' + r.slotFill;
        });
        const memo = x.d.rows.map((r) => r.memo).filter(Boolean);
        if (memo.length) st.memo[date] = memo.join('\n');
      }
      // 行事の文 → 年間行事（月行事にも出る）。祝日名・「○曜校時」は二重にしない
      Object.entries(evLines).forEach(([i, t]) => {
        const t0 = u.norm(t).replace(/^[・･]\s*/, '');
        const f0 = evF[i] || {};
        if (holNames(date).includes(t0) && (f0.b || f0.big)) {
          // 祝日名を太字・大きめで書いていたもの：その見た目のまま、その行に残す
          lines.ev = lines.ev || {};
          lines.ev[i] = Object.assign({ t }, f0.b ? { b: 1 } : {}, f0.big ? { big: 1 } : {}, f0.red ? { red: 1 } : {});
          return;
        }
        if (holNames(date).includes(t0) || /^[月火水木金]曜校時/.test(t0)) return;
        if (x.d && (u.norm(m.day(date).offName) === t0 || (x.wholeDay != null && u.norm(st.events[x.wholeDay].title) === t0))) return;
        // 行事の名前らしいものは年間行事へ。時刻・番号ではじまる行、文（。で終わる）、注意書きは、その週だけの書きこみに
        const weekOnly = /^[※＊*\s(（]/.test(t) || /^[0-9０-９①-⑳➀-➓]/.test(t0) || /。$/.test(t0) || t0.length > 30 || /\d{1,2}[:：]\d{2}/.test(t0);
        const f = evF[i] || {};
        if (o.events && !weekOnly) {
          const e = { id: u.uid(), kind: 'event', date, title: t.trim().replace(/^[・･]\s*/, ''), targets: ['all'], row: Number(i), inYear: true, inMonth: true, imported: true };
          if (f.b) e.bold = true;
          if (f.red) e.red = true;
          if (f.big) e.big = true;
          st.events.push(e);
          report.events++;
        } else {
          lines.ev = lines.ev || {};
          lines.ev[i] = f.b || f.red || f.big ? Object.assign({ t }, f.b ? { b: 1 } : {}, f.red ? { red: 1 } : {}, f.big ? { big: 1 } : {}) : t;
          report.lines++;
        }
      });
      // 出張等：定例（基本と同じ文）は入れない
      const day = m.day(date);
      const bs = day.term && st.bases[day.term.id];
      Object.entries(stLines).forEach(([i, t]) => {
        if (bs && bs.staff[`${day.wd}|${i}`] === t) return;
        const f = stF[i] || {};
        lines.st = lines.st || {};
        lines.st[i] = f.b || f.red ? Object.assign({ t }, f.b ? { b: 1 } : {}, f.red ? { red: 1 } : {}) : t;
