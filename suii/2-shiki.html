<script>
/* 中2 式の計算と連立方程式　学力推移調査型の類題（5題）。
   5つの型：①2けたの数の性質を文字式で説明（3けたへ発展）／②カレンダーの数の囲み方のきまり／③連立方程式の文章題（割合）／
   ④等式の変形（平均点の公式）／⑤説明のまちがいを見つけて直す。場面と数値はすべて自作。答えはページの中で計算し直して確かめる（CH.check）。 */
(function () {
  var C = CH.C;
  /* 類題1　2けたの自然数 − (十の位＋一の位) */
  var ok1 = true, ok1b = true, a, b, c;
  for (a = 1; a <= 9; a++) for (b = 0; b <= 9; b++) { if ((10 * a + b) - (a + b) !== 9 * a) ok1 = false; for (c = 0; c <= 9; c++) if ((100 * a + 10 * b + c) - (a + b + c) !== 9 * (11 * a + b)) ok1b = false; }
  CH.check(ok1 && ok1b && 58 - (5 + 8) === 45 && 45 === 9 * 5 && 372 - (3 + 7 + 2) === 360 && 360 === 9 * 40, '類題1');
  /* 類題2　2026年12月のカレンダー（2×2の囲み） */
  var S2 = new Date(2026, 11, 1).getDay(), N2 = new Date(2026, 11, 31).getDate(), ROWS2 = Math.ceil((S2 + N2) / 7);
  function rc2(d) { var k = S2 + d - 1; return [Math.floor(k / 7), k % 7]; }
  function at2(r, c) { var d = r * 7 + c - S2 + 1; return d >= 1 && d <= N2 ? d : 0; }
  var okp = true, anyN19 = false, cnt = 0;
  for (var r = 0; r < ROWS2; r++) for (var cc = 0; cc < 6; cc++) { var q = [at2(r, cc), at2(r, cc + 1), at2(r + 1, cc), at2(r + 1, cc + 1)]; if (q.every(function (x) { return x > 0; })) { cnt++; var n = q[0]; if (q[1] !== n + 1 || q[2] !== n + 7 || q[3] !== n + 8 || q[0] + q[1] + q[2] + q[3] !== 4 * (n + 4)) okp = false; if (n === 19) anyN19 = true; } }
  CH.check(S2 === 2 && N2 === 31 && okp && cnt > 0 && !anyN19 && 9 + 10 + 16 + 17 === 52 && 4 * 19 + 16 === 92 && rc2(19)[1] === 6 && rc2(9)[1] === 3 && 4 * 11 + 16 === 60, '類題2');
  /* 類題3　利用者数（割合の連立方程式） */
  var X3 = 180, Y3 = 300, ok3 = false;
  for (var x = 0; x <= 480; x++) { var y = 480 - x; if (Math.abs(.1 * x - .05 * y - 3) < 1e-9) ok3 = (x === X3 && y === Y3); }
  CH.check(ok3 && CH.near(1.1 * X3, 198) && CH.near(.95 * Y3, 285) && 198 + 285 === 483 && Math.abs(.1 * 150 - .05 * 330 + 1.5) < 1e-9, '類題3');
  /* 類題4　3回のテストの平均 */
  CH.check((78 + 84 + 90) / 3 === 84 && 3 * 85 - 78 - 84 === 93 && (78 + 84 + 93) / 3 === 85 && (78 + 84 + 92) / 3 < 85 && (78 + 84 + 90) / 3 < 85, '類題4');
  /* 類題5　奇数の和 */
  var m5 = 1, n5 = 2;
  CH.check((2 * m5 + 1) + (2 * n5 + 1) === 3 + 5 && 3 + 5 === 2 * (m5 + n5 + 1) && (2 * 1 + 1) + (2 * 1 + 1) === 6, '類題5');

  function fs(D, k) { return CH.fs(D, k); }
  function TXT(D, x, y, s, o) { o = o || {}; var size = CH.fitSize(D, s, o.maxW || D.W * .9, o.size || fs(D, 1.1), { num: o.num }); var p = {}; for (var k in o) p[k] = o[k]; p.size = size; CH.text(D, x, y, s, p); }
  /* 行を 1つずつ 出していく。items：文字 または [文字, 色]。最後の行は 黄色 */
  function seq(D, R, items, t, o) {
    o = o || {}; var n = items.length, rh = Math.min(R.h / n, fs(D) * (o.gap || 2.5)), y0 = R.cy - rh * n / 2 + rh / 2;
    items.forEach(function (it, i) {
      var s = typeof it === 'string' ? it : it[0], col = typeof it === 'string' ? (i === n - 1 && !o.nolast ? C.yel : C.chalk) : it[1];
      var a = CH.smooth(i / n * .85, i / n * .85 + .15, t); if (a <= 0) return;
      TXT(D, o.left ? R.x0 : R.cx, y0 + i * rh, s, { col: col, a: a, align: o.left ? 'left' : 'center', maxW: R.w, size: o.size || fs(D, 1.15) });
    });
  }
  function B(D, l, r) { return CH.box(D, { l: l == null ? .06 : l, r: r == null ? .06 : r, t: .08, b: .1 }); }
  function T(D) { return D.ph ? D.t : 0; }

  /* ---- 類題1の図 ---- */
  function fig1(D, t, mode) {
    var R = B(D), s = fs(D), cw = Math.min(R.w * .1, 90), cy = R.y0 + R.h * .22;
    TXT(D, R.cx, R.y0 + s * .5, '2けたの自然数', { col: 'rgba(242,240,230,.85)' });
    var d = mode === 0 ? ['十の位', '一の位'] : mode === 1 ? [['5', '十の位'], ['8', '一の位']] : [['a', '十の位'], ['b', '一の位']];
    var d3 = mode === 3 ? [['a', '百の位'], ['b', '十の位'], ['c', '一の位']] : null, ds = d3 || d, n = ds.length;
    ds.forEach(function (e, i) {
      var x = R.cx + (i - (n - 1) / 2) * cw * 1.25, lab = typeof e === 'string' ? e : e[1], ch = typeof e === 'string' ? '' : e[0];
      CH.card(D, x, cy, cw, cw * 1.1, ch, { col: i === 0 ? C.orange : i === 1 ? C.blue : C.green, size: cw * .62 });
      TXT(D, x, cy + cw * .85, lab, { size: s * .85, col: 'rgba(242,240,230,.8)' });
    });
    return R;
  }

  /* ---- カレンダー ---- */
  function cal(D, R, o) {
    o = o || {}; var s = fs(D), hh = s * 1.5, cw = Math.min(R.w / 7, (R.h - hh - s * 1.6) / ROWS2), ch = cw * .82, W = cw * 7, x0 = R.cx - W / 2, y0 = R.y0 + hh + s * 1.6;
    TXT(D, R.cx, y0 - hh - s * .6, '2026年12月', { size: s * .95, col: 'rgba(242,240,230,.85)' });
    '日月火水木金土'.split('').forEach(function (w, i) { CH.text(D, x0 + cw * (i + .5), y0 - hh / 2, w, { size: Math.min(s * .85, cw * .4), col: i === 0 ? C.pink : i === 6 ? C.blue : 'rgba(242,240,230,.75)' }); });
    for (var d = 1; d <= N2; d++) {
      var p = rc2(d), x = x0 + cw * p[1], y = y0 + ch * p[0], hl = o.hl && o.hl(d), lb = o.lab && o.lab(d);
      CH.fillRect(D, x + 1, y + 1, x + cw - 1, y + ch - 1, { fill: hl ? hl.replace('#', '') && hexa(hl) : 'rgba(242,240,230,.04)', stroke: 'rgba(242,240,230,.22)', sw: 1 });
      CH.text(D, x + cw / 2, y + ch / 2, lb || String(d), { size: lb ? Math.min(s * .8, cw * .36) : Math.min(s * .9, ch * .45), col: hl || C.chalk, num: !lb });
    }
  }
  function hexa(h) { var n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',.32)'; }
  function two(D, k) { var R = B(D, .04, .04); return [CH.rect(R.x0, R.y0, R.x0 + R.w * k, R.y1), CH.rect(R.x0 + R.w * (k + .03), R.y0, R.x1, R.y1)]; }
  function set2(n) { var o = {}; o[n] = 0; o[n + 1] = 1; o[n + 7] = 2; o[n + 8] = 3; return o; }

  /* ---- 類題3の図（テープ） ---- */
  function fig3(D, t, mode) {
    var R = B(D), s = fs(D), h = Math.min(R.h * .14, 54), w = R.w * .86, x0 = R.x0 + R.w * .12, y1 = R.y0 + R.h * .12, y2 = R.y0 + R.h * .55;
    TXT(D, R.x0 + R.w * .05, y1 + h / 2, '昨年', { size: s, col: C.chalk });
    var xs = mode === 1 ? X3 : 240, ys = 480 - xs;
    CH.tape(D, x0, y1, w, h, [{ v: xs, col: C.blue, txt: mode === 1 ? '小学生 x＝180' : '小学生 x 人' }, { v: ys, col: C.orange, txt: mode === 1 ? '中学生 y＝300' : '中学生 y 人' }], 480);
    TXT(D, x0 + w / 2, y1 - s * .9, '合わせて 480人', { size: s * .9, col: C.yel });
    TXT(D, R.x0 + R.w * .05, y2 + h / 2, '今年', { size: s, col: C.chalk });
    var xt = mode === 1 ? 198 : 264, yt = mode === 1 ? 285 : 228;
    CH.tape(D, x0, y2, w * (xt + yt) / 480, h, [{ v: xt, col: C.blue, txt: mode === 1 ? '198人' : '小学生 10%増' }, { v: yt, col: C.orange, txt: mode === 1 ? '285人' : '中学生 5%減' }], xt + yt);
    if (mode === 0) TXT(D, x0 + w * .5, y2 + h * 1.9, '全体では 3人増えた', { size: s * .9, col: C.yel });
  }

  K3.run({
    no: '類題', title: '学力推移調査型の類題　中2 式の計算と連立方程式（5題）', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }],
    steps: [
      /* ---------------- 類題1 ---------------- */
      { tag: '類題1', bh: '類題1　2けたの数の性質（文字式で説明）', q: '2けたの自然数から、その数の十の位の数と一の位の数の和をひくと、いつも 9の倍数になるといわれている。たとえば 73 のとき、73 − (7＋3) ＝ 63 ＝ 9 × 7 である。',
        notes: ['(1) 58 から、その十の位の数と一の位の数の和をひいた差を求めなさい。', '(2) 2けたの自然数の十の位の数を a、一の位の数を b として、この差がいつも 9の倍数になることを、式を使って説明しなさい。', '(3) 3けたの自然数でも、その各位の数の和をひいた差は 9の倍数になる。百の位の数を a、十の位の数を b、一の位の数を c として、そのわけを説明しなさい。'],
        draw: function (D) { var R = fig1(D, 0, 0); TXT(D, R.cx, R.y0 + R.h * .62, '自然数 −（十の位の数＋一の位の数）', { col: C.yel, size: fs(D, 1.2) }); TXT(D, R.cx, R.y0 + R.h * .8, '例　73 − (7＋3) ＝ 63 ＝ 9×7', { col: 'rgba(242,240,230,.85)' }); } },
      { tag: '類題1', q: '(1) 58 − (5＋8) は？', a: '45', sub: '58 − (5＋8) ＝ 58 − 13 ＝ 45（45 ＝ 9×5）', dur: 2,
        b: { t: '(1) 58 − 13 ＝ <b>45</b>（9×5）', col: C.yel },
        draw: function (D) { var t = T(D), R = fig1(D, t, 1); seq(D, CH.rect(R.x0, R.y0 + R.h * .5, R.x1, R.y1), ['58 − (5＋8)', '＝ 58 − 13', '＝ 45　（＝ 9×5）'], t); } },
      { tag: '類題1', q: '(2) 2けたの自然数で、差がいつも 9の倍数になることを、a・b を使って説明しなさい。', a: '十の位 a、一の位 b の自然数は 10a＋b。差は (10a＋b)−(a＋b)＝9a。a は整数だから 9a は 9の倍数。', sub: '10a＋b − a − b ＝ 9a。a は整数なので、9 × (整数) ＝ 9の倍数', dur: 4,
        b: { t: '(2) (10a＋b)−(a＋b)＝<b>9a</b>　a は整数 → 9の倍数', col: C.yel },
        draw: function (D) { var t = T(D), R = fig1(D, t, 2); seq(D, CH.rect(R.x0, R.y0 + R.h * .44, R.x1, R.y1), ['自然数は 10a＋b と表せる', '(10a＋b) − (a＋b)', '＝ 10a＋b − a − b', '＝ 9a', ['a は整数だから、9a は 9の倍数', C.yel]], t, { gap: 2.1 }); } },
      { tag: '類題1', q: '(3) 3けたの自然数でも、各位の数の和をひいた差は 9の倍数になる。そのわけを説明しなさい。', a: '3けたの自然数は 100a＋10b＋c。差は (100a＋10b＋c)−(a＋b＋c)＝99a＋9b＝9(11a＋b)。11a＋b は整数だから、9の倍数になる。', sub: '99a＋9b ＝ 9(11a＋b)。11a＋b は整数なので 9の倍数', dur: 4,
        b: { t: '(3) 99a＋9b ＝ <b>9(11a＋b)</b>　11a＋b は整数 → 9の倍数', col: C.yel },
        draw: function (D) { var t = T(D), R = fig1(D, t, 3); seq(D, CH.rect(R.x0, R.y0 + R.h * .44, R.x1, R.y1), ['自然数は 100a＋10b＋c と表せる', '(100a＋10b＋c) − (a＋b＋c)', '＝ 99a＋9b', '＝ 9(11a＋b)', ['11a＋b は整数だから、9の倍数', C.yel]], t, { gap: 2.1 }); } },
      /* ---------------- 類題2 ---------------- */
      { tag: '類題2', bh: '類題2　カレンダーの数の囲み方', q: '次のカレンダー（2026年12月）で、たて2つ・よこ2つの 4つの数を、図のように四角で囲む。図は 9・10・16・17 を囲んだ例である。週は 日曜日から 土曜日まで、12月は 31日まである。',
        notes: ['(1) 図で囲んだ 4つの数の和を求めなさい。', '(2) 囲んだ 4つの数の和は、いつも 4の倍数になる。左上の数を n として、そのわけを説明しなさい。', '(3) ゆなさんは「4つの数の和が 92 になるように囲みたい」と言った。囲むことができるか。わけも書きなさい。'],
        draw: function (D) { var P = two(D, 1); cal(D, CH.rect(P[0].x0 + P[0].w * .12, P[0].y0, P[0].x1 - P[0].w * .12, P[0].y1), { hl: function (d) { return d in set2(9) ? C.orange : null; } }); } },
      { tag: '類題2', q: '(1) 図で囲んだ 4つの数の和は？', a: '52', sub: '9＋10＋16＋17 ＝ 52', dur: 2,
        b: { t: '(1) 9＋10＋16＋17 ＝ <b>52</b>', col: C.yel },
        draw: function (D) { var t = T(D), P = two(D, .56); cal(D, P[0], { hl: function (d) { return d in set2(9) ? C.orange : null; } }); seq(D, P[1], ['9＋10＋16＋17', '＝ 52'], t); } },
      { tag: '類題2', q: '(2) 4つの数の和がいつも 4の倍数になるわけを、左上の数 n を使って説明しなさい。', a: '左上を n とすると、4つの数は n・n＋1・n＋7・n＋8。和は n＋(n＋1)＋(n＋7)＋(n＋8)＝4n＋16＝4(n＋4)。n＋4 は整数だから、和は 4の倍数。', sub: '1週間は 7日なので、真下は n＋7、右下は n＋8', dur: 4,
        b: { t: '(2) n＋(n＋1)＋(n＋7)＋(n＋8)＝4n＋16＝<b>4(n＋4)</b>　n＋4 は整数', col: C.yel },
        draw: function (D) { var t = T(D), P = two(D, .5), labs = ['n', 'n＋1', 'n＋7', 'n＋8']; cal(D, P[0], { hl: function (d) { return d in set2(9) ? C.orange : null; }, lab: function (d) { var o = set2(9); return d in o && t > .1 ? labs[o[d]] : null; } }); seq(D, P[1], ['n＋(n＋1)＋(n＋7)＋(n＋8)', '＝ 4n＋16', '＝ 4(n＋4)', ['n＋4 は整数だから 4の倍数', C.yel]], t, { gap: 2.4 }); } },
      { tag: '類題2', q: '(3) 和が 92 になるように囲める？', a: '囲めない。4(n＋4)＝92 より n＝19。しかし 19日は土曜日で、右どなりが次の週の日曜日になるから、4つの数を四角に囲めない。', sub: '4n＋16＝92 → 4n＝76 → n＝19。19日は土曜日（いちばん右の列）', dur: 4,
        b: { t: '(3) 4n＋16＝92 → n＝19　19日は土曜日 → <b>囲めない</b>', col: C.yel },
        draw: function (D) { var t = T(D), P = two(D, .56), o = { 19: 1, 20: 2, 26: 2, 27: 2 }; cal(D, P[0], { hl: function (d) { return t > 0 && d in o ? (d === 19 ? C.pink : C.orange) : null; } }); seq(D, P[1], ['4n＋16 ＝ 92', '4n ＝ 76　n ＝ 19', '19日は土曜日', ['右どなり 20日は次の週 → 囲めない', C.pink]], t, { gap: 2.4, nolast: false }); } },
      /* ---------------- 類題3 ---------------- */
      { tag: '類題3', bh: '類題3　図書館の利用者（連立方程式・割合）', q: 'ある町の図書館の、昨年の小学生と中学生の利用者は、合わせて 480人だった。今年は、昨年にくらべて、小学生が 10%ふえ、中学生が 5%へったので、全体では 3人ふえた。昨年の小学生の利用者を x人、中学生の利用者を y人とする。',
        notes: ['(1) 連立方程式をつくりなさい。', '(2) 昨年の小学生と中学生の利用者は、それぞれ何人か。', '(3) 太郎さんは「昨年の小学生は 150人だったと思う」と言った。この考えが正しくないわけを、式を使って説明しなさい。'],
        draw: function (D) { fig3(D, 0, 0); } },
      { tag: '類題3', q: '(1) 連立方程式をつくると？', a: 'x＋y＝480　0.1x−0.05y＝3', sub: '昨年の合計 x＋y＝480。ふえた分 0.1x、へった分 0.05y、差が 3人', dur: 3,
        b: { t: '(1) <b>x＋y＝480</b>　<b>0.1x−0.05y＝3</b>', col: C.yel },
        draw: function (D) { var t = T(D); fig3(D, t, 0); var R = B(D); seq(D, CH.rect(R.x0, R.y0 + R.h * .78, R.x1, R.y1 + 8), [['x＋y＝480　　0.1x − 0.05y＝3', C.yel]], t, { gap: 2 }); } },
      { tag: '類題3', q: '(2) 昨年の小学生・中学生は、それぞれ何人？', a: '小学生 180人、中学生 300人', sub: '2つ目の式を 20倍：2x−y＝60。x＋y＝480 とたして 3x＝540、x＝180。y＝480−180＝300', dur: 4,
        b: { t: '(2) 2x−y＝60 と x＋y＝480 → 小学生 <b>180人</b>・中学生 <b>300人</b>', col: C.yel },
        draw: function (D) { var t = T(D); var P = two(D, .5); fig3(D, 0, 1); var R = P[1]; seq(D, CH.rect(R.x0 + R.w * .5, R.y0 + R.h * .6, R.x1 + R.w, R.y1 + 20), [], t); if (t > 0) { var R2 = B(D); seq(D, CH.rect(R2.x0, R2.y0 + R2.h * .7, R2.x1, R2.y1 + 14), ['0.1x−0.05y＝3 の両辺を 20倍して 2x−y＝60', 'x＋y＝480 とたして 3x＝540', ['x＝180　y＝300', C.yel]], t, { gap: 1.7, nolast: false }); } } },
      { tag: '類題3', q: '(3) 「昨年の小学生は 150人」が正しくないわけは？', a: '小学生が 150人なら、中学生は 480−150＝330人。ふえた分 0.1×150＝15人、へった分 0.05×330＝16.5人で、全体は 1.5人へることになり、「3人ふえた」に合わない。', sub: '150人を 0.1x−0.05y＝3 に入れると、15−16.5＝−1.5 で 3 にならない', dur: 4,
        b: { t: '(3) x＝150, y＝330 → 15−16.5＝−1.5 ≠ 3　<b>正しくない</b>', col: C.yel },
        draw: function (D) { var t = T(D), R = B(D); TXT(D, R.cx, R.y0 + R.h * .08, 'x ＝ 150 とすると', { col: C.blue }); seq(D, CH.rect(R.x0, R.y0 + R.h * .2, R.x1, R.y1), ['y ＝ 480 − 150 ＝ 330', 'ふえた分　0.1×150 ＝ 15（人）', 'へった分　0.05×330 ＝ 16.5（人）', '15 − 16.5 ＝ −1.5', ['全体は 1.5人へる → 「3人ふえた」に合わない', C.pink]], t, { gap: 2.4 }); } },
      /* ---------------- 類題4 ---------------- */
