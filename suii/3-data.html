<script>
/* 学力推移調査型の類題　中3 標本調査とデータの活用（5題）。
   5つの型：全数調査と標本調査の見分け／無作為抽出の方法の適否／印をつけて戻す方法での個数の推定／
   標本の大きさと標本平均のばらつき（箱ひげ図）／標本のヒストグラムから母集団を推定し、言えることの正誤を判断。
   場面と数値はすべて自作。答えはページの中で計算し直して確かめている（CH.check）。 */
(function () {
  var C = CH.C;
  var LET = ['ア', 'イ', 'ウ', 'エ'];

  /* 類題1　全数調査と標本調査 */
  var I1 = ['学校で行う、全校生徒の 視力検査', '工場でつくった 缶詰の、中身の 品質検査', '空港で、飛行機に乗る 全員の 手荷物検査', '湖の水の、よごれぐあいの 調査'];
  var S1 = [false, true, false, true];
  CH.check(S1.filter(function (x) { return x; }).length === 2 && 200 < 2400, '類題1');
  /* 類題2　無作為抽出 */
  var I2 = ['1年生の 名簿から、くじで 50人を選ぶ。', '全校生徒の 名簿に 1〜600 の番号をつけ、乱数さいで 出た番号の生徒 50人を選ぶ。', '朝、校門の前で、先に登校してきた 50人に聞く。', '運動部の生徒の中から、50人を選ぶ。'];
  CH.check(600 * 18 === 10800 && 10800 / 60 === 180, '類題2');
  /* 類題3　池の魚（印をつけて戻す） */
  var M3 = 40, N3 = 60, K3a = 8, K3b = 12, E3a = M3 * N3 / K3a, E3b = M3 * N3 / K3b, E3c = M3 * (N3 * 2) / (K3a + K3b);
  CH.check(E3a === 300 && E3b === 200 && E3c === 240 && CH.near(K3a / N3, 2 / 15), '類題3');
  var MK_A = [3, 11, 17, 24, 30, 38, 45, 52], MK_B = [1, 6, 10, 15, 21, 27, 33, 36, 42, 47, 53, 58];
  CH.check(MK_A.length === K3a && MK_B.length === K3b, '類題3 図');
  var rf = CH.rng(11), POND = [];
  for (var i3 = 0; i3 < 110; i3++) { var rr = Math.sqrt(rf()) * .88, aa = rf() * 6.2832; POND.push([rr * Math.cos(aa), rr * Math.sin(aa), i3 < 40]); }
  /* 類題4　標本の大きさと標本平均のばらつき（箱ひげ図） */
  var B10 = [24, 28, 31, 34, 38], B40 = [28, 30, 31, 32, 34];
  CH.check(B10[4] - B10[0] === 14 && B10[3] - B10[1] === 6 && B40[3] - B40[1] === 2 && B40[4] - B40[0] === 6, '類題4');
  /* 類題5　標本のヒストグラムから母集団を推定 */
  var E5 = [0, 10, 20, 30, 40, 50], H5 = [6, 17, 16, 8, 3], CU5 = CH.cum(H5), P5 = 500;
  var r20 = (H5[2] + H5[3] + H5[4]) / 50;
  CH.check(CH.sum(H5) === 50 && CH.near(r20, .54) && Math.round(P5 * r20) === 270 && CU5[1] < 25 && CU5[2] >= 26, '類題5');

  /* ---- 道具 ---- */
  function cards(D, items, o) {
    o = o || {};
    var R = CH.box(D, { l: .06, r: .06, t: .06, b: .08 }), s = CH.fs(D), n = items.length, h = Math.min(R.h / n, s * 3.6), y0 = R.y0 + (R.h - h * n) / 2, tw = o.tag ? R.w * .2 : 0;
    items.forEach(function (txt, i) {
      var cy = y0 + h * (i + .5), col = o.hl ? o.hl(i) : null, al = o.alpha ? o.alpha(i) : 1;
      CH.fillRect(D, R.x0, cy - h * .45, R.x1, cy + h * .45, { fill: col ? 'rgba(255,255,255,.07)' : 'rgba(242,240,230,.05)', stroke: col || 'rgba(242,240,230,.4)', sw: col ? 2.4 : 1.4, a: al });
      CH.circle(D, R.x0 + h * .5, cy, h * .3, { stroke: col || C.chalk, sw: 2, a: al });
      CH.text(D, R.x0 + h * .5, cy + 1, LET[i], { col: col || C.chalk, a: al, size: s });
      var lines = CH.wrap(D, txt, R.w - h * 1.1 - tw, s * .95), lh = s * 1.25, ty = cy - lh * (lines.length - 1) / 2;
      lines.forEach(function (ln, j) { CH.text(D, R.x0 + h * 1.0, ty + j * lh, ln, { align: 'left', size: s * .95, col: col || C.chalk, a: al }); });
      var tg = o.tag ? o.tag(i) : null; if (tg) CH.text(D, R.x1 - s * .5, cy, tg[0], { align: 'right', col: tg[1], size: s, a: al * (tg[2] == null ? 1 : tg[2]) });
    });
    return { R: R, h: h, y0: y0 };
  }
  function ratio(D, x, y, w, parts) { /* 帯：parts [{v,col,txt}] */ CH.tape(D, x, y, w, CH.fs(D) * 1.8, parts, CH.sum(parts.map(function (p) { return p.v; }))); }
  function hist5(D, o) {
    o = o || {}; var R = CH.box(D, { l: .1, r: .06, t: .12, b: .16 });
    var Ax = CH.axes(D, R, { x: [0, 50], y: [0, 20], xt: E5, yt: [0, 4, 8, 12, 16, 20], xl: '（分）', yl: '（人）' });
    CH.bars(D, Ax, E5, H5, { labels: true, hl: o.hl, alpha: o.alpha }); return Ax;
  }
  function boxp(D, X, st, y, h, col, fill, a, lab, lx) {
    var s = CH.fs(D);
    CH.line(D, X(st[0]), y, X(st[1]), y, { col: col, w: 2.4, a: a }); CH.line(D, X(st[3]), y, X(st[4]), y, { col: col, w: 2.4, a: a });
    CH.line(D, X(st[0]), y - h * .3, X(st[0]), y + h * .3, { col: col, w: 2.4, a: a }); CH.line(D, X(st[4]), y - h * .3, X(st[4]), y + h * .3, { col: col, w: 2.4, a: a });
    CH.fillRect(D, X(st[1]), y - h / 2, X(st[3]), y + h / 2, { fill: fill, stroke: col, sw: 2.4, a: a });
    CH.line(D, X(st[2]), y - h / 2, X(st[2]), y + h / 2, { col: col, w: 3.4, a: a });
    CH.text(D, lx, y - h * .95, lab, { col: col, align: 'left', a: a, size: s * .95 });
  }
  function box4(D, o) {
    o = o || {}; var R = CH.box(D, { l: .08, r: .08, t: .1, b: .14 }), s = CH.fs(D), t = o.t || 0, hh = Math.min(R.h * .15, s * 2.6);
    var yb = R.y1 - s * 3.2, X = CH.numline(D, CH.rect(R.x0, yb, R.x1, yb), 20, 40, 1, { lab: 2, unit: '（m）' });
    var y1 = R.y0 + R.h * .24, y2 = R.y0 + R.h * .6;
    CH.line(D, X(31), y1 - hh * 1.5, X(31), yb, { col: C.green, dash: true, w: 2, a: .8 }); CH.text(D, X(31), y1 - hh * 1.8, '母集団の平均 31m', { col: C.green, size: s * .9 });
    boxp(D, X, B10, y1, hh, C.blue, 'rgba(154,216,255,.28)', o.a1 == null ? 1 : o.a1, '標本の大きさ 10', R.x0);
    boxp(D, X, B40, y2, hh, C.orange, 'rgba(255,192,120,.28)', o.a2 == null ? 1 : o.a2, '標本の大きさ 40', R.x0);
    return { X: X, y1: y1, y2: y2, hh: hh, s: s };
  }
  function panel(D, R, marks, col, a, lab) {
    var set = {}; marks.forEach(function (m) { set[m] = 1; });
    CH.fillRect(D, R.x0, R.y0, R.x1, R.y1, { stroke: 'rgba(242,240,230,.5)', sw: 1.6, a: a });
    CH.grid(D, CH.rect(R.x0 + R.w * .04, R.y0 + R.h * .04, R.x1 - R.w * .04, R.y1 - R.h * .04), 60, { cols: 10, on: function (i) { return set[i] ? col : null; }, a: a, k: .34 });
    CH.text(D, R.cx, R.y0 - CH.fs(D) * .9, lab, { a: a, size: CH.fs(D) * .9 });
  }
  function pond(D, R, a) {
    var cx = R.cx, cy = R.cy, rx = R.w / 2, ry = R.h / 2, P = [], s = CH.fs(D);
    for (var k = 0; k < 40; k++) { var th = k / 40 * 6.2832; P.push([cx + rx * Math.cos(th), cy + ry * Math.sin(th)]); }
    CH.poly(D, P, { fill: 'rgba(100,170,255,.12)', stroke: C.blue, sw: 2.2, a: a });
    POND.forEach(function (p) { CH.circle(D, cx + p[0] * rx * .92, cy + p[1] * ry * .92, s * .2, { fill: p[2] ? C.yel : 'rgba(242,240,230,.5)', a: a }); });
  }
  function fish3(D, k, t) {
    var R = CH.box(D, { l: .04, r: .04, t: .1, b: .12 }), s = CH.fs(D), two = k >= 3;
    if (!two) {
      var pr = CH.rect(R.x0, R.y0 + R.h * .12, R.x0 + R.w * .44, R.y0 + R.h * .78); pond(D, pr, 1);
      CH.text(D, pr.cx, pr.y0 - s * 1.1, '池（印をつけた 40匹を もどした）', { size: s * .9 }); CH.circle(D, pr.x0 + s * .6, pr.y1 + s * 1.4, s * .25, { fill: C.yel }); CH.text(D, pr.x0 + s * 1.2, pr.y1 + s * 1.4, '印つきの魚', { align: 'left', size: s * .85, col: C.yel });
      var qr = CH.rect(R.x1 - R.w * .5, R.y0 + R.h * .14, R.x1, R.y0 + R.h * .78); panel(D, qr, MK_A, C.yel, 1, 'つかまえた 60匹');
      CH.arrow(D, pr.x1 + s * .5, pr.cy, qr.x0 - s * .5, qr.cy, { col: 'rgba(242,240,230,.7)', w: 2.4 });
      if (k === 0) CH.text(D, qr.cx, qr.y1 + s * 1.4, '印のついた魚は 8匹', { col: C.yel, a: CH.smooth(.2, .5, t), size: s });
      if (k === 1 && t > .3) CH.text(D, R.cx, R.y1 + s * .2, '40 : □ ＝ 8 : 60', { col: C.yel, a: CH.smooth(.3, .6, t), size: s * 1.2 });
      if (k === 2 && t > 0) { CH.text(D, R.cx, R.y1 - s * 1.4, '8 ÷ 60 ＝ 2/15', { col: C.yel, a: CH.smooth(.1, .5, t), size: s * 1.2 }); }
    } else {
      var half = R.w * .46, pa = CH.rect(R.x0, R.y0 + R.h * .1, R.x0 + half, R.y0 + R.h * .66), pb = CH.rect(R.x1 - half, R.y0 + R.h * .1, R.x1, R.y0 + R.h * .66);
      panel(D, pa, MK_A, C.yel, 1, '1回目 60匹　印 8匹'); panel(D, pb, MK_B, C.yel, 1, '2回目 60匹　印 12匹');
      if (k === 3) { var a = CH.smooth(0, .4, t); CH.text(D, pa.cx, pa.y1 + s * 1.6, '40 : □ ＝ 8 : 60 → 300匹', { col: C.pink, a: a, size: s }); CH.text(D, pb.cx, pb.y1 + s * 1.6, '40 : □ ＝ 12 : 60 → 200匹', { col: C.pink, a: a, size: s }); CH.text(D, R.cx, pa.y1 + s * 3.6, '取り出すたびに 標本は ちがう → 推定の数も ちがう', { col: C.yel, a: CH.smooth(.5, .8, t), size: s * .95 }); }
      if (k === 4) { var a4 = CH.smooth(0, .4, t); CH.line(D, pa.x0, pa.y1 + s * 1.2, pb.x1, pa.y1 + s * 1.2, { col: C.green, w: 2.4, a: a4 }); CH.text(D, R.cx, pa.y1 + s * 2.2, 'あわせて 120匹　印 20匹', { col: C.green, a: a4, size: s }); CH.text(D, R.cx, pa.y1 + s * 3.8, '40 : □ ＝ 20 : 120 → 240匹', { col: C.yel, a: CH.smooth(.4, .8, t), size: s * 1.1 }); }
    }
  }

  K3.run({
    no: '類題', title: '学力推移調査型の類題　中3 標本調査とデータの活用（5題）', flat: true, hint: '',
    links: [{ href: '../kokuban/index.html', label: '目次' }],
    steps: [
      /* ---------------- 類題1 ---------------- */
      { tag: '類題1', bh: '類題1　全数調査と標本調査', q: '次のア〜エの調査について、あとの問いに答えなさい。',
        notes: ['(1) 標本調査を行うのが ふさわしいものを、ア〜エからすべて選びなさい。', '(2) イの調査で、全数調査ではなく標本調査を行う理由を説明しなさい。', '(3) ある市の 中学3年生 2400人の中から 無作為に 200人を選び、1日の スマートフォンの使用時間を調べた。母集団は何か。また、標本の大きさはいくつか。', '(4) ウの調査を、標本調査ではなく全数調査で行う理由を説明しなさい。'],
        draw: function (D) { cards(D, I1); } },
      { tag: '類題1', q: '(1) 標本調査がふさわしいのは？', a: 'イ・エ', sub: 'イは 調べると 商品にならない。エは 湖の水を すべて調べることは できない。ア・ウは 全員を調べる（全数調査）', dur: 3,
        b: { t: '(1) 標本調査 → <b>イ・エ</b>　（ア・ウは 全数調査）', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0; cards(D, I1, { tag: function (i) { return [S1[i] ? '標本調査' : '全数調査', S1[i] ? C.yel : 'rgba(242,240,230,.8)', CH.smooth(i * .15, i * .15 + .25, t)]; }, hl: function (i) { return t > .1 && S1[i] ? C.yel : null; } }); } },
      { tag: '類題1', q: '(2) イで、標本調査を行う理由は？', a: '缶詰を すべて開けて調べると、売る缶詰が なくなってしまうから。', sub: '調べると 商品として 使えなくなる検査は、一部だけを取り出して調べる', dur: 3,
        b: { t: '(2) すべて調べると <b>売る缶詰が なくなる</b> から、一部を調べる', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, o = cards(D, I1, { alpha: function (i) { return i === 1 ? 1 : .25; }, hl: function (i) { return i === 1 ? C.yel : null; } }); CH.text(D, o.R.cx, o.R.y1 - CH.fs(D) * .2, '開けて 中身を調べると → 売れなくなる', { col: C.pink, a: CH.smooth(.2, .6, t) }); } },
      { tag: '類題1', q: '(3) 母集団は？　標本の大きさは？', a: '母集団…その市の 中学3年生 2400人全体　標本の大きさ…200', sub: '調べたい集団全体が母集団。取り出した 一部の人数が 標本の大きさ（200）。2400 は 母集団の大きさ', dur: 3,
        b: { t: '(3) 母集団 ＝ 市の中学3年生 <b>2400人全体</b>　標本の大きさ ＝ <b>200</b>', col: C.yel },
        draw: function (D) {
          var t = D.ph ? D.t : 0, R = CH.box(D, { l: .1, r: .1, t: .1, b: .1 }), s = CH.fs(D), rr = Math.min(R.w * .5, R.h) * .5, r = CH.rng(3), a = CH.smooth(0, .3, t), a2 = CH.smooth(.35, .65, t);
          CH.circle(D, R.cx, R.cy, rr, { stroke: C.blue, sw: 2.6, fill: 'rgba(154,216,255,.07)' });
          for (var i = 0; i < 260; i++) { var q = Math.sqrt(r()) * .94, th = r() * 6.2832, sel = i < 28; CH.circle(D, R.cx + q * rr * Math.cos(th), R.cy + q * rr * Math.sin(th), s * .2, { fill: sel && t > .35 ? C.yel : 'rgba(242,240,230,.4)' }); }
          CH.text(D, R.cx - rr - s * .6, R.cy - rr * .5, '母集団', { align: 'right', col: C.blue, a: a, size: s * 1.1 }); CH.text(D, R.cx - rr - s * .6, R.cy - rr * .5 + s * 1.5, '中学3年生 2400人', { align: 'right', col: C.blue, a: a, size: s * .9 });
          CH.text(D, R.cx + rr + s * .6, R.cy + rr * .3, '標本', { align: 'left', col: C.yel, a: a2, size: s * 1.1 }); CH.text(D, R.cx + rr + s * .6, R.cy + rr * .3 + s * 1.5, '200人（標本の大きさ）', { align: 'left', col: C.yel, a: a2, size: s * .9 });
        } },
      { tag: '類題1', q: '(4) ウの調査を 全数調査で行う理由は？', a: '1人でも 見のがすと 危険な物が 持ちこまれるおそれがあり、全員を調べる必要があるから。', sub: 'わずかなもれも ゆるされない調査は 全数調査。標本調査では 調べなかった人の中に 危険な物をもつ人が いるかもしれない', dur: 3.5,
        b: { t: '(4) 1人の見のがしも ゆるされない → <b>全員を調べる</b>', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, o = cards(D, I1, { alpha: function (i) { return i === 2 ? 1 : .25; }, hl: function (i) { return i === 2 ? C.yel : null; } }); CH.text(D, o.R.cx, o.R.y1 - CH.fs(D) * .2, '調べなかった人に 危険な物が あるかもしれない', { col: C.pink, a: CH.smooth(.2, .6, t) }); } },

      /* ---------------- 類題2 ---------------- */

        draw: function (D) { var t = D.ph ? D.t : 0, o = cards(D, I2, { alpha: function (i) { return i === 2 ? 1 : .25; }, hl: function (i) { return i === 2 ? C.pink : null; } }); CH.text(D, o.R.cx, o.R.y1 - CH.fs(D) * .2, '先に着く人 → 近くに住む人が 多い → 時間が短い', { col: C.pink, a: CH.smooth(.2, .6, t) }); } },
      { tag: '類題2', q: '(3) 平均 18分 のとき、全校 600人の 合計は 何時間？', a: 'およそ 180時間', sub: '18 × 600 ＝ 10800（分）、10800 ÷ 60 ＝ 180（時間）', dur: 3,
