<script>
/* 中2 一次関数　学力推移調査型の類題（5題）。
   5つの型（2つの料金プランの比較と交点の意味／長方形の辺上を動く点と面積の変域／実験データを一次関数とみなして予測／
   出発の時刻がちがう2人の道のりと出会い／2直線の交点と連立方程式）を、場面と数値をすべて自作して作った。
   答えはページの中で計算し直して確かめている（CH.check）。 */
(function () {
  var C = CH.C, OUT = 'rgba(20,40,30,.9)';

  /* 類題1　データ通信プラン　P y＝200x＋1000、Q y＝100x＋1600、交点 (6, 2200) */
  var P1 = function (x) { return 200 * x + 1000; }, Q1 = function (x) { return 100 * x + 1600; };
  CH.check((2200 - 1600) / 6 === 100 && Q1(0) === 1600 && Q1(6) === 2200 && P1(6) === 2200 && 200 * 6 + 1000 === 100 * 6 + 1600 && P1(2) < Q1(2) && P1(8) === 2600 && Q1(8) === 2400 && P1(8) - Q1(8) === 200, '類題1');
  /* 類題2　長方形 AB＝6、BC＝10、P は毎秒 2cm で B→C→D、△ABP の面積 */
  var AB2 = 6, BC2 = 10, V2 = 2, T1 = BC2 / V2, T2 = (BC2 + AB2) / V2;
  function area2(x) { return x <= T1 ? .5 * AB2 * V2 * x : .5 * AB2 * BC2; }
  CH.check(T1 === 5 && T2 === 8 && area2(3) === 18 && 6 * 4.5 === 27 && area2(5) === 30 && area2(8) === 30 && area2(4.5) === 27 && .5 * AB2 * BC2 === 30, '類題2');
  /* 類題3　水温　表は y＝7x＋18 に近い。(0, 18) と (5, 53) を通る直線 */
  var X3 = [0, 1, 2, 3, 4, 5], Y3 = [18, 25, 31, 40, 46, 53], L3 = function (x) { return 7 * x + 18; };
  CH.check((Y3[5] - Y3[0]) / 5 === 7 && L3(0) === Y3[0] && L3(5) === Y3[5] && L3(10) === 88 && L3(15) === 123 && Math.abs(L3(2) - Y3[2]) <= 1 && Math.abs(L3(3) - Y3[3]) <= 1 && Math.ceil((100 - 18) / 7) === 12, '類題3');
  /* 類題4　兄 y＝80x、弟 y＝−60x＋2100（x≧5）、出会い 15分後・1200m */
  var A4 = function (x) { return 80 * x; }, B4 = function (x) { return -60 * x + 2100; };
  CH.check(B4(5) === 1800 && B4(20) === 900 && (900 - 1800) / (20 - 5) === -60 && 80 * 15 === B4(15) && A4(15) === 1200 && A4(15) + 60 * (15 - 5) === 1800 && 1800 / 80 === 22.5, '類題4');
  /* 類題5　ℓ y＝−2x＋8（(1, 6)・(3, 2) を通る）、m x−y＝1（y＝x−1）、交点 (3, 2)、三角形 (1, 0)(4, 0)(3, 2) */
  var L5 = function (x) { return -2 * x + 8; }, M5 = function (x) { return x - 1; };
  CH.check(L5(1) === 6 && L5(3) === 2 && (2 - 6) / (3 - 1) === -2 && M5(3) === 2 && 3 - 2 === 1 && L5(3) === M5(3) && L5(4) === 0 && M5(1) === 0 && .5 * (4 - 1) * 2 === 3, '類題5');

  function full(D) { return CH.box(D, { l: .02, r: .02, t: .02, b: .02 }); }
  function lab(D, Pl, x, y, t, o) { o = o || {}; CH.text(D, Pl.X(x), Pl.Y(y), t, { col: o.col || C.chalk, size: o.size || CH.fs(D, .85), align: o.align || 'left', a: o.a, outline: OUT }); }
  function glow(D, Pl, p, col, a) { CH.circle(D, Pl.X(p[0]), Pl.Y(p[1]), CH.fs(D, .3) * (2.1 + .4 * Math.sin(D.now * 5)), { stroke: col, sw: 2.6, a: (a == null ? 1 : a) * .7 }); }
  /* 第1象限のグラフ。o：x・y（範囲）、sx・sy（グリッド）、lx・ly（目もりの字）、ux・uy（単位） */
  function graph(D, R, o) {
    var s = CH.fs(D, .72), Rp = CH.rect(R.x0 + s * 3.6, R.y0 + s * 2, R.x1 - s * 2.8, R.y1 - s * 1.8);
    var Pl = CH.plane(D, Rp, { x: o.x, y: o.y, fit: false, stepX: o.sx, stepY: o.sy, nums: false }), x, y;
    CH.text(D, Pl.X(0) - s * .7, Pl.Y(0) + s * .9, 'O', { size: s, num: true });
    for (x = o.lx; x <= o.x[1] + 1e-9; x += o.lx) { CH.line(D, Pl.X(x), Pl.Y(0) - 4, Pl.X(x), Pl.Y(0) + 4, { w: 1.4 }); CH.text(D, Pl.X(x), Pl.Y(0) + s, String(x), { size: s, num: true }); }
    for (y = o.ly; y <= o.y[1] + 1e-9; y += o.ly) { CH.line(D, Pl.X(0) - 4, Pl.Y(y), Pl.X(0) + 4, Pl.Y(y), { w: 1.4 }); CH.text(D, Pl.X(0) - s * .6, Pl.Y(y), String(y), { size: s, num: true, align: 'right' }); }
    if (o.ux) CH.text(D, Pl.R.x1 + s * 1.2, Pl.Y(0) + s * 2.1, o.ux, { size: s, col: 'rgba(242,240,230,.75)', align: 'right' });
    if (o.uy) CH.text(D, Pl.X(0) + s * 1.6, Pl.R.y0 - s * .8, o.uy, { size: s, col: 'rgba(242,240,230,.75)', align: 'left' });
    return Pl;
  }
  /* 横長なら左右、縦長なら上下に分ける */
  function fit2(D, k, kn) {
    var R = full(D);
    if (D.W > D.H * .9) { var x = R.x0 + R.w * k; return [CH.rect(R.x0, R.y0, x, R.y1), CH.rect(x + R.w * .01, R.y0, R.x1, R.y1)]; }
    var y = R.y0 + R.h * kn; return [CH.rect(R.x0, R.y0, R.x1, y), CH.rect(R.x0, y + 4, R.x1, R.y1)];
  }
  function dotv(D, Pl, x, y, col, a, r) { CH.pt(D, Pl, x, y, { col: col, a: a, r: r }); }
  function guide(D, Pl, x, y, col, a) { CH.pseg(D, Pl, [x, 0], [x, y], { col: col, dash: true, a: a }); CH.pseg(D, Pl, [0, y], [x, y], { col: col, dash: true, a: a }); }

  /* ================= 類題1 ================= */
  var G1 = { x: [0, 10], y: [0, 3200], sx: 1, sy: 200, lx: 1, ly: 400, ux: '（GB）', uy: '（円）' };
  function plan1(D, o) {
    o = o || {}; var Pl = graph(D, full(D), G1);
    CH.fn(D, Pl, P1, { col: C.yel, w: 3, a: o.dim ? .5 : 1 }); CH.fn(D, Pl, Q1, { col: C.blue, w: 3, a: o.dim ? .5 : 1 });
    lab(D, Pl, 8.7, 2740 + 300, 'P', { col: C.yel, size: CH.fs(D, 1.05) }); lab(D, Pl, 9.4, 2540 - 310, 'Q', { col: C.blue, size: CH.fs(D, 1.05) });   /* P は 黄の 線の すぐ上、Q は 青の 線の すぐ下（Q の 字が P の 線に のらない ように） */
    if (!o.nopts) { CH.pt(D, Pl, 0, 1600, { col: C.blue }); lab(D, Pl, .25, 1600 + 340, '(0, 1600)', { col: C.blue, align: 'left', size: CH.fs(D, .85) }); if (!o.no6) CH.pt(D, Pl, 6, 2200, { col: C.blue, r: CH.fs(D, .24) }); }
    return Pl;
  }
  /* ================= 類題2 ================= */
  function pos2(x) { var d = Math.min(V2 * x, BC2 + AB2); return d <= BC2 ? [d, 0] : [BC2, d - BC2]; }  /* B を原点、右へ BC、上へ AB */
  function fig2(D, R, x, o) {
    o = o || {}; var s = CH.fs(D, .85), u = Math.min(R.w * .66 / BC2, R.h * .62 / AB2), l = R.cx - BC2 * u / 2, tp = R.cy - AB2 * u / 2 - s * .4;
    var Xp = function (v) { return l + v * u; }, Yp = function (v) { return tp + (AB2 - v) * u; }, p = pos2(x);
    var A = [0, AB2], B = [0, 0], Cc = [BC2, 0], Dd = [BC2, AB2];
    CH.poly(D, [[Xp(0), Yp(AB2)], [Xp(0), Yp(0)], [Xp(p[0]), Yp(p[1])]], { fill: 'rgba(255,226,122,' + (o.tri == null ? .3 : o.tri) + ')' });
    CH.poly(D, [[Xp(0), Yp(AB2)], [Xp(0), Yp(0)], [Xp(BC2), Yp(0)], [Xp(BC2), Yp(AB2)]], { stroke: C.chalk, sw: 2.4 });
    CH.line(D, Xp(0), Yp(AB2), Xp(p[0]), Yp(p[1]), { col: C.yel, w: 2.4 });
    [['A', A, -1, -1], ['B', B, -1, 1], ['C', Cc, 1, 1], ['D', Dd, 1, -1]].forEach(function (z) { CH.text(D, Xp(z[1][0]) + z[2] * s * .9, Yp(z[1][1]) + z[3] * s * .9, z[0], { size: s * 1.1, num: true }); });
    CH.text(D, Xp(0) - s * 2.1, Yp(AB2 / 2), '6cm', { size: s * .9, num: true, col: C.green });
    CH.text(D, Xp(BC2 / 2), Yp(0) + s * 1.9, '10cm', { size: s * .9, num: true, col: C.green });
    CH.circle(D, Xp(p[0]), Yp(p[1]), s * .45, { fill: C.orange, stroke: 'rgba(20,30,24,.8)', sw: 1.2 });
    CH.text(D, Xp(p[0]) + (p[0] >= BC2 ? s * 2.3 : s * .9), Yp(p[1]) + (p[0] >= BC2 ? 0 : -s * 1.3), 'P', { size: s * 1.1, num: true, col: C.orange });
    if (o.h) { CH.line(D, Xp(0), Yp(p[1]), Xp(p[0]), Yp(p[1]), { col: C.pink, dash: true, w: 2.4, a: o.h }); CH.text(D, Xp(p[0] / 2), Yp(p[1]) - s * .9, '高さ ' + (p[0] === 0 ? '' : '10cm'), { col: C.pink, size: s * .9, a: o.h, outline: OUT }); }
    return { Xp: Xp, Yp: Yp };
  }
  var G2 = { x: [0, 8], y: [0, 36], sx: 1, sy: 6, lx: 1, ly: 6, ux: '（秒）', uy: '（cm²）' };
  function two2(D, o) {
    o = o || {}; var Rs = fit2(D, .46, .46), Pl = graph(D, Rs[1], G2), x = o.x == null ? 0 : o.x;
    fig2(D, Rs[0], x, { h: o.h, tri: o.tri });
    return Pl;
  }
  /* ================= 類題3 ================= */
  var G3 = { x: [0, 16], y: [0, 130], sx: 1, sy: 10, lx: 2, ly: 20, ux: '（分）', uy: '（℃）' };
  function water(D, o) {
    o = o || {}; var R = full(D), s = CH.fs(D), rh = Math.min(s * 1.9, R.h * .1), w = Math.min(R.w, s * 22);
    CH.table(D, CH.rect(R.cx - w / 2, R.y0 + 2, R.cx + w / 2, R.y0 + 2 + rh * 3), ['x（分）'].concat(X3), [['y（℃）'].concat(Y3)], { fw: .22, top: true, rh: rh, hl: o.hl });
    var Pl = graph(D, CH.rect(R.x0, R.y0 + rh * 2 + s * 1.5, R.x1, R.y1), G3);
    X3.forEach(function (x, i) { CH.pt(D, Pl, x, Y3[i], { col: C.yel, r: CH.fs(D, .26) }); });
    return Pl;
  }
  /* ================= 類題4 ================= */
  var G4 = { x: [0, 25], y: [0, 1800], sx: 5, sy: 300, lx: 5, ly: 300, ux: '（分）', uy: '（m）' };
  function walk4(D, o) {
    o = o || {}; var Pl = graph(D, full(D), G4), a = o.t == null ? 1 : o.t;
    CH.fn(D, Pl, A4, { col: C.yel, w: 3, x1: 22.5, a: o.dim ? .5 : 1 }); CH.fn(D, Pl, B4, { col: C.blue, w: 3, x0: 5, x1: 25, a: o.dim ? .5 : 1 });
    lab(D, Pl, 15.5, 1000, '兄', { col: C.yel, size: CH.fs(D, 1.05) }); lab(D, Pl, 22.2, 1120, '弟', { col: C.blue, size: CH.fs(D, 1.05) });
    CH.pt(D, Pl, 5, 1800, { col: C.blue, lab: '(5, 1800)', dir: 'se' }); CH.pt(D, Pl, 20, 900, { col: C.blue, lab: '(20, 900)', dir: 'ne' });
    return Pl;
  }
  /* ================= 類題5 ================= */
  function plane5(D, o) {
    o = o || {}; var R = full(D), s = CH.fs(D, .72), Pl = CH.plane(D, CH.rect(R.x0 + s * 2, R.y0 + s * 2, R.x1 - s * 2.6, R.y1 - s * 1.2), { x: [-1, 7], y: [-2, 9], step: 1, size: s });
    CH.lin(D, Pl, -2, 8, { col: C.yel, w: 3 }); CH.lin(D, Pl, 1, -1, { col: C.blue, w: 3 });
    lab(D, Pl, .25, 8.2, 'ℓ', { col: C.yel, size: CH.fs(D, 1.1) }); lab(D, Pl, 6.1, 5.3, 'm', { col: C.blue, size: CH.fs(D, 1.1) });
    if (!o.nopts) { CH.pt(D, Pl, 1, 6, { col: C.yel, lab: '(1, 6)', dir: 'ne' }); CH.pt(D, Pl, 3, 2, { col: C.yel, r: CH.fs(D, .24) }); lab(D, Pl, 3.2, 1.45, '(3, 2)', { col: C.yel, size: CH.fs(D, .85) }); }
    return Pl;
  }

  K3.run({
    no: '類題', title: '学力推移調査型の類題　中2 一次関数（5題）', flat: true, hint: '',
    links: [{ href: '../ichiji/index.html', label: '一次関数の黒板' }],
    steps: [
      /* ---------------- 類題1 ---------------- */
      { tag: '類題1', bh: '類題1　データ通信プラン（2つの料金）', q: 'ある通信会社には、1か月に使うデータ量を x GB、料金を y円 としたとき、P・Q 2つのプランがある。P は、基本料金 1000円 に 1GB あたり 200円 を加えた料金である。グラフの直線 P・Q は、2つのプランの料金を表している。Q は 2点 (0, 1600)、(6, 2200) を通る。',
        notes: ['(1) Q の料金を表す式を求めなさい。', '(2) P と Q のグラフの交点の座標を求めなさい。', '(3) (2) の交点は、何を表しているか。説明しなさい。', '(4) 1か月に 8GB 使うとき、P と Q のどちらが何円安いか。'],
        draw: function (D) { plan1(D); } },
      { tag: '類題1', q: '(1) Q の料金を表す式は？', a: 'y＝100x＋1600', sub: '切片は 1600、傾きは (2200−1600)÷(6−0)＝100', dur: 3,
        b: { t: '(1) 傾き (2200−1600)÷6＝100、切片 1600 → <b>y＝100x＋1600</b>', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, Pl = plan1(D); if (t > 0) CH.slopeTri(D, Pl, 100, 1600, 0, 6, { col: C.pink, a: CH.smooth(0, .4, t), lx: '＋6', ly: '＋600' }); if (t > .5) lab(D, Pl, 1, 2750, 'y＝100x＋1600', { col: C.blue, a: CH.smooth(.5, .7, t), size: CH.fs(D, 1) }); } },
      { tag: '類題1', q: '(2) P と Q のグラフの交点の座標は？', a: '(6, 2200)', sub: 'P y＝200x＋1000 と Q y＝100x＋1600 を連立方程式として解く。200x＋1000＝100x＋1600 → 100x＝600 → x＝6、y＝200×6＋1000＝2200', dur: 4,
        b: { t: '(2) 200x＋1000＝100x＋1600 → x＝6、y＝2200 → <b>(6, 2200)</b>', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, Pl = plan1(D, { dim: true, no6: !(t > 0) }); if (t > 0) { var a = CH.smooth(0, .4, t); guide(D, Pl, 6, 2200, C.orange, a); dotv(D, Pl, 6, 2200, C.orange, a, CH.fs(D, .38)); glow(D, Pl, [6, 2200], C.orange, a); } if (t > .45) lab(D, Pl, 6.3, 1750, '交点 (6, 2200)', { col: C.orange, a: CH.smooth(.45, .65, t), size: CH.fs(D, .95) }); } },
      { tag: '類題1', q: '(3) 交点は、何を表している？', a: '6GB 使うと、P も Q も料金が 2200円で同じになることを表している。', sub: '交点は P の上にも Q の上にもある点。x＝6 のとき、どちらの料金も y＝2200 になる。（6GB より少ないと P が安く、6GB より多いと Q が安い）', dur: 5,
        b: { t: '(3) 6GB のとき、P も Q も <b>2200円で同じ</b>（6GB より少ない → P が安い、多い → Q が安い）', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, Pl = plan1(D, { dim: true }), a = CH.smooth(0, .3, t); guide(D, Pl, 6, 2200, C.orange, a); dotv(D, Pl, 6, 2200, C.orange, a, CH.fs(D, .38)); glow(D, Pl, [6, 2200], C.orange, a);
          if (t > .3) { var a2 = CH.smooth(.3, .5, t); lab(D, Pl, 3, 400, 'P が安い', { col: C.yel, a: a2, align: 'center', size: CH.fs(D, .95) }); CH.pseg(D, Pl, [6, 0], [6, 300], { col: C.orange, a: a2 }); lab(D, Pl, 8.3, 400, 'Q が安い', { col: C.blue, a: a2, align: 'center', size: CH.fs(D, .95) }); }
          if (t > .55) lab(D, Pl, 6.3, 1750, '6GB で 2200円（同じ）', { col: C.orange, a: CH.smooth(.55, .75, t), size: CH.fs(D, .9) }); } },
      { tag: '類題1', q: '(4) 8GB 使うとき、安いのは P と Q のどちら？ いくら安い？', a: 'Q のほうが 200円安い', sub: 'x＝8 のとき、P は 200×8＋1000＝2600円、Q は 100×8＋1600＝2400円。2600−2400＝200', dur: 4,
        b: { t: '(4) P 2600円、Q 2400円 → <b>Q が 200円安い</b>', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, Pl = plan1(D, { dim: true }), a = CH.smooth(0, .4, t); CH.pseg(D, Pl, [8, 0], [8, 2600], { col: 'rgba(242,240,230,.7)', dash: true, a: a }); dotv(D, Pl, 8, 2600, C.yel, a, CH.fs(D, .34)); dotv(D, Pl, 8, 2400, C.blue, a, CH.fs(D, .34));
          if (t > .4) { var a2 = CH.smooth(.4, .6, t); lab(D, Pl, 7.7, 2780, '2600円', { col: C.yel, a: a2, align: 'right', size: CH.fs(D, .9) }); lab(D, Pl, 8.2, 2200, '2400円', { col: C.blue, a: a2, size: CH.fs(D, .9) }); }
          if (t > .65) lab(D, Pl, 8.2, 2500, '差 200円', { col: C.pink, a: CH.smooth(.65, .85, t), size: CH.fs(D, .9) }); } },

      /* ---------------- 類題2 ---------------- */
      { tag: '類題2', bh: '類題2　長方形の辺の上を動く点', q: '長方形 ABCD で、AB＝6cm、BC＝10cm である。点 P は、B を出発して、辺 BC、CD の上を C を通って D まで、毎秒 2cm の速さで動く。P が B を出発してから x秒後の △ABP の面積を y cm² とする。',
        notes: ['(1) x＝3 のときの y の値を求めなさい。', '(2) P が辺 BC 上、辺 CD 上にあるとき、y を x の式で表しなさい。x の変域もかきなさい。', '(3) y＝27 になるのは、P が B を出発して何秒後か。', '(4) P が辺 CD 上にあるとき、△ABP の面積が変わらないわけを説明しなさい。'],
        draw: function (D) { two2(D); } },
      { tag: '類題2', q: '(1) x＝3 のとき、y の値は？', a: '18', sub: '3秒間に P は 2×3＝6cm 動くので BP＝6cm。△ABP＝6×6÷2＝18（cm²）', dur: 3,
        b: { t: '(1) BP＝2×3＝6cm → 6×6÷2＝<b>18cm²</b>', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0, k = CH.smooth(0, .6, t), Pl = two2(D, { x: 3 * k, h: .0 }); if (t > .6) { var a = CH.smooth(.6, .85, t); guide(D, Pl, 3, 18, C.orange, a); dotv(D, Pl, 3, 18, C.orange, a, CH.fs(D, .36)); lab(D, Pl, 3.3, 15.5, '(3, 18)', { col: C.orange, a: a, size: CH.fs(D, .9) }); } } },
