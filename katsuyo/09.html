<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相対度数を確率として使う</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="js/chart.js"></script>
<script>
/* データの活用 第9時：相対度数を、確率として使おう（ikkan の lesson_data_new_09 と同じ流れ）。データはすべて自作。 */
(function () {
  var C = CH.C;
  var CAP = { n: [50, 100, 200, 400, 600, 800, 1000], c: [35, 56, 126, 245, 372, 488, 611], r: ['0.70', '0.56', '0.63', '0.61', '0.62', '0.61', '0.61'] };
  var FIVE = [58, 66, 63, 55, 64];
  CH.check(CH.near(2000 * .61, 1220), '2000回');
  CH.check(210 / 280 === .75 && 60 * .75 === 45, 'フリースロー');
  CH.check(332 / 400 === .83 && CH.f1(500 / .83) === '602.4' && 602 * .83 < 500 && 603 * .83 >= 500, '種');

  function capGraph(D, R, xm) {
    var xt = []; for (var x = 0; x <= xm; x += xm / 5) xt.push(x);
    var Ax = CH.axes(D, R, { x: [0, xm], y: [.5, .8], xt: xt, yt: [.5, .55, .6, .65, .7, .75, .8], yf: function (v) { return v.toFixed(2); }, xl: '（回）', yl: '上向きの相対度数', cut: true });
    CH.path(D, Ax, CAP.n.map(function (n, i) { return [n, +CAP.r[i]]; }), { col: C.yel, r: 5 });
    return Ax;
  }

  K3.run({
    no: '第9時', title: '相対度数を、確率として使おう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '08.html', label: '◀ 第8時' }, { href: '10.html', label: '第10時 ▶' }],
    steps: [
      { tag: '今日の問い', bh: 'キャップを 2000回投げたら？', q: '前の時間の実験では、1000回投げて 上向きが 611回（相対度数 0.61）。2000回投げると、上向きは およそ何回になるだろう。',
        notes: ['① 自分の考え（3分）　どの数を使ったか、式も。', '② ペアの考え（3分）'],
        draw: function (D) {
          var Ax = capGraph(D, CH.box(D, { l: .12, r: .06, t: .1, b: .16 }), 2000);
          CH.card(D, Ax.X(2000), Ax.Y(.65), Ax.s * 2.4, Ax.s * 2.4, '？', { col: C.pink, size: Ax.s * 1.5 });
        } },
      { tag: '今日の問い', q: '2000回投げると、上向きは およそ何回？', a: 'およそ 1220回', sub: '相対度数は 0.61 くらいに落ち着く。2000 × 0.61 ＝ 1220', dur: 2.5,
        b: { t: '2000 × 0.61 ＝ 1220 → <b>およそ 1220回</b>', col: C.yel },
        draw: function (D) {
          var Ax = capGraph(D, CH.box(D, { l: .12, r: .06, t: .1, b: .16 }), 2000), t = D.ph ? D.t : 0;
          if (t > 0) {
            var a = CH.smooth(0, .5, t), xe = CH.lerp(1000, 2000, CH.smooth(0, .6, t));
            CH.line(D, Ax.X(1000), Ax.Y(.61), Ax.X(xe), Ax.Y(.61), { col: C.green, dash: true, w: 2.4, a: a });
            if (t > .6) { var a2 = CH.smooth(.6, .85, t); CH.circle(D, Ax.X(2000), Ax.Y(.61), 6, { fill: C.green, a: a2 }); CH.text(D, Ax.X(2000), Ax.Y(.61) - Ax.s * 1.6, '2000 × 0.61 ＝ 1220', { col: C.green, a: a2, align: 'right', size: Ax.s * 1.1 }); }
          }
        } },
      { tag: 'ことば', bh: 'ことば', q: 'あることがらの「起こりやすさの程度」を表す数を、何という？', a: '確率', sub: '多数回の実験で、相対度数が近づく値を、そのことがらの確率と考える。確率は 0 から 1 までの数', dur: 3,
        b: [{ t: '起こりやすさの程度を表す数 … <b>確率</b>', col: C.green }, { t: '確率は 0〜1。1 に近いほど起こりやすい', col: C.green }],
        draw: function (D) {
          var R = CH.box(D, { l: .08, r: .08, t: .1, b: .2 }), s = CH.fs(D), t = D.ph ? D.t : 0, NR = CH.rect(R.x0, R.cy, R.x1, R.cy + s * 3);
          var X = CH.numline(D, NR, 0, 1, .1, { lab: .1, fmt: function (v) { return v.toFixed(1); } });
          var M = [[0, 'けっして起こらない', C.chalk, -1, 0], [1, 'かならず起こる', C.chalk, -1, 0], [.5, '硬貨で表（約 0.5）', C.orange, -1, .1], [.17, 'さいころで 1の目（約 0.17）', C.blue, 1, .3], [.61, 'キャップが上向き（約 0.61）', C.yel, 1, .5]];
          M.forEach(function (m) {
            var a = m[4] === 0 ? 1 : CH.smooth(m[4], m[4] + .25, t); if (a <= 0) return;
            var x = X(m[0]), y0 = NR.y1, al = m[0] === 0 ? 'left' : m[0] === 1 ? 'right' : 'center', xt = x + (al === 'left' ? -4 : al === 'right' ? 4 : 0);
            CH.circle(D, x, y0, 6, { fill: m[2], a: a });
            if (m[3] > 0) { CH.line(D, x, y0, x, y0 - s * 3, { col: m[2], a: a, w: 2 }); CH.text(D, xt, y0 - s * 3.8, m[1], { col: m[2], a: a, align: al, size: s * .9 }); }
            else { CH.line(D, x, y0 + s * 1.9, x, y0 + s * 2.5, { col: m[2], a: a, w: 2 }); CH.text(D, xt, y0 + s * 3.2, m[1], { col: m[2], a: a, align: al, size: s * .9 }); }
          });
          if (t > .8) CH.text(D, R.cx, R.y0 + s, '0 に近いほど起こりにくく、1 に近いほど起こりやすい', { col: C.green, a: CH.smooth(.8, 1, t) });
        } },
      { tag: '例題', bh: '例題　フリースロー', q: 'Aさんは、フリースローを 280本うって、210本入った。60本うつと、およそ何本入るといえる？', a: 'およそ 45本', sub: '入る確率 210÷280＝0.75 と考えて、60 × 0.75 ＝ 45', dur: 3,
        b: { t: '入る確率 210÷280＝<b>0.75</b> → 60 × 0.75 ＝ <b>45本</b>', col: C.pink },
        draw: function (D) {
          var R = CH.box(D, { l: .04, r: .04, t: .12, b: .14 }), s = CH.fs(D), t = D.ph ? D.t : 0, rs = CH.split(D, R, 2, .1);
          var L = CH.rect(rs[0].x0, rs[0].y0 + s * 2, rs[0].x1, rs[0].y1 - s * 2), Rt = CH.rect(rs[1].x0 + rs[1].w * .12, rs[1].y0 + s * 2, rs[1].x1 - rs[1].w * .12, rs[1].y0 + rs[1].h * .55);
          CH.grid(D, L, 280, { cols: 20, k: .38, on: function (i) { return i < 210 ? C.yel : null; } });
          CH.text(D, rs[0].cx, rs[0].y0 + s * .7, 'これまで 280本', { col: C.chalk });
          CH.text(D, rs[0].cx, rs[0].y1 - s * .6, '入った 210本 → 210 ÷ 280 ＝ 0.75', { col: C.yel, size: s * .95 });
          var k = Math.round(45 * CH.smooth(.2, .8, t));
          CH.grid(D, Rt, 60, { cols: 10, k: .38, on: function (i) { return i < k ? C.pink : null; } });
          CH.text(D, rs[1].cx, rs[1].y0 + s * .7, 'これから 60本', { col: C.chalk });
          if (t > .8) CH.text(D, rs[1].cx, Rt.y1 + s * 1.4, '60 × 0.75 ＝ 45本', { col: C.pink, a: CH.smooth(.8, 1, t), size: s * 1.2 });
        } },
      { tag: '考えよう', q: '上向きの確率が 0.61 なら、100回投げると かならず 61回 上向きになるだろうか。5人が 100回ずつ投げた結果を見て、考えよう。',
        notes: ['5人の結果　58回・66回・63回・55回・64回', '確率 0.61 は、何を表している数だろう。', 'スライダーで、1人ずつ結果を見られます。'],
        sliders: [{ key: 'k', label: '何人目まで', min: 1, max: 5, step: 1, val: 1, fmt: function (x) { return x + '人目'; } }],
        draw: function (D) {
          var R = CH.box(D, { l: .14, r: .1, t: .1, b: .16 }), k = D.V.k;
          var Ax = CH.axes(D, R, { x: [0, 5], y: [0, 80], xt: [], yt: [0, 20, 40, 60, 80], yl: '上向きの回数（100回中）' });
          CH.bars(D, Ax, [0, 1, 2, 3, 4, 5], FIVE, { gap: .35, labels: true, alpha: function (i) { return i < k ? 1 : 0; }, hl: function (i) { return i === k - 1 ? C.yel : C.blue; } });
          for (var i = 0; i < 5; i++) CH.text(D, Ax.X(i + .5), Ax.R.y1 + Ax.s, (i + 1) + '人目', { size: Ax.s, a: i < k ? 1 : .35 });
          CH.line(D, Ax.X(0), Ax.Y(61), Ax.X(5), Ax.Y(61), { col: C.green, dash: true, w: 2 }); CH.text(D, Ax.X(5), Ax.Y(61) - Ax.s * .9, '100 × 0.61 ＝ 61', { col: C.green, align: 'right', size: Ax.s });
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: 'ある種を 400粒まくと、332粒が芽を出した。苗を 500本つくりたい。少なくとも何粒まけばよいか。', a: '603粒', sub: '芽が出る確率 332÷400＝0.83。500÷0.83＝602.4… → 602粒では 602×0.83＝499.66 で足りない', dur: 4,
        b: { t: '確率 0.83 → 500 ÷ 0.83 ＝ 602.4… → <b>603粒</b>（602粒では足りない）', col: C.orange },
        draw: function (D) {
          var R = CH.box(D, { l: .08, r: .08, t: .12, b: .16 }), s = CH.fs(D), t = D.ph ? D.t : 0, h = Math.min(R.h * .12, 46);
          CH.tape(D, R.x0, R.y0 + s, R.w, h, [{ v: 332, col: C.green, txt: '芽が出た 332粒' }, { v: 68, col: '#7d8a84', txt: '68', a: .45 }], 400);
          CH.text(D, R.cx, R.y0, 'まいた 400粒', { size: s * .9 });
          CH.text(D, R.cx, R.y0 + s + h + s * 1.1, '332 ÷ 400 ＝ 0.83', { col: C.green });
          if (t > .1) {
            var a = CH.smooth(.1, .35, t), NR = CH.rect(R.x0 + R.w * .04, R.y0 + R.h * .45, R.x1 - R.w * .04, R.y0 + R.h * .62);
            var X = CH.numline(D, NR, 497, 502, .5, { lab: 1, a: a, unit: '（苗の本数）' });
            CH.line(D, X(500), NR.y1 - s * 4, X(500), NR.y1 + 4, { col: C.yel, w: 2.6, a: a }); CH.text(D, X(500), NR.y1 - s * 4.7, 'ほしいのは 500本', { col: C.yel, a: a, size: s * .9 });
            [[601, C.pink, .35], [602, C.pink, .5], [603, C.green, .7]].forEach(function (m, j) {
              var a2 = CH.smooth(m[2], m[2] + .15, t); if (a2 <= 0) return; var v = m[0] * .83, y = NR.y1 + s * (3 + j * 1.5);
              CH.circle(D, X(v), NR.y1, 6, { fill: m[1], a: a2 });
              CH.line(D, X(v), NR.y1, X(v), y - s * .6, { col: m[1], dash: true, a: a2, w: 1.6 });
              CH.text(D, X(v), y, m[0] + '粒 → ' + (Math.round(v * 100) / 100) + '本', { col: m[1], a: a2, size: s * .9 });
            });
          }
        } }
    ]
  });
})();
</script>
</body>
</html>
