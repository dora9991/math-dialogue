(function () {
  var C = CH.C;

  var E1 = [8, 12, 16, 20, 24, 28, 32], H1 = [3, 7, 12, 10, 6, 2], CH1 = CH.cum(H1);

  /* 類題4　50m走（Aさん・Bさん 20回ずつ） */
  var E4 = [6.8, 7.0, 7.2, 7.4, 7.6, 7.8, 8.0], A4 = [3, 5, 3, 4, 3, 2], B4 = [0, 2, 12, 5, 1, 0], V4 = [6.9, 7.1, 7.3, 7.5, 7.7, 7.9];
  function m4(a) { return a.reduce(function (s, x, i) { return s + x * V4[i]; }, 0) / 20; }
  CH.check(CH.near(m4(A4), 7.35) && CH.near(m4(B4), 7.35) && (A4[0] + A4[1]) / 20 === .4 && (B4[0] + B4[1]) / 20 === .1 && (A4[0] + A4[1] + A4[2]) / 20 === .55 && (B4[0] + B4[1] + B4[2]) / 20 === .7, '類題4');
  /* 類題5　画びょう */
  var N5 = [100, 200, 500, 1000, 1500, 2000], U5 = [45, 84, 207, 398, 603, 802], R5 = N5.map(function (n, i) { return CH.f2(U5[i] / n); });

  CH.check(R5.join() === '0.45,0.42,0.41,0.40,0.40,0.40' && CH.near(5000 * .4, 2000) && TU.join() === '3,5,4,2,6', '類題5');

  function hist(D, R, E, H, o) {

          if (t > .3) CH.text(D, Ax.X(27), Ax.Y(12.5), '18人 ÷ 40人 ＝ 0.45', { col: C.orange, a: CH.smooth(.3, .6, t), size: Ax.s * 1.2 });
        } },
      { tag: '類題1', q: '(4) 19m の Aさん「ぼくの記録は、中央値より大きい」。正しいといえる？', a: 'いえない（決められない）', sub: '中央値は 20番目と 21番目の平均。小さいほうから 10人目までが 16m未満、22人目までが 20m未満 → 中央値も 16〜20m の階級。同じ階級の中での大小は、ヒストグラムからはわからない', dur: 4,

        notes: ['(1) 平均値・中央値・最頻値を求めなさい。', '(2) 28冊は、8冊の書きまちがいだった。正しく直すと、平均値と中央値は どう変わるか。', '(3) 直す前のデータで、「この班の人が ふだん読む冊数」を表すには、平均値と中央値の どちらがふさわしいか。わけも書きなさい。'],

        b: { t: '(1) 平均値 <b>6.0</b>・中央値 <b>3.5</b>・最頻値 <b>2</b>（冊）', col: C.yel },
        draw: function (D) {
          var R = CH.box(D, { l: .06, r: .08, t: .1, b: .14 }), s = CH.fs(D), t = D.ph ? D.t : 0, yl = R.y0 + R.h * .72, X = CH.numline(D, CH.rect(R.x0, yl - 10, R.x1, yl), 0, 30, 1, { lab: 5, unit: '（冊）' });

          if (t > .35) { var a2 = CH.smooth(.35, .55, t); CH.line(D, X(3.5), yl, X(3.5), R.y0 + R.h * .2, { col: C.pink, dash: true, w: 2.4, a: a2 }); legend(D, X, R, 1, '中央値 3.5冊', C.pink, a2); }
          if (t > .65) legend(D, X, R, 2, '最頻値 2冊（3人）', C.green, CH.smooth(.65, .8, t), true);
        } },
      { tag: '類題2', q: '(2) 28冊 → 8冊 に直すと、平均値と中央値は？', a: '平均値は 4.0冊に小さくなる。中央値は 3.5冊で変わらない', sub: '合計が 20へって 40 → 40÷10＝4.0。いちばん大きい値が変わっても、5・6番目（3 と 4）は変わらない', dur: 4,

        draw: function (D) {
          var R = CH.box(D, { l: .06, r: .08, t: .1, b: .14 }), s = CH.fs(D), t = D.ph ? D.t : 0, k = CH.ease(CH.smooth(.1, .6, t)), yl = R.y0 + R.h * .72, X = CH.numline(D, CH.rect(R.x0, yl - 10, R.x1, yl), 0, 30, 1, { lab: 5, unit: '（冊）' });
          var vals = B2.slice(0, 9); CH.dots(D, X, yl, vals, { r: s * .5, col: function () { return C.blue; } });
          var v = CH.lerp(28, 8, k); CH.circle(D, X(v), yl - s * .5 * 1.25, s * .5, { fill: 'rgba(255,186,120,.9)', stroke: 'rgba(20,30,24,.8)', sw: 1.2 });
          if (t > .1 && t < .7) CH.arrow(D, X(28), yl - s * 2.2, X(9), yl - s * 2.2, { col: C.orange, a: 1 - CH.smooth(.5, .7, t), w: 2 });

      { tag: '類題2', q: '(3) 直す前のデータで、ふだん読む冊数を表すのは、平均値と中央値の どちら？', a: '中央値', sub: '28冊という かけはなれた値に、平均値は引っぱられて大きくなる（10人中 7人が平均値 6.0冊より少ない）。中央値は、その影響を受けにくい', dur: 3,

          CH.dots(D, X, yl, B2, { r: s * .5, col: function (i, v) { return t > .3 && v < 6 ? C.pink : v === 28 ? C.orange : C.blue; } });

      /* ---------------- 類題3 ---------------- */

      { tag: '類題3', q: '(3) 「8時間以上は どちらも 36人だから、割合も同じ」は正しい？', a: '正しくない', sub: '全体の人数がちがうので、割合（相対度数）でくらべる。1年 36÷120＝0.30、2年 36÷150＝0.24 で、1年生のほうが大きい', dur: 4,
        b: { t: '(3) <b>正しくない</b>　1年 36÷120＝0.30、2年 36÷150＝0.24', col: C.yel },
        draw: function (D) {
          var R = CH.box(D, { l: .22, r: .06, t: .16, b: .2 }), s = CH.fs(D), t = D.ph ? D.t : 0, h = Math.min(R.h * .14, 52), k = CH.smooth(.15, .6, t);

        } },
      /* ---------------- 類題4 ---------------- */
      { tag: '類題4', bh: '類題4　50m走の選手えらび（目的に応じた判断）', q: '学級対抗リレーの選手に、Aさんと Bさんのどちらかを選ぶ。次のヒストグラムは、2人が 50m走を 20回ずつ走った記録である。たとえば 6.8〜7.0 は、6.8秒以上 7.0秒未満を表す。',
        notes: ['(1) 2人の記録の平均値を、階級値を使って求めなさい。', '(2) 「7.2秒未満で走れば 1位になれそう」なとき、どちらを選ぶか。相対度数を使って答えなさい。', '(3) 「7.4秒未満で走れば 決勝に進める」なとき、Bさんを選ぶわけを、データの特徴をもとに説明しなさい。'],
        draw: function (D) { two4(D); } },
      { tag: '類題4', q: '(1) 2人の平均値は？（階級値を使う）', a: 'どちらも 7.35秒', sub: 'A (6.9×3＋7.1×5＋7.3×3＋7.5×4＋7.7×3＋7.9×2)÷20＝147÷20＝7.35、B も 147÷20＝7.35', dur: 2.5,
        b: { t: '(1) 平均値は <b>どちらも 7.35秒</b>（平均値ではきめられない）', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0; two4(D, { mean: t > 0 ? CH.smooth(0, .4, t) : 0 }); } },
      { tag: '類題4', q: '(2) 7.2秒未満で 1位になれそう。どちらを選ぶ？', a: 'Aさん', sub: '7.2秒未満の相対度数　A (3＋5)÷20＝0.40、B 2÷20＝0.10', dur: 2.5,
        b: { t: '(2) 7.2秒未満　A <b>0.40</b>、B 0.10 → <b>Aさん</b>', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0; two4(D, { k: t > 0 ? 2 : 0, lab: t > .3 ? ['7.2秒未満 8回 → 0.40', '7.2秒未満 2回 → 0.10'] : null, la: CH.smooth(.3, .6, t) }); } },
      { tag: '類題4', q: '(3) 7.4秒未満で決勝に進める。Bさんを選ぶわけは？', a: '7.4秒未満の相対度数が Bさんのほうが大きいから', sub: '7.4秒未満　A (3＋5＋3)÷20＝0.55、B (2＋12)÷20＝0.70。B は記録のちらばりが小さく、安定している。目的がちがえば、選ぶ人もちがってよい', dur: 2.5,
        b: { t: '(3) 7.4秒未満　A 0.55、B <b>0.70</b> → Bさん（目的で判断が変わる）', col: C.yel },
        draw: function (D) { var t = D.ph ? D.t : 0; two4(D, { k: t > 0 ? 3 : 0, lab: t > .3 ? ['7.4秒未満 11回 → 0.55', '7.4秒未満 14回 → 0.70'] : null, la: CH.smooth(.3, .6, t) }); } },
      /* ---------------- 類題5 ---------------- */
      { tag: '類題5', bh: '類題5　画びょうの実験（確率）', q: '画びょうを投げて、上向きになった回数を調べた。次の表とグラフは、その結果である。',
        notes: ['(1) 表の ア にあてはまる数を、小数第2位まで求めなさい。', '(2) 上向きになる確率は、およそいくつと考えられるか。', '(3) 5000回投げると、上向きは およそ何回と考えられるか。', '(4) 「上向きになる確率が 0.4 だから、10回投げると、かならず 4回上向きになる」は正しいか。わけも書きなさい。'],
        draw: function (D) { pin5(D, -1); } },
      { tag: '類題5', q: '(1) ア（500回のときの相対度数）は？', a: '0.41', sub: '207 ÷ 500 ＝ 0.414 → 小数第2位まで 0.41', dur: 2,
        b: { t: '(1) ア … 207 ÷ 500 ＝ 0.414 → <b>0.41</b>', col: C.yel },
        draw: function (D) { pin5(D, 0); } },
      { tag: '類題5', q: '(2) 上向きになる確率は？　(3) 5000回では およそ何回？', a: '(2) およそ 0.40　(3) およそ 2000回', sub: '回数がふえると、相対度数は 0.40 の近くで落ち着く。5000 × 0.40 ＝ 2000', dur: 2.5,

        b: { t: '(4) <b>正しくない</b>　確率は 多数回で近づく値。10回で 4回とは かぎらない', col: C.yel },
        draw: function (D) {
          var R = CH.box(D, { l: .14, r: .14, t: .12, b: .16 }), s = CH.fs(D), t = D.ph ? D.t : 0, rh = R.h * .8 / 5, cw = Math.min(R.w * .7 / 10, rh), r = cw * .34;
          CH.text(D, R.cx, R.y0 - s * .3, '10回ずつ、5回ためした例', { col: 'rgba(242,240,230,.8)', size: s * .9 });

          });
          if (t > .75) CH.text(D, R.cx, R.y1 + s * .6, '5回あわせると 50回中 20回 → 0.40', { col: C.green, a: CH.smooth(.75, .9, t) });
        } }

  });

  function table3(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .14, b: .2 });
    var rows = [['1年 度数（人）'].concat(G1, 120), ['1年 相対度数'].concat(R1.map(function (x, i) { return i === 2 ? (k >= 0 ? x : 'ア') : x; }), '1.00'),
      ['2年 度数（人）'].concat(G2, 150), ['2年 累積相対度数'].concat(CR2.map(function (x, i) { return i === 1 ? (k >= 1 ? x : 'イ') : x; }), '')];
    CH.table(D, R, ['睡眠時間（時間）', '5〜6', '6〜7', '7〜8', '8〜9', '9〜10', '合計'], rows, { fw: .26, hl: function (r, c) { return (k === 0 && ((r === 2 && c === 3) || (r === 1 && c === 3))) || (k === 1 && ((r === 4 && c === 2) || (r === 3 && (c === 1 || c === 2)))) ? C.yel : (r === 2 && c === 3) || (r === 4 && c === 2) ? C.pink : null; } });
  }
  function two4(D, o) {
    o = o || {}; var R = CH.box(D, { l: .1, t: .14, b: .16 }), rs = CH.split(D, R, 2, .14);
    [[A4, 'Aさん', C.blue], [B4, 'Bさん', C.orange]].forEach(function (g, j) {
      var Ax = hist(D, rs[j], E4, g[0], { col: g[2], xf: function (v) { return v.toFixed(1); }, xl: '（秒）', yl: '（回）', alpha: o.k ? function (i) { return i < o.k ? 1 : .25; } : null });
      CH.text(D, rs[j].cx, rs[j].y0 + Ax.s * .2, g[1], { col: g[2] });
      if (o.mean) { var a = o.mean, x = Ax.X(7.35); CH.poly(D, [[x, Ax.R.y1 + 2], [x - 8, Ax.R.y1 + 16], [x + 8, Ax.R.y1 + 16]], { fill: C.yel, a: a }); CH.line(D, x, Ax.R.y1, x, Ax.Y(10), { col: C.yel, dash: true, a: a }); CH.text(D, x + 6, Ax.Y(9.6), '平均値 7.35', { col: C.yel, a: a, size: Ax.s, align: 'left', outline: 'rgba(20,30,24,.85)' }); }
      if (o.lab) CH.text(D, rs[j].cx, rs[j].y0 + Ax.s * 1.7, o.lab[j], { col: C.yel, a: o.la, size: Ax.s * 1.05 });
    });
  }
  function pin5(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .14 }), t = D.ph ? D.t : 0;
    CH.table(D, CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .3), ['投げた回数'].concat(N5), [['上向きの回数'].concat(U5), ['相対度数'].concat(R5.map(function (x, i) { return i === 2 && k < 0 ? 'ア' : x; }))], { fw: .2, top: true, hl: function (r, c) { return k === 0 && r === 2 && c === 3 ? C.yel : null; } });
    var G = CH.rect(R.x0 + R.w * .1, R.y0 + R.h * .44, R.x1 - R.w * .04, R.y1);
    var Ax = CH.axes(D, G, { x: [0, 2000], y: [.35, .5], xt: [0, 500, 1000, 1500, 2000], yt: [.35, .4, .45, .5], yf: function (v) { return v.toFixed(2); }, xl: '（回）', yl: '相対度数', cut: true });
    var pts = N5.map(function (n, i) { return [n, U5[i] / n]; });
    if (k < 0) pts = pts.filter(function (p, i) { return i !== 2; });
    CH.path(D, Ax, pts, { col: C.yel, r: 5 });
    if (k === 0 && t > .3) { CH.circle(D, Ax.X(500), Ax.Y(.414), 8, { stroke: C.pink, sw: 2.4, a: CH.smooth(.3, .5, t) }); }
    if (k === 1) { var a = CH.smooth(0, .4, t); CH.line(D, Ax.X(0), Ax.Y(.4), Ax.X(2000), Ax.Y(.4), { col: C.green, dash: true, a: a }); CH.text(D, Ax.X(1980), Ax.Y(.4) + Ax.s * 1.2, 'およそ 0.40', { col: C.green, a: a, align: 'right' }); }
  }
})();
