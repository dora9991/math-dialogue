/* データの比較（箱ひげ図） 第5時：「データの比較」で学んだことを、整理して確かめよう（ikkan の lesson_hako_05 と同じ流れ）。
   2つの組の箱ひげ図で「そろっている」をくらべる。整理図（小さい順 → 中央値で分ける → 前半・後半の中央値 → 箱ひげ図）。
   例題は、ばらばらのカードが小さい順にならび、まん中で分かれ、5つの点が数直線に落ちて箱ひげ図ができるまでを通しで。
   考えようは、9つの点をドラッグして、同じ箱ひげ図になるデータをつくる道具（答えは出さない）。
   データは自作（ikkan と同じ数値）。5つの値は教科書の求め方（中央値で前半・後半に分け、それぞれの中央値。
   個数が奇数のとき、中央値は前半・後半に入れない）で、ページの中で計算し直して照らし合わせている（CH.check）。 */
(function () {
  var C = CH.C;

    r.f = [r.min, r.q1, r.med, r.q3, r.max]; r.iqr = r.q3 - r.q1; r.rng = r.max - r.min; return r;
  }
  function eq5(d, f) { var r = Q5(d); return f.every(function (v, i) { return CH.near(r.f[i], v); }); }
  function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function nf(v) { return String(Math.round(v * 100) / 100); }

  var C1 = [30, 50, 65, 80, 95], C2 = [45, 60, 65, 70, 85], ST = [52, 20, 38, 47, 74, 55, 80, 29, 43, 35], FST = [20, 35, 45, 55, 80];
  var BF = [0, 20, 45, 70, 150], AF = [10, 40, 60, 90, 140], G8 = [6, 11, 4, 9, 13, 8, 5, 16], T9 = [2, 4, 6, 8, 10];

  CH.check([1, 2, 3].every(function (i) { return AF[i] > BF[i]; }) && AF[2] - BF[2] === 15 && AF[1] - BF[1] === 20 && AF[3] - BF[3] === 20, '例題（読書週間の前と後）');
  CH.check(eq5([2, 3, 5, 5, 6, 7, 7, 9, 10], T9) && eq5([2, 4, 4, 6, 6, 6, 6, 10, 10], T9), '考えよう（答えは出さない。ここで確かめるだけ）');
  var Q8 = Q5(G8); CH.check(6 + 11 + 4 + 9 + 13 + 8 + 5 === 56 && CH.sum(G8) === 72 && CH.mean(G8) === 9 && Q8.med === 8.5 && Q8.q1 === 5.5 && Q8.q3 === 12 && Q8.iqr === 6.5, 'チャレンジ');

  var QN = ['第1四分位数', '中央値', '第3四分位数'], QCOL = [C.pink, C.yel, C.green], QC5 = [C.lav, C.pink, C.yel, C.green, C.lav];
  /* 箱ひげ図。X（値 → 横の位置）、cy、bh、f（5つの値）。o：col、a、k（組み立ての進み：前半で箱、後半でひげ）、w */
  function boxplot(D, X, cy, bh, f, o) {
    o = o || {}; var col = o.col || C.chalk, a = o.a == null ? 1 : o.a, k = o.k == null ? 1 : o.k, w = o.w || 2.6, x = f.map(X), kb = CH.smooth(0, .5, k), kw = CH.smooth(.5, 1, k), e = bh * .3;
    if (kw > 0) {

  function brace(D, x0, x1, y, txt, col, a, o) {

    CH.line(D, x0, y, x1, y, lo); CH.line(D, x0, y, x0, y + 7 * d, lo); CH.line(D, x1, y, x1, y + 7 * d, lo);

  }
  function tag(D, x, y, txt, col, a, o) { o = o || {}; CH.text(D, x, y, txt, { col: col, a: a, size: o.size || CH.fs(D, .85), align: o.align, outline: 'rgba(24,52,38,.9)' }); }

  /* 小さい順のカードを、まん中で2つに分け（t1）、前半・後半を それぞれ まん中で分ける（t2）。

  function split(D, R, vals, o) {

      else { var b = s0 + m / 2 - .5; cuts.push({ p: b, w: w, t: t }); mk.push({ k: k, b: b, t: t }); }

    var gw = 0, op = 0; cuts.forEach(function (c) { gw += c.w; op += c.w * c.t; });

    function xc(i) { var off = 0; cuts.forEach(function (c) { if (c.p < i) off += c.w * c.t; }); return x0 + (i + .5 + off) * cw; }
    var cardOf = {}; mk.forEach(function (m) { if (m.i != null) cardOf[m.i] = m; });

    if (o.half && t1 > 0) {
      var ah = CH.smooth(.3, 1, t1), yh = yb + s * .55;
      [[0, h - 1, '前半'], [n - h, n - 1, '後半']].forEach(function (q) {
        var xa = xc(q[0]) - cw * .42, xb = xc(q[1]) + cw * .42, lo = { col: 'rgba(242,240,230,.75)', w: 1.8, a: ah };
        CH.line(D, xa, yh, xb, yh, lo); CH.line(D, xa, yh - 6, xa, yh, lo); CH.line(D, xb, yh - 6, xb, yh, lo);
        CH.text(D, (xa + xb) / 2, yh + ns * .85, q[2] + ' ' + h + '個', { size: ns, a: ah, col: 'rgba(242,240,230,.8)' });
      });
    }
    var xs = vals.map(function (v, i) { return xc(i); });
    vals.forEach(function (v, i) {
      var m = cardOf[i], on = m && m.t > .5, col = on ? QCOL[m.k] : (o.colf && o.colf(i)) || o.col || C.blue, p = o.pos ? o.pos(i, xc, cy, ch) : [xc(i), cy];
      CH.card(D, p[0], p[1], cw * .84, ch, o.txt ? o.txt(i) : v, { col: col, fill: on ? hexA(QCOL[m.k], .32) : null, sw: on ? 2.6 : 1.6, a: on ? 1 : 1 - .45 * CH.smooth(.5, 1, t2), size: Math.min(ch * .55, cw * .5) });
    });
    var out = [];
    mk.forEach(function (m) {
      var a = CH.smooth(.5, 1, m.t); if (a <= 0) return;
      var col = QCOL[m.k], x, v, yl;
      if (m.i != null) { x = xc(m.i); v = vals[m.i]; yl = yt - ns * .8; }

        CH.line(D, x, yt - 3, x, yb + 3, { col: col, w: 2.4, dash: [5, 4], a: a });
        if (v != null) CH.text(D, x, yt - s * .62, nf(v), { col: col, num: true, w: 700, size: s * .9, a: a });
        yl = yt - s * 1.25 - ns * .6;
      }
      if (o.names) CH.text(D, x, yl, o.names[m.k], { col: col, size: ns, a: a * (o.na == null ? 1 : o.na) });

  /* ばらばらのカード orig を、小さい順にならべかえてから（ts：0〜1）、split する。txt(j)：もとの j 番目のカードの字 */
  function sortSplit(D, R, orig, o) {
    var idx = orig.map(function (v, i) { return i; }).sort(function (a, b) { return orig[a] - orig[b] || a - b; }), ts = o.ts == null ? 1 : o.ts, e = CH.ease(ts), p = {};

    return split(D, R, idx.map(function (i) { return orig[i]; }), p);
  }

  /* ---- 考えよう：9つの点をドラッグ ---- */
  var G9 = [1, 2, 3, 4, 5, 6, 7, 8, 9], dragI = null, L9 = null;
  function live() { return L9 && performance.now() - L9.seen < 300; }
  function setupDrag() {
    var cv = document.getElementById('cv'); if (!cv) return;
    function pt(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    function near(p) { var best = -1, bd = 1e9; L9.P.forEach(function (q, i) { var d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < bd) { bd = d; best = i; } }); return bd < Math.max(L9.r * 2.2, 22) ? best : -1; }
    cv.addEventListener('pointerdown', function (e) { if (!live()) return; var i = near(pt(e)); if (i < 0) return; dragI = i; try { cv.setPointerCapture(e.pointerId); } catch (_) { } e.preventDefault(); });

      { tag: '今日の問い', bh: '1組・2組（30人ずつ）の 数学のテストの得点', q: '1組と 2組（どちらも 30人）の、数学のテストの得点の箱ひげ図。どちらの組のほうが、得点が「そろっている」といえるだろう。箱ひげ図から読み取れることを根拠にして、説明しよう。',
        notes: ['① 自分の考え（3分）　どちらの組か。わけを 数で。', '② ペアの考え（3分）　自分とちがう考えを。'],
        draw: function (D) { classes(D, 0); } },
      { tag: '今日の問い', q: '範囲と四分位範囲で くらべると？', a: '範囲 1組 65点・2組 40点、四分位範囲 1組 30点・2組 10点 → 2組のほうが そろっている',
        sub: '中央値は どちらも 65点で同じ。まん中の値が同じでも、散らばりのようすは ちがう', dur: 5,
        b: { t: '範囲 1組 65点・2組 <b>40点</b>　四分位範囲 1組 30点・2組 <b>10点</b> → <b>2組</b>のほうが そろっている', col: C.yel },
        draw: function (D) { classes(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: 'この単元で学んだことを、1つの図に 整理しよう。箱ひげ図は、どんな手順でかく？ 箱とひげは、何を表している？', a: '小さい順にならべる → 中央値で 前半・後半に分ける → それぞれの中央値（第1・第3四分位数）→ 5つの値を 箱ひげ図に',
        sub: '箱の長さ ＝ 四分位範囲、ひげの端から端 ＝ 範囲。4つの部分に、データが 約 25％ずつ入る', dur: 6,
        b: [{ t: '<b>四分位数</b> … 小さい順 → 中央値で分ける → 前半・後半の中央値（第1・第3四分位数）', col: C.green }, { t: '<b>箱ひげ図</b> … 箱の長さ＝<b>四分位範囲</b>、ひげの端から端＝<b>範囲</b>、4つの部分に約 25％ずつ', col: C.green }],
        draw: function (D) { chart(D, D.ph ? D.t : 0); } },
