<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>バスケ指導ナビ</title>
<style>
/* バスケ指導ナビ：見た目。スマホ（体育館）とPC（計画づくり）の両方で使う。暗い画面にも対応。 */
:root {
  --bg: #f6f3ec; --surface: #ffffff; --ink: #1c2430; --muted: #5d6877; --line: #e4ded1; --soft: #efe9dc;
  --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #ffe9dc;
  --c-coaching: #1c5fa8; --c-tactics: #6b3fb5; --c-training: #1f7a4d; --c-other: #5d6877;
  --ok: #1f7a4d; --warn: #a15c07; --bad: #b42318;
  --shadow: 0 1px 2px rgba(20, 25, 35, .06), 0 6px 18px rgba(20, 25, 35, .06);
  --r: 14px; --tabh: 58px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10151c; --surface: #18202b; --ink: #e9edf2; --muted: #9aa6b6; --line: #2a3544; --soft: #202a37;
    --accent: #ff8a4c; --accent-ink: #1a1006; --accent-soft: #3a2518;
    --c-coaching: #6fb0f2; --c-tactics: #b99cf0; --c-training: #58c58d; --c-other: #9ca3af;
    --ok: #58c58d; --warn: #f2b253; --bad: #ff8087; --shadow: none;
  }
}
* { box-sizing: border-box; }
button, a, input, select, textarea, label, summary { touch-action: manipulation; }   /* iPad で、ダブルタップの拡大をさせない */
.vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }   /* ファイルを選ぶ入力（見えないが、押せる） */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", Meiryo, system-ui, sans-serif;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
code { background: var(--soft); border-radius: 6px; padding: 1px 6px; font-size: .92em; }
@media (hover: none) { .btn kbd { display: none; } }
kbd { background: var(--soft); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: .8em; }

/* ---- 枠：上のバー・タブ ---- */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .in { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; flex: none; }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tabs a { padding: 8px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.tabs a[aria-current] { background: var(--accent-soft); color: var(--accent); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 12px; line-height: 20px; text-align: center; }
.badge:empty { display: none; }
.warnchip { margin-left: 8px; font-size: 12px; color: var(--warn); font-weight: 700; }
main { max-width: 980px; margin: 0 auto; padding: 16px; outline: none; }
@media (max-width: 640px) {
  .top .in { justify-content: center; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .tabs a { text-align: center; border-radius: 12px; padding: 10px 2px; font-size: 12.5px; }
  main { padding-bottom: calc(var(--tabh) + 28px + env(safe-area-inset-bottom)); }
}

/* ---- 部品 ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13.5px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; }
.cat { --c: var(--c-other); display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 800; color: var(--c); background: var(--soft); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.c-coaching { --c: var(--c-coaching); } .c-tactics { --c: var(--c-tactics); } .c-training { --c: var(--c-training); }
.tag { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 12.5px; color: var(--muted); background: var(--soft); }
.seg, .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.seg button i { font-style: normal; font-weight: 600; color: var(--muted); margin-left: 6px; font-size: 12.5px; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button.on i { color: inherit; opacity: .85; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.chips button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.search { width: 100%; padding: 10px 14px; margin: 6px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r); padding: 10px 14px; margin-bottom: 12px; font-size: 14.5px; }
.banner.warn { background: transparent; border-color: var(--warn); }
.trail { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.trail b { color: var(--ink); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.lead { color: var(--muted); margin: 4px 0 12px; font-size: 14.5px; }
.pagetitle { font-size: 22px; line-height: 1.35; margin: 4px 0 2px; }
.count { color: var(--muted); font-size: 13px; margin-top: 10px; text-align: right; }
.blk { margin-top: 24px; }
.blk > h2 { font-size: 17px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.blk > h2 small { color: var(--muted); font-weight: 500; font-size: 13px; }
.sub { color: var(--muted); font-size: 13.5px; }
.card-plain .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.card-plain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }

/* ---- ライブラリ ---- */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); margin-top: 6px; }
.card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: inherit; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); }
.card .top1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.card h3 { font-size: 16px; line-height: 1.45; margin: 8px 0 4px; }
.card .sum { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--muted); font-size: 13px; }
.mark-seen { color: var(--ok); font-weight: 800; }
.mark-fav { color: var(--warn); }

/* ---- 動画ページ ---- */
.back { display: inline-block; margin: 2px 0 10px; text-decoration: none; font-weight: 700; }
.vhead h1 { font-size: 21px; line-height: 1.45; margin: 8px 0 10px; }
.vtags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.player { position: relative; background: #000; border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 9; }
.player video { width: 100%; height: 100%; display: block; background: #000; }
.player.none { background: var(--soft); aspect-ratio: auto; padding: 22px 18px; display: grid; place-items: center; text-align: center; }
.player.none p { color: var(--muted); font-size: 14.5px; margin: 6px 0 12px; }
.verr { position: absolute; inset: 0; z-index: 2; background: rgba(0, 0, 0, .88); color: #fff; padding: 16px 18px; overflow: auto; font-size: 14px; }
.verr b { font-size: 16px; }
.verr p { margin: 8px 0; }
.verr code { background: rgba(255, 255, 255, .16); color: #fff; word-break: break-all; }
.verr a { color: #ffb48a; }
.pctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 10px 0 0; }
.grp { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.grp button { border: 0; background: transparent; padding: 8px 11px; font-size: 13.5px; font-weight: 700; min-height: 40px; }
.grp button + button { border-left: 1px solid var(--line); }
.grp button.on { background: var(--accent); color: var(--accent-ink); }
.form { display: grid; gap: 10px; margin-top: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--r); }
.form label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); font-weight: 700; }
.form input, .form select, .form textarea, .pin, .field input, .field select, .set input[type=text], .set input[type=search] { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 400; }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.prose p { margin: 0 0 .8em; }
.prose ul { margin: 0 0 .8em; padding-left: 1.3em; }
.prose li { margin: .15em 0; }
.memo { width: 100%; min-height: 110px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); resize: vertical; }
.vfoot { margin-top: 22px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

/* ---- 見どころ・練習メニュー ---- */
.clips { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.clip { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.clip.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.time { min-width: 62px; min-height: 38px; padding: 0 10px; border-radius: 10px; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
.ctitle { font-weight: 700; line-height: 1.5; }
.ty { display: inline-block; margin-right: 8px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 800; background: var(--soft); color: var(--muted); vertical-align: 1px; }
.ty-drill { background: color-mix(in srgb, var(--c-training) 15%, transparent); color: var(--c-training); }
.ty-play { background: color-mix(in srgb, var(--c-tactics) 15%, transparent); color: var(--c-tactics); }
.ty-point { background: color-mix(in srgb, var(--c-coaching) 15%, transparent); color: var(--c-coaching); }
.mine { margin-left: 8px; font-size: 12px; font-style: normal; color: var(--warn); font-weight: 700; }
.cnote { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: pre-wrap; }
.cmeta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; color: var(--muted); font-size: 13px; }
.cvid { font-size: 13px; margin-top: 1px; }
.cact { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
@media (max-width: 520px) {
  .clip { grid-template-columns: auto 1fr; }
  .cact { grid-column: 1 / -1; flex-direction: row; }
  .cact .btn { flex: 1; }
}

/* ---- 今日の練習 ---- */
.planbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.planbar select { flex: 1 1 220px; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.planhead { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); font-weight: 700; }
.meter { margin: 14px 0; }
.meter .txt { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; flex-wrap: wrap; gap: 4px 12px; }
.meter .bar { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
.meter.over .bar i, .meter.over .rest { background: var(--bad); color: var(--bad); }
.meter.over .rest { background: transparent; }
.items { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.pi { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 6px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.pn { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.pmain { display: grid; gap: 4px; min-width: 0; }
.pin { min-height: 38px; }
.pin.t { font-weight: 700; }
.ptime { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.psub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.pmin { display: flex; align-items: center; gap: 4px; }
.pmin input { width: 58px; text-align: center; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.pmin .btn { min-height: 38px; min-width: 38px; padding: 0; }
.pmv { display: flex; gap: 4px; }
.pmv .btn { min-height: 38px; min-width: 38px; padding: 0; }
@media (max-width: 640px) {
  .pi { grid-template-columns: 30px 1fr; }
  .pmin, .pmv { grid-column: 2; }
  .pmv { justify-content: flex-end; margin-top: -2px; }
}
.adders, .pact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.print-only { display: none; }
.sheet { width: 100%; border-collapse: collapse; margin-top: 10px; }
.sheet th, .sheet td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: top; }
.sheet .mn { width: 3em; text-align: right; }

/* ---- 選ぶ・ダイアログ ---- */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(680px, 94vw); max-height: 90vh; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(10, 14, 20, .55); }
.dlg-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.dlg-h h2 { font-size: 17px; flex: 1; }
.dlg-b { padding: 6px 16px 16px; overflow: auto; max-height: calc(90vh - 70px); }
.dlg-b video { width: 100%; max-height: 62vh; background: #000; border-radius: 12px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pick .pt { flex: 1; min-width: 0; }
.pick .pt small { display: block; color: var(--muted); }

/* ---- 実施モード ---- */
.run-on .top, .run-on .tabs { display: none; }
.run-on main { max-width: 900px; padding-bottom: 28px; }
.run { min-height: calc(100dvh - 32px); display: flex; flex-direction: column; gap: 14px; }
.rtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rtop .sp { flex: 1; }
.rprog { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.rnow { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 20px; text-align: center; box-shadow: var(--shadow); }
.rlabel { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
.rnow h1 { font-size: clamp(24px, 6vw, 38px); line-height: 1.35; margin: 4px 0 6px; }
.rnote { color: var(--muted); white-space: pre-wrap; }
.timer { font-size: clamp(76px, 26vw, 200px); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: .02em; margin: 10px 0; }
.timer.low { color: var(--warn); }
.timer.up { color: var(--bad); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .timer.up { animation: none; } }
.radj { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.rbtns { display: grid; grid-template-columns: 1fr 1.8fr 1fr; gap: 10px; max-width: 560px; margin: 12px auto 0; }
.rbtns .btn { min-height: 64px; font-size: 20px; padding: 8px 6px; }
.rnext { color: var(--muted); text-align: center; }
.rlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.rlist li { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.rlist li.cur { border-color: var(--accent); background: var(--accent-soft); font-weight: 800; }
.rlist li.past { opacity: .55; }
.rlist .m { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- 設定 ---- */
.set .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.set .row input[type=text] { flex: 1 1 260px; }
.set p { font-size: 14.5px; margin-top: 6px; }
.set select { flex: 1 1 260px; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.prep { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; font-size: 14.5px; }
.prep .ok { color: var(--ok); font-weight: 800; margin-right: 10px; }
.prep .ng { color: var(--warn); font-weight: 800; margin-right: 10px; }
.set .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin-top: 8px; }
.set .kv dt { color: var(--muted); }
.set .kv dd { margin: 0; word-break: break-all; }
.set .sub { color: var(--muted); font-size: 13.5px; }

/* ---- トースト ---- */
#toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; max-width: 92vw; padding: 10px 16px; border-radius: 12px; background: #1c2430; color: #fff; font-size: 14.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); transition: opacity .2s, transform .2s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast a { color: #ffb48a; margin-left: 8px; }
@media (min-width: 641px) { #toast { bottom: 24px; } }

/* ---- 印刷（A4）：計画を表にして出す ---- */
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; color: #000; font-size: 12pt; }
  .top, .tabs, #toast, .screen-only, .no-print { display: none !important; }
  .print-only { display: block; }
  main { padding: 0; max-width: none; }
  .print-only h1 { font-size: 18pt; }
  .print-only .review { margin-top: 16px; height: 60mm; border: 1px solid #000; padding: 6px 8px; }
}

</style>
</head>
<body>
<div id="app"></div>
<noscript>JavaScript をオンにしてください。</noscript>
<script>
/* ---- data/sample.js ---- */
/* サンプルのライブラリ（形の見本）。★ここに書いてあるのは、動画の中身ではなく「こう書く」という例だけ。
   自分の動画を入れるときは、このファイルは触らず、data/library.js（または basket-navi.html と同じ場所の library.js）を作る。
   library.js があれば、そちらが優先され、このサンプルは出なくなる。作り方は README を見る。

   1本の動画の書き方：
     id        … 動画ごとに別の文字列（'v001' など）。メモや計画がこの id でひも付くので、あとから変えない
     title     … 動画の名前
     category  … 'coaching'（指導法）／ 'tactics'（戦術）／ 'training'（トレーニング）

<script>
/* ---- js/store.js ---- */
/* バスケ指導ナビ：記録の保存。
   ブラウザの localStorage に入れる（この端末のこのブラウザの中だけ。どこにも送らない）。
   入れるもの：お気に入り・視聴済み・メモ・自分でつけた印・練習計画・実践の回数・再生位置。
   動画やライブラリ（library.js）の中身は、ここには入れない（取り込みを使ったときだけ別の枠に入る）。
   ブラウザの掃除や別の端末では消える／移らないので、設定の「バックアップ」で書き出しておく。 */
(function () {
  'use strict';
  const KEY = 'basketNavi.v1', LIBKEY = 'basketNavi.library.v1';
  const blank = () => ({ v: 1, fav: {}, seen: {}, notes: {}, marks: {}, pos: {}, done: {}, plans: [], cur: null, run: null, base: '', pickMode: '', backedUp: 0 });
  let d = blank(), usable = true, timer = 0;

  const read = key => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { usable = false; return null; } };
  const write = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { usable = false; return false; } };

  const first = read(KEY);
  if (first && typeof first === 'object') d = Object.assign(blank(), first);

  const S = {
    get d() { return d; },
    usable: () => usable,
    save() { clearTimeout(timer); timer = 0; return write(KEY, d); },
    saveSoon() { clearTimeout(timer); timer = setTimeout(S.save, 400); },
    flush() { if (timer) S.save(); },
    exportAll() { return { kind: 'basket-navi-backup', v: 1, savedAt: new Date().toISOString(), data: d }; },
    importAll(o) {
      if (!o || o.kind !== 'basket-navi-backup' || !o.data || typeof o.data !== 'object') throw new Error('このアプリのバックアップではありません');
      d = Object.assign(blank(), o.data);
      S.save();
    },
    mergeAll(o) {   // いまの記録を消さずに足しあわせる（同じ id のものは、いまの記録を優先）。別の端末の記録を持ちこむとき用
      if (!o || o.kind !== 'basket-navi-backup' || !o.data || typeof o.data !== 'object') throw new Error('このアプリのバックアップではありません');
      const b = Object.assign(blank(), o.data), r = { plans: 0, marks: 0 };
      ['fav', 'seen'].forEach(k => Object.keys(b[k] || {}).forEach(id => { d[k][id] = 1; }));
      Object.keys(b.notes || {}).forEach(id => {
        const x = String(b.notes[id] || '');
        if (!x) return;
        if (!d.notes[id]) d.notes[id] = x; else if (d.notes[id].indexOf(x) < 0) d.notes[id] += '\n――\n' + x;
      });
      Object.keys(b.marks || {}).forEach(vid => {
        const have = d.marks[vid] || (d.marks[vid] = []);
        (b.marks[vid] || []).forEach(m => { if (m && m.id && !have.some(h => h.id === m.id)) { have.push(m); r.marks++; } });
        if (!have.length) delete d.marks[vid];
      });
      Object.keys(b.pos || {}).forEach(id => { if (!d.pos[id]) d.pos[id] = b.pos[id]; });
      Object.keys(b.done || {}).forEach(k => {
        const x = b.done[k] || {}, y = d.done[k] || (d.done[k] = { n: 0, last: '' });
        y.n = Math.max(y.n || 0, x.n || 0);
        y.last = (y.last || '') > (x.last || '') ? y.last : (x.last || '');
      });
      (b.plans || []).forEach(p => { if (p && p.id && Array.isArray(p.items) && !d.plans.some(q => q.id === p.id)) { d.plans.push(p); r.plans++; } });
      if (!d.cur && d.plans[0]) d.cur = d.plans[0].id;
      S.save();
      return r;
    },
    wipe() { d = blank(); S.save(); },
    libGet: () => read(LIBKEY),
    libSet: o => write(LIBKEY, o),
    libClear() { try { localStorage.removeItem(LIBKEY); } catch (e) { /* 何もしない */ } }
  };
  window.BN = window.BN || {};
  window.BN.store = S;
  window.addEventListener('pagehide', S.flush);
})();

<script>
/* ---- js/app.js ---- */
/* バスケ指導ナビ：画面とふるまい。ビルド不要（ダブルクリックで開ける）。
   流れ：動画を見る →「ここに印をつける」で見どころを貯める → 練習メニューとして今日の練習に並べる → 体育館で実施モード。
   ① 道具 ② データ ③ ライブラリ ④ 動画ページ ⑤ 練習メニュー ⑥ 今日の練習 ⑦ 実施モード ⑧ 設定 ⑨ ルーター */
(function () {
  'use strict';
  const S = window.BN.store, D = () => S.d;

  /* ===== ① 道具 ===== */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const fmt = t => { t = Math.max(0, Math.floor(+t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(s); };
  const parseT = s => {
    s = String(s == null ? '' : s).normalize('NFKC').trim();
    if (!s) return NaN;
    if (/^\d+(\.\d+)?$/.test(s)) return +s;
    const p = s.split(':');
    if (p.length > 3 || p.some(x => !/^\d+$/.test(x))) return NaN;
    return p.reduce((a, x) => a * 60 + (+x), 0);
  };
  const norm = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase();
  const safeDecode = s => { try { return decodeURI(s); } catch (e) { return s; } };
  const nk = s => String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/\s+/g, '');   // 名前くらべ用（全角半角・大文字小文字・空白を無視）
  const stem = s => String(s).replace(/\.[^./\\]+$/, '');
  const safeUrl = u => { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; };
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const dateJa = s => {
    const m = /^(\d+)-(\d+)-(\d+)$/.exec(s || '');
    if (!m) return s || '';
    return `${m[1]}年${+m[2]}月${+m[3]}日（${'日月火水木金土'[new Date(+m[1], m[2] - 1, +m[3]).getDay()]}）`;
  };

  const hm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
  const RATES = [0.5, 0.75, 1, 1.25, 1.5, 2];

  let toastTimer = 0, toastAt = 0;
  function toast(msg, href, label) {

  }
  function openDlg(html) { const d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); }
  function download(name, text) {

  const readFile = f => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => ng(new Error('ファイルを読めませんでした')); r.readAsText(f); });
  function legacyCopy(t) {

      document.body.appendChild(a); a.select();

  function prose(text) {

    const fl = () => { if (list.length) out.push('<ul>' + list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); list = []; };
    String(text).split('\n').forEach(line => {

  }

  /* ===== ② データ（library.js → 取り込み → サンプル の順に使う） ===== */
  const CATS = [{ id: 'coaching', name: '指導法' }, { id: 'tactics', name: '戦術' }, { id: 'training', name: 'トレーニング' }];
  const TYPES = { point: 'ポイント', drill: '練習', play: 'プレー' };
  let LIB = { categories: CATS, videos: [], config: {} }, SRC = 'sample', VID = {};

  const secs = x => (typeof x === 'string' ? parseT(x) : parseFloat(x)) || 0;   // 90 でも '1:30' でも秒にする
  function clipNorm(c, v, mine, used) {
    const at = Math.max(0, secs(c.at));
    let id = String(c.id || (v.id + '@' + at));
    if (used) { while (used.has(id)) id += '+'; used.add(id); }

  }
  function normalize(raw) {
    const cats = (Array.isArray(raw.categories) && raw.categories.length ? raw.categories : CATS).map(c => ({ id: String(c.id), name: String(c.name || c.id) }));
    const known = new Set(cats.map(c => c.id)), ids = new Set();
    const videos = (Array.isArray(raw.videos) ? raw.videos : []).map((r, i) => {
      let id = String(r.id || 'v' + String(i + 1).padStart(3, '0'));
      while (ids.has(id)) id += '_';
      ids.add(id);
      const tags = Array.isArray(r.tags) ? r.tags : String(r.tags || '').split(/[,、，]/);
      const v = {
        id, title: String(r.title || r.file || '（無題）'), category: known.has(String(r.category)) ? String(r.category) : 'other',
        file: String(r.file || '').replace(/\\/g, '/'), url: safeUrl(r.url), duration: secs(r.duration),
        tags: tags.map(s => String(s).trim()).filter(Boolean), summary: String(r.summary || ''), source: String(r.source || ''), clips: []
      };
      const used = new Set();
      v.clips = (Array.isArray(r.clips) ? r.clips : []).map(c => clipNorm(c, v, false, used)).sort((a, b) => a.at - b.at);
      return v;
    });
    if (videos.some(v => v.category === 'other') && !known.has('other')) cats.push({ id: 'other', name: '未分類' });
    return { title: String(raw.title || ''), config: raw.config || {}, categories: cats, videos };
  }
  function boot() {
    const f = window.BASKET_LIBRARY, imp = S.libGet();
    let raw, src = 'sample';
    if (f && Array.isArray(f.videos)) { raw = f; src = 'library'; }

    LIB.videos.forEach(v => { VID[v.id] = v; });
  }
  function clipsOf(v) {
    const mine = (D().marks[v.id] || []).map(m => clipNorm(m, v, true));
    return v.clips.concat(mine).sort((a, b) => a.at - b.at);
  }
  const findClip = (vid, cid) => { const v = VID[vid]; return v ? (clipsOf(v).find(c => c.id === cid) || null) : null; };
  const catName = id => { const c = LIB.categories.find(x => x.id === id); return c ? c.name : '未分類'; };
  const catBadge = id => `<span class="cat c-${esc(id)}">${esc(catName(id))}</span>`;

  function baseUrl() {
    let b = String(D().base || (LIB.config && LIB.config.videoBase) || './').trim().replace(/\\/g, '/');
    if (/^[A-Za-z]:\//.test(b)) b = 'file:///' + b;
    else if (b.charAt(0) === '/' && location.protocol === 'file:') b = 'file://' + b;
    return b.endsWith('/') ? b : b + '/';
  }
  /* この端末で「選んだ」動画ファイル（iPad など）。アプリを閉じるまで有効。動画の中身は、どこにも送らない・保存しない */
  const ATT = {};   // 動画ID → { url, name }
  function canPath() {   // 「フォルダの場所」から動画を読めるか。公開された https のページ（iPad など）では読めないので、ファイルを選ぶ方式になる
    const m = D().pickMode;

  }
  function videoSrc(v) {
    if (ATT[v.id]) return ATT[v.id].url;
    if (!v.file) return '';
    if (/^(https?|file|blob):/i.test(v.file)) return v.file;
    if (!canPath()) return '';

  }
  function attachFile(vid, file) {
    if (ATT[vid]) URL.revokeObjectURL(ATT[vid].url);
    ATT[vid] = { url: URL.createObjectURL(file), name: file.name };
  }
  function attachMany(files, onlyVid) {   // 1本だけ選んだら、いまの動画にそのまま使う。複数なら、ファイル名でライブラリの動画に割り当てる
    files = Array.from(files);

    const byFile = {}, byStem = {};
    LIB.videos.forEach(v => {
      const base = v.file ? v.file.split('/').pop() : '', sk = nk(base ? stem(base) : v.title);
      if (base) (byFile[nk(base)] = byFile[nk(base)] || []).push(v);

    });
    files.forEach(f => {

  const attachMsg = r => (r.ok.length ? `${r.ok.length}本を用意しました` : '名前が合う動画が見つかりませんでした')

  /* ===== ③ ライブラリ ===== */
  const UI = { cat: 'all', q: '', tag: '', fav: false, unseen: false, dtype: 'drill', dcat: 'all', dq: '', rate: 1 };

    </a>`;
  }
  function trail() {
    const st = D(), total = LIB.videos.length;
    const seen = LIB.videos.filter(v => st.seen[v.id]).length;

    const rv = $('#rv'); if (!rv) return;
    rv.addEventListener('loadedmetadata', () => { rv.currentTime = Math.min(it.at || 0, rv.duration || 0); const pr = rv.play(); if (pr && pr.catch) pr.catch(() => {}); });
    rv.addEventListener('error', () => { rv.insertAdjacentHTML('afterend', '<p class="lead">動画を開けませんでした。動画ページで原因を確認できます。</p>'); });
  };

  /* ===== ⑧ 設定・データ ===== */
  function parseLib(txt) {
    const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('ライブラリの形ではありません');
    const o = JSON.parse(txt.slice(a, b + 1));
    if (!o || !Array.isArray(o.videos)) throw new Error('videos がありません');
    return o;
  }
  function pageSettings() {
    const st = D(), imp = S.libGet();
    const nMarks = Object.keys(st.marks).reduce((a, k) => a + st.marks[k].length, 0), nNotes = Object.keys(st.notes).length;
    const hasData = nMarks + nNotes + st.plans.length > 0;
    const stale = hasData && (!st.backedUp || Date.now() - st.backedUp > 14 * 864e5);
    const srcName = { sample: 'サンプル', library: 'library.js（このHTMLと同じフォルダ）', imported: '取り込んだライブラリ（このブラウザの中）' }[SRC];
    $('#main').innerHTML = `
      <h1 class="pagetitle">設定・データ</h1>
      <div class="set">
        ${S.usable() ? '' : '<div class="banner warn"><b>この環境では、記録を保存できません。</b>（プライベートブラウズなど）通常のウィンドウで開いてください。</div>'}
        ${stale ? '<div class="banner warn"><b>バックアップがしばらくありません。</b> メモ・印・計画は、このブラウザの中にだけあります。下の「書き出す」で保存しておくと安心です。</div>' : ''}
        <section class="blk card-plain">
          <h2>いま表示しているデータ</h2>
          <dl class="kv"><dt>データの元</dt><dd>${esc(srcName)}</dd><dt>動画</dt><dd>${LIB.videos.length}本</dd><dt>動画の場所</dt><dd><code>${esc(baseUrl())}</code></dd><dt>この端末の記録</dt><dd>メモ ${nNotes}・印 ${nMarks}・計画 ${st.plans.length}</dd></dl>
          ${SRC === 'sample' ? `<p><b>自分の動画を入れるには</b>（パソコンのターミナルで、1行）</p>
            <ul>
              <li>iCloud Drive の動画：<code>python3 tools/make_library.py setup --icloud "フォルダ名" --open</code></li>
              <li>それ以外のフォルダ（OneDrive など）：<code>python3 tools/make_library.py setup "動画のフォルダ" --open</code></li>
            </ul>
            <p class="sub">動画のフォルダに <code>library.js</code>（動画の一覧）と <code>basket-navi.html</code> ができて、ブラウザで開きます。一覧の Excel からも作れます。くわしくは README を見てください。スマホ・タブレットなら、下の「ライブラリの取り込み」も使えます。</p>` : ''}
          ${SRC === 'library' && imp ? '<p class="sub">取り込んだライブラリもありますが、<code>library.js</code> のほうを優先しています。</p>' : ''}
        </section>
        <section class="blk card-plain">
          <h2>動画の場所</h2>
          <p class="sub">ふつうは触らなくてOK（<code>basket-navi.html</code> と同じ場所を見ます）。別の場所に置いたときだけ、動画のフォルダの場所を入れます。例：<code>file:///Users/○○/Library/Mobile Documents/com~apple~CloudDocs/バスケ動画/</code>（iCloud Drive）　<code>file:///Users/○○/Library/CloudStorage/OneDrive-Personal/バスケ動画/</code>　<code>C:\\Users\\○○\\OneDrive\\バスケ動画</code></p>
          <div class="row"><input id="base" type="text" value="${esc(st.base)}" placeholder="（空 = このHTMLと同じ場所）" aria-label="動画の場所"><button class="btn" data-act="savebase">保存</button><button class="btn ghost" data-act="resetbase">もどす</button></div>
          <div class="row"><label class="sub" for="pickmode">動画の読み込み方</label>
            <select id="pickmode"><option value="" ${st.pickMode ? '' : 'selected'}>自動</option><option value="on" ${st.pickMode === 'on' ? 'selected' : ''}>ファイルを選んで再生（iPad・スマホ向け）</option><option value="off" ${st.pickMode === 'off' ? 'selected' : ''}>フォルダの場所から再生（パソコン向け）</option></select></div>
          <p class="sub">自動：このHTMLをパソコンで開いているときは「フォルダの場所」から、公開されたページ（https。iPad など）では「ファイルを選んで」再生します。いまは <b>${canPath() ? 'フォルダの場所から' : 'ファイルを選んで'}</b> です。</p>
        </section>
        <section class="blk card-plain">
          <h2>ライブラリの取り込み（iPad・スマホ向け）</h2>
          <p class="sub">パソコンで作った <code>library.js</code>（または <code>.json</code>）を、この端末のブラウザに取り込みます。中身はこの端末の中にだけ入り、どこにも送られません。</p>
          <div class="row"><label class="btn" for="ldlib">ファイルを選ぶ…</label><input id="ldlib" class="vh" type="file">${imp ? '<button class="btn danger" data-act="dellib">取り込みを消す</button>' : ''}</div>
        </section>
        <section class="blk card-plain">
          <h2>バックアップ</h2>
          <p class="sub">お気に入り・視聴済み・メモ・印・計画・実践の記録を、ファイルに書き出します。最後のバックアップ：${st.backedUp ? esc(new Date(st.backedUp).toLocaleString('ja-JP')) : 'まだありません'}</p>
          <div class="row"><button class="btn primary" data-act="dlbackup">書き出す</button><label class="btn" for="ldbackup">読み込む（足しあわせ）</label><label class="btn ghost" for="ldbackupr">読み込む（置きかえ）</label><input id="ldbackup" class="vh" type="file"><input id="ldbackupr" class="vh" type="file"></div>
          <p class="sub">パソコンと iPad で記録を行き来させるときは「足しあわせ」（いまの記録は消えません）。AirDrop や iCloud Drive でファイルを送れます。</p>
        </section>
        <section class="blk card-plain">
          <h2>うまくいかないとき</h2>
          <p class="sub"><b>サンプルのまま変わらない</b>：<code>library.js</code> を <code>basket-navi.html</code> と<b>同じフォルダ</b>に置いたか確認。それでもだめなら、<code>library.js</code> の中身が壊れている（カンマや引用符の消えなど）かもしれません。<code>make_library.py</code> で作り直すと確実です（手で書いた部分は残ります）。</p>
          <p class="sub"><b>動画が出ない</b>：動画のページに、探した場所と原因の候補が出ます。OneDrive・iCloud Drive の「オンラインのみ」と、ブラウザで再生できない形式（.mov / .avi / .wmv）が多いです。ブラウザは Chrome か Edge がおすすめです。</p>
        </section>
        <section class="blk card-plain">
          <h2>使いかた（キー操作）</h2>
          <p class="sub">動画ページ：<kbd>M</kbd> 印をつける ／ <kbd>←</kbd><kbd>→</kbd> 5秒移動 ／ <kbd>Space</kbd> 再生・停止　実施モード：<kbd>Space</kbd> スタート・一時停止</p>
        </section>
        <section class="blk card-plain">
          <h2>記録を消す</h2>
          <p class="sub">この端末のお気に入り・メモ・印・計画・実践の記録をすべて消します（元に戻せません）。動画ファイルや <code>library.js</code> は消えません。</p>
          <div class="row"><button class="btn danger" data-act="wipe">すべての記録を消す</button></div>
        </section>
      </div>`;
  }
  A.savebase = () => { D().base = $('#base').value.trim(); S.save(); toast('動画の場所を保存しました'); pageSettings(); };
  A.resetbase = () => { D().base = ''; S.save(); pageSettings(); };
  A.dlbackup = () => { download('basket-navi-backup-' + today() + '.json', JSON.stringify(S.exportAll(), null, 1)); D().backedUp = Date.now(); S.save(); pageSettings(); };
  A.dellib = () => { if (!confirm('取り込んだライブラリを消しますか？（メモや印は消えません）')) return; S.libClear(); boot(); pageSettings(); };
  A.wipe = () => { if (!confirm('この端末の記録（お気に入り・メモ・印・計画・実践）をすべて消します。元に戻せません。よろしいですか？')) return; S.wipe(); updateBadge(); pageSettings(); toast('記録を消しました'); };

  /* ===== ⑨ ルーター・イベント ===== */
  const BALL = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#c2410c"/><path d="M16 2v28M2 16h28M5.5 6.5c5 4 5 15 0 19M26.5 6.5c-5 4-5 15 0 19" fill="none" stroke="#1c2430" stroke-width="1.6" stroke-linecap="round"/></svg>';
  function shell() {
    $('#app').innerHTML = `<header class="top"><div class="in"><a class="brand" href="#/" aria-label="バスケ指導ナビ ホーム">${BALL}<span>バスケ指導ナビ</span></a>
      <nav class="tabs" aria-label="メニュー"><a href="#/" data-tab="lib">ライブラリ</a><a href="#/drills" data-tab="drills">練習メニュー</a><a href="#/plan" data-tab="plan">今日の練習<span class="badge" id="badge"></span></a><a href="#/settings" data-tab="settings">設定</a></nav>
      ${S.usable() ? '' : '<span class="warnchip">保存できない環境です</span>'}</div></header>
      <main id="main" tabindex="-1"></main><div id="toast" role="status" aria-live="polite"></div><dialog id="dlg"></dialog>
      <input id="vfile" class="vh" type="file" accept="video/*" multiple aria-label="動画ファイルを選ぶ"><input id="ldplan" class="vh" type="file" aria-label="計画ファイルを選ぶ">`;
    const dg = $('#dlg');
    dg.addEventListener('click', e => { if (e.target === dg) dg.close(); });
    dg.addEventListener('close', () => { dg.innerHTML = ''; });
  }
  function route() {
    if (teardown) { try { teardown(); } catch (e) { /* 後始末の失敗は無視 */ } teardown = null; }
    const dg = $('#dlg'); if (dg && dg.open) dg.close();
    document.body.classList.remove('run-on');
    CURV = null;
    if (Date.now() - toastAt > 600) { const t = $('#toast'); if (t) t.classList.remove('on'); }
    const h = location.hash || '#/', qi = h.indexOf('?'), path = qi < 0 ? h : h.slice(0, qi), q = new URLSearchParams(qi < 0 ? '' : h.slice(qi + 1));
    let tab = 'lib', m;
    if ((m = /^#\/v\/(.+)$/.exec(path))) pageVideo(decodeURIComponent(m[1]), q);
    else if (path === '#/drills') { tab = 'drills'; pageDrills(); }
    else if (path === '#/plan') { tab = 'plan'; pagePlan(); }
    else if (path === '#/run') { tab = 'plan'; pageRun(); }
    else if (path === '#/settings') { tab = 'settings'; pageSettings(); }
    else pageLibrary();
    $$('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    updateBadge();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = A[el.dataset.act]; if (f) f(el, e);
  });
  document.addEventListener('submit', e => { if (e.target.id === 'markForm') { e.preventDefault(); saveMark(e.target); } });
  document.addEventListener('input', e => {
    const t = e.target, st = D();
    if (t.id === 'q') { UI.q = t.value; renderVList(); }
    else if (t.id === 'dq') { UI.dq = t.value; renderDrills(); }
    else if (t.id === 'pickq') renderPick();
    else if (t.id === 'vnote' && CURV) { if (t.value) st.notes[CURV.id] = t.value; else delete st.notes[CURV.id]; S.saveSoon(); }
    else if (t.id === 'review' && R.p) { R.p.review = t.value; S.saveSoon(); }
    else if (t.dataset && t.dataset.pf) {
      const p = curPlan(); if (!p) return;
      const k = t.dataset.pf;
      p[k] = t.type === 'number' ? (parseInt(t.value, 10) || 0) : t.value;
      S.saveSoon(); refreshMeta(p);
    } else if (t.closest && t.closest('#items')) {
      const li = t.closest('.pi'), p = curPlan(); if (!li || !p) return;
      const it = p.items[+li.dataset.i]; if (!it) return;
      if (t.classList.contains('t')) it.title = t.value;
      else if (t.classList.contains('n')) it.note = t.value;
      else if (t.classList.contains('m')) { it.minutes = Math.max(0, Math.min(180, parseInt(t.value, 10) || 0)); refreshMeta(p); }
      S.saveSoon();
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'planSel') { D().cur = t.value; S.save(); pagePlan(); }
    else if (t.name === 'type' && t.closest('#markForm')) syncMarkForm();
    else if (t.id === 'pickmode') { D().pickMode = t.value; S.save(); toast('動画の読み込み方を変えました'); pageSettings(); }
    else if (t.id === 'vfile' && t.files.length) {
      const res = attachMany(t.files, t.dataset.vid || '');
      t.value = '';
      toast(attachMsg(res));
      if (res.ok.length) { if ($('#dlg').open && R.p && document.body.classList.contains('run-on')) A.rvideo(); else route(); }
    } else if (t.id === 'ldplan' && t.files[0]) {
      readFile(t.files[0]).then(importPlan).catch(err => toast('読み込めませんでした：' + err.message));
      t.value = '';
    } else if (t.id === 'ldbackup' && t.files[0]) {   // 足しあわせ（いまの記録は消えない）
      readFile(t.files[0]).then(txt => {
        const r = S.mergeAll(JSON.parse(txt)); route();
        toast(`記録を足しあわせました（計画 +${r.plans}・印 +${r.marks}）`);
      }).catch(err => toast('読み込めませんでした：' + err.message));
      t.value = '';
    } else if (t.id === 'ldbackupr' && t.files[0]) {   // 置きかえ
      readFile(t.files[0]).then(txt => {
        if (!confirm('いまの記録を、このバックアップで置きかえます。よろしいですか？')) return;
        S.importAll(JSON.parse(txt)); route(); toast('記録を読み込みました（置きかえ）');
      }).catch(err => toast('読み込めませんでした：' + err.message));
      t.value = '';
    } else if (t.id === 'ldlib' && t.files[0]) {
      readFile(t.files[0]).then(txt => {
        const o = parseLib(txt);
        if (!S.libSet(o)) throw new Error('保存できませんでした（大きすぎるか、保存が許可されていません）');
        boot(); route(); toast(`ライブラリを取り込みました（${LIB.videos.length}本）`);
      }).catch(err => toast('取り込めませんでした：' + err.message));
      t.value = '';
    }
  });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    const tg = e.target, tn = tg && tg.tagName;
    if (tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT' || (tg && tg.isContentEditable) || $('dialog[open]')) return;
    const vp = $('#vp');
    if (CURV && vp) {
      if (e.key === 'm' || e.key === 'M') { e.preventDefault(); openMarkForm(); }
      else if (e.key === 'ArrowLeft' && tg !== vp) { e.preventDefault(); vp.currentTime = Math.max(0, vp.currentTime - 5); }
      else if (e.key === 'ArrowRight' && tg !== vp) { e.preventDefault(); vp.currentTime += 5; }
      else if (e.key === ' ' && tg === document.body) { e.preventDefault(); if (vp.paused) vp.play(); else vp.pause(); }
      else if (e.key === '[' || e.key === ']') {
        const i = Math.max(0, Math.min(RATES.length - 1, RATES.indexOf(UI.rate) + (e.key === ']' ? 1 : -1)));
        A.rate({ dataset: { r: RATES[i] } });
      }
    } else if (R.p && document.body.classList.contains('run-on') && !R.fin && e.key === ' ' && tg === document.body) {
      e.preventDefault(); A.rtoggle();
    }
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeprint', () => { const p = curPlan(); if (p) refreshPrint(p); });   // Ctrl+P で直接印刷しても、いまの内容で出る

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* できなくても動く */ }   // iPad などで、記録が勝手に消されにくくなる（できれば）
  boot();
  shell();
  route();
})();

</script>
</body>
</html>
