<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>直角三角形の合同で証明</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script src="../heikou/js/geo.js"></script>
<script>
/* 三角形と四角形 第6時：直角三角形の合同を使って、証明しよう（ikkan の lesson_sankaku_06 と同じ流れ）。
   図の座標・数値は ikkan のデータ（自作）をもとにした。証明の行は GE.proof が座標で確かめ、考えようの長さは座標から計算する。
   角の二等分線の上で点 P を動かしても、PA＝PB。直角・斜辺・もう1つ の順に光る。 */
(function () {
  var C = CH.C, R = Math.PI / 180;
  /* ---- このページの道具 ---- */
  function box(D, o) { return CH.box(D, o || { l: .06, r: .06, t: .1, b: .12 }); }
  function ext(F, Q) { return Object.assign({}, F, { P: Object.assign({}, F.P, Q), X: function (p) { return F.X(typeof p === 'string' && Q[p] ? Q[p] : p); } }); }
  function say(D, x, y, s, o) { o = o || {}; var size = o.size || CH.fs(D), g = D.ctx; g.save(); g.font = '600 ' + size + 'px "Klee One",sans-serif'; var w = g.measureText(s).width; g.restore(); if (o.maxW && w > o.maxW) size *= o.maxW / w; CH.text(D, x, y, s, Object.assign({}, o, { size: size })); }
  function bisDir(V, P, Q) { var a = GE.sub(P, V), b = GE.sub(Q, V), la = Math.hypot(a[0], a[1]), lb = Math.hypot(b[0], b[1]); return [a[0] / la + b[0] / lb, a[1] / la + b[1] / lb]; }

  /* ---- 角の二等分線：O が頂点、OP（x 軸）が二等分線、∠POA＝th°、OP＝p。A、B は P から OX、OY への垂線の足 ---- */
  var TH = Math.acos(.8) / R;   /* OA＝4、PA＝3、OP＝5 */
  function bis(p) { var u = [Math.cos(TH * R), Math.sin(TH * R)], oa = p * u[0]; return { O: [0, 0], P: [p, 0], A: [oa * u[0], oa * u[1]], B: [oa * u[0], -oa * u[1]], X: [6.6 * u[0], 6.6 * u[1]], Y: [6.6 * u[0], -6.6 * u[1]] }; }
  var BI = bis(5);
  CH.check(GE.verify(BI, 'PA＝PB＝3') && GE.verify(BI, 'OA＝OB＝4') && GE.verify(BI, 'OP＝5') && GE.verify(BI, 'PA⊥OX') && GE.verify(BI, 'PB⊥OY') && GE.verify(BI, '∠POA＝∠POB'), '角の二等分線の図（3・4・5）');
  [2.5, 4, 6].forEach(function (p) { CH.check(GE.verify(bis(p), 'PA＝PB'), 'P を動かしても PA＝PB（OP＝' + p + '）'); });
  var DIR = { O: 'w', X: 'ne', Y: 'se', P: 'e', A: 'nw', B: 'sw' };
  function bisFig(F, o) {
    o = o || {};
    GE.figure(F, { segs: ['OX', 'OY', 'OP', 'PA', 'PB'], rights: ['OAP', 'OBP'], angs: o.arcs === false ? [] : [['POA', 1], ['POB', 1]], ticks: o.ticks ? [['PA', 1], ['PB', 1]] : [], dir: DIR });
  }

  var def6 = {
    id: '第6時 今日の問い', lv: 1, ttl: '角の二等分線上の点', q: 'OP は ∠XOY の二等分線、PA⊥OX、PB⊥OY のとき、PA＝PB を証明しよう。', P: BI,
    fig: { segs: ['OX', 'OY', 'OP', 'PA', 'PB'], rights: ['OAP', 'OBP'], angs: [['POA', 1], ['POB', 1]], dir: DIR },
    hyp: '∠POA＝∠POB、PA⊥OX、PB⊥OY', goal: 'PA＝PB', tri: ['POA', 'POB'],
    plan: { q: 'PA と PB には、どんな関係がある？ それを示すには、どの三角形の合同を示す？', a: 'PA＝PB。△POA と △POB', sub: '点 P を二等分線の上のどこにとっても、PA＝PB' },
    L: [{ t: '△POA と △POB で' },
      { t: '∠PAO＝∠PBO＝90°', r: '仮定', n: 1 },
      { t: '∠POA＝∠POB', r: '仮定（OP は ∠XOY の二等分線）', n: 2 },
      { t: 'OP は共通', n: 3, q: '③ もう1組、等しいものは？', a: 'OP は共通（斜辺）' },
      { t: '①②③より、直角三角形の斜辺と1つの鋭角が、それぞれ等しいので', c: 'HA' },
      { t: '△POA≡△POB' },
      { t: 'PA＝PB', r: '合同な図形の対応する辺は等しい', ask: 'r' }]
  };
  var S6 = GE.proof(def6, { tag: '今日の問い' }).slice(1);
  S6[0].dur = 4; S6[0].b = [{ t: '【結論】PA＝PB', col: C.blue }, { t: '△POA と △POB で' }];
  S6[0].draw = function (D) {
    var F0 = GE.fit(D, box(D), BI), t = D.ph ? D.t : 0, p = 5 - 2.4 * Math.sin(Math.PI * CH.smooth(0, .75, t)), F = ext(F0, bis(p));
    if (t > .75) { GE.poly(F, 'POA', { col: C.blue, fa: .2 * CH.smooth(.75, .9, t), stroke: false }); GE.poly(F, 'POB', { col: C.orange, fa: .2 * CH.smooth(.75, .9, t), stroke: false }); }
    bisFig(F, { ticks: D.ph });
    if (D.ph) { GE.seg(F, 'PA', { col: C.yel, w: 4.5, glow: true }); GE.seg(F, 'PB', { col: C.yel, w: 4.5, glow: true }); }
  };

  /* ---- 例題：逆（PA＝PB ならば 二等分線） ---- */
  var defE = {
    id: '第6時 例題', lv: 1, ttl: '例題　2辺までのきょりが等しい点', q: 'PA⊥OX、PB⊥OY、PA＝PB である。OP は ∠XOY の二等分線であることを証明しよう。', P: BI,
    fig: { segs: ['OX', 'OY', 'OP', 'PA', 'PB'], rights: ['OAP', 'OBP'], ticks: [['PA', 1], ['PB', 1]], dir: DIR },
    hyp: 'PA⊥OX、PB⊥OY、PA＝PB', goal: '∠POA＝∠POB', tri: ['POA', 'POB'],
    notes: ['今日の問いの、仮定と結論を入れかえたもの（逆）'],
    L: [{ t: '△POA と △POB で' },
      { t: '∠PAO＝∠PBO＝90°', r: '仮定', n: 1 },
      { t: 'PA＝PB', r: '仮定', n: 2 },
      { t: 'OP は共通', n: 3, q: '③ もう1組、等しいものは？', a: 'OP は共通（斜辺）' },
      { t: '①②③より、直角三角形の斜辺と他の1辺が、それぞれ等しいので', c: 'HL' },
      { t: '△POA≡△POB' },
      { t: '∠POA＝∠POB', r: '合同な図形の対応する角は等しい', ask: 'r' }]
  };
  var SE = GE.proof(defE, { tag: '例題' });
  SE[SE.length - 1].sub = 'だから、OP は ∠XOY の二等分線（今日の問いの逆も正しい）';

  /* ---- 考えよう：∠B、∠C の二等分線の交点 I から 3辺へのきょり ---- */
  function inc(ax) {
    var P = { A: [ax, 32], B: [0, 0], C: [62, 0] };
    P.I = GE.meet(P.B, GE.add(P.B, bisDir(P.B, P.A, P.C)), P.C, GE.add(P.C, bisDir(P.C, P.A, P.B)));
    P.D = GE.foot(P.I, P.B, P.C); P.E = GE.foot(P.I, P.C, P.A); P.F = GE.foot(P.I, P.A, P.B); return P;
  }
  CH.check([8, 15, 40, 55].every(function (x) { var P = inc(x); return GE.verify(P, 'ID＝IE＝IF') && GE.verify(P, '∠BAI＝∠IAC'); }), '考えよう：I から 3辺へのきょり');

  /* ---- チャレンジ：M は BC の中点、MD⊥AB、ME⊥AC、MD＝ME ならば AB＝AC ---- */
  var PM = { A: [0, 5], B: [-3, 0], C: [3, 0], M: [0, 0] }; PM.D = GE.foot(PM.M, PM.A, PM.B); PM.E = GE.foot(PM.M, PM.A, PM.C);
  var defC = {
    id: '第6時 チャレンジ', lv: 2, ttl: 'チャレンジ　二等辺三角形になる',
    q: 'M は辺 BC の中点。M から辺 AB、AC に垂線 MD、ME をひくと、MD＝ME になった。このとき、△ABC は二等辺三角形であることを証明しよう。', P: PM,
    fig: { segs: ['AB', 'BC', 'CA', 'MD', 'ME'], ticks: [['BM', 1], ['MC', 1], ['MD', 2], ['ME', 2]], rights: ['MDB', 'MEC'], dots: ['M'], dir: { M: 's', D: 'w', E: 'e' } },
    alias: { B: 'ABC', C: 'ACB' }, hyp: 'BM＝CM、MD⊥AB、ME⊥AC、MD＝ME', goal: 'AB＝AC', tri: ['BMD', 'CME'],
    notes: ['ヒント：MD、ME をふくむ直角三角形で、斜辺はどの辺？'],
    L: [{ t: '△BMD と △CME で' },
      { t: '∠BDM＝∠CEM＝90°', r: '仮定', n: 1 },
      { t: 'BM＝CM', r: '仮定（M は BC の中点）', n: 2 },
      { t: 'MD＝ME', r: '仮定', n: 3 },
      { t: '①②③より、直角三角形の斜辺と他の1辺が、それぞれ等しいので', c: 'HL' },
      { t: '△BMD≡△CME' },
      { t: '∠B＝∠C', r: '合同な図形の対応する角は等しい', ask: 'r' },
      { t: 'AB＝AC', r: '2つの角が等しい三角形は、二等辺三角形', ask: 'r' }]
  };

  var steps = [
    { tag: '今日の問い', bh: '角の二等分線と、点 P から2辺への垂線', q: 'OP は ∠XOY の二等分線、PA⊥OX、PB⊥OY である。PA と PB の長さには、どんな関係があるだろう。そのわけも考えよう。',
      notes: ['① 自分の考え（3分）　関係とわけを書こう。', '② ペアの考え（3分）　自分とちがう考えは？'],
      b: [{ t: '【仮定】∠POA＝∠POB、PA⊥OX、PB⊥OY', col: C.blue }],
      draw: function (D) { var F = GE.fit(D, box(D), BI); bisFig(F); } }
  ].concat(S6).concat([
    { tag: 'ことば', bh: 'ことば', q: '直角三角形の合同を使う証明では、どんな3つを示す？', a: '直角・斜辺・もう1つ（鋭角か他の1辺）', sub: '① どちらも直角三角形　② 等しい辺が、どちらも斜辺　③ 1つの鋭角 か 他の1辺 が等しい', dur: 3,
      b: [{ t: '直角三角形の合同を使う証明 … ① どちらも <b>直角</b> 三角形', col: C.green }, { t: '② 等しい辺が、どちらも <b>斜辺</b>　③ もう1つ、<b>鋭角</b> か <b>他の1辺</b> が等しい', col: C.green }],
      draw: function (D) {
        var F = GE.fit(D, box(D), BI), t = D.ph ? D.t : 0, k = function (a) { return D.ph ? CH.smooth(a, a + .15, t) : 0; };
        GE.poly(F, 'POA', { col: C.blue, fa: .15, stroke: false }); GE.poly(F, 'POB', { col: C.orange, fa: .15, stroke: false });
        bisFig(F, { arcs: false });
        GE.right(F, 'OAP', { col: C.pink, w: 3.2, a: k(.05), fill: true }); GE.right(F, 'OBP', { col: C.pink, w: 3.2, a: k(.05), fill: true });
        GE.seg(F, 'OP', { col: C.yel, w: 5, glow: true, a: k(.35) }); var m = F.X([2.5, 0]); say(D, m[0], m[1] - F.s * .8, '斜辺', { col: C.yel, a: k(.35), size: F.s * .9 });
        GE.arc(F, 'POA', { col: C.green, fill: .45, r: F.s * 1.7, a: k(.65) }); GE.arc(F, 'POB', { col: C.green, fill: .45, r: F.s * 1.7, a: k(.65) });
        GE.seg(F, 'PA', { col: C.green, w: 4, a: k(.65) * .6 }); GE.seg(F, 'PB', { col: C.green, w: 4, a: k(.65) * .6 });
        if (D.ph) say(D, F.R.cx, F.R.y1 + F.s * .2, ['① 直角', '② 斜辺', '③ 鋭角 か 他の1辺'][t < .35 ? 0 : t < .65 ? 1 : 2], { col: [C.pink, C.yel, C.green][t < .35 ? 0 : t < .65 ? 1 : 2], size: F.s });
      } }
  ]).concat(SE).concat([
    { tag: '考えよう', q: '△ABC の ∠B、∠C の二等分線が点 I で交わる。I から 3辺 BC、CA、AB に垂線 ID、IE、IF をひいて、長さを調べよう。気づいたことと、そのわけを考えよう。',
      notes: ['ID、IE、IF をはかって、表にまとめよう。', 'なぜそうなるのか、今日の問いを使って考えよう。', 'スライダーで、点 A を動かしたり、長さを表示したりできます。'],
      sliders: [{ key: 'ax', label: '点 A の位置', min: 4, max: 58, step: 1, val: 15, fmt: function (x) { return String(x); } }, { key: 'm', label: '長さを表示', min: 0, max: 1, step: 1, val: 0, fmt: function (x) { return x ? 'する' : 'しない'; } }],
      draw: function (D) {
        var P = inc(D.V.ax), F = ext(GE.fit(D, box(D, { l: .06, r: .06, t: .06, b: .14 }), { p: [-2, -2], q: [64, 34] }, { pad: .04 }), P);
        GE.figure(F, { segs: ['AB', 'BC', 'CA', 'BI', 'CI'], dots: ['I'], labels: ['A', 'B', 'C'], dir: { A: 'n', B: 'sw', C: 'se' } });
        GE.arc(F, 'ABI', { r: F.s * 1.6 }); GE.arc(F, 'IBC', { r: F.s * 1.6 }); GE.arc(F, 'ACI', { n: 2, r: F.s * 1.6 }); GE.arc(F, 'ICB', { n: 2, r: F.s * 1.6 });
        [['ID', 'IDC'], ['IE', 'IEC'], ['IF', 'IFA']].forEach(function (g) { GE.seg(F, g[0], { col: C.yel, w: 2.6 }); GE.right(F, g[1], { col: C.yel }); });
        GE.labels(F, ['I', 'D', 'E', 'F'], { dir: { I: 'n', D: 's', E: 'ne', F: 'nw' } });
        if (D.V.m) say(D, F.R.cx, F.R.y1 + F.s * .9, 'ID ' + CH.f1(GE.len(P, 'ID')) + '　IE ' + CH.f1(GE.len(P, 'IE')) + '　IF ' + CH.f1(GE.len(P, 'IF')) + '（mm）', { col: C.yel, maxW: F.R.w });
      } }
  ]).concat(GE.proof(defC, { tag: 'チャレンジ' }));

  K3.run({
    no: '第6時', title: '直角三角形の合同を使って、証明しよう', flat: true, hint: '', alt: '図形の図',
    links: [{ href: 'index.html', label: '目次' }, { href: '05.html', label: '◀ 第5時' }, { href: '07.html', label: '第7時 ▶' }],
    steps: steps
  });
})();
</script>
</body>
</html>
