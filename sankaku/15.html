(function () {

  /* ---- このページの道具 ---- */

  /* GE.proof に、行ごとの色分けを足す（L の行の hl: ['…', '…'] を、黄・ピンク…で光らせる。△ はうすくぬる。fa でぬりの濃さ、ex で図を足す） */

      s.draw = function (D) {

        if (s.a && !D.ph && ask !== 'r') return;

  var L0 = { A: [0, 3.4], B: [0, 0], C: [6, 0], D: [6, 3.4], P: [2.4, 3.4], Q: [3.6, 1.7], R: [2.8, 0] };
  var dPR = GE.sub(L0.R, L0.P); L0.S = GE.meet(L0.Q, GE.add(L0.Q, dPR), L0.B, L0.C); L0.T = GE.meet(L0.Q, GE.add(L0.Q, dPR), L0.A, L0.D);

    GE.figure(F, FIGQ); exExtra(D, F, { i: 0 });

    if (k2 > 0) { GE.seg(F, ['D', GE.lerpP(Q1.D, Q1.E, k2)], { dash: true, col: C.blue, w: 2 }); if (k2 >= 1) { GE.par(F, 'AC', 1, { col: C.blue }); GE.par(F, 'DE', 1, { col: C.blue }); } }

  /* ---- 考えよう：AD 上の X(x, 3.4)、BC 上の Y(y, 0)。ア（台形 ABYX）の面積（答えは出さない。x＋y＝6.2 のとき 1054m²） ---- */
  CH.check([.5, 1, 2.4, 3.4, 4.5].every(function (x) { var P = { A: L0.A, B: L0.B, X: [x, 3.4], Y: [6.2 - x, 0] }, O = GE.meet(L0.P, L0.S, L0.R, L0.T); return GE.near(area(P, 'ABYX'), A0) && GE.isPar({ X: P.X, O: O, Y: P.Y }, 'XO', 'OY'); }), '考えよう：面積が変わらない線は、PS と RT の交点を通る');

  var T8 = { A: [1.6, 3.6], B: [0, 0], C: [6, 0], M: [3, 0], P: [1.8, 0] }; T8.Q = GE.meet(T8.M, GE.add(T8.M, GE.sub(T8.P, T8.A)), T8.A, T8.C);
  CH.check(GE.isPar(T8, 'AP', 'MQ') && GE.near(area(T8, 'APM'), area(T8, 'APQ')) && GE.near(area(T8, 'ABPQ'), area(T8, 'ABM')) && GE.near(area(T8, 'ABM') * 2, area(T8, 'ABC')) && GE.near(area(T8, 'ABPQ') * 2, area(T8, 'ABC')) && GE.near(GE.len(T8, 'AQ') + GE.len(T8, 'QC'), GE.len(T8, 'AC')), 'チャレンジ：PQ で2等分');

      { t: '①③より、直線 PQ は △ABC の面積を2等分する', ask: false, q: 'したがって？', a: '四角形 ABPQ は △ABC の半分 → 直線 PQ で2等分', hl: ['PQ'], ex: function (D, F, a) { GE.poly(F, 'ABPQ', { col: C.yel, fa: .25, stroke: false, a: a }); GE.poly(F, 'PCQ', { col: C.blue, fa: .25, stroke: false, a: a }); } }]

    if (k1 > 0) GE.seg(F, ['A', GE.lerpP(T8.A, T8.P, k1)], { dash: true, col: C.blue, w: 2 });
