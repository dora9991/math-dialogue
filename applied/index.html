<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>応用チャレンジ｜1年 4章 比例と反比例</title>
<script src="problems.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
:root{
  --ink:#16202e; --ink-soft:#4a5768;
  --ai:#24467d; --ai-weak:#e8eef7;
  --shu:#c8322d;
  --paper:#fcfcfa; --rule:#d9dfe7; --grid:#e6ebf1;
  --ok:#1d6b4f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--gothic); color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.sheet{
  background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);
  margin:20px 0 0;padding:18px 22px;
}
h1{font-family:var(--mincho);font-size:21px;font-weight:600;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--ink-soft);margin-top:4px}
.sub a{color:var(--ai)}
.lead{font-size:13.5px;color:var(--ink-soft);margin:14px 2px 6px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
.card{
  background:#fff;border:1px solid var(--rule);padding:16px 18px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;width:100%;font:inherit;color:inherit;
}
.card:hover{border-color:var(--ai);background:var(--ai-weak)}
.card .no{font-family:var(--mono);font-size:12px;color:var(--ai);letter-spacing:.06em}
.card .nm{font-family:var(--mincho);font-size:15.5px;font-weight:600;line-height:1.5}
.card .meta{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);margin-top:2px}

/* QRモーダル */
.mask{
  position:fixed;inset:0;background:rgba(16,22,30,.55);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:50;
}
.mask.on{display:flex}
.modal{
  background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);
  padding:26px 28px 22px;max-width:460px;width:100%;text-align:center;
}
.modal .mno{font-family:var(--mono);font-size:12px;color:var(--ai);letter-spacing:.08em}
.modal h2{font-family:var(--mincho);font-size:18px;margin:6px 0 4px;font-weight:600;line-height:1.5}
.modal .mtheme{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.qrbox{display:flex;justify-content:center;margin:6px 0 12px}
.qrbox svg{width:260px;height:260px;background:#fff}
.urlline{
  font-family:var(--mono);font-size:11px;color:var(--ink-soft);word-break:break-all;
  border:1px solid var(--rule);background:#f7f8fa;padding:8px 10px;margin-bottom:14px;
}
.mbtns{display:flex;gap:8px}
.mbtns button{
  flex:1;font:inherit;font-size:14px;padding:11px 14px;cursor:pointer;border-radius:2px;
  border:1px solid var(--ai);background:#fff;color:var(--ai);font-weight:600;
}
.mbtns button.solid{background:var(--ai);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .mask{position:static;display:block;background:none;padding:0}
  .mbtns,header .sub{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="sheet">
    <h1>応用チャレンジ</h1>
    <div class="sub">
      中学1年　第4章　比例と反比例　｜　入試・実力問題　·
      <a href="teacher.html">先生用ダッシュボード →</a>
    </div>
  </header>

  <p class="lead">めあてをクリックすると、その内容の応用問題に挑戦できる QR コードが表示されます。授業で投影して読み取らせてください。</p>
  <div class="list" id="list"></div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mno" id="m-no"></div>
    <h2 id="m-name"></h2>
    <div class="mtheme" id="m-theme"></div>
    <div class="qrbox" id="m-qr"></div>
    <div class="urlline" id="m-url"></div>
    <div class="mbtns">
      <button id="m-open" class="solid">この問題を開く</button>
      <button id="m-close">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  const SETS = window.SETS || [];
  const list = document.getElementById("list");
  const mask = document.getElementById("mask");

  SETS.forEach(s=>{
    const b = document.createElement("button");
    b.className = "card"; b.type = "button";
    b.innerHTML =
      `<span class="no">${s.no}</span>` +
      `<span class="nm">${esc(s.name)}</span>` +
      `<span class="meta">${esc(s.theme)}　·　全 ${s.qs.length} 問</span>`;
    b.onclick = ()=>openModal(s);
    list.appendChild(b);
  });

  function challengeURL(id){
    return new URL("challenge.html?set=" + encodeURIComponent(id), location.href).href;
  }

  function openModal(s){
    const url = challengeURL(s.id);
    document.getElementById("m-no").textContent = s.no;
    document.getElementById("m-name").textContent = s.name;
    document.getElementById("m-theme").textContent = s.theme + " ・ 全 " + s.qs.length + " 問";
    document.getElementById("m-url").textContent = url;

    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    document.getElementById("m-qr").innerHTML = qr.createSvgTag({ scalable: true, margin: 1 });

    document.getElementById("m-open").onclick = ()=>{ location.href = url; };
    mask.classList.add("on");
  }
  function closeModal(){ mask.classList.remove("on"); }
  document.getElementById("m-close").onclick = closeModal;
  mask.onclick = e=>{ if(e.target === mask) closeModal(); };
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeModal(); });

  function esc(s){ return String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
})();
</script>
</body>
</html>
