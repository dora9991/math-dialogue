    var items2 = E.c2.map(function (c, i) { return { s: i ? c.s : lead(c.s) }; }), items3 = E.ord.map(function (j, i) { return { s: i ? E.c2[j].s : lead(E.c2[j].s) }; });
    var L2 = crow(D, Rr.cx, 0, items2, h, { maxW: Rr.w * .95, dry: true }), L3 = crow(D, Rr.cx, 0, items3, h, { maxW: Rr.w * .95, dry: true }), hh = L2.h, pos3 = [];
    E.ord.forEach(function (j, i) { pos3[j] = L3[i]; });
    E.c2.forEach(function (c, i) {
      var dx = pos3[i].cx - L2[i].cx, x = CH.lerp(L2[i].cx, pos3[i].cx, mv), y = CH.lerp(CH.lerp(ys[0] + z * .6, ys[1], k2), ys[2], mv) + (Math.abs(dx) > 2 ? Math.sin(Math.PI * mv) * hh * .75 * (dx > 0 ? -1 : 1) : 0), w = CH.lerp(L2[i].w, pos3[i].w, mv);
      var r = E.res.filter(function (q) { return q.of.indexOf(i) >= 0; })[0], rx = r.of.reduce(function (a, j) { return a + pos3[j].cx; }, 0) / r.of.length;
      if (mg > 0) x = CH.lerp(x, rx, mg);
      var first = (mv > .5 ? E.ord.indexOf(i) : i) === 0;
      if (c.s0) flip(D, x, y, w, hh, first ? lead(c.s0) : c.s0, first ? lead(c.s) : c.s, kcol(c.s), kcol(c.s), fl, { size: hh * .5, glow: true, a: k2 * (1 - mg) });
      else card(D, x, y, w, hh, first ? lead(c.s) : c.s, { col: kcol(c.s), size: hh * .5, a: k2 * (1 - mg) });
    });
    if (E.note) TX(D, Rr.cx, ys[1] - hh * .5 - s * 1.1, E.note, { size: fit(D, E.note, Rr.w, s * .9), col: NEG, a: fl * (1 - mv) });
    if (mg > 0) E.res.forEach(function (r, i) { var rx = r.of.reduce(function (a, j) { return a + pos3[j].cx; }, 0) / r.of.length; card(D, rx, ys[2], hh * 1.7, hh, i ? r.s : lead(r.s), { col: C.yel, size: hh * .5, a: mg, glow: mg < 1 }); });
    if (mg > 0) TX(D, Rr.cx, ys[2] + hh * .5 + s * 1.3, E.fin, { size: z * .9, col: C.yel, a: sm(.9, 1, t) });
  }

  /* ---- 考えよう：x の値で、x^2＋x と 2x^2・x^3・2x をくらべる（面積の図と値） ---- */
  function kangae(D) {
    var x = D.V.x, R = CH.box(D, { l: .03, r: .03, t: .03, b: .03 }), s = CH.fs(D), cells = CH.cols(CH.rect(R.x0, R.y0, R.x1, R.cy - s * .2), 2, .06).concat(CH.cols(CH.rect(R.x0, R.cy + s * .2, R.x1, R.y1), 2, .06));
    var U = Math.min(cells[0].w / 8.6, (cells[0].h - s * 3.6) / 4.2);
    function sq(x0, y1, w, h, col, lab) { CH.fillRect(D, x0, y1 - h * U, x0 + w * U, y1, { fill: ha(col, .3), stroke: col, sw: 1.8 }); if (lab && Math.min(w, h) * U > s * 1.1) TX(D, x0 + w * U / 2, y1 - h * U / 2, lab, { size: Math.min(s * .9, w * U * .45), col: C.chalk }); }
    var defs = [['x^2＋x', C.yel], ['A　2x^2', C.blue], ['B　x^3', C.lav], ['C　2x', C.green]], val = ['x^2＋x', '2x^2', 'x^3', '2x'];
    defs.forEach(function (d, i) {
      var c = cells[i], yb = c.y1 - s * 1.7, x0 = c.cx;
      rr(D, c.x0, c.y0, c.x1, c.y1, { r: 10, stroke: 'rgba(242,240,230,.25)', sw: 1.4 });
      TX(D, c.x0 + s * .5, c.y0 + s * .8, d[0], { size: s, col: d[1], align: 'left' });
      if (i === 0) { var w0 = (x + 1 + .3) * U, xs = c.cx - w0 / 2; sq(xs, yb, x, x, C.yel, 'x^2'); sq(xs + (x + .3) * U, yb, 1, x, POS, 'x'); }
      if (i === 1) { var w1 = (2 * x + .3) * U, x1 = c.cx - w1 / 2; sq(x1, yb, x, x, C.blue, 'x^2'); sq(x1 + (x + .3) * U, yb, x, x, C.blue, 'x^2'); }
      if (i === 2) TX(D, c.cx, (c.y0 + yb) / 2 + s * .4, 'x×x×x', { size: s * 1.2, col: C.lav });
      if (i === 3) { var w3 = (2.3) * U, x3 = c.cx - w3 / 2; sq(x3, yb, 1, x, C.green, 'x'); sq(x3 + 1.3 * U, yb, 1, x, C.green, 'x'); }
      TX(D, c.cx, c.y1 - s * .8, '値 ' + S(EV(val[i], { x: x })), { size: s * 1.05, col: C.chalk });
    });
  }

  /* ---- チャレンジ ---- */
  function chal(D, t) {
    var P = two(D, .55, .56), s = CH.fs(D), A = P[0], B = P[1];
    if (t > 0) chain(D, A, ['A＋(2a−3b)＝4a＋b', 'A＝(4a＋b)−(2a−3b)', '＝2a＋4b', '(2a＋4b)−(2a−3b)', '＝7b'], sm(0, .9, t), { size: Math.min(s * 1.15, A.w / 10), last: C.yel, labs: ['', '', '', '正しい計算', ''] });
    var h = Math.min(s * 2.3, B.h * .16), y1 = B.y0 + B.h * .3, y2 = B.y0 + B.h * .7, kA = sm(.42, .52, t), kR = sm(.9, 1, t);
    TX(D, B.cx, y1 - h * .5 - s * 1, 'まちがえた計算（たした）', { size: fit(D, 'まちがえた計算（たした）', B.w, s * .9), col: NEG });
    TX(D, B.cx, y2 - h * .5 - s * 1, '正しい計算（ひく）', { size: fit(D, '正しい計算（ひく）', B.w, s * .9), col: C.green });
    var it = function (op) { return [{ s: 'A', col: C.yel, minW: 2.6 }, { s: op, op: true }, { s: '2a−3b', col: C.lav }, { s: '＝', op: true }]; };
    var L1 = crow(D, B.cx, y1, it('＋').concat([{ s: '4a＋b', col: C.chalk }]), h, { maxW: B.w * .96, dry: true });
    var L2 = crow(D, B.cx, y2, it('−').concat([{ s: kR > .5 ? '7b' : '？', col: kR > .5 ? C.yel : C.chalk }]), h, { maxW: B.w * .96, dry: true });
    [[L1, y1, '＋', '4a＋b'], [L2, y2, '−', kR > .5 ? '7b' : '？']].forEach(function (r) {
      var L = r[0], hh = L.h;
      flip(D, L[0].cx, r[1], L[0].w, hh, 'A', '2a＋4b', C.yel, C.yel, kA, { size: hh * .45, glow: kA > 0 && kA < 1 });
      TX(D, L[1].cx, r[1], r[2], { size: hh * .55 }); card(D, L[2].cx, r[1], L[2].w, hh, '2a−3b', { col: C.lav, size: hh * .45 }); TX(D, L[3].cx, r[1], '＝', { size: hh * .55 });
      card(D, L[4].cx, r[1], L[4].w, hh, r[3], { col: r[3] === '7b' ? C.yel : C.chalk, size: hh * .5, glow: r[3] === '7b' && kR < 1 });
    });
  }

  K3.run({
