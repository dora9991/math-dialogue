    var sum = nums.reduce(function (p, q) { return p + q; }, 0), tx = nums.join('＋') + '＝' + sum;
    TX(D, R.cx, R.y0 + s * 1, '連続する ' + n + 'つの整数', { size: s * 1.05, col: 'rgba(242,240,230,.85)' });
    TX(D, R.cx, R.y0 + s * 2.8, tx, { size: fit(D, tx, R.w, s * 1.5), col: C.yel });
    numBars(D, CH.rect(R.x0, R.y0 + s * 4.4, R.x1, R.y1), nums, { max: Math.max(8, a + n + 1) });
  }

  /* ---- チャレンジ ---- */
  function chal(D, t) {
    var P = two(D, .58, .62), s = CH.fs(D), A = P[0], B = P[1];
    if (t <= 0) { TX(D, A.cx, A.cy, 'n＋(n＋1)＋(n＋2) ＝ n の 5倍より 1小さい', { size: fit(D, 'n＋(n＋1)＋(n＋2) ＝ n の 5倍より 1小さい', A.w, s * 1.2) }); return; }
    chain(D, A, ['n＋(n＋1)＋(n＋2)＝5n−1', '3n＋3＝5n−1', '3n−5n＝−1−3', '−2n＝−4', 'n＝2'], sm(0, .7, t), { labs: ['', '左の式を まとめる', '移項', '', ''], last: C.yel, size: Math.min(s * 1.2, A.w / 12) });
    var a2 = sm(.72, .85, t);
    if (a2 > 0) {
      numBars(D, CH.rect(B.x0, B.y0 + s * 2.6, B.x1, B.y1 - s * 1.2), [2, 3, 4], { max: 6 });
      TX(D, B.cx, B.y0 + s * .9, '2、3、4', { size: s * 1.3, col: C.yel, a: a2 });
      TX(D, B.cx, B.y1 - s * .4, '2＋3＋4＝9、5×2−1＝9 ✓', { size: fit(D, '2＋3＋4＝9、5×2−1＝9 ✓', B.w, s * .9), col: C.green, a: sm(.85, .97, t) });
    }
  }

        b: { t: 'n＋(n＋1)＋(n＋2)＝3n＋3＝<b>3(n＋1)</b> → <b>3の倍数</b>（まん中の数の 3倍）', col: C.yel },
