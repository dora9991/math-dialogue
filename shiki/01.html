      Q.forEach(function (p, i) { TX(D, p.cx, y3 - Q.h * .5 - s * .55, dd[i] ? '次数 ' + dd[i] : '—', { size: s * .7, col: C.green, a: sm(.8, .88, t) }); });
      TX(D, X0 + W * .97, y3, '→ 2次式', { size: s * .9, col: C.green, align: 'right', a: sm(.9, .98, t) });
    }
  }

  /* ---- 例題：3x^2−5xy＋y−4 が項に分かれ、かけ算の形・次数・係数が出る ---- */
  function exView(D, t, expr, o) {
    o = o || {}; var R = CH.box(D, { l: .03, r: .03, t: .03, b: .03 }), s = CH.fs(D), wide = wideOf(D), lw = s * (wide ? 5.2 : 3.4), X0 = R.x0 + lw, W = R.w - lw;
    var h = Math.min(s * 2.4, R.h * .13), yC = R.y0 + R.h * (o.y || .38), T = terms(expr);
    var P = splitCard(D, X0 + W / 2, yC, expr, o.split == null ? sm(.03, .22, t) : o.split, h, { maxW: W * .96, spread: true, glow: function (i) { return o.glow && o.glow(i); } }), hh = P.h;
    var yD = yC - hh * .5 - s * 1.2, yE = yC + hh * .5 + s * 1.5, yK = yE + s * 2.1, kE = o.exp == null ? sm(.25, .4, t) : o.exp, kD = o.deg == null ? sm(.42, .58, t) : o.deg, kK = o.coef == null ? sm(.6, .74, t) : o.coef;
    var rl = [['次数', yD, kD, C.yel], ['項', yC, 1, C.chalk], ['かけ算', yE, kE, POS], ['係数', yK, kK, ONE]];
    rl.forEach(function (r) { if (r[2] > 0 && !(o.noDeg && r[0] === '次数') && !(o.noCoef && r[0] === '係数')) TX(D, R.x0, r[1], r[0], { size: Math.min(s * .85, lw / 3.3), col: r[3], align: 'left', a: r[2] }); });
    T.forEach(function (u, i) {
      var e = expd(u), z = Math.min(s * 1.05, (W / T.length) * .86 / Math.max(.01, TW(D, e, 100) / 100));
      var n = kE > 0 ? expRow(D, P[i].cx, yE, e, z, { a: kE, num: o.noDeg ? 0 : kD }) : 0, d = deg(u);
      if (!o.noDeg && kD > 0) TX(D, P[i].cx, yD, d ? String(d) : '—', { size: s * 1.05, col: C.yel, a: kD });
      if (!o.noCoef && kK > 0) TX(D, P[i].cx, yK, d ? S(coef(u)) : '—', { size: s * 1.05, col: ONE, a: kK });
    });
    return { P: P, yK: yK, R: R, X0: X0, W: W, s: s };
  }

  /* ---- チャレンジ：x^ay−3xy^3＋1 ---- */
  function chal(D, t) {
    var R = CH.box(D, { l: .03, r: .03, t: .03, b: .03 }), s = CH.fs(D), h = Math.min(s * 2.4, R.h * .13), yC = R.y0 + R.h * .3;
    var sw = sm(.72, .8, t), expr = 'x^ay−3xy^3＋1', T = terms(expr);
    var P = splitCard(D, R.cx, yC, expr, D.ph ? sm(.02, .2, t) : 0, h, { maxW: R.w * .9, spread: true, glow: function (i) { return i === 0 && sw > 0 && sw < 1; } });
    if (!D.ph) return;
    var hh = P.h, yD = yC - hh * .5 - s * 1.2, yE = yC + hh * .5 + s * 1.5, kE = sm(.22, .38, t), kD = sm(.38, .52, t);
    if (sw > 0) { CH.fillRect(D, P[0].cx - P[0].w / 2 + 3, yC - hh / 2 + 3, P[0].cx + P[0].w / 2 - 3, yC + hh / 2 - 3, { fill: '#1f3a2c', a: sw }); TX(D, P[0].cx, yC + 1, 'x^5y', { size: hh * .5, col: C.yel, a: sw }); }
    var ex = ['x×…×x×y', '−3×x×y×y×y', '1'], dg = [sw > .5 ? '6' : 'a＋1', '4', '—'];
    ex.forEach(function (e, i) {
      var z = Math.min(s * 1.0, R.w / 3 * .86 / Math.max(.01, TW(D, e, 100) / 100));
      if (i === 0 && kE > 0) {
        var Pq = seq(D, P[0].cx, yE, [{ t: 'x×…×x', col: POS }, '×', { t: 'y', col: POS }], { size: z, a: kE });
        brace(D, Pq[0].x0, Pq[0].x1, yE + z * .7, C.yel, kE, false);
        TX(D, Pq[0].cx, yE + z * 1.9, sw > .5 ? '5こ' : 'a こ', { size: z * .85, col: C.yel, a: kE });
      } else if (kE > 0) expRow(D, P[i].cx, yE, e, z, { a: kE });
      TX(D, P[i].cx, yD, dg[i], { size: s * 1.05, col: C.yel, a: kD });
    });
    TX(D, R.x0 + s * .2, yD, '次数', { size: s * .8, col: C.yel, align: 'left', a: kD });
    chain(D, CH.rect(R.x0, yE + s * 3.2, R.x1, R.y1), ['いちばん大きい次数が 6 だから', 'a＋1＝6', 'a＝5'], sm(.5, .7, t), { size: Math.min(s * 1.1, R.w / 14), last: C.yel, top: true });
  }
  /* 横のかっこ（下向き） */
  function brace(D, x0, x1, y, col, a, up) {
    if (a <= 0 || x1 - x0 < 4) return; var g = D.ctx, hh = Math.min(10, (x1 - x0) * .25) * (up ? -1 : 1), m = (x0 + x1) / 2, r = Math.min(Math.abs(hh), (x1 - x0) / 4);
    g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = col; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath();
    g.moveTo(x0, y); g.quadraticCurveTo(x0, y + hh / 2, x0 + r, y + hh / 2); g.lineTo(m - r, y + hh / 2); g.quadraticCurveTo(m, y + hh / 2, m, y + hh);
    g.quadraticCurveTo(m, y + hh / 2, m + r, y + hh / 2); g.lineTo(x1 - r, y + hh / 2); g.quadraticCurveTo(x1, y + hh / 2, x1, y); g.stroke(); g.restore();
  }

  K3.run({

        draw: function (D) { sortView(D, 0); } },
      { tag: '今日の問い', q: '「＋ や − でつながっているか」に目をつけると、どう分けられる？', a: 'ア・ウ・オ・カ・キ と イ・エ・ク', sub: 'ほかの観点：文字の種類 … 1種類 ア・イ・エ・オ、2種類 ウ・キ・ク、文字なし カ。観点を決めると、仲間に分けられる', dur: 4,
        b: { t: '＋・− でつながっていない ア・ウ・オ・カ・キ ／ つながっている イ・エ・ク', col: C.yel },
        draw: function (D) { sortView(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '乗法だけの式、その和の形の式を何という？ 式の次数は、どう決める？', a: '単項式・多項式。次数は、かけ合わされた文字の個数', sub: '多項式の1つ1つの単項式を項という。多項式の次数は、各項の次数のうち いちばん大きいもの（次数 2 の式は 2次式）', dur: 7,
        b: [{ t: '<b>単項式</b> … 乗法だけの式（3a、8）　<b>多項式</b> … 単項式の和の形（x＋5 の<b>項</b>は x と 5）', col: C.green }, { t: '<b>次数</b> … かけ合わされた文字の個数（2x^2y＝2×x×x×y → 3）。多項式は いちばん大きい次数（<b>2次式</b>など）', col: C.green }],
        draw: function (D) { kotoba(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　項・係数・次数', q: '多項式 3x^2−5xy＋y−4 の、項ごとの係数と次数を調べて、何次式か答えよう。', a: '2次式', sub: '項 3x^2、−5xy、y、−4。係数 3、−5、1。次数 2、2、1（−4 のような数だけの項は、次数を考えない）。いちばん大きい次数は 2', dur: 7,
        b: { t: '3x^2−5xy＋y−4 … 係数 3・−5・1、次数 2・2・1 → <b>2次式</b>', col: C.pink },
        draw: function (D) {

          TX(D, r.X0 + r.W / 2, Math.min(r.R.y1 - r.s * .8, r.yK + r.s * 2.6), 'いちばん大きい次数は 2 → 2次式', { size: fit(D, 'いちばん大きい次数は 2 → 2次式', r.W, r.s * 1.05), col: C.yel, a: sm(.82, .95, t) });

    ])
  });
