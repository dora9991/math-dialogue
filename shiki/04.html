    cube(D, xb, yb, L, 3, { col: C.orange, grid: k1, front: fr2 * (1 - k3) });
    TX(D, xb + L / 2, yb + s * .9, '3a', { size: s, a: k1 });
    if (fr2 > 0) TX(D, xb + L / 2, yb - L / 2, '9こ', { size: s * 1.2, col: C.yel, a: fr2 * (1 - k3), outline: 'rgba(20,40,30,.9)' });
    if (k3 > 0) TX(D, xb + L / 2 + u * .2, yb - L * 1.32 - s * .9, '3×3×3＝27こ', { size: fit(D, '3×3×3＝27こ', A.x1 - xb, s * 1.05), col: C.yel, a: k3 });
    chain(D, B, CHL, sm(.2, 1, t), { last: C.yel, size: Math.min(s * 1.05, B.w / 13) });
  }

  K3.run({

      { tag: 'ことば', bh: 'ことば', q: '同じ文字のかけ算 a×a は、どう表す？ 単項式どうしの乗法・除法は、どう計算する？', a: 'a^2（累乗）。乗法は係数の積に文字の積をかける。除法は分数の形にして約分', sub: '÷2x は、2x 全体でわる。わる式が数のときは、逆数をかけてもよい', dur: 6,

  /* 今日の問いの答え：長方形 1つを、四角 B の中に */
  function two4Sub(D, B, t, mode) {
    var s = CH.fs(D), n = mode === 'A' ? 2 : 4, U = Math.min((B.w - s * 4) / (n * LB + .4), (B.h - s * 4) / 3.2), W = n * LB * U, H = 3 * U, x0 = B.cx - W / 2 + s * 1.2, y0 = B.cy - H / 2;
    var cl = sm(.05, .3, t), lb = sm(.25, .45, t);
    rectAB(D, x0, y0, U, 3, n, { cells: cl, lab: lb, left: '3a', top: mode === 'A' ? '2b' : (t > .85 ? '4b' : '？'), col: mode === 'A' ? C.blue : C.orange, hl: mode === 'B' && t > .5 ? function (r) { return r === 0 ? C.yel : null; } : null });
    TX(D, x0 - s * 2.4, y0 - s * .9, mode === 'A' ? 'ア' : 'イ', { size: s * 1.2, col: C.yel });
    if (lb < .5) TX(D, x0 + W / 2, y0 + H / 2, mode === 'A' ? '面積？' : '面積 12ab', { size: fit(D, '面積 12ab', W * .8, s), col: C.yel, a: 1 - lb * 2 });
    if (mode === 'A') TX(D, x0 + W / 2, y0 + H + s * 1.1, 'ab が 3×2＝6こ', { size: s, col: C.yel, a: sm(.5, .7, t) });
    else { var a2 = sm(.5, .7, t); for (var c = 0; c < 4; c++) TX(D, x0 + (c + .5) * LB * U, y0 + H + s * .9, 'b', { size: s, col: C.yel, a: a2 }); TX(D, x0 + W + s * .3, y0 + U / 2, '← a', { size: s * .9, col: C.yel, align: 'left', a: a2 }); TX(D, x0 + W / 2, y0 + H + s * 2.3, '1段（a）に ab が 4こ', { size: fit(D, '1段（a）に ab が 4こ', B.w, s * .9), col: C.yel, a: sm(.6, .8, t) }); }
