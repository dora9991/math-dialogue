<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>スライドの一覧（開発用）</title>
<link rel="stylesheet" href="../css/ws.css">
<link rel="stylesheet" href="../css/slides.css">
<style>
  /* 開発用：電子黒板用スライドを、時間ごとにならべて見る。
     例）tools/slsheet.html?re=^seifu-0[1-6]   板書と使う＝&mode=core   答えつき＝&ans=1   大きさ＝&w=520   黒板色＝&dark=1
     下に検査の結果（入りきらない・字が小さい・図の字の重なり）を出す。 */
  body{margin:10px;background:#d9d7d0;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
  h2{font-size:14px;margin:14px 0 6px}
  h2 small{font-weight:400;color:#555;margin-left:8px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .cell{position:relative;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .cell .sl-slide{position:absolute;left:0;top:0;transform-origin:0 0}
  .cell .tg{position:absolute;right:4px;bottom:3px;z-index:3;font:700 11px/1.5 sans-serif;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;padding:0 6px}
  .cell .tg.bad{background:#d62828}
  .cell .tg.sm{background:#b45309}
  pre{white-space:pre-wrap;font-size:12px;background:#fff;padding:8px;border-radius:6px}
</style></head>
<body><div id="out"></div><pre id="log"></pre>
<script>
(async () => {
  const q = new URLSearchParams(location.search), re = new RegExp(q.get('re') || '^seifu-0[1-3]'), mode = q.get('mode') === 'core' ? 'core' : 'full';
  const W = +(q.get('w') || 480), k = W / 1600;
  const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  const srcs = [...html.matchAll(/<script src="((?:data|js)\/[^"]+)"/g)].map(m => m[1]).filter(s => /^data\//.test(s) || /js\/(ws|slides)\.js/.test(s));
  for (const s of srcs) await new Promise((res, rej) => { const el = document.createElement('script'); el.src = '../' + s + '?' + Date.now(); el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  await new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'slcheck.js?' + Date.now(); el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  const out = document.getElementById('out');
  if (q.get('ans') === '1') out.classList.add('sl-all');
  if (q.get('dark') === '1') out.classList.add('sl-dark');
  const ids = LDB.lessons.map(l => l.id).filter(id => re.test(id));
  let n = 0;
  for (const id of ids) {
    const d = await SLX.deck(id, mode), l = LDB.lessons.find(x => x.id === id);
    const h = document.createElement('h2'); h.innerHTML = `${id}　${l.title}<small>${d.slides.length}枚</small>`; out.appendChild(h);
    const row = document.createElement('div'); row.className = 'row'; out.appendChild(row);
    d.slides.forEach((s, i) => {
      const c = document.createElement('div'); c.className = 'cell'; c.style.cssText = `width:${W}px;height:${W * 9 / 16}px`;
      c.innerHTML = s.html + `<span class="tg${s.over ? ' bad' : s.fs < 0.75 ? ' sm' : ''}">${i + 1}　×${s.fs}${s.over ? ' はみ出し' : ''}</span>`;
      c.querySelector('.sl-slide').style.transform = `scale(${k})`;
      row.appendChild(c); n++;
    });
  }
  const r = await slChk(re, { mode });
  document.getElementById('log').textContent = JSON.stringify(r, null, 1);
  document.title = `スライド ${n}`; document.body.dataset.ready = '1';
})();
</script>
</body></html>
