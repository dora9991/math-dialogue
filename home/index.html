<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭学習ノート｜1年 4章 比例と反比例</title>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="engine.js"></script>
<script src="studydata.js"></script>
<style>
:root{
  --ink:#16202e; --ink-soft:#4a5768;
  --ai:#24467d; --ai-weak:#e8eef7;
  --shu:#c8322d; --shu-weak:#fbecea;
  --ok:#1d6b4f; --ok-weak:#e6f2ec;
  --gold:#c98a2b; --gold-weak:#fbf3e3;
  --paper:#fcfcfa; --rule:#d9dfe7; --grid:#e6ebf1;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--gothic); color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.sheet{background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ai);margin:20px 0 0;padding:16px 20px;display:flex;align-items:center;gap:10px}
header.sheet h1{font-family:var(--mincho);font-size:19px;font-weight:600;margin:0;letter-spacing:.04em;flex:1}
header.sheet .x{font:inherit;font-size:13px;color:var(--ink-soft);background:#fff;border:1px solid var(--rule);border-radius:2px;padding:5px 11px;cursor:pointer}
.sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.card{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.card h2{font-family:var(--mincho);font-size:16px;margin:0 0 12px;font-weight:600}
label.f{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
select,input[type=text],input[type=number]{font:inherit;font-size:16px;padding:11px 12px;width:100%;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px}
input[type=text]{font-family:var(--mono)}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:2px;border:1px solid transparent}
.btn{background:var(--ai);color:#fff;padding:13px 20px;font-weight:600;width:100%;font-size:16px}
.btn:disabled{background:#9aa6b6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ai);border-color:var(--ai)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;font-weight:400}
.foot{display:flex;gap:8px;margin-top:16px}
.foot button{flex:1}
.hidden{display:none!important}

.pickgrid{display:grid;gap:8px}
.pickgrid button{display:flex;flex-direction:column;gap:3px;align-items:flex-start;background:#fff;border:1px solid var(--rule);padding:12px 14px;text-align:left;width:100%}
.pickgrid button:hover{border-color:var(--ai);background:var(--ai-weak)}
.pickgrid .no{font-family:var(--mono);font-size:11px;color:var(--ai)}
.pickgrid .nm{font-size:14.5px}
.pickgrid button[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);box-shadow:inset 3px 0 0 var(--ai)}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.levels button{flex:1;min-width:70px;background:#fff;border:1px solid var(--rule);padding:10px 8px;font-size:13.5px}
.levels button[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);font-weight:600}

/* 演習バー */
.statbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--rule);margin:0 -16px;padding:9px 16px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(4px);flex-wrap:wrap}
.statbar .s{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.statbar .s b{color:var(--ink);font-size:13px}
.statbar .clock{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-soft)}

.q{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-top:14px}
.q.lv-応用{border-top:3px solid var(--gold)}
.q .head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .n{font-family:var(--mono);font-size:12px;color:#fff;background:var(--ink);padding:2px 7px;flex:none}
.q.lv-応用 .n{background:var(--gold)}
.q .lvtag{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);padding:1px 7px;color:var(--ink-soft)}
.q .lvtag.応用{color:var(--gold);border-color:#e3c789;background:var(--gold-weak)}
.q .prompt{font-size:15.5px;white-space:pre-wrap}
.q .hintline{font-size:12.5px;color:var(--ink-soft);margin:6px 0 2px}
.q .hintline::before{content:"💡 "}
.subrow{margin-top:12px}
.subrow .lbl{font-size:14.5px}
.subrow .lbl .lb{font-family:var(--mono);color:var(--ink-soft);margin-right:6px}
.subq{display:flex;align-items:center;gap:10px;margin-top:8px}
.subq .lb{font-family:var(--mono);font-size:13px;color:var(--ink-soft);flex:none;min-width:40px}
.choices{display:grid;gap:8px;margin-top:8px}
.choices button{text-align:left;background:#fff;border:1px solid var(--rule);padding:11px 14px;font-size:15px;width:100%}
.choices button[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);box-shadow:inset 3px 0 0 var(--ai)}
.choices.mini button{padding:9px 14px}

.judge{margin-top:14px;padding:14px 16px;border:1px solid var(--rule)}
.judge.ok{border-color:var(--ok);background:var(--ok-weak)}
.judge.ng{border-color:var(--shu);background:var(--shu-weak)}
.judge .mk{font-family:var(--mincho);font-size:22px;font-weight:600}
.judge.ok .mk{color:var(--ok)} .judge.ng .mk{color:var(--shu)}
.judge .right{font-family:var(--mono);font-size:14px;margin-top:4px}
.judge .sol{font-size:13px;color:var(--ink-soft);white-space:pre-wrap;border-left:2px solid var(--rule);padding-left:10px;margin-top:8px}

.notice{border:1px solid var(--rule);background:#fff;padding:12px 14px;font-size:13px;margin-top:12px}
.notice.warn{border-color:var(--shu);background:var(--shu-weak);color:#7d211d}
.notice.ok{border-color:var(--ok);background:var(--ok-weak);color:#12503a}

/* 時間入力 */
.timegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.timegrid button{background:#fff;border:1px solid var(--rule);padding:14px 8px;font-size:16px;font-family:var(--mono)}
.timegrid button[aria-pressed=true]{border-color:var(--ai);background:var(--ai-weak);font-weight:700}

/* 記録 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:8px}
.kpi{background:#fff;border:1px solid var(--rule);padding:10px 12px;text-align:center}
.kpi .v{font-family:var(--mincho);font-size:24px;line-height:1.1}
.kpi .k{font-size:11px;color:var(--ink-soft);margin-top:2px}
.daybars{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.daybar{display:flex;align-items:center;gap:8px;font-size:12px}
.daybar .d{font-family:var(--mono);color:var(--ink-soft);width:56px;flex:none}
.daybar .track{flex:1;background:var(--grid);height:16px;position:relative}
.daybar .fill{height:100%;background:var(--ai)}
.daybar .val{font-family:var(--mono);color:var(--ink-soft);width:66px;flex:none;text-align:right}
.unitrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:5px}
.unitrow .un{flex:1}
.unitrow .track{width:120px;background:var(--grid);height:12px;flex:none}
.unitrow .fill{height:100%;background:var(--ok)}
.unitrow .val{font-family:var(--mono);color:var(--ink-soft);width:44px;text-align:right;flex:none}

/* 数式キーボード */
#kb{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#f3f5f8;border-top:1px solid var(--rule);padding:5px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(22,32,46,.10)}
#kb .kbhead{display:flex;align-items:center;gap:8px;padding:0 3px 4px;font-size:11px;color:var(--ink-soft)}
#kb .keys{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
#kb button{background:#fff;border:1px solid var(--rule);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1;padding:0;height:36px}
#kb button:active{background:var(--ai-weak);border-color:var(--ai)}
#kb button.op{color:var(--ai)} #kb button.fn{font-family:var(--gothic);font-size:12px;background:#e9edf3}
#kb button.del{color:var(--shu);font-size:16px} #kb button.num{font-size:16px;font-weight:600} #kb button.var{color:var(--ai);font-style:italic}
#kb button.span3{grid-column:span 3} #kb button.span10{grid-column:span 10}
body.kbopen{padding-bottom:230px}
#frac{display:none;align-items:center;justify-content:center;gap:14px;padding:6px 0 10px}
#frac.on{display:flex}
#kb.fracmode .keys{display:none}
.frac-stack{display:flex;flex-direction:column;align-items:center;gap:2px}
.frac-in{width:78px;text-align:center;font-family:var(--mono);font-size:17px;border:1px solid var(--rule);background:#fff;padding:5px 2px;border-radius:2px}
.frac-in:focus{outline:2px solid var(--ai);outline-offset:1px}
.frac-bar{width:78px;height:2px;background:var(--ink)}
#frac button{height:34px;font-size:13px;padding:0 12px;font-family:var(--gothic);background:#e9edf3;border:1px solid var(--rule)}
#frac button.go{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="kb" class="hidden" aria-label="数式キーボード">
  <div class="kbhead"><span id="kbhint">数式キーボード</span></div>
  <div id="frac">
    <div class="frac-stack">
      <input id="frac-num" class="frac-in" inputmode="none" placeholder="分子">
      <div class="frac-bar"></div>
      <input id="frac-den" class="frac-in" inputmode="none" placeholder="分母">
    </div>
    <button type="button" id="frac-ok" class="go">✓ 挿入</button>
    <button type="button" id="frac-cancel">やめる</button>
  </div>
  <div class="keys" id="kbkeys"></div>
</div>

<script>
const CONFIG = { GRADES:[1,2,3], CLASSES:[1,2,3,4,5,6], CLASS_SIZE:40 };
const STUDENT_KEY = "study:student";
const qsp = new URLSearchParams(location.search);
const CLASS_ID = qsp.get("c") || "";
// UNITS / POOL は studydata.js で定義済み（同じグローバルスコープ）

/* ---------- 保存 ---------- */
const store = (() => {
  let mem={}, ok=false;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok=true; }catch(e){}
  return {
    get(k){ try{ return ok? localStorage.getItem(k) : (mem[k]??null); }catch(e){ return mem[k]??null; } },
    set(k,v){ try{ ok? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } },
  };
})();

/* ---------- 数式キーボード（quiz と共通） ---------- */
const KB = (()=>{
  const el=document.getElementById("kb"), keys=document.getElementById("kbkeys"), hint=document.getElementById("kbhint");
  let target=null;
  const LAYOUT=[
    ["0","0","num"],["1","1","num"],["2","2","num"],["3","3","num"],["4","4","num"],
    ["5","5","num"],["6","6","num"],["7","7","num"],["8","8","num"],["9","9","num"],
    ["a","a","var"],["b","b","var"],["c","c","var"],["n","n","var"],["m","m","var"],
    ["r","r","var"],["x","x","var"],["y","y","var"],["k","k","var"],["π","π","op"],
    ["＝","=","op"],[".","."],["＋","+","op"],["−","-","op"],["×","×","op"],
    ["÷","÷","op"],["≦","≦","op"],["≧","≧","op"],["＜","<","op"],["＞",">","op"],
    ["(","(","op"],[")",")","op"],[",",",","op"],["/","/","op"],
    ["⌫","\b","fn del span3"],["閉じる",null,"fn span3"],
    ["分数","FRAC","fn span10"],
  ];
  LAYOUT.forEach(([label,ins,cls])=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=label; if(cls) b.className=cls;
    b.addEventListener("pointerdown",e=>e.preventDefault());
    b.addEventListener("click",()=>{ if(ins===null){hide();return;} if(ins==="FRAC"){openFrac();return;} if(ins==="\b") back(); else insert(ins); });
    keys.appendChild(b);
  });
  function insert(t){ if(!target)return; const s=target.selectionStart??target.value.length,e=target.selectionEnd??s;
    target.value=target.value.slice(0,s)+t+target.value.slice(e); const p=s+t.length;
    try{target.setSelectionRange(p,p);}catch(_){} target.dispatchEvent(new Event("input",{bubbles:true})); }
  function back(){ if(!target)return; let s=target.selectionStart??target.value.length,e=target.selectionEnd??s;
    if(s===e){ if(s===0)return; s=s-1; } target.value=target.value.slice(0,s)+target.value.slice(e);
    try{target.setSelectionRange(s,s);}catch(_){} target.dispatchEvent(new Event("input",{bubbles:true})); }
  function show(input,label){ target=input; hint.textContent=label?`数式キーボード　—　${label}`:"数式キーボード";
    el.classList.remove("hidden"); document.body.classList.add("kbopen");
    setTimeout(()=>input.scrollIntoView({block:"center",behavior:"smooth"}),60); }
  function hide(){ target=null; el.classList.add("hidden"); document.body.classList.remove("kbopen"); closeFrac(); }
  const fracEl=document.getElementById("frac"), numEl=document.getElementById("frac-num"), denEl=document.getElementById("frac-den");
  let outerTarget=null, outerLabel="";
  numEl.addEventListener("focus",()=>{ target=numEl; hint.textContent="分数　—　分子"; });
  denEl.addEventListener("focus",()=>{ target=denEl; hint.textContent="分数　—　分母"; });
  function openFrac(){ if(!target||target===numEl||target===denEl)return; outerTarget=target; outerLabel=hint.textContent;
    numEl.value=""; denEl.value=""; fracEl.classList.add("on"); el.classList.add("fracmode"); numEl.focus(); }
  function closeFrac(){ fracEl.classList.remove("on"); el.classList.remove("fracmode"); outerTarget=null; }
  document.getElementById("frac-ok").addEventListener("pointerdown",e=>e.preventDefault());
  document.getElementById("frac-ok").addEventListener("click",()=>{
    if(!outerTarget)return; const n=numEl.value.trim(),d=denEl.value.trim(); let txt="";
    if(n&&d) txt=`(${n}/${d})`; else if(n) txt=n; else { closeFrac(); return; }
    const t=outerTarget; const s=t.selectionStart??t.value.length,e2=t.selectionEnd??s;
    t.value=t.value.slice(0,s)+txt+t.value.slice(e2); const p=s+txt.length;
    try{t.setSelectionRange(p,p);}catch(_){} t.dispatchEvent(new Event("input",{bubbles:true}));
    closeFrac(); show(t, outerLabel.replace(/^数式キーボード\s*—\s*/,"")); });
  document.getElementById("frac-cancel").addEventListener("pointerdown",e=>e.preventDefault());
  document.getElementById("frac-cancel").addEventListener("click",()=>{ if(outerTarget) show(outerTarget, outerLabel.replace(/^数式キーボード\s*—\s*/,"")); else closeFrac(); });
  return { hide, attach(input,label){ input.setAttribute("inputmode","none"); input.addEventListener("focus",()=>show(input,label)); } };
})();

/* ---------- 学籍番号 ---------- */
const makeSid=(g,c,n)=>`${g}${c}${String(n).padStart(2,"0")}`;
function readSid(s){ const m=String(s||"").match(/^(\d)(\d)(\d\d)$/); return m?{g:+m[1],c:+m[2],n:+m[3]}:null; }
function sidLabel(s){ const r=readSid(s); return r?`${r.g}年${r.c}組${r.n}番`:String(s||""); }
function loadStudent(){ try{ const v=JSON.parse(store.get(STUDENT_KEY)||"null"); return (v&&/^\d{4}$/.test(v.sid))?v.sid:null; }catch(e){ return null; } }
const saveStudent=sid=>store.set(STUDENT_KEY, JSON.stringify({sid}));

/* ---------- セッション状態 ---------- */
let SES = null;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 経過時間（タブが見えている間だけカウント） */
function elapsedSeconds(){
  if(!SES) return 0;
  let ms = SES.activeMs;
  if(document.visibilityState === "visible" && SES.lastResume) ms += Date.now() - SES.lastResume;
  return Math.round(ms/1000);
}
document.addEventListener("visibilitychange", ()=>{
  if(!SES) return;
  if(document.visibilityState === "hidden"){
    if(SES.lastResume) SES.activeMs += Date.now() - SES.lastResume;
    SES.lastResume = 0;
  } else {
    SES.lastResume = Date.now();
  }
});
window.addEventListener("beforeunload", ()=>{
  if(SES && !SES.submitted && SES.items.length){
    Study.beacon("study_submit", {
      p_student: SES.sid, p_unit: SES.unit, p_level: SES.level,
      p_reported_minutes: null, p_self_reported: false,
      p_auto_seconds: elapsedSeconds(), p_items: SES.items,
    });
    SES.submitted = true;
  }
});

/* ============================================================
   ホーム
   ============================================================ */
function renderHome(){
  KB.hide(); SES = null;
  const saved = loadStudent();
  const pre = CLASS_ID.match(/^(\d)-(\d)$/);
  app.innerHTML = `
    <header class="sheet"><h1>家庭学習ノート</h1></header>
    <div class="sub" style="margin:6px 2px 0">中学1年　第4章　比例と反比例　·　家でやった学習を記録します</div>
    <div class="card" id="me"></div>
    <div class="foot" style="flex-direction:column">
      <button class="btn" id="go">学習をはじめる</button>
      <button class="btn ghost" id="rec">これまでの記録を見る</button>
    </div>
  `;
  const me = document.getElementById("me");
  const showSaved = sid => {
    me.innerHTML = `<h2>出席番号</h2>
      <div style="display:flex;align-items:baseline;gap:12px">
        <div style="font-family:var(--mono);font-size:30px;letter-spacing:.06em">${sid}</div>
        <div style="font-size:14px;color:var(--ink-soft)">${sidLabel(sid)}</div>
        <button class="btn mini ghost" id="chg" style="margin-left:auto">変更</button>
      </div>`;
    document.getElementById("chg").onclick = ()=>showPicker(sid);
    if(SES===null) window._sid = sid;
  };
  const showPicker = current => {
    const cur = current ? readSid(current) : null;
    const opt=(arr,sel,suf)=>arr.map(v=>`<option value="${v}"${v===sel?" selected":""}>${v}${suf}</option>`).join("");
    const g = pre?+pre[1]:(cur?.g??1), c = pre?+pre[2]:(cur?.c??1);
    me.innerHTML = `<h2>出席番号を選ぶ</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px">
        <div><label class="f">学年</label><select id="g" ${pre?"disabled":""}>${opt(CONFIG.GRADES,g,"年")}</select></div>
        <div><label class="f">組</label><select id="c" ${pre?"disabled":""}>${opt(CONFIG.CLASSES,c,"組")}</select></div>
        <div><label class="f">番号</label><select id="n"><option value="">選ぶ</option>${opt(Array.from({length:CONFIG.CLASS_SIZE},(_,i)=>i+1),cur?.n,"番")}</select></div>
      </div>
      <div class="subq" style="margin-top:12px">
        <div id="prev" style="font-family:var(--mono);font-size:22px;color:var(--ink-soft)">----</div>
        <button class="btn mini" id="ok" style="margin-left:auto">決定</button>
      </div>`;
    const sync=()=>{ const n=document.getElementById("n").value;
      document.getElementById("prev").textContent = n ? makeSid(document.getElementById("g").value,document.getElementById("c").value,n) : "----"; };
    ["g","c","n"].forEach(id=>document.getElementById(id).onchange=sync); sync();
    document.getElementById("ok").onclick=()=>{ const n=document.getElementById("n").value;
      if(!n){ alert("番号を選んでください。"); return; }
      const sid=makeSid(document.getElementById("g").value,document.getElementById("c").value,n);
      saveStudent(sid); window._sid=sid; showSaved(sid); };
  };
  if(saved){ window._sid = saved; showSaved(saved); } else showPicker(null);
  document.getElementById("go").onclick = ()=>{ if(!window._sid){ alert("先に出席番号を選んでください。"); return; } renderPick(); };
  document.getElementById("rec").onclick = ()=>{ if(!window._sid){ alert("先に出席番号を選んでください。"); return; } renderRecord(); };
}

/* ============================================================
   単元・レベル選択
   ============================================================ */
function renderPick(){
  KB.hide();
  let unit = "", level = "まぜる";
  app.innerHTML = `
    <header class="sheet"><h1>今日の学習</h1><button class="x" id="x">やめる</button></header>
    <div class="card">
      <h2>どのプリントの内容？</h2>
      <div class="pickgrid" id="units">
        ${UNITS.map(u=>`<button data-u="${u.id}"><span class="no">${esc(u.no)}</span><span class="nm">${esc(u.name)}</span></button>`).join("")}
        <button data-u="all"><span class="no">4章まるごと</span><span class="nm">比例と反比例ぜんぶからランダム</span></button>
      </div>
    </div>
    <div class="card">
      <h2>難しさ</h2>
      <div class="levels" id="levels">
        <button data-l="基本" aria-pressed="false">基本</button>
        <button data-l="標準" aria-pressed="false">標準</button>
        <button data-l="応用" aria-pressed="false">応用にチャレンジ</button>
        <button data-l="まぜる" aria-pressed="true">まぜる</button>
      </div>
      <div class="sub" style="margin-top:8px">「応用にチャレンジ」を選ぶと、記録に「難問チャレンジ」として残ります。</div>
    </div>
    <div class="foot"><button class="btn" id="start" disabled>スタート</button></div>
  `;
  document.getElementById("x").onclick = renderHome;
  const startBtn = document.getElementById("start");
  const refresh = ()=>{ startBtn.disabled = !unit; };
  document.querySelectorAll("#units button").forEach(b=>b.onclick=()=>{
    unit = b.dataset.u;
    document.querySelectorAll("#units button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    refresh();
  });
  document.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>{
    level = b.dataset.l;
    document.querySelectorAll("#levels button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  });
  startBtn.onclick = ()=>{
    let pool = POOL.filter(p => unit==="all" ? true : p.unit===unit);
    if(level!=="まぜる") pool = pool.filter(p => p.level===level);
    if(!pool.length){ alert("その組み合わせの問題がまだありません。ほかを選んでください。"); return; }
    SES = {
      sid: window._sid, unit, level,
      activeMs: 0, lastResume: Date.now(),
      queue: shuffle(pool.map(p=>p.id)), idx: 0,
      current: null, attemptNo: 1, curAns: {}, judged: null,
      items: [], perProblem: {}, qStartAt: 0, submitted: false,
    };
    nextProblem();
  };
}

/* ============================================================
   演習ループ
   ============================================================ */
function statOf(){
  const solved = Object.keys(SES.perProblem).length;
  let correct=0, challenge=0, redo=0;
  for(const pid in SES.perProblem){
    const r = SES.perProblem[pid];
    if(r.anyOk) correct++;
    if(r.level==="応用") challenge++;
    if(r.attempts>=2) redo++;
  }
  return {solved, correct, challenge, redo};
}
function fmtClock(s){ const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,"0")}`; }

function nextProblem(){
  KB.hide();
  if(SES.idx >= SES.queue.length){ renderTimeAsk("問題がなくなりました"); return; }
  const pid = SES.queue[SES.idx];
  SES.current = POOL.find(p=>p.id===pid);
  SES.attemptNo = (SES.perProblem[pid]?.attempts || 0) + 1;
  SES.curAns = {};
  SES.judged = null;
  SES.qStartAt = Date.now();
  renderPractice();
}
function retrySame(){
  SES.curAns = {};
  SES.judged = null;
  SES.attemptNo = (SES.perProblem[SES.current.id]?.attempts || 0) + 1;
  SES.qStartAt = Date.now();
  renderPractice();
}

function rightText(p){
  return p.subs.map(s=>{
    if(p.type==="choice") return p.choices[s.a];
    if(s.mode==="coord") return `(${s.a[0]}, ${s.a[1]})`;
    if(s.mode==="text") return Array.isArray(s.a)?s.a[0]:String(s.a);
    return String(s.a);
  }).join("　／　");
}
function gradeCurrent(){
  const p = SES.current;
  let allOk = true; const shown = [];
  p.subs.forEach((s,si)=>{
    const u = SES.curAns[si];
    let ok = p.type==="choice" ? (u===s.a) : gradeSub(s.mode, u, s.a);
    if(!ok) allOk = false;
    shown.push(p.type==="choice" ? (u==null?"—":p.choices[u]) : (u ?? ""));
  });
  return { ok: allOk, shownText: shown.join("　／　") };
}

function renderPractice(){
  const p = SES.current;
  const st = statOf();
  app.innerHTML = `
    <div class="statbar">
      <span class="s">問 <b>${st.solved + (SES.judged?0:1)}</b></span>
      <span class="s">正解 <b>${st.correct}</b></span>
      <span class="s">★応用 <b>${st.challenge}</b></span>
      <span class="s">やり直し <b>${st.redo}</b></span>
      <span class="clock" id="clock">⏱ ${fmtClock(elapsedSeconds())}</span>
    </div>
    <div class="q lv-${p.level}">
      <div class="head">
        <span class="n">${SES.attemptNo>1 ? "再" : "問"}</span>
        <span class="prompt">${esc(p.prompt)}</span>
      </div>
      <div style="margin:-4px 0 6px"><span class="lvtag ${p.level}">${p.level}</span>
        <span class="lvtag">${esc((UNITS.find(u=>u.id===p.unit)||{}).short || p.unit)}</span></div>
      ${p.hint ? `<div class="hintline">${esc(p.hint)}</div>` : ""}
      <div id="inputs"></div>
      <div id="judge"></div>
    </div>
    <div class="foot" id="actions"></div>
  `;
  const box = document.getElementById("inputs");
  const locked = !!SES.judged;
  p.subs.forEach((s,si)=>{
    const w = document.createElement("div"); w.className="subrow";
    if(s.prompt) w.innerHTML = `<div class="lbl"><span class="lb">${esc(s.lb||"")}</span>${esc(s.prompt)}</div>`;
    if(p.type==="choice"){
      const c = document.createElement("div"); c.className = "choices" + (p.choices.length<=3?" mini":"");
      p.choices.forEach((txt,ci)=>{
        const b=document.createElement("button"); b.type="button"; b.textContent=txt;
        b.disabled = locked;
        b.setAttribute("aria-pressed", String(SES.curAns[si]===ci));
        b.onclick = ()=>{ SES.curAns[si]=ci;
          c.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed",String(j===ci))); };
        c.appendChild(b);
      });
      w.appendChild(c);
    } else {
      const row=document.createElement("div"); row.className="subq";
      if(!s.prompt && s.lb) row.innerHTML = `<span class="lb">${esc(s.lb)}</span>`;
      const inp=document.createElement("input"); inp.type="text"; inp.placeholder=s.ph||"";
      inp.autocomplete="off"; inp.spellcheck=false; inp.value=SES.curAns[si] ?? ""; inp.disabled=locked;
      inp.oninput=()=>{ SES.curAns[si]=inp.value; };
      if(!locked) KB.attach(inp, s.lb||"");
      row.appendChild(inp); w.appendChild(row);
    }
    box.appendChild(w);
  });

  const actions = document.getElementById("actions");
  if(!SES.judged){
    const b=document.createElement("button"); b.className="btn"; b.textContent="答え合わせ";
    b.onclick = doJudge;
    const q=document.createElement("button"); q.className="btn ghost"; q.textContent="おわりにする";
    q.onclick = ()=>renderTimeAsk();
    actions.append(b,q);
  } else {
    const j = document.getElementById("judge");
    j.className = "judge " + (SES.judged.ok ? "ok" : "ng");
    j.innerHTML = `<div class="mk">${SES.judged.ok ? "○ 正解！" : "× おしい"}</div>
      ${SES.judged.ok ? "" : `<div class="right">正しい答え：${esc(rightText(p))}</div>`}
      ${p.sol ? `<div class="sol">${esc(p.sol)}</div>` : ""}`;
    if(SES.judged.ok){
      const n=document.createElement("button"); n.className="btn"; n.textContent="次の問題へ";
      n.onclick = ()=>{ SES.idx++; nextProblem(); };
      const q=document.createElement("button"); q.className="btn ghost"; q.textContent="おわりにする";
      q.onclick = ()=>renderTimeAsk();
      actions.append(n,q);
    } else {
      const r=document.createElement("button"); r.className="btn gold"; r.textContent="もう一度この問題";
      r.onclick = retrySame;
      const n=document.createElement("button"); n.className="btn ghost"; n.textContent="次の問題へ";
      n.onclick = ()=>{ SES.idx++; nextProblem(); };
      actions.append(r,n);
      const q=document.createElement("button"); q.className="btn ghost"; q.style.flex="0 0 100%"; q.textContent="おわりにする";
      q.onclick = ()=>renderTimeAsk();
      actions.appendChild(q);
    }
  }
  clearInterval(window._clk);
  window._clk = setInterval(()=>{ const el=document.getElementById("clock"); if(el) el.textContent="⏱ "+fmtClock(elapsedSeconds()); }, 1000);
}

function doJudge(){
  const p = SES.current;
  // 未入力チェック（choice/input）
  const blank = p.subs.some((s,si)=>{
    const u = SES.curAns[si];
    return p.type==="choice" ? (u==null) : (u==null || String(u).trim()==="");
  });
  if(blank && !confirm("答えていないところがあります。このまま答え合わせしますか？")) return;

  const g = gradeCurrent();
  SES.judged = g;
  const pid = p.id;
  const rec = SES.perProblem[pid] || {attempts:0, anyOk:false, level:p.level};
  rec.attempts += 1;
  if(g.ok) rec.anyOk = true;
  SES.perProblem[pid] = rec;
  SES.items.push({
    problem_id: pid, unit: p.unit, level: p.level,
    prompt: p.prompt.slice(0,120), raw: g.shownText,
    ok: g.ok, redo: SES.attemptNo > 1, attempt_no: SES.attemptNo,
    ms: Date.now() - SES.qStartAt,
  });
  renderPractice();
}

/* ============================================================
   「何分勉強しましたか？」
   ============================================================ */
function renderTimeAsk(reason){
  KB.hide();
  clearInterval(window._clk);
  const st = statOf();
  const autoMin = Math.max(1, Math.round(elapsedSeconds()/60));
  let picked = null;
  app.innerHTML = `
    <header class="sheet"><h1>今日の学習おわり</h1></header>
    ${reason ? `<div class="notice">${esc(reason)}</div>` : ""}
    <div class="card">
      <h2>今日は、家で何分 勉強しましたか？</h2>
      <div class="sub">画面を開いていた時間は だいたい <b>${autoMin}分</b> でした（席を外した時間はふくみません）。実際に勉強した時間を選ぶか、入力してください。</div>
      <div class="timegrid" id="tg">
        ${[5,10,15,20,25,30,40,45,60].map(m=>`<button data-m="${m}">${m}分</button>`).join("")}
      </div>
      <label class="f">自分で入力（分）</label>
      <input type="number" id="tmin" min="1" max="600" inputmode="numeric" placeholder="例: 35">
    </div>
    <div class="card">
      <h2>今日やったこと</h2>
      <div class="kpis">
        <div class="kpi"><div class="v">${st.solved}</div><div class="k">解いた問題</div></div>
        <div class="kpi"><div class="v">${st.correct}</div><div class="k">正解</div></div>
        <div class="kpi"><div class="v">${st.challenge}</div><div class="k">応用チャレンジ</div></div>
        <div class="kpi"><div class="v">${st.redo}</div><div class="k">やり直し</div></div>
      </div>
    </div>
    <div class="foot"><button class="btn" id="save">きろくする</button></div>
    <div class="foot"><button class="btn ghost" id="resume">まだ続ける</button></div>
  `;
  const tmin = document.getElementById("tmin");
  document.querySelectorAll("#tg button").forEach(b=>b.onclick=()=>{
    picked = +b.dataset.m; tmin.value = "";
    document.querySelectorAll("#tg button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  });
  tmin.oninput = ()=>{ picked = null; document.querySelectorAll("#tg button").forEach(x=>x.setAttribute("aria-pressed","false")); };
  document.getElementById("resume").onclick = ()=>{
    if(SES.current && SES.idx < SES.queue.length){ SES.lastResume = Date.now(); renderPractice(); }
    else { SES.idx = Math.max(0, SES.idx-1); SES.lastResume = Date.now(); nextProblem(); }
  };
  document.getElementById("save").onclick = async ()=>{
    const mins = picked != null ? picked : (parseInt(tmin.value,10) || 0);
    if(!mins || mins < 1){ alert("勉強した時間を選ぶか、入力してください。"); return; }
    document.getElementById("save").disabled = true;
    await submitSession(mins);
  };
}

async function submitSession(minutes){
  SES.submitted = true;
  const payload = {
    p_student: SES.sid, p_unit: SES.unit, p_level: SES.level,
    p_reported_minutes: minutes, p_self_reported: true,
    p_auto_seconds: elapsedSeconds(), p_items: SES.items,
  };
  let res = null;
  try { res = await Study.rpc("study_submit", payload); } catch(e){ res = null; }
  const st = statOf();
  renderRecord({
    justNow: { minutes, ...st, ok: !!(res && res.ok) },
  });
}

/* ============================================================
   記録（可視化）
   ============================================================ */
async function renderRecord(opts){
  KB.hide();
  clearInterval(window._clk);
  SES = null;
  const sid = window._sid;
  app.innerHTML = `
    <header class="sheet"><h1>${sid} の学習記録</h1><button class="x" id="home">ホーム</button></header>
    <div id="rc"><div class="card"><p class="sub">読み込み中…</p></div></div>
  `;
  document.getElementById("home").onclick = renderHome;
  const rc = document.getElementById("rc");

  let sessions = [];
  try {
    const r = await Study.rpc("study_my_history", { p_student: sid });
    if(r && !r.error) sessions = r.sessions || [];
  } catch(e){}

  const todayStr = new Date().toISOString().slice(0,10);
  const tot = { min:0, solved:0, correct:0, itemsForRate:0, correctForRate:0, challenge:0, redo:0 };
  const byDay = {}, byUnit = {};
  sessions.forEach(s=>{
    const min = s.minutes || 0;
    tot.min += min; tot.solved += s.solved||0;
    tot.correct += s.correct||0;
    tot.itemsForRate += s.solved||0; tot.correctForRate += s.correct||0;
    tot.challenge += s.challenge||0; tot.redo += s.redo||0;
    byDay[s.date] = (byDay[s.date]||0) + min;
    const uk = s.unit || "mix";
    byUnit[uk] = (byUnit[uk]||0) + (s.solved||0);
  });
  const rate = tot.itemsForRate ? Math.round(tot.correctForRate/tot.itemsForRate*100) : 0;
  const chRate = tot.solved ? Math.round(tot.challenge/tot.solved*100) : 0;

  // 直近7日
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const maxMin = Math.max(10, ...days.map(d=>byDay[d]||0));

  const just = opts && opts.justNow;
  const unitName = id => (UNITS.find(u=>u.id===id)||{}).short || (id==="all"?"4章まるごと":(id==="mix"?"まぜる":id));
  const maxU = Math.max(1, ...Object.values(byUnit));

  rc.innerHTML = `
    ${just ? `<div class="notice ${just.ok?"ok":"warn"}">
      ${just.ok ? "きょうの学習を記録しました。" : "記録の送信に失敗しました（電波を確認してください）。"}
      　${just.minutes}分・${just.solved}問・正解${just.correct}・応用${just.challenge}・やり直し${just.redo}
    </div>` : ""}

    <div class="card">
      <h2>これまでの合計</h2>
      <div class="kpis">
        <div class="kpi"><div class="v">${tot.min}</div><div class="k">分</div></div>
        <div class="kpi"><div class="v">${tot.solved}</div><div class="k">問</div></div>
        <div class="kpi"><div class="v">${rate}<span style="font-size:13px">%</span></div><div class="k">正答率</div></div>
        <div class="kpi"><div class="v">${tot.challenge}</div><div class="k">応用チャレンジ</div></div>
        <div class="kpi"><div class="v">${tot.redo}</div><div class="k">やり直し</div></div>
        <div class="kpi"><div class="v">${sessions.length}</div><div class="k">学習した回</div></div>
      </div>
      <div class="sub" style="margin-top:8px">応用チャレンジ率 ${chRate}%（解いた問題のうち応用だった割合）</div>
    </div>

    <div class="card">
      <h2>この1週間の学習時間</h2>
      ${sessions.length ? `<div class="daybars">
        ${days.map(d=>{
          const v = byDay[d]||0;
          const w = Math.round(v/maxMin*100);
          const md = d.slice(5).replace("-","/");
          return `<div class="daybar"><span class="d">${md}${d===todayStr?" 今日":""}</span>
            <span class="track"><span class="fill" style="width:${w}%"></span></span>
            <span class="val">${v?v+"分":"—"}</span></div>`;
        }).join("")}
      </div>` : `<p class="sub">まだ記録がありません。</p>`}
    </div>

    ${Object.keys(byUnit).length ? `<div class="card">
      <h2>プリント別の取り組み（問題数）</h2>
      ${Object.entries(byUnit).sort((a,b)=>b[1]-a[1]).map(([u,v])=>`
        <div class="unitrow"><span class="un">${esc(unitName(u))}</span>
          <span class="track"><span class="fill" style="width:${Math.round(v/maxU*100)}%"></span></span>
          <span class="val">${v}問</span></div>`).join("")}
    </div>` : ""}

    <div class="foot"><button class="btn" id="again">もう一度 学習する</button></div>
  `;
  document.getElementById("again").onclick = renderPick;
}

/* ============================================================
   起動
   ============================================================ */
(function boot(){
  if(!Study.configReady()){
    app.innerHTML = `<div class="card"><h2>準備中です</h2><p class="sub">config.js に Supabase の接続情報を設定してください。</p></div>`;
    return;
  }
  renderHome();
})();
</script>
