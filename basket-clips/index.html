<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バスケ得点クリップ</title>
<meta name="description" content="バスケの試合動画から、点を入れた場面・入れられた場面を5秒ずつ切り出して、続けて見たり1本の動画にしたりするブラウザアプリ。「バスケ タップ記録」の記録から、選手ごと・プレーごとの場面も切り出せます（動画はどこにも送りません）">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🏀</span><div><b>バスケ得点クリップ</b><small>得点の場面を5秒ずつ・タップ記録の場面も</small></div></div>
    <div class="actions">
      <button id="btnOpen" class="btn primary">🎬 動画<span class="wide">を選ぶ</span></button>
      <button id="btnLog" class="btn" title="「バスケ タップ記録」の記録を読み込む">📲 タップ記録<span class="wide">を読み込む</span></button>
      <button id="btnHelp" class="btn icon" title="使い方" aria-label="使い方">❓</button>
    </div>
    <input type="file" id="fileVideo" accept="video/*,.mp4,.mov,.m4v,.webm" hidden>
    <input type="file" id="fileLog" accept=".json,application/json" hidden>
  </header>

  <main class="main">
    <section class="stage" aria-label="映像">
      <div class="viewer" id="viewer">
        <div class="media-slot" id="mediaSlot">
          <div class="empty-media"><b>試合の動画を選んでください</b><br>「🎬 動画を選ぶ」か、ここに動画ファイルをドロップ</div>
        </div>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div class="ov-badge" id="ovBadge" hidden></div>
        <div class="ov-drop" id="ovDrop" hidden>ここに動画ファイルをドロップ</div>
      </div>
      <div class="transport" id="transport">
        <button class="btn play" id="btnPlay" title="再生 / 一時停止（スペース）"><span class="ico">▶</span></button>
        <button class="btn" id="btnBack" title="5秒戻る（← で2秒）">−5秒</button>
        <button class="btn" id="btnFwd" title="5秒進む（→ で2秒）">+5秒</button>
        <button class="btn small" id="btnPrevF" title="1コマ戻る（,）">◂</button>
        <button class="btn small" id="btnNextF" title="1コマ進む（.）">▸</button>
        <select id="speedSel" title="再生の速さ" aria-label="再生の速さ"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option></select>
        <span class="time" id="timeText">0:00 / 0:00</span>
        <span class="spacer"></span>
        <span class="reelbar" id="reelBar" hidden>
          <span id="reelLabel"></span>
          <button class="btn small" id="reelPrev" title="前の場面">⏮</button>
          <button class="btn small" id="reelStop" title="続けて再生をやめる">⏹</button>
          <button class="btn small" id="reelNext" title="次の場面">⏭</button>
        </span>
      </div>
      <canvas id="timeline" title="クリック・ドラッグで移動（上の段＝入れた、下の段＝入れられた）"></canvas>
    </section>

    <section class="panel" id="panel" aria-label="操作"></section>
  </main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/vision.js"></script>
<script src="js/goalfind.js"></script>
<script src="js/auto.js"></script>
<script src="js/mp4.js"></script>
<script src="js/auto-engine.js"></script>
<script src="js/clips.js"></script>
<script src="js/taplog.js"></script>
<script src="js/tapvideo.js"></script>
<script src="js/store.js"></script>
<script src="js/media.js"></script>
<script src="js/export.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
