<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>バスケ育成チャット</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23c9541a%22/%3E%3Cpath d=%22M2 16h28M16 2v28M6.2 6.2c5 5.2 5 14.4 0 19.6M25.8 6.2c-5 5.2-5 14.4 0 19.6%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* バスケ育成チャット
   レイアウト：スマホが主役。会話（チャット）を1列に、下にタブ（チャット・図鑑・動画）。項目をひらくと、下から（パソコンでは右から）シートが出る。
   色：作戦ボードの白（board）と墨（ink）。操作と強調はボールのオレンジ（ball）。作戦図はメープルの床（floor）に、攻めの青（o）と守りの赤（x）。
   字：本文は Zen Kaku Gothic New、見出しは Dela Gothic One（少しだけ）、数と時間は Barlow Condensed（スコアボードの字）。 */
:root {
  --board: #f2f3ef;
  --sheet: #ffffff;
  --sheet-2: #f7f8f5;
  --ink: #1d2422;
  --ink-2: #4a5552;
  --ink-3: #6f7a76;
  --line: #d9ddd6;
  --line-2: #c3c9c1;
  --ball: #c9541a;
  --ball-ink: #ffffff;
  --ball-soft: #fbe8dc;
  --ball-line: #f0c4a8;
  --o: #1f4d9c;
  --x: #be3027;
  --ok: #26734a;
  --ok-soft: #e4f2e9;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --floor: #ecd2a2;
  --floor-paint: #dda56c;
  --floor-line: #5b4228;
  --floor-out: #e4dfd2;
  --me: #fbe8dc;
  --me-ink: #3b1d0c;
  --shadow: 0 1px 2px rgba(29, 36, 34, 0.06), 0 8px 24px rgba(29, 36, 34, 0.08);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Zen Kaku Gothic New", sans-serif;
  --fs-xs: 0.75rem;
  --fs-s: 0.86rem;
  --fs-m: 1rem;
  --fs-l: 1.12rem;
  --fs-xl: 1.36rem;
  --fs-2xl: 1.7rem;
  --r: 12px;
  --r-s: 8px;
  --tab-h: 58px;
  --head-h: 52px;
  --measure: 46rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #151a19;
    --sheet: #1d2422;
    --sheet-2: #222a28;
    --ink: #e9ece8;
    --ink-2: #b8c0bc;
    --ink-3: #8d9793;
    --line: #313a37;
    --line-2: #44504c;
    --ball: #ec7a3c;
    --ball-ink: #1b0d05;
    --ball-soft: #3a2518;
    --ball-line: #6a3e24;
    --o: #8fb2f2;
    --x: #f2867d;
    --ok: #7fd1a1;
    --ok-soft: #1c3226;
    --warn: #f0c46a;
    --warn-soft: #332914;
    --floor: #5c4630;
    --floor-paint: #6e4b2c;
    --floor-line: #e9dcc6;
    --floor-out: #2a2621;
    --me: #3a2518;
    --me-ink: #fbe3d3;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #151a19;
  --sheet: #1d2422;
  --sheet-2: #222a28;
  --ink: #e9ece8;
  --ink-2: #b8c0bc;
  --ink-3: #8d9793;
  --line: #313a37;
  --line-2: #44504c;
  --ball: #ec7a3c;
  --ball-ink: #1b0d05;
  --ball-soft: #3a2518;
  --ball-line: #6a3e24;
  --o: #8fb2f2;
  --x: #f2867d;
  --ok: #7fd1a1;
  --ok-soft: #1c3226;
  --warn: #f0c46a;
  --warn-soft: #332914;
  --floor: #5c4630;
  --floor-paint: #6e4b2c;
  --floor-line: #e9dcc6;
  --floor-out: #2a2621;
  --me: #3a2518;
  --me-ink: #fbe3d3;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--board);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-m);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--o); }
:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }
b, strong { font-weight: 700; }
mark { background: var(--ball-soft); color: inherit; padding: 0 0.1em; border-radius: 3px; }
.num { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 枠 ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--sheet);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 76rem; margin: 0 auto; height: var(--head-h);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); min-width: 0; }
.logo-mark { width: 28px; height: 28px; flex: none; }
.logo-text { font-family: var(--font-display); font-size: 1.06rem; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-nav { margin-left: auto; display: none; gap: 4px; }
.top-nav a, .tab a {
  text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: var(--fs-s);
  display: flex; align-items: center; gap: 6px;
}
.top-nav a { padding: 7px 14px; border-radius: 999px; }
.top-nav a[aria-current="page"] { background: var(--ink); color: var(--sheet); }
.cond-btn {
  margin-left: auto; border: 1px solid var(--line-2); background: var(--sheet-2); border-radius: 999px;
  padding: 5px 12px; font-size: var(--fs-xs); color: var(--ink-2); display: flex; align-items: center; gap: 6px; max-width: 52vw;
}
.cond-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cond-btn svg { flex: none; }

.tab {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--sheet); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab-in { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tab-h); max-width: 34rem; margin: 0 auto; }
.tab a { flex-direction: column; justify-content: center; gap: 2px; font-size: 0.72rem; }
.tab a svg { width: 22px; height: 22px; }
.tab a[aria-current="page"] { color: var(--ball); }

main {
  max-width: var(--measure); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tab-h) + 120px + env(safe-area-inset-bottom, 0px));
}
main.no-composer { padding-block: 18px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px)); }

@media (min-width: 900px) {
  .top-nav { display: flex; }
  .cond-btn { margin-left: 12px; max-width: 22rem; }
  .tab { display: none; }
  main { padding-block: 24px 140px; }
  main.no-composer { padding-block: 24px 48px; }
  body.sheet-open main { margin-right: min(560px, 44vw); margin-left: max(16px, calc((100vw - min(560px, 44vw) - var(--measure)) / 2)); }
}

/* ---------- 会話 ---------- */
.log { display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.msg-me { align-items: flex-end; }
.bubble-me {
  background: var(--me); color: var(--me-ink); border-radius: 18px 18px 4px 18px;
  padding: 9px 15px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg-bot { align-items: stretch; }
.bot-head { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: var(--fs-xs); font-weight: 700; }
.bot-face { width: 22px; height: 22px; flex: none; }
.bot-card {
  background: var(--sheet); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r);
  padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.bot-card > p { margin: 0; }
.bot-card > *, .sheet-body > *, .sec > *, .d-sec > * { flex-shrink: 0; }
.lead { font-size: var(--fs-m); }
.lead-sub { color: var(--ink-2); font-size: var(--fs-s); }
.issue-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-l); line-height: 1.45; text-wrap: balance; }
.eyebrow { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec-h { margin: 0; font-size: var(--fs-s); font-weight: 700; color: var(--ink-2); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec-h .count { color: var(--ink-3); font-weight: 400; font-size: var(--fs-xs); }
.ask { background: var(--ball-soft); border: 1px solid var(--ball-line); border-radius: var(--r-s); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ask p { margin: 0; font-weight: 700; }
.tip { margin: 0; padding: 10px 12px; border-radius: var(--r-s); background: var(--sheet-2); border-left: 3px solid var(--ok); font-size: var(--fs-s); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-2); background: var(--sheet); color: var(--ink);
  border-radius: 999px; padding: 5px 12px; font-size: var(--fs-s); line-height: 1.4; text-align: left;
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; max-width: 100%;
}
.chip:hover { border-color: var(--ink-3); }
.chip-go { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); font-weight: 700; }
.chip-go:hover { border-color: var(--ball); filter: brightness(1.05); }
.chip-soft { background: var(--ball-soft); border-color: var(--ball-line); }
.chip-ghost { border-style: dashed; color: var(--ink-2); }
.chip small { color: var(--ink-3); font-size: var(--fs-xs); }
.chip-go small { color: inherit; opacity: 0.8; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.k-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink-3); }
.k-issue .k-dot, .k-dot.k-issue { background: var(--ball); }
.k-view .k-dot, .k-dot.k-view { background: var(--ok); }
.k-drill .k-dot, .k-dot.k-drill { background: var(--o); }
.k-tactic .k-dot, .k-dot.k-tactic { background: var(--x); }

/* 原因 */
.causes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.causes li { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.causes .c-text { font-weight: 700; }
.causes .c-check { font-size: var(--fs-s); color: var(--ink-2); }
.causes .c-check::before { content: "確かめ方　"; color: var(--ink-3); font-size: var(--fs-xs); font-weight: 700; }

/* 項目のカード（練習・視点） */
.cards { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 560px) { .cards.two { grid-template-columns: 1fr 1fr; } }
.card {
  border: 1px solid var(--line); border-radius: var(--r-s); background: var(--sheet); padding: 11px 12px;
  display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0; color: inherit; text-decoration: none;
}
.card:hover { border-color: var(--line-2); background: var(--sheet-2); }
.card-h { display: flex; align-items: flex-start; gap: 8px; font-weight: 700; line-height: 1.45; }
.card-h .k-dot { margin-top: 0.5em; }
.card-h .star { margin-left: auto; color: var(--ball); font-size: 0.9rem; }
.card-sub { font-size: var(--fs-s); color: var(--ink-2); overflow-wrap: anywhere; }
.card-cue { font-size: var(--fs-s); font-weight: 700; color: var(--ok); }
.card-cue::before { content: "合言葉　"; color: var(--ink-3); font-size: var(--fs-xs); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: var(--fs-xs); color: var(--ink-3); }
.meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.meta .solo { color: var(--ok); font-weight: 700; }
.lv { display: inline-flex; gap: 2px; }
.lv i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); display: block; }
.lv i.on { background: var(--ball); }
.more-btn { align-self: flex-start; border: 0; background: none; color: var(--ink-3); font-size: var(--fs-s); padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }

/* 動画 */
.vids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .vids { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.vid {
  border: 1px solid var(--line); border-radius: var(--r-s); background: var(--sheet); padding: 0; overflow: hidden;
  display: flex; flex-direction: column; text-align: left; min-width: 0;
}
.vid-thumb { aspect-ratio: 16 / 9; max-width: 100%; background: var(--floor-out); display: grid; place-items: center; position: relative; overflow: hidden; }
.vid-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vid-thumb svg { width: 30px; height: 30px; color: var(--ink-3); }
.vid-dur { position: absolute; right: 6px; bottom: 5px; background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 0.7rem; padding: 0 5px; border-radius: 4px; }
.vid-body { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vid-name { font-size: var(--fs-s); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vid-folder { font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vid-why { font-size: var(--fs-xs); color: var(--ink-3); }
.empty-vid { border: 1px dashed var(--line-2); border-radius: var(--r-s); padding: 12px; font-size: var(--fs-s); color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.empty-vid p { margin: 0; }

/* 練習プラン */
.plan { display: flex; flex-direction: column; gap: 12px; }
.plan-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.plan-total { font-family: var(--font-num); font-weight: 600; font-size: 2.1rem; line-height: 1; }
.plan-total small { font-size: 1rem; margin-left: 2px; }
.plan-block { display: flex; flex-direction: column; gap: 0; }
.plan-block-h { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); letter-spacing: 0.08em; padding: 4px 0; border-bottom: 1px solid var(--line); }
.plan-row { display: grid; grid-template-columns: 3.4rem 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.plan-row:hover { background: var(--sheet-2); }
.plan-time { display: flex; flex-direction: column; line-height: 1.15; }
.plan-time .num { font-size: 1.15rem; }
.plan-time small { color: var(--ink-3); font-size: var(--fs-xs); }
.plan-name { font-weight: 700; line-height: 1.45; }
.plan-pt { font-size: var(--fs-s); color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--sheet); padding: 5px 12px; font-size: var(--fs-s); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* 入力欄 */
.composer {
  position: fixed; left: 0; right: 0; z-index: 22;
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--board) 70%, transparent);
  padding-top: 14px;
}
.composer-in {
  max-width: var(--measure); margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 10px;
}
.composer textarea {
  flex: 1; min-width: 0; resize: none; border: 1px solid var(--line-2); border-radius: 22px; background: var(--sheet);
  padding: 10px 16px; line-height: 1.5; max-height: 8.5em; min-height: 44px; box-shadow: var(--shadow);
}
.composer textarea:focus { outline: none; border-color: var(--ball); }
.send {
  width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: var(--ball); color: var(--ball-ink);
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.send:disabled { opacity: 0.45; cursor: default; }
@media (min-width: 900px) {
  .composer { bottom: 0; }
  body.sheet-open .composer { right: min(560px, 44vw); }
}

/* ---------- シート（項目の中身） ---------- */
.sheet-back { position: fixed; inset: 0; background: rgba(10, 14, 13, 0.4); z-index: 40; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 28px);
  background: var(--sheet); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  animation: up 0.22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes side { from { transform: translateX(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet-bar {
  display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); min-height: 50px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.sheet-bar .kind { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.icon-btn { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--sheet-2); }
.icon-btn[aria-pressed="true"] { color: var(--ball); }
.sheet-bar .right { margin-left: auto; display: flex; gap: 2px; }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(32px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
@media (min-width: 900px) {
  .sheet-back { display: none; }
  .sheet { left: auto; top: calc(var(--head-h) + env(safe-area-inset-top, 0px)); width: min(560px, 44vw); border-radius: 0; border-left: 1px solid var(--line); box-shadow: none; animation-name: side; z-index: 15; }
}
.d-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-2xl); line-height: 1.35; text-wrap: balance; }
.d-alias { margin: 0; font-size: var(--fs-xs); color: var(--ink-3); }
.d-summary { margin: 0; font-size: var(--fs-m); }
.d-sec { display: flex; flex-direction: column; gap: 6px; }
.d-sec h3 { margin: 0; font-size: var(--fs-s); font-weight: 700; color: var(--ink-2); letter-spacing: 0.04em; }
.d-list { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }
.d-list.steps { list-style: none; padding-left: 0; counter-reset: st; }
.d-list.steps li { counter-increment: st; display: grid; grid-template-columns: 1.8rem 1fr; gap: 6px; }
.d-list.steps li::before { content: counter(st); font-family: var(--font-num); font-weight: 600; font-size: 1.05rem; color: var(--ball); text-align: center; border: 1.5px solid var(--ball-line); border-radius: 50%; width: 1.6rem; height: 1.6rem; line-height: 1.45rem; }
.d-list.check { list-style: none; padding-left: 0; }
.d-list.check li { display: grid; grid-template-columns: 1.5rem 1fr; gap: 4px; }
.d-list.check li::before { content: ""; width: 0.95rem; height: 0.95rem; border: 1.5px solid var(--ok); border-radius: 4px; margin-top: 0.38em; }
.ng { display: flex; flex-direction: column; gap: 6px; }
.ng-row { display: grid; grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.ng-row div { padding: 8px 12px; font-size: var(--fs-s); }
.ng-row .bad { background: var(--sheet-2); color: var(--x); font-weight: 700; }
.ng-row .bad::before { content: "よくある失敗　"; color: var(--ink-3); font-size: var(--fs-xs); font-weight: 700; }
.ng-row .fix::before { content: "直し方　"; color: var(--ok); font-size: var(--fs-xs); font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.facts div { background: var(--sheet); padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.facts div:last-child { grid-column: auto / -1; }
.facts dt { font-size: var(--fs-xs); color: var(--ink-3); }
.facts dd { margin: 0; font-weight: 700; font-size: var(--fs-s); overflow-wrap: anywhere; }
.facts dd .num { font-size: 1.15rem; }
.pair { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .pair { grid-template-columns: 1fr 1fr; } }
.box { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.box h4 { margin: 0; font-size: var(--fs-xs); color: var(--ink-3); letter-spacing: 0.06em; }
.box ul { margin: 0; padding-left: 1.2em; font-size: var(--fs-s); }
.box.good h4 { color: var(--ok); }
.box.weak h4 { color: var(--x); }
.note { margin: 0; padding: 10px 12px; background: var(--warn-soft); color: var(--ink); border-radius: var(--r-s); font-size: var(--fs-s); }
.note::before { content: "注意　"; font-weight: 700; color: var(--warn); }
.cue-big { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); color: var(--ok); }

/* 作戦図 */
.cv { display: flex; flex-direction: column; gap: 6px; }
.cv-stage { background: var(--floor-out); border-radius: var(--r-s); overflow: hidden; max-width: 100%; }
.cv-stage svg { display: block; width: 100%; height: auto; max-height: 62vh; }
.cv-full svg { max-height: 78vh; }
.cv-out { fill: var(--floor-out); }
.cv-floor { fill: var(--floor); }
.cv-paint { fill: var(--floor-paint); }
.cv-line { fill: none; stroke: var(--floor-line); stroke-width: 0.07; opacity: 0.8; }
.cv-none { fill: none; }
.cv-dash { stroke-dasharray: 0.3 0.25; }
.cv-board { stroke: var(--floor-line); stroke-width: 0.12; }
.cv-rim { fill: none; stroke: var(--ball); stroke-width: 0.08; }
.cv-mv { fill: none; stroke: var(--ink); stroke-width: 0.1; stroke-linecap: round; stroke-linejoin: round; }
.cv-pass { stroke-dasharray: 0.28 0.2; }
.cv-move { stroke-width: 0.08; opacity: 0.85; }
.cv-screen { stroke-width: 0.14; }
.cv-def { stroke: var(--x); }
.cv-ah { fill: var(--ink); }
.cv-ah-x { fill: var(--x); }
.cv-p { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; }
.cv-still .cv-p, .cv-still .cv-ball { transition: none; }
.cv-o circle { fill: var(--o); stroke: var(--sheet); stroke-width: 0.06; }
.cv-o text { fill: var(--sheet); font-family: var(--font-num); font-weight: 600; font-size: 0.62px; text-anchor: middle; dominant-baseline: central; }
.cv-x path { stroke: var(--x); stroke-width: 0.13; stroke-linecap: round; fill: none; }
.cv-x text { fill: var(--x); font-family: var(--font-num); font-weight: 600; font-size: 0.42px; text-anchor: middle; dominant-baseline: central; }
.cv-cone { fill: var(--ball); stroke: var(--sheet); stroke-width: 0.04; }
.cv-ball { fill: var(--ball); stroke: var(--sheet); stroke-width: 0.05; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; }
.cv-bar { display: flex; align-items: center; gap: 8px; }
.cv-btn { border: 1px solid var(--line-2); background: var(--sheet); border-radius: 50%; width: 34px; height: 34px; flex: none; font-size: 0.8rem; color: var(--ink-2); }
.cv-count { font-family: var(--font-num); font-weight: 600; color: var(--ink-3); flex: none; }
.cv-note { margin: 0; font-size: var(--fs-s); color: var(--ink-2); min-width: 0; }
.cv-legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.7rem; color: var(--ink-3); }
.cv-legend span { display: inline-flex; align-items: center; gap: 5px; }
.cv-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ink); }
.cv-legend .lg-o { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--o); }
.cv-legend .lg-x { width: 10px; height: 10px; border: 0; position: relative; }
.cv-legend .lg-x::before, .cv-legend .lg-x::after { content: ""; position: absolute; left: 4px; top: -1px; width: 2px; height: 12px; background: var(--x); transform: rotate(45deg); }
.cv-legend .lg-x::after { transform: rotate(-45deg); }
.cv-legend .lg-pass { border-top-style: dashed; }
.cv-legend .lg-drb { border-top-style: dotted; border-top-width: 3px; }
.cv-legend .lg-scr { width: 14px; border-right: 2px solid var(--ink); height: 8px; border-top-width: 2px; transform: translateY(3px); border-top: 0; border-bottom: 2px solid var(--ink); height: 0; position: relative; }
.cvt { width: 100%; height: auto; display: block; }
.cvt-o { fill: var(--o); }
.cvt-x { stroke: var(--x); stroke-width: 0.3; fill: none; }
@media (prefers-reduced-motion: reduce) {
  .cv-p, .cv-ball, .sheet { transition: none; animation: none; }
}

/* ---------- 図鑑 ---------- */
.page-h { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); }
.page-lead { margin: 0 0 14px; color: var(--ink-2); font-size: var(--fs-s); }
.search { position: relative; margin-bottom: 12px; }
.search input { width: 100%; border: 1px solid var(--line-2); border-radius: 999px; background: var(--sheet); padding: 10px 16px 10px 40px; }
.search input:focus { outline: none; border-color: var(--ball); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.kinds { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.kinds::-webkit-scrollbar { display: none; }
.kinds .chip { flex: none; }
.group-h { margin: 18px 0 8px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; }
.group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.rows { display: flex; flex-direction: column; gap: 6px; }
.lib-tactic { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.lib-tactic .cvt { border-radius: 6px; overflow: hidden; }
.lib-count { font-size: var(--fs-xs); color: var(--ink-3); margin: 0 0 6px; }

/* ---------- 動画 ---------- */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel p { margin: 0; }
.panel-h { margin: 0; font-size: var(--fs-m); font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid var(--line-2); background: var(--sheet); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: var(--fs-s);
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--ink);
}
.btn-go { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); }
.btn:disabled { opacity: 0.5; }
.status { font-size: var(--fs-s); color: var(--ink-2); }
.status b { color: var(--ink); }
.small { font-size: var(--fs-xs); color: var(--ink-3); }
.vrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.vrow .vid-thumb { border-radius: 6px; }
.vrow-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.vrow-name { font-weight: 700; font-size: var(--fs-s); overflow-wrap: anywhere; line-height: 1.45; background: none; border: 0; padding: 0; text-align: left; }
.tagchips { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 0.72rem; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--sheet); display: inline-flex; align-items: center; gap: 4px; }
.tag.manual { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tag.none { border-style: dashed; color: var(--ink-3); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-s); }
.field input, .field textarea, .field select { border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--sheet); padding: 8px 10px; min-width: 0; }
.field textarea { min-height: 7em; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.78rem; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(var(--tab-h) + 80px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 999px; font-size: var(--fs-s); box-shadow: var(--shadow); max-width: calc(100vw - 32px);
}
video.player { width: 100%; max-height: 60vh; background: #000; border-radius: var(--r-s); display: block; }

/* 条件 */
.cond { display: flex; flex-direction: column; gap: 14px; }
.cond-row { display: flex; flex-direction: column; gap: 6px; }
.cond-row > span { font-size: var(--fs-s); font-weight: 700; color: var(--ink-2); }

/* はじめの画面 */
.hello { display: flex; flex-direction: column; gap: 14px; }
.hello-court { width: 100%; max-width: 100%; border-radius: var(--r-s); overflow: hidden; }
.hello h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.2rem, 4.6vw, var(--fs-2xl)); line-height: 1.4; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-s); color: var(--ink-2); }
.stats b { font-family: var(--font-num); font-weight: 600; font-size: 1.3rem; color: var(--ink); margin-right: 2px; }
.reset { align-self: center; border: 0; background: none; color: var(--ink-3); font-size: var(--fs-xs); text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

</style>
</head>
<body>
<div id="app"></div>
<script>
var BC;
/* ---- js/core.js ---- */
/* バスケ育成チャット：データの入れ物と、ことばから探すしくみ（BC）。画面（js/app.js）からも検査（tools/check.cjs）からも使う。DOM は使わない。
   データのファイル（data/*.js）は、BC.tactic / BC.drill / BC.view / BC.issue に渡して自分を登録する（1つずつでも、配列でまとめてでもよい）。

   ■ 共通
     id      種類ごとの頭文字＋半角の英小文字・数字・-（戦術 t- ／練習メニュー d- ／改善の視点 v- ／困りごと i-）
     alias   別名・英語名・表記ゆれ（名前で探す・動画のファイル名と照らす。そのものを指す言葉だけ。例：'マイカン'、'Mikan Drill'）
     words   チャットの文に出てきそうな言葉（探すときだけ使う。動画とは照らさない。例：'ゴール下'、'連続'）
     level   1＝はじめて・ミニバス／2＝中学・高校の部活／3＝上級（高校の上位・大学・社会人）
     skills  関係する技能の id（data/skills.js）。1つ目が主
     文の書き方：summary・empathy・tip は です・ます。how・steps・points・checks などの箇条は、常体の短い文か体言止め。
     **太字** が使える。

   ■ 戦術  BC.tactic({ id:'t-…', name, alias, words, cat, kind, level, skills, summary, how, points, good, weak, counter, note, drills, views, related, diagram })
     cat      'offense'（攻め）| 'defense'（守り）| 'transition'（攻守の切りかえ）| 'situation'（場面：スローイン・終盤など）
     kind     種類（短く。例：'2人の動き'、'システム'、'セットプレー'、'ゾーン'、'プレス'）
     how      動き方（順番に）　points 成功のポイント　good 強み・向いているチーム　weak 弱み・気をつけること
     counter  相手にされたら（攻略・対策）　note 補足（ルールの注意など）
     drills 練習メニュー id　views 改善の視点 id　related 関連する戦術 id
     diagram  作戦図（下の「作戦図」）

   ■ 練習メニュー  BC.drill({ id:'d-…', name, alias, words, skills, level, n, minutes, phase, intensity, equip, place, aim, setup, steps, points, ng, easier, harder, views, tactics, diagram })
     n         最少の人数（1＝ひとりでできる）
     minutes   1回の目安（分）
     phase     'warmup'（準備）| 'skill'（技術の反復）| 'game'（対人・試合に近い形）| 'cooldown'（整理・しめくくり）
     intensity きつさ 1〜3
     equip     用具（例：['ボール 1人1個', 'コーン 4つ']）
     place     'any'（どこでも・家でも）| 'hoop'（ゴールが1つあればよい）| 'half'（ハーフコート）| 'full'（オールコート）
     aim ねらい（1文）　setup 準備・並び方　steps 進め方（順番に）　points コーチングポイント・声かけ
     ng        よくある失敗と直し方 [['失敗', '直し方'], …]
     easier やさしくするには　harder むずかしくするには
     views 改善の視点 id　tactics 関連する戦術 id

   ■ 改善の視点  BC.view({ id:'v-…', skill, name, alias, words, summary, checks, good, ng, cue, drills, level })
     skill    技能の id（1つ）　level（なくてもよい）
     summary  なぜ大事か　checks 見るポイント（チェックリスト）　good うまくいっている状態（1文）
     ng       よくある崩れと直し方 [['崩れ', '直し方'], …]　cue 合言葉（短い声かけ。例：'肘はリングへ'）
     drills   練習メニュー id

   ■ 困りごと  BC.issue({ id:'i-…', skill, title, alias, words, who, empathy, summary, ask, causes, views, drills, tactics, tip, next })
     title    困りごと（話す人のことばで。例：'シュートが入らない'）
     alias    言いかえ（文のまま。例：'シュート率が低い'）
     words    文に出てきそうな言葉（例：'シュート'、'入らない'、'はいらない'、'外れる'）
     who      'player'（選手の悩み）| 'coach'（指導者・保護者の悩み）| 'both'（初期値）
     empathy  はじめのひとこと（受け止める1文）　summary 考え方（1〜2文）
     ask      絞りこむ問い（なくてもよい）{ q: '問い', options: [{ label: '答え', to: '困りごとの id' }] }（to は戦術・練習・視点の id でもよい）
     causes   考えられる原因 [{ text: '原因', check: '確かめ方', views: ['v-…'] }]
     views 改善の視点 id（大事な順）　drills 練習メニュー id（おすすめ順に3〜6）　tactics 関連する戦術 id
     tip ひとこと（覚えておきたいこと）　next 次に見るとよい困りごと id

   ■ 作戦図（diagram）　1場面なら { o, x, ball, moves, note }、何場面かなら { court, frames: [ { o, x, ball, moves, note }, … ] }
     court    'half'（初期値。ハーフコート、ゴールが上）| 'full'（オールコート。上のゴールを攻める）
     o        攻めの位置（1番から順に）。場所の名前（下の BC.spots）か [x, y]（m。x は −7.5〜7.5、左がマイナス。y はエンドラインから。ハーフラインが 14、full の反対のエンドラインが 28）
     x        守りの位置（なくてもよい）
     ball     ボールを持つ攻めの番号（1から）。だれも持っていないときは、場所の名前か [x, y]（床のボール）
     moves    動き [{ t, from, to, via }]
                t：'pass'（パス・点線）| 'cut'（走る・実線）| 'dribble'（ドリブル・波線）| 'screen'（スクリーン・先に横棒）| 'handoff'（手渡し）| 'move'（そのほかの移動）
                from・to：'o1'〜'o5'（その場面の攻めの人）・'x1'〜'x5'（守り）・場所の名前・[x, y]。via は曲がる点（なくてもよい）
                守りの動き（赤い線）は from が 'x1'〜'x5' のとき。座標から始まる守りの動きは def: true
     cones    コーンなどの目印の位置（なくてもよい。場所の名前か [x, y]）
     note     その場面の説明（1文）
     場面（frames）で o・x・ball・cones を書かなければ、前の場面と同じ。 */
(function (root) {
  const BC = (root.BC = root.BC || {});
  BC.skills = BC.skills || [];
  BC.skillMap = BC.skillMap || {};
  BC.items = {};
  BC.lists = { tactic: [], drill: [], view: [], issue: [] };
  BC.KINDS = {
    issue: { name: '困りごと', prefix: 'i-' },
    view: { name: '改善の視点', prefix: 'v-' },
    drill: { name: '練習メニュー', prefix: 'd-' },
    tactic: { name: '戦術', prefix: 't-' },
  };
  BC.LEVELS = { 1: 'はじめて・ミニバス', 2: '中学・高校', 3: '上級' };
  BC.PHASES = { warmup: '準備', skill: '技術', game: '対人・ゲーム', cooldown: 'しめくくり' };
  BC.PLACES = { any: 'どこでも（家でも）', hoop: 'ゴール1つ', half: 'ハーフコート', full: 'オールコート' };
  BC.TCATS = { offense: '攻め', defense: '守り', transition: '切りかえ', situation: '場面' };
  BC.FIELDS = {
    tactic: ['id', 'name', 'alias', 'words', 'cat', 'kind', 'level', 'skills', 'summary', 'how', 'points', 'good', 'weak', 'counter', 'note', 'drills', 'views', 'related', 'diagram'],
    drill: ['id', 'name', 'alias', 'words', 'skills', 'level', 'n', 'minutes', 'phase', 'intensity', 'equip', 'place', 'aim', 'setup', 'steps', 'points', 'ng', 'easier', 'harder', 'views', 'tactics', 'diagram'],
    view: ['id', 'skill', 'name', 'alias', 'words', 'summary', 'checks', 'good', 'ng', 'cue', 'drills', 'level'],
    issue: ['id', 'skill', 'title', 'alias', 'words', 'who', 'empathy', 'summary', 'ask', 'causes', 'views', 'drills', 'tactics', 'tip', 'next'],
  };
  BC.loadErrors = [];
  BC.currentFile = '';

  function add(kind, def) {
    if (Array.isArray(def)) { def.forEach((d) => add(kind, d)); return; }
    if (!def || !def.id) { BC.loadErrors.push(`${BC.KINDS[kind].name}：id のないものがある（${BC.currentFile}）`); return; }
    if (BC.items[def.id]) { BC.loadErrors.push(`id が重複している：${def.id}（${BC.currentFile}）`); return; }
    def.kind_ = kind;
    def.file_ = BC.currentFile;
    if (kind === 'issue') def.name = def.title;
    if (kind === 'view' && !def.skills) def.skills = def.skill ? [def.skill] : [];
    if (kind === 'issue' && !def.skills) def.skills = def.skill ? [def.skill] : [];
    BC.items[def.id] = def;
    BC.lists[kind].push(def);
    BC._index = null;
  }
  BC.tactic = (d) => add('tactic', d);
  BC.drill = (d) => add('drill', d);
  BC.view = (d) => add('view', d);
  BC.issue = (d) => add('issue', d);
  BC.setSkills = function (list) {
    BC.skills = list;
    BC.skillMap = {};
    for (const s of list) BC.skillMap[s.id] = s;
  };
  BC.get = (id) => BC.items[id] || null;
  BC.kindOf = (id) => {
    for (const k of Object.keys(BC.KINDS)) if (String(id).startsWith(BC.KINDS[k].prefix)) return k;
    return null;
  };
  BC.all = () => Object.values(BC.items);

  /* ---------- 場所（作戦図の位置。m。x は左が −、y はエンドラインから） ---------- */
  BC.spots = {
    rim: [0, 1.575],
    lb: [-2.75, 2.0], rb: [2.75, 2.0],            // ブロック（ローポスト）
    lm: [-2.75, 3.6], rm: [2.75, 3.6],            // ミドルポスト
    le: [-2.45, 5.8], re: [2.45, 5.8],            // エルボー
    hp: [0, 5.8],                                 // ハイポスト（フリースローラインの真ん中）
    mp: [0, 3.4],                                 // ペイントの真ん中
    lsc: [-4.6, 1.6], rsc: [4.6, 1.6],            // ショートコーナー
    lc: [-6.75, 0.9], rc: [6.75, 0.9],            // コーナー（3P）
    lw: [-5.9, 5.6], rw: [5.9, 5.6],              // ウイング（3P）
    ls: [-2.8, 8.0], rs: [2.8, 8.0],              // スロット（ガードの位置）
    top: [0, 8.5],                                // トップ
    lhw: [-5.5, 11.0], rhw: [5.5, 11.0],          // ハーフライン近くのウイング
    half: [0, 12.5],                              // ハーフライン近くの真ん中
    'oob-lb': [-2.5, -0.7], 'oob-rb': [2.5, -0.7],// エンドラインの外（スローイン）
    'oob-l': [-8.1, 8.5], 'oob-r': [8.1, 8.5],    // サイドラインの外（スローイン）
    // オールコート（自陣：y 14〜28。自陣のゴールは下）
    mid: [0, 14], lmid: [-5.5, 14], rmid: [5.5, 14],
    'b-lhw': [-5.5, 17], 'b-rhw': [5.5, 17],
    'b-top': [0, 19.5], 'b-ls': [-2.8, 20], 'b-rs': [2.8, 20],
    'b-hp': [0, 22.2], 'b-le': [-2.45, 22.2], 'b-re': [2.45, 22.2],
    'b-lw': [-5.9, 22.4], 'b-rw': [5.9, 22.4],
    'b-lb': [-2.75, 26], 'b-rb': [2.75, 26],
    'b-lc': [-6.75, 27.1], 'b-rc': [6.75, 27.1],
    'b-rim': [0, 26.425], 'b-oob': [1.8, 28.7],
  };
  BC.spotNames = {
    rim: 'ゴール下', lb: '左ブロック', rb: '右ブロック', lm: '左ミドルポスト', rm: '右ミドルポスト', le: '左エルボー', re: '右エルボー',
    hp: 'ハイポスト', mp: 'ペイント中央', lsc: '左ショートコーナー', rsc: '右ショートコーナー', lc: '左コーナー', rc: '右コーナー',
    lw: '左ウイング', rw: '右ウイング', ls: '左スロット', rs: '右スロット', top: 'トップ',
  };

  // 作戦図を場面の並びにそろえる（o・x・ball を前の場面から引きつぐ）。位置は [x, y] に
  BC.frames = function (dg) {
    if (!dg) return [];
    const raw = dg.frames && dg.frames.length ? dg.frames : [dg];
    let o = [], x = [], ball = 0, cones = [];
    return raw.map((f) => {
      if (f.o) o = f.o.map(BC.pos);
      if (f.x) x = f.x.map(BC.pos);
      if (f.cones) cones = f.cones.map(BC.pos).filter(Boolean);
      if (f.ball != null) ball = f.ball;
      const at = (p) => {
        if (typeof p === 'string') {
          const m = p.match(/^([ox])([1-5])$/);
          if (m) return (m[1] === 'o' ? o : x)[+m[2] - 1] || null;
        }
        return BC.pos(p);
      };
      const moves = (f.moves || []).map((mv) => ({
        t: mv.t, from: at(mv.from), to: at(mv.to), via: mv.via ? at(mv.via) : null,
        def: mv.def === true || (typeof mv.from === 'string' && /^x/.test(mv.from)),
      }));
      const ballAt = typeof ball === 'number' ? (ball ? o[ball - 1] || null : null) : BC.pos(ball);
      return { court: dg.court || 'half', o: o.slice(), x: x.slice(), ball, ballAt, moves, cones: cones.slice(), note: f.note || '' };
    });
  };
  BC.pos = function (p) {
    if (Array.isArray(p) && p.length === 2 && p.every((n) => typeof n === 'number')) return p;
    if (typeof p === 'string' && BC.spots[p]) return BC.spots[p];
    return null;
  };

  /* ---------- ことばをそろえる ---------- */
  // 全角・半角、カタカナ・ひらがな、記号・空白のちがいをなくす。「3on3」「3vs3」「3対3」は同じに
  BC.norm = function (s) {
    s = String(s == null ? '' : s).normalize('NFKC').toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
    s = s.replace(/[\s&＆・･\-‐－―−_、。,.!！?？「」『』（）()\[\]【】〔〕〈〉《》:：;；'"“”‘’/／\\~〜…#＃+＋*＊%％|｜=＝<>→←↑↓]/g, '');
    s = s.replace(/(\d)(?:on|vs|v|対)(\d)/g, '$1対$2');
    return s;
  };
  // 文字の並び（2字ずつ）。ひらがなだけの並び（「して」「まう」など、どの文にもある語尾）は数えない
  const bigrams = (s) => {
    const out = new Set();
    for (let i = 0; i < s.length - 1; i++) {
      const g = s.slice(i, i + 2);
      if (!/^[\u3041-\u309f]{2}$/.test(g)) out.add(g);
    }
    return out;
  };
  const stripParen = (s) => String(s).replace(/[（(][^）)]*[）)]/g, '');
  const isAscii = (s) => /^[a-z0-9]+$/.test(s);

  // 探すための言葉の一覧をつくる（データが変わったら作り直す）
  function index() {
    if (BC._index) return BC._index;
    const items = [];
    for (const it of BC.all()) {
      const strong = new Set();
      const label = it.kind_ === 'issue' ? it.title : it.name;
      [label, stripParen(label), ...(it.alias || [])].forEach((w) => {
        const n = BC.norm(w);
        if (n.length >= 2) strong.add(n);
      });
      const weak = new Set();
      (it.words || []).forEach((w) => {
        const n = BC.norm(w);
        // 1字は、漢字（肘・膝・奥など）だけ使う
        if ((n.length >= 2 || /^[\u4e00-\u9fff]$/.test(n)) && !strong.has(n)) weak.add(n);
      });
      const byLen = (a, b) => b.length - a.length;
      items.push({ it, strong: [...strong].sort(byLen), weak: [...weak].sort(byLen), grams: bigrams([...strong].join('|')) });
    }
    const skills = BC.skills.map((s) => ({ s, words: [s.name, ...(s.words || [])].map(BC.norm).filter((w) => w.length >= 2) }));
    BC._index = { items, skills };
    return BC._index;
  }
  BC.reindex = () => { BC._index = null; return index(); };

  // ascii の短い言葉（pnr など）は、前後が英数字でないときだけ当てる
  function hasTerm(text, raw, t) {
    if (isAscii(t) && t.length <= 4) {
      // 前後が英数字でないこと。記号を消す前（raw）と後（text。「2-3」→「23」）の両方で見る
      const re = new RegExp('(^|[^a-z0-9])' + t + '([^a-z0-9]|$)');
      return re.test(raw) || re.test(text);
    }
    return text.includes(t);
  }

  const stem = (w) => (w.length >= 4 && !isAscii(w) && /[るいたてだうくすつぬむぶぐしれ]$/.test(w) ? w.slice(0, -1) : null);
  // 1つの項目が、文にどれだけ当てはまるか
  function scoreItem(text, raw, grams, e) {
    let s = 0;
    const hits = [];
    // すでに当たった長い言葉の中にある短い言葉（「ピックアンドロール」の中の「ロール」）は、重ねて数えない
    const named = [];
    const inside = (t) => named.some((h) => h.length > t.length && h.includes(t));
    for (const t of e.strong) {
      if (inside(t)) continue;
      if (hasTerm(text, raw, t)) { s += 4 + t.length * 1.3; hits.push(t); named.push(t); }
      else {
        const st = stem(t);
        if (st && st.length >= 4 && text.includes(st)) { s += 3 + st.length * 1.1; hits.push(st); }
      }
    }
    for (const w of e.weak) {
      if (inside(w)) continue;
      if (hasTerm(text, raw, w)) { s += Math.min(w.length, 6) * 1.0 + 0.5; hits.push(w); }
      else {
        // 語尾のちがい（「下を見る」と「下を見て」など）は、最後の1字を外して見る
        const st = stem(w);
        if (st && text.includes(st)) { s += Math.min(st.length, 6) * 0.7; hits.push(st); }
      }
    }
    if (!hits.length && e.grams.size) {
      // 言葉はぴったりでないが、文字の並びが近い（「シュートがはいんない」など）
      let common = 0;
      for (const g of grams) if (e.grams.has(g)) common++;
      const r = common / Math.max(4, Math.min(grams.size, e.grams.size));
      if (r >= 0.34) s += r * 6;
    }
    return { s, hits };
  }

  /* ---------- 文から、話している人の条件を読む ---------- */
  BC.context = function (input) {
    // BC.norm はカタカナをひらがなにするので、ここで使う正規表現の言葉もひらがなにそろえる
    const t = BC.norm(input);
    const kana = (re) => new RegExp(re.source.replace(/[\u30a1-\u30f6]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60)), re.flags);
    const has = (re) => kana(re).test(t);
    const c = {};
    const min = t.match(/(\d{1,3})分/);
    const hr = t.match(/(\d(?:\.\d)?)時間/);
    const half = t.match(/(\d)時間半/);
    if (min) c.minutes = Math.min(240, +min[1]);
    else if (half) c.minutes = +half[1] * 60 + 30;
    else if (hr) c.minutes = Math.round(+hr[1] * 60);
    // 人数は、練習の話のときだけ読む（「1人で攻めてしまう」「2人に囲まれる」は人数ではない）
    const practice = has(/(練習|れんしゅう|メニュー|ドリル|トレーニング|できる|やれる|自主|プラン)/);
    if (has(/(自主練|じしゅれん|家で|いえで|自宅|ひとり練|個人練)/)) c.n = 1;
    else if (practice && has(/(ひとりで|一人で|1人で|ひとりでも|一人でも)/)) c.n = 1;
    else if (practice && has(/(2人で|ふたりで|二人で|親子|おやこ)/)) c.n = 2;
    else if (practice) {
      const p = t.match(/(\d{1,2})人(で|しか|だけ|います|いる|の|くらい|ぐらい|程度)/) || t.match(/(?:部員|選手|人数)[がはも]?(\d{1,2})人/);
      if (p) c.n = +p[1];
      else if (has(/(チームで|チーム練習|部員|全員|みんなで)/)) c.n = 8;
    }
    if (has(/(家で|いえで|自宅|部屋|室内で|ゴールがない|ゴールなし)/)) c.place = 'any';
    if (has(/(ミニバス|小学|低学年|高学年|初心者|はじめて|初めて|始めたばかり|はじめたばかり|未経験|幼稚園|キッズ|u12|u10)/)) c.level = 1;
    else if (has(/(中学|高校|部活|u15|u18)/)) c.level = 2;
    else if (has(/(上級|大学|社会人|プロ|強豪|全国)/)) c.level = 3;
    if (has(/(コーチ|指導|教え|保護者|監督|顧問|子ども|子供|こども|息子|娘|うちの子|選手たち)/)) c.who = 'coach';
    // 「組み方がわからない」「立て方」のような、やり方を聞く文はプランにしない（困りごと「練習メニューの組み方」へ）
    c.wantsPlan = has(/(メニュー|プラン|計画|練習内容).{0,6}((作|組|考|立|決)(?![みりえてめ]?方)|ください|ほしい|欲しい|教えて)|(組んで|くんで|作って|つくって|考えて|立てて).{0,4}$/);
    c.wantsVideo = has(/(動画|映像|ビデオ|見たい|みたい)/);
    return c;
  };

  /* ---------- 探す ---------- */
  // 文に近い項目を、点の高い順に。kinds で種類をしぼれる
  BC.search = function (input, opts = {}) {
    const ix = index();
    const text = BC.norm(input);
    const raw = String(input || '').normalize('NFKC').toLowerCase();
    if (!text) return [];
    const grams = bigrams(text);
    const kinds = opts.kinds || null;
    // 技能の言葉が文にあれば、その技能の項目に少し点を足す
    const skillHit = {};
    for (const { s, words } of ix.skills) for (const w of words) if (text.includes(w)) skillHit[s.id] = Math.max(skillHit[s.id] || 0, w.length);
    const out = [];
    for (const e of ix.items) {
      if (kinds && !kinds.includes(e.it.kind_)) continue;
      const r = scoreItem(text, raw, grams, e);
      if (r.s <= 0) continue;
      let s = r.s;
      const sk = (e.it.skills || [])[0];
      if (sk && skillHit[sk]) s += 1.5;
      if (e.it.kind_ === 'issue') s *= 1.08;
      out.push({ item: e.it, score: Math.round(s * 10) / 10, hits: r.hits });
    }
    // 同じ点なら、困りごと → 戦術 → 練習 → 視点 の順
    const rank = { issue: 0, tactic: 1, drill: 2, view: 3 };
    out.sort((a, b) => b.score - a.score || rank[a.item.kind_] - rank[b.item.kind_]);
    return out;
  };
  BC.skillsIn = function (input) {
    const text = BC.norm(input);
    const ix = index();
    const hit = [];
    for (const { s, words } of ix.skills) {
      let best = 0;
      for (const w of words) if (text.includes(w)) best = Math.max(best, w.length);
      if (best) hit.push({ skill: s, score: best });
    }
    return hit.sort((a, b) => b.score - a.score).map((h) => h.skill);
  };

  /* ---------- チャットの答えを決める（画面は、この形を見て描く） ----------
     返すもの：{ type: 'issue' | 'item' | 'skill' | 'plan' | 'none', ... }  */
  BC.answer = function (input, state = {}) {
    const ctx = Object.assign({}, state.profile || {}, stripUndef(BC.context(input)));
    const hits = BC.search(input);
    const issues = hits.filter((h) => h.item.kind_ === 'issue');
    const others = hits.filter((h) => h.item.kind_ !== 'issue');
    const topIssue = issues[0];
    const topOther = others[0];
    const skills = BC.skillsIn(input);
    const minIssue = 5.5;

    if (ctx.wantsPlan) {
      let focus = [];
      if (topIssue && topIssue.score >= minIssue) focus = [topIssue.item.id];
      else if (state.lastIssue) focus = [state.lastIssue];
      const plan = BC.plan({ minutes: ctx.minutes || 60, n: ctx.n, level: ctx.level, place: ctx.place, focus, skills: skills.map((s) => s.id) });
      return { type: 'plan', plan, ctx };
    }
    // 名前そのもの（「マイカンドリル」「2-3ゾーン」）を言ったときは、その項目
    const strongOther = topOther && topOther.hits.some((h) => topOther.item.kind_ !== 'issue' && isStrong(topOther.item, h));
    // 困っている言い方（「やられた」「できない」「苦手」）なら、名前が同じ戦術より困りごとを先に
    const complain = /(ない|なかった|られ|苦手|困|悩|負け|弱い|下手|へた)/.test(BC.norm(input));
    // 改善の視点は、最初の答えとしては狭いので、困りごとより はっきり上のときだけ
    let lean = complain && topIssue && topIssue.score >= 5 ? 2 : 1.05;
    if (topOther && topOther.item.kind_ === 'view') lean = Math.max(lean, 1.3);
    if (topOther && strongOther && (!topIssue || topOther.score > topIssue.score * lean)) {
      const rel = BC.issuesFor(topOther.item.id).slice(0, 4);
      return { type: 'item', item: topOther.item, alts: others.slice(1, 4).filter((h) => h.score >= topOther.score * 0.6).map((h) => h.item), related: rel, ctx };
    }
    if (topIssue && topIssue.score >= minIssue) {
      const alts = issues.slice(1, 4).filter((h) => h.score >= topIssue.score * 0.6).map((h) => h.item);
      return { type: 'issue', issue: topIssue.item, alts, ctx };
    }
    if (skills.length) {
      const sk = skills[0];
      return { type: 'skill', skill: sk, issues: BC.lists.issue.filter((i) => i.skill === sk.id), ctx, guess: topIssue ? topIssue.item : null };
    }
    if (topIssue && topIssue.score >= 2.5) return { type: 'issue', issue: topIssue.item, alts: issues.slice(1, 3).map((h) => h.item), weak: true, ctx };
    if (topOther && topOther.score >= 4) return { type: 'item', item: topOther.item, alts: others.slice(1, 4).map((h) => h.item), related: BC.issuesFor(topOther.item.id).slice(0, 4), ctx };
    return { type: 'none', ctx };
  };
  function isStrong(it, normTerm) {
    const label = it.kind_ === 'issue' ? it.title : it.name;
    return [label, stripParen(label), ...(it.alias || [])].some((w) => BC.norm(w) === normTerm);
  }
  function stripUndef(o) {
    const r = {};
    for (const k of Object.keys(o)) if (o[k] !== undefined && o[k] !== false) r[k] = o[k];
    return r;
  }

  // ある項目を挙げている困りごと
  BC.issuesFor = function (id) {
    return BC.lists.issue.filter((i) => [...(i.drills || []), ...(i.views || []), ...(i.tactics || [])].includes(id));
  };
  // ある項目を挙げているもの（逆引き。練習メニュー → それを使う視点・戦術 など）
  BC.backlinks = function (id) {
    const out = [];
    for (const it of BC.all()) {
      if (it.id === id) continue;
      const refs = [...(it.drills || []), ...(it.views || []), ...(it.tactics || []), ...(it.related || []), ...(it.next || [])];
      for (const c of it.causes || []) refs.push(...(c.views || []));
      if (refs.includes(id)) out.push(it);
    }
    return out;
  };

  // 条件にあう練習メニュー（人数・レベル・場所）。n が未定・level が未定なら、しぼらない
  BC.fits = function (d, opt = {}) {
    if (!d || d.kind_ !== 'drill') return false;
    if (opt.n && d.n > opt.n) return false;
    if (opt.level && d.level > opt.level + (opt.strict ? 0 : 1)) return false;
    if (opt.place === 'any' && d.place !== 'any') return false;
    return true;
  };
  // 困りごとのおすすめ練習を、条件に合うものから順に
  BC.drillsFor = function (issue, opt = {}) {
    const ids = (issue.drills || []).slice();
    // 視点に書かれた練習も、うしろに足す
    for (const vid of issue.views || []) for (const d of (BC.get(vid) || {}).drills || []) if (!ids.includes(d)) ids.push(d);
    const list = ids.map(BC.get).filter(Boolean);
    const ok = list.filter((d) => BC.fits(d, opt));
    const rest = list.filter((d) => !ok.includes(d));
    return { ok, rest };
  };

  /* ---------- 練習プラン ----------
     opt: { minutes, n, level, focus: [困りごと id], skills: [技能 id] }
     返す：{ minutes, blocks: [{ key, name, items: [{ drill, min }] }], focus, skills, note }  */
  BC.plan = function (opt = {}) {
    const minutes = Math.max(15, Math.min(240, opt.minutes || 60));
    const n = opt.n || null, level = opt.level || null, place = opt.place || null;
    // 指導・練習の組み方の困りごと（「練習メニューの組み方がわからない」など）は、テーマにしない（基本をひととおり）
    const focusIssues = (opt.focus || []).map(BC.get).filter((i) => i && i.skill !== 'coach');
    let skills = opt.skills && opt.skills.length ? opt.skills.slice() : [];
    for (const i of focusIssues) if (i.skill && !skills.includes(i.skill)) skills.unshift(i.skill);
    const general = !skills.length;
    // テーマがないときは、基本をひととおり（ドリブル・フィニッシュ・シュート・パス・守り）
    if (general) skills = ['dribble', 'finish', 'shoot', 'pass', 'defball'];
    const fit = (d) => BC.fits(d, { n, level, place, strict: true });
    const used = new Set();
    let hard = 0;
    const hardMax = level === 1 ? 1 : 2; // きつさ3の練習は、1回の練習に1〜2つまで
    const pick = (cands, budget, phaseOk) => {
      const items = [];
      let left = budget;
      for (const d of cands) {
        if (left < 3) break;
        if (!d || used.has(d.id) || !fit(d) || (phaseOk && !phaseOk(d.phase))) continue;
        if (d.intensity === 3 && hard >= hardMax) continue;
        const want = d.minutes || 10;
        const min = Math.max(3, Math.min(want, left));
        items.push({ drill: d, min });
        used.add(d.id);
        if (d.intensity === 3) hard++;
        left -= min;
      }
      return { items, left };
    };
    // 中心にする練習：困りごとのおすすめ → その技能の練習
    const focusDrills = [];
    for (const i of focusIssues) for (const d of BC.drillsFor(i).ok.concat(BC.drillsFor(i).rest)) if (!focusDrills.includes(d)) focusDrills.push(d);
    // その技能の練習を、技能ごとに順番に（1つの技能にかたよらないように）
    const bySkill = skills.map((s) => BC.lists.drill.filter((d) => (d.skills || [])[0] === s).concat(BC.lists.drill.filter((d) => (d.skills || [])[0] !== s && (d.skills || []).includes(s))).filter(fit));
    const skillDrills = [];
    for (let i = 0; bySkill.some((l) => l[i]); i++) for (const l of bySkill) if (l[i] && !skillDrills.includes(l[i])) skillDrills.push(l[i]);
    const solo = n === 1;
    const budget = {
      warmup: Math.max(5, Math.round(minutes * 0.15)),
      cooldown: Math.max(5, Math.round(minutes * 0.1)),
    };
    // ひとりのときも、ひとりでできるゲーム（シュートゲームなど）を少し
    budget.game = Math.round(minutes * (solo ? 0.12 : 0.27));
    budget.skill = minutes - budget.warmup - budget.cooldown - budget.game;

    const blocks = [];
    const warmCands = [BC.get('d-dynamic'), ...BC.lists.drill.filter((d) => d.phase === 'warmup' && (d.skills || []).some((s) => skills.includes(s))), ...BC.lists.drill.filter((d) => d.phase === 'warmup')];
    const w = pick(warmCands, budget.warmup, (p) => p === 'warmup');
    blocks.push({ key: 'warmup', name: 'ウォームアップ', items: w.items });
    const sk = pick([...focusDrills, ...skillDrills], budget.skill + w.left, (p) => p === 'skill' || p === 'warmup');

      const gameCands = [...focusDrills.filter((d) => d.phase === 'game'), ...skillDrills.filter((d) => d.phase === 'game'), ...BC.lists.drill.filter((d) => d.phase === 'game' && d.level <= (level || 2))];
      const g = pick(gameCands, budget.game + left, (p) => p === 'game');

    if (left >= 8) {
      const more = pick([...focusDrills, ...skillDrills, ...BC.lists.drill.filter((d) => d.phase === 'skill')], left, (p) => p === 'skill');
      blocks[1].items.push(...more.items);

    const coolCands = [minutes >= 60 && budget.cooldown + left >= 10 ? BC.get('d-ft') : null, BC.get('d-cooldown'),

      ...BC.lists.drill.filter((d) => d.phase === 'cooldown' && d.id !== 'd-film' && d.place !== 'any' || d.id === 'd-huddle')];
    const c = pick(coolCands, budget.cooldown + left, (p) => p === 'cooldown' || p === 'skill');
    // ストレッチは最後に
    c.items.sort((a, b) => (a.drill.phase === 'cooldown') - (b.drill.phase === 'cooldown'));

  };
  BC.planText = function (plan) {
    const lines = [];
    const head = (plan.focus || []).map((id) => (BC.get(id) || {}).title).filter(Boolean);
    lines.push(`【練習プラン ${plan.minutes}分】${head.length ? '　テーマ：' + head.join('・') : ''}`);
    let t = 0;
    for (const b of plan.blocks) {
      lines.push('');
      lines.push(`■ ${b.name}`);

        lines.push(`${mm}〜（${x.min}分）${x.drill.name}`);
        const p = (x.drill.points || [])[0];

  /* ---------- 動画のファイル名と、項目を照らす ----------

  BC.videoIndex = function () {
    if (BC._vindex) return BC._vindex;
    const terms = [];
    for (const it of BC.all()) {
      const label = it.kind_ === 'issue' ? it.title : it.name;
      const set = new Set([label, stripParen(label), ...(it.alias || [])].map(BC.norm).filter((t) => t.length >= (isAscii(t) ? 3 : 3)));
      for (const t of set) terms.push({ t, id: it.id });

    const skills = BC.skills.map((s) => ({ id: s.id, words: [s.name, ...(s.words || [])].map(BC.norm).filter((w) => w.length >= 2) }));

    const vi = BC.videoIndex();
    const base = String(path || '').replace(/\.[a-z0-9]{2,5}$/i, '');
    const raw = base.normalize('NFKC').toLowerCase();
    const text = BC.norm(base);
    const found = [];
    for (const { t, id } of vi.terms) if (hasTerm(text, raw, t)) found.push({ id, term: t, score: t.length });
    // 長い言葉に含まれる短い言葉（「ピックアンドロール」の中の「ロール」など）は外す
    const keep = found.filter((f) => !found.some((g) => g !== f && g.term.length > f.term.length && g.term.includes(f.term)));
    const best = {};
    for (const f of keep) if (!best[f.id] || best[f.id].score < f.score) best[f.id] = f;
    const items = Object.values(best).sort((a, b) => b.score - a.score);
    const skills = [];
    for (const s of vi.skills) if (s.words.some((w) => text.includes(w))) skills.push(s.id);
    for (const f of items) for (const s of (BC.get(f.id) || {}).skills || []) if (!skills.includes(s)) skills.push(s);

    const skillOk = (it, list) => { for (const s of list || []) if (!BC.skillMap[s]) errors.push(`${it.id}：技能の id がない（${s}）`); };

      if (registry && registry[k] && !registry[k][it.id]) warns.push(`${it.id}：一覧（tools/registry.cjs）にない id`);

        diagramCheck(it, errors);

        if (!(it.skills || []).length) errors.push(`${it.id}：skills がない`);

        if (!BC.PHASES[it.phase]) errors.push(`${it.id}.phase：${Object.keys(BC.PHASES).join('・')} のどれか`);

        for (const f of ['equip', 'steps', 'points', 'easier', 'harder']) strs(it, f, it[f]);
        if (!(it.steps || []).length) errors.push(`${it.id}：steps がない`);

        if (!BC.skillMap[it.skill]) errors.push(`${it.id}.skill：技能の id（${it.skill}）`);
        if (it.who && !['player', 'coach', 'both'].includes(it.who)) errors.push(`${it.id}.who：player・coach・both`);
        if (!(it.words || []).length) warns.push(`${it.id}：words がない（チャットで見つかりにくい）`);
        if (!(it.drills || []).length) errors.push(`${it.id}：drills がない`);
        for (const c of it.causes || []) {
          if (!c || typeof c.text !== 'string') { errors.push(`${it.id}.causes：{ text, check, views } の形`); continue; }
          for (const f of Object.keys(c)) if (!['text', 'check', 'views'].includes(f)) errors.push(`${it.id}.causes：知らない項目名（${f}）`);

          if (typeof it.ask.q !== 'string' || !Array.isArray(it.ask.options)) errors.push(`${it.id}.ask：{ q, options: [{ label, to }] } の形`);
          else for (const o of it.ask.options) {
            // 行き先は、ふつうは困りごと。戦術・練習・視点もよい（例：ゾーンの形 → その戦術）
            const k = BC.kindOf(o.to);

            if (!k) errors.push(`${it.id}.ask.to：id でない（${o.to}）`);

        refCheck(it, 'views', 'view', it.views); refCheck(it, 'drills', 'drill', it.drills); refCheck(it, 'tactics', 'tactic', it.tactics); refCheck(it, 'next', 'issue', it.next);

/* 作戦図：コートと人と動きを SVG で描く。データの形は js/core.js の「作戦図」。
   BC.court(el, diagram) で el の中に図を入れ、場面（frames）を ◀ ▶ で切りかえる（人は動いて移る）。
   単位は m（1 = 1m）。ゴールが上（y = 0 がエンドライン）。 */
(function () {
  const BC = window.BC;
  const NS = 'http://www.w3.org/2000/svg';
  const R = 0.46; // 人の丸の半径
  let uid = 0;

  // コートの線（half：y 0〜14、full：y 0〜28）
  function courtSVG(full) {
    const H = full ? 28 : 14;
    const arc3 = 1.575 + Math.sqrt(6.75 * 6.75 - 6.6 * 6.6); // コーナーの直線と弧のつなぎ目
    const end = (top) => {
      // top = true：上のゴール（y=0 側）、false：下のゴール（y=28 側）
      const s = top ? 1 : -1, b = top ? 0 : 28, y = (v) => b + s * v;
      const sw = top ? 0 : 1; // 弧の向き
      return `
        <rect class="cv-paint" x="-2.45" y="${Math.min(y(0), y(5.8))}" width="4.9" height="5.8"/>
        <path class="cv-line" d="M-6.6 ${y(0)} L-6.6 ${y(arc3)} A6.75 6.75 0 0 ${sw} 6.6 ${y(arc3)} L6.6 ${y(0)}"/>
        <path class="cv-line" d="M-1.8 ${y(5.8)} A1.8 1.8 0 0 ${sw} 1.8 ${y(5.8)}"/>
        <path class="cv-line cv-dash" d="M-1.8 ${y(5.8)} A1.8 1.8 0 0 ${1 - sw} 1.8 ${y(5.8)}"/>
        <path class="cv-line" d="M-1.25 ${y(1.575)} A1.25 1.25 0 0 ${sw} 1.25 ${y(1.575)}"/>
        <line class="cv-board" x1="-0.9" y1="${y(1.2)}" x2="0.9" y2="${y(1.2)}"/>
        <circle class="cv-rim" cx="0" cy="${y(1.575)}" r="0.23"/>`;
    };
    return `
      <rect class="cv-out" x="-9" y="-1.6" width="18" height="${H + 3.2}"/>
      <rect class="cv-floor" x="-7.5" y="0" width="15" height="${H}"/>
      ${end(true)}
      ${full ? end(false) : ''}
      <line class="cv-line" x1="-7.5" y1="14" x2="7.5" y2="14"/>
      ${full ? '<circle class="cv-line cv-none" cx="0" cy="14" r="1.8"/>' : '<path class="cv-line" d="M-1.8 14 A1.8 1.8 0 0 1 1.8 14"/>'}
      <rect class="cv-line cv-none" x="-7.5" y="0" width="15" height="${H}"/>`;
  }

  // 動きの線（from → to。via があれば曲げる）。人の丸にかからないよう、両はしを少し縮める
  function movePath(m) {
    const [x1, y1] = m.from, [x2, y2] = m.to;
    if (m.via) {
      const [vx, vy] = m.via;
      const cx = 2 * vx - (x1 + x2) / 2, cy = 2 * vy - (y1 + y2) / 2;
      const a = shrink([x1, y1], [cx, cy], R + 0.08), b = shrink([x2, y2], [cx, cy], m.t === 'screen' ? R + 0.15 : R + 0.12);
      return { d: `M${f(a[0])} ${f(a[1])} Q${f(cx)} ${f(cy)} ${f(b[0])} ${f(b[1])}`, end: b, dir: unit([b[0] - cx, b[1] - cy]), pts: bez([a, [cx, cy], b]) };
    }
    const a = shrink([x1, y1], [x2, y2], R + 0.08), b = shrink([x2, y2], [x1, y1], m.t === 'screen' ? 0.05 : R + 0.12);
    return { d: `M${f(a[0])} ${f(a[1])} L${f(b[0])} ${f(b[1])}`, end: b, dir: unit([b[0] - a[0], b[1] - a[1]]), pts: [a, b] };
  }
  const f = (n) => Math.round(n * 1000) / 1000;
  const unit = ([x, y]) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  function shrink(p, toward, d) {
    const [ux, uy] = unit([toward[0] - p[0], toward[1] - p[1]]);
    const len = Math.hypot(toward[0] - p[0], toward[1] - p[1]);
    const k = Math.min(d, len * 0.4);
    return [p[0] + ux * k, p[1] + uy * k];
  }
  function bez([a, c, b], n = 24) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]);
    }
    return out;
  }
  // ドリブルの波線（線にそってジグザグ）
  function zigzag(pts) {
    const flat = [];
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
      const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(L / 0.1));
      for (let k = 0; k < n; k++) flat.push([x1 + ((x2 - x1) * k) / n, y1 + ((y2 - y1) * k) / n]);
    }
    flat.push(pts[pts.length - 1]);
    let s = 0, d = '';
    const amp = 0.18, wave = 0.55;
    for (let i = 0; i < flat.length; i++) {
      const p = flat[i];
      if (i) s += Math.hypot(p[0] - flat[i - 1][0], p[1] - flat[i - 1][1]);
      const q = flat[Math.min(flat.length - 1, i + 1)], r = flat[Math.max(0, i - 1)];
      const [ux, uy] = unit([q[0] - r[0], q[1] - r[1]]);
      const total = s;
      const fade = i > flat.length - 4 ? 0 : 1; // 矢印の手前はまっすぐ
      const o = Math.sin((total / wave) * Math.PI * 2) * amp * fade;
      d += (i ? ' L' : 'M') + f(p[0] - uy * o) + ' ' + f(p[1] + ux * o);
    }
    return d;
  }

  function movesSVG(frame, id) {
    return frame.moves.filter((m) => m.from && m.to).map((m) => {
      const p = movePath(m);
      const cls = 'cv-mv cv-' + m.t + (m.def ? ' cv-def' : '');
      const mk = m.def ? `url(#ah-x-${id})` : `url(#ah-o-${id})`;
      if (m.t === 'screen') {
        const [ex, ey] = p.end, [ux, uy] = p.dir, w = 0.42;
        return `<path class="${cls}" d="${p.d}"/><line class="${cls}" x1="${f(ex - uy * w)}" y1="${f(ey + ux * w)}" x2="${f(ex + uy * w)}" y2="${f(ey - ux * w)}"/>`;
      }
      if (m.t === 'dribble' || m.t === 'handoff') {
        let extra = '';
        if (m.t === 'handoff') {
          const [ex, ey] = p.end, [ux, uy] = p.dir, w = 0.32;
          for (const k of [0.25, 0.5]) extra += `<line class="${cls}" x1="${f(ex - ux * k - uy * w)}" y1="${f(ey - uy * k + ux * w)}" x2="${f(ex - ux * k + uy * w)}" y2="${f(ey - uy * k - ux * w)}"/>`;
        }
        return `<path class="${cls}" d="${zigzag(p.pts)}" marker-end="${m.t === 'dribble' ? mk : ''}"/>${extra}`;
      }
      return `<path class="${cls}" d="${p.d}" marker-end="${mk}"/>`;
    }).join('');
  }

  const place = (g, p) => {
    if (!p) { g.style.opacity = '0'; return; }
    g.style.opacity = '1';
    g.style.transform = `translate(${f(p[0])}px, ${f(p[1])}px)`;
  };

  // el の中に図を入れる。返り値：{ go(i) }
  BC.court = function (el, diagram, opt = {}) {
    const frames = BC.frames(diagram);
    if (!frames.length) return null;
    const id = ++uid;
    const full = frames[0].court === 'full';
    const H = full ? 28 : 14;
    // 人がいる範囲だけを見せる（full でも、上半分だけで足りるときは切る）
    let maxY = full ? H + 1.6 : 14.8;
    const minY = -1.6;
    const vb = `-9 ${minY} 18 ${f(maxY - minY)}`;
    const players = [];
    for (let i = 0; i < 5; i++) players.push(`<g class="cv-p cv-o" data-p="o${i + 1}"><circle r="${R}"/><text y="0.02">${i + 1}</text></g>`);
    for (let i = 0; i < 5; i++) players.push(`<g class="cv-p cv-x" data-p="x${i + 1}"><path d="M-0.32 -0.32 L0.32 0.32 M0.32 -0.32 L-0.32 0.32"/><text x="0.42" y="0.42">${i + 1}</text></g>`);
    el.classList.add('cv');
    el.innerHTML = `
      <div class="cv-stage${full ? ' cv-full' : ''}">
        <svg viewBox="${vb}" xmlns="${NS}" role="img" aria-label="${opt.label ? opt.label.replace(/"/g, '') + 'の' : ''}作戦図">
          <defs>
            <marker id="ah-o-${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="cv-ah" d="M0 0 L10 5 L0 10 z"/></marker>
            <marker id="ah-x-${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="cv-ah cv-ah-x" d="M0 0 L10 5 L0 10 z"/></marker>
          </defs>
          ${courtSVG(full)}
          <g class="cv-cones"></g>
          <g class="cv-moves"></g>
          <g class="cv-people">${players.join('')}<circle class="cv-ball" r="0.2"/></g>
        </svg>
      </div>
      <div class="cv-bar">
        ${frames.length > 1 ? `<button type="button" class="cv-btn" data-cv="prev" aria-label="前の場面">◀</button><span class="cv-count"></span><button type="button" class="cv-btn" data-cv="next" aria-label="次の場面">▶</button>` : ''}
        <p class="cv-note"></p>
      </div>
      <p class="cv-legend"><span><i class="lg-o"></i>攻め</span><span><i class="lg-x"></i>守り</span><span><i class="lg-cut"></i>走る</span><span><i class="lg-pass"></i>パス</span><span><i class="lg-drb"></i>ドリブル</span><span><i class="lg-scr"></i>スクリーン</span></p>`;
    const svg = el.querySelector('svg');
    const movesG = svg.querySelector('.cv-moves');
    const conesG = svg.querySelector('.cv-cones');
    const ball = svg.querySelector('.cv-ball');
    const note = el.querySelector('.cv-note');
    const count = el.querySelector('.cv-count');
    const nodes = {};
    svg.querySelectorAll('.cv-p').forEach((g) => { nodes[g.dataset.p] = g; });
    let cur = 0;
    function go(i) {
      cur = (i + frames.length) % frames.length;
      const fr = frames[cur];
      for (let k = 0; k < 5; k++) { place(nodes['o' + (k + 1)], fr.o[k]); place(nodes['x' + (k + 1)], fr.x[k]); }
      const bp = fr.ballAt;
      const held = typeof fr.ball === 'number';
      if (bp) { ball.style.opacity = '1'; ball.style.transform = held ? `translate(${f(bp[0] + 0.38)}px, ${f(bp[1] - 0.38)}px)` : `translate(${f(bp[0])}px, ${f(bp[1])}px)`; } else ball.style.opacity = '0';
      movesG.innerHTML = movesSVG(fr, id);
      conesG.innerHTML = (fr.cones || []).map((p) => `<path class="cv-cone" d="M${f(p[0])} ${f(p[1] - 0.32)} L${f(p[0] + 0.28)} ${f(p[1] + 0.22)} L${f(p[0] - 0.28)} ${f(p[1] + 0.22)} Z"/>`).join('');
      note.textContent = fr.note || '';
      note.hidden = !fr.note;
      if (count) count.textContent = `${cur + 1} / ${frames.length}`;
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cv]');
      if (!b) return;
      go(cur + (b.dataset.cv === 'next' ? 1 : -1));
    });
    // はじめは動かさずに置く
    svg.classList.add('cv-still');
    go(0);
    requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove('cv-still')));
    return { go, frames };
  };

  // 一覧用の小さな図（最初の場面だけ。動きなし・番号なし）
  BC.courtThumb = function (diagram) {
    const fr = BC.frames(diagram)[0];
    if (!fr) return '';
    const full = fr.court === 'full';
    const H = full ? 28 : 14;
    const ps = fr.o.filter(Boolean).map((p) => `<circle class="cvt-o" cx="${f(p[0])}" cy="${f(p[1])}" r="0.75"/>`).join('') +
      fr.x.filter(Boolean).map((p) => `<path class="cvt-x" d="M${f(p[0] - 0.5)} ${f(p[1] - 0.5)} l1 1 m0 -1 l-1 1"/>`).join('') +
      (fr.cones || []).map((p) => `<path class="cv-cone" d="M${f(p[0])} ${f(p[1] - 0.45)} l0.4 0.75 l-0.8 0 Z"/>`).join('');
    return `<svg class="cvt" viewBox="-8 -1 16 ${H + 2}" aria-hidden="true">${courtSVG(full)}${ps}</svg>`;
  };
})();
