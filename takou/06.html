      if (i < 2) CH.arrow(D, R.x0 + cwid / 2, y + s * 1.1, R.x0 + cwid / 2, y + rh - s * 1.1, { col: 'rgba(242,240,230,.6)', w: 2, head: 8 });
    });
    var y4 = R.y0 + rh * 3.55, a4 = ph ? sm(.65, .85, t) : 0, l4 = 'ひく式は かっこに入れてから：−{P|(x^2＋3x−10)}＝−x^2−3x＋10';
    TX(D, R.cx, y4, l4, { size: fit(D, l4, R.w, s * 1.15), a: a4, hb: a4 });
  }

  /* ---- 例題 ---- */
  function ex(D, t, ph) {
    var R = CH.box(D, { l: .05, r: .05, t: .05, b: .05 }), s = CH.fs(D);
    var ch = chain(D, CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .75), EX, ph ? sm(0, .8, t) : 0, { size: Math.min(s * 1.4, R.w / 13), last: C.yel, labs: wideOf(D) ? ['', 'ひく式は かっこに入れる', 'かっこをはずす', '同類項'] : null });
    var a = ph ? sm(.82, .95, t) : 0, l = '−(−10)＝＋10 に注意';
    chip(D, R.cx, R.y0 + R.h * .88, l, C.pink, a, Math.min(s, fit(D, l, R.w * .8, s)));
  }

  /* ---- 考えよう：(a＋b＋c)^2 の面積図（a・b・c の長さは 4通り） ---- */
  var PS = [[1, 2, 3], [3, 2, 1], [2, 3, 2], [4, 1, 2]];
  function kangae(D) {
    var p = PS[D.V.p], a = p[0], b = p[1], c = p[2], m = D.V.m, R = CH.box(D, { l: .06, r: .06, t: .04, b: .04 }), s = CH.fs(D);
    var parts = m ? [{ t: 'M', v: a + b, col: C.yel }, { t: 'c', v: c }] : [{ t: 'a', v: a }, { t: 'b', v: b }, { t: 'c', v: c }];
    var G = area(D, CH.rect(R.x0, R.y0, R.x1, R.y1 - s * 1.8), parts, parts, { top: m ? 'M＋c' : 'a＋b＋c', left: m ? 'M＋c' : 'a＋b＋c', cell: function (r, q) { return { col: (r === q) ? C.yel : C.lav, fa: .12 }; } });
    var f = m ? 'M＝a＋b とおくと (M＋c)^2' : '(a＋b＋c)^2';
    TX(D, R.cx, R.y1 - s * .6, f, { size: fit(D, f, R.w, s * 1.15), col: C.yel });
  }

  /* ---- チャレンジ ---- */
  function chal(D, t, ph) {
    var R = CH.box(D, { l: .05, r: .05, t: .04, b: .04 }), s = CH.fs(D);
    chain(D, R, LC, ph ? t : 0, { size: Math.min(s * 1.3, R.w / 12), last: C.yel, labs: ['', 'y−2 を見つける', 'y−2＝M', '公式④', 'M をもどす', '公式③', 'かっこをはずす'] });
  }

  K3.run({
    no: '第6時', title: '同じ部分をおきかえて、公式を組み合わせて展開しよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '05.html', label: '◀ 第5時' }, { href: '07.html', label: '第7時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: '(a＋b＋4)(a＋b−4) の展開', q: '(a＋b＋4)(a＋b−4) は、そのままでは公式が使えない。どうすれば、これまでの公式を使って展開できるだろう。考えを書こう。',
        notes: ['① 自分の考え（3分）　どこに目をつけたかも書こう。', '② ペアの考え（3分）　自分とちがう考え方があれば、書こう。'],
        draw: function (D) { today(D, 0, false); } },
      { tag: '今日の問い', q: 'どうすれば、公式で展開できる？ 展開すると？', a: 'a＋b を M とおくと、公式④が使える。a^2＋2ab＋b^2−16', sub: '2つのかっこに a＋b が共通。(M＋4)(M−4)＝M^2−16。M を a＋b にもどして (a＋b)^2−16＝a^2＋2ab＋b^2−16', dur: 10,
        b: { t: 'a＋b＝M → (M＋4)(M−4)＝M^2−16＝(a＋b)^2−16＝<b>a^2＋2ab＋b^2−16</b>', col: C.yel },
        draw: function (D) { today(D, D.t, D.ph); } },
      { tag: 'ことば', bh: 'ことば', q: '式の中の同じ部分を、1つの文字にかえることを何という？ 展開したあとは、どうする？', a: 'おきかえ。展開したあとは、文字をもとの式にもどす', sub: '公式の x には、式も入れられる。ひく式は、展開した式をかっこに入れてから符号をかえる', dur: 7,
        b: [{ t: '同じ部分を 1つの文字にかえる … <b>おきかえ</b>（公式の x には<b>式</b>も入れられる）', col: C.green }, { t: '展開したあとは <b>もとの式</b> にもどす。ひく式は <b>かっこ</b> に入れてから', col: C.green }],
        draw: function (D) { kotoba(D, D.t, D.ph); } },
      { tag: '例題', bh: '例題　公式を組み合わせる', q: '(x＋3)^2−(x＋5)(x−2) を、順に計算しよう。', a: '3x＋19', sub: '① (x＋3)^2＝x^2＋6x＋9、(x＋5)(x−2)＝x^2＋3x−10　② ひく式をかっこに入れて、かっこをはずす　③ 同類項をまとめる', dur: 9,
        b: { t: 'x^2＋6x＋9−(x^2＋3x−10)＝x^2＋6x＋9−x^2−3x＋10＝<b>3x＋19</b>', col: C.pink },
        draw: function (D) { ex(D, D.t, D.ph); } },
      { tag: '考えよう', q: '(a＋b＋c)^2 を展開しよう。表（面積図）を使う方法と、おきかえを使う方法の、どちらでもよい。',
        notes: ['展開した式と、気づいたことを書こう。', 'a＝1、b＝2、c＝3 を入れて、確かめよう。', 'スライダーで a・b・c の長さを変えられます（4通り）。「まとめる」で a＋b を M にした図になります（ますの中の式は出ません）。'],
        sliders: [{ key: 'p', label: '長さ', min: 0, max: 3, step: 1, val: 0, fmt: function (v) { return 'a＝' + PS[v][0] + '、b＝' + PS[v][1] + '、c＝' + PS[v][2]; } }, { key: 'm', label: 'まとめる', min: 0, max: 1, step: 1, val: 0, fmt: function (v) { return v ? 'a＋b＝M' : '—'; } }],
        draw: kangae },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '(x＋y−2)(x−y＋2) を展開しよう。', a: 'x^2−y^2＋4y−4', sub: '2つのかっこで、x 以外の部分は y−2 と −(y−2)。y−2＝M とおくと (x＋M)(x−M)＝x^2−M^2＝x^2−(y−2)^2', dur: 10,
        b: { t: 'y−2＝M → x^2−M^2＝x^2−(y−2)^2＝<b>x^2−y^2＋4y−4</b>', col: C.orange },
        draw: function (D) { chal(D, D.t, D.ph); } }
    ])
  });
})();
