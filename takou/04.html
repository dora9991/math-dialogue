    area(D, CH.rect(A.x0, A.y0, A.x1, A.y1 - fh), [{ t: 'x', v: X }, { t: 'a', v: a }], [{ t: 'x', v: X }, { t: 'a', v: a }], {
      top: 'x＋a', left: 'x＋a', cell: function (r, c) { var i = r * 2 + c; return { t: k1 > 0 ? cells[i][0] : '', col: cells[i][1], fa: .08 + .22 * k1, a: k1 }; } });
    TX(D, A.cx, A.y1 - fh * .45, ph ? f1 : '(x＋a)^2＝？', { size: z, a: ph ? sm(.15, .3, t) : .8, col: ph ? C.chalk : C.yel });
    /* (x−a)^2：大きい正方形 x から、帯を切りとる */
    var DB = CH.rect(B.x0, B.y0, B.x1, B.y1 - fh), m = 1 + .9 * a / X, L = Math.min((DB.w - s * 2.6) / m, (DB.h - s * 3) / m), aL = L * a / X;
    var x0 = DB.cx - L * m / 2 + s * 1.2, y0 = DB.y0 + s * 1.6 + Math.max(0, (DB.h - s * 2 - L * m) / 2);
    var c1 = ph ? CH.ease(sm(.32, .48, t)) : 0, c2 = ph ? CH.ease(sm(.5, .66, t)) : 0, c3 = ph ? sm(.7, .82, t) : 0, kf = ph ? sm(.84, .96, t) : 0;
    CH.fillRect(D, x0, y0, x0 + L - aL, y0 + L - aL, { fill: ha(C.lav, .22) });
    CH.fillRect(D, x0, y0, x0 + L, y0 + L, { stroke: C.chalk, sw: 2.2, dash: c1 > 0, a: c1 > 0 ? .5 : 1 });
    CH.line(D, x0 + L - aL, y0, x0 + L - aL, y0 + L, { w: 1.6, dash: [6, 5], a: .7 }); CH.line(D, x0, y0 + L - aL, x0 + L, y0 + L - aL, { w: 1.6, dash: [6, 5], a: .7 });
    if (c1 > 0) { var dx = c1 * aL * .9; CH.fillRect(D, x0 + L - aL + dx, y0, x0 + L + dx, y0 + L, { fill: ha(C.pink, .25), stroke: C.pink, sw: 2 }); TX(D, x0 + L - aL / 2 + dx, y0 + (L - aL) / 2, '−ax', { size: fit(D, '−ax', aL * 1.6, s), col: C.pink, outline: OUT }); }
    if (c2 > 0) {
      var dy = c2 * aL * .9; CH.fillRect(D, x0, y0 + L - aL + dy, x0 + L, y0 + L + dy, { fill: ha(C.pink, .25), stroke: C.pink, sw: 2 }); TX(D, x0 + (L - aL) / 2, y0 + L - aL / 2 + dy, '−ax', { size: Math.min(s, aL * .7), col: C.pink, outline: OUT });
      if (c3 > 0) { var nt = w ? '＋a^2（2回ひいた分）' : '＋a^2'; rr(D, x0 + L - aL + 2, y0 + L - aL + dy + 2, x0 + L - 2, y0 + L + dy - 2, { r: 3, fill: ha(C.yel, .4 * c3), stroke: C.yel, sw: 2.6, glow: true, a: c3 }); TX(D, x0 + L + aL * .9, y0 + L + dy + s * .8, nt, { size: fit(D, nt, L, s * .85), col: C.yel, a: c3, align: 'right' }); }
    }
    TX(D, x0 + (L - aL) / 2, y0 - s * .8, 'x−a', { size: s }); TX(D, x0 + L - aL / 2, y0 - s * .8, 'a', { size: s, col: C.pink });
    TX(D, x0 - s * .5, y0 + (L - aL) / 2, 'x−a', { size: s, align: 'right' }); TX(D, x0 - s * .5, y0 + L - aL / 2, 'a', { size: s, align: 'right', col: C.pink });
    TX(D, x0 + (L - aL) / 2, y0 + (L - aL) / 2, '(x−a)^2', { size: fit(D, '(x−a)^2', (L - aL) * .8, s * 1.2), col: C.lav });
    TX(D, B.cx, B.y1 - fh * .45, ph ? f2 : '(x−a)^2＝？', { size: z, a: ph ? kf : .8, col: ph ? C.chalk : C.yel });
  }

  /* ---- 例題：2乗・2倍・2乗 ---- */
  function ex(D, t, ph) {
    var R = CH.box(D, { l: .05, r: .05, t: .03, b: .03 }), s = CH.fs(D), P = CH.rows(R, 3, .06);
    EX.forEach(function (e, i) {

    });
  }

  /* ---- 考えよう：(a＋b)^2 と (a−b)^2 の正方形 ---- */
  function kangae(D) {

    [[m, '(a＋b)^2＝' + m + '^2＝' + m * m, C.blue], [n, '(a−b)^2＝' + (a - b < 0 ? '(' + S(a - b) + ')' : n) + '^2＝' + n * n, C.orange]].forEach(function (q, i) {
      var B = P[i], L = q[0] * u, x0 = B.cx - L / 2, y0 = R.y0 + s * .6 + (m * u - L);
      for (var r = 0; r < q[0]; r++) for (var c = 0; c < q[0]; c++) CH.fillRect(D, x0 + c * u + 1, y0 + r * u + 1, x0 + (c + 1) * u - 1, y0 + (r + 1) * u - 1, { fill: ha(q[2], .3), stroke: q[2], sw: 1 });
      if (!q[0]) TX(D, B.cx, y0 - s * .2, '（正方形なし）', { size: s * .8, col: 'rgba(242,240,230,.6)' });
      TX(D, B.cx, R.y0 + s * .6 + m * u + s * 1.4, q[1], { size: fit(D, q[1], B.w, s * 1.15), col: q[2] });
    });
    TX(D, R.cx, R.y1 - s * .8, 'a＝' + a + '、b＝' + b, { size: s * 1.1, col: C.yel });
  }

  /* ---- チャレンジ：(x＋y)^2 の正方形から、xy の長方形 2つをぬく ---- */
  function chal(D, t, ph) {
    var P = two(D, .48, .5), s = CH.fs(D), A = P[0], k = ph ? sm(.15, .35, t) : 0;
    var cells = [['x^2', C.yel], ['xy', C.pink], ['xy', C.pink], ['y^2', C.orange]];
    area(D, CH.rect(A.x0, A.y0 + s * .4, A.x1, A.y1 - s * 2), [{ t: 'x', v: CX }, { t: 'y', v: CY }], [{ t: 'x', v: CX }, { t: 'y', v: CY }], {
      top: 'x＋y＝5', left: 'x＋y', cell: function (r, c) { var i = r * 2 + c, ab = i === 1 || i === 2; return { t: cells[i][0], col: cells[i][1], fa: ab ? .3 * (1 - k) + .02 : .3, a: ab ? 1 - k * .75 : 1 }; } });
    TX(D, A.cx, A.y1 - s * .8, '(x＋y)^2＝25、xy＝3', { size: fit(D, '(x＋y)^2＝25、xy＝3', A.w, s), col: C.green });
    chain(D, P[1], ['(x＋y)^2＝x^2＋{P|2xy}＋y^2'].concat(LC), ph ? sm(.2, 1, t) : 0, { size: Math.min(s * 1.3, P[1].w / 11), last: C.yel });
  }
