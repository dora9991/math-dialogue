/* 式の展開と因数分解 第17時：「式の展開と因数分解」で学んだことを、整理して確かめよう（ikkan の lesson_takou_17 と同じ流れ）。
   今日の問いは、計算のくふう（103^2 の面積の図）・数の性質（2n(n＋1) のタイル）・道の面積（S＝aℓ）の3つの場面の式を見て、展開や因数分解でできたことをふり返る。

   考えようは、(x＋a)(x＋b) の面積の図を、スライダーで x・a・b を変えて見る道具（面積の式は出さない）。チャレンジは (n＋3)^2−(n−1)^2＝8(n＋1) を、展開と、和と差の積の2通りで。

(function () {
  /* ======== 道具（式の展開と因数分解の黒板 第10〜17時で共通。どのページにも同じものを入れてある。

  /* 式 A が 式 B に変わる（k：0→1）。同じ名前の字は動き、なくなる字は消え、新しい字は出てくる。o.map：{A の名前: B の名前}。o.box：まとまりのカード */

  /* カードが動きながら裏返る（a・b はまとまりの四角。k：0→1。ta → tb に字がかわる） */

  function nw(s) { return String(s).replace(/[0-9A-Za-zπℓ\(\)\[\]\/\.×÷＋−＝^□]{2,}/g, function (m) { return m.split(/(?=＝)/).map(function (q) { return '<span style="white-space:nowrap">' + q + '</span>'; }).join(''); }); }
