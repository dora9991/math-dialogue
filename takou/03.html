    if (kb > 0) { var bx0 = x0 + X * u + 2, bx1 = x0 + (X + a + gap + b) * u - 2; brace(D, bx0, y0 - ls * 1.55, bx1, y0 - ls * 1.55, ls * .45, C.yel, kb); TX(D, (bx0 + bx1) / 2, y0 - ls * 2.6, '(' + a + '＋' + b + ')x＝' + (a + b) + 'x', { size: fit(D, '(5＋5)x＝10x', bx1 - bx0 + ls * 3, ls), col: C.yel, a: kb }); }

  function ex(D, t, ph) {
