    var R = CH.box(D, { l: .05, r: .05, t: .05, b: .05 }), s = CH.fs(D), e = '(a＋b)(c＋d)', z = Math.min(s * 2.2, fit(D, e, R.w * .62, s * 2.2)), xl = R.x0 + R.w * .3;
    var y1 = R.y0 + R.h * .34, y2 = R.y0 + R.h * .84, x0 = R.x0 + R.w * .3 + (R.w * .7 - TW(D, e, z)) / 2;
    var cw = chip(D, R.x0, y1, '積の形', C.chalk, 1, s * .85, 'left'); chip(D, R.x0, y2, '和の形', C.yel, ph ? sm(.7, .85, t) : .6, s * .85, 'left');
    TX(D, x0, y1, e, { size: z, align: 'left' });
    var xa = xOf(D, e, 'a', z, x0), xb = xOf(D, e, 'b', z, x0), xc = xOf(D, e, 'c', z, x0), xd = xOf(D, e, 'd', z, x0);
    var A = [[xa, xc, 1], [xa, xd, 1], [xb, xc, -1], [xb, xd, -1]], nm = ['①', '②', '③', '④'];
    A.forEach(function (q, i) {
      var k = ph ? sm(.05 + i * .13, .17 + i * .13, t) : 0, h = z * (i % 2 ? 1.05 : .62) * q[2], y = y1 + q[2] * -z * .62;
      arc(D, q[0], q[1], y, QC[i], k, { h: h, lab: nm[i], size: s * .85 });
    });
    if (!ph) { TX(D, x0 + TW(D, e, z) / 2, y2, '？', { size: z, col: C.yel, a: .6 }); return; }
    var parts = [];
    ['ac', 'ad', 'bc', 'bd'].forEach(function (q, i) { var a = sm(.1 + i * .13, .2 + i * .13, t); if (i) parts.push({ t: '＋', a: a }); parts.push({ t: q, col: QC[i], a: a }); });
    var z2 = Math.min(z, fit(D, 'ac＋ad＋bc＋bd', R.w * .66, z));
    seq(D, R.x0 + R.w * .3 + R.w * .35, y2, parts, { size: z2 });
    var ka = sm(.6, .75, t), xm = R.x0 + cw / 2; CH.arrow(D, xm, y1 + s * 1.3, xm, y2 - s * 1.3, { col: C.yel, w: 2.4, head: 10, a: ka });
    TX(D, xm + s * .5, (y1 + y2) / 2, '展開', { size: s, align: 'left', col: C.yel, a: ka });
  }

  /* ---- 例題（1）（2）：面積図と、計算の行 ---- */
  function exPanel(D, B, rs, cs, cells, L, k, ph, lab, mg) {
    var s = CH.fs(D), w = wideOf(D), Ra = w ? CH.rect(B.x0, B.y0 + s * 1.2, B.x1, B.y0 + B.h * .58) : CH.rect(B.x0, B.y0, B.x0 + B.w * .5, B.y1);
    var Rc = w ? CH.rect(B.x0, B.y0 + B.h * .62, B.x1, B.y1) : CH.rect(B.x0 + B.w * .52, B.y0 + s, B.x1, B.y1);
    var cut = ph ? sm(0, .15, k) : 0;
    area(D, Ra, cs.map(function (q) { return { t: q, v: len(q) }; }), rs.map(function (q) { return { t: q, v: len(q) }; }), {
      top: cs.join('＋'), left: rs.join('＋'), cut: cut, seg: cut,
      cell: function (r, c) { var i = r * 2 + c, kk = ph ? sm(.15 + i * .08, .25 + i * .08, k) : 0, cl = cells[i]; return kk > 0 ? { t: cl[0], col: cl[1], fa: .3 * kk, a: kk, glow: mg && mg.indexOf(i) >= 0 ? sm(.55, .65, k) * (1 - sm(.85, .95, k)) : 0 } : null; } });
    TX(D, B.x0, B.y0 + s * .5, lab, { size: s * .9, align: 'left', col: C.pink });
    chain(D, Rc, L, ph ? sm(.35, 1, k) : 0, { size: Math.min(s * 1.25, Rc.w / 9), last: C.yel });
  }
  function ex12(D, t, ph) {
    var R = CH.box(D, { l: .04, r: .04, t: .03, b: .03 }), w = wideOf(D), P = w ? CH.cols(R, 2, .08) : CH.rows(R, 2, .08);
    exPanel(D, P[0], ['x', '3'], ['y', '5'], [['xy', C.lav], ['5x', C.blue], ['3y', C.green], ['15', C.orange]], E1, ph ? CH.clamp(t * 2, 0, 1) : 0, ph, '（1）');
    exPanel(D, P[1], ['x', '2'], ['x', '7'], [['x^2', C.yel], ['7x', C.blue], ['2x', C.blue], ['14', C.orange]], E2, ph ? CH.clamp(t * 2 - 1, 0, 1) : 0, ph, '（2）', [1, 2]);
  }
  /* 例題（3）：面積図（表の形）。負の項はピンク */
  function ex3(D, t, ph) {
    var P = two(D, .48, .5), s = CH.fs(D), A = P[0], B = P[1], cut = ph ? sm(0, .12, t) : 0, mg = sm(.62, .72, t) * (1 - sm(.9, 1, t));
    var cells = [['2a^2', C.yel], ['8ab', C.lav], ['−ab', C.pink], ['−4b^2', C.pink]];
    area(D, CH.rect(A.x0, A.y0 + s * .6, A.x1, A.y1 - s * 2.4), [{ t: 'a', v: 2.6 }, { t: '4b', v: 4.2 }], [{ t: '2a', v: 3.4 }, { t: '−b', v: 1.6, col: C.pink }], {
      top: 'a＋4b', left: '2a−b', cut: cut, seg: cut,
      cell: function (r, c) { var i = r * 2 + c, kk = ph ? sm(.12 + i * .08, .22 + i * .08, t) : 0; return kk > 0 ? { t: cells[i][0], col: cells[i][1], fa: .3 * kk, a: kk, glow: i === 1 || i === 2 ? mg : 0 } : null; } });
    TX(D, A.cx, A.y1 - s * 1.1, '面積図を表の形に（負の項はピンク）', { size: fit(D, '面積図を表の形に（負の項はピンク）', A.w, s * .8), col: 'rgba(242,240,230,.75)' });
    chain(D, B, E3, ph ? sm(.3, 1, t) : 0, { size: Math.min(s * 1.3, B.w / 9), last: C.yel, labs: ['', '同類項', ''] });
  }

  /* ---- 考えよう：ア〜エの面積図（ますの式は出さない） ---- */
  function kangae(D) {
    var p = KP[D.V.k], s = CH.fs(D), R = CH.box(D, { l: .08, r: .08, t: .04, b: .04 }), e = p[0] + '　(' + p[1] + '＋' + p[2] + ')(' + p[3] + '＋' + p[4] + ')';
    TX(D, R.cx, R.y0 + s * .8, e, { size: fit(D, e, R.w, s * 1.4), col: C.yel });
    area(D, CH.rect(R.x0, R.y0 + s * 2.2, R.x1, R.y1), [{ t: p[3], v: len(p[3]) }, { t: p[4], v: len(p[4]) }], [{ t: p[1], v: len(p[1]) }, { t: p[2], v: len(p[2]) }], {
      top: p[3] + '＋' + p[4], left: p[1] + '＋' + p[2], cell: function () { return { col: C.lav, fa: .06 }; } });
  }

  /* ---- チャレンジ ---- */
  function chal(D, t, ph) {
    var R = CH.box(D, { l: .05, r: .05, t: .04, b: .04 }), s = CH.fs(D), z = Math.min(s * 1.4, R.w / 11);
    var ch = chain(D, CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .55), LC, ph ? sm(0, .55, t) : 0, { size: z, labs: ['', '同類項', ''] });
    var y = R.y0 + R.h * .62, zz = ch.z, a0 = ph ? sm(.58, .68, t) : 1;
    TX(D, ch.base, y, 'これが　x^2＋{b|b}x{o|−12}　と同じ', { size: fit(D, 'これが　x^2＋bx−12　と同じ', R.w, zz), align: 'left', col: C.green, a: a0 });
    var l1 = '{o|3a}＝{o|−12} より　a＝−4', l2 = '{b|b}＝a＋3＝−4＋3＝−1';
    TX(D, ch.base, y + zz * 1.8, l1, { size: fit(D, l1, R.w, zz), align: 'left', a: ph ? sm(.7, .82, t) : 0 });
    TX(D, ch.base, y + zz * 3.6, l2, { size: fit(D, l2, R.w, zz), align: 'left', a: ph ? sm(.84, .96, t) : 0 });
  }

  K3.run({
    no: '第2時', title: '多項式どうしのかけ算（展開）を、面積の図で考えよう', flat: true, hint: '',
    links: [{ href: 'index.html', label: '目次' }, { href: '01.html', label: '◀ 第1時' }, { href: '03.html', label: '第3時 ▶' }],
    steps: fixSteps([
      { tag: '今日の問い', bh: '縦 (a＋b) cm・横 (c＋d) cm の長方形', q: '縦が (a＋b) cm、横が (c＋d) cm の長方形の面積を、2通りの式で表そう。2つの式から、どんなことがいえるだろう。',
        notes: ['① 自分の考え（3分）　図に線を引いて、2つの式を書こう。', '② ペアの考え（3分）　自分とちがう分け方・気づきを書こう。'],
        draw: function (D) { rectQ(D, CH.box(D, { l: .1, r: .1, t: .1, b: .12 }), 0, false); } },
      { tag: '今日の問い', q: '長方形の面積を表す、2つの式は？', a: '(a＋b)(c＋d) と ac＋ad＋bc＋bd', sub: '全体で見ると 縦×横＝(a＋b)(c＋d)。4つの長方形に分けると ac＋ad＋bc＋bd。同じ面積だから、2つの式は等しい', dur: 8,
        b: { t: '(a＋b)(c＋d)＝<b>ac＋ad＋bc＋bd</b>（4つの長方形の和）', col: C.yel },
        draw: function (D) { today(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '(a＋b)(c＋d) のような積の形の式を、かっこのない和の形に直すことを何という？ 直してできた同類項は、どうする？', a: '展開する。同類項は まとめる', sub: '前のかっこの a・b を、後ろのかっこの c・d に、それぞれかける（①〜④の 4つの積）', dur: 7,
        b: [{ t: '積の形の式を、和の形に直す … <b>展開</b> する', col: C.green }, { t: '(a＋b)(c＋d)＝ac＋ad＋bc＋bd　<b>同類項</b> はまとめる', col: C.green }],
        draw: function (D) { kotoba(D, D.t, D.ph); } },
      { tag: '例題', bh: '例題　展開する', q: '（1）(x＋3)(y＋5)　（2）(x＋2)(x＋7) を展開しよう。', a: '（1）xy＋5x＋3y＋15　（2）x^2＋9x＋14', sub: '（2）は 4つの積 x^2＋7x＋2x＋14。7x と 2x は同類項（同じ形の長方形）なので、まとめて 9x', dur: 10,
        b: { t: '（1）<b>xy＋5x＋3y＋15</b>　（2）x^2＋7x＋2x＋14＝<b>x^2＋9x＋14</b>', col: C.pink },
        draw: function (D) { ex12(D, D.t, D.ph); } },
      { tag: '例題', q: '（3）(2a−b)(a＋4b) を展開しよう。', a: '2a^2＋7ab−4b^2', sub: '4つの積 2a^2＋8ab−ab−4b^2。−b をかけるところの符号に注意。8ab−ab＝7ab', dur: 8,
        b: { t: '（3）2a^2＋8ab−ab−4b^2＝<b>2a^2＋7ab−4b^2</b>', col: C.pink },
        draw: function (D) { ex3(D, D.t, D.ph); } },
      { tag: '考えよう', q: '次の式を展開して、まとめたあとの項の数を数えよう。ア (a＋2)(b＋3)　イ (x＋2)(x＋3)　ウ (x＋2)(y＋3)　エ (x＋4)(x＋5)。項の数が へる式と、へらない式がある。どんなときに へるのだろう。',
        notes: ['調べて、気づいたことを書こう。', '項の数がへるわけを、展開の途中の式を使って説明しよう。', 'スライダーで ア〜エ を選ぶと、面積図が出ます（ますの中の式は出ません）。'],
        sliders: [{ key: 'k', label: '式', min: 0, max: 3, step: 1, val: 0, fmt: function (v) { return 'アイウエ'.charAt(v); } }],
        draw: kangae },
      { tag: 'チャレンジ', bh: 'チャレンジ', q: '(x＋3)(x＋a) を展開すると、x^2＋bx−12 になった。a、b の値を求めよう。', a: 'a＝−4、b＝−1', sub: '(x＋3)(x＋a)＝x^2＋(a＋3)x＋3a。数の項をくらべて 3a＝−12 より a＝−4。x の係数をくらべて b＝a＋3＝−1', dur: 9,
        b: { t: '(x＋3)(x＋a)＝x^2＋(a＋3)x＋3a → 3a＝−12、<b>a＝−4</b>、b＝a＋3＝<b>−1</b>', col: C.orange },
        draw: function (D) { chal(D, D.t, D.ph); } }
    ])
  });
})();
