/* 式の展開と因数分解 第10時：共通な因数やおきかえを使って、いろいろな式を因数分解しよう（ikkan の lesson_takou_10 と同じ流れ）。

   考えようは、xy＋3x＋4y＋12 の4つの項を、スライダーで2つずつの組に分ける道具（各項を、かけ算の形にばらせる。答えは出さない）。チャレンジは 2(x−1)^2＋10(x−1)＋12。

(function () {
  /* ======== 道具（式の展開と因数分解の黒板 第10〜17時で共通。どのページにも同じものを入れてある。
