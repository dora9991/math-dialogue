  }

  /* ---- チャレンジ ---- */
  function chal(D, t, ph) {

    var a = ph ? sm(.76, .92, t) : 0, v = '−15×1^2＋3×1×(−2)＝{y|−21}';
    TX(D, R.x0, R.y0 + R.h * .78, 'x＝1、y＝−2 のとき', { size: s, align: 'left', col: C.green, a: a });
    TX(D, R.cx, R.y0 + R.h * .9, v, { size: fit(D, v, R.w, z), a: a });
  }
