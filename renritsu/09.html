  /* ---- ことば：840m を 12分で歩く ---- */
  function word(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .02, b: .03 }), s = CH.fs(D), top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .32), G = road(D, top, 1960, 1960), u = Math.min(s * 2.4, top.h * .36);
    var m = 12 * CH.smooth(.04, .34, k), d = 70 * m;
    path(D, G, 2000, d, u); clock(D, top.x1 - s * 1.2, top.y0 + s * 1.1, s * 1.05, m, XC);
    TX(D, top.x1 - s * 2.6, top.y0 + s * 1.1, Math.round(m) + '分', { size: s * .9, col: C.yel, align: 'right' });
    TX(D, G.X(420), G.y - u * 1.4, '分速 70m', { size: s * .85, col: XC });
    var a0 = CH.smooth(.34, .4, k);
    if (a0 > 0) brace(D, G.X(0), G.X(840), G.y + s * .5, 1, { h: s * .3, lab: '840 m', col: C.yel, size: s * .85, a: a0 });

  /* ---- 山道：上り ux km・下り dy km（上りの坂の角度は 25°）。L：1km の長さ。(x0, yb) が左のふもと。返すもの：A・P（頂上）・B と、道のりの位置 at(d) ---- */
  function mount(D, x0, yb, L, ux, dy, o) {
    o = o || {}; var t1 = 25 * Math.PI / 180, h = ux * Math.sin(t1), t2 = Math.asin(Math.min(1, h / dy)), A = [x0, yb], P = [x0 + ux * Math.cos(t1) * L, yb - h * L], B = [P[0] + dy * Math.cos(t2) * L, yb];
    CH.poly(D, [A, P, B], { fill: 'rgba(169,240,176,.07)' });
    CH.line(D, A[0] - L * .4, yb, B[0] + L * .4, yb, { col: 'rgba(242,240,230,.4)', w: 2 });
    CH.line(D, A[0], A[1], P[0], P[1], { col: o.c1 || XC, w: 4 }); CH.line(D, P[0], P[1], B[0], B[1], { col: o.c2 || YC, w: 4 });
    function at(d) { if (d <= ux) return [CH.lerp(A[0], P[0], d / ux), CH.lerp(A[1], P[1], d / ux)]; var q = (d - ux) / dy; return [CH.lerp(P[0], B[0], q), CH.lerp(P[1], B[1], q)]; }
    return { A: A, P: P, B: B, at: at };
  }
  function mlab(D, p, q, t, col, size, side) { var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, up = q[1] < p[1]; TX(D, mx + (up ? -1 : 1) * size * .5, my - size * .9, t, { size: size, col: col, outline: OUT, align: up ? 'right' : 'left' }); }

  /* ---- 例題：山道（頂上の位置が、解くと決まる） ---- */
  function ex(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .02, b: .03 }), s = CH.fs(D), W = wide(D), ph = !!D.ph, top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .36);
    var e = ph ? CH.ease(CH.smooth(.6, .7, k)) : 0, ux = CH.lerp(4.5, 6, e), L = Math.min(top.w * .8 / 9, top.h * .62 / (6 * Math.sin(25 * Math.PI / 180))), x0 = top.cx - 7.6 * L / 2, yb = top.y1 - s * .4;
    var M = mount(D, x0, yb, L, ux, 9 - ux), z = Math.min(s * .85, L * .42);

    walker(D, p[0], p[1] - 2, Math.min(s * 2, L * 1.1), dd > 6 ? YC : XC, dd * 3, false);

    tableF(D, Rs[0], ['', '上り', '下り', '合計'], [['道のり（km）', 'x', 'y', '9'], ['速さ（km/時）', '2', '3', ''], ['時間（時間）', '[x/2]', '[y/3]', '4']], {

    });

      k, { size: s * 1.15, a: CH.smooth(.2, .26, k), top: !W });
  }

  /* ---- 考えよう：歩いた時間と、出発してからの時間 ---- */
  function tool(D) {

    });

  /* ---- チャレンジ：行きと帰り ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .02, b: .03 }), s = CH.fs(D), ph = !!D.ph, top = CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .42);
    var e = ph ? CH.ease(CH.smooth(.8, .9, k)) : 0, ux = CH.lerp(7, 6, e), L = Math.min(top.w * .86 / 14, top.h * .55 / (7 * Math.sin(25 * Math.PI / 180))), x0 = top.cx - 13.6 * L / 2, yb = top.y1 - s * 1.8;
    var M = mount(D, x0, yb, L, ux, 14 - ux), z = Math.min(s * .82, L * .5);

    var ar = Math.min(s * 1.4, L * .9), yA = yb + s * 2;

    TX(D, top.cx, yA - s * .2, '行き（5時間）：x は上り 時速2km、y は下り 時速4km', { size: fit(D, '行き（5時間）：x は上り 時速2km、y は下り 時速4km', top.w * .98, s * .8), col: C.chalk });
    CH.arrow(D, M.B[0] - L, yA + s * .85, M.A[0] + L, yA + s * .85, { col: C.orange, w: 1.6, head: 7 });
    TX(D, top.cx, yA + s * 1.2, '帰り（5時間30分）：y が上り、x が下り', { size: fit(D, '帰り（5時間30分）：y が上り、x が下り', top.w * .98, s * .8), col: C.orange });
    if (!ph) return;
    eqsW(D, CH.rect(R.x0, yA + s * 2.2, R.x1, R.y1), [{ s: PC[0], lab: '…① 行き' }, { s: PC[1], lab: '…② 帰り', at: .18 }, { s: LC[0], lab: '①×4 …③', at: .34 }, { s: LC[1], lab: '②×4 …④', at: .46 }, { s: LC[2], lab: '③×2−④', at: .6, mid: 1 }, { s: 'x＝6、y＝8', txt: true, col: C.yel, at: .74 }],
      k, { size: s * 1.1, a: CH.smooth(.04, .1, k) });
  }

  K3.run({
    no: '第9時', title: '道のり・速さ・時間の問題を、表に整理して解こう', flat: true, hint: '',

    steps: fixSteps([
      { tag: '今日の問い', bh: '家から駅まで（1960m・20分）', q: '家から駅まで 1960m。はじめ分速 70m で歩き、途中から分速 140m で走って、20分で着いた。歩いた道のりと走った道のりは、それぞれ何m だろう。',
        notes: ['① 自分の考え（3分）　文字をおいて、表をうめ、式を2つつくって解こう。', '② ペアの考え（3分）　自分とちがうところを書こう。'],
        draw: function (D) { today(D, 0); } },
      { tag: '今日の問い', q: '歩いた道のりを x m、走った道のりを y m として、表をうめよう。2つの式は？ それぞれ何m？', a: 'x＋y＝1960、[x/70]＋[y/140]＝20。歩いた 840m、走った 1120m', sub: '道のりの行から ①、時間の行から ②。②×140　2x＋y＝2800、①をひいて x＝840、y＝1120。確かめ　840÷70＋1120÷140＝12＋8＝20', dur: 12,
        b: { t: '道のり x＋y＝1960、時間 [x/70]＋[y/140]＝20 → <b>歩いた 840m、走った 1120m</b>', col: C.yel },
        draw: function (D) { today(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: '道のり・速さ・時間には、どんな関係がある？ 速さの単位で、気をつけることは？', a: '道のり＝速さ×時間、時間＝道のり÷速さ。単位をそろえる', sub: '分速 70m で 12分 → 70×12＝840m。840m を分速 70m → 840÷70＝12分。分速と時速、m と km は、そろえてから式にする', dur: 8,
        b: [{ t: '<b>道のり＝速さ×時間</b>、<b>時間＝道のり÷速さ</b>', col: C.green }, { t: '分速（m/分）・時速（km/時）は、<b>単位をそろえて</b>使う', col: C.green }],
        draw: function (D) { word(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　山道の上りと下り', q: '全部で 9km の山道を、上りは時速 2km、下りは時速 3km で歩き、全部で 4時間かかった。上りを x km、下りを y km として、上りと下りの道のりを求めよう。', a: '上り 6km、下り 3km', sub: 'x＋y＝9 …①、[x/2]＋[y/3]＝4 …②。②×6　3x＋2y＝24。①×2 をひいて x＝6、y＝3。確かめ　6÷2＋3÷3＝3＋1＝4', dur: 11,
        b: { t: '時間の式 [x/2]＋[y/3]＝4 は ×6 → 3x＋2y＝24 → <b>上り 6km、下り 3km</b>', col: C.pink },

      { tag: '考えよう', bh: '考えよう', q: '今日の問いを、歩いた時間を x分、走った時間を y分として、もう一度解こう。表をうめて連立方程式をつくり、歩いた道のりと走った道のりを求めよう。道のりを x、y とした解き方とくらべて、気づいたことは？',
