      var z = Math.min(s * 1.2, r.w / 6, r.h / 4.6), cy = wide ? r.y0 + r.h * .35 : r.cy, cx0 = wide ? r.cx : r.x0 + r.w * .3, xs = [-1.6, 0, 1.6].map(function (d) { return cx0 + d * z * 1.3; });
      xs.forEach(function (x, i) { card(D, x, cy, z * 1.5, z * 1.4, ABC[i], { col: C.lav, a: a }); });
      pp.forEach(function (p, i) { link(D, xs[p[0]], xs[p[1]], cy - z * .8 - i * z * .15, z * (1 + i * .5), PC[i], a * CH.smooth(.1 + j * .28, .2 + j * .28, k)); });
      var L = pp.map(function (p, i) { return { s: ABC[p[0]] + '＝' + ABC[p[1]], col: PC[i] }; });
      var Rs = wide ? CH.rect(r.x0, cy + z * 1.4, r.x1, r.y1) : CH.rect(r.x0 + r.w * .58, r.y0, r.x1, r.y1);
      sysC(D, Rs, L, 1, { size: z * 1.05, a: a * CH.smooth(.14 + j * .28, .24 + j * .28, k) });
    });
  }
  /* ---- 例題：A＝B、B＝C を選んで、整理する ---- */
  function ex1(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .1, b: .03 }), s = CH.fs(D), t = D.ph ? k : 0, y0 = R.y0 + R.h * .07, ys = [R.y0 + R.h * .26, R.y0 + R.h * .39];
    var nk = CH.smooth(.46, .58, t), nx = [EQ('x−3y|＝|−3', ['L', '=', 'R']), EQ('2x−5y|＝|−4', ['L', '=', 'R'])];
    pairs(D, R, y0, ys, ['x＋3y', '2x＋3', '5y−1'], [[0, 1], [1, 2]], t, { next: nx, nk: nk, labs: nk >= 1 ? ['③', '④'] : ['①', '②'] });
    if (t > .46) TX(D, R.cx, ys[1] + R.h * .085, '移項して ax＋by＝c の形に', { size: fit(D, '移項して ax＋by＝c の形に', R.w, s * .9), col: C.yel, a: CH.smooth(.46, .52, t) * (1 - CH.smooth(.62, .7, t)) });
    eqs(D, CH.rect(R.x0, R.y0 + R.h * .48, R.x1, R.y1 - s * 2), [{ s: '2x−6y＝−6', lab: '③ × 2 …⑤' }, { s: '−y＝−2', lab: '⑤−④' }, { s: 'y＝2' }, { s: 'x−6＝−3', lab: '③ に代入' }, { s: 'x＝3', col: C.yel }], t, { size: s * 1.05, at: [.68, .75, .81, .87, .92], a: CH.smooth(.62, .67, t) });
    var ck = '確かめ　A 3＋3×2＝9、B 2×3＋3＝9、C 5×2−1＝9';
    TX(D, R.cx, R.y1 - s * .7, ck, { size: fit(D, ck, R.w, s * .95), col: C.green, a: CH.smooth(.94, 1, t) });
  }
  /* ---- 考えよう：組を変えて、2つの等式の値を見る ---- */
  var TK = [['ア', [[0, 1], [1, 2]]], ['イ', [[0, 1], [0, 2]]], ['もとの組', [[0, 2], [1, 2]]]];

    });
  }
  /* ---- チャレンジ：x＝2、y＝1 を代入して、a、b の連立方程式 ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .1, b: .03 }), s = CH.fs(D), t = D.ph ? k : 0, y0 = R.y0 + R.h * .07, ys = [R.y0 + R.h * .26, R.y0 + R.h * .39];

    var O = pairs(D, R, y0, ys, ['ax＋by', 'bx−ay', '10'], [[0, 2], [1, 2]], t, { next: nx, nk: nk });
    if (t > .46 && nk < 1) TX(D, R.cx, ys[1] + R.h * .085, 'x＝2、y＝1 を代入', { size: fit(D, 'x＝2、y＝1 を代入', R.w, s * .95), col: C.yel, a: CH.smooth(.46, .5, t) });

  }

        b: [{ t: 'A＝B＝C は、等式を <b>2つ</b>つくって <b>連立方程式</b>に直す', col: C.green }, { t: '組のつくり方は <b>3通り</b>（A＝B と A＝C、A＝B と B＝C、A＝C と B＝C）', col: C.green }],
        draw: function (D) { word(D, D.ph ? D.t : 0); } },
      { tag: '例題', bh: '例題　A＝B＝C を解く', q: '方程式 x＋3y＝2x＋3＝5y−1 を解こう。', a: 'x＝3、y＝2', sub: 'A＝B、B＝C にして x＋3y＝2x＋3 …①、2x＋3＝5y−1 …②。整理して x−3y＝−3 …③、2x−5y＝−4 …④。③ × 2 − ④ で −y＝−2、y＝2。③ に代入して x＝3', dur: 11,
        b: { t: 'A＝B、B＝C → x−3y＝−3、2x−5y＝−4 → <b>x＝3、y＝2</b>', col: C.pink },
