  function ex(D, k) {

  /* ---- 考えよう：先月のおにぎりを変える ---- */
  function tool(D) {

  /* ---- チャレンジ：男子・女子 ---- */
  function chal(D, k) {
    var R = CH.box(D, { l: .03, r: .03, t: .02, b: .03 }), s = CH.fs(D), ph = !!D.ph, e = ph ? CH.ease(CH.smooth(.7, .8, k)) : 0, X = CH.lerp(500, 400, e), num = e > .5;

    eqsW(D, CH.rect(R.x0, top.y1 + s * 1.2, R.x1, R.y1), [{ s: '2％増 … 1000×[2/100]＝20（人増）', txt: true, col: C.green }, { s: PC[0], lab: '…①', at: .14 }, { s: PC[1], lab: '…② 増減', at: .26 },

        b: [{ t: 'a％増 → <b>[100＋a/100]x</b>、a％減 → <b>[100−a/100]x</b>', col: C.green }, { t: '<b>もとにする量</b>を文字でおき、<b>表</b>に整理する（増えた量は ＋、減った量は −）', col: C.green }],
        draw: function (D) { word(D, D.ph ? D.t : 0); } },
