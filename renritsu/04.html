  }
  /* ---- ことば：y＝2x−1 が、かっこごと y の場所へ ---- */
  function word(D, k) {
    var R = CH.box(D, { l: .04, r: .04, t: .05, b: .04 }), s = CH.fs(D), y1 = R.y0 + R.h * .1, y2 = R.y0 + R.h * .28, f = CH.smooth(.04, .3, k), m = CH.smooth(.28, .4, k);

  function ex1(D, k) {

    var top = m1 < 1 ? [A, A2, m1] : [A3, null, 0];

    if (t > .02 && m1 < 1) TX(D, R.cx, y1 - P.h * 1.1, '−3y を移項して、x＝… の形に', { size: fit(D, '−3y を移項して、x＝… の形に', R.w, s * .95), col: C.pink, a: CH.smooth(.02, .08, t) });
    if (f > 0 && m2 <= 0) { var a = P.P1.e, b = P.P2.x; fly(D, a.x, a.y, b.x, b.y, a.w, b.w * 1.8, P.h, '3y−5', '(3y−5)', f, { arc: -P.h * .2 }); }

  }
  /* ---- 考えよう：2x と 2×3y−5 ---- */
  function tool(D) {
    var R = CH.box(D, { l: .04, r: .05, t: .05, b: .04 }), s = CH.fs(D), y = D.V.y, x = 3 * y - 5, v = [x, 2 * x, 2 * 3 * y - 5];

    var L = [['x＝3y−5', '3×' + y + '−5＝' + S(v[0]), XC], ['2x', '2×(' + S(v[0]) + ')＝' + S(v[1]), C.lav], ['2×3y−5', '2×3×' + y + '−5＝' + S(v[2]), C.pink]];
    var bx0 = R.x0 + R.w * .36, bx1 = R.x1 - s * 1, mn = -11, mx = 20, X = function (q) { return bx0 + (q - mn) / (mx - mn) * (bx1 - bx0); }, bh = Math.min(s * 1.7, R.h * .1), y0 = R.y0 + R.h * .2;

  /* ---- チャレンジ：x＋2y を 11 におきかえる ---- */

    var ab = '（別解）② のかっこをはずして 3x＋5y＝31 としてもよい';

  K3.run({

        notes: ['① 自分の考え（3分）　文字を1つ消す方法と、解き方を書こう。', '② ペアの考え（3分）　自分とちがう考えを書こう。'],

      { tag: '今日の問い', q: '② の式を使って、文字を1つ消すには？ 赤と青は何枚？', a: '① の x を 3y＋4 におきかえる。赤 31枚、青 9枚', sub: 'x と 3y＋4 は同じ数。(3y＋4)＋y＝40 → 4y＝36 → y＝9。② に代入して x＝3×9＋4＝31', dur: 9,
        b: { t: '① の x に 3y＋4 を入れる → 4y＋4＝40 → <b>x＝31、y＝9</b>', col: C.yel },
