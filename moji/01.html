<!doctype html>
<html lang="ja">

</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script>
/* 文字と式 第1時：いくつあっても使える式を、文字を使ってつくろう（ikkan の lesson_moji_01 と同じ流れ）。
   合唱発表会のいすの列が 1列・2列・3列とふえ、式 9×1＋4・9×2＋4・9×3＋4 の「変わる数」が □ になり、文字 a に変わる。
   パンのおつりは、500円のテープから 70円ずつ切りとって 500−70×x。考えようは、a に 0・2.5・12・30 をあてはめた いすの並び（答えは出さない）。
   チャレンジは、ストローの正方形が 1こずつのびて、1＋3×□ の □ が n に。
   数値は ikkan のまま（いす 9脚・先生用 4脚、パン 70円・500円、ストロー 100本）。ことばの a＝10・50 は自作。答えはページの中で計算し直している（CH.check）。 */
(function () {
  /* ======== 式を描く道具（文字と式のページで共通） ======== */
  var C = CH.C, S = CH.mnum, FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', OUT = 'rgba(20,40,30,.9)';
  var NUM = '"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif', OPS = '×÷';  /* × と ÷ は、文字の x とまぎれないよう、ゴシックの字で */

    if (c1 === c2 || t <= 0) return c1; if (t >= 1) return c2; if (c1.charAt(0) !== '#' || c2.charAt(0) !== '#') return t < .5 ? c1 : c2;
    var a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    return 'rgb(' + [16, 8, 0].map(function (s) { return Math.round(CH.lerp(a >> s & 255, b >> s & 255, t)); }).join(',') + ')';
  }
  /* 図の中の式。書き方：[分子/分母]（たての分数）・^2（指数）・{y|…}（色のまとまり。y 黄・p ピンク・b 青・g 緑・o だいだい・l むらさき・w 白）。
     1字ずつ「字#何こめ」の名前がつく（MORPH で、同じ名前の字が動いて移る）。返すもの：w（幅）・items（字）・top・bot */
  function lay(D, str, size) {
    var g = D.ctx, cnt = {}, sn = 0;
    function nid(t) { cnt[t] = (cnt[t] || 0) + 1; return t + '#' + cnt[t]; }
    function close(src, i, op, cl) { var d = 0; for (var j = i; j < src.length; j++) { if (src[j] === op) d++; else if (src[j] === cl) { d--; if (d === 0) return j; } } return src.length; }
    function run(src, s, col) {
      var items = [], x = 0, i = 0, top = s * .55, bot = s * .55;
      function add(R, dx, dy) { R.items.forEach(function (it) { it.x += dx; it.y += dy; items.push(it); }); }
      while (i < src.length) {
        var ch = src[i];
        if (ch === '[') {
          var j = close(src, i, '[', ']'), inner = src.slice(i + 1, j), d = 0, sl = -1;
          for (var q = 0; q < inner.length; q++) { var c2 = inner[q]; if (c2 === '[' || c2 === '{') d++; else if (c2 === ']' || c2 === '}') d--; else if (c2 === '/' && d === 0) { sl = q; break; } }
          var N = run(inner.slice(0, sl), s * .8, col), M = run(inner.slice(sl + 1), s * .8, col), fw = Math.max(N.w, M.w) + s * .34, gp = s * .1;
          add(N, x + (fw - N.w) / 2, -gp - N.bot); add(M, x + (fw - M.w) / 2, gp + M.top);
          items.push({ id: nid('bar'), bar: fw - s * .14, x: x + fw / 2, y: 0, s: s, col: col });
          top = Math.max(top, gp + N.bot + N.top); bot = Math.max(bot, gp + M.top + M.bot); x += fw; i = j + 1; continue;
        }
        if (ch === '^') {
          var k = i + 1; while (k < src.length && /[0-9]/.test(src[k])) k++;
          var E = run(src.slice(i + 1, k), s * .6, col); add(E, x + s * .02, -s * .4); x += E.w + s * .06; top = Math.max(top, s * .4 + E.top); i = k; continue;

          add(G, x, 0); items.push({ span: sn++, x: x + G.w / 2, w: G.w, y: 0, top: G.top, bot: G.bot, s: s, col: cc });

  /* 置く。al：'left'・'right'（なければまん中）。spans は {…} のまとまりの四角 */
  function put(L, cx, cy, al) {

      var q = {}; for (var k in it) q[k] = it[k]; q.x = it.x + x0; q.y = it.y + cy;
      if (it.span != null) P.spans[it.span] = { x0: q.x - it.w / 2, x1: q.x + it.w / 2, cx: q.x, y0: q.y - it.top, y1: q.y + it.bot, col: it.col };
      else { P.items.push(q); P.at[q.id] = q; }

  }
  function drawIt(D, it, a, col) {
    if (a <= .004) return; col = col || it.col;

    else if (it.t !== ' ' && it.t !== '　') CH.text(D, it.x, it.y, it.t, { size: it.s, col: col, a: a, num: it.op, w: it.op ? 400 : 600 });
  }
  /* 式を描く。o：align、a、col（白い字の色をかえる） */
  function EQ(D, cx, cy, str, size, o) {

  }
  function eqW(D, str, size) { return lay(D, str, size).w; }
  function fitEq(D, str, maxW, size) { var w = eqW(D, str, size); return w > maxW ? size * maxW / w : size; }
  /* 式 A が 式 B に変わる（k：0→1）。同じ名前の字は動き、なくなる字は消え、新しい字は出てくる。o.map：{A の名前: B の名前}（ちがう字に移る・重なる） */
  function MORPH(D, cx, cy, A, B, k, size, o) {
    o = o || {}; var PA = put(lay(D, A, size), cx, cy, o.align), PB = put(lay(D, B, size), cx, cy, o.align), map = o.map || {}, src = {}, al = o.a == null ? 1 : o.a;
    var kOut = 1 - CH.smooth(0, .4, k), kMv = CH.ease(CH.clamp((k - .2) / .6, 0, 1)), kIn = CH.smooth(.6, 1, k);
    PA.items.forEach(function (a) { var b = PB.at[map[a.id] || a.id]; if (b) { a.to = b; (src[b.id] = src[b.id] || []).push(a); } });
    function same(a, b) { return a.t === b.t && !a.bar === !b.bar; }
    function mid(a, b, e) { return { x: CH.lerp(a.x, b.x, e), y: CH.lerp(a.y, b.y, e), s: CH.lerp(a.s, b.s, e), t: a.t, op: a.op, bar: a.bar && b.bar ? CH.lerp(a.bar, b.bar, e) : a.bar, col: mix(a.col, b.col, e) }; }
    PA.items.forEach(function (a) {
      var b = a.to; if (!b) { drawIt(D, a, al * kOut); return; }
      var m = mid(a, b, kMv); drawIt(D, m, src[b.id].length === 1 && same(a, b) ? al : al * (1 - kMv));
    });
    PB.items.forEach(function (b) {
      var s = src[b.id]; if (!s) { drawIt(D, b, al * kIn); return; }
      if (s.length === 1 && same(s[0], b)) return;
      var m = mid(s[0], b, kMv); m.t = b.t; m.op = b.op; m.bar = b.bar ? (s[0].bar ? m.bar : b.bar * kMv) : null; drawIt(D, m, al * kMv);
    });
    return { A: PA, B: PB, P: k < .5 ? PA : PB, kMv: kMv };
  }
  /* 式が、list の順に変わっていく（k：0→1）。o：maps（変わるごとの map）、hold（とまっている割合）、maxW（入る幅） */
  function CHAIN(D, cx, cy, list, k, size, o) {
    o = o || {}; var n = list.length - 1;
    if (o.maxW) list.forEach(function (s) { size = Math.min(size, fitEq(D, s, o.maxW, size)); });
    if (n < 1) return { seg: 0, loc: 1, size: size, P: EQ(D, cx, cy, list[0], size, o) };
    var kk = CH.clamp(k, 0, 1) * n, seg = Math.min(n - 1, Math.floor(kk)), loc = CH.clamp((kk - seg) / (1 - (o.hold == null ? .3 : o.hold)), 0, 1);
    var r = MORPH(D, cx, cy, list[seg], list[seg + 1], loc, size, { map: (o.maps || [])[seg], align: o.align, a: o.a });

  }
  /* 右の板書・問い（HTML）：[1/2] はたての分数、^2 は上つき、{y|…} は色 */
  function H(s) { return CH.fr(String(s)).replace(/\^(\d+)/g, '<sup>$1</sup>').replace(/\{([ypbgolw])\|([^{}]*)\}/g, function (m, c, t) { return '<span style="color:' + CC[c] + '">' + t + '</span>'; }).replace(/[×÷]/g, '<span style="font-family:' + NUM.replace(/"/g, "'") + ';font-weight:400">$&</span>'); }

  function cellSize(D, R, fw, nC, texts, base) { var cw = (R.w - R.w * fw) / (nC - 1), z = base; texts.forEach(function (t) { z = Math.min(z, CH.fitSize(D, t, cw * .86, base, { num: true })); }); return z; }
  function fixSteps(st) { st.forEach(function (s) { ['q', 'a', 'sub', 'bh'].forEach(function (k) { if (s[k]) s[k] = H(s[k]); }); if (s.notes) s.notes = s.notes.map(H); if (s.b) (Array.isArray(s.b) ? s.b : [s.b]).forEach(function (b) { b.t = H(b.t); }); }); return st; }
  /* 角の丸い四角（カード・わく） */
  function rbox(D, x0, y0, x1, y1, col, a, o) {
    o = o || {}; var g = D.ctx, r = Math.min(o.r || 10, (y1 - y0) * .3, (x1 - x0) * .3); if (a <= 0) return;
    g.save(); g.globalAlpha = D.ga * a; g.beginPath(); g.moveTo(x0 + r, y0); g.arcTo(x1, y0, x1, y1, r); g.arcTo(x1, y1, x0, y1, r); g.arcTo(x0, y1, x0, y0, r); g.arcTo(x0, y0, x1, y0, r); g.closePath();
    g.fillStyle = o.fill || hexA(col, o.fa == null ? .14 : o.fa); g.fill(); g.strokeStyle = col; g.lineWidth = o.w || 2.2; if (o.dash) g.setLineDash([7, 5]); g.stroke(); g.restore();
  }
  /* 横のかっこ（下向き。up で上向き）。h：ふくらみ */
  function brace(D, x0, x1, y, col, a, up, h) {
    if (a <= 0 || x1 - x0 < 4) return; var g = D.ctx, hh = (h || Math.min(12, (x1 - x0) * .25)) * (up ? -1 : 1), m = (x0 + x1) / 2, r = Math.min(Math.abs(hh), (x1 - x0) / 4);
    g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = col; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath();
    g.moveTo(x0, y); g.quadraticCurveTo(x0, y + hh / 2, x0 + r, y + hh / 2); g.lineTo(m - r, y + hh / 2); g.quadraticCurveTo(m, y + hh / 2, m, y + hh);
    g.quadraticCurveTo(m, y + hh / 2, m + r, y + hh / 2); g.lineTo(x1 - r, y + hh / 2); g.quadraticCurveTo(x1, y + hh / 2, x1, y); g.stroke(); g.restore();
  }
  /* 字の札（きまりの名前など）。返すもの：幅 */
  function chip(D, x, y, txt, col, a, size, al) {
    var s = size || CH.fs(D, .8), g = D.ctx; g.save(); g.font = '600 ' + s + 'px ' + FONT; var w = g.measureText(txt).width + s * 1.1; g.restore();
    var x0 = al === 'left' ? x : al === 'right' ? x - w : x - w / 2;
    rbox(D, x0, y - s * .8, x0 + w, y + s * .8, col, a, { r: s * .8, w: 1.8, fa: .18 }); CH.text(D, x0 + w / 2, y + 1, txt, { size: s, col: col, a: a });

  }
  /* まがった矢印（上にふくらむ。down で下） */
  function arcArrow(D, x0, y0, x1, y1, col, a, h, down) {
    if (a <= 0) return; var g = D.ctx, mx = (x0 + x1) / 2, my = Math.min(y0, y1) + (down ? h : -h);
    g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = col; g.lineWidth = 2.2; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(mx, my, x1, y1); g.stroke(); g.restore();

  }
  function wide(R) { return R.w > R.h * 1.15; }
  /* ======== ここまで共通 ======== */
  /* ---- 数と検算 ---- */
  var ROW = 9, TCH = 4;
  function chairs(n) { var s = TCH; for (var i = 0; i < n; i++) s += ROW; return s; }

  CH.check(chairs(10) === 94 && chairs(50) === 454, 'ことば（a＝10・50）');
  function change(n) { var m = 500; for (var i = 0; i < n; i++) m -= 70; return m; }
  CH.check([1, 2, 3, 5].map(change).join() === '430,360,290,150' && change(6) === 80 && 500 - 70 * 6 === 80, '例題 おつり');
  var KA = [0, 2.5, 12, 30];
  CH.check(KA.map(function (a) { return 9 * a + 4; }).join() === '4,26.5,112,274', '考えよう（図に出す数）');

  /* ---- パンのおつり：500円のテープから 70円ずつ ---- */
  function panTape(D, R, n, o) {
    o = o || {}; var s = CH.fs(D, .95), h = Math.min(R.h * .32, s * 2.4), y = R.y0 + s * 1.5, x0 = R.x0, W = R.w, u = W * 70 / 500, k = n === 'x' ? 4.4 : n, a = o.a == null ? 1 : o.a;

  /* ---- ストロー ---- */
  function straws(D, x0, y0, u, n, o) {

    st(x0, y0, x0, y0 + u, o.first || C.chalk, o.a ? o.a(0) : 1);
    for (var i = 0; i < n; i++) { var a = o.a ? o.a(i) : 1, col = o.col ? o.col(i) : C.chalk, xa = x0 + i * u; st(xa, y0, xa + u, y0, col, a); st(xa + u, y0, xa + u, y0 + u, col, a); st(xa, y0 + u, xa + u, y0 + u, col, a); }
  }
