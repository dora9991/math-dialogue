<script>
/* 文字と式 第7時：文字の部分が同じ項は、なぜまとめられるのだろう（ikkan の lesson_moji_07 と同じ流れ）。

   チャレンジは x＝−3 で、そのまま代入とまとめてから代入の 2通り。
   数値は ikkan のまま（ペンの検算 1本 120円、a＝2、x＝−3）。答えはページの中で計算し直している（CH.check）。 */
(function () {

  /* 図の中の式。書き方：[分子/分母]（たての分数）・^2（指数）・{y|…}（色のまとまり。y 黄・p ピンク・b 青・g 緑・o だいだい・l むらさき・w 白）。
