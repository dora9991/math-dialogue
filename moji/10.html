    var yA = R.y0 + R.h * .3, yB = R.y0 + R.h * .66, a = 5 * (2 * x + 3), b = 2 * (5 * x + 4);
    CH.line(D, X0 + b * unit, yB - 6, X0 + b * unit, yA + h + 6, { col: C.yel, dash: [4, 4], w: 1.6 });
    CH.line(D, X0 + a * unit, yA + h, X0 + a * unit, yB + h, { col: C.yel, dash: [4, 4], w: 1.6, a: .6 });
    CH.fillRect(D, X0 + b * unit, yB + h * .1, X0 + a * unit, yB + h * .9, { fill: ha(C.yel, .25) });
    TX(D, R.cx, R.y1 - s * .5, '5(2x＋3)−2(5x＋4) の値は、テープの長さの差', { size: fit(D, '5(2x＋3)−2(5x＋4) の値は、テープの長さの差', R.w, s * .9), col: 'rgba(242,240,230,.8)' });
  }

  /* ---- チャレンジ：x の部分と、数の部分を見くらべる ---- */
  function chal(D, t) {
    var R = CH.box(D, { l: .04, r: .04, t: .04, b: .04 }), s = CH.fs(D), wide = D.W > D.H * 1.05;
    var A = wide ? CH.rect(R.x0, R.y0, R.x0 + R.w * .6, R.y1) : CH.rect(R.x0, R.y0, R.x1, R.y0 + R.h * .58), B = wide ? CH.rect(R.x0 + R.w * .64, R.y0, R.x1, R.y1) : CH.rect(R.x0, R.y0 + R.h * .62, R.x1, R.y1);
    if (t <= 0) { TX(D, A.cx, A.cy, '3(x＋□)−2(x−5)＝x＋1', { size: fit(D, '3(x＋□)−2(x−5)＝x＋1', A.w, s * 1.4) }); }
    else chain(D, A, ['3(x＋□)−2(x−5)', '＝3x＋3×□−2x＋10', '＝【x】＋【3×□＋10】', '3×□＋10＝1', '3×□＝−9　□＝−3'], sm(0, .85, t), { labs: ['', 'かっこをはずす', '同類項をまとめる', '', ''], last: C.yel, size: Math.min(s * 1.15, A.w / 11) });
    var h = Math.min(s * 2.2, B.h * .2), y1 = B.y0 + B.h * .22, y2 = B.y0 + B.h * .52, k = sm(.45, .65, t);
    if (t > 0) {
      var L1 = crow(D, B.cx, y1, [{ s: 'x', col: POS }, { s: '＋', op: true }, { s: '3×□＋10', col: ONE }], h, { maxW: B.w * .95 });
      var L2 = crow(D, B.cx, y2, [{ s: 'x', col: POS }, { s: '＋', op: true }, { s: '1', col: ONE }], h, { maxW: B.w * .95 });
      TX(D, L1[0].cx, (y1 + y2) / 2, '‖', { size: s * 1.1, col: C.green, a: k });
      TX(D, L1[2].cx, (y1 + y2) / 2, '‖', { size: s * 1.1, col: C.yel, a: k });
      TX(D, B.cx, B.y0 + B.h * .74, '数の部分が等しい', { size: fit(D, '数の部分が等しい', B.w, s), col: C.yel, a: k });
      var ck = '□＝−3 → 3(x−3)−2(x−5)＝x＋1';
      TX(D, B.cx, B.y1 - s * .5, ck, { size: fit(D, ck, B.w, s * .9), col: C.green, a: sm(.9, 1, t) });
    }
  }

        b: { t: '2(x＋4)＋3(x−1)＝2x＋8＋3x−3＝<b>5x＋5</b>', col: C.yel },
        draw: function (D) { q1(D, D.ph ? D.t : 0); } },
      { tag: 'ことば', bh: 'ことば', q: 'かっこの前が − のとき、かっこをはずすと、かっこの中の項は どうなる？', a: 'かっこの中の、すべての項の符号が変わる', sub: '−(3a−4)＝(−1)×(3a−4)＝−3a＋4。かっこをはずしてから、同類項をまとめる', dur: 4,
        b: [{ t: 'a(b＋c)＝ab＋ac（<b>分配法則</b>）でかっこをはずす → <b>同類項</b>をまとめる', col: C.green }, { t: '−(3a−4)＝−3a＋4 … かっこの前が − なら <b>符号が全部変わる</b>', col: C.green }],
