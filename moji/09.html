      for (var j = 0; j < b; j++) tile(D, bx + ((j % PL) * (1 + g) + .5) * u, y + (Math.floor(j / PL) * (1 + g) + .5) * u, '1', u, { a: al });
      return h;
    }
    TX(D, R.cx, R.y0 + s * .7, '6x＋18 を ' + k + 'つの組に分ける', { size: s * 1.05 });
    var h1 = gH(nc), hl = (rx || rc) ? gH(rc) + u * 1.2 + s : 0, tot = k * h1 + (k - 1) * u * .55 + hl, y = R.y0 + s * 2 + Math.max(0, (R.h - s * 2.4 - tot) / 2), w1 = gW(nx, nc);
    for (var i = 0; i < k; i++) { grp(R.cx - w1 / 2, y, nx, nc, 1, C.lav); y += h1 + u * .55; }
    if (rx || rc) {
      var wl = gW(rx, rc); y += u * .6;
      TX(D, R.cx - wl / 2 - u * .6, y + gH(rc) / 2 - u * .1, 'あまり', { size: s * .9, col: C.pink, align: 'right' });
      grp(R.cx - wl / 2, y, rx, rc, .55, C.pink);
      TX(D, R.cx, y + gH(rc) + s * .9, '等しく分けられない', { size: s * .9, col: C.pink });
    }
  }

  /* ---- チャレンジ：−8x＋20 を 4つに分けて、符号を変える ---- */
  var TC = tilesOf(-2, 5);
  CH.check(countT(TC).x * 4 === -8 && countT(TC).c * 4 === 20, 'タイルの数（−8x＋20 を 4組）');
  function chal(D, t) {

    if (t > 0) chain(D, A, ['① (−8x＋20)÷(−4)', '＝(−8x＋20)×【(−[1/4])】', '＝2x−5', '② 3(2x−5)＝6x−15'], t, { labs: ['', '逆数をかける', '', ''], last: C.yel, size: Math.min(s * 1.15, A.w / 9.5) });
    else TX(D, A.cx, A.cy, '？×(−4)＝−8x＋20', { size: fit(D, '？×(−4)＝−8x＋20', A.w, s * 1.4) });
    groups(D, B, TC, 4, t, { flip: true, cap: '−8x＋20', foot: '4つに分けた 1つ分の符号を変える → 2x−5' });
  }

        b: [{ t: 'a(b＋c)＝ab＋ac … <b>分配法則</b>', col: C.green }, { t: '数でわる ＝ その数の <b>逆数</b> をかける（[3/4] → [4/3]、−5 → −[1/5]）', col: C.green }],

        b: { t: '（1）4x×(−3)＝<b>−12x</b>　（2）20a÷(−5)＝<b>−4a</b>', col: C.pink },
