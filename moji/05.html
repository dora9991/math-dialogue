<script>
/* 文字と式 第5時：式が表しているものを、読み取って当てよう（ikkan の lesson_moji_05 と同じ流れ）。

   チャレンジは、花だんのまわりの道（全体の長方形 → 花だんをとりのぞく）。
   数値は ikkan のまま（焼きそば・ジュースの検算は a＝300、b＝120、花だん a＝4、b＝3）。長方形の x＝4・y＝7、点の n＝4 は自作。答えはページの中で計算し直している（CH.check）。 */
(function () {
