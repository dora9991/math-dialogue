<script>
/* js/notes.js */
/* バスケ得点クリップ — 動画のコメント・スタンプ（その場面から数秒、動画の中に出す。書き出す動画にも入れる）
   DOM に依存しない部分（データの形・タグ・さがす・リンク）と、Canvas に描く部分（画面の上にも、書き出す動画にも同じ絵を描く）。

   コメント：{ id: 'n1', t: 動画の秒, dur: 出す長さ（秒。ふつう 5）, text: '文', stamps: ['👍', …], tags: ['ヘルプ', …], at: 書いた時刻 }
   コメント帳（このブラウザの中に、動画ごとにためておく）：{ [動画の見分け]: { name: 動画のファイル名, at, notes: [コメント…] } } */
(function (root) {
  'use strict';
  const BS = root.BS = root.BS || {};

  /* スタンプ（押すと、そのコメントに付く。いくつでも） */
  const STAMPS = [
    { s: '👍', l: 'いいね' }, { s: '👏', l: 'ナイス' }, { s: '🔥', l: 'すごい' }, { s: '💯', l: '満点' },
    { s: '💪', l: 'がんばった' }, { s: '⭐', l: 'お手本' }, { s: '❗', l: 'ここ大事' }, { s: '❓', l: 'しつもん' },
    { s: '😮', l: 'おどろき' }, { s: '🙆', l: 'OK' }, { s: '🙅', l: 'NG' }, { s: '🏀', l: 'バスケ' }
  ];
  /* よく使うタグ（ほかのことばも、文の中に「#ことば」と書けばタグになる） */
  const TAGS = ['ヘルプ', 'リバウンド', 'ボックスアウト', 'スクリーン', 'ドライブ', 'パス', 'シュート', 'ディフェンス', '速攻', '声かけ', 'ポジション', 'ナイスプレー'];
  const DUR = 5;                 // 動画の中に出す長さ（秒。ふつう）
  const STAMP = 112, STAMP_ALONE = 150;      // スタンプの大きさ（1280×720 のときの画素。コメントと一緒・スタンプだけ）
  const DURS = [3, 5, 8];
  const MAX_TEXT = 60;

  /* 文の中の「#ことば」「＃ことば」をタグにする（記号・空白まで） */
  function parseTags(text) {
    const out = [];
    String(text || '').replace(/[#＃]([^\s#＃、。，．,.!！?？「」『』()（）\[\]]{1,20})/g, (m, w) => { if (!out.includes(w)) out.push(w); return m; });
    return out;
  }
  const cleanTag = (w) => String(w || '').replace(/^[#＃]+/, '').trim().slice(0, 20);
  /* 形をそろえる（形の合わないものは null） */
  function clean(n) {
    if (!n || typeof n !== 'object' || !isFinite(n.t) || n.t < 0) return null;
    const text = String(n.text || '').trim().slice(0, MAX_TEXT);
    const stamps = (Array.isArray(n.stamps) ? n.stamps : []).filter((s) => STAMPS.some((x) => x.s === s)).slice(0, 6);
    const tags = [];
    (Array.isArray(n.tags) ? n.tags : []).concat(parseTags(text)).map(cleanTag).forEach((w) => { if (w && !tags.includes(w)) tags.push(w); });
    if (!text.trim() && !stamps.length) return null;
    const dur = isFinite(n.dur) && n.dur > 0 ? Math.min(30, +n.dur) : DUR;
    return { id: String(n.id || '').slice(0, 20) || 'n' + Math.round(n.t * 100), t: Math.round(n.t * 100) / 100, dur, text, stamps, tags: tags.slice(0, 8), at: isFinite(n.at) ? +n.at : 0 };
  }
  const cleanAll = (list) => (Array.isArray(list) ? list : []).map(clean).filter(Boolean).sort((a, b) => a.t - b.t);
  /* いま（動画の t 秒）出ているコメント（古い順） */
  const activeAt = (notes, t) => (notes || []).filter((n) => n.t <= t + 1e-6 && t < n.t + n.dur);
  const nextId = (notes) => 'n' + ((notes || []).reduce((m, n) => Math.max(m, Number(String(n.id).slice(1)) || 0), 0) + 1);
  const stampLabel = (s) => (STAMPS.find((x) => x.s === s) || {}).l || '';

  /* さがすための形（全角・半角、カタカナ・ひらがな、大文字・小文字をそろえる） */
  function norm(s) {
    return String(s || '').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, ' ').trim();
  }
  /* コメント帳からさがす：q（ことば。文・タグ・スタンプの呼び名にふくまれる）・tag（そのタグが付いたもの）。新しい動画 → 時刻の順 */
  function search(book, q, tag) {
    const nq = norm(q), out = [];
    Object.keys(book || {}).forEach((key) => {
      const v = book[key] || {};
      cleanAll(v.notes).forEach((n) => {
        if (tag && !n.tags.includes(tag)) return;
        if (nq) {
          const hay = norm([n.text, n.tags.join(' '), n.stamps.map(stampLabel).join(' ')].join(' '));
          if (!nq.split(' ').every((w) => hay.includes(w))) return;
        }
        out.push(Object.assign({ key, name: v.name || '', vat: v.at || 0 }, n));
      });
    });
    return out.sort((a, b) => (b.vat - a.vat) || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0) || (a.t - b.t));
  }
  /* コメント帳のタグと数（多い順） */
  function tagCounts(book) {
    const m = {};
    Object.keys(book || {}).forEach((k) => cleanAll((book[k] || {}).notes).forEach((n) => n.tags.forEach((w) => { m[w] = (m[w] || 0) + 1; })));
    return Object.keys(m).map((w) => ({ tag: w, n: m[w] })).sort((a, b) => b.n - a.n || (a.tag < b.tag ? -1 : 1));
  }
  /* 調べるリンク：YouTube の検索・バスケ・グロウ（バスケ育成アプリ）のずかん */
  const GROW = 'https://dora9991.github.io/math-dialogue/basket-coach/';
  const youtubeUrl = (w) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent('バスケ ' + String(w || '').trim());
  const growUrl = (w) => GROW + '#q/' + encodeURIComponent(String(w || '').trim());
  /* 文字で書き出す（LINE などに貼る）：「1:23 👍 ヘルプが遅い #ヘルプ」 */
  function toText(notes, fmt, title) {
    const lines = cleanAll(notes).map((n) => `${fmt(n.t)} ${n.stamps.join('')}${n.stamps.length && n.text ? ' ' : ''}${n.text}${n.tags.length ? '  ' + n.tags.map((w) => '#' + w).join(' ') : ''}`);
    return (title ? title + '\n' : '') + lines.join('\n');
  }
  /* コメントの場面（書き出し・続けて見る）：コメントの 3 秒前から、出し終わって 1 秒後まで。重なるものは1つに */
  function segments(notes, duration) {
    const end = duration > 0 ? duration : Infinity, out = [];
    cleanAll(notes).forEach((n) => {
      const s = { t0: Math.max(0, n.t - 3), t1: Math.min(end, n.t + n.dur + 1), ids: [n.id], at: n.t };
      const prev = out[out.length - 1];
      if (prev && s.t0 <= prev.t1) { prev.t1 = Math.max(prev.t1, s.t1); prev.ids.push(n.id); } else out.push(s);
    });
    return out;
  }

  /* ---------- 描く（Canvas）----------
     画面の下のまん中に、スタンプ（大きく。出たときにポンと大きくなる）と、コメントの吹き出し（タグは小さく下に）。
     W×H：描く絵の大きさ（書き出す動画・画面の映像の大きさ）。x0・y0：映像の左上（画面では、映像のまわりの黒い帯をのぞく）。t：動画の秒 */
  const FONT = '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif';
  const EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", ' + FONT;
  function wrap(ctx, text, maxW) {
    const lines = [];
    let cur = '';
    Array.from(text).forEach((ch) => {
      if (ch === '\n') { lines.push(cur); cur = ''; return; }
      if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; } else cur += ch;
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  /* k：文字・スタンプを大きくする倍率（ふつう 1。スマホの小さな画面で見るときに大きく） */
  function draw(ctx, W, H, notes, t, x0, y0, k) {
    const act = activeAt(notes, t).slice(-3);
    if (!act.length) return 0;
    x0 = x0 || 0; y0 = y0 || 0;
    const s = Math.min(W / 1280, H / 720) * (k > 0 ? k : 1);
    let bottom = y0 + H - 34 * s;
    // 新しいものほど下に（下から順に積む）

          for (; i < count; i++) dts[i] = t; }

        cts.set(dts);
        if (sb.ctts) {

          for (let e = 0; e < n && i < count; e++, p += 8) { const c = u32(u8, p), o = i32(u8, p + 4); for (let k = 0; k < c && i < count; k++) cts[i++] += o; }

<script>
/* js/clip/export.js */
/* basket-clips/js/export.js を写したもの（切り出しを、このアプリの中でするため）。直すときは両方に */
/* バスケ得点クリップ — 動画の書き出し
   区間（クリップ）を順に再生しながら Canvas に描き、MediaRecorder で録画して1本の動画にする。
   実時間で録るので、書き出しにかかる時間 ≒ できる動画の長さ（5秒 × 本数 ＋ 最初と最後の数秒）。
   「バスケ分析スタジオ」の export.js をもとに、表示を小さくしたもの（音声の扱い・再生が始まらないときの失敗の出し方は同じ）。 */
(function (root) {
  'use strict';
  const BS = root.BS;

  function pickMime() {
    if (typeof MediaRecorder === 'undefined') return null;
    const list = [
      ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'mp4'],
      ['video/mp4;codecs=avc1', 'mp4'],
      ['video/mp4', 'mp4'],
      ['video/webm;codecs=vp9,opus', 'webm'],
      ['video/webm;codecs=vp8,opus', 'webm'],
      ['video/webm', 'webm']

    for (const [m, ext] of list) { try { if (MediaRecorder.isTypeSupported(m)) return { mime: m, ext }; } catch (e) { /* 次 */ } }
    return null;
  }

  function sizeFor(media) {
    let w = media.width || 1280, h = media.height || 720;
    if (w > 1280) { h = Math.round(h * 1280 / w); w = 1280; }
    return { w: w - (w % 2), h: h - (h % 2) };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

  const FONT = '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif';

  /* 左上の小さな札：「入れた 3 / 12」と時刻（チームの色の帯つき） */
  function drawCaption(ctx, W, H, clip, opts) {
    const s = W / 1280;
    const title = clip.label || '', sub = clip.sub || '';
    ctx.save();
    ctx.font = `bold ${26 * s}px ${FONT}`;
    const w1 = ctx.measureText(title).width;
    ctx.font = `${19 * s}px ${FONT}`;
    const w2 = ctx.measureText(sub).width;
    const bw = Math.max(w1, w2) + 52 * s, bh = sub ? 74 * s : 48 * s, bx = 24 * s, by = 22 * s;
    ctx.fillStyle = 'rgba(8,12,20,0.74)';
    roundRect(ctx, bx, by, bw, bh, 10 * s); ctx.fill();
    ctx.fillStyle = clip.color || opts.accent || '#3b82f6';
    ctx.fillRect(bx, by, 9 * s, bh);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${26 * s}px ${FONT}`;
    ctx.fillText(title, bx + 26 * s, by + (sub ? 25 : 24) * s);
    if (sub) { ctx.font = `${19 * s}px ${FONT}`; ctx.fillStyle = '#c9d4e6'; ctx.fillText(sub, bx + 26 * s, by + 53 * s); }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((ln, i) => {
      ctx.fillStyle = i === 0 ? '#ffffff' : '#c9d4e6';
      ctx.font = `${i === 0 ? 'bold ' : ''}${(i === 0 ? 54 : 30) * s}px ${FONT}`;
      ctx.fillText(ln, W / 2, H / 2 - 50 * s + i * 60 * s);

    let done = 0;
    const frame = () => new Promise((res) => requestAnimationFrame(res));
    const aborted = () => signal && signal.aborted;
    const report = (label) => onProgress && onProgress(Math.min(1, done / Math.max(0.1, total)), label);

    media.pause();
    rec.start(250);
    try {
      let t0 = performance.now();
      if (cards) {
        while (performance.now() - t0 < TITLE * 1000 && !aborted()) {
          drawCard(ctx, W, H, opts.title || ['得点シーン'], opts);
          await frame();
          done = (performance.now() - t0) / 1000; report('はじめの画面');
        }
      }
      let acc = 0;
      for (let i = 0; i < clips.length && !aborted(); i++) {
        const c = clips[i];
        const len = c.t1 - c.t0;
        // 暗転中にシーク
        drawFade(ctx, W, H, 1);
        await media.seek(c.t0);
        await media.play();
        t0 = performance.now();
        while (!aborted()) {
          const el = (performance.now() - t0) / 1000;
          const vt = media.time;
          if (vt >= c.t1 || el > len + 3 || media.el.ended) break;
          // 再生が始まらない（ブラウザに止められた等）まま録ると、止まった絵の動画になってしまう → はっきり失敗にする
          if (el > 2.5 && vt - c.t0 < 0.05) throw new Error('動画の再生が始まりませんでした。映像の ▶ で再生できることを確かめてから、もう一度書き出してください');
          ctx.drawImage(media.el, 0, 0, W, H);
          const k = vt - c.t0, left = c.t1 - vt;
          if (k < 0.25) drawFade(ctx, W, H, 1 - k / 0.25);
          if (left < 0.25) drawFade(ctx, W, H, 1 - left / 0.25);
          if (opts.captions !== false) drawCaption(ctx, W, H, c, opts);
          if (opts.notes && opts.notes.length && BS.notes) BS.notes.draw(ctx, W, H, opts.notes, vt);      // コメント・スタンプ（その時刻から数秒）
          done = TITLE + acc + Math.min(Math.max(0, k), len);
          report(`${i + 1} / ${clips.length}`);
          await frame();
        }
        media.pause();
        acc += len;
      }
      if (cards) {
        t0 = performance.now();
        while (performance.now() - t0 < END * 1000 && !aborted()) {
          drawCard(ctx, W, H, opts.end || ['おわり'], opts);
          await frame();
          done = TITLE + acc + (performance.now() - t0) / 1000; report('おわりの画面');

      rec.stop();

  }

  BS.exportReel = exportReel;
  BS.exportSupport = pickMime;

<script>
/* js/store.js */
/* バスケ タップ記録 — 保存（このブラウザの中だけ。どこにも送らない）
   ・試合：1つ記録するたびに、すぐ保存する（途中で画面を閉じても、開き直せば続きから）
   ・チーム：名前・色・名簿を覚えておき、次の試合で選べる（自分のチームは毎回同じことが多いので）
   ・設定：名前の表示・「？」の行・音・画面の明るさ
   キーは「btap:」で始まる。バスケ得点クリップ（同じサイトの別のページ）からも、この試合を読み込める。 */
(function (root) {
  'use strict';
  const BT = root.BT;
  const K = { games: 'btap:games', game: 'btap:game:', current: 'btap:current', teams: 'btap:teams', prefs: 'btap:prefs' };
  const KEEP = 60;          // 覚えておく試合の数（古いものから消す。書き出したファイルは残る）

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

  /* ---------- 試合 ---------- */
  function games() { return (readJSON(K.games) || []).filter((g) => g && g.id).sort((a, b) => (b.startedAt || b.at || 0) - (a.startedAt || a.at || 0)); }
  function loadGame(id) {
    const g = readJSON(K.game + id);
    if (!g || g.format !== BT.FORMAT || !Array.isArray(g.events)) return null;
    if (!g.seq) g.seq = g.events.reduce((m, e) => Math.max(m, Number(String(e.id).slice(1)) || 0), 0);
    return g;
  }
  /* 保存できたら true（入りきらないときは、古い試合を消してもう一度） */
  function saveGame(game) {
    if (!game || !game.id) return false;
    const list = games().filter((x) => x.id !== game.id);
    list.unshift(BT.summary(game));
    let ok = writeJSON(K.game + game.id, game);
    if (!ok || list.length > KEEP) {
      const old = list.slice().sort((a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0)).filter((x) => x.id !== game.id);
      const n = ok ? list.length - KEEP : Math.max(5, list.length - KEEP);
      old.slice(0, n).forEach((x) => { remove(K.game + x.id); const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list.splice(i, 1); });
      if (!ok) ok = writeJSON(K.game + game.id, game);
    }
    writeJSON(K.games, list);
    return ok;
  }
  function deleteGame(id) {
    remove(K.game + id);
    writeJSON(K.games, games().filter((x) => x.id !== id));
    if (current() === id) setCurrent(null);
  }
  function current() { const s = ls(); try { return s ? s.getItem(K.current) : null; } catch (e) { return null; } }
  function setCurrent(id) { const s = ls(); if (!s) return; try { if (id) s.setItem(K.current, id); else s.removeItem(K.current); } catch (e) { /* 無視 */ } }

  /* ---------- チーム（名簿） ---------- */
  function teams() { return (readJSON(K.teams) || []).filter((t) => t && t.id).sort((a, b) => (b.usedAt || 0) - (a.usedAt || 0)); }
  /* 同じ名前のチームは上書き。名前のないチームは保存しない */
  function saveTeam(team, mine) {
    const name = (team.name || '').trim();
    if (!name) return null;
    const list = teams();
    let t = list.find((x) => x.name === name);
    if (!t) { t = { id: BT.uid('t') }; list.push(t); }
    Object.assign(t, { name, color: team.color, colorName: team.colorName, players: BT.cleanPlayers(team.players), usedAt: Date.now() });
    if (mine) { list.forEach((x) => { delete x.mine; }); t.mine = true; }
    writeJSON(K.teams, list.slice(0, 40));
    return t;
  }
  function deleteTeam(id) { writeJSON(K.teams, teams().filter((t) => t.id !== id)); }
  function myTeam() { return teams().find((t) => t.mine) || null; }

  /* ---------- 設定 ---------- */
  /* names：選手の名前も出す / unknown：「？」（だれか分からないとき）の行を出す / sound：タップ音 / theme：画面の色
     camQuality：撮影の画質（'720' | '1080'）/ camAudio：録画に音も入れる / camOrient：撮る向き（'land' 横 | 'port' 縦）
     uiRot：アプリごと横向きにする（90・270。画面の向きのロックをしたまま、横に倒して使う）/ camRot・camRotF：映像の向きの手直し（ふつう・アプリごと横向きのとき）
     camWipe：記録の画面に映すカメラの映像（ワイプ）の大きさ（'s' 小：上の帯の中 | 'm' 中 | 'l' 大 | 'x' 特大）
     btnMiss・btnFoul：選手の行に、シュートの失敗（2P・3P・FT の「×」）・ファウルのボタンも出す（ふだんは出さない）
     btnAst・btnStl：アシスト・スティールのボタンも出す / rebSplit：リバを「Oリバ」「Dリバ」の2つに分ける（どれも、ふだんは出さない） */
  function prefs() {
    const p = Object.assign({ sound: false, theme: 'auto', names: true, unknown: true, camQuality: '720', camAudio: true, camOrient: 'land', uiRot: 0, camRot: 0, camRotF: null, camWipe: 'm', btnMiss: false, btnFoul: false, btnAst: false, btnStl: false, rebSplit: false }, readJSON(K.prefs) || {});
    delete p.actions;        // 前の版の「ボタンの組み合わせ」（いまは、選手ごとのボタンに決まっている）
    return p;
  }
  function savePrefs(p) { return writeJSON(K.prefs, p); }

  /* 消されにくくする（Safari などは、しばらく開かないサイトの保存を消すことがある。できる環境だけ） */
  function persist() {
    try { if (root.navigator && navigator.storage && navigator.storage.persist) return navigator.storage.persist().catch(() => false); } catch (e) { /* 無視 */ }
    return Promise.resolve(false);
  }

  BT.store = { games, loadGame, saveGame, deleteGame, current, setCurrent, teams, saveTeam, deleteTeam, myTeam, prefs, savePrefs, persist, KEYS: K };

<script>
/* js/ui.js */
/* バスケ タップ記録 — 画面の部品（要素づくり・お知らせ・下から出る小窓・振動と音・保存と共有） */
(function (root) {
  'use strict';
  const BT = root.BT;

  /* h('div', { class: 'x', onclick: fn }, 子要素…) */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) el.style.setProperty(p, v[p]); else el.style[p] = v[p]; } }
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const $ = (sel, rootEl) => (rootEl || document).querySelector(sel);
  const $$ = (sel, rootEl) => Array.from((rootEl || document).querySelectorAll(sel));

  /* お知らせ（画面の下に数秒）。action：{ label, onClick } でボタンを1つ付けられる */
  function toast(text, kind, ms, action) {
    const box = $('#toasts');
    if (!box) return null;
    const el = h('div', { class: 'toast ' + (kind || ''), role: 'status' }, h('span', null, text));
    if (action) el.appendChild(h('button', { class: 'tbtn', onclick: () => { el.remove(); action.onClick(); } }, action.label));
    box.appendChild(el);
    while (box.children.length > 2) box.firstChild.remove();
    setTimeout(() => el.remove(), ms || 2600);
    return el;
  }

  /* 下から出る小窓（タブレットでは真ん中）。同時に1つだけ。
     opts: { title, body（要素）, foot（要素の配列）, onClose, wide, cls } → { close, body, el } */
  let current = null;
  function sheet(opts) {
    closeSheet(true);
    const wrap = $('#sheet');
    const card = h('div', { class: 'sheet-card' + (opts.wide ? ' wide' : '') + (opts.cls ? ' ' + opts.cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '' });
    const close = () => { if (current && current.card === card) closeSheet(); };
    card.appendChild(h('header', null, h('b', null, opts.title || ''), h('button', { class: 'x', 'aria-label': '閉じる', onclick: close }, '×')));
    const body = h('div', { class: 'sheet-body' });
    if (opts.body) body.appendChild(opts.body);
    card.appendChild(body);
    if (opts.foot && opts.foot.length) card.appendChild(h('div', { class: 'sheet-foot' }, opts.foot));
    wrap.innerHTML = '';
    wrap.appendChild(card);
    wrap.hidden = false;
    wrap.onclick = (e) => { if (e.target === wrap) close(); };
    current = { card, onClose: opts.onClose };
    return { close, body, el: card };
  }
  function closeSheet(silent) {
    const wrap = $('#sheet');
    if (!current || !wrap) return;
    const c = current;
    current = null;
    wrap.hidden = true; wrap.innerHTML = '';
    if (!silent && c.onClose) c.onClose();
    else if (silent && c.onClose) c.onClose(true);
  }
  const sheetOpen = () => !!current;

  /* 確かめる小窓：ok を押したら onOk */
  function confirm(title, text, okLabel, onOk, danger) {
    const s = sheet({
      title, body: h('p', { class: 'confirm-text' }, text),
      foot: [h('button', { class: 'btn', onclick: () => s.close() }, 'やめる'), h('button', { class: 'btn ' + (danger ? 'danger-fill' : 'primary'), onclick: () => { s.close(); onOk(); } }, okLabel)]
    });
    return s;
  }

  /* ---------- 手ごたえ（振動・音） ---------- */
  /* 振動：Android は vibrate。iPhone（iOS 18 から）は、スイッチ（<input type="checkbox" switch>）を押したときの軽い振動を使う */
  let coarse = null;
  function haptic() {
    try { if (root.navigator && typeof navigator.vibrate === 'function') { navigator.vibrate(12); return; } } catch (e) { /* 次へ */ }
    try {
      if (coarse == null) coarse = !!(root.matchMedia && matchMedia('(pointer: coarse)').matches);
      if (!coarse) return;
      const lab = document.createElement('label');
      lab.setAttribute('aria-hidden', 'true');
      lab.style.display = 'none';
      const inp = document.createElement('input');
      inp.type = 'checkbox'; inp.setAttribute('switch', '');
      lab.appendChild(inp);
      document.head.appendChild(lab);
      lab.click();
      lab.remove();
    } catch (e) { /* 振動がなくても使える */ }
  }
  let actx = null;
  function beep(freq, ms) {
    try {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq || 880;
      const t = actx.currentTime, d = (ms || 60) / 1000;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) { /* 音がなくても使える */ }
  }

  /* ---------- 画面を消さない（記録の途中で、自動ロックで画面が消えないように） ---------- */
  let lock = null, want = false;
  const wakeSupported = () => !!(root.navigator && navigator.wakeLock && navigator.wakeLock.request);
  async function keepAwake(on) {
    want = !!on;
    if (!wakeSupported()) return false;
    if (on && !lock && !document.hidden) {
      try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch (e) { lock = null; }
    } else if (!on && lock) { try { await lock.release(); } catch (e) { /* 無視 */ } lock = null; }
    return !!lock;
  }
  if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { if (!document.hidden && want && !lock) keepAwake(true); });
  const awake = () => !!lock;

  /* ---------- 保存（ダウンロード）・共有 ---------- */
  function download(name, blob) {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }
  /* スマホでは「共有」（AirDrop・ファイルに保存・LINE など）、できなければダウンロード。戻り値 'shared' | 'downloaded' | 'cancelled' */
  async function shareOrDownload(name, blob, preferShare) {
    try {
      if (preferShare && root.navigator && navigator.canShare && typeof File !== 'undefined') {
        const file = new File([blob], name, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          return 'shared';
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
      /* 共有できないときはダウンロードへ */
    }
    download(name, blob);
    return 'downloaded';
  }
  const canShareFiles = () => { try { return !!(root.navigator && navigator.canShare && typeof File !== 'undefined' && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; } };
  /* ファイルを1つ選んでもらって、文字として読む */
  function pickText(accept) {
    return new Promise((resolve) => {
      const inp = h('input', { type: 'file', accept: accept || '.json,application/json', style: { display: 'none' } });
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        inp.remove();
        if (!f) { resolve(null); return; }
        const r = new FileReader();
        r.onload = () => resolve({ name: f.name, text: String(r.result || '') });
        r.onerror = () => resolve(null);
        r.readAsText(f);
      });
      document.body.appendChild(inp);
      inp.click();
    });
  }

  BT.ui = { h, $, $$, toast, sheet, closeSheet, sheetOpen, confirm, haptic, beep, keepAwake, awake, wakeSupported, download, shareOrDownload, canShareFiles, pickText };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/cloud.js */
/* バスケ タップ記録 — クラウドに残す（Supabase）
   試合の記録を、この端末（ブラウザの中）と、クラウドの両方に残す。
   ・ログインはない。端末ごとに「合言葉」（16 文字）を作り、それで読み書きする（サーバーには合言葉のハッシュだけが残る）
   ・ほかの端末で同じ合言葉を入れると、同じ記録が見える（試合はスマホで記録して、パソコンで動画から切り出す など）
   ・電波がなくても記録は止めない。送れなかった試合は「送る待ち」に残し、次に開いたとき・つながったときに送る
   ・記録の途中は、数秒ごとにまとめて送る（1つ押すたびには送らない）。試合を終えたときは、すぐ送る
   サーバー側：public.btap_games と btap_put・btap_list・btap_get・btap_del（Supabase の math-labo-second。README の「クラウド」） */
(function (root) {
  'use strict';
  const BT = root.BT;
  const URL_ = 'https://mtzhbiadzqjhvhzzdsbn.supabase.co';
  const ANON = 'sb_publishable_mq8nUqxVfGtnNHp5UCUtCA_9-x1xn7E';
  const K = { key: 'btap:cloudkey', queue: 'btap:cloudq', done: 'btap:cloudok' };
  const ABC = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';      // まぎらわしい文字（0 O 1 I L）は使わない
  const LIVE_GAP = 8000;     // 記録の途中は、8 秒に1回まで

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return; try { s.setItem(k, JSON.stringify(v)); } catch (e) { /* いっぱい */ } }

  const listeners = new Set();
  const state = { busy: false, lastError: null, timer: 0, online: true };
  function emit() { listeners.forEach((fn) => { try { fn(); } catch (e) { /* 無視 */ } }); }

  /* ---------- 合言葉 ---------- */
  function newKey() {
    const a = new Uint8Array(16);
    try { root.crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.from(a, (b) => ABC[b % ABC.length]).join('');
  }
  /* 入れられた合言葉をそろえる（小文字・空白・「-」を許す）。使えなければ null */
  function normKey(s) {
    const k = String(s || '').toUpperCase().replace(/[\s\-ー－_]/g, '');
    return /^[2-9A-HJKMNP-Z]{16}$/.test(k) ? k : null;
  }
  function key() {
    const s = ls();
    let k = null;
    try { k = s ? s.getItem(K.key) : null; } catch (e) { k = null; }
    if (!normKey(k)) { k = newKey(); try { if (s) s.setItem(K.key, k); } catch (e) { /* 無視 */ } }
    return k;
  }
  const showKey = (k) => (k || key()).replace(/(.{4})(?=.)/g, '$1-');
  /* ほかの端末の合言葉に切りかえる（この端末の記録は、そのまま残る。新しい合言葉の側にも送る） */
  function setKey(input) {
    const k = normKey(input);
    if (!k) return false;
    const s = ls();
    try { if (s) s.setItem(K.key, k); } catch (e) { return false; }
    // この端末の試合を、新しい合言葉の側にも送る
    writeJSON(K.done, {});
    const q = {};
    BT.store.games().forEach((g) => { q[g.id] = Date.now(); });
    writeJSON(K.queue, q);
    emit();
    flush();
    return true;
  }

  /* ---------- 通信（Supabase の RPC） ---------- */
  async function rpc(name, args) {
    if (typeof fetch !== 'function') throw new Error('offline');
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 15000);
    try {
      const r = await fetch(`${URL_}/rest/v1/rpc/${name}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
        body: JSON.stringify(args),
        signal: ctrl ? ctrl.signal : undefined
      });
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      if (j && j.error) throw new Error(j.error);
      state.online = true;
      return j;
    } catch (e) {
      state.online = false;
      throw e;
    } finally { clearTimeout(timer); }
  }

  /* ---------- 送る ---------- */
  const enabled = () => BT.store.prefs().cloud !== false && typeof fetch === 'function';
  const queue = () => readJSON(K.queue) || {};
  const done = () => readJSON(K.done) || {};
  const isDemo = (g) => !!(g && g.demo);
  /* 試合が変わったら呼ぶ。now：すぐ送る（試合を終えた・閉じる前など）。ふだんは数秒まとめて */
  function push(game, now) {
    if (!game || !game.id || isDemo(game)) return;
    const q = queue();
    q[game.id] = game.updatedAt || Date.now();
    writeJSON(K.queue, q);
    emit();
    if (!enabled()) return;
    clearTimeout(state.timer);
    const live = game.startedAt && !game.endedAt;
    state.timer = setTimeout(flush, now ? 0 : live ? LIVE_GAP : 1500);
  }
  async function flush() {
    clearTimeout(state.timer);
    if (!enabled() || state.busy) return;
    const q = queue();
    const ids = Object.keys(q);
    if (!ids.length) return;
    state.busy = true;
    emit();
    let failed = false;
    for (const id of ids) {
      const g = BT.store.loadGame(id);
      const at = q[id];
      if (!g || isDemo(g)) { const q2 = queue(); delete q2[id]; writeJSON(K.queue, q2); continue; }
      try {
        const sum = BT.summary(g);
        await rpc('btap_put', { p_key: key(), p_id: id, p_data: g, p_summary: sum, p_at: Math.round(g.updatedAt || at || Date.now()) });
        const q2 = queue();
        if (q2[id] === at) delete q2[id];          // （送っている間に、また変わったものは残す）
        writeJSON(K.queue, q2);
        const d = done(); d[id] = Date.now(); writeJSON(K.done, d);
        state.lastError = null;
      } catch (e) {
        state.lastError = String(e && e.message || e);
        failed = true;
        break;
      }
    }
    state.busy = false;
    emit();
    // 送れなかったら、少しあとでもう一度（記録は、この端末には残っている）
    if (failed) { clearTimeout(state.timer); state.timer = setTimeout(flush, 30000); }
    else if (Object.keys(queue()).length) { clearTimeout(state.timer); state.timer = setTimeout(flush, 500); }
  }
  /* その試合の、クラウドの状態：'off'（クラウドを使わない）| 'demo' | 'wait'（送る待ち）| 'ok'（送った） */
  function status(id) {
    if (!enabled()) return { s: 'off' };
    if (queue()[id]) return { s: 'wait', err: state.lastError, busy: state.busy };
    const at = done()[id];
    return at ? { s: 'ok', at } : { s: 'wait' };
  }
  const pending = () => Object.keys(queue()).length;

  /* ---------- 読む ---------- */
  async function list() {
    const j = await rpc('btap_list', { p_key: key() });
    return (j && j.games) || [];
  }
  async function get(id) {
    const j = await rpc('btap_get', { p_key: key(), p_id: id });
    const g = j && j.data;
    if (!g || g.format !== BT.FORMAT || !Array.isArray(g.events) || !Array.isArray(g.teams)) return null;
    return g;
  }
  async function del(id) {
    const q = queue(); delete q[id]; writeJSON(K.queue, q);
    const d = done(); delete d[id]; writeJSON(K.done, d);
    if (!enabled()) return;
    try { await rpc('btap_del', { p_key: key(), p_id: id }); } catch (e) { /* 消せなくても、この端末からは消えている */ }
  }

  function on(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  if (root.addEventListener) {
    root.addEventListener('online', () => flush());
    // 画面を閉じる・ほかのアプリに切りかえるときに、送り残しを送る
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  }

  BT.cloud = { key, showKey, setKey, normKey, newKey, push, flush, status, pending, list, get, del, on, enabled, state, KEYS: K };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/fmp4.js */
/* バスケ タップ記録 — 細切れの MP4（fragmented MP4）を、ふつうの MP4 に組み直す
   ブラウザの録画（MediaRecorder）は、少しずつ書き出せる「細切れの MP4」（moof と mdat のくり返し）を作る。
   そのままでも再生はできるが、長い動画では、先のほうへ飛ぶ（シーク）のが遅い・写真アプリに入らない、などがある。
   ここでは、細切れの目次（moof）を読んで、ふつうの MP4（moov に全部の目次・mdat に中身）を組み立てる。
     ・中身（映像と音のデータ）は読み込まない。元の Blob の「どこからどこまで」を並べた Blob を作るだけなので、
       1時間（1GB 以上）の動画でもメモリをほとんど使わない（読むのは目次の部分だけ）
     ・録画の途中でページが閉じた（最後が切れている）ファイルでも、そろっているところまでで組み立てる
     ・中身の形式（H.264・VP9・AAC・Opus など）には、さわらない（stsd をそのまま写す）
   DOM 非依存（node のテストからも読み込める。Blob の slice / arrayBuffer だけを使う）。 */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};

  const u32 = (dv, p) => dv.getUint32(p);
  const i32 = (dv, p) => dv.getInt32(p);
  const u64 = (dv, p) => dv.getUint32(p) * 4294967296 + dv.getUint32(p + 4);
  const four = (dv, p) => String.fromCharCode(dv.getUint8(p), dv.getUint8(p + 1), dv.getUint8(p + 2), dv.getUint8(p + 3));
  async function read(blob, start, end) { return new DataView(await blob.slice(start, end).arrayBuffer()); }

  /* dv の [p, end) にある箱の並び */
  function boxes(dv, p, end) {
    const out = [];
    while (p + 8 <= end) {
      let size = u32(dv, p), head = 8;
      const type = four(dv, p + 4);
      if (size === 1) { if (p + 16 > end) break; size = u64(dv, p + 8); head = 16; } else if (size === 0) size = end - p;
      if (size < head || p + size > end) break;
      out.push({ type, start: p, size, body: p + head, end: p + size });
      p += size;
    }
    return out;
  }
  const kid = (dv, box, type) => boxes(dv, box.body, box.end).find((b) => b.type === type) || null;

  /* いちばん外側の箱の並び（中身は読まない）。最後が切れている箱は complete: false */
  async function scan(blob) {
    const top = [];
    const N = blob.size;
    let p = 0;
    while (p + 8 <= N) {
      const dv = await read(blob, p, Math.min(N, p + 16));
      let size = u32(dv, 0), head = 8;
      const type = four(dv, 4);
      if (size === 1) { if (dv.byteLength < 16) break; size = u64(dv, 8); head = 16; } else if (size === 0) size = N - p;
      if (size < head) break;
      const complete = p + size <= N;
      top.push({ type, start: p, size, head, complete });
      if (!complete) break;
      p += size;
    }
    return top;
  }

  /* 書き込み（大きさの分からない箱は、あとで大きさを書き込む） */
  function writer() {
    let buf = new Uint8Array(4096), len = 0;
    const need = (n) => { if (len + n <= buf.length) return; let m = buf.length * 2; while (m < len + n) m *= 2; const b = new Uint8Array(m); b.set(buf.subarray(0, len)); buf = b; };
    const W = {
      get len() { return len; },
      u8(v) { need(1); buf[len++] = v & 255; },
      u16(v) { need(2); buf[len++] = (v >>> 8) & 255; buf[len++] = v & 255; },
      u32(v) { need(4); v = v >>> 0; buf[len++] = v >>> 24; buf[len++] = (v >>> 16) & 255; buf[len++] = (v >>> 8) & 255; buf[len++] = v & 255; },
      i32(v) { W.u32(v | 0); },
      u64(v) { W.u32(Math.floor(v / 4294967296)); W.u32(v % 4294967296); },
      str(s) { for (let i = 0; i < 4; i++) W.u8(s.charCodeAt(i)); },
      bytes(u8) { need(u8.length); buf.set(u8, len); len += u8.length; },
      box(type, fn) { const at = len; W.u32(0); W.str(type); fn(); const size = len - at; buf[at] = size >>> 24; buf[at + 1] = (size >>> 16) & 255; buf[at + 2] = (size >>> 8) & 255; buf[at + 3] = size & 255; },
      full(type, version, flags, fn) { W.box(type, () => { W.u8(version); W.u8(flags >>> 16); W.u16(flags & 0xffff); fn(); }); },
      out() { return buf.slice(0, len); }
    };
    return W;
  }
  const copy = (dv, box) => new Uint8Array(dv.buffer, dv.byteOffset + box.start, box.size).slice();
  /* 箱の写し（版によって位置の違う「長さ（duration）」の欄だけを書き換える） */
  function withDuration(dv, box, kind, value) {
    const b = copy(dv, box);
    const d = new DataView(b.buffer);
    const head = box.body - box.start;
    const v1 = b[head] === 1;
    // mvhd・mdhd：作成(4|8) 更新(4|8) timescale(4) 長さ(4|8) / tkhd：作成 更新 track_ID(4) reserved(4) 長さ
    const off = head + 4 + (v1 ? 16 : 8) + (kind === 'tkhd' ? 8 : 4);
    if (v1) { d.setUint32(off, Math.floor(value / 4294967296)); d.setUint32(off + 4, value % 4294967296); } else d.setUint32(off, Math.min(0xffffffff, value));
    return b;
  }
  const timescaleOf = (dv, box) => { const v1 = dv.getUint8(box.body) === 1; return u32(dv, box.body + 4 + (v1 ? 16 : 8)); };
  /* tkhd の写し b（Uint8Array）に、映す向き（時計回りの角度 90・180・270）の行列を書く。
     中身（コマ）はそのままで、再生するときに回して映す（ffmpeg の display_rotation と同じ書き方。x・y はずらさない） */
  const MATRIX = {
    0: [0x10000, 0, 0, 0, 0x10000, 0, 0, 0, 0x40000000],
    90: [0, 0x10000, 0, -0x10000, 0, 0, 0, 0, 0x40000000],
    180: [-0x10000, 0, 0, 0, -0x10000, 0, 0, 0, 0x40000000],
    270: [0, -0x10000, 0, 0x10000, 0, 0, 0, 0, 0x40000000]
  };
  function withMatrix(b, rotate) {
    const m = MATRIX[rotate];
    if (!m) return b;
    const d = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const off = 8 + (b[8] === 1 ? 52 : 40);       // 箱の頭 8 ＋（版・フラグ・時刻・track_ID・reserved・長さ・reserved・layer・alternate_group・volume・reserved）
    m.forEach((v, i) => d.setInt32(off + i * 4, v));
    return b;
  }

  /* trak の中から、組み立てに使うものを取り出す */
  function readTrak(dv, trak) {
    const tkhd = kid(dv, trak, 'tkhd'), mdia = kid(dv, trak, 'mdia');
    const mdhd = mdia && kid(dv, mdia, 'mdhd'), hdlr = mdia && kid(dv, mdia, 'hdlr'), minf = mdia && kid(dv, mdia, 'minf');
    const stbl = minf && kid(dv, minf, 'stbl'), stsd = stbl && kid(dv, stbl, 'stsd');
    if (!tkhd || !mdhd || !hdlr || !minf || !stsd) return null;
    const v1 = dv.getUint8(tkhd.body) === 1;
    return {
      id: u32(dv, tkhd.body + 4 + (v1 ? 16 : 8)), handler: four(dv, hdlr.body + 8), ts: timescaleOf(dv, mdhd),
      box: { trak, tkhd, mdia, mdhd, hdlr, minf, stsd, edts: kid(dv, trak, 'edts') },
      sizes: [], durs: [], ctos: [], sync: [], chunks: [], first: null, time: 0, anyCto: false, negCto: false, allSync: true
    };
  }

  /* 細切れの MP4 を、ふつうの MP4 にする。
     戻り値 { flat, header（Uint8Array：ftyp＋moov＋mdat の頭）, ranges（元の Blob の [始め, 終わり) の並び。この順につなぐと mdat の中身）,
             duration（秒）, tracks: [{ handler, samples, duration }], truncated（最後が切れていた）}
     flat: false … もともと、ふつうの MP4（または組み立てられない形）。そのまま使う
     opts.rotate：映像を時計回りに何度回して映すか（0・90・180・270。画面の向きのロックをしたまま、横に置いて撮ったとき） */
  async function flatten(blob, opts) {
    const rotate = (((opts && opts.rotate) || 0) % 360 + 360) % 360;
    const top = await scan(blob);
    const ftypBox = top.find((b) => b.type === 'ftyp' && b.complete);
    const moovTop = top.find((b) => b.type === 'moov' && b.complete);
    if (!moovTop) throw new Error('MP4 の目次（moov）がありません');
    const mdv = await read(blob, moovTop.start, moovTop.start + moovTop.size);
    const moov = { type: 'moov', start: 0, size: moovTop.size, body: moovTop.head, end: moovTop.size };
    const mk = boxes(mdv, moov.body, moov.end);
    const mvex = mk.find((b) => b.type === 'mvex');
    const moofs = top.filter((b) => b.type === 'moof' && b.complete);
    if (!mvex || !moofs.length) return { flat: false, header: null, ranges: null, duration: null, tracks: [], truncated: false };
    const mvhd = mk.find((b) => b.type === 'mvhd');
    const movieTs = mvhd ? timescaleOf(mdv, mvhd) : 1000;
    const tracks = mk.filter((b) => b.type === 'trak').map((t) => readTrak(mdv, t)).filter(Boolean);
    const byId = {};
    tracks.forEach((T) => { byId[T.id] = T; });
    const trex = {};
    boxes(mdv, mvex.body, mvex.end).filter((b) => b.type === 'trex').forEach((b) => {
      trex[u32(mdv, b.body + 4)] = { sdi: u32(mdv, b.body + 8), dur: u32(mdv, b.body + 12), size: u32(mdv, b.body + 16), flags: u32(mdv, b.body + 20) };
    });
    const N = blob.size;
    const runs = [];          // { T, off, bytes, chunk }（中身の場所）
    let truncated = !top[top.length - 1].complete;
    for (const mf of moofs) {
      const dv = await read(blob, mf.start, mf.start + mf.size);
      const moof = { start: 0, body: mf.head, end: mf.size };
      let prevEnd = null;
      for (const traf of boxes(dv, moof.body, moof.end).filter((b) => b.type === 'traf')) {
        const tfhd = kid(dv, traf, 'tfhd');
        if (!tfhd) continue;
        const fl = u32(dv, tfhd.body) & 0xffffff;
        const T = byId[u32(dv, tfhd.body + 4)];
        const X = trex[u32(dv, tfhd.body + 4)] || { sdi: 1, dur: 0, size: 0, flags: 0 };
        let q = tfhd.body + 8;
        let base;
        if (fl & 0x1) { base = u64(dv, q); q += 8; } else base = (fl & 0x20000) ? mf.start : (prevEnd != null ? prevEnd : mf.start);
        const sdi = (fl & 0x2) ? u32(dv, (q += 4) - 4) : X.sdi;
        const ddur = (fl & 0x8) ? u32(dv, (q += 4) - 4) : X.dur;
        const dsize = (fl & 0x10) ? u32(dv, (q += 4) - 4) : X.size;
        const dflags = (fl & 0x20) ? u32(dv, (q += 4) - 4) : X.flags;
        if (!T) continue;
        // 時刻（tfdt）：あいだが空いていたら、前のサンプルを長くして、時刻の流れを保つ
        const tfdt = kid(dv, traf, 'tfdt');
        if (tfdt) {
          const t = dv.getUint8(tfdt.body) === 1 ? u64(dv, tfdt.body + 4) : u32(dv, tfdt.body + 4);
          if (T.first == null) { T.first = t; T.time = t; } else if (t > T.time && T.durs.length) { T.durs[T.durs.length - 1] += t - T.time; T.time = t; }
        } else if (T.first == null) { T.first = 0; T.time = 0; }
        let pos = base;
        for (const trun of boxes(dv, traf.body, traf.end).filter((b) => b.type === 'trun')) {
          const tf = u32(dv, trun.body) & 0xffffff, ver = dv.getUint8(trun.body);
          const n = u32(dv, trun.body + 4);
          let r = trun.body + 8;
          if (tf & 0x1) { pos = base + i32(dv, r); r += 4; }
          let firstFlags = null;
          if (tf & 0x4) { firstFlags = u32(dv, r); r += 4; }
          const start = pos;
          let bytes = 0, count = 0;
          for (let i = 0; i < n; i++) {
            const dur = (tf & 0x100) ? u32(dv, (r += 4) - 4) : ddur;
            const size = (tf & 0x200) ? u32(dv, (r += 4) - 4) : dsize;
            let sf = (tf & 0x400) ? u32(dv, (r += 4) - 4) : dflags;
            if (i === 0 && firstFlags != null) sf = firstFlags;
            const cto = (tf & 0x800) ? (ver === 0 ? u32(dv, (r += 4) - 4) : i32(dv, (r += 4) - 4)) : 0;
            if (start + bytes + size > N) { truncated = true; break; }        // 中身が切れている（録画の途中で閉じた）
            T.sizes.push(size); T.durs.push(dur); T.ctos.push(cto);
            if (cto) { T.anyCto = true; if (cto < 0) T.negCto = true; }
            const sync = T.handler !== 'vide' || !((sf >>> 16) & 1);
            T.sync.push(sync);
            if (!sync) T.allSync = false;
            T.time += dur;
            bytes += size; count++;
          }
          if (count) { const chunk = { n: count, sdi }; T.chunks.push(chunk); runs.push({ T, off: start, bytes, chunk }); }
          pos = start + bytes;
        }
        prevEnd = pos;
      }
    }
    const used = tracks.filter((T) => T.sizes.length);
    if (!used.length) throw new Error('動画の中身がありません');

    // 中身の並べ方：元の場所の順に、すき間なくつなぐ（となり合う所は1つの範囲にまとめる）
    runs.sort((a, b) => a.off - b.off);
    let payload = 0;
    const ranges = [];
    runs.forEach((x) => {
      x.chunk.rel = payload;
      const last = ranges[ranges.length - 1];
      if (last && last[1] === x.off) last[1] += x.bytes; else ranges.push([x.off, x.off + x.bytes]);
      payload += x.bytes;
    });

    // 長さ
    used.forEach((T) => {
      T.mediaDur = T.durs.reduce((s, d) => s + d, 0);
      T.lead = T.first > 0 ? Math.round(T.first / T.ts * movieTs) : 0;          // 最初のサンプルまでの空き（movie の時間の単位）
      T.movieDur = Math.round(T.mediaDur / T.ts * movieTs) + T.lead;      // （B フレームのずれは下で足す）
      // いちばん早く映るサンプルの時刻（B フレームがあると 0 より後）。空きを入れるときは、そこから映す（編集リスト）
      T.minCT = 0; T.maxEnd = T.mediaDur;
      if (T.anyCto && !T.negCto) {
        let dts = 0, m = Infinity, e = 0;
        for (let i = 0; i < T.durs.length; i++) { m = Math.min(m, dts + T.ctos[i]); e = Math.max(e, dts + T.ctos[i] + T.durs[i]); dts += T.durs[i]; }
        T.minCT = isFinite(m) ? m : 0; T.maxEnd = Math.max(e, T.mediaDur);
      }
      if (T.lead > 0) T.movieDur = T.lead + Math.round(T.maxEnd / T.ts * movieTs);
    });
    const movieDur = Math.max(...used.map((T) => T.movieDur));
    const ftyp = ftypBox ? new Uint8Array(await blob.slice(ftypBox.start, ftypBox.start + ftypBox.size).arrayBuffer())
      : (() => { const w = writer(); w.box('ftyp', () => { w.str('isom'); w.u32(512); ['isom', 'iso2', 'mp41'].forEach((s) => w.str(s)); }); return w.out(); })();

    const buildMoov = (base, co64) => {
      const w = writer();
      w.box('moov', () => {
        if (mvhd) w.bytes(withDuration(mdv, mvhd, 'mvhd', movieDur));
        used.forEach((T) => {
          const B = T.box;
          w.box('trak', () => {
            const tk = withDuration(mdv, B.tkhd, 'tkhd', T.movieDur);
            w.bytes(T.handler === 'vide' && rotate ? withMatrix(tk, rotate) : tk);
            if (B.edts) w.bytes(copy(mdv, B.edts));
            else if (T.lead > 0) {
              // 最初のサンプルまでの空き（映像と音の始まりのずれを保つ）。B フレームがあるときは、いちばん早く映るサンプルの時刻（minCT）から映す
              const empty = T.lead + Math.round(T.minCT / T.ts * movieTs);
              const shown = Math.round((T.maxEnd - T.minCT) / T.ts * movieTs);      // 映る長さ（最後のサンプルが映り終わるまで）
              w.box('edts', () => w.full('elst', 0, 0, () => {
                w.u32(2);
                w.u32(empty); w.i32(-1); w.u16(1); w.u16(0);
                w.u32(shown); w.i32(T.minCT); w.u16(1); w.u16(0);
              }));
            }
            w.box('mdia', () => {
              w.bytes(withDuration(mdv, B.mdhd, 'mdhd', T.mediaDur));
              w.bytes(copy(mdv, B.hdlr));
              w.box('minf', () => {
                boxes(mdv, B.minf.body, B.minf.end).forEach((b) => { if (b.type !== 'stbl') w.bytes(copy(mdv, b)); });
                w.box('stbl', () => {
                  w.bytes(copy(mdv, B.stsd));
                  // stts：サンプルの長さ（同じ長さが続く所はまとめる）
                  const stts = [];
                  T.durs.forEach((d) => { const l = stts[stts.length - 1]; if (l && l[1] === d) l[0]++; else stts.push([1, d]); });
                  w.full('stts', 0, 0, () => { w.u32(stts.length); stts.forEach(([c, d]) => { w.u32(c); w.u32(d); }); });
                  if (T.anyCto) {
                    const ctts = [];
                    T.ctos.forEach((o) => { const l = ctts[ctts.length - 1]; if (l && l[1] === o) l[0]++; else ctts.push([1, o]); });
                    w.full('ctts', T.negCto ? 1 : 0, 0, () => { w.u32(ctts.length); ctts.forEach(([c, o]) => { w.u32(c); w.i32(o); }); });
                  }
                  if (!T.allSync) {
                    const idx = [];
                    T.sync.forEach((s, i) => { if (s) idx.push(i + 1); });
                    w.full('stss', 0, 0, () => { w.u32(idx.length); idx.forEach((i) => w.u32(i)); });
                  }
                  w.full('stsz', 0, 0, () => { w.u32(0); w.u32(T.sizes.length); T.sizes.forEach((s) => w.u32(s)); });
                  const stsc = [];
                  T.chunks.forEach((c, i) => { const l = stsc[stsc.length - 1]; if (!l || l[1] !== c.n || l[2] !== c.sdi) stsc.push([i + 1, c.n, c.sdi]); });
                  w.full('stsc', 0, 0, () => { w.u32(stsc.length); stsc.forEach(([f, n, s]) => { w.u32(f); w.u32(n); w.u32(s); }); });
                  if (co64) w.full('co64', 0, 0, () => { w.u32(T.chunks.length); T.chunks.forEach((c) => w.u64(base + c.rel)); });
                  else w.full('stco', 0, 0, () => { w.u32(T.chunks.length); T.chunks.forEach((c) => w.u32(base + c.rel)); });
                });
              });
            });
          });
        });
        mk.filter((b) => b.type === 'udta').forEach((b) => w.bytes(copy(mdv, b)));
      });
      return w.out();
    };
    const big = payload + 8 > 0xffffffff;
    const mdatHead = big ? 16 : 8;
    let co64 = false;
    let moovBytes = buildMoov(0, false);
    let base = ftyp.length + moovBytes.length + mdatHead;
    if (base + payload > 0xffffffff) { co64 = true; moovBytes = buildMoov(0, true); base = ftyp.length + moovBytes.length + mdatHead; }
    moovBytes = buildMoov(base, co64);
    const w = writer();
    w.bytes(ftyp);
    w.bytes(moovBytes);
    if (big) { w.u32(1); w.str('mdat'); w.u64(payload + 16); } else { w.u32(payload + 8); w.str('mdat'); }
    return {
      flat: true, header: w.out(), ranges, truncated, rotate,
      duration: movieDur / movieTs,
      tracks: used.map((T) => ({ handler: T.handler, samples: T.sizes.length, duration: T.mediaDur / T.ts + T.lead / movieTs }))
    };
  }

  /* 組み立てた MP4 の Blob（header と、元の Blob の範囲をつなぐだけ。中身は写さない） */
  function compose(blob, plan, type) {
    if (!plan || !plan.flat) return blob;
    return new Blob([plan.header].concat(plan.ranges.map(([s, e]) => blob.slice(s, e))), { type: type || 'video/mp4' });
  }

  BT.fmp4 = { scan, flatten, compose, boxes };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/vstore.js */
/* バスケ タップ記録 — 撮影した動画の保存（このブラウザの IndexedDB。どこにも送らない）
   録画は数秒ごとの切れはし（chunk）で届くので、届くたびに保存する（途中でページが閉じても、そこまでは残る）。
   録画を止めたら、細切れの MP4 をふつうの MP4 に組み直す「組み立て図」（fmp4.flatten の header と ranges）も保存する。
   動画の中身は、切れはしのまま1回だけ保存する（組み直した動画を、もう1つ保存しない。容量を2倍にしないため）。

   ■ データの形（バスケ得点クリップ basket-clips/js/tapvideo.js も、同じ形で読む）
   DB 'btap-media'（版 1）
     videos：{ vid, gameId, n（その試合の何本目か）, startedAt（録画を始めた時刻・エポックミリ秒）, endedAt,
               mime, ext, w, h, bytes, chunks（切れはしの数）, status（'recording' | 'done'）,
               plan（{ header: Uint8Array, ranges: [[始め, 終わり)…], duration, truncated } | null）, duration（秒）, name（保存するときのファイル名） }
     chunks：{ vid, i, blob }（キー [vid, i]。i の順につなぐと、録画した動画そのもの） */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};
  const DB = 'btap-media', VER = 1;
  let dbp = null;

  const supported = () => { try { return !!root.indexedDB; } catch (e) { return false; } };
  function open() {
    if (dbp) return dbp;
    const p = dbp = new Promise((resolve, reject) => {
      let req;
      try { req = root.indexedDB.open(DB, VER); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'vid' }).createIndex('gameId', 'gameId');
        if (!db.objectStoreNames.contains('chunks')) db.createObjectStore('chunks', { keyPath: ['vid', 'i'] });
      };
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => { db.close(); dbp = null; };
        // ブラウザにつながりを切られた（iPhone で画面を消した・ほかのアプリに切りかえた など）：次の保存で開き直す
        db.onclose = () => { if (dbp === p) dbp = null; };
        p.db = db;
        resolve(db);
      };
      req.onerror = () => reject(req.error || new Error('IndexedDB を開けませんでした'));
      req.onblocked = () => reject(new Error('IndexedDB がほかのタブで使われています'));
    });
    p.catch(() => { if (dbp === p) dbp = null; });
    return p;
  }
  /* 保存の失敗の種類（err.kind）：
       quota … 保存場所がいっぱい（QuotaExceededError。このサイトのブラウザの保存場所。iPhone 本体の空きとは別）
       lost  … つながりが切れた・中断された（画面を消した・ほかのアプリに切りかえた など。開き直せば続けられる）
       other … そのほか */
  function kindOf(e) {
    const n = (e && e.name) || '', m = String((e && e.message) || '');
    if (n === 'QuotaExceededError' || /quota|exceed|disk.?full|no space/i.test(m)) return 'quota';
    if (['InvalidStateError', 'AbortError', 'UnknownError', 'TransactionInactiveError'].includes(n) || /connection|closing|closed|lost|abort/i.test(m)) return 'lost';
    return 'other';
  }
  const named = (name, message) => { const e = new Error(message); e.name = name; return e; };
  /* 1回のやりとり。fn(stores) の戻り値（IDBRequest なら、その結果）を返す。
     つながりが切れていたら、開き直して、もう1回だけやり直す（同じキーに書くので、2回書いても同じ） */
  async function tx(names, mode, fn, again) {
    const db = await open();
    try {
      return await new Promise((resolve, reject) => {
        const t = db.transaction(names, mode);        // つながりが切れていると、ここで InvalidStateError
        const stores = {};
        [].concat(names).forEach((n) => { stores[n] = t.objectStore(n); });
        let out;
        try { out = fn(stores); } catch (e) { reject(e); return; }
        t.oncomplete = () => resolve(out && typeof out === 'object' && 'result' in out && 'readyState' in out ? out.result : out);
        t.onerror = () => reject(t.error || named('UnknownError', '保存できませんでした'));
        t.onabort = () => reject(t.error || named('AbortError', '保存が途中で止まりました'));
      });
    } catch (e) {
      const kind = kindOf(e);
      if (kind === 'lost' && !again) {
        try { db.close(); } catch (x) { /* もう閉じている */ }
        if (dbp && dbp.db === db) dbp = null;
        return tx(names, mode, fn, true);
      }
      try { e.kind = kind; } catch (x) { /* 書けない */ }
      throw e;
    }
  }
  const range = (vid) => IDBKeyRange.bound([vid, 0], [vid, Infinity]);

  const putChunk = (vid, i, blob) => tx('chunks', 'readwrite', (s) => { s.chunks.put({ vid, i, blob }); });
  const putVideo = (v) => tx('videos', 'readwrite', (s) => { s.videos.put(v); });
  const getVideo = (vid) => tx('videos', 'readonly', (s) => s.videos.get(vid));
  const videosOf = (gameId) => tx('videos', 'readonly', (s) => s.videos.index('gameId').getAll(gameId)).then((list) => (list || []).sort((a, b) => a.startedAt - b.startedAt));
  const allVideos = () => tx('videos', 'readonly', (s) => s.videos.getAll()).then((list) => list || []);
  const chunks = (vid) => tx('chunks', 'readonly', (s) => s.chunks.getAll(range(vid))).then((list) => (list || []).sort((a, b) => a.i - b.i).map((c) => c.blob));
  /* 録画した動画そのもの（切れはしをつないだもの） */
  async function raw(vid, mime) { return new Blob(await chunks(vid), { type: mime || 'video/mp4' }); }
  /* 保存・再生に使う動画（組み直した MP4。組み立て図がなければ、録画したまま） */
  async function file(vid) {
    const v = await getVideo(vid);
    if (!v) return null;
    const blob = await raw(vid, v.mime);
    const out = v.plan && BT.fmp4 ? BT.fmp4.compose(blob, Object.assign({ flat: true }, v.plan), 'video/mp4') : blob;
    try { return new File([out], v.name || ('video.' + (v.ext || 'mp4')), { type: v.plan ? 'video/mp4' : (v.mime || 'video/mp4'), lastModified: v.startedAt }); } catch (e) { return out; }
  }
  const remove = (vid) => tx(['videos', 'chunks'], 'readwrite', (s) => { s.videos.delete(vid); s.chunks.delete(range(vid)); });
  async function removeGame(gameId) { const list = await videosOf(gameId); for (const v of list) await remove(v.vid); return list.length; }
  async function estimate() {
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); return { usage: e.usage || 0, quota: e.quota || 0 }; } } catch (e) { /* 分からない */ }
    return null;
  }

  BT.vstore = { supported, open, putChunk, putVideo, getVideo, videosOf, allVideos, chunks, raw, file, remove, removeGame, estimate, kindOf, DB };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/camera.js */
/* バスケ タップ記録 — この端末のカメラで撮影しながら記録する
   カメラ（getUserMedia）の映像を、ブラウザの録画（MediaRecorder）で録る。
   録画を始めた時刻（startedAt）を記録と同じ時計（Date.now）で持つので、あとで動画と記録の時刻を合わせる必要がない
   （記録の t 秒 ＝ 動画の t ＋（記録のスタート − 録画の始まり）秒）。
   録画は数秒ごとに IndexedDB へ保存し（vstore）、止めたら、ふつうの MP4 に組み直す図を作る（fmp4.flatten）。
   1回の録画（録画を始めてから止めるまで）＝ 動画1本。途中で止めて、また始めると、別の動画になる（それぞれに始まりの時刻がある）。 */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};

  const QUALITY = {
    '720': { w: 1280, h: 720, bps: 3000000, label: '720p（ふつう）', perHour: 1.4 },
    '1080': { w: 1920, h: 1080, bps: 6000000, label: '1080p（きれい・容量 2 倍）', perHour: 2.8 }
  };
  const SLICE = 1000;          // 何ミリ秒ごとに受け取って保存するか
  // （Chrome は、キーフレームで区切った「ひとまとまり」がそろってから渡すので、区切りも 1 秒ごとにする。
  //   途中でページが閉じたとき失うのは、最後の数秒）

  function supported() {
    try { return !!(root.navigator && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && root.MediaRecorder); } catch (e) { return false; }
  }
  /* 録画の形式：MP4 を優先（iPhone・iPad の Safari は H.264、Chrome は H.264 か VP9）。だめなら WebM */
  function pickMime(audio) {
    const list = audio
      ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4;codecs=vp9,opus', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
      : ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4;codecs=vp9', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { /* 次 */ } }
    return '';
  }
  const extOf = (mime) => (/webm/.test(mime || '') ? 'webm' : 'mp4');

  function create() {
    const bus = {};
    const emit = (ev, a) => (bus[ev] || []).forEach((fn) => { try { fn(a); } catch (e) { /* 表示の失敗で止めない */ } });
    const C = {
      stream: null, rec: null, seg: null, state: 'off', opts: null, error: null,
      on(ev, fn) { (bus[ev] = bus[ev] || []).push(fn); },
      /* カメラを開く。opts: { quality: '720' | '1080', audio: true | false } */
      async open(opts) {
        C.opts = Object.assign({ quality: '720', audio: true }, opts || {});
        if (C.stream && C.stream.getVideoTracks().some((t) => t.readyState === 'live')) return C.stream;
        const q = QUALITY[C.opts.quality] || QUALITY['720'];
        const video = { facingMode: { ideal: 'environment' }, width: { ideal: q.w }, height: { ideal: q.h }, frameRate: { ideal: 30, max: 30 } };
        const audio = C.opts.audio ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false } : false;
        let st;
        try { st = await navigator.mediaDevices.getUserMedia({ video, audio }); } catch (e) {

          if (audio && e && (e.name === 'NotAllowedError' || e.name === 'NotFoundError')) { st = await navigator.mediaDevices.getUserMedia({ video, audio: false }); C.opts.audio = false; emit('notice', 'マイクが使えないので、音なしで撮ります'); } else throw e;
        }
        C.stream = st;
        st.getVideoTracks().forEach((t) => t.addEventListener('ended', () => emit('trackended')));
        C.setState(C.rec ? C.state : 'ready');
        return st;
      },
      setState(s) { C.state = s; emit('state', s); },
      settings() { const t = C.stream && C.stream.getVideoTracks()[0]; return t && t.getSettings ? t.getSettings() : {}; },
      live() { return !!(C.stream && C.stream.getVideoTracks().some((t) => t.readyState === 'live')); },
      /* 録画を始める。meta: { gameId, n, base（ファイル名のもと）, rotate（映す向き：時計回りの角度） }。戻り値：動画の情報（vstore の videos の形） */
      async start(meta) {
        if (C.rec) return C.seg;
        if (!C.live()) await C.open(C.opts);
        const q = QUALITY[C.opts.quality] || QUALITY['720'];
        const mime = pickMime(C.opts.audio && C.stream.getAudioTracks().length > 0);
        const ro = { videoBitsPerSecond: q.bps, audioBitsPerSecond: 96000, videoKeyFrameIntervalDuration: 1000 };      // （知らない設定は、ブラウザが無視する）
        if (mime) ro.mimeType = mime;
        let rec;
        try { rec = new MediaRecorder(C.stream, ro); } catch (e) { delete ro.videoKeyFrameIntervalDuration; rec = new MediaRecorder(C.stream, ro); }
        const s = C.stream.getVideoTracks()[0].getSettings ? C.stream.getVideoTracks()[0].getSettings() : {};
        const vid = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        const rotate = [90, 180, 270].includes(meta.rotate) ? meta.rotate : 0;
        const rw = s.width || q.w, rh = s.height || q.h;
        const seg = C.seg = {
          vid, gameId: meta.gameId, n: meta.n || 1, startedAt: null, endedAt: null, mime: rec.mimeType || mime || 'video/webm', ext: '',
          w: rotate % 180 ? rh : rw, h: rotate % 180 ? rw : rh, rotate,            // w・h は映すときの大きさ（回したあと）
          bytes: 0, chunks: 0, status: 'recording', plan: null, duration: null, name: ''
        };
        seg.ext = extOf(seg.mime);
        seg.name = `${meta.base || 'バスケ動画'}_動画${seg.n}.${seg.ext}`;
        let chain = Promise.resolve();
        let i = 0;
        const stopped = new Promise((resolve) => { rec.addEventListener('stop', () => resolve()); });
        rec.addEventListener('dataavailable', (e) => {
          if (!e.data || !e.data.size) return;
          const k = i++, blob = e.data;
          seg.bytes += blob.size; seg.chunks = i;
          // 保存は届いた順に1つずつ（順番が入れかわらないように）
          chain = chain.then(() => BT.vstore.putChunk(vid, k, blob)).then(() => BT.vstore.putVideo(Object.assign({}, seg, { plan: null }))).catch((err) => { C.error = err; emit('error', err); });
          emit('progress', seg);
        });
        rec.addEventListener('error', (e) => { C.error = (e && e.error) || new Error('録画でエラーが起きました'); emit('error', C.error); });
        const started = new Promise((resolve) => { rec.addEventListener('start', () => { seg.startEvt = Date.now(); resolve(); }); });
        C.rec = rec;
        C.flush = () => chain;
        C.stopped = stopped;
        // 録画を始めた時刻は「start() を呼ぶ直前」。録画が始まった知らせ（start）は、実際の始まりより 0.05〜0.1 秒おそい
        // （Chromium で、映像に映した時刻と比べて確かめた。直前の時刻なら、ずれは 0.03 秒以内）
        seg.startCall = Date.now();
        seg.startedAt = seg.startCall;
        rec.start(SLICE);
        await Promise.race([started, new Promise((r) => setTimeout(r, 1500))]);
        await BT.vstore.putVideo(Object.assign({}, seg));
        C.setState('recording');
        emit('start', seg);
        return seg;
      },
      elapsed() { return C.seg && C.seg.startedAt && C.rec ? (Date.now() - C.seg.startedAt) / 1000 : 0; },
      /* 録画を止めて、仕上げる（ふつうの MP4 に組み直す図を作る）。戻り値：動画の情報 */
      async stop() {
        const rec = C.rec, seg = C.seg;
        if (!rec || !seg) return null;
        C.setState('finishing');
        try { if (rec.state !== 'inactive') rec.stop(); } catch (e) { /* もう止まっている */ }
        await Promise.race([C.stopped, new Promise((r) => setTimeout(r, 4000))]);
        await C.flush();
        seg.endedAt = Date.now();
        C.rec = null; C.seg = null;
        const done = await finish(seg);
        C.setState(C.live() ? 'ready' : 'off');
        emit('done', done);
        return done;
      },
      /* カメラを閉じる（録画中なら、止めて仕上げてから） */
      async close() {
        let done = null;
        if (C.rec) done = await C.stop();
        if (C.stream) C.stream.getTracks().forEach((t) => { try { t.stop(); } catch (e) { /* 無視 */ } });
        C.stream = null;
        C.setState('off');
        return done;
      }
    };
    return C;
  }

  /* 録画を仕上げる：切れはしをつないで、MP4 なら組み直す図を作り、長さを決めて保存する。
     録画の途中でページが閉じた動画（status: 'recording' のまま残ったもの）にも使う */
  async function finish(seg) {
    const v = Object.assign({}, seg);
    try {
      const blob = await BT.vstore.raw(v.vid, v.mime);
      v.bytes = blob.size;
      if (v.ext === 'mp4' && blob.size && BT.fmp4) {
        let plan = null;
        try { plan = await BT.fmp4.flatten(blob, { rotate: v.rotate || 0 }); } catch (e) { plan = null; }
        if (plan && plan.flat) { v.plan = { header: plan.header, ranges: plan.ranges, duration: plan.duration, truncated: plan.truncated }; v.duration = plan.duration; } else {
          // 中身（映像のデータ）が1つもない：始めてすぐ閉じた・止めた
          const top = await BT.fmp4.scan(blob).catch(() => []);
          if (!top.some((b) => b.type === 'moof' || b.type === 'mdat')) v.empty = true;
        }
      } else if (!blob.size) v.empty = true;
    } catch (e) { /* 読めなくても、記録の時刻だけで */ }
    // 長さが分からない（WebM で、途中で閉じた）ときは、保存した切れはしの数からの目安
    if (!v.endedAt && !v.duration && v.chunks) v.duration = v.chunks * SLICE / 1000;
    if (!v.endedAt) v.endedAt = v.startedAt + Math.round((v.duration || 0) * 1000);
    if (!v.duration) v.duration = Math.max(0, (v.endedAt - v.startedAt) / 1000);
    v.status = 'done';
    if (v.empty) { await BT.vstore.remove(v.vid); v.gone = true; return v; }       // 何も録れていない動画は残さない
    if (v.rotate && !v.plan) {           // 向きを書けなかった（WebM・組み直せない形）：回さずに保存される。大きさも回す前のものに
      v.rotateLost = true;
      if (v.rotate % 180) [v.w, v.h] = [v.h, v.w];
      v.rotate = 0;
    }
    await BT.vstore.putVideo(v);
    return v;
  }
  /* 前回、録画の途中で閉じた動画を仕上げる（その試合の 'recording' のまま残ったもの） */
  async function recover(gameId) {
    const list = await BT.vstore.videosOf(gameId);
    const out = [];
    for (const v of list) {
      if (v.status !== 'recording') continue;
      if (!v.chunks) { await BT.vstore.remove(v.vid); continue; }
      out.push(await finish(Object.assign({}, v, { endedAt: null, duration: null })));
    }
    return out;
  }

  BT.camera = { supported, create, finish, recover, pickMime, QUALITY, SLICE };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/trim.js */
/* バスケ タップ記録 — ✂️ 場面を切り出す（試合の動画から、記録した場面を切り出す）
   前は「バスケ得点クリップ」（別のアプリ）でしていたことを、このアプリの中でする。
     ① 動画を選ぶ（写真アプリ・ファイル・この端末で撮影した動画）
     ② 記録と動画の時刻を合わせる（撮影しながら・動画を見ながら記録した試合は自動。ほかは「⏱ この瞬間が、選んだ記録」→「↔ 指でずらして合わせる」）
     ③ 場面を選んで、見る・動画にする（チーム・プレー・選手で絞り込み・続けて再生・1本の動画に）
   時刻あわせ・絞り込み・自分で足した場面は、試合の記録（game.trims[動画の見分け]）に入れて保存する（この端末とクラウド）。
   動画の中身は保存しない（同じ動画を選び直すと、合わせた時刻のまま開く）。
   元の作り：basket-clips/js/app.js の「バスケ タップ記録の記録から切り出す」「↔ 指でずらして合わせる」「続けて再生」「動画にする」。 */
(function (root) {
  'use strict';
  const BT = root.BT, BS = root.BS;
  const { h, $ } = BT.ui;
  const TL = BS.taplog, NT = BS.notes;

  let T = null;              // 開いている間の状態（閉じると null）
  let wakeOn = false;

  /* ---------- 小さな道具 ---------- */
  const duration = () => (T && T.media ? T.media.duration : 0) || 0;
  const now = () => (T && T.media ? T.media.time : 0);
  const teamColor = (i) => (i == null ? '#9aa3af' : (T.game.teams[i] && T.game.teams[i].color) || (i ? '#2f6fed' : '#f4f4f4'));
  const synced = () => !!(T && T.st && TL.cleanAnchors(T.st.anchors).length);
  const toast = (t, k, ms, a) => BT.ui.toast(t, k, ms, a);
  function winDefault() { return { lead: TL.WIN.lead, lag: TL.WIN.lag, by: JSON.parse(JSON.stringify(TL.WIN_BY)) }; }
  function cleanWin(w) {
    const d = winDefault();

    if (w.by && typeof w.by === 'object') Object.keys(w.by).forEach((k) => { const b = w.by[k]; if (b && isFinite(b.lead) && isFinite(b.lag)) by[k] = { lead: +b.lead, lag: +b.lag }; });

  }
  function freshState(meta) {
    const p = BT.store.prefs();
    return Object.assign({ anchors: [], how: '', view: { teams: [true, true], groups: {}, players: [] }, off: {}, adds: [], win: cleanWin(p.trimWin), captions: true }, meta || {});
  }
  function save() {
    if (!T) return;
    clearTimeout(T.saveTimer);
    T.saveTimer = setTimeout(() => {
      if (!T) return;
      const g = T.game;
      if (T.vkey && T.st) {
        g.trims = g.trims || {};
        g.trims[T.vkey] = T.st;
        g.trimLast = T.vkey;
        if (synced()) g.trimmed = true;
        // 1場面の長さは、次の試合でも使う
        const p = BT.store.prefs(); p.trimWin = T.st.win; BT.store.savePrefs(p);
      }
      T.ctx.save();
    }, 200);
  }
  function modal(o) {
    let s = null;
    const foot = (o.buttons || []).map((b) => h('button', { class: 'btn ' + (b.cls || ''), id: b.id || null, onclick: () => { const r = b.onClick ? b.onClick() : undefined; if (r !== false && s) s.close(); } }, b.label));
    s = BT.ui.sheet({ title: o.title, body: o.body, foot, cls: o.cls, wide: o.wide, onClose: o.onClose });

  const vkeyOf = (file, vid) => (vid ? 'cam:' + vid : `${(file && file.name) || 'video'}|${(file && file.size) || 0}`);
  const fmt = (t, x) => BT.fmtTime(t, x);

  const put = (el, ...kids) => { kids.flat(Infinity).forEach((k) => { if (k != null && k !== false) el.append(k); }); return el; };

  /* ========== 開く・閉じる ========== */
  /* ctx：{ game, save(), back()（試合のページへ）, home(), file（すぐ開く動画）, vid（この端末で撮影した動画の id） } */
  function open(ctx) {
    close(true);
    let log = null, err = null;
    try { log = TL.parse(ctx.game, ''); } catch (e) { err = e.message; }
    T = {
      ctx, game: ctx.game, log, err,
      media: null, file: null, vkey: null, vid: null, st: null,
      reel: { active: false, list: [], i: -1, team: 0, title: '' },
      exporting: null, out: null, fullOut: null, thumbs: {}, thumbJob: null, fps: null, meta: null,
      syncEdit: false, syncPick: null, adj: null, adjLast: null, openWinBy: false, saveTimer: 0, offs: []

  /* ---------- 画面の骨組み ---------- */

  /* 上に貼りつく動画の高さ（狭い画面で、下の操作が動画の下に隠れないように。css の scroll-margin-top） */

  /* ========== 動画を開く ========== */
  function pickFile() {
    const df = BT.demo && BT.demo.file && BT.demo.file();          // 使い方のデモ：見本の動画
    if (df) { openFile(df); return; }
    const inp = h('input', { type: 'file', id: 'tFile', accept: 'video/*,.mp4,.mov,.m4v,.webm', style: { display: 'none' } });

  async function openCamVideo(vid) {

    if (!T) return;
    if (!f) { toast('この動画が、この端末（このブラウザ）に見つかりませんでした。保存した動画を「📂 動画を選ぶ」で開いてください（時刻は自動で合わせます）', 'err', 9000); render(); return; }

  }
  /* meta：記録の videos の1本（撮影しながら記録した動画）。vid：その id（この端末の中の動画） */
  function openFile(file, meta, vid) {
    if (!T || !file) return;
    const okType = /^video\//.test(file.type || '') || /\.(mp4|mov|m4v|webm|mkv)$/i.test(file.name || '');
    if (!okType) { toast('動画ファイル（MP4・MOV など）を選んでください', 'err'); return; }
    if (T.exporting) { toast('書き出し中です。終わってから開いてください', 'warn'); return; }

    if (T.thumbJob) T.thumbJob.cancel = true;
    if (T.media) T.media.destroy();
    T.offs.forEach((off) => off()); T.offs = [];
    const m = BS.createVideoMedia(file);
    T.media = m; T.file = file; T.vid = vid || null;
    T.vkey = vkeyOf(file, vid);
    T.thumbs = {}; T.out = null; T.fullOut = null; T.meta = null; T.fps = null; T.syncEdit = false; T.syncPick = null;
    const saved = T.game.trims && T.game.trims[T.vkey];
    T.st = saved ? Object.assign(freshState(), saved, { win: cleanWin(saved.win) }) : freshState({ name: file.name || '', size: file.size || null });
    T.restored = !!(saved && TL.cleanAnchors(saved.anchors).length);
    T.camMeta = meta || null;
    readMeta(m);
    T.el.slot.innerHTML = '';

    T.el.stage.hidden = false;
    T.el.main.classList.remove('novideo');
    T.offs.push(m.on('time', onTime), m.on('play', updatePlayBtn), m.on('pause', updatePlayBtn));

    });

    m.on('notice', (t) => toast(t, 'warn', 6000));

    render(); drawTimeline(); updatePlayBtn();
  }
  /* 撮影の始まり（時刻あわせの目安）と、1秒のコマ数を、ファイルの目次から読む */
  async function readMeta(media) {
    const f = media && media.file;
    if (!f || typeof f === 'string' || typeof f.slice !== 'function' || !BS.mp4) return;
    try {
      const moov = await BS.mp4.readMoov(BS.mp4.blobReader(f));
      const r = TL.creationTime(moov);
      if (T && T.media === media && r) { T.meta = r; if (!synced()) render(); }
      try { const tr = BS.mp4.parseMoov(moov); if (T && T.media === media && tr && tr.fps > 5 && tr.fps < 241) T.fps = tr.fps; } catch (e) { /* 映像の目次が読めない */ }
    } catch (e) { /* MP4・MOV でない・読めない */ }
  }

  /* ========== 再生 ========== */
  function play() { if (T && T.media) T.media.play(); }
  function pause() { if (T && T.media) T.media.pause(); }
  function toggle() { if (!T || !T.media || T.exporting) return; if (T.media.paused) play(); else pause(); }
  function seek(t, fromReel) {
    if (!T || !T.media || T.exporting) return Promise.resolve();

    return T.media.seek(BS.clamp(t, 0, duration() || t));
  }
  let lastTimeText = '';
  function onTime(t) {
    if (!T) return;
    const s = `${fmt(t)} / ${fmt(duration())}`;
    if (s !== lastTimeText) { lastTimeText = s; T.el.time.textContent = s; }
    reelTick(t);
    drawTimeline();
    drawNotes();
    const sn = $('#tSyncNow');

  }
  function stepFrame(d) {
    if (!T || !T.media || T.exporting) return Promise.resolve();
    if (T.reel.active) stopReel(true);
    if (!T.media.paused) pause();
    const fps = T.fps || 30;
    const n = Math.floor(now() * fps + 1e-3);

  }
  function holdRepeat(btn, fn) {
    let timer = 0, held = false, ptrAt = 0;

    btn.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      held = true; ptrAt = Date.now();
      fn();
      const rep = () => { if (!held) return; Promise.resolve(fn()).then(() => { if (held) timer = setTimeout(rep, 40); }); };
      timer = setTimeout(rep, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));

    btn.addEventListener('click', () => { if (Date.now() - ptrAt > 700) fn(); });
  }
  function updatePlayBtn() {

    if (ico && ico.textContent !== mark) ico.textContent = mark;
    adjPlayBtn();
  }
  function onKey(e) {

    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const k = e.key;

  /* ========== 時刻あわせ ========== */
  function autoSync() {

      const a = TL.videoAnchors(T.log, T.camMeta);

    }

    if (v) {
      const a = TL.videoAnchors(T.log, v);
      if (a) return setSync(a, v.file ? 'review' : 'camera', v.file ? null : `📹 撮影しながら記録した動画（動画${v.n}）なので、時刻は自動で合わせました`);
    }

  function setSync(anchors, how, msg) {

  }
  function afterSync(msg) {

  function metaSuggestion() {

  }
  function syncFromMeta() {

  /* 記録 eventId の瞬間を、動画の v 秒（なければ、いまの位置）にする。mode：'reset'｜'add'（合わせる点を足す）｜'fix'（その記録に効いている点だけ） */

    if (!e) return;

    const cur = synced() ? T.st.anchors : [];

    setSync(anchors, 'manual', `合わせました：記録の ${fmt(e.t)}（${TL.eventLabel(T.log, e, true)}）＝ 動画の ${fmt(vv, true)}`);
  }

  /* ---------- ↔ 指でずらして合わせる ----------
     見本の場面の「枠」（色の帯。タップの前○秒〜後○秒）を、目盛りの上で指で左右に動かして合わせる。
     動かしている間は、白い線（記録した瞬間）のコマを小さな画面に出す。「これで合わせる」で、全部の場面を同じだけずらす。 */

  const adjWin = (c) => TL.winFor(T.st.win, c && c.grp);
  const fmtShift = (d) => (d ? `${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(1)} 秒` : '±0 秒');
  function adjRefs() {
    if (!T.log || !synced()) return [];

  }
  function adjDefault(refs) {

  function openAdjust(refId) {

    const body = h('div', { class: 'adj' },
      h('p', { class: 'note adjhint' }, '場面の枠（色の帯）を指で左右に動かすと、白い線（記録した瞬間）のコマが上に出ます。プレーの瞬間（得点なら、ボールがリングを通ったところ）で指を離してください。'),
      h('label', { class: 'adjrefrow' }, h('span', { class: 'note' }, '見本の場面'),
        h('select', { id: 'adjRef', class: 'syncpick', onchange: (e) => adjSetRef(e.target.value) },
          refs.map((c) => h('option', { value: c.id, selected: c.id === id }, `${fmt(c.at)}　${c.label}`)))),
      h('div', { class: 'adjpv', style: { aspectRatio: `${W} / ${H}`, '--ar': ratio.toFixed(4) } },
        h('canvas', { id: 'adjPv' }), h('span', { class: 'adjtag', id: 'adjTag' }),
        h('button', { class: 'adjplay', id: 'adjPlay', onclick: adjPlay }, '▶ この場面を見る')),
      ruler,
      h('div', { class: 'adjval' }, h('span', { class: 'note' }, 'ずらす量'), h('b', { id: 'adjVal' }, fmtShift(0)), h('span', { class: 'note', id: 'adjDir' }),
        h('span', { class: 'spacer' }),
        h('span', { class: 'adjzoom' }, h('span', { class: 'note' }, '目盛り'),
          ADJ_R.map((r, i) => h('button', { class: 'btn small' + (i ? '' : ' on'), dataset: { adjzoom: String(i) }, onclick: () => adjZoom(i) }, `±${r}秒`)))),
      h('div', { class: 'row' },
        [-1, -0.1, 0.1, 1].map((d) => h('button', { class: 'btn small', dataset: { adjstep: String(d) }, onclick: () => adjStep(d) }, (d > 0 ? '+' : '−') + Math.abs(d) + '秒')),
        h('button', { class: 'btn small', id: 'adjReset', onclick: () => adjStep(-T.adj.d) }, '元に戻す')),
      h('p', { class: 'note', id: 'adjScope' }));
    modal({ title: '↔ 指でずらして合わせる', body, cls: 'adjcard', wide: true, onClose: adjClose,
      buttons: [{ label: 'やめる', id: 'adjCancel' }, { label: '✓ これで合わせる', cls: 'primary', id: 'adjOk', onClick: adjApply }] });
    A.offs.push(T.media.on('time', adjFrame), T.media.on('play', adjPlayBtn), T.media.on('pause', adjPlayBtn));

  function adjSetRef(id, first) {

    const c = A && A.refs.find((x) => x.id === id);

    if (!first && prev && TL.anchorIndex(T.st.anchors, prev.t) !== TL.anchorIndex(T.st.anchors, c.t)) A.d = 0;
    A.ref = id; A.view = c.at; T.adjLast = id;
    A.d = adjClamp(A.d);
    if (T.reel.active) stopReel(true);
    const sec = adjSection(c);
    const sc = $('#adjScope');
    if (sc) sc.textContent = sec ? `合わせた場所が ${TL.cleanAnchors(T.st.anchors).length} か所あるので、この場面のある区間（${sec}）の場面だけをずらします。` : '「これで合わせる」で、全部の場面が同じだけずれます。目盛りの数字は、元の位置からの秒数です。';

  function adjUpdate() {
    const A = T && T.adj, c = adjRef();
    if (!A || !c) return;
    const m = c.at + A.d;

  /* 動画の上に出すコメント・スタンプ（記録の 💬。動画の時刻にして） */
  function noteList() {

  async function doExport(single) {

    const clips = segs.map((seg) => ({ t0: seg.t0, t1: seg.t1, label: seg.label, sub: segSub(seg), color: teamColor(seg.team) }));
    const ctrl = new AbortController();

  /* 🎞 動画全体を書き出す（コメント・スタンプ入り。動画を見ながら記録した試合で、コメントがあるとき） */

    if (T.exporting || !T.media) return;
