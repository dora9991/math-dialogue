<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>証明のしくみ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="../kukan/css/board.css">
</head>
<body>
<script src="../kukan/js/k3.js"></script>
<script src="../katsuyo/js/chart.js"></script>
<script src="js/geo.js"></script>
<script>
/* 平行と合同 第12時：証明のしくみを読み取ろう（ikkan の lesson_heikou_new_12 と同じ流れ）。
   図の座標は ikkan と同じ（AC∥DB・AO＝BO の図、∠XOY の二等分線、たこ形 PQRS、頂点 A を共有する正三角形 ABC・ADE）。座標はページの中で作った自作のデータ。
   今日の問い（①〜⑤ の根拠）と例題（PA＝PB）は GE.proof で、1行ずつ図が光る。行の主張は座標で検算される。ことばは、証明のしくみ（仮定 → 等しいもの3つ → 合同 → 結論）を流れの図で。
   根拠にするのは、仮定・対頂角・平行線の錯角・合同条件（3つ）・合同な図形の性質・正三角形の辺と角だけ（二等辺三角形の性質などは使わない）。考えよう（ア〜カをならべる）の答えは出さない。 */
(function () {
  var C = CH.C, FONT = '"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif', OUT = 'rgba(20,40,30,.9)';
  function rad(d) { return d * Math.PI / 180; }
  function pol(r, d) { return [r * Math.cos(rad(d)), r * Math.sin(rad(d))]; }
  function tw(D, s, size) { var g = D.ctx; g.save(); g.font = '600 ' + size + 'px ' + FONT; var w = g.measureText(s).width; g.restore(); return w; }
  function topY(D, R) { return (CH.box(D, { t: 0, b: 0 }).y0 + R.y0) / 2; }

  /* ---------- 今日の問い：AC∥DB、AO＝BO ならば CO＝DO（①〜⑤ の根拠を読む） ---------- */
  var PH = { A: [-2.2, 1.7], B: [2.2, -1.7], C: [-2.2, -1.3], D: [2.2, 1.3], O: [0, 0] };
  var DEF1 = { id: '第12時 今日の問い', lv: 1, ttl: '今日の問い　①〜⑤ の根拠', P: PH,
    q: '図で、AC∥DB、AO＝BO ならば、CO＝DO である。下の ①〜⑤ は、その証明の各行。それぞれ、何を根拠にしているだろう。',
    fig: { segs: ['AB', 'CD', 'AC', 'DB'], ticks: [['AO', 1], ['BO', 1]], pars: [['AC', 1], ['DB', 1]], dots: ['O'], dir: { O: 'n', A: 'nw', B: 'se', C: 'sw', D: 'ne' } },
    hyp: 'AC∥DB、AO＝BO', goal: 'CO＝DO', tri: ['AOC', 'BOD'],
    notes: ['△AOC と △BOD において　① AO＝BO　② ∠AOC＝∠BOD　③ ∠OAC＝∠OBD　④ △AOC≡△BOD　⑤ CO＝DO', '自分の考え（3分）→ ペアの考え（3分）　③の根拠は、図のどこでわかるか話し合おう。'],
    L: [{ t: '△AOC と △BOD で' }, { t: 'AO＝BO', r: '仮定', n: 1 }, { t: '∠AOC＝∠BOD', r: '対頂角は等しい', n: 2 }, { t: '∠OAC＝∠OBD', r: 'AC∥DB より、平行線の錯角は等しい', n: 3 },
      { t: '△AOC≡△BOD', r: '①②③より、1組の辺とその両端の角が、それぞれ等しい（合同条件）', n: 4, ask: 'r' }, { t: 'CO＝DO', r: '合同な図形の対応する辺は等しい', n: 5 }] };
  var PROOF1 = GE.proof(DEF1, { tag: '今日の問い' });
  /* ほかの図でも：AC∥DB（点 O について対称）、AO＝BO の図で、CO＝DO */
  (function () { for (var i = 0; i < 20; i++) { var a = [-(1 + (i % 6) * .4), .8 + (i % 5) * .5], c = [-(1 + (i % 4) * .5), -(.4 + (i % 7) * .3)]; GE.verify({ A: a, B: [-a[0], -a[1]], C: c, D: [-c[0], -c[1]], O: [0, 0] }, 'AC∥DB、AO＝BO、∠OAC＝∠OBD、△AOC≡△BOD、CO＝DO', null, '今日の問い（ほかの図 ' + i + '）'); } })();

  /* ---------- ことば：証明のしくみ（流れの図）。[箱の字, 色]、矢印の根拠 ---------- */
  var FLOW = [['仮定　AO＝BO、AC∥DB', C.blue], ['① AO＝BO　② ∠AOC＝∠BOD　③ ∠OAC＝∠OBD', C.chalk], ['④ △AOC≡△BOD', C.yel], ['⑤ CO＝DO（結論）', C.pink]];
  var WHY = ['仮定・対頂角・錯角', '合同条件', '合同な図形の性質'];
  function flow(D, o) {
    var R = CH.box(D, { l: .04, r: .04, t: .08, b: .08 }), n = FLOW.length, s = Math.min(CH.fs(D, 1), (R.w * .92) / 26), bh = s * 2.1, gap = Math.min((R.h - bh * n) / (n - 1), s * 4.5), y0 = R.cy - (bh * n + gap * (n - 1)) / 2, g = D.ctx;
    FLOW.forEach(function (f, i) {
      var y = y0 + i * (bh + gap), w = tw(D, f[0], s) + s * 1.6, a = o.box(i);
      g.save(); g.globalAlpha = D.ga * a; g.strokeStyle = f[1]; g.lineWidth = 2.2; g.fillStyle = 'rgba(242,240,230,.06)'; g.beginPath(); g.rect(R.cx - w / 2, y, w, bh); g.fill(); g.stroke(); g.restore();
      CH.text(D, R.cx, y + bh / 2, f[0], { size: s, col: f[1], a: a });
      if (i < n - 1) {
        var ya = y + bh + 4, yb = y + bh + gap - 4, b = o.why(i);
        CH.arrow(D, R.cx, ya, R.cx, yb, { col: 'rgba(242,240,230,.7)', w: 2.2, head: 9, a: Math.min(a, o.box(i + 1)) });
        if (b > 0) CH.text(D, R.cx + s * .7, (ya + yb) / 2, WHY[i], { size: s * .92, col: C.green, align: 'left', a: b, outline: OUT });
      }
    });
  }

  /* ---------- 例題：OP は ∠XOY の二等分線、OA＝OB ならば PA＝PB ---------- */
  var PB2 = { O: [0, 0], P: pol(4.4, 0), A: pol(3, 35), B: pol(3, -35), X: pol(5.4, 35), Y: pol(5.4, -35) };
  var DEF2 = { id: '第12時 例題', lv: 1, ttl: '例題　角の二等分線と PA＝PB', P: PB2,
    q: 'OP は ∠XOY の二等分線で、OA＝OB である。PA＝PB の証明を、根拠に気をつけて読もう。',
    fig: { segs: ['OX', 'OY', 'OP', 'PA', 'PB'], ticks: [['OA', 1], ['OB', 1]], angs: [['AOP', 1], ['POB', 1]], dir: { O: 'w', P: 'e', A: 'n', B: 's', X: 'ne', Y: 'se' } },
    hyp: 'OP は ∠XOY の二等分線、OA＝OB', goal: 'PA＝PB', tri: ['OAP', 'OBP'],
    L: [{ t: '△OAP と △OBP で' }, { t: 'OA＝OB', r: '仮定', n: 1 }, { t: '∠AOP＝∠BOP', r: 'OP は ∠XOY の二等分線（仮定）', n: 2 },
      { t: 'OP は共通', n: 3, ask: false, q: '③ もう1組、等しい辺は？', a: 'OP は共通' },
      { t: '①②③より、2組の辺とその間の角が、それぞれ等しいので △OAP≡△OBP', c: 'SAS' }, { t: 'PA＝PB', r: '合同な図形の対応する辺は等しい' }] };
  var PROOF2 = GE.proof(DEF2, { tag: '例題' });

  /* ---------- 考えよう：たこ形 PQRS（PQ＝PS、RQ＝RS ならば ∠PQR＝∠PSR）の証明を、ばらばらにした ア〜カ ---------- */
  var PK = { P: [3.2, 0], Q: [.9, 2], R: [-1.8, 0], S: [.9, -2] }, KFIG = { segs: ['PQ', 'QR', 'RS', 'SP', 'PR'], ticks: [['PQ', 1], ['PS', 1], ['RQ', 2], ['RS', 2]], dir: { P: 'e', Q: 'n', R: 'w', S: 's' } };
  var KT = [['ア', '3組の辺が、それぞれ等しいから　△PQR≡△PSR'], ['イ', '仮定より　RQ＝RS'], ['ウ', '△PQR と △PSR において'], ['エ', '合同な図形の、対応する角は等しいから　∠PQR＝∠PSR'], ['オ', 'PR は共通'], ['カ', '仮定より　PQ＝PS']];
  GE.checkFig(PK, KFIG, '考えよう たこ形');
  KT.forEach(function (k) { GE.verify(PK, k[1], null, '考えよう ' + k[0]); });

  /* ---------- チャレンジ：正三角形 ABC と ADE が頂点 A を共有。BD＝CE ---------- */
  var PE = { A: [0, 0], B: pol(3, -55), C: pol(3, 5), D: pol(2, 80), E: pol(2, 140) };
  var EFIG = { segs: ['AB', 'BC', 'CA', 'AD', 'DE', 'EA', 'BD', 'CE'], ticks: [['AB', 1], ['BC', 1], ['CA', 1], ['AD', 2], ['DE', 2], ['EA', 2]], dir: { A: 'sw', B: 's', C: 'e', D: 'ne', E: 'nw' } };
  GE.checkFig(PE, EFIG, 'チャレンジ 正三角形');
  GE.verify(PE, '∠BAC＝∠DAE＝60°、∠BAD＝∠BAC＋∠CAD、∠CAE＝∠DAE＋∠CAD、∠BAD＝∠CAE、AB＝AC、AD＝AE、△ABD≡△ACE、BD＝CE', null, 'チャレンジ 正三角形');

  K3.run({
    no: '第12時', title: '証明のしくみを読み取ろう', flat: true, hint: '', alt: '証明の図',
    links: [{ href: 'index.html', label: '目次' }, { href: '11.html', label: '◀ 第11時' }, { href: '13.html', label: '第13時 ▶' }],
    steps: PROOF1.concat([
      { tag: 'ことば', bh: 'ことば', q: '証明は、仮定から結論まで、どうつながっていた？ 根拠にしてよいことは？', a: '仮定と、正しいと認められた性質',
        sub: '対頂角は等しい・平行線の錯角や同位角は等しい・三角形の合同条件・合同な図形の対応する辺や角は等しい。図で等しく見えることや、示したい結論は、根拠にできない', dur: 4,
        b: [{ t: '証明の根拠 … <b>仮定</b>・対頂角・平行線の<b>錯角</b>・<b>同位角</b>', col: C.green }, { t: '三角形の<b>合同条件</b>・合同な図形の<b>対応</b>する辺や角は等しい', col: C.green }],
        draw: function (D) { var t = D.ph ? D.t : 0; flow(D, { box: function () { return 1; }, why: function (i) { return D.ph ? CH.smooth(i * .3 + .05, i * .3 + .25, t) : 0; } }); } }
    ], PROOF2, [
      { tag: '考えよう', q: 'ア〜カは、「PQ＝PS、RQ＝RS ならば、∠PQR＝∠PSR」の証明を、ばらばらにしたもの。正しい順にならべよう。',
        notes: KT.map(function (k) { return k[0] + '　' + k[1]; }).concat(['① 正しい順に、記号をならべよう。　② 入れかえてよい行と、いけない行を、わけといっしょに。', 'スライダーで、ア〜カの行が、図のどこのことかを光らせられます。']),
        sliders: [{ key: 'i', label: '光らせる行', min: 0, max: 6, step: 1, val: 0, fmt: function (x) { return x ? KT[x - 1][0] : '—'; } }],
        draw: function (D) {
          var R = CH.box(D, { l: .1, r: .1, t: .2, b: .08 }), F = GE.fit(D, R, PK, { pad: .1 }), i = D.V.i, s = Math.min(CH.fs(D, 1), D.W / 30);
          GE.poly(F, 'PQR', { col: C.blue, fa: i === 1 || i === 3 ? .3 : .12, stroke: false }); GE.poly(F, 'PSR', { col: C.orange, fa: i === 1 || i === 3 ? .3 : .12, stroke: false });
          GE.figure(F, KFIG);
          if (i) { GE.glow(F, KT[i - 1][1], null, { col: C.yel }); CH.text(D, R.cx, topY(D, R), KT[i - 1][0] + '　' + KT[i - 1][1], { col: C.yel, size: s, outline: OUT }); }
        } },
      { tag: 'チャレンジ', bh: 'チャレンジ　2つの正三角形', q: '正三角形 ABC と正三角形 ADE が、頂点 A を共有している。BD＝CE であることを証明しよう。', a: '△ABD≡△ACE だから BD＝CE',
        sub: 'AB＝AC、AD＝AE（正三角形の辺）。∠BAD＝60°＋∠CAD、∠CAE＝60°＋∠CAD より ∠BAD＝∠CAE。2組の辺とその間の角が、それぞれ等しいから △ABD≡△ACE。合同な図形の対応する辺は等しいから BD＝CE', dur: 6,
        b: { t: 'AB＝AC、AD＝AE、∠BAD＝∠CAE（60°＋∠CAD）→ <b>△ABD≡△ACE</b> → <b>BD＝CE</b>', col: C.orange },
        draw: function (D) {
          var R = CH.box(D, { l: .1, r: .1, t: .08, b: .08 }), F = GE.fit(D, R, PE, { pad: .12 }), t = D.ph ? D.t : 0, a1 = CH.smooth(.02, .18, t), k = CH.smooth(.24, .7, t), a3 = CH.smooth(.76, .92, t);
          GE.poly(F, 'ABD', { col: C.blue, fa: .18, stroke: false }); GE.poly(F, 'ACE', { col: C.orange, fa: .18, stroke: false });
          GE.figure(F, EFIG);
          if (a1 > 0) { GE.arc(F, 'BAD', { col: C.blue, fill: .35, r: F.s * 1.3, a: a1 }); GE.arc(F, 'CAE', { col: C.orange, fill: .35, r: F.s * 1.9, a: a1 }); GE.arc(F, 'CAD', { col: C.yel, fill: .4, r: F.s * 2.5, a: a1 }); }
          if (k > 0) GE.polyP(F, ['A', 'B', 'D'].map(function (v) { return GE.rot(PE[v], PE.A, 60 * CH.ease(k)); }), { col: C.yel, fa: .22 });
          if (a3 > 0) { GE.seg(F, 'BD', { col: C.pink, w: 5, glow: true, a: a3 }); GE.seg(F, 'CE', { col: C.pink, w: 5, glow: true, a: a3 }); }
        } }
    ])
  });
})();
</script>
</body>
</html>
