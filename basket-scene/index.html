<body>
<div id="view"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* js/lib/core.js */
/* バスケ タップ記録 — 画面を持たない部分（データの形・時刻・集計・CSV・読み込み）
   DOM に依存しないので、node のテストからも、バスケ得点クリップの確かめからも読み込める。

   ■ 記録のデータ（1試合＝1つ。書き出す JSON もこの形。バスケ得点クリップが読み込む）
   {
     format: 'basket-tap', version: 1,
     id, title（なくてよい）, date: 'YYYY-MM-DD',
     startedAt: スタートを押した時刻（エポックミリ秒。押す前は null）, endedAt: 終えた時刻 | null,
     tz: 記録した端末の時差（分。日本は 540）,
     teams: [ 自分, 相手 ]  … { name, color, colorName, players: [{ no: '7', name: '' }] }
     events: [ { id, t, type, team, no } ]  … 追加した順
     videos: [ { vid, n, startedAt, endedAt, duration, name, mime, w, h, bytes } ]（この端末のカメラで撮影しながら記録したとき。なくてよい）
     mode: 'video'（動画を見ながら記録した試合。t は「動画の時刻」。なければ、ふつうの記録＝スタートからの時間）
       src: { name, size, duration, w, h }（そのとき見ていた動画のファイル。中身は持たない）。videos にも file: true の1本を入れる
       （startedAt を記録と同じにしておくので、バスケ得点クリップで同じ動画を開くと、時刻あわせなしで合う）
     notes: [ { id, t, dur, text, stamps, tags, at } ]（💬 コメント・スタンプ。t は記録の時刻。なくてよい）
       startedAt：録画を始めた時刻（エポックミリ秒。記録の startedAt と同じ時計）→ 記録の t 秒 ＝ 動画の t ＋（startedAt(記録) − startedAt(動画)）/1000 秒
       動画の中身は、この端末のブラウザ（IndexedDB 'btap-media'。vstore.js）にだけある。書き出す JSON には、ファイル名・時刻・長さだけが入る
       t   : スタートからの秒（0.1 秒まで）。ストップウォッチと同じで、止まらずに進む
       type: 下の TYPES の id。'period' はピリオドの始まり（period: 番号。team・no はなし）
       team: 0 = 自分・1 = 相手・null = チームなし（画面の下の「パスミス」「★ あとで見る」。だれのかは決めない）
       no  : 背番号（文字列。'0' と '00' は別）| null（だれか分からない・チームなし）
       x, y: シュートの場所（2P・3P の成功と失敗だけ。なくてよい）。ハーフコートの中の位置（0〜1・0.001 まで）。
             x：ゴールを向いて 左のサイドライン 0 … 右のサイドライン 1 / y：ゴールの後ろのベースライン 0 … センターライン 1
     court: 'std' | 'mini'（シュートの場所を記録したときのコート。ミニバスは 3P の線なし。なくてよい）
     gc: { len, ot, ev: [ { t, on } | { t, set } ] }（試合時間＝止められる時計。設定でオンにした試合だけ。下の「試合時間」）
   }
   得点のプレー（2P・3P・FT）には、かならずチームが付く。
   ピリオドは、イベントには持たせず「その時刻より前の、いちばん新しい 'period'」で決める（periodAt）。
   ピリオドを進め忘れても、あとで 'period' の時刻を直すだけで、全部の記録のピリオドが正しくなる。 */
(function (root) {
  'use strict';
  const BT = root.BT = root.BT || {};
  BT.APP = 'バスケ タップ記録';
  BT.FORMAT = 'basket-tap';
  BT.VERSION = 1;

  BT.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。tenths で 0.1 秒まで */
  BT.fmtTime = function (sec, tenths) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    if (tenths) sec = Math.round(sec * 10) / 10;
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (tenths) out += '.' + Math.round((sec * 10) % 10) % 10;
    return out;
  };

  /* ---------- プレーの種類 ----------
     label：記録の一覧・書き出しでの呼び名 / short：狭い所での呼び名（なければ label） / btn：記録の画面のボタンの文字
     kind：色分け（made 成功・miss 失敗・reb リバウンド・good よいプレー・bad ミス・foul・mark）
     記録の画面にボタンがあるのは、選手ごとの行（ふだんは ROW_TYPES。設定で失敗・ファウル・アシスト・スティール・ターンオーバーを足したり、
     リバウンドをオフェンス・ディフェンスに分けたりできる：rowTypes）と、画面の下の GLOBAL_TYPES だけ。
     ほかの種類（ブロックなど）は、前の版で記録したファイルを開くため・一覧で直すために残している。
     btnShort：ボタンが狭いときの文字 / reb：リバウンドの向き（'o' オフェンス・'d' ディフェンス。'reb' は分けない記録） */
  BT.TYPES = [
    { id: 'fg2', btn: '2P', label: '2P成功', pts: 2, made: true, shot: 'fg2', kind: 'made' },
    { id: 'fg3', btn: '3P', label: '3P成功', pts: 3, made: true, shot: 'fg3', kind: 'made' },
    { id: 'ft', btn: 'FT', short: 'FT成功', label: 'フリースロー成功', pts: 1, made: true, shot: 'ft', kind: 'made' },
    { id: 'fg2x', btn: '×', label: '2P失敗', pts: 0, made: false, shot: 'fg2', kind: 'miss' },
    { id: 'fg3x', btn: '×', label: '3P失敗', pts: 0, made: false, shot: 'fg3', kind: 'miss' },
    { id: 'ftx', btn: '×', short: 'FT失敗', label: 'フリースロー失敗', pts: 0, made: false, shot: 'ft', kind: 'miss' },
    { id: 'reb', btn: 'リバ', label: 'リバウンド', pts: 0, kind: 'reb' },
    { id: 'oreb', btn: 'Oリバ', btnShort: 'OR', short: 'Oリバ', label: 'オフェンスリバウンド', pts: 0, kind: 'reb', reb: 'o' },
    { id: 'dreb', btn: 'Dリバ', btnShort: 'DR', short: 'Dリバ', label: 'ディフェンスリバウンド', pts: 0, kind: 'reb', reb: 'd' },
    { id: 'ast', btn: 'アシスト', btnShort: 'AS', label: 'アシスト', pts: 0, kind: 'good' },
    { id: 'stl', btn: 'スティール', btnShort: 'ST', label: 'スティール', pts: 0, kind: 'good' },
    { id: 'blk', label: 'ブロック', pts: 0, kind: 'good' },
    { id: 'pass', btn: 'パスミス', label: 'パスミス', pts: 0, kind: 'bad' },
    { id: 'tov', btn: 'ターンオーバー', btnShort: 'TO', label: 'ターンオーバー', pts: 0, kind: 'bad' },
    { id: 'foul', btn: 'ファウル', btnShort: 'F', label: 'ファウル', pts: 0, kind: 'foul' },
    { id: 'mark', btn: '★ あとで見る', label: '★ あとで見る', pts: 0, kind: 'mark' }
  ];
  BT.TYPE = {};
  BT.TYPES.forEach((d) => { BT.TYPE[d.id] = d; });
  BT.TYPE.period = { id: 'period', label: 'ピリオド開始', pts: 0, kind: 'period' };

  /* 記録の画面のボタン
       ROW_TYPES   ：選手（背番号）の行ごとに並ぶボタン。押せば、その選手のプレーとして1回で記録する
       GLOBAL_TYPES：画面の下に1つずつ。チーム・選手は決めずに、時刻だけを残す */
  BT.ROW_TYPES = ['fg2', 'fg3', 'ft', 'reb'];
  BT.GLOBAL_TYPES = ['pass', 'mark'];
  /* 選手の行のボタン（設定で足せる）。opt.miss：シュートの失敗（2P・3P・FT の「×」を、それぞれの成功のとなりに。シュート成功率が出せる）・
     opt.rebSplit：リバを「Oリバ」（オフェンス）「Dリバ」（ディフェンス）の2つに・opt.ast：アシスト・opt.stl：スティール・
     opt.tov：ターンオーバー（ボールを失ったミス。だれのミスかを残す。画面の下の「パスミス」は、チーム・選手を決めない）・
     opt.foul：ファウル（いちばん後ろ）。どれもなければ ROW_TYPES のまま */
  BT.rowTypes = function (opt) {
    const o = opt || {};
    const out = [];
    BT.ROW_TYPES.forEach((t) => {
      if (t === 'reb' && o.rebSplit) { out.push('oreb', 'dreb'); return; }
      out.push(t);
      if (o.miss && BT.TYPE[t + 'x']) out.push(t + 'x');
    });
    if (o.ast) out.push('ast');
    if (o.stl) out.push('stl');
    if (o.tov) out.push('tov');
    if (o.foul) out.push('foul');
    return out;
  };
  /* ボタンの文字の幅（全角 1・半角 0.62 の目安。長い文字のボタンの大きさを決めるのに使う） */
  BT.textEm = (s) => Array.from(String(s || '')).reduce((a, ch) => a + (/[\u0000-\u00ff]/.test(ch) ? 0.62 : 1), 0);
  /* 行のボタンの幅の割合（「×」は少し細く）。planLayout・planTeam と、css の行の並び（--cols）に使う */
  BT.ROW_WEIGHT = { miss: 0.75 };
  /* 2段の行（ボタンが多くて、1段ではボタンが細くなりすぎるとき）：上の段にシュート（2P・3P・FT と、その「×」）、下の段にそれ以外。
     l2：下の段のボタンか（types と同じ順）・m2：1段のボタンの数（多いほうの段）。2段では、ボタンの幅はみな同じ */
  BT.rowSpec = function (types) {
    const ts = types || BT.ROW_TYPES;
    const w = ts.map((t) => BT.ROW_WEIGHT[(BT.TYPE[t] || {}).kind] || 1);
    const l2 = ts.map((t) => !(BT.TYPE[t] || {}).shot);
    const n2 = l2.filter(Boolean).length;
    return { types: ts, weights: w, k: w.length, units: w.reduce((a, b) => a + b, 0), minW: Math.min.apply(null, w), l2, m2: Math.max(ts.length - n2, n2) };
  };
  /* 一覧で直すときに選べる種類（いまの画面のボタン＋その記録の種類） */
  BT.editTypes = function (cur, rowTypes) {
    const ids = (rowTypes || BT.ROW_TYPES).concat(BT.GLOBAL_TYPES);
    if (cur && BT.TYPE[cur] && !ids.includes(cur)) ids.push(cur);
    return ids;
  };

  /* ユニフォームの色（よくある色） */
  BT.COLORS = [
    { name: '白', hex: '#f4f4f4' }, { name: '黒', hex: '#222222' }, { name: '赤', hex: '#d93636' }, { name: '青', hex: '#2f6fed' },
    { name: '紺', hex: '#1f2f6e' }, { name: '水色', hex: '#45b0e6' }, { name: '緑', hex: '#2e9e5b' }, { name: '黄', hex: '#f2c230' },
    { name: 'オレンジ', hex: '#f08a24' }, { name: '紫', hex: '#7d4cc9' }, { name: 'ピンク', hex: '#e86aa6' }, { name: 'グレー', hex: '#8a8f98' }
  ];
  function hexRGB(hex) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128]; }
  BT.hexRGB = hexRGB;
  /* その色の上に載せる文字の色（黒か白の、読みやすいほう） */
  BT.inkOn = function (hex) {
    const [r, g, b] = hexRGB(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return L > 0.36 ? '#111111' : '#ffffff';
  };
  /* 自由に選んだ色の呼び名：いちばん近い見本の色の名前 */
  BT.nearestColorName = function (hex) {
    const [r, g, b] = hexRGB(hex);
    let best = null;
    BT.COLORS.forEach((c) => { const [r2, g2, b2] = hexRGB(c.hex); const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2; if (!best || d < best.d) best = { d, name: c.name }; });
    return best.name;
  };

  /* ---------- 背番号 ---------- */
  /* 全角の数字・記号を半角に */
  function toHalf(s) {
    return String(s || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[〜～~－ー−‐―]/g, '-').replace(/[、，,・／/\s]+/g, ' ');
  }
  /* 背番号として使えるか（0〜99 と 00。前に 0 が付いたもの '07' は 7 にそろえる） */
  BT.normNo = function (v) {
    const s = toHalf(v).trim();
    if (s === '00') return '00';
    if (!/^\d{1,2}$/.test(s)) return null;
    return String(Number(s));
  };
  /* 並べる順：数の小さい順（'0' の次に '00'） */
  BT.cmpNo = (a, b) => (Number(a) - Number(b)) || (String(a).length - String(b).length);
  BT.sortNos = (list) => list.slice().sort(BT.cmpNo);
  /* 「4-15, 23 33」「４〜１５」などを、背番号の並びにする（重なりは1つに。範囲は 0〜99） */
  BT.parseNumbers = function (text) {
    const out = new Set();
    toHalf(text).split(' ').forEach((tok) => {
      if (!tok) return;
      const m = /^(\d{1,2})-(\d{1,2})$/.exec(tok);
      if (m) {
        let a = Number(m[1]), b = Number(m[2]);
        if (a > b) [a, b] = [b, a];
        for (let i = a; i <= b && i <= 99; i++) out.add(String(i));
        return;
      }
      const n = BT.normNo(tok);
      if (n != null) out.add(n);
    });
    return BT.sortNos(Array.from(out));
  };
  /* 背番号の並びを、短い文字にする（4,5,6,7,9 → 「4-7, 9」） */
  BT.formatNumbers = function (nos) {
    const list = BT.sortNos(nos || []);
    const out = [];
    let i = 0;
    while (i < list.length) {
      if (list[i] === '00') { out.push('00'); i++; continue; }
      let j = i;
      while (j + 1 < list.length && list[j + 1] !== '00' && Number(list[j + 1]) === Number(list[j]) + 1) j++;
      out.push(j - i >= 2 ? `${list[i]}-${list[j]}` : list.slice(i, j + 1).join(', '));
      i = j + 1;
    }
    return out.join(', ');
  };

  /* ---------- 試合 ---------- */
  BT.uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function pad2(n) { return String(n).padStart(2, '0'); }
  /* エポックミリ秒 → その時差での「YYYY-MM-DD」「HH:MM:SS」（端末の時差に頼らない） */
  BT.ymdAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
  BT.hmsAt = function (ms, tz) { const d = new Date(ms + (tz || 0) * 60000); return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`; };
  BT.tzText = function (tz) { const s = tz < 0 ? '-' : '+', a = Math.abs(tz || 0); return s + pad2(Math.floor(a / 60)) + ':' + pad2(a % 60); };
  BT.localTz = () => -new Date().getTimezoneOffset();

  function blankTeam(i) { return { name: '', color: i ? '#2f6fed' : '#f4f4f4', colorName: i ? '青' : '白', players: [] }; }
  BT.blankTeam = blankTeam;

  BT.newGame = function (opts) {
    opts = opts || {};
    const now = opts.now || Date.now();
    const tz = opts.tz != null ? opts.tz : BT.localTz();
    const teams = [0, 1].map((i) => Object.assign(blankTeam(i), clone((opts.teams || [])[i] || {})));
    teams.forEach((t) => { t.players = cleanPlayers(t.players); });
    return { format: BT.FORMAT, version: BT.VERSION, id: opts.id || BT.uid('g'), title: opts.title || '', date: BT.ymdAt(now, tz), createdAt: now, startedAt: null, endedAt: null, tz, teams, events: [], seq: 0 };
  };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function cleanPlayers(list) {
    const seen = new Set(), out = [];
    (list || []).forEach((p) => {
      const no = BT.normNo(p && p.no != null ? p.no : p);
      if (no == null || seen.has(no)) return;
      seen.add(no);
      out.push({ no, name: String((p && p.name) || '').trim().slice(0, 12) });
    });
    return out.sort((a, b) => BT.cmpNo(a.no, b.no));
  }
  BT.cleanPlayers = cleanPlayers;
  /* 背番号の並びを、名簿にする（名前は、前の名簿に同じ番号があれば引き継ぐ） */
  BT.playersFromNos = function (nos, old) {
    const names = {};
    (old || []).forEach((p) => { names[p.no] = p.name; });
    return cleanPlayers(nos.map((no) => ({ no, name: names[no] || '' })));
  };

  /* スタートからの秒（0.1 秒まで） */
  BT.elapsed = function (game, now) {
    if (!game || !game.startedAt) return 0;
    const end = game.endedAt || now || Date.now();
    return Math.max(0, Math.round((end - game.startedAt) / 100) / 10);
  };

  /* 時刻の順（同じ時刻なら追加した順） */
  BT.sorted = function (game) {
    return (game.events || []).map((e, i) => ({ e, i })).sort((a, b) => (a.e.t - b.e.t) || (a.i - b.i)).map((x) => x.e);
  };
  /* その時刻のピリオド（1〜）。'period' が無ければ 1 */
  BT.periodAt = function (game, t) {
    let p = 1, best = -Infinity;
    (game.events || []).forEach((e) => { if (e.type === 'period' && e.t <= t + 1e-9 && e.t >= best) { best = e.t; p = e.period; } });
    return p;
  };
  BT.currentPeriod = (game, now) => BT.periodAt(game, BT.elapsed(game, now));
  BT.periodLabel = (p) => (p <= 4 ? p + 'Q' : 'OT' + (p - 4));

  /* イベントを足す（時刻 t は呼び出し側が決める）。戻り値：足したイベント
     team が 0・1 でなければ「チームなし」（null）。ただし得点のプレーは、チームなしにできないので 0（自分）にする */
  BT.addEvent = function (game, ev) {
    game.seq = (game.seq || 0) + 1;
    const e = { id: 'e' + game.seq, t: Math.round((ev.t || 0) * 10) / 10, type: ev.type };
    if (ev.type === 'period') e.period = ev.period;
    else {
      const d = BT.TYPE[ev.type];
      e.team = ev.team === 0 || ev.team === 1 ? ev.team : d && d.pts ? 0 : null;
      e.no = e.team != null && ev.no != null ? String(ev.no) : null;
    }
    game.events.push(e);
    return e;
  };
  /* 💬 コメント・スタンプをそろえる（形の合わないものは捨てる。くわしい形は js/notes.js） */
  BT.cleanNotes = function (list) {
    const out = (Array.isArray(list) ? list : []).filter((n) => n && isFinite(n.t) && n.t >= 0).slice(0, 500).map((n) => ({
      id: /^n\d{1,6}$/.test(n.id || '') ? n.id : '', t: Math.round(n.t * 100) / 100, dur: isFinite(n.dur) && n.dur > 0 ? Math.min(30, +n.dur) : 5,
      text: String(n.text || '').trim().slice(0, 60), stamps: (Array.isArray(n.stamps) ? n.stamps : []).map(String).slice(0, 6),
      tags: (Array.isArray(n.tags) ? n.tags : []).map((w) => String(w).slice(0, 20)).filter(Boolean).slice(0, 8), at: isFinite(n.at) ? +n.at : 0
    })).filter((n) => n.text || n.stamps.length);
    // id がない・かぶっているものには、新しい番号を付ける
    let k = out.reduce((m, n) => Math.max(m, n.id ? Number(n.id.slice(1)) : 0), 0);
    const seen = new Set();
    out.forEach((n) => { if (!n.id || seen.has(n.id)) n.id = 'n' + (++k); seen.add(n.id); });
    return out;
  };
  /* 動画を見ながら記録した試合か（t は動画の時刻） */
  BT.isReview = (game) => !!(game && game.mode === 'video');
  BT.findEvent = (game, id) => (game.events || []).find((e) => e.id === id) || null;
  BT.removeEvent = function (game, id) {
    const i = (game.events || []).findIndex((e) => e.id === id);
    if (i < 0) return null;
    return game.events.splice(i, 1)[0];
  };

  /* ---------- 記録の画面の並べ方 ----------
     選手1人＝1行（背番号＋「2P」「3P」「FT」「リバ」）。画面の大きさと人数から、
       arr：2チームを左右に並べる（side）か、上下に重ねる（stack）か
       c  ：チームの中を何列にするか（列の中は、上から背番号の小さい順）
     を決める。ボタンの「幅」と「高さ」の小さいほうが、いちばん大きくなるもの（同じくらいなら、列が少なく、左右に並べるもの）。
     相手の背番号を入れないとき（相手は1行だけ）は、自分のチームを画面の幅いっぱいに使えるよう、上下に重ねることが多い。
     ボタンの幅が MIN_BW より狭くなる並べ方は選ばない（高さが足りないときは、行を縦にすべらせる）。
     数字は css/app.css の記録の画面と合わせている（すきま・ふち） */
  BT.LAYOUT = { pad: 4, gap: 6, border: 2, rpad: 4, rgap: 3, cgap: 8, bgap: 3, rmin: 28, rmax: 76, minBw: 27 };
  /* 行のボタンの幅：cellW（背番号の欄も入れた1行の幅）から。bw＝割合 1 のボタンの幅・bwMin＝いちばん細いボタンの幅（spec は rowSpec）。
     lines＝2 なら2段（1段に m2 こ・幅はみな同じ） */
  function rowWidths(cellW, spec, lines) {
    const K = BT.LAYOUT, sp = spec || BT.rowSpec();
    const nw = Math.round(BT.clamp(cellW * 0.2, 32, 64));
    if (lines === 2) { const bw2 = (cellW - nw - sp.m2 * K.bgap) / sp.m2; return { nw, bw: bw2, bwMin: bw2 }; }
    const bw = (cellW - nw - sp.k * K.bgap) / sp.units;
    return { nw, bw, bwMin: bw * sp.minW };
  }
  /* 2段の行の高さ（1段の高さ lineH から）・1段の高さ（行の高さから） */
  const lineOf = (rowH, lines) => (lines === 2 ? (rowH - BT.LAYOUT.bgap) / 2 : rowH);
  BT.lineOf = lineOf;
  BT.planLayout = function (W, H, n, headH, spec) {
    const K = BT.LAYOUT;
    const one = planLines(W, H, n, headH, spec, 1);
    // 1段ではボタンが細くなりすぎるとき（ボタンを多く足したスマホの縦など）だけ、2段の行を考える
    if (one.wide < K.minBw && spec && spec.k >= 6) {
      const two = planLines(W, H, n, headH, spec, 2);
      if (two.wide >= K.minBw || two.wide > one.wide) return two;
    }
    return one;
  };
  function planLines(W, H, n, headH, spec, lines) {
    const K = BT.LAYOUT;
    const fixed = 2 * K.border + headH + 2 * K.rpad;         // チームの枠の中で、行でない高さ（帯・ふち・すきま）
    const rmax = lines === 2 ? 2 * K.rmax + K.bgap : K.rmax;
    const cand = [];
    ['side', 'stack'].forEach((arr) => {
      for (let c0 = 1; c0 <= 3; c0++) {
        for (let c1 = 1; c1 <= 3; c1++) {
          const c = [c0, c1];
          if (c0 > n[0] || c1 > n[1]) continue;
          const r = [Math.ceil(n[0] / c0), Math.ceil(n[1] / c1)];
          let teamW, rowH;
          if (arr === 'side') {
            teamW = (W - 2 * K.pad - K.gap) / 2;
            rowH = r.map((ri) => (H - fixed - (ri - 1) * K.rgap) / ri);
          } else {
            teamW = W - 2 * K.pad;
            const one = (H - K.gap - 2 * fixed - (r[0] - 1 + r[1] - 1) * K.rgap) / (r[0] + r[1]);
            rowH = [one, one];
          }
          const teams = [0, 1].map((i) => {
            const cellW = (teamW - 2 * K.border - 2 * K.rpad - (c[i] - 1) * K.cgap) / c[i];
            const rw = rowWidths(cellW, spec, lines);
            const rh = Math.min(rowH[i], rmax);
            const t = { c: c[i], r: r[i], cellW, nw: rw.nw, bw: rw.bw, bwMin: rw.bwMin, rowH: rh, base: fixed + (r[i] - 1) * K.rgap };
            if (lines === 2) Object.assign(t, { lines: 2, lineH: lineOf(rh, 2) });
            return t;
          });
          // ボタンの押しやすさ：（いちばん細いボタンの）幅と高さの小さいほう（大きいほうが広いぶんも、少しだけ足す）
          const hOf = (x) => (x.lines === 2 ? x.lineH : x.rowH);
          const ease = (x) => Math.min(x.bwMin, hOf(x)) + 0.15 * Math.min(Math.abs(x.bwMin - hOf(x)), 30);
          const size = Math.min(...teams.map(ease));
          const wide = Math.min(...teams.map((x) => x.bwMin));
          // 列を増やすのは、ボタンが十分に大きくなるときだけ（押しやすい大きさなら、1列のほうが見やすい）
          const colCost = (size >= 34 ? 5 : 1) * (c0 - 1 + c1 - 1);
          const score = Math.min(size, 44) + 0.1 * Math.max(0, Math.min(size, 64) - 44) - colCost - (arr === 'stack' ? 1.5 : 0);
          cand.push({ arr, teams, size, wide, score, scroll: teams.some((x) => hOf(x) < K.rmin) });
        }
      }
    });
    const okW = cand.filter((x) => x.wide >= K.minBw);
    const pool = okW.length ? okW : [cand.slice().sort((a, b) => b.wide - a.wide)[0]];
    return pool.sort((a, b) => b.score - a.score)[0];
  }

  /* 1つのチームだけを、W×H の枠（チームの枠の外側の大きさ）に並べるときの列の数。
     ワイプ「特大」で、相手チームを映像の下に小さく置くとき・自分のチームだけを残りに並べるときに使う。
     考え方は planLayout と同じ（ボタンの幅と高さの小さいほうが大きいもの。列を増やすのは、ボタンが十分に大きくなるときだけ）。
     maxC：列の数の上限（相手チームは 4 まで） */
  BT.planTeam = function (W, H, n, headH, maxC, spec) {
    const K = BT.LAYOUT;
    const one = teamLines(W, H, n, headH, maxC, spec, 1);
    if (one.bwMin < K.minBw && spec && spec.k >= 6) {          // 1段ではボタンが細くなりすぎるときだけ、2段の行
      const two = teamLines(W, H, n, headH, maxC, spec, 2);
      if (two.bwMin >= K.minBw || two.bwMin > one.bwMin) return two;
    }
    return one;
  };
  function teamLines(W, H, n, headH, maxC, spec, lines) {
    const K = BT.LAYOUT;
    const fixed = 2 * K.border + headH + 2 * K.rpad;
    const rmax = lines === 2 ? 2 * K.rmax + K.bgap : K.rmax;
    const rows = Math.max(1, n || 0);
    const cand = [];
    for (let c = 1; c <= Math.min(maxC || 3, rows); c++) {
      const r = Math.ceil(rows / c);
      const cellW = (W - 2 * K.border - 2 * K.rpad - (c - 1) * K.cgap) / c;
      const { nw, bw, bwMin } = rowWidths(cellW, spec, lines);
      const rowH = Math.min((H - fixed - (r - 1) * K.rgap) / r, rmax);
      const lh = lineOf(rowH, lines);
      const size = Math.min(bwMin, lh) + 0.15 * Math.min(Math.abs(bwMin - lh), 30);
      const colCost = (size >= 34 ? 5 : 1) * (c - 1);
      const score = Math.min(size, 44) + 0.1 * Math.max(0, Math.min(size, 64) - 44) - colCost;
      const t = { c, r, cellW, nw, bw, bwMin, rowH, base: fixed + (r - 1) * K.rgap, size, score, scroll: lh < K.rmin };
      if (lines === 2) Object.assign(t, { lines: 2, lineH: lh });
      cand.push(t);
    }
    const okW = cand.filter((x) => x.bwMin >= K.minBw);
    const pool = okW.length ? okW : [cand.slice().sort((a, b) => b.bwMin - a.bwMin)[0]];
    const still = pool.filter((x) => !x.scroll);               // 縦にすべらない並べ方があれば、そちらを（列が増えても）
    return (still.length ? still : pool).sort((a, b) => b.score - a.score)[0];
  }

  /* ---------- 試合時間（止められる時計） ----------
     記録の時刻 t（スタートからの時間・動画の時刻）は、止まらずに進む。それとは別に、笛で止まる「試合時間」を持てる（設定でオン）。
     game.gc = {
       len: ピリオドの長さ（秒。600＝10分・480＝8分・360＝6分・300＝5分。0 は長さを決めない＝進んだ時間を数える）,
       ot : 延長の長さ（秒）,
       ev : [ { t, on: 1|0 }（その時刻 t に、動かした・止めた） | { t, set: 秒 }（その時刻に、進んだ時間をこの値に合わせた） ]（追加した順）
     }
     ・ピリオドが始まる（'period' の時刻）と、進んだ時間は 0 に戻り、時計は動き出す（その同じ時刻に { on: 0 } があれば、止まったまま）。
     ・試合時間は「その時刻より前の ev を、時刻の順にたどる」だけで決まる。動画を戻しても、その時刻の試合時間が出る。
     ・長さを決めているときは、残り 0:00 で止まる（done）。 */
  BT.GC_LENS = [600, 480, 360, 300, 0];
  const r1 = (v) => Math.round(v * 10) / 10;
  /* 延長の長さ：10分のピリオドなら 5分、それより短いピリオドなら 3分（決めないときは 0） */
  BT.gcOtOf = (len) => (!len ? 0 : len >= 600 ? 300 : 180);
  /* 新しい時計。stopped：はじめは止めておく（動画を見ながら記録：動画のはじめは、まだティップオフの前のことが多い） */
  BT.newClock = function (len, stopped) {
    const L = BT.GC_LENS.includes(+len) ? +len : 600;
    return { len: L, ot: BT.gcOtOf(L), ev: stopped ? [{ t: 0, on: 0 }] : [] };
  };
  BT.gcLenOf = (gc, period) => (!gc || !gc.len ? 0 : period > 4 ? (isFinite(gc.ot) && gc.ot > 0 ? +gc.ot : BT.gcOtOf(gc.len)) : +gc.len);
  /* その時刻 t の試合時間 → { period, used（このピリオドで進んだ秒）, left（残りの秒。長さを決めていなければ null）, len, running, done } | null（時計のない試合） */
  BT.gameClock = function (game, t) {
    const gc = game && game.gc;
    if (!gc || !Array.isArray(gc.ev)) return null;
    let ps = 0, p = 1, best = -Infinity;
    (game.events || []).forEach((e) => { if (e.type === 'period' && e.t <= t + 1e-9 && e.t >= best) { best = e.t; ps = e.t; p = e.period; } });
    const len = BT.gcLenOf(gc, p);
    const cap = (u) => (len ? Math.min(len, u) : u);
    let used = 0, running = true, cur = ps;
    gc.ev.map((e, i) => ({ e, i })).filter((x) => x.e && x.e.t >= ps - 1e-9 && x.e.t <= t + 1e-9).sort((a, b) => (a.e.t - b.e.t) || (a.i - b.i)).forEach(({ e }) => {
      if (running) used = cap(used + Math.max(0, e.t - cur));
      cur = Math.max(cur, e.t);
      if (e.set != null) used = cap(Math.max(0, +e.set || 0)); else running = !!e.on;
    });
    if (running) used = cap(used + Math.max(0, t - cur));
    used = r1(used);
    const done = !!len && used >= len;
    return { period: p, used, left: len ? r1(len - used) : null, len, running: running && !done, done };
  };
  /* 画面・一覧に出す文字：長さを決めていれば残り（秒は切り上げ：0:00 は、終わったときだけ）、決めていなければ進んだ時間 */
  BT.gcText = (c) => (!c ? '' : c.left != null ? BT.fmtTime(Math.ceil(c.left - 1e-6)) : BT.fmtTime(Math.floor(c.used + 1e-6)));
  /* 「1Q 残り 7:32」「1Q 2:28」 */
  BT.gcLabel = (c) => (!c ? '' : `${BT.periodLabel(c.period)} ${c.left != null ? '残り ' : ''}${BT.gcText(c)}`);
  /* 止める・動かす（時刻 t で）。戻り値：そのあとの試合時間。残り 0:00 のあとは動かせない（null） */
  BT.gcToggle = function (game, t) {
    const c = BT.gameClock(game, t);
    if (!c || c.done) return null;
    game.gc.ev.push({ t: r1(t), on: c.running ? 0 : 1 });
    return BT.gameClock(game, t);
  };
  /* 進んだ時間を合わせる（時刻 t で、used 秒に）。ずれたときの手直し */
  BT.gcSet = function (game, t, used) {
    const c = BT.gameClock(game, t);
    if (!c) return null;
    game.gc.ev.push({ t: r1(t), set: r1(BT.clamp(+used || 0, 0, c.len || 5999)) });
    return BT.gameClock(game, t);
  };
  /* 読み込んだ時計の形をそろえる（合わないものは捨てる） */
  BT.cleanClock = function (gc) {
    if (!gc || typeof gc !== 'object' || !Array.isArray(gc.ev)) return null;
    const out = BT.newClock(gc.len, false);
    if (isFinite(gc.ot) && gc.ot >= 0 && gc.ot <= 1800) out.ot = Math.round(gc.ot);
    gc.ev.slice(0, 2000).forEach((e) => {
      if (!e || !isFinite(e.t) || e.t < 0) return;
      if (e.set != null) { if (isFinite(e.set) && e.set >= 0) out.ev.push({ t: r1(+e.t), set: r1(Math.min(5999, +e.set)) }); }
      else out.ev.push({ t: r1(+e.t), on: e.on ? 1 : 0 });
    });
    return out;
  };

  /* ---------- 集計 ---------- */
  BT.score = function (game, until) {
    const s = [0, 0];
    (game.events || []).forEach((e) => {
      const d = BT.TYPE[e.type];
      if (d && d.pts && e.team != null && (until == null || e.t <= until)) s[e.team] += d.pts;
    });
    return s;
  };
  /* ボタンに出す数：「チーム:背番号:種類」→ 回数（チームなしは「-」、番号なしは空）。「*:種類」は、その種類の全部の数 */
  BT.tally = function (game) {
    const m = {};
    (game.events || []).forEach((e) => {
      if (e.type === 'period') return;
      const k = (e.team == null ? '-' : e.team) + ':' + (e.no == null ? '' : e.no) + ':' + e.type;
      m[k] = (m[k] || 0) + 1;
      m['*:' + e.type] = (m['*:' + e.type] || 0) + 1;
    });
    return m;
  };
  /* ピリオドごとの得点 [{ period, label, pts: [自分, 相手] }]（記録のあるピリオドと、始めたピリオド） */
  BT.periodScores = function (game) {
    const map = new Map();
    const get = (p) => { if (!map.has(p)) map.set(p, { period: p, label: BT.periodLabel(p), pts: [0, 0] }); return map.get(p); };
    (game.events || []).forEach((e) => {
      if (e.type === 'period') { get(e.period); return; }
      const d = BT.TYPE[e.type];
      const row = get(BT.periodAt(game, e.t));
      if (d && d.pts && e.team != null) row.pts[e.team] += d.pts;
    });
    if (!map.size) get(1);
    return Array.from(map.values()).sort((a, b) => a.period - b.period);
  };
  /* ピリオドごとのチームファウルの数：Map（ピリオド → [自分, 相手]）。ファウルの記録がなければ空 */
  BT.periodFouls = function (game) {
    const map = new Map();
    (game.events || []).forEach((e) => {
      if (e.type !== 'foul' || (e.team !== 0 && e.team !== 1)) return;
      const p = BT.periodAt(game, e.t);
      if (!map.has(p)) map.set(p, [0, 0]);
      map.get(p)[e.team]++;
    });
    return map;
  };
  /* オフェンスリバウンドか（分けずに「リバ」で記録したもの）：その少し前（10 秒以内・間にリバウンドがない）の外れたシュートが、同じチームのもの。
     「Oリバ」「Dリバ」で記録したものは、押したとおり（ここには入れない） */
  BT.offensiveRebounds = function (game) {
    const set = new Set();
    let lastMiss = null;
    BT.sorted(game).forEach((e) => {
      const d = BT.TYPE[e.type];
      if (!d || e.type === 'period') return;
      if (d.shot && !d.made) { lastMiss = e; return; }
      if (d.kind === 'reb') {
        if (e.type === 'reb' && lastMiss && e.t - lastMiss.t <= 10 && lastMiss.team === e.team) set.add(e.id);
        lastMiss = null;
        return;
      }
      if (d.shot && d.made) lastMiss = null;
    });
    return set;
  };
  /* 「Oリバ」「Dリバ」で記録したリバウンドがあるか（あれば、集計に OR・DR の列を出す） */
  BT.hasRebSplit = (game) => (game.events || []).some((e) => e.type === 'oreb' || e.type === 'dreb');
  const STAT_KEYS = ['pts', 'fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta', 'reb', 'oreb', 'dreb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'];
  BT.STAT_KEYS = STAT_KEYS;
  function zero() { const o = {}; STAT_KEYS.forEach((k) => { o[k] = 0; }); return o; }
  /* 選手ごとの集計：[{ team, rows: [{ no, name, s }], unknown: s（番号なし）, total: s }]（rows は名簿の番号＋記録にある番号） */
  BT.stats = function (game) {
    const oreb = BT.offensiveRebounds(game);
    return [0, 1].map((tm) => {
      const team = game.teams[tm] || blankTeam(tm);
      const byNo = new Map();
      team.players.forEach((p) => byNo.set(p.no, { no: p.no, name: p.name, s: zero() }));
      const unknown = zero(), total = zero();
      (game.events || []).forEach((e) => {
        if (e.type === 'period' || e.team !== tm) return;
        let s = unknown;
        if (e.no != null) {
          if (!byNo.has(e.no)) byNo.set(e.no, { no: e.no, name: '', s: zero(), extra: true });
          s = byNo.get(e.no).s;
        }
        [s, total].forEach((x) => add(x, e, oreb));
      });
      const rows = Array.from(byNo.values()).sort((a, b) => BT.cmpNo(a.no, b.no));
      return { team: tm, rows, unknown, total };
    });
  };
  /* チームなしの記録（画面の下の「パスミス」「★」）の集計 */
  BT.teamlessStats = function (game) {
    const oreb = BT.offensiveRebounds(game);
    const s = zero();
    (game.events || []).forEach((e) => { if (e.type !== 'period' && e.team == null) add(s, e, oreb); });
    return s;
  };
  function add(s, e, oreb) {
    const d = BT.TYPE[e.type];
    if (!d) return;
    s.pts += d.pts || 0;
    if (d.shot === 'fg2') { s.fg2a++; if (d.made) s.fg2m++; }
    else if (d.shot === 'fg3') { s.fg3a++; if (d.made) s.fg3m++; }
    else if (d.shot === 'ft') { s.fta++; if (d.made) s.ftm++; }
    else if (d.kind === 'reb') { s.reb++; if (d.reb === 'o' || oreb.has(e.id)) s.oreb++; if (d.reb === 'd') s.dreb++; }
    else if (s[e.type] != null) s[e.type]++;
  }
  BT.pct = (m, a) => (a ? Math.round(100 * m / a) + '%' : '—');
  /* 外れたシュート（前の版の「失敗」のボタン）の記録があるか。なければ、成功率は出さない（入れた本数だけ） */
  BT.hasMisses = (game) => (game.events || []).some((e) => { const d = BT.TYPE[e.type]; return d && d.shot && !d.made; });
  BT.isEmpty = (s) => STAT_KEYS.every((k) => !s[k]);

  /* ---------- シュートの場所 ----------
     ハーフコート（FIBA）：幅 15 m・奥行き 14 m。ゴールの中心はベースラインから 1.575 m（まん中）。
     3P の線：ゴールの中心から 6.75 m の弧と、サイドラインから 0.9 m 内側のまっすぐな線（ベースラインから弧とつながる所まで）。
     ペイント：幅 4.9 m × 奥行き 5.8 m・フリースローサークル 半径 1.8 m・ノーチャージの半円 半径 1.25 m。
     場所は x・y（0〜1）で持ち、メートルにするときは x×15・y×14。 */
  const CT = BT.COURT = { W: 15, D: 14, bx: 7.5, by: 1.575, r3: 6.75, c3: 0.9, pw: 4.9, pd: 5.8, ftR: 1.8, ncR: 1.25 };
  CT.y3 = CT.by + Math.sqrt(CT.r3 * CT.r3 - (CT.bx - CT.c3) * (CT.bx - CT.c3));      // コーナーのまっすぐな線が、弧とつながる所（約 2.99 m）
  BT.SHOT_LOC_TYPES = ['fg2', 'fg3', 'fg2x', 'fg3x'];        // 場所を記録するプレー（フリースローは、いつも同じ所なので聞かない）
  BT.isLocShot = (type) => BT.SHOT_LOC_TYPES.includes(type);
  BT.hasLoc = (e) => !!(e && BT.isLocShot(e.type) && okLoc(e.x) && okLoc(e.y));
  function okLoc(v) { return typeof v === 'number' && isFinite(v) && v >= 0 && v <= 1; }
  BT.locRound = (v) => Math.round(BT.clamp(v, 0, 1) * 1000) / 1000;
  BT.SECTOR = 22.5;          // 「正面」の角度の幅（ゴールの真上から左右に 22.5°）。3P はさらに 67.5° より外を「コーナー」
  /* ゾーン（表に並べる順）。court：'std'（3P の線あり）| 'mini'（ミニバス：3P がないので、6.75 m より遠くは「ロング」） */
  BT.SHOT_ZONES = function (court) {
    const z = [['rim', 'ゴール下'], ['paint', 'ペイント'], ['midL', 'ミドル左'], ['midC', 'ミドル正面'], ['midR', 'ミドル右']];
    if (court === 'mini') z.push(['longL', 'ロング左'], ['longC', 'ロング正面'], ['longR', 'ロング右']);
    else z.push(['c3L', '3P 左コーナー'], ['w3L', '3P 左ウィング'], ['t3', '3P トップ'], ['w3R', '3P 右ウィング'], ['c3R', '3P 右コーナー']);
    return z.map(([id, label]) => ({ id, label }));
  };
  /* 場所 → ゾーン { id, label }。決め方（メートル。dx・dy はゴールの中心から、d はその距離、a はゴールの真上（センターの向き）からの角度。右が＋）：
       1. d ≦ 1.25（ノーチャージの半円の中）            → ゴール下
       2. ペイントの中（|dx| ≦ 2.45 かつ y ≦ 5.8。線の上も中） → ペイント
       3. 3P の外（std）：y ≦ 約 2.99 なら |dx| > 6.6、それより上なら d > 6.75（線の上は 2P）
            |a| ≦ 22.5° → 3P トップ・|a| ≦ 67.5° → 3P 左／右ウィング・それより外（ゴールより下も） → 3P 左／右コーナー
          mini：d > 6.75 → ロング（|a| ≦ 22.5° は正面、ほかは左／右）
       4. そのほか → ミドル（|a| ≦ 22.5° は正面、ほかは左／右） */
  BT.shotZone = function (x, y, court) {
    const X = BT.clamp(+x || 0, 0, 1) * CT.W, Y = BT.clamp(+y || 0, 0, 1) * CT.D;
    const dx = X - CT.bx, dy = Y - CT.by, d = Math.hypot(dx, dy);
    const a = Math.atan2(dx, dy) * 180 / Math.PI;          // 0：真上・+90：右のベースラインの向き
    const side = (l, c, r) => (Math.abs(a) <= BT.SECTOR ? c : a < 0 ? l : r);
    let id;
    if (d <= CT.ncR) id = 'rim';
    else if (Math.abs(dx) <= CT.pw / 2 && Y <= CT.pd) id = 'paint';
    else if (court === 'mini') id = d > CT.r3 ? side('longL', 'longC', 'longR') : side('midL', 'midC', 'midR');
    else if (Y <= CT.y3 ? Math.abs(dx) > CT.bx - CT.c3 : d > CT.r3) id = Math.abs(a) <= BT.SECTOR ? 't3' : Math.abs(a) <= 90 - BT.SECTOR ? (a < 0 ? 'w3L' : 'w3R') : (a < 0 ? 'c3L' : 'c3R');
    else id = side('midL', 'midC', 'midR');
    return BT.SHOT_ZONES(court).find((z) => z.id === id);
  };
  /* 試合のコート（場所を記録したときのもの。なければ 'std'） */
  BT.courtOf = (game, court) => (court === 'mini' || court === 'std' ? court : game && game.court === 'mini' ? 'mini' : 'std');
  /* シュートの場所の集計。opt：{ team（0・1。なければ両方）, no（背番号。なければ全員）, court }
     → { court, zones: [{ id, label, made, att }]（表の順）, byZone: { id: 同じもの }, shots: [{ e, x, y, made, zone }]（場所のあるもの）, located, unlocated } */
  BT.shotStats = function (game, opt) {
    const o = opt || {};
    const court = BT.courtOf(game, o.court);
    const zones = BT.SHOT_ZONES(court).map((z) => ({ id: z.id, label: z.label, made: 0, att: 0 }));
    const byZone = {};
    zones.forEach((z) => { byZone[z.id] = z; });
    const shots = [];
    let unlocated = 0;
    (game.events || []).forEach((e) => {
      if (!BT.isLocShot(e.type)) return;
      if ((o.team === 0 || o.team === 1) && e.team !== o.team) return;
      if (o.no != null && e.no !== String(o.no)) return;
      if (!BT.hasLoc(e)) { unlocated++; return; }
      const made = !!BT.TYPE[e.type].made;
      const zone = BT.shotZone(e.x, e.y, court);
      const z = byZone[zone.id];
      z.att++;
      if (made) z.made++;
      shots.push({ e, x: e.x, y: e.y, made, zone });
    });
    return { court, zones, byZone, shots, located: shots.length, unlocated };
  };
  /* 場所を記録したシュートがあるか（あれば、集計に「シュートの場所」・CSV に場所の列） */
  BT.hasShotLoc = (game) => (game.events || []).some(BT.hasLoc);

  /* ---------- 名前 ---------- */
  /* チームの呼び名（名前がなければ「自分」「相手」。チームなし（null）は空） */
  BT.teamName = (game, tm) => { if (tm !== 0 && tm !== 1) return ''; const t = game.teams[tm] || {}; return (t.name || '').trim() || (tm ? '相手' : '自分'); };
  BT.playerName = function (game, tm, no) {
    const p = ((game.teams[tm] || {}).players || []).find((x) => x.no === no);
    return p ? p.name : '';
  };
  /* 一覧・書き出しの呼び名：「#7 たけし 2P成功」「1Q 開始」 */
  BT.eventText = function (game, e, withTeam) {
    if (e.type === 'period') return `${BT.periodLabel(e.period)} 開始`;
    const d = BT.TYPE[e.type] || { label: e.type };
    const who = e.team != null && e.no != null ? `#${e.no}${BT.playerName(game, e.team, e.no) ? ' ' + BT.playerName(game, e.team, e.no) : ''}` : '';
    return [withTeam ? BT.teamName(game, e.team) : '', who, d.label].filter(Boolean).join(' ');
  };

  /* ---------- 書き出し ---------- */
  /* JSON（ほかのアプリが読めるよう、ピリオドと種類の呼び名も付ける） */
  BT.exportData = function (game) {
    const g = clone(game);
    g.format = BT.FORMAT; g.version = BT.VERSION;
    g.events = BT.sorted(game).map((e) => {
      const o = Object.assign({}, e);
      if (e.type !== 'period') o.period = BT.periodAt(game, e.t);
      return o;
    });
    g.startedAtText = game.startedAt ? `${BT.ymdAt(game.startedAt, game.tz)} ${BT.hmsAt(game.startedAt, game.tz)} (UTC${BT.tzText(game.tz)})` : null;
    g.score = BT.score(game);
    g.types = {};
    BT.TYPES.forEach((d) => { g.types[d.id] = { label: d.label, pts: d.pts }; });
    g.app = BT.APP;
    delete g.seq;
    return g;
  };
  /* ファイル名に使える文字だけに */
  BT.safeName = (s) => String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
  BT.fileBase = function (game) {
    const hm = game.startedAt ? BT.hmsAt(game.startedAt, game.tz).slice(0, 5).replace(':', '') : '';
    return ['バスケ記録', game.date, hm, BT.safeName(BT.teamName(game, 0)) + 'vs' + BT.safeName(BT.teamName(game, 1))].filter(Boolean).join('_');
  };
  function csvCell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function csv(rows) { return rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
  /* 記録の一覧（CSV）。Excel で文字化けしないよう、先頭の BOM は呼び出し側で付ける */
  BT.eventsCSV = function (game) {
    const rows = [['No', '時刻', 'スタートからの秒', 'ピリオド', 'チーム', '背番号', '名前', 'プレー', '得点', `${BT.teamName(game, 0)}の得点`, `${BT.teamName(game, 1)}の得点`]];
    // シュートの場所を記録した試合だけ、いちばん後ろに場所の列（前からの列の位置は変えない）
    const loc = BT.hasShotLoc(game), court = BT.courtOf(game);
    if (loc) rows[0].push('場所X', '場所Y', '場所（ゾーン名）');
    const locCells0 = (e) => (!loc ? [] : BT.hasLoc(e) ? [e.x, e.y, BT.shotZone(e.x, e.y, court).label] : ['', '', '']);
    // 試合時間（止められる時計）を使った試合だけ、さらに後ろに「試合時間」の列（長さを決めていれば残り、決めていなければ進んだ時間）
    const gc = !!(game.gc && Array.isArray(game.gc.ev));
    if (gc) rows[0].push(game.gc.len ? '試合時間（残り）' : '試合時間（進んだ時間）');
    const locCells = (e) => locCells0(e).concat(gc ? [BT.gcText(BT.gameClock(game, e.t))] : []);
    const s = [0, 0];
    let n = 0;
    BT.sorted(game).forEach((e) => {
      if (e.type === 'period') { rows.push(['', BT.fmtTime(e.t), e.t, BT.periodLabel(e.period), '', '', '', `${BT.periodLabel(e.period)} 開始`, '', s[0], s[1], ...locCells(e)]); return; }
      const d = BT.TYPE[e.type] || { label: e.type, pts: 0 };
      if (e.team != null) s[e.team] += d.pts || 0;
      rows.push([++n, BT.fmtTime(e.t), e.t, BT.periodLabel(BT.periodAt(game, e.t)), BT.teamName(game, e.team), e.no != null ? e.no : '', e.no != null ? BT.playerName(game, e.team, e.no) : '', d.label, d.pts || '', s[0], s[1], ...locCells(e)]);
    });
    return csv(rows);
  };
  /* 選手ごとの集計（CSV） */
  BT.boxCSV = function (game) {
    const head = ['チーム', '背番号', '名前', '得点', '2P成功', '2P試投', '3P成功', '3P試投', 'FT成功', 'FT試投', 'リバウンド', 'うちオフェンス', 'うちディフェンス', 'アシスト', 'スティール', 'ブロック', 'パスミス', 'ターンオーバー', 'ファウル', '★'];
    const keys = ['pts', 'fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta', 'reb', 'oreb', 'dreb', 'ast', 'stl', 'blk', 'pass', 'tov', 'foul', 'mark'];
    const rows = [head];
    BT.stats(game).forEach((st) => {
      const name = BT.teamName(game, st.team);
      st.rows.forEach((r) => rows.push([name, r.no, r.name, ...keys.map((k) => r.s[k])]));
      if (!BT.isEmpty(st.unknown)) rows.push([name, '番号なし', '', ...keys.map((k) => st.unknown[k])]);
      rows.push([name, '合計', '', ...keys.map((k) => st.total[k])]);
    });
    const free = BT.teamlessStats(game);
    if (!BT.isEmpty(free)) rows.push(['チームなし', '', '', ...keys.map((k) => free[k])]);
    return csv(rows);
  };

  /* ---------- 読み込み（書き出した JSON を開き直す） ----------
     形が合わないものは、分かる言葉の Error にする */
  BT.importData = function (obj) {
    if (typeof obj === 'string') { try { obj = JSON.parse(obj); } catch (e) { throw new Error('JSON として読めませんでした'); } }
    if (!obj || typeof obj !== 'object') throw new Error('記録のファイルではないようです');
    if (obj.format !== BT.FORMAT) throw new Error('「バスケ タップ記録」で書き出したファイルではないようです');
    if (!Array.isArray(obj.events) || !Array.isArray(obj.teams)) throw new Error('記録の中身（events・teams）がありません');
    const g = BT.newGame({ id: typeof obj.id === 'string' ? obj.id.slice(0, 40) : undefined, title: String(obj.title || '').slice(0, 40), now: obj.createdAt || obj.startedAt || Date.now(), tz: isFinite(obj.tz) ? obj.tz : 540, teams: obj.teams.slice(0, 2).map(cleanTeam) });
    g.date = /^\d{4}-\d{2}-\d{2}$/.test(obj.date || '') ? obj.date : g.date;
    g.startedAt = isFinite(obj.startedAt) && obj.startedAt > 0 ? obj.startedAt : null;
    g.endedAt = isFinite(obj.endedAt) && obj.endedAt > 0 ? obj.endedAt : null;
    const vids = BT.cleanVideos(obj.videos);
    if (vids.length) g.videos = vids;
    if (obj.mode === 'video') {
      g.mode = 'video';
      const sr = obj.src && typeof obj.src === 'object' ? obj.src : {};
      g.src = { name: String(sr.name || '').slice(0, 120), size: +sr.size || null, duration: isFinite(sr.duration) ? +sr.duration : null, w: +sr.w || null, h: +sr.h || null };
    }
    const notes = BT.cleanNotes(obj.notes);
    if (notes.length) g.notes = notes;
    if (obj.court === 'std' || obj.court === 'mini') g.court = obj.court;
    const gc = BT.cleanClock(obj.gc);
    if (gc) g.gc = gc;
    // 場面の切り出し（動画ごとの時刻あわせ・絞り込み。js/trim.js）
    if (obj.trims && typeof obj.trims === 'object' && !Array.isArray(obj.trims)) {
      const tr = {};
      Object.keys(obj.trims).slice(0, 20).forEach((k) => { const v = obj.trims[k]; if (v && typeof v === 'object' && Array.isArray(v.anchors)) tr[String(k).slice(0, 200)] = JSON.parse(JSON.stringify(v)); });
      if (Object.keys(tr).length) { g.trims = tr; g.trimmed = !!obj.trimmed; if (typeof obj.trimLast === 'string') g.trimLast = obj.trimLast.slice(0, 200); }
    }
    // 記録の id は、そのまま使えるもの（e＋数・重ならない）は残し、そうでないものに新しい番号を付ける
    const okId = (id) => typeof id === 'string' && /^e\d{1,7}$/.test(id);
    g.seq = obj.events.reduce((m, e) => Math.max(m, e && okId(e.id) ? Number(e.id.slice(1)) : 0), 0);
    const used = new Set();
    obj.events.forEach((e) => {
      if (!e || !isFinite(e.t) || e.t < 0) return;
      let ev = null;
      if (e.type === 'period') { if (isFinite(e.period) && e.period >= 1) ev = BT.addEvent(g, { t: e.t, type: 'period', period: Math.min(20, Math.round(e.period)) }); }
      else if (BT.TYPE[e.type]) ev = BT.addEvent(g, { t: e.t, type: e.type, team: e.team, no: e.no != null ? BT.normNo(e.no) : null });
      if (!ev) return;
      // シュートの場所：2P・3P の成功と失敗で、0〜1 の数のときだけ残す
      if (BT.isLocShot(ev.type) && okLoc(e.x) && okLoc(e.y)) { ev.x = BT.locRound(e.x); ev.y = BT.locRound(e.y); }
      if (okId(e.id) && !used.has(e.id)) { g.seq--; ev.id = e.id; }      // addEvent が進めた番号を戻す
      while (used.has(ev.id)) ev.id = 'e' + (++g.seq);
      used.add(ev.id);
    });
    g.seq = g.events.reduce((m, e) => Math.max(m, Number(e.id.slice(1)) || 0), g.seq);
    return g;
  };
  /* 読み込んだチームの形をそろえる（名前・色・名簿） */
  function cleanTeam(t, i) {
    const b = blankTeam(i);
    if (!t || typeof t !== 'object') return b;
    const color = /^#[0-9a-f]{6}$/i.test(t.color || '') ? t.color : b.color;
    return { name: String(t.name || '').trim().slice(0, 20), color, colorName: String(t.colorName || BT.nearestColorName(color)).slice(0, 8), players: cleanPlayers(t.players) };
  }
  BT.cleanTeam = cleanTeam;

  /* 試合の一覧に出す短い情報 */
  BT.summary = function (game) {
    return { id: game.id, title: game.title || '', date: game.date, startedAt: game.startedAt, endedAt: game.endedAt, names: [BT.teamName(game, 0), BT.teamName(game, 1)], colors: [game.teams[0].color, game.teams[1].color], score: BT.score(game), n: (game.events || []).filter((e) => e.type !== 'period').length, videos: (game.videos || []).filter((v) => !v.gone).length, rv: BT.isReview(game), trim: !!game.trimmed, demo: !!game.demo || undefined, at: game.updatedAt || Date.now() };
  };
  /* 動画の情報をそろえる（読み込んだファイル用。形の合わないものは捨てる） */
  BT.cleanVideos = function (list) {
    return (Array.isArray(list) ? list : []).filter((v) => v && isFinite(v.startedAt) && v.startedAt > 0).slice(0, 50).map((v, i) => ({
      vid: String(v.vid || 'v' + i).slice(0, 40), n: isFinite(v.n) ? Math.round(v.n) : i + 1, startedAt: +v.startedAt,
      endedAt: isFinite(v.endedAt) ? +v.endedAt : null, duration: isFinite(v.duration) ? +v.duration : null,
      name: String(v.name || '').slice(0, 120), mime: String(v.mime || '').slice(0, 60), w: +v.w || null, h: +v.h || null, bytes: +v.bytes || null,
      status: 'done', gone: true,        // 読み込んだ記録の動画は、この端末にはない（ファイル名・時刻だけ）
      file: !!v.file                     // 動画を見ながら記録したときの、その動画（この端末で撮影したものではない）
    }));
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/lib/shot.js */
/* バスケ タップ記録 — シュートの場所の、コートの図（ハーフコートの SVG・押した所の読み取り・印）
   図の座標はメートル（幅 15・奥行き 14。ゴールが上）。場所は 0〜1 に直して記録する（形と決まりは core.js の BT.COURT）。
   SVG にしたのは、どの大きさでも線がくっきりし、押した所を getScreenCTM でそのまま読めるから。 */
(function (root) {
  'use strict';
  const BT = root.BT;
  const NS = 'http://www.w3.org/2000/svg';
  const C = BT.COURT;
  const PAD = 0.25;          // 外の線が切れないよう、まわりに少しすき間（メートル）

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    return e;
  }
  const line = (cls, d) => el('path', { class: cls, d, 'vector-effect': 'non-scaling-stroke' });

  /* ハーフコートの図。opt：{ court: 'std' | 'mini', shots: [{ x, y, made, color }], onTap(x, y), label } */
  function court(opt) {
    const o = opt || {};
    const svg = el('svg', { class: 'court' + (o.onTap ? ' tappable' : ''), viewBox: `${-PAD} ${-PAD} ${C.W + 2 * PAD} ${C.D + 2 * PAD}`, role: o.onTap ? 'button' : 'img', 'aria-label': o.label || 'ハーフコート（ゴールが上）' });
    svg.dataset.court = o.court === 'mini' ? 'mini' : 'std';
    const half = C.pw / 2, L = C.bx - half, R = C.bx + half;
    svg.append(
      el('rect', { class: 'cf', x: 0, y: 0, width: C.W, height: C.D }),
      el('rect', { class: 'cpaint', x: L, y: 0, width: C.pw, height: C.pd }),
      line('cl', `M0 0H${C.W}V${C.D}H0Z`),                                          // ベースライン・サイドライン・センターライン
      line('cl', `M${L} 0V${C.pd}H${R}V0`),                                         // ペイント
      line('cl', `M${C.bx - C.ftR} ${C.pd}A${C.ftR} ${C.ftR} 0 0 0 ${C.bx + C.ftR} ${C.pd}`),     // フリースローサークル（外の半分）
      line('cl dash', `M${C.bx - C.ftR} ${C.pd}A${C.ftR} ${C.ftR} 0 0 1 ${C.bx + C.ftR} ${C.pd}`),
      line('cl', `M${C.bx - C.ftR} ${C.D}A${C.ftR} ${C.ftR} 0 0 1 ${C.bx + C.ftR} ${C.D}`),       // センターサークル（半分）
      line('cl', `M${C.bx - C.ncR} 1.2V${C.by}A${C.ncR} ${C.ncR} 0 0 0 ${C.bx + C.ncR} ${C.by}V1.2`)  // ノーチャージの半円
    );
    if (o.court !== 'mini') {
      const xl = C.c3, xr = C.W - C.c3;
      svg.append(line('cl c3', `M${xl} 0V${C.y3}A${C.r3} ${C.r3} 0 0 0 ${xr} ${C.y3}V0`));
    }
    svg.append(
      line('cl board', `M${C.bx - 0.9} 1.2H${C.bx + 0.9}`),                          // ボード（ベースラインから 1.2 m）
      el('circle', { class: 'ring', cx: C.bx, cy: C.by, r: 0.225, 'vector-effect': 'non-scaling-stroke' }));
    const marks = el('g', { class: 'marks' });
    svg.append(marks);
    svg.__marks = marks;
    if (o.shots) setMarks(svg, o.shots);
    if (o.onTap) svg.addEventListener('click', (e) => { const p = pos(svg, e.clientX, e.clientY); if (p) o.onTap(p.x, p.y); });
    return svg;
  }

  /* 印：入った（made）は、チームの色の丸に濃いふち（白いユニフォームでも見えるように）・外れは ×（濃い色の下地の上にチームの色）。
     暗い画面では、まわりに白い輪（halo）も付ける（黒・紺のユニフォームが、暗い床に沈まないように） */
  function setMarks(svg, shots) {
    const g = svg.__marks;
    while (g.firstChild) g.firstChild.remove();
    (shots || []).forEach((s) => {
      const cx = s.x * C.W, cy = s.y * C.D, col = s.color || '#888';
      if (s.made !== false) {
        g.append(el('circle', { class: 'mk halo', cx, cy, r: 0.44 }), el('circle', { class: 'mk made', cx, cy, r: 0.34, fill: col, 'vector-effect': 'non-scaling-stroke' }));
      } else {
        const k = 0.28, d = `M${cx - k} ${cy - k}L${cx + k} ${cy + k}M${cx + k} ${cy - k}L${cx - k} ${cy + k}`;
        g.append(el('path', { class: 'mk missu', d, 'vector-effect': 'non-scaling-stroke' }), el('path', { class: 'mk miss', d, stroke: col, 'vector-effect': 'non-scaling-stroke' }));
      }
    });
  }

  /* 画面の位置（clientX・clientY）→ 場所（0〜1・0.001 まで。コートの外は、いちばん近いコートの端） */
  function pos(svg, cx, cy) {
    let mx, my;
    const m = svg.getScreenCTM && svg.getScreenCTM();
    if (m && svg.createSVGPoint) {
      const p = svg.createSVGPoint();
      p.x = cx; p.y = cy;
      const q = p.matrixTransform(m.inverse());
      mx = q.x; my = q.y;
    } else {
      const r = svg.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      mx = (cx - r.left) / r.width * (C.W + 2 * PAD) - PAD;
      my = (cy - r.top) / r.height * (C.D + 2 * PAD) - PAD;
    }
    return { x: BT.locRound(mx / C.W), y: BT.locRound(my / C.D) };
  }
  /* 場所（0〜1）→ 画面の位置（テストと、印の確かめ用） */
  function client(svg, x, y) {
    const m = svg.getScreenCTM();
    const p = svg.createSVGPoint();
    p.x = x * C.W; p.y = y * C.D;
    const q = p.matrixTransform(m);
    return { x: q.x, y: q.y };
  }

  BT.shot = {
    WAIT: 6000,          // 試合を見ながら記録するとき：これだけ押さなければ、場所の小窓を自動で閉じる（ミリ秒）
    court, setMarks, pos, client

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/lib/agg.js */
/* バスケ タップ記録 — これまでの試合の集計（画面を持たない部分。core.js のあとに読む。node のテストからも読める）
   画面は js/totals.js。数え方（画面の下の説明と同じ）：
   ・得点・リバウンド・アシスト・スティール・ファウルは、試合ごとの BT.stats を、選んだチームの側で足す
   ・ターンオーバー ＝ 選手の行の「ターンオーバー」（tov）＋ チームの付いた「パスミス」（pass）。チームなしのパスミスは、どちらにも数えない
   ・シュートの成功率は、外れも記録した試合（BT.hasMisses）だけで計算する（ほかの試合は入れた本数しかなく、打った数が分からない）。
     入れた本数・得点は、全部の試合から
   ・勝ち負けは、試合の最後の得点（BT.score）。同じなら引き分け
   ・1試合あたり ＝ 試合の数で割る（選手は、その番号の記録が1つでもある試合の数）
   ・「直近5試合」は、そのチームの試合のうち、スタートした時刻（なければ作った時刻）の新しい 5 試合

   ■ 使い方
     const list = BT.agg.eligible(games)                    … 集計に使える試合（デモでない・記録が1つ以上）
     const tm = BT.agg.teams(list, myName)                  → { list: [{ key, label, n, n0 }], def: key }
     const all = BT.agg.gamesFor(list, key)                 → [{ game, side }]（新しい順）
     const used = BT.agg.pick(all, { recent: 5, exclude })  → 集計に入れる試合
     const r = BT.agg.compute(used)                         → まとめ・選手ごと・試合ごと・ピリオドごと（下の compute の説明）
     BT.agg.shots(used, { court, no }) / BT.agg.trend(r, metric) / BT.agg.playersCSV(r) / BT.agg.gamesCSV(r) */
(function (root) {
  'use strict';
  const BT = root.BT;
  const A = {};

  const SH_KEYS = ['fg2m', 'fg2a', 'fg3m', 'fg3a', 'ftm', 'fta'];
  const SUM_KEYS = BT.STAT_KEYS.concat(['to']);
  const zeroS = () => { const o = {}; SUM_KEYS.forEach((k) => { o[k] = 0; }); return o; };
  const zeroSh = () => { const o = {}; SH_KEYS.forEach((k) => { o[k] = 0; }); return o; };
  function addTo(dst, src, keys) { keys.forEach((k) => { dst[k] += src[k] || 0; }); }
  /* BT.stats の1人分（またはチームの合計）に、ターンオーバー（tov ＋ チームの付いたパスミス）を足したもの */
  function withTo(s) { const o = Object.assign(zeroS(), s); o.to = (s.tov || 0) + (s.pass || 0); return o; }
  A.withTo = withTo;

  /* ---------- 試合を選ぶ ---------- */
  A.plays = (game) => (game && game.events || []).filter((e) => e.type !== 'period').length;
  A.when = (game) => (game && (game.startedAt || game.createdAt)) || 0;
  A.eligible = (games) => (games || []).filter((g) => g && !g.demo && Array.isArray(g.events) && Array.isArray(g.teams) && A.plays(g) > 0);
  const nameOf = (game, side) => String(((game.teams || [])[side] || {}).name || '').trim();
  A.BLANK = '';                                 // 自分の側の名前がない試合（まとめて「自分（名前なし）」）
  A.BLANK_LABEL = '自分（名前なし）';
  A.label = (key) => (key === A.BLANK ? A.BLANK_LABEL : key);
  /* その試合で、選んだチームはどちらの側か（0・1。入らなければ null） */
  A.sideOf = function (game, key) {
    if (key === A.BLANK) return nameOf(game, 0) ? null : 0;
    if (nameOf(game, 0) === key) return 0;
    if (nameOf(game, 1) === key) return 1;
    return null;
  };
  /* 選べるチーム（どちらかの側に出てくる名前。試合の多い順）。
     def：自分の側（teams[0]）にいちばん多く出てくる名前（同じなら、自分のチームとして覚えている名前 → 新しい試合の名前） */
  A.teams = function (games, myName) {
    const map = new Map();
    const get = (key) => { if (!map.has(key)) map.set(key, { key, label: A.label(key), n: 0, n0: 0, last: 0 }); return map.get(key); };
    games.forEach((g) => {
      const n0 = nameOf(g, 0), n1 = nameOf(g, 1), t = A.when(g);
      const a = get(n0); a.n++; a.n0++; a.last = Math.max(a.last, t);
      if (n1 && n1 !== n0) { const b = get(n1); b.n++; b.last = Math.max(b.last, t); }
    });
    const list = Array.from(map.values()).sort((a, b) => (b.n - a.n) || (b.n0 - a.n0) || (b.last - a.last));
    const mine = String(myName || '').trim();
    const def = list.slice().sort((a, b) => (b.n0 - a.n0) || ((mine && b.key === mine ? 1 : 0) - (mine && a.key === mine ? 1 : 0)) || (b.last - a.last))[0];
    return { list: list.map(({ key, label, n, n0 }) => ({ key, label, n, n0 })), def: def ? def.key : null };
  };
  /* そのチームの試合（新しい順）：[{ game, side }] */
  A.gamesFor = (games, key) => games.map((game) => ({ game, side: A.sideOf(game, key) })).filter((x) => x.side != null).sort((a, b) => A.when(b.game) - A.when(a.game));
  /* 直近 n 試合（0 ならすべて）にしぼってから、外した試合（exclude：id の配列か Set）を除く */
  A.recent = (list, n) => (n > 0 ? list.slice(0, n) : list.slice());
  A.pick = function (list, opt) {
    const o = opt || {};
    const ex = o.exclude instanceof Set ? o.exclude : new Set(o.exclude || []);
    return A.recent(list, o.recent || 0).filter((x) => !ex.has(x.game.id));
  };

  /* ---------- 割合 ---------- */
  A.ratio = (m, a) => (a > 0 ? m / a : null);
  /* 成功率（0〜1 か null）：fg2・fg3・ft・fg（2P＋3P）・efg（3P を 1.5 本に） */
  A.rates = (sh) => ({
    fg2: A.ratio(sh.fg2m, sh.fg2a), fg3: A.ratio(sh.fg3m, sh.fg3a), ft: A.ratio(sh.ftm, sh.fta),
    fg: A.ratio(sh.fg2m + sh.fg3m, sh.fg2a + sh.fg3a), efg: A.ratio(sh.fg2m + 1.5 * sh.fg3m, sh.fg2a + sh.fg3a)
  });
  A.fmtPct = (v) => (v == null || !isFinite(v) ? '—' : Math.round(v * 100) + '%');
  A.fmtAvg = (v) => (v == null || !isFinite(v) ? '—' : (Math.round(v * 10) / 10).toFixed(1));
  A.fmtDiff = (v) => (v == null || !isFinite(v) ? '—' : (v > 0.04 ? '+' : v < -0.04 ? '−' : '±') + (Math.round(Math.abs(v) * 10) / 10).toFixed(1));
  const shOf = (s) => { const o = zeroSh(); addTo(o, s, SH_KEYS); return o; };

  /* ---------- 集計 ----------
     entries：[{ game, side }] → {
       n（試合）, nMiss（外れも記録した試合）, w, l, d,
       pf・pa（得点・失点の合計）, us・op（自分・相手の合計。STAT_KEYS ＋ to）, usSh・opSh（成功率用：外れも記録した試合だけの 2P・3P・FT）,
       players: [{ no, name, games, s, sh }]（背番号の順）, unknown（番号なし。なければ null）, total（チームの合計。games ＝ n）,
       games: [{ id, date, when, title, opp, side, pf, pa, res: 'W'|'L'|'D', miss, going, s, o, sh, osh }]（新しい順）,
       periods: { n（ピリオドを記録した試合）, rows: [{ period, label, n, pf, pa }] },
       color（新しい試合の、選んだ側のユニフォームの色）
     } */
  A.compute = function (entries) {
    const list = (entries || []).slice().sort((a, b) => A.when(b.game) - A.when(a.game));
    const r = { n: list.length, nMiss: 0, w: 0, l: 0, d: 0, pf: 0, pa: 0, us: zeroS(), op: zeroS(), usSh: zeroSh(), opSh: zeroSh(), players: [], unknown: null, total: null, games: [], periods: { n: 0, rows: [] }, color: null };
    const byNo = new Map();
    const unk = { no: null, name: '', games: 0, s: zeroS(), sh: zeroSh() };
    const perMap = new Map();
    list.forEach(({ game, side }) => {
      const other = 1 - side;
      const st = BT.stats(game);
      const miss = BT.hasMisses(game);
      const sc = BT.score(game);
      const us = withTo(st[side].total), op = withTo(st[other].total);
      addTo(r.us, us, SUM_KEYS); addTo(r.op, op, SUM_KEYS);
      if (miss) { r.nMiss++; addTo(r.usSh, us, SH_KEYS); addTo(r.opSh, op, SH_KEYS); }
      const pf = sc[side], pa = sc[other];
      r.pf += pf; r.pa += pa;
      const res = pf > pa ? 'W' : pf < pa ? 'L' : 'D';
      if (res === 'W') r.w++; else if (res === 'L') r.l++; else r.d++;
      if (!r.color) r.color = ((game.teams || [])[side] || {}).color || null;
      r.games.push({ id: game.id, date: game.date || '', when: A.when(game), title: game.title || '', opp: BT.teamName(game, other), side, pf, pa, res, miss, going: !!(game.startedAt && !game.endedAt), s: us, o: op, sh: miss ? shOf(us) : null, osh: miss ? shOf(op) : null });
      // 選手（背番号ごと）。名前は、新しい試合の名前（空でないもの）
      st[side].rows.forEach((row) => {
        if (BT.isEmpty(row.s)) return;
        if (!byNo.has(row.no)) byNo.set(row.no, { no: row.no, name: '', games: 0, s: zeroS(), sh: zeroSh() });
        const p = byNo.get(row.no);
        p.games++;
        if (!p.name && row.name) p.name = row.name;
        const s = withTo(row.s);
        addTo(p.s, s, SUM_KEYS);
        if (miss) addTo(p.sh, s, SH_KEYS);
      });
      if (!BT.isEmpty(st[side].unknown)) {
        unk.games++;
        const s = withTo(st[side].unknown);
        addTo(unk.s, s, SUM_KEYS);
        if (miss) addTo(unk.sh, s, SH_KEYS);
      }
      // ピリオド：ピリオドを進めた試合（2 以上の 'period' がある）だけ（進めていない試合は、全部が 1Q に入ってしまうので）
      if ((game.events || []).some((e) => e.type === 'period' && e.period >= 2)) {
        r.periods.n++;
        BT.periodScores(game).forEach((p) => {
          if (!perMap.has(p.period)) perMap.set(p.period, { period: p.period, label: BT.periodLabel(p.period), n: 0, pf: 0, pa: 0 });
          const x = perMap.get(p.period);
          x.n++; x.pf += p.pts[side]; x.pa += p.pts[other];
        });
      }
    });
    r.players = Array.from(byNo.values()).sort((a, b) => BT.cmpNo(a.no, b.no));
    r.unknown = unk.games ? unk : null;
    r.total = { no: null, name: '合計', games: r.n, s: r.us, sh: r.usSh };
    r.periods.rows = Array.from(perMap.values()).sort((a, b) => a.period - b.period);
    return r;
  };

  /* ---------- シュートの場所 ----------
     選んだ側のシュート（場所のあるもの）を、全部の試合から。opt：{ court（'std'|'mini'。なければ、多いほう）, no（背番号。なければ全員） }
     → { court, courts: { std, mini }（場所のある試合の数）, zones: [{ id, label, made, att, madeAll }]（made・att は外れも記録した試合だけ。madeAll は全部）,
         shots: [{ x, y, made, no }]（図に打つ点。全部の試合）, nos（場所のある番号）, located, nGames（その場所の図に入る試合）, nMissGames（そのうち外れも記録した試合）, best, worst } */
  A.MIN_ZONE = 5;
  A.courtCounts = function (entries) {
    const c = { std: 0, mini: 0 };
    entries.forEach(({ game, side }) => { if ((game.events || []).some((e) => e.team === side && BT.hasLoc(e))) c[BT.courtOf(game)]++; });
    return c;
  };
  A.shots = function (entries, opt) {
    const o = opt || {};
    const courts = A.courtCounts(entries);
    const court = o.court === 'mini' || o.court === 'std' ? o.court : courts.mini > courts.std ? 'mini' : 'std';
    const zones = BT.SHOT_ZONES(court).map((z) => ({ id: z.id, label: z.label, made: 0, att: 0, madeAll: 0 }));
    const by = {};
    zones.forEach((z) => { by[z.id] = z; });
    const shots = [], nos = new Set();
    let nGames = 0, nMissGames = 0;
    entries.forEach(({ game, side }) => {
      if (BT.courtOf(game) !== court) return;
      const evs = (game.events || []).filter((e) => e.team === side && BT.hasLoc(e));
      if (!evs.length) return;
      nGames++;
      const miss = BT.hasMisses(game);
      if (miss) nMissGames++;
      evs.forEach((e) => {
        if (e.no != null) nos.add(e.no);
        if (o.no != null && e.no !== String(o.no)) return;
        const made = !!BT.TYPE[e.type].made;
        const z = by[BT.shotZone(e.x, e.y, court).id];
        if (made) z.madeAll++;
        if (miss) { z.att++; if (made) z.made++; }
        shots.push({ x: e.x, y: e.y, made, no: e.no });
      });
    });
    // いちばん入る・入らないゾーン（外れも記録した試合で、MIN_ZONE 本以上打ったゾーンだけ）
    const ok = zones.filter((z) => z.att >= A.MIN_ZONE).map((z) => Object.assign({ rate: z.made / z.att }, z));
    const best = ok.slice().sort((a, b) => (b.rate - a.rate) || (b.att - a.att))[0] || null;
    const worst = ok.length >= 2 ? ok.slice().sort((a, b) => (a.rate - b.rate) || (b.att - a.att))[0] : null;
    return { court, courts, zones, shots, nos: BT.sortNos(Array.from(nos)), located: shots.length, nGames, nMissGames, best, worst: worst && best && worst.id !== best.id ? worst : null };
  };

  /* ---------- 試合ごとの流れ（グラフ） ----------
     metric：'pts'（得点と失点）| 'fg'（シュート成功率。外れも記録した試合だけ。ほかは null）| 'to'（ターンオーバー）
     → [{ id, date, values: [..] }]（古い順） */
  A.METRICS = [
    { id: 'pts', label: '得点と失点', series: ['得点', '失点'], pct: false },
    { id: 'fg', label: 'シュート成功率', series: ['シュート成功率'], pct: true },
    { id: 'to', label: 'ターンオーバー', series: ['ターンオーバー'], pct: false }
  ];
  A.trend = function (r, metric) {
    return r.games.slice().reverse().map((g) => {
      let values;
      if (metric === 'fg') values = [g.sh ? A.rates(g.sh).fg : null];
      else if (metric === 'to') values = [g.s.to];
      else values = [g.pf, g.pa];
      return { id: g.id, date: g.date, opp: g.opp, values };
    });
  };

  /* ---------- CSV（先頭の BOM は呼び出し側で） ---------- */
  function cell(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  const csv = (rows) => rows.map((x) => x.map(cell).join(',')).join('\r\n') + '\r\n';
  A.csv = csv;
  const pctCell = (v) => (v == null ? '' : Math.round(v * 1000) / 10);
  const avgCell = (v, n) => (n ? Math.round(v / n * 10) / 10 : '');
  /* 選手ごと（合計の数。成功率は、外れも記録した試合だけで） */
  A.playersCSV = function (r) {
    const head = ['背番号', '名前', '試合数', '得点', '1試合平均得点', '2P成功', '3P成功', 'FT成功',
      '2P成功（外れも記録した試合）', '2P試投（外れも記録した試合）', '2P成功率%', '3P成功（外れも記録した試合）', '3P試投（外れも記録した試合）', '3P成功率%',
      'FT成功（外れも記録した試合）', 'FT試投（外れも記録した試合）', 'FT成功率%', 'FG成功率%', 'eFG%',
      'リバウンド', 'うちオフェンス', 'アシスト', 'スティール', 'ターンオーバー', 'ファウル'];
    const line = (no, name, p) => {
      const rt = A.rates(p.sh);
      return [no, name, p.games, p.s.pts, avgCell(p.s.pts, p.games), p.s.fg2m, p.s.fg3m, p.s.ftm,
        p.sh.fg2m, p.sh.fg2a, pctCell(rt.fg2), p.sh.fg3m, p.sh.fg3a, pctCell(rt.fg3), p.sh.ftm, p.sh.fta, pctCell(rt.ft), pctCell(rt.fg), pctCell(rt.efg),
        p.s.reb, p.s.oreb, p.s.ast, p.s.stl, p.s.to, p.s.foul];
    };
    const rows = [head];
    r.players.forEach((p) => rows.push(line(p.no, p.name, p)));
    if (r.unknown) rows.push(line('番号なし', '', r.unknown));
    rows.push(line('合計', '', r.total));
    return csv(rows);
  };
  /* 試合ごと（新しい順） */
  A.gamesCSV = function (r) {
    const head = ['日付', '相手', '得点', '失点', '勝敗', '外れの記録', '2P成功', '2P試投', '3P成功', '3P試投', 'FT成功', 'FT試投', 'FG成功率%', '3P成功率%', 'FT成功率%', 'リバウンド', 'アシスト', 'スティール', 'ターンオーバー', 'ファウル', '相手のリバウンド', '相手のターンオーバー'];
    const rows = [head];
    r.games.forEach((g) => {
      const rt = g.sh ? A.rates(g.sh) : {};
      rows.push([g.date, g.opp, g.pf, g.pa, g.res === 'W' ? '勝ち' : g.res === 'L' ? '負け' : '引き分け', g.miss ? 'あり' : 'なし',
        g.s.fg2m, g.miss ? g.s.fg2a : '', g.s.fg3m, g.miss ? g.s.fg3a : '', g.s.ftm, g.miss ? g.s.fta : '',
        pctCell(rt.fg), pctCell(rt.fg3), pctCell(rt.ft), g.s.reb, g.s.ast, g.s.stl, g.s.to, g.s.foul, g.o.reb, g.o.to]);
    });
    return csv(rows);
  };

  BT.agg = A;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/lib/bs-core.js */
/* basket-clips/js/core.js を写したもの（切り出しを、このアプリの中でするため）。直すときは両方に */
/* バスケ得点クリップ — 共通の小さな道具（名前空間・数値・時刻の書式・イベント）
   DOM に依存しないので node のテストからも読み込める。
   名前空間は「バスケ分析スタジオ」と同じ BS（解析エンジンのファイルを、そのまま共有するため）。 */
(function (root) {
  'use strict';
  const BS = root.BS = root.BS || {};
  BS.APP = 'バスケ得点クリップ';

  BS.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* 秒 → 「m:ss」（1時間以上は「h:mm:ss」）。withTenths で 0.1 秒まで */
  BS.fmtTime = function (sec, withTenths) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (withTenths) out += '.' + Math.floor((sec * 10) % 10);
    return out;
  };

  /* 小さなイベントの仕組み（on で登録、emit で通知） */
  BS.emitter = function () {
    const map = new Map();
    return {
      on(name, fn) { if (!map.has(name)) map.set(name, new Set()); map.get(name).add(fn); return () => map.get(name).delete(fn); },
      off(name, fn) { if (map.has(name)) map.get(name).delete(fn); },
      emit(name, payload) {
        if (!map.has(name)) return;
        for (const fn of Array.from(map.get(name))) {
          try { fn(payload); } catch (err) { if (typeof console !== 'undefined') console.error('[BS] handler error', name, err); }
        }
      }
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/lib/taplog.js */
/* basket-clips/js/taplog.js を写したもの（切り出しを、このアプリの中でするため）。直すときは両方に */
/* バスケ得点クリップ — 「バスケ タップ記録」の記録を読み込んで、動画の場面（クリップ）にする
   DOM 非依存（node のテストからも読み込める）。

   記録のファイル（format: 'basket-tap'）：
     startedAt（スタートを押した時刻・エポックミリ秒）、teams（自分・相手の名前・色・名簿）、
     events: [{ id, t（スタートからの秒）, type（fg2・reb・pass など／'period' はピリオドの始まり）, team（0 自分・1 相手・null チームなし）, no（背番号）}]
     チームなし：記録の画面の下の「パスミス」「★ あとで見る」（だれのかは決めずに、時刻だけ）。チームの絞り込みでは外さない。
     videos: [{ vid, n, startedAt（録画を始めた時刻・エポックミリ秒）, duration, name }]：その端末のカメラで撮影しながら記録した動画（なくてよい）。
       記録と同じ時計なので、その動画なら時刻あわせがいらない（videoAnchors）。
     mode: 'video'：撮った動画を見ながら記録した試合（t は、その動画の時刻）。videos の1本（file: true）の startedAt が記録と同じなので、
       同じ動画を開けば（ファイル名・長さで見分ける）時刻あわせがいらない。notes：💬 コメント・スタンプ（t は記録の時刻。形は notes.js）
   くわしくは basket-tap/js/core.js の先頭。

   時刻あわせ（sync）：記録の時刻 t と、動画の時刻 v の対応を「合わせた点」anchors: [{ t, v }] で持つ。
     ふつうは1点（記録のスタート ＝ 動画の 0:42 など）。全部の記録が同じだけずれる（v = t + ずれ）。
     撮影を途中で止めた動画・つないだ動画では、止めた後の場面でもう1点合わせる。その点より後ろの記録は、その点のずれを使う。 */
(function (root) {
  'use strict';
  const BS = root.BS = root.BS || {};

  /* プレーの種類（記録のファイルに呼び名が入っていれば、そちらを使う） */
  const TYPES = {
    fg2: { label: '2P成功', short: '2P', pts: 2, made: true, grp: 'score' },
    fg3: { label: '3P成功', short: '3P', pts: 3, made: true, grp: 'score' },
    ft: { label: 'フリースロー成功', short: 'FT', pts: 1, made: true, grp: 'score' },
    fg2x: { label: '2P失敗', short: '2P×', pts: 0, grp: 'miss' },
    fg3x: { label: '3P失敗', short: '3P×', pts: 0, grp: 'miss' },
    ftx: { label: 'フリースロー失敗', short: 'FT×', pts: 0, grp: 'miss' },
    reb: { label: 'リバウンド', pts: 0, grp: 'reb' },
    oreb: { label: 'オフェンスリバウンド', short: 'Oリバ', pts: 0, grp: 'reb' },
    dreb: { label: 'ディフェンスリバウンド', short: 'Dリバ', pts: 0, grp: 'reb' },
    ast: { label: 'アシスト', pts: 0, grp: 'ast' },
    stl: { label: 'スティール', pts: 0, grp: 'stl' },
    blk: { label: 'ブロック', pts: 0, grp: 'blk' },
    pass: { label: 'パスミス', pts: 0, grp: 'pass' },
    tov: { label: 'ターンオーバー', pts: 0, grp: 'tov' },
    foul: { label: 'ファウル', pts: 0, grp: 'foul' },
    mark: { label: '★ あとで見る', pts: 0, grp: 'mark' }
  };
  /* 絞り込みのまとまり（並び順も） */
  const GROUPS = [
    { id: 'score', label: '得点' }, { id: 'miss', label: 'シュート失敗' }, { id: 'reb', label: 'リバウンド' }, { id: 'pass', label: 'パスミス' },
    { id: 'tov', label: 'ターンオーバー' }, { id: 'stl', label: 'スティール' }, { id: 'ast', label: 'アシスト' }, { id: 'blk', label: 'ブロック' },
    { id: 'foul', label: 'ファウル' }, { id: 'mark', label: '★ あとで見る' }
  ];
  const WIN = { lead: 10, lag: 2 };     // タップした瞬間の「前 10 秒・後 2 秒」（人がタップするのは、プレーの 1〜2 秒あと。前は、攻めの組み立てから見られるように長め）
  const WIN_BY = { reb: { lead: 5, lag: 2 }, mark: { lead: 5, lag: 2 } };      // プレーごとの長さ（はじめ）：リバウンド・★ あとで見る は前 5 秒
  /* そのプレー（まとまり grp）の1場面の長さ：win.by[grp]（プレーごとに変えたもの）があればそれ、なければ win（ふつう） */
  function winFor(win, grp) {
    const w = Object.assign({}, WIN, win || {});
    const b = win && win.by && win.by[grp];
    const pick = (k) => (b && isFinite(b[k]) && b[k] >= 0 ? +b[k] : +w[k]);
    return { lead: pick('lead'), lag: pick('lag') };
  }

  const periodLabel = (p) => (p <= 4 ? p + 'Q' : 'OT' + (p - 4));
  const isHex = (c) => /^#[0-9a-f]{6}$/i.test(c || '');
  function normNo(v) {
    const s = String(v == null ? '' : v).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
    if (s === '00') return '00';
    return /^\d{1,2}$/.test(s) ? String(Number(s)) : null;
  }

  /* 記録（JSON の文字・オブジェクト）→ そろえた形。合わないものは、分かる言葉の Error */
  function parse(obj, fileName) {
    if (typeof obj === 'string') { try { obj = JSON.parse(obj); } catch (e) { throw new Error('JSON として読めませんでした'); } }
    if (!obj || typeof obj !== 'object') throw new Error('記録のファイルではないようです');
    if (obj.format !== 'basket-tap') throw new Error('「バスケ タップ記録」の記録のファイルではないようです');
    if (!Array.isArray(obj.events) || !Array.isArray(obj.teams)) throw new Error('記録の中身（events・teams）がありません');
    const names = obj.types && typeof obj.types === 'object' ? obj.types : {};
    const teams = [0, 1].map((i) => {
      const t = obj.teams[i] || {};
      const color = isHex(t.color) ? t.color : i ? '#2f6fed' : '#f4f4f4';
      const players = (Array.isArray(t.players) ? t.players : []).map((p) => ({ no: normNo(p && p.no), name: String((p && p.name) || '').slice(0, 12) })).filter((p) => p.no != null);
      return { name: String(t.name || '').trim().slice(0, 20), color, colorName: String(t.colorName || '').slice(0, 8), players };
    });
    const raw = obj.events.filter((e) => e && isFinite(e.t) && e.t >= 0 && (e.type === 'period' || TYPES[e.type]));
    const periods = raw.filter((e) => e.type === 'period' && isFinite(e.period)).map((e) => ({ t: +e.t, period: Math.max(1, Math.round(e.period)) })).sort((a, b) => a.t - b.t);
    const periodAt = (t) => { let p = 1; periods.forEach((x) => { if (x.t <= t + 1e-9) p = x.period; }); return p; };
    const events = [];
    raw.forEach((e, i) => {
      const id = typeof e.id === 'string' && e.id ? e.id.slice(0, 20) : 'x' + i;
      if (e.type === 'period') { events.push({ id, t: +e.t, type: 'period', period: Math.max(1, Math.round(e.period || 1)) }); return; }
      const d = TYPES[e.type];
      const label = names[e.type] && typeof names[e.type].label === 'string' ? names[e.type].label.slice(0, 20) : d.label;
      // チームは 0・1。それ以外はチームなし（null）。ただし得点はチームなしにできないので 0（前の版の記録は、いつも 0・1）
      const team = e.team === 0 || e.team === 1 ? e.team : d.pts ? 0 : null;
      events.push({ id, t: Math.round(e.t * 10) / 10, type: e.type, team, no: team != null && e.no != null ? normNo(e.no) : null, period: isFinite(e.period) ? e.period : periodAt(e.t), label, grp: d.grp, pts: d.pts });
    });
    // id がかぶっていたら付け直す
    const seen = new Set();
    events.forEach((e, i) => { if (seen.has(e.id)) e.id = 'x' + i + '_' + e.id; seen.add(e.id); });
    events.sort((a, b) => a.t - b.t);
    if (!events.some((e) => e.type !== 'period')) throw new Error('この記録には、プレーの記録がありません');
    const videos = (Array.isArray(obj.videos) ? obj.videos : []).filter((v) => v && isFinite(v.startedAt) && v.startedAt > 0).slice(0, 50)
      .map((v, i) => ({ vid: String(v.vid || 'v' + i).slice(0, 40), n: isFinite(v.n) ? Math.round(v.n) : i + 1, startedAt: +v.startedAt, duration: isFinite(v.duration) ? +v.duration : null, name: String(v.name || '').slice(0, 120), gone: !!v.gone, file: !!v.file }));
    const review = obj.mode === 'video';
    return {
      format: 'basket-tap', id: String(obj.id || '').slice(0, 40), title: String(obj.title || '').slice(0, 40), date: /^\d{4}-\d{2}-\d{2}$/.test(obj.date || '') ? obj.date : '',
      startedAt: isFinite(obj.startedAt) && obj.startedAt > 0 ? +obj.startedAt : null, tz: isFinite(obj.tz) ? +obj.tz : 540,
      teams, events, videos, file: fileName ? String(fileName).slice(0, 80) : '', loadedAt: Date.now(),
      mode: review ? 'video' : '', src: review && obj.src && typeof obj.src === 'object' ? { name: String(obj.src.name || '').slice(0, 120), duration: isFinite(obj.src.duration) ? +obj.src.duration : null } : null,
      notes: BS.notes ? BS.notes.cleanAll(obj.notes) : []
    };
  }

  const plays = (log) => ((log && log.events) || []).filter((e) => e.type !== 'period');
  const teamName = (log, tm) => (tm !== 0 && tm !== 1 ? '' : (log.teams[tm] && log.teams[tm].name) || (tm ? '相手' : '自分'));
  const playerName = (log, tm, no) => { const p = ((log.teams[tm] || {}).players || []).find((x) => x.no === no); return p ? p.name : ''; };
  /* 「#7 たけし 2P成功」 */
  function eventLabel(log, e, withTeam) {
    if (e.type === 'period') return `${periodLabel(e.period)} 開始`;
    const nm = e.no != null ? playerName(log, e.team, e.no) : '';
    return [withTeam && e.team != null ? teamName(log, e.team) : '', e.no != null ? '#' + e.no + (nm ? ' ' + nm : '') : '', e.label].filter(Boolean).join(' ');
  }
  function score(log, until) {
    const s = [0, 0];
    plays(log).forEach((e) => { if (e.team != null && (until == null || e.t <= until)) s[e.team] += e.pts || 0; });
    return s;
  }

  /* ---------- 時刻あわせ ---------- */
  function cleanAnchors(anchors) {
    return (anchors || []).filter((a) => a && isFinite(a.t) && isFinite(a.v)).map((a) => ({ t: +a.t, v: +a.v })).sort((a, b) => a.t - b.t);
  }
  /* 記録の時刻 t → 動画の時刻。合わせた点がなければ null */
  function toVideo(t, anchors) {
    const A = cleanAnchors(anchors);
    if (!A.length) return null;
    let a = A[0];
    for (const x of A) if (x.t <= t + 1e-9) a = x;
    return t + (a.v - a.t);
  }
  /* 合わせた点を、全部 d 秒ずらす（動画の時刻を後ろへ＝プラス） */
  const shift = (anchors, d) => cleanAnchors(anchors).map((a) => ({ t: a.t, v: Math.round((a.v + d) * 100) / 100 }));
  /* 記録の時刻 t に効いている点の番号（t より前で、いちばん後ろの点。t がどの点より前なら最初の点）。点がなければ -1 */
  function anchorIndex(anchors, t) {
    const A = cleanAnchors(anchors);
    let k = A.length ? 0 : -1;
    A.forEach((x, i) => { if (x.t <= t + 1e-9) k = i; });
    return k;
  }
  /* 記録の時刻 t に効いている点だけを d 秒ずらす（その点の区間の場面だけがずれる。点が1つなら shift と同じ） */
  function shiftAt(anchors, t, d) {
    const A = cleanAnchors(anchors);
    const k = anchorIndex(A, t);
    return A.map((a, i) => (i === k ? { t: a.t, v: Math.round((a.v + d) * 100) / 100 } : a));
  }
  /* いちばん近くで効いている点を、(t, v) に置きかえる（ほかの点はそのまま。点がなければ足す） */
  function setAnchor(anchors, t, v, add) {
    const A = cleanAnchors(anchors);
    const p = { t: Math.round(t * 10) / 10, v: Math.round(v * 100) / 100 };
    if (add || !A.length) {
      const out = A.filter((a) => Math.abs(a.t - p.t) > 0.05);
      out.push(p);
      return out.sort((a, b) => a.t - b.t);
    }
    let k = 0;
    A.forEach((x, i) => { if (x.t <= t + 1e-9) k = i; });
    A[k] = p;
    return cleanAnchors(A);
  }

  /* ---------- 場面（クリップ） ----------
     filter: { teams: [自分を出すか, 相手を出すか]（チームなしの記録には効かない）, groups: { score: true, … }（なし＝全部）, players: ['0:7', …]（空＝全員） }
     win: { lead, lag, by: { reb: { lead, lag }, … } }（by：プレーのまとまりごとの長さ。なければ全部 lead・lag）/ duration：動画の長さ / off：{ id: true }（外した場面）
     adds：自分で足した場面 [{ id, at（動画の秒）, type, team, no, memo }]（記録にはないもの。時刻あわせを変えても動かない）
     戻り値 { clips: [{ id, t, at, team, no, type, label, period, t0, t1, on, n, total, user（自分で足した場面）}], outside: 動画の外の数 } */
  function clips(log, anchors, filter, win, duration, off, adds) {
    const out = [];
    let outside = 0;
    if (!log || !cleanAnchors(anchors).length) return { clips: out, outside };
    const f = filter || {};
    const end = duration > 0 ? duration : Infinity;
    const ps = new Set(f.players || []);
    const pass = (e) => !(f.teams && e.team != null && f.teams[e.team] === false) && !(f.groups && Object.keys(f.groups).length && !f.groups[e.grp]) && !(ps.size && !(e.no != null && ps.has(e.team + ':' + e.no)));
    addPlays(adds).forEach((a) => {
      if (!pass(a)) return;
      if (!(a.at >= 0 && a.at <= end)) { outside++; return; }
      const w = winFor(win, a.grp);
      out.push({ id: a.id, t: null, at: Math.round(a.at * 100) / 100, team: a.team, no: a.no, type: a.type, grp: a.grp, label: addLabel(log, a), memo: a.memo, period: null, user: true, on: !(off && off[a.id]),
        t0: Math.max(0, a.at - w.lead), t1: Math.min(end, a.at + w.lag) });
    });
    plays(log).forEach((e) => {
      if (!pass(e)) return;
      const at = toVideo(e.t, anchors);
      if (at == null || at < 0 || at > end) { outside++; return; }
      const w = winFor(win, e.grp);
      out.push({ id: e.id, t: e.t, at: Math.round(at * 100) / 100, team: e.team, no: e.no, type: e.type, grp: e.grp, label: eventLabel(log, e), period: e.period, on: !(off && off[e.id]),
        t0: Math.max(0, at - w.lead), t1: Math.min(end, at + w.lag) });
    });
    out.sort((a, b) => a.at - b.at);
    out.forEach((c, i) => { c.n = i + 1; c.total = out.length; });
    return { clips: out, outside };
  }
  /* 続けて再生・書き出しの区間。外したものは入れない。
     記録の場面は、続けて起きたプレー（シュート失敗 → リバウンド など）が重なりやすいので、重なる場面は1つにつなぐ（同じところを2回見せない）。
     ただし、つないだ長さが maxLen 秒を超えるときは、つながずに、重なった分を後ろの場面から削る（1 秒より短くなるなら、つなぐ） */
  function reel(clipList, maxLen) {
    const max = maxLen || 24;
    const out = [];
    (clipList || []).filter((c) => c.on !== false).slice().sort((a, b) => a.t0 - b.t0).forEach((c) => {
      const seg = Object.assign({}, c, { ids: [c.id] });
      const prev = out[out.length - 1];
      if (prev && seg.t0 < prev.t1) {
        if (Math.max(prev.t1, seg.t1) - prev.t0 <= max || seg.t1 - prev.t1 < 1) { prev.t1 = Math.max(prev.t1, seg.t1); prev.ids.push(c.id); return; }
        seg.t0 = prev.t1;
      }
      out.push(seg);
    });
    return out;
  }

  /* 自分で足した場面をそろえる（種類が分からなければ ★、得点はチームなしにできないので自分） */
  function addPlays(adds) {
    return (Array.isArray(adds) ? adds : []).filter((a) => a && typeof a.id === 'string' && isFinite(a.at)).map((a) => {
      const type = TYPES[a.type] ? a.type : 'mark', d = TYPES[type];
      const team = a.team === 0 || a.team === 1 ? a.team : d.pts ? 0 : null;
      return { id: a.id, at: +a.at, type, grp: d.grp, team, no: team != null && a.no != null ? normNo(a.no) : null, memo: String(a.memo || '').slice(0, 30), label: d.label };
    });
  }
  /* 自分で足した場面の呼び名：「#7 たけし 2P成功：メモ」 */
  function addLabel(log, a) {
    const base = eventLabel(log, { type: a.type, team: a.team, no: a.no, label: a.label });
    return a.memo ? `${base}：${a.memo}` : base;
  }
  /* 絞り込みの数（まとまりごと・選手ごと）。チームの絞り込みは効かせる（adds：自分で足した場面も数える） */
  function counts(log, filter, adds) {
    const f = filter || {};
    const grp = {}, players = {};
    plays(log).concat(addPlays(adds)).forEach((e) => {
      if (f.teams && e.team != null && f.teams[e.team] === false) return;
      grp[e.grp] = (grp[e.grp] || 0) + 1;
      if (e.team != null && e.no != null) { const k = e.team + ':' + e.no; players[k] = (players[k] || 0) + 1; }
    });
    return { grp, players };
  }

  /* ---------- 自動で合わせる（目安） ---------- */
  /* 自動解析で見つけた得点（動画の時刻）と、記録の得点（記録の時刻）を見比べて、いちばん多く重なるずれを探す。
     tol：何秒まで同じ得点とみなすか（人がタップするまでの遅れは、まちまちなので広め）。
     戻り値 { offset（動画の時刻 − 記録の時刻）, matched, nLog, nShots } か null（見比べられるほどの数がないとき） */
  function matchShots(log, shotTimes, tol) {
    tol = tol || 2.5;
    const A = plays(log).filter((e) => TYPES[e.type] && TYPES[e.type].made).map((e) => e.t).sort((a, b) => a - b);
    const B = (shotTimes || []).filter(isFinite).slice().sort((a, b) => a - b);
    if (A.length < 3 || B.length < 3) return null;
    // ずれ d のときに重なる数（どちらも時刻順なので、前から順に組にする）
    const score = (d) => {
      let i = 0, j = 0, m = 0, err = 0;
      while (i < A.length && j < B.length) {
        const diff = B[j] - (A[i] + d);

<script>
/* js/lib/export.js */
/* basket-clips/js/export.js を写したもの（切り出しを、このアプリの中でするため）。直すときは両方に */
/* バスケ得点クリップ — 動画の書き出し
   区間（クリップ）を順に再生しながら Canvas に描き、MediaRecorder で録画して1本の動画にする。
   実時間で録るので、書き出しにかかる時間 ≒ できる動画の長さ（5秒 × 本数 ＋ 最初と最後の数秒）。
   「バスケ分析スタジオ」の export.js をもとに、表示を小さくしたもの（音声の扱い・再生が始まらないときの失敗の出し方は同じ）。 */
(function (root) {
  'use strict';
  const BS = root.BS;

  function pickMime() {
    if (typeof MediaRecorder === 'undefined') return null;
    const list = [
      ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'mp4'],
      ['video/mp4;codecs=avc1', 'mp4'],
      ['video/mp4', 'mp4'],
      ['video/webm;codecs=vp9,opus', 'webm'],
      ['video/webm;codecs=vp8,opus', 'webm'],
      ['video/webm', 'webm']

  function sizeFor(media) {
    let w = media.width || 1280, h = media.height || 720;

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

    ctx.font = `bold ${26 * s}px ${FONT}`;
    const w1 = ctx.measureText(title).width;
    ctx.font = `${19 * s}px ${FONT}`;
    const w2 = ctx.measureText(sub).width;

        await media.play();

          done = TITLE + acc + Math.min(Math.max(0, k), len);

/* js/lib/ui.js */
