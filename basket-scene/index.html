<script>
/* js/sc-store.js */
/* バスケ シーン — 保存（このブラウザの中だけ）
   キーは「bscene:」で始まる（もとの「バスケ タップ記録」＝ btap: とは別。記録の形は同じ format: 'basket-tap' なので、ファイルで行き来できる）。
   ・試合：1つ記録するたびに、すぐ保存する
   ・チーム：自分のチームの名前・色・名簿を覚えておく（次の試合で、そのまま使える）
   ・設定：下の DEFAULTS（はじめから、記録するものは全部オン。いらないものを設定で外す） */
(function (root) {
  'use strict';
  const BT = root.BT;
  const SC = root.SC = root.SC || {};
  const K = { games: 'bscene:games', game: 'bscene:game:', team: 'bscene:team', prefs: 'bscene:prefs' };
  const KEEP = 80;

  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function readJSON(k) { const s = ls(); if (!s) return null; try { const v = s.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(k, v) { const s = ls(); if (!s) return false; try { s.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function remove(k) { const s = ls(); if (s) { try { s.removeItem(k); } catch (e) { /* 無視 */ } } }

  /* ---------- 設定 ----------
     rec：自分のチームで記録するもの（どれも、はじめはオン）
       miss：シュートの失敗（2P×・3P×・FT×。成功率が出せる）/ rebSplit：リバウンドを Oリバ・Dリバ に分ける（false なら「リバ」1つ）
       reb：リバウンド / ast：アシスト / stl：スティール / blk：ブロック / tov：ターンオーバー / foul：ファウル / mark：★ あとで見る
     shotLoc：2P・3P のあとに、コートの図で場所も聞く（はじめはオフ）/ courtType：'std' | 'mini'
     autoPause：プレーか背番号を押したら、動画を止める（選び終わると、また動かす）
     win：場面の長さ { lead：前の秒, lag：後の秒, by：{ まとまり: { lead, lag } } }（js/lib/taplog.js の WIN・WIN_BY と同じ形）
     reelMax：続けて再生・書き出しで、重なる場面をつなぐ長さの上限（秒）
     captions：書き出す動画に、左上の札（だれの・何のプレーか）を入れる / cards：はじめと終わりの札を入れる
     sceneDetail：場面の一覧に、細かい手直し（はじめ・終わりを動かす）を出す
     theme：'auto' | 'light' | 'dark' / hints：{ 出した案内: true } */
  const DEFAULTS = {
    theme: 'auto',
    rec: { miss: true, reb: true, rebSplit: true, ast: true, stl: true, blk: true, tov: true, foul: true, mark: true },
    shotLoc: false, courtType: 'std',
    autoPause: false,
    win: { lead: 10, lag: 2, by: { reb: { lead: 5, lag: 2 }, mark: { lead: 5, lag: 2 } } },
    reelMax: 24,
    captions: true, cards: true,
    sceneDetail: false,
    hints: {}
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function merge(base, over) {
    const out = clone(base);
    Object.keys(over || {}).forEach((k) => {
      const v = over[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) out[k] = merge(out[k], v);
      else if (v !== undefined) out[k] = v;
    });
    return out;
  }
  function prefs() { return merge(DEFAULTS, readJSON(K.prefs) || {}); }
  function savePrefs(p) { return writeJSON(K.prefs, p); }

  /* ---------- 試合 ---------- */
  function games() { return (readJSON(K.games) || []).filter((g) => g && g.id).sort((a, b) => (b.startedAt || b.at || 0) - (a.startedAt || a.at || 0)); }
  function loadGame(id) {
    const g = readJSON(K.game + id);
    if (!g || g.format !== BT.FORMAT || !Array.isArray(g.events)) return null;
    if (!g.seq) g.seq = g.events.reduce((m, e) => Math.max(m, Number(String(e.id).slice(1)) || 0), 0);
    return g;
  }
  /* 保存できたら true（入りきらないときは、古い試合から消して、もう一度） */
  function saveGame(game) {
    if (!game || !game.id) return false;
    const list = games().filter((x) => x.id !== game.id);
    const sum = BT.summary(game);
    sum.src = game.src ? { name: game.src.name, size: game.src.size, duration: game.src.duration } : null;
    list.unshift(sum);
    let ok = writeJSON(K.game + game.id, game);
    if (!ok || list.length > KEEP) {
      const old = list.slice().sort((a, b) => (a.startedAt || a.at || 0) - (b.startedAt || b.at || 0)).filter((x) => x.id !== game.id);
      const n = ok ? list.length - KEEP : Math.max(5, list.length - KEEP);
      old.slice(0, n).forEach((x) => { remove(K.game + x.id); const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list.splice(i, 1); });
      if (!ok) ok = writeJSON(K.game + game.id, game);
    }
    writeJSON(K.games, list);
    return ok;
  }
  function deleteGame(id) { remove(K.game + id); writeJSON(K.games, games().filter((x) => x.id !== id)); }
  /* 同じ動画で記録した試合（ファイル名と大きさが同じ。新しいものから） */
  function findBySrc(file) {
    if (!file || !file.name) return null;
    const hit = games().find((g) => !g.demo && g.src && g.src.name === file.name && (!g.src.size || !file.size || g.src.size === file.size));
    return hit ? hit.id : null;
  }

  /* ---------- 自分のチーム（前の試合の名前・色・名簿） ---------- */
  function team() { const t = readJSON(K.team); return t && typeof t === 'object' ? BT.cleanTeam(t, 0) : null; }
  function saveTeam(t) { return writeJSON(K.team, { name: t.name, color: t.color, colorName: t.colorName, players: BT.cleanPlayers(t.players) }); }

  SC.store = { DEFAULTS, prefs, savePrefs, games, loadGame, saveGame, deleteGame, findBySrc, team, saveTeam, merge, KEYS: K };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sc-app.js */
/* バスケ シーン — 画面の土台（ホーム・動画つきの作業の画面・タブ・設定の入れ物）
   考え方：動画を選んだら、あとは 1 つの画面。上に動画、下（横長の画面では右）にタブ「① 記録」「② 場面」「③ スタッツ」。
   記録の時刻は、いつも「動画の時刻」。だから、記録したものは、そのまま場面（切り出し）になる。
   「試合を終える」「動画を選び直す」「時刻を合わせる」は、ない。

   ■ パネル（タブの中身）とのやりとり — js/sc-tap.js・js/sc-scenes.js・js/sc-stats.js は、これだけを使う
     SC.app.S                     { view: 'home'|'work', game, prefs, media, file, tab }（game は BT の記録の形。mode: 'video'）
     SC.app.now()                 動画のいまの時刻（秒・0.1 まで）。動画がないときは、前に見ていた所
     SC.app.dur()                 動画の長さ（秒。分からなければ 0）
     SC.app.hasVideo()            動画がつながっていて、再生できるか
     SC.app.seek(t, play)         その時刻へ（Promise）。play が true なら、そのまま再生
     SC.app.play() / pause() / toggle()
     SC.app.playRange(t0, t1, { loop })   t0 から再生して t1 で止める。Promise → 'end'（最後まで）| 'stop'（途中でやめた）| 'novideo'
     SC.app.stopRange()           playRange をやめる（動画は止めない）
     SC.app.save()                S.game を保存して、'change' を知らせる（記録を足した・直した・消したあとに呼ぶ）
     SC.app.savePrefs()           S.prefs を保存して、'prefs' を知らせる
     SC.app.setTab(id, arg)       タブを切りかえる（'tap' | 'scenes' | 'stats'）。arg は、そのパネルの show(arg) に渡る
     SC.app.on(name, fn)          'time'(t)・'play'・'pause'・'media'(つながったか)・'change'・'prefs'・'team'(背番号・名前・色を変えた)・'tab'(id)・'range'(いまの区間 | null)・'open'(試合を開いた)
     SC.app.ui.noGrid(get, set)   背番号をタップで入れたり外したりするマス → { el, draw }（get()：いま選んでいる番号 / set(list)：変えたあとの番号）
     SC.app.panel(id, def)        パネルを登録する：{ mount(el), show(arg), hide(), badge() → 文字 | '' }
                                  mount は、作業の画面を作るたびに呼ばれる（el は毎回新しい。中身を作り直す）
     SC.app.settings(def)         設定の節を登録する：{ id, title, order, render(box, redraw) }（redraw()：設定の小窓を描き直す）
     SC.app.openSettings(id)      設定を開く（id の節まで動かす）
     SC.app.pickVideo()           動画を選んでもらう（作業の画面では、いまの試合につなぐ）
     SC.app.wide()                横に並べる広い画面か（動画が左・タブが右）
     SC.app.S.overlay             画面いっぱいに重ねた画面（反省会の画面など）を開いているあいだ、その「閉じる」関数を入れておく（閉じたら null）。
                                  ブラウザの「戻る」で、ホームへ行かずに、それを閉じる */
(function (root) {
  'use strict';
  const BT = root.BT, BS = root.BS;
  const SC = root.SC = root.SC || {};
  const { h, $, $$ } = BT.ui;
  SC.APP = 'バスケ シーン';
  BS.APP = SC.APP;          // 切り出しの部品（js/lib/export.js）が、書き出す動画の終わりの札に出す名前
  SC.TAGLINE = '動画を見ながら記録 → 場面 → スタッツ';

  const bus = BS.emitter();
  const S = { view: 'home', game: null, prefs: SC.store.prefs(), media: null, file: null, tab: 'tap', W: null, guarded: false, overlay: null };
  const panels = {};
  const sections = [];
  const TABS = [['tap', '①', '記録'], ['scenes', '②', '場面'], ['stats', '③', 'スタッツ']];
  const RATES = [1, 0.5, 0.25, 2];
  const r1 = (v) => Math.round(v * 10) / 10;
  const fmt = BT.fmtTime;
  const on = bus.on, emit = bus.emit;

  /* ---------- 動画 ---------- */
  const hasVideo = () => !!(S.media && S.media.ready);
  const now = () => (hasVideo() ? r1(S.media.time) : (S.game && S.game.rvPos) || 0);
  const dur = () => (hasVideo() ? S.media.duration : (S.game && S.game.src && S.game.src.duration) || 0);
  const wide = () => root.innerWidth >= 900 || (root.innerWidth >= 640 && root.innerWidth > root.innerHeight * 1.2);
  let range = null;          // いま再生している区間 { t0, t1, loop, armed, resolve }

  function seek(t, play) {
    if (!hasVideo()) { if (S.game) S.game.rvPos = Math.max(0, r1(t)); emit('time', now()); return Promise.resolve(); }
    return S.media.seek(BT.clamp(t, 0, Math.max(0, dur() - 0.05))).then(() => { if (play && S.media) return S.media.play(); return undefined; });
  }
  function play() { if (hasVideo()) return S.media.play(); return Promise.resolve(); }
  function pause() { if (S.media) S.media.pause(); }

      emit('range', R);

  }
  function stopRange() {
    const R = range;
    if (!R) return;
    range = null;
    R.resolve('stop');
    emit('range', null);
  }
  function rangeTick(t) {
    const R = range;
    if (!R || !R.armed) return;
    if (t >= R.t1 - 0.03 || S.media.el.ended) {
      if (R.loop) { R.armed = false; S.media.seek(R.t0).then(() => { if (range === R) { R.armed = true; S.media.play(); } }); return; }

    const m = S.media = BS.createVideoMedia(file);
    S.file = file;
    m.on('ready', (info) => {
      if (S.media !== m) return;
      const src = g.src = g.src || {};
      const first = !src.duration;
      // 前に記録した動画と長さがちがうときは、知らせる（記録の時刻は、動画の時刻なので）
      if (!first && Math.abs(src.duration - info.duration) > 1.5) BT.ui.toast(`前に記録した動画（${src.name || '？'}・${fmt(src.duration)}）と長さがちがいます。場面の時刻が合わないかもしれません`, 'warn', 7000);
      else Object.assign(src, { name: file.name || src.name || '', size: file.size || src.size || null, duration: r1(info.duration), w: info.width, h: info.height });
      if (g.videos && g.videos[0] && g.videos[0].file && first) Object.assign(g.videos[0], { duration: r1(info.duration), w: info.width, h: info.height });
      SC.store.saveGame(g);
      const at = Math.min(g.rvPos || 0, Math.max(0, info.duration - 0.2));
      m.seek(at).then(() => { emit('media', true); drawWork(); });
    });
    m.on('time', (t) => { rangeTick(t); drawTime(); emit('time', r1(t)); });
    m.on('play', () => { drawPlay(); emit('play'); });
    m.on('pause', () => { drawPlay(); if (S.game) { S.game.rvPos = now(); } emit('pause'); });
    m.on('ended', () => { drawPlay(); });
    m.on('rate', drawPlay);
    m.on('notice', (text) => BT.ui.toast(text, 'warn', 5000));
    m.on('error', () => {
      if (S.media !== m) return;
      BT.ui.toast('この動画は、このブラウザでは再生できませんでした。MP4（iPhone・多くのカメラの形）でためしてください', 'err', 9000);
      detach();
      emit('media', false);

    });
    const W = S.W;
    if (W) { W.stage.innerHTML = ''; W.stage.append(m.el, h('p', { class: 'sc-loading' }, '動画を読み込んでいます…')); }

    m.el.addEventListener('click', toggle);
  }
  /* 動画を選んでもらう。作業の画面では、いまの試合につなぐ。ホームでは、試合を作る（同じ動画の試合があれば、続きを聞く） */
  function pickVideo() {
    const old = document.getElementById('scFile');
    if (old) old.remove();
    const inp = h('input', { type: 'file', id: 'scFile', accept: 'video/*,.mp4,.mov,.m4v,.webm', hidden: true });
    inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) gotVideo(f); });
    document.body.append(inp);
    inp.click();
  }
  function gotVideo(file) {
    if (S.view === 'work' && S.game) { attach(file); return; }
    const id = SC.store.findBySrc(file);          // （見本の試合は、findBySrc が外す）
    const g = id ? SC.store.loadGame(id) : null;
    if (!g) { newGameSheet(file); return; }
    const sum = BT.summary(g);
    const s = BT.ui.sheet({
      title: 'この動画で記録した試合があります',
      body: h('div', { class: 'sc-form' },
        h('p', null, `${g.date}　${sum.names[0]} ${sum.score[0]} − ${sum.score[1]} ${sum.names[1]}（${sum.n}件の記録）`),
        h('p', { class: 'note' }, '続きから記録したり、場面・スタッツを見たりできます。')),
      foot: [h('button', { class: 'btn', id: 'scNewAnyway', onclick: () => { s.close(); newGameSheet(file); } }, '新しい試合として記録する'),

  }
  /* 背番号を、タップで入れたり外したりするマス（0・00・1〜30。「31〜99 も出す」で 99 まで。選んでいる 31 以上は、いつも出す）
     get()：いま選んでいる番号の並び / set(list)：変えたあとの番号の並び（番号の順）。draw()：get() を読みなおして描く */

  function noGrid(get, set) {

    const more = h('button', { type: 'button', class: 'linkbtn', id: 'scNoMore', onclick: () => { noMore = !noMore; draw(); } });
    function draw() {
      const on = new Set(get());
      const shown = ['0', '00'].concat(Array.from({ length: noMore ? 99 : 30 }, (_, k) => String(k + 1)));
      on.forEach((no) => { if (!shown.includes(no)) shown.push(no); });
      grid.innerHTML = '';
      BT.sortNos(shown).forEach((no) => grid.append(h('button', { type: 'button', class: 'sc-nb' + (on.has(no) ? ' on' : ''), dataset: { no }, 'aria-pressed': on.has(no) ? 'true' : 'false',
        onclick: () => { const cur = new Set(get()); if (cur.has(no)) cur.delete(no); else cur.add(no); set(BT.sortNos(Array.from(cur))); draw(); } }, no)));
      more.textContent = noMore ? '31〜99 をかくす' : '31〜99 も出す';
    }
    draw();
    return { el: h('div', { class: 'sc-nogridbox' }, grid, more), draw };
  }
  /* 新しい試合：自分のチームの名前と背番号だけ（前の試合のものが入っている）。相手は名前だけ（なくてもよい） */
  function newGameSheet(file) {
    const last = SC.store.team() || { name: '', color: '#2f6fed', colorName: '青', players: [] };

          h('label', { class: 'sc-nostext' }, h('small', null, '文字で入れてもかまいません'), nos)),

  }

  /* ---------- 保存 ---------- */
  function save() {
    const g = S.game;
    if (!g) return;
    g.updatedAt = Date.now();
    if (hasVideo()) g.rvPos = now();
    if (!SC.store.saveGame(g) && !S.saveWarned) {
      S.saveWarned = true;
      BT.ui.toast('このブラウザに記録を保存できませんでした（保存場所がいっぱい・プライベートブラウズ など）。⚙ 設定の「データ」から、ファイルに書き出してください', 'err', 10000);
    }
    emit('change');
  }
  function savePrefs() { SC.store.savePrefs(S.prefs); applyTheme(); emit('prefs'); }
  function applyTheme() {
    const t = S.prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  }

  /* ---------- 画面の切りかえ ---------- */
  function guard() { if (S.guarded || !root.history || !history.pushState) return; history.pushState({ sc: 1 }, ''); S.guarded = true; }
  function goHome() {
    if (S.game) save();
    detach();
    BT.ui.closeSheet(true);
    BT.ui.keepAwake(false);
    S.game = null; S.W = null; S.view = 'home';
    if (S.guarded && root.history) { S.guarded = false; S.skipPop = true; try { history.back(); } catch (e) { S.skipPop = false; } }
    renderHome();
  }
  /* 試合を開く。file があれば、その動画をつなぐ。なければ、スタッツから（動画は、あとで選べる） */
  function openGame(g, file) {
    detach();
    BT.ui.closeSheet(true);
    S.game = g;
    S.view = 'work';
    S.tab = file ? 'tap' : (g.events.some((e) => e.type !== 'period') ? 'stats' : 'tap');
    SC.store.saveGame(g);
    buildWork();
    guard();
    BT.ui.keepAwake(true);
    emit('open');
    if (file) attach(file);
    setTab(S.tab);
  }

      h('span', { class: 'when' }, g.date),

        h('button', { class: 'btn icon', id: 'scHomeSettings', 'aria-label': '設定', onclick: () => openSettings() }, '⚙')),
      h('main', { class: 'home' },
        h('button', { class: 'sc-hero', id: 'scPick', onclick: pickVideo },

          h('span', { class: 'mt' }, h('b', null, '試合の動画を選ぶ'), h('small', null, '選んだら、動画を見ながらタップで記録。場面とスタッツが、そのままできます'))),
        h('ol', { class: 'sc-steps', 'aria-label': '使い方の流れ' },
          h('li', null, h('b', null, '① 記録'), h('span', null, '動画を止めたり戻したりしながら、プレーと背番号をタップ')),
          h('li', null, h('b', null, '② 場面'), h('span', null, '記録した場面が、もう並んでいます。選手ごと・プレーごとに見る・1本の動画にする')),
          h('li', null, h('b', null, '③ スタッツ'), h('span', null, '成功率・選手ごとの数。反省会で、みんなで見られる画面も'))),
        h('div', { id: 'scHomeExtra' }),
        list.length ? h('section', { class: 'card' }, h('h2', null, 'これまでの試合'), h('div', { class: 'sc-games', id: 'scGames' }, list.map(row)),
          h('p', { class: 'note' }, '押すと、スタッツが開きます。場面を見るときは、同じ動画をもう一度選びます（動画の中身は、保存していません）。')) : null,
        h('div', { class: 'row center' }, h('button', { class: 'linkbtn', id: 'scImport', onclick: importFile }, '📂 記録のファイル（.json）を開く')),
        h('p', { class: 'note center' }, '🔒 記録は、この端末のブラウザの中に保存します。動画は、どこにも送りません。')));
    emit('home');
    root.scrollTo(0, 0);
  }
  async function importFile() {
    const f = await BT.ui.pickText();
    if (!f) return;
    try {
      const g = BT.importData(f.text);
      if (!BT.isReview(g)) throw new Error('試合を見ながら記録したファイルです（記録の時刻が、動画の時刻ではありません）。もとの「バスケ タップ記録」で開いてください');
      if (SC.store.loadGame(g.id)) g.id = BT.uid('g');
      openGame(g, null);
      BT.ui.toast('記録のファイルを開きました', 'ok');
    } catch (e) { BT.ui.toast('開けませんでした：' + e.message, 'err', 8000); }
  }

  /* ========== 作業の画面（動画＋タブ） ========== */
  function buildWork() {
    document.body.dataset.view = 'work';
    const V = $('#view');
    V.innerHTML = '';
    const W = S.W = {};
    W.score = h('button', { class: 'sc-score', id: 'scScore', 'aria-label': '得点', onclick: () => setTab('stats') });
    W.period = h('button', { class: 'sc-period', id: 'scPeriod', 'aria-label': 'ピリオド', onclick: openPeriod }, '1Q');
    W.bar = h('header', { class: 'sc-bar' },
      h('button', { class: 'btn icon', id: 'scHome', 'aria-label': 'ホームへ', onclick: goHome }, '🏠'),
      W.score, W.period,
      h('button', { class: 'btn icon', id: 'scSettings', 'aria-label': '設定', onclick: () => openSettings() }, '⚙'));
    W.stage = h('div', { class: 'sc-stage', id: 'scStage' });
    W.fill = h('i', { class: 'fill' });
    W.marks = h('div', { class: 'marks' });
    W.thumb = h('i', { class: 'thumb' });
    W.seek = h('div', { class: 'sc-seek', id: 'scSeek', role: 'slider', tabindex: '0', 'aria-label': '動画の位置（指でなぞって動かす）' }, W.marks, W.fill, W.thumb);
    W.time = h('span', { class: 'sc-time', id: 'scTime' }, '0:00 / 0:00');
    const tb = (id, label, aria, fn, cls) => h('button', { class: 'sc-tb' + (cls ? ' ' + cls : ''), id, 'aria-label': aria, title: aria, onclick: fn }, label);
    W.playBtn = tb('scPlay', '▶', '再生・一時停止', toggle, 'play');
    W.rate = tb('scRate', '×1', '再生の速さ（×1・×0.5・×0.25・×2）', nextRate, 'rate');
    W.ctl = h('div', { class: 'sc-ctl' },
      tb('scBack', '−5', '5秒もどる', () => step(-5)), tb('scPrevF', '◀', '1コマもどる', () => step(-1 / 30), 'fr'),
      W.playBtn,
      tb('scNextF', '▶', '1コマすすむ', () => step(1 / 30), 'fr'), tb('scFwd', '+5', '5秒すすむ', () => step(5)), W.rate, W.time);
    W.video = h('section', { class: 'sc-video', 'aria-label': '動画' }, W.stage, W.seek, W.ctl);
    W.tabs = h('nav', { class: 'sc-tabs', role: 'tablist', 'aria-label': '記録・場面・スタッツ' }, TABS.map(([id, n, label]) =>
      h('button', { class: 'sc-tab', id: 'scTab-' + id, role: 'tab', dataset: { tab: id }, onclick: () => setTab(id) }, h('i', null, n), h('b', null, label), h('small', { class: 'bdg', hidden: true }))));
    W.panes = {};
    W.panel = h('div', { class: 'sc-panel' }, TABS.map(([id]) => (W.panes[id] = h('section', { class: 'sc-pane', id: 'scPane-' + id, role: 'tabpanel', dataset: { pane: id }, hidden: true }))));
    W.side = h('div', { class: 'sc-side' }, W.tabs, W.panel);
    W.root = h('div', { class: 'sc-work', id: 'scWork' }, W.bar, W.video, W.side);
    V.append(W.root);
    seekEvents(W.seek);
    TABS.forEach(([id]) => { const p = panels[id]; if (p && p.mount) { try { p.mount(W.panes[id]); } catch (e) { console.error('[panel mount]', id, e); } } });
    drawWork();
    root.scrollTo(0, 0);
  }
  /* 動画の所・上の帯・タブの数字を、いまの状態に合わせる */
  function drawWork() {
    const W = S.W, g = S.game;
    if (!W || !g) return;
    const sc = BT.score(g);
    W.score.innerHTML = '';
    W.score.append(h('span', { class: 'tn' }, BT.teamName(g, 0)), h('b', null, `${sc[0]} − ${sc[1]}`), h('span', { class: 'tn' }, BT.teamName(g, 1)));
    W.period.textContent = BT.periodLabel(BT.periodAt(g, now()));
    if (!S.media) {
      W.stage.innerHTML = '';
      W.stage.append(h('div', { class: 'sc-novideo', id: 'scNoVideo' },
        h('button', { class: 'btn primary', id: 'scPickHere', onclick: pickVideo }, '🎬 この試合の動画を選ぶ'),
        g.src && g.src.name ? h('p', null, `記録した動画：${g.src.name}${g.src.duration ? `（${fmt(g.src.duration)}）` : ''}`) : null,
        h('p', { class: 'small' }, 'スタッツは、動画がなくても見られます。記録・場面は、同じ動画を選ぶと続きからできます。')));
    } else if (hasVideo()) {
      const l = W.stage.querySelector('.sc-loading');
      if (l) l.remove();
    }
    W.ctl.classList.toggle('off', !hasVideo());
    drawMarks();
    drawTime();
    drawPlay();
    drawBadges();
  }
  function drawBadges() {
    const W = S.W;
    if (!W) return;
    TABS.forEach(([id]) => {
      const el = W.tabs.querySelector(`#scTab-${id} .bdg`);          // （W.root にも data-tab が付くので、id で選ぶ）
      let t = '';
      try { t = panels[id] && panels[id].badge ? panels[id].badge() || '' : ''; } catch (e) { t = ''; }
      el.textContent = t; el.hidden = !t;
    });
  }
  function drawPlay() {
    const W = S.W;
    if (!W) return;
    const playing = hasVideo() && !S.media.paused && !S.media.el.ended;
    W.playBtn.textContent = playing ? '⏸' : '▶';
    W.playBtn.classList.toggle('on', playing);
    const r = S.media ? S.media.rate : 1;
    W.rate.textContent = '×' + r;
    W.rate.classList.toggle('on', r !== 1);
  }
  function drawTime() {
    const W = S.W, g = S.game;
    if (!W || !g) return;
    const t = now(), d = dur();
    W.time.textContent = `${fmt(t)} / ${fmt(d)}`;
    const p = d > 0 ? BT.clamp(t / d, 0, 1) * 100 : 0;
    W.fill.style.width = p + '%';
    W.thumb.style.left = p + '%';
    const per = BT.periodLabel(BT.periodAt(g, t));
    if (W.period.textContent !== per) W.period.textContent = per;
  }
  /* 位置のバーの印：自分の記録（チームの色）・相手の得点（灰色）・ピリオドの始まり（たての線） */
  function drawMarks() {
    const W = S.W, g = S.game;
    if (!W || !g) return;
    const d = dur();
    W.marks.innerHTML = '';
    if (!(d > 0)) return;
    g.events.forEach((e) => {
      if (e.t > d) return;
      const cls = e.type === 'period' ? 'per' : e.team === 1 ? 'opp' : 'me';
      if (e.type === 'period' && e.t <= 0) return;
      W.marks.append(h('i', { class: cls, style: { left: (e.t / d) * 100 + '%' } }));
    });
  }
  function step(d) { if (!hasVideo()) return; stopRange(); if (Math.abs(d) < 1) S.media.pause(); seek(S.media.time + d); }
  function nextRate() { if (!hasVideo()) return; const i = RATES.indexOf(S.media.rate); S.media.rate = RATES[(i + 1) % RATES.length]; drawPlay(); }
  function seekEvents(bar) {
    let drag = false;
    const at = (e) => { const r = bar.getBoundingClientRect(); return BT.clamp((e.clientX - r.left) / Math.max(1, r.width), 0, 1) * dur(); };
    const move = (e) => { if (!drag || !hasVideo()) return; S.media.el.currentTime = at(e); drawTime(); };
    bar.addEventListener('pointerdown', (e) => {
      if (!hasVideo()) return;
      drag = true; stopRange();
      try { bar.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
      move(e);
    });
    bar.addEventListener('pointermove', move);
    const up = () => { if (!drag) return; drag = false; if (S.game) S.game.rvPos = now(); emit('time', now()); };
    bar.addEventListener('pointerup', up);
    bar.addEventListener('pointercancel', up);
    bar.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); step(-5); } else if (e.key === 'ArrowRight') { e.preventDefault(); step(5); } });
  }
  function setTab(id, arg) {
    const W = S.W;
    if (!W || !panels[id]) return;
    const prev = S.tab;
    if (prev !== id && panels[prev] && panels[prev].hide) { try { panels[prev].hide(); } catch (e) { console.error('[panel hide]', prev, e); } }
    S.tab = id;
    TABS.forEach(([k]) => {
      W.panes[k].hidden = k !== id;
      const b = W.tabs.querySelector(`#scTab-${k}`);
      b.classList.toggle('on', k === id);
      b.setAttribute('aria-selected', k === id ? 'true' : 'false');
    });
    W.root.dataset.tab = id;
    if (panels[id].show) { try { panels[id].show(arg); } catch (e) { console.error('[panel show]', id, e); } }
    emit('tab', id);
  }

  /* ---------- ピリオド（動画のいまの時刻から、次のピリオド） ---------- */
  function openPeriod() {
    const g = S.game;
    pause();
    const t = now(), cur = BT.periodAt(g, t);
    const add = (p) => { BT.addEvent(g, { t, type: 'period', period: p }); save(); s.close(); BT.ui.toast(`${BT.periodLabel(p)} を、動画の ${fmt(t)} からにしました`, 'ok'); };
    const starts = BT.sorted(g).filter((e) => e.type === 'period');
    const s = BT.ui.sheet({
      title: `ピリオド（いまは ${BT.periodLabel(cur)}）`,
      body: h('div', { class: 'sc-form' },
        h('button', { class: 'btn primary huge', id: 'scNextPeriod', onclick: () => add(cur + 1) }, `ここから ${BT.periodLabel(cur + 1)}（動画の ${fmt(t)}）`),
        h('p', { class: 'note' }, '動画を、次のピリオドが始まる所まで動かしてから押します。それより後の記録が、そのピリオドになります。'),
        h('div', { class: 'sc-plist' }, starts.map((e) => h('div', { class: 'row' },
          h('button', { class: 'btn small', onclick: () => { s.close(); seek(e.t); } }, `${BT.periodLabel(e.period)}：${fmt(e.t)} から`),
          e.t > 0 ? h('button', { class: 'linkbtn', dataset: { delperiod: e.id }, onclick: () => { BT.removeEvent(g, e.id); save(); openPeriod(); } }, '消す') : null))))
    });
  }

  /* ========== 設定（節は、パネルも足せる） ========== */
  function settings(def) { const i = sections.findIndex((x) => x.id === def.id); if (i >= 0) sections[i] = def; else sections.push(def); }
  function openSettings(focus) {
    pause();
    const body = h('div', { class: 'settings sc-settings' });
    const redraw = () => openSettings(focus);
    sections.slice().sort((a, b) => (a.order || 50) - (b.order || 50)).forEach((sec) => {
      if (sec.when && !sec.when()) return;
      const box = h('section', { class: 'field sc-sec', id: 'scSec-' + sec.id }, h('span', null, sec.title));
      try { sec.render(box, redraw); } catch (e) { console.error('[settings]', sec.id, e); box.append(h('p', { class: 'note warn' }, 'この設定を出せませんでした')); }
      body.append(box);
    });
    const keep = (() => { const b = document.querySelector('#sheet .sheet-body'); return b && document.querySelector('#sheet .sc-settings') ? b.scrollTop : null; })();
    const s = BT.ui.sheet({ title: '設定', wide: true, body });
    if (keep != null) s.body.scrollTop = keep;
    else if (focus) { const el = document.getElementById('scSec-' + focus); if (el && el.scrollIntoView) el.scrollIntoView(); }
  }
  /* 設定の部品（パネルの設定の節でも使える） */
  const ui = {
    /* チェック：obj[key] を切りかえる。after は、切りかえたあと */
    noGrid,
    check(obj, key, label, after) {
      return h('label', { class: 'chk' }, h('input', { type: 'checkbox', dataset: { pref: key }, checked: !!obj[key], onchange: (e) => { obj[key] = e.target.checked; savePrefs(); if (after) after(); } }), label);
    },
    /* えらぶボタンの並び：[[値, 文字], …] */
    choice(cur, list, pick, name) {
      return h('div', { class: 'row', role: 'group' }, list.map(([v, lab]) => h('button', { class: 'btn small' + (cur === v ? ' on' : ''), 'aria-pressed': cur === v ? 'true' : 'false', dataset: { [name || 'choice']: String(v) }, onclick: () => pick(v) }, lab)));
    }
  };
  /* 土台が持つ設定：チーム・背番号／画面の色／データ */
  settings({ id: 'team', title: '👥 チーム・背番号', order: 10, when: () => !!S.game, render(box, redraw) {
    const g = S.game, t = g.teams[0];
    const changed = () => { SC.store.saveTeam(t); save(); drawWork(); emit('team'); };
    const name = h('input', { type: 'text', id: 'setTeamName', maxlength: 20, value: t.name || '', placeholder: '自分のチームの名前', onchange: (e) => { t.name = e.target.value.trim().slice(0, 20); changed(); } });
    /* 背番号：タップで選ぶマス・文字の欄・名前の欄は、いつも同じ名簿を指す。変えたら、その場で書き換える（小窓は閉じない） */
    const namesBox = h('div', { class: 'sc-nameswrap' });

   ・相手：「+1」「+2」「+3」を1回押すだけ（team: 1・no: null・ft / fg2 / fg3）

   ■ 記録の形（BT.addEvent）
     自分のプレー  { t, type: 'fg2'|'fg2x'|'fg3'|'fg3x'|'ft'|'ftx'|'oreb'|'dreb'|'reb'|'ast'|'stl'|'blk'|'tov'|'foul', team: 0, no: '7' | null（？）}

  function locField(g, e, changed) {
    const court = courtNow(g), has = BT.hasLoc(e);
    const svg = BT.shot.court({ court, label: 'コートの図。押した所を、この記録の場所にする', shots: has ? [{ x: e.x, y: e.y, made: !!BT.TYPE[e.type].made, color: g.teams[0].color }] : [],
      onTap: (x, y) => { setLoc(g, e, x, y); changed(); } });
    return h('section', { class: 'tp-esec', id: 'tpEditLoc' },
      h('h4', null, has ? `場所：📍 ${BT.shotZone(e.x, e.y, court).label}（押すと動かせます）` : '場所：まだありません（コートを押すと付けられます）'),
      h('div', { class: 'tp-locrow' }, h('div', { class: 'tp-court tp-loccourt' }, svg),
        has ? h('button', { class: 'btn small', id: 'tpLocClear', onclick: () => { delete e.x; delete e.y; changed(); } }, '場所を消す') : null));
  }
  function del(e) {
    const g = game();
    const i = g.events.indexOf(e);
    BT.removeEvent(g, e.id);
    A.save();
    drawLast();
    BT.ui.closeSheet();
    BT.ui.toast(`消しました：${fmt(e.t)} ${who(g, e)} ${what(e)}`.replace(/\s+/g, ' '), 'ok', 4500, { label: 'もとに戻す', onClick: () => { if (S.game !== g || BT.findEvent(g, e.id)) return; g.events.splice(Math.min(i, g.events.length), 0, e); A.save(); drawLast(); } });
  }

  /* ---------- 背番号を足す（記録の途中で、名簿にない番号が出たとき。設定の「チーム・背番号」と同じマス） ---------- */
  function addNo() {
    const g = game();
    if (!g) return;
    A.stopRange();
    const t = g.teams[0];
    const grid = A.ui.noGrid(() => t.players.map((p) => p.no), (list) => { t.players = BT.playersFromNos(list, t.players); SC.store.saveTeam(t); A.save(); A.emit('team'); });
    const s = BT.ui.sheet({
      title: '背番号を足す',
      body: h('div', { class: 'sc-form' }, grid.el, h('p', { class: 'note' }, '押した番号が、記録のボタンに入ります（もう一度押すと外れます。記録ずみのものは消えません）。')),
      foot: [h('button', { class: 'btn primary', id: 'tpAddDone', onclick: () => s.close() }, '閉じる')]
    });
  }

  /* ---------- 記録の一覧 ---------- */
  function list() {
    const g = game();
    if (!g) return;
    openSheet();
    const rs = records(g).map((e, i) => ({ e, i })).sort((a, b) => (b.e.t - a.e.t) || (b.i - a.i)).map((x) => x.e);
    const lastId = (last(g) || {}).id;
    const row = (e) => h('button', { class: 'tp-lrow' + (e.team === 1 ? ' tp-opp' : e.team == null ? ' tp-free' : '') + (e.id === lastId ? ' tp-new' : ''), dataset: { eid: e.id }, onclick: () => edit(e.id, { back: true }) },
      h('span', { class: 'tp-lt' }, fmt(e.t)), h('span', { class: 'tp-per' }, BT.periodLabel(BT.periodAt(g, e.t))),
      h('span', { class: 'tp-lw' }, h('i', { class: 'tp-dot tp-k-' + e.type, 'aria-hidden': 'true' }), who(g, e) ? h('b', null, who(g, e)) : null, ' ', what(e),
        BT.hasLoc(e) ? h('small', { class: 'tp-zone' }, '📍 ' + BT.shotZone(e.x, e.y, BT.courtOf(g)).label) : null),
      h('span', { class: 'tp-arr', 'aria-hidden': 'true' }, '›'));
    BT.ui.sheet({ title: `記録の一覧（${rs.length}件）`, cls: 'tp-sheet',
      body: h('div', { class: 'tp-list', id: 'tpListSheet' }, rs.length ? [h('p', { class: 'note' }, '動画の時刻の新しい順。押すと直せます。'), rs.map(row)] : h('p', { class: 'note' }, 'まだ記録はありません。プレーと背番号をタップすると、ここに並びます。')) });
  }

  /* ---------- パネル ---------- */
  function build() {
    const el = P.el, g = game();
    if (!el) return;
    if (P.ro) { P.ro.disconnect(); P.ro = null; }
    el.innerHTML = '';
    if (!g) return;
    const rec = S.prefs.rec || {};
    const types = plays(rec);
    const shots = types.filter((t) => BT.TYPE[t].shot), other = types.filter((t) => !BT.TYPE[t].shot);
    const pt = (type) => h('button', { class: 'tp-pt tp-k-' + type + (BT.TYPE[type].made === false ? ' tp-miss' : ''), dataset: { type }, 'aria-label': LAB[type][2], title: LAB[type][2], onclick: () => tapOurs({ type }) }, h('b', null, LAB[type][0]));
    const numBtn = (no, label, aria) => h('button', { class: 'tp-no' + (no == null ? ' tp-unk' : ''), dataset: { no: no == null ? '' : no }, 'aria-label': aria, title: aria, onclick: () => tapOurs({ no }) }, label);
    const roster = nos(g);
    const W = P.W = {};
    W.hint = h('p', { class: 'tp-hint', id: 'tpHint', 'aria-live': 'polite' });
    W.plays = h('div', { class: 'tp-plays', role: 'group', 'aria-label': 'プレー' },
      h('div', { class: 'tp-prow', style: { '--tp-n': shots.length } }, shots.map(pt)),
      other.length ? h('div', { class: 'tp-prow', style: { '--tp-n': other.length } }, other.map(pt)) : null);
    W.nos = h('div', { class: 'tp-nos', role: 'group', 'aria-label': '背番号' },
      roster.map((no) => numBtn(no, no, '#' + no + (BT.playerName(g, 0, no) ? ' ' + BT.playerName(g, 0, no) : ''))),
      numBtn(null, roster.length ? '？' : 'チーム', roster.length ? '番号が分からない（？）' : 'チーム（背番号なし）'));
    W.opp = h('div', { class: 'tp-opprow', id: 'tpOpp', role: 'group', 'aria-label': '相手の得点' },
      h('span', { class: 'tp-opplab' }, h('i', { class: 'chip', style: { background: g.teams[1].color } }), h('span', null, BT.teamName(g, 1), h('span', { class: 'tp-full' }, 'の得点'))),
      [1, 2, 3].map((p) => h('button', { class: 'tp-op', dataset: { opp: p }, 'aria-label': `${BT.teamName(g, 1)}の得点 +${p}`, onclick: () => tapOpp(p) }, '+' + p)));
    W.more = h('div', { class: 'tp-more' },
      rec.mark !== false ? h('button', { class: 'tp-mark', id: 'tpMark', 'aria-label': '★ あとで見る（いまの場面に印）', title: '★ あとで見る', onclick: tapMark }, '★', h('span', { class: 'tp-full' }, ' あとで見る')) : null,
      h('button', { class: 'tp-listbtn', id: 'tpList', 'aria-label': '📋 記録の一覧', title: '記録の一覧', onclick: list }, '📋', h('span', { class: 'tp-full' }, ' 記録の一覧')),
      h('button', { class: 'tp-addno', id: 'tpAddNo', 'aria-label': '背番号を足す', title: '名簿にない背番号を足す', onclick: addNo }, '＋', h('span', { class: 'tp-full' }, ' 番号')));
    W.lastMain = h('button', { class: 'tp-lastmain', id: 'tpLast', 'aria-label': 'いちばん新しい記録（押すと直せます）', onclick: () => { const e = last(game()); if (e) edit(e.id); } });
    W.undo = h('button', { class: 'tp-lb', id: 'tpUndo', 'aria-label': 'いちばん新しい記録を取り消す', onclick: undo }, '↶ 取り消す');
    W.redo = h('button', { class: 'tp-lb', id: 'tpRedo', 'aria-label': '取り消した記録をやり直す', hidden: true, onclick: redo }, '↷');
    W.watch = h('button', { class: 'tp-lb tp-watch', id: 'tpWatch', 'aria-label': 'この場面を見る', onclick: () => watch(last(game())) }, '▶ 見る');
    W.last = h('div', { class: 'tp-last', id: 'tpLastBar' }, W.lastMain, W.redo, W.undo, W.watch);
    W.in = h('div', { class: 'tp-in' }, W.hint, W.plays, W.nos, W.opp, W.more);
    P.root = h('div', { class: 'tp' + (A.hasVideo() ? '' : ' tp-off'), id: 'tpRoot' }, W.in, W.last);
    el.append(P.root);
    drawPick();
    drawLast();
    if (root.ResizeObserver) { P.ro = new ResizeObserver(() => fit()); P.ro.observe(el); }
    fit();
  }
  /* 大きさに合わせる：背番号の列の数・ボタンの文字（狭いときは短く）・ボタンの高さ（余れば大きく）・低い画面では行をまとめる */
  function fit() {
    const W = P.W, el = P.el;
    if (!W || !el || !P.root || !el.clientWidth) return;
    const cs = getComputedStyle(el);
    const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const R = P.root;
    const low = H < 330;
    R.classList.toggle('tp-low', low);
    // 低い画面（スマホの横）：選びかけは、下の帯の中に出す（上の1行ぶんを、ボタンに回す）
    if (low && W.hint.parentNode !== W.last) W.last.prepend(W.hint);
    else if (!low && W.hint.parentNode !== W.in) W.in.prepend(W.hint);
    const gap = H < 330 ? 4 : 6;
    R.style.setProperty('--tp-gap', gap + 'px');
    const n = W.nos.children.length;
    const cols = numCols(n, w, 40, gap);
    W.nos.style.setProperty('--tp-cols', cols);
    // プレーのボタンの文字：入らなければ短く
    W.plays.querySelectorAll('.tp-prow').forEach((row) => {
      const k = row.children.length, bw = (w - (k - 1) * gap) / k;
      Array.from(row.children).forEach((b) => { const L = LAB[b.dataset.type]; const full = BT.textEm(L[0]) * 15 + 10 <= bw; b.firstChild.textContent = full ? L[0] : L[1]; b.classList.toggle('tp-short', !full); });
    });
    // 高さ：40〜56px。まず小さくして測り、余ったぶんをボタンの段に分ける
    const base = H < 330 ? 40 : 44;
    R.style.setProperty('--tp-bh', base + 'px');
    const rows = W.plays.children.length + Math.ceil(n / cols);
    const used = W.in.offsetHeight + W.last.offsetHeight + gap * 2;
    const extra = H - used;
    const bh = extra > 0 ? Math.min(w >= 480 ? 64 : 56, base + Math.floor(extra / (rows + 1))) : base;
    R.style.setProperty('--tp-bh', bh + 'px');
  }
  function drawPick() {
    const W = P.W, g = game();
    if (!W || !g) return;
    const pk = P.pick;
    W.hint.innerHTML = '';
    W.hint.classList.toggle('tp-on', !!pk);
    P.root.classList.toggle('tp-picking', !!pk);
    if (!pk) {
      W.hint.append(h('i', { class: 'chip', style: { background: g.teams[0].color } }), h('b', null, BT.teamName(g, 0)),
        h('span', null, hasNo(g) ? 'プレーと背番号をタップ（どちらが先でも）' : 'プレー → 「チーム」をタップ'));
    } else {
      W.hint.append(h('b', null, pickText(pk)), h('span', null, pk.has === 'type' ? ' → 番号は？' : ' → プレーは？'), h('small', { class: 'tp-ht' }, fmt(pk.t)),
        h('button', { class: 'tp-cancel', id: 'tpCancel', onclick: () => { P.pick = null; resume(); drawPick(); } }, '× やめる'));
    }
    W.plays.classList.toggle('tp-want', !!pk && pk.has === 'no');
    W.nos.classList.toggle('tp-want', !!pk && pk.has === 'type');
    W.plays.querySelectorAll('.tp-pt').forEach((b) => { const on = !!pk && pk.has === 'type' && pk.type === b.dataset.type; b.classList.toggle('tp-sel', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    W.nos.querySelectorAll('.tp-no').forEach((b) => { const on = !!pk && pk.has === 'no' && (pk.no == null ? '' : pk.no) === b.dataset.no; b.classList.toggle('tp-sel', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
  }
  function drawLast() {
    const W = P.W, g = game();
    if (!W || !g) return;
    const e = last(g);
    W.lastMain.innerHTML = '';
    if (e) {
      W.lastMain.append(h('span', { class: 'tp-lt' }, fmt(e.t)),
        h('span', { class: 'tp-lw' }, h('i', { class: 'tp-dot tp-k-' + e.type, 'aria-hidden': 'true' }), who(g, e) ? h('b', null, who(g, e)) : null, ' ', what(e),
          BT.hasLoc(e) ? h('small', { class: 'tp-zone' }, ' 📍 ' + BT.shotZone(e.x, e.y, BT.courtOf(g)).label) : null),
        h('span', { class: 'tp-ed', 'aria-hidden': 'true' }, '✎'));
    } else W.lastMain.append(h('span', { class: 'tp-lw tp-none' }, 'まだ記録はありません'));
    W.lastMain.disabled = !e;
    W.undo.disabled = !e;
    W.watch.disabled = !e;
    W.redo.hidden = !(P.gid === g.id && P.redo.length);
    const on = !!e && P.watching === e.id;
    W.watch.textContent = on ? '■ 止める' : '▶ 見る';
    W.watch.classList.toggle('tp-on', on);
    if (e && P.flash === e.id) { P.flash = null; W.last.classList.remove('tp-flash'); void W.last.offsetWidth; W.last.classList.add('tp-flash'); }
  }

  A.panel('tap', {
    mount(el) { P.el = el; P.pick = null; P.playing = false; P.watching = null; build(); },
    show() { if (P.W) fit(); },
    hide() { if (P.pick) dropPick('ほかのタブを開いたので'); },
    badge() { return ''; }
  });
  A.on('open', () => { P.redo = []; P.gid = S.game ? S.game.id : null; P.pick = null; });
  A.on('change', () => { if (S.game && P.W) drawLast(); });
  const rebuild = () => { if (S.game && P.el) { const pk = P.pick; build(); P.pick = pk; drawPick(); } };
  A.on('prefs', rebuild);
  A.on('team', rebuild);          // 背番号・名前・色を変えた（設定・「＋」）：番号のボタンを作りなおす
  A.on('media', () => { if (P.root) P.root.classList.toggle('tp-off', !A.hasVideo()); });
  A.on('range', (r) => { if (!r && P.watching) { P.watching = null; drawLast(); } });
  A.on('time', (t) => {
    const pk = P.pick;
    if (pk && S.game && Math.abs(t - pk.t) > KEEP) dropPick(`動画が ${KEEP} 秒より大きく動いたので`);
  });

  /* ---------- 設定 ---------- */
  const REC = [
    ['miss', 'シュートの失敗（2P×・3P×・FT×）', '成功率が出ます'],
    ['reb', 'リバウンド', '外れたシュートのボールを取った'],
    ['ast', 'アシスト', '得点につながったパス'],
    ['stl', 'スティール', '相手のボールをうばった'],
    ['blk', 'ブロック', '相手のシュートを止めた'],
    ['tov', 'ターンオーバー', 'パスミス・トラベリングなどで、ボールを失った'],
    ['foul', 'ファウル', 'だれが何回したか'],
    ['mark', '★ あとで見る', 'だれのプレーか決めずに、場面に印だけ']
  ];
  const lbl = (t, s) => h('span', { class: 'tp-sl' }, h('b', null, t), s ? h('small', null, s) : null);
  A.settings({ id: 'rec', title: '① 記録するもの', order: 20, render(box, redraw) {
    const p = S.prefs, rec = p.rec = p.rec || {};
    const grid = h('div', { class: 'tp-set' });
    REC.forEach(([k, t, s]) => {
      grid.append(A.ui.check(rec, k, lbl(t, s), k === 'reb' ? redraw : null));
      if (k === 'reb' && rec.reb !== false) grid.append(h('div', { class: 'tp-sub' }, A.ui.check(rec, 'rebSplit', lbl('Oリバ（攻め）と Dリバ（守り）に分ける', 'オフにすると「リバ」1つ'))));
    });
    box.append(h('p', { class: 'note' }, '自分のチームのボタンです。いらないものを外すと、ボタンが減って押しやすくなります。2P・3P・FT は、いつもあります。'), grid,
      h('div', { class: 'tp-set' },
        A.ui.check(p, 'shotLoc', lbl('シュートの場所も記録する', '2P・3P のあと、コートの図で打った所を1回押します'), redraw),
        p.shotLoc ? h('div', { class: 'tp-sub' }, h('small', { class: 'note' }, 'コート'), A.ui.choice(p.courtType === 'mini' ? 'mini' : 'std', [['std', 'ふつう'], ['mini', 'ミニバス（3P の線なし）']], (v) => { p.courtType = v; A.savePrefs(); redraw(); }, 'courttype')) : null,
        A.ui.check(p, 'autoPause', lbl('タップしたら動画を止める', 'プレーか背番号を押すと止まり、記録すると、また動きます'))));
  } });

  SC.tap = { logic, edit: (id) => edit(id), list, state: () => ({ pick: P.pick ? Object.assign({}, P.pick) : null, redo: P.redo.length, watching: P.watching }) };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sc-scenes.js */
/* バスケ シーン — タブ「② 場面」
   記録した 1 つのプレー ＝ 1 つの場面。記録の時刻は動画の時刻なので、時刻あわせは いらない。
   場面の長さ：[t − 前, t + 後]（前・後は 設定の prefs.win。BS.taplog.winFor）を、動画の長さの中に収める。そこに、場面ごとの手直しを足す。

   ■ 試合に保存するもの（なくてよい。0 に戻ったら消す）
     game.sceneAdj = { [記録の id]: { d0, d1 } }   はじめ・おわりに足す秒（− で前へ・＋ で後ろへ）
     game.sceneOff = { [記録の id]: true }         「続けて再生」「1本の動画」から外した場面

   ■ ほかのタブから使えるもの
     SC.scenes.list(filter)   → 場面の配列（下の scene の形。filter は下の「しぼりこみ」。null は全部）
     SC.scenes.windowOf(ev)   → { t0, t1 }（その記録の場面の、はじめ・おわり。動画の秒）
     SC.app.setTab('scenes', { filter, title, play: 'first' | 'reel' | null, focus: 'e12' })
   しぼりこみ（filter）：{ types: [BT.TYPE の id] | null, nos: ['7', ''（番号なし）] | null, team: 0 | 1 | null }
     team が 0・1 のときは、チームなしの記録（★ など）は入らない。nos を決めたときは、自分のチームの記録だけ。

   DOM なしの部分（SC.scenes.core）は、node のテストからも読める（tests/unit-scenes.cjs）。 */
(function (root) {
  'use strict';
  const BT = root.BT, BS = root.BS;
  const SC = root.SC = root.SC || {};
  const TL = BS.taplog;

  /* ================= 画面を持たない部分 ================= */
  const SCORE = ['fg2', 'fg3', 'ft'], MISS = ['fg2x', 'fg3x', 'ftx'];
  /* しぼりこみのボタン（プレー）。ある記録のものだけを出す */
  const PLAYS = [
    ['all', 'すべて', null, null], ['score', '得点', SCORE, 0], ['shot', 'シュート', SCORE.concat(MISS), 0], ['reb', 'リバウンド', ['reb', 'oreb', 'dreb'], 0],
    ['ast', 'アシスト', ['ast'], 0], ['stl', 'スティール', ['stl'], 0], ['blk', 'ブロック', ['blk'], 0], ['tov', 'ターンオーバー', ['tov'], 0],
    ['foul', 'ファウル', ['foul'], 0], ['pass', 'パスミス', ['pass'], null], ['mark', '★', ['mark'], null], ['opp', '相手の得点', SCORE, 1]
  ].map(([id, label, types, team]) => ({ id, label, types, team }));
  /* 設定の「プレーごとに変える」の並び（まとまりは BS.taplog.TYPES の grp） */
  const WGROUPS = [['score', '得点'], ['miss', 'シュート失敗'], ['reb', 'リバウンド'], ['ast', 'アシスト'], ['stl', 'スティール'], ['blk', 'ブロック'],
    ['tov', 'ターンオーバー'], ['foul', 'ファウル'], ['pass', 'パスミス'], ['mark', '★ あとで見る']];
  const LIM = { lead: 30, lag: 15 };
  const MIN_LEN = 1;
  const r2 = (v) => Math.round(v * 100) / 100;
  const grpOf = (type) => (TL.TYPES[type] || {}).grp || 'mark';
  const isPlay = (e) => !!(e && e.type !== 'period' && TL.TYPES[e.type] && BT.TYPE[e.type]);
  const noKey = (e) => (e.no == null ? '' : String(e.no));

  /* 秒 → 「12秒」「1分24秒」「1時間2分」 */
  function fmtLen(sec) {
    const s = Math.max(0, Math.round(sec || 0));
    if (s < 60) return s + '秒';
    if (s >= 3600) { const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60); return hh + '時間' + (mm ? mm + '分' : ''); }
    const m = Math.floor(s / 60), r = s % 60;
    return m + '分' + (r ? r + '秒' : '');
  }

  /* しぼりこみをそろえる（形の合わないものは「なし」＝全部） */
  function cleanFilter(f) {
    const o = f || {};
    const types = Array.isArray(o.types) && o.types.length ? o.types.filter((t) => TL.TYPES[t]).map(String) : null;
    const nos = Array.isArray(o.nos) && o.nos.length ? o.nos.map((n) => (n == null ? '' : String(n))) : null;
    const team = o.team === 0 || o.team === 1 ? o.team : null;
    return { types: types && types.length ? types : null, nos, team };
  }
  /* その記録が、しぼりこみに入るか */
  function pass(e, f) {
    if (!f) return true;
    if (f.team === 0 || f.team === 1) { if (e.team !== f.team) return false; }      // ★（チームなし）は、team が null のときだけ
    if (f.types && f.types.indexOf(e.type) < 0) return false;
    if (f.nos) { if (e.team !== 0) return false; if (f.nos.indexOf(noKey(e)) < 0) return false; }
    return true;
  }

  /* 1つの記録の場面の時刻。dur：動画の長さ（0 なら分からない＝おわりは切らない） */
  function windowOf(game, prefs, e, dur) {
    const w = TL.winFor(prefs && prefs.win, grpOf(e.type));
    const a = (game && game.sceneAdj && game.sceneAdj[e.id]) || null;
    const d0 = a && isFinite(a.d0) ? +a.d0 : 0, d1 = a && isFinite(a.d1) ? +a.d1 : 0;
    const end = dur > 0 ? dur : Infinity;
    let t0 = BT.clamp(e.t - w.lead + d0, 0, end), t1 = BT.clamp(e.t + w.lag + d1, 0, end);
    if (t1 < t0 + 0.5) { t1 = Math.min(end, t0 + 0.5); if (t1 < t0 + 0.5) t0 = Math.max(0, t1 - 0.5); }
    return { t0: r2(t0), t1: r2(t1), lead: w.lead, lag: w.lag, d0, d1 };
  }
  /* はじめのまま（手直しなし）の時刻 */
  function baseWindow(game, prefs, e, dur) { return windowOf({ sceneAdj: null }, prefs, e, dur); }

  /* 1つの場面：
     { id, t, type, grp, team, no, period, who（「#7 たけし」| ''）, what（「2P成功」・相手は「相手の得点（2点）」）,
       label（書き出しの札：「#7 たけし 2P成功」「ヒガシの得点（2点）」）, sub（「1Q 2:15」）, color,
       t0, t1, len, lead, lag, adj（{ d0, d1 } | null）, on（false なら外した場面） } */
  function scene(game, prefs, e, dur) {
    const d = BT.TYPE[e.type];
    const tm = e.team === 0 || e.team === 1 ? e.team : null;
    const nm = tm != null && e.no != null ? BT.playerName(game, tm, e.no) : '';
    const who = tm != null && e.no != null ? '#' + e.no + (nm ? ' ' + nm : '') : '';
    const oppPts = tm === 1 && d.pts > 0;
    const what = oppPts ? `相手の得点（${d.pts}点）` : d.label;
    const label = oppPts ? `${BT.teamName(game, 1)}の得点（${d.pts}点）` : BT.eventText(game, e);
    const period = BT.periodAt(game, e.t);
    const w = windowOf(game, prefs, e, dur);
    const adj = game.sceneAdj && game.sceneAdj[e.id] ? { d0: w.d0, d1: w.d1 } : null;
    const color = tm === 1 ? (game.teams[1] && game.teams[1].color) || '#d93636' : tm === 0 ? (game.teams[0] && game.teams[0].color) || '#2f6fed' : '#facc15';
    return { id: e.id, t: e.t, type: e.type, grp: grpOf(e.type), team: tm, no: e.no == null ? null : String(e.no), period, who, what, label,
      sub: `${BT.periodLabel(period)} ${BT.fmtTime(e.t)}`, color, t0: w.t0, t1: w.t1, len: r2(w.t1 - w.t0), lead: w.lead, lag: w.lag, adj,
      on: !(game.sceneOff && game.sceneOff[e.id]) };
  }
  /* しぼりこんだ場面（動画の時刻の順） */
  function list(game, prefs, filter, dur) {
    if (!game) return [];
    const f = filter ? cleanFilter(filter) : null;
    return BT.sorted(game).filter((e) => isPlay(e) && pass(e, f)).map((e) => scene(game, prefs, e, dur));
  }
  /* 続けて再生・書き出しの区間（外した場面は入れない。重なる場面は1つにつなぐ：BS.taplog.reel）
     札：つないだときは「#7 2P失敗 → #5 リバウンド」（3つ以上は「… ほか2」） */
  function reelOf(scenes, maxLen) {
    const byId = {};
    (scenes || []).forEach((s) => { byId[s.id] = s; });
    return TL.reel(scenes || [], maxLen || 24).map((seg) => {
      const ms = seg.ids.map((id) => byId[id]).filter(Boolean);
      const label = ms.length <= 1 ? seg.label : ms.length === 2 ? ms[0].label + ' → ' + ms[1].label : `${ms[0].label} ほか${ms.length - 1}`;
      return Object.assign(seg, { label, t0: r2(seg.t0), t1: r2(seg.t1) });
    });
  }
  /* 続けて見たときの長さ（秒） */
  function total(scenes, maxLen) { return r2(reelOf(scenes, maxLen).reduce((s, x) => s + (x.t1 - x.t0), 0)); }

  /* 手直し：場面のはじめ（k = 'd0'）・おわり（'d1'）を、いまの所から delta 秒動かす。0 に戻ったら消す */
  function adjust(game, prefs, id, k, delta, dur) {
    const e = BT.findEvent(game, id);
    if (!e) return false;
    const w = windowOf(game, prefs, e, dur), b = baseWindow(game, prefs, e, dur);
    const end = dur > 0 ? dur : Infinity;
    let v;
    if (k === 'd0') {
      const t0 = w.t0 + delta;
      if (t0 < -1e-6 || t0 > w.t1 - MIN_LEN + 1e-6) return false;
      v = Math.abs(t0 - b.t0) < 0.05 ? 0 : t0 - (e.t - w.lead);       // はじめのままに戻ったら 0
    } else {
      const t1 = w.t1 + delta;
      if (t1 > end + 1e-6 || t1 < w.t0 + MIN_LEN - 1e-6) return false;
      v = Math.abs(t1 - b.t1) < 0.05 ? 0 : t1 - (e.t + w.lag);
    }
    const A = game.sceneAdj = game.sceneAdj || {};
    const cur = Object.assign({ d0: 0, d1: 0 }, A[id]);
    cur[k] = r2(v);
    if (Math.abs(cur.d0) < 0.05 && Math.abs(cur.d1) < 0.05) delete A[id]; else A[id] = { d0: r2(cur.d0), d1: r2(cur.d1) };
    if (!Object.keys(A).length) delete game.sceneAdj;
    return true;
  }
  /* その場面で、はじめ・おわりを動かせるか（{ s0m, s0p, s1m, s1p }） */
  function canAdjust(game, prefs, e, dur) {
    const w = windowOf(game, prefs, e, dur), end = dur > 0 ? dur : Infinity;
    return { s0m: w.t0 - 1 >= -1e-6, s0p: w.t0 + 1 <= w.t1 - MIN_LEN + 1e-6, s1m: w.t1 - 1 >= w.t0 + MIN_LEN - 1e-6, s1p: w.t1 + 1 <= end + 1e-6 };
  }
  function resetAdj(game, id) { if (game.sceneAdj) { delete game.sceneAdj[id]; if (!Object.keys(game.sceneAdj).length) delete game.sceneAdj; } }
  function setOff(game, id, off) {
    if (off) { game.sceneOff = game.sceneOff || {}; game.sceneOff[id] = true; return; }
    if (game.sceneOff) { delete game.sceneOff[id]; if (!Object.keys(game.sceneOff).length) delete game.sceneOff; }
  }

  /* しぼりこみのボタン：プレー（ある記録のものだけ・数は、選んでいる選手の中で）と、選手（#4・#7…・番号なし） */
  const sameSet = (a, b) => (!a && !b) || (!!a && !!b && a.length === b.length && a.every((x) => b.indexOf(x) >= 0));
  function chips(game, f) {
    const ev = game ? game.events.filter(isPlay) : [];
    const cnt = (ff) => ev.filter((e) => pass(e, ff)).length;
    const plays = PLAYS.map((c) => ({ id: c.id, label: c.label, types: c.types, team: c.team,
      exists: c.id === 'all' || cnt({ types: c.types, team: c.team, nos: null }) > 0, n: cnt({ types: c.types, team: c.team, nos: f.nos }),
      on: sameSet(c.types, f.types) && c.team === f.team })).filter((c) => c.exists);
    const ours = ev.filter((e) => e.team === 0);
    const nos = BT.sortNos(Array.from(new Set(ours.filter((e) => e.no != null).map((e) => String(e.no)))));
    const players = [];
    if (nos.length) {
      players.push({ key: 'all', label: '全員', nos: null, n: cnt({ types: f.types, team: f.team, nos: null }), on: !f.nos });
      nos.forEach((no) => players.push({ key: no, label: '#' + no, name: BT.playerName(game, 0, no), nos: [no], n: cnt({ types: f.types, team: f.team, nos: [no] }), on: sameSet(f.nos, [no]) }));
      if (ours.some((e) => e.no == null)) players.push({ key: 'none', label: '番号なし', nos: [''], n: cnt({ types: f.types, team: f.team, nos: [''] }), on: sameSet(f.nos, ['']) });
    }
    return { plays, players };
  }
  /* しぼりこみの呼び名：「#7 の 得点」「相手の得点」「すべて」 */
  function describe(game, f) {
    const c = PLAYS.find((p) => sameSet(p.types, f.types) && p.team === f.team);
    let what = c ? (c.id === 'all' ? '' : c.label) : (f.types || []).map((t) => (BT.TYPE[t] && (BT.TYPE[t].short || BT.TYPE[t].label)) || t).join('・');
    if (!c && f.team === 1) what = '相手の ' + (what || 'プレー');
    const who = f.nos ? f.nos.map((n) => (n === '' ? '番号なし' : '#' + n + (game && BT.playerName(game, 0, n) ? ' ' + BT.playerName(game, 0, n) : ''))).join('・') : '';
    return [who, what].filter(Boolean).join(' の ') || 'すべて';
  }

  const core = { PLAYS, WGROUPS, LIM, fmtLen, cleanFilter, pass, windowOf, baseWindow, scene, list, reelOf, total, adjust, canAdjust, resetAdj, setOff, chips, describe };
  SC.scenes = { core };
  if (!SC.app || typeof document === 'undefined') return;

  /* ================= 画面 ================= */
  const A = SC.app, S = A.S, { h } = BT.ui;
  const ALL = () => ({ types: null, nos: null, team: null });
  const st = { el: null, f: ALL(), title: null, dirty: true, play: null, exp: null, out: null, byOpen: false };
  let E = {};
  let token = 0;
  const visible = () => !!(st.el && S.tab === 'scenes' && S.W);
  const scenesNow = () => list(S.game, S.prefs, st.f, A.dur());
  const toast = BT.ui.toast;

  /* ---------- 描く ---------- */
  function mount(el) {
    st.el = el; E = {};
    stopPlay(false);
    el.innerHTML = '';
    el.classList.add('sn-pane');
    st.dirty = true;
    render();
  }
  function render() {
    const el = st.el, g = S.game;
    if (!el || !g) return;
    st.dirty = false;
    const keep = el.scrollTop;
    el.innerHTML = '';
    E = { rows: new Map() };
    const all = g.events.filter(isPlay);
    if (!all.length) {
      el.append(h('div', { class: 'sn-empty', id: 'snEmpty' },
        h('div', { class: 'sn-empty-ic', 'aria-hidden': 'true' }, '🎞'),
        h('b', null, 'まだ場面はありません'),
        h('p', null, '「① 記録」で、動画を見ながらプレーをタップすると、その場面が ここに並びます。'),
        h('button', { class: 'btn primary', id: 'snGoTap', onclick: () => A.setTab('tap') }, '① 記録へ')));
      return;
    }
    const vid = A.hasVideo();
    const scs = scenesNow();
    const C = chips(g, st.f);
    const wrap = h('div', { class: 'sn-wrap' });
    if (!vid) {
      wrap.append(h('div', { class: 'sn-banner', id: 'snBanner' },
        h('p', null, h('b', null, '🎬 動画を選ぶと、場面を見られます')),
        h('button', { class: 'btn primary', id: 'snPickVideo', onclick: () => A.pickVideo() }, '🎬 動画を選ぶ')));
    }
    if (st.title) {
      wrap.append(h('div', { class: 'sn-fbar', id: 'snFilterBar' },
        h('span', { class: 'sn-ftitle', id: 'snTitle' }, '🔎 ', h('b', null, st.title)),
        h('button', { class: 'btn small', id: 'snClearFilter', onclick: () => { st.f = ALL(); st.title = null; render(); } }, '× しぼりこみを外す')));
    }
    // しぼりこみ（プレー・選手）
    wrap.append(h('div', { class: 'sn-chips', id: 'snPlays', role: 'group', 'aria-label': 'プレーで しぼりこむ' }, C.plays.map((c) =>
      h('button', { class: 'sn-chip' + (c.on ? ' on' : '') + (c.n ? '' : ' zero'), 'aria-pressed': c.on ? 'true' : 'false', dataset: { snplay: c.id },
        onclick: () => { st.f.types = c.types ? c.types.slice() : null; st.f.team = c.team; st.title = null; render(); } }, c.label, h('small', null, String(c.n))))));
    if (C.players.length) {
      wrap.append(h('div', { class: 'sn-chips', id: 'snNos', role: 'group', 'aria-label': '選手で しぼりこむ' }, C.players.map((c) =>
        h('button', { class: 'sn-chip' + (c.on ? ' on' : '') + (c.n ? '' : ' zero'), 'aria-pressed': c.on ? 'true' : 'false', title: c.name || null, dataset: { snno: c.key },
          onclick: () => { st.f.nos = c.nos ? c.nos.slice() : null; st.title = null; render(); } }, c.label, h('small', null, String(c.n))))));
    }
    // 2つの大きなボタン
    const on = scs.filter((s) => s.on);
    const canExp = !!BS.exportSupport();
    E.playAll = h('button', { class: 'btn primary sn-big', id: 'snPlayAll', disabled: !vid || !on.length || !!st.exp, onclick: () => (st.play && st.play.mode === 'reel' ? stopPlay(true) : playReel(reelOf(on, S.prefs.reelMax), 0)) }, '▶ 続けて再生');
    E.expBtn = h('button', { class: 'btn sn-big', id: 'snExport', disabled: !vid || !on.length || !canExp || !!st.exp, onclick: doExport }, '🎬 1本の動画にする');
    wrap.append(h('div', { class: 'sn-actions' }, E.playAll, E.expBtn));
    const why = !vid ? '動画を選ぶと、使えます' : !on.length ? (scs.length ? '入れる場面がありません（全部 外しています）' : '') : !canExp ? 'このブラウザは「1本の動画にする」に対応していません。Chrome・Safari の新しい版で使えます' : '';
    if (why) wrap.append(h('p', { class: 'note sn-why', id: 'snWhy' }, why));
    // 続けて再生のバー・書き出しの箱
    E.reelBar = h('div', { class: 'sn-reelbar', id: 'snReelBar', hidden: true });
    E.exp = h('div', { class: 'sn-exp', id: 'snExpBox', hidden: true });
    wrap.append(E.reelBar, E.exp);
    // まとめ
    const off = scs.length - on.length;
    wrap.append(h('div', { class: 'sn-sum' },
      h('b', { id: 'snSum' }, `${scs.length} 場面・${fmtLen(total(on, S.prefs.reelMax))}`),
      off ? h('span', { class: 'note' }, `（${off} 場面は外しています）`) : null,
      scs.length ? h('span', { class: 'note sn-hint' }, vid ? '押すと、その場面を見られます' : '') : null));
    // 一覧
    const detail = !!S.prefs.sceneDetail;
    E.list = h('div', { class: 'sn-list' + (detail ? ' detail' : '') + (st.exp ? ' busy' : ''), id: 'snList', role: 'list' });
    const frag = document.createDocumentFragment();
    scs.forEach((s) => {
      const row = h('div', { class: 'sn-row' + (s.on ? '' : ' off') + (s.team === 1 ? ' opp' : ''), role: 'listitem', dataset: { id: s.id }, style: { '--tc': s.color } },
        h('button', { class: 'sn-play', 'aria-label': `${s.label}（${s.sub}）を見る`, onclick: () => playOne(s) },
          h('span', { class: 'sn-tm' }, h('b', null, BT.fmtTime(s.t)), h('small', null, BT.periodLabel(s.period))),
          h('span', { class: 'chip', style: { background: s.color }, 'aria-hidden': 'true' }),
          h('span', { class: 'sn-what' }, s.who ? h('b', null, s.who) : null, h('span', null, s.what), s.on ? null : h('em', { class: 'sn-tag' }, '外した')),
          h('span', { class: 'sn-len' }, fmtLen(s.len), s.adj ? h('i', { title: '手直しした場面' }, '✎') : null),
          h('span', { class: 'sn-ic', 'aria-hidden': 'true' }, '▶')),
        detail ? h('button', { class: 'sn-edit', 'aria-label': 'この場面を手直しする', dataset: { snadj: s.id }, onclick: () => openAdj(s.id) }, '✎') : null);
      E.rows.set(s.id, row);
      frag.append(row);
    });
    E.list.append(frag);
    wrap.append(E.list);
    if (!scs.length) {
      wrap.append(h('div', { class: 'sn-none', id: 'snNone' }, h('p', null, 'この しぼりこみ の場面は、ありません。'),
        h('button', { class: 'btn', onclick: () => { st.f = ALL(); st.title = null; render(); } }, 'すべての場面を見る')));
    }
    el.append(wrap);
    el.scrollTop = keep;
    drawPlay();
    drawExp();
  }

  /* 再生中の場面（行の色・続けて再生のバー）だけを描き直す */
  function drawPlay() {
    if (!E.rows) return;
    const P = st.play;
    const ids = P ? P.ids : [];
    E.rows.forEach((row, id) => {
      const onNow = ids.indexOf(id) >= 0;
      if (row.classList.contains('on') !== onNow) {
        row.classList.toggle('on', onNow);
        const ic = row.querySelector('.sn-ic');
        if (ic) ic.textContent = onNow ? '■' : '▶';
      }
    });
    if (E.playAll) {
      const reel = !!(P && P.mode === 'reel');
      E.playAll.textContent = reel ? '■ やめる' : '▶ 続けて再生';
      E.playAll.classList.toggle('stop', reel);
    }
    const bar = E.reelBar;
    if (!bar) return;
    if (!P || P.mode !== 'reel') { bar.hidden = true; bar.innerHTML = ''; return; }
    const seg = P.segs[P.i];
    bar.hidden = false;
    bar.innerHTML = '';
    bar.append(
      h('div', { class: 'sn-rb-t' }, h('b', { id: 'snReelPos' }, `${P.i + 1} / ${P.segs.length}`), h('span', null, seg ? seg.label : '')),
      h('div', { class: 'sn-rb-b' },
        h('button', { class: 'btn small', id: 'snReelPrev', 'aria-label': '前の場面', disabled: P.i <= 0, onclick: () => jumpReel(-1) }, '⏮'),
        h('button', { class: 'btn small', id: 'snReelNext', 'aria-label': '次の場面', disabled: P.i >= P.segs.length - 1, onclick: () => jumpReel(1) }, '⏭'),
        h('button', { class: 'btn small danger', id: 'snReelStop', onclick: () => stopPlay(true) }, '■ やめる')));
  }
  /* いま再生している行が見えるように（タブの中だけを動かす） */
  function follow(id) {
    const pane = st.el, row = E.rows && E.rows.get(id);
    if (!pane || !row || !visible()) return;
    const r = row.getBoundingClientRect(), p = pane.getBoundingClientRect();
    const top = p.top + (E.reelBar && !E.reelBar.hidden ? E.reelBar.offsetHeight + 6 : 0);
    if (r.top < top) pane.scrollTop += r.top - top - 6;
    else if (r.bottom > p.bottom) pane.scrollTop += r.bottom - p.bottom + 6;
  }

  /* ---------- 見る ---------- */
  function needVideo() { toast('動画を選ぶと、場面を見られます', 'warn', 5000, { label: '動画を選ぶ', onClick: () => A.pickVideo() }); }
  function stopPlay(pause) {
    if (!st.play) return;
    st.play = null; token++;
    A.stopRange();
    if (pause) A.pause();
    drawPlay();
  }
  async function playOne(s) {
    if (st.exp) return;
    if (!A.hasVideo()) { needVideo(); return; }
    if (st.play && st.play.mode === 'one' && st.play.ids[0] === s.id) { stopPlay(true); return; }
    const my = ++token;
    st.play = { mode: 'one', ids: [s.id] };
    drawPlay();
    await A.playRange(s.t0, s.t1);
    if (my !== token) return;
    st.play = null;
    drawPlay();
  }
  async function playReel(segs, from) {
    if (st.exp || !segs.length) return;
    if (!A.hasVideo()) { needVideo(); return; }
    const my = ++token;
    const P = st.play = { mode: 'reel', segs, i: from || 0, ids: [] };
    while (st.play === P && P.i < segs.length) {
      const seg = segs[P.i];
      P.ids = seg.ids;
      drawPlay();
      follow(seg.ids[0]);
      const r = await A.playRange(seg.t0, seg.t1);
      if (my !== token) return;
      if (r !== 'end') break;
      P.i++;
    }
    if (my !== token) return;
    const all = P.i >= segs.length;
    st.play = null;
    drawPlay();
    if (all && segs.length > 1) toast('最後まで見ました', 'ok');
  }
  function jumpReel(d) {
    const P = st.play;
    if (!P || P.mode !== 'reel') return;
    const i = BT.clamp(P.i + d, 0, P.segs.length - 1);
    playReel(P.segs, i);
  }

  /* ---------- 1本の動画にする ---------- */
  function expName() { return BT.safeName(st.title || describe(S.game, st.f)).replace(/#/g, '') || 'すべて'; }
  async function doExport() {
    const g = S.game, m = S.media;
    if (st.exp || !g || !A.hasVideo()) return;
    const segs = reelOf(scenesNow().filter((s) => s.on), S.prefs.reelMax);
    if (!segs.length) { toast('動画にする場面がありません', 'warn'); return; }
    stopPlay(true);
    const clips = segs.map((s) => ({ t0: s.t0, t1: s.t1, label: s.label, sub: s.sub, color: s.color }));
    const secs = clips.reduce((a, c) => a + c.t1 - c.t0, 0) + (S.prefs.cards !== false ? 4.7 : 0);
    const ctrl = new AbortController();
    if (st.out) { try { URL.revokeObjectURL(st.out.url); } catch (e) { /* 無視 */ } st.out = null; }
    const what = st.title || describe(g, st.f), vs = `${BT.teamName(g, 0)} vs ${BT.teamName(g, 1)}`;
    const n = segs.reduce((a, s) => a + s.ids.length, 0);
    st.exp = { ctrl, frac: 0, label: 'はじめの画面', secs };
    render();
    const app = BS.APP;
    BS.APP = SC.APP || app;      // 終わりの画面の下に出るアプリの名前
    try {
      const res = await BS.exportReel(m, clips, {
        title: [what, vs, `${n} 場面`], end: [`${what} ${n} 場面`, vs], accent: (g.teams[0] && g.teams[0].color) || '#2f6fed',
        captions: S.prefs.captions !== false, cards: S.prefs.cards !== false
      }, (frac, label) => { if (st.exp) { st.exp.frac = frac; st.exp.label = label; drawExpProgress(); } }, ctrl.signal);
      if (S.game !== g) return;
      if (res) {
        res.name = `${BT.fileBase(g)}_${expName()}_${n}場面.${res.ext}`;
        st.out = res;
        toast('動画ができました。「⬇ 保存する」で保存できます', 'ok', 5000);
      } else toast('動画づくりを やめました', 'warn');
    } catch (err) {
      console.warn('[scenes export]', err);
      toast('動画を作れませんでした：' + ((err && err.message) || err), 'err', 8000);
    } finally {
      BS.APP = app;
      if (S.game === g) { st.exp = null; render(); }
    }
  }
  function drawExpProgress() {
    const X = st.exp;
    if (!X || !E.exp) return;
    const bar = E.exp.querySelector('#snExpBar'), lab = E.exp.querySelector('#snExpLabel');
    if (bar) bar.style.width = (X.frac * 100).toFixed(1) + '%';
    if (lab) lab.textContent = `${X.label}（${Math.round(X.frac * 100)}%）`;
  }
  function drawExp() {
    const box = E.exp;
    if (!box) return;
    box.innerHTML = '';
    if (st.exp) {
      box.hidden = false;
      box.append(
        h('div', { class: 'sn-exp-h' }, h('b', null, '🎬 動画を作っています'), h('span', { id: 'snExpLabel', class: 'note' }, '')),
        h('div', { class: 'sn-prog', role: 'progressbar', 'aria-label': '動画づくりの進み' }, h('i', { id: 'snExpBar' })),
        h('p', { class: 'note' }, `動画を再生しながら作るので、できる動画と同じくらい（約 ${fmtLen(st.exp.secs)}）かかります。このまま お待ちください。`),
        h('div', { class: 'row' }, h('button', { class: 'btn', id: 'snExpCancel', onclick: () => st.exp && st.exp.ctrl.abort() }, 'やめる')));
      drawExpProgress();
      return;
    }
    if (st.out) {
      const r = st.out;
      box.hidden = false;
      box.append(
        h('div', { class: 'sn-exp-h' }, h('b', null, '✅ 動画ができました'), h('span', { class: 'note' }, `${fmtLen(r.seconds)}・${(r.blob.size / 1048576).toFixed(1)} MB`)),
        h('div', { class: 'row' },
          h('button', { class: 'btn primary', id: 'snExpSave', onclick: saveOut }, '⬇ 保存する'),
          h('button', { class: 'btn', id: 'snExpClose', onclick: () => { try { URL.revokeObjectURL(r.url); } catch (e) { /* 無視 */ } st.out = null; drawExp(); } }, '閉じる')),
        h('p', { class: 'note' }, r.ext === 'webm' ? 'WebM の形です。iPhone で見るときは、MP4 に変えることが あります。' : 'MP4 の形です。スマホ・LINE でも見られます。'));
      return;
    }
    box.hidden = true;
  }
  async function saveOut() {
    const r = st.out;
    if (!r) return;
    const res = await BT.ui.shareOrDownload(r.name, r.blob, BT.ui.canShareFiles());
    if (res === 'downloaded') toast(`保存しました：${r.name}`, 'ok', 4000);
  }

  /* ---------- 場面の手直し（設定で「✎」を出したときだけ） ---------- */
  function openAdj(id) {
    const g = S.game;
    if (!g || !BT.findEvent(g, id)) return;
    const body = h('div', { class: 'sn-adj', id: 'snAdj' });
    const s = BT.ui.sheet({ title: '場面の手直し', body, cls: 'sn-adj-sheet' });
    const changed = () => { A.save(); draw(); };
    const draw = () => {
      const e = BT.findEvent(g, id);
      if (!e || S.game !== g) { s.close(); return; }
      const d = A.dur(), sc = scene(g, S.prefs, e, d), b = baseWindow(g, S.prefs, e, d), can = canAdjust(g, S.prefs, e, d);
      const step = (bid, label, k, delta, ok) => h('button', { class: 'btn', id: bid, disabled: !ok, onclick: () => { if (adjust(g, S.prefs, id, k, delta, d)) changed(); } }, label);
      body.innerHTML = '';
      body.append(
        h('p', { class: 'sn-adj-what' }, h('span', { class: 'chip', style: { background: sc.color } }), h('b', null, sc.label), h('small', { class: 'note' }, `${BT.periodLabel(sc.period)}・記録 ${BT.fmtTime(sc.t)}`)),
        h('div', { class: 'sn-adj-grid' },
          h('span', { class: 'k' }, 'はじめ'), step('snS0m', '◀ 1秒前', 'd0', -1, can.s0m), h('b', { class: 'v', id: 'snAdjT0' }, BT.fmtTime(sc.t0)), step('snS0p', '1秒後 ▶', 'd0', 1, can.s0p),
          h('span', { class: 'k' }, 'おわり'), step('snS1m', '◀ 1秒前', 'd1', -1, can.s1m), h('b', { class: 'v', id: 'snAdjT1' }, BT.fmtTime(sc.t1)), step('snS1p', '1秒後 ▶', 'd1', 1, can.s1p)),
        h('p', { class: 'sn-adj-len' }, '長さ ', h('b', { id: 'snAdjLen' }, fmtLen(sc.len)), sc.adj ? h('span', { class: 'note' }, `（はじめは ${fmtLen(b.t1 - b.t0)}）`) : null,
          sc.on ? null : h('span', { class: 'sn-tag' }, '外しています')),
        h('div', { class: 'row sn-adj-btns' },
          h('button', { class: 'btn primary', id: 'snAdjPlay', onclick: () => playOne(scene(g, S.prefs, e, A.dur())) }, '▶ 見る'),
          h('button', { class: 'btn', id: 'snAdjReset', disabled: !sc.adj, onclick: () => { resetAdj(g, id); changed(); } }, 'はじめに戻す'),
          h('button', { class: 'btn', id: 'snAdjOff', onclick: () => { setOff(g, id, sc.on); changed(); } }, sc.on ? 'この場面を外す' : 'この場面を入れる'),
          SC.tap && typeof SC.tap.edit === 'function' ? h('button', { class: 'btn', id: 'snAdjEdit', onclick: () => { s.close(); SC.tap.edit(id); } }, '記録を直す') : null),
        h('p', { class: 'note' }, '外した場面は、「続けて再生」と「1本の動画」に入りません（一覧には残ります）。'));
    };
    draw();
  }

  /* ---------- 設定：場面の長さ・動画 ---------- */
  function renderSettings(box, redraw) {
    const p = S.prefs;
    p.win = p.win || { lead: 10, lag: 2, by: {} };
    p.win.by = p.win.by || {};
    const outs = [];
    const val = (grp, k) => (grp ? TL.winFor(p.win, grp)[k] : +p.win[k]);
    const set = (grp, k, v) => {
      if (grp) { const cur = TL.winFor(p.win, grp); p.win.by[grp] = { lead: cur.lead, lag: cur.lag }; p.win.by[grp][k] = v; } else p.win[k] = v;
      A.savePrefs();
      outs.forEach((f) => f());
    };
    const stepper = (grp, k) => {
      const id = `snWin-${grp || 'base'}-${k}`;
      const out = h('output', { class: 'sn-sv', id: id + '-v' });
      const minus = h('button', { class: 'btn sn-sb', 'aria-label': (k === 'lead' ? '前' : '後') + 'を 1秒 みじかく', dataset: { d: '-1' }, onclick: () => set(grp, k, Math.max(0, val(grp, k) - 1)) }, '−');
      const plus = h('button', { class: 'btn sn-sb', 'aria-label': (k === 'lead' ? '前' : '後') + 'を 1秒 長く', dataset: { d: '1' }, onclick: () => set(grp, k, Math.min(LIM[k], val(grp, k) + 1)) }, '＋');
      const draw = () => { const v = val(grp, k); out.textContent = v + '秒'; minus.disabled = v <= 0; plus.disabled = v >= LIM[k]; };
      outs.push(draw); draw();
      return h('span', { class: 'sn-step', id }, h('small', null, k === 'lead' ? '前' : '後'), minus, out, plus);
    };
    const by = h('details', { class: 'sn-by', id: 'snWinBy', open: st.byOpen, ontoggle: (e) => { st.byOpen = e.target.open; } },
      h('summary', null, 'プレーごとに変える'),
      h('div', { class: 'sn-bylist' }, WGROUPS.map(([grp, label]) => h('div', { class: 'sn-win', dataset: { grp } }, h('b', null, label), stepper(grp, 'lead'), stepper(grp, 'lag')))));
    box.append(
      h('p', { class: 'note' }, '1つの場面は、記録した所（タップした時刻）の 前 と 後 です。'),
      h('div', { class: 'sn-win base' }, h('b', null, 'ふつうの場面'), stepper(null, 'lead'), stepper(null, 'lag')),
      by,
      h('div', { class: 'row' }, h('button', { class: 'btn small', id: 'snWinReset', onclick: () => { p.win = JSON.parse(JSON.stringify(SC.store.DEFAULTS.win)); A.savePrefs(); redraw(); } }, 'はじめの長さに戻す')),
      A.ui.check(p, 'captions', '動画に、だれの・何のプレーかの札を入れる'),
      A.ui.check(p, 'cards', 'はじめと終わりの札を入れる'),
      A.ui.check(p, 'sceneDetail', '場面ごとの細かい手直し（✎）を出す'));
  }

  /* ---------- 土台とのやりとり ---------- */
  function show(arg) {
    const a = arg || null;
    if (a && a.filter) { st.f = cleanFilter(a.filter); st.title = a.title || describe(S.game, st.f); }
    else if (a && a.title) st.title = a.title;
    if (a && a.focus && S.game && !list(S.game, S.prefs, st.f, A.dur()).some((s) => s.id === a.focus)) { st.f = ALL(); st.title = null; }
    if (a || st.dirty) render();
    if (!a) return;
    if (a.focus && E.rows) {
      const row = E.rows.get(a.focus);
      if (row) {
        row.classList.add('focus');
        setTimeout(() => row.classList.remove('focus'), 2600);
        requestAnimationFrame(() => { const p = st.el.getBoundingClientRect(), r = row.getBoundingClientRect(); st.el.scrollTop += r.top - p.top - Math.max(0, (p.height - r.height) / 2); });
      }
    }
    if (a.play === 'first') { const s = scenesNow()[0]; if (s) playOne(s); }
    else if (a.play === 'reel') { const on = scenesNow().filter((s) => s.on); if (on.length) playReel(reelOf(on, S.prefs.reelMax), 0); }
  }
  function hide() { if (st.play) stopPlay(true); }
  function badge() { const g = S.game; const n = g ? g.events.filter(isPlay).length : 0; return n ? String(n) : ''; }
  const refresh = () => { st.dirty = true; if (visible()) render(); };

  A.panel('scenes', { mount, show, hide, badge });
  A.settings({ id: 'scenes', title: '② 場面の長さ・動画', order: 30, render: renderSettings });
  A.on('change', () => { if (S.game) refresh(); });
  A.on('prefs', () => { if (S.game) refresh(); });
  A.on('media', () => { if (S.game) refresh(); });
  A.on('open', () => {
    token++; st.play = null; st.f = ALL(); st.title = null;
    if (st.exp) { st.exp.ctrl.abort(); st.exp = null; }
    if (st.out) { try { URL.revokeObjectURL(st.out.url); } catch (e) { /* 無視 */ } st.out = null; }
    st.dirty = true;
  });
  A.on('home', () => { token++; st.play = null; if (st.exp) st.exp.ctrl.abort(); });

  SC.scenes = {
    core,
    /* しぼりこんだ場面（filter：{ types, nos, team }。null は全部） */
    list: (filter) => list(S.game, S.prefs, filter || null, A.dur()),
    /* その記録の場面の { t0, t1 } */
    windowOf: (ev) => { const e = ev && typeof ev === 'object' ? ev : S.game && BT.findEvent(S.game, ev); if (!e || !S.game) return null; const w = windowOf(S.game, S.prefs, e, A.dur()); return { t0: w.t0, t1: w.t1 }; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/sc-stats.js */
/* バスケ シーン — ③ スタッツ（コーチがスマホで見る数字）・📺 反省会の画面（みんなで見る）・🖼 画像で保存（チームのグループに送る）
   考え方：数字は、自分のチームのもの。相手は得点だけ。数字を押すと、その場面（② 場面）が続けて再生される。
   記録のないもの（行・列・タイル）は出さない。0 ばかりの行・NaN は出さない。

   ■ SC.stats
     画面を持たない部分（node のテストからも使える：tests/unit-stats.cjs）
       model(game)                 数字のまとめ { names, score, periods, withA, split, rows, unknown, total, cols, tiles, idle, empty, … }
       highlights(m)               「よかったところ」：得点・リバウンド・アシスト・スティールの多い 3人（同じ数は全員）
       cellOf(col, s, withA)       表の1マス → { text, n（並べかえの値）, zero }
       jumpArg(types, nos, team, title)   場面へ行くときの setTab('scenes', …) の arg
       cellJump(m, row, col) / rowJump(m, row) / tileJump(m, tile) / hlJump(m, hl, item)
       fitText(text, maxW, measure) / colWidths(want, avail, flexIdx, flexMax) / imageTable(m) / layoutImage(m, measure)
     画面（ブラウザだけ）
       openReport() / closeReport() / reportOpen()   反省会の画面
       image() → Promise<Blob>（PNG・幅 1600 px）/ saveImage() / csv() → 文字（BOM 付き）/ saveCSV()
   ■ 場面へ：SC.app.setTab('scenes', { filter: { types, nos, team }, title, play: 'reel' })
     types：BT.TYPE の id の配列（null は全部）/ nos：背番号の文字列の配列（'' は番号なし。null は全員）/ team：0 自分・1 相手 */
(function (root) {
  'use strict';
  const BT = root.BT;
  const SC = root.SC = root.SC || {};
  const ST = SC.stats = SC.stats || {};

  /* ========== 数字のまとめ（画面を持たない） ========== */
  const FG = ['fg2', 'fg2x', 'fg3', 'fg3x'];
  /* 表の列。short：表の見出し（せまい所）・label：場面の名前・タイル / shot：[成功, 本数] / pct：成功率 / sum：値 */
  const COLS = [
    { k: 'pts', short: '得点', label: '得点', types: ['fg2', 'fg3', 'ft'], sum: (s) => s.pts },
    { k: 'fg2', short: '2P', label: '2P', types: ['fg2', 'fg2x'], shot: ['fg2m', 'fg2a'] },
    { k: 'fg3', short: '3P', label: '3P', types: ['fg3', 'fg3x'], shot: ['fg3m', 'fg3a'] },
    { k: 'ft', short: 'FT', label: 'フリースロー', types: ['ft', 'ftx'], shot: ['ftm', 'fta'] },
    { k: 'fg', short: 'FG%', label: 'シュート', types: FG, pct: true },
    { k: 'reb', short: 'リバ', label: 'リバウンド', types: ['reb', 'oreb', 'dreb'], sum: (s) => s.reb },
    { k: 'oreb', short: 'Oリバ', label: 'オフェンスリバウンド', types: ['oreb'], sum: (s) => s.oreb, split: true },
    { k: 'dreb', short: 'Dリバ', label: 'ディフェンスリバウンド', types: ['dreb'], sum: (s) => s.dreb, split: true },
    { k: 'ast', short: 'アシスト', label: 'アシスト', types: ['ast'], sum: (s) => s.ast },
    { k: 'stl', short: 'スティール', label: 'スティール', types: ['stl'], sum: (s) => s.stl },
    { k: 'blk', short: 'ブロック', label: 'ブロック', types: ['blk'], sum: (s) => s.blk },
    { k: 'to', short: 'TO', label: 'ターンオーバー', types: ['tov', 'pass'], sum: (s) => s.to },
    { k: 'foul', short: 'ファウル', label: 'ファウル', types: ['foul'], sum: (s) => s.foul }
  ];
  ST.COLS = COLS;
  const COL = {};
  COLS.forEach((c) => { COL[c.k] = c; });
  /* 反省会の表：ふだん出す列（ほかは「くわしく」） */
  ST.REPORT_COLS = ['pts', 'shot', 'reb', 'ast', 'to'];
  /* 反省会の「シュート」（2P＋3P） */
  const SHOT = { k: 'shot', short: 'シュート', label: 'シュート', types: FG, shot: ['fgm', 'fga'] };
  COL.shot = SHOT;

  const DATA_KEYS = ['pts', 'fg2a', 'fg3a', 'fta', 'reb', 'ast', 'stl', 'blk', 'tov', 'pass', 'foul'];
  const hasData = (s) => DATA_KEYS.some((k) => s[k] > 0);
  /* BT.stats の1人分に、ターンオーバー（tov ＋ チームの付いたパスミス）と、2P＋3P（fgm・fga）を足したもの */
  function plus(s) { const o = Object.assign({}, s); o.to = (s.tov || 0) + (s.pass || 0); o.fgm = s.fg2m + s.fg3m; o.fga = s.fg2a + s.fg3a; return o; }
  const pctText = (m, a) => (a > 0 ? Math.round(100 * m / a) + '%' : '—');
  ST.pctText = pctText;

  /* 1マス：成功/本数（失敗の記録があるとき）・入った本数（ないとき）・成功率・数 */
  function cellOf(col, s, withA) {
    if (col.shot) {
      const m = s[col.shot[0]] || 0, a = s[col.shot[1]] || 0;
      return { text: withA ? `${m}/${a}` : String(m), n: m + a / 1000, zero: a === 0 };
    }
    if (col.pct) {
      const m = s.fgm != null ? s.fgm : s.fg2m + s.fg3m, a = s.fga != null ? s.fga : s.fg2a + s.fg3a;
      return { text: pctText(m, a), n: a > 0 ? m / a + a / 1e6 : -1, zero: a === 0 };
    }
    const v = col.sum(s) || 0;
    return { text: String(v), n: v, zero: v === 0 };
  }
  ST.cellOf = cellOf;

  /* その列を出すか（合計に記録があるか）。得点はいつも */
  function colHas(c, t, withA, split) {
    if (c.k === 'pts') return true;
    if (c.split) return split && t.reb > 0;
    if (c.shot) return t[c.shot[1]] > 0;
    if (c.pct) return withA && t.fg2a + t.fg3a > 0;
    return c.sum(t) > 0;
  }

  function model(game) {
    const st = BT.stats(game)[0];
    const withA = BT.hasMisses(game), split = BT.hasRebSplit(game);
    const per = BT.periodScores(game);
    const rows = st.rows.filter((r) => hasData(r.s)).map((r) => ({ kind: 'p', no: r.no, name: r.name || '', s: plus(r.s) }));
    const unknown = hasData(st.unknown) ? { kind: 'u', no: '', name: '', s: plus(st.unknown) } : null;
    const total = { kind: 't', no: null, name: '', s: plus(st.total) };
    const t = total.s;
    const cols = COLS.filter((c) => colHas(c, t, withA, split));
    const tiles = [];
    const tile = (id, label, value, sub, types, more) => tiles.push(Object.assign({ id, label, value, sub: sub || '', types }, more || {}));
    if (withA) {
      if (t.fga > 0) tile('fg', 'シュート成功率', pctText(t.fgm, t.fga), `${t.fgm}/${t.fga}`, FG);
      [['fg2', '2P'], ['fg3', '3P'], ['ft', 'フリースロー']].forEach(([k, lab]) => {
        const c = COL[k], m = t[c.shot[0]], a = t[c.shot[1]];
        if (a > 0) tile(k, lab, pctText(m, a), `${m}/${a}`, c.types);
      });
      if (t.fga > 0 && t.fg3a > 0) tile('efg', 'eFG%', pctText(t.fg2m + 1.5 * t.fg3m, t.fga), '3P を 1.5 本に', FG, { tabOnly: true });
    } else {
      [['fg2', '2P'], ['fg3', '3P'], ['ft', 'フリースロー']].forEach(([k, lab]) => {
        const c = COL[k], m = t[c.shot[0]];
        if (m > 0) tile(k, lab, `${m}本`, '入った本数', [k]);
      });
    }
    if (t.reb > 0) tile('reb', 'リバウンド', String(t.reb), split ? `Oリバ ${t.oreb}・Dリバ ${t.dreb}` : '', COL.reb.types);
    ['ast', 'stl', 'blk', 'to', 'foul'].forEach((k) => { const c = COL[k]; if (c.sum(t) > 0) tile(k, c.label, String(c.sum(t)), k === 'to' ? 'パスミスも入れて' : '', c.types); });
    const score = BT.score(game);
    return {
      date: game.date || '', names: [BT.teamName(game, 0), BT.teamName(game, 1)], colors: [(game.teams[0] || {}).color || '#2f6fed', (game.teams[1] || {}).color || '#d93636'],
      score, periods: per.length > 1 ? per : [], withA, split, rows, unknown, total, cols, tiles,
      idle: st.rows.filter((r) => !hasData(r.s)).map((r) => r.no),
      empty: !rows.length && !unknown, located: BT.hasShotLoc(game) ? BT.shotStats(game, { team: 0 }).located : 0
    };
  }
  ST.model = model;

  /* 並べかえ：k の列の値の大きい順（dir 1 は小さい順）。同じなら背番号の順。'no' は背番号の順 */
  ST.sortRows = function (m, k, dir) {
    const d = dir || -1;
    if (k === 'no') return m.rows.slice().sort((a, b) => d * BT.cmpNo(a.no, b.no));
    const c = COL[k] || COL.pts;
    const n = (r) => cellOf(c, r.s, m.withA).n;
    return m.rows.slice().sort((a, b) => (d < 0 ? n(b) - n(a) : n(a) - n(b)) || BT.cmpNo(a.no, b.no));
  };

  /* よかったところ：多い 3人（3人目と同じ数の人も、みんな入れる）。だれも記録がなければ出さない */
  const HL = [['pts', '得点', '点'], ['reb', 'リバウンド', ''], ['ast', 'アシスト', ''], ['stl', 'スティール', '']];
  function top3(rows, k) {
    const pos = rows.map((r) => ({ no: r.no, name: r.name, v: r.s[k] || 0 })).filter((x) => x.v > 0).sort((a, b) => (b.v - a.v) || BT.cmpNo(a.no, b.no));
    if (!pos.length) return [];
    const thr = pos[Math.min(2, pos.length - 1)].v;
    return pos.filter((x) => x.v >= thr).map((x) => Object.assign(x, { rank: 1 + pos.filter((y) => y.v > x.v).length }));
  }
  ST.top3 = top3;
  ST.highlights = function (m) {
    return HL.map(([k, label, unit]) => ({ k, label, unit, types: COL[k].types, items: top3(m.rows, k) })).filter((x) => x.items.length);
  };

  /* ---------- 場面へ ---------- */
  const jumpArg = (types, nos, team, title) => ({ filter: { types: types ? types.slice() : null, nos: nos ? nos.slice() : null, team: team === 0 || team === 1 ? team : null }, title, play: 'reel' });
  ST.jumpArg = jumpArg;
  const whoOf = (m, row) => (row.kind === 'p' ? `#${row.no}${row.name ? ' ' + row.name : ''}` : row.kind === 'u' ? '番号なし' : m.names[0]);
